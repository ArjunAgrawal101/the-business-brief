# Runs the full QA suite on every push and pull request.
name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    # The full QA took about 25 minutes on two workers in 2.2 (1,092 browser tests). Release 3.0 has 1,694, and its
    # first runs reached the 40-minute limit before the browser tests could finish; 75 leaves room to grow.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa
      - run: npm run qa:contrast
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

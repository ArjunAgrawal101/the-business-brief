# The business plan outline builder. The business plan is one of the guide's
# toolkit tools, suggested for all five units and taught at AO2 and AO4
# (guide, pp. 13 to 14). The guide does not prescribe a plan's contents: the
# twelve sections and their prompts are the platform's own, written after
# checking the coursebook's toolkit pages on business plans (Hodder, pp. 45 to
# 46) for coverage; nothing is reproduced from them.
title: Business plan outline builder
kind: plan
order: 6
question: Could a sceptical lender follow the whole business on paper?
summary: Twelve sections with prompts, figures pulled from your other Lab tools, progress as you write, and export as Markdown or a printed outline.
lead: >
  A business plan makes every part of an idea answer to every other part: the price to the costs, the costs to the
  funding, the funding to the forecasts, and the forecasts to the evidence. Write the outline section by section,
  bring in the figures from the other Lab tools, and export it to share, print or keep working on.
briefing: scaling-failure-and-exit
ib:
  status: ib-toolkit
  statement: >
    The business plan is one of the guide's toolkit tools, suggested for all five units and to be taught at AO2 and
    AO4 (guide, pp. 13 to 14). The guide does not say what a business plan must contain, so the twelve sections and
    their prompts are the platform's own. Each section names the IB subtopics it draws on.
  links:
    - { code: '1.1', note: 'Starting up a business: the plan tests the idea before money is committed' }
    - { code: '1.2', note: 'The legal form decides who owns the business and who carries the risk' }
    - { code: '3.2', note: 'The funding section sets out the sources of finance and why they suit the situation' }
    - { code: '4.5', note: 'The marketing plan is the seven Ps for this customer' }
steps:
  - Give the plan a title, then work through the sections in any order. The executive summary comes first in the plan, but is easiest to write last.
  - Use the prompts as questions to answer, not headings to fill. A section counts as drafted once it reaches its suggested length, and the progress bar shows how far you have got.
  - Bring in the figures from your other Lab tools. They appear under the sections they belong to, quoted from your own saved results.
  - Export the outline as Markdown to keep editing it elsewhere, copy it, or print it.
cautions:
  - A plan is only as good as the evidence behind it. Banks and investors read the assumptions more closely than the conclusions, so say which figures are measured and which are estimates.
  - Founders' forecasts are usually optimistic. Show a cautious case beside the expected one.
  - A plan is a working document. Revise it as tests come back, and expect the second version to be better than the first.
example:
  name: Your own venture
  summary: >
    The outline starts empty, because it is for your own idea. The figures panel quotes whatever you have saved in
    the other Lab tools; if you have only explored Refill Round's example figures, the panel quotes those, which are
    fictional and simulated.
definitions:
  - { term: Business plan, text: 'A document that explains what a new business or project will do, for whom, how it will operate and what it will cost and earn. One of the guide''s toolkit tools.' }
  - { term: Executive summary, text: 'The first page of a plan: the whole case in brief, for a reader who may read nothing else.' }
  - { term: Milestone, text: 'A dated, measurable point of progress, such as the first hundred paying customers.' }
  - { term: Contingency plan, text: 'What the business will do if a specific risk happens.' }
sections:
  - id: summary
    title: Executive summary
    words: 120
    ib: ['1.1']
    tools: []
    prompts:
      - What does the business do, for whom, and why now?
      - How is it different from what customers use today?
      - What has been shown so far, in customers, sales, pilots or partners?
      - How much money is needed, what will it pay for, and what will it achieve?
  - id: founders
    title: The founders and the team
    words: 80
    ib: ['1.1']
    tools: [feasibility]
    prompts:
      - Who are the founders, and what skills, experience and contacts does each bring?
      - Which skills are missing, and how will you get them, through hiring, advisers or partners?
      - How much time and money is each founder committing?
  - id: opportunity
    title: The problem and the opportunity
    words: 120
    ib: ['1.1', '4.4']
    tools: [feasibility]
    prompts:
      - What problem do customers have, and how do they deal with it now?
      - What evidence shows the problem is real and worth paying to solve?
      - What change, in technology, law, attitudes or the economy, makes this the right moment?
  - id: offer
    title: The product or service and its value proposition
    words: 100
    ib: ['4.2', '4.5']
    tools: [business-model-canvas]
    prompts:
      - What exactly will customers get?
      - What job does it do for them, or what pain does it remove?
      - What is the unique selling point, and how easily could a rival copy it?
  - id: market
    title: Customers and the market
    words: 150
    ib: ['4.1', '4.2', '4.4']
    tools: [business-model-canvas]
    prompts:
      - Which customer segments will you target first, and how many such customers can you reach?
      - What did your market research find, and how was it done (primary or secondary, the method and the sample)?
      - Who are the competitors and the substitutes, and where do you stand against them?
  - id: model
    title: The business model
    words: 120
    ib: ['3.3']
    tools: [business-model-canvas, unit-economics]
    prompts:
      - How does the business make money? What is sold, at what price, and how often?
      - What does it cost to win a customer and to serve one, and how long do customers stay?
      - Which parts of the model rest on evidence, and which are still assumptions?
  - id: marketing
    title: The marketing plan
    words: 150
    ib: ['4.5']
    tools: [unit-economics]
    prompts:
      - How will the marketing mix work together for this customer, including people, processes and physical evidence if you sell a service?
      - Which pricing method will you use, and why does it suit a new business?
      - Which channels will bring the first hundred customers, and at what cost each?
  - id: operations
    title: Operations
    words: 120
    ib: ['5.1', '5.4']
    tools: []
    prompts:
      - How is the product made or the service delivered, step by step?
      - Where will the business operate, and what equipment, premises and suppliers does it need?
      - How will quality stay consistent as volume grows?
      - Does the business use one of the circular business models, and what does that change?
  - id: people
    title: People and legal form
    words: 100
    ib: ['1.2', '2.1']
    tools: []
    prompts:
      - Which legal form will the business take, and why? Consider a sole trader, a partnership, a privately held company or a social enterprise.
      - Who will do what in the first year, and when will you need to recruit?
      - How will you keep people committed while pay is low and hours are long?
  - id: finance
    title: Finance
    words: 180
    ib: ['3.2', '3.3', '3.7', '5.5']
    tools: [start-up-costs, revenue-planner, unit-economics]
    prompts:
      - What are the start-up costs and the monthly outgoings?
      - How much funding is needed, from which sources, and what does each cost the founders in control and risk?
      - What do the revenue and cash flow forecasts show, and in which month do sales first cover the outgoings?
      - At what output does the business break even, and with what margin of safety?
  - id: risks
    title: Risks, assumptions and contingency plans
    words: 120
    ib: ['5.7']
    tools: [business-model-canvas]
    prompts:
      - Which assumptions would do the most damage if they were wrong, and how will you test each one?
      - What could go wrong outside your control, and what would you do if it did?
      - What evidence would make you change direction, or stop?
  - id: milestones
    title: Milestones and the first year
    words: 80
    ib: ['1.3', '1.5']
    tools: []
    prompts:
      - What are the milestones for the next twelve months, each with a date and a measure of success?
      - What must you have learned or achieved before spending the next large sum?
      - What is the long-term aim, to stay small, to grow or one day to sell, and why?

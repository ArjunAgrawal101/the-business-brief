constraints:
  - Cash available to invest is ₹20m. Anything larger needs a loan, a partner or an investor.
  - The bank will lend up to ₹55m at 11% a year for company-owned restaurants, secured on the business.
  - The recipes depend on fresh, local produce and on cooks trained by the head chef. Training a new cook takes about four months.
  - Tiffin Lane's owner will consider other buyers if there is no offer by the end of the year.

stakeholders:
  - name: Meera Rao, founder and sole owner
    interest: Control, the quality of the food and the future of the business she built.
    influence: high
    stake: high
    concern: Losing the character of the food and of the business.
  - name: Employees (118)
    interest: Jobs, pay, training and the chance of promotion.
    influence: medium
    stake: high
    concern: Growth could bring promotion, or a new owner's rules and more pressure.
  - name: Customers
    interest: Food that tastes the same every time, at a fair price.
    influence: medium
    stake: medium
    concern: A Marigold in a mall, or run by a franchisee, may not taste like the one they know.
  - name: Banyan Growth Partners (possible investor)
    interest: A return on its investment and a sale of its stake in five to seven years.
    influence: high
    stake: medium
    concern: A business that grows too slowly to sell at a good price.
  - name: Sterling Malls (possible joint venture partner)
    interest: Restaurants that bring shoppers to its malls, and the rent they pay.
    influence: high
    stake: medium
    concern: Restaurants that do not draw enough footfall.
  - name: Prospective franchisees
    interest: A profitable restaurant and real support from the brand.
    influence: medium
    stake: high
    concern: Paying fees and royalties to a brand that cannot help them succeed, with their own savings at risk.
  - name: The bank
    interest: Interest, and repayment of the loan.
    influence: medium
    stake: medium
    concern: Lending against forecasts for a city Marigold has never traded in.
  - name: Tiffin Lane's owner and staff
    interest: A fair price for the owner; jobs for the staff.
    influence: low
    stake: high
    concern: Closures and new rules after a sale.
  - name: Local farms and dairies
    interest: Steady orders at fair prices.
    influence: low
    stake: medium
    concern: Being replaced by large suppliers if the business grows.

options:
  - id: organic
    label: Organic growth in Mumbai
    summary: Open four company-owned restaurants in Mumbai over two years.
    requires: ₹72m, of which ₹52m is borrowed; an area manager; cooks trained to Marigold's standard before each opening.
    upside: Full control of the food, the culture and the brand; growth that can be paused after the first openings.
    risks: Profit falls before it rises, because new restaurants take time to find customers and interest is due from the start. Debt magnifies a weak start.
    evidence: [ex-1, ex-3]
  - id: franchise
    label: Franchising
    summary: Sell the right to run Marigold restaurants to twelve franchisees over two years.
    requires: ₹10m for an academy, a manual and recruitment; a support team; twelve capable franchisees.
    upside: Fast reach into new cities using other people's money; royalties without running the restaurants.
    risks: Quality in the hands of owners Meera did not train; only four inquirers can fund a restaurant.
    evidence: [ex-3, ex-7]
  - id: joint-venture
    label: Joint venture with Sterling Malls
    summary: A jointly owned company opens six Marigold restaurants in Sterling's malls in three cities.
    requires: ₹45m from Marigold, of which ₹30m is borrowed; agreement on control, menu and exit.
    upside: Three cities in two years, with high footfall and the partner sharing cost and risk.
    risks: Shared control of the menu and prices; exit terms that may favour the partner who owns the sites.
    evidence: [ex-3]
  - id: acquisition
    label: Acquire Tiffin Lane
    summary: Buy nine restaurants, convert six to Marigold and close three, funded by selling 30% of Marigold to an investor.
    requires: ₹120m from Banyan Growth Partners; an integration plan; Tiffin Lane's staff to stay.
    upside: The largest business fastest, with purchasing economies of scale and a presence in Mumbai.
    risks: Paying twenty-five times profit; integrating a weaker business with a different culture; an investor who will want to sell.
    evidence: [ex-3, ex-4, ex-5]
  - id: stay-focused
    label: Stay focused
    summary: Keep four restaurants and use the kitchens' quiet mornings for an office lunch service.
    requires: ₹3m for vans and equipment.
    upside: Control and quality kept; little risk; better use of capacity the business already has.
    risks: No progress towards three cities; opportunities may go to competitors; ambitious staff may leave for growing rivals.
    evidence: [ex-2, ex-3, ex-6]

analysis:
  data:
    - Each restaurant earns ₹4.32m on ₹24m of sales (18%). The four together earn ₹17.28m, and central costs of ₹4.5m leave an operating profit of ₹12.78m (Exhibits 1 and 2).
    - The routes differ most in three things. Capital needed runs from ₹3m to ₹126m. Control runs from full, through shared, to diluted. And profit rises at once on some routes and only after two or more years on others (Exhibit 3).
    - Tiffin Lane earns ₹3.84m on ₹144m of sales, a margin under 3%, with a review rating a full point below Marigold's and staff turnover of 46% (Exhibits 4 and 5).
    - Only four of the forty-one franchise inquirers could fund a restaurant without borrowing (Exhibit 7).
  insight:
    - Marigold's advantage is its food and the cooks who make it. Any route that loosens control of the kitchen puts that advantage at risk, which is why the founder's first and third aims matter more than the forecasts suggest.
    - The routes that look best by year four, the acquisition and the joint venture, depend most on the things that are hardest to control. One is integrating a weaker business. The other is working with a partner whose priorities are different.
    - Franchising looks capital-light, but the plan needs twelve capable franchisees in two years and the evidence shows four with the means. The bottleneck is people, not money.
    - Organic growth lowers profit in year two, because new restaurants take time to find customers and interest is paid from the start. It is the slowest route and the one most consistent with the founder's aims.
  options:
    - Organic growth meets the aims on quality, control and people. It reaches a second city, but not a third, within two years.
    - The joint venture reaches three cities fastest with moderate capital, at the cost of shared control in the malls.
    - The acquisition builds the largest business and the largest forecast profit, at the cost of 30% of the company and the highest integration risk.
    - Franchising and staying focused sit at the two extremes, one of reach and the other of control.
  recommendation: >
    One defensible recommendation is organic growth in Mumbai, taken in steps. Open two restaurants first, and train
    a second head chef in Pune before each opening. Decide on the second pair only when the first pair reaches 85% of
    mature sales. Add the office lunch service now, because it uses spare kitchen capacity at little risk. Revisit a
    joint venture for mall sites only on terms that give Marigold control of the menu and a way out. This keeps the
    first, third and fourth aims, and moves towards the second more slowly than Meera would like.
  caveat: >
    The recommendation depends on Mumbai demand coming close to the forecast and on the bank's terms. If first-year
    sales in Mumbai came in well below ₹22m a restaurant, the second pair should not open, and the joint venture's
    mall footfall would look more valuable. A founder whose first aim was reach could reasonably choose the joint
    venture instead.

method: >
  Marigold Kitchens and everyone in this case are fictional, and every figure is simulated. The restaurant economics
  in Exhibit 1 were chosen for teaching, not taken from a real restaurant. Every forecast in the Decision Room is
  calculated from Exhibits 1 to 4 with one stated model. Restaurant profit is sales multiplied by one minus the food
  and packaging share, minus the restaurant's other costs. Group profit is the restaurants' profit, plus royalties or
  a share of joint venture profit where they apply, minus central costs and interest. Year two is the first full year
  after the decision, and maturity is year four. Interest is charged at 11% on the full loan in both years, as if it
  had not yet been repaid. Taxes, depreciation and inflation are left out so that the comparison stays visible.
  The tests in the repository recompute every figure from the exhibits.


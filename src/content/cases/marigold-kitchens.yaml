  - id: ex-3
    title: The five routes, as forecast by the finance manager
    kind: table
    provenance: simulated-data
    columns:
      - { label: "Route" }
      - { label: "What it involves" }
      - { label: "Money needed and where it comes from" }
      - { label: "Key terms and forecast assumptions" }
    rows:
      - - Organic growth
        - Four company-owned restaurants in Mumbai, opened over two years.
        - ₹72m (₹18m a restaurant). ₹20m from cash and a ₹52m bank loan at 11% a year.
        - Mumbai rent ₹5.4m a year; other restaurant costs as in Pune. Sales ₹26m a restaurant when mature, about 85% of that in the first full year. Central costs rise to ₹7.0m for an area manager and training.
      - - Franchising
        - Twelve franchised restaurants over two years, mainly in Mumbai and Bengaluru.
        - ₹10m from cash for a training academy, an operations manual and franchise recruitment.
        - Fee ₹1.5m a franchise, once. Royalty 6% of the franchisee's sales; marketing levy 2%, spent on marketing for the whole network. Franchisees' sales about ₹19m each in year two, ₹21m when mature. Support team ₹6.0m a year; academy ₹1.5m a year.
      - - Joint venture
        - A company owned 50:50 with Sterling Malls, opening six restaurants in its malls in Pune, Mumbai and Bengaluru.
        - ₹45m from each partner (₹15m a restaurant). Marigold's share from ₹15m of cash and a ₹30m loan at 11%.
        - Rent 15% of sales. Staff ₹6.6m and utilities and other costs ₹2.4m a restaurant. Sales ₹25.2m a restaurant in year two, ₹28m when mature. Joint venture overheads ₹2.0m a year; Marigold's oversight ₹0.5m a year.
      - - Acquisition
        - Buy Tiffin Lane's nine restaurants. Convert the six best to the Marigold format; close the three weakest.
        - ₹120m from Banyan Growth Partners for 30% of Marigold (₹96m price, ₹24m for conversions). Closures ₹6m from cash, once.
        - Buying for the whole group lowers food and packaging to 30% of sales. Converted restaurants sell ₹20m in year two and ₹23m when mature, with costs of ₹11m a year each besides food. Central costs ₹8.0m a year.
      - - Stay focused
        - Stay at four restaurants and add a weekday lunch service for offices in Pune, cooked in the existing kitchens.
        - ₹3m from cash for vans and equipment.
        - Sales ₹6m in year two, ₹9m when mature. Food and packaging 36% of sales; delivery and selling costs ₹1.2m a year.
    source: Simulated teaching data. Year two is the first full year after the decision; mature means year four. Taxes, depreciation and inflation are left out.


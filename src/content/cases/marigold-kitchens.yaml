# Marigold Kitchens. A fictional organization; every figure is simulated.
# The figures follow the model stated in `method`, and
# tests/unit/cases.test.ts recomputes them from the exhibits below. If you
# change an exhibit, run the tests: the Decision Room outcomes are checked
# against it.

title: Marigold Kitchens
dek: A profitable four-restaurant business in Pune has five ways to grow, and a founder who will not compromise on the food.
kind: fictional
dataStatus: simulated
organization:
  name: Marigold Kitchens
  sector: Restaurants (home-style lunches and dinners)
  location: Pune, India
  size: Four restaurants, 118 employees
  legalForm: Private limited company
currency:
  code: INR
  symbol: '₹'
  unit: ₹ million (₹m) a year
decision: Should Marigold Kitchens grow, and if it should, by which route?
brief: >
  Marigold Kitchens has four profitable restaurants in Pune and five routes in front of it: open its own
  restaurants in Mumbai, franchise, form a joint venture with a mall operator, buy a weaker rival, or stay at
  four restaurants and add a lunch service for offices. Each route makes the business bigger in a different way,
  and each changes who controls it, how it is financed and what it is like to work for.

narrative:
  - >
    Meera Rao opened the first Marigold Kitchens in Pune in 2017, with eleven tables and a menu built from her
    grandmother's recipes: dal, seasonal vegetables, millet rotis, a rice of the day and one dessert. Nine years
    later there are four restaurants across the city, all of them profitable, and the queue at lunchtime is still
    the best advertisement the business has.
  - >
    The question in front of Meera this autumn is not whether Marigold is successful. It is what success should
    look like next. In the last twelve months, forty-one people have asked to open a Marigold franchise. A mall
    operator, Sterling Malls, has proposed a joint venture that would put Marigold into six of its malls in three
    cities. A rival with nine restaurants, Tiffin Lane, is for sale because its owner wants to retire. Meera's bank
    has offered a loan for company-owned restaurants in Mumbai. And her head chef, Sunil Patil, has a different view
    entirely: four excellent restaurants and a new lunch service for offices would make the business better without
    making it bigger.
  - >
    Each route would change more than the size of the business. Franchising would put the brand in the hands of
    people Meera has not trained. The joint venture would mean sharing decisions with a partner whose business is
    footfall, not food. Buying Tiffin Lane would bring nine sites and their staff at once, along with a reputation
    for cutting corners, and it would need an investor, Banyan Growth Partners, who would want thirty per cent of
    Marigold in return. Growing organically keeps control, but it is slow, it needs a large loan, and it would make
    Marigold's profit fall before it rose.
  - >
    Meera's finance manager, Farah Sheikh, has built the forecasts in the exhibits from the restaurants' own
    figures. They are careful, but they are forecasts. The things that worry Farah most are not in the tables: how
    long a new restaurant takes to find its regulars, whether franchisees will follow the recipes when nobody is
    watching, and how many of Tiffin Lane's staff would stay.
  - >
    Meera has written down what she wants (Exhibit 6). Her four aims do not all point the same way. That is the
    decision.


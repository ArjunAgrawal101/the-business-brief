analysisQuestions:
  - id: pd-need
    commandTerm: Describe
    ao: AO1
    marks: 2
    level: HL
    paper: paper-3
    syllabus: ['1.2']
    prompt: Describe the human need that Patchwork Digital addresses.
    guidance: >
      One mark for identifying a need, and one for describing it with the case. Either need earns the marks: pupils
      without a laptop at home, who fall behind as schoolwork moves online (3,600 are on the waiting list); or people
      with convictions who cannot get a first job after prison.
  - id: pd-challenges
    commandTerm: Explain
    ao: AO2
    marks: 6
    level: HL
    paper: paper-3
    syllabus: ['1.2', '3.2']
    exhibits: [ex-1, ex-3, ex-5, ex-8]
    prompt: Explain the key challenges Patchwork Digital faces in meeting this need.
    guidance: >
      Up to three marks for each of two challenges, explained with the resource material. Strong challenges: financial
      sustainability, with a deficit of £12k, reserves of £45k and grants falling to 22.9% of income; growth that
      cannot include the trainees, because the bank's checks exclude them; and dependence on donated devices and on one
      foundation. An answer that lists challenges without explaining them, or without the case, stays at the bottom of
      the range.
  - id: pd-plan
    commandTerm: Recommend
    ao: AO3
    marks: 17
    level: HL
    paper: paper-3
    syllabus: ['1.2', '1.3', '1.4', '3.2']
    exhibits: [ex-1, ex-3, ex-4, ex-5, ex-6, ex-7, ex-8]
    prompt: Using all the resource material, recommend a plan of action for Patchwork Digital to meet more of the need.
    guidance: |
      In the style of the paper, a plan like this is judged on four things: how well it uses the resource material, how well it uses business management tools and theories, how well it evaluates, and how clearly its ideas and actions are sequenced. A strong answer:

      - uses every exhibit, including the figures in Exhibit 4 and the voices in Exhibits 5 to 8;
      - applies tools that fit, such as a stakeholder map, sources of finance, or a SWOT analysis of the enterprise;
      - weighs each plan against both needs and against the enterprise's survival, not against money alone;
      - sets out a plan in order, with who does what and when, and how Patchwork will know whether it is working.

      The marks are the question's own allocation in the style of the paper; this guidance is the platform's, not the IB's criteria or markbands.
  - id: pd-entity
    commandTerm: Distinguish
    ao: AO2
    marks: 4
    syllabus: ['1.2']
    prompt: Distinguish between a for-profit social enterprise, such as Patchwork, and a non-governmental organization (NGO).
    guidance: >
      Two marks for each side of the distinction, with the case. A for-profit social enterprise such as Patchwork
      trades, earning most of its income from selling goods and services, and uses its surplus for its social purpose;
      as a community interest company, its profits and assets are tied to that purpose. A non-profit NGO usually relies
      more on donations and grants, and is not run to make a surplus. The best answers note that Patchwork's falling
      grants push it towards trading.
  - id: pd-income
    commandTerm: Calculate
    ao: AO4
    marks: 4
    syllabus: ['3.3']
    exhibits: [ex-1]
    prompt: Using Exhibit 1, calculate (i) Patchwork's deficit as a percentage of its income and (ii) the percentage of its income that came from grants in 2025.
    answer: >
      (i) Deficit = 537 − 525 = £12k; 12 ÷ 525 × 100 = 2.3%. (ii) Grants = 120 ÷ 525 × 100 = 22.9%.
    guidance: Two marks for each, one for the method and one for the answer.
  - id: pd-finance
    commandTerm: Explain
    ao: AO2
    marks: 4
    syllabus: ['3.2']
    exhibits: [ex-4, ex-8]
    prompt: Explain two sources of finance Patchwork could use for the one-off costs of its plans.
    guidance: >
      Two sources, each explained with its fit to Patchwork, for two marks each. Strong choices: crowdfunding, which
      suits a cause people care about and is planned for the second workshop's fit-out; loan capital, which the bank
      contract's surplus could repay; or retained surplus from the contract itself. Business angels and share capital
      need care: a community interest company's profits and assets are tied to its purpose, which limits what an
      investor can be offered.

exercise:
  role: You are Morag Kerr, co-founder and director of Patchwork Digital.
  brief: >
    The board meets in November: Daniel, a head teacher, a former trainee and you. The bank wants an answer by
    December, the foundation will decide on any grant in the spring, and 3,600 pupils are waiting. You have said many
    times that Patchwork exists for two reasons.
  task: Recommend a plan of action that meets more of the need and keeps Patchwork solvent and true to its purpose.
  deliverable: A plan of action of about 300 words, setting out the steps in order, who they depend on, their cost and effect, and how the board will know whether they work.
  minutes: 45
  criteria:
    - Uses all the resource material, including the figures in Exhibit 4 and the voices in Exhibits 5 to 8.
    - Applies business management tools and theories that fit, such as stakeholder mapping or sources of finance.
    - Weighs the plans against both needs and against the enterprise's survival.
    - Sets out the plan in a clear order, with what will be measured.

debrief:
  summary: >
    Patchwork's two purposes grow in different ways: laptops for pupils with any capable workforce, traineeships only
    with supervision, space and subsidy. The strongest plans use the part of the business that can grow profitably to
    pay for the part that cannot, and make the link binding, so that growth serves the mission rather than replacing
    it.
  byOption:
    - option: bank-contract
      fit: conditional
      body: >
        The only plan that clears the waiting list, with 3,600 laptops a year, and adds a large surplus, £190k a year.
        But it grows Patchwork through people without convictions, because the bank's checks exclude the trainees, so
        the second half of the mission stands still unless the surplus is committed to traineeships. Strong with that
        commitment; mission drift without it.
    - option: second-workshop
      fit: conditional
      body: >
        It doubles the traineeships, the heart of the mission, and supplies 1,200 more laptops a year. But it loses £46k a
        year even with a grant that has not been agreed, and £136k without it, with reserves of £45k. The right purpose
        on the wrong economics; worth doing later, funded by something that pays.
    - option: sell-online
      fit: weak
      body: >
        A quick £72k a year that turns the deficit into a surplus, paid for by 600 pupils who would not get a laptop. It
        uses the mission to fund the enterprise rather than the enterprise to fund the mission.
    - option: license
      fit: conditional
      body: >
        A low-cost way to spread the model, adding £14k a year and helping pupils and trainees in other cities. But it
        does nothing for Glasgow's waiting list, and Patchwork's reputation would rest on partners it does not control.
        A good second step, not a first.
  tradeoffs:
    - Scale against purpose. The plan that helps most pupils does not employ more trainees.
    - Earned income against grants. The foundation wants Patchwork to earn more; the most mission-focused plan needs a grant.
    - One large customer against many small ones. The bank contract brings money and dependence together.
    - Pupils against money. Selling more online improves the accounts by serving fewer pupils.
  evidenceThatMatters:
    - The deficit, the falling grants and the reserves of a month (Exhibits 1 and 3).
    - The plans' effects on the surplus, on pupils and on traineeships, side by side (Exhibit 4).
    - The bank's refusal to make an exception (Exhibit 5).
    - The voices of the head teacher and the trainee, which show what each need means (Exhibits 6 and 7).
  changeYourMind:
    - The foundation agrees a three-year grant early. The second workshop becomes affordable alongside, or instead of, the contract.
    - There is not enough school and recycling work for more trainees. The contract's surplus cannot buy traineeships, and the contract becomes harder to justify.
    - Another large donor offers devices without the background check. That would grow both purposes at once.
  commonErrors:
    - Judging the plans on the surplus alone, as if Patchwork were an ordinary company.
    - Rejecting the bank contract as mission drift without asking what its surplus could pay for.
    - Recommending the second workshop without noticing that it loses money even with the grant.
    - Describing a plan without an order of steps, owners and measures.

frameworks:
  - name: Social enterprises
    use: >
      Patchwork is a for-profit social enterprise: it trades, and its surplus and assets serve its community purpose.
      Its falling grants push it further from the model of a non-profit NGO.
    terms: [social-enterprise, for-profit-social-enterprise, non-profit-social-enterprise, non-governmental-organization, social-entrepreneur]
    subtopics: ['1.2', '1.1']
  - name: The triple bottom line and ethical objectives
    use: >
      Patchwork measures success in pupils served and trainees in work as well as in money, so each plan must be judged
      on all three.
    terms: [triple-bottom-line, ethical-objectives, corporate-social-responsibility]
    subtopics: ['1.3']
  - name: Stakeholder mapping and conflict
    use: >
      The bank and the foundation have high influence; trainees, pupils and families have a high stake and little
      influence. The plan must protect the interests of those who cannot press for them.
    terms: [stakeholder-mapping, stakeholder-conflict]
    subtopics: ['1.4']
  - name: Sources of finance
    use: >
      Crowdfunding, grants, loans and retained surplus each fit some plans and not others; a community interest
      company's asset lock limits what it can offer an equity investor.
    terms: [crowdfunding, loan-capital, retained-profit, business-angel, internal-sources-of-finance, external-sources-of-finance]
    subtopics: ['3.2']
  - name: Revenue streams
    use: >
      Patchwork earns from four streams besides grants, and the plans change their mix: the bank contract adds fees, the
      online plan shifts laptops from one stream to another.
    terms: [revenue-stream, total-revenue]
    subtopics: ['3.3']
  - name: Circular business models
    use: >
      Refurbishing laptops is a product life extension model, and stripping the rest for parts is resource recovery;
      both turn other organizations' waste into Patchwork's raw material.
    terms: [circular-business-models, product-life-extension-model, resource-recovery-model]
    tool: circular-business-models
  - name: SWOT analysis
    use: >
      A SWOT analysis of Patchwork sets its strengths (a trusted model, results) and weaknesses (a deficit, thin
      reserves) against the bank's offer as an opportunity and the tapering grant as a threat.
    terms: [swot-analysis]
    tool: swot-analysis

discussion:
  - >
    When does growth funded by a commercial contract become mission drift? Propose a rule a board could adopt in advance
    to decide.
  - >
    Patchwork's two purposes have different economics. Should a social enterprise with two purposes ever split them
    into two organizations?
  - >
    The bank gains a story of social value from the contract. How should Patchwork price that, and should it?


      - A. The bank's 9,000 laptops a year at £15 each for data destruction (£135k); 4,000 can be refurbished, 3,600 for schools at £60 and 400 online at £180; 5,000 recycled at £10. Costs: four technicians who pass the bank's check at £32k each, £30 of parts for each refurbished laptop, £20k of transport and £15k to run a secure room, which costs £40k to build.
      - B. A second workshop in another part of the city, with eight more traineeships at £20k each, a supervisor at £32k and premises at £36k a year. 2,500 more devices from councils: 1,200 laptops for schools, 200 sold online, 1,100 recycled, £12 data-wiping fees on all 2,500 and £30 of parts for each refurbished laptop, with £15k of transport. Income includes a new grant of £90k a year, which the foundation has not yet agreed. The £60k fit-out would be crowdfunded.
      - C. Sell 600 of the laptops that now go to schools online instead, at £180 rather than £60.
      - D. License Patchwork's methods, name and training to social enterprises in two other Scottish cities for £12k a year each, with £10k a year of support. Each plans 1,500 laptops for its own schools and six trainees a year.

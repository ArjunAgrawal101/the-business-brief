# Patchwork Digital CIC. A fictional organization; every figure is simulated.
# Income is devices times the price or fee for each; costs follow the stated
# rates; each plan in Exhibit 4 adds the income and costs its note states.
# scripts/qa/case-figures.py rebuilds every exhibit and checks every figure in
# the text; tests/unit/vault-cases.test.ts recomputes the plans.

title: Patchwork Digital
dek: A Glasgow social enterprise that refurbishes laptops for pupils and trains people leaving prison is offered a contract its trainees could not work on.
kind: fictional
dataStatus: simulated
organization:
  name: Patchwork Digital CIC
  sector: Social enterprise (laptop refurbishment and training)
  location: Glasgow, United Kingdom
  size: One workshop; six permanent staff and eight trainees
  legalForm: Community interest company (a for-profit social enterprise)
currency:
  code: GBP
  symbol: '£'
  unit: thousands of pounds sterling (£000), and pounds for prices
decision: How should Patchwork meet more of the need for laptops without losing the second half of its mission?
brief: >
  Patchwork Digital refurbishes donated laptops, sells them to schools at a fraction of their value for pupils who have
  none at home, and does the work with trainees who have criminal convictions. It is running a small deficit, its grant
  is tapering, and schools have a waiting list of 3,600 pupils. A bank has offered a three-year contract that would
  clear the waiting list and earn a large surplus, but everyone who handles the bank's laptops must pass a background
  check that most trainees would fail. The directors must recommend a plan of action.

narrative:
  - >
    Morag Kerr taught in a prison for eleven years. Daniel Okoye spent the same years wiping and scrapping companies'
    old computers. When they met in 2019 they saw two problems with one answer. Pupils in Glasgow's poorest
    neighbourhoods were falling behind because they had no laptop at home, while companies were paying to destroy
    machines that still worked. And people leaving prison could rarely get a first job, however much they wanted one.
  - >
    Patchwork Digital, the community interest company they founded, collects laptops that companies, councils and
    universities no longer need, wipes their data to a certified standard, and refurbishes the ones that can be saved.
    Schools buy them for £60 each for pupils without a laptop at home; some are sold online at £180 to pay for the rest;
    the machines that cannot be saved are stripped for parts. The work is done by six permanent staff and eight trainees
    a year, people with convictions on twelve-month paid traineeships (Exhibits 1 and 2).
  - >
    It works. Patchwork supplied 2,400 laptops to schools in 2025, and five of the seven trainees who finished in 2024
    were in work six months later (Exhibit 3). But it does not quite pay. Patchwork ran a deficit of £12k in 2025, its
    reserves are about a month's costs, and the foundation whose grants have kept it going has said its support was
    always meant to taper (Exhibit 8). Meanwhile 41 schools have nominated 3,600 pupils who are still waiting for a
    laptop.
  - >
    In September, Clydeport Bank offered Patchwork a three-year contract to destroy the data on the 9,000 laptops it
    retires each year, and to keep the machines (Exhibit 5). It would clear the waiting list and earn a large surplus.
    But everyone who handles the bank's devices must pass the bank's enhanced background check, which most trainees
    would fail. The contract would have to be done by new staff, in a secure room the trainees could not enter.
  - >
    Morag and Daniel have costed four plans (Exhibit 4). Morag fears that the contract would turn Patchwork into an
    ordinary IT disposal firm with a charity's name; Daniel fears that without it Patchwork will not survive long enough
    to help anyone. The board, which includes a head teacher and a former trainee, meets in November.

industryContext:
  - >
    Social enterprises trade like businesses but exist for a social or environmental purpose, and reinvest most of what
    they earn in that purpose. In the United Kingdom many take the form of a community interest company, a limited
    company whose profits and assets must be used for the community purpose it states.
  - >
    Organizations replace their laptops every few years, often long before the machines stop working. Refurbishing
    them extends their life, which is one of the ideas behind circular business models, but it depends on secure data
    destruction, because donors' devices hold confidential data. Certified wiping is a service that organizations pay
    for, which gives refurbishers a source of income as well as a source of machines.
  - >
    Pupils without a suitable device at home find it harder to do schoolwork as more of it moves online. Social
    enterprises that also employ people facing barriers to work, such as people with convictions, serve two purposes at
    once, and must balance both against earning enough to survive.

challenge: >
  Patchwork exists to meet two needs: laptops for pupils who have none, and work for people leaving prison. It can meet
  more of the first only by growing, and it must grow without a reliable grant and with almost no reserves. The plan
  that grows it fastest would be done by people without convictions, and the plan that grows the traineeships would
  lose money. The directors must find a plan of action that meets more of the need while keeping the enterprise both
  solvent and true to its purpose.

financials:
  summary: >
    Patchwork's income was £525k in 2025, of which grants were £120k, or 22.9%; its costs were £537k, leaving a deficit
    of £12k, 2.3% of income. Grants have fallen each year since 2023 (Exhibit 3). Each refurbished laptop costs about
    £30 in parts and licences; the larger costs are people, and the trainees' wages of £160k are the price of the
    second half of the mission. Exhibit 4 sets out what each plan would add each year.
  exhibits: [ex-1, ex-2, ex-4]


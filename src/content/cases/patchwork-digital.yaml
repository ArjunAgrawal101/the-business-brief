constraints:
  - Reserves are £45k, about one month of costs.
  - The bank requires an enhanced background check for anyone who handles its devices, and will not make an exception; most trainees could not pass it.
  - The foundation will decide on any new grant in the spring, six months away.
  - As a community interest company, Patchwork must use its surplus and its assets for its community purpose.
  - The current workshop has room for a secure area or for more trainees, but not both.

stakeholders:
  - name: Morag Kerr and Daniel Okoye, founders and directors
    interest: An enterprise that meets both needs and survives.
    influence: high
    stake: high
    concern: Morag fears mission drift; Daniel fears closure.
  - name: Trainees
    interest: Paid work, skills and a route into a job.
    influence: low
    stake: high
    concern: Growth that happens without them.
  - name: Pupils and their families
    interest: A laptop at home for schoolwork.
    influence: low
    stake: high
    concern: Waiting another year.
  - name: Schools
    interest: Affordable laptops for the pupils who need them.
    influence: medium
    stake: high
    concern: Higher prices, or fewer laptops.
  - name: Clydeport Bank
    interest: Secure, certified data destruction, and a story of social value.
    influence: high
    stake: low
    concern: Any risk to its customers' data.
  - name: The Clydeside Foundation
    interest: Lasting social impact for its grants.
    influence: high
    stake: medium
    concern: An enterprise that depends on it for ever.
  - name: Permanent staff
    interest: Secure jobs in work they believe in.
    influence: medium
    stake: high
    concern: Supervising more people with no more resources.
  - name: Donor organizations
    interest: Safe disposal of their old devices, and doing some good.
    influence: medium
    stake: low
    concern: Data security.

options:
  - id: bank-contract
    label: 'A. Take the bank contract'
    summary: Destroy the data on Clydeport Bank's laptops for three years, refurbish the machines, and clear the schools' waiting list.
    requires: Four new technicians who pass the bank's check, and a secure room costing £40k.
    upside: Clears the waiting list of 3,600 pupils and adds £190k a year to the surplus, enough to fund more traineeships elsewhere.
    risks: The growth is done by people without convictions, so the traineeships do not grow unless the surplus is committed to them; one large customer for three years; mission drift.
    evidence: [ex-4, ex-5]
  - id: second-workshop
    label: 'B. Open a second workshop'
    summary: Open a second workshop with eight more traineeships, funded by crowdfunding and a new grant.
    requires: £60k from crowdfunding, a new three-year grant of £90k a year, and 2,500 more donated devices.
    upside: Doubles the traineeships, the heart of the mission, and supplies 1,200 more laptops a year.
    risks: Loses £46k a year even with the grant, and more without it; the grant will not be decided for six months.
    evidence: [ex-4, ex-8]
  - id: sell-online
    label: 'C. Sell more laptops online'
    summary: Sell 600 of the laptops that now go to schools online, at £180 rather than £60.
    requires: Nothing new.
    upside: Adds £72k a year at once, and turns the deficit into a surplus.
    risks: 600 fewer pupils get a laptop; the mission pays for the enterprise rather than the other way round.
    evidence: [ex-2, ex-4, ex-6]
  - id: license
    label: 'D. License the model to other cities'
    summary: License Patchwork's methods, name and training to social enterprises in two other Scottish cities.
    requires: Partners who meet Patchwork's standards, and staff time to support them.
    upside: Spreads the model to other cities at little cost or risk, adding £14k a year.
    risks: Does nothing for Glasgow's waiting list; Patchwork's reputation rests on partners it does not control.
    evidence: [ex-4]

analysis:
  data:
    - Income was £525k in 2025 and costs £537k, a deficit of £12k; grants were 22.9% of income and have fallen from £150k to £120k since 2023 (Exhibits 1 and 3).
    - Reserves are £45k, and 3,600 nominated pupils are waiting for a laptop.
    - The bank contract would add £190k a year to the surplus and 3,600 laptops for schools, but no traineeships; the second workshop would add eight traineeships and lose £46k a year even with a grant (Exhibit 4).
    - Selling 600 more laptops online would add £72k a year and serve 600 fewer pupils (Exhibit 4).
  insight:
    - Patchwork's two purposes pull apart at scale. Laptops for pupils can grow with any workforce; traineeships grow only with more supervision, space and subsidy.
    - The bank contract is not mission drift in itself. It becomes mission drift only if its surplus does not flow back to the purposes; committed to traineeships, it could fund six more a year.
    - The second workshop has the right purpose and the wrong economics. It depends on a grant that is uncertain and still loses money with it.
  options:
    - The bank contract meets the first need in full and can pay for the second, if the board commits its surplus.
    - The second workshop grows the second need and endangers the enterprise.
    - Selling more online trades pupils for money.
    - Licensing spreads the model but does not help Glasgow now.
  recommendation: >
    One defensible plan: accept the bank contract for three years, and commit £120k a year of its surplus to six more
    traineeships doing the school and recycling work, which the bank's checks do not cover. Build the secure room in the
    current workshop, and keep the trainees' space elsewhere. Rebuild reserves with the rest of the surplus. Tell the
    foundation and the schools exactly how the contract's money is used, and report both the laptops and the
    traineeships each year. License the model to other cities once the contract is running.
  caveat: >
    This depends on there being enough school and recycling work for fourteen trainees, and on the board holding to the
    commitment when the surplus could be used for other things. If the bank's contract ended after three years with no
    replacement, Patchwork would have expanded its costs on a single customer's income, so the plan must also look for
    other paying donors of devices.

method: >
  Patchwork Digital, Clydeport Bank, the Clydeside Foundation and everyone in this case are fictional, and every
  figure is simulated. Income is the number of devices times the price or fee for each; costs follow the rates stated
  in the exhibits; and each plan in Exhibit 4 adds the income and costs its note sets out. The plans' figures are the
  directors' estimates, not predictions. A script in the repository (`scripts/qa/case-figures.py`) rebuilds every
  exhibit and checks every figure in the text, and the unit tests recompute the plans.


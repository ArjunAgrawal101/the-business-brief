# Quintanilla Autopartes. A fictional organization; every figure is simulated.
# Exhibit 3's cash flows are appraised by payback, ARR and NPV with the
# discount factors printed in the IB guide (p. 66). scripts/qa/case-figures.py
# rebuilds every exhibit and checks every figure in the text;
# tests/unit/vault-cases.test.ts recomputes the appraisals with
# src/lib/investment.ts.

title: Quintanilla Autopartes
dek: A family parts maker in Monterrey must choose one investment as the engines its products are made for start to disappear.
kind: fictional
dataStatus: simulated
organization:
  name: Quintanilla Autopartes
  sector: Automotive components (pressed and welded steel parts)
  location: Monterrey, Mexico
  size: One plant with two welding lines and a press shop, 420 employees
  legalForm: Privately held company (S.A. de C.V.), owned by the Quintanilla family
currency:
  code: MXN
  symbol: 'MX$'
  unit: millions of Mexican pesos (MX$m)
decision: Which investment should Quintanilla make, and which way of appraising it should the board trust?
brief: >
  Two thirds of Quintanilla's sales are parts that exist only because cars have combustion engines, and its
  customers expect to order far fewer of them each year. The board can afford one investment: rebuild a line to make
  battery-enclosure frames for a nearby carmaker's electric pickup, automate welding to make the combustion business
  as efficient as possible, or diversify into parts for farm machinery. Payback, the average rate of return and net
  present value do not agree on which is best, and the project with the highest value carries the most risk.

narrative:
  - >
    Rodrigo Quintanilla started pressing exhaust brackets in a rented workshop in Apodaca, on the edge of Monterrey, in
    1987. Today Quintanilla Autopartes employs 420 people in a plant of its own, making exhaust brackets, heat shields,
    fuel-tank straps and body stampings for two carmakers and a large parts supplier. Rodrigo's daughter, Ana Sofía,
    has run the company since 2018. The family owns all of it and has never sold a share.
  - >
    Most of what Quintanilla makes exists only because cars have engines that burn fuel. Exhaust parts, heat shields
    and fuel-tank parts were two thirds of sales in 2025, and their sales have fallen in each of the last three years
    (Exhibit 4). The customers' own forecasts say that their orders for these parts will fall to 40% of the 2025 level
    by 2031 (Exhibit 6). Profit before interest and tax fell from MX$86.8m to MX$58.0m in 2025 (Exhibit 1).
  - >
    Norvalia Motors, whose plant forty kilometres away buys more than half of Quintanilla's output, will build an
    electric pickup there from 2028. It needs a local supplier for the frames that hold the battery pack: large
    welded structures that must protect the cells in a crash, keep water out and be built to tight tolerances.
    Norvalia has invited Quintanilla to bid (Exhibit 8). Winning would mean rebuilding Line 2, retraining welders who
    have worked with steel all their lives, and borrowing more than the company ever has.
  - >
    Two other projects are on the table. Héctor Salinas, the plant manager, wants to automate welding on both lines.
    The combustion market is shrinking, he argues, but rivals are leaving it faster, and the last efficient supplier
    will keep the orders that remain. Ana Sofía's brother, who sits on the board, has found a maker of tractors and
    farm implements, Agrimaq del Norte, that is looking for a supplier of frames and brackets. Each project would use
    most of the money the company can raise, so the board can choose only one (Exhibits 3 and 5).
  - >
    Mónica Treviño, the finance director, has forecast the cash flows of each project, and the board meets in two
    weeks. Norvalia wants bids within six months. The board has always liked projects that pay back quickly, and
    Mónica suspects that the three methods she has been asked to use will not agree.

industryContext:
  - >
    Carmakers are moving from vehicles with combustion engines to electric ones, at a pace that differs from market to
    market and maker to maker, and that depends on regulation, the cost of batteries and what buyers choose. Parts
    that exist only in combustion vehicles, such as exhaust systems and fuel tanks, face falling demand over the
    coming decade, while electric vehicles need new parts, such as battery enclosures, cooling plates and
    high-voltage cabling.
  - >
    Carmakers buy through tiers of suppliers. Large first-tier suppliers deliver complete systems; smaller firms
    supply parts to them or straight to the assembly plant. Contracts are usually awarded for the life of a vehicle
    programme, the volumes in them are forecasts rather than guarantees, and buyers expect prices to fall a little
    each year. Winning a new part means passing the carmaker's quality approval, which can take many months.
  - >
    Many assembly plants work on just-in-time delivery, so suppliers of large, heavy parts are often expected to be
    close by. A battery enclosure is large, heavy and safety-critical, which calls for precise welding and sealing,
    often in aluminium rather than steel. Skills and equipment built for steel parts do not transfer automatically.

challenge: >
  Quintanilla's core products are in decline, and it must choose one investment that decides what kind of company it
  becomes. The project with the best forecast returns depends on one customer's volumes, which nobody can guarantee,
  and on skills the workforce does not yet have. The safest project makes the company more efficient at something
  the market is leaving. The third spreads the risk but barely earns what the money costs. The board has to decide
  which method of appraisal to trust, and how much risk a family company should take.

financials:
  summary: >
    Sales fell by 5.0% in 2025 and the gross profit margin from 19.0% to 17.0%, as lower volumes of combustion parts
    spread the plant's fixed costs over less output. Profit before interest and tax fell by a third. The balance
    sheet is strong: borrowing is low and the company holds MX$84.0m of cash, so it can fund one project with a new
    bank loan. Exhibit 3 gives each project's forecast net cash flows, the figures the board will appraise.
  exhibits: [ex-1, ex-2, ex-3]


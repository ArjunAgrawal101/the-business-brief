constraints:
  - The company can fund one of the three projects, not two. The bank will lend up to MX$120m at 10% a year.
  - Norvalia wants bids within six months, and its quality approval takes about eighteen months, so a decision on Project A cannot wait a year.
  - The family will not sell shares to an outside investor.
  - Qualifying a welder in aluminium takes about eight weeks off the job.


analysisQuestions:
  - id: qa-define
    commandTerm: Define
    ao: AO1
    marks: 2
    syllabus: ['3.8']
    prompt: Define the term *payback period*.
    guidance: >
      One mark for the time it takes for a project's net cash flows to repay its capital cost, and one for a complete,
      precise statement (for example, measured from the start of the project, in years and months). Do not confuse it
      with the life of the project.
  - id: qa-payback
    commandTerm: Calculate
    ao: AO4
    marks: 4
    paper: paper-2
    syllabus: ['3.8']
    exhibits: [ex-3]
    prompt: Using Exhibit 3, calculate the payback period of Project A and of Project B, in years and months.
    answer: >
      Project A: cumulative net cash flow is −168, −140, −98 and −48 at the end of years 1 to 4, so MX$48m is still to
      recover when year 5 brings MX$54m. Payback = 4 years + (48 ÷ 54) × 12 months = 4 years 10.7 months. Project B:
      cumulative −60, −32 and −8, then MX$19m in year 4. Payback = 3 years + (8 ÷ 19) × 12 months = 3 years 5.1 months.
    guidance: >
      Two marks for each project: one for the cumulative cash flow and one for the answer. State the assumption that
      cash arrives evenly through the year; without it the months cannot be calculated.
  - id: qa-arr
    commandTerm: Calculate
    ao: AO4
    marks: 4
    paper: paper-2
    syllabus: ['3.8']
    exhibits: [ex-3]
    prompt: Using Exhibit 3, calculate the average rate of return (ARR) of Project A and of Project C.
    answer: >
      Project A: total returns MX$334m, so ARR = ((334 − 180) ÷ 8) ÷ 180 × 100 = 10.7%. Project C: total returns
      MX$188m, so ARR = ((188 − 120) ÷ 8) ÷ 120 × 100 = 7.1%.
    guidance: >
      Two marks for each project, one for the method and one for the answer. Use the guide's formula: the average
      yearly profit (total returns less the capital cost, divided by the years of use) as a percentage of the capital
      cost. A common slip is to forget to subtract the capital cost before dividing.
  - id: qa-npv
    commandTerm: Calculate
    ao: AO4
    marks: 4
    level: HL
    paper: paper-2
    syllabus: ['3.8']
    exhibits: [ex-3]
    prompt: Using Exhibit 3 and the discount factors given, calculate the net present value (NPV) of Project A at 10%, and its NPV if every year's net cash flow is 30% lower than forecast.
    answer: >
      The present values of the returns add up to MX$209.95m, so NPV = 209.95 − 180 = MX$30.0m. If every return is 30%
      lower, the present values add up to 0.7 × 209.95 = MX$146.97m, so NPV = 146.97 − 180 = −MX$33.0m.
    guidance: >
      Two marks for each NPV. Multiply each year's net cash flow by that year's factor, add the present values and
      subtract the capital cost. For the second part, every present value falls by 30%, so the total can be found in
      one step. The best answers say what the result means: the project creates value only if volumes come close to
      the forecast.
  - id: qa-resist
    commandTerm: Explain
    ao: AO2
    marks: 4
    syllabus: ['2.1']
    exhibits: [ex-7, ex-9]
    prompt: Using Exhibits 7 and 9, explain two reasons why Quintanilla's welders might resist the plan to rebuild Line 2.
    guidance: >
      Two reasons, each explained and tied to the case, for two marks each. Strong reasons: fear for their jobs, since
      the same board is considering robotic welding (Project B); uncertainty about whether experienced steel welders,
      with an average age of 47, can qualify in aluminium; loss of the status that comes from being the best at the
      old work; and poor communication, since the workers' representative says people hear about change last. A
      reason that could apply to any business, without the case, earns one mark at most.
  - id: qa-life-cycle
    commandTerm: Explain
    ao: AO2
    marks: 4
    syllabus: ['4.5']
    exhibits: [ex-4, ex-6]
    prompt: Using Exhibits 4 and 6, explain the stage of the product life cycle reached by Quintanilla's combustion parts, and what this means for Project B.
    guidance: >
      The combustion parts are in decline: their sales have fallen for three years, and the customers forecast
      volumes at 40% of the 2025 level by 2031. Two marks for identifying the stage with evidence. Two marks for the
      implication: Project B invests to cut costs on a product whose market is shrinking, so it earns its returns
      early and has little value after the products end, which is why its payback is quick and its NPV small.
  - id: qa-recommend
    commandTerm: Recommend
    ao: AO3
    marks: 10
    paper: paper-2
    syllabus: ['3.8', '2.1', '5.4']
    exhibits: [ex-3, ex-5, ex-6, ex-8, ex-9]
    prompt: Recommend which of the three projects Quintanilla should invest in.
    guidance: |
      A strong answer does four things.

      - It uses all three methods and explains why they disagree: B pays back first; A has the highest ARR and NPV.
      - It treats the forecasts as forecasts: A's NPV becomes −MX$33.0m if volumes are 30% lower, and B's returns depend on a declining market.
      - It weighs what the numbers leave out: the welders' retraining, the 60 jobs B would cut, the distance rule in Norvalia's letter, and the company's future after 2031.
      - It makes a clear recommendation, with the conditions under which it holds and what would change it.

      Answers that recommend a project on one method alone, or that list the methods without a judgement, stay in the middle of the range.

exercise:
  role: You are Mónica Treviño, Quintanilla's finance director.
  brief: >
    The board meets in two weeks and expects a recommendation it can vote on. Ana Sofía wants the company to have a
    future, Héctor wants the plant to stay efficient, and the family wants its wealth protected. You have the three
    projects' forecasts, the appraisal methods the board knows, and Norvalia's letter.
  task: Choose one alternative and defend it with the appraisal, the risks behind the forecasts and the people it affects.
  deliverable: A recommendation to the board of about 250 words, using payback, ARR and, at HL, NPV, with the condition on which it depends.
  minutes: 40
  criteria:
    - Uses the appraisal methods correctly and explains why they rank the projects differently.
    - Treats the forecasts as uncertain, with a sense of what happens if volumes fall short (Exhibit 3).
    - Weighs the effect on the workforce and what the change would need from them (Exhibits 7 and 9).
    - States the condition on which the recommendation depends, and what the board should do if it fails.

debrief:
  summary: >
    The case turns on two questions: what each appraisal method measures, and how much risk a family company should
    take with the forecasts of one customer. Payback, ARR and NPV disagree for good reasons. The strongest answers use
    that disagreement rather than choosing a favourite method, and treat the project with the best forecast as
    worth having only if its risk can be shared.
  byOption:
    - option: project-a
      fit: conditional
      body: >
        The best on the forecast, with payback in 4 years 10.7 months, an ARR of 10.7% and an NPV of MX$30.0m, and the
        only project that gives the company a future product. But it is a bet on Norvalia's volumes: 30% below
        forecast, the NPV becomes −MX$33.0m, and the project stops creating value once volumes are about 14% short. It
        is the right choice if the contract shares that risk, and a gamble if it does not.
    - option: project-b
      fit: weak
      body: >
        The fastest payback, 3 years 5.1 months, and little money at risk in the early years, but an NPV of only
        MX$4.6m on a product that is disappearing. It cuts 60 jobs to make a shrinking business efficient, and leaves
        Quintanilla with nothing to make when the combustion parts end.
    - option: project-c
      fit: conditional
      body: >
        Diversification that reduces the dependence on carmakers, but with the weakest returns: an NPV of MX$1.3m at
        10% and payback in 5 years 4.6 months. One customer in a cyclical market replaces one customer in a declining
        one. Defensible as the prudent choice if Norvalia offers no protection on volumes.
    - option: wait
      fit: weak
      body: >
        It keeps the cash, but the decision cannot wait: Norvalia's approval takes eighteen months and bids close in
        six. Waiting gives the electric pickup to another supplier and leaves the company riding the combustion
        decline with nothing to replace it.
  tradeoffs:
    - Speed against value. B returns its money first; A creates the most value if the forecast holds.
    - A visible decline against an uncertain forecast. B's returns depend on a market everyone can see shrinking; A's depend on volumes nobody can guarantee.
    - Jobs now against jobs later. B cuts 60 jobs; A retrains 48 welders and adds 20.
    - Spreading risk against earning returns. C reduces the dependence on cars but earns least.
  evidenceThatMatters:
    - The volume index, which puts combustion orders at 40% of today's by 2031 (Exhibit 6).
    - Project A's sensitivity, negative once volumes are about 14% short (Exhibit 3, with the discount factors).
    - Norvalia's letter, which calls its volumes a forecast, not a commitment (Exhibit 8).
    - The welders' position, willing to retrain if it leads to a job (Exhibit 9).
  changeYourMind:
    - Norvalia agrees a minimum volume or a price that rises with any shortfall. A's downside shrinks and it becomes the clear choice.
    - Norvalia refuses any protection, or delays its electric pickup. C, or a smaller automation of one line, becomes the safer course.
    - Combustion volumes fall faster than the index. B's returns shrink and its quick payback disappears.
  commonErrors:
    - Treating payback as the answer. It ignores everything after the money is repaid, which is where A earns most.
    - Quoting an NPV without its risk. An NPV on forecast volumes describes one scenario, not the future.
    - Ignoring the people. Retraining 48 welders in aluminium is a condition of Project A, not a detail.
    - Comparing ARRs without noticing that Project B lasts six years and the others eight.

frameworks:
  - name: Investment appraisal
    use: >
      Payback, the average rate of return and net present value (HL) rank the three projects differently, because
      they measure speed, average profitability and the value of every future year respectively.
    terms: [payback-period, average-rate-of-return, net-present-value, discount-factor, time-value-of-money]
    subtopics: ['3.8']
  - name: Decision trees and expected value
    use: >
      The board's estimate of a 40% chance that volumes are 30% lower turns Project A into a decision with two
      outcomes, whose expected value can be compared with Project B's.
    terms: [decision-tree, expected-value]
    tool: decision-trees
  - name: The product life cycle
    use: >
      Quintanilla's combustion parts are in decline. Investing to cut their costs (Project B) is a way of managing
      decline, not of escaping it.
    terms: [product-life-cycle, extension-strategy]
    subtopics: ['4.5']
  - name: The Ansoff matrix
    use: >
      Project B is market penetration with existing products, Project A is product development for an existing
      customer, and Project C is diversification, the riskiest quadrant in theory, though here the safest by
      dependence on one market.
    terms: [ansoff-matrix, market-penetration, product-development, diversification]
    tool: ansoff-matrix
  - name: Resistance to change
    use: >
      Retraining welders in a new metal, while the board considers replacing them with robots, invites resistance.
      Involvement, communication and training are the human resource strategies that reduce it.
    terms: [resistance-to-change, change-management, off-the-job-training]
    subtopics: ['2.1']
  - name: Force field analysis
    level: HL
    use: >
      The forces for rebuilding Line 2 (the decline of combustion parts, Norvalia's invitation) can be set against the
      forces against it (the volume risk, the skills gap, the welders' fears) to find which force is worth weakening.
    terms: [force-field-analysis]
    tool: force-field-analysis
  - name: Location
    use: >
      Norvalia will buy only from a supplier within 100 kilometres, because large parts are delivered just in time.
      Quintanilla's plant is forty kilometres away, a location advantage that a distant rival cannot match.
    terms: [location-factors]
    subtopics: ['5.4']
  - name: STEEPLE analysis
    use: >
      The external forces behind the decline of combustion parts (technological, environmental, legal and economic)
      explain why the volume index falls, and why the timing is uncertain.
    terms: [steeple-analysis]
    tool: steeple-analysis

discussion:
  - >
    Payback, ARR and NPV rank the projects differently. Which ranking should a family-owned supplier in a shrinking
    market trust, and when might a board's preference for quick payback be rational rather than naive?
  - >
    Project A's NPV turns negative if volumes are about 14% short of Norvalia's forecast. What contract terms, staging
    of the investment or design choices would reduce that exposure, and what would each one cost?
  - >
    Is harvesting the combustion business, as Project B does, a legitimate strategy for a company with 420 employees
    in one city? Weigh the job losses against the risk of investing in a market the company does not control.


# Case Vault classification (src/lib/case-vault.ts).
industry: automobile
functions: [finance, operations, strategy]
difficulty: advanced
qualifications: [ib-dp-sl, ib-dp-hl, undergraduate, mba]
keyConcepts: [change, sustainability]
caseType: fictional

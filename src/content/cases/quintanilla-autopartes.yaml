options:
  - id: project-a
    label: 'Project A: battery-enclosure frames'
    summary: Rebuild Line 2 to make battery-enclosure frames for Norvalia's electric pickup from 2028.
    requires: MX$180m, a winning bid, quality approval within eighteen months and 48 welders retrained in aluminium.
    upside: The highest ARR and NPV, and a product with a future in a market where demand is growing.
    risks: The value depends on Norvalia's volumes, which are a forecast, not a commitment, and on renewal of the contract after five years.
    evidence: [ex-3, ex-5, ex-8, ex-9]
  - id: project-b
    label: 'Project B: automated welding'
    summary: Automate welding on both lines to make the combustion business as efficient as possible.
    requires: MX$90m and 60 fewer jobs within two years.
    upside: The fastest payback and the least money at risk.
    risks: Makes the company better at making parts the market is leaving; little to show for the investment once combustion volumes are gone.
    evidence: [ex-3, ex-5, ex-6]
  - id: project-c
    label: 'Project C: farm machinery parts'
    summary: Diversify into frames and brackets for Agrimaq del Norte's tractors and implements.
    requires: MX$120m, a new bay in the plant and a new customer relationship.
    upside: Spreads the company's risk beyond carmakers, and adds 35 jobs.
    risks: The weakest returns of the three, and a single customer in a market that rises and falls with farming.
    evidence: [ex-3, ex-5]
  - id: wait
    label: Wait a year
    summary: Invest in none of the projects this year, keep the cash and decide when the market is clearer.
    requires: Nothing now.
    upside: No new borrowing and no risk taken on forecasts.
    risks: Norvalia's bids close in six months, so waiting gives the electric pickup to another supplier while the combustion business shrinks.
    evidence: [ex-6, ex-8]

analysis:
  data:
    - Combustion parts were two thirds of sales in 2025 and have fallen for three years; the customers forecast their orders at 40% of the 2025 level by 2031 (Exhibits 4 and 6).
    - Payback favours Project B, at 3 years 5.1 months against 4 years 10.7 months for A and 5 years 4.6 months for C; the average rate of return and net present value favour A, with an ARR of 10.7% and an NPV of MX$30.0m at 10% (Exhibit 3).
    - If Norvalia's volumes are 30% below forecast, Project A's NPV falls to −MX$33.0m; it turns negative once volumes are about 14% short.
    - Six of the 140 welders are qualified in aluminium, and gearing is 13.6% before any new loan (Exhibits 2 and 7).
  insight:
    - The methods disagree because they measure different things. Payback rewards speed and so favours B's early returns; NPV counts every year and when it arrives, and so favours A's larger, later returns.
    - Project B is efficient harvesting. It pays back fast because it squeezes a shrinking business, and after 2031 there is little left to squeeze.
    - Project A's value rests on one customer's volumes. On the board's own estimate of a 40% chance that volumes are 30% lower, its expected NPV is about MX$4.8m, close to B's MX$4.6m, but with a far wider spread of outcomes.
  options:
    - Project A builds the company's future, at the price of a large bet on one customer and a demanding change for the workforce.
    - Project B is safe and quick, and leaves the company smaller and more dependent on a declining product.
    - Project C reduces dependence on carmakers, but with an NPV of MX$1.3m it barely earns the 10% the money costs.
    - Waiting keeps the cash and loses the only contract for an electric-vehicle part on offer.
  recommendation: >
    One defensible recommendation: bid for the Norvalia contract and rebuild Line 2 (Project A), but only on terms
    that cut its volume risk, such as a minimum yearly volume or a price that rises if volumes fall short, and with
    enclosure cells designed so that other electric-vehicle makers could be served too. Start the aluminium training
    now, with a promise that retrained welders keep their jobs, and agree the plan with the workers' representative
    before the bid goes in. Keep the combustion lines running without further investment while they still earn cash.
  caveat: >
    If Norvalia will give no protection on volumes, Project A's downside is large for a family company: a 30%
    shortfall would destroy MX$33.0m of value. In that case Project C, which reduces the dependence on carmakers,
    would be the more prudent choice, and the family should accept that Quintanilla will be a smaller company in
    2031.

method: >
  Quintanilla Autopartes, Norvalia Motors, Agrimaq del Norte and everyone in this case are fictional, and every
  figure is simulated. Each project's net cash flows are stated assumptions. Payback assumes that each year's cash
  arrives evenly through the year; the average rate of return and net present value use the formulas the IB gives,
  and net present value uses the discount factors printed in the IB's table. A script in the repository
  (`scripts/qa/case-figures.py`) rebuilds every exhibit and checks every figure in the text, and the unit tests
  recompute every appraisal with the platform's investment functions.


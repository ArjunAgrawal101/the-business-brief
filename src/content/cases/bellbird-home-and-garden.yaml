    source: Fictional email, written for this case.

constraints:
  - The overdraft limit is A$1,500k and the bank will not raise it. A short excess is accepted only under a plan, agreed in advance, that clears it within a month (Exhibit 7).
  - The spring range has already been ordered and shipped. The invoices will arrive whatever Bellbird decides.
  - New shares need the agreement of all three shareholders, and the family has said it will not give up control of the company.
  - A sale and leaseback takes about eight weeks to complete, so its cash cannot arrive before September.
  - Closing a store means paying out the rest of its lease and redundancy pay to its staff.

stakeholders:
  - name: Helen Marsh, managing director and shareholder
    interest: Growth, with the business still in the family's hands.
    influence: high
    stake: high
    concern: Being the generation that sold the land, gave away control or closed a store a year after opening it.
  - name: Jim Marsh, founder, director and shareholder
    interest: The business he built, and the Mount Gravatt site where it began.
    influence: high
    stake: high
    concern: Selling the freehold to solve a problem that lasts three months.
  - name: Peter Marsh, shareholder outside the business
    interest: Dividends and the value of his shares.
    influence: medium
    stake: medium
    concern: Dilution if new shares are sold, or a cut in dividends.
  - name: Lena Kowalski, finance manager
    interest: A plan the bank will accept, and a forecast that holds.
    influence: medium
    stake: high
    concern: A breach of the limit that damages her credibility with the bank.
  - name: Moreton Commercial Bank
    interest: Repayment, and security for what it lends.
    influence: high
    stake: medium
    concern: Lending more to a business whose liquidity has fallen.
  - name: Harbourline Outdoor Imports and other suppliers
    interest: Payment on time.
    influence: medium
    stake: medium
    concern: Being used as a free source of finance by a customer that already pays late.
  - name: Coralwood staff (24)
    interest: Their jobs.
    influence: low
    stake: high
    concern: Closure after a single year.
  - name: Trade customers
    interest: Stock on the shelves and credit on their accounts.
    influence: medium
    stake: medium
    concern: Empty shelves in spring, or credit tightened to save cash.
  - name: Kerry Tan, possible investor
    interest: A return on A$1.5m and a say in how it is used.
    influence: medium
    stake: medium
    concern: Buying into a business that is short of cash.

options:
  - id: sale-leaseback
    label: Sell and lease back the Mount Gravatt site
    summary: Sell the freehold of the Mount Gravatt store and warehouse to a property investor for A$2.4m and lease it back for fifteen years.
    requires: A buyer within eight weeks, and the family's agreement to sell the land the business started on.
    upside: Raises far more cash than any other option, clears the overdraft from September and leaves money to spare.
    risks: Too late for August, so the bank must accept a short excess. Adds rent of A$216k a year for fifteen years, and loses the main asset behind the business's borrowing.
    evidence: [ex-6, ex-7]
  - id: working-capital
    label: Working capital package
    summary: Clear the slow-moving stock in a sale, and ask suppliers to take A$600k of September's payments in November and December.
    requires: Harbourline's agreement before the containers land, and a clearance sale that does not undercut full-price lines.
    upside: Keeps the overdraft within the limit in every month and turns stock that is not selling into cash.
    risks: A one-off loss of A$200k on the cleared stock; depends on suppliers who have already been paid late; leaves the causes of the problem in place.
    evidence: [ex-3, ex-5, ex-6, ex-8]
  - id: close-coralwood
    label: Close the Coralwood store
    summary: Close the loss-making store opened in August 2025 and move its stock to the other stores.
    requires: Paying out the lease and redundancy pay, and telling 24 staff that their store will close after a year.
    upside: Removes a store that lost A$307k in its first year, and improves profit in every year after.
    risks: Costs A$240k in August, so the overdraft is worse this spring, not better. The store may have been about to turn the corner.
    evidence: [ex-4, ex-6]
  - id: new-equity
    label: Sell a fifth of the company
    summary: Issue new shares worth A$1.5m to Kerry Tan, a family friend, for a fifth of the enlarged company.
    requires: All three shareholders to agree, and terms on dividends and a seat on the board.
    upside: Permanent finance that carries no interest, lowers gearing and brings the balance within the limit from September.
    risks: August is still over the limit; the family gives up a fifth of the business and some of its control; the investor will expect a return.
    evidence: [ex-2, ex-6]

analysis:
  data:
    - Sales rose by 15.8% to A$21.3m, but profit before interest and tax fell from A$920k to A$426k, and the profit margin from 5.0% to 2.0% (Exhibit 1).
    - The current ratio fell from 1.60 to 1.18 and the acid test ratio from 0.39 to 0.16. Stock rose from A$3.15m to A$4.88m, and A$1,000k of it is more than 180 days old (Exhibits 2 and 5).
    - On present plans the overdraft passes its A$1,500k limit in August, reaches A$2,280k in September and is still A$400k over the limit in October (Exhibit 3).
    - Coralwood lost A$307k in its first year, while the five established stores earned A$2,170k between them (Exhibit 4).
  insight:
    - Two problems sit on top of each other. One is seasonal, because spring stock is paid for in August and September and sold from October. The other is structural, because rapid expansion and slow-moving stock have used up the cash that once carried the business through spring. That is overtrading.
    - The gap is about A$780k at its worst, in September, and it lasts three months. A measure that adds cash permanently is larger than the problem needs; a measure whose cash arrives after August cannot prevent the first breach.
    - Closing Coralwood is the right question for profit and the wrong answer for this spring, because it costs cash before it saves any.
  options:
    - The sale and leaseback raises A$2.4m, far more than the gap, and arrives in September, after the first breach. It swaps a seasonal problem for a fifteen-year commitment.
    - The working capital package keeps every month within the limit, with the lowest balance A$1,380k overdrawn in July, at a one-off cost of A$200k. It depends on Harbourline agreeing now.
    - Closing Coralwood makes the lowest balance worse, A$2,364k overdrawn in September, but adds A$307k a year to profit from then on.
    - New shares fix September onwards and lower gearing, but leave August over the limit and cost the family a fifth of the company.
  recommendation: >
    One defensible recommendation: take the working capital package now, because it matches a short-term remedy to
    a problem that lasts three months. Agree the deferral with Harbourline before the containers land, run the
    clearance sale in August on lines more than 180 days old, and send the bank the revised forecast, which never
    passes the limit. Then deal with the cause after the season: set Coralwood a target for spring, with closure in
    the new year if it misses it; open no new store until the current ratio is back above 1.5; and buy next
    spring's range in smaller, later orders.
  caveat: >
    This rests on Harbourline agreeing to the deferral and on the clearance sale raising A$800k without drawing
    customers away from full-price lines. If either fails, September would be over the limit again, and the choice
    would be between new shares, which keep the land, and the sale and leaseback, which keeps the family's share of
    the company. If Coralwood trades as weakly this spring as in its first year, it should close in the new year
    whatever happens to the overdraft.

method: >
  Bellbird Home and Garden, its stores, its bank, its supplier, its investor and everyone in this case are
  fictional, and every figure is simulated. The statements follow the layout the IB uses; the statement of
  financial position balances in both years, and retained earnings rise by exactly the retained profit. The cash
  flow forecast starts from the overdraft at 30 June, and each option in Exhibit 6 is the base forecast with that
  option's stated cash flows added. Taxes on the options, interest on the overdraft and the accounting gain on a
  sale of the property are left out so that the comparison stays visible. A script in the repository
  (`scripts/qa/case-figures.py`) rebuilds every exhibit from these assumptions and checks every figure in the
  text, and the unit tests recompute the ratios with the platform's finance functions.


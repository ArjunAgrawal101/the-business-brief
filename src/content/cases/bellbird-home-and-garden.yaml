# Bellbird Home and Garden. A fictional organization; every figure is simulated.
# The statements balance and link across the two years, the cash flow forecast
# starts from the overdraft at 30 June 2026, and each option in Exhibit 6 is the
# base forecast plus that option's stated cash flows. scripts/qa/case-figures.py
# rebuilds every exhibit and checks every figure in the text;
# tests/unit/vault-cases.test.ts recomputes the ratios with src/lib/ratios.ts.

title: Bellbird Home and Garden
dek: A profitable family hardware chain in Brisbane will run out of overdraft just as its spring stock arrives.
kind: fictional
dataStatus: simulated
organization:
  name: Bellbird Home and Garden
  sector: Home improvement and garden retail
  location: Brisbane, Australia
  size: Seven stores and a central warehouse, 186 employees
  legalForm: Proprietary limited company (Pty Ltd), owned by one family
currency:
  code: AUD
  symbol: 'A$'
  unit: thousands of Australian dollars (A$000)
decision: How should Bellbird fund its spring stock without breaching its overdraft, and what must change so that the problem does not return next year?
brief: >
  Bellbird made a profit last year and its sales grew by 15.8%, helped by two new stores. But the expansion was
  paid for partly with the overdraft, and the stores and the warehouse are full of stock. The cash flow forecast
  shows the overdraft limit of A$1,500k breached from August to October, as the spring range arrives and has to be
  paid for before it sells. The bank will not raise the limit. The finance manager has costed four ways out, and
  each one changes something the family cares about.

narrative:
  - >
    Jim Marsh opened the first Bellbird store in Mount Gravatt, on Brisbane's south side, in 1994: timber, tools,
    paint, and a plant nursery out the back. Thirty-two years later there are seven stores, a warehouse behind the
    original site and 186 employees. Jim has retired but is still a director. His daughter, Helen Marsh, has been
    managing director since 2019. She and her father own forty per cent of the company each, and her brother Peter,
    who does not work in the business, owns the rest.
  - >
    Under Helen, Bellbird has grown faster than at any time in its history. In the year to 30 June 2026 it opened
    two stores: at Coralwood, a new housing estate on the city's southern edge, in August 2025, and at North Lakes
    in October. Sales rose from A$18.4m to A$21.3m. The new stores were fitted out for A$2.4m, paid for with a new
    bank loan and the overdraft, and stocked from the warehouse, which was already holding more than in earlier
    years.
  - >
    The profit did not follow the sales. Gross profit margin slipped as the new stores opened with discounts,
    expenses rose with two more sets of staff and rent, and profit before interest and tax fell from A$920k to
    A$426k (Exhibit 1). Coralwood lost A$307k in its first year (Exhibit 4). The cash, meanwhile, went into stock and
    fittings. At 30 June the bank account was overdrawn by A$1.2m against a limit of A$1.5m, and Bellbird owed its
    suppliers A$2.96m, more than a year earlier, partly because some invoices were being paid late (Exhibit 2).
  - >
    Now the spring range is on the water. Outdoor furniture, barbecues and pots were ordered from overseas in the
    autumn, and the invoices fall due as the containers land in August and September, before customers buy the
    goods in October, November and December. Lena Kowalski, the finance manager, has built a cash flow forecast for
    the six months to December (Exhibit 3). It shows the overdraft passing its limit in August, reaching A$2.28m in
    September, and coming back within the limit only in November.
  - >
    The bank has said no to a higher limit (Exhibit 7), and Bellbird's largest supplier wants its September
    invoices paid on time (Exhibit 8). Lena has costed four ways out (Exhibit 6): sell the Mount Gravatt freehold
    and lease it back; a working capital package of a clearance sale and longer credit from suppliers; close the
    Coralwood store; or sell a fifth of the company to a family friend for A$1.5m. Helen has to put one plan to the
    board next week, and the bank wants to see it by Friday.

industryContext:
  - >
    Home improvement and garden retail sells to two kinds of customer: households improving their homes and gardens,
    and trade customers such as builders, landscapers and handymen, who buy in larger quantities and usually on
    credit. Households pay at the till, so most of a store's sales turn into cash at once; trade customers pay
    later, on agreed terms.
  - >
    The business is seasonal and heavy with stock. In much of Australia, demand for plants, outdoor furniture and
    barbecues peaks in spring and summer, and much of that range is imported, ordered months ahead and paid for
    before it sells. A retailer's cash therefore falls as the season approaches and recovers only as customers buy.
    Customers expect range and availability, so running out is costly; but every line bought ties up cash until it
    is sold.
  - >
    Independent chains compete with large national chains that buy in great volume and compete on price. They tend
    to win on advice, service and their relationships with trade customers rather than on price. Growth means new
    stores, and each new store needs fittings and a full range of stock before it sells anything, so a chain that
    grows quickly can run short of cash even while its sales and profits rise. Accountants call this overtrading.

challenge: >
  Bellbird is short of cash, not of customers. Its forecast says the overdraft will pass its limit for three months
  while the spring stock is paid for and sold. Any plan must keep the account within the limit in August,
  September and October, keep the suppliers and the bank on side, and leave the business able to trade next year.
  Beneath the seasonal problem lies a structural one: two new stores and a build-up of slow-moving stock have
  stretched the business's working capital, and one of the new stores is losing money. The board has to decide how
  far to treat the symptom and how far the cause.

financials:
  summary: >
    The accounts show a business that grew and became less liquid at the same time. Sales rose by 15.8% in the year
    to 30 June 2026, but profit before interest and tax fell from A$920k to A$426k, and the statement of financial
    position took on A$1.2m of overdraft and A$1.1m of new long-term borrowing. Stock rose from A$3.15m to A$4.88m.
    The cash flow forecast turns those balances into months: on present plans the account is over its limit from
    August to October.
  exhibits: [ex-1, ex-2, ex-3]


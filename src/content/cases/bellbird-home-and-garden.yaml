analysisQuestions:
  - id: bb-define
    commandTerm: Define
    ao: AO1
    marks: 2
    syllabus: ['3.7']
    prompt: Define the term *working capital*.
    guidance: >
      One mark for the idea that working capital is the money available to run the business day to day, and one
      for how it is measured: current assets minus current liabilities. At 30 June 2026 Bellbird's working capital
      was A$870k (A$5,670k less A$4,800k), down from A$1,560k a year earlier.
  - id: bb-ratios
    commandTerm: Calculate
    ao: AO4
    marks: 4
    paper: paper-2
    syllabus: ['3.5']
    exhibits: [ex-2]
    prompt: Using Exhibit 2, calculate Bellbird's current ratio and acid test ratio at 30 June 2025 and at 30 June 2026.
    answer: >
      Current ratio: 2025, 4,180 ÷ 2,620 = 1.60; 2026, 5,670 ÷ 4,800 = 1.18. Acid test ratio: 2025,
      (4,180 − 3,150) ÷ 2,620 = 0.39; 2026, (5,670 − 4,880) ÷ 4,800 = 0.16.
    guidance: >
      One mark for each ratio, with its working. Write the ratios as numbers (1.18), not percentages. The fall in the
      acid test ratio is the more serious: leaving out stock, Bellbird has about sixteen cents of liquid assets for
      every dollar it owes in the short term.
  - id: bb-profit-cash
    commandTerm: Explain
    ao: AO2
    marks: 4
    syllabus: ['3.7']
    exhibits: [ex-1, ex-3]
    prompt: Explain why Bellbird made a profit in the year to 30 June 2026 and is still forecast to breach its overdraft limit.
    guidance: >
      A strong answer separates the two measures. Profit is revenue less the costs of the period, whether or not
      they have been paid; cash flow is money in and out when it moves. It then uses the case: the A$2,400k spent on
      fitting out the stores is capital expenditure, so only depreciation reaches the statement of profit or loss;
      stock rose by A$1,730k, cash spent on goods not yet sold; and the spring range is paid for in August and
      September but sold from October. Two reasons, each developed and tied to the exhibits, earn the marks.
  - id: bb-efficiency
    commandTerm: Calculate
    ao: AO4
    marks: 4
    level: HL
    paper: paper-2
    syllabus: ['3.6']
    exhibits: [ex-1, ex-2]
    prompt: Using Exhibits 1 and 2, calculate for the year to 30 June 2026 (i) the stock turnover in days and (ii) the creditor days.
    answer: >
      (i) Average stock = (3,150 + 4,880) ÷ 2 = 4,015. Stock turnover = 4,015 ÷ 14,271 × 365 = 102.7 days.
      (ii) Creditor days = 2,960 ÷ 14,271 × 365 = 75.7 days.
    guidance: >
      Two marks for each: one for the method and one for the answer. Both use the cost of sales, as the guide's
      formulas do, not sales revenue. For comparison, the figures for 2025 are 92.3 days and 60.4 days.
  - id: bb-suppliers
    commandTerm: Explain
    ao: AO2
    marks: 4
    level: HL
    syllabus: ['3.6', '1.4']
    exhibits: [ex-8]
    prompt: Explain one risk to Bellbird of paying its suppliers in 75.7 days when their terms are 60 days.
    guidance: >
      Paying suppliers late is a source of short-term finance, but it is borrowed goodwill. A strong answer explains
      a risk in Bellbird's situation: Harbourline may refuse the deferral that the working capital package depends
      on, insist on payment before it ships, or cut Bellbird's credit, which would turn a timing problem into a
      supply problem just before the spring peak. It may also raise its prices to cover the cost of waiting. One
      risk, explained and tied to the case, earns the marks.
  - id: bb-coralwood
    commandTerm: Explain
    ao: AO2
    marks: 4
    syllabus: ['3.7']
    exhibits: [ex-4, ex-6]
    prompt: Using Exhibits 4 and 6, explain why closing the Coralwood store would improve Bellbird's profit but worsen its cash position this spring.
    guidance: >
      Profit: the store lost A$307k in its first year, so closing it removes that loss from later years. Cash:
      closure costs A$240k in August, the store's sales of A$170k a month stop, and the monthly saving is only A$16k
      because most of the store's costs were wages, rent and stock that brought sales in. The lowest balance becomes
      A$2,364k overdrawn in September, worse than doing nothing. The best answers notice that the store's
      depreciation of A$115k is a cost but not a cash outflow, which is why its cash loss of A$192k a year is smaller
      than its accounting loss.
  - id: bb-evaluate
    commandTerm: Evaluate
    ao: AO3
    marks: 10
    paper: paper-2
    syllabus: ['3.2', '3.7']
    exhibits: [ex-3, ex-6, ex-7, ex-8]
    prompt: Evaluate the sale and leaseback and the working capital package as ways for Bellbird to deal with its liquidity problem.
    guidance: |
      A strong answer does four things.

      - It sizes the problem first: about A$780k over the limit at worst, for three months, on top of a structural squeeze from expansion.
      - It weighs the sale and leaseback: A$2.4m is far more than the gap, arrives after the August breach, adds A$216k of rent a year for fifteen years and sells the asset that secures the bank's lending; but it lowers gearing and leaves room for next year.
      - It weighs the package: within the limit every month at a one-off cost of A$200k, matched to a short-term need, but dependent on Harbourline and on a clearance sale that does not draw customers away from full-price lines.
      - It reaches a judgement that depends on whether the problem is seasonal or structural, and says what evidence would change it.

      Answers that describe both options without weighing them against the size and timing of the gap stay in the middle of the range.

exercise:
  role: You are Lena Kowalski, Bellbird's finance manager.
  brief: >
    The board meets on Tuesday, and the bank wants a plan by Friday. Helen has asked you to recommend one of the
    options in Exhibit 6 and to say what Bellbird must change before next spring. The family will read your memo
    closely: Jim does not want to sell the land, Peter does not want his share diluted, and Helen does not want to
    close a store she opened a year ago.
  task: Choose one alternative and defend it against the forecast, the bank's terms and the family's aims.
  deliverable: A memo to the board of about 250 words, giving your choice, the forecast it produces, its main risk and two changes for next year.
  minutes: 35
  criteria:
    - Uses the forecast, stating the lowest closing balance and the months over the limit under the chosen option (Exhibit 6).
    - Separates the seasonal problem from the structural one, and says which one the choice deals with.
    - Weighs the stakeholders whose agreement the choice needs, above all the bank, Harbourline and the family.
    - Says what would make the choice wrong, and what Bellbird would do then.

debrief:
  summary: >
    Bellbird's problem is a three-month shortfall of about A$780k at its worst, sitting on top of a year of fast
    growth that used up the business's working capital. The strongest plans match the remedy to that shape:
    short-term finance for the seasonal gap now, and a separate decision, after the season, about the expansion that
    caused it.
  byOption:
    - option: sale-leaseback
      fit: conditional
      body: >
        It solves the problem with room to spare, but it is a long-term answer to a short-term gap. The cash arrives
        in September, so August is still A$140k over the limit, and the business takes on A$216k of rent a year for
        fifteen years in exchange for the asset that secures its borrowing. Defensible if you read the problem as
        structural and expect to need the money for several springs, or if the family plans further growth; weak if
        the gap is seasonal.
    - option: working-capital
      fit: strong
      body: >
        The only option that keeps every month within the limit: the lowest balance is A$1,380k overdrawn, in July,
        and the account is in credit by December. The cost is a one-off loss of A$200k on stock that was not
        selling. Its weakness is that it depends on Harbourline, which has already been paid late, and it leaves the
        causes in place, so it must come with changes to buying and to expansion.
    - option: close-coralwood
      fit: weak
      body: >
        Right for profit, wrong for this spring. Closure costs A$240k in August and then saves only A$16k a month,
        so the lowest balance becomes A$2,364k overdrawn in September, worse than doing nothing. Coralwood's future
        is a real question, best decided on its spring trading rather than in a cash crisis.
    - option: new-equity
      fit: conditional
      body: >
        Permanent finance that lowers gearing and clears the account from September, without the rent of a
        leaseback. But August is still over the limit, and the family gives up a fifth of the company to solve a
        problem that lasts three months. Strong if Bellbird wants to keep growing; expensive if it does not.
  tradeoffs:
    - Speed against size. The package acts in August with modest sums; the leaseback and the new shares raise more, but only from September.
    - Once against every year. The package costs A$200k once; the leaseback costs A$216k a year for fifteen years.
    - Control against cost. New shares carry no interest or rent, but cost a fifth of the company.
    - Profit against cash. Closing Coralwood helps the first and hurts the second this spring.
  evidenceThatMatters:
    - The size and length of the gap, A$780k over the limit at worst and for three months (Exhibit 3).
    - When each option's cash arrives, month by month (Exhibit 6).
    - The A$1,000k of stock more than 180 days old, which is cash waiting to be released (Exhibit 5).
    - The supplier's offer to talk about terms before the containers land (Exhibit 8).
  changeYourMind:
    - Harbourline refuses the deferral. The package then fails in September, and the choice is between new shares and the leaseback.
    - The forecast is too hopeful about spring sales. A larger, longer gap points to permanent finance.
    - The family decides to keep opening stores. New shares or the leaseback would then fund that growth as well as this spring.
  commonErrors:
    - Treating profit as cash. Bellbird is profitable and still short of cash.
    - Choosing the option that raises the most money rather than the one that fits the size and timing of the gap.
    - Missing that the leaseback and the new shares arrive after the August breach.
    - Recommending the closure of Coralwood as a cash measure without reading its month-by-month effect.

frameworks:
  - name: The working capital cycle
    use: >
      Cash leaves Bellbird when it pays for stock and comes back when the stock sells. The spring range lengthens
      the cycle just as the business has least cash in it, and slow-moving stock lengthens it all year.
    terms: [working-capital, working-capital-cycle]
    subtopics: ['3.7']
  - name: Profit and cash flow
    use: >
      The key distinction in the case: a profitable year can end with an overdraft, because fittings and stock use
      cash without appearing as expenses, and because sales and payments fall in different months.
    terms: [profit, cash-flow, cash-flow-forecast, net-cash-flow, closing-balance]
    subtopics: ['3.7']
  - name: Liquidity ratios
    use: >
      The current ratio and the acid test ratio measure the squeeze at the year end; the acid test ratio, which
      leaves stock out, shows it most clearly.
    terms: [current-ratio, acid-test-ratio, liquidity]
    subtopics: ['3.5']
  - name: Efficiency ratios
    level: HL
    use: >
      Stock turnover in days and creditor days show where the cash went: into stock that sells more slowly, partly
      financed by paying suppliers later than their terms. Gearing shows how much of the expansion was borrowed.
    terms: [stock-turnover, creditor-days, debtor-days, gearing-ratio]
    subtopics: ['3.6']
  - name: Overtrading
    use: >
      Growth that outruns the working capital needed to support it. Bellbird's two new stores needed fittings and
      stock before they sold anything, and one of them lost money.
    terms: [overtrading]
    subtopics: ['3.7']
  - name: Matching sources of finance to the need
    use: >
      A seasonal gap suits short-term finance; a permanent need suits long-term finance. The case's options span the
      range, from supplier credit and a clearance sale to a sale and leaseback and new share capital.
    terms: [short-term-finance, long-term-finance, sale-and-leaseback, share-capital, overdraft, trade-credit]
    subtopics: ['3.2']
  - name: Stakeholder conflict
    use: >
      Each option needs a different stakeholder's agreement and costs a different stakeholder something: the bank's
      security, the supplier's patience, the family's land or control, or the Coralwood staff's jobs.
    terms: [stakeholder-conflict, stakeholder]
    subtopics: ['1.4']

discussion:
  - >
    Overtrading is often called a problem of success. Using Bellbird's figures, separate the part of the cash
    shortfall caused by growth from the part caused by the season, and say which part each option addresses.
  - >
    A sale and leaseback turns an owned asset into a long lease. How would a lender and an equity investor each read
    the transaction, and how would the lease appear in Bellbird's accounts under the accounting standards you study?
  - >
    Set out, as measurable targets, what next spring's forecast and this spring's trading would need to show before
    the board approves another store.


      attribution: Dev Kaur, day-shift team leader, fourteen years at Halden
    source: Fictional interview, written for this case.

constraints:
  - Four months to the client's deadline.
  - Pay is set by the owners and can change only at the annual review in April.
  - The system's supplier will train up to twenty people a week on site, at no extra cost under the contract.
  - Recruiting a new team leader takes about two months.

stakeholders:
  - name: Amara Osei, site manager
    interest: Restoring performance, keeping the client and establishing her authority.
    influence: high
    stake: high
    concern: Failing in her first role at Halden, in front of owners who hired her from outside.
  - name: Night-shift pickers (58)
    interest: Being trained, consulted and treated fairly.
    influence: medium
    stake: high
    concern: More pressure without more support.
  - name: Day-shift pickers (82)
    interest: Stability and fair treatment.
    influence: medium
    stake: medium
    concern: Being blamed or burdened for the night shift's problems.
  - name: Team leaders
    interest: Authority to run their teams, and support when they need it.
    influence: medium
    stake: high
    concern: Being bypassed by the new manager, or left alone with problems they cannot solve.
  - name: Lumen Home
    interest: On-time dispatch above 97%.
    influence: high
    stake: medium
    concern: Its own customers' next-day promise.
  - name: Halden's owners
    interest: Keeping the client and the site's profitability.
    influence: high
    stake: high
    concern: A third of the warehouse's work leaving at the end of the year.

options:
  - id: autocratic
    label: Autocratic turnaround
    summary: Set targets, enforce the system and discipline repeated errors; decide everything centrally.
    requires: Clear standards, daily monitoring and the authority to enforce them.
    upside: Fast, visible change in effort and compliance.
    risks: Treats a skills gap as a discipline problem; more night-shift staff may leave.
    evidence: [ex-2, ex-5]
  - id: paternalistic
    label: Paternalistic care
    summary: Restore the founder's approach, with personal care, welfare and loyalty, while deciding herself.
    requires: Time on the floor and the trust of long-serving staff.
    upside: Rebuilds morale and loyalty quickly among those who valued the founder's style.
    risks: Does not by itself build the skills the new system needs.
    evidence: [ex-3, ex-6]
  - id: democratic
    label: Democratic redesign
    summary: Involve staff in redesigning how the system is used, and act on their proposals.
    requires: Working groups, time, and a commitment to act on what they find.
    upside: Uses the knowledge of the people doing the work; builds commitment to the result.
    risks: Slow at first, with a deadline four months away.
    evidence: [ex-3, ex-5]
  - id: laissez-faire
    label: Laissez-faire delegation
    summary: Give each team leader full authority over their own area.
    requires: Capable, experienced team leaders.
    upside: Frees the experienced day-shift team leaders to use their judgement.
    risks: Leaves the night shift's new team leaders without support.
    evidence: [ex-2]
  - id: situational
    label: Situational leadership
    summary: Lead each team according to its readiness, with direction and training for nights, delegation for days and consultation on the system.
    requires: A clear reading of each team's needs, and a willingness to explain the difference.
    upside: Matches the style to the problem where it is.
    risks: Different treatment of the two shifts can look unfair until it is explained.
    evidence: [ex-2, ex-3]

analysis:
  data:
    - On-time dispatch has fallen from 98.1% to 91.4% since the system went live, and errors have risen from 2.1 to 5.2 per 1,000 orders (Exhibit 1).
    - Labour turnover is 34.1% for the site, but 51.9% on nights against 22.2% on days (Exhibit 2).
    - Night-shift staff had two hours of training on the system against six on days, and their team leaders have less than a year's experience (Exhibit 2).
    - Only 21% of the night shift feel consulted and 33% feel trained (Exhibit 3). Eleven of the twenty-four leavers interviewed blamed the scanners (Exhibit 5).
  insight:
    - The problem is concentrated on one shift. It is mainly a problem of skill and of how the change was introduced, not of effort. That points away from a single style for the whole site.
    - The day shift is capable and settled. The night shift is new to its work, and its leaders are new to theirs. The two need different things from a leader.
    - The deadline is four months away. That is long enough to consult and train, and too short to let things drift.
  options:
    - Autocratic control would raise effort quickly, but it leaves the skills gap and loses more night-shift staff.
    - Paternalistic care would rebuild loyalty, but not capability.
    - A democratic redesign uses the night shift's knowledge of the system's faults, but starts slowly.
    - Laissez-faire suits the day shift and fails the night shift.
    - A situational approach combines direction and training for nights, delegation for days and consultation on the system.
  recommendation: >
    One defensible recommendation: lead situationally. Be directive with the night shift for the first six weeks, with
    daily coaching on the floor and full training on the system for every picker. Delegate to the experienced
    day-shift team leaders. Run a joint working group on how the system is used, and promise to act on what it finds.
    Explain openly why the two shifts are being led differently, and move the night shift towards more consultation
    as its skills grow.
  caveat: >
    The recommendation rests on reading the problem as one of skill rather than effort. If the exit interviews and the
    survey had pointed mainly to pay or to the shift pattern, the answer would be different: no leadership style fixes
    a wage that is below the market.

method: >
  Halden Distribution, Lumen Home and everyone in this case are fictional, and every figure is simulated. The figures
  are built to be consistent with one another. Labour turnover, for example, is calculated from the leavers and
  average employees in Exhibit 2, and the tests in the repository recompute it. The outcomes in the Decision Room are
  one plausible simulation of each approach, built on the reading of the evidence in the analysis. They are not
  predictions, and a different reading of the evidence would produce different outcomes.


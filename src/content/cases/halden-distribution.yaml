# Halden Distribution. A fictional organization; every figure is simulated.
# Labour turnover in Exhibit 2 is calculated from the leavers and average
# employees in the same exhibit; tests/unit/cases.test.ts recomputes it.

title: Halden Distribution
dek: A new site manager has four months to turn round a warehouse whose staff were led one way for fifteen years.
kind: fictional
dataStatus: simulated
organization:
  name: Halden Distribution
  sector: Warehousing and order fulfilment for online retailers
  location: Leeds, United Kingdom
  size: One warehouse, 140 employees on a day shift and a night shift
  legalForm: Private limited company
currency:
  code: GBP
  symbol: '£'
  unit: pounds sterling (£)
decision: How should the new site manager lead in her first ninety days, and should she lead both shifts the same way?
brief: >
  Halden's warehouse was run for fifteen years by a founder who decided everything himself and looked after his
  staff. Since a new scanning system arrived, dispatch has fallen, errors have doubled and nearly half the night
  shift has left. The largest client has set a deadline. The new site manager must decide how to lead.

narrative:
  - >
    For fifteen years Halden Distribution's warehouse on the edge of Leeds was run by the man who founded it. Graham
    Pell knew every picker by name, decided everything himself, handed out a bonus before Christmas and was, by most
    accounts, liked. When he retired in the spring, Halden's owners did not promote anyone from inside. They hired
    Amara Osei, an operations manager from a national retailer's distribution centre, who started in July.
  - >
    She inherited a problem that had begun before her. Last December, under pressure from its largest client, Halden had
    introduced a warehouse management system with handheld scanners that tell pickers what to pick and in what order.
    The day shift, most of whom had been at Halden for years, were trained for six hours each and adapted. The night
    shift, younger, newer and led by two team leaders promoted in the spring, were trained for two. Since then,
    on-time dispatch has fallen from 98% to 91.4%, picking errors have more than doubled, and over half of the night
    shift has left within the year.
  - >
    In July, in Amara's first week, Lumen Home, an online homeware retailer whose orders fill a third of the warehouse, set a deadline:
    on-time dispatch back above 97% by the first week of November, when its peak season begins, or it will move its
    contract when the current year ends. That gives Amara about four months.
  - >
    Her own experience is of large sites where targets were set centrally and enforced. The team leaders she inherited
    expect something closer to Graham. The survey she ran in her third week (Exhibit 3) suggests that the night
    shift's problem is not effort. It is that nobody asked them how the system should work, and nobody showed them.
  - >
    Amara has to decide how to lead: what to decide herself, what to delegate, whom to consult and how much, and
    whether to lead both shifts in the same way.


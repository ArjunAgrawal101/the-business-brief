constraints:
  - The new electricity tariff starts on 1 November.
  - The kiln can fire 1,200 mugs a month. Firing more would need a second kiln, which the studio cannot afford this year.
  - Inês wants Atelier Barro to be known as a maker of premium, hand-made pieces, not as a supplier of cheap ones.

stakeholders:
  - name: Inês Carvalho, owner
    interest: A business that pays her a living and keeps its reputation for premium, hand-made work.
    influence: high
    stake: high
    concern: Being forced into a price war, or into making cheap mugs for other brands.
  - name: Rui Mendes, studio manager
    interest: A stable business and a sensible workload in the shop and at dispatch.
    influence: medium
    stake: high
    concern: A rushed November with the hotel order on top of the busy season.
  - name: The two throwers
    interest: Earnings, which depend on the number of mugs made.
    influence: low
    stake: high
    concern: Fewer mugs, and so lower pay, if sales fall after a price rise.
  - name: Online and studio customers
    interest: Distinctive, well-made mugs at a price they consider fair.
    influence: medium
    stake: medium
    concern: Paying more, or discovering the same mugs in hotel rooms at half the price.
  - name: Casa Alfama Hotels
    interest: Distinctive local mugs for its rooms at a price that suits its budget.
    influence: medium
    stake: low
    concern: Delivery on time for its guests' winter season.
  - name: The electricity supplier
    interest: Covering its own higher costs.
    influence: low
    stake: low
    concern: None in this decision; its tariff is fixed.

options:
  - id: absorb
    group: Pricing
    label: Keep the price at €22
    summary: Absorb the higher electricity costs.
    requires: Nothing new.
    upside: Customers see no change and sales should hold at about 640 mugs.
    risks: Contribution per mug falls and the margin of safety narrows.
    evidence: [ex-1]
  - id: raise-24
    group: Pricing
    label: Raise the price to €24
    summary: A modest rise, tested on the website for two weeks.
    requires: A new price on the website and in the shop.
    upside: Higher contribution per mug, on the best-tested estimate of demand.
    risks: Fewer mugs sold (about 590), so the throwers make and earn less.
    evidence: [ex-1, ex-3]
  - id: premium-25
    group: Pricing
    label: Raise the price to €25 with premium packaging
    summary: Reposition the mugs as gifts, with new packaging at €0.60 a mug more.
    requires: New packaging and a change in how the mugs are presented.
    upside: The highest contribution per mug.
    risks: The sales estimate of 580 mugs rests on an untested assumption about the packaging.
    evidence: [ex-1, ex-3]
  - id: cut-marketing
    group: Pricing
    label: Keep €22 and cut marketing
    summary: Reduce social media advertising from €480 to €200 a month.
    requires: Nothing new.
    upside: Lower fixed costs and a lower break-even quantity, if sales hold.
    risks: Online sales depend on the advertising and may fall.
    evidence: [ex-1]
  - id: accept
    group: The hotel order
    label: Accept the hotel's order at €11
    summary: Make 300 stamped mugs for Casa Alfama in November.
    requires: Spare capacity in November, a custom stamp and bulk packaging.
    upside: Each mug adds €5.15 of contribution; the order adds €1,395 to November's profit.
    risks: The brand's price position, and a tight November with the kiln at 94% of capacity.
    evidence: [ex-4, ex-5]
  - id: negotiate
    group: The hotel order
    label: Make a counter-offer
    summary: Ask for €13.50 a mug.
    requires: Judgement about how much the hotel wants these mugs.
    upside: A higher contribution per mug if the hotel agrees.
    risks: The hotel may buy elsewhere.
    evidence: [ex-4, ex-5]
  - id: decline
    group: The hotel order
    label: Decline the order
    summary: Keep the mugs at the studio's own prices only.
    requires: Nothing.
    upside: The price position and November's capacity are protected.
    risks: €1,395 of profit is given up, and possibly a customer who might order again.
    evidence: [ex-4]

analysis:
  data:
    - From November, monthly costs rise from €8,060 to €8,140 and variable cost per mug from €6.88 to €7.18 at €22 (Exhibit 1).
    - At €22, contribution per mug falls from €15.12 to €14.82, and the break-even quantity rises from 534 to 550 mugs a month (€8,140 ÷ €14.82 = 549.26, rounded up).
    - The survey suggests about 590 mugs a month at €24 and 560 at €25 (Exhibit 3).
    - Each hotel mug would have a variable cost of €5.85. The order would add (€11.00 − €5.85) × 300 − €150 = €1,395 (Exhibit 5).
  insight:
    - Most of the studio's costs do not change with output, so the question to ask of each decision is what it does to contribution.
    - On the survey's estimates, a price of €24 raises contribution per mug by more than it loses in volume. Profit at €24 is €1,736.60 a month, against €1,344.80 at €22.
    - The hotel's price is below the average cost of a mug sold in the shop, about €20, but well above the variable cost of a hotel mug. With spare capacity in November, the order adds profit.
  options:
    - Keeping €22 protects customers and narrows the margin of safety to 90 mugs.
    - A rise to €24 restores profit and the margin of safety on tested evidence.
    - A rise to €25 with new packaging could do slightly better, but only if an untested assumption holds.
    - Cutting marketing lowers break-even and risks the sales that marketing brings in.
  recommendation: >
    One defensible recommendation: raise the price to €24, the option with the strongest evidence behind it, and
    accept the hotel's order, negotiating only if Inês judges that the hotel would still buy. Ask for the stamp to read
    "made by Atelier Barro for Casa Alfama", so that the order also advertises the studio. Review the price after three
    months against actual sales.
  caveat: >
    This depends on the survey being right about customers' response to €24, and on the hotel's order not leading
    shop customers to expect lower prices. If the hotel wanted its mugs in December, when the kiln is close to full,
    accepting would displace sales at full price and the answer would change.

method: >
  Atelier Barro and everyone in this case are fictional, and every figure is simulated. Exhibit 1 is the only source
  of costs. Every contribution, break-even, margin of safety and profit figure in the case, the Finance Desk and the
  Decision Room is calculated from it by the platform's finance functions. The tests in the repository recompute
  them. The sales estimates in Exhibit 3 are stated assumptions, not results. Break-even quantities are rounded up
  to whole mugs, because one mug fewer would leave a loss.


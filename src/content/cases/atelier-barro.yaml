# Atelier Barro. A fictional organization; every figure is simulated.
# Exhibit 1 is the only source of costs. Every contribution, break-even,
# margin of safety and profit figure on the platform for this case is computed
# from it by src/lib/finance.ts, and tests/unit/cases.test.ts checks them.

title: Atelier Barro
dek: A ceramics studio in Porto faces an energy price rise and an order at half its usual price, in the same week.
kind: fictional
dataStatus: simulated
organization:
  name: Atelier Barro
  sector: Hand-made ceramics (stoneware mugs)
  location: Porto, Portugal
  size: One studio; the owner, a studio manager and two throwers
  legalForm: Private limited company
currency:
  code: EUR
  symbol: '€'
  unit: euros (€) a month
decision: How should Atelier Barro respond to higher energy costs, and should it accept the hotel's order?
brief: >
  Atelier Barro sells about 640 hand-thrown mugs a month at €22. From November its electricity costs rise, and a
  hotel group has offered to buy 300 mugs at €11 each. To decide either question the owner needs to know what each
  mug really costs, which costs change with output and which do not, and how many mugs the studio must sell to
  cover its costs.

narrative:
  - >
    Inês Carvalho left an architecture practice in 2021 to throw pots in a former printing workshop in Porto's
    Bonfim district. Atelier Barro now sells about 640 hand-thrown stoneware mugs a month, seven in ten through its
    own website and the rest in the studio shop, at €22 each. Two throwers make the mugs and are paid €2.40 for each
    one that passes inspection. A studio manager, Rui Mendes, runs the shop, the website and the dispatch table.
  - >
    The business pays its way, just. After every cost, including the salary Inês pays herself, the mugs made about
    €1,600 a month last year. Weekend workshops and firing other potters' work in the kiln bring in more, but Inês
    keeps those figures separate and does not count on them.
  - >
    This autumn two letters arrived in the same week. The electricity supplier announced a new tariff from
    1 November: the cost of firing the kiln rises from €0.45 to €0.75 a mug, and the monthly standing charge from
    €260 to €340. And Casa Alfama Hotels, a small group of boutique hotels in Lisbon, asked whether Atelier Barro
    would make 300 mugs stamped with the hotels' name, for delivery in November, at €11 each.
  - >
    Inês's first reaction to the hotel was to say no. €11 is half her shop price, and she suspects it is less than a
    mug costs her to make. Her first reaction to the electricity bill was to raise prices. Rui is less sure on both
    counts. He points out that most of the studio's costs do not change with the number of mugs, that the throwers
    are paid by the mug in any case, and that their customer survey (Exhibit 3) suggests some customers would stop
    buying at a higher price.
  - >
    Before deciding either question, Inês has asked Rui to put the numbers in front of her.


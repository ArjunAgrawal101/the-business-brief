# Silvertree Clinics. A fictional organization; every figure is simulated.
# Labour turnover is leavers divided by the average number of nurses, times
# 100. Each leaver costs recruitment plus 80 agency shifts at the agency
# premium, and each option in Exhibit 7 applies the head of people's estimate
# of turnover to that cost. scripts/qa/case-figures.py rebuilds every exhibit
# and checks every figure in the text; tests/unit/vault-cases.test.ts
# recomputes turnover with src/lib/finance.ts.

title: Silvertree Clinics
dek: A Cape Town clinic network is losing a third of its nurses a year, and a pay rise has already failed to stop them.
kind: fictional
dataStatus: simulated
organization:
  name: Silvertree Clinics
  sector: Private primary health care (family medicine clinics)
  location: Cape Town, South Africa
  size: Six clinics, 210 employees, of whom 96 are nurses
  legalForm: Private company, owned by its two founding doctors and an investor
currency:
  code: ZAR
  symbol: 'R'
  unit: millions of rand (R m), and rand for costs per nurse or shift
decision: How should Silvertree keep its nurses, now that a pay rise has not worked?
brief: >
  Thirty nurses left Silvertree's six clinics in 2025, and every vacancy was covered by agency nurses who cost more
  and do not know the patients. Agency costs rose by more than half, waiting times lengthened, and patients rated
  their care lower at the clinics that lost most staff. A pay rise in January made more nurses feel fairly paid, but
  turnover rose anyway. The new head of people has evidence on why nurses leave and five costed options, and the
  cheapest one on paper does nothing about the cause.

narrative:
  - >
    Two doctors, Pieter van Wyk and Aisha Patel, opened the first Silvertree clinic in Observatory in 2012, offering
    family medicine at prices that working families could afford. There are now six Silvertree clinics across Cape
    Town, from Sea Point to Mitchells Plain, with 210 employees. In 2019 the founders sold a share of the company to an
    investor, Atlantic Health Partners, to fund the last three clinics. Patients pay for each visit or through their
    medical insurance.
  - >
    Nurses are the business. They run the triage, the chronic medicine reviews, the vaccinations and most of the
    follow-up care, and patients come back to the nurses they know. In 2025, 30 of Silvertree's 96 nurses left (Exhibit
    3). Each vacancy was covered by agency nurses until it was filled, and agency spending rose from R6.30m to R10.08m
    (Exhibit 1). At the clinics that lost most nurses, patients waited longest and rated their care lowest (Exhibit 6).
  - >
    The owners had seen the problem coming. In January 2025 they gave every nurse a 6% pay rise, the largest in
    Silvertree's history. The staff survey a few months later showed that far more nurses now felt fairly paid; but
    turnover rose and fewer nurses said they intended to stay (Exhibit 4).
  - >
    Thandiwe Mokoena joined as head of people in September. Her first act was to read the exit interviews (Exhibit 5).
    Her second was to visit Observatory, the one clinic where nurses stay. Its manager, Grace Adams, lets the nurses
    plan the rota together and swap shifts among themselves, and sends one nurse a year on a course of their choosing
    (Exhibit 8).
  - >
    Thandiwe has costed five options, from another pay rise to a single contracted agency (Exhibit 7). The investor
    wants the profit margin back above 10% (Exhibit 9); the founders want clinics where nurses stay and patients see
    the same faces. The board meets next month.

industryContext:
  - >
    Primary care clinics are the first stop for most patients: consultations, chronic medicines, vaccinations and
    minor procedures. In South Africa, private clinics serve patients who pay for each visit or are covered by medical
    insurance, alongside a large public health system.
  - >
    Nurses are central to the work and in demand far beyond any one city, so experienced nurses can move between
    employers, between public and private health care, and between countries. Clinics that cannot keep nurses fill
    the gaps with agency staff, who cost more and do not know the clinic's patients or systems.
  - >
    Clinic work runs on rosters of early, late and weekend shifts that must cover the opening hours. For many nurses,
    how rotas are set, how much say they have in them, and whether there is a path to more skilled work matter as much
    as pay.

challenge: >
  Silvertree is losing nurses faster than it can replace them, and the cost appears three times over: in agency fees,
  in recruitment, and in patients who wait longer to see staff who do not know them. The obvious remedy, more pay, has
  been tried. The board must choose how to keep its nurses on the evidence of why they leave, at a cost the business
  can sustain, and without mistaking a cheaper way of covering vacancies for a way of preventing them.

financials:
  summary: >
    Revenue grew by 4.0% in 2025, but profit before interest and tax fell from R15.60m to R14.76m, and the profit
    margin from 10.4% to 9.5%, mainly because agency staff cost R3.78m more. Each nurse who leaves costs Silvertree
    about R173,000: R45,000 to recruit and induct a replacement, and 80 agency shifts at R1,600 more than an employed
    nurse's shift while the post is empty. Thirty leavers cost about R5.19m in 2025.
  exhibits: [ex-1, ex-2]


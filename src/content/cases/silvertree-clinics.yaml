      - { label: The clinic manager, value: '2' }
      - { label: Moving away, value: '1' }
    note: Each leaver gave one main reason.
    source: Simulated teaching data, from exit interview notes.

  - id: ex-6
    title: Patients by clinic, 2025
    kind: table
    provenance: simulated-data
    columns:
      - { label: Clinic }
      - { label: Average wait to be seen (minutes), numeric: true }
      - { label: Patients rating their care good or very good (%), numeric: true }
    rows:
      - [Observatory, 24, 91]
      - [Bellville, 51, 72]
      - [Mitchells Plain, 44, 78]
      - [Wynberg, 39, 81]
      - [Durbanville, 31, 86]
      - [Sea Point, 37, 82]
    source: Simulated teaching data, from the booking system and the patient feedback cards.

  - id: ex-7
    title: Five ways to keep nurses, with the head of people's estimates
    kind: table
    provenance: simulated-data
    columns:
      - { label: Option }
      - { label: Yearly cost (R m), numeric: true, format: d2 }
      - { label: Forecast labour turnover (%), numeric: true, format: d1 }
      - { label: Nurses leaving a year, numeric: true, format: d1 }
      - { label: Yearly cost of turnover (R m), numeric: true, format: d2 }
      - { label: Net yearly effect (R m), numeric: true, format: d2 }
    rows:
      - ['Pay rise of 8%', 3.23, 28, 26.9, 4.65, -2.69]
      - [Self-rostering and flexible shifts, 0.6, 22, 21.1, 3.65, 0.94]
      - [Clinical career ladder, 2.4, 20, 19.2, 3.32, 0.67]
      - [Team leaders in every clinic, 1.5, 25, 24, 4.15, -0.46]
      - [One contracted agency, 0, 31.3, 30, 4.23, 0.96]
    note: |
      Turnover in 2025 cost R5.19m. The net yearly effect is that cost less the option's cost of turnover, less the option's own cost, plus any new revenue; a negative figure leaves Silvertree worse off. Turnover forecasts are the head of people's estimates.

      - Pay rise of 8%: a second rise for all 96 nurses.
      - Self-rostering and flexible shifts: nurses plan each clinic's rota together, with rostering software and an hour a week of a manager's time, as at Observatory.
      - Clinical career ladder: senior nurse posts, mentoring, and training towards nurse-led clinics for minor illness, which would bring in about R1.2m a year of new revenue. The effect on turnover is expected from the second year.
      - Team leaders in every clinic: a team leader for every six or so nurses, to narrow each manager's span of control.
      - One contracted agency: a single agency at R3,800 a shift in place of R4,200. Turnover is unchanged.
    source: Simulated teaching data, prepared by the head of people.

  - id: ex-8
    title: How Observatory does it
    kind: quote
    provenance: simulated-data
    quote:
      text: >
        I don't set the rota. The nurses sit down once a month and build it together, and they swap among themselves
        when life happens. My job is to check that every shift is covered and that nobody always gets the worst ones.
        And every year one of them goes on a course they choose. It costs me an afternoon a month and one course fee.
      attribution: Grace Adams, clinic manager, Silvertree Observatory
    source: Fictional interview, written for this case.

  - id: ex-9
    title: The investor's view
    kind: quote
    provenance: simulated-data
    quote:
      text: >
        We backed Silvertree because it runs good clinics at a fair price and earns a margin above 10%. Agency costs
        have taken that margin away. We will support any plan that brings it back, but not another pay rise without
        evidence that it will keep people.
      attribution: Lindiwe Dube, partner, Atlantic Health Partners
    source: Fictional email, written for this case.

constraints:
  - The nurses' pay was raised by 6% in January 2025. The investor will not support another rise without evidence that it would reduce turnover.
  - Every shift must be covered by a registered nurse, so a vacancy must be filled by an agency nurse until it is filled permanently.
  - A vacancy takes about four months to fill.
  - The board wants a plan it can start within three months, and results it can measure within a year.

stakeholders:
  - name: Dr Pieter van Wyk and Dr Aisha Patel, founders and shareholders
    interest: Good clinics at a fair price, where patients see the same faces.
    influence: high
    stake: high
    concern: A business that runs on agency staff and loses the continuity of care it was built on.
  - name: Atlantic Health Partners, investor
    interest: A margin above 10% and a return on its investment.
    influence: high
    stake: medium
    concern: Rising costs, and spending that does not change anything.
  - name: Thandiwe Mokoena, head of people
    interest: A plan that deals with why nurses leave.
    influence: medium
    stake: high
    concern: Being asked for a quick saving rather than a lasting fix.
  - name: Nurses
    interest: Workable rotas, a manageable workload, development and fair pay.
    influence: medium
    stake: high
    concern: Rotas that leave no room for life outside work, and no way to progress.
  - name: Clinic managers
    interest: Fully staffed clinics they have time to run.
    influence: medium
    stake: high
    concern: Giving up control of the rota, or adding work to an already wide span of control.
  - name: Patients
    interest: Short waits and staff who know them.
    influence: low
    stake: high
    concern: Longer waits and a different nurse at every visit.
  - name: Nursing agencies
    interest: Selling shifts.
    influence: low
    stake: medium
    concern: Losing business if Silvertree keeps its nurses.

options:
  - id: pay-rise
    label: A further pay rise of 8%
    summary: Raise every nurse's pay again, by 8%.
    requires: R3.23m a year, and the investor's agreement.
    upside: A clear signal that nurses are valued; simple to do at once.
    risks: The survey shows that pay is no longer the main complaint, and only 3 of 26 leavers named it; the forecast effect is small for the cost.
    evidence: [ex-4, ex-5, ex-7]
  - id: self-rostering
    label: Self-rostering and flexible shifts
    summary: Let each clinic's nurses plan the rota together and swap shifts among themselves, as Observatory does.
    requires: Rostering software, an hour a week of each manager's time, and rules that keep the rota fair.
    upside: The cheapest option that acts on the main reason nurses give for leaving, with evidence from Silvertree's own best clinic.
    risks: Rotas could become unfair to nurses with less say; managers must accept giving up control; it does nothing for development.
    evidence: [ex-3, ex-5, ex-7, ex-8]
  - id: career-ladder
    label: A clinical career ladder
    summary: Create senior nurse posts, mentoring and training towards nurse-led clinics for minor illness.
    requires: R2.4m a year, training places, and doctors willing to support nurse-led clinics.
    upside: Acts on development, which nurses rate lowest, and adds about R1.2m a year of revenue from nurse-led clinics.
    risks: Slow, with the effect on turnover expected from the second year; better-trained nurses are also more attractive to other employers.
    evidence: [ex-4, ex-5, ex-7]
  - id: team-leaders
    label: Team leaders in every clinic
    summary: Appoint team leaders so that each manager oversees fewer people directly.
    requires: R1.5m a year in allowances, and nurses ready to lead.
    upside: Narrows a span of control of more than twenty, giving nurses someone with time to support them.
    risks: The smallest forecast effect after the pay rise, and it leaves rotas as they are.
    evidence: [ex-3, ex-7]
  - id: agency-deal
    label: One contracted agency
    summary: Buy all agency shifts from one agency at a discounted rate of R3,800 a shift.
    requires: A contract with one agency.
    upside: Saves about R0.96m a year at once, the largest saving on paper.
    risks: Does nothing to keep nurses; turnover, waiting times and the loss of familiar faces continue.
    evidence: [ex-6, ex-7]

analysis:
  data:
    - 30 of 96 nurses left in 2025, a labour turnover of 31.3%, from 16.7% at Observatory to 43.8% at Bellville (Exhibit 3).
    - Turnover cost about R5.19m, R173,000 for each leaver, and agency spending rose from R6.30m to R10.08m (Exhibits 1 and 2).
    - After the pay rise, nurses agreeing that their pay is fair rose from 31% to 52%, but those intending to stay fell from 58% to 55%; agreement fell on rotas (34%) and development (27%) (Exhibit 4).
    - Rotas were the main reason for 9 of 26 leavers, workload for 6, development for 5 and pay for 3 (Exhibit 5).
  insight:
    - In Herzberg's terms, pay was a hygiene factor. Raising it removed a source of dissatisfaction, but it did not make nurses want to stay, because what drives them out is the rota and the lack of a future.
    - Observatory shows what works at Silvertree itself. Nurses who control their rota and can develop stay, and its patients wait least and rate their care highest.
    - The contracted agency and self-rostering save almost the same on paper, R0.96m and R0.94m a year, but only one of them reduces the number of nurses who leave.
  options:
    - A further pay rise costs R3.23m a year and leaves Silvertree R2.69m worse off on the head of people's estimates.
    - Self-rostering is the cheapest real fix, at R0.60m a year, and acts on the main reason for leaving.
    - The career ladder acts on development and brings in new revenue, but slowly.
    - Team leaders narrow the span of control at a net cost of R0.46m a year.
    - The contracted agency saves money and changes nothing else.
  recommendation: >
    One defensible recommendation: introduce self-rostering in every clinic now, using Observatory's method, with
    rules that keep weekend and late shifts fair and Grace Adams to help the other managers. Start the career ladder in
    the two clinics with the highest turnover, Bellville and Mitchells Plain, and extend it if turnover there falls.
    Negotiate a single-agency rate as well, because vacancies will continue for a while and it saves money on cover
    without pretending to solve the problem. Measure each clinic's turnover, agency shifts and waiting times every
    quarter.
  caveat: >
    The estimates of turnover are judgements, not results, and Observatory may be different in ways that do not
    transfer: a manager with Grace Adams's skills, or nurses who live nearby. If self-rostering does not reduce
    turnover at the first clinics within six months, the explanation is probably workload or management rather than
    the rota, and the board should look again at team leaders and staffing levels.

method: >
  Silvertree Clinics, Atlantic Health Partners and everyone in this case are fictional, and every figure is simulated.
  Labour turnover is calculated from the leavers and the average number of nurses in Exhibit 3. Each leaver costs
  recruitment and induction plus 80 agency shifts at the difference between an agency shift and an employed nurse's
  shift, and each option in Exhibit 7 applies the head of people's estimate of turnover to that cost. The estimates of
  turnover are stated assumptions, not predictions. A script in the repository (`scripts/qa/case-figures.py`) rebuilds
  every exhibit and checks every figure in the text, and the unit tests recompute labour turnover with the platform's
  finance functions.


# Case Vault classification (src/lib/case-vault.ts).
industry: healthcare
functions: [human-resources, finance]
difficulty: intermediate
qualifications: [ib-dp-sl, ib-dp-hl, undergraduate]
keyConcepts: [ethics, sustainability]
caseType: fictional
syllabus: ['2.1', '2.2', '2.3', '2.4', '2.5']

analysisQuestions:
  - id: sc-define
    commandTerm: Define
    ao: AO1
    marks: 2
    syllabus: ['2.4']
    prompt: Define the term *non-financial rewards*.
    guidance: >
      One mark for rewards that are not paid in money, and one for an example or a fuller statement of what they
      include, such as job enrichment, empowerment or teamwork. At Silvertree, a say in the rota and a course each year
      are non-financial rewards.
  - id: sc-turnover
    commandTerm: Calculate
    ao: AO4
    marks: 4
    level: HL
    paper: paper-2
    syllabus: ['2.4']
    exhibits: [ex-3]
    prompt: Using Exhibit 3, calculate the labour turnover in 2025 at Observatory, at Bellville and across all six clinics.
    answer: >
      Observatory: 3 ÷ 18 × 100 = 16.7%. Bellville: 7 ÷ 16 × 100 = 43.8%. All six clinics: 30 ÷ 96 × 100 = 31.3%.
    guidance: >
      One mark for the method and one for each correct answer, with no more than four in all. Divide by the average
      number employed, not the number at the end of the year.
  - id: sc-cost
    commandTerm: Calculate
    ao: AO4
    marks: 4
    paper: paper-2
    syllabus: ['3.3', '2.4']
    exhibits: [ex-2, ex-3]
    prompt: Using Exhibits 2 and 3, calculate the cost to Silvertree of the nurses who left in 2025.
    answer: >
      Agency premium per shift = R4,200 − R2,600 = R1,600. Cost per leaver = R45,000 + 80 × R1,600 = R173,000. Cost of
      30 leavers = 30 × R173,000 = R5,190,000, or R5.19m.
    guidance: >
      One mark for the premium, one for the cost per leaver, one for multiplying by the leavers and one for the answer.
      The premium, not the whole agency rate, is the extra cost: Silvertree would have paid an employed nurse for the
      shift anyway.
  - id: sc-herzberg
    commandTerm: Explain
    ao: AO2
    marks: 4
    syllabus: ['2.4']
    exhibits: [ex-4, ex-5]
    prompt: Using Herzberg's motivation-hygiene theory, explain why the 2025 pay rise did not reduce nurse turnover.
    guidance: >
      Two marks for the theory: hygiene factors, such as pay and working conditions, cause dissatisfaction when they are
      poor but do not motivate when they are good; motivators, such as achievement, recognition and growth, do. Two
      marks for applying it with the evidence: the share who felt fairly paid rose from 31% to 52%, yet intention to
      stay fell from 58% to 55%; the leavers named rotas and development far more often than pay.
  - id: sc-span
    commandTerm: Explain
    ao: AO2
    marks: 4
    syllabus: ['2.2']
    exhibits: [ex-3]
    prompt: Using Exhibit 3, explain how the clinic managers' span of control might contribute to nurses leaving.
    guidance: >
      Each manager directly manages all of a clinic's nurses (between fourteen and eighteen) and six administrative
      staff, a span of control of more than twenty. Two marks for explaining what a wide span means; two for the effect
      in the case: little time for each nurse, little recognition or coaching, and rotas set from above, all of which
      appear in the survey and the exit interviews.
  - id: sc-sdt
    commandTerm: Explain
    ao: AO2
    marks: 4
    level: HL
    syllabus: ['2.4']
    exhibits: [ex-8]
    prompt: Explain how Deci and Ryan's self-determination theory supports the self-rostering option.
    guidance: >
      Two marks for the theory: people are motivated from within when three needs are met, autonomy, competence and
      relatedness. Two marks for applying it: building the rota together gives nurses autonomy over their working
      lives; swapping among themselves builds relatedness; and Observatory's yearly course supports competence. Answers
      that name the three needs without the case earn two marks at most.
  - id: sc-evaluate
    commandTerm: Evaluate
    ao: AO3
    marks: 10
    syllabus: ['2.4', '2.1']
    exhibits: [ex-4, ex-5, ex-7, ex-8]
    prompt: Evaluate self-rostering and the clinical career ladder as ways for Silvertree to reduce nurse turnover.
    guidance: |
      A strong answer does four things.

      - It uses the evidence on why nurses leave: rotas (9 of 26), workload (6), development (5) and pay (3).
      - It weighs self-rostering: cheap, at R0.60m a year, quick, tested at Observatory and aimed at the main reason; but dependent on managers giving up control, and silent on development.
      - It weighs the career ladder: aimed at development, with new revenue, but slow, dearer and at risk of training nurses for other employers.
      - It reaches a judgement, such as using both in sequence, and says how Silvertree would know within a year whether it had worked.

      Answers that treat the estimates in Exhibit 7 as certain, or that ignore the cause of turnover, stay in the middle of the range.

exercise:
  role: You are Thandiwe Mokoena, Silvertree's head of people.
  brief: >
    The board meets next month: the two founders and the investor's partner, Lindiwe Dube. The investor will not fund
    another pay rise without evidence; the founders want clinics where nurses stay. You have the exit interviews, two
    years of surveys, the clinic figures and your estimates of five options.
  task: Recommend one option, or a sequence led by one, and show why it will keep nurses.
  deliverable: A recommendation to the board of about 250 words, with the evidence for it, its yearly cost and effect, and how you will measure it.
  minutes: 35
  criteria:
    - Links the choice to why nurses actually leave (Exhibits 4 and 5).
    - Uses motivation theory accurately, for example Herzberg or, at HL, self-determination theory.
    - Uses the costs and estimates in Exhibit 7, and treats the estimates as judgements.
    - Sets out how success would be measured, clinic by clinic, within a year.

debrief:
  summary: >
    Silvertree's problem is not pay. The pay rise moved the measure it was meant to move, and turnover rose anyway.
    The evidence from the exit interviews, the survey and Observatory points to the rota, the workload and the lack of
    a future. The strongest answers follow that evidence, and notice that the cheapest option on paper, a contracted
    agency, is a way of paying less for the problem rather than solving it.
  byOption:
    - option: pay-rise
      fit: weak
      body: >
        Pay is no longer the main complaint: the share who feel fairly paid rose from 31% to 52% after the last rise, and
        only 3 of 26 leavers named it. A further rise of 8% costs R3.23m a year and, on the head of people's estimate,
        leaves Silvertree R2.69m worse off. It treats a hygiene factor that is already largely fixed.
    - option: self-rostering
      fit: strong
      body: >
        The cheapest real fix, at R0.60m a year, with a net gain of R0.94m on the estimates. It acts on the most common
        reason for leaving, gives nurses autonomy, and has worked at Silvertree's own best clinic, where turnover is
        16.7%. Its risks are fairness between nurses and managers who resist giving up control, which clear rules and
        Grace Adams's example can address.
    - option: career-ladder
      fit: conditional
      body: >
        It acts on development, which nurses rate lowest, and adds about R1.2m a year of revenue, for a net gain of R0.67m
        from the second year. But it is slow, and it makes nurses more employable elsewhere. Strong as a second step,
        after the rota, in the clinics that lose most nurses.
    - option: team-leaders
      fit: conditional
      body: >
        A span of control of more than twenty is a real problem, and team leaders would give nurses support. But the
        forecast effect is modest, the net cost is R0.46m a year, and it leaves the rota as it is. Worth doing if
        self-rostering shows that management, not the rota, is the cause.
    - option: agency-deal
      fit: weak
      body: >
        The largest saving on paper, R0.96m a year, and no effect at all on why nurses leave. Turnover stays at 31.3%,
        the agency shifts continue, and patients keep meeting staff who do not know them. A sensible purchase alongside a
        real fix, not instead of one.
  tradeoffs:
    - Cost of cover against cost of causes. A cheaper agency lowers the cost of each vacancy; only the other options reduce the number of vacancies.
    - Speed against depth. Self-rostering can start in weeks; the career ladder builds a future but takes two years.
    - Control against autonomy. Self-rostering asks managers to give up a source of control to keep their teams.
    - Money against meaning. Pay addresses a hygiene factor; development and autonomy address motivators.
  evidenceThatMatters:
    - The pay rise that worked on the survey and not on turnover (Exhibit 4).
    - The exit interviews, led by rotas and workload (Exhibit 5).
    - Observatory, with the lowest turnover, the shortest waits and the best ratings (Exhibits 3, 6 and 8).
    - The cost of a leaver, which is mostly agency premium (Exhibit 2).
  changeYourMind:
    - Self-rostering at the first clinics does not reduce turnover within six months. Look at workload and management instead.
    - Observatory's results turn out to depend on Grace Adams rather than on the method. Invest in the managers.
    - Other employers raise nurses' pay sharply. Pay could become a reason for leaving again.
  commonErrors:
    - Recommending more pay because pay usually motivates, without reading the survey and the exit interviews.
    - Treating the contracted agency's saving as a solution.
    - Calculating labour turnover with the number of nurses at the end of the year rather than the average.
    - Using Herzberg to label factors without showing which ones the evidence points to.

frameworks:
  - name: Herzberg's motivation-hygiene theory
    use: >
      Explains why the pay rise failed: it improved a hygiene factor without adding a motivator. Rotas and workload are
      hygiene factors too, which is why they drive nurses out; development and recognition are motivators.
    terms: [herzbergs-motivation-hygiene-theory, hygiene-factors, motivators]
    subtopics: ['2.4']
  - name: Maslow's hierarchy of needs
    use: >
      Fair pay meets lower needs; the evidence suggests that the nurses' unmet needs are higher ones, for esteem and
      growth.
    terms: [maslows-hierarchy-of-needs]
    subtopics: ['2.4']
  - name: Self-determination theory and equity theory
    level: HL
    use: >
      Self-rostering gives autonomy and relatedness; the career ladder builds competence. Equity theory warns that a
      rota seen as unfair, where some nurses always get the worst shifts, can undo the benefit.
    terms: [self-determination-theory, autonomy, competence, relatedness, equity-theory]
    subtopics: ['2.4']
  - name: Non-financial rewards
    use: >
      Empowerment over the rota, job enrichment through nurse-led clinics, and teamwork in swapping shifts are the
      non-financial rewards the options offer.
    terms: [non-financial-rewards, empowerment, job-enrichment, teamwork, flexible-working]
    subtopics: ['2.4']
  - name: Labour turnover
    level: HL
    use: >
      The measure of the problem, and of any solution: 31.3% across the network, with a spread from 16.7% to 43.8% that
      points to differences between clinics.
    terms: [labour-turnover]
    subtopics: ['2.4']
  - name: Span of control
    use: >
      Each clinic manager oversees more than twenty people directly, which limits the time available for each nurse.
    terms: [span-of-control, delegation]
    subtopics: ['2.2']
  - name: Leadership styles
    use: >
      Grace Adams's democratic approach to the rota contrasts with rotas set from above elsewhere; the choice of style
      is part of the solution.
    terms: [democratic-leadership, autocratic-leadership]
    subtopics: ['2.3']
  - name: Organizational culture
    level: HL
    use: >
      Observatory's culture of shared responsibility differs from the other clinics', and culture explains why a method
      that works there may not transfer at once.
    terms: [organizational-culture, task-culture, role-culture]
    subtopics: ['2.5']
  - name: Force field analysis
    level: HL
    use: >
      The forces for self-rostering (the exit interviews, Observatory's evidence) and against it (managers' control,
      fears of unfairness) show which force to weaken first.
    terms: [force-field-analysis]
    tool: force-field-analysis

discussion:
  - >
    Silvertree's investor sees turnover as a cost problem; its founders see it as a problem of care. How should a board
    weigh a saving that leaves patients meeting unfamiliar staff against a fix whose financial effect is uncertain?
  - >
    The career ladder makes nurses more valuable to other employers. Is investing in people who may leave a mistake,
    or the price of being an employer they want to stay with?
  - >
    Observatory may work because of Grace Adams rather than her method. How would you design the roll-out so that the
    board learns which it is?


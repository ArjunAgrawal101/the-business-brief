# Tausi Beverages. A fictional organization; every figure is simulated.
# The retail audit is a fictional panel of shops, not a statistic about any
# real market. Contribution by product follows the stated model, and the price
# test gives the price elasticity. scripts/qa/case-figures.py rebuilds every
# exhibit and checks every figure in the text; tests/unit/vault-cases.test.ts
# recomputes the shares, growth rates and elasticity with src/lib/market.ts.

title: Tausi Beverages
dek: A Nairobi drinks and foods maker has four products in four positions, and money to back only part of its portfolio.
kind: fictional
dataStatus: simulated
organization:
  name: Tausi Beverages
  sector: Packaged drinks and foods (fast-moving consumer goods)
  location: Nairobi, Kenya
  size: One factory and a distribution depot, 310 employees
  legalForm: Private limited company, owned by the Kamau family
currency:
  code: KES
  symbol: 'KSh'
  unit: millions of Kenyan shillings (KSh m)
decision: Where should Tausi spend its KSh 120m marketing and development reserve for 2026?
brief: >
  Tausi's original mango nectar still earns most of its money but has started to lose share. Its porridge flour leads
  a fast-growing segment and has run out of capacity, its ginger drink grows quickly but loses money, and its cheap
  cola is fading in a shrinking segment. The board has set aside KSh 120m for 2026, and the marketing manager has
  four plans that each spend all of it. The plans that promise most over three years are the least certain, and the
  research behind them may not describe Tausi's own customers.

narrative:
  - >
    Joseph Kamau started Tausi Beverages in 2009 with a second-hand filling machine and a mango nectar made from fruit
    bought at a market outside Nairobi. Sixteen years later Tausi employs 310 people at a factory in Nairobi's
    Industrial Area, and its four products are sold in supermarkets, petrol station shops and thousands of small
    neighbourhood shops across Nairobi and central Kenya. Joseph's daughter, Wanjiru Kamau, became managing director
    in 2021; Joseph still chairs the board.
  - >
    The four products have very different stories. Mango Nectar, the original, is still the best-selling juice in the
    shops that Tausi's research agency audits, but its share has started to slip. Uji Power, a fortified millet
    porridge flour launched in 2018, leads a segment that is growing fast. Ginger Zing, a sharp ginger and lemon drink
    in a can, launched in 2023, is growing quickly from a small base in the fastest-growing segment of all. Tausi
    Cola, launched in 2015 to compete on price with the global brands, is losing ground in a shrinking segment
    (Exhibits 3 and 4).
  - >
    The business is still profitable, but less so each year. Revenue has grown, while profit before interest and tax
    fell from KSh 170m in 2023 to KSh 148m in 2025 (Exhibit 2). Mango Nectar earns most of the money; Ginger Zing
    loses money once its marketing is paid for, and Tausi Cola earns little (Exhibit 1).
  - >
    For 2026 the board has set aside KSh 120m of retained profit for marketing and development, on top of the normal
    budgets. Brian Otieno, the marketing manager, has worked up four plans, each costing the full amount (Exhibit 7).
    Hassan Abdi, the head of sales, wants the money behind Ginger Zing, which he believes could be the company's next
    Mango Nectar. Faith Njeri, the finance manager, points out that the plan with the best two-year return protects
    the products Tausi already has. And Joseph does not want to drop a product the distributors have stocked for ten
    years.
  - >
    Brian has two more pieces of evidence: a price test of Ginger Zing in 120 shops (Exhibit 5) and a survey of
    shoppers (Exhibit 6). He is not sure how far to trust either. Wanjiru wants his recommendation for the board in
    January.

industryContext:
  - >
    Packaged drinks and foods are fast-moving consumer goods: bought often, at low prices and in large volumes, with a
    small margin on each unit. Profit comes from volume and from the brand. A brand that customers ask for earns shelf
    space, a better price and loyalty, and it costs money to build and to keep.
  - >
    In much of East Africa, a large part of these sales goes through small neighbourhood shops supplied by
    distributors, alongside supermarkets and petrol station shops. Reaching the small shops takes a distribution
    network, credit for shopkeepers and support at the point of sale, such as branded coolers. Global drinks brands
    compete in the same shops with far larger budgets for advertising and promotion.
  - >
    Tastes change. Concern about sugar is growing among parents and schools, drinks sold for energy, digestion or
    other benefits are a growing category, and busy households buy more convenient foods. Each product therefore has
    its own life cycle, and a company with several products has to decide which to build, which to milk for cash and
    which to let go.

challenge: >
  Tausi has four products in four different positions, and money to back only part of its portfolio. The product that
  earns the most is mature and starting to lose share; the fastest-growing one loses money; the most promising one
  already leads a growing segment but cannot make any more; and the oldest challenger is losing in a shrinking
  segment. The board has to decide where the reserve will do most for the company over the next three years, on
  estimates that are least certain for the plans that promise most, and on research that may not reach the shops
  where most of Tausi's sales are made.

financials:
  summary: >
    Revenue grew from KSh 1,980m in 2023 to KSh 2,240m in 2025, but profit before interest and tax fell from KSh 170m
    to KSh 148m, and the profit margin from 8.6% to 6.6% (Exhibit 2). Exhibit 1 shows where the profit comes from.
    Mango Nectar earns KSh 462m of contribution after its marketing, more than two thirds of the total; Uji Power earns
    KSh 198m; Tausi Cola KSh 33m; and Ginger Zing loses KSh 15m, because its marketing costs more than its
    contribution.
  exhibits: [ex-1, ex-2]

exhibits:
  - id: ex-1
    title: Contribution by product, 2025 (KSh m)
    kind: table
    provenance: simulated-data
    columns:

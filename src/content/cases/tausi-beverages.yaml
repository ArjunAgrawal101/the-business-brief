      - [Marketing, 66, 50, 30, 22, 168]
      - [Contribution after marketing, 462, -15, 198, 33, 678]
    totals: [Contribution, Contribution after marketing]
    note: >
      Variable costs are ingredients, packaging, filling and delivery, and rise with the volume sold. Marketing is
      each product's own advertising and promotion. Fixed overheads of KSh 530m (the factory, the distribution depot
      and administration) are not shared between products: contribution after marketing of KSh 678m less fixed
      overheads gives a profit before interest and tax of KSh 148m.
    source: Simulated teaching data, from Tausi's management accounts.


# Case Vault classification (src/lib/case-vault.ts).
industry: fmcg
functions: [marketing, finance]
difficulty: foundation
qualifications: [ib-dp-sl, ib-dp-hl, undergraduate]
keyConcepts: [creativity, change]
caseType: fictional
syllabus: ['4.1', '4.4', '4.5', '5.5']

analysisQuestions:
  - id: tb-define
    commandTerm: Define
    ao: AO1
    marks: 2
    syllabus: ['4.5']
    prompt: Define the term *product portfolio*.
    guidance: >
      One mark for the range of products a business sells, and one for the idea that they are managed together, so
      that the business can balance products at different stages of their life cycles. Tausi's portfolio is its four
      products.
  - id: tb-share
    commandTerm: Calculate
    ao: AO4
    marks: 4
    paper: paper-2
    syllabus: ['4.1']
    exhibits: [ex-3]
    prompt: Using Exhibit 3, calculate (i) Ginger Zing's market share in the panel shops in 2025 and (ii) the growth of the ginger and functional drinks segment from 2024 to 2025.
    answer: >
      (i) Market share = 82 ÷ 1,170 × 100 = 7.0%. (ii) Market growth = (1,170 − 900) ÷ 900 × 100 = 30.0%.
    guidance: >
      Two marks for each: one for the method and one for the answer. Say what the share describes: sales in the panel
      shops, at shelf prices, not the whole market.
  - id: tb-bcg
    commandTerm: Analyse
    ao: AO2
    marks: 6
    syllabus: ['4.5', '4.1']
    exhibits: [ex-1, ex-3]
    prompt: Using Exhibits 1 and 3, analyse Tausi's product portfolio with the Boston Consulting Group (BCG) matrix.
    guidance: |
      A strong answer places each product with figures, then draws the implication.

      - Uji Power: a star, with 34.0% of a segment growing at 20.0%, selling 1.7 times its largest rival.
      - Mango Nectar: a cash cow, the leader of a segment growing at 3.0%, earning KSh 462m after marketing.
      - Ginger Zing: a question mark, with 7.0% of a segment growing at 30.0%, a fifth of its largest rival's sales, and a loss after marketing.
      - Tausi Cola: a dog, with 3.5% of a segment shrinking by 2.0%, a small fraction of its rival's sales.

      The implication earns the higher marks: the cash cow's cash should build the star and decide the question mark, and the dog's future should be questioned. Placing products without figures earns half the marks at most.
  - id: tb-extension
    commandTerm: Explain
    ao: AO2
    marks: 4
    syllabus: ['4.5']
    exhibits: [ex-4, ex-6]
    prompt: Explain one extension strategy Tausi could use for Mango Nectar.
    guidance: >
      Two marks for a relevant extension strategy and two for explaining how it would lengthen the product's life in
      Tausi's situation. Strong examples from the case: a reduced-sugar recipe, which answers the 41% of surveyed
      shoppers who find it too sweet and the schools' concern; a 250 ml pack for lunchboxes, which opens a new use;
      or new labels to refresh a long-established product.
  - id: tb-survey
    commandTerm: Explain
    ao: AO2
    marks: 4
    syllabus: ['4.4']
    exhibits: [ex-6]
    prompt: Explain two limitations of the shopper survey in Exhibit 6 as evidence for Tausi's decision.
    guidance: >
      Two limitations, each explained and tied to the case, for two marks each. The sample is a convenience sample of
      willing supermarket shoppers on two Saturdays, so it is unlikely to represent the people who buy in small
      neighbourhood shops, where most of Tausi's sales are made; 71% were aged 18 to 35, so parents, who buy Uji
      Power, are under-represented; and saying you would try a product is not the same as buying it again.
  - id: tb-ped
    commandTerm: Calculate
    ao: AO4
    marks: 2
    level: HL
    paper: paper-2
    syllabus: ['4.5']
    exhibits: [ex-5]
    prompt: Using Exhibit 5, calculate the price elasticity of demand for Ginger Zing.
    answer: >
      Percentage change in quantity = (52 − 40) ÷ 40 × 100 = 30%. Percentage change in price = (70 − 80) ÷ 80 × 100 =
      −12.5%. Price elasticity of demand = 30 ÷ −12.5 = −2.4.
    guidance: >
      One mark for the two percentage changes and one for the answer. The guide does not list this formula on its
      formula sheet; the standard form divides the percentage change in quantity demanded by the percentage change in
      price. Demand is price elastic, because the answer is greater than 1 if the sign is ignored.
  - id: tb-price
    commandTerm: Explain
    ao: AO2
    marks: 4
    level: HL
    syllabus: ['4.5']
    exhibits: [ex-5]
    prompt: Using Exhibit 5, explain why the price cut raised the shops' revenue from Ginger Zing but reduced Tausi's contribution.
    guidance: >
      Demand is elastic, so the percentage rise in cans sold (30%) is larger than the percentage fall in price (12.5%),
      and revenue per shop rises from KSh 3,200 to KSh 3,640 a week. But Tausi's variable cost per can does not fall
      with the price, so its contribution per can falls from KSh 16.80 to KSh 10.80, and the extra cans do not make up
      for it: contribution per shop falls from KSh 672 to KSh 561.60 a week. Two marks for the revenue effect and two
      for the contribution effect, each with figures.
  - id: tb-discuss
    commandTerm: Discuss
    ao: AO3
    marks: 10
    syllabus: ['4.5', '4.1']
    exhibits: [ex-1, ex-3, ex-5, ex-6, ex-7]
    prompt: Discuss which of the four plans Tausi should choose for its KSh 120m reserve.
    guidance: |
      A strong answer does four things.

      - It uses the portfolio: each product's share, growth and contribution, and what the BCG matrix suggests.
      - It compares the plans over two and three years, and notices that the plans that promise most are the least certain.
      - It questions the evidence: the panel's coverage, the convenience sample, and what the price test says about promotion.
      - It reaches a judgement, with a condition or milestone that would show whether it is working.

      Answers that describe all four plans without weighing them stay in the middle of the range.

exercise:
  role: You are Brian Otieno, Tausi's marketing manager.
  brief: >
    Wanjiru wants your recommendation for the January board meeting. Hassan will argue for Ginger Zing, Faith for the
    plan with the best two-year return, and Joseph against dropping any product. You have the audit, the product
    accounts, the price test and the survey, and you know which of them you trust least.
  task: Choose one plan and defend it with the portfolio, the figures and the limits of the evidence.
  deliverable: A recommendation of about 250 words, giving the plan, the portfolio reasoning, one milestone that would show it is working, and its main risk.
  minutes: 30
  criteria:
    - Uses the audit to place each product, with its share and its segment's growth (Exhibit 3).
    - Weighs the return over two years against the return over three (Exhibit 7).
    - Treats the estimates, the price test and the survey critically.
    - Sets a measurable milestone, and says what Tausi would do if it were missed.

debrief:
  summary: >
    Tausi's four products sit in the four boxes of the BCG matrix, and the plans differ in which box they feed. The
    strongest answers use the matrix as a starting point rather than a verdict: they check it against contribution,
    capacity and the evidence on how Ginger Zing can grow, and they set a milestone that turns a three-year hope into
    a decision that can be reviewed.
  byOption:
    - option: back-challenger
      fit: conditional
      body: >
        It puts most of the money behind the question mark in the fastest-growing segment, which portfolio logic
        allows, and ties with Plan C over three years at KSh 260m. But it depends on Ginger Zing more than doubling its
        share, from 7.0% to 15%, against a rival five times its size, and it leaves the cola fading and Uji Power's
        line full. Defensible with a milestone; risky as a single bet.
    - option: protect-core
      fit: conditional
      body: >
        The best two-year return, KSh 145m against spending of KSh 120m, and the lowest risk. But it spends most on the
        cash cow, in a segment growing at 3.0%, and leaves the questions of Ginger Zing and the cola for another year.
        A sound short-term choice that postpones the portfolio decision.
    - option: prune-focus
      fit: strong
      body: >
        The plan that follows the portfolio: it drops the dog, lifts the capacity limit on the star and backs the
        question mark, funded by the cash cow. It ties with Plan A over three years at KSh 260m, with less resting on a
        single forecast. Its risks are the distributors' reaction to losing the cola and the people on its line, which
        the plan answers by filling Ginger Zing there.
    - option: new-product
      fit: weak
      body: >
        The most exciting plan and the least supported: the lowest three-year return, KSh 205m, a launch in September
        with certification still to come, and demand evidence from a convenience sample of supermarket shoppers, 55% of
        whom said they would try it. Better tested on a small scale once the portfolio is in order.
  tradeoffs:
    - Two years against three. Plan B leads over two years; Plans A and C over three.
    - Building against milking. Portfolio logic uses the cash cow's cash rather than spending it on the cash cow.
    - Focus against range. Dropping the cola sharpens the portfolio but may cost goodwill with distributors.
    - Volume against margin. Elastic demand rewards a price cut with volume and punishes it in contribution.
  evidenceThatMatters:
    - Each product's share and its segment's growth (Exhibit 3).
    - Where the contribution comes from, and where it is lost (Exhibit 1).
    - The price test, which shows that price cuts are the wrong way to grow Ginger Zing (Exhibit 5).
    - The limits of the survey, which never reached a small shop (Exhibit 6).
  changeYourMind:
    - Distributors make the cola a condition of taking the range. Plan B becomes the safer choice.
    - Ginger Zing's share rises without extra spending. Back it less and Uji Power more.
    - A proper test of Uji Power To Go in small shops shows strong repeat buying. Plan D deserves a second look.
  commonErrors:
    - Placing products on the BCG matrix without figures. Use share against the largest rival and the segment's growth.
    - Treating the 55% who would try a product as forecast sales.
    - Assuming that a price cut which raises revenue also raises profit.
    - Reading the panel's shares as shares of a whole national market.

frameworks:
  - name: The Boston Consulting Group matrix
    use: >
      Places each product by its segment's growth and its share against the largest rival: Uji Power a star, Mango
      Nectar a cash cow, Ginger Zing a question mark and Tausi Cola a dog. It suggests where the cash should flow, not
      what each product will earn.
    terms: [bcg-matrix, bcg-star, bcg-cash-cow, bcg-question-mark, bcg-dog]
    tool: bcg-matrix
  - name: The product life cycle and extension strategies
    use: >
      Mango Nectar is mature and Tausi Cola in decline; a reduced-sugar recipe or a lunchbox pack are extension
      strategies that could lengthen Mango Nectar's life without a large investment.
    terms: [product-life-cycle, extension-strategy, product-portfolio]
    subtopics: ['4.5']
  - name: Market share and market growth
    use: >
      The two figures behind every placement on the matrix, calculated from the retail audit; the audit's coverage
      limits what they mean.
    terms: [market-share, market-growth, market-leader]
    subtopics: ['4.1']
  - name: Price elasticity of demand
    level: HL
    use: >
      The price test gives an elasticity of −2.4. Elastic demand explains why the cut raised the shops' revenue, and
      the fixed cost per can explains why it still reduced Tausi's contribution.
    terms: [price-elasticity-of-demand, penetration-pricing, competitive-pricing]
    subtopics: ['4.5']
  - name: Market research and sampling
    use: >
      The survey is primary research on a convenience sample. It is cheap and quick, and it may say little about the
      small-shop customers who buy most of Tausi's products.
    terms: [primary-research, survey, convenience-sampling, sampling-error, research-bias]
    subtopics: ['4.4']
  - name: Contribution
    use: >
      Contribution after marketing shows what each product adds towards fixed overheads, and why the cola, though small,
      still adds something while Ginger Zing, for now, takes away.
    terms: [contribution, total-contribution]
    subtopics: ['5.5']
  - name: The Ansoff matrix
    use: >
      Backing Ginger Zing in Tausi's existing shops is market penetration; Uji Power To Go is product development under
      an existing brand, with more risk.
    terms: [ansoff-matrix, market-penetration, product-development]
    tool: ansoff-matrix

discussion:
  - >
    The BCG matrix treats market share as a sign of cost advantage and market growth as a sign of cash needs. How well
    do those signs fit a regional drinks maker competing with global brands in small shops?
  - >
    Tausi's market data come from an audit of 1,600 shops. What would you ask about the panel before trusting a share
    calculated to one decimal place, and how would the answers change the decision?
  - >
    Should a drinks company reformulate a popular, sugary product before customers or regulators insist on it? Weigh
    the cost of moving first against the risk to the brand of moving late.


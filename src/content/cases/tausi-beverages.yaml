    rows:
      - [Juices and nectars, 4800, 4944, 1440, 1458, 1020]
      - [Ginger and functional drinks, 900, 1170, 54, 82, 410]
      - [Fortified porridge flours, 1250, 1500, 400, 510, 300]
      - [Colas, 6000, 5880, 240, 206, 3700]
    note: >
      The audit records the sales of 1,600 shops of every kind in Nairobi and central Kenya, chosen by a research
      agency to represent the area. Shares calculated from it are shares of sales in these shops, at shelf prices,
      not shares of the whole market. Tausi's brand in each segment: Mango Nectar in juices and nectars, Ginger Zing
      in ginger and functional drinks, Uji Power in fortified porridge flours, and Tausi Cola in colas. The largest
      rival is the biggest brand in the segment other than Tausi's.
    source: Simulated teaching data, from a fictional retail audit agency.

  - id: ex-4
    title: The four products
    kind: table
    provenance: simulated-data
    columns:
      - { label: Product }
      - { label: Launched }
      - { label: Pack and shelf price }
      - { label: Who buys it }
      - { label: Notes }
    rows:
      - [Mango Nectar, '2009', '500 ml bottle, KSh 90; 1 litre, KSh 160', Families; sold almost everywhere, 'Real fruit, but sweeter than some schools now want in lunchboxes.']
      - [Ginger Zing, '2023', '330 ml can, KSh 80', Young adults; mainly supermarkets and petrol station shops, 'Few small shops stock it, and fewer have a cooler for it.']
      - [Uji Power, '2018', '1 kg pack, KSh 210', Parents, 'Millet and sorghum flour with added vitamins and minerals. Its packing line runs at full capacity.']
      - [Tausi Cola, '2015', '500 ml bottle, KSh 60', Price-conscious buyers, 'Cheaper than the global colas. Its bottling line could also fill Ginger Zing in bottles.']
    source: Simulated teaching data, from the marketing department.

  - id: ex-5
    title: The Ginger Zing price test
    kind: table
    provenance: simulated-data
    columns:
      - { label: Measure }
      - { label: Before the test, numeric: true, format: d2 }
      - { label: During the test, numeric: true, format: d2 }
    rows:
      - [Shelf price (KSh a can), 80, 70]
      - [Cans sold per shop per week, 40, 52]
      - ["Tausi's revenue per can (KSh)", 48, 42]
      - [Variable cost per can (KSh), 31.2, 31.2]
      - [Contribution per can (KSh), 16.8, 10.8]
      - [Contribution per shop per week (KSh), 672, 561.6]
    note: >
      In 120 panel shops the shelf price was cut from KSh 80 to KSh 70 for eight weeks; the first column is the same
      shops in the eight weeks before. Tausi receives 60% of the shelf price; the rest goes to the distributor and the
      shop. Tausi's variable cost is KSh 31.20 a can at either price.
    source: Simulated teaching data, from the research agency's test.

  - id: ex-6
    title: The shopper survey
    kind: kpis
    provenance: simulated-data
    items:
      - { label: Shoppers interviewed, value: '300', note: 'Outside two Nairobi supermarkets, on two Saturdays' }
      - { label: Aged 18 to 35, value: '71%' }
      - { label: 'Would buy Ginger Zing again (of those who had tried it)', value: '62%' }
      - { label: Find Mango Nectar too sweet, value: '41%' }
      - { label: Would try a ready-to-drink porridge, value: '55%' }
    note: Interviewers stopped shoppers who were willing to answer. Most of Tausi's sales are made in small neighbourhood shops, where nobody was asked.
    source: Simulated teaching data, from a survey run by the marketing department.

  - id: ex-7
    title: Four plans for the KSh 120m reserve (KSh m)
    kind: table
    provenance: simulated-data
    columns:
      - { label: Plan }
      - { label: Spending in 2026, numeric: true, format: money }
      - { label: Extra in 2026, numeric: true, format: money }
      - { label: Extra in 2027, numeric: true, format: money }
      - { label: Extra in 2028, numeric: true, format: money }
      - { label: Three-year total, numeric: true, format: money }
      - { label: Total less spending, numeric: true, format: money }
    rows:
      - [A. Back the challenger, 120, 20, 90, 150, 260, 140]
      - [B. Protect the core, 120, 60, 85, 90, 235, 115]
      - [C. Prune and focus, 120, 35, 95, 130, 260, 140]
      - [D. Launch a new product, 120, 5, 60, 140, 205, 85]
    note: |
      Extra is the change in contribution after marketing compared with carrying on as now, before the plan's own spending. The estimates are the marketing manager's; those for 2028 are the least certain.

      - A. Back the challenger: KSh 90m behind Ginger Zing (advertising, sampling at colleges and events, and 400 branded coolers in shops) and KSh 30m for a 250 ml pack of Mango Nectar. Assumes Ginger Zing reaches 15% of its segment by the end of 2027.
      - B. Protect the core: KSh 70m to extend Mango Nectar's life (a reduced-sugar recipe, the 250 ml pack and new labels) and KSh 50m for a second Uji Power packing line. Assumes Mango Nectar holds its share and Uji Power's segment keeps growing.
      - C. Prune and focus: drop Tausi Cola, losing its KSh 33m a year of contribution after marketing; KSh 60m for the second Uji Power line and KSh 60m behind Ginger Zing, filled in bottles on the cola line as well as in cans.
      - D. Launch a new product: KSh 110m to develop and launch Uji Power To Go, a ready-to-drink porridge in bottles, from September 2026, and KSh 10m for new Mango Nectar labels.
    source: Simulated teaching data, prepared by the marketing manager.

constraints:
  - The reserve for 2026 is KSh 120m, on top of the normal budgets, and the board will not borrow for marketing.
  - Uji Power's packing line runs at full capacity. More Uji Power needs a second line, which takes about four months to install.
  - Distributors expect a full range. Dropping a product means telling them, and some may ask for better terms on the rest.
  - A new food product needs certification before it can be sold, which Tausi expects to take about four months.

stakeholders:
  - name: Wanjiru Kamau, managing director
    interest: Profitable growth, and a portfolio with a future.
    influence: high
    stake: high
    concern: Spending the reserve on the wrong product.
  - name: Joseph Kamau, founder and chair
    interest: The brand, and the relationships he built with distributors.
    influence: high
    stake: high
    concern: Dropping a product the distributors have stocked for ten years.
  - name: Brian Otieno, marketing manager
    interest: A plan that builds the brands.
    influence: medium
    stake: high
    concern: Estimates he cannot defend if they turn out wrong.
  - name: Hassan Abdi, head of sales
    interest: Products his team can sell into shops.
    influence: medium
    stake: medium
    concern: Losing the cola, which gets the sales team into price-conscious shops.
  - name: Faith Njeri, finance manager
    interest: A return on the reserve.
    influence: medium
    stake: medium
    concern: A plan that earns back less than it spends for two years.
  - name: Distributors
    interest: A full range that sells, on good terms.
    influence: high
    stake: medium
    concern: Fewer products to sell, or new ones that do not move.
  - name: Small shopkeepers
    interest: Products that sell fast, credit, and coolers.
    influence: medium
    stake: medium
    concern: Stock that ties up their money.
  - name: Customers
    interest: Taste, price and, increasingly, health.
    influence: medium
    stake: medium
    concern: The sugar in drinks, and rising prices.
  - name: Employees on the cola line
    interest: Their jobs.
    influence: low
    stake: high
    concern: Being moved or laid off if the cola is dropped.

options:
  - id: back-challenger
    label: 'A. Back the challenger'
    summary: Put KSh 90m behind Ginger Zing, in advertising, sampling and branded coolers, and KSh 30m into a smaller Mango Nectar pack.
    requires: Ginger Zing reaching 15% of its segment by the end of 2027, and shops willing to give it cooler space.
    upside: Joint best over three years, at KSh 260m, in the fastest-growing segment Tausi is in.
    risks: Depends on more than doubling Ginger Zing's share against a rival five times its size; leaves Uji Power's line full and the cola fading.
    evidence: [ex-3, ex-5, ex-7]
  - id: protect-core
    label: 'B. Protect the core'
    summary: Extend Mango Nectar's life with a reduced-sugar recipe, a smaller pack and new labels, and add a second Uji Power packing line.
    requires: Mango Nectar holding its share, and the Uji Power segment continuing to grow.
    upside: The best two-year return and the lowest risk.
    risks: Spends most on a mature product in a slow-growing segment, and postpones every decision about Ginger Zing and the cola.
    evidence: [ex-1, ex-3, ex-7]
  - id: prune-focus
    label: 'C. Prune and focus'
    summary: Drop Tausi Cola, and use its line and the reserve for a second Uji Power line and a push behind Ginger Zing.
    requires: Distributors who accept the loss of the cola, and a new job on the line for its employees.
    upside: Joint best over three years, at KSh 260m, with the money behind the two products in growing segments.
    risks: Distributors and price-conscious shops may react badly to losing the cola; Ginger Zing still has to grow.
    evidence: [ex-1, ex-3, ex-4, ex-7]
  - id: new-product
    label: 'D. Launch a new product'
    summary: Develop and launch Uji Power To Go, a ready-to-drink porridge in bottles, from September 2026.
    requires: Certification in time, and customers who will buy porridge as a drink.
    upside: A new product that uses the strength of the Uji Power brand, with the largest promise for 2028.
    risks: The lowest three-year return, the most uncertainty, and demand evidence from a survey of supermarket shoppers only.
    evidence: [ex-6, ex-7]

analysis:
  data:
    - In the panel shops, Uji Power has 34.0% of a segment growing at 20.0% a year and sells 1.7 times as much as its largest rival; Ginger Zing has 7.0% of a segment growing at 30.0%, a fifth of its largest rival's sales; Mango Nectar leads a segment growing at 3.0%, its share down from 30.0% to 29.5%; and Tausi Cola has 3.5% of a shrinking segment (Exhibit 3).
    - Mango Nectar earns KSh 462m of the KSh 678m of contribution after marketing, while Ginger Zing loses KSh 15m (Exhibit 1).
    - The price test shows elastic demand for Ginger Zing. A 12.5% price cut raised sales by 30%, a price elasticity of −2.4, yet Tausi's contribution per shop fell by 16.4% (Exhibit 5).
    - Over three years Plans A and C are forecast to add KSh 260m each, Plan B KSh 235m and Plan D KSh 205m; over two years Plan B leads (Exhibit 7).
  insight:
    - On the BCG matrix, Uji Power is a star, Mango Nectar a cash cow, Ginger Zing a question mark and Tausi Cola a dog. The portfolio's logic is to use the cash cow's cash to build the star and settle the question mark, not to spend most of it on the cash cow.
    - Ginger Zing's growth will not come from cutting its price. Demand is elastic, so a lower price sells more cans but earns less. Its route is distribution and promotion, which Plans A and C pay for.
    - The plans that promise most are the least certain, and the evidence behind Plan D, a survey of supermarket shoppers, does not reach the small shops where most of Tausi's sales are made.
  options:
    - Plan A backs the question mark hardest and leaves the star short of capacity and the dog in place.
    - Plan B earns most in two years and leaves the portfolio as it is for another year.
    - Plan C reshapes the portfolio, dropping the dog and backing both products in growing segments.
    - Plan D adds a new question mark before the existing one has been settled.
  recommendation: >
    One defensible recommendation is Plan C. Drop Tausi Cola, whose small share of a shrinking segment earns KSh 33m a
    year after marketing, and use its line and budget for the products with a future: the second Uji Power line,
    which lifts the capacity limit on the company's star, and a push behind Ginger Zing through distribution rather
    than price. Set Ginger Zing a milestone, such as 10% of its segment by the end of 2026, and stop the extra spending
    if it misses. Keep Mango Nectar's normal budget and test a reduced-sugar recipe within it, because a cash cow
    needs care, not a large new investment.
  caveat: >
    This rests on two judgements: that Ginger Zing can grow through distribution without price cuts, and that dropping
    the cola does not cost Tausi shelf space in the shops that bought it with the rest of the range. If the
    distributors made the cola a condition of stocking the other products, Plan B, which protects what Tausi has,
    would be the safer choice.

method: >
  Tausi Beverages, its brands, its rivals, its distributors and everyone in this case are fictional, and every figure
  is simulated. The retail audit is a panel of shops chosen by a fictional research agency; its figures describe
  those shops only and are not statistics about any real market. Contribution by product follows one stated model:
  revenue less variable costs, then less each product's own marketing. The plans' extra contribution is the marketing
  manager's estimate, stated as an assumption. A script in the repository (`scripts/qa/case-figures.py`) rebuilds
  every exhibit and checks every figure in the text, and the unit tests recompute the market shares, growth rates and
  price elasticity with the platform's market functions.


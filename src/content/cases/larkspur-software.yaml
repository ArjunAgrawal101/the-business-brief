# Case Vault classification (src/lib/case-vault.ts).
industry: technology
functions: [strategy, operations, finance]
difficulty: advanced
qualifications: [ib-dp-sl, ib-dp-hl, undergraduate, mba]
keyConcepts: [ethics, change]
caseType: fictional
syllabus: ['1.3', '1.4', '2.4', '3.5', '5.9']

analysisQuestions:
  - id: lk-define
    commandTerm: Define
    ao: AO1
    marks: 2
    level: HL
    syllabus: ['5.9']
    prompt: Define the term *digital Taylorism*.
    guidance: >
      One mark for the use of digital technology to monitor and measure workers' tasks in detail, and one for the link
      to scientific management: work broken into measured units, with workers controlled through targets and data.
      Pulse's scores, alerts and rankings are an example.
  - id: lk-margins
    commandTerm: Calculate
    ao: AO4
    marks: 4
    paper: paper-2
    syllabus: ['3.5']
    exhibits: [ex-1]
    prompt: Using Exhibit 1, calculate Larkspur's gross profit margin and profit margin for 2025.
    answer: >
      Gross profit margin = 3,564 ÷ 4,752 × 100 = 75.0%. Profit margin = 184 ÷ 4,752 × 100 = 3.9%.
    guidance: >
      Two marks for each: one for the method and one for the answer. The profit margin uses profit before interest and
      tax, as the guide's formula does. The gap between the two margins shows that most of Larkspur's costs are
      expenses, mainly engineers, rather than the cost of serving each worker.
  - id: lk-concentration
    commandTerm: Calculate
    ao: AO4
    marks: 2
    syllabus: ['3.3']
    exhibits: [ex-2]
    prompt: Using Exhibit 2, calculate the percentage of Larkspur's 2025 revenue that came from the three largest logistics clients.
    answer: >
      The three clients have 25,000 workers at C$3.60 a month: 25,000 × 3.60 × 12 = C$1,080k. Share = 1,080 ÷ 4,752 ×
      100 = 22.7%.
    guidance: One mark for the clients' revenue and one for the percentage.
  - id: lk-conflict
    commandTerm: Explain
    ao: AO2
    marks: 4
    syllabus: ['1.4']
    exhibits: [ex-5, ex-7, ex-8, ex-9]
    prompt: Explain two sources of conflict between Larkspur's stakeholders over the Pulse request.
    guidance: >
      Two conflicts, each between named stakeholders and explained with the case, for two marks each. Strong examples:
      the logistics clients want worker-level data, while the workers who use the app do not want to be ranked; the
      investor wants revenue growth, while the engineers will not build Pulse; the founders' mission conflicts with the
      clients' demand. Naming stakeholders without the reason for the conflict earns one mark each at most.
  - id: lk-motivation
    commandTerm: Explain
    ao: AO2
    marks: 4
    syllabus: ['2.4']
    exhibits: [ex-3, ex-5]
    prompt: Using a motivation theory, explain how Pulse could affect the motivation of the warehouse workers it monitors.
    guidance: >
      Two marks for the theory and two for applying it. Taylor's scientific management would predict that measured
      targets raise output; Herzberg would warn that close supervision is a hygiene factor that causes dissatisfaction
      when it is felt as control; at HL, self-determination theory predicts that taking away autonomy weakens the
      motivation that comes from within. The survey's 46%, who would consider leaving a job that tracked them, is
      strong evidence.
  - id: lk-ethics
    commandTerm: Discuss
    ao: AO3
    marks: 10
    level: HL
    syllabus: ['5.9', '1.3']
    exhibits: [ex-3, ex-5, ex-6, ex-8]
    prompt: Discuss the benefits, risks and ethical implications of Pulse for Larkspur and its stakeholders.
    guidance: |
      A strong answer covers each part of the question with the case.

      - Benefits: C$241k a year of extra profit, three clients kept, and data the clients say they need.
      - Risks: engineers leaving, workers turning against the app, more care and retail clients leaving than forecast, and shared responsibility if the data is misused.
      - Ethical implications: monitoring that workers did not choose, decisions about people made by scores, possible bias in what is measured, and a company acting against its own mission.
      - A judgement that weighs them, for example that the ethical cost falls mainly on the people with least power to object.

      Answers that list points without weighing them stay in the middle of the range.
  - id: lk-decline
    commandTerm: Evaluate
    ao: AO3
    marks: 10
    syllabus: ['1.3', '1.4', '3.5']
    exhibits: [ex-1, ex-6, ex-9]
    prompt: Evaluate the option of declining the request and refocusing on care and retail clients.
    guidance: |
      A strong answer does four things.

      - It quantifies the cost: revenue down C$864k and profit down C$948k a year, a loss of C$764k in 2027.
      - It weighs what declining protects: the mission, the engineers, the workers' trust, the reputation that wins care and retail clients.
      - It considers timing and the investor: a loss a year before the funding round, against a growth target of 20%.
      - It reaches a judgement, perhaps that declining is principled but avoidable if Pulse Lite keeps most of the revenue.

      Answers that treat the decision as purely financial or purely ethical stay in the middle of the range.

exercise:
  role: You are Priya Nandakumar, Larkspur's chief executive and co-founder.
  brief: >
    The board meets in June: Owen, you and Hannah Osei from Lakeshore Ventures. The clients want an answer within the
    month, the engineers are waiting to hear whether they will be asked to build Pulse, and the investor wants growth.
    You wrote the mission on the wall yourself.
  task: Choose one response and defend it to the board, with its money, its people and its principles.
  deliverable: A decision memo of about 250 words, giving the response, its effect on profit against the alternatives, its ethical justification and the safeguards you would set.
  minutes: 40
  criteria:
    - Compares each response with the right alternative, losing the clients, not with today (Exhibit 6).
    - Weighs the ethical implications for workers, not only the effect on the company.
    - Considers the engineers, the investor and the clients, and what each needs to hear.
    - Sets safeguards or conditions that would make the chosen response acceptable, and says what would change the decision.

debrief:
  summary: >
    Larkspur's dilemma is real because both sides of it are. The clients' revenue matters a year before a funding
    round, and the mission, the engineers and the workers' trust are the company's advantage, not decoration. The
    strongest answers compare each response with the loss of the clients, notice how little extra full monitoring adds
    over Pulse Lite, and treat the ethics as part of the business case rather than an afterthought.
  byOption:
    - option: build-pulse
      fit: conditional
      body: >
        The most profitable response, C$241k a year, and it keeps all three clients. But compared with Pulse Lite it adds
        only C$148k a year, and it buys that with digital Taylorism the mission rejects, an engineering team that may
        lose members, workers 81% of whom do not want to be ranked, and legal exposure. Defensible only if the board
        believes the non-financial risks are small, which the evidence does not suggest.
    - option: build-lite
      fit: strong
      body: >
        It keeps two of the three clients and most of the revenue, gives workers control over their own data, fits the
        mission and can be sold to care and retail clients as well. Its gain is smaller, C$93k a year, because Bayline
        leaves; against declining it is still worth C$1,041k a year. It depends on Northgate and Halvorsen accepting
        data without rankings.
    - option: open-api
      fit: weak
      body: >
        It keeps the clients at little cost and lets Larkspur say it built no monitoring. But the monitoring runs on
        Larkspur's data all the same, the gain is only C$22k a year, and the legal adviser's warning still applies. It
        avoids the decision rather than making it.
    - option: decline
      fit: weak
      body: >
        The cleanest response in principle and the costliest in practice: revenue down C$864k, profit down C$948k a
        year and a loss of C$764k in 2027, a year before a funding round that needs growth of 20%. Principled, but
        unnecessary if Pulse Lite can keep most of the revenue.
  tradeoffs:
    - Revenue against mission. The most profitable response contradicts what the company exists to do.
    - The clients against the users. The people who pay and the people who use the app want opposite things.
    - Now against later. Declining protects the long-term advantage and endangers the short-term funding.
    - Control against responsibility. The interface hands control to clients without handing over the responsibility.
  evidenceThatMatters:
    - The three clients' share of revenue, 22.7% (Exhibit 2).
    - The small difference between Pulse and Pulse Lite, against the large cost of declining (Exhibit 6).
    - The workers' and engineers' views (Exhibits 5 and 8).
    - The legal adviser's warning, in the constraints.
  changeYourMind:
    - All three clients refuse Pulse Lite. The choice becomes Pulse or declining, and the funding round decides it.
    - Care and retail clients ask for worker-level monitoring too. The mission's commercial value is less than it seemed.
    - The investor agrees to fund a smaller, slower Larkspur. Declining becomes affordable.
  commonErrors:
    - Comparing each response with 2025 rather than with losing the clients.
    - Treating ethics as a final paragraph rather than a cost and a risk in the decision.
    - Assuming that the interface removes Larkspur's responsibility for how its data is used.
    - Defining digital Taylorism without showing how Pulse fits it.

frameworks:
  - name: Management information systems and digital Taylorism
    level: HL
    use: >
      Pulse is data analytics used to monitor and manage employees: the benefits, risks and ethical implications of
      such systems are the heart of the case.
    terms: [digital-taylorism, employee-monitoring, management-information-system, data-analytics, data-privacy, algorithmic-bias]
    subtopics: ['5.9']
  - name: Scientific management and motivation theory
    use: >
      Taylor would see Pulse as measurement that raises output; Herzberg and, at HL, self-determination theory explain
      why workers who lose autonomy may work less willingly and leave.
    terms: [scientific-management, herzbergs-motivation-hygiene-theory, self-determination-theory, autonomy]
    subtopics: ['2.4']
  - name: Stakeholder mapping and conflict
    use: >
      The clients and the investor have high influence; the workers who use the app have a high stake and little
      influence. Mapping them shows whose interests the decision must protect deliberately.
    terms: [stakeholder-mapping, stakeholder-conflict, internal-stakeholder, external-stakeholder]
    subtopics: ['1.4']
  - name: Mission, ethical objectives and corporate social responsibility
    use: >
      Larkspur's mission is a promise to the people who use its app. Ethical objectives and corporate social
      responsibility ask whether a business keeps such promises when they cost money.
    terms: [mission-statement, ethical-objectives, corporate-social-responsibility, business-ethics]
    subtopics: ['1.3']
  - name: Profitability ratios
    use: >
      A gross profit margin of 75.0% and a profit margin of 3.9% explain why losing revenue hurts so much: most costs
      are fixed, so lost revenue falls almost straight to the bottom line.
    terms: [gross-profit-margin, profit-margin]
    subtopics: ['3.5']
  - name: STEEPLE analysis
    use: >
      The ethical, legal and social forces around monitoring at work are external factors Larkspur cannot control and
      must read before it decides.
    terms: [steeple-analysis]
    tool: steeple-analysis
  - name: Force field analysis
    level: HL
    use: >
      The forces for Pulse (revenue, the funding round) against the forces against it (the mission, the engineers, the
      workers) show which force the board could weaken, for example through Pulse Lite.
    terms: [force-field-analysis]
    tool: force-field-analysis

discussion:
  - >
    Is a supplier responsible for how its customers use its product? Compare building Pulse with opening the interface,
    and say where you would draw the line.
  - >
    Larkspur's investor backed it because workers love the app. How should a founder value an advantage that does not
    appear in the accounts when it conflicts with revenue that does?
  - >
    Design the rules you would publish for Pulse Lite: what data, seen by whom, for what decisions, and how a worker
    could challenge a decision made from it.


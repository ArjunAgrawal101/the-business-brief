      - { label: Profit before interest and tax in 2027, numeric: true, format: money }
    rows:
      - [A. Build Pulse as asked, 1800, 588, 441, 200, 241, 425]
      - [B. Build Pulse Lite, 1500, 324, 243, 150, 93, 277]
      - [C. Open an API for clients, 600, 96, 72, 50, 22, 206]
      - [D. Decline and refocus, 0, -864, -648, 300, -948, -764]
    note: |
      Changes are against 2025, at the 75% gross margin on any change in revenue; other costs are each response's own running costs. The estimates are the product and sales teams' judgements.

      - A. Pulse at C$2.00 a worker a month for the three clients' 25,000 workers and for half of the other 12,500 logistics workers (6,250); clients in care and retail with 3,000 workers leave.
      - B. Pulse Lite at C$1.50 a month for Northgate and Halvorsen (20,000 workers) and for 10,000 workers in care and retail; Bayline, with 5,000 workers, leaves.
      - C. The interface at C$0.50 a month for the three clients' 25,000 workers; clients in care and retail with 1,000 workers leave.
      - D. The three clients leave; an extra C$300k a year of sales and marketing wins clients in care and retail with 4,000 workers.


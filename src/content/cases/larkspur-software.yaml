# Larkspur Software. A fictional organization; every figure is simulated.
# Revenue is active workers times the price per worker per month, times 12.
# Each response in Exhibit 6 changes revenue as stated, earns the 75% gross
# margin on that change, and adds its own running costs.
# scripts/qa/case-figures.py rebuilds every exhibit and checks every figure in
# the text; tests/unit/vault-cases.test.ts recomputes the margins and effects.

title: Larkspur Software
dek: A Toronto scheduling app built to give shift workers control over their time is asked by its biggest clients to watch them instead.
kind: fictional
dataStatus: simulated
organization:
  name: Larkspur Software
  sector: Workforce scheduling software, sold as a subscription
  location: Toronto, Canada
  size: 140 employees, of whom 58 are engineers; 990 client organizations
  legalForm: Privately held company, owned by its founders, employees and a venture capital investor
currency:
  code: CAD
  symbol: 'C$'
  unit: thousands of Canadian dollars (C$000), and dollars for prices
decision: Should Larkspur build the worker-monitoring features its largest clients demand, and if not, what should it offer instead?
brief: >
  Larkspur's app lets people who work in shifts see their rotas, swap shifts and record their hours, and its clients
  pay for each active worker each month. Its three largest clients, logistics firms that provide more than a fifth of
  its revenue, want Pulse: productivity scores, idle-time alerts and rankings for every worker. They will move to a
  rival if Larkspur will not build it. Building it pays best, but it contradicts the company's mission, most of its
  engineers have signed a letter against it, and the workers who use the app say they do not want it.

narrative:
  - >
    Priya Nandakumar spent eight years building nurses' rotas in a Toronto hospital, on spreadsheets that nobody liked.
    In 2018 she and Owen Kalu, a software engineer, founded Larkspur to build something better: an app that lets
    people who work in shifts see their schedules, swap shifts with colleagues and record their hours, and that lets
    managers fill gaps without phoning around. Its mission, printed on the wall of the office, is to give people who
    work in shifts more control over their time.
  - >
    Larkspur now has 990 client organizations: care homes and clinics, shops and restaurants, and warehouses. They pay
    for each active worker each month, and the workers use the app free (Exhibit 2). Revenue grew by 20.0% in 2025,
    and Larkspur made its first profit (Exhibit 1). A venture capital investor owns 35% of the company and expects to
    lead a new funding round in 2027, if growth continues (Exhibit 9).
  - >
    In the spring of 2026 Larkspur's three largest clients, all logistics firms, made a joint request. They want Pulse:
    an add-on that scores each warehouse worker's productivity hour by hour, alerts managers when a worker is idle,
    tracks where workers are during a shift and ranks them against one another. They will pay C$2.00 a worker a month
    for it, and they say that if Larkspur will not build it within a year they will move to a rival platform that will
    (Exhibit 7).
  - >
    The request split the company. Thirty-four of the 58 engineers signed an open letter saying that Pulse would turn
    a tool for workers into a tool for watching them (Exhibit 8). A survey of the people who use the app found most of
    them uncomfortable with being ranked (Exhibit 5). The sales team warned that some care and retail clients chose
    Larkspur precisely because it is not a surveillance tool.
  - >
    Priya has asked her team to cost four responses: build Pulse as the clients asked; build Pulse Lite, with team-level
    data, no rankings and individual data only for workers who choose to share it; open an interface that lets clients
    plug in their own analytics tools; or decline and win more care and retail clients instead (Exhibit 6). The board
    meets in June.

industryContext:
  - >
    Workforce management software helps employers with many hourly workers plan rotas, record hours and pay people
    correctly. It is usually sold as a subscription, priced for each user each month and run on the supplier's own
    servers. Revenue recurs, so keeping clients matters as much as winning them, and the extra cost of serving one more
    user is low, which is why gross margins in software tend to be high.
  - >
    Apps that workers carry on their phones collect detailed data about when and where people work. Employers
    increasingly want to use such data to measure productivity, and suppliers compete to offer analytics. Workers,
    unions and regulators are increasingly concerned about monitoring at work: what is collected, whether people know,
    and how decisions about them are made.
  - >
    A scheduling app needs workers to use it as well as employers to buy it. Its ratings in the app stores, and what
    workers say about it to one another, affect whether employers choose it. Large suppliers of human resources
    software offer scheduling as part of wider suites, so smaller specialists compete on how well they serve
    particular industries and the people who use them.

challenge: >
  Larkspur must answer its largest clients without losing either them or itself. Saying yes would keep more than a
  fifth of its revenue and add a profitable product, but it would make the company a supplier of the kind of
  monitoring its mission was meant to replace, and it risks its engineers, its reputation with workers and its other
  clients. Saying no protects all of that and turns a profit into a loss a year before the company needs investors'
  confidence. The board has to decide what Larkspur is for, and what that is worth.

financials:
  summary: >
    Larkspur's revenue grew by 20.0% in 2025, to C$4,752k, and it earned its first profit before interest and tax,
    C$184k, a profit margin of 3.9%. Its gross profit margin is high, 75.0%, because serving one more worker costs
    little; most of its costs are engineers' salaries. The three logistics clients pay C$1,080k a year, 22.7% of
    revenue. If they left and nothing replaced them, Larkspur would lose three quarters of that in gross profit and
    return to a loss. It has C$2,900k of cash to pay for any development.
  exhibits: [ex-1, ex-2, ex-6]


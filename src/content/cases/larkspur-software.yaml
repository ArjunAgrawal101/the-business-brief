  - id: ex-6
    title: Four responses to the request, forecast effect from 2027 (C$000)
    kind: table
    provenance: simulated-data
    columns:
      - { label: Response }
      - { label: Development in 2026, numeric: true, format: money }
      - { label: Change in revenue, numeric: true, format: money }
      - { label: Change in gross profit, numeric: true, format: money }

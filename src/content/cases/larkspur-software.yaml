    source: Simulated teaching data, prepared by the product and sales teams.

  - id: ex-7
    title: The clients' request
    kind: quote
    provenance: simulated-data
    quote:
      text: >
        Our margins depend on productivity, and we need data by worker, by hour, with alerts and rankings our managers
        can act on. Your scheduling is the best we have used. But if Larkspur will not build this within twelve months,
        we will move to a platform that will when our contracts come up for renewal.
      attribution: Marcus Leclerc, chief operating officer, Northgate Logistics, writing for the three clients
    source: Fictional letter, written for this case.

  - id: ex-8
    title: The engineers' letter
    kind: quote
    provenance: simulated-data
    quote:
      text: >
        We built Larkspur to give people who work in shifts more control over their time. Pulse would use the same app,
        on the same phones, to watch them minute by minute and rank them against each other. We do not think a company
        with our mission should build it, and some of us will not.
      attribution: Open letter to the founders, signed by 34 of Larkspur's 58 engineers
    source: Fictional letter, written for this case.

  - id: ex-9
    title: The investor's view
    kind: quote
    provenance: simulated-data
    quote:
      text: >
        We invested in Larkspur because workers love it, and that is still its advantage. But we need to see revenue
        growing by at least 20% a year before we lead the next round. Losing a fifth of revenue in one go would be very
        hard to explain.
      attribution: Hannah Osei, partner, Lakeshore Ventures
    source: Fictional email, written for this case.

constraints:
  - The three clients' contracts come up for renewal in twelve months, and they have said they will not renew without worker-level monitoring.
  - Larkspur has C$2,900k of cash and no borrowing; any development must be paid for from it until the next funding round.
  - The investor expects revenue growth of at least 20% a year ahead of the round planned for 2027.
  - "Larkspur's legal adviser has warned that clients must tell workers what is monitored and why, and that a supplier that designs the monitoring may share responsibility if the data is misused."

stakeholders:
  - name: Priya Nandakumar and Owen Kalu, founders
    interest: A growing company that stays true to its mission.
    influence: high
    stake: high
    concern: Building the thing they founded the company to replace, or losing the company by refusing.
  - name: Lakeshore Ventures, investor
    interest: Growth and a return on its investment.
    influence: high
    stake: medium
    concern: Losing a fifth of revenue before the next funding round.
  - name: Engineers
    interest: Building software they believe in.
    influence: medium
    stake: high
    concern: Being asked to build surveillance; some say they will leave rather than do it.
  - name: The three logistics clients
    interest: Productivity data by worker, by hour.
    influence: high
    stake: medium
    concern: Margins that depend on productivity, and a supplier that will not provide the data.
  - name: Workers who use the app
    interest: Control over their shifts, and fair treatment.
    influence: low
    stake: high
    concern: Being watched, scored and ranked through an app they rely on.
  - name: Care and retail clients
    interest: Good scheduling that their staff are happy to use.
    influence: medium
    stake: medium
    concern: A supplier whose reputation with workers changes.
  - name: Unions and regulators
    interest: Lawful, transparent and proportionate monitoring at work.
    influence: medium
    stake: low
    concern: Monitoring that workers do not know about or cannot challenge.

options:
  - id: build-pulse
    label: 'A. Build Pulse as asked'
    summary: Build productivity scores, idle-time alerts, location tracking and rankings for each worker.
    requires: C$1,800k of development and engineers willing to build it.
    upside: Keeps the three clients and adds the most profit, C$241k a year from 2027.
    risks: Contradicts the mission; some engineers may leave; workers may turn against the app; more care and retail clients may leave than the 3,000 workers forecast; legal exposure if the data is misused.
    evidence: [ex-3, ex-5, ex-6, ex-8]
  - id: build-lite
    label: 'B. Build Pulse Lite'
    summary: Offer team-level productivity data with no rankings, and individual data only for workers who choose to share it.
    requires: C$1,500k of development, and clients who accept data without rankings.
    upside: Keeps two of the three clients, sells to care and retail clients too, and fits the mission.
    risks: Bayline leaves, so the gain is smaller, C$93k a year; the other two may want more later.
    evidence: [ex-4, ex-5, ex-6]
  - id: open-api
    label: 'C. Open an interface for clients'
    summary: Let clients send Larkspur's data to analytics tools of their own choosing; build no monitoring.
    requires: C$600k of development and an interface that is secure.
    upside: Keeps the three clients at little cost, and Larkspur does not design the monitoring itself.
    risks: The monitoring happens anyway, on Larkspur's data; the gain is small, C$22k a year; the legal adviser's warning still applies.
    evidence: [ex-4, ex-6]
  - id: decline
    label: 'D. Decline, and win more care and retail clients'
    summary: Refuse the request, let the three clients go, and spend more on winning clients in care and retail.
    requires: An extra C$300k a year of sales and marketing, and the investor's patience.
    upside: Keeps the mission, the engineers and the trust of workers intact.
    risks: Revenue falls by C$864k and profit by C$948k a year, a loss of C$764k in 2027, a year before the funding round.
    evidence: [ex-2, ex-6, ex-9]

analysis:
  data:
    - The three logistics clients pay C$1,080k a year, 22.7% of revenue (Exhibit 2).
    - Larkspur's gross profit margin is 75.0% and its profit margin 3.9%, so losing those clients would turn its first profit into a loss (Exhibit 1).
    - From 2027, Pulse would add C$241k a year to profit, Pulse Lite C$93k and the interface C$22k, while declining would cost C$948k (Exhibit 6).
    - 81% of surveyed workers would be uncomfortable being ranked, and 34 of the 58 engineers signed the letter against Pulse (Exhibits 5 and 8).
  insight:
    - The real comparison is not with today but with losing the clients. Against declining, Pulse is worth C$1,189k a year and Pulse Lite C$1,041k, so the extra profit from full monitoring is only C$148k a year.
    - Pulse is digital Taylorism. It measures workers minute by minute and ranks them, which is the opposite of the autonomy that Larkspur's mission promises and that workers say they value.
    - The interface looks like a way to keep the clients without building the monitoring, but the monitoring would still run on Larkspur's data, and the legal adviser's warning applies to it too.
  options:
    - Building Pulse earns most and puts the company's mission, engineers and reputation with workers at risk for C$148k a year more than Pulse Lite.
    - Pulse Lite keeps most of the revenue, fits the mission and sells beyond logistics, at the cost of Bayline.
    - The interface keeps the clients cheaply and leaves Larkspur's data doing the watching.
    - Declining keeps everything except the money, and the money matters before a funding round.
  recommendation: >
    One defensible recommendation is Pulse Lite. Offer the logistics clients team and site data, no rankings, and
    individual data only where a worker chooses to share it, and sell the same product to care and retail clients as
    evidence that productivity and fairness can go together. Publish the rules on what Larkspur's data may be used
    for. Accept that Bayline may leave, and tell the investor why the company's advantage, the trust of the people who
    use it, is worth more than the difference.
  caveat: >
    This depends on Northgate and Halvorsen accepting data without rankings, which the product team expects but has
    not confirmed. If all three would leave rather than accept Pulse Lite, the choice becomes a stark one between the
    mission and survival before the funding round, and the founders would have to decide whether a smaller,
    consistent Larkspur, funded for longer, is a company the investor will back.

method: >
  Larkspur Software, its clients, its investor and everyone in this case are fictional, and every figure is simulated.
  Revenue is active workers times the price per worker per month, times twelve. Each response in Exhibit 6 changes
  revenue as its note states, earns the 75% gross margin on that change, and adds its own running costs; the
  estimates of which clients stay and leave are stated assumptions. A script in the repository
  (`scripts/qa/case-figures.py`) rebuilds every exhibit and checks every figure in the text, and the unit tests
  recompute the margins and the effect of each response.


# The four course concepts. The list is verified against the guide (see claims.yaml); the
# descriptions, questions and examples are the platform's own teaching
# framework, not the IB's wording.

- id: change
  name: Change
  order: 1
  provenance: aa-framework
  summary: >
    Business is the management of change: in markets, technology, people and the organization itself.
    The concept asks what has changed, what is changing, and what the change does to the decision in
    front of you.
  questions:
    - What has changed in this situation, and what is likely to change next?
    - Who gains and who loses from the change, and who is able to resist it?
    - Does the recommendation still hold if conditions change again?
  inPractice: >
    In a growth decision, change is both the reason the decision exists (new demand, a rival for sale)
    and its main risk (a new structure, new people, a new culture). An answer that uses the concept says
    how the change alters the evidence, rather than observing that change happens.

- id: creativity
  name: Creativity
  order: 2
  provenance: aa-framework
  summary: >
    Creativity is the generation of options that were not on the table: new products, new routes to
    market, new ways of organizing work. The concept asks whether the obvious options are the only ones.
  questions:
    - Is there an option that nobody has proposed yet?
    - Can two options be combined, sequenced or tested at small scale first?
    - What would a new entrant to this market do differently?
  inPractice: >
    In a decision the creative move is often a third option: piloting a franchise in one city before
    committing, or pairing a joint venture for mall sites with organic growth on the high street. An
    answer that uses the concept shows why the new option changes the trade-off, not just that it exists.

- id: ethics
  name: Ethics
  order: 3
  provenance: aa-framework
  summary: >
    Ethics asks whether a decision is right as well as whether it pays: how it treats employees,
    customers, suppliers, communities and the people with the least power to object.
  questions:
    - Who bears the cost of this decision, and did they have a say?
    - Would the decision survive being explained in public?
    - Is the business keeping the promises it has made, written and unwritten?
  inPractice: >
    An acquisition that closes outlets has an ethical side (redundancies, supplier contracts) as well as
    a financial one. An answer that uses the concept weighs that side against the financial case,
    instead of adding it as a final sentence.

- id: sustainability
  name: Sustainability
  order: 4
  provenance: aa-framework
  summary: >
    Sustainability asks whether a decision can be continued: environmentally, socially and financially,
    over time. It connects the survival of the business to the systems it depends on.
  questions:
    - Can this be kept up for five years, and at whose cost?
    - What resources does the decision consume, and are they replaced?
    - Does profit this year come at the expense of capability later?
  inPractice: >
    Growth that relies on cheaper ingredients, longer hours or a stretched cash position can raise this
    year's profit while weakening the business's ability to continue. The concept turns a one-year
    comparison into a question about the long run.

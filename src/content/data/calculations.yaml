# The calculation register. Each id matches a function in src/lib/finance.ts
# (or src/lib/decision-tree.ts for expected value), which is the only place the
# arithmetic is done. Formulas are standard; `verification` records how far the
# calculation's place in the IB syllabus has been confirmed.

- id: total-revenue
  name: Total revenue
  status: complete
  group: costs-revenue
  syllabus: [{ code: '3.3' }]
  verification: primary
  level: SL/HL
  formula: Total revenue = selling price per unit × quantity sold
  variables:
    - { symbol: "TR", meaning: "Total revenue", unit: "currency per period" }
    - { symbol: "P", meaning: "Selling price per unit", unit: "currency" }
    - { symbol: "Q", meaning: "Quantity sold", unit: "units per period" }
  unit: currency per period
  interpretation: Revenue is the value of sales, before any cost is paid. A business with rising revenue can still be making a loss.
  errors:
    - Treating revenue as profit.
    - Counting sales made by franchisees as the franchisor's own revenue. The franchisor's revenue is the fees and royalties it receives.
  page: /finance-desk/costs-and-revenue/
  example:
    title: "Atelier Barro: revenue in an average month at €22"
    case: atelier-barro
    currency: '€'
    labels: { unit: mug, units: mugs, period: month }
    inputs: { price: 22, quantity: 640 }
    interpretation: The studio takes €14,080 in an average month, before any cost is paid.
    implication: Revenue alone says nothing about profit. The studio's costs that month are almost as large.
  provenance: aa-framework
  order: 1

- id: total-cost
  name: Total cost
  status: complete
  group: costs-revenue
  syllabus: [{ code: '3.3' }]
  verification: primary
  level: SL/HL
  formula: Total cost = total fixed costs + (variable cost per unit × output)
  variables:
    - { symbol: "TC", meaning: "Total cost", unit: "currency per period" }
    - { symbol: "TFC", meaning: "Total fixed costs", unit: "currency per period" }
    - { symbol: "AVC", meaning: "Variable cost per unit", unit: "currency" }
    - { symbol: "Q", meaning: "Output", unit: "units per period" }
  unit: currency per period
  interpretation: Total cost rises with output only through variable costs. Fixed costs are paid even at zero output, which is why a quiet month can still be an expensive one.
  errors:
    - Multiplying fixed costs by output.
    - Leaving semi-variable costs out because they are neither purely fixed nor purely variable. Split them into their fixed and variable parts.
  page: /finance-desk/costs-and-revenue/
  example:
    title: "Atelier Barro: total cost of 640 mugs, from November"
    case: atelier-barro
    currency: '€'
    labels: { unit: mug, units: mugs, period: month }
    inputs: { fixedCosts: 8140, variableCost: 7.18, quantity: 640 }
    interpretation: Making and selling 640 mugs costs €12,735.20 a month, of which €8,140 is paid whatever happens.
    implication: Only €4,595.20 of the month's costs depends on how many mugs are made, so cutting output saves less than it seems.
  provenance: aa-framework
  order: 2

- id: profit
  name: Profit or loss
  status: complete
  group: costs-revenue
  syllabus: [{ code: '3.3' }, { code: '5.5' }]
  verification: primary
  level: SL/HL
  formula: Profit = total revenue − total cost
  variables:
    - { symbol: "TR", meaning: "Total revenue", unit: "currency per period" }
    - { symbol: "TC", meaning: "Total cost", unit: "currency per period" }
  unit: currency per period
  interpretation: A negative result is a loss. Profit is not cash, and a profitable business can still run out of cash.
  errors:
    - Using contribution per unit times output and forgetting to subtract fixed costs.
  page: /finance-desk/costs-and-revenue/
  example:
    title: "Atelier Barro: profit in an average month, from November, at €22"
    case: atelier-barro
    currency: '€'
    labels: { unit: mug, units: mugs, period: month }
    inputs: { price: 22, variableCost: 7.18, fixedCosts: 8140, quantity: 640 }
    interpretation: The studio makes €1,344.80 a month, down from €1,616.80 before the new electricity tariff.
    implication: The cost rise takes about a sixth of the profit if nothing else changes. That is the problem the owner has to solve.
  provenance: aa-framework
  order: 3

- id: contribution-per-unit
  name: Contribution per unit
  status: complete
  group: break-even
  syllabus: [{ code: '5.5' }]
  verification: primary
  level: SL/HL
  formula: Contribution per unit = selling price per unit − variable cost per unit
  variables:
    - { symbol: "P", meaning: "Selling price per unit", unit: "currency" }
    - { symbol: "AVC", meaning: "Variable cost per unit", unit: "currency" }
  unit: currency per unit
  interpretation: What each unit sold adds towards paying the fixed costs and, once they are covered, towards profit.
  errors:
    - Calling contribution per unit "profit per unit". It is not profit until the fixed costs are covered.
    - Forgetting a variable cost that is a share of the price, such as a card fee, which changes when the price changes.
  page: /finance-desk/break-even/
  example:
    title: "Atelier Barro: contribution per mug at €22, from November"
    case: atelier-barro
    currency: '€'
    labels: { unit: mug, units: mugs, period: month }
    inputs: { price: 22, variableCost: 7.18 }
    interpretation: Each mug sold adds €14.82 towards the studio's €8,140 of monthly fixed costs, and then to profit.
    implication: This is the figure that answers the question "what does one more mug do for the business?"
  provenance: aa-framework
  order: 4

- id: total-contribution
  name: Total contribution
  status: complete
  group: break-even
  syllabus: [{ code: '5.5' }]
  verification: primary
  level: SL/HL
  formula: Total contribution = contribution per unit × quantity sold
  variables:
    - { symbol: "C", meaning: "Contribution per unit", unit: "currency" }
    - { symbol: "Q", meaning: "Quantity sold", unit: "units per period" }
  unit: currency per period
  interpretation: Profit equals total contribution minus fixed costs.
  errors:
    - Treating total contribution as profit.
  page: /finance-desk/break-even/
  example:
    title: "Atelier Barro: total contribution from 640 mugs, from November"
    case: atelier-barro
    currency: '€'
    labels: { unit: mug, units: mugs, period: month }
    inputs: { price: 22, variableCost: 7.18, quantity: 640 }
    interpretation: The month's mugs contribute €9,484.80, which covers the €8,140 of fixed costs and leaves €1,344.80 of profit.
    implication: Profit is total contribution minus fixed costs, so any decision can be judged by what it does to contribution.
  provenance: aa-framework
  order: 5

- id: break-even-quantity
  name: Break-even quantity
  status: complete
  group: break-even
  syllabus: [{ code: '5.5' }]
  verification: primary
  level: SL/HL
  formula: Break-even quantity = total fixed costs ÷ contribution per unit
  variables:
    - { symbol: "TFC", meaning: "Total fixed costs", unit: "currency per period" }
    - { symbol: "C", meaning: "Contribution per unit", unit: "currency" }
  unit: units per period
  interpretation: The output at which total revenue equals total cost. In whole units it is rounded up, because one unit fewer leaves a loss.
  errors:
    - Rounding down to the nearest whole unit.
    - Dividing fixed costs by the selling price instead of by contribution per unit.
  page: /finance-desk/break-even/
  example:
    title: "Atelier Barro: break-even quantity at €22, from November"
    case: atelier-barro
    currency: '€'
    labels: { unit: mug, units: mugs, period: month }
    inputs: { fixedCosts: 8140, price: 22, variableCost: 7.18 }
    interpretation: The studio must sell 550 mugs a month to cover all its costs.
    implication: In an average month it sells 640, so it is above break-even, but not by much.
  provenance: aa-framework
  order: 6

- id: break-even-revenue
  name: Break-even revenue
  status: complete
  group: break-even
  syllabus: [{ code: '5.5', note: 'Not named in the guide, which lists break-even quantity; break-even revenue follows from it' }]
  verification: pedagogical
  level: SL/HL
  formula: Break-even revenue = break-even quantity × selling price per unit
  variables:
    - { symbol: "BEQ", meaning: "Break-even quantity", unit: "units per period" }
    - { symbol: "P", meaning: "Selling price per unit", unit: "currency" }
  unit: currency per period
  interpretation: The value of sales at which the business makes neither a profit nor a loss.
  errors:
    - Giving the answer in units when revenue was asked for.
  page: /finance-desk/break-even/
  example:
    title: "Atelier Barro: break-even revenue at €22, from November"
    case: atelier-barro
    currency: '€'
    labels: { unit: mug, units: mugs, period: month }
    inputs: { fixedCosts: 8140, price: 22, variableCost: 7.18 }
    interpretation: The studio needs about €12,083.67 of sales a month to break even, the exact break-even quantity multiplied by the price.
    implication: A target in money is easier to track week by week in the shop's till than a target in mugs.
  provenance: aa-framework
  order: 7

- id: margin-of-safety
  name: Margin of safety
  status: complete
  group: break-even
  syllabus: [{ code: '5.5' }]
  verification: primary
  level: SL/HL
  formula: Margin of safety = actual or forecast output − break-even output
  variables:
    - { symbol: "Q", meaning: "Actual or forecast output", unit: "units per period" }
    - { symbol: "BEQ", meaning: "Break-even output", unit: "units per period" }
  unit: units per period
  interpretation: How far sales can fall before the business makes a loss. A negative margin means the business is below break-even.
  errors:
    - Confusing the margin of safety with profit.
    - Using the exact break-even figure for one purpose and the rounded figure for another in the same answer.
  page: /finance-desk/break-even/
  example:
    title: "Atelier Barro: margin of safety at 640 mugs, from November"
    case: atelier-barro
    currency: '€'
    labels: { unit: mug, units: mugs, period: month }
    inputs: { fixedCosts: 8140, price: 22, variableCost: 7.18, quantity: 640 }
    interpretation: Sales could fall by 90 mugs a month, about 14%, before the studio makes a loss.
    implication: A slow month, or one lost wholesale customer, could take away the profit. That is why the owner is worried.
  provenance: aa-framework
  order: 8

- id: target-profit-output
  name: Target profit output
  status: complete
  group: break-even
  syllabus: [{ code: '5.5' }]
  verification: primary
  level: SL/HL
  formula: Target profit output = (total fixed costs + target profit) ÷ contribution per unit
  variables:
    - { symbol: "TFC", meaning: "Total fixed costs", unit: "currency per period" }
    - { symbol: "TP", meaning: "Target profit", unit: "currency per period" }
    - { symbol: "C", meaning: "Contribution per unit", unit: "currency" }
  unit: units per period
  interpretation: The output needed to reach a chosen profit. Compare it with capacity and with realistic demand before treating it as a plan.
  errors:
    - Subtracting the target profit from fixed costs instead of adding it.
  page: /finance-desk/break-even/
  example:
    title: "Atelier Barro: mugs needed for €2,000 of profit a month, from November"
    case: atelier-barro
    currency: '€'
    labels: { unit: mug, units: mugs, period: month }
    inputs: { fixedCosts: 8140, targetProfit: 2000, price: 22, variableCost: 7.18 }
    interpretation: At €22 the studio would need to sell 685 mugs a month to make €2,000, 45 more than it sells now.
    implication: That is 7% more sales at the same price. The survey in Exhibit 3 gives no reason to expect it, so the owner looks at price instead.
  provenance: aa-framework
  order: 9

- id: target-price
  name: Target price
  status: complete
  group: break-even
  syllabus: [{ code: '5.5' }]
  verification: primary
  level: SL/HL
  formula: Target price = ((total fixed costs + target profit) ÷ expected sales) + variable cost per unit
  variables:
    - { symbol: "TFC", meaning: "Total fixed costs", unit: "currency per period" }
    - { symbol: "TP", meaning: "Target profit", unit: "currency per period" }
    - { symbol: "Q", meaning: "Expected sales", unit: "units per period" }
    - { symbol: "AVC", meaning: "Variable cost per unit", unit: "currency" }
  unit: currency per unit
  interpretation: The price needed to reach a target profit if expected sales are achieved. A higher price usually lowers sales, so the expected sales figure is itself a judgement.
  errors:
    - Assuming sales stay the same when the price rises.
  page: /finance-desk/break-even/
  example:
    title: "Atelier Barro: the price for €2,000 of profit at 640 mugs, from November"
    case: atelier-barro
    currency: '€'
    labels: { unit: mug, units: mugs, period: month }
    inputs: { fixedCosts: 8140, targetProfit: 2000, variableCost: 6.30, quantity: 640, priceShare: 4 }
    interpretation: The studio would need to charge €23.07 a mug to make €2,000 a month, if it still sold 640 mugs.
    implication: The answer assumes sales stay at 640 at the higher price. Exhibit 3 suggests they would fall, so the price that meets the target is higher still, or the target is out of reach.
  provenance: aa-framework
  order: 10

- id: special-order
  name: Special order (contribution)
  status: complete
  group: contribution
  syllabus: [{ code: '5.5', note: 'HL toolkit: contribution costing (guide, p. 14)' }]
  verification: primary
  level: HL
  formula: Change in profit = (order price − variable cost per unit) × order size − extra fixed costs caused by the order
  variables:
    - { symbol: "P₀", meaning: "Price offered for the order", unit: "currency" }
    - { symbol: "AVC", meaning: "Variable cost per unit", unit: "currency" }
    - { symbol: "Q₀", meaning: "Order size", unit: "units" }
  unit: currency
  interpretation: If there is spare capacity and regular sales are unaffected, an order priced above variable cost adds to profit, even when its price is below the full cost per unit.
  errors:
    - Rejecting an order because its price is below average total cost, when fixed costs are already covered by regular sales.
    - Ignoring the effect on regular customers, who may ask for the same price.
  page: /finance-desk/contribution/
  example:
    title: "Atelier Barro: the hotel's order of 300 mugs at €11, in November"
    case: atelier-barro
    currency: '€'
    labels: { unit: mug, units: mugs, period: month }
    inputs: { orderPrice: 11, variableCost: 5.85, quantity: 300, extraFixedCosts: 150 }
    interpretation: The order adds €1,395 to November's profit, although €11 is far below the average cost of a shop mug.
    implication: On the numbers, accept. The judgement is whether the order harms the price position, and whether the kiln can take it.
  provenance: aa-framework
  order: 11

- id: labour-turnover
  name: Labour turnover
  status: complete
  group: people
  syllabus: [{ code: '2.4', note: 'HL only' }]
  verification: primary
  level: HL
  formula: Labour turnover = (number of employees leaving ÷ average number of employees) × 100
  variables:
    - { symbol: "L", meaning: "Employees leaving during the period", unit: "people" }
    - { symbol: "N", meaning: "Average number of employees in the period", unit: "people" }
  unit: per cent per period
  interpretation: The share of the workforce that leaves in a period. Judge it against the business's own history and its industry, not against an ideal of zero.
  errors:
    - Dividing by the number of employees at the end of the year instead of the average.
  page: /topics/leadership-and-management/
  example:
    title: "Halden Distribution: labour turnover on the night shift"
    case: halden-distribution
    inputs: { leavers: 28, averageEmployees: 54 }
    interpretation: Over half of the night shift's average workforce left in the year.
    implication: Against 22.2% on days, this is a problem concentrated on one shift, and a site-wide policy would treat it in the wrong place.
  provenance: aa-framework
  order: 12

- id: expected-value
  name: Expected value (decision trees)
  status: complete
  group: decision
  syllabus: [{ code: '1.5', note: 'Decision trees are a toolkit tool, used here on a growth decision' }]
  verification: primary
  level: SL/HL
  formula: Expected value = Σ (probability of outcome × payoff of outcome) − cost of the option
  variables:
    - { symbol: "p", meaning: "Probability of an outcome", unit: "between 0 and 1" }
    - { symbol: "x", meaning: "Payoff of the outcome", unit: "currency" }
  unit: currency
  interpretation: The average result over many repetitions of the same decision. It does not show the spread of outcomes or the risk of the worst one.
  errors:
    - Probabilities at a chance node that do not add up to 1.
    - Forgetting to subtract the cost of the option.
  page: /toolkit/decision-trees/
  example:
    title: "Marigold Kitchens: the expected value of franchising"
    case: marigold-kitchens
    currency: '₹'
    tree: { interactive: growth-tree-marigold, option: franchise }
    interpretation: On these estimates franchising is worth ₹59m on average, after its ₹10m cost.
    implication: It has the highest expected value of the three routes, but the decision also depends on control, quality and the founder's aims, which the number leaves out.
  provenance: aa-framework
  order: 13

- id: net-cash-flow
  name: Net cash flow
  status: complete
  group: cash-flow
  syllabus: [{ code: '3.7', note: "Cash flow forecasts (AO2, AO4); the forecast's layout is the guide's figure 10 (p. 63)" }]
  verification: primary
  level: SL/HL
  formula: Net cash flow = total cash inflows − total cash outflows
  variables:
    - { symbol: "NCF", meaning: "Net cash flow", unit: "currency per month" }
    - { symbol: "CI", meaning: "Total cash inflows", unit: "currency per month" }
    - { symbol: "CO", meaning: "Total cash outflows", unit: "currency per month" }
  unit: currency per month
  interpretation: Whether more cash came in than went out in the month. A negative net cash flow is not a loss; it can come from buying an asset or from customers paying late.
  errors:
    - Counting a sale made on credit as a cash inflow in the month of the sale.
    - Leaving an asset purchase out of the forecast because it is not an expense.
    - Writing a negative figure with a minus sign in a forecast laid out in the IB format, which uses brackets.
  page: /finance-desk/cash-flow/
  example:
    title: "Atelier Barro: January, with the second kiln bought outright"
    case: atelier-barro
    currency: '€'
    inputs: { inflows: 13420, outflows: 29442.80 }
    interpretation: In January €16,022.80 more leaves the bank than comes in, because the €18,000 kiln is paid in a quiet month.
    implication: The studio needs finance matched to the kiln's long life, or the balance breaks the overdraft limit.
  provenance: aa-framework
  order: 24

- id: closing-balance
  name: Closing balance
  status: complete
  group: cash-flow
  syllabus: [{ code: '3.7', note: "Cash flow forecasts (AO2, AO4); the forecast's layout is the guide's figure 10 (p. 63)" }]
  verification: primary
  level: SL/HL
  formula: Closing balance = opening balance + net cash flow
  variables:
    - { symbol: "CB", meaning: "Closing balance", unit: "currency at the end of the month" }
    - { symbol: "OB", meaning: "Opening balance", unit: "currency at the start of the month" }
    - { symbol: "NCF", meaning: "Net cash flow", unit: "currency per month" }
  unit: currency at the end of the month
  interpretation: The cash the business has at the end of the month, which becomes the next month's opening balance. A negative closing balance means the account is overdrawn.
  errors:
    - Starting each month from the same opening balance instead of carrying the previous closing balance forward.
    - Adding a negative net cash flow as if it were positive.
  page: /finance-desk/cash-flow/
  example:
    title: "Atelier Barro: January, with the second kiln bought outright"
    case: atelier-barro
    currency: '€'
    inputs: { opening: 10732, inflows: 13420, outflows: 29442.80 }
    interpretation: The account ends January overdrawn by €5,290.80, which is €3,290.80 beyond the €2,000 limit.
    implication: Payments due in January could be refused, though the studio is profitable over the winter.
  provenance: aa-framework
  order: 25

# Ratio analysis (3.5; 3.6 HL). Formulas from the guide's formula sheet, p. 64.
# The examples use Halden Distribution's accounts for the year to 30 June 2026,
# in £000, from src/content/interactives/finance-ratios-halden.yaml.

- id: gross-profit-margin
  name: Gross profit margin
  status: complete
  group: ratios
  syllabus: [{ code: '3.5', note: 'Formula: guide, p. 64' }]
  verification: primary
  level: SL/HL
  formula: Gross profit margin = (gross profit ÷ sales revenue) × 100
  variables:
    - { symbol: "GP", meaning: "Gross profit: sales revenue minus cost of sales", unit: "currency" }
    - { symbol: "S", meaning: "Sales revenue", unit: "currency" }
  unit: per cent of sales revenue
  interpretation: The share of each unit of sales revenue left after the direct costs of making the goods or providing the service. Compare it with the business's own past and with similar businesses, not with an ideal figure.
  errors:
    - Using profit before interest and tax instead of gross profit. That gives the profit margin.
    - Forgetting to multiply by 100.
  page: /finance-desk/ratios/
  example:
    title: "Halden Distribution: gross profit margin, year to 30 June 2026"
    case: halden-distribution
    currency: '£000'
    inputs: { grossProfit: 1920, salesRevenue: 9600 }
    interpretation: Each pound of revenue left 20p after cost of sales, down from 25p a year earlier.
    implication: Cost of sales rose faster than revenue. For a warehouse that cost is mostly people, so the margin measures how well the site is staffed and run.
  provenance: aa-framework
  order: 14

- id: profit-margin
  name: Profit margin
  status: complete
  group: ratios
  syllabus: [{ code: '3.5', note: 'Formula: guide, p. 64' }]
  verification: primary
  level: SL/HL
  formula: Profit margin = (profit before interest and tax ÷ sales revenue) × 100
  variables:
    - { symbol: "PBIT", meaning: "Profit before interest and tax", unit: "currency" }
    - { symbol: "S", meaning: "Sales revenue", unit: "currency" }
  unit: per cent of sales revenue
  interpretation: The share of each unit of sales revenue left after all the costs of running the business, before interest and tax. The gap between the gross profit margin and the profit margin is the weight of the business's expenses.
  errors:
    - Using profit before tax or the profit for the period. The guide uses profit before interest and tax.
    - Comparing margins across industries without asking how their costs differ.
  page: /finance-desk/ratios/
  example:
    title: "Halden Distribution: profit margin, year to 30 June 2026"
    case: halden-distribution
    currency: '£000'
    inputs: { pbit: 384, salesRevenue: 9600 }
    interpretation: Four pence in each pound of revenue was left as profit before interest and tax, down from ten pence.
    implication: There is little room for error. A loss of work or a further rise in costs could turn the profit into a loss.
  provenance: aa-framework
  order: 15

- id: roce
  name: Return on capital employed (ROCE)
  status: complete
  group: ratios
  syllabus: [{ code: '3.5', note: 'Formula and the definition of capital employed: guide, p. 64' }]
  verification: primary
  level: SL/HL
  formula: ROCE = (profit before interest and tax ÷ capital employed) × 100, where capital employed = non-current liabilities + equity
  variables:
    - { symbol: "PBIT", meaning: "Profit before interest and tax", unit: "currency" }
    - { symbol: "NCL", meaning: "Non-current liabilities", unit: "currency" }
    - { symbol: "E", meaning: "Equity", unit: "currency" }
  unit: per cent of capital employed, per year
  interpretation: The profit earned on the long-term finance invested in the business by lenders and owners together. Compare it with the return the same money could earn elsewhere, and with the interest rate on the business's borrowing.
  errors:
    - Dividing by equity alone, or by total assets. Capital employed is non-current liabilities plus equity.
    - Using profit after interest or after tax.
  page: /finance-desk/ratios/
  example:
    title: "Halden Distribution: ROCE, year to 30 June 2026"
    case: halden-distribution
    currency: '£000'
    inputs: { pbit: 384, nonCurrentLiabilities: 1650, equity: 3360 }
    interpretation: The long-term finance in the business earned 7.66% in the year, down from 24.08%.
    implication: The capital raised for the new system is in place; the profit it was meant to earn is not yet.
  provenance: aa-framework
  order: 16

- id: current-ratio
  name: Current ratio
  status: complete
  group: ratios
  syllabus: [{ code: '3.5', note: 'Formula: guide, p. 64' }]
  verification: primary
  level: SL/HL
  formula: Current ratio = current assets ÷ current liabilities
  variables:
    - { symbol: "CA", meaning: "Current assets: cash, debtors and stock", unit: "currency" }
    - { symbol: "CL", meaning: "Current liabilities: debts due within a year", unit: "currency" }
  unit: a ratio
  interpretation: How many times the assets that turn into cash within a year cover the debts due within a year. Too low is a risk to paying debts on time; too high can mean cash or stock lying idle.
  errors:
    - Putting current liabilities on top.
    - Reading a high ratio as always good. Idle cash and slow-moving stock raise it too.
  page: /finance-desk/ratios/
  example:
    title: "Halden Distribution: current ratio at 30 June 2026"
    case: halden-distribution
    currency: '£000'
    inputs: { currentAssets: 1727, currentLiabilities: 1307 }
    interpretation: Current assets cover current liabilities 1.32 times, down from 2.08 a year earlier.
    implication: The cover rests on money owed by clients. Halden had only £17k in the bank.
  provenance: aa-framework
  order: 17

- id: acid-test-ratio
  name: Acid test (quick) ratio
  status: complete
  group: ratios
  syllabus: [{ code: '3.5', note: 'Formula: guide, p. 64' }]
  verification: primary
  level: SL/HL
  formula: Acid test (quick) ratio = (current assets − stock) ÷ current liabilities
  variables:
    - { symbol: "CA", meaning: "Current assets", unit: "currency" }
    - { symbol: "St", meaning: "Stock", unit: "currency" }
    - { symbol: "CL", meaning: "Current liabilities", unit: "currency" }
  unit: a ratio
  interpretation: The cover the current ratio gives, without stock, which is the current asset slowest and least certain to turn into cash.
  errors:
    - Taking stock away from current liabilities instead of from current assets.
    - Forgetting that the ratio still relies on debtors paying.
  page: /finance-desk/ratios/
  example:
    title: "Halden Distribution: acid test ratio at 30 June 2026"
    case: halden-distribution
    currency: '£000'
    inputs: { currentAssets: 1727, stock: 290, currentLiabilities: 1307 }
    interpretation: Without stock, liquid assets still just cover the debts due within a year, at 1.10 times.
    implication: That depends on clients paying. More than a third of Halden's debtors is one client, Lumen Home.
  provenance: aa-framework
  order: 18

- id: stock-turnover-times
  name: Stock turnover (number of times)
  status: complete
  group: ratios
  syllabus: [{ code: '3.6', note: 'HL only. Formula and the definition of average stock: guide, p. 64' }]
  verification: primary
  level: HL
  formula: Stock turnover (number of times) = cost of sales ÷ average stock, where average stock = (opening stock + closing stock) ÷ 2
  variables:
    - { symbol: "CoS", meaning: "Cost of sales", unit: "currency" }
    - { symbol: "AS", meaning: "Average stock: (opening + closing) ÷ 2", unit: "currency" }
  unit: times a year
  interpretation: How many times in the year the business uses up and replaces its average stock. What is good depends on what the stock is; fresh food turns over far faster than furniture.
  errors:
    - Using closing stock instead of average stock.
    - Dividing sales revenue, instead of cost of sales, by average stock.
  page: /finance-desk/ratios/
  example:
    title: "Halden Distribution: stock turnover, year to 30 June 2026"
    case: halden-distribution
    currency: '£000'
    inputs: { costOfSales: 7680, openingStock: 230, closingStock: 290 }
    interpretation: Halden used up and replaced its average stock of packaging about thirty times in the year.
    implication: Halden does not own its clients' goods, so its stock is a small cost and this ratio says little about its problem.
  provenance: aa-framework
  order: 19

- id: stock-turnover-days
  name: Stock turnover (number of days)
  status: complete
  group: ratios
  syllabus: [{ code: '3.6', note: 'HL only. Formula: guide, p. 64' }]
  verification: primary
  level: HL
  formula: Stock turnover (number of days) = (average stock ÷ cost of sales) × 365
  variables:
    - { symbol: "AS", meaning: "Average stock: (opening + closing) ÷ 2", unit: "currency" }
    - { symbol: "CoS", meaning: "Cost of sales", unit: "currency" }
  unit: days
  interpretation: How many days, on average, stock is held before it is used or sold. Fewer days ties up less cash, until stock runs short.
  errors:
    - Using closing stock instead of average stock.
    - Forgetting to multiply by 365.
  page: /finance-desk/ratios/
  example:
    title: "Halden Distribution: stock turnover in days, year to 30 June 2026"
    case: halden-distribution
    currency: '£000'
    inputs: { costOfSales: 7680, openingStock: 230, closingStock: 290 }
    interpretation: Packaging was held for about twelve days on average.
    implication: Holding less would release a little cash, but stock is not where Halden's cash has gone.
  provenance: aa-framework
  order: 20

- id: debtor-days
  name: Debtor days
  status: complete
  group: ratios
  syllabus: [{ code: '3.6', note: 'HL only. Formula: guide, p. 64' }]
  verification: primary
  level: HL
  formula: Debtor days = (debtors ÷ total sales revenue) × 365
  variables:
    - { symbol: "D", meaning: "Debtors: money owed by customers", unit: "currency" }
    - { symbol: "S", meaning: "Total sales revenue", unit: "currency" }
  unit: days
  interpretation: How many days, on average, customers take to pay. Compare it with the credit terms the business offers.
  errors:
    - Dividing by cost of sales instead of total sales revenue.
    - Blaming customers for a rise without asking why they are paying later.
  page: /finance-desk/ratios/
  example:
    title: "Halden Distribution: debtor days at 30 June 2026"
    case: halden-distribution
    currency: '£000'
    inputs: { debtors: 1420, salesRevenue: 9600 }
    interpretation: Clients took about 54 days to pay, nine days longer than a year earlier.
    implication: Nine days of revenue is about £237k of cash, much of it in invoices Lumen Home disputes after late dispatches.
  provenance: aa-framework
  order: 21

- id: creditor-days
  name: Creditor days
  status: complete
  group: ratios
  syllabus: [{ code: '3.6', note: 'HL only. Formula: guide, p. 64' }]
  verification: primary
  level: HL
  formula: Creditor days = (creditors ÷ cost of sales) × 365
  variables:
    - { symbol: "Cr", meaning: "Creditors: money owed to suppliers", unit: "currency" }
    - { symbol: "CoS", meaning: "Cost of sales", unit: "currency" }
  unit: days
  interpretation: How many days, on average, the business takes to pay its suppliers. Longer keeps cash in the business; too long costs suppliers' goodwill and can cost discounts or credit.
  errors:
    - Dividing by sales revenue instead of cost of sales.
    - Treating longer creditor days as simply good. Suppliers can shorten terms or stop giving credit.
  page: /finance-desk/ratios/
  example:
    title: "Halden Distribution: creditor days at 30 June 2026"
    case: halden-distribution
    currency: '£000'
    inputs: { creditors: 1157, costOfSales: 7680 }
    interpretation: Halden took about 55 days to pay its suppliers, ten days longer than a year earlier.
    implication: Paying later protected Halden's cash, at the cost of its suppliers' goodwill.
  provenance: aa-framework
  order: 22

- id: gearing-ratio
  name: Gearing ratio
  status: complete
  group: ratios
  syllabus: [{ code: '3.6', note: 'HL only. Formula and the definition of capital employed: guide, p. 64' }]
  verification: primary
  level: HL
  formula: Gearing ratio = (non-current liabilities ÷ capital employed) × 100, where capital employed = non-current liabilities + equity
  variables:
    - { symbol: "NCL", meaning: "Non-current liabilities: long-term borrowing", unit: "currency" }
    - { symbol: "CE", meaning: "Capital employed: non-current liabilities + equity", unit: "currency" }
  unit: per cent of capital employed
  interpretation: The share of the long-term finance that is borrowed. Higher gearing means more interest to pay whatever happens to profit, so more risk, and more reward for the owners when profit is high.
  errors:
    - Using total liabilities instead of non-current liabilities.
    - Dividing by equity instead of capital employed.
  page: /finance-desk/ratios/
  example:
    title: "Halden Distribution: gearing at 30 June 2026"
    case: halden-distribution
    currency: '£000'
    inputs: { nonCurrentLiabilities: 1650, equity: 3360 }
    interpretation: A third of Halden's long-term finance is borrowed, twice the share of a year earlier.
    implication: Interest must now be paid on £1,650k of long-term loans while profit is falling.
  provenance: aa-framework
  order: 23

# Investment appraisal (3.8; NPV HL only). ARR and NPV from the guide's formula
# sheet (p. 65), discount factors from p. 66. The examples use Project A in
# src/content/interactives/finance-investment-halden.yaml.

- id: payback-period
  name: Payback period
  status: complete
  group: investment
  syllabus: [{ code: '3.8', note: 'Payback is in the syllabus (p. 30); the guide''s formula sheet gives no formula for it, so the method here is the standard one.' }]
  verification: primary
  level: SL/HL
  formula: Payback period = years before the cost is recovered + (amount still to recover ÷ net cash flow in the payback year) × 12 months
  variables:
    - { symbol: "C", meaning: "Capital cost, paid in year 0", unit: "currency" }
    - { symbol: "R", meaning: "Net cash flow in each year of use", unit: "currency" }
  unit: years and months
  interpretation: How long the project takes to return its cost in cash. Quicker payback means less time exposed to risk and earlier cash, which matters most to a business that is short of it.
  errors:
    - Working out the months without assuming the year's cash arrives evenly, or without saying so.
    - Choosing between projects on payback alone, ignoring the returns after payback.
  page: /finance-desk/investment-appraisal/
  example:
    title: "Halden Distribution: payback on the pack-and-label line (Project A)"
    case: halden-distribution
    currency: '£'
    inputs: { cost: 600000, r1: 90000, r2: 150000, r3: 180000, r4: 180000, r5: 180000, r6: 150000 }
    interpretation: The line pays for itself in exactly four years, two years before the end of its expected life.
    implication: Four years is a long wait for a business with £17,000 in the bank, which is why voice picking's faster payback is tempting.
  provenance: aa-framework
  order: 26

- id: average-rate-of-return
  name: Average rate of return (ARR)
  status: complete
  group: investment
  syllabus: [{ code: '3.8', note: 'Formula: guide, p. 65' }]
  verification: primary
  level: SL/HL
  formula: ARR = ((total returns − capital cost) ÷ years of use) ÷ capital cost × 100
  variables:
    - { symbol: "ΣR", meaning: "Total returns over the project's life", unit: "currency" }
    - { symbol: "C", meaning: "Capital cost", unit: "currency" }
    - { symbol: "n", meaning: "Years of use", unit: "years" }
  unit: per cent of the capital cost, per year
  interpretation: The average yearly profit from the project as a share of its cost. Compare it with the interest rate on borrowing and with other uses of the money.
  errors:
    - Dividing total profit by the capital cost without first dividing by the years of use.
    - Using total returns instead of total returns minus the capital cost.
  page: /finance-desk/investment-appraisal/
  example:
    title: "Halden Distribution: ARR on the pack-and-label line (Project A)"
    case: halden-distribution
    currency: '£'
    inputs: { cost: 600000, r1: 90000, r2: 150000, r3: 180000, r4: 180000, r5: 180000, r6: 150000 }
    interpretation: On average the line earns 9.17% of its cost a year over its six years.
    implication: That is above voice picking's 6.25%, but it says nothing about when the money arrives.
  provenance: aa-framework
  order: 27

- id: net-present-value
  name: Net present value (NPV)
  status: complete
  group: investment
  syllabus: [{ code: '3.8', note: 'HL only. Formula: guide, p. 65; discount factors: guide, p. 66' }]
  verification: primary
  level: HL
  formula: NPV = sum of the present values of the returns − original cost
  variables:
    - { symbol: "R", meaning: "Net cash flow in each year of use", unit: "currency" }
    - { symbol: "DF", meaning: "Discount factor for the year and the chosen rate, from the guide's table", unit: "a number below 1" }
    - { symbol: "C", meaning: "Original (capital) cost, paid now", unit: "currency" }
  unit: currency, in today's money
  interpretation: What the project's future returns are worth in today's money, less what it costs now. A positive NPV means the project earns more than the discount rate; the higher the rate, the less later returns count.
  errors:
    - Discounting the capital cost, which is paid now and is not discounted.
    - Taking a factor from the wrong row (year) or column (rate) of the table.
  page: /finance-desk/investment-appraisal/
  example:
    title: "Halden Distribution: NPV of the pack-and-label line at 10% (Project A)"
    case: halden-distribution
    currency: '£'
    inputs: { cost: 600000, rate: 10, r1: 90000, r2: 150000, r3: 180000, r4: 180000, r5: 180000, r6: 150000 }
    interpretation: At 10%, the line's returns are worth £60,390 more in today's money than its cost.
    implication: On this test it is worth doing. At 20%, the highest rate in the guide's table, it is not.
  provenance: aa-framework
  order: 28

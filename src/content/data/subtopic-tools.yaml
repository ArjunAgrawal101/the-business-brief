# Tools that serve a subtopic although their own data does not name it. Every
# tool page lists the subtopics it was built for, and the subtopic pages find
# those tools by themselves; this file adds the uses that cut across, so that
# every subtopic page can point to an existing tool and say what to do with it.
# The id is the subtopic's code. Each address must be a tool page the platform
# already has (checked by src/lib/connections.ts against the tool index), and
# each use says honestly what the tool does for this subtopic and no more.

- id: '1.6'
  tools:
    - href: /strategy-studio/stakeholder-map/
      use: Map the host country's stakeholders, from workers and suppliers to local competitors and the government, by their power and interest in a multinational's arrival.
    - href: /strategy-studio/steeple/
      use: Scan a host country's environment from the multinational's side, to see the opportunities and threats behind a decision to invest there.

- id: '2.6'
  tools:
    - href: /people-and-culture/organization-chart/
      use: Build a chart and count its levels and chains of command; every extra level is another step a formal message must pass through, one of the barriers to communication.
    - href: /people-and-culture/change-planner/
      use: Plan how to tell the people a change affects; the planner recommends education and communication where resistance comes from missing or wrong information.
    - href: /strategy-studio/stakeholder-map/
      use: Decide how to communicate with each stakeholder group, from managing it closely to keeping it informed, according to its power and interest.

- id: '2.7'
  tools:
    - href: /strategy-studio/stakeholder-map/
      use: Map employees, trade unions, managers, shareholders and customers by their power and interest in a dispute, to see whose support a settlement needs.
    - href: /people-and-culture/change-planner/
      use: Change imposed without consultation is a common source of conflict; weigh the resistance to a change and plan how to reduce it before it becomes a dispute.
    - href: /strategy-studio/force-field/
      use: Weigh the forces for and against a change in working practices, and see which restraining force would be cheapest to weaken (force field analysis is an HL toolkit tool).

- id: '3.1'
  tools:
    - href: /entrepreneurship-lab/start-up-costs/
      use: Separate one-off start-up costs, such as equipment and fitting out, from monthly running costs; the first are largely capital expenditure, the second revenue expenditure.
    - href: /finance-desk/investment-appraisal/
      use: See how a business judges capital expenditure before committing to it, with the payback period, the average rate of return and, at HL, net present value.
    - href: /finance-desk/lab/profit-and-loss/
      use: Build a statement of profit or loss line by line, where revenue expenditure appears as cost of sales and expenses.

- id: '4.3'
  tools:
    - href: /strategy-studio/scenarios/
      use: When a forecast is too uncertain to rely on, plan for several futures instead; the scenario planner builds four and tests each option against them (enrichment).

- id: '4.6'
  tools:
    - href: /strategy-studio/steeple/
      use: Scan a foreign market's environment, from its laws and exchange rates to its culture, and rank the factors that make entering it an opportunity or a threat.
    - href: /market-studio/stp-planner/
      use: Segment a foreign market and choose a target before entering it; a segment that is attractive at home may be small, or served differently, abroad.
    - href: /market-studio/marketing-mix/
      use: Build the mix for the new market and check that each P fits the customers there, the practical side of deciding whether to adapt the mix or keep it the same.

- id: '5.1'
  tools:
    - href: /operations-floor/capacity-and-productivity/
      use: Measure how well an operation turns inputs into outputs; capacity utilization and productivity are among the figures operations management is judged by (HL).

- id: '5.7'
  tools:
    - href: /strategy-studio/decision-tree/
      use: Compare the cost of a contingency measure with the expected cost of the crisis it guards against, using probabilities you can defend (decision trees are an IB toolkit tool).
    - href: /strategy-studio/stakeholder-map/
      use: Decide before a crisis which stakeholder groups must hear from the business first and how closely each must be managed.

- id: '5.8'
  tools:
    - href: /market-studio/product-life-cycle/
      use: See why a business needs new products; extension strategies add sales for a time, but cash inflows fall in decline, which is the case for research and development.
    - href: /market-studio/customer-persona/
      use: Set out a target customer's needs and frustrations with the evidence behind them, the starting point for developing a product that meets an unmet need.
    - href: /entrepreneurship-lab/feasibility/
      use: Score a new product or business idea for feasibility before money is committed to developing it.

- id: '5.9'
  tools:
    - href: /market-studio/market-metrics/
      use: Its customer lifetime value calculator (enrichment) shows what a loyal customer is worth, which is what a customer loyalty programme sets out to raise.
    - href: /operations-floor/capacity-and-productivity/
      use: Work out labour and capital productivity from output data, the measures that data-driven monitoring of employees, and digital Taylorism, track continuously.

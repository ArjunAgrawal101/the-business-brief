# Command terms. The grouping under AO1 to AO4 is the platform's reading and
# is unverified (claims.yaml: command-term-aos). Where a term also appears in
# the IB Economics guide, `definition` is that guide's wording (source
# ib-econ-guide-2022, status recorded). Where it does not, `definition` is the
# platform's own explanation, `definitionSource` is "platform", and the page
# says that the official wording is not available. `guidance`, `stem` and
# `pitfall` are the platform's teaching (Arjun Agrawal framework).

# ---------- AO1 ----------
- id: define
  term: Define
  ao: AO1
  aoStatus: unverified
  definition: Give the precise meaning of a word, phrase, concept or physical quantity.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: >
    One or two sentences that identify the term and nothing else. Business definitions often need their
    qualifying condition: a fixed cost does not change with output *within a range of output, in the short run*.
  stem: Define the term franchising.
  pitfall: Giving an example instead of a definition, or a definition that also fits a neighbouring term, such as defining a merger in words that also describe an acquisition.
  order: 1

- id: describe
  term: Describe
  ao: AO1
  aoStatus: unverified
  definition: Give a detailed account.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Say what something is like or how it works, with the detail that distinguishes it. No judgement is asked for.
  stem: Describe two internal economies of scale that Marigold Kitchens could gain from acquiring Tiffin Lane.
  pitfall: Naming a feature without the detail, such as writing "purchasing economies" without saying where the saving comes from.
  order: 2

- id: outline
  term: Outline
  ao: AO1
  aoStatus: unverified
  definition: Give a brief account or summary.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Brief, but more than a label. A point and its key feature, usually one or two sentences per point.
  stem: Outline two reasons why a business might choose to stay small.
  pitfall: One word per point, or a full paragraph of analysis where a sentence would do.
  order: 3

- id: state
  term: State
  ao: AO1
  aoStatus: unverified
  definition: Give a specific name, value or other brief answer without explanation or calculation.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: The answer, and only the answer.
  stem: State the formula for the margin of safety.
  pitfall: Explaining when nothing was asked. It costs time, and earns nothing.
  order: 4

# ---------- AO2 ----------
- id: analyse
  term: Analyse
  ao: AO2
  aoStatus: unverified
  definition: Break down in order to bring out the essential elements or structure.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: >
    Show the parts and how they connect, from cause to effect and from decision to consequence, in the
    organization in the case. Most business analysis is a short causal chain applied to the organization's
    own figures.
  stem: Analyse how a rise in rent affects Atelier Barro's break-even quantity and margin of safety.
  pitfall: Describing the parts without connecting them, or connecting them for a generic business instead of the one in the case.
  order: 5

- id: apply
  term: Apply
  ao: AO2
  aoStatus: unverified
  definition: Use an idea, equation, principle, theory or law in relation to a given problem or issue.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Take the tool or theory and use it on the case's facts, so that the result says something about this organization.
  stem: Apply the Ansoff matrix to Marigold Kitchens' growth options.
  pitfall: Explaining the theory in general and never using it on the case.
  order: 6

- id: comment
  term: Comment
  ao: AO2
  aoStatus: unverified
  definition: Give a judgment based on a given statement or result of a calculation.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Read or calculate the result, then say what it means for the business. Is the margin of safety comfortable? Is the turnover rate a problem, and compared with what?
  stem: Comment on the night shift's labour turnover at Halden Distribution.
  pitfall: Restating the number in words without judging it.
  order: 7

- id: demonstrate
  term: Demonstrate
  ao: AO2
  aoStatus: unverified
  definition: Show that something is the case by reasoning or evidence, usually with an example or a worked application.
  definitionSource: platform
  definitionStatus: unverified
  guidance: Prove the point rather than assert it. In a calculation question, the working is the demonstration.
  stem: Demonstrate that accepting the hotel order at €11.00 a mug would raise Atelier Barro's profit for the month.
  pitfall: Stating the conclusion without the reasoning or figures that establish it.
  order: 8

- id: distinguish
  term: Distinguish
  ao: AO2
  aoStatus: unverified
  definition: Make clear the differences between two or more concepts or items.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: State the difference as a difference. A joint venture creates a new business that the partners own together; a strategic alliance is cooperation without a new jointly owned business.
  stem: Distinguish between a joint venture and a strategic alliance.
  pitfall: Defining each term separately and leaving the reader to find the difference.
  order: 9

- id: explain
  term: Explain
  ao: AO2
  aoStatus: unverified
  definition: Give a detailed account including reasons or causes.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Why or how. Give the mechanism and its reasons, and connect them to the case.
  stem: Explain why rounding the break-even quantity down would understate the output Atelier Barro needs.
  pitfall: Describing what happens without saying why it happens.
  order: 10

- id: interpret
  term: Interpret
  ao: AO2
  aoStatus: unverified
  definition: Read data or information, recognize the pattern in it, and say what it shows in the context given.
  definitionSource: platform
  definitionStatus: unverified
  guidance: Move from the figures to their meaning. Trends, comparisons and outliers are the usual material.
  stem: Interpret the trend in Halden Distribution's on-time dispatch rate shown in Exhibit 1.
  pitfall: Copying figures out of the table without saying what they show.
  order: 11

- id: suggest
  term: Suggest
  ao: AO2
  aoStatus: unverified
  definition: Propose a solution, hypothesis or other possible answer.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: A plausible proposal with a reason. Several answers can be right; the reason must fit the case.
  stem: Suggest one way Marigold Kitchens could protect food quality if it franchises.
  pitfall: Proposing something the case rules out, such as an option the business cannot afford.
  order: 12

# ---------- AO3 ----------
- id: compare
  term: Compare
  ao: AO3
  aoStatus: unverified
  definition: Give an account of the similarities between two (or more) items or situations, referring to both (all) of them throughout.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Similarities, with both items in every point.
  stem: Compare franchising and a joint venture as ways for Marigold Kitchens to enter Mumbai.
  pitfall: Two separate descriptions, one after the other.
  order: 13

- id: compare-and-contrast
  term: Compare and contrast
  ao: AO3
  aoStatus: unverified
  definition: Give an account of similarities and differences between two (or more) items or situations, referring to both (all) of them throughout.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Similarities and differences, point by point, with both items in each point.
  stem: Compare and contrast autocratic and democratic leadership in the Halden Distribution warehouse.
  pitfall: Covering only differences, or treating the two items in separate halves.
  order: 14

- id: contrast
  term: Contrast
  ao: AO3
  aoStatus: unverified
  definition: Give an account of the differences between two (or more) items or situations, referring to both (all) of them throughout.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Differences, point by point, with both items in each point.
  stem: Contrast internal and external growth.
  pitfall: Describing one item fully and the other briefly.
  order: 15

- id: discuss
  term: Discuss
  ao: AO3
  aoStatus: unverified
  definition: Offer a considered and balanced review that includes a range of arguments, factors or hypotheses. Opinions or conclusions should be presented clearly and supported by appropriate evidence.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Arguments on more than one side, weighed against each other, and a conclusion that follows from the weighing. The evidence should come from the case.
  stem: Discuss whether Marigold Kitchens should franchise.
  pitfall: A list of advantages and a list of disadvantages with no weighing, followed by a conclusion that could have been written first.
  order: 16

- id: evaluate
  term: Evaluate
  ao: AO3
  aoStatus: unverified
  definition: Make an appraisal by weighing up the strengths and limitations.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Strengths and limitations, weighed against each other and against the organization's objectives, ending in a judgement that says what it depends on.
  stem: Evaluate the use of break-even analysis for Atelier Barro's pricing decision.
  pitfall: Weighing in general terms ("break-even has limitations") instead of saying which limitation matters in this case and why.
  order: 17

- id: examine
  term: Examine
  ao: AO3
  aoStatus: unverified
  definition: Consider an argument or concept in a way that uncovers the assumptions and interrelationships of the issue.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Look underneath the argument. What does it assume, and what is connected to what?
  stem: Examine the assumption that the acquisition of Tiffin Lane would give Marigold Kitchens economies of scale.
  pitfall: Repeating the argument instead of testing what it rests on.
  order: 18

- id: justify
  term: Justify
  ao: AO3
  aoStatus: unverified
  definition: Give valid reasons or evidence to support an answer or conclusion.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Reasons and evidence for a position, drawn from the case.
  stem: Justify the leadership style you would recommend for the night shift at Halden Distribution.
  pitfall: Reasons that would justify any choice equally well.
  order: 19

- id: recommend
  term: Recommend
  ao: AO3
  aoStatus: unverified
  definition: Present an advisable course of action with appropriate supporting evidence/reason in relation to a given situation, problem or issue.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: >
    Choose one course of action. Give the evidence for it, say why the alternatives are weaker, and say what
    would have to be true for it to fail. A recommendation that sits on the fence is not a recommendation.
  stem: Recommend whether Atelier Barro should accept the hotel's order.
  pitfall: Discussing every option and recommending none, or recommending without saying what the decision depends on.
  order: 20

- id: to-what-extent
  term: To what extent
  ao: AO3
  aoStatus: unverified
  definition: Consider the merits or otherwise of an argument or concept. Opinions and conclusions should be presented clearly and supported with appropriate evidence and sound argument.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: The answer is a degree, not a yes or no. Say how far, and under what conditions.
  stem: To what extent is a democratic style the right response to Halden Distribution's problems?
  pitfall: Answering "yes" or "no" without saying how far, or for whom.
  order: 21

# ---------- AO4 ----------
- id: annotate
  term: Annotate
  ao: AO4
  aoStatus: unverified
  definition: Add short notes to a diagram, chart or table to explain what it shows.
  definitionSource: platform
  definitionStatus: unverified
  guidance: Short notes placed on the diagram itself, each saying something a label alone would not.
  stem: Annotate the break-even chart to show the margin of safety at forecast sales.
  pitfall: Labels where notes were asked for.
  order: 22

- id: calculate
  term: Calculate
  ao: AO4
  aoStatus: unverified
  definition: Obtain a numerical answer showing the relevant stages in the working.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Formula, substitution, working, answer and unit. The working is what earns credit when the final figure is wrong.
  stem: Calculate Atelier Barro's break-even quantity for a month.
  pitfall: An answer with no working or no unit, or a break-even quantity rounded down.
  order: 23

- id: complete
  term: Complete
  ao: AO4
  aoStatus: unverified
  definition: Fill in the missing parts of a table, diagram or statement.
  definitionSource: platform
  definitionStatus: unverified
  guidance: Fill in exactly what is missing, consistently with what is already there.
  stem: Complete the missing totals in Atelier Barro's cost ledger.
  pitfall: Recalculating figures that were given, or changing them.
  order: 24

- id: construct
  term: Construct
  ao: AO4
  aoStatus: unverified
  definition: Display information in a diagrammatic or logical form.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: 'Build the diagram from the data: a break-even chart, a decision tree, a force field. Scale, labels and title all count.'
  stem: Construct a decision tree for Marigold Kitchens' choice between organic growth and franchising.
  pitfall: A sketch where an accurate construction was asked for.
  order: 25

- id: determine
  term: Determine
  ao: AO4
  aoStatus: unverified
  definition: Obtain the only possible answer.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: There is one right answer. Show how you reached it.
  stem: Determine the price Atelier Barro must charge to earn a profit of €4,000 a month at 900 mugs.
  pitfall: Giving a range or an approximation.
  order: 26

- id: draw
  term: Draw
  ao: AO4
  aoStatus: unverified
  definition: Represent by means of a labelled, accurate diagram or graph, using a pencil. A ruler (straight edge) should be used for straight lines. Diagrams should be drawn to scale. Graphs should have points correctly plotted (if appropriate) and joined in a straight line or smooth curve.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Accurate, labelled and to scale.
  stem: Draw a break-even chart for Atelier Barro.
  pitfall: Unlabelled axes, or lines that do not meet where the figures say they should.
  order: 27

- id: identify
  term: Identify
  ao: AO4
  aoStatus: unverified
  definition: Provide an answer from a number of possibilities.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Pick out the answer. Usually a word or a short phrase.
  stem: Identify the semi-variable cost in Atelier Barro's cost ledger.
  pitfall: Explaining at length when a short answer was asked for.
  order: 28

- id: label
  term: Label
  ao: AO4
  aoStatus: unverified
  definition: Add labels to a diagram.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Every line, axis and point that matters, named.
  stem: Label the break-even point and the margin of safety on the chart.
  pitfall: Labelling the lines but not the axes, or the reverse.
  order: 29

- id: plot
  term: Plot
  ao: AO4
  aoStatus: unverified
  definition: Mark the position of points on a diagram.
  definitionSource: ib-econ-guide-2022
  definitionStatus: recorded
  guidance: Points placed exactly where the data put them.
  stem: Plot total revenue and total cost at 0, 500 and 1,000 mugs.
  pitfall: Points placed by eye from a rough scale.
  order: 30

- id: prepare
  term: Prepare
  ao: AO4
  aoStatus: unverified
  definition: Put information into the form that is asked for, such as a forecast or a financial statement.
  definitionSource: platform
  definitionStatus: unverified
  guidance: Use the expected format, with its headings, order and totals.
  stem: Prepare a cost ledger for Atelier Barro showing fixed and variable costs separately.
  pitfall: The right figures in the wrong structure, or a structure missing its totals.
  order: 31

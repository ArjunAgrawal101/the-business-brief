# The Resources Library's curated entries. Everything else in the library is
# generated from the content (notes, briefs, revision, mindmaps, diagrams,
# frameworks, cases, practice, the teacher area and enrichment), so it cannot
# list something that does not exist (src/lib/library/catalogue.ts).
#
# A download must exist, in public/ or written by the build, or the build
# fails. Its format, size and pages are measured from the file, never typed
# here (src/lib/library/downloads.ts). `category` files the entry under one of
# the library's twelve categories (LIBRARY_CATEGORIES in src/lib/schemas.ts).

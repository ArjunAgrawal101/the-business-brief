# The platform's environments. Each is a module of one platform, not a
# separate site. A module is linked only when something in it works.

- id: business-brief
  name: The Business Brief
  purpose: The main learning environment. One brief per syllabus subtopic, from situation to decision to consequence.
  status: partial
  href: /topics/
  contains: [Three complete topic briefs, A syllabus map of all thirty-seven subtopics]
  order: 1

- id: case-room
  name: Case Room
  purpose: The structured examination of a business situation. Narrative, exhibits, stakeholders, options and a worked analysis.
  status: live
  href: /cases/marigold-kitchens/
  contains: [The case file layout used by every case]
  order: 2

- id: decision-room
  name: Decision Room
  purpose: Commit to a decision, then follow its consequences through the business and its stakeholders.
  status: live
  href: /decision-room/
  contains: [Three two-round decision rooms with debriefs]
  order: 3

- id: strategy-studio
  name: Strategy Studio
  purpose: Strategic frameworks, competitive choices and growth decisions.
  status: partial
  href: /toolkit/
  contains: [SWOT, STEEPLE, Ansoff matrix, decision trees, force field analysis]
  order: 4

- id: finance-desk
  name: Finance Desk
  purpose: Costs, revenues, contribution and break-even now; accounts, ratios, cash flow, budgets and investment appraisal later.
  status: partial
  href: /finance-desk/
  contains: [Costs and revenue workspace, Break-even workspace, Contribution and special orders (HL)]
  order: 5

- id: market-studio
  name: Market Studio
  purpose: Marketing planning, market research, segmentation, positioning and the marketing mix.
  status: planned
  order: 6

- id: people-and-culture
  name: People and Culture
  purpose: Leadership, motivation, communication, structure and organizational culture.
  status: partial
  href: /topics/leadership-and-management/
  contains: [Leadership and management brief, Style matcher, Halden Distribution case]
  order: 7

- id: operations-floor
  name: Operations Floor
  purpose: Operations methods, quality, location, production planning and crisis management.
  status: planned
  contains: [Break-even analysis (5.5) is worked in the Finance Desk meanwhile]
  order: 8

- id: boardroom
  name: Boardroom
  purpose: Extended decisions across several functions and several rounds, ending in a defended strategic recommendation.
  status: planned
  order: 9

- id: case-vault
  name: Case Vault
  purpose: A searchable library of real and simulated business cases, each labelled for its evidence.
  status: live
  href: /cases/
  contains: [Three fictional teaching cases with simulated data]
  order: 10

- id: exam-desk
  name: Exam Desk
  purpose: How each assessment component works, what it rewards, and original practice for each.
  status: live
  href: /exam-desk/
  contains: [Paper 1, Paper 2, Paper 3, Practice questions with markscheme reveal]
  order: 11

- id: examiner-lens
  name: Examiner Lens
  purpose: Command terms, what each asks an answer to do, and the errors that cost marks. Examiner observations will be added, each cited, when subject reports are supplied.
  status: partial
  href: /examiner-lens/
  contains: [Thirty-one command terms with the source of each definition, The errors that cost marks, gathered from every topic]
  order: 12

- id: ia-studio
  name: IA Studio
  purpose: Support for the internal assessment research project.
  status: partial
  href: /ia-studio/
  contains: [What is known about the research project, with sources, A project planner saved on your device]
  order: 13

- id: revision-brief
  name: Revision Brief
  purpose: One concise, printable page per topic, with retrieval questions.
  status: partial
  href: /revision/
  contains: [Revision Briefs for the three complete topics]
  order: 14

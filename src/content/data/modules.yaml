# The platform's environments. Each is a module of one platform, not a
# separate site. A module is linked only when something in it works.

- id: business-brief
  name: The Business Brief
  purpose: The main learning environment. A page for every syllabus subtopic, with full notes or a complete brief where the coverage tracker marks it complete.
  status: partial
  href: /topics/
  contains: [A page for every subtopic of the course, Full notes and complete briefs (see the coverage tracker), Mindmaps, diagrams and key terms for every subtopic]
  order: 1

- id: case-room
  name: Case Room
  purpose: The structured examination of a business situation. Narrative, exhibits, stakeholders, options and a worked analysis.
  status: live
  href: /case-room/
  lead: >
    Where a case is worked, not just read. The case lab takes one business through the diagnosis chain, problem,
    cause, strategy, implementation and evaluation, checking each stage against the evidence; the case files hold the
    narrative, exhibits, stakeholders, options and a worked analysis for each fictional business.
  contains: [A staged case lab, The case file layout used by every case]
  items:
    - { kind: Case, title: 'Case Vault: the archive', href: /case-vault/, text: 'Every case in one archive, with filters by industry, function, difficulty, qualification, topic and concept, and a Case of the Week.' }
    - { kind: Case lab, title: 'Halden Distribution: diagnose before you decide', href: /case-room/halden-diagnosis/, text: 'Five stages from the symptoms to a judgement on the results, with a plan scheduled against the deadline and a memo of your own reasoning.' }
    - { kind: Case, title: Halden Distribution, href: /cases/halden-distribution/, text: 'A warehouse whose dispatch, errors and staff turnover went wrong after a new system arrived.' }
    - { kind: Case, title: Marigold Kitchens, href: /cases/marigold-kitchens/, text: 'A profitable restaurant group in Pune deciding whether, how fast and by which route to grow.' }
    - { kind: Case, title: Atelier Barro, href: /cases/atelier-barro/, text: 'A ceramics studio facing an energy price rise and an order at half its usual price.' }
  syllabus: ['2.3', '1.5', '3.3']
  planned:
    - A case lab following the analysis chain, data, insight, option and recommendation, for Atelier Barro's pricing
  order: 2


- id: decision-room
  name: Decision Room
  purpose: Commit to a decision, then follow its consequences through the business and its stakeholders.
  status: live
  href: /decision-room/
  contains: [Three two-round decision rooms with debriefs]
  order: 3

- id: strategy-studio
  name: Strategy Studio
  purpose: A consulting-style strategy environment. Diagnose a position, generate options, decide and plan, with ten tools that produce structured analysis you can export.
  status: live
  href: /strategy-studio/
  lead: >
    Where a strategic decision is worked the way a consultancy would work it: diagnose the position, generate options,
    decide between them and plan the change. Ten tools, each opening on the same fictional client, Northvale Cycles,
    each saying what it is for, what it cannot do and where it stands in the IB course, and each keeping your own
    analysis on this device to export, print or carry into a recommendation memo.
  contains: [SWOT builder with a TOWS matrix, STEEPLE builder, Five Forces assessor (enrichment), Ansoff planner, BCG portfolio matrix, "Porter's generic strategies (HL)", Stakeholder map, Decision tree builder, Force field builder (HL), Option appraisal and recommendation memo]
  items:
    - { kind: Workspace, title: SWOT builder, href: /strategy-studio/swot/, text: 'Weight internal and external factors, with checks on which side of the line each falls, then pair them into options in a TOWS matrix.' }
    - { kind: Workspace, title: STEEPLE builder, href: /strategy-studio/steeple/, text: 'Seven headings of external factors, each rated for impact and likelihood, ranked into what to act on, plan for and watch.' }
    - { kind: Workspace, title: Five Forces assessor, href: /strategy-studio/five-forces/, text: 'Rate the five forces on a market with evidence, see its overall attractiveness and what would change it. Enrichment: not in the IB course.' }
    - { kind: Workspace, title: Ansoff planner, href: /strategy-studio/ansoff/, text: 'Place your own growth options by product and market, with the method of growth and the risks of each direction.' }
    - { kind: Workspace, title: BCG portfolio matrix, href: /strategy-studio/bcg-matrix/, text: 'Plot products by relative market share and market growth, sized by revenue, with guidance on the balance of the portfolio.' }
    - { kind: Workspace, title: "Porter's generic strategies", href: /strategy-studio/generic-strategies/, text: 'Position a business and its rivals by source of advantage and scope, and check the risk of being stuck in the middle.', level: HL }
    - { kind: Workspace, title: Stakeholder map, href: /strategy-studio/stakeholder-map/, text: 'Map stakeholders by power and interest, with their stance, and get a suggested way of managing each.' }
    - { kind: Workspace, title: Decision tree builder, href: /strategy-studio/decision-tree/, text: 'Build a tree of any shape and see expected values rolled back, probabilities checked and the best branch marked.' }
    - { kind: Workspace, title: Force field builder, href: /strategy-studio/force-field/, text: 'Your own change, its driving and restraining forces, and what weakening one would do to the balance.', level: HL }
    - { kind: Workspace, title: Option appraisal and recommendation memo, href: /strategy-studio/option-appraisal/, text: 'Score options against weighted criteria, test the ranking for sensitivity, and write a structured memo to copy or print.' }
    - { kind: Brief, title: Growth and evolution, href: /topics/growth-and-evolution/, text: 'Should Marigold Kitchens grow, how fast, and by which route? Economies of scale, internal and external growth, and the case for staying small.' }
    - { kind: Decision Room, title: 'Marigold Kitchens: which way to grow?', href: /decision-room/marigold-growth/, text: 'Choose a growth route and live with what it does to costs, control and the brand.' }
    - { kind: Guide, title: SWOT analysis, href: /toolkit/swot-analysis/, text: 'Internal strengths and weaknesses, external opportunities and threats, and the step most answers skip.' }
    - { kind: Guide, title: STEEPLE analysis, href: /toolkit/steeple-analysis/, text: 'Seven kinds of external factor, and how to choose the ones that matter.' }
  syllabus: ['1.3', '1.4', '1.5', '2.1', '4.1', '4.2', '4.5']
  planned:
    - Guides for the BCG matrix, Porter's generic strategies (HL) and circular business models
  order: 4


- id: finance-desk
  name: Finance Desk
  purpose: Finance and break-even worked in full, on fictional cases and with your own figures, from costs and break-even to ratios, cash flow, budgets and investment appraisal.
  status: live
  href: /finance-desk/
  contains: [The Financial Laboratory (20 calculators), Costs and revenue workspace, Break-even workspace, Contribution and special orders (HL), Ratio desk, Cash flow lab in the IB layout, Investment appraisal desk]
  order: 5

- id: market-studio
  name: Market Studio
  purpose: A marketing laboratory for unit 4. Nine working instruments, from market metrics and research to segmentation, positioning, the marketing mix, the product life cycle, campaigns and budgets.
  status: partial
  href: /market-studio/
  lead: >
    Nine instruments for unit 4, marketing, each working on a fictional business you can change and keeping your work
    in this browser: measure a market, research it, picture its customers, choose where to compete, build a mix that
    holds together, follow a product through its life, and plan, fund and measure a campaign. The worked examples
    follow Corner Brew, the café of the 4.2 notes.
  contains: [Market metrics calculators, Research questionnaire builder, Customer persona creator, STP planner, Competitor positioning map, Marketing mix builder, Product life cycle simulator, Campaign planner, Budget allocation tool]
  items:
    - { kind: Calculation, title: Market metrics calculators, href: /market-studio/market-metrics/, text: 'Market share, market growth and relative share for a market you define, with customer lifetime value as enrichment.' }
    - { kind: Workspace, title: Market research questionnaire builder, href: /market-studio/research-questionnaire/, text: 'Write a survey with checks for leading and double-barrelled questions, and notes on quota, random and convenience samples.' }
    - { kind: Workspace, title: Customer persona creator, href: /market-studio/customer-persona/, text: 'A portrait of one typical customer: needs, pains, channels and the evidence behind it. Enrichment.' }
    - { kind: Planner, title: STP planner, href: /market-studio/stp-planner/, text: 'Segment, weigh the segments, choose targets and write a positioning statement.' }
    - { kind: Workspace, title: Competitor positioning map, href: /market-studio/positioning-map/, text: 'Your own axes and rivals, the open spaces outlined, and a four-question test for any gap.' }
    - { kind: Workspace, title: Marketing mix builder, href: /market-studio/marketing-mix/, text: 'Four or seven Ps, checked against the target, the position and each other.' }
    - { kind: Workspace, title: Product life cycle simulator, href: /market-studio/product-life-cycle/, text: 'Sales, profit and cash flow through the stages, and what extension strategies add.' }
    - { kind: Planner, title: Marketing campaign planner, href: /market-studio/campaign-planner/, text: 'Objective, audience, message, channels, a Gantt timeline and KPIs.' }
    - { kind: Workspace, title: Marketing budget allocation, href: /market-studio/budget-allocation/, text: 'Spread a promotion budget across channels and see diminishing returns, on an illustrative model. Enrichment.' }
    - { kind: Interaction, title: "Atelier Barro's share of a growing market", href: /market-studio/market-metrics/#ix-market-share-porto, text: 'A case exercise: rising sales, falling share, and (HL) the importance of market leadership.' }
    - { kind: Interaction, title: "Where Atelier Barro sits in customers' minds", href: /market-studio/positioning-map/#ix-market-position-map-porto, text: 'A case exercise: choose the axes, find the gap, judge whether it is worth filling.' }
  syllabus: ['4.1', '4.2', '4.4', '4.5']
  planned:
    - Instruments for sales forecasting (4.3, HL) and international marketing (4.6, HL)
  order: 6


- id: people-and-culture
  name: People and Culture
  purpose: Leadership, motivation, structure, workforce planning and change, with working tools for unit 2, human resource management.
  status: partial
  href: /people-and-culture/
  lead: >
    The human side of every decision: how people are organized, led, motivated and kept, and how they take a change.
    The room's working tools run from the person to the whole organization, each on a fictional worked example, and
    its case is Halden Distribution, a warehouse whose new manager inherits a workforce that was led one way for
    fifteen years.
  contains: [Motivation analysis, Organization chart creator, Leadership scenarios, Workforce planning tool, Change management planner, Leadership and management brief, Style matcher, Functions sorter, Halden Distribution case, Labour turnover (HL)]
  items:
    - { kind: Workspace, title: Motivation analysis, href: /people-and-culture/motivation-analysis/, text: 'Rate a job, read it through each motivation theory the guide names, and see the rewards that fit.' }
    - { kind: Interaction, title: Leadership scenarios, href: /people-and-culture/leadership-scenarios/, text: 'Choose a style for six original situations and see the likely consequences.' }
    - { kind: Workspace, title: Organization chart creator, href: /people-and-culture/organization-chart/, text: 'Build a chart post by post: levels, spans of control, chains of command and delayering.' }
    - { kind: Planner, title: Workforce planning tool, href: /people-and-culture/workforce-planning/, text: 'Project staff, leavers and retirements, and find the recruitment needed, with labour turnover at HL.' }
    - { kind: Planner, title: Change management planner, href: /people-and-culture/change-planner/, text: 'Forces for and against a change, the stakeholders it affects, the resistance to expect and the steps to take.' }
    - { kind: Brief, title: Leadership and management, href: /topics/leadership-and-management/, text: 'Management and leadership, the leadership styles, and how to choose one for a situation.' }
    - { kind: Case, title: Halden Distribution, href: /cases/halden-distribution/, text: 'A warehouse whose dispatch, errors and staff turnover went wrong after a new system arrived.' }
    - { kind: Decision Room, title: 'Halden Distribution: how to lead in the first ninety days', href: /decision-room/halden-leadership/, text: 'Decide how the new site manager should lead in her first ninety days.' }
    - { kind: Interaction, title: Style matcher, href: /topics/leadership-and-management/#ix-lead-style-matcher, text: 'Choose the leadership style each of eight situations calls for.' }
    - { kind: Interaction, title: Functions of management sorter, href: /topics/leadership-and-management/#ix-lead-functions-sorter, text: "Sort a manager's week into planning, organizing, commanding, coordinating and controlling." }
    - { kind: Calculation, title: Labour turnover, href: /topics/leadership-and-management/#calc-labour-turnover, text: "Leavers as a share of average employees, worked for both of Halden's shifts.", level: HL }
  syllabus: ['2.1', '2.2', '2.3', '2.4']
  planned:
    - Tools for organizational culture (2.5, HL), communication (2.6) and industrial relations (2.7, HL)
  order: 7


- id: operations-floor
  name: Operations Floor
  purpose: Production methods, location, capacity, productivity, stock control and order quantities, with working tools for unit 5, operations management.
  status: partial
  href: /operations-floor/
  lead: >
    Operations turn inputs into outputs. The room is laid out as a production system: design the process, run it and
    keep it supplied, with a working tool for each question and one fictional business, Wrenhurst Cycles, running
    through most of them. The room's first interactions, on Atelier Barro's studio and Marigold Kitchens' restaurants,
    are here too. Break-even (5.5) is worked on the Finance Desk.
  contains: [Production methods exercise, Weighted location assessment, Capacity utilization and productivity calculator (HL), Stock control simulator (HL), Economic order quantity calculator (enrichment), Location weighted scoring, Capacity utilization and productivity (HL), Stock control chart (HL)]
  items:
    - { kind: Interaction, title: Production methods exercise, href: /operations-floor/production-methods/, text: 'Choose job, batch, flow production or mass customization for six products.' }
    - { kind: Workspace, title: Weighted location assessment, href: /operations-floor/location-assessment/, text: 'Score sites on your own weighted factors, and see how far the ranking depends on the weights.' }
    - { kind: Workspace, title: Capacity utilization and productivity calculator, href: /operations-floor/capacity-and-productivity/, text: 'Capacity utilization, defect rate, productivity and operating leverage for two periods, with workings.', level: HL }
    - { kind: Workspace, title: Stock control simulator, href: /operations-floor/stock-control/, text: 'Run a reorder plan against weeks of demand and a late delivery, with every stock-out flagged.', level: HL }
    - { kind: Workspace, title: Economic order quantity calculator, href: /operations-floor/economic-order-quantity/, text: 'The order size that balances ordering and holding costs, with a discount check. Enrichment.' }
    - { kind: Interaction, title: 'Location scoring: Marigold Kitchens', href: /operations-floor/#ix-ops-location-marigold, text: 'Weigh the factors for the first Mumbai restaurant.' }
    - { kind: Interaction, title: 'Capacity and productivity: Atelier Barro', href: /operations-floor/#ix-ops-capacity-atelier, text: "How hard the studio's kiln works in a quiet month and a busy one.", level: HL }
    - { kind: Interaction, title: 'Stock control: Atelier Barro', href: /operations-floor/#ix-ops-stock-control-atelier, text: 'When the studio should order more clay, and what a late delivery does.', level: HL }
  syllabus: ['5.2', '5.4', '5.6']
  planned:
    - A supply chain mapper, with stages, lead times, risks and the critical weaknesses highlighted
    - A quality management simulation comparing quality control with quality assurance
    - Tools for crisis management and contingency planning (5.7, HL), research and development (5.8, HL) and management information systems (5.9, HL)
  order: 8



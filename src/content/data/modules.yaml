# The platform's environments. Each is a module of one platform, not a
# separate site. A module is linked only when something in it works.

- id: business-brief
  name: The Business Brief
  purpose: The main learning environment. One brief per syllabus subtopic, from situation to decision to consequence.
  status: partial
  href: /topics/
  contains: [Three complete topic briefs, A syllabus map of all thirty-seven subtopics]
  order: 1

- id: case-room
  name: Case Room
  purpose: The structured examination of a business situation. Narrative, exhibits, stakeholders, options and a worked analysis.
  status: live
  href: /cases/marigold-kitchens/
  contains: [The case file layout used by every case]
  order: 2

- id: decision-room
  name: Decision Room
  purpose: Commit to a decision, then follow its consequences through the business and its stakeholders.
  status: live
  href: /decision-room/
  contains: [Three two-round decision rooms with debriefs]
  order: 3

- id: strategy-studio
  name: Strategy Studio
  purpose: Strategic frameworks, competitive choices and growth decisions.
  status: partial
  href: /strategy-studio/
  lead: >
    Where strategic tools are used on a real decision rather than learned as lists. Each tool here is applied
    to a case, says what evidence it needs, and says what it hides. The toolkit tools are taught and assessed
    with the units they serve (guide, pp. 13 to 15).
  contains: [The growth and evolution brief, Ansoff matrix placer, Decision tree lab, Scale explorer, Force field builder (HL), SWOT and STEEPLE guides]
  items:
    - { kind: Brief, title: Growth and evolution, href: /topics/growth-and-evolution/, text: 'Should Marigold Kitchens grow, how fast, and by which route? Economies of scale, internal and external growth, and the case for staying small.' }
    - { kind: Decision Room, title: 'Marigold Kitchens: which way to grow?', href: /decision-room/marigold-growth/, text: 'Choose a growth route and live with what it does to costs, control and the brand.' }
    - { kind: Interaction, title: Ansoff matrix placer, href: /toolkit/ansoff-matrix/#ix-growth-ansoff-marigold, text: 'Place eight growth options on the matrix and argue the ones that are not clear-cut.' }
    - { kind: Interaction, title: Decision tree lab, href: /toolkit/decision-trees/#ix-growth-tree-marigold, text: 'Predict the best route, then test how sensitive expected value is to one probability.' }
    - { kind: Interaction, title: Scale explorer, href: /topics/growth-and-evolution/#ix-growth-scale-explorer, text: 'Find the chain size with the lowest average cost and explain why it rises again.' }
    - { kind: Interaction, title: Force field builder, href: /toolkit/force-field-analysis/#ix-lead-forcefield-halden, text: 'Weigh the forces for and against a change and choose the one worth weakening.', level: HL }
    - { kind: Guide, title: SWOT analysis, href: /toolkit/swot-analysis/, text: 'Internal strengths and weaknesses, external opportunities and threats, and the step most answers skip.' }
    - { kind: Guide, title: STEEPLE analysis, href: /toolkit/steeple-analysis/, text: 'Seven kinds of external factor, and how to choose the ones that matter.' }
  syllabus: ['1.5']
  planned:
    - Briefs for business objectives (1.3) and stakeholders (1.4), with stakeholder mapping
    - Guides for the BCG matrix, Porter's generic strategies (HL) and circular business models
  order: 4


- id: finance-desk
  name: Finance Desk
  purpose: Costs, revenues, contribution, break-even and cash flow, each worked in full; ratio analysis, investment appraisal and budgets to follow.
  status: partial
  href: /finance-desk/
  contains: [Costs and revenue workspace, Break-even workspace, Contribution and special orders (HL), Cash flow lab in the IB layout]
  order: 5

- id: market-studio
  name: Market Studio
  purpose: Marketing planning, market research, segmentation, positioning and the marketing mix.
  status: planned
  order: 6

- id: people-and-culture
  name: People and Culture
  purpose: Leadership, motivation, communication, structure and organizational culture.
  status: partial
  href: /people-and-culture/
  lead: >
    The human side of every decision: how people are led, organized, motivated and kept. The room is built
    around one fictional warehouse, Halden Distribution, where a new manager inherits a workforce that was led
    one way for fifteen years.
  contains: [Leadership and management brief, Style matcher, Functions sorter, Halden Distribution case, Labour turnover (HL)]
  items:
    - { kind: Brief, title: Leadership and management, href: /topics/leadership-and-management/, text: 'Management and leadership, the leadership styles, and how to choose one for a situation.' }
    - { kind: Case, title: Halden Distribution, href: /cases/halden-distribution/, text: 'A warehouse whose dispatch, errors and staff turnover went wrong after a new system arrived.' }
    - { kind: Decision Room, title: 'Halden Distribution: how to lead in the first ninety days', href: /decision-room/halden-leadership/, text: 'Decide how the new site manager should lead in her first ninety days.' }
    - { kind: Interaction, title: Style matcher, href: /topics/leadership-and-management/#ix-lead-style-matcher, text: 'Choose the leadership style each of eight situations calls for.' }
    - { kind: Interaction, title: Functions of management sorter, href: /topics/leadership-and-management/#ix-lead-functions-sorter, text: "Sort a manager's week into planning, organizing, commanding, coordinating and controlling." }
    - { kind: Calculation, title: Labour turnover, href: /topics/leadership-and-management/#calc-labour-turnover, text: "Leavers as a share of average employees, worked for both of Halden's shifts.", level: HL }
  syllabus: ['2.3']
  planned:
    - Briefs for organizational structure (2.2), motivation (2.4), culture (2.5, HL) and communication (2.6)
    - An organization chart explorer for span of control, levels of hierarchy and delayering
  order: 7


- id: operations-floor
  name: Operations Floor
  purpose: Operations methods, quality, location, production planning and crisis management.
  status: planned
  contains: [Break-even analysis (5.5) is worked in the Finance Desk meanwhile]
  order: 8

- id: boardroom
  name: Boardroom

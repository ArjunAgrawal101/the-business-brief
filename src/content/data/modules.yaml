- id: entrepreneurship-lab
  name: Entrepreneurship and Innovation Lab
  purpose: For aspiring entrepreneurs, founders and students. Six briefings and six working tools that take a start-up from an idea to a business plan, with every idea labelled as IB content or enrichment.
  status: live
  href: /entrepreneurship-lab/
  lead: >
    A founder's studio. Six briefings take a start-up from spotting an opportunity to funding, scaling and exit, and
    six working tools put each step on the bench: screen your ideas, map the business model, check the unit economics,
    forecast the revenue, cost the start and find the runway, then write the plan. One fictional venture, Refill Round,
    runs through every tool so you can see the whole method at work before you use it on your own idea. Much of it goes
    beyond the IB syllabus, and every briefing and tool says which parts are IB content and which are enrichment.
  contains: [Six learning briefings, Start-up feasibility assessment, Business Model Canvas builder, Unit economics calculator, Revenue model planner, Start-up cost calculator, Business plan outline builder]
  items:
    - { kind: Brief, title: Finding and testing an opportunity, href: /entrepreneurship-lab/opportunity-and-validation/, text: 'Where opportunities come from, customer discovery, market validation and value propositions.' }
    - { kind: Workspace, title: Start-up feasibility assessment, href: /entrepreneurship-lab/feasibility/, text: 'Score up to three ideas on weighted criteria, with must-haves, a pass mark, sensitivity and an optimism test.' }
    - { kind: Brief, title: 'Business models, the canvas and the lean start-up', href: /entrepreneurship-lab/business-models/, text: 'Common business models, the Business Model Canvas, build, measure, learn, and the minimum viable product.' }
    - { kind: Planner, title: Business Model Canvas builder, href: /entrepreneurship-lab/business-model-canvas/, text: 'Nine blocks with prompts; mark each entry as assumption or evidence, rate its risk and get the riskiest to test first.' }
    - { kind: Brief, title: Pricing a start-up and its unit economics, href: /entrepreneurship-lab/pricing-and-unit-economics/, text: "The guide's pricing methods for a new business, value-based pricing and price tests, and the arithmetic of one customer." }
    - { kind: Workspace, title: Unit economics calculator, href: /entrepreneurship-lab/unit-economics/, text: 'Acquisition cost, contribution per customer, lifetime value, the LTV to CAC ratio and CAC payback, worked step by step.' }
    - { kind: Brief, title: 'Financial projections: forecasting a business that does not exist yet', href: /entrepreneurship-lab/financial-projections/, text: 'Bottom-up sales forecasts, costs and break-even, cash against profit, and honest scenarios.' }
    - { kind: Planner, title: Revenue model planner, href: /entrepreneurship-lab/revenue-planner/, text: 'Twelve months of revenue from unit sales and subscriptions, with channel fees, churn and plausible setbacks.' }
    - { kind: Brief, title: 'Funding a start-up: control, risk and the right money', href: /entrepreneurship-lab/start-up-finance/, text: 'Bootstrapping, friends and family, angels, venture capital, crowdfunding and loans, and what each costs the founders.' }
    - { kind: Workspace, title: Start-up cost calculator, href: /entrepreneurship-lab/start-up-costs/, text: 'One-off costs, monthly outgoings and funding, with the runway, the funding gap and a chart of the cash.' }
    - { kind: Brief, title: 'Scaling, failure and exit', href: /entrepreneurship-lab/scaling-failure-and-exit/, text: 'Growing without breaking, the patterns behind start-up failure, and the ways founders leave.' }
    - { kind: Planner, title: Business plan outline builder, href: /entrepreneurship-lab/business-plan/, text: 'Twelve sections with prompts and your figures from the other tools, exported as Markdown or printed.' }
  syllabus: ['1.1', '1.2', '1.5', '3.2', '3.3', '3.6', '3.7', '4.1', '4.2', '4.3', '4.4', '4.5', '5.5']
  order: 15

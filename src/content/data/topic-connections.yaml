# Worked connections between the subtopics of the IB DP Business Management
# course (first assessment 2024), for the connections map at /ib/connections/
# and the "How it connects" section of every subtopic page. Each joins two
# subtopics, explains in one paragraph how they meet, and sets an original
# exam-style question on the link. The explanations are the platform's own
# teaching, written against the guide's content statements (guide, pp. 23 to
# 35); the questions are original practice, never IB questions.
#
# Checked by src/lib/connections.ts (in the build and in
# tests/unit/connections.test.ts): both codes exist and differ, no pair is
# joined twice, the command term is in the register and no higher than the
# deepest assessment objective of the statements it rests on, and a
# connection with an HL-only subtopic is HL. Calculation answers are reworked
# with the platform's own functions in the tests.

- id: marketing-and-financial-performance
  between: ['4.5', '3.5']
  featured: true
  title: Marketing decisions and financial performance
  explanation: >-
    Every choice in the marketing mix reaches the statement of profit or loss. A price cut lowers revenue per unit,
    so unless sales rise strongly it lowers the gross profit margin; a premium price can raise the margin if
    customers accept the brand's value. Promotion is an expense, so a campaign lowers the profit margin in the year
    it is paid for, and the gain comes only if the extra sales cover its cost. Because ROCE is calculated from
    profit before interest and tax, the same decisions move it too. Ratio analysis is one way to judge a marketing
    decision after the event, and a reason to estimate its financial effect before it is made.
  question:
    command: discuss
    marks: 10
    prompt: Discuss the likely effects of a decision to use penetration pricing on a business's gross profit margin and profit margin.

- id: hr-decisions-and-productivity
  between: ['2.4', '5.6']
  featured: true
  title: HR decisions and productivity
  explanation: >-
    Labour productivity, output per worker or per labour hour, is where human resource decisions show up in
    operations. Training raises what each worker can produce; rewards and job design change how much effort people
    choose to give, which is the question the motivation theories try to answer, from Taylor's piece rates to
    Herzberg's motivators. High labour turnover works the other way: each leaver takes skills away, and recruiting
    and inducting a replacement costs time and money before the new worker reaches full productivity. The
    productivity measures belong to 5.6, so this connection is HL, but the link between motivation and output runs
    through the whole of Unit 2.
  question:
    command: explain
    marks: 4
    prompt: Explain how two non-financial rewards could improve labour productivity in a business.

- id: operations-and-quality-management
  between: ['5.1', '5.3']
  featured: true
  title: Operations and quality management
  explanation: >-
    Operations management turns inputs into goods and services, and quality is one of the main standards it is
    judged by, alongside cost, speed and flexibility. Quality control inspects output to find defects after they are
    made; quality assurance builds checks into every stage so that fewer defects are made in the first place. Total
    quality management goes further and makes quality every employee's responsibility, supported by quality circles
    and by benchmarking against the best performers. Lean production joins the two ideas, because every defect is
    wasted material, time and labour.
  question:
    command: distinguish
    marks: 4
    prompt: Distinguish between quality control and quality assurance in a food manufacturer.

- id: growth-and-sources-of-finance
  between: ['1.5', '3.2']
  featured: true
  title: Business growth and sources of finance
  explanation: >-
    How a business grows decides how much finance it needs and what kind. Internal growth, such as opening another
    branch or buying equipment, is often paid for with retained profit or loan capital over several years. External
    growth through an acquisition or a takeover needs a large sum at once, which a company may raise by issuing share
    capital, diluting the existing owners' control, or by borrowing, which adds interest and risk. A small business
    that wants to stay independent may grow more slowly so that its own profits can pay for growth. The choice of
    finance is part of the growth decision, not a step after it.
  question:
    command: discuss
    marks: 10
    prompt: Discuss whether a privately held company should finance the acquisition of a competitor with loan capital or with share capital.

- id: sustainability-and-stakeholder-interests
  between: ['1.3', '1.4']
  featured: true
  title: Sustainability and stakeholder interests
  explanation: >-
    Sustainability, one of the course's four key concepts, asks a business to meet present needs without
    compromising the ability of future generations to meet theirs, across people, the planet and profit.
    Stakeholders weigh these differently: a local community or a pressure group may press for lower emissions and
    fair treatment of workers, while some shareholders want the highest return in the short term. Corporate social
    responsibility and ethical objectives are how a business responds. Over time they can reduce conflict between
    stakeholders, by protecting the brand and helping to attract and keep staff, but they have costs, so in the short
    term they can sharpen it. Judging whether a sustainable choice serves stakeholders means asking which
    stakeholders, and over what period.
  question:
    command: evaluate
    marks: 10
    prompt: Evaluate the view that adopting ethical objectives must conflict with the interests of a company's shareholders.

- id: testing-a-business-idea
  between: ['1.1', '4.4']
  title: Testing a business idea before money is committed
  explanation: >-
    One of the challenges of starting a business is not knowing whether enough customers want what the entrepreneur
    plans to sell. Market research turns that guess into evidence. Primary research, such as surveys and interviews
    with likely customers, can show whether a gap in the market is real and what people would pay; secondary
    research, such as market analyses and government publications, can show how large the market is and who already
    serves it. Research costs time and money that a start-up may not have, and a small or convenience sample can
    mislead, so the evidence has to be weighed rather than simply accepted.
  question:
    command: explain
    marks: 4
    prompt: Explain why an entrepreneur should carry out primary market research before starting a business.

- id: adding-value-through-operations
  between: ['1.1', '5.1']
  title: Adding value through operations
  explanation: >-
    A business takes inputs, such as materials, labour and equipment, and turns them into outputs that customers
    value more than the inputs cost; the difference is added value. Operations management runs that transformation
    day to day, deciding how much to produce, how, where and to what standard, so it settles much of the business's
    costs and the quality its customers receive. The sector shapes the work: in the secondary sector the
    transformation is manufacturing or construction, while in the tertiary sector it is a service, often delivered
    with the customer present.
  question:
    command: explain
    marks: 4
    prompt: Explain the role of operations management in adding value for a business in the secondary sector.

- id: legal-form-and-finance
  between: ['1.2', '3.2']
  title: Legal form and the finance a business can raise
  explanation: >-
    The type of business entity limits the sources of finance open to it. A sole trader relies on personal funds,
    loans, overdrafts, trade credit and, in some countries, microfinance providers, and because the owner has
    unlimited liability, a lender looks at the owner's own assets. A company can raise share capital: a privately
    held company sells shares only to people its owners choose, while a publicly held company can offer shares to
    the public on a stock exchange, which opens far more finance but risks a loss of control to new shareholders.
    Changing legal form is often part of raising the finance for growth.
  question:
    command: explain
    marks: 4
    prompt: Explain why a publicly held company can usually raise more share capital than a privately held company.

- id: entity-and-objectives
  between: ['1.2', '1.3']
  title: Who owns a business shapes what it aims for
  explanation: >-
    What a business aims for depends partly on who owns it and why it exists. A sole trader or a privately held
    company can set its own objectives, from profit to independence; a publicly held company is under pressure from
    its shareholders to protect shareholder value; a cooperative, one of the guide's for-profit social enterprises,
    serves its members and a social purpose while still having to cover its costs; and a non-governmental
    organization pursues a cause rather than profit. Comparing the types of entity shows that profit is a common
    objective, not a universal one.
  question:
    command: explain
    marks: 4
    prompt: Explain why the objectives of a cooperative are likely to differ from those of a publicly held company.

- id: multinationals-and-stakeholders
  between: ['1.4', '1.6']
  title: Who gains when a multinational arrives
  explanation: >-
    The impact of a multinational company on a host country is not one effect but several, and each stakeholder group
    feels a different one. Workers may gain jobs and training; local suppliers may win contracts or lose out to the
    company's own supply chain; local competitors may struggle against its economies of scale; the government gains
    tax revenue and investment but may have offered incentives to attract it; and nearby communities may bear
    environmental costs. Because the gains and losses fall on different groups, judging an MNC's impact means saying
    whose interests are being weighed, and over what period.
  question:
    command: discuss
    marks: 10
    prompt: Discuss the impact on two stakeholder groups in a host country of a multinational company's decision to open a factory there.

- id: why-multinationals-arrive-and-leave
  between: ['1.6', '5.4']
  title: Why multinationals arrive, and why they leave
  explanation: >-
    A multinational company's location decisions explain much of its impact on a host country. It may offshore
    production to reach lower labour costs, raw materials or customers, or to produce inside a trade barrier, and its
    arrival brings jobs and investment. The same reasoning can reverse: if wages rise, transport costs grow or the
    supply chain proves fragile, it may reshore production to its home country, and the host loses what it gained. A
    host country's benefit from an MNC therefore depends on how long the reasons for locating there last.
  question:
    command: explain
    marks: 4
    prompt: Explain two reasons why a multinational company might offshore its production to another country.

- id: growth-methods-abroad
  between: ['1.5', '4.6']
  title: External growth as a way into foreign markets
  explanation: >-
    The external growth methods of 1.5 are also ways of entering international markets. A joint venture or a
    strategic alliance with a local business brings local knowledge, contacts and a share of the risk, at the cost of
    shared control and profits; franchising spreads a brand quickly with little capital, but quality is harder to
    control far from home; an acquisition buys an established position outright, at a high price and with the risk of
    a cultural clash. Which method suits depends on how well the business knows the market and how much control it
    needs, which is the HL question of the opportunities and threats of operating internationally.
  question:
    command: examine
    marks: 10
    prompt: Examine the advantages and disadvantages for a business of entering an international market through a joint venture with a local business.

- id: scale-and-operations-method
  between: ['1.5', '5.2']
  title: Scale and the operations method
  explanation: >-
    As output grows, a business can move from job to batch to mass or flow production, and each step makes economies
    of scale possible. Specialized machinery and a continuous process are technical economies, and buying materials
    in bulk is a purchasing economy, so unit costs fall as volume rises. The move has costs too: flow production needs
    heavy investment and a large, steady demand, and it gives up the flexibility of job production. Mass
    customization tries to keep some of that flexibility at scale. Growth and the choice of operations method are
    therefore planned together.
  question:
    command: explain
    marks: 4
    prompt: Explain how moving from batch production to mass production can create economies of scale.

- id: mergers-and-culture-clash
  between: ['1.5', '2.5']
  title: Mergers and the clash of cultures
  explanation: >-
    The guide names growth and mergers among the causes of cultural clashes, and with reason. Two businesses that
    merge bring two sets of values, habits and ways of deciding: one may be a role culture run by rules and
    procedures, the other a task culture organized around projects and expertise. When they are joined, staff may
    resist new procedures, the best people may leave, and the cost savings that justified the merger can be slow to
    arrive or never arrive at all. Planning for culture, through communication, involvement and time, is part of
    making external growth work.
  question:
    command: discuss
    marks: 10
    prompt: Discuss the problems that a clash of organizational cultures may cause after a merger between two businesses.

- id: objectives-into-marketing-plan
  between: ['1.3', '4.2']
  title: From business objectives to the marketing plan
  explanation: >-
    Marketing planning starts from the business's objectives. A strategic objective, such as growth or entering a new
    market, becomes marketing objectives such as a target market share, and the plan then chooses the target market,
    the position and the marketing mix that should deliver them; tactical objectives set the shorter-term targets
    along the way. Ethical objectives shape the plan too, ruling out some markets or claims and favouring others. A
    plan that does not follow from the objectives may be well made and still pull the business in the wrong
    direction.
  question:
    command: explain
    marks: 4
    prompt: Explain the relationship between a business's strategic objectives and its marketing plan.

- id: workplace-conflict-as-stakeholder-conflict
  between: ['1.4', '2.7']
  title: Conflict at work is stakeholder conflict
  explanation: >-
    Industrial relations are the clearest case of conflict between stakeholders. Employees want fair pay, security
    and good conditions; managers and shareholders want lower costs and higher profit; customers want the product or
    service to continue; and trade unions represent employees in the negotiation. Collective bargaining, work-to-rule
    and strike action, or threats of redundancy and changes of contract, are ways of using the power each side holds,
    and conciliation and arbitration bring in a third party when the two sides cannot agree. Mapping the stakeholders'
    power and interest helps to predict how a dispute will develop and what settlement might last.
  question:
    command: examine
    marks: 10
    prompt: Examine how collective bargaining can help to resolve a conflict between the employees and the owners of a business.

- id: who-reads-the-accounts
  between: ['1.4', '3.4']
  title: Who reads the accounts, and why
  explanation: >-
    Final accounts are prepared for stakeholders, and each group reads them for something different. Shareholders
    look for profit and the return on their investment; lenders such as banks check whether loans and interest can be
    repaid; suppliers want to know whether they will be paid; employees and their unions look at whether pay rises and
    jobs are affordable; and the government uses the accounts to assess tax. Because their interests differ, the
    same accounts can lead different stakeholders to different conclusions, which is why the purpose of accounts to
    different stakeholders is part of the course.
  question:
    command: explain
    marks: 4
    prompt: Explain why the final accounts of a business are of interest to two different stakeholder groups.

- id: communication-and-resistance-to-change
  between: ['2.1', '2.6']
  title: Communication and resistance to change
  explanation: >-
    Employees resist change for reasons such as fear of losing their jobs, uncertainty about the future and a sense
    that the change is being done to them. Most strategies for reducing resistance depend on communication: explaining
    early and honestly why the change is needed, listening to concerns through two-way, formal channels, and involving
    staff in how it is carried out. Where formal communication is slow or missing, informal channels fill the gap
    with rumours that harden resistance. The method should suit the message: a meeting allows questions, while an
    email alone can feel like an announcement already made.
  question:
    command: explain
    marks: 4
    prompt: Explain how communication can reduce employees' resistance to change.

- id: structure-sets-the-channels
  between: ['2.2', '2.6']
  title: The structure sets the channels
  explanation: >-
    An organization chart is also a map of formal communication. In a tall structure with a long chain of command,
    messages pass through many levels, so they travel slowly and can be distorted or filtered on the way. A wide span
    of control gives a manager many people to keep informed, which can mean less contact with each. Delayering
    shortens the chain and can speed communication, though it may overload the managers who remain. A matrix
    structure adds a second line of reporting, which helps information cross departments but can send mixed
    messages.
  question:
    command: explain
    marks: 4
    prompt: Explain how a tall organizational structure can create barriers to communication.

- id: leadership-and-motivation
  between: ['2.3', '2.4']
  title: Leadership style and motivation
  explanation: >-
    The way people are led is one of the strongest influences on how motivated they are. Autocratic leadership, with
    close control and instructions from the top, echoes Taylor's view that workers respond mainly to pay and need
    supervising. Democratic leadership involves staff in decisions, which gives them the responsibility and
    recognition that Herzberg counted as motivators and Maslow placed among the higher needs. Laissez-faire leadership
    can motivate skilled, self-directed people and leave others without direction. Situational leadership accepts
    that the right style depends on the people and the task, so no single style motivates everyone.
  question:
    command: discuss
    marks: 10
    prompt: Discuss whether a democratic leadership style is likely to motivate employees more than an autocratic style.

- id: new-leader-new-culture
  between: ['2.3', '2.5']
  title: A new leader, a new culture
  explanation: >-
    The guide names a change of leadership style as one cause of cultural clash. Culture grows partly from how
    leaders behave: what they reward, how they make decisions and how far they trust staff. A new leader who replaces
    a democratic, consultative style with close autocratic control, or the reverse, asks employees to work in a way
    that conflicts with the habits and values they have learned. The result can be resistance, lower morale and higher
    labour turnover, until either the leader adapts or the culture changes.
  question:
    command: explain
    marks: 4
    prompt: Explain why a change in leadership style can lead to a cultural clash within an organization.

- id: rewards-are-costs
  between: ['2.4', '3.3']
  title: Rewards are costs
  explanation: >-
    Every financial reward in 2.4 is also a cost in 3.3. A salary is a fixed cost, paid whatever the level of output;
    wages paid by piece rate and sales commission are variable costs, because they rise and fall with output or
    sales. The choice of reward therefore changes the cost structure: moving sales staff from salary to commission
    lowers fixed costs but raises the variable cost of every sale, which moves the break-even point and shares the risk
    of a poor month between the business and its staff, though it may also encourage pushy selling. Fringe payments
    and profit-related pay add costs that the business hopes better motivation will repay.
  question:
    command: explain
    marks: 4
    prompt: Explain why sales commission is a variable cost while a salary is a fixed cost.

- id: pay-participation-and-disputes
  between: ['2.4', '2.7']
  title: Pay, participation and disputes
  explanation: >-
    Pay and working conditions are among the commonest sources of conflict in the workplace, and in Herzberg's terms
    they are hygiene factors: getting them wrong causes dissatisfaction, though getting them right does not on its
    own motivate. Employee participation and industrial democracy, such as works councils or employee representatives
    on a board, give staff a say in decisions, which can meet their need for responsibility and recognition and also
    gives a dispute a route to settlement before it becomes a strike. The same arrangements can slow decisions and
    raise expectations that managers cannot meet.
  question:
    command: examine
    marks: 10
    prompt: Examine how employee participation can both motivate employees and reduce conflict in the workplace.

- id: quality-needs-the-culture
  between: ['2.5', '5.3']
  title: Quality is a culture before it is a system
  explanation: >-
    Total quality management and kaizen ask every employee to look for faults and suggest improvements every day.
    That works only in a culture where staff are trusted, where mistakes are reported rather than hidden, and where
    suggestions are acted on. In a culture of blame or rigid hierarchy, quality circles become meetings nobody wants,
    and lean production feels like pressure to do more with less. The impact of lean production and TQM on an
    organization therefore depends heavily on its culture, and introducing them is itself a change that can cause a
    clash.
  question:
    command: discuss
    marks: 10
    prompt: Discuss the importance of organizational culture when a business introduces total quality management.

- id: communicating-in-a-crisis
  between: ['2.6', '5.7']
  title: Communicating in a crisis
  explanation: >-
    The guide names transparency, communication, speed and control as the factors in effective crisis management,
    and the first two are where 2.6 applies directly. In a crisis a business must reach customers, employees,
    regulators and the media quickly, through channels they trust, with information that is accurate and consistent.
    Barriers such as jargon, too many layers between the decision and the message, or different messages from
    different managers let rumour and social media set the story instead. A contingency plan that names a spokesperson
    and prepares the channels in advance lowers those barriers before they are tested.
  question:
    command: explain
    marks: 4
    prompt: Explain how barriers to communication could make a crisis worse for a business.

- id: capital-expenditure-appraised-first
  between: ['3.1', '3.8']
  title: Capital expenditure is appraised first
  explanation: >-
    Capital expenditure buys assets that will be used for more than a year, such as machinery, vehicles or buildings,
    and it usually commits a large sum for a long time. That is why it is appraised before the money is spent: the
    payback period shows how quickly the cash comes back, the average rate of return compares the yearly return with
    the cost, and at HL net present value allows for the time value of money. Revenue expenditure, the day-to-day
    running costs, is not appraised in this way, because it is used up within the year.
  question:
    command: explain
    marks: 4
    prompt: Explain why a business uses investment appraisal before making capital expenditure.

- id: where-spending-is-recorded
  between: ['3.1', '3.4']
  title: Where each kind of spending is recorded
  explanation: >-
    The difference between capital and revenue expenditure decides where spending appears in the final accounts.
    Capital expenditure becomes a non-current asset in the statement of financial position, and its cost is spread
    over the years of its use rather than charged at once. Revenue expenditure, such as wages, rent and materials,
    appears as cost of sales or expenses in the statement of profit or loss for the year in which it is incurred.
    Recording a capital item as a running cost, or the reverse, would misstate both the year's profit and the value
    of the business's assets.
  question:
    command: distinguish
    marks: 4
    prompt: Distinguish between capital expenditure and revenue expenditure for a delivery business, using an example of each.

- id: costs-and-break-even
  between: ['3.3', '5.5']
  title: Costs and revenue are break-even's raw material
  explanation: >-
    Break-even analysis rests on the classification of costs in 3.3. Fixed costs must be paid whatever the output;
    variable costs rise with each unit made; and the difference between the price and the variable cost per unit is
    the contribution each sale makes, first towards fixed costs and then towards profit. The break-even quantity is
    fixed costs divided by contribution per unit. A cost classified wrongly, such as one that is partly fixed and
    partly variable treated as wholly fixed, gives a wrong break-even point, and every decision based on it inherits
    the error.
  question:
    command: calculate
    marks: 2
    prompt: A café has fixed costs of $6,000 a month. It sells coffee at $4.00 a cup, and the variable cost of each cup is $1.50. Calculate the café's break-even quantity per month.
    answer: Contribution per unit = $4.00 − $1.50 = $2.50. Break-even quantity = $6,000 ÷ $2.50 = **2,400 cups a month**.

- id: liquidity-ratios-and-cash-flow
  between: ['3.5', '3.7']
  title: Liquidity ratios and cash flow
  explanation: >-
    The current ratio and the acid test ratio measure liquidity on one date, while a cash flow forecast shows how the
    cash position will change month by month. A business with cash flow problems often shows them in its ratios: cash
    falls, short-term debts such as an overdraft and trade creditors rise, and the acid test ratio drops below a
    comfortable level. Strategies that improve one usually improve the other, such as collecting debts sooner,
    reducing stock or replacing an overdraft with a long-term loan, though each has a cost.
  question:
    command: explain
    marks: 4
    prompt: Explain how a cash flow problem might show up in a business's current ratio and acid test ratio.

- id: profit-is-not-cash
  between: ['3.4', '3.7']
  title: Profit is not cash
  explanation: >-
    The statement of profit or loss records revenue when a sale is made and costs when they are incurred, but cash
    moves only when customers and suppliers actually pay. A business that sells on credit, holds a lot of stock or
    buys a large asset can report a profit and still run short of cash: the asset's cost leaves the bank at once but
    does not appear as a single cost in that year's profit. That is why the guide treats profit and cash flow as
    different measures, and why a profitable business can still become insolvent.
  question:
    command: explain
    marks: 4
    prompt: Explain why a profitable business can run out of cash.

- id: stock-turnover-and-jit
  between: ['3.6', '5.6']
  title: Stock turnover and just-in-time
  explanation: >-
    Stock turnover measures how quickly a business uses or sells its stock: cost of sales divided by average stock
    gives the number of times a year, and average stock divided by cost of sales, times 365, gives the number of days
    stock is held. Just-in-time stock control sets out to hold as little stock as possible, with deliveries arriving
    as they are needed, so it raises stock turnover and frees cash that would otherwise sit in a warehouse. The price
    is exposure: with no buffer, a late delivery can stop production, which is why just-in-case stock remains the
    alternative.
  question:
    command: explain
    marks: 4
    prompt: Explain how a move to just-in-time stock control might affect a business's stock turnover ratio.

- id: finance-choice-and-gearing
  between: ['3.2', '3.6']
  title: The choice of finance sets the gearing
  explanation: >-
    The gearing ratio shows how much of a business's capital employed comes from long-term borrowing: non-current
    liabilities divided by capital employed, where capital employed is non-current liabilities plus equity. Every
    choice of long-term finance in 3.2 moves it. Loan capital raises gearing and adds interest that must be paid in
    bad years as well as good; share capital and retained profit lower it, at the cost of sharing control or holding
    back dividends. A highly geared business can find further loans harder and dearer to obtain.
  question:
    command: calculate
    marks: 2
    prompt: A business has non-current liabilities of $2.4 million and equity of $5.6 million. Calculate its gearing ratio.
    answer: Capital employed = $2.4m + $5.6m = $8.0m. Gearing ratio = $2.4m ÷ $8.0m × 100 = **30%**.

- id: sales-forecast-drives-the-budget
  between: ['3.9', '4.3']
  title: The sales forecast drives the budget
  explanation: >-
    Most budgets start from a sales forecast. The sales revenue budget is the forecast volume at the expected price,
    and the production, materials, labour and cash budgets follow from the volume it predicts. A forecast that is too
    optimistic therefore spreads its error through every budget: the business buys too much material, hires too many
    people and plans for cash that never arrives, and the variances reported later are partly the forecast's fault
    rather than the budget holders'. The benefits of sales forecasting, and its limitations, pass into the whole
    budgeting process.
  question:
    command: discuss
    marks: 10
    prompt: Discuss the importance of accurate sales forecasting when a business constructs its budgets.

- id: profit-centres-and-delegation
  between: ['2.2', '3.9']
  title: Cost and profit centres follow the structure
  explanation: >-
    A business divides itself into cost and profit centres along the lines of its organizational structure: a
    department, a branch, a product or a region. Making a manager responsible for a centre's budget is a form of
    delegation, and a decentralized business usually has more centres with more freedom over them. The arrangement can
    motivate managers and make performance easier to compare, but it can also set centres against each other, and
    some costs, such as those of head office, are hard to divide fairly between them.
  question:
    command: explain
    marks: 4
    prompt: Explain how organizing a business into profit centres is a form of delegation.

- id: pricing-for-market-share
  between: ['4.1', '4.5']
  title: Pricing to win market share
  explanation: >-
    Market share, a business's sales as a percentage of the total sales in its market, is often the measure a
    pricing decision is judged by. Penetration pricing sets a low price to enter a market and build share quickly;
    premium pricing gives up some volume in exchange for a higher margin; and at HL, competitive pricing keeps prices
    close to rivals' to defend a position. Share bought with low prices can be costly to keep, and a price war may
    leave every business in the market with lower profit. Whether share is worth buying depends on the business's
    objectives and, at HL, on the importance of market share and market leadership.
  question:
    command: explain
    marks: 4
    prompt: Explain how a business could use penetration pricing to increase its market share.

- id: research-behind-the-position-map
  between: ['4.2', '4.4']
  title: Research behind the position map
  explanation: >-
    Segmentation, targeting and positioning depend on market research. Research identifies groups of customers with
    similar needs, shows which segments are large or growing enough to target, and supplies the customer ratings that
    place brands on a position map. A map drawn from managers' opinions rather than customers' views can show a gap
    that customers do not see, or miss one they do. Quantitative research gives the scores; qualitative research,
    such as focus groups, explains why customers see the brands as they do.
  question:
    command: explain
    marks: 4
    prompt: Explain how market research helps a business to construct a position map.

- id: forecasts-built-from-research
  between: ['4.3', '4.4']
  title: Forecasts built from research
  explanation: >-
    A sales forecast needs data, and much of it comes from market research: past sales records, surveys of customers'
    buying intentions and secondary research on the size and growth of the market, sometimes extended by a trend line
    fitted to past sales with simple linear regression. The forecast is only as good as that evidence. Customers
    often say they will buy and then do not, samples may not represent the market, and past trends break when tastes,
    technology or the economy change. That is why the benefits of sales forecasting, better planning of production,
    stock and cash, always come with limitations.
  question:
    command: discuss
    marks: 10
    prompt: Discuss the limitations of a sales forecast based on a survey of customers' buying intentions.

- id: the-mix-delivers-the-plan
  between: ['4.2', '4.5']
  title: The marketing mix delivers the plan
  explanation: >-
    Marketing planning decides whom the business serves and how it wants to be seen; the seven Ps are how it gets
    there. A niche market for a premium product calls for a mix that holds together: a high-quality product, a premium
    price, selective distribution and promotion aimed at the target segment. A mass market calls for something else.
    A mix whose parts contradict one another, such as a premium brand sold at discount prices through every channel,
    confuses customers and weakens the position the plan chose. For a service, people, processes and physical
    evidence carry the position as well.
  question:
    command: explain
    marks: 4
    prompt: Explain how a business targeting a niche market might adapt its marketing mix.

- id: adapting-the-mix-abroad
  between: ['4.5', '4.6']
  title: Adapt the mix abroad, or keep it the same
  explanation: >-
    A business entering an international market must decide how far to adapt its marketing mix. A standard mix keeps
    costs down and the brand consistent, while adaptation responds to differences in tastes, incomes, culture,
    language and law: a product may need a new recipe or name, prices may reflect local incomes and taxes, and
    promotion may need new messages and channels. Services meet the cultural variation in employee and customer
    relationships that the guide mentions under People. Getting this choice wrong is one of the threats of operating
    internationally.
  question:
    command: discuss
    marks: 10
    prompt: Discuss whether a business entering an international market should adapt its marketing mix.

- id: product-life-cycle-and-cash-flow
  between: ['4.5', '3.7']
  title: The product life cycle and cash flow
  explanation: >-
    The guide asks for the relationship between the product life cycle, investment, profit and cash flow. In
    development and at launch, cash flows out on research, production and promotion while sales are low, so cash flow
    and profit are usually negative. In growth, sales rise and the product moves towards profit, though it may still
    need investment to keep up with demand. In maturity it usually generates the most cash, which can fund new
    products, and in decline its cash inflows fall unless an extension strategy revives sales. A business whose
    products are all at the same stage can face serious cash flow problems.
  question:
    command: explain
    marks: 4
    prompt: Explain the relationship between the product life cycle and cash flow.

- id: price-changes-and-break-even
  between: ['4.5', '5.5']
  title: Price changes and break-even
  explanation: >-
    Price is one of the seven Ps and also one of the inputs to break-even analysis. A higher price raises the
    contribution per unit, so fewer units are needed to cover fixed costs and the break-even quantity falls; a lower
    price does the opposite. Break-even analysis shows that effect exactly, but it cannot say how customers will
    respond: if a price rise loses more sales than it saves in break-even units, the margin of safety shrinks. At HL,
    price elasticity of demand helps to judge that response.
  question:
    command: calculate
    marks: 4
    prompt: A bakery has fixed costs of $6,300 a month and sells loaves at $3.00, with a variable cost of $1.20 a loaf. It raises its price to $3.30, and the variable cost does not change. Calculate the change in the bakery's break-even quantity.
    answer: Before, contribution per unit = $3.00 − $1.20 = $1.80, so break-even = $6,300 ÷ $1.80 = 3,500 loaves. After, contribution per unit = $3.30 − $1.20 = $2.10, so break-even = $6,300 ÷ $2.10 = 3,000 loaves. Break-even falls by **500 loaves a month**.

- id: data-mining-as-market-research
  between: ['4.4', '5.9']
  title: Data mining as market research
  explanation: >-
    Management information systems have become one of the richest sources of market research. A customer loyalty
    programme records what each member buys, when and where, and data mining finds patterns in those records, such as
    products bought together, that a survey would miss. The data is plentiful and cheap per customer, but it has limits
    and risks: it shows what customers did, not why; it covers only the business's own customers; and collecting and
    using it raises questions of privacy and consent that the guide asks students to weigh among the ethical
    implications of these systems.
  question:
    command: discuss
    marks: 10
    prompt: Discuss the use of data from a customer loyalty programme as a source of market research.

- id: digital-taylorism-and-motivation
  between: ['2.4', '5.9']
  title: Digital Taylorism and motivation
  explanation: >-
    Digital Taylorism applies Taylor's scientific management with software: tasks are broken down, timed and
    monitored, and each worker's output is measured continuously. Taylor's theory explains why managers expect it to
    raise productivity, since it treats pay and close supervision as the main levers. The other theories explain the
    risks: constant monitoring removes the autonomy that Deci and Ryan see as a basic need, and the lack of trust works
    against the higher needs in Maslow's hierarchy and against Herzberg's motivators. The guide asks for the use of
    data to manage and monitor employees to be weighed for exactly this reason.
  question:
    command: discuss
    marks: 10
    prompt: Discuss the use of data to manage and monitor employees, with reference to motivation theory.

- id: research-and-development-renews-the-portfolio
  between: ['5.8', '4.5']
  title: Research and development renews the product portfolio
  explanation: >-
    Every product eventually declines, and extension strategies only delay it. Research and development produces the
    new goods and services that take its place and keep the product portfolio balanced. Incremental innovation
    improves existing products and can work as an extension strategy; disruptive innovation creates new markets and
    can make existing products obsolete, including the business's own. Research that finds customers' unmet needs,
    even ones they are not aware of, gives the marketing mix something new to offer, and patents and trademarks
    protect it for a time.
  question:
    command: explain
    marks: 4
    prompt: Explain how research and development can help a business to manage its product portfolio.

- id: appraising-research-and-development
  between: ['5.8', '3.8']
  title: Appraising research and development
  explanation: >-
    Research and development is an investment, but an unusually hard one to appraise. The costs come first and are
    often large; the returns, if any, arrive years later and are uncertain, because a project can fail or be overtaken
    by a rival's innovation. The payback period may look long and the average rate of return low, and at HL net
    present value discounts the distant returns heavily. Yet a business that spends nothing on research and
    development risks being left with an ageing portfolio. Investment appraisal supplies the figures; the decision also
    rests on strategy and on how much risk the business can bear.
  question:
    command: discuss
    marks: 10
    prompt: Discuss the difficulties of using investment appraisal to decide whether to fund a research and development project.

- id: labour-and-location
  between: ['2.1', '5.4']
  title: Labour and the choice of location
  explanation: >-
    The availability, skills and cost of labour are among the main reasons for a specific location, and they tie
    location to human resource planning. A business may locate where skilled workers are plentiful or wages are lower,
    and changes in labour mobility and immigration, which the guide lists among the factors in workforce planning,
    change how many workers a region can supply. Reorganizing production through offshoring or reshoring changes the
    workforce plan in turn: redundancies in one place, recruitment and training in another, and the resistance to
    change that may follow.
  question:
    command: explain
    marks: 4
    prompt: Explain how the availability of labour can influence where a business locates its production.

- id: cash-as-a-contingency
  between: ['3.7', '5.7']
  title: Cash as a contingency plan
  explanation: >-
    A crisis usually brings costs at once, such as recalls, repairs or lost sales, and a business without cash or
    credit may fail before it can recover. A cash reserve or an agreed overdraft is therefore one of the commonest
    contingency measures. It has a cost: cash held in reserve earns little and is not invested in growth, and an
    overdraft facility may carry fees. Weighing that cost against the risk it covers is the judgement the guide asks
    for when it sets the impact of contingency planning on cost, time, risks and safety.
  question:
    command: explain
    marks: 4
    prompt: Explain how holding a cash reserve can form part of a business's contingency plan.

- id: just-in-time-and-contingency-planning
  between: ['5.6', '5.7']
  title: Just-in-time and contingency planning
  explanation: >-
    Just-in-time stock control holds almost no buffer stock, so it is efficient in normal times and exposed when
    something goes wrong: a late delivery, a fire at a supplier or a blocked port can stop production within hours.
    Contingency planning prepares for those failures in advance, for example by agreeing a second supplier, keeping a
    small buffer of critical parts or mapping the supply chain. Each measure adds cost and moves the business back
    towards just-in-case, which is why the impact of contingency planning has to be judged for the organization and
    situation in question.
  question:
    command: discuss
    marks: 10
    prompt: Discuss the impact of contingency planning on a manufacturer that uses just-in-time stock control.

- id: production-method-and-motivation
  between: ['2.4', '5.2']
  title: The production method and the worker
  explanation: >-
    The operations method shapes the job, and so motivation. Job production gives workers varied, skilled work on a
    whole product, close to the sense of achievement and responsibility that Herzberg counted as motivators. Mass or
    flow production breaks the work into short, repeated tasks, the division of labour that Taylor favoured, which
    raises output but can make work monotonous. Businesses using flow production often add job rotation, job
    enlargement or teamwork to counter that effect.
  question:
    command: discuss
    marks: 10
    prompt: Discuss the likely effects on employee motivation of a move from job production to mass production.

- id: market-orientation-starts-with-research
  between: ['4.1', '4.4']
  title: Market orientation starts with research
  explanation: >-
    A market-oriented business decides what to offer by first finding out what customers want; a product-oriented
    business starts from what it can make and then looks for buyers. Market research is how a market-oriented business
    learns: primary research asks customers directly, and secondary research supplies the size and growth of the
    market, the figures behind market share. A product-oriented business can still succeed, for example with a new
    technology customers had not imagined, but it carries the risk that nobody wants what it has made.
  question:
    command: explain
    marks: 4
    prompt: Explain why market research is important to a market-oriented business.

# Assessment components. `facts` are claims about the IB assessment, each with
# a verification status and sources (see claims.yaml). `notStated` lists what
# the platform deliberately does not state, because no available source
# establishes it. `rewards`, `preparation` and `errors` are the platform's own
# teaching (Arjun Agrawal framework); they are not examiner observations.

- id: paper-1
  name: Paper 1
  short: P1
  levels: SL and HL
  order: 1
  summary: A paper on a case study that is partly released in advance. The pre-released statement sets the scene; the rest of the case arrives in the examination.
  facts:
    - text: Paper 1 is based on a pre-released statement that gives the context and background of an unseen case study.
      status: recorded
      sources: [ib-ap-2027-record]
      location: Assessment procedures 2027, D3.3, p. 194
    - text: The statement is released about three months before the examination, in the first week of February for May sessions and the first week of August for November sessions.
      status: recorded
      sources: [ib-ap-2027-record]
      location: Assessment procedures 2027, D3.3, p. 194
    - text: The statement gives a small number of topics that set the context of the case, and roughly the first 200 words of the case study. Candidates receive the rest of the case in the examination.
      status: recorded
      sources: [ib-ap-2027-record]
      location: Assessment procedures 2027, D3.3, p. 194
    - text: Paper 1 is common to SL and HL and lasts 1 hour 30 minutes.
      status: corroborated
      sources: [clastify-bm, revisiondojo-bm]
    - text: Paper 1 carries 35% of the final mark at SL and 25% at HL.
      status: corroborated
      sources: [clastify-bm, revisiondojo-bm, thinkib-bm]
  notStated:
    - The number of questions, their structure and their mark allocations. These are set out in the Guide and in specimen papers, neither of which is available to this platform.
    - The markbands used for the extended responses.
  rewards:
    - Using the case, not a generic business. Every sentence is stronger when it names the organization's own situation, evidence and constraints.
    - Knowing the context of the industry before the examination, so that the unseen part of the case can be read quickly and accurately.
    - Judgement that is tied to the organization's objectives and stakeholders, rather than to business in general.
  preparation:
    - Read the pre-released statement as a briefing. List what it tells you, what you can infer, and what you would need to know before advising the business.
    - Research the industry and the kind of organization it describes, but do not invent the rest of the case. The unseen part may take it somewhere you did not predict.
    - For each topic named in the statement, prepare the tools and concepts that could apply, and one example of how each could change a recommendation.
    - Practise writing under time with a case you have not seen in full. The Decision Rooms are built for exactly that habit of reading, choosing and defending.
  errors:
    - Writing the answer prepared from the pre-release instead of answering the question that was set.
    - Treating the case as a generic business, so that the analysis would fit any organization.
    - Conclusions that restate the analysis instead of making a judgement about this organization.
  questions: [q-growth-p1-discuss, q-growth-p1-explain, q-lead-p1-recommend, q-lead-p1-distinguish]

- id: paper-2
  name: Paper 2
  short: P2
  levels: SL and HL
  order: 2
  summary: A paper built on stimulus material the candidate has not seen, with numbers to work and interpret.
  facts:
    - text: Paper 2 is based on unseen stimulus material with a quantitative focus.
      status: unverified
      sources: [thinkib-bm]
    - text: SL and HL candidates sit separate Paper 2 papers. Paper 2 lasts 1 hour 30 minutes at SL and 1 hour 45 minutes at HL.
      status: corroborated
      sources: [clastify-bm, revisiondojo-bm]
    - text: Paper 2 carries 35% of the final mark at SL and 30% at HL.
      status: corroborated
      sources: [clastify-bm, revisiondojo-bm, thinkib-bm]
  notStated:
    - The sections of the paper, the number of questions and their marks.
    - Which formulae, if any, are provided in the examination.
  rewards:
    - Accurate working that is set out so that it can be followed, with units.
    - Interpretation of the result. A number is the start of an answer, not the end of one.
    - Knowing the limits of the calculation, such as break-even's assumption that every unit produced is sold.
  preparation:
    - Learn each formula as a sentence (contribution is what each unit adds towards fixed costs) as well as an equation. It makes the formula hard to misremember.
    - Work every calculation in the eight-part form used on the Finance Desk, until stating the formula, substituting and naming the unit is automatic.
    - After every answer, write one sentence on what the figure means for the business and one on what it does not show.
    - Practise reading unfamiliar tables. Find what is given, what is missing and what is assumed before calculating anything.
  errors:
    - Rounding a break-even quantity down, which leaves the business short of breaking even.
    - Leaving out units, or mixing them, for example a margin of safety given in currency when it was asked for in units.
    - Treating a numerical answer as the decision, when the question asked for a judgement.
  questions: [q-costs-p2-classify, q-costs-p2-beq, q-costs-p2-mos, q-costs-p2-price, q-costs-p2-evaluate, q-lead-p2-turnover, q-costs-hl-special]

- id: paper-3
  name: Paper 3
  short: P3
  levels: HL only
  order: 3
  summary: An HL-only paper on a social enterprise, in which the business purpose is a social or environmental mission as well as a financial one.
  facts:
    - text: Paper 3 is taken at HL only.
      status: corroborated
      sources: [acs-bm-2024, revisiondojo-bm]
    - text: Paper 3 is based on a case study of a social enterprise.
      status: corroborated
      sources: [acs-bm-2024, revisiondojo-bm]
    - text: Paper 3 lasts 1 hour 15 minutes and carries 25% of the HL mark.
      status: corroborated
      sources: [clastify-bm, revisiondojo-bm]
  notStated:
    - The structure of the tasks and their marks. These need the Guide and specimen papers.
  rewards:
    - Holding two objectives at once. A social enterprise must survive financially to pursue its mission, and an answer has to weigh both.
    - Recommendations that are specific to the organization's mission, stakeholders and resources.
    - Use of the course concepts, especially ethics and sustainability, as part of the reasoning rather than as labels.
  preparation:
    - For any business decision you study, ask how the answer would change if the organization's first objective were social rather than financial.
    - Practise the same decision with two sets of stakeholders in mind, the people the mission serves and the people who fund it.
    - Use the Decision Room debriefs to practise saying what would have to be true for a recommendation to fail.
  errors:
    - Treating a social enterprise as a charity, or as a normal business with a slogan.
    - Recommending growth without asking whether it serves the mission or only the revenue.
  questions: [q-growth-p3-mission]

- id: internal-assessment
  name: Internal assessment
  short: IA
  levels: SL and HL
  order: 4
  summary: A research project on a real issue facing a particular organization, investigated through one of the course concepts.
  facts:
    - text: The internal assessment is a research project of at most 1,800 words.
      status: recorded
      sources: [ib-ap-2027-record]
      location: Assessment procedures 2027, D3.2, p. 192
    - text: The project addresses an issue facing an organization, investigated through a conceptual lens.
      status: recorded
      sources: [ib-ap-2027-record]
      location: Assessment procedures 2027, D3.2, p. 192
    - text: Business management is sampled once across SL and HL for moderation.
      status: recorded
      sources: [ib-ap-2027-record]
      location: Assessment procedures 2027, D3.2, p. 192
    - text: The conceptual lens is one of the course's four concepts.
      status: corroborated
      sources: [clastify-bm]
    - text: The internal assessment carries 30% of the final mark at SL and 20% at HL.
      status: corroborated
      sources: [clastify-bm, revisiondojo-bm]
  notStated:
    - The assessment criteria and the marks for each criterion.
    - The rules on supporting documents and sources. They are in the Guide, which is not available to this platform.
  rewards:
    - A narrow, real issue facing one organization, and a question that can actually be answered with the evidence available.
    - Analysis that uses the course's tools on that evidence, and a conclusion that answers the question asked.
    - A concept used as a lens that changes how the evidence is read, not as a label added at the end.
  preparation:
    - Choose the organization first and the issue second. An issue you cannot get evidence for cannot be researched.
    - Write the research question as a decision or a problem the organization faces now.
    - Check the Guide's criteria and your school's deadlines with your teacher before you start. This platform does not reproduce them.
  errors:
    - A topic too broad to answer in the word limit.
    - A description of the organization in place of analysis of its issue.
  questions: []

# Assessment components, verified against the Business management guide
# (first assessment 2024) on 29 October 2026. `facts` are statements about the
# IB assessment, each with its status, sources and page. `ibGuidance` is advice
# from the IB teacher support material, paraphrased. `rewards`, `preparation`
# and `errors` are the platform's own teaching (Arjun Agrawal framework); they
# are not examiner observations.

- id: paper-1
  name: Paper 1
  short: P1
  levels: SL and HL
  order: 1
  summary: A paper on an unseen case study about a fictitious business, part of which is released three months in advance. It is the same paper at SL and HL.
  facts:
  - text: Paper 1 lasts 1 hour 30 minutes, is worth 30 marks, and carries 35% of the final mark at SL and 25% at HL.
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, pp. 39 to 40
  - text: It is the same paper at SL and HL, and its questions come from units 1 to 5 excluding HL extension material.
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, pp. 41 and 43
  - text: Three months before the examination the IB releases a statement giving a small number of topics to research (about five hours; they build on the syllabus but are not in it) and roughly the first
      200 words of the case study.
    status: primary
    sources:
    - ib-bm-guide-2024
    - ib-ap-2027-record
    location: Guide, p. 41; Assessment procedures 2027, D3.3, p. 194
  - text: The full case study, about 800 to 1,000 words, is seen for the first time in the examination. Most questions are qualitative; some minor calculations are possible.
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, p. 41
  - text: Section A is marked with an analytic markscheme; section B with an analytic markscheme and markbands.
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, p. 43
  outline:
    sl:
      duration: 1 hour 30 minutes
      marks: 30
      weight: 35
    hl:
      duration: 1 hour 30 minutes
      marks: 30
      weight: 25
  notStated:
  - The markbands themselves. They are in the guide (pp. 44 to 45 for SL, pp. 47 to 48 for HL); the platform summarizes their structure but does not reproduce them.
  - Grade boundaries, which change from session to session.
  rewards:
  - Using the case, not a generic business. Every sentence is stronger when it names the organization's own situation, evidence and constraints.
  - Knowing the context of the industry before the examination, so that the unseen part of the case can be read quickly and accurately.
  - Judgement that is tied to the organization's objectives and stakeholders, rather than to business in general.
  preparation:
  - Read the pre-released statement as a briefing. List what it tells you, what you can infer, and what you would need to know before advising the business.
  - Research the industry and the kind of organization it describes, but do not invent the rest of the case. The unseen part may take it somewhere you did not predict.
  - For each topic named in the statement, prepare the tools and concepts that could apply, and one example of how each could change a recommendation.
  - Practise writing under time with a case you have not seen in full. The Decision Rooms are built for exactly that habit of reading, choosing and defending.
  errors:
  - Writing the answer prepared from the pre-release instead of answering the question that was set.
  - Treating the case as a generic business, so that the analysis would fit any organization.
  - Conclusions that restate the analysis instead of making a judgement about this organization.
  questions:
  - q-growth-p1-discuss
  - q-growth-p1-explain
  - q-lead-p1-recommend
  - q-lead-p1-distinguish
  sections:
  - name: Section A
    marks: '20'
    task: Answer all the structured questions on the case study.
    aos:
    - AO1
    - AO2
    - AO4
  - name: Section B
    marks: '10'
    task: Answer one of two extended-response questions on the case study.
    aos:
    - AO1
    - AO2
    - AO3
    - AO4
  ibGuidance:
  - text: 'Spend roughly 60% of the time on section A and 40% on section B: the 10-mark question needs more planning than its share of the marks suggests.'
    location: TSM, p. 54
  - text: Section A command terms are most likely to be analyse, calculate, comment, define, describe, distinguish, draw, explain and state. Section B most often uses discuss and evaluate.
    location: TSM, pp. 54 to 55
  - text: Answers to AO2 questions that are not applied to the case study are typically limited to half the marks.
    location: TSM, p. 56
  - text: To evaluate one option, give at least two arguments for it and two against. To choose between two options, give at least one argument for and one against each.
    location: TSM, p. 56
  - text: A purely theoretical answer to a 10-mark question, however good, typically earns 4 marks or fewer.
    location: TSM, p. 57
  - text: 'A conclusion should do more than restate the points made: it should say what the business should do next, or on what the choice depends, such as the time horizon.'
    location: TSM, pp. 56 to 57
  - text: Write in sentences and paragraphs, as a business analyst would, not in lists; qualify claims where appropriate.
    location: TSM, p. 55
  - text: Do not memorize answers to predicted questions. Learn the pre-released context and terms, then answer the question actually asked.
    location: TSM, p. 57
- id: paper-2
  name: Paper 2
  short: P2
  levels: SL and HL
  order: 2
  summary: A paper built on unseen stimulus material with a quantitative focus, read and answered in parts. SL and HL sit different papers.
  facts:
  - text: Paper 2 lasts 1 hour 30 minutes and is worth 40 marks at SL (35% of the final mark), and lasts 1 hour 45 minutes and is worth 50 marks at HL (30%).
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, pp. 39 to 40
  - text: 'It is based on unseen stimulus material with a quantitative focus, combining text with charts and infographics, presented in parts: each part is followed by its question.'
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, pp. 41 to 42
  - text: SL and HL sit different but similar papers; HL questions may draw on the HL extension material and HL-only tools.
    status: primary
    sources:
    - ib-bm-guide-2024
    - ib-bm-tsm-2022
    location: Guide, pp. 42 and 46; TSM, p. 75
  - text: Section A is assessed at AO1, AO2 and AO4; section B at all four objectives, including AO3.
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, p. 42
  - text: At SL, one of the two stimulus options in section B may be about a social enterprise.
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, p. 42
  - text: Every calculation can be done with a four-function calculator; graphic display calculators are allowed.
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, p. 43
  outline:
    sl:
      duration: 1 hour 30 minutes
      marks: 40
      weight: 35
    hl:
      duration: 1 hour 45 minutes
      marks: 50
      weight: 30
  notStated:
  - The markbands themselves. They are in the guide (pp. 44 to 45 for SL, pp. 47 to 48 for HL); the platform summarizes their structure but does not reproduce them.
  - Grade boundaries, which change from session to session.
  rewards:
  - Accurate working that is set out so that it can be followed, with units.
  - Interpretation of the result. A number is the start of an answer, not the end of one.
  - Knowing the limits of the calculation, such as break-even's assumption that every unit produced is sold.
  preparation:
  - Learn each formula as a sentence (contribution is what each unit adds towards fixed costs) as well as an equation. It makes the formula hard to misremember.
  - Work every calculation in the eight-part form used on the Finance Desk, until stating the formula, substituting and naming the unit is automatic.
  - After every answer, write one sentence on what the figure means for the business and one on what it does not show.
  - Practise reading unfamiliar tables. Find what is given, what is missing and what is assumed before calculating anything.
  errors:
  - Rounding a break-even quantity down, which leaves the business short of breaking even.
  - Leaving out units, or mixing them, for example a margin of safety given in currency when it was asked for in units.
  - Treating a numerical answer as the decision, when the question asked for a judgement.
  questions:
  - q-costs-p2-classify
  - q-costs-p2-beq
  - q-costs-p2-mos
  - q-costs-p2-price
  - q-costs-p2-evaluate
  - q-lead-p2-turnover
  - q-costs-hl-special
  - q-lead-hl-decisions
  sections:
  - name: Section A
    marks: 20 at SL, 30 at HL
    task: Answer all the structured questions, which have a quantitative focus.
    aos:
    - AO1
    - AO2
    - AO4
  - name: Section B
    marks: '20'
    task: 'Answer one of two questions: structured parts worth 10 marks and a 10-mark extended response.'
    aos:
    - AO1
    - AO2
    - AO3
    - AO4
  ibGuidance:
  - text: Record every working. Examiners apply an "own figure rule", which credits correct method on an earlier wrong figure, but only when the working is shown.
    location: TSM, p. 60
  - text: 'Attempt every required question: marking is positive, so an attempt can earn marks even when it is not fully right.'
    location: TSM, p. 60
  - text: In section B, choose one stimulus question and answer it fully. Answering both usually produces shallow answers to each.
    location: TSM, p. 60
  - text: Draw tables, charts and cash flows neatly, with a ruler where needed; untidy layouts lead to dropped digits.
    location: TSM, p. 60
  - text: Section A command terms are most likely to be calculate and explain; section B adds AO3 terms such as discuss and evaluate.
    location: TSM, pp. 58 to 59
  - text: Allocate time by the marks and the command term, and leave a question that is not working to come back to it later.
    location: TSM, p. 61
- id: paper-3
  name: Paper 3
  short: P3
  levels: HL only
  order: 3
  summary: 'An HL-only paper about a social enterprise: describe a human need, explain the challenges of meeting it, and recommend a plan of action.'
  facts:
  - text: Paper 3 is taken at HL only, lasts 1 hour 15 minutes, is worth 25 marks and carries 25% of the HL mark.
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, pp. 40 and 47
  - text: The stimulus is a short introduction to a social enterprise, a visual of a product, and five or six excerpts from documents such as emails, social media posts and newspaper articles.
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, p. 42
  - text: 'There are three compulsory questions: describe the human need (2 marks, AO1), explain the challenges facing the social entrepreneur or enterprise (6 marks, AO1 and AO2), and recommend a plan
      of action (17 marks, all four objectives).'
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, pp. 42 and 47
  - text: 'Questions 1 and 2 are marked with an analytic markscheme; question 3 against four criteria: use of resource materials (4 marks), business management tools and theories (4), evaluation (6) and
      sequencing of ideas and plan of action (3).'
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, pp. 47 to 50
  - text: Questions draw on units 1 to 5 including the HL extension material.
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, p. 47
  outline:
    hl:
      duration: 1 hour 15 minutes
      marks: 25
      weight: 25
  notStated:
  - The level descriptors of criteria A to D. They are in the guide (pp. 48 to 50); the platform gives only their names and maximum marks.
  rewards:
  - Holding two objectives at once. A social enterprise must survive financially to pursue its mission, and an answer has to weigh both.
  - Recommendations that are specific to the organization's mission, stakeholders and resources.
  - Use of the course concepts, especially ethics and sustainability, as part of the reasoning rather than as labels.
  preparation:
  - For any business decision you study, ask how the answer would change if the organization's first objective were social rather than financial.
  - Practise the same decision with two sets of stakeholders in mind, the people the mission serves and the people who fund it.
  - Use the Decision Room debriefs to practise saying what would have to be true for a recommendation to fail.
  errors:
  - Treating a social enterprise as a charity, or as a normal business with a slogan.
  - Recommending growth without asking whether it serves the mission or only the revenue.
  questions:
  - q-growth-p3-need
  - q-growth-p3-challenges
  - q-growth-p3-plan
  sections:
  - name: Question 1
    marks: '2'
    task: Describe the human need in the stimulus material.
    aos:
    - AO1
  - name: Question 2
    marks: '6'
    task: Explain the key challenges facing the social entrepreneur or social enterprise.
    aos:
    - AO1
    - AO2
  - name: Question 3
    marks: '17'
    task: Recommend a plan of action for meeting the need, using all the resource material.
    aos:
    - AO1
    - AO2
    - AO3
    - AO4
  criteria:
  - id: A
    name: Use of resource materials
    marks: 4
  - id: B
    name: Business management tools and theories
    marks: 4
  - id: C
    name: Evaluation
    marks: 6
  - id: D
    name: Sequencing of ideas and plan of action
    marks: 3
  ibGuidance:
  - text: Social enterprises can be for-profit or not-for-profit; unlike traditional charities, they earn most of their income from trading, and their surpluses serve their mission. Definitions vary, and
      differ between countries.
    location: TSM, pp. 62 to 63
  - text: 'Question 3 is strategic: tools such as the Ansoff matrix, the BCG matrix and Porter''s generic strategies can support the plan. Recommend is the key command term.'
    location: TSM, p. 66
  - text: Plan question 3 before writing, for example with a SWOT analysis of the stimulus. The plan itself is not marked.
    location: TSM, p. 66
  - text: There is no single correct plan. Higher marks need every piece of stimulus material used well, and an acknowledgement of the further research a final judgement would need.
    location: TSM, p. 66
- id: internal-assessment
  name: Internal assessment
  short: IA
  levels: SL and HL
  order: 4
  summary: A business research project on a real issue facing one organization, analysed through one of the four key concepts. The same task at SL and HL.
  facts:
  - text: The internal assessment carries 30% of the final mark at SL and 20% at HL, is worth 25 marks, and takes about 20 hours of teaching time.
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, pp. 39 to 40 and 52 to 53
  - text: 'The task is the same at SL and HL: a research project of at most 1,800 words about a real business issue or problem facing a single organization, using one key concept as a lens.'
    status: primary
    sources:
    - ib-bm-guide-2024
    - ib-ap-2027-record
    location: Guide, pp. 51 and 53; Assessment procedures 2027, D3.2, p. 192
  - text: The project is assessed by the teacher and moderated by the IB; moderators do not read beyond 1,800 words.
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, pp. 39 and 56
  - text: 'It is assessed against seven criteria: A integration of a key concept (5 marks), B supporting documents (4), C selection and application of tools and theories (4), D analysis and evaluation (5),
      E conclusions (3), F structure (2) and G presentation (2).'
    status: primary
    sources:
    - ib-bm-guide-2024
    location: Guide, pp. 56 to 58
  outline:
    sl:
      duration: 20 hours of teaching time
      marks: 25
      weight: 30
    hl:
      duration: 20 hours of teaching time
      marks: 25
      weight: 20
  notStated:
  - The level descriptors of criteria A to G. They are in the guide (pp. 56 to 58); the platform gives only their names and maximum marks.
  - Your school's internal deadlines, which your teacher sets.
  rewards:
  - A narrow, real issue facing one organization, and a question that can actually be answered with the evidence available.
  - Analysis that uses the course's tools on that evidence, and a conclusion that answers the question asked.
  - A concept used as a lens that changes how the evidence is read, not as a label added at the end.
  preparation:
  - Choose the organization first and the issue second. An issue you cannot get evidence for cannot be researched.
  - 'Write the research question as a decision or a problem the organization faces, then test it: can three to five recent documents answer it?'
  - Read the criteria with your teacher before you start, and keep the list of requirements beside you as you write.
  errors:
  - A topic too broad to answer in the word limit.
  - A description of the organization in place of analysis of its issue.
  questions: []
  requirements:
  - Choose a real business issue or problem, from any part of the syllabus, facing **one** organization. Industry-wide issues that affect it may be considered.
  - Write a research question that looks forward (what should it do?) or backward (why did it happen?).
  - Use **one** key concept as the lens (change, creativity, ethics or sustainability), and state it on the title page.
  - Attach **three to five** supporting documents, chosen by you (not supplied by the teacher), published within three years of submission, each no longer than about five A4 pages, with the relevant parts
    highlighted and each labelled "Supporting document 1" and so on. At most one may be a transcript of audio or video.
  - Base the research on primary or secondary sources, or both. Textbooks and class notes may be cited but are not supporting documents.
  - Keep to **1,800 words**, and give the word count on the cover page. Tables of data, diagrams, calculations, the contents page, citations, footnote references, the supporting documents and the bibliography
    do not count; definitions and quotations do.
  - Structure it as an introduction (the organization, the issue and the method), a main body (findings analysed with tools and theories and the key concept) and a conclusion that answers the research question
    without new arguments.
  - Present it with a title page, an accurate table of contents, headings and numbered pages, and reference every source in a bibliography.
  criteria:
  - id: A
    name: Integration of a key concept
    marks: 5
  - id: B
    name: Supporting documents
    marks: 4
  - id: C
    name: Selection and application of tools and theories
    marks: 4
  - id: D
    name: Analysis and evaluation
    marks: 5
  - id: E
    name: Conclusions
    marks: 3
  - id: F
    name: Structure
    marks: 2
  - id: G
    name: Presentation
    marks: 2
  ibGuidance:
  - text: 'Plan early: on a two-year course, have the organization, the question, the key concept and the likely supporting documents settled by the end of the first year.'
    location: TSM, p. 69
  - text: A narrower question can be answered in more depth but makes three to five relevant documents harder to find; expect to refine the question and the documents together.
    location: TSM, pp. 69 to 70
  - text: Projects based mostly on primary research usually suit a forward-looking question, and projects based mostly on secondary research a backward-looking one. This is advice, not a rule.
    location: TSM, p. 70
  - text: The best questions are ones whose answer you do not know before you start, and that cannot be answered with minimal research.
    location: TSM, p. 70
  - text: Choose tools and theories purposefully and apply them in depth; many tools used superficially weaken a project.
    location: TSM, p. 70
  - text: For the top mark in criterion B, aim for at least four supporting documents, preferably five, that give a range of ideas and views. More than five limits criterion B to 1 mark.
    location: TSM, pp. 70 to 71
  - text: 'To choose the final documents: drop any older than three years, keep those that best answer the question, then check that together they give a range of views.'
    location: TSM, p. 71
  - text: Your teacher can comment on one draft but cannot rewrite it. About two weeks before the deadline, mark your own penultimate draft against the criteria and ask, for each one, what would earn one
      more mark.
    location: TSM, pp. 71 to 72

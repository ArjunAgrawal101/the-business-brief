# Audience pathways. One shared foundation of topics, cases, tools and
# calculations; each pathway is an entry point with its own route, emphasis
# and cautions. A pathway never relabels shared content as meeting a
# qualification's requirements unless that qualification has been mapped.

- id: ib-dp
  name: IB Diploma Business Management
  audience: Students taking IB DP Business Management at SL or HL.
  promise: The syllabus mapped subtopic by subtopic, complete briefs to learn from, and practice organized by paper.
  status: live
  order: 1
  intro: >
    Start with the syllabus map to see the whole course and what each subtopic connects to. Work through
    a topic brief from situation to decision, then practise on the Exam Desk. Statements about the IB
    course were checked against the Business management guide and give its page; the guide is the authority.
  available:
    - { label: "The course and syllabus map", href: "/ib/", note: "Five units, thirty-seven subtopics, SL and HL marked" }
    - { label: "Syllabus coverage", href: "/ib/coverage/", note: "What exists for each subtopic, including the gaps" }
    - { label: "Growth and evolution (1.5)", href: "/topics/growth-and-evolution/", note: "A complete brief with a case and a Decision Room" }
    - { label: "Leadership and management (2.3)", href: "/topics/leadership-and-management/", note: "A complete brief with a case and a Decision Room" }
    - { label: "Costs and revenues (3.3)", href: "/topics/costs-and-revenues/", note: "A complete brief linked to break-even (5.5)" }
    - { label: "Exam Desk", href: "/exam-desk/", note: "Paper 1, Paper 2, Paper 3 and original practice" }
    - { label: "IA Studio", href: "/ia-studio/", note: "The research project's requirements and criteria, and a ten-step planner" }
    - { label: "Revision Briefs", href: "/revision/", note: "One printable page per complete topic" }
  planned:
    - Briefs for the remaining thirty-four subtopics, in the order shown on the coverage page
    - Analysis of released papers, markschemes and subject reports, once they are supplied
  principles:
    - Every statement about the syllabus or the examinations gives its page in the Business management guide, and is written in the platform's words.
    - Original practice questions are labelled as original and are never presented as IB questions.
    - SL and HL are taught together. HL-only content is labelled, and SL students can hide it.

- id: secondary
  name: IGCSE and other secondary courses
  audience: Students of Cambridge IGCSE Business Studies, other IGCSE and GCSE specifications, CBSE and national curricula.
  promise: A shared foundation now; a mapping for each qualification, with its own terminology and rules, later.
  status: planned
  order: 2
  intro: >
    Much of what is taught here (costs and break-even, leadership styles, ways businesses grow) appears in
    secondary business courses too. But no secondary specification has been mapped yet, so nothing on the
    platform is labelled as meeting one. Use the topics as learning, and use your own specification for
    what your examination requires.
  available:
    - { label: "Topics", href: "/topics/", note: "The shared foundation; written for IB but readable at this level" }
    - { label: "Finance Desk", href: "/finance-desk/", note: "Costs, revenue and break-even with full working" }
    - { label: "Glossary", href: "/glossary/", note: "Terms defined in plain language" }
  planned:
    - A mapping for Cambridge IGCSE Business Studies, built from its current syllabus
    - Mappings for other specifications on request, each from its own authoritative document
  principles:
    - Each qualification gets its own mapping, terminology and assessment rules. The IB structure is never assumed to fit another course.
    - Until a specification is mapped, its pathway says so, and no page claims to cover it.
  caution: >
    Terms differ between qualifications (some use "overheads" where the IB uses "indirect costs", some
    expect break-even to be read from a chart rather than calculated). Check your own specification.

- id: undergraduate
  name: Undergraduate business and management
  audience: University students in introductory management, strategy, organizational behaviour and case analysis.
  promise: Cases written to be argued, tools with their origins and limits, and enrichment that points to the literature.
  status: partial
  order: 3
  intro: >
    University courses ask where a framework came from, what it assumes and what the evidence says. Each
    toolkit page states the tool's limits and, where one is well established, its origin, and each topic
    brief has enrichment panels that go beyond the school course. The cases are built for structured
    case analysis.
  available:
    - { label: "Case Vault", href: "/cases/", note: "Three case files with exhibits, stakeholders, options and a worked analysis" }
    - { label: "Decision Room", href: "/decision-room/", note: "Commit to a decision and follow its consequences" }
    - { label: "Toolkit", href: "/toolkit/", note: "What each tool reveals and what it hides" }
  planned:
    - Reading lists for each topic, drawn from sources that have been checked
    - Longer cases with financial statements
  principles:
    - Enrichment is labelled as enrichment. It deepens the school course; it does not replace a university reading list.
    - A framework is taught with its limits, and its origin where one is well established.

- id: mba
  name: MBA and advanced management
  audience: MBA students, executive learners and managers who want deliberate practice in judgement.
  promise: Decisions under uncertainty, with the trade-offs, implementation risks and stakeholder costs made explicit.
  status: partial
  order: 4
  intro: >
    The value here for an advanced learner is the discipline of the sequence: data, insight, option,
    recommendation, then implementation and consequence. The Decision Rooms make you commit before you see
    the consequences, and the debriefs ask what would have to be true for your choice to be the right one.
  available:
    - { label: "Decision Room", href: "/decision-room/", note: "Two-round decisions with simulated consequences" }
    - { label: "Case Vault", href: "/cases/", note: "A worked data, insight, option and recommendation analysis for each case" }
    - { label: "Decision trees", href: "/toolkit/decision-trees/", note: "Expected value, and what it cannot tell you" }
  planned:
    - A Boardroom with multi-function cases and several rounds
    - Corporate strategy cases on portfolio choices and capital allocation
  principles:
    - Cases are simplified on purpose, so that the judgement is visible. They are not a substitute for due diligence.
    - The platform distinguishes formal qualification requirements from advanced enrichment on every page.
  caution: >
    The teaching cases are fictional and their figures simulated. They are built to practise judgement, not
    to describe any real company.

- id: teachers
  name: Teachers and educators
  audience: Teachers of IB DP Business Management and other business courses.
  promise: Classroom-ready sequences, printable case files, discussion prompts and practice with markschemes.
  status: live
  order: 5
  intro: >
    Each complete topic brief ends with a teaching sequence sized for a lesson, discussion prompts and the
    misconceptions to listen for. Case files, Revision Briefs and practice questions print cleanly with their
    sources and attribution. Students' work is never collected: anything they save stays on their own device.
  available:
    - { label: "Teaching sequences", href: "/pathways/teachers/#sequences", note: "One for each complete topic" }
    - { label: "Case files", href: "/cases/", note: "Printable, with exhibits and sources" }
    - { label: "Practice questions", href: "/exam-desk/practice/", note: "Original questions with markschemes and common errors" }
    - { label: "Revision Briefs", href: "/revision/", note: "One printable page per topic" }
  planned:
    - Editable slide decks for each topic
    - A builder for printable question sets
  principles:
    - Resources keep the creator attribution and the platform address when printed for a class.
    - Nothing here collects information about students.

- id: entrepreneurs
  name: Entrepreneurs and professionals
  audience: People starting or running a business, and professionals who make business decisions.
  promise: The same tools a student learns, used on the questions a business owner actually faces.
  status: partial
  order: 6
  intro: >
    Will this price cover my costs? How many do I need to sell? Should I grow by opening my own sites or by
    franchising? What kind of leadership does this team need now? The Finance Desk works the numbers with
    every step shown, and the Decision Rooms let you rehearse a decision before it is real.
  available:
    - { label: "Break-even workspace", href: "/finance-desk/break-even/", note: "Price, cost, break-even and margin of safety" }
    - { label: "Costs and revenue", href: "/finance-desk/costs-and-revenue/", note: "Classify costs and see what drives profit" }
    - { label: "Growth decision", href: "/decision-room/marigold-growth/", note: "Organic growth, franchising, a joint venture or an acquisition" }
    - { label: "Leadership decision", href: "/decision-room/halden-leadership/", note: "A new manager's first ninety days" }
  planned:
    - Cash flow forecasting
    - Pricing and market research workspaces
  principles:
    - Every number shows its working, so you can check it against your own.
    - The numerical answer and the business judgement are kept apart. The calculator gives the first; you supply the second.
  caution: >
    The calculators use a classroom model: price and unit cost are constant, and everything produced is
    sold. Use them to structure your thinking. They are not financial advice.

- id: independent
  name: Independent learners
  audience: Anyone learning business on their own, at any age.
  promise: A self-paced route from a real decision to the ideas behind it.
  status: live
  order: 7
  intro: >
    Start with a decision rather than a definition. Open a Decision Room, choose, see what happens, then
    read the topic brief to understand why. Finish with the Revision Brief to check what you can recall.
  available:
    - { label: "Start with a decision", href: "/decision-room/", note: "Three rooms, each about twenty minutes" }
    - { label: "Topics", href: "/topics/", note: "The ideas behind each decision" }
    - { label: "Search", href: "/search/", note: "Find a term, a tool or a calculation" }
    - { label: "Glossary", href: "/glossary/", note: "Plain-language definitions" }
  planned:
    - Guided courses that join several topics in sequence
  principles:
    - No account is needed and nothing is tracked. Progress you save stays in your browser.
    - Each page says what is established, what is interpretation and what is simulated.

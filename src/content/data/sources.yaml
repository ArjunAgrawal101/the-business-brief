- id: fayol-1916
  title: Administration industrielle et générale
  author: Henri Fayol
  year: '1916'
  kind: academic
  availability: referenced
  note: >
    The origin of the classic list of management functions: planning, organizing, commanding,
    coordinating and controlling. Published in English as *General and Industrial Management* (1949).
    Cited as a bibliographic reference; the text was not opened for this release.

- id: kotter-1990
  title: What Leaders Really Do
  author: John P. Kotter
  publisher: Harvard Business Review
  year: '1990'
  kind: academic
  availability: referenced
  note: >
    The widely taught distinction between management, which copes with complexity, and leadership,
    which copes with change. Cited as a bibliographic reference; the article was not opened for this release.

- id: hersey-blanchard
  title: Life cycle theory of leadership (the origin of the Situational Leadership model)
  author: Paul Hersey and Kenneth H. Blanchard
  publisher: Training and Development Journal
  year: '1969'
  kind: academic
  availability: referenced
  note: >
    The model that matches a leader's mix of direction and support to a follower's readiness for a
    task. Used as enrichment beside the course's situational leadership. Cited as a bibliographic
    reference; the article was not opened for this release.

- id: lewin-1951
  title: Field Theory in Social Science
  author: Kurt Lewin
  year: '1951'
  kind: academic
  availability: referenced
  note: The usual source for force field analysis, the weighing of driving and restraining forces for a change. Cited as a bibliographic reference; the book was not opened for this release.

- id: ansoff-1957
  title: Strategies for Diversification
  author: H. Igor Ansoff
  publisher: Harvard Business Review
  year: '1957'
  kind: academic
  availability: referenced
  note: The article that introduced the product and market growth matrix now called the Ansoff matrix. Cited as a bibliographic reference; the article was not opened for this release.

- id: method-simulated
  title: How the teaching cases and their figures were built
  author: Arjun Agrawal | The Business Brief
  year: '2026'
  kind: method
  availability: repository
  note: >
    The method behind every simulated figure: each case's numbers come from a small stated model (unit
    economics, cost ledgers, staffing records), and tests in `tests/unit/cases.test.ts` recompute every
    stated result from the exhibit it sits beside. See the method note on each case.


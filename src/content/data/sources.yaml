# The source register. Every source the platform relies on, whether it was
# available, and how it may be used. Shown in full on /sources/.
# availability:
#   supplied       the document itself was provided to the project
#   repository     read from a repository the owner controls
#   web-search     found with a web search; the page was not opened directly
#   referenced     a bibliographic reference to a published work; not opened here
#   not-available  needed, but not available in this release


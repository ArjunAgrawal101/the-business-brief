# The claims register: each factual claim the platform makes about a
# requirement, an institution or a real organization, the sources behind it,
# where in the source, how far it is verified, and where it is used.
# Status values: primary, recorded, corroborated, conflicting, unverified.

- id: course-units
  statement: The IB DP Business Management course first assessed in 2024 is organized in five units, from Introduction to business management to Operations management.
  sources: [sme-bm-2024, tutopiya-bm-hl, acs-bm-2024, ib-bm-guide-2024]
  status: corroborated
  checked: '2026-10-29'
  usedIn: [/ib/, /ib/coverage/]

- id: course-subtopic-count
  statement: The HL course has thirty-seven subtopics.
  sources: [tutopiya-bm-hl]
  status: corroborated
  checked: '2026-10-29'
  usedIn: [/ib/, /ib/coverage/]
  note: One source gives the count; it matches the thirty-seven subtopics assembled independently from the other listings.

- id: course-hl-only-subtopics
  statement: Eleven subtopics are HL only (2.5, 2.7, 3.6, 3.9, 4.3, 4.6, 5.3, 5.6, 5.7, 5.8 and 5.9), and some subtopics taken at both levels contain HL-only content (2.3, 3.4 and 3.8 among them).
  sources: [acs-bm-2024, revisiondojo-bm, thinkib-bm, oup-bm-coursebook]
  status: corroborated
  checked: '2026-10-29'
  usedIn: [/ib/, /ib/coverage/]
  note: The status of 2.7, 5.7 and 5.8 and the title of 3.6 are less well supported; see the notes on each subtopic.

- id: course-concepts
  statement: The course has four concepts, change, creativity, ethics and sustainability, which replaced the previous course's concepts.
  sources: [clastify-bm, acs-bm-2024]
  status: corroborated
  checked: '2026-10-29'
  usedIn: [/ib/, /ib/concepts/]

- id: course-toolkit
  statement: The course has a business management toolkit of fifteen tools, some of them HL only.
  sources: [sme-bm-2024, revisiondojo-bm]
  status: corroborated
  checked: '2026-10-29'
  usedIn: [/toolkit/]

- id: toolkit-hl-tools
  statement: Eight toolkit tools are taken at SL and HL (SWOT analysis, Ansoff matrix, STEEPLE analysis, Boston Consulting Group matrix, business plan, decision trees, descriptive statistics and circular business models) and seven are HL only (force field analysis, Gantt chart, Hofstede's cultural dimensions, Porter's generic strategies, contribution, critical path analysis and simple linear regression).
  sources: [revisiondojo-bm, ibbm-toolkit, excel-econ-toolkit]
  status: corroborated
  checked: '2026-10-29'
  usedIn: [/toolkit/]
  note: Two listings found by web search give the same eight SL and HL tools and the same seven HL-only tools; another marks five of the seven HL only and is silent on the other two.

- id: toolkit-cpa
  statement: Critical path analysis is an HL-only toolkit tool.
  sources: [revisiondojo-bm, excel-econ-toolkit]
  status: conflicting
  checked: '2026-10-29'
  usedIn: [/toolkit/]
  note: Most listings include it as HL only; one source states that it was removed from the syllabus. Check against the Guide.

- id: assessment-weightings
  statement: At SL, Paper 1 and Paper 2 each carry 35% and the internal assessment 30%; at HL, Paper 1 carries 25%, Paper 2 30%, Paper 3 25% and the internal assessment 20%.
  sources: [clastify-bm, revisiondojo-bm, thinkib-bm]
  status: corroborated
  checked: '2026-10-29'
  usedIn: [/exam-desk/, /exam-desk/paper-1/, /exam-desk/paper-2/, /exam-desk/paper-3/, /ia-studio/]
  note: Some sites still give the previous course's weightings, which differ.

- id: assessment-durations
  statement: Paper 1 is common to SL and HL and lasts 1 hour 30 minutes; Paper 2 lasts 1 hour 30 minutes at SL and 1 hour 45 minutes at HL; Paper 3 (HL only) lasts 1 hour 15 minutes.
  sources: [clastify-bm, revisiondojo-bm]
  status: corroborated
  checked: '2026-10-29'
  usedIn: [/exam-desk/, /exam-desk/paper-1/, /exam-desk/paper-2/, /exam-desk/paper-3/]

- id: paper1-prerelease
  statement: Paper 1 is based on a pre-released statement, issued about three months before the examination (in the first week of February for May sessions and of August for November sessions), giving a small number of topics as context and roughly the first 200 words of the case study.
  sources: [ib-ap-2027-record]
  location: Assessment procedures 2027, section D3.3, page 194
  status: recorded
  checked: '2026-10-29'
  usedIn: [/exam-desk/paper-1/]

- id: paper2-quantitative
  statement: Paper 2 is based on unseen stimulus material with a quantitative focus.
  sources: [thinkib-bm]
  status: unverified
  checked: '2026-10-29'
  usedIn: [/exam-desk/paper-2/]
  note: Only one secondary source in this session described Paper 2's focus.

- id: paper3-social-enterprise
  statement: Paper 3 is taken at HL only and is based on a case study of a social enterprise.
  sources: [acs-bm-2024, revisiondojo-bm]
  status: corroborated
  checked: '2026-10-29'
  usedIn: [/exam-desk/paper-3/]

- id: ia-research-project
  statement: The internal assessment is a research project of at most 1,800 words on an issue facing an organization, investigated through a conceptual lens; Business management is sampled once across SL and HL for moderation.
  sources: [ib-ap-2027-record]
  location: Assessment procedures 2027, section D3.2, page 192
  status: recorded
  checked: '2026-10-29'
  usedIn: [/ia-studio/]

- id: ia-concept-lens
  statement: The conceptual lens of the research project is one of the course's four concepts.
  sources: [clastify-bm]
  status: corroborated
  checked: '2026-10-29'
  usedIn: [/ia-studio/]

- id: command-term-wording
  statement: The definitions of command terms the course shares with IB Economics use the wording of the IB Economics guide's glossary.
  sources: [ib-econ-guide-2022]
  status: recorded
  checked: '2026-10-29'
  usedIn: [/examiner-lens/]
  note: The wording is primary for Economics. That the Business management guide uses identical wording is expected, because IB command terms are shared, but it has not been checked.

- id: command-term-aos
  statement: The grouping of Business management command terms under AO1 to AO4.
  sources: [ib-bm-guide-2024]
  status: unverified
  checked: '2026-10-29'
  usedIn: [/examiner-lens/]
  note: The grouping shown is the platform's reading and must be checked against the Guide's glossary. The four objectives carry the same names as in the Economics guide.

- id: growth-content
  statement: Subtopic 1.5 covers internal and external economies and diseconomies of scale, the difference between internal and external growth, reasons for businesses to grow and to stay small, and external growth methods (mergers and acquisitions, takeovers, joint ventures, strategic alliances and franchising).
  sources: [revisiondojo-bm, sme-bm-2024]
  status: corroborated
  checked: '2026-10-29'
  usedIn: [/topics/growth-and-evolution/]

- id: leadership-content
  statement: Subtopic 2.3 covers the functions of management, management versus leadership, and the autocratic, paternalistic, democratic, laissez-faire and situational leadership styles; part of the subtopic is HL only.
  sources: [revisiondojo-bm, sme-bm-2024]
  status: corroborated
  checked: '2026-10-29'
  usedIn: [/topics/leadership-and-management/]

- id: leadership-hl-decisions
  statement: Scientific and intuitive decision-making is HL-only content within subtopic 2.3.
  sources: [revisiondojo-bm]
  status: unverified
  checked: '2026-10-29'
  usedIn: [/topics/leadership-and-management/]
  note: One secondary source places it in 2.3 with an HL label.

- id: costs-content
  statement: Subtopic 3.3 covers types of cost (fixed, variable, semi-variable, direct and indirect or overhead) and total revenue and revenue streams.
  sources: [ib-bm-guide-2024]
  status: unverified
  checked: '2026-10-29'
  usedIn: [/topics/costs-and-revenues/]
  note: No source found in this session listed the content of 3.3 in detail.

- id: breakeven-content
  statement: Subtopic 5.5 covers contribution, break-even quantity and revenue, margin of safety, target profit output and target price, and the effect of changes in price or cost.
  sources: [sme-bm-2024, tutorchase-bm]
  status: corroborated
  checked: '2026-10-29'
  usedIn: [/finance-desk/break-even/, /topics/costs-and-revenues/]
  note: Target price was not mentioned explicitly in the sources found.


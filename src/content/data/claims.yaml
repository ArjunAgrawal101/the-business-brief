- id: costs-content
  statement: Subtopic 3.3 covers types of cost (fixed, variable, direct and indirect or overhead) and total revenue and revenue streams, at AO2.
  sources:
  - ib-bm-guide-2024
  location: pp. 28 to 29
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /topics/costs-and-revenues/
  note: Semi-variable costs are not in the guide's list; the platform uses them because real cost ledgers contain them, and says so.
- id: breakeven-content
  statement: Subtopic 5.5 covers total contribution and contribution per unit, the break-even chart (break-even quantity, profit or loss, margin of safety, target profit output, target profit and target
    price), the effects of changes in price or cost, and the limitations of break-even analysis.
  sources:
  - ib-bm-guide-2024
  location: p. 34
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /finance-desk/break-even/
  - /topics/costs-and-revenues/
- id: contribution-hl

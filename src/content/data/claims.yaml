# The claims register: each factual claim the platform makes about a
# requirement, an institution or a real organization, the sources behind it,
# where in the source, how far it is verified, and where it is used.
# Status values: primary, recorded, corroborated, conflicting, unverified,
# pedagogical. Course claims were checked against the Business management
# guide (first assessment 2024) on 29 October 2026.

- id: course-units
  statement: 'The course has five units: Introduction to business management, Human resource management, Finance and accounts, Marketing, and Operations management.'
  sources:
  - ib-bm-guide-2024
  location: Syllabus outline, pp. 21 to 22
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /ib/
  - /ib/coverage/
- id: course-hours
  statement: The recommended teaching time is 150 hours at SL and 240 at HL, including the toolkit (10 and 35 hours), research for the paper 1 pre-released statement (5 and 5) and the internal assessment
    (20 and 20).
  sources:
  - ib-bm-guide-2024
  location: pp. 3, 7 and 21 to 22
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /ib/
- id: course-subtopic-count
  statement: The syllabus has thirty-seven subtopics.
  sources:
  - ib-bm-guide-2024
  location: Syllabus outline, pp. 21 to 22
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /ib/
  - /ib/coverage/
- id: course-hl-only-subtopics
  statement: Eleven subtopics are HL only (2.5, 2.7, 3.6, 3.9, 4.3, 4.6, 5.3, 5.6, 5.7, 5.8 and 5.9), and seven subtopics taken at both levels contain HL-only content (2.2, 2.3, 2.4, 3.4, 3.8, 4.1 and 4.5).
  sources:
  - ib-bm-guide-2024
  location: Syllabus content, pp. 23 to 36
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /ib/
  - /ib/coverage/
- id: course-3-6-title
  statement: Subtopic 3.6 is titled "Efficiency ratio analysis" and is HL only.
  sources:
  - ib-bm-guide-2024
  location: p. 21 and p. 29
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /ib/
  note: Some secondary sources call it "Debt/equity ratio analysis".
- id: course-concepts
  statement: 'The course has four key concepts: change, creativity, ethics and sustainability.'
  sources:
  - ib-bm-guide-2024
  location: pp. 6 and 12 to 13
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /ib/concepts/
  - /ib/
- id: course-aims
  statement: The course has four aims, including developing students as confident, creative and compassionate business leaders, entrepreneurs, social entrepreneurs and change agents, and engaging with decision-making
    as a process and a skill.
  sources:
  - ib-bm-guide-2024
  location: p. 17
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /platform/
- id: course-toolkit
  statement: 'The toolkit has fifteen tools: eight at SL and HL (SWOT analysis, Ansoff matrix, STEEPLE analysis, Boston Consulting Group matrix, business plan, decision trees, descriptive statistics and
    circular business models) and seven HL only (force field analysis, Gantt chart, Hofstede''s cultural dimensions, Porter''s generic strategies, contribution, critical path analysis and simple linear
    regression). All must be taught at AO2 and AO4 alongside the syllabus content.'
  sources:
  - ib-bm-guide-2024
  location: Business management toolkit, pp. 13 to 15
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /toolkit/
- id: toolkit-cpa
  statement: Critical path analysis is an HL-only tool covering the completion and analysis of a critical path diagram (drawing one is not expected), identification of the critical path, and calculation
    of free and total float.
  sources:
  - ib-bm-guide-2024
  location: pp. 14 to 15
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /toolkit/
- id: toolkit-classification
  statement: Toolkit tools can be classified as situational (for example SWOT and STEEPLE analysis), planning (for example the business plan, critical path analysis and Gantt charts) and decision-making
    tools (for example decision trees, the BCG matrix and the Ansoff matrix); a tool can fit more than one class.
  sources:
  - ib-bm-tsm-2022
  location: p. 26
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /toolkit/
  note: The TSM classifies these eight tools by example. The class of the other seven is the platform's reading and is marked as such.
- id: aos
  statement: 'The course has four assessment objectives: knowledge and understanding (AO1), application and analysis (AO2), synthesis and evaluation (AO3), and use and application of appropriate skills
    (AO4).'
  sources:
  - ib-bm-guide-2024
  location: p. 18
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /exam-desk/
  - /examiner-lens/
- id: command-term-aos
  statement: 'The guide lists thirty-one command terms: six at AO1, seven at AO2, nine at AO3 and nine at AO4.'
  sources:
  - ib-bm-guide-2024
  location: pp. 19 to 20 and 67 to 68
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /examiner-lens/
- id: command-term-rule
  statement: An examination question may use a command term from the depth of teaching set for the topic or from a lower level, but not from a higher one.
  sources:
  - ib-bm-guide-2024
  location: p. 42
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /examiner-lens/
  - /exam-desk/
- id: command-term-wording
  statement: The platform explains each command term in its own words. The official definitions are in the guide's glossary of command terms.
  sources:
  - ib-bm-guide-2024
  location: pp. 67 to 68
  status: pedagogical
  checked: '2026-10-29'
  usedIn:
  - /examiner-lens/
- id: assessment-weightings
  statement: At SL, paper 1 and paper 2 each carry 35% and the internal assessment 30%. At HL, paper 1 carries 25%, paper 2 30%, paper 3 25% and the internal assessment 20%.
  sources:
  - ib-bm-guide-2024
  location: Assessment outlines, pp. 39 to 40
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /exam-desk/
  - /exam-desk/paper-1/
  - /exam-desk/paper-2/
  - /exam-desk/paper-3/
  - /ia-studio/
- id: assessment-durations
  statement: Paper 1 lasts 1 hour 30 minutes at both levels; paper 2 lasts 1 hour 30 minutes at SL and 1 hour 45 minutes at HL; paper 3 (HL only) lasts 1 hour 15 minutes. Every paper begins with five minutes
    of reading time.
  sources:
  - ib-bm-guide-2024
  location: pp. 39 to 41
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /exam-desk/
  - /exam-desk/paper-1/
  - /exam-desk/paper-2/
  - /exam-desk/paper-3/
- id: paper1-structure
  statement: Paper 1 (30 marks) has section A, structured questions worth 20 marks, and section B, one of two extended-response questions worth 10 marks. It is the same paper at SL and HL and excludes HL
    extension material.
  sources:
  - ib-bm-guide-2024
  location: pp. 39 to 40 and 43 to 46
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /exam-desk/paper-1/
- id: paper1-prerelease
  statement: Three months before paper 1, the IB releases a statement with a small number of topics to research (about five hours, building on but not in the syllabus) and roughly the first 200 words of
    an unseen case study of about 800 to 1,000 words. Most questions are qualitative; some minor calculations are possible.
  sources:
  - ib-bm-guide-2024
  - ib-ap-2027-record
  location: p. 41; Assessment procedures 2027, D3.3, p. 194
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /exam-desk/paper-1/
- id: paper2-structure
  statement: Paper 2 is based on unseen stimulus material with a quantitative focus, presented in parts. Section A (20 marks at SL, 30 at HL) is structured questions; section B (20 marks) is one of two
    questions combining structured parts with a 10-mark extended response. SL and HL sit different papers; HL includes the HL extension material.
  sources:
  - ib-bm-guide-2024
  location: pp. 39 to 42 and 43 to 47
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /exam-desk/paper-2/
- id: paper2-sl-social-enterprise
  statement: At SL, one of the stimulus options in paper 2 section B may be about a social enterprise.
  sources:
  - ib-bm-guide-2024
  location: p. 42
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /exam-desk/paper-2/
- id: paper3-structure
  statement: 'Paper 3 (HL only, 25 marks) is about a social enterprise. Its stimulus is a short introduction to the organization, a visual of a product and five or six excerpts from documents. There are
    three compulsory questions: describing a human need (2 marks, AO1), explaining the challenges facing the social entrepreneur (6 marks, AO2) and recommending a plan of action (17 marks), marked against
    four criteria.'
  sources:
  - ib-bm-guide-2024
  location: pp. 7, 42 and 47 to 50
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /exam-desk/paper-3/
- id: markbands-structure
  statement: The 10-mark extended responses in section B of papers 1 and 2 are marked with markbands of five levels (1 to 2, 3 to 4, 5 to 6, 7 to 8, 9 to 10) that judge understanding of the question, use
    of tools and theories, use of the stimulus and the balance of the argument. Paper 3 question 3 is marked against criteria A to D (4, 4, 6 and 3 marks).
  sources:
  - ib-bm-guide-2024
  location: pp. 44 to 50
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /exam-desk/
  - /examiner-lens/
  note: The platform summarizes the markbands and criteria; it does not reproduce their wording.
- id: calculators
  statement: Every calculation can be done with a four-function calculator; graphic display calculators are allowed.
  sources:
  - ib-bm-guide-2024
  location: p. 43
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /exam-desk/paper-2/
  - /finance-desk/
- id: ia-research-project
  statement: 'The internal assessment is the same at SL and HL: a business research project of at most 1,800 words about a real issue or problem facing a single organization, with a forward- or backward-looking
    research question, three to five supporting documents and one key concept as its lens (25 marks).'
  sources:
  - ib-bm-guide-2024
  - ib-ap-2027-record
  location: pp. 51 to 56; Assessment procedures 2027, D3.2, p. 192
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /ia-studio/
- id: ia-supporting-documents
  statement: Supporting documents must be chosen by the student, published within three years of submission, highlighted where relevant, and labelled; at most one may be a transcript of audio or video,
    and no one document should be longer than about five A4 pages.
  sources:
  - ib-bm-guide-2024
  location: pp. 54 to 55
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /ia-studio/
- id: ia-criteria
  statement: 'The research project is marked against seven criteria: A integration of a key concept (5 marks), B supporting documents (4), C selection and application of tools and theories (4), D analysis
    and evaluation (5), E conclusions (3), F structure (2) and G presentation (2).'
  sources:
  - ib-bm-guide-2024
  location: pp. 56 to 58
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /ia-studio/
- id: ia-word-count
  statement: The 1,800-word limit excludes the contents page, tables of statistical data, diagrams, calculations, supporting documents, citations, references in footnotes and the bibliography; definitions
    and quotations in the body count. Moderators do not read beyond 1,800 words.
  sources:
  - ib-bm-guide-2024
  location: p. 56
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /ia-studio/
- id: formulae
  statement: The formulae for gross profit margin, profit margin, ROCE, the current and acid test ratios, stock turnover, debtor and creditor days, gearing, ARR, NPV, capacity utilization rate and productivity
    rate are given in the guide and supplied in the examination; HL discount tables are provided where needed.
  sources:
  - ib-bm-guide-2024
  location: pp. 64 to 66
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /finance-desk/
- id: statement-formats
  statement: In assessment, the profit and loss account is called the statement of profit or loss and the balance sheet the statement of financial position; statements, cash flow forecasts and budgets follow
    set layouts with negative figures in brackets.
  sources:
  - ib-bm-guide-2024
  location: pp. 59 to 63
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /finance-desk/
- id: growth-content
  statement: 'Subtopic 1.5 covers internal and external economies and diseconomies of scale (AO2), internal versus external growth (AO2), reasons to grow and to stay small (AO3), and external growth methods:
    mergers and acquisitions, takeovers, joint ventures, strategic alliances and franchising (AO3).'
  sources:
  - ib-bm-guide-2024
  location: p. 24
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /topics/growth-and-evolution/
- id: leadership-content
  statement: Subtopic 2.3 covers management and leadership (AO2), the autocratic, paternalistic, democratic, laissez-faire and situational styles (AO3), and, at HL only, scientific and intuitive thinking
    and management (AO2).
  sources:
  - ib-bm-guide-2024
  location: p. 26
  status: primary
  checked: '2026-10-29'
  usedIn:
  - /topics/leadership-and-management/
- id: labour-turnover-hl
  statement: Labour turnover is HL-only content in subtopic 2.4 (AO2 and AO4).
  sources:
  - ib-bm-guide-2024
  location: p. 26
  status: primary
  checked: '2026-10-29'
  usedIn:

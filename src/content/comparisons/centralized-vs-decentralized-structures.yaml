title: Centralized against decentralized structures
question: "Should decisions be made at the top, or by the managers closest to the work?"
summary: "Two answers to where authority sits in an organization: kept at the centre for control and consistency, or delegated for speed and local knowledge."
order: 9
sides:
  - name: Centralization
    syllabus:
      - code: '2.2'
        statement: 'Terms for organizational structures'
    terms: [centralization, chain-of-command, bureaucracy]
    level: SL/HL
    purpose: "To keep decision-making authority with senior managers at the centre, for control and a consistent approach."
    structure: "Important decisions are made at head office and passed down the chain of command; local managers carry them out within tight rules."
    context: "Businesses where consistency matters most (a brand, safety, a franchise standard), where decisions need a view of the whole business, or in a crisis."
    strengths:
      - "Consistent decisions, standards and brand across every branch."
      - "Senior managers see the whole business and can coordinate."
      - "Economies of scale in central functions such as buying."
    limitations:
      - "Slow to respond to local conditions."
      - "Local managers with little authority may lose motivation."
      - "Senior managers can be overloaded with decisions."
    mistakes:
      - "Confusing centralization with a tall structure: they often go together, but one is about authority and the other about levels."
      - "Assuming centralization is always slow or old-fashioned."
      - "Ignoring the costs of losing local knowledge."
    application:
      fictional: true
      business: Rowanbridge Pharmacies
      body: "A chain of pharmacies keeps buying, pricing and clinical procedures at head office: patients get the same safe service in every branch, and bulk buying cuts costs, though branch managers cannot respond quickly to local demand."
    exam: "Apply the term to the case: where are decisions made, and does that suit the business's situation? The guide asks which structure suits a change in external factors (AO3), so judge whether centralization still fits after the change in the case."
  - name: Decentralization
    syllabus:
      - code: '2.2'
        statement: 'Terms for organizational structures'
    terms: [decentralization, delegation, empowerment]
    level: SL/HL
    purpose: "To pass decision-making authority down to managers in branches, regions or teams, closer to customers and the work."
    structure: "Authority is delegated: local managers decide within agreed limits, and head office sets objectives and checks results."
    context: "Businesses that serve varied local markets, need fast responses, or employ skilled staff who expect responsibility."
    strengths:
      - "Faster decisions based on local knowledge."
      - "Motivates local managers through responsibility and trust."
      - "Frees senior managers for strategy."
    limitations:
      - "Less consistency between branches, which can harm a brand."
      - "Duplication of functions and possible loss of economies of scale."
      - "Depends on capable, well-trained local managers."
    mistakes:
      - "Treating decentralization as the absence of control: head office still sets objectives and monitors."
      - "Recommending it where local managers lack the skills or information to decide."
      - "Forgetting the coordination costs between decentralized units."
    application:
      fictional: true
      business: Rowanbridge Pharmacies
      body: "The same chain lets branch managers choose their opening hours and local health services, such as clinics for travellers near the airport, while keeping clinical rules central. Branch sales of services rise, and managers' turnover falls."
    exam: "Use the case's evidence on local markets, staff skills and the need for consistency to judge the fit. Strong answers weigh speed and motivation against control, and often recommend a mix: some decisions central, some local."
difference: "The difference is where decisions are made. Centralization keeps authority at the top, for control, consistency and a view of the whole. Decentralization delegates it down, for speed, local knowledge and motivation. Most organizations sit somewhere between the two and decide function by function."
choose:
  - when: "A franchise or a safety-critical business where every branch must follow the same standards."
    use: 0
    why: "Consistency matters more than local variation."
  - when: "Branches serve very different local markets that change quickly."
    use: 1
    why: "Local managers with authority can respond faster than head office."
  - when: "A crisis that threatens the whole business."
    use: 0
    why: "Fast, coordinated decisions from the centre usually work better in a crisis."
together: "Businesses often centralize some functions (finance, buying, brand) and decentralize others (local marketing, staffing). The comparison of [tall and flat structures](/frameworks/compare/tall-vs-flat-structures/) covers the related question of how many levels the organization has."

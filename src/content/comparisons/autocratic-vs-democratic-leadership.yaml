title: Autocratic against democratic leadership
question: "Should the leader decide alone, or involve the team in the decision?"
summary: "Two of the leadership styles the course names, at opposite ends of how far staff take part in decisions. Neither is better everywhere: the situation decides."
order: 3
sides:
  - name: Autocratic leadership
    syllabus:
      - code: '2.3'
        statement: 'Leadership styles: autocratic'
    terms: [autocratic-leadership, leadership]
    level: SL/HL
    purpose: "To make decisions quickly and keep tight control, with the leader deciding and staff carrying out instructions."
    structure: "Power and decisions sit with the leader; communication runs mainly downwards; staff are told what to do and how, with close supervision."
    context: "A crisis or an emergency, a task where mistakes are dangerous, or a team of new or unskilled staff who need clear instructions. Less suited to skilled, creative work."
    strengths:
      - "Decisions are quick, which matters when time is short."
      - "Clear lines of responsibility: everyone knows who decides."
      - "Consistent standards where safety or quality depend on following procedures."
    limitations:
      - "Staff have little say, which can demotivate skilled people and raise labour turnover."
      - "Ideas from the people closest to the work are lost."
      - "The business depends on one person's judgement."
    mistakes:
      - "Equating autocratic with bad: in a crisis it may be exactly right."
      - "Confusing it with paternalistic leadership, which also decides alone but in what the leader sees as staff's interests, and explains why."
      - "Judging a style without saying what about the situation makes it fit or not."
    application:
      fictional: true
      business: Tollbridge Chemicals
      body: "After a leak at its plant, the site manager takes direct control: she gives instructions, assigns every task and checks each step until the site is safe. Staff later say it was the right call for the emergency, though not for the weekly planning meetings that followed."
    exam: "Define the style, then judge its fit to the case's situation: the urgency, the risk, and the skills and expectations of the staff. Strong answers compare it with at least one other style named in the guide and reach a conditional judgement, such as when it would stop fitting."
  - name: Democratic leadership
    syllabus:
      - code: '2.3'
        statement: 'Leadership styles: autocratic'
    terms: [democratic-leadership, leadership]
    level: SL/HL
    purpose: "To involve staff in decisions, drawing on their knowledge and winning their commitment to what is decided."
    structure: "The leader consults the team, discusses options and may let the group decide; communication runs both ways, and the leader keeps the final responsibility."
    context: "Skilled or creative teams, decisions where staff know more than the leader about the work, and changes that need staff commitment to succeed. Less suited to emergencies."
    strengths:
      - "Uses the ideas and expertise of the people who do the work."
      - "Staff who helped make a decision are more committed to it."
      - "Tends to motivate skilled staff, linking to the non-financial rewards of empowerment and teamwork."
    limitations:
      - "Decisions take longer, which can be costly when time is short."
      - "Consultation that is ignored breeds cynicism."
      - "Responsibility can blur when everyone is involved."
    mistakes:
      - "Assuming it always motivates; some staff prefer clear direction."
      - "Treating consultation as democratic leadership when the leader has already decided."
      - "Forgetting that the leader still answers for the decision."
    application:
      fictional: true
      business: Tollbridge Chemicals
      body: "Planning how to reorganize the plant's shifts, the same manager runs workshops with the operators, who know which shift patterns cause fatigue. The new rota takes three weeks to agree, but absence falls once it starts."
    exam: "Apply it to the case's staff and task, and weigh its benefits against the time it takes. Situational leadership, also in the guide, is the natural conclusion: say which situations in the case call for which style, rather than naming one style as best."
difference: "The difference is who takes part in deciding. An autocratic leader decides alone and instructs; a democratic leader involves the team and seeks agreement. The trade-off is speed and control against commitment and the use of staff knowledge."
choose:
  - when: "An emergency, a safety risk or a deadline measured in hours."
    use: 0
    why: "Speed and clear control matter more than consultation."
  - when: "A change that skilled staff must carry out, and that needs their knowledge to work."
    use: 1
    why: "Involvement draws on their expertise and wins the commitment the change depends on."
  - when: "New, inexperienced staff learning a routine task."
    use: 0
    why: "Clear instructions help, though the leader may move towards consultation as skills grow."
together: "Many leaders use both, which is the idea behind situational leadership in the guide: autocratic in a crisis, democratic in planning. The library's page on [leadership styles](/frameworks/leadership-styles/) sets out all five styles the course names."

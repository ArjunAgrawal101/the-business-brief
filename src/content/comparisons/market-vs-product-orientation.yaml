title: Market orientation against product orientation
question: "Should the business start from what customers want, or from what it can make best?"
summary: "Two approaches to marketing in 4.1: building the offer around customers' needs, found by research, or around the product and the business's own expertise."
order: 15
sides:
  - name: Market orientation
    syllabus:
      - code: '4.1'
        statement: 'Market orientation versus product orientation'
    terms: [market-orientation, market-research]
    level: SL/HL
    purpose: "To decide what to make and how to sell it by first finding out what customers need and want."
    structure: "Market research comes first; products, prices, promotion and distribution are designed around what it finds, and changed as customers' wants change."
    context: "Fast-changing consumer markets with strong competition and customers who can easily switch, such as fashion, food and drink, or apps."
    strengths:
      - "Products are more likely to sell, because they answer known needs."
      - "The business notices and responds to changing tastes."
      - "Customer loyalty is easier to build."
    limitations:
      - "Market research is costly and takes time."
      - "Customers cannot always say what they would want from something that does not exist yet."
      - "Chasing every change in taste can blur the brand and raise costs."
    mistakes:
      - "Treating market orientation as doing whatever customers say, at any cost."
      - "Assuming market-oriented businesses do no product innovation."
      - "Ignoring the research that market orientation depends on."
    application:
      fictional: true
      business: Pinecrest Snacks
      body: "A snack maker surveys shoppers and finds rising demand for lower-sugar snacks. It reformulates two products and launches a new range, tested with focus groups before launch."
    exam: "Identify the orientation from evidence in the case (does the business start with research or with the product?) and analyse its effect on the marketing mix. The guide pairs the two orientations (AO2), so be ready to compare them; judge which suits the business's market."
  - name: Product orientation
    syllabus:
      - code: '4.1'
        statement: 'Market orientation versus product orientation'
    terms: [product-orientation]
    level: SL/HL
    purpose: "To build the business around its product and its own expertise, trusting that a good product will find buyers."
    structure: "The business develops the best product it can, often from its technical skill or research, then looks for customers; research into customers comes later, if at all."
    context: "Markets where quality, technical performance or innovation decides the sale, such as precision instruments, medicines or luxury craft goods, and genuinely new products customers cannot yet imagine."
    strengths:
      - "Can lead to innovations customers did not know they wanted."
      - "Builds on the business's own strengths and skills."
      - "Avoids the cost of extensive market research."
    limitations:
      - "Risk of making products nobody wants."
      - "Slow to notice changes in customers' needs."
      - "Rivals who listen to customers may overtake the business."
    mistakes:
      - "Treating product orientation as always out of date: some markets reward it."
      - "Confusing it with poor marketing; the issue is where the business starts."
      - "Ignoring the risk when a product-oriented business enters a consumer market."
    application:
      fictional: true
      business: Fallowmere Instruments
      body: "A maker of laboratory balances improves accuracy year after year, led by its engineers. Its scientific customers value exactly that, though a cheaper rival's simpler balance is winning schools, which it never asked about."
    exam: "Use the case's evidence on how decisions are made, and judge the orientation against the market: technical, innovative markets may reward it, fast-moving consumer markets rarely do. Avoid treating either orientation as simply right."
difference: "The difference is where the business starts. A market-oriented business starts from customers' needs, found by research, and designs the offer around them. A product-oriented business starts from the product and its own expertise, and then looks for buyers. Most businesses blend the two, leaning one way according to their market."
choose:
  - when: "A consumer market where tastes change quickly and rivals compete hard."
    use: 0
    why: "Knowing what customers want, and noticing when it changes, decides who sells."
  - when: "A technical or innovative product that customers cannot yet describe."
    use: 1
    why: "The business's expertise leads, because customers cannot say what they would want."
  - when: "A luxury or craft product whose appeal is its quality and tradition."
    use: 1
    why: "The product's own qualities are what customers buy."
together: "Many successful businesses combine them: product expertise generates ideas, and market research tests and shapes them before launch. The Market Studio's [STP planner](/market-studio/stp-planner/) helps a business start from its customers."

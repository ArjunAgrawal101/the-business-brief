title: Profitability ratios against liquidity ratios
question: "Is the business making enough profit, or can it pay its debts as they fall due?"
summary: "Two families of ratios in the guide that answer different questions. A business can be profitable and short of cash, or liquid and barely profitable."
order: 6
sides:
  - name: Profitability ratios
    syllabus:
      - code: '3.5'
        statement: 'Profitability ratios: gross profit margin'
    terms: [profitability, gross-profit-margin, profit-margin, return-on-capital-employed]
    level: SL/HL
    purpose: "To judge how well the business turns sales and capital into profit."
    structure: "The guide's three: gross profit margin and profit margin, each a profit as a percentage of sales revenue, and return on capital employed (ROCE), profit before interest and tax as a percentage of capital employed."
    context: "Judging performance over time or against rivals, deciding whether prices or costs need attention, and asking whether capital is earning enough."
    strengths:
      - "Shows how much of each sale is kept as profit, and how well capital is used."
      - "Comparable across years and across businesses of different sizes."
      - "Points to where to act: a falling gross margin points to prices or the cost of sales."
    limitations:
      - "Says nothing about cash: a profitable business can still run out of money."
      - "Based on past accounts, which may be dressed up or out of date."
      - "Needs a benchmark (last year, rivals, the industry) to mean anything."
    mistakes:
      - "Mixing up the gross profit margin with the profit margin."
      - "Calculating a ratio without interpreting it or comparing it with anything."
      - "Proposing to cut costs that would damage quality or future sales."
    application:
      fictional: true
      business: Fernhallow Garden Centre
      body: "The garden centre's gross profit margin fell from 38% to 29% in a year, as suppliers raised prices and it held its own. The ratio points to the cause, and the board reviews its prices on the lines most affected."
    exam: "Calculate accurately with the guide's formulas, then interpret: compare with another year or a rival, explain the cause from the case, and suggest a strategy to improve the ratio, which the guide asks you to evaluate (AO3). Always state the unit, a percentage."
  - name: Liquidity ratios
    syllabus:
      - code: '3.5'
        statement: 'Liquidity ratios: current ratio'
    terms: [liquidity, current-ratio, acid-test-ratio, working-capital]
    level: SL/HL
    purpose: "To judge whether the business can pay its short-term debts as they fall due."
    structure: "The guide's two: the current ratio, current assets divided by current liabilities, and the acid test (quick) ratio, which leaves stock out of the current assets."
    context: "Checking whether a business can pay its suppliers and short-term lenders, especially when stock is high or sales are seasonal."
    strengths:
      - "Shows short-term financial health that profit figures hide."
      - "The acid test reveals a business relying on stock that may be hard to sell."
      - "Simple to calculate from the statement of financial position."
    limitations:
      - "A snapshot on one day, which may not represent the rest of the year."
      - "The right level depends on the industry: a supermarket can run safely below 1."
      - "High ratios can mean idle cash or excessive stock, not strength."
    mistakes:
      - "Assuming higher is always better."
      - "Forgetting that the acid test excludes stock."
      - "Confusing liquidity with profitability: a liquid business may still be making losses."
    application:
      fictional: true
      business: Fernhallow Garden Centre
      body: "In a different year the centre is profitable, but its current ratio is 0.86 and its acid test 0.35: cash is tied up in unsold garden furniture. It clears the slowest lines in a sale and negotiates longer credit with suppliers."
    exam: "Calculate both ratios, compare them, and use the gap between them to say how far the business relies on stock. Interpret against the industry and the case, and match the strategy to the cause, such as clearing stock or changing credit terms."
difference: "Profitability ratios ask whether the business earns enough from its sales and capital; liquidity ratios ask whether it can pay its bills in the short term. They draw on different statements: profitability on the statement of profit or loss (with capital employed), liquidity on the statement of financial position. A business needs both: profit for the long term, liquidity to survive the short term."
choose:
  - when: "Margins are falling, or the owners ask whether the business is earning enough."
    use: 0
    why: "Profitability ratios measure exactly that, and point to prices or costs."
  - when: "Suppliers are chasing late payments, or stock is piling up."
    use: 1
    why: "Liquidity ratios show whether short-term debts can be met."
  - when: "A bank is deciding whether to grant a short-term loan or an overdraft."
    use: 1
    why: "A lender for the short term cares first about the ability to pay soon, though it will look at profit too."
together: "Read them together: profit with poor liquidity suggests cash tied up in stock or debtors; good liquidity with falling margins suggests a pricing or cost problem. The Finance Desk's [ratio desk](/finance-desk/ratios/) works both families from two years of accounts."

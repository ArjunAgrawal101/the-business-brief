title: Just-in-time against just-in-case
question: "Should the business hold as little stock as possible, or keep a buffer in case supply fails?"
summary: "Two approaches to stock from 5.6, HL only: receiving supplies just as they are needed, or holding stock in case of delays or surges in demand."
order: 13
sides:
  - name: Just-in-time (JIT)
    syllabus:
      - code: '5.6'
        statement: 'Just-in-time (JIT) versus just-in-case (JIC)'
      - code: '5.3'
        statement: 'continuous improvement (kaizen) and just-in-time'
    terms: [just-in-time, lean-production, supply-chain]
    level: HL
    purpose: "To cut the cost and waste of holding stock by receiving materials just as production needs them."
    structure: "Small, frequent deliveries timed to production, close links with reliable suppliers, and little or no buffer stock; a method of lean production in 5.3."
    context: "Reliable suppliers close by, steady and predictable demand, and stock that is costly to hold or quick to go out of date."
    strengths:
      - "Lower stock-holding costs: storage, insurance and capital tied up."
      - "Less waste from damaged or out-of-date stock."
      - "Frees space and cash for production."
    limitations:
      - "A late delivery or a disruption can stop production."
      - "Depends on suppliers' reliability and close relationships."
      - "More frequent deliveries can cost more, and bulk discounts are lost."
    mistakes:
      - "Recommending JIT without evidence that suppliers are reliable."
      - "Ignoring the cost of a stoppage when counting the savings."
      - "Treating JIT as zero stock in every case."
    application:
      fictional: true
      business: Thornleigh Seating
      body: "A maker of car seats receives fabric and foam twice a day from suppliers a few miles away, timed to its production schedule. Its warehouse shrinks to a third of its old size, and the space becomes a second assembly line."
    exam: "HL only, so it will not be needed in Paper 1 (guide, p. 43). The guide frames 5.6 as JIT versus JIC at AO3, so evaluate: weigh the savings against the risk of disruption, using the case's evidence on suppliers and demand, and reach a judgement."
  - name: Just-in-case (JIC)
    syllabus:
      - code: '5.6'
        statement: 'Just-in-time (JIT) versus just-in-case (JIC)'
    terms: [just-in-case, buffer-stock, stock-out]
    level: HL
    purpose: "To protect production and sales against delays and surges by holding buffer stock."
    structure: "Larger, less frequent orders, with a buffer stock and a reorder level set to cover usage during the lead time, as a stock control chart shows."
    context: "Unreliable or distant suppliers, uncertain or seasonal demand, and stock that is cheap to hold or may rise in price."
    strengths:
      - "Production and sales continue through supply delays."
      - "Can meet sudden rises in demand."
      - "Bulk buying may win discounts."
    limitations:
      - "Higher stock-holding costs, and cash tied up in stock."
      - "Risk of waste as stock is damaged or goes out of date."
      - "Large stocks can hide problems in production."
    mistakes:
      - "Assuming more stock is always safer, without counting its cost."
      - "Ignoring the effect of stock on liquidity."
      - "Treating JIC as old-fashioned rather than as a deliberate choice for risky supply."
    application:
      fictional: true
      business: Thornleigh Seating
      body: "After a storm closes the port for a week, a rival on JIT stops its line. Thornleigh, which kept two weeks of foam for imported parts just in case, keeps producing and wins two urgent orders."
    exam: "Use the case's evidence on supply risk and demand to judge whether a buffer is worth its cost. Strong answers see that many businesses mix the two: JIT for reliable local supplies, JIC for critical or distant ones."
difference: "JIT holds as little stock as possible, relying on suppliers to deliver just in time: cheaper and leaner, but exposed to disruption. JIC holds buffer stock in case something goes wrong: safer, but costlier, with cash tied up and a risk of waste. The choice turns on how reliable supply is and how predictable demand is."
choose:
  - when: "Suppliers are reliable and close, and demand is steady."
    use: 0
    why: "The risk of disruption is low, so the savings of JIT are worth having."
  - when: "Supplies come from far away or from unreliable suppliers."
    use: 1
    why: "A buffer protects production from delays that JIT could not absorb."
  - when: "Demand is seasonal or hard to predict."
    use: 1
    why: "Stock held in advance meets surges that just-in-time deliveries could not."
together: "Many businesses run JIT for most supplies and keep a JIC buffer for the few that are critical or come from far away. The Operations Floor's [stock control simulator](/operations-floor/stock-control/) shows how lead time and buffer stock interact."

title: Quality control, quality assurance and TQM
question: "Should the business catch faults at the end, prevent them in each process, or make quality everyone's job?"
summary: "Three approaches to quality from 5.3, all HL only: inspecting products, assuring the processes that make them, and a whole-organization culture of quality."
order: 12
sides:
  - name: Quality control
    syllabus:
      - code: '5.3'
        statement: 'Features of quality control and quality assurance'
    terms: [quality-control, quality]
    level: HL
    purpose: "To find and remove faulty products by inspecting them, usually at the end of production."
    structure: "Inspectors check finished products, or samples of them, against a standard; faulty items are rejected, reworked or scrapped."
    context: "Products where a fault must never reach the customer and can be found by inspection, or a business that has not yet built quality into its processes."
    strengths:
      - "Stops many faulty products reaching customers."
      - "Simple to introduce and to understand."
      - "Gives data on defects that can show where problems arise."
    limitations:
      - "Finds faults after the cost of making them has been paid."
      - "Makes quality the inspectors' job, so workers may stop checking their own work."
      - "Inspection by sample can miss faults."
    mistakes:
      - "Treating more inspectors as the answer to a rising defect rate."
      - "Confusing quality control (inspecting products) with quality assurance (assuring processes)."
      - "Ignoring the cost of the waste that inspection reveals."
    application:
      fictional: true
      business: Corriemoor Ceramics
      body: "A tableware maker inspects every finished plate and rejects about one in twenty. Customers rarely receive a faulty plate, but the rejects cost the business materials, kiln time and labour."
    exam: "HL only, so it will not be needed in Paper 1 (guide, p. 43). Explain what it does and does not achieve in the case, using any defect data; the guide also asks for the impact of lean production and TQM on an organization (AO3), so compare it with prevention."
  - name: Quality assurance
    syllabus:
      - code: '5.3'
        statement: 'Features of quality control and quality assurance'
    terms: [quality-assurance, quality-standard]
    level: HL
    purpose: "To prevent faults by making sure each process meets agreed standards, so products are right first time."
    structure: "Standards and procedures for each stage of production, checked by the workers who carry them out and audited; national and international quality standards can certify the system."
    context: "A business whose faults come from particular processes, or one that needs to show customers a certified quality system."
    strengths:
      - "Prevents faults instead of catching them, cutting waste and rework."
      - "Involves workers in checking their own processes."
      - "Certification can reassure customers and open markets."
    limitations:
      - "Writing, training for and auditing procedures takes time and money."
      - "Procedures can become paperwork that staff follow without thought."
      - "Focuses on processes, and may not change attitudes across the business."
    mistakes:
      - "Describing it as inspection by another name."
      - "Assuming certification guarantees good products."
      - "Ignoring the cost and time of setting it up."
    application:
      fictional: true
      business: Corriemoor Ceramics
      body: "Most rejects come from one glazing stage, where the procedure has never been written down. The business writes a standard procedure, trains the glazers and checks the kiln temperature every hour; rejects at that stage fall sharply."
    exam: "Use the case's evidence on where faults arise: quality assurance suits faults concentrated in identifiable processes. Weigh the set-up cost against the waste it prevents, and link to the importance of quality standards, also in 5.3."
  - name: Total quality management
    syllabus:
      - code: '5.3'
        statement: 'total quality management (TQM)'
    terms: [total-quality-management, quality-circle, kaizen]
    level: HL
    purpose: "To make quality the responsibility of everyone in the organization, in every activity, continuously."
    structure: "A culture rather than a procedure: every worker checks and improves their own work, teams such as quality circles solve problems, and the aim is zero defects and continuous improvement."
    context: "Faults that arise across the whole business, or a business whose culture treats quality as someone else's job."
    strengths:
      - "Tackles the causes of poor quality wherever they arise."
      - "Motivates through responsibility and involvement."
      - "Links to lean production and continuous improvement (kaizen)."
    limitations:
      - "Takes years to change a culture, and needs commitment from the top."
      - "Training and time spent in improvement teams cost money."
      - "Can fade into slogans if results are not visible."
    mistakes:
      - "Treating TQM as a quick fix for a single problem."
      - "Confusing quality circles (one method) with TQM (the whole approach)."
      - "Forgetting the time and leadership it needs."
    application:
      fictional: true
      business: Corriemoor Ceramics
      body: "Years later, faults turn up at every stage and staff say quality is the inspectors' job. The business trains every team to check its own work, sets up quality circles and shares defect data weekly; the change takes two years."
    exam: "Judge whether the case's problem calls for a change of culture or a fix to one process, and evaluate TQM's impact on the organization, which the guide names directly (AO3). Acknowledge the time and the cost of the change."
difference: "Quality control catches faults after they are made, by inspection. Quality assurance prevents them in each process, through standards. TQM makes quality everyone's responsibility, across the whole organization, as a culture of continuous improvement. They move from detecting faults to preventing them, and from specialists to everyone."
choose:
  - when: "Faults must not reach customers today, while longer-term fixes are prepared."
    use: 0
    why: "Inspection is the quickest way to stop faulty products leaving the business."
  - when: "Most faults come from one or two identifiable processes."
    use: 1
    why: "Assuring those processes prevents the faults at their source."
  - when: "Faults arise everywhere and staff see quality as someone else's job."
    use: 2
    why: "Only a change in culture across the organization will last."
together: "They are layers rather than rivals: many businesses keep some inspection, assure their key processes and work towards TQM over time. The [scenario generator](/decision-room/scenarios/) has cases on a rising defect rate that practise choosing between them from the data."

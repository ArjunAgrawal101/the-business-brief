title: The Ansoff matrix against the BCG matrix
question: "Where should the business grow next, or which of its products deserve the cash?"
summary: "Two matrices from the toolkit that look alike and answer different questions: the Ansoff matrix maps routes to growth, the BCG matrix maps the products a business already sells."
order: 1
sides:
  - name: The Ansoff matrix
    framework: ansoff-matrix
    tool: ansoff-matrix
    subtopics: ['1.5', '4.2']
    terms: [ansoff-matrix, market-penetration, product-development, market-development, diversification]
    level: SL/HL
    purpose: "To lay out the directions in which a business could grow, and compare how far each takes it from what it already knows, before it commits to one."
    structure: "Two axes, products and markets, each split into existing and new, give four cells: market penetration, product development, market development and diversification. Risk usually rises from penetration to diversification."
    context: "A business that wants to grow and has several routes open, such as a regional brand weighing a new range against a new region. It looks forward, at options that do not exist yet."
    strengths:
      - "Makes managers consider all four directions, not just the obvious one."
      - "Shows the relative risk of each route before any figures are worked out."
      - "Links growth to marketing planning and to the evidence each route needs."
    limitations:
      - "The line between existing and new is a judgement, and many options sit between cells."
      - "It says nothing about profit, competitors or the cash each route needs."
      - "The usual risk of a cell can mislead in a particular case."
    mistakes:
      - "Placing an option by whether it is new to the industry rather than new to the business."
      - "Confusing the direction of growth (market development) with its method (franchising, a joint venture)."
      - "Treating the cell's usual risk as the option's actual risk."
    application:
      fictional: true
      business: Harbourside Preserves
      body: "A maker of jams sold in its own country lists four ideas: a loyalty offer for current stockists, a range of chutneys, selling its jams abroad online, and a café. Mapping them shows that only the café is new on both counts; the board shortlists the chutneys and the online exports and asks for evidence on each."
    exam: "Name the cell for each option the case offers and explain why it sits there, using the case's own products and markets. Then judge the route: the matrix ranks risk, so add the evidence it leaves out, such as cost, competition and the business's skills, before recommending one."
  - name: The BCG matrix
    framework: bcg-matrix
    tool: bcg-matrix
    subtopics: ['4.5']
    terms: [bcg-matrix, bcg-star, bcg-cash-cow, bcg-question-mark, bcg-dog]
    level: SL/HL
    purpose: "To judge a portfolio of products the business already sells, and decide which should receive cash, which should provide it, and which to rethink."
    structure: "Products are placed by the growth of their market and their market share relative to the largest rival. The four cells are stars, cash cows, question marks and dogs."
    context: "A business with several products or brands competing for limited money, such as a drinks company deciding where next year's marketing budget should go. It looks at the present portfolio."
    strengths:
      - "Shows the balance of a portfolio at a glance, and where cash comes from and goes."
      - "Uses figures (growth and relative share) rather than opinion alone."
      - "Links the product portfolio to the product life cycle and to cash flow."
    limitations:
      - "Market share is not the same as profit; a dog can still earn a little."
      - "Defining the market changes every product's share, and so its cell."
      - "It assumes each product stands alone, though products often sell together."
    mistakes:
      - "Using market share instead of relative market share, the product's share divided by the largest rival's."
      - "Deciding to drop every dog without asking whether it still earns cash or supports the range."
      - "Treating the four labels as instructions rather than prompts for a judgement."
    application:
      fictional: true
      business: Harbourside Preserves
      body: "Five years later the business sells four products. Its strawberry jam leads a slow-growing market (a cash cow); its chutneys trail the leader in a fast-growing one (a question mark). The matrix shows the jam's cash funding the chutneys, if the business believes they can win share."
    exam: "Calculate relative market share where the data allows, place each product, and say what the placing means for cash. A strong answer goes beyond the labels: it asks whether a question mark can really win share and whether the cash cow's market is about to decline."
difference: "The Ansoff matrix is about the future: which new combination of products and markets to grow into, and how risky each is. The BCG matrix is about the present: how the products a business already sells are placed by market growth and share, and so where its cash should go. One generates growth options; the other allocates money between existing products."
choose:
  - when: "The owners want growth and are weighing a new product, a new market or both."
    use: 0
    why: "The question is which direction to take, which the Ansoff matrix sets out with the risk of each."
  - when: "Several existing products compete for a limited marketing budget."
    use: 1
    why: "The question is which products deserve cash, which the BCG matrix answers from growth and relative share."
  - when: "A product is ageing and the business must decide whether to replace it or reposition it."
    use: 1
    why: "Its place in the portfolio, and the cash it earns, come first; the Ansoff matrix can then frame what replaces it."
together: "Used in turn they make a plan: the BCG matrix shows which products earn the cash and which need it, and the Ansoff matrix shows where that cash could take the business next. A question mark backed by a cash cow is often a product development or a market development in Ansoff's terms."

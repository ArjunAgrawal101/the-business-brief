title: SWOT analysis against STEEPLE analysis
question: "Should we look at the whole position of the business, or scan the world outside it?"
summary: "SWOT weighs the business's own strengths and weaknesses against what is happening outside; STEEPLE looks only outside, more thoroughly. The second often feeds the first."
order: 2
sides:
  - name: SWOT analysis
    framework: swot-analysis
    tool: swot-analysis
    subtopics: ['1.3', '1.5']
    terms: [swot-analysis, swot-strengths, swot-weaknesses, swot-opportunities, swot-threats]
    level: SL/HL
    purpose: "To set what a business does well and badly against the opportunities and threats around it, so that a decision rests on both."
    structure: "Four boxes: strengths and weaknesses, which are internal and within the business's control, and opportunities and threats, which are external and outside it."
    context: "Any decision that depends on both the business's capabilities and its environment, such as whether a small firm is ready to open a second site."
    strengths:
      - "Simple, quick and familiar, so a team can build it together."
      - "Puts internal capability and the external environment on one page."
      - "Reading across the boxes (can a strength seize an opportunity?) turns a list into options."
    limitations:
      - "Lists can grow long with no sense of which factors matter most."
      - "Whether a factor is a strength or a weakness often depends on the decision being made."
      - "It describes a position; it does not decide anything by itself."
    mistakes:
      - "Putting external factors, such as a new competitor, under weaknesses."
      - "Listing generic points that would apply to any business."
      - "Stopping at the four lists without saying what they mean for the decision."
    application:
      fictional: true
      business: Kestwell Physiotherapy
      body: "A clinic weighing a second site lists its strengths (loyal patients, skilled staff), its weakness (the owner runs everything), an opportunity (a new suburb with no clinic) and a threat (a national chain looking nearby). Reading across, the board sees that the weakness must be fixed before the opportunity can be taken."
    exam: "Choose a few factors that matter for the question, each from the case, and put each in the right box. Then use the boxes: link a strength to an opportunity, or a weakness to a threat, and reach a judgement. Four bare lists earn little credit on their own."
  - name: STEEPLE analysis
    framework: steeple-analysis
    tool: steeple-analysis
    subtopics: ['1.5', '2.1', '4.6']
    terms: [steeple-analysis, steeple-factors]
    level: SL/HL
    purpose: "To scan the external environment systematically, under seven headings, so that no important factor outside the business is missed."
    structure: "Seven headings for external factors: social, technological, economic, environmental, political, legal and ethical."
    context: "Decisions that turn on the world outside, such as entering a new country, planning for a change in the law, or understanding why staff are hard to recruit."
    strengths:
      - "More thorough than a list of opportunities and threats: each heading prompts questions."
      - "Gives ethics a heading of its own, so questions of right and wrong are not left to chance."
      - "Its findings feed the opportunities and threats of a SWOT analysis."
    limitations:
      - "It looks only outside: it says nothing about whether the business can respond."
      - "The headings overlap, so the same factor can be filed in two places."
      - "A long scan can bury the few factors that matter under many that do not."
    mistakes:
      - "Including internal factors, such as the business's own staff turnover."
      - "Describing each factor without saying what it means for the business."
      - "Filling every heading for the sake of it instead of ranking the factors by impact."
    application:
      fictional: true
      business: Kestwell Physiotherapy
      body: "Before choosing the suburb, the clinic scans it: an ageing population raising demand (social), booking apps (technological), rising rents (economic), new rules on patient records (legal) and the ethics of selling treatment packages. Two factors stand out, and they go into the SWOT as an opportunity and a threat."
    exam: "Use the headings to find the external factors in the case, then rank them: say which two or three matter most for the decision and why. Keep internal factors out, and remember that the course uses STEEPLE; if a source says PESTLE, the ethical heading is the difference."
difference: "SWOT covers both sides of a business's position: inside (strengths, weaknesses) and outside (opportunities, threats). STEEPLE covers only the outside, but in far more detail, under seven headings. A STEEPLE analysis is often the way to find the opportunities and threats that a SWOT analysis then weighs against the business's own capabilities."
choose:
  - when: "The decision depends on whether the business itself is ready, as well as on its market."
    use: 0
    why: "Only SWOT puts internal strengths and weaknesses beside the external factors."
  - when: "A business is entering a new country or facing a change in the law or in society."
    use: 1
    why: "The decision turns on external factors, which STEEPLE scans systematically."
  - when: "A full strategic review before a major decision."
    use: 1
    why: "Start with STEEPLE to find the external factors, then carry the most important into a SWOT."
together: "Scan with STEEPLE, carry the most important factors into the opportunities and threats of a SWOT, then add the strengths and weaknesses and read across the boxes. The library's page on [PESTLE against STEEPLE](/frameworks/pestle/) explains how STEEPLE relates to the PESTLE checklist used in many textbooks."

title: Payback, ARR and NPV
question: "Which way of appraising an investment answers the question the business is really asking?"
summary: "The guide's three methods of investment appraisal: how fast the money comes back, the average return it earns, and what the future cash is worth today. NPV is HL only."
order: 10
sides:
  - name: Payback period
    syllabus:
      - code: '3.8'
        statement: 'payback period and average rate of return'
    terms: [payback-period, investment-appraisal]
    level: SL/HL
    purpose: "To find how long an investment takes to repay its cost from the net cash it generates."
    structure: "Add the net cash flows year by year until they equal the cost; with even flows within a year, the part year is the amount still to recover divided by that year's net cash flow, often given in years and months."
    context: "Businesses short of cash, risky or fast-changing markets, and any investment where getting the money back soon matters more than the total return."
    strengths:
      - "Simple to calculate and to understand."
      - "Favours projects that return cash quickly, which reduces risk and helps liquidity."
      - "Useful where forecasts beyond a few years are unreliable."
    limitations:
      - "Ignores all cash after the payback point."
      - "Ignores the timing of cash within the payback period, and the time value of money."
      - "Says nothing about profitability."
    mistakes:
      - "Converting the part year into months wrongly, such as reading 0.4 of a year as four months."
      - "Using profit instead of net cash flow."
      - "Recommending the faster project without noting what it earns after paying back."
    application:
      fictional: true
      business: Saltmarsh Laundry Services
      body: "A laundry compares two washing machines. Machine A costs more but pays back in 2 years 6 months; machine B pays back in 3 years 2 months. With little cash to spare, the owners value the faster return."
    exam: "Show the cumulative cash flow line by line and give the answer in years and months. Then interpret it against the business's situation (its cash, the risk) and add what payback leaves out, ideally with ARR beside it."
  - name: Average rate of return (ARR)
    syllabus:
      - code: '3.8'
        statement: 'payback period and average rate of return'
    terms: [average-rate-of-return, investment-appraisal]
    level: SL/HL
    purpose: "To measure the average yearly profit an investment earns, as a percentage of its cost."
    structure: "Total net returns minus the cost gives the total profit; divide by the number of years for the average yearly profit, then by the cost, times 100."
    context: "Comparing projects of different sizes by their profitability, or checking a project against a target rate the business sets."
    strengths:
      - "Uses all the returns over the project's life."
      - "A percentage, easy to compare with a target or with interest rates."
      - "Focuses on profitability, which owners care about."
    limitations:
      - "Ignores the timing of returns: early and late cash count the same."
      - "Ignores the time value of money."
      - "Depends on estimates of returns far into the future."
    mistakes:
      - "Forgetting to subtract the cost before averaging."
      - "Dividing by the number of years twice, or not at all."
      - "Treating a high ARR as safe when most of the return comes in the final years."
    application:
      fictional: true
      business: Saltmarsh Laundry Services
      body: "Over five years, machine B returns more in total: its ARR is 18% against machine A's 14%. Machine A pays back sooner, but machine B is the more profitable over its life."
    exam: "Set out the working: total returns, total profit, average yearly profit, then the percentage. Compare with the other project or a target, and note that ARR ignores timing, which payback captures: together they make a balanced judgement."
  - name: Net present value (NPV)
    syllabus:
      - code: '3.8'
        statement: 'Net present value (NPV)'
    terms: [net-present-value, discount-factor, present-value, time-value-of-money]
    level: HL
    purpose: "To value an investment's future net cash flows in today's money, and so whether it adds value after the cost."
    structure: "Multiply each year's net cash flow by the discount factor for that year at the chosen rate, add the present values, and subtract the cost. A positive NPV means the investment earns more than the discount rate."
    context: "Long-lived investments where the timing of cash matters, and decisions that must account for the time value of money."
    strengths:
      - "Accounts for the time value of money: cash received sooner is worth more."
      - "Uses all the cash flows over the project's life."
      - "Gives a clear rule: invest if the NPV is positive."
    limitations:
      - "The result depends on the discount rate chosen, which is a judgement."
      - "Harder to calculate and explain than payback."
      - "Still rests on forecasts of future cash flows."
    mistakes:
      - "Forgetting to subtract the initial cost."
      - "Discounting the year-zero cost."
      - "Using the wrong year's discount factor, or a rate other than the one given."
    application:
      fictional: true
      business: Saltmarsh Laundry Services
      body: "Discounted at 10% with the guide's printed factors, machine B's NPV is positive and higher than machine A's; at 20%, machine A's quicker returns give it the higher NPV. The choice depends on the rate the business should use."
    exam: "HL only, so it will not be needed in Paper 1, which leaves out HL-only material (guide, p. 43). Use the discount factors given, show each present value, and interpret the sign of the result. Evaluate by noting how the answer depends on the rate."
difference: "Payback measures speed: how quickly the cost comes back. ARR measures profitability: the average yearly return as a percentage of the cost. NPV measures value: what the future cash is worth today, after the cost, allowing for the time value of money. Payback and ARR are for SL and HL; NPV is HL only."
choose:
  - when: "The business is short of cash, or the market changes fast."
    use: 0
    why: "Getting the money back quickly matters most, which payback measures."
  - when: "The owners want to know which project earns the better return over its life."
    use: 1
    why: "ARR gives the average return as a percentage, comparable with a target."
  - when: "A long-lived investment where cash in later years is worth less than cash now."
    use: 2
    why: "Only NPV allows for the time value of money."
together: "Use them together: payback for risk and liquidity, ARR or NPV for profitability. A strong answer notes where they disagree and explains why, as in a fast-paying project with a lower return. The Finance Desk's [investment appraisal desk](/finance-desk/investment-appraisal/) works all three."

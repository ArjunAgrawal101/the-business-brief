title: Primary against secondary research
question: "Should the business collect new data, or use what others have already published?"
summary: "Primary research gathers new data for the business's own question; secondary research uses data that already exists. The guide names the methods of each."
order: 11
sides:
  - name: Primary research
    syllabus:
      - code: '4.4'
        statement: 'Primary research: surveys'
    terms: [primary-research, survey, interview, focus-group, observation]
    level: SL/HL
    purpose: "To collect new data, first hand, to answer the business's own question."
    structure: "The guide names surveys, interviews, focus groups and observations; the data can be quantitative or qualitative, and comes from a sample chosen by a method such as quota, random or convenience sampling."
    context: "Questions no one has answered yet, such as how a business's own customers react to a new product, or what its staff think of a change."
    strengths:
      - "Tailored to the exact question, and up to date."
      - "The business owns the data, so rivals do not have it."
      - "Can explore reasons in depth through interviews and focus groups."
    limitations:
      - "Costly and slow to collect."
      - "Reliability depends on the sample: a small or biased sample misleads."
      - "Respondents may say what they think the researcher wants to hear."
    mistakes:
      - "Ignoring how the sample was chosen when judging the results."
      - "Assuming that what people say they will buy is what they will buy."
      - "Choosing primary research when good secondary data already exists."
    application:
      fictional: true
      business: Greywater Juice Company
      body: "Before launching a mango and ginger juice, the company surveys 400 shoppers chosen to match its target market by age and region, then runs two focus groups to find out why some disliked the taste."
    exam: "Name the method, apply it to the business's question, and judge its reliability: the sample, the method of sampling and possible bias. Compare it with secondary research before recommending, using the cost and the time the business has."
  - name: Secondary research
    syllabus:
      - code: '4.4'
        statement: 'Secondary research: market analyses'
    terms: [secondary-research, market-analysis, government-publication, academic-journal, media-article, online-content]
    level: SL/HL
    purpose: "To use data that already exists, collected by others for other purposes, to inform the business's decision."
    structure: "The guide names market analyses, academic journals, government publications, media articles and online content."
    context: "Understanding a market's size, trends and competitors before spending on primary research, or when time and money are short."
    strengths:
      - "Quick and cheap, often free."
      - "Can cover a whole market or country, beyond what one business could survey."
      - "A good starting point that shows what primary research still needs to find."
    limitations:
      - "Collected for another purpose, so it may not answer the business's question."
      - "May be out of date or of uncertain accuracy."
      - "Available to rivals too, so it gives no advantage on its own."
    mistakes:
      - "Treating any published figure as reliable without asking who produced it and when."
      - "Using national data for a decision about one local market."
      - "Forgetting that secondary data can be quantitative or qualitative."
    application:
      fictional: true
      business: Greywater Juice Company
      body: "Before any survey, the company reads a market analysis of chilled juices and a government report on food spending. They show the market growing and the main rivals, but nothing about how shoppers would react to its new flavour."
    exam: "Name the source, judge its relevance, age and reliability, and say what it cannot tell the business. A strong answer recommends secondary research first, then primary research to fill the gaps."
difference: "Primary research collects new data for the business's own question: tailored and owned, but costly and slow. Secondary research uses existing data collected by others: quick and cheap, but general, possibly dated and available to rivals. Both can be quantitative or qualitative."
choose:
  - when: "A business wants to understand the size and trends of a market it is considering."
    use: 1
    why: "Published market analyses and government data cover this quickly and cheaply."
  - when: "A business needs to know how its own customers react to a new product."
    use: 0
    why: "No one else has this data; only primary research can collect it."
  - when: "Time and money are short."
    use: 1
    why: "Secondary research is quicker and cheaper, though less tailored."
together: "Researchers usually start with secondary research to understand the market and frame the question, then use primary research to answer what the published data cannot. The Market Studio's [questionnaire builder](/market-studio/research-questionnaire/) helps design the primary part."

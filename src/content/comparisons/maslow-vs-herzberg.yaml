title: Maslow against Herzberg
question: "What motivates people at work, and what only stops them being dissatisfied?"
summary: "Two content theories of motivation from the guide: Maslow's ladder of needs, and Herzberg's split between factors that dissatisfy and factors that motivate."
order: 7
sides:
  - name: Maslow's hierarchy of needs
    framework: maslows-hierarchy-of-needs
    syllabus:
      - code: '2.4'
        statement: 'Motivation theories of Taylor, Maslow and Herzberg'
    terms: [maslows-hierarchy-of-needs, motivation]
    level: SL/HL
    purpose: "To explain motivation as a hierarchy of needs, each level motivating once the one below is broadly met."
    structure: "Five levels, from the bottom: physiological needs, safety, love and belonging (social), esteem, and self-actualization."
    context: "Explaining why the same reward motivates one employee and not another, and why basic needs (pay, security) must be met before recognition or growth can motivate."
    strengths:
      - "Intuitive and easy to apply to an employee's situation."
      - "Reminds managers that people's needs differ and change."
      - "Links rewards to needs: pay to physiological needs, recognition to esteem."
    limitations:
      - "The strict order is not well supported: people pursue several needs at once."
      - "Hard to measure which level someone has reached."
      - "Reflects one culture's view of needs; others may rank them differently."
    mistakes:
      - "Treating the levels as a rigid ladder that everyone climbs in order."
      - "Listing the five levels without linking them to the employees in the case."
      - "Assuming self-actualization is everyone's goal at work."
    application:
      fictional: true
      business: Linfield Contact Centre
      body: "New call handlers on short contracts care most about secure hours (safety); experienced staff with secure jobs respond to a scheme that recognizes their expertise (esteem). One reward package does not fit both."
    exam: "Apply the levels to the case's employees: what needs do they have, and which are already met? Then evaluate the theory's limits. The guide names Maslow, Herzberg and Taylor together at AO3, so a comparison with Herzberg is a natural route to evaluation."
  - name: Herzberg's motivation-hygiene theory
    framework: herzbergs-motivation-hygiene-theory
    syllabus:
      - code: '2.4'
        statement: 'Motivation theories of Taylor, Maslow and Herzberg'
    terms: [herzbergs-motivation-hygiene-theory, hygiene-factors, motivators]
    level: SL/HL
    purpose: "To separate the factors whose absence makes people dissatisfied from the factors that actively motivate them."
    structure: "Hygiene factors (pay, working conditions, security, company policy, supervision) prevent dissatisfaction but do not motivate; motivators (achievement, recognition, responsibility, the work itself, advancement) motivate."
    context: "Deciding where to spend on staff: whether to fix the basics or to enrich jobs, and why a pay rise may not raise effort for long."
    strengths:
      - "Explains why pay rises often fail to motivate for long."
      - "Points directly to job enrichment, which the guide names as a non-financial reward."
      - "Separates two different problems: dissatisfaction and lack of motivation."
    limitations:
      - "Based on interviews with professional staff, which may not apply to all jobs."
      - "Pay can act as recognition, blurring the line between the two kinds of factor."
      - "Hard to apply where jobs cannot easily be enriched."
    mistakes:
      - "Saying pay is a motivator in Herzberg's theory: it is a hygiene factor."
      - "Assuming removing dissatisfaction makes people motivated."
      - "Proposing job enrichment while the hygiene factors are still poor."
    application:
      fictional: true
      business: Linfield Contact Centre
      body: "A staff survey scores working conditions lowest: broken headsets and a cramped rest room. Herzberg's theory says recognition schemes will achieve little until these hygiene factors are fixed, so the centre fixes them first, then enriches the experienced staff's jobs."
    exam: "Classify the factors in the case as hygiene factors or motivators, then judge which the business should address first. Pair it with Maslow to evaluate: both put basic needs first, but Herzberg says meeting them only removes dissatisfaction."
difference: "Maslow describes a single ladder of needs that motivate in turn; Herzberg describes two separate sets of factors, one that can only remove dissatisfaction and one that motivates. Maslow says meeting a need motivates until it is met; Herzberg says the basics never motivate, they only stop people being unhappy."
choose:
  - when: "Staff in very different situations respond differently to the same reward."
    use: 0
    why: "Maslow explains that their unmet needs differ."
  - when: "A pay rise has not improved effort, and staff complain about conditions."
    use: 1
    why: "Herzberg separates the hygiene problem (conditions) from motivation, which pay will not supply."
  - when: "Designing jobs to motivate skilled staff."
    use: 1
    why: "Herzberg's motivators point directly to job enrichment and responsibility."
together: "They agree more than they differ: Herzberg's hygiene factors match Maslow's lower needs, and his motivators match esteem and self-actualization. Use one to apply and the other to evaluate. The People and Culture room's [motivation analysis](/people-and-culture/motivation-analysis/) reads a job through each theory."

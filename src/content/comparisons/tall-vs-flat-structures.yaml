title: Tall against flat structures
question: "How many levels of management should the organization have?"
summary: "Two shapes of organization chart from 2.2: many levels with narrow spans of control, or few levels with wide ones."
order: 14
sides:
  - name: Tall (vertical) structure
    syllabus:
      - code: '2.2'
        statement: 'Organization charts: flat or horizontal'
    terms: [tall-structure, span-of-control, levels-of-hierarchy, chain-of-command]
    level: SL/HL
    purpose: "To organize people through many levels of management, each manager supervising a few people closely."
    structure: "Many levels of hierarchy, narrow spans of control and a long chain of command from the top to the front line."
    context: "Large organizations, work that needs close supervision or strict control (safety, compliance), and staff who expect clear career steps."
    strengths:
      - "Close supervision and control, with narrow spans."
      - "Clear lines of authority and many steps for promotion."
      - "Managers have time for each member of their team."
    limitations:
      - "Slow communication and decisions through a long chain of command."
      - "Costly: many managers' salaries."
      - "Staff far from the top may feel distant from decisions."
    mistakes:
      - "Confusing levels of hierarchy (how tall) with span of control (how wide), which are linked but different."
      - "Assuming a tall structure must be centralized."
      - "Ignoring the cost of the extra managers."
    application:
      fictional: true
      business: Holloway Freight
      body: "A logistics firm has seven levels from the chief executive to its drivers. Safety rules are followed closely, but a driver's suggestion for a better route takes two months to reach anyone who can act on it."
    exam: "Read the organization chart in the case: count the levels and the spans, and link them to communication, control and cost. The guide asks which structure suits a change in external factors (AO3), so judge whether the tall structure still fits after the change described."
  - name: Flat (horizontal) structure
    syllabus:
      - code: '2.2'
        statement: 'Organization charts: flat or horizontal'
    terms: [flat-structure, span-of-control, delayering, delegation]
    level: SL/HL
    purpose: "To organize people through few levels of management, with each manager leading a larger team."
    structure: "Few levels of hierarchy, wide spans of control and a short chain of command; often reached by delayering, removing a level of management."
    context: "Smaller organizations, skilled staff who need little supervision, and businesses that must respond quickly, such as technology firms."
    strengths:
      - "Faster communication and decisions through a short chain of command."
      - "Lower management costs."
      - "Wider spans encourage delegation and can motivate staff."
    limitations:
      - "Managers with wide spans may be overloaded and supervise less closely."
      - "Fewer steps for promotion."
      - "Can confuse roles if responsibilities are not clear."
    mistakes:
      - "Assuming delayering always saves money: overloaded managers make costly mistakes."
      - "Recommending a flat structure for staff who need close supervision."
      - "Forgetting that a wider span needs managers who can delegate."
    application:
      fictional: true
      business: Holloway Freight
      body: "The firm removes two levels of regional management. Decisions speed up and costs fall, but depot managers now lead thirty people each, and complaints about missed training rise until team leaders are appointed."
    exam: "Explain the link between levels, spans and communication with the case's chart, and evaluate a change such as delayering with its costs and its effect on staff. A conditional judgement, saying what the flat structure needs to work, is stronger than a verdict."
difference: "A tall structure has many levels and narrow spans: close control and clear promotion steps, but slow communication and high cost. A flat structure has few levels and wide spans: fast communication and lower cost, but managers stretched and fewer steps up. Delayering moves an organization from tall towards flat."
choose:
  - when: "Work is high-risk and needs close supervision, or the organization is very large."
    use: 0
    why: "Narrow spans give the control and supervision the work needs."
  - when: "The business must respond quickly and its staff are skilled and need little supervision."
    use: 1
    why: "A short chain of command speeds decisions, and wide spans suit staff who work independently."
  - when: "Costs must fall and management layers have grown over time."
    use: 1
    why: "Delayering cuts management costs, if the remaining managers can cope with wider spans."
together: "The shape is one choice among several in 2.2: where decisions are made is another, covered in [centralized against decentralized structures](/frameworks/compare/centralized-vs-decentralized-structures/). The People and Culture room's [organization chart tool](/people-and-culture/organization-chart/) counts levels and spans for a chart you draw."

title: Porter's generic strategies against the Ansoff matrix
question: "How should the business compete, and where should it grow?"
summary: "Two strategy tools from the toolkit that answer different questions: Porter's is about the basis on which a business competes, Ansoff's about the direction in which it grows."
order: 8
sides:
  - name: Porter's generic strategies
    framework: porters-generic-strategies
    tool: porters-generic-strategies
    subtopics: ['1.3', '4.2']
    terms: [porters-generic-strategies, differentiation]
    level: HL
    purpose: "To choose, or test, how a business competes: on lower cost or on difference, across the market or in a niche."
    structure: "Two choices give the strategies: the source of advantage (lower cost or differentiation) and the scope (the whole market or a narrow segment), giving cost leadership, differentiation, cost focus and differentiation focus. Trying for all of them risks being stuck in the middle."
    context: "A business losing ground to rivals that are cheaper or better, or deciding how a new product will win customers in an existing market."
    strengths:
      - "Forces a clear choice of how to win, so that price, product and operations support one another."
      - "Explains the danger of being stuck in the middle."
      - "Links strategy to costs, branding and the marketing mix."
    limitations:
      - "Some businesses succeed with both low costs and differentiation."
      - "Says little about how to build the chosen advantage."
      - "The categories are broad, so placing a real business is a judgement."
    mistakes:
      - "Confusing a low price with low costs: cost leadership is about costs."
      - "Naming the strategy without evidence of the source of advantage."
      - "Treating focus as a strategy in itself, without saying whether it is on cost or on difference."
    application:
      fictional: true
      business: Brightmoor Coffee
      body: "A mid-priced coffee chain loses commuters to a cheaper rival and enthusiasts to a speciality one. Porter's framework names the problem (stuck in the middle) and the choice: its loyal following among enthusiasts points to differentiation focus."
    exam: "HL only, so it will not be needed in Paper 1, which leaves out HL-only material (guide, p. 43). Identify both the source of advantage and the scope with evidence from the case, distinguish low prices from low costs, and evaluate the risks of the chosen strategy."
  - name: The Ansoff matrix
    framework: ansoff-matrix
    tool: ansoff-matrix
    subtopics: ['1.5', '4.2']
    terms: [ansoff-matrix, market-penetration, product-development, market-development, diversification]
    level: SL/HL
    purpose: "To lay out the directions in which a business could grow, by product and market, with the usual risk of each."
    structure: "Products and markets, each existing or new, give market penetration, product development, market development and diversification."
    context: "A business choosing where to grow next: more of the same, new products, new markets or something new altogether."
    strengths:
      - "Sets out every direction of growth, with its relative risk."
      - "Simple enough to use early, before figures exist."
      - "Links to the evidence each route needs, such as market research."
    limitations:
      - "Says nothing about how the business will beat its rivals in the chosen direction."
      - "Silent on profit and cash."
      - "The line between existing and new is a judgement."
    mistakes:
      - "Using it to answer how to compete rather than where to grow."
      - "Confusing direction (market development) with method (franchising)."
      - "Treating the usual risk of a cell as certain."
    application:
      fictional: true
      business: Brightmoor Coffee
      body: "Once it has chosen differentiation focus, the chain asks where to grow: selling its beans to enthusiasts online (market development) or opening a tasting room (product development) for the customers it already has."
    exam: "Place the case's options in their cells, explain the risk of each in the business's own terms, and recommend a direction with evidence. At HL, pairing it with Porter shows how the business will compete once it gets there."
difference: "Porter answers how to compete in a market: by lower cost or by difference, broadly or in a niche. Ansoff answers where to grow: into new products, new markets or both. A business needs an answer to both, and the answers should agree: a differentiation focus strategy is rarely served by diversifying into a mass market."
choose:
  - when: "The business is losing customers to cheaper and to better rivals."
    use: 0
    why: "The question is how it competes, which Porter's strategies address."
  - when: "The business wants growth and has several directions open."
    use: 1
    why: "The question is where to grow, which the Ansoff matrix sets out."
  - when: "A new product launch into a crowded market."
    use: 0
    why: "Once the direction is chosen, the launch needs a clear basis for winning customers."
together: "Choose the competitive strategy with Porter, then the direction with Ansoff, and check that they fit: a cost leader grows best where its scale advantage travels, a focused differentiator where its niche customers are. Both have tools in the [Strategy Studio](/strategy-studio/)."

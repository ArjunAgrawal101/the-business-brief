title: Internal against external sources of finance
question: "Should the business pay for this from its own resources, or raise money from outside?"
summary: "Internal finance comes from within the business and costs no interest or ownership; external finance brings in more money, at a price in interest, control or both."
order: 4
sides:
  - name: Internal sources of finance
    syllabus:
      - code: '3.2'
        statement: 'Internal sources of finance'
    terms: [internal-sources-of-finance, personal-funds, retained-profit, sale-of-assets]
    level: SL/HL
    purpose: "To fund spending from money the business, or its owner, already has, without borrowing or selling a share."
    structure: "The guide names three: personal funds (for sole traders), retained profit, and the sale of assets."
    context: "A business with profits kept back or assets it no longer needs, funding a modest investment, or a sole trader starting small with savings."
    strengths:
      - "No interest to pay and nothing to repay."
      - "No loss of ownership or control to outsiders."
      - "Quick to arrange: no lender or investor to persuade."
    limitations:
      - "Limited to what the business already has, which may not be enough for a large investment."
      - "Retained profit used here cannot be paid to owners or kept as a cushion."
      - "Selling assets may weaken the business, and a quick sale may fetch a low price."
    mistakes:
      - "Treating retained profit as free: it has an opportunity cost, the return it could earn elsewhere."
      - "Confusing retained profit with cash: profit kept in the business may already be tied up in stock or equipment."
      - "Recommending the sale of assets the business still needs to operate."
    application:
      fictional: true
      business: Meadowgate Print
      body: "A printer replaces two older machines with one faster one. It funds the new machine from retained profit and the sale of the old machines, paying no interest; the cash cushion falls for a year, which the owners accept."
    exam: "Name the source precisely and apply it to the business's situation: has it enough profit or spare assets for this need? Weigh cost, control and how quickly the money is available, and link the choice to the size and the term of the need, which the guide asks you to judge."
  - name: External sources of finance
    syllabus:
      - code: '3.2'
        statement: 'External sources of finance'
    terms: [external-sources-of-finance, share-capital, loan-capital, overdraft, crowdfunding, leasing, business-angel]
    level: SL/HL
    purpose: "To raise money from outside the business when its own resources are not enough, or when keeping them is wiser."
    structure: "The guide names share capital, loan capital, overdrafts, trade credit, crowdfunding, leasing, microfinance providers and business angels; some are short term, others long term."
    context: "Larger investments, start-ups with little of their own money, rapid growth, or a temporary cash shortfall, matched to how long the money is needed."
    strengths:
      - "Can raise far more than the business could find internally."
      - "Lets the business keep its own reserves as a cushion."
      - "Some sources bring more than money, such as a business angel's advice."
    limitations:
      - "Loans and overdrafts carry interest and must be repaid, whatever happens to sales."
      - "Share capital and business angels dilute ownership and control."
      - "Lenders may want security and a trading record that a new business lacks."
    mistakes:
      - "Using short-term finance, such as an overdraft, for a long-term asset."
      - "Treating share capital as free because it carries no interest: owners expect a return."
      - "Listing every source rather than choosing the one that fits the business's situation."
    application:
      fictional: true
      business: Meadowgate Print
      body: "Two years later the printer wants a second site, costing far more than its reserves. It takes a five-year loan secured on its building, keeping full ownership; a slow first year would still have to meet the repayments, so the bank asks for a cash flow forecast."
    exam: "Match the source to the need: its size, how long the money is needed, the security the business can offer and how much control the owners will give up. Recommend one source and justify it against an alternative, using figures from the case where there are any."
difference: "The difference is where the money comes from, and so what it costs. Internal finance comes from within: it is cheap and keeps control, but is limited. External finance comes from outside: it can be large, but it costs interest, a share of ownership, or both, and may need security."
choose:
  - when: "A modest investment, and the business has retained profit or assets it no longer needs."
    use: 0
    why: "Internal finance avoids interest and keeps control, and the business can afford it."
  - when: "A large investment, such as a new site, far beyond the business's reserves."
    use: 1
    why: "Only external finance can raise enough; the choice is then between debt and equity."
  - when: "A start-up whose owner's savings cover only part of the costs."
    use: 1
    why: "Personal funds start the business, and an external source closes the gap."
together: "Most investments use both: a business puts in some of its own money, which reassures a lender, and borrows the rest. Use the Finance Desk's [cash flow lab](/finance-desk/cash-flow/) to see how a way of paying changes the cash position month by month."

title: Job, batch and flow production
question: "How should the business organize production for the volume and variety its customers want?"
summary: "Three operations methods along one line: from one-off products made to order, through groups of identical items, to a continuous line of standard products."
order: 5
sides:
  - name: Job production
    syllabus:
      - code: '5.2'
        statement: 'Job, batch and mass (flow) production'
    terms: [job-production]
    level: SL/HL
    purpose: "To make single, often unique products to each customer's order."
    structure: "Each product is made individually from start to finish, usually by skilled workers with general-purpose tools, to the customer's specification."
    context: "Custom or one-off products and services, low volumes, high prices: a made-to-measure suit, a bridge, a wedding cake."
    strengths:
      - "Meets each customer's exact needs, which can justify a premium price."
      - "Skilled, varied work tends to motivate staff."
      - "Little stock of finished goods: products are made to order."
    limitations:
      - "High cost per unit, with no economies of scale."
      - "Slow, and dependent on scarce skills."
      - "Hard to grow without losing what customers value."
    mistakes:
      - "Assuming job production means small businesses only: large projects, such as ships, are made this way."
      - "Ignoring the premium price when judging its high cost per unit."
      - "Recommending it for a product customers want cheaply and in volume."
    application:
      fictional: true
      business: Alderwick Furniture
      body: "A workshop makes dining tables to each customer's measurements and choice of wood. Each table takes a week and sells at a high price; customers wait, and value the result."
    exam: "Judge the method against the case's product, volume and customers: the guide asks you to evaluate which method fits (AO3). Use the cost per unit, flexibility and what customers will pay, and say what would change the answer, such as rising demand for standard designs."
  - name: Batch production
    syllabus:
      - code: '5.2'
        statement: 'Job, batch and mass (flow) production'
    terms: [batch-production]
    level: SL/HL
    purpose: "To make groups of identical products, one batch at a time, switching between products as demand requires."
    structure: "Each batch passes through each stage together before the next batch starts; equipment is reset between batches of different products."
    context: "Moderate volumes of several product types, such as a bakery's loaves and rolls or a clothing maker's sizes and colours."
    strengths:
      - "Lower cost per unit than job production, through repetition and some specialization."
      - "Flexible: the business can make several products with the same equipment."
      - "Can respond to changes in demand between batches."
    limitations:
      - "Idle time while equipment is reset between batches."
      - "Stock builds up between stages and as finished goods."
      - "Repetitive work can demotivate staff."
    mistakes:
      - "Describing it as small-scale flow production: the batch pauses between stages."
      - "Ignoring the cost of resetting equipment between batches."
      - "Forgetting the stock it creates, which ties up cash."
    application:
      fictional: true
      business: Alderwick Furniture
      body: "As orders grow, the workshop adds three standard table designs made in batches of twenty, using jigs that cut the time per table. The made-to-order service continues alongside, at its higher price."
    exam: "Explain why the case's volume and variety suit batches, and weigh the cost savings against the idle time and the stock. Compare with at least one other method named in the guide before recommending."
  - name: Flow production
    syllabus:
      - code: '5.2'
        statement: 'Job, batch and mass (flow) production'
    terms: [mass-production, mass-customization]
    level: SL/HL
    purpose: "To make large volumes of standard products continuously, with each unit moving straight from one stage to the next."
    structure: "A production line in which each stage performs one task; the guide calls it mass (flow) production. Heavy investment in specialized equipment and often automation."
    context: "High, steady demand for a standard product, such as soft drinks, cars or newspapers."
    strengths:
      - "The lowest cost per unit, through economies of scale."
      - "Consistent quality and high output."
      - "Automation can reduce labour costs."
    limitations:
      - "Heavy capital cost and inflexibility: the line is built for one product."
      - "A fault at one stage stops the whole line."
      - "Repetitive work can demotivate staff, and demand must stay high to keep the line busy."
    mistakes:
      - "Recommending it without evidence of high, steady demand."
      - "Ignoring the investment needed and the risk if demand falls."
      - "Forgetting mass customization, also in the guide, which tailors products at near flow costs."
    application:
      fictional: true
      business: Alderwick Furniture
      body: "Ten years on, a retailer offers a contract for 40,000 identical flat-pack desks a year. A flow line would cut the cost per desk sharply, but it would need a new factory and would suit no other product."
    exam: "Use the case's figures on volume and demand to test whether flow production is justified, and weigh the cost per unit against the investment and the loss of flexibility. The guide pairs these methods with mass customization, a useful point of evaluation."
difference: "The three methods sit on a line from variety to volume. Job production makes one-off items to order: flexible and costly. Batch production makes groups of identical items: cheaper, moderately flexible, with idle time and stock. Flow production makes standard items continuously: the lowest cost per unit, the least flexibility and the largest investment."
choose:
  - when: "Each customer wants something different and will pay for it."
    use: 0
    why: "Only job production meets individual specifications."
  - when: "Several products in moderate volumes, with demand that changes from week to week."
    use: 1
    why: "Batches give some economies of scale while keeping the flexibility to switch."
  - when: "One standard product with high, steady demand."
    use: 2
    why: "Flow production gives the lowest cost per unit, and the volume keeps the line busy."
together: "Many businesses combine them: a furniture maker might batch its standard ranges and keep a made-to-order service, while mass customization lets a flow line tailor each product. The Operations Floor's [production methods tool](/operations-floor/production-methods/) sets the methods against volume and variety."

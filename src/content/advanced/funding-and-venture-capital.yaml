    note: The evidence that staging and monitoring are how venture investors manage information problems.
  - source: adv-oe-kaplan-stromberg-2003
    note: How real venture contracts allocate cash flow and control rights, contingent on performance.
  - source: adv-oe-harris-2014
    note: A careful review of the evidence on private equity and venture returns relative to public markets.
  - source: adv-oe-hellmann-puri-2002
    note: Evidence that venture capital professionalizes start-ups, including founder replacement.
  - source: adv-oe-wasserman-2012
    note: The founder's dilemmas, including the trade-off between wealth and control, from a large dataset of start-ups.
  - source: adv-oe-metrick-yasuda-2010
    note: The economics of venture funds, term sheets and valuation, at MBA level.

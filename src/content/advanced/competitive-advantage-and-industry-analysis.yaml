domain: strategy
title: Competitive advantage and industry analysis
order: 1
dek: Why do some industries earn far more than others, why do some firms beat their rivals in the same industry, and how long can either advantage last?
audience: [undergraduate, mba, professional]
covers: [Competitive strategy, Competitive advantage, Industry analysis]
minutes: 30
updated: '2026-11-16'

bridge:
  codes: ['1.1', '1.3', '4.2']
  text: |
    The IB course supplies the vocabulary: SWOT, STEEPLE and Porter's generic strategies from the toolkit, and strategic objectives in 1.3, with the generic strategies treated as a menu of choices. This module asks what the course leaves open: what makes an industry profitable, how a firm creates more value than its rivals and how much of it the firm keeps, and why advantages fade. It adds value-based strategy, the resource-based view, the evidence on industry and firm effects, and a way to value an advantage that decays.

foundation: |
  Strategy for a single business answers two questions: where to compete, and how to win there. They correspond to two traditions. The **positioning** school, built on industrial economics, starts outside the firm and asks how industry structure divides value among firms, customers, suppliers and would-be entrants. The **resource-based** school starts inside and asks which assets and capabilities let one firm do what its rivals cannot.

  **Competitive advantage** means creating more economic value than rivals: a wider gap between what customers will pay and what the resources cost. If customers would pay up to €100 for Firm A's product, which costs €70, and up to €90 for Firm B's, which costs €72, A creates €30 of value a unit and B €18. A's €12 advantage could come from higher willingness to pay, lower cost or both. Whether it becomes profit depends on how hard customers bargain, what suppliers and employees demand, and how quickly rivals copy.

  Performance is measured against the **cost of capital**, not against zero: a business earning 7% on its capital when investors require 9% destroys value while reporting a profit. Returns above the cost of capital are *rents*, and competition erodes them by default. A lasting advantage is the exception that needs explaining.

advanced:
  - id: industry-structure-and-profit
    title: Industry structure and the division of value
    body: |
      Industries differ in profitability year after year, and Porter's five forces explain the differences as bargaining over the value an industry creates. The threat of entry caps prices at the level that would attract newcomers; buyers and suppliers claim what their power allows; substitutes set a ceiling on price; and rivalry decides how much of the rest firms give away to each other.

      Each force has economic roots. Entry is deterred by **scale economies**, **network effects**, **switching costs**, capital requirements, access to distribution and regulation. Buyers are powerful when they are concentrated, when the product is standard and when it is a large share of their own costs. Rivalry is fiercest when competitors are similar, growth is slow, fixed costs are high and exit is costly.

      High fixed costs explain why industries with real demand can earn little. Two carriers each fly 200 seats a day on a route. The average cost per seat is €80, but filling a seat that would otherwise fly empty costs €15. If each expects 150 passengers at €95, either gains by cutting the price for the marginal passenger, the other matches, and fares can settle far below €80. The structure, not the managers, produces the losses.

      Two refinements matter. The forces are weighed, not counted: one dominant buyer can outweigh four benign forces. And other firms are not only rivals, because **complementors** enlarge the value available to divide. Brandenburger and Nalebuff (1996) made complementors a player in their own right; Porter (2008) treats complements as a factor that shifts the five forces.

  - id: value-created-and-captured
    title: Value created, value captured
    body: |
      Value-based strategy, formalized by Brandenburger and Stuart (1996), views the same bargaining from one firm's position. Value created is the customer's **willingness to pay** minus the **supplier's opportunity cost**, and price divides it between customer and firm. A firm's **added value** is the value created with it minus the value created without it, and in a competitive market no player can capture more than its added value.

      A hospital values Supplier A's imaging system at €120,000 and Supplier B's at €105,000; A's cost is €70,000 and B's €75,000. With A, the best deal creates €50,000 of value; without A, B creates €30,000. A's added value is €20,000, the most margin it can secure from an informed buyer who can always turn to B. B's added value is zero, and B can win profitable business only by widening its own wedge beyond A's.

      Three implications follow. Raising willingness to pay and cutting cost are two ways of widening one wedge, so **cost leadership** and **differentiation** are positions on two axes rather than labels. What counts is the wedge relative to rivals'. And a firm can give its added value away by pricing to win share.

      The framework also qualifies Porter's warning about being **stuck in the middle**. Where activities conflict, pursuing low cost and differentiation together buys neither. Where technology or management removes the trade-off, as lean manufacturing did for quality and cost, a firm outside both corners can still have the widest wedge in its industry.

  - id: resources-and-imitation
    title: Resources, capabilities and why advantage is hard to copy
    body: |
      Positioning explains which positions are attractive, not why every firm does not occupy them. The resource-based view answers that firms differ in resources and capabilities, and that some differences persist. Barney (1991) set the conditions for sustained advantage: a resource must be **valuable**, **rare**, **costly to imitate** and without equivalent substitutes. He later added that the firm must be **organized** to exploit it.

      Four mechanisms slow imitation. **Path dependence**: Dierickx and Cool (1989) showed that stocks such as reputation grow through flows of investment over time, and diseconomies of time compression stop a rival buying ten years of accumulation in two. **Causal ambiguity**: rivals cannot copy what even the firm cannot pin down. **Social complexity**: culture and trust do not move when a few people are hired away. **Legal protection**: patents forbid imitation, but only for a fixed period.

      Two cautions apply. An advantage may not show up as profit, because whoever controls a scarce resource can bargain for its rents; Coff (1999) argued that skilled employees often capture much of the surplus through pay. And the logic can turn circular: Priem and Butler (2001) noted that defining a valuable resource as one that produces advantage explains nothing. The remedy is to name the mechanism: which customer pays more, or which cost falls, and why a well-funded rival could not do the same. In fast-moving markets, Teece, Pisano and Shuen (1997) argued, the **dynamic capability** to renew resources matters more than any stock of them.

  - id: how-long-advantage-lasts
    title: How long an advantage lasts, and what it is worth
    body: |
      Excess returns fade as entry, imitation and buyer learning do their work; the question is how fast. Wiggins and Ruefli (2005) found periods of superior performance becoming shorter across many industries, while McNamara, Vaaler and Devers (2003) found little sign of such a trend.

      The rate of fade drives value. A business with €1,000 million of capital, earning 19% against a 9% cost of capital, makes €100 million of economic profit a year. If that lasted for ever it would be worth €100 million divided by 9%, about €1,111 million. If the spread shrinks by 30% a year it is worth €100 million divided by (9% + 30%), about €256 million; at a 10% fade it is worth about €526 million. Durability deserves as much analysis as size.

      **First movers** can gain durability through learning and patents, pre-emption of scarce assets and buyers' switching costs, but followers can free-ride on the pioneer's market-building and wait for uncertainty to resolve (Lieberman and Montgomery, 1988).

      Where **experience curves** are steep, the incumbents' head start is itself the barrier. If unit cost falls 20% with each doubling of cumulative output, an incumbent with 64 times an entrant's volume has passed through six more doublings, and its cost is 0.8 to the power of 6, about 26%, of the entrant's. The entrant must sell below its own cost for years, with investors' money, and closes the gap only as fast as its volume doubles.

models:
  - name: Five forces
    origin: Porter (1980)
    summary: |
      Five forces (entry, buyer power, supplier power, substitutes and rivalry) decide how much of the value an industry creates its firms can keep. They explain why some industries earn high returns for decades while others struggle to cover their cost of capital.
    use: |
      Define the industry by what customers treat as substitutes, by product and by geography. For each force, identify the structural causes and the evidence for them. Then weigh rather than count: find the one or two forces that most limit profit, and ask how they will change. Turn the result into choices: where to position, which force to reshape, or whether to stay out.
    limits: |
      It describes the average firm, so it cannot explain differences within an industry, which the evidence suggests are larger. It underplays complementors and platforms, it is static unless the analyst makes it dynamic, and its ratings depend on how the industry is defined.
    framework: five-forces
    tool: /strategy-studio/five-forces/
    sources: [porter-1980, adv-strat-porter-2008]
  - name: Value-based strategy and added value
    origin: Brandenburger and Stuart (1996)
    summary: |
      Value created is willingness to pay minus suppliers' opportunity cost. A firm's added value is the value created with it minus the value created without it, and in a competitive market no firm can capture more than its added value.
    use: |
      Estimate willingness to pay and cost for your offer and for the customer's next-best alternative. The difference between the two wedges is your added value. Judge each proposal by whether it widens that difference, and test prices against it: a price above your added value invites switching, and one far below it gives value away.
    limits: |
      Willingness to pay is hard to observe and varies across customers, so the model works with segments and ranges, not point estimates. It sets the limits of bargaining but not the outcome within them, and it can make strategy look like arithmetic.
    sources: [adv-strat-brandenburger-stuart-1996]
  - name: Generic strategies, the value chain and fit
    origin: Porter (1985)
    summary: |
      Advantage comes from lower cost or from differentiation that raises willingness to pay, across a broad market or a focused segment. The value chain traces each source to activities, and Porter (1996) argued that durable advantage lies in a system of activities that fit and reinforce one another.
    use: |
      Map and cost the activities, ask which ones customers pay for, and compare them with rivals' configurations. Then test fit: would a rival have to change many activities at once to match you? If no activity was ever refused for conflicting with the strategy, there is probably no strategy. The [value chain](/frameworks/value-chain/) framework sets out the activities.
    limits: |
      The categories are coarse, and many winners combine low cost and differentiation. The value chain suits manufacturing better than platforms and services, where value is created between firms. A tightly fitted system is hard to copy, and also hard to change when markets shift.
    framework: porters-generic-strategies
    tool: /strategy-studio/generic-strategies/
    sources: [porter-1985, porter-1996]
  - name: VRIO
    origin: Barney (1991)
    summary: |
      A resource yields sustained advantage if it is valuable, rare, costly to imitate and exploited by an organization set up to use it. Valuable but common resources give only parity; valuable resources that are easily copied give a temporary edge.
    use: |
      List resources specifically ("forty years of field failure data", not "know-how") and ask the four questions in order, stopping at the first no. For imitation, name the mechanism and estimate how long a well-funded rival would need. For organization, check that structure, incentives and systems let the firm use the resource.
    limits: |
      Applied after the event it turns circular, because success makes resources look valuable. It says little about how to acquire resources for less than they are worth or how employees and partners capture their rents, and it is largely static.
    sources: [adv-strat-barney-1991, adv-strat-barney-1995]

applications:
  - title: 'Novo Nordisk: how quickly a lead in obesity medicine is contested'
    kind: real
    asOf: '2026-08'
    body: |
      **What the company reported.** For 2025 Novo Nordisk reported net sales of DKK 309.1 billion, up 10% at constant exchange rates, and operating profit of DKK 127.7 billion: a margin of about 41.3%, against about 44.2% in 2024. Obesity care sales grew 31% at constant exchange rates. In September 2025 it announced plans to remove about 9,000 of 78,400 positions, saying the obesity market had become more competitive and consumer-driven. In February 2026 it guided to adjusted sales growth of minus 5% to minus 13% at constant exchange rates for 2026, citing lower realized prices (including a Most Favoured Nations agreement with the US administration), the loss of exclusivity for semaglutide in certain markets and intensifying competition. In August 2026 it raised the range to between 0% and minus 6%.

      **What it suggests.** A margin above 40% signals a powerful advantage. The company's own explanations of the slowdown map onto three of the five forces: rivalry that it calls intensifying, buyer power exercised by a government, and entry by copies where patent protection lapses. The advantage was real but time-limited. The responses the company describes, a tablet form of Wegovy launched in January 2026, a self-pay channel and a leaner organization, are attempts to rebuild added value rather than defend the old position.
    sources: [adv-strat-novo-fy2025, adv-strat-novo-restructuring-2025, adv-strat-novo-outlook-2026, adv-strat-novo-q2-2026]
  - title: 'Northvolt: entering an industry where experience is the barrier'
    kind: real
    asOf: '2025-08'
    body: |
      **What the company reported.** Northvolt AB and four Swedish subsidiaries filed for bankruptcy on 12 March 2025, after a restructuring attempt that included a Chapter 11 process in the United States. The board cited rising capital costs, geopolitical instability, supply chain disruption, shifts in demand and significant internal challenges in ramping up production. Its interim chairman said cell output had doubled, and production yield had improved by 50%, since September 2024. An expansion of the Skellefteå plant had been suspended in September 2024; in August 2025 Lyten agreed to buy the remaining Swedish and German assets.

      **What it suggests.** The statements describe a firm still climbing the learning curve when its money ran out. The cost of a usable cell depends heavily on yield. With illustrative figures that are not Northvolt's, if a started cell costs €10 and half pass inspection, each good cell costs €20; at an 85% pass rate it costs about €11.80. Experienced producers start far down that curve, so an entrant sells at a loss while it learns and needs patient capital, which rising capital costs cut short. Where experience effects are steep, the barrier to entry is time and cumulative volume as much as technology.
    sources: [adv-oe-northvolt-bankruptcy-2025, adv-strat-northvolt-2024, adv-oe-northvolt-lyten-2025]
  - title: 'Illustrative: a console maker that loses money on every machine'
    kind: illustrative
    body: |
      The firm and figures are invented. A games console costs €450 to build and sells for €400. Each buyer purchases eight games over the console's life, and the maker charges studios a €10 licence fee on each copy, so it earns €30 a buyer across the system. Analysed alone, consoles look like a loss-making industry; analysed as a system, the maker captures value through its control of the complement. Its weak point follows from the same logic: if studios could reach players without the console, the licence fee and the maker's added value would shrink together.

cases:
  - title: Arden Valve Systems and the low-cost entrant
    fictional: true
    situation: |
      Arden Valve Systems, a fictional European manufacturer, has three lines of business: standard valves sold through distributors to building contractors, engineered valves certified for each customer's plant, and service contracts on its installed base. A new entrant backed by a large industrial group sells standard valves at €72, against Arden's €85; Arden estimates the entrant's unit cost at €60, from one highly automated plant.

      Contractors buy standard valves from catalogues and can switch at their next order. Engineered valves need a nine-month qualification at each plant, after which customers rarely switch. Arden's service engineers hold records of every valve failure across forty years of installations and use them to predict maintenance needs.

      Unit costs in the exhibit include fixed overhead allocated at current volumes: €18 per standard valve, €160 per engineered valve and €1,900 per service contract.
    exhibit:
      caption: 'Arden Valve Systems: results by line of business, last financial year'
      columns: ['Line of business', 'Volume a year', 'Average price (€)', 'Unit cost (€)', 'Revenue (€m)', 'Margin (€m)']
      rows:
        - ['Standard valves', '120,000', '85', '68', '10.20', '2.04']
        - ['Engineered valves', '18,000', '640', '410', '11.52', '4.14']
        - ['Service contracts', '600', '9,000', '5,400', '5.40', '2.16']
        - ['All lines', '', '', '', '27.12', '8.34']
      note: Simulated data. Margin is revenue minus volume times unit cost, before central costs.
    questions:
      - Which line earns the highest margin on its revenue, and which of the five forces explain the differences between the three lines?
      - Fixed overhead on standard valves is €2.16 million a year. Compare the profit on standard valves if Arden matches €72 and keeps its volume with the profit if it holds €85 and loses 40% of its volume. What does the comparison say about price wars where fixed costs are high?
      - Apply VRIO to the failure records. Are they a source of sustained advantage, and what would Arden need to change to exploit them?
      - Using the value-based view, recommend a position for each line. Where can Arden widen its added value, and where should it stop trying?

evaluation: |
  **Industry or firm?** Rumelt (1991) found that stable differences between business units explained several times more of the variance in American business-unit returns than differences between industries. McGahan and Porter (1997), with a broader sample that included services, found that industry explained roughly a fifth of the variance against roughly a third for business-specific effects, with the balance varying by sector. These findings are established research. The inference that managers should therefore look inside the firm is interpretation: a large firm effect is also consistent with luck, with niches hidden inside broad industry codes, and with differences in accounting.

  **Positioning or resources?** The debate is softer than textbooks suggest. Positions take resources to occupy, and resources are valuable only relative to a position in a market. Durable advantage usually combines an attractive position with resources that stop others taking it.

  **Is the resource-based view testable?** Only when resources are measured in advance, such as patents or brand investment. Inferring them from performance is circular, as Priem and Butler (2001) warned.

  **How durable is advantage?** That excess returns fade is established; whether they fade faster than they used to is contested. Either way, plans that assume permanence overvalue an advantage. This module's real cases show two ways an advantage ends: through rivals, buyers and expiring patents, and through learning costs that an entrant cannot finance.

  **What the frameworks miss.** Both traditions treat firms as profit-seekers in markets. They say little about governments as buyers and regulators, about the institutions that enforce contracts and patents, or about whether rents are seen as legitimate. An advantage that depends on political tolerance of high prices is exposed to forces that neither framework models.

decision:
  title: 'Halden Instruments: fight a cheaper rival or move away from it?'
  fictional: true
  brief: |
    Halden Instruments, a fictional maker of laboratory pipettes, has revenue of €240 million and a 16% operating margin; manual pipettes sold through distributors are 55% of revenue. An entrant sells comparable pipettes 25% cheaper and is winning university tenders, which are decided on price. Halden still leads in pharmaceutical quality-control laboratories, where auditors accept its calibration records and switching supplier means revalidating procedures. It also has a prototype of a compact automated system for small laboratories. The board has €40 million to invest over three years.
  options:
    - label: Defend on cost
      text: Spend €25 million on automation and a lower-cost plant to cut the cost of manual pipettes by 20%, and match the entrant in tenders. This keeps scale, but margins fall for two years and the entrant may cut again.
    - label: Focus on regulated laboratories
      text: Leave price-led tenders and sell bundles of instruments, calibration, audit documentation and service to pharmaceutical and clinical laboratories, investing €15 million. Revenue falls by about a fifth; margins and customer lock-in rise.
    - label: Move into automation
      text: Invest €35 million to launch the automated system, with pharmaceutical customers as early adopters, and let manual pipettes decline. This has the highest growth potential and the highest risk.
    - label: Partner with the entrant
      text: Have the entrant make Halden-branded basic pipettes cheaply while Halden concentrates on calibration, service and regulated customers. This turns a rival into a supplier, but may teach it Halden's customer relationships.
  criteria:
    - Change in Halden's added value relative to rivals
    - Durability of the resulting advantage (the VRIO tests)
    - Cash required, and the downside if the bet fails
    - Fit with existing capabilities and customer relationships
    - Likely responses of the entrant and of larger automation firms
  guidance: |
    Locate Halden's added value first. In university tenders it has almost none, so defending on cost fights where Halden is structurally weaker; it is justified only if the programme brings Halden close to the entrant's cost and the volume is needed to cover fixed costs. In regulated laboratories, calibration records and customers' revalidation costs pass the VRIO tests, so focus builds on Halden's one durable advantage, at the price of shrinking and losing purchasing scale.

    Automation is the strongest bet on future added value and the weakest on evidence; it should be funded in stages against early orders rather than in one decision. Partnering looks like surrender, but it accepts a cost gap Halden cannot close and captures part of it. The risk is that the entrant learns the customer relationships and no longer needs Halden.

    Combinations, such as focus with a staged automation programme funded by the cash a smaller manual business releases, are probably sensible. Whatever the choice, the board should name the evidence that would change it: tender win rates, any move by the entrant into regulated laboratories, and early orders for the automated system.

reading:
  - source: porter-1980
    note: The original and fullest treatment of industry and competitor analysis. Read the chapters on the structural analysis of industries and on generic strategies.
  - source: adv-strat-porter-2008
    note: A short restatement of the five forces, with Porter's own list of common mistakes in applying them, such as counting the forces instead of weighing them.
  - source: adv-strat-barney-1991
    note: The founding statement of the resource-based view. Read it for the logic of why differences between firms can persist.
  - source: adv-strat-rumelt-1991
    note: Read with McGahan and Porter (1997). Together they are the central empirical debate on whether industry or firm matters more.
  - source: adv-strat-mcgahan-porter-1997
    note: The reply to Rumelt, with a broader sample and a larger industry effect that varies by sector.
  - source: adv-strat-brandenburger-stuart-1996
    note: A short, rigorous definition of value creation and capture, the basis of the value-based view used in this module.
  - source: adv-strat-teece-pisano-shuen-1997
    note: Dynamic capabilities, and the argument that in changing markets the capacity to renew resources matters more than any stock of them.

basis:
  - source: adv-strat-wernerfelt-1984
    note: The origin of the term resource-based view.
  - source: adv-strat-dierickx-cool-1989
    note: Asset stocks, flows and time compression diseconomies.
  - source: adv-strat-coff-1999
    note: The appropriation of rents by employees and other stakeholders.
  - source: adv-strat-priem-butler-2001
    note: The tautology critique of the resource-based view.
  - source: adv-strat-wiggins-ruefli-2005
    note: Evidence that periods of superior performance have become shorter.
  - source: adv-strat-mcnamara-vaaler-devers-2003
    note: Evidence against a general rise in hypercompetition.
  - source: adv-strat-lieberman-montgomery-1988
    note: First-mover advantages and disadvantages.
  - source: adv-strat-brandenburger-nalebuff-1996
    note: Complementors and the value net.

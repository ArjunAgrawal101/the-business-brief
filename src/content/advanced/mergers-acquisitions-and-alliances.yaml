domain: strategy
title: Mergers, acquisitions and strategic alliances
order: 3
dek: When should a firm buy another, ally with it or build the capability itself, and why do so many acquisitions disappoint the buyer?
audience: [undergraduate, mba, professional]
covers: [Mergers and acquisitions, Strategic alliances]
minutes: 30
updated: '2026-11-16'

bridge:
  codes: ['1.5', '2.5', '3.8']
  text: |
    In 1.5 the IB course lists the external growth methods (mergers and acquisitions, takeovers, joint ventures, strategic alliances and franchising) and asks for their advantages and disadvantages; 2.5 adds cultural clashes when organisations merge, and 3.8 supplies investment appraisal. This module goes further: it prices a deal, explains why bidders overpay, sets out the evidence on who gains, compares integration approaches and the governance of alliances, and shows how regulators and governments reshape transactions.

foundation: |
  An acquisition creates value for the buyer's shareholders only if what the combination adds exceeds what the buyer pays above the target's stand-alone value. The buyer's gain is the **synergy** (the value of the combined firm minus the two firms' values apart) minus the **premium** paid over the target's market value, minus transaction and integration costs. The target's shareholders collect the premium on the day the deal closes; the buyer collects the synergies, if they arrive, over years.

  That asymmetry explains much of the evidence. Target shareholders gain substantially and reliably; acquirers' shareholders gain little or nothing on average, with wide variation; and the combined effect is small and positive. Acquisitions are not doomed, but the buyer carries the risk and pays in advance.

  An **alliance** obtains some of what an acquisition offers without buying the whole firm: a joint venture, a licence, a long-term technology or supply partnership, or a minority stake. Alliances avoid the premium and preserve flexibility, at the cost of shared control, the risk that a partner learns faster, and contracts that cannot anticipate everything. Choosing between building a capability, borrowing it through an alliance and buying it is one of the central decisions of corporate strategy.

advanced:
  - id: the-arithmetic-of-a-deal
    title: The arithmetic of a deal
    body: |
      Suppose a target's shares were worth €1,000 million before any rumour of a bid, and the buyer pays a 30% premium, €1,300 million in all. Cost synergies of €40 million a year after tax are expected from year three onwards, integration will cost €60 million after tax in year one, fees are €15 million, and the buyer's cost of capital is 9%. Valued as a perpetuity from year three, the synergies are worth €40 million divided by 9%, about €444 million at the end of year two, or €374 million today. After integration costs (about €55 million today) and fees, the net synergy is about €304 million, barely above the €300 million premium. A one-year delay in the synergies cuts their value to about €343 million and turns the deal negative.

      Two lessons follow. The premium is a promise of performance: Sirower (1997) described it as a commitment to deliver improvements beyond those already priced into the target, on a timetable investors can check. And the method of payment allocates risk. Paying cash leaves the buyer's shareholders with all the synergy risk; paying in shares hands part of it to the target's shareholders, which is why a buyer confident of its synergies prefers cash and one that believes its own shares are overvalued prefers stock.

  - id: why-buyers-overpay
    title: Why buyers overpay
    body: |
      Four mechanisms push prices above value. The **winner's curse**: when several bidders estimate an uncertain value, the highest bid tends to come from the most optimistic estimate, so the winner overpays on average even if every bidder is unbiased (Thaler, 1988). **Hubris**: Roll (1986) argued that managers trust their own valuation over the market's. **Agency**: Jensen (1986) argued that managers of cash-rich firms prefer growth to payouts, so some deals serve executives' interest in size. **Escalation**: once a bid is public, walking away feels like defeat.

      The evidence fits these mechanisms without proving any one of them. Andrade, Mitchell and Stafford (2001) found that in American mergers from 1973 to 1998 targets gained substantially, acquirers' returns were small and slightly negative, and the combined effect was small and positive. Moeller, Schlingemann and Stulz (2005) found that a small number of very large deals between 1998 and 2001 accounted for most of the value acquirers lost. Fuller, Netter and Stegemoller (2002) found that buyers of private firms and subsidiaries did better than buyers of listed companies, plausibly because illiquid sellers accept lower prices. A meta-analysis by King and colleagues (2004) concluded that acquisitions on average do not improve acquirers' performance and that the usual explanations do not account for which ones do.

  - id: integration
    title: 'Integration: where value is made or lost'
    body: |
      Synergies are delivered after the deal, by people who did not negotiate it. Haspeslagh and Jemison (1991) argued that the integration approach should follow two needs: the **strategic interdependence** required to create value (shared sales forces, merged plants, transferred technology) and the **organisational autonomy** required to preserve what made the target valuable. High interdependence with low autonomy calls for **absorption**; low interdependence with high autonomy for **preservation**; high on both for **symbiosis**, the hardest to manage; low on both for a holding arrangement.

      The dilemma is sharpest in technology acquisitions. Puranam, Singh and Zollo (2006) found that structural integration helps coordinate the target's innovations with the buyer's but disrupts the target's capacity to innovate, especially when its products are at an early stage. Integrating too fast can destroy the capability that justified the price; integrating too slowly leaves the synergies unrealised.

      Culture is often blamed loosely. The useful questions are specific: which routines must change, such as pricing approval, sales incentives or engineering standards, who will lose status or autonomy, and how fast. Integrating information systems deserves particular caution, because the systems are tightly coupled and usually on the critical path to the cost synergies; a migration timetable set to meet a synergy promise can become a source of failure in its own right.

  - id: alliances-and-governance
    title: Alliances and their governance
    body: |
      Transaction cost economics (Williamson, 1975) explains why some exchanges run through markets, some within firms and some through hybrids. When assets are specific to a relationship, such as a plant built around one customer's needs, the party that invested is exposed to **hold-up**, and governance must protect it through longer contracts, exclusivity, equity stakes or ownership. Alliances are hybrids, chosen when ownership would be too costly or rigid and arm's-length contracts too exposed.

      Dyer and Singh (1998) argued that alliances can earn **relational rents**, value neither partner could create alone, from relation-specific assets, knowledge sharing, complementary resources and effective governance. Hamel (1991) showed the competitive side: in **learning races**, the partner that learns faster can extract the other's skills and leave. Kogut (1991) treated joint ventures as **options**: a minority stake buys the right, not the obligation, to take control later, which is valuable when uncertainty is high.

      A few clauses allocate most of the risk: exclusivity, minimum volumes or capacity fees, compensation for early termination, rights over jointly developed intellectual property, and exit. An alliance with broad exclusivity and weak termination terms concentrates a provider's fortunes in one partner's decisions; one with no commitments protects neither side.

models:
  - name: Synergy, premium and the buyer's gain
    origin: Sirower (1997)
    summary: |
      The buyer's gain equals the present value of synergies, net of integration costs, minus the premium over the target's stand-alone value and the costs of the deal. The premium is therefore a promise of improvements beyond those already priced into the target.
    use: |
      Value the target alone, then value each synergy separately (cost, revenue and financial), each with its timing, probability and cost to achieve. Work out the improvement the premium requires, year by year, and compare it with what comparable deals have delivered. Test the result for a one-year delay and for revenue synergies of zero, which is how they often turn out.
    limits: |
      Synergy estimates are made by people who want the deal, and the most valuable sources, such as new capabilities or growth options, are the hardest to value. The arithmetic shows when a price is too high, not whether integration will deliver.
    sources: [adv-strat-sirower-1997]
  - name: Integration approaches
    origin: Haspeslagh and Jemison (1991)
    summary: |
      The right integration depends on two needs: strategic interdependence, to create the expected value, and organisational autonomy, to preserve what made the target valuable. Their combinations give four approaches: absorption, preservation, symbiosis and holding.
    use: |
      List the sources of value in the deal and, for each, the capabilities to be transferred and those to be protected. Place the deal in the matrix, then plan function by function, since some parts of a target can be absorbed while others are preserved. Agree the approach before closing, and tell the target's people what will and will not change.
    limits: |
      The matrix is static, while the right degree of integration often changes as a target matures. It says little about how to manage symbiosis, the hardest case, or about information systems, where integration is often forced by the cost synergies promised.
    sources: [adv-strat-haspeslagh-jemison-1991, adv-strat-puranam-singh-zollo-2006]
  - name: Build, borrow or buy
    origin: Capron and Mitchell (2012)
    summary: |
      Firms obtain new resources by building them internally, borrowing them through contracts and alliances, or buying them through acquisition. The right path depends on how close the resources are to existing capabilities, how well they can be specified in a contract, and how much integration they need.
    use: |
      Ask three questions in order. Are the resources close enough to existing knowledge and organisation to build in the time available? If not, can they be obtained by contract or alliance from a partner whose goals fit and whose contribution can be specified? Only if both answers are no, and integration is feasible, is acquisition the right path. Compare the paths with weighted criteria in the option appraisal tool.
    limits: |
      The sequence treats building as usually cheapest and buying as a last resort, which may not hold when speed decides a market or when one target holds the only source of a resource. It gives less guidance on combining paths, which many firms do.
    tool: /strategy-studio/option-appraisal/
    sources: [capron-mitchell-2012]
  - name: Decision trees for deals under approval risk
    origin: Raiffa (1968)
    summary: |
      A decision tree sets out the choices, the uncertain events that follow and their probabilities, and rolls the values back to the decision. In a deal, the uncertain events include regulatory and political approval, the conditions attached to it and rival bids.
    use: |
      Map the decision (bid, wait, ally or walk away), then each uncertainty in sequence, with probabilities and values. A deal worth €400 million of net synergy with a 70% chance of clearance, where failure costs €60 million in fees and a break fee, has an expected value of 0.7 × 400 minus 0.3 × 60, or €262 million. Compare it with the alternatives, and find how far each probability can move before the decision changes.
    limits: |
      Probabilities of regulatory or political outcomes are judgements, often anchored on the parties' own optimism. Trees capture discrete events well and continuous risks poorly, and they omit the cost of long uncertainty for staff, customers and management attention.
    framework: decision-trees
    tool: /strategy-studio/decision-tree/
    sources: [adv-strat-raiffa-1968]

applications:
  - title: 'Nippon Steel and U.S. Steel: a premium, a block and a golden share'
    kind: real
    asOf: '2025-06'
    body: |
      **What the companies reported.** On 18 December 2023 Nippon Steel agreed to buy U.S. Steel for $55 a share in cash, a 40% premium to the closing price of $39.33 on 15 December, as part of a strategy of buying integrated mills rather than building them, towards 100 million tonnes of global capacity. On 3 January 2025 the US President blocked the deal on national-security grounds; the companies called the decision political and sued. In June 2025 a presidential order under the new administration allowed it, and it closed on 18 June 2025 under a National Security Agreement: a golden share gives the US government the right to appoint one director and to consent to matters including the headquarters, closures and any reduction in committed investment, and Nippon Steel committed about $11 billion of new investment by 2028. Its briefing put the total price at $14.189 billion, about $600 a tonne of crude steel capacity, against about $900 to $2,000 a tonne for the greenfield projects it cited.

      **What it suggests.** With about 258 million shares, the premium was roughly $4 billion, justified as the cost of buying capacity more cheaply than building it. The approval conditions are part of the price: they commit capital and constrain decisions that an owner would normally control, so the deal's value depends on how much flexibility the investment plan will need.
    sources: [adv-strat-nsc-2023, adv-strat-nsc-block-2025, adv-strat-nsc-closing-2025, adv-strat-nsc-briefing-2025]
  - title: 'Canal+ and MultiChoice: a takeover shaped at every stage by regulation'
    kind: real
    asOf: '2025-12'
    body: |
      **What the companies reported.** In February 2024 South Africa's Takeover Regulation Panel ruled that Canal+, having acquired 35% of MultiChoice, must offer for the remaining shares. Canal+ offered ZAR 125 a share in cash, against a regulatory minimum of about ZAR 105. The Competition Tribunal approved the offer in July 2025, subject to public-interest commitments supporting local content and businesses controlled by historically disadvantaged persons, and to a reorganisation required by limits on foreign control of broadcasting licences: the company that contracts with South African subscribers was carved out, and MultiChoice kept 49% of its economic interest but 20% of the votes. The offer closed in October 2025 with acceptances for about 92.5% of the shares sought, taking Canal+ to about 94.4%; it then acquired the remainder compulsorily, MultiChoice was delisted on 10 December 2025, and Canal+ committed to a secondary listing in Johannesburg.

      **What it suggests.** Regulation shaped every stage: a takeover rule forced the bid, a competition authority set conditions that went beyond competition, and a licensing law split economic ownership from control. A buyer modelling such a deal must value an asset it will own but not fully control.
    sources: [adv-strat-canal-offer-2024, adv-strat-canal-tribunal-2025, adv-strat-mcg-reorganisation-2025, adv-strat-canal-results-2025, adv-strat-mcg-delisting-2025]
  - title: 'Ocado and Kroger: an alliance renegotiated'
    kind: real
    asOf: '2026-01'
    body: |
      **What the company reported.** Ocado supplies automated fulfilment technology to grocers, who operate customer fulfilment centres equipped with it and pay Ocado fees. In November 2025 Ocado reported that Kroger, its US partner, would close three of its centres in January 2026, leaving five live. In December the two agreed a one-off payment of $350 million to Ocado, principally in lieu of future capacity fees, covering those closures and Kroger's decision not to proceed with a planned centre in Charlotte; Ocado said the closures would cut its fee revenue by about $50 million in its 2026 financial year. Later that month Ocado announced that mutual exclusivity had ended with partners in most markets where its technology is live, including the United States. In January 2026 its Canadian partner Sobeys closed a centre in Calgary because the local online grocery market had grown more slowly than expected, paying Ocado £18 million.

      **What it suggests.** The partnerships gave Ocado scale abroad without owning retailers, but tied its revenue to partners' judgements about demand. The compensation terms protected part of the value of the capacity built, and the end of exclusivity is the other side of the bargain: Ocado regains the right to sell to its partners' rivals.
    sources: [adv-strat-ocado-kroger-nov-2025, adv-strat-ocado-kroger-dec-2025, adv-strat-ocado-exclusivity-2025, adv-strat-ocado-sobeys-2026]

cases:
  - title: Brightwater Foods and Kestrel Snacks
    fictional: true
    situation: |
      Brightwater Foods, a fictional listed food manufacturer, has agreed in principle to buy Kestrel Snacks, a fictional listed maker of premium crisps and nuts, for €540 million in cash: a 35% premium to Kestrel's undisturbed market value of €400 million. Advisers' fees will be €12 million. Brightwater's cost of capital is 9% and its tax rate 25%.

      The synergy case rests on closing Kestrel's two older factories and moving production to Brightwater's under-used plants, merging sales teams that call on the same supermarkets, and selling Kestrel's products through Brightwater's export distributors. Kestrel's founders, who lead product development, have said they will leave if its brands are folded into Brightwater's. Kestrel's sales director warns that two large supermarket customers have already asked the combined supplier for lower prices.
    exhibit:
      caption: 'Brightwater''s synergy case for Kestrel Snacks (€m)'
      columns: ['Item', 'Year 1', 'Year 2', 'Year 3', 'Year 4 onwards, each year']
      rows:
        - ['Cost synergies before tax', '10', '25', '40', '40']
        - ['Revenue synergies, contribution before tax', '0', '5', '12', '15']
        - ['One-off integration costs before tax', '(35)', '(20)', '(5)', '0']
        - ['Net before tax', '(25)', '10', '47', '55']
        - ['Net after tax at 25%', '(18.75)', '7.50', '35.25', '41.25']
      note: Simulated data. The plan assumes that the year 4 amounts continue unchanged for ever.
    questions:
      - Using the after-tax figures, calculate the present value of the synergies at 9%, valuing year 4 onwards as a perpetuity. Does it exceed the premium and fees?
      - Recalculate assuming that the revenue synergies never arrive and the cost synergies reach only 60% of plan. What is the largest premium Brightwater could then justify?
      - Where would you place the deal on Haspeslagh and Jemison's matrix, and how should the founders' warning change the integration plan?
      - What might the supermarkets' request mean for the revenue synergies, and how would you test it before signing?

evaluation: |
  **Who gains?** It is established that target shareholders gain substantially on announcement and that acquirers' shareholders gain little or nothing on average, with small positive combined gains (Andrade, Mitchell and Stafford, 2001). Very large deals and bids for listed targets have tended to do worse for buyers, and acquisitions of private firms better. What drives the variation is less settled: King and colleagues (2004) found that the commonly studied variables explain little of it.

  **Measurement.** Announcement returns measure the market's expectation, not the outcome; long-run studies measure outcomes but struggle to separate the deal's effect from everything else that happened; accounting studies depend on how acquisitions are booked. Conclusions are most credible where the methods agree.

  **Price or integration?** Theories of overpayment and theories of failed integration both fit the evidence, and they imply different remedies: walk away more often, or plan integration before bidding. Interpretation: most disappointing deals show both.

  **Alliances.** Claims that most alliances fail are widely repeated but rest on varied definitions of failure; an alliance that ends after achieving its purpose has not failed. A stronger finding is that firms with dedicated alliance functions achieve better outcomes (Kale, Dyer and Singh, 2002), which suggests that managing alliances is a capability that can be built.

  **Politics.** Deals are increasingly judged on national security, employment and ownership, not only on competition. Whether this protects legitimate interests or shields incumbents is a political judgement; for the strategist it is a risk to be priced, and, as two of this module's cases show, it can change the structure of the deal itself.

decision:
  title: 'Corvina Medical: buy, ally or build an AI imaging capability'
  fictional: true
  brief: |
    Corvina Medical, a fictional maker of ultrasound equipment with revenue of €900 million, believes that within three years buyers will expect AI-assisted image analysis built into its devices, and it has no team for this. Lumio, a fictional start-up of 45 engineers with software approved for two clinical uses, is for sale; its owners want €180 million, about 15 times its revenue. A large software firm offers a non-exclusive licence of its general imaging models for a royalty of 4% of the device price. Corvina's chief technology officer believes she could build a team of 40 engineers in three years for about €60 million, but has never hired at that scale.
  options:
    - label: Acquire Lumio
      text: Pay €180 million and run Lumio as a separate unit for two years. This is the fastest path to approved products, but most of the value sits in 45 engineers who could leave, and the price assumes Corvina can multiply Lumio's revenue.
    - label: Take a stake and ally
      text: Buy 15% of Lumio for €30 million with an option to buy the rest at a fixed formula, and sign a three-year co-development deal with exclusivity in ultrasound. This lowers the commitment, but a rival could buy Lumio first.
    - label: License the models
      text: Pay the royalty and focus Corvina's engineers on integrating the models into its devices. This is cheapest and quickest, but every competitor can buy the same capability.
    - label: Build in-house
      text: Hire and train a team over three years. This gives full control and ownership of the capability, but it is slow and uncertain, and Corvina may arrive after buyers have chosen their suppliers.
  criteria:
    - Speed to an approved, competitive product
    - Durability of any advantage gained
    - Value at risk, including any premium paid
    - Feasibility of integration or of governing the alliance
    - Options preserved if the market develops differently
  guidance: |
    Use the build, borrow or buy sequence. Building fails the first test on time and experience: Corvina has never hired and managed AI engineers at this scale, so three years is optimistic. Licensing is right if the capability will become a commodity, because then no path yields advantage and the cheapest parity wins; it is wrong if clinical approval and integration with Corvina's devices create real differentiation.

    If advantage is available, the choice is between borrowing and buying. The stake with an option suits high uncertainty: it buys learning and the right to acquire later at a known formula, but exclusivity may not hold and a rival may buy Lumio first. The acquisition is justified only if the capability is valuable, rare and hard to imitate, and if Corvina can keep Lumio's engineers; at 15 times revenue the synergy case must be explicit, and the integration approach should be preservation, not absorption.

    A strong answer names the assumption that decides the choice, whether AI imaging will differentiate devices or become a commodity, and the evidence that would test it within a year.

reading:
  - source: adv-strat-haspeslagh-jemison-1991
    note: The classic study of acquisition integration, and the source of the integration matrix.
  - source: adv-strat-roll-1986
    note: A short, provocative paper on why bidders may overpay even when markets price targets correctly.
  - source: adv-strat-andrade-mitchell-stafford-2001
    note: An accessible survey of the evidence on who gains from mergers.
  - source: adv-strat-moeller-schlingemann-stulz-2005
    note: How a small number of very large deals destroyed most of acquirers' value in one merger wave.
  - source: adv-strat-sirower-1997
    note: Why the premium is a promise, and why synergy promises are so often broken.
  - source: adv-strat-dyer-singh-1998
    note: The relational view of alliances, on where cooperative value comes from and the governance that protects it.
  - source: capron-mitchell-2012
    note: A practical framework for choosing between building, borrowing and buying resources.


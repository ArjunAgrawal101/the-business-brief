# Advanced Management and Strategy: marketing, module 5.
# Real applications rest on documents read on 16 November 2026: BYD's own
# releases (2024 and 2025) and MultiChoice Group's results booklet for the
# year to 31 March 2025. Everything else is illustrative or fictional and
# labelled.
domain: marketing
title: International marketing
order: 5
dek: When a firm takes its brand abroad, what should it keep the same, what must it adapt, and how does distance, cultural, administrative, geographic and economic, change the answer?
audience: [undergraduate, mba, professional]
covers:
  - International marketing
minutes: 17
updated: '2026-11-16'
bridge:
  codes: ['4.6', '1.6']
  text: |
    The IB course covers methods of entering international markets, their opportunities and threats, and the choice between standardizing and adapting the marketing mix (4.6), together with multinational companies and their host countries (1.6). This module adds the debate between globalization and localization, the CAGE framework of distance, the evidence on culture and country of origin, pricing across borders, and how firms learn their way into foreign markets.
foundation: |
  International marketing involves the same tasks as domestic marketing, choosing customers, positioning and building a mix, under conditions that differ by country: needs and incomes, languages and norms, regulations and taxes, channel structures and competitors. The central trade-off is between **global integration**, which brings economies of scale, consistent brands and the transfer of lessons from one market to another, and **local responsiveness**, which fits the offer to each market.

  **Standardization** is not all or nothing. A firm may keep its positioning and core product identical everywhere while adapting pack sizes, prices, channels and advertising. The useful question is element by element: what must be the same everywhere for the brand to mean something, and what must differ for it to sell?

  **Distance** is the main reason the answer differs. Ghemawat (2001) argued that firms routinely overestimate the attraction of large foreign markets because they underweight the costs of distance, which has four dimensions: cultural, administrative, geographic and economic.

  Firms also **learn** their way abroad. The Uppsala model (Johanson and Vahlne, 1977) describes internationalization as a process in which firms deepen their commitment to a market as their knowledge of it grows, starting with countries that feel close. Born-global firms, which sell abroad from their first years, show that the process can be compressed but not skipped: someone still has to learn the market.
advanced:
  - id: global-vs-local
    title: Globalization or localization?
    body: |
      In an influential article Levitt (1983) argued that technology was making consumers' wants alike everywhere, so firms selling standardized, high-quality products at low prices would defeat rivals who adapted to every local preference. Douglas and Wind (1987) replied that the evidence for convergence was thin: segments differ within and between countries, scale economies are often overstated, and standardization pays only under particular conditions, such as a genuinely global customer segment, transferable advantages and low costs of adaptation.

      Later evidence supports a contingent view. Szymanski, Bharadwaj and Varadarajan (1993) found that businesses competing across Western markets could use broadly standardized strategies, consistent with the idea that standardization works between similar markets. Zou and Cavusgil (2002) found that a global marketing strategy, combining standardization, coordination across countries and a deliberate choice of where to locate activities, was associated with better performance, mainly through strategic gains such as learning and competitive leverage.

      Organizational theory frames the same choice. Prahalad and Doz (1987) placed businesses on two axes: pressure for **global integration** and pressure for **local responsiveness**. Bartlett and Ghoshal (1989) described the resulting strategies: **global** (high integration, low responsiveness), **multidomestic** (the reverse), **international** (both low, exporting home-grown products) and **transnational** (both high), which seeks efficiency, responsiveness and worldwide learning at once and is the hardest to manage.

      Global brands carry meaning of their own. Holt, Quelch and Taylor (2004) found that consumers in many countries associate global brands with quality and status, but also hold them to higher standards of social responsibility.
  - id: distance-and-selection
    title: Distance and market selection
    body: |
      Ghemawat's **CAGE** framework separates four kinds of distance:

      - **Cultural**: language, religion, social norms and values; most important for products with high cultural content, such as food, media and personal care.
      - **Administrative**: the absence of shared trade agreements, currencies or legal ties, and political hostility; most important where governments are involved, as in utilities and regulated sectors.
      - **Geographic**: physical distance, borders, climate and infrastructure; most important for heavy, fragile or perishable goods.
      - **Economic**: differences in income and in the cost and quality of resources; most important where demand varies with income.

      The framework corrects a common error, ranking markets by size and growth alone. A market half the size but closer on all four dimensions may be more attractive in practice. Distance is also bilateral: a Spanish firm may be closer to Mexico than a German firm of the same size, because of language and history.

      Cultural distance is often measured with Hofstede's (1980) dimensions, derived from surveys of one multinational's employees in many countries: power distance, individualism, masculinity and uncertainty avoidance, with long-term orientation and indulgence added later. The GLOBE project (House and others, 2004) offered a broader alternative. Both describe national averages around which individuals vary widely, and McSweeney (2002) questioned whether one company's employees could represent national cultures at all. As a rough guide to where communication and management need adapting they help; as a predictor of individual behaviour they mislead.
  - id: adapting-the-mix
    title: Adapting the mix, and pricing across borders
    body: |
      **Product** adaptation is often forced by regulation, climate, infrastructure or usage, and sometimes by language: a name that works in one market can be meaningless or awkward in another. **Promotion** adapts to language, humour, norms and the media available. **Place** adapts because channel structures differ greatly: a product sold through supermarkets in one country may need small shops or online marketplaces in another.

      **Price** raises particular problems. **Price escalation** occurs as costs accumulate along an export chain. A worked example: a product leaves the factory at $10,000; freight and insurance add $800, an import duty of 10% is charged on the $10,800 landed value, the importer adds 15%, the dealer 12%, and a sales tax of 20% applies. The retail price is $10,800 × 1.10 × 1.15 × 1.12 × 1.20, about $18,360, or 84% above the factory price. Local assembly, which can avoid the duty and shorten the chain, often changes the position more than any marketing decision.

      Price gaps between countries invite **parallel imports**, or grey trade, when intermediaries buy where prices are low and resell where they are high. Firms respond with **price corridors**, which cap the gap between countries, and with product or service differences that make goods less transferable. **Currency** adds a choice: pricing in local currency protects customers and volumes but exposes margins, while pricing in the exporter's currency does the reverse.

      Affordability shapes the mix in lower-income markets. Smaller packs, simpler products and new channels can reach customers whom standard products price out, the argument Prahalad (2004) made for serving the base of the economic pyramid.
  - id: entry-and-learning
    title: Learning, foreignness and country of origin
    body: |
      Foreign firms start at a disadvantage, the **liability of foreignness**: they lack local knowledge, networks and legitimacy. The Uppsala model explains why many firms enter nearby, familiar markets first and commit gradually, from exporting through agents to their own sales and production. Johanson and Vahlne (2009) revised the model to stress networks: what holds a firm back is less being foreign than being an **outsider** to the business networks that matter. Born-global firms (Oviatt and McDougall, 1994; Knight and Cavusgil, 2004) internationalize early by using networks, digital channels and niche products whose customers are similar across countries.

      **Country of origin** shapes how products are judged. Verlegh and Steenkamp's (1999) meta-analysis found that origin has a clear effect on perceived quality and a smaller one on purchase intention. Consumers can also feel **animosity** towards a country and refuse its products for historical or political reasons, even when they rate their quality highly (Klein, Ettenson and Morris, 1998). Yet many consumers cannot correctly identify where brands come from (Samiee, Shimp and Sharma, 2005), so origin effects depend on whether the origin is salient.

      Firms manage origin by emphasizing it where it signals quality, playing it down where it raises doubts, or localizing their identity through local production, management and partnerships, presenting the brand as part of the host economy rather than an importer.
models:
  - name: The CAGE distance framework
    origin: Ghemawat (2001)
    summary: |
      Distance between countries has cultural, administrative, geographic and economic dimensions, each of which matters more for some industries than others. Market attractiveness should be discounted by distance, not judged on size and growth alone.
    use: |
      For each candidate market, rate the four distances from the home base, weight them by how much each matters to the product, and compare the adjusted ranking with the raw one. Use the same lens to ask which elements of the mix must adapt.
    limits: |
      Scores are judgements, and distance shrinks with experience and partnerships. The framework says where costs arise but not how to overcome them, and it can underplay the opportunities that distance itself creates.
    sources: [adv-strat-ghemawat-2001]
  - name: The integration-responsiveness grid
    origin: Prahalad and Doz (1987); Bartlett and Ghoshal (1989)
    summary: |
      Businesses face pressure for global integration (scale, consistency, coordination) and for local responsiveness (differences in customers, channels and regulation). The balance points to a global, multidomestic, international or transnational strategy.
    use: |
      Assess the pressures for each element of the mix separately: a brand's positioning may face integration pressure while its prices and channels face responsiveness pressure. Then decide which decisions belong at headquarters and which in each country.
    limits: |
      The categories are ideal types, and the transnational answer, doing everything at once, is easier to name than to organize. Pressures change over time, as regulation and digital channels shift.
    tool: /market-studio/marketing-mix/
    sources: [adv-pm-prahalad-doz-1987, adv-strat-bartlett-ghoshal-1989]
  - name: Cultural dimensions
    origin: Hofstede (1980)
    summary: |
      National cultures can be compared on dimensions such as power distance, individualism, masculinity and uncertainty avoidance, later joined by long-term orientation and indulgence.
    use: |
      Use the dimensions to anticipate where advertising appeals, sales practices and management styles will need adapting, for instance individual versus group benefits, or how much reassurance and detail buyers expect.
    limits: |
      Scores are national averages from dated surveys of one company's employees; regions, generations and individuals differ widely. Treating them as fixed traits of individuals leads to stereotypes.
    framework: hofstedes-cultural-dimensions
    sources: [hofstede-1980, adv-pm-mcsweeney-2002]
  - name: The Uppsala internationalization model
    origin: Johanson and Vahlne (1977)
    summary: |
      Firms internationalize gradually: knowledge of a market leads to greater commitment, which produces more knowledge. They tend to enter markets that feel close first and move from exporting towards their own operations.
    use: |
      Plan entry as a learning sequence: begin where knowledge can be built cheaply, decide in advance what the firm must learn before committing more, and use partners and networks to learn faster.
    limits: |
      Born-global firms and acquisitions show that the stages can be skipped. The model describes how firms tend to behave rather than prescribing how they should, and the 2009 revision shifts the emphasis from distance to networks.
    sources: [adv-strat-johanson-vahlne-1977, adv-strat-johanson-vahlne-2009]
applications:
  - title: 'BYD: one car, three names, and factories where it sells (2025)'
    kind: real
    asOf: '2025-09'
    sources: [adv-pm-byd-2023-sales, adv-pm-byd-2025-brazil, adv-pm-byd-2025-iaa]
    body: |
      BYD's exports rose 334.2% in 2023 to 242,765 vehicles, and two announcements from 2025 show how it combines a common technology base with local adaptation. In July 2025 it built its first car in Brazil, at Camaçari in Bahia: a small electric car sold as the Dolphin Mini in Brazil, the Seagull in China and the Dolphin Surf in Europe. The plant began by assembling kits and is to move to full local manufacturing, including stamping, welding and painting, with more Brazilian components, and BYD is developing a hybrid engine that runs on petrol or ethanol, Brazil's main renewable fuel, with Brazilian scientists. Its head of sales and marketing in Brazil said, "We see ourselves as a Brazilian company now." In September 2025 BYD confirmed that the Dolphin Surf would be the first car built at its factory in Szeged, Hungary, for European buyers, and that its premium Denza brand would lead the introduction of very fast charging in Europe.

      *Interpretation.* One platform, three names: the product is standardized where scale matters and adapted where language, fuel, tariffs and identity matter. Local production reduces price escalation and presents a Chinese brand as a local employer, a response to economic and administrative distance at once.
  - title: 'MultiChoice: pricing in currencies that fall (2025)'
    kind: real
    asOf: '2025-03'
    sources: [adv-pm-multichoice-fy2025]
    body: |
      MultiChoice sells pay-television across sub-Saharan Africa, and its results for the year to 31 March 2025 show the problem of pricing in falling currencies. Outside South Africa, depreciation against the US dollar, notably in Nigeria, Angola, Ghana and Malawi, cut reported revenue by a weighted 26%, while inflation ran at around 20% on a weighted basis and above 30% in Nigeria and Angola. The group raised prices by 31% on average in local currencies, giving organic revenue growth of 3%, yet revenue reported in rand fell 23% and active subscribers fell 7%, with Nigeria accounting for over half of the decline. Power shortages, civil unrest and piracy added to the pressure. Against global streaming services the group emphasized local content, producing and curating stories in more than 45 languages, and its relaunched streaming service, Showmax, targeted 44 markets, with 82 original productions in the year.

      *Interpretation.* Local-currency pricing protected organic revenue at the cost of affordability and customers, and no pricing policy could protect reported results from falls of this size. Local content is a regional incumbent's defence against standardized global rivals: a deliberate bet on cultural distance.
  - title: A skincare brand weighs a distant market
    kind: illustrative
    body: |
      A British natural skincare brand plans to enter a distant, high-income market through a distributor. Its CAGE review, on assumptions made for this illustration, finds high cultural distance in what buyers expect of texture and packaging, administrative hurdles in ingredient approval, geographic distance that makes small shipments costly, and higher local price points that leave room for a premium. It keeps its brand story and core formulas, reformulates two products, redesigns packaging for local labelling and gives the distributor freedom over channels, while retaining approval of advertising.
cases:
  - title: 'Velo Verde: which market next?'
    fictional: true
    situation: |
      Velo Verde, a fictional Italian maker of mid-priced electric bicycles, sells in Italy and two neighbouring countries and wants a fourth market. Its board is drawn to Market C, the largest and fastest-growing. The export manager has gathered the data below and argues that size is not everything.
    exhibit:
      caption: Velo Verde's three candidate markets
      columns: [Measure, Market A, Market B, Market C]
      rows:
        - [Electric bicycles sold last year (000), '300', '160', '500']
        - [Expected annual market growth, '5%', '12%', '20%']
        - [Language and cultural ties with Italy, Moderate, Low, Low]
        - [Trade relationship with Italy, Same trade bloc, Customs agreement, 'None: 25% tariff']
        - [Freight and insurance per bicycle (€), '60', '120', '180']
        - [Average income relative to Italy, '70%', '40%', '10%']
        - [Typical local mid-market electric bicycle price (€), '1,600', '950', '600']
      note: Simulated figures for unnamed markets. Velo Verde's ex-factory price is €1,300 a bicycle. The tariff is charged on the ex-factory price plus freight. Importers and dealers together take 35% of the retail price; ignore sales taxes.
    questions:
      - Calculate the landed cost and the retail price Velo Verde would need in each market, and compare each with the typical local mid-market price.
      - Apply the CAGE framework to the three markets. How does the ranking compare with a ranking by size and growth?
      - For Market C, what changes to the product, to production or to the mode of entry could make the brand competitive, and what would each cost in control or consistency?
      - Recommend a sequence of entry over five years, with an entry mode for each market, and say what the company must learn before each step.
evaluation: |
  **Globalization.** Levitt's prediction of converging tastes was only partly borne out: many categories have global segments, but prices, channels and communication still vary widely, and Ghemawat (2007) argued that the world remains semi-globalized, with most economic activity still domestic. Research on standardization and adaptation is hampered by measurement: degrees of standardization are usually self-reported by managers, and studies of performance survey the firms that survived abroad.

  **Culture.** Hofstede's dimensions transformed comparative research and remain useful, but the criticisms are serious: the data came from one company's employees decades ago, national averages hide large variation within countries, and applying averages to individuals is an error of inference. Alternative frameworks such as GLOBE measure culture differently and do not always agree with Hofstede's rankings.

  **Country of origin.** Origin effects are robust in experiments but smaller in purchasing than in attitudes, and many consumers do not know where brands come from. Origin effects are therefore strongest when a brand makes its origin salient or when politics does it for the brand.

  **Internationalization paths.** The Uppsala model and the born-global literature describe different populations of firms rather than refuting each other: incremental paths remain common among manufacturers, while digital and niche businesses internationalize early.

  **What the models leave out.** Most frameworks were built for firms from rich countries expanding into poorer ones. Firms from emerging economies, such as Chinese carmakers entering Europe and Latin America, often face a different combination of advantages, in cost and technology, and disadvantages, in brand legitimacy and politics, which existing theories capture imperfectly.
decision:
  title: One campaign for twelve markets, or twelve campaigns?
  fictional: true
  brief: |
    Brisa, a fictional sparkling tea brand from Portugal, will launch in twelve markets across Europe, the Middle East and Latin America next year. Its positioning at home is natural refreshment with a hint of indulgence, and its advertising relies on humour. The global marketing director must decide how much of the launch campaign to standardize, with a budget that cannot fund twelve separate productions of the highest quality.
  options:
    - label: A. One global campaign
      text: Produce one campaign centrally and translate it, with identical positioning, visuals and media plans everywhere.
    - label: B. Global platform, local executions
      text: Fix the positioning, brand assets and core message centrally, and let regional teams produce their own executions within published rules.
    - label: C. Local positioning
      text: Let each market choose its own positioning and campaign, coordinating only the logo and pack design.
  criteria:
    - Brand consistency and recognition across markets
    - Local relevance and response
    - Cost and speed of production
    - Risk of cultural or regulatory missteps
    - Learning across markets
  guidance: |
    The choice turns on what must be the same for the brand to mean anything, and on where the cultural distance lies. The positioning, natural refreshment with indulgence, travels across most of these markets and benefits from consistency, so a fully local approach, **C**, would waste scale and leave twelve unrelated brands. But humour is among the least transferable forms of advertising, and the regulatory and cultural rules on food and drink claims differ across these regions, so a single translated campaign, **A**, risks campaigns that fall flat or offend.

    **B** captures the main gains of both: fixed positioning and distinctive assets build one brand, while local executions handle language, humour and rules. Its risks are drift, as each region reinterprets the brand, and cost. The guard is a short set of non-negotiables and a central review of every execution against them, plus a shared library so that an execution that works in one market can be reused in others with similar cultural profiles.

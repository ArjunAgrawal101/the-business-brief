# Advanced Management and Strategy: marketing, module 1.
# Real applications rest on documents read on 16 November 2026: BYD's own
# releases (2022, 2023, 2024) and Tata Motors' release on the TATA.ev
# identity (2023). Everything else is illustrative or fictional and labelled.
domain: marketing
title: Brand strategy and competitive positioning
order: 1
dek: What is a brand worth, how does it create value in customers' minds and in the accounts, and how should a firm choose where to stand against its rivals?
audience: [undergraduate, mba, professional]
covers:
  - Brand strategy
  - Competitive positioning
minutes: 17
updated: '2026-11-16'
bridge:
  codes: ['4.2', '4.5']
  text: |
    The IB course covers segmentation, targeting, position maps, the unique selling point and differentiation (4.2), and branding as awareness, development, loyalty and value (4.5). This module explains brand equity as a theory of customer memory with financial consequences, sets the evidence-based laws of brand growth against the differentiation school, and treats positioning and brand architecture as strategic choices with trade-offs.
foundation: |
  A brand is more than a name and a logo. Keller (1993) defined **customer-based brand equity** as the differential effect that knowledge of a brand has on how customers respond to its marketing: the same product, price or advertisement produces a different response when it carries a known name. Brand knowledge has two parts: **awareness**, whether the brand comes to mind and is recognized, and **image**, the associations attached to it, which matter according to their strength, favourability and uniqueness.

  That memory has financial effects. Strong brands can charge a price premium, sell more at the same price, face less price-sensitive demand, win customers more cheaply, launch new products under a trusted name and recover faster from crises. Brand equity therefore appears twice: in customers' heads and in the firm's cash flows.

  **Positioning** is the place a brand aims to occupy in the minds of target customers relative to competitors. It rests on a frame of reference (which category are we competing in?), **points of parity** (what must we match to be considered?) and **points of difference** (what makes us preferred?) (Keller, Sternthal and Tybout, 2002). Strategic positioning in Porter's sense goes further: choosing activities that deliver a distinct kind of value, and accepting the trade-offs that make the choice hard to copy.
advanced:
  - id: brand-equity
    title: 'Brand equity: from memory to money'
    body: |
      Keller's model, often drawn as a pyramid, builds from **salience** (awareness and the situations in which the brand comes to mind), through **performance** and **imagery**, to customers' **judgements** and **feelings**, and finally to **resonance**, the intensity of the relationship. Aaker (1991) described brand equity as a set of assets: loyalty, awareness, perceived quality, associations and other proprietary assets such as trademarks.

      Valuing a brand in money is harder. Three approaches are common:

      - **Price premium**: the extra a branded product earns over a comparable unbranded one, net of the cost of supporting the brand.
      - **Royalty relief**: what the owner would pay to license the brand if it did not own it, estimated from comparable licence rates and applied to forecast sales.
      - **Economic use**: the share of the business's economic profit attributable to the brand, discounted according to the brand's strength.

      A worked example of the first. A cereal brand sells 2 million packs a year at £3.50, while an own-label product of the same quality sells at £2.70: a premium of £0.80 a pack, or £1.6m a year. Advertising and other brand support cost £0.6m a year, leaving £1.0m. Capitalized as a perpetuity at a 10% discount rate, the brand is worth about £10m; if the net premium could grow at 2% a year, about £12.5m (£1.0m ÷ (0.10 − 0.02)). Small changes in assumptions move the answer a long way, which is one reason published valuations of the same brand often differ widely.

      Equity also cushions shocks. Dawar and Pillutla (2000) found that consumers' prior expectations of a brand shaped how they read a firm's response to a product-harm crisis, giving strong brands more room to recover.
  - id: how-brands-grow
    title: 'How brands grow: two schools'
    body: |
      The **Ehrenberg-Bass** school starts from regularities in buying data across many categories and countries. The best known is **double jeopardy** (Ehrenberg, Goodhardt and Barwise, 1990): smaller brands have far fewer buyers, and those buyers are also slightly less loyal. Buying in stable markets is well described by the Dirichlet model (Goodhardt, Ehrenberg and Chatfield, 1984), in which most buyers of any brand are light buyers who also buy its competitors.

      Sharp (2010) drew strategic conclusions: brands grow mainly by increasing **penetration**, the number of buyers, rather than by deepening the loyalty of existing ones. That requires **mental availability**, being easily thought of in buying situations, built through broad reach and consistent **distinctive brand assets** such as colours, shapes and characters, and **physical availability**, being easy to find and buy. On this view perceived differentiation matters less than marketers think, because buyers of different brands rarely see them as very different.

      The **differentiation** school, from Ries and Trout's (1981) positioning to Keller and Aaker, holds that meaningful, relevant differences create preference and pricing power, and that a clear position should guide every marketing decision. Its strongest ground is categories where buyers deliberate, such as cars, technology and services, and premium or niche brands whose buyers are unusually loyal, the known exceptions to double jeopardy.

      The schools agree more than their debates suggest: both value consistency, and both regard price promotions as weak builders of brands. Binet and Field (2013), analysing campaigns entered for advertising effectiveness awards, argued for balancing long-term brand building with short-term activation, with roughly 60% of the budget on brand building in many categories.
  - id: positioning-choice
    title: Positioning as a strategic choice
    body: |
      A position is chosen within a **frame of reference**. Defining the category narrowly makes a brand look distinctive among close rivals; defining it broadly can open growth but invites comparison with stronger substitutes.

      Positioning maps help but can mislead. A **perceptual map** built from customers' ratings, for example by multidimensional scaling, shows how customers see the market; a **managerial map** drawn on two attributes chosen by the team shows how managers think it should be seen. An empty space is not an opportunity unless customers value that combination and the firm can deliver it; many gaps are empty because nobody wants to be there. The [positioning map tool](/market-studio/positioning-map/) applies a four-question test to any gap.

      At the level of the business, positioning connects to competitive strategy. Porter's [generic strategies](/frameworks/porters-generic-strategies/) warn against being stuck in the middle. Treacy and Wiersema (1993) argued that market leaders excel at one of three value disciplines, **operational excellence**, **product leadership** or **customer intimacy**, while meeting the industry standard on the other two.

      **Repositioning** is risky because associations are sticky. A brand moving up-market must win new customers while keeping enough current ones, and its old associations follow it: customers who knew it as cheap may resist paying more, while premium buyers may doubt it. The usual alternatives are a new brand or a sub-brand, which raises the question of architecture.
  - id: architecture-and-extension
    title: Brand architecture and extension
    body: |
      Aaker and Joachimsthaler (2000) described a **brand relationship spectrum** running from a **branded house**, where one master brand carries every offer, through **sub-brands** and **endorsed brands**, to a **house of brands**, where each product stands alone. A branded house concentrates investment and lets every product draw on the master brand's equity. A house of brands lets each brand target a different segment or price point and keeps a failure in one from damaging the others, at the cost of building each brand separately.

      **Brand extension** puts an existing name on a new product. Aaker and Keller (1990) found that consumers judge extensions more favourably when the parent brand is seen as high quality and when the extension **fits**, through complementary use or transferable skills. Poorly fitting extensions can dilute the parent's associations. Vertical extensions are especially hard: moving down risks cheapening the parent, while moving up is held back by the parent's existing associations, which is why premium lines often take a new name or sit at arm's length.

      Portfolio choices follow the same logic. Many large firms concentrate investment on fewer, stronger brands and sell or close the rest, because support spread thinly across many brands builds none of them.
models:
  - name: Customer-based brand equity
    origin: Keller (1993)
    summary: |
      Brand equity is the differential effect of brand knowledge on customers' response to marketing. Knowledge consists of awareness (recall and recognition) and image (associations that vary in strength, favourability and uniqueness).
    use: |
      Track awareness and the key associations among target customers over time, and test whether they predict behaviour: price acceptance, consideration and choice. Judge each campaign by whether it strengthens the associations that create the brand's difference.
    limits: |
      Measurement relies on surveys, and stated associations do not always predict what people buy. The model says what equity is, not how much of it is worth building or how fast it decays.
    sources: [adv-pm-keller-1993, adv-pm-aaker-1991]
  - name: Points of parity and points of difference
    origin: Keller, Sternthal and Tybout (2002)
    summary: |
      A position needs a frame of reference, points of parity that earn the brand a place in the consideration set, and points of difference that make it preferred. A difference must be desirable to customers, deliverable by the firm and hard for rivals to copy.
    use: |
      Write the positioning as three lists: the category, the parities the brand must match, and the one or two differences it can own. Test each difference for desirability, deliverability and distinctiveness before building communication around it.
    limits: |
      It assumes customers notice and remember differences, which the Ehrenberg-Bass evidence questions in many low-involvement categories. A position on paper can be undermined by distribution, price or service that tell a different story.
    tool: /market-studio/positioning-map/
    sources: [adv-pm-keller-sternthal-tybout-2002]
  - name: Double jeopardy and mental availability
    origin: Ehrenberg, Goodhardt and Barwise (1990); Sharp (2010)
    summary: |
      Small brands suffer twice: fewer buyers, and slightly lower loyalty among them. Growth therefore comes mainly from penetration, built through mental availability (being easily recalled in buying situations) and physical availability.
    use: |
      Compare a brand's loyalty with what its size predicts. Loyalty far above the norm suggests a niche or a strong difference; loyalty in line with size suggests growth must come from reaching more category buyers, especially light ones.
    limits: |
      The laws describe stable, repertoire markets and are weaker where buyers deliberate or switch rarely. They are patterns, not causal tests, so the inference that differentiation does not matter remains contested.
    sources: [adv-pm-ehrenberg-1990, adv-pm-sharp-2010]
  - name: The brand relationship spectrum
    origin: Aaker and Joachimsthaler (2000)
    summary: |
      Brand architecture ranges from a branded house, through sub-brands and endorsed brands, to a house of brands. Moving towards a house of brands buys focus and protection from contagion at the cost of building equity separately.
    use: |
      For a new offer, ask whether the master brand's associations help or hurt it, whether a failure could damage the master brand, and whether the business can afford to build a new name. The answers locate the offer on the spectrum.
    limits: |
      It frames choices well but gives no rule for the crossover point, and real portfolios mix all four forms. Costs of separate brands, such as duplicated media spending, are easy to underestimate.
    sources: [adv-pm-aaker-joachimsthaler-2000]
applications:
  - title: 'BYD: a mass brand that built premium brands at arm''s length (2022 to 2024)'
    kind: real
    asOf: '2024-01'
    sources: [adv-pm-byd-2022-brand-matrix, adv-pm-byd-2023-fangchengbao, adv-pm-byd-2023-sales]
    body: |
      In November 2022, as it built its three millionth new energy vehicle, BYD announced a passenger car brand matrix: the BYD brand with its Dynasty and Ocean series, the premium Denza brand, a new high-end brand called Yangwang aimed at the luxury market, and a brand for professional and personalized vehicles, launched in June 2023 as Fangchengbao and described as the fifth brand in the matrix. BYD's figures for 2023 show the weight of each: of 3,024,417 vehicles sold, 2,877,353 were in the Dynasty and Ocean series and 127,840 were Denza, while Yangwang and Fangchengbao had begun deliveries only in November.

      *Interpretation.* The volume brand carries more than 95% of sales, while the premium and specialist ranges sit at arm's length under separate names, a house of brands at the top of the range. The associations that make a mass brand successful, value and accessibility, can cap what a premium model commands, so the premium brands avoid borrowing them, at the cost of building their own equity from scratch.
  - title: 'TATA.ev: an endorsed sub-brand for electric vehicles (2023)'
    kind: real
    asOf: '2023-08'
    sources: [adv-pm-tata-ev-2023]
    body: |
      In August 2023 Tata Passenger Electric Mobility, a Tata Motors subsidiary, launched a new identity for its electric vehicle business, TATA.ev, built on a brand platform called "Move with Meaning", which it said unified sustainability, community and technology. Developed with the agency Landor & Fitch, the identity places ".ev" inside a ring called the Orbit, uses a distinct colour, Evo Teal, and adopted an existing open-source typeface as a sustainability choice; it was to be rolled out across consumer communication in phases. The company said it aimed to give electric vehicle customers a distinct experience across every touchpoint, and that it held over 70% of India's four-wheeler electric vehicle segment, with more than 100,000 vehicles sold.

      *Interpretation.* Unlike BYD's separate premium names, TATA.ev is an endorsed sub-brand: it borrows trust in the Tata name, valuable when buyers fear the risks of a new technology, while signalling a distinct experience. The cost is shared fate: a poor experience with the electric range could spill back onto the parent.
  - title: A regional bank chases a younger segment
    kind: illustrative
    body: |
      A regional bank known for dependable branch service relaunches itself as a young, app-first brand. Awareness among under-30s rises, but its app is no better than rivals', so the new associations have no point of difference behind them, while loyal older customers read the campaign as a sign that branches will close. A sounder route keeps the existing points of difference, dependability and local presence, and adds a point of parity on digital service rather than claiming a difference the bank cannot deliver.
cases:
  - title: 'Marlow Tea: premium niche or mass reach?'
    fictional: true
    situation: |
      Marlow Tea, a fictional family-owned brand, sells premium black tea in UK supermarkets. Its buyers like it, but growth has stalled. The marketing director argues for doubling advertising and widening distribution to reach more buyers. The finance director argues for a price cut to win buyers from the two market leaders. The chair asks for a view grounded in the brand-tracking data below.
    exhibit:
      caption: Brand performance in UK packaged tea, last 12 months
      columns: [Measure, Marlow, Hearthside, Kettlebrook]
      rows:
        - [Value share of the category, '8%', '31%', '14%']
        - [Penetration (share of category buyers who bought the brand), '16%', '48%', '32%']
        - [Average purchases per buyer per year, '3.4', '5.1', '3.9']
        - [Average price per pack, '£3.40', '£2.90', '£2.60']
        - [Prompted awareness, '58%', '97%', '84%']
        - [Buyers who describe the brand as different from others, '24%', '21%', '12%']
        - [Advertising spend (£m), '1.2', '9.0', '2.5']
      note: Simulated figures. One pack per purchase. Value shares are rounded; other brands and own label make up the remaining 47%.
    questions:
      - Show that the three brands follow the double jeopardy pattern. What does the pattern imply about where Marlow's growth must come from?
      - Calculate each brand's value index (penetration × purchases per buyer × price) and check it against the value shares. If Marlow's penetration rose from 16% to 20% with frequency and price unchanged, roughly what would its value share become?
      - Marlow's buyers are the most likely to call it different, yet it is the smallest brand. How would each school of thought interpret this?
      - Using points of parity and difference, assess the risk of cutting Marlow's price to £2.95.
evaluation: |
  **What is established.** The Ehrenberg-Bass regularities, double jeopardy and the Dirichlet patterns of repeat buying, are among the best replicated findings in marketing, holding across many categories and countries. That brand equity raises price premiums and lowers price sensitivity is also well supported.

  **What is contested.** The strategic inferences drawn from those regularities are contested. The laws describe stable markets in which buyers spread purchases across a repertoire; they are patterns, not experiments, so they cannot show that building differentiation is wasted. The differentiation school, for its part, often relies on successful cases selected after the fact.

  **Evidence quality.** Binet and Field's analysis draws on campaigns entered for effectiveness awards, a sample of successes chosen by their authors. Its patterns are informative, but they are not proof that a given budget split causes growth. Brand valuations differ widely between providers because methods and assumptions differ, so treat any published value as an estimate with a wide margin.

  **Measurement.** Brand equity is usually measured through surveys of awareness and associations. Stated attitudes can lag behind or diverge from behaviour, and tracking studies change when their questions change. Positioning maps are snapshots that depend on which attributes were measured.

  **What the models leave out.** Most brand theory was built on consumer goods sold through retailers. Platforms, subscriptions and business markets, where relationships, reviews and network effects shape choice, fit it less neatly.
decision:
  title: Where should Harrow Outdoor stand?
  fictional: true
  brief: |
    Harrow Outdoor, a fictional mid-priced outdoor clothing brand, is losing share at both ends: discount retailers sell similar-looking jackets for half the price, and technical specialists win serious walkers with lighter, more durable kit. Harrow's buyers describe it as reliable and good value, but rarely as exciting. The board must choose a direction for the next five years.
  options:
    - label: A. Move up to technical specialist
      text: Invest in materials and testing, raise prices by about 40% and target serious walkers through specialist stores.
    - label: B. Move down to value
      text: Simplify the range, cut prices by about 20% and sell through supermarkets and discounters.
    - label: C. Stay mid-market and reach further
      text: Keep prices, sharpen distinctive assets such as colour and logo, and spend more on reaching occasional walkers and widening distribution.
  criteria:
    - Sustainability of margins and price premium
    - Risk of losing existing buyers
    - Fit with current capabilities
    - Likely competitive response
    - Time and cost to change customers' associations
  guidance: |
    Start from what customers already associate with Harrow: reliability and value. A repositioning has to overcome those associations, and **A** asks serious walkers to believe that a value brand has become technical, which demands real product capability as well as communication. Without credible products the move fails at both ends: specialists doubt it while current buyers balk at the price. If Harrow wants the technical segment, a separate sub-brand is a less risky route.

    **B** plays to existing associations but puts Harrow into a price fight with retailers whose costs are lower. **C** is often underrated. The double jeopardy evidence suggests that a mid-sized brand grows mainly by reaching more occasional buyers, and Harrow's associations are positive. Its risk is that the middle of the market itself is shrinking; if the data show that, C only delays the decision. A sound choice is C now, with a small technical sub-brand tested in parallel, and a review of the middle market's size in two years.

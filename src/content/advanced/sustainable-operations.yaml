    note: The original statement of the Porter hypothesis; read it alongside the reply by Palmer, Oates and Portney in the same issue.
  - source: adv-oe-palmer-1995
    note: The economists' critique of the idea that environmental regulation is a free lunch.
  - source: adv-oe-hart-1995
    note: The natural-resource-based view of the firm, linking environmental capabilities to competitive advantage.
  - source: adv-oe-guide-2009
    note: A clear account of how closed-loop supply chains work and what makes remanufacturing pay.
  - source: adv-oe-kleindorfer-2005
    note: A short overview of sustainable operations management as a field.
  - source: adv-oe-ghg-protocol-2004
    note: The corporate standard behind scope 1, 2 and 3 reporting.

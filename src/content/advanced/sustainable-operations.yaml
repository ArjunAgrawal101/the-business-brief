domain: operations
title: Sustainable operations
order: 4
dek: How operations can cut environmental and social harm across a whole value chain, when doing so pays, and how to judge the claims businesses make about it.
audience: [undergraduate, mba, professional]
covers: [Sustainable operations]
minutes: 25
updated: '2026-11-16'
bridge:
  codes: ['5.1', '5.3', '1.3', '1.4']
  text: |
    The IB course introduces environmental, social and economic sustainability in operations (5.1), cradle to cradle design at HL (5.3), corporate social responsibility (1.3), stakeholders (1.4) and the toolkit's [circular business models](/frameworks/circular-business-models/). This module adds the measurement behind the claims (carbon accounting by scope and life cycle), the economics of cutting emissions (cost per tonne and the green premium), the long debate over whether environmental performance pays, the operations of closing material loops, the people in lower tiers of supply chains, and how regulators now test sustainability claims.
foundation: |
  Operations decides most of a business's physical footprint: the energy it burns, the materials it uses and discards, and the working conditions in the factories and farms that supply it. Sustainable operations means reducing that harm while still delivering at an acceptable cost, and it rests on four distinctions. **Efficiency** reduces harm per unit; **redesign** removes it, for example by changing materials or processes. **Intensity** measures harm per unit of output; **absolute** measures count the total, which is what the atmosphere responds to. **Boundaries** decide whose harm counts: a firm's own sites, its suppliers or its customers' use of its products. And **who pays** decides whether anything happens at all: customers through a premium, taxpayers through subsidies, shareholders through lower returns, or no one.
advanced:
  - id: accounting-for-impact
    title: 'Accounting for impact: scopes, life cycles and boundaries'
    body: |
      The Greenhouse Gas Protocol (WRI and WBCSD, 2004) divides emissions into three scopes. **Scope 1** covers direct emissions from sources a firm owns or controls; **scope 2**, emissions from the electricity and heat it buys; **scope 3**, all other emissions in its value chain, upstream in purchased goods and transport and downstream in the use and disposal of its products. For a retailer, a food company or an oil producer, scope 3 is usually by far the largest, so the boundary a firm reports against largely decides what its progress looks like.

      Life cycle assessment extends the view to a product, from cradle to factory gate or to grave, per **functional unit** (a tonne of steel, a cup of coffee). Its results depend on choices about allocation and boundaries, which is why two credible studies of the same product can disagree.

      Intensity targets need care. If emissions per unit fall by 30% while output grows by 50%, absolute emissions rise by 5% (0.7 × 1.5 = 1.05). Data quality matters too: much scope 3 reporting estimates emissions from money spent with each supplier using average emission factors, so buying from a cleaner supplier at the same price may not register at all.
  - id: economics-of-abatement
    title: 'The economics of abatement: cost per tonne and the green premium'
    body: |
      A **marginal abatement cost curve** ranks measures by their cost per tonne of emissions avoided: annualised capital plus the change in operating cost, divided by tonnes avoided each year. Some measures, such as energy efficiency, have negative cost and pay for themselves; most structural changes are costly. Firms rationally start at the cheap end, which is why early progress is easy and later progress is not.

      Heavy industry shows the scale. Nippon Steel's decision to replace blast furnace capacity with electric arc furnaces (see below) costs about ¥300,000 per tonne of annual steelmaking capacity. Spread over 25 years at an 8% cost of capital, that is a capital charge of about ¥28,000 for every tonne of steel each year, before the higher electricity and raw material costs the company also expects. That extra cost is the **green premium**, and somebody must bear it: customers, through higher prices for low-carbon steel; taxpayers, through subsidies; shareholders, through lower returns; or no one, in which case the investment does not happen.

      Carbon pricing changes the comparison by charging the high-carbon route for its emissions, and border adjustments stop that charge from simply moving production abroad. Without a price or a premium, a firm that decarbonises early carries a cost its competitors avoid.
  - id: does-it-pay
    title: 'Does it pay? The Porter hypothesis and its critics'
    body: |
      Porter and van der Linde (1995) argued that pollution is a sign of wasted resources and that well-designed environmental regulation can trigger innovations whose savings partly or fully offset the cost of compliance. Palmer, Oates and Portney (1995) replied that firms rarely leave large free lunches lying around: offsets exist but are usually partial, and environmental policy should be judged on its costs and benefits rather than on a promise that it costs nothing.

      Hart (1995) moved the argument inside the firm with a **natural-resource-based view**: capabilities in pollution prevention, product stewardship and sustainable development can be sources of advantage that are hard to imitate. Kleindorfer, Singhal and Van Wassenhove (2005) framed sustainable operations management as integrating profit and efficiency with environmental outcomes and stakeholders rather than treating them as separate.

      The evidence supports a **weak** version of the Porter hypothesis, that regulation stimulates innovation, more than a **strong** one, that it raises profits. Environmental improvement pays when existing waste is high, when customers will pay a premium, or when regulation is coming anyway and early movers learn first. It does not pay privately when the costs fall on the firm and the benefits on society, which is why the useful question is often not whether it pays but who pays.
  - id: closing-loops-and-people
    title: Closing loops, and the people in the chain
    body: |
      McDonough and Braungart (2002) argued for **eco-effectiveness** rather than eco-efficiency: design materials as technical or biological nutrients that circulate indefinitely, rather than merely making less waste. Operations makes that idea work or fail. Guide and Van Wassenhove (2009) showed that closed-loop supply chains must manage returns whose quality, quantity and timing are uncertain, and that remanufacturing pays only with high collection rates and limited cannibalisation of new sales.

      Circularity can also backfire. Jevons (1865) observed that more efficient use of coal increased total coal consumption; Zink and Geyer (2017) applied the logic to the circular economy: if cheap secondary products add to consumption rather than replace primary production, the environmental gain shrinks or reverses.

      Social sustainability raises different operational problems. The worst labour conditions are usually in lower tiers that buyers do not see, and audits tend to find what suppliers choose to show. Firms that need assurance therefore combine supplier mapping, longer relationships, pricing that allows suppliers to comply, and grievance channels for workers, rather than relying on audits alone.

      Finally, claims are now regulated. The UK's anti-greenwashing rule for financial firms (see below) sets tests, substantiation, clarity, completeness over the life cycle and fair comparison, that any operations claim can be held to.
models:
  - name: The triple bottom line
    origin: Elkington (1997)
    summary: |
      Business performance should be judged on environmental and social outcomes as well as financial ones, often summarised as planet, people and profit.
    use: |
      Use it to widen the questions asked of an operations decision: what it does to emissions, materials and water, and to workers and communities, as well as to cost. Pair each dimension with measurable indicators and owners.
    limits: |
      The three lines have no common unit, so trade-offs between them are hidden rather than resolved, and the framework can become a reporting exercise. It says nothing about which dimension should win when they conflict.
    sources: [adv-oe-elkington-1997]
  - name: Cradle to cradle and closed-loop supply chains
    origin: McDonough and Braungart (2002); Guide and Van Wassenhove (2009)
    summary: |
      Products are designed so that their materials circulate as technical or biological nutrients, and supply chains are built to recover, sort and reprocess them.
    use: |
      Design for disassembly and single materials; set up collection with incentives for returns; grade returns on arrival and route them to reuse, remanufacture or recycling according to condition.
    limits: |
      Returns are uncertain in quantity and quality, remanufactured goods can cannibalise new ones, and rebound effects can cancel the gain. Many materials degrade with each cycle.
    framework: circular-business-models
    sources: [adv-oe-mcdonough-2002, adv-oe-guide-2009, adv-oe-zink-geyer-2017]
  - name: Scope 1, 2 and 3 accounting
    origin: WRI and WBCSD (2004)
    summary: |
      A standard for corporate greenhouse gas inventories that separates direct emissions, purchased energy and the rest of the value chain, so that boundaries are explicit and reports can be compared.
    use: |
      Map emissions along the value chain, find the largest sources (often purchased goods or product use), set absolute as well as intensity targets, and report the method used for scope 3.
    limits: |
      Scope 3 estimates are often spend-based and crude, double counting across firms is built in, and the choice of boundary can make performance look better or worse without any physical change.
    framework: value-chain
    sources: [adv-oe-ghg-protocol-2004]
  - name: The natural-resource-based view and the Porter hypothesis
    origin: Porter and van der Linde (1995); Hart (1995)
    summary: |
      Environmental capabilities can create competitive advantage, and well-designed regulation can spur innovations that offset its cost, though usually only in part.
    use: |
      Look for the waste behind emissions (energy, materials, scrap), anticipate regulation and customer requirements, and build capabilities early where learning is slow to copy.
    limits: |
      Where abatement is costly and customers will not pay, the private case fails; claims of win-win can disguise who bears the cost. Evidence for net profit gains is weaker than for innovation effects.
    sources: [adv-oe-porter-vdl-1995, adv-oe-hart-1995, adv-oe-palmer-1995]
applications:
  - title: 'Nippon Steel: paying for lower-carbon steel'
    kind: real
    asOf: '2025-05'
    sources: [adv-oe-nippon-steel-cn2050, adv-oe-nippon-steel-eaf-2025]
    body: |
      Nippon Steel's Carbon Neutral Vision 2050, announced in March 2021, aims to cut total CO2 emissions by 30% by 2030 from 2013 levels and to reach carbon neutrality by 2050, relying on three technologies: large electric arc furnaces able to make high-grade steel, direct reduction of iron ore with hydrogen, and hydrogen injection into blast furnaces. In May 2025 it decided to invest ¥868.7 billion in three electric arc furnaces at three works, with about 2.9 million tonnes a year of capacity starting production in fiscal 2028 and 2029, after being selected for up to ¥251.4 billion of government support under Japan's GX Promotion Act. The company stated that the conversion requires substantial capital investment and considerably higher production costs, including raw materials and electricity, and that establishing a market in which "CO2 reduction values" are properly compensated is the most significant challenge in recovering such investment.

      *Interpretation.* That is roughly ¥300,000 per tonne of annual capacity, of which government support may cover up to 29%. The company is saying plainly that the green premium must be paid by customers or the state.
  - title: 'BP: operational emissions down, strategy reset'
    kind: real
    asOf: '2025-02'
    sources: [adv-oe-bp-reset-2025]
    body: |
      In February 2025 BP announced a "fundamentally reset" strategy: oil and gas investment rising to about $10 billion a year, investment in transition businesses cut to $1.5 to 2 billion a year (over $5 billion a year less than previous guidance), and all aims and targets of its previous strategy, including those first announced in August 2020, retired. It reported that scope 1 and 2 emissions from operations under its control were about 38% below 2019 levels, beyond its 20% target for 2025, and set a new aim of a 45 to 50% reduction by 2030, within five refreshed sustainability aims.

      *Interpretation.* Operational emissions (scopes 1 and 2) can fall sharply while a company invests more in oil and gas, whose use by customers lies outside those figures in scope 3. Which boundary matters depends on the question asked, and the reset shows that sustainability commitments are revised when they compete with returns.
  - title: 'Regulating green claims: the FCA anti-greenwashing rule'
    kind: real
    asOf: '2024-04'
    sources: [adv-oe-fca-fg24-3]
    body: |
      From 31 May 2024 every firm authorised by the UK's Financial Conduct Authority must ensure that any reference to the sustainability characteristics of its products and services is consistent with those characteristics and is fair, clear and not misleading. The FCA's guidance of April 2024 says claims should be correct and capable of being substantiated, clear, complete (not omitting important information, considering the full life cycle and not highlighting positive impacts while disguising negative ones), and fair and meaningful when they compare. The FCA says its approach is consistent with the Competition and Markets Authority's guidance on environmental claims.

      *Interpretation.* The rule covers financial products, but its tests are a good standard for any operations claim, such as "carbon neutral delivery" or "recyclable packaging".
cases:
  - title: "Ardent Coffee's carbon footprint"
    fictional: true
    situation: |
      Ardent Coffee (fictional) roasts beans and runs 60 cafés. Its first full inventory is below. The board is considering four measures: a renewable electricity tariff (a premium of £24,000 a year, avoiding 1,000 tonnes); an electric roaster (£96,000 a year more than gas once annualised, avoiding 800 tonnes); a programme with coffee farmers to adopt lower-emission practices (£150,000 a year, an estimated 2,000 tonnes, uncertain by half either way); and making oat milk the default, with dairy on request (no direct cost, an estimated 1,500 tonnes if 40% of milk drinks switch).
    exhibit:
      caption: Ardent Coffee, greenhouse gas emissions last year
      columns: [Source, Scope, Tonnes CO2e, Share of total]
      rows:
        - [Roasting gas and delivery vans, '1', '1,400', '7.0%']
        - [Purchased electricity, '2', '1,000', '5.0%']
        - [Green coffee beans, '3', '11,000', '55.0%']
        - [Milk, '3', '4,800', '24.0%']
        - [Packaging and cups, '3', '1,400', '7.0%']
        - [Waste, '3', '400', '2.0%']
        - [Total, 'All', '20,000', '100.0%']
      note: Scope 3 estimates for beans and milk use average emission factors per kilogram. Simulated data.
    questions:
      - Which scope dominates, and what does that imply about what Ardent can change alone and what it must do with suppliers and customers?
      - Rank the four measures by cost per tonne avoided. Why might the cheapest not be the best first step?
      - Emissions per cup fell 10% last year while cups sold rose 20%. What happened to absolute emissions?
      - Marketing proposes calling the coffee "carbon neutral" after buying offsets for 20,000 tonnes. Test the claim against the FCA's four criteria.
evaluation: |
  The measurement framework is settled in outline: the GHG Protocol's scopes are the global standard, and life cycle assessment is the accepted method for products. What is contested is how reliable the numbers are and what they can support. Scope 3 estimates are often spend-based and can move without any physical change; and ratings that combine environmental, social and governance data disagree strikingly between providers (Berg, Kölbel and Rigobon, 2022), so a firm can be a leader on one rating and a laggard on another.

  On whether sustainability pays, the honest summary is conditional. The evidence that regulation stimulates innovation is stronger than the evidence that it raises profits. Studies linking environmental performance to financial returns are mostly correlational: profitable firms can afford to invest, so the direction of causation is unclear.

  The Nippon Steel and BP applications point to the central practical debate: whether firms will decarbonise ahead of policy and customer demand. Nippon Steel ties its investment to subsidy and a market for low-carbon steel; BP cut its transition investment when returns elsewhere looked higher. One reading is that voluntary commitments are fragile and policy must do the work. Another is that both firms are allocating capital rationally and that commitments without a business case were never credible.

  Three further cautions apply. Offsets vary widely in quality, so claims built on them invite challenge. Circular models can cause rebound. And social audits are a weak guarantee of labour standards. Each is a reason to judge a sustainability claim by its mechanism and evidence rather than by its label.
decision:
  title: Meeting a recycled-content requirement at Corvid Packaging
  fictional: true
  brief: |
    Corvid Packaging (fictional) makes 40,000 tonnes of plastic food trays a year. Its largest customer, a supermarket, requires 50% recycled content by 2028 and will favour suppliers with lower carbon per tray. Food-grade recycled resin costs about £300 a tonne more than virgin resin, and supply is tight.
  options:
    - label: A. Buy recycled resin
      text: |
        Buy food-grade recycled resin on the market. No capital, but about £6 million a year at today's premium, with exposure to shortages and price spikes as other converters chase the same supply.
    - label: B. Build a closed loop
      text: |
        Invest £18 million in a washing and recycling plant fed by the supermarket's take-back scheme. Recycled resin would cost about £50 a tonne more than virgin at 80% utilisation, but collection volumes and food-safety approval are uncertain.
    - label: C. Redesign and contract
      text: |
        Redesign trays as a single material 20% lighter, and sign a seven-year contract with an independent recycler at a fixed premium of £200 a tonne. Moderate capital for new tooling, with some risk that lighter trays fail in use.
  criteria:
    - Cost per tonne of CO2 avoided
    - Security and quality of recycled feedstock
    - Food safety and product performance
    - Capital at risk and dependence on one customer
    - Credibility of the resulting claims
  guidance: |
    Begin with the hierarchy of impact. Using less material (C's lighter tray) avoids emissions before any recycling, and a single material makes trays easier to recycle, so C improves the underlying system as well as meeting the target. Its fixed-price contract also reduces exposure to a tight market.

    Option A is the fastest and least risky to the business's balance sheet, but it competes for scarce feedstock rather than adding to it; at a market level it may simply move recycled content from one buyer to another, a form of rebound, and its cost is open-ended.

    Option B creates new recycled supply and could become a capability, but it depends on one customer's take-back volumes and on food-safety approval, which makes it a large bet tied to one relationship. It suits Corvid only if the supermarket commits to volumes contractually or co-invests. A strong answer combines C now with A as a bridge, and keeps B as an option to pursue jointly with the customer. Whatever the choice, claims should state what is measured, over which part of the life cycle, and on what evidence.

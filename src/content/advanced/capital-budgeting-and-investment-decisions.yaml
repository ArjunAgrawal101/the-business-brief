  - source: adv-fin-brealey-myers-allen-2020
    note: The standard treatment of NPV, the cash flows to discount, IRR's pitfalls and real options, at MBA depth.
  - source: adv-fin-dixit-pindyck-1994
    note: The rigorous theory of irreversible investment under uncertainty and the value of waiting; demanding but foundational.
  - source: adv-fin-graham-harvey-2001
    note: The survey that shows how companies actually appraise investments and estimate their cost of capital.
  - source: adv-fin-flyvbjerg-holm-buhl-2002
    note: The evidence on cost underestimation in large projects, and the argument that some of it is deliberate.

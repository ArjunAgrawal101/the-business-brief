domain: strategy
title: Corporate strategy and restructuring
order: 2
dek: When does owning several businesses create more value than the businesses could create apart, and what should a company do when it does not?
audience: [undergraduate, mba, professional]
covers: [Corporate strategy, Corporate restructuring]
minutes: 30
updated: '2026-11-16'

bridge:
  codes: ['1.5', '1.3', '3.8']
  text: |
    In 1.5 the IB course treats growth: economies of scale, internal and external growth, and mergers, takeovers, joint ventures and franchising as methods. The toolkit adds the Ansoff and BCG matrices. The course does not ask the corporate-level question this module is about: whether a parent company adds value to the businesses it owns, and how investors judge that. The module adds the tests for diversification, parenting advantage, the evidence on the diversification discount and the instruments of restructuring, from demergers to Reverse Morris Trusts.

foundation: |
  Business strategy asks how to compete in one market; **corporate strategy** asks which businesses a company should own and how the centre should run them. The question matters because ownership is not free. Shareholders can diversify their own portfolios at almost no cost, so a company that owns unrelated businesses must do something for them that their owners could not do alone.

  The sources of corporate value are few: **sharing activities** such as a distribution network, **transferring skills** such as brand management, allocating capital better than outside markets would, and improving governance. The costs are reliable: a head office to pay for, slower decisions, cross-subsidies from strong businesses to weak ones, and management attention spread thin. Economies of scope alone do not justify ownership; Teece (1982) pointed out that a shared input can often be sold or licensed, so common ownership is needed only when contracting for it would be costly.

  **Corporate restructuring** is what companies do when the balance turns negative, or when investors or bidders decide it has: selling or spinning off businesses, merging others, changing the financial structure or redrawing the organisation. It is rarely neutral. It releases value when it removes a parent that was destroying it, and it destroys value when separation breaks links that were real.

advanced:
  - id: when-ownership-adds-value
    title: When ownership adds value
    body: |
      Porter (1987) set three tests for any diversification. The **attractiveness test**: the industry entered must be structurally attractive or capable of being made so. The **cost-of-entry test**: the price of entry must not capitalise all the future profits, which an acquisition at a full premium usually does. The **better-off test**: the new unit or the corporation must gain an advantage from the connection. Porter's study of large American diversifiers found that most of their acquisitions in unrelated fields were later divested.

      The tests can be quantified. A business earning €40 million a year after tax is worth €500 million to a buyer whose cost of capital is 8%. Paying €600 million for it fails the cost-of-entry test unless the connection produces at least €8 million a year of extra after-tax profit, for ever, since €8 million divided by 8% is the €100 million overpaid.

      Internal capital markets are the most debated source of value. Stein (1997) argued that headquarters, with better information than outside investors, can move capital from weak uses to strong ones. Scharfstein and Stein (2000) showed the other side: divisional managers lobby, and headquarters with weak incentives subsidise weak divisions at the expense of strong ones. Which effect dominates differs from firm to firm.

      Where institutions are thin, the balance shifts. Khanna and Palepu (1997) argued that diversified business groups in emerging markets fill **institutional voids**, substituting for missing capital markets, scarce managers and weak contract enforcement, so the advice to focus can be wrong there.

  - id: parenting-advantage
    title: Parenting advantage and the cost of the centre
    body: |
      Goold, Campbell and Alexander (1994) recast the question: a multibusiness company is justified only if its parent creates more value in its businesses than any rival parent could, including the stock market as the default owner. They called this **parenting advantage**. A parent adds value through its influence on each business (targets, appointments, challenge to plans), linkages between businesses, central functions and corporate development, and it destroys value through the same channels when its insights do not fit.

      Fit is the key concept. A parent whose skills suit capital-intensive, slow-cycle businesses, with rigorous capital approval and long planning horizons, can damage a fast-moving consumer business by imposing them. The authors classified businesses as **heartland** (strong fit, where the parent adds most), **ballast** (little added, little harm), **value traps** (apparent opportunities where the parent's influence misfires) and **alien territory**, which should be sold to better parents.

      The centre's cost is part of the test. If a head office costs €45 million a year and its measurable contributions, such as procurement savings, cheaper borrowing and shared services, total €30 million, the parent destroys €15 million a year before counting the harder-to-measure effects of its influence. A centre that cannot show its net contribution invites someone else to test it.

  - id: measuring-the-discount
    title: Measuring the diversification discount
    body: |
      Investors express their view of parenting in prices. The standard measure, from Berger and Ofek (1995), compares a diversified firm's market value with an imputed value: the sum of what each segment would be worth at the median multiple of focused firms in its industry. **Excess value** is the natural logarithm of actual over imputed value. If the segments valued at peers' multiples sum to €5,000 million and the group's enterprise value is €4,300 million, excess value is ln(4,300 / 5,000), about minus 0.15: a discount of 14%. Berger and Ofek found that diversified American firms traded on average 13 to 15% below their imputed values.

      The discount is not proof of value destruction. Campa and Kedia (2002) found that firms which choose to diversify were already trading at a discount before they did so, so part of the gap reflects selection rather than ownership. Villalonga (2004) found that with establishment-level data, which avoid the arbitrary segments companies report, the discount could turn into a premium. Diversification has no fixed effect on value; its effect depends on the parent, the businesses and the institutional setting.

  - id: restructuring-instruments
    title: Choosing a restructuring instrument
    body: |
      Once a business is judged better owned elsewhere, the instrument matters. A **trade sale** to a strategic buyer can capture part of the buyer's synergies in the price and returns cash, but may be taxable and depends on the buyer's financing. A sale to **private equity** brings speed and certainty, usually at a lower multiple. A **spin-off** or **demerger** hands shares in the business to existing shareholders, often tax-free, but raises no cash. A **carve-out** sells a minority stake through a listing, raising cash and setting a market price while keeping control. A **Reverse Morris Trust**, a US structure, spins a business off and merges it with another company in one transaction, tax-efficiently, provided the seller's shareholders end up with a majority of the combined firm.

      Every separation carries costs that the headline value ignores: **stranded costs** (head-office functions that do not shrink with the portfolio), **dis-synergies** such as lost purchasing scale, one-off separation costs, and **transitional service agreements**, under which the former parent runs systems or logistics for a period. A demerger that unlocks €600 million on paper but adds €20 million a year of stranded and duplicated costs, capitalised at ten times, and €60 million of one-off costs, nets €340 million.

      Restructuring is often forced from outside. Jensen (1986) argued that managers of cash-rich firms overinvest in growth and diversification, and that debt, payouts and the threat of takeover discipline them. A bid at a premium is a public claim that the board is not maximising value, and boards that resist commonly respond by doing much of what the bidder would have done.

models:
  - name: Porter's three tests
    origin: Porter (1987)
    summary: |
      A diversification creates value only if it passes three tests: the industry is attractive, the cost of entry does not capitalise the future profits, and the new unit or the corporation gains an advantage from the connection, the better-off test.
    use: |
      Apply the tests to any proposed move into a new business, typically one the Ansoff matrix classes as diversification. Quantify the cost-of-entry test by comparing the price with the value of the business's own cash flows and stating the yearly synergy needed to close the gap. Then name the mechanism of the better-off test and who must change what to deliver it.
    limits: |
      The tests judge a single move, not the whole portfolio, and they assume synergy can be estimated before entry, when much of it is discovered or lost in integration. They say little about the institutional settings in which unrelated diversification can make sense.
    framework: ansoff-matrix
    tool: /strategy-studio/ansoff/
    sources: [adv-strat-porter-1987]
  - name: Parenting advantage
    origin: Goold, Campbell and Alexander (1994)
    summary: |
      A multibusiness company is justified only if its parent creates more value in its businesses than any other owner could, including the stock market. That value depends on the fit between the parent's skills and each business's critical success factors.
    use: |
      For each business, list the parent's influence (targets, appointments, capital approval, shared services, linkages) and ask whether each adds or subtracts value given the business's needs. Classify the businesses as heartland, ballast, value trap or alien territory, and cost the centre against its measurable contribution. Businesses that another parent would serve better are candidates for separation.
    limits: |
      Parenting value is hard to measure, so the analysis rests on judgement and is exposed to the centre's own optimism. It treats the parent's skills as fixed, though parents can learn, and it underweights financial motives such as tax, risk and access to capital.
    sources: [adv-strat-goold-campbell-alexander-1994]
  - name: The growth-share matrix
    origin: Henderson (1970)
    summary: |
      The Boston Consulting Group's matrix classified businesses by market growth and relative market share, assuming that share drives cost through the experience curve and growth drives cash needs. Cash from low-growth leaders funds high-growth businesses that can become leaders.
    use: |
      Use it as a first view of a portfolio's cash dynamics: which businesses generate cash, which absorb it, and whether that balance will hold. Then go further: test whether relative share really drives cost in each industry, and judge each business by its value under the best owner rather than by its quadrant.
    limits: |
      Its premise, that a company must fund growth from its own cash, assumes capital markets that do not work; where they do, internal balance is no goal in itself. Share is a poor proxy for advantage where experience effects are weak, and the labels can become self-fulfilling when businesses labelled dogs are starved of investment.
    framework: bcg-matrix
    tool: /strategy-studio/bcg-matrix/
    sources: [adv-strat-henderson-1970]
  - name: Excess value
    origin: Berger and Ofek (1995)
    summary: |
      Excess value is the natural logarithm of a diversified firm's market value over the sum of its segments valued at focused peers' multiples. A negative figure is a discount: the market's estimate of what the combination costs.
    use: |
      Value each segment at the median multiple of focused peers, deduct the capitalised net cost of the centre, sum, and compare with the group's enterprise value. Then ask whether the gap reflects the parent's influence or other causes, such as segment definitions, the choice of peers and the firm's value before it diversified.
    limits: |
      Peer multiples are rough, reported segments are arbitrary, and firms diversify for reasons that also affect value, so a discount is a symptom to investigate, not a verdict. A break-up value also ignores separation costs and dis-synergies.
    sources: [adv-strat-berger-ofek-1995, adv-strat-villalonga-2004]

applications:
  - title: 'Unilever: two separations, one corporate logic'
    kind: real
    asOf: '2026-03'
    body: |
      **What the company reported.** In March 2024 Unilever's board decided to separate its ice cream business, which had 2023 turnover of €7.9 billion, because it had a very different operating model: a supply chain and point of sale for frozen goods, different channels, more seasonality and greater capital intensity. The Magnum Ice Cream Company began standalone operations on 1 July 2025 and was demerged on 6 December 2025; shareholders received one share for every five Unilever shares, and Unilever kept a stake below 20%. On 31 March 2026 Unilever agreed to combine most of its Foods business (2025 revenue €10.7 billion, underlying operating profit €2.55 billion) with McCormick in a Reverse Morris Trust valuing it at $44.8 billion, 13.8 times EBITDA. Unilever and its shareholders are to receive 65% of the combined company and $15.7 billion in cash; the companies expect about $600 million of annual cost synergies, and Unilever expects €400 to 500 million of stranded costs. Completion is expected by mid-2027.

      **What it suggests.** Both moves apply one corporate logic: keep only businesses that share a demand-creation model, routes to market and research platforms, leaving what Unilever describes as a €39 billion home and personal care company. In parenting terms, ice cream and foods had become businesses that another owner could serve better. The instruments differ for a reason: the demerger returned ice cream to shareholders without cash, while the McCormick structure realises cash and synergies, tax-efficiently, by giving Foods a new parent.
    sources: [adv-strat-unilever-2024, adv-strat-unilever-tmicc, adv-strat-unilever-mccormick-2026]
  - title: 'Anglo American: restructuring under the pressure of a bid'
    kind: real
    asOf: '2026-05'
    body: |
      **What the company reported.** In April and May 2024 Anglo American's board rejected three takeover proposals from BHP, objecting to their value and to a structure that required two South African demergers alongside the takeover. On 14 May 2024 it set out its own plan: keep copper, premium iron ore and crop nutrients; sell steelmaking coal and nickel; demerge Anglo American Platinum; and divest or demerge De Beers. It said the simplified group's pro forma EBITDA margin would rise from 31% to 46%. The platinum business, renamed Valterra Platinum, was demerged on 31 May 2025, with Anglo keeping about 19.9%. A November 2024 agreement to sell the coal business to Peabody for up to $3.775 billion did not complete: Peabody relied on an incident at the Moranbah North mine to terminate it, which Anglo disputes in arbitration, and in May 2026 Anglo agreed a new sale to Dhilmar for up to $3.875 billion. In September 2025 Anglo agreed a merger of equals with Teck, under which its shareholders would own about 62.4% of the combined company and receive a $4.5 billion special dividend, with about $800 million of annual synergies expected.

      **What it suggests.** The sequence illustrates Jensen's market for corporate control: a bid exposed a gap between the group's value and the sum of its parts, and the board closed it by doing much of what the bidder had proposed. It also shows the execution risk in divestment: a signed sale is not cash until completion, and a buyer may use a material adverse change clause to walk away.
    sources: [adv-strat-aal-bhp-2024, adv-strat-aal-strategy-2024, adv-strat-aal-bhp-response-2024, adv-strat-aal-valterra-2025, adv-strat-aal-coal-2024, adv-strat-aal-coal-2026, adv-strat-aal-teck-2025]

cases:
  - title: Halvorsen Industries and the activist
    fictional: true
    situation: |
      Halvorsen Industries is a fictional listed group with four divisions built up through acquisitions over thirty years. Its head office approves all capital spending above €2 million, runs a shared IT platform and negotiates steel and freight contracts for the two manufacturing divisions, saving them an estimated €12 million a year. An activist investor holding 6% of the shares argues that the group is worth far more in pieces and asks the board to demerge water metering and sell industrial software.

      Halvorsen's market capitalisation is €2,100 million and its net debt €690 million. Advisers estimate that full separation would cost €60 million once, and that the separated companies would together need €20 million a year more in head-office and IT costs than the group spends today, on top of losing the €12 million of purchasing savings.
    exhibit:
      caption: 'Halvorsen Industries: divisions valued at focused peers'' multiples'
      columns: ['Division', 'Revenue (€m)', 'EBIT (€m)', 'Peers'' EV/EBIT', 'Value at peer multiple (€m)']
      rows:
        - ['Marine propulsion', '1,200', '150', '11.0', '1,650']
        - ['Building products', '900', '72', '9.0', '648']
        - ['Water metering', '450', '63', '14.0', '882']
        - ['Industrial software', '150', '30', '22.0', '660']
        - ['Head-office costs', '', '(45)', '10.0', '(450)']
        - ['Group', '2,700', '270', '', '3,390']
      note: Simulated data. EBIT of the two manufacturing divisions includes €12 million a year of purchasing savings negotiated by head office. Head-office costs are capitalised at 10 times.
    questions:
      - Calculate Halvorsen's enterprise value from its market capitalisation and net debt, and its excess value against the sum of the parts. How large is the discount?
      - Recalculate the gain from separation after the €60 million of one-off costs, the €20 million of extra annual costs and the loss of the €12 million of savings, capitalising annual amounts at 10 times. Is the activist's case still strong?
      - Classify each division as heartland, ballast, value trap or alien territory for Halvorsen's head office, and justify each from the case.
      - Which instrument would you use for water metering and for industrial software, and why?

evaluation: |
  **Is there a diversification discount?** That diversified firms on average trade below the sum of comparable focused firms is a well-replicated finding in American data, with Berger and Ofek's 13 to 15% the reference estimate. Whether diversification causes the discount is contested: selection (Campa and Kedia, 2002) and measurement (Villalonga, 2004) explain much or all of it in some samples. The established claim is therefore narrow: on average diversification is not rewarded, but it does not follow that every diversified firm destroys value.

  **Does focus pay?** Cusatis, Miles and Woolridge (1993) found positive returns for spun-off firms and their parents, concentrated among those later involved in takeovers, which suggests that separation often prepares assets for a better owner. Interpretation: favourable market reactions measure expectations, while stranded costs, lost scale and new governance risks appear only later.

  **Where conglomerates can work.** Khanna and Palepu's argument that business groups fill institutional voids is strong in logic and mixed in evidence across countries. It predicts that the advantage of groups shrinks as markets and institutions develop.

  **Restructuring and power.** In this module, Anglo American's restructuring followed a takeover approach, and the fictional Halvorsen case begins with an activist. Supporters see the market for corporate control working as Jensen described; critics argue that it pushes companies towards short-term break-up values and against long-horizon investment that only a diversified parent could fund. The evidence does not settle which effect dominates, and the answer probably differs by industry.

decision:
  title: 'Corvel Group: what to do with a business that no longer fits'
  fictional: true
  brief: |
    Corvel Group is a fictional listed company with two divisions. Flow control (revenue €1.8 billion, EBIT margin 12%) makes pumps and valves for utilities. Diagnostics (revenue €600 million, EBIT margin 21%) makes laboratory instruments and consumables, grows at 9% a year and was bought twelve years ago when the group wanted growth. The divisions share no customers or technology, and head office costs €30 million a year. Focused diagnostics peers trade at 19 times EBIT and flow-control peers at 11 times; Corvel trades at 11.5 times group EBIT. The chief executive argues that diagnostics is the group's growth story; two large shareholders want it separated.
  options:
    - label: Demerge diagnostics
      text: Hand diagnostics shares to Corvel's shareholders. No cash is raised, the two companies need their own boards and functions, adding about €15 million a year of costs, and diagnostics loses the group's balance sheet.
    - label: Sell diagnostics to a strategic buyer
      text: Run an auction among larger diagnostics groups, which could pay for part of their synergies. This raises cash for buybacks or debt reduction, but tax on the gain and the buyer's financing are uncertain.
    - label: Carve out a minority stake
      text: List 20% of diagnostics, keep control and let the market price show its value. This raises some cash and keeps options open, but the parent's influence and the conflicts of a partly owned subsidiary remain.
    - label: Keep and reform
      text: Keep both divisions, cut head-office costs to €18 million, give diagnostics its own capital budget and incentives, and report it separately. This is cheapest, but the discount may persist if investors doubt that the parent adds value.
  criteria:
    - Value at peers' multiples against the group's current value
    - Net gain after separation costs, stranded costs and dis-synergies
    - Whether Corvel passes the better-off test for diagnostics
    - Cash, tax and execution risk of each instrument
    - What shareholders, employees and the diagnostics team need from the outcome
  guidance: |
    Begin with the numbers. At peers' multiples, flow control's €216 million of EBIT is worth about €2.4 billion and diagnostics' €126 million about €2.4 billion; after capitalising head-office costs at ten times, the parts are worth about €4.5 billion, against a group value of about €3.6 billion. That gap is large enough to survive plausible separation costs, so keeping the group must rest on what the parent adds to diagnostics that another owner could not. With no shared customers or technology, the better-off test is hard to pass.

    Among the separations, the choice turns on who should own diagnostics next and what shareholders want. A sale can capture a strategic buyer's synergies and return cash, but tax and execution risk can eat into it. A demerger is cheaper in tax and lets shareholders choose, but returns no cash and creates a small listed company. A carve-out tests the market's valuation without giving up control, and is often a first step rather than an answer.

    A strong answer takes the chief executive's growth argument seriously and then tests it: growth is worth more to shareholders only if Corvel's ownership makes it more profitable, or cheaper to fund, than it would be under another owner.

reading:
  - source: adv-strat-porter-1987
    note: The source of the three tests, and of the uncomfortable record of large diversified American companies.
  - source: adv-strat-goold-campbell-alexander-1994
    note: The fullest account of parenting advantage, with the parenting fit matrix and many examples of parents that destroyed value.
  - source: adv-strat-prahalad-hamel-1990
    note: The case for building a diversified company around shared competences rather than a portfolio of units. Read it against Goold and his colleagues.
  - source: adv-strat-berger-ofek-1995
    note: The reference measure and estimate of the diversification discount.
  - source: adv-strat-villalonga-2004
    note: How the discount depends on measurement. Read it with Campa and Kedia (2002) for the selection argument.
  - source: adv-fin-jensen-1986
    note: Free cash flow and the market for corporate control, and why outside pressure drives so much restructuring.
  - source: adv-strat-khanna-palepu-1997
    note: Why focus may be the wrong advice where markets and institutions are thin.

basis:
  - source: adv-strat-teece-1982
    note: Economies of scope and the case for common ownership.
  - source: adv-strat-stein-1997
    note: The bright side of internal capital markets.
  - source: adv-strat-scharfstein-stein-2000
    note: The dark side of internal capital markets.
  - source: adv-strat-campa-kedia-2002
    note: Selection as an explanation of the discount.
  - source: adv-strat-cusatis-miles-woolridge-1993
    note: Returns to spin-offs and their parents.

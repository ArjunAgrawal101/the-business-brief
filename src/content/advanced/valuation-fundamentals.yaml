    note: The practitioner's standard on discounted cash flow, return on invested capital and the value of growth.
  - source: adv-fin-damodaran-2012
    note: A comprehensive reference across intrinsic, relative and option-based valuation, with many special cases.
  - source: adv-fin-kaplan-ruback-1995
    note: The classic test of how close discounted cash flow values come to the prices actually paid.
  - source: adv-fin-liu-nissim-thomas-2002
    note: Which valuation multiples work best, and why forward earnings beat sales.

# Enrichment map: entrepreneurship and new ventures, for the undergraduate
# and MBA pathways. Beyond the IB course. The platform's own summary,
# organized around the life of a venture from idea to growth.
title: Entrepreneurship and new ventures
scope: enrichment
audience: [undergraduate, mba]
field: Enterprise
order: 6
summary: How a new venture turns an opportunity into a business, from finding and testing ideas and designing the business model to financing under uncertainty and growing without running out of cash.
centre: New ventures
branches:
  - label: Opportunities
    kind: concept
    children:
      - label: Opportunities are found and made
        term: unmet-need
        core: true
        note: Some are discovered in unmet needs; others are created by acting and learning.
      - label: Gaps in the market
        term: gap-in-the-market
      - label: Start from the means at hand
        note: Who you are, what you know and whom you know (Sarasvathy's effectuation).
      - label: Risk only what you can afford to lose
        note: Affordable loss, rather than a forecast of expected return.
  - label: Testing the idea
    kind: tool
    children:
      - label: Write the assumptions down as hypotheses
        core: true
        note: Then test the riskiest one first.
      - label: Minimum viable product
        core: true
        note: The smallest offer that shows whether customers will pay.
      - label: Product-market fit
        term: product-market-fit
        note: Customers keep buying and recommending without being pushed.
      - label: Pivot or persevere
        term: pivot
        note: Change one part of the model when the evidence says so.
  - label: The business model
    kind: concept
    term: business-model
    children:
      - label: A value proposition for a chosen customer
        term: value-proposition
        core: true
      - label: Channels, relationships and revenue streams
        term: revenue-stream
      - label: Key resources, activities and partners
      - label: Unit economics
        term: contribution-per-unit
        core: true
        note: Contribution per customer must repay the cost of winning them, then the fixed costs.
      - label: Months to win back the cost of a customer
        kind: formula
        formula: 'Payback months = acquisition cost per customer ÷ monthly contribution per customer'
  - label: Financing a venture
    kind: types
    children:
      - label: Bootstrapping and personal funds
        kind: type
        term: personal-funds
      - label: Business angels
        kind: type
        term: business-angel
      - label: Venture capital
        kind: type
        term: venture-capital
        note: Equity in stages for fast-growing firms, in return for a large share of the upside.
      - label: Crowdfunding
        kind: type
        term: crowdfunding
      - label: Runway
        kind: formula
        term: runway
        core: true
        formula: 'Runway in months = cash available ÷ monthly net cash outflow'
        note: The monthly net outflow is often called the burn rate.
      - label: Dilution
        term: dilution
        note: Each equity round shrinks the founders' share, though the stake can still grow in value.
  - label: Growing the venture
    kind: application
    children:
      - label: Growth that outruns its cash
        term: overtrading
        core: true
      - label: From founder to manager
        term: delegation
        note: Delegation and structure become unavoidable as the team grows.
      - label: Protecting ideas
        term: intellectual-property
      - label: Ventures with a social purpose
        term: social-entrepreneur
  - label: Judging a venture
    kind: evaluation
    children:
      - label: What is the riskiest assumption?
        kind: question
        core: true
      - label: Survivorship bias
        kind: limitation
        core: true
        note: Famous successes hide the many that did the same things and failed.
      - label: A business plan is a hypothesis
        kind: limitation
        term: business-plan
builds:
  - code: '1.1'
    label: Entrepreneurship and the opportunities and challenges of starting up
  - code: '1.2'
    label: Choosing a legal form
  - code: '3.2'
    label: Personal funds, business angels and crowdfunding
  - code: '3.7'
    label: Cash flow forecasts
  - code: '5.5'
    label: Contribution and break-even
related:
  - map: corporate-finance
    label: Financing and valuing growth
  - map: strategy-formulation
    label: From one product to a strategy
basis:
  note: >
    The platform's own summary of established ideas about new ventures, written for the undergraduate and
    MBA pathways. It goes beyond the IB course and is aligned to no university course or textbook, because
    none was supplied. Ideas are named with the people usually credited with them; their works were not
    opened for this map.

# Enrichment map: corporate governance, for the MBA and undergraduate
# pathways. Beyond the IB course. The platform's own summary, organized
# around why governance exists, who governs, for whom, and how it is checked.
title: Corporate governance
scope: enrichment
audience: [mba, undergraduate]
field: Governance
order: 7
summary: How companies are directed and controlled, from the agency problem and the board's duties to whose interests come first, executive pay, audit and disclosure, and the checks that keep power accountable.
centre: Corporate governance
branches:
  - label: Why governance exists
    kind: concept
    children:
      - label: How a company is directed and controlled
        kind: definition
        core: true
      - label: The owners are not the managers
        term: divorce-of-ownership-and-control
        core: true
      - label: The agency problem
        core: true
        note: Managers may serve their own interests; monitoring and incentives cost money (Jensen and Meckling).
      - label: Insiders know more
        note: Managers know more than shareholders and lenders, who must rely on what they are told.
  - label: The board
    kind: concept
    children:
      - label: Sets strategy, appoints and oversees management
        core: true
      - label: Executive and independent non-executive directors
        kind: type
        core: true
        note: Independent directors bring scrutiny without a stake in day-to-day decisions.
      - label: Committees for audit, pay and appointments
        kind: type
      - label: A separate chair and chief executive
        note: One runs the board, the other runs the company.
      - label: Directors owe duties to the company
        note: Good faith, care and skill, and avoiding conflicts of interest; each country's law sets the detail.
  - label: Whose interests come first?
    kind: theory
    children:
      - label: Shareholder primacy
        kind: type
        term: shareholder-value
        core: true
        note: Run the company for its owners' long-run value.
      - label: The stakeholder view
        kind: type
        term: stakeholder-concept
        core: true
        note: Balance employees, customers, suppliers, communities and owners.
      - label: Enlightened shareholder value
        note: Long-run value for owners depends on treating stakeholders well.
      - label: Map power and interest
        term: stakeholder-mapping
  - label: Incentives and accountability
    kind: application
    children:
      - label: Pay tied to long-term performance
        core: true
        note: Badly designed targets invite short-termism and gaming.
      - label: Shareholder votes and engagement
        note: Votes on directors and pay, and stewardship by large investors.
      - label: Independent audit and disclosure
        core: true
        note: Assurance that the accounts are fairly presented.
      - label: Flattering accounts
        term: window-dressing
        note: What audit and disclosure rules try to stop.
      - label: Safe channels to raise concerns
        note: Whistleblowing routes let insiders report wrongdoing.
  - label: Judging governance
    kind: evaluation
    children:
      - label: Who can challenge the chief executive, and do they?
        kind: question
        core: true
      - label: Compliance in form, not in spirit
        kind: limitation
        core: true
        note: Ticking the boxes of a code without changing behaviour.
      - label: Rules differ by country
        note: Some countries rely on codes applied on a comply-or-explain basis, others mainly on law.
      - label: Ownership changes the problem
        kind: limitation
        term: privately-held-company
        note: Family and state owners create different conflicts from those of dispersed shareholders.
builds:
  - code: '1.2'
    label: Privately and publicly held companies
  - code: '1.3'
    label: Objectives and corporate social responsibility
  - code: '1.4'
    label: Stakeholders, their conflicts and stakeholder mapping
  - code: '3.4'
    label: The final accounts that audit checks
related:
  - map: corporate-finance
    label: How profit is shared between payout and reinvestment
  - map: sustainability-strategy
    label: Boards and environmental and social risk
  - map: organizational-behaviour
    label: Incentives and behaviour
basis:
  note: >
    The platform's own summary of established ideas about corporate governance, written for the MBA and
    undergraduate pathways. It goes beyond the IB course and is aligned to no university course or
    textbook, because none was supplied. It states no country's law or code; each sets its own rules.
    Ideas are named with the people usually credited with them; their works were not opened for this map.

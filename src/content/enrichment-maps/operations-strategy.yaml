# Enrichment map: operations strategy, for the undergraduate and MBA
# pathways. Beyond the IB course. The platform's own summary, organized
# around what operations must deliver and the choices that deliver it.
title: Operations strategy
scope: enrichment
audience: [undergraduate, mba]
field: Operations
order: 5
summary: How operations help an organization compete, from the performance it must deliver and the trade-offs between objectives to process, capacity, supply networks and continuous improvement.
centre: Operations strategy
branches:
  - label: What operations must deliver
    kind: concept
    note: Which objective matters most depends on how the firm competes.
    children:
      - label: Quality
        kind: type
        term: quality
        core: true
      - label: Speed
        kind: type
        core: true
      - label: Dependability
        kind: type
        core: true
        note: Delivering when promised.
      - label: Flexibility
        kind: type
        core: true
        note: Changing what is made, how much, or when.
      - label: Cost
        kind: type
        core: true
      - label: Order winners and qualifiers
        note: Qualifiers get a firm considered; order winners make the customer choose it.
  - label: Trade-offs and focus
    kind: theory
    children:
      - label: No operation excels at everything
        core: true
        note: Choosing a priority means accepting weakness elsewhere.
      - label: The focused factory
        note: A plant with a narrow task beats one asked to do everything (Skinner).
      - label: Lean narrows some trade-offs
        term: lean-production
        note: Removing waste can improve cost and quality together.
  - label: Process and capacity
    kind: types
    children:
      - label: Volume and variety set the process
        term: job-production
        core: true
        note: From one-off jobs through batches to mass and continuous flow.
      - label: Mass customization
        term: mass-customization
      - label: Lead, lag or track demand
        core: true
        note: Leading risks idle capacity; lagging risks lost sales.
      - label: Queues grow fast near full capacity
        term: capacity-utilization-rate
        note: When demand varies, waiting times rise steeply as utilization approaches 100%.
      - label: "Little's law"
        kind: formula
        formula: 'Work in progress = throughput × lead time'
        note: At the same throughput, less work in progress means a shorter lead time.
  - label: Supply networks
    kind: application
    children:
      - label: Make or buy
        term: make-or-buy-analysis
        core: true
      - label: Offshore or reshore
        term: offshoring
        note: Lower costs weighed against distance, risk and control.
      - label: Resilience against efficiency
        term: just-in-case
        core: true
        note: Buffers and second suppliers cost money but absorb shocks.
      - label: The bullwhip effect
        note: Small changes in customer demand grow into large swings further up the chain.
  - label: Improvement
    kind: tool
    children:
      - label: Continuous improvement
        term: kaizen
        core: true
      - label: Total quality management
        term: total-quality-management
      - label: Six Sigma reduces variation
        note: Data-driven projects that cut defects.
      - label: Learn from the best performers
        term: benchmarking
  - label: Judging an operations strategy
    kind: evaluation
    children:
      - label: Does operations support how the firm competes?
        kind: question
        core: true
      - label: Efficiency can erode resilience
        kind: limitation
        core: true
      - label: Circular models change the cost equation
        term: circular-business-models
builds:
  - code: '5.2'
    label: Job, batch, mass and flow production, and mass customization
  - code: '5.3'
    label: 'HL: lean production and quality management'
  - code: '5.4'
    label: Location, outsourcing, offshoring and reshoring
  - code: '5.6'
    label: 'HL: supply chains, stock and capacity'
related:
  - map: strategy-formulation
    label: The position operations must support
  - map: sustainability-strategy
    label: Circular models and supply chain responsibility
basis:
  note: >
    The platform's own summary of established operations ideas, written for the undergraduate and MBA
    pathways. It goes beyond the IB course and is aligned to no university course or textbook, because none
    was supplied. Ideas are named with the people usually credited with them; their works were not opened
    for this map.

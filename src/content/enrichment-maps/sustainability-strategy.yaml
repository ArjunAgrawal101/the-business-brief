# Enrichment map: sustainable business strategy, for the undergraduate and
# MBA pathways. Beyond the IB course. The platform's own summary, organized
# from framing and measuring impact to responses, models and judgement.
title: Sustainable business strategy
scope: enrichment
audience: [undergraduate, mba]
field: Sustainability
order: 8
summary: How organizations treat environmental and social impact as a strategic question, from framing and measuring it to choosing a response, redesigning the business model and telling real progress from greenwashing.
centre: Sustainable business strategy
branches:
  - label: Framing sustainability
    kind: concept
    children:
      - label: Meeting present needs without harming future generations
        kind: definition
        core: true
        note: The United Nations definition of 1987, which the IB guide also quotes.
      - label: Three measures of performance
        term: triple-bottom-line
        core: true
        note: People, planet and profit.
      - label: Shared value
        note: Profitable ways of meeting social needs (Porter and Kramer).
      - label: Responsibility beyond the law
        term: corporate-social-responsibility
  - label: Measuring impact
    kind: tool
    children:
      - label: Materiality
        core: true
        note: Which issues matter most to the business and to its stakeholders.
      - label: Greenhouse gas scopes 1, 2 and 3
        core: true
        note: Direct emissions, purchased energy, and the rest of the value chain.
      - label: Life cycle assessment
        note: Impacts from raw materials to disposal.
      - label: ESG ratings disagree
        kind: limitation
        note: Rating agencies use different methods, so one firm can receive very different scores.
  - label: Strategic responses
    kind: types
    children:
      - label: Comply with the law
        kind: type
      - label: Cut waste, energy and materials
        kind: type
        term: waste
        note: Often saves money as well.
      - label: Differentiate on credible benefits
        kind: type
        note: Customers pay more only for claims they trust.
      - label: Change the business model
        kind: type
        term: circular-business-models
        core: true
  - label: Circular business models
    kind: application
    children:
      - label: Design for reuse
        term: cradle-to-cradle-design
        core: true
      - label: Sell the use, not the product
        term: product-service-system-model
      - label: Recover value from waste
        term: resource-recovery-model
      - label: Share under-used items
        term: sharing-model
      - label: Keep products in use for longer
        term: product-life-extension-model
  - label: Stakeholder pressure
    kind: concept
    children:
      - label: Investors, regulators, customers and employees
        core: true
      - label: Campaigns by pressure groups
        term: pressure-group
      - label: Responsibility for suppliers' practices
        term: supply-chain
        note: Labour and environmental standards at suppliers' sites.
  - label: Judging claims and choices
    kind: evaluation
    children:
      - label: Greenwashing
        kind: limitation
        core: true
        note: Claims that overstate environmental benefits.
      - label: Is the change material to the core business?
        kind: question
        core: true
      - label: Some sustainable choices cost more
        kind: limitation
        note: The trade-off is real, at least in the short run.
      - label: Environmental risk can become financial risk
        note: Through regulation, physical damage and changing demand.
builds:
  - code: '1.1'
    label: Circular business models
  - code: '1.3'
    label: Ethical objectives and corporate social responsibility
  - code: '1.4'
    label: Stakeholders and pressure groups
  - code: '5.3'
    label: 'HL: cradle to cradle design and lean production'
related:
  - map: corporate-governance
    label: How boards oversee environmental and social risk
  - map: operations-strategy
    label: Supply chains and circular operations
  - map: marketing-strategy
    label: Claims customers can trust
basis:
  note: >
    The platform's own summary of established ideas about sustainable business, written for the
    undergraduate and MBA pathways. It goes beyond the IB course and is aligned to no university course or
    textbook, because none was supplied. Ideas are named with the people usually credited with them; their
    works were not opened for this map.
  sources:
    - source: ib-bm-guide-2024
      pages: '13'
      for: The definition of sustainability the guide quotes from the United Nations (1987)

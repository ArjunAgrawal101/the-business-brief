# Enrichment map: leading change and transformation, for the MBA and
# undergraduate pathways. Beyond the IB course. The platform's own summary,
# organized around the kinds of change, how to lead it and how to judge it.
title: Leading change
scope: enrichment
audience: [mba, undergraduate]
field: Leadership
order: 9
summary: How leaders take an organization through change, from the kinds of change and the models that guide it to leading people, resistance and culture, and how a transformation is sequenced and made to last.
centre: Leading change
branches:
  - label: Kinds of change
    kind: types
    children:
      - label: Incremental or transformational
        kind: type
        core: true
        note: Adjusting the current way of working, or replacing it.
      - label: Planned or emergent
        kind: type
        note: Designed at the top, or grown from local adaptation.
      - label: Turnaround
        kind: type
        core: true
        note: Rescue under pressure; stabilize first, then rebuild.
  - label: Models of change
    kind: theory
    children:
      - label: Unfreeze, change, refreeze
        core: true
        note: Commonly credited to Lewin, though historians debate how far he set it out as a model.
      - label: Weigh the forces for and against
        term: force-field-analysis
        core: true
      - label: An eight-step process
        note: Urgency, a coalition, a vision, communication, removing obstacles, quick wins, consolidating, embedding (Kotter).
      - label: Endings before beginnings
        note: People must let go of the old way before they commit to the new (Bridges).
  - label: Leading people through it
    kind: concept
    children:
      - label: Transformational leadership
        term: leadership
        core: true
        note: Building commitment to a shared vision, beyond trading reward for effort.
      - label: Match the style to people's readiness
        term: situational-leadership
      - label: Involvement builds ownership
        term: employee-participation
      - label: Explain why, what, and what it means for each person
        core: true
  - label: Resistance and culture
    kind: application
    children:
      - label: Resistance has causes
        term: resistance-to-change
        core: true
        note: Fear of losing status, security or competence; distrust; a weak case for change.
      - label: Culture changes most slowly
        term: organizational-culture
      - label: Culture clashes undermine mergers
        term: culture-clash
        note: Integration plans that ignore culture often lose the value the deal promised.
      - label: Systems must reward the new behaviour
        note: New values fail if pay and processes still reward the old ones.
  - label: Sequencing a transformation
    kind: tool
    children:
      - label: Stabilize cash and operations first
        core: true
        note: In a crisis, buy time before redesigning anything.
      - label: Quick wins build credibility
        note: Visible early results win over sceptics.
      - label: Pilot, then scale
        note: Test a change where failure is cheap.
      - label: Measure adoption, not announcements
        core: true
  - label: Judging a change programme
    kind: evaluation
    children:
      - label: Step models are guides, not proven recipes
        kind: limitation
        core: true
        note: Most of the evidence for them comes from case studies.
      - label: What would keep people in the old way?
        kind: question
        core: true
      - label: Change fatigue
        kind: limitation
        note: Too many initiatives at once exhaust commitment.
builds:
  - code: '2.1'
    label: Resistance to change and change management
  - code: '2.3'
    label: Leadership styles, including situational leadership
  - code: '2.5'
    label: 'HL: organizational culture and culture clash'
  - code: '5.7'
    label: 'HL: crisis management and contingency planning'
related:
  - map: organizational-behaviour
    label: Motivation, teams and power during change
  - map: strategy-formulation
    label: The strategy the change serves
basis:
  note: >
    The platform's own summary of established ideas about leading change, written for the MBA and
    undergraduate pathways. It goes beyond the IB course and is aligned to no university course or
    textbook, because none was supplied. Models are named with the people usually credited with them; their
    works were not opened for this map.
  sources:
    - source: lewin-1951
      for: Force field analysis
    - source: hersey-blanchard
      for: Matching leadership to people's readiness

# Enrichment map: marketing strategy, for the undergraduate and MBA pathways.
# Beyond the IB course. The platform's own summary, organized around whom to
# serve, what to promise and how to capture and measure the value.
title: Marketing strategy
scope: enrichment
audience: [undergraduate, mba]
field: Marketing
order: 4
summary: How an organization decides whom to serve, what value to promise and how to capture it, through customer insight, segmentation and positioning, brands and loyalty, pricing and measurement.
centre: Marketing strategy
branches:
  - label: Customer value
    kind: concept
    children:
      - label: The benefit customers perceive, less what it costs them
        kind: definition
        core: true
        note: The cost includes price, time, effort and risk.
      - label: Start from the customer, not the factory
        term: market-orientation
        core: true
      - label: The job the customer wants done
        note: Frame needs as the progress customers seek, not as product features.
      - label: What customers do can differ from what they say
        note: Insight comes from behaviour as well as from surveys.
  - label: Segment, target, position
    kind: types
    children:
      - label: Segment on needs and behaviour, not only age or income
        kind: type
        term: market-segmentation
        core: true
      - label: Target the segments you can serve at a profit
        kind: type
        term: target-market
        core: true
      - label: Position clearly and credibly against rivals
        kind: type
        term: positioning
        core: true
      - label: Map customers' perceptions, not the firm's opinions
        term: position-map
  - label: Brands and loyalty
    kind: theory
    children:
      - label: Brand equity
        kind: definition
        term: brand-value
        core: true
        note: 'The value a brand adds: price premiums, loyalty and easier launches.'
      - label: Customer lifetime value
        kind: formula
        core: true
        formula: 'CLV = annual margin × r ÷ (1 + i − r)'
        note: r is the yearly retention rate and i the discount rate; a simple form that assumes steady margins.
      - label: Keeping customers against winning new ones
        note: Retention is often cheaper than acquisition, but that has to be measured, not assumed.
      - label: Loyalty schemes gather data as well as visits
        term: customer-loyalty-programme
  - label: Pricing
    kind: application
    children:
      - label: Price from the value to the customer
        core: true
        note: Bounded by cost below and by rivals' offers.
      - label: Elasticity shows how buyers respond
        term: price-elasticity-of-demand
        core: true
      - label: Skimming or penetration at launch
        term: price-skimming
      - label: Prices that move with demand
        term: dynamic-pricing
        note: Efficient, but customers may judge them unfair.
  - label: Growth and reach
    kind: application
    children:
      - label: The product life cycle sets the task
        term: product-life-cycle
        core: true
      - label: Adapt or standardize abroad
        term: glocalization
      - label: Many channels blur the credit for a sale
        note: With many touchpoints it is hard to say which campaign caused a purchase.
  - label: Measuring and judging
    kind: evaluation
    children:
      - label: Track share, acquisition cost, retention and lifetime value
        core: true
      - label: Discounts can wear down a brand
        kind: limitation
        core: true
        note: Frequent promotions teach customers to wait for the next one.
      - label: Does the product keep the promise?
        kind: question
        note: A position fails when the experience contradicts it.
      - label: Persuasion and data raise ethical questions
        kind: limitation
        term: ethical-marketing
builds:
  - code: '4.1'
    label: Market orientation and the role of marketing
  - code: '4.2'
    label: Segmentation, targeting and positioning
  - code: '4.4'
    label: Market research
  - code: '4.5'
    label: The product life cycle, branding and pricing
  - code: '4.6'
    label: 'HL: marketing in other countries'
related:
  - map: strategy-formulation
    label: Differentiation as a competitive position
  - map: sustainability-strategy
    label: Credible claims and greenwashing
basis:
  note: >
    The platform's own summary of established marketing ideas, written for the undergraduate and MBA
    pathways. It goes beyond the IB course and is aligned to no university course or textbook, because none
    was supplied. The lifetime value formula is a standard simplified form.

# Enrichment map: strategy formulation, for the undergraduate and MBA
# pathways. Beyond the IB course. The platform's own summary of established
# ideas, organized around the choices a strategist makes; it follows no
# textbook's structure and is aligned to no university course.
title: Strategy formulation
scope: enrichment
audience: [undergraduate, mba]
field: Strategy
order: 1
summary: How an organization chooses where to compete and how to win, from reading its environment and its own resources to testing a strategy before committing to it.
centre: Strategy formulation
branches:
  - label: What a strategy is
    kind: concept
    children:
      - label: A set of choices about where to compete and how to win
        kind: definition
        term: strategy
        core: true
        note: The choices must fit together and rule options out; a list of goals is not a strategy.
      - label: Objectives, strategy and tactics are different
        term: tactics
        note: Objectives say what to achieve, strategy says how, and tactics are the short-term moves.
      - label: Intended and emergent strategy
        core: true
        note: Plans meet events, so the strategy that happens mixes the two (Mintzberg).
      - label: Trade-offs make a position hard to copy
        note: Deciding what not to do is what protects a position from imitation.
  - label: Reading the environment
    kind: tool
    children:
      - label: STEEPLE for forces outside the industry
        kind: type
        term: steeple-analysis
        core: true
      - label: Five forces for the industry's profit potential
        kind: type
        term: porters-five-forces
        core: true
        note: Porter's model of what shapes the returns open to firms in an industry.
        children:
          - label: Rivalry among existing competitors
          - label: Threat of new entrants
          - label: Threat of substitutes
            term: substitute-product
          - label: Bargaining power of buyers
          - label: Bargaining power of suppliers
      - label: Scenarios for an uncertain future
        kind: type
        term: scenario-planning
        note: Several plausible futures, with the strategy tested against each one.
      - label: Industry boundaries blur
        kind: limitation
        note: Rivals from other industries and new platforms are easy to miss.
  - label: Building on resources
    kind: theory
    children:
      - label: The resource-based view
        kind: definition
        term: resource-based-view
        core: true
        note: Lasting advantage comes from resources and capabilities that rivals cannot easily copy.
      - label: The VRIO test
        core: true
        note: A resource gives lasting advantage only if it passes all four questions (Barney).
        children:
          - label: Valuable to customers?
          - label: Rare among rivals?
          - label: Costly to imitate?
          - label: Organized to capture the value?
      - label: Core competences open several markets
        term: core-competence
        note: Collective know-how that can be carried across products (Prahalad and Hamel).
      - label: Dynamic capabilities
        note: The ability to renew resources and skills as markets change.
      - label: SWOT brings the two views together
        kind: example
        term: swot-analysis
        note: Strengths and weaknesses inside, opportunities and threats outside.
  - label: Choosing a position
    kind: types
    children:
      - label: Cost leadership
        kind: type
        term: porters-generic-strategies
        core: true
        note: The lowest costs in the industry, at a quality customers accept.
      - label: Differentiation
        kind: type
        term: differentiation
        core: true
        note: Something buyers value enough to pay more for.
      - label: Focus on a narrow segment
        kind: type
        term: niche-market
        note: Cost or differentiation in a niche the broad players serve poorly.
      - label: Stuck in the middle
        kind: limitation
        note: Neither cheapest nor distinctive. Hybrids can work, but only with a clear logic.
      - label: Creating uncontested demand
        term: blue-ocean-strategy
        note: Redraw the offer to add new value and cut cost at once (Kim and Mauborgne's blue ocean strategy).
  - label: Choosing the direction of growth
    kind: application
    children:
      - label: New or existing products, new or existing markets
        term: ansoff-matrix
        core: true
        note: Market penetration, product development, market development or diversification.
      - label: Build, borrow or buy the resources
        core: true
        note: Grow organically, through alliances and contracts, or by acquisition (Capron and Mitchell).
      - label: Manage the portfolio
        term: bcg-matrix
        note: Fund some businesses, harvest others, and leave some.
      - label: Related diversification shares capabilities
        term: diversification
        note: An unrelated move adds risk without the benefit of shared skills.
      - label: Value from combining businesses
        term: synergy
        note: Often promised in a merger, and often harder to capture than planned.
  - label: Testing a strategy
    kind: evaluation
    children:
      - label: Does it fit the environment and the resources?
        kind: question
        core: true
        note: Suitability.
      - label: Can the organization fund and deliver it?
        kind: question
        core: true
        note: 'Feasibility: money, people, time and skills.'
      - label: Will the key stakeholders accept its risk and return?
        kind: question
        core: true
        note: Acceptability.
      - label: Frameworks structure judgement; they do not decide
        kind: limitation
        note: The same analysis can support different choices.
      - label: Name what would change your mind
        note: Agree the signal that would trigger a rethink before committing.
builds:
  - code: '1.3'
    label: Objectives, SWOT and, at HL, Porter's generic strategies
  - code: '1.5'
    label: Growth, the Ansoff matrix and the external routes to grow
  - code: '4.2'
    label: Differentiation and positioning
related:
  - map: marketing-strategy
    label: Winning a place in the customer's mind
  - map: corporate-finance
    label: Putting a value on a strategic option
  - map: leading-change
    label: Turning a chosen strategy into change
basis:
  note: >
    The platform's own summary of established management ideas, written for the undergraduate and MBA
    pathways. It goes beyond the IB course and is aligned to no university course or textbook, because none
    was supplied. Frameworks are named with the people usually credited with them; their works were not
    opened for this map.
  sources:
    - source: ansoff-1957
      for: The matrix of products and markets
    - source: capron-mitchell-2012
      for: Build, borrow or buy

# Enrichment map: organizational behaviour, for the undergraduate and MBA
# pathways. Beyond the IB course. The platform's own summary, organized from
# the individual to the organization and ending with how to use the evidence.
title: Organizational behaviour
scope: enrichment
audience: [undergraduate, mba]
field: People
order: 3
summary: How individuals, groups and the organization itself shape behaviour at work, from motivation and judgement to teams, power and culture, and what the evidence says a manager can change.
centre: Organizational behaviour
branches:
  - label: Three levels of analysis
    kind: concept
    children:
      - label: 'The individual: personality, attitudes, perception'
        core: true
      - label: 'The group: roles, norms and cohesion'
        term: teamwork
        core: true
      - label: 'The organization: structure, culture and systems'
        core: true
      - label: Behaviour depends on the situation as well as the person
        note: Changing the system often works better than trying to change the people.
  - label: Motivation at work
    kind: theory
    children:
      - label: 'Content theories: what people need'
        kind: type
        term: maslows-hierarchy-of-needs
        core: true
        note: Maslow, Herzberg, McClelland, and self-determination theory.
      - label: 'Process theories: how people choose their effort'
        kind: type
        term: expectancy-theory
        core: true
        note: Expectancy theory and equity theory.
      - label: Specific, stretching goals with feedback
        note: Goal-setting research (Locke and Latham) finds they raise performance when the goals are accepted.
      - label: The design of the job
        term: job-enrichment
        note: Variety, a whole task, significance, autonomy and feedback (Hackman and Oldham).
      - label: Rewards can crowd out interest
        kind: limitation
        term: intrinsic-motivation
        note: Paying people for a task they enjoy can make it feel like work.
  - label: Judgement and decisions
    kind: theory
    children:
      - label: Bounded rationality
        kind: definition
        core: true
        note: With limited time and information, people settle for good enough (Simon).
      - label: Heuristics and biases
        core: true
        note: Shortcuts such as anchoring and confirmation bias distort judgement (Kahneman and Tversky).
      - label: Blaming the person, not the situation
        note: The fundamental attribution error.
      - label: Groupthink
        note: Close groups suppress doubts; a devil's advocate and anonymous views help (Janis).
  - label: Teams
    kind: concept
    children:
      - label: Teams develop in stages
        core: true
        note: Forming, storming, norming and performing (Tuckman).
      - label: Psychological safety
        core: true
        note: Teams learn faster when people can admit mistakes without fear (Edmondson).
      - label: Social loafing
        note: Effort falls when no one can see each person's contribution.
      - label: Diversity helps when it is heard
        note: Different views improve decisions only when the process lets them be voiced.
  - label: Power, politics and culture
    kind: concept
    children:
      - label: Sources of power
        kind: type
        core: true
        note: Position, reward, coercion, expertise and personal appeal (French and Raven).
      - label: Organizational politics
        note: Informal influence over scarce resources, harmful when it replaces open argument.
      - label: Culture as shared assumptions
        term: organizational-culture
        core: true
        note: Visible artefacts, stated values and taken-for-granted assumptions (Schein).
      - label: National cultures differ
        term: hofstedes-cultural-dimensions
  - label: Using the evidence
    kind: evaluation
    children:
      - label: Findings depend on context
        kind: limitation
        core: true
        note: A result from one country, sector or decade may not travel.
      - label: Popular models can outrun their evidence
        kind: limitation
        note: Maslow's hierarchy is easy to teach but weakly supported by research.
      - label: People, incentives or systems?
        kind: question
        core: true
        note: Ask which of the three drives the behaviour before trying to change it.
builds:
  - code: '2.3'
    label: Leadership styles and the situation
  - code: '2.4'
    label: Motivation theories and rewards
  - code: '2.5'
    label: 'HL: organizational culture'
  - code: '2.6'
    label: Communication and its barriers
related:
  - map: leading-change
    label: Behaviour when the organization changes
  - map: corporate-governance
    label: Incentives at the top
basis:
  note: >
    The platform's own summary of established organizational behaviour, written for the undergraduate and
    MBA pathways. It goes beyond the IB course and is aligned to no university course or textbook, because
    none was supplied. Theories are named with the people usually credited with them; their works were not
    opened for this map.

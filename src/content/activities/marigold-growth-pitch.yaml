# A classroom activity built on the Marigold Kitchens Decision Room. The roles
# are the case's own stakeholders, shown on the page with their interests and
# concerns.
title: 'Five routes, one founder: pitching a way to grow'
summary: >
  Five teams each make the case for one of Marigold's routes to growth, and a panel playing the founder and the
  people with money at stake chooses one. The class then commits the panel's choice in the Decision Room and
  decides together how to make it work.
basis: { kind: decision, id: marigold-growth }
subtopics: ['1.5', '1.4']
format: Teams pitch to a panel
groupSize: 4
prepare:
  - Students read the Marigold Kitchens case file, at least Exhibits 3, 6 and 7.
  - One device for the class with the Decision Room open, shown on the board.
roles:
  - stakeholder: Meera Rao
    task: Chairs the panel and makes the final choice against her own four aims (Exhibit 6).
  - stakeholder: Banyan Growth Partners
    task: Sits on the panel and asks every team how fast its route grows the business and what Banyan could sell later.
  - stakeholder: The bank
    task: Sits on the panel and asks what each route borrows and how sure the forecasts are.
  - stakeholder: Employees
    task: Sits on the panel and asks what each route means for the people who grew with Marigold.
phases:
  - minutes: 5
    title: What does Meera want?
    what: Every student ranks Meera's four aims from Exhibit 6, alone. Choose the panel of four, who prepare their questions while the teams work.
  - minutes: 12
    title: Build the case
    what: Each of five teams takes one route from Exhibit 3, organic growth, franchising, the joint venture, the acquisition or staying focused, and prepares a pitch of ninety seconds with its figures and its answer to the strongest objection.
  - minutes: 12
    title: Pitches and questions
    what: Each team pitches, and the panel asks one question. Teams may not count anyone else's sales as Marigold's revenue.
  - minutes: 6
    title: The decision
    what: The panel chooses a route in front of the class and gives one reason for it. Commit it in the Decision Room, then decide round two, making it work, as a class vote.
  - minutes: 10
    title: Debrief
    what: Take the questions below in order, then open the room's own debrief together.
output: Each team's ninety-second pitch, and the panel's decision with its reason.
debrief:
  - Which aim did the winning route serve, and which did it give up?
  - Why are franchisees' sales not Marigold's revenue? What does Marigold actually earn from a franchise?
  - Exhibit 7 shows how many franchise inquirers could fund a restaurant. What does that do to a plan for twelve franchises?
  - Does buying Tiffin Lane bring economies of scale automatically? What would have to happen first?
  - If Mumbai sales in the first year were well below forecast, which route would you choose now?

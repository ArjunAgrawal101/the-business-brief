# A classroom activity built on the Bellbird Home and Garden case file. Every
# figure students use is in the case's exhibits; the roles are the case's own
# stakeholders, shown on the page with their interests and concerns.
title: 'Bellbird: the board meeting before the bank'
summary: >
  A profitable retailer is about to break its overdraft limit. Groups of six hold Bellbird's board meeting, with the
  family, the finance manager, the bank and the largest supplier each pressing their own interest, and leave with
  one plan and a memo the bank would accept.
basis: { kind: case, id: bellbird-home-and-garden }
subtopics: ['3.7', '3.2', '3.5']
format: Board meeting in role
groupSize: 6
prepare:
  - Students read the Bellbird case file, at least Exhibits 3 and 6 to 8.
  - Print one copy of Exhibit 6 per group, or keep the case open on one device per group.
roles:
  - stakeholder: Lena Kowalski
    task: Presents the forecast and the four options, and answers questions on the figures.
  - stakeholder: Helen Marsh
    task: Chairs the meeting and puts the decision to a vote.
  - stakeholder: Jim Marsh
    task: Speaks for the business he founded and the Mount Gravatt site.
  - stakeholder: Peter Marsh
    task: Speaks for the shareholder outside the business, his dividends and the value of his shares.
  - stakeholder: Moreton Commercial Bank
    task: Says what the bank needs to see by Friday, from its reply in Exhibit 7.
  - stakeholder: Harbourline Outdoor Imports
    task: Says what the supplier will and will not accept, from Exhibit 8.
phases:
  - minutes: 8
    title: Read the forecast
    what: Every student finds, in Exhibit 3, the months in which the overdraft is over its limit and the worst closing balance. Check the answers as a class before anyone argues.
  - minutes: 8
    title: Prepare the roles
    what: Each student ranks the four options in Exhibit 6 from their role's point of view and writes the one sentence they will open with.
  - minutes: 14
    title: The board meeting
    what: Lena presents for two minutes. Each role responds in turn, the bank and the supplier last. Helen calls a vote; she has the casting vote.
  - minutes: 8
    title: Write the memo
    what: Each group writes the board's decision as the case asks, a memo of about 250 words with the forecast it produces, its main risk and two changes for next year.
  - minutes: 12
    title: Debrief
    what: Take the questions below in order, then compare the groups' choices with the case's own debrief.
output: A memo to the board of about 250 words, as the case's exercise sets it.
debrief:
  - Bellbird made a profit. Why is it still short of cash?
  - Is the problem seasonal, structural or both? Which part does your chosen option deal with?
  - When does the money from each option arrive, and does it arrive before the August breach?
  - Which stakeholder could block your plan, and what would you offer them?
  - What would make your choice wrong, and what would Bellbird do then?
next:

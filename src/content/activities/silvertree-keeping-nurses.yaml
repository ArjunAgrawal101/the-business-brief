# A classroom activity built on the Silvertree Clinics case file. Every figure
# students use is in the case's exhibits; the roles are the case's own
# stakeholders, shown on the page with their interests and concerns.
title: 'Silvertree: why do the nurses leave?'
summary: >
  A pay rise has not stopped nurses leaving a chain of clinics. Pairs first sort the evidence on why they leave, then
  groups of five hold the board meeting where the head of people must win support for a plan that deals with the
  cause, not the cost.
basis: { kind: case, id: silvertree-clinics }
subtopics: ['2.4', '2.1']
format: Evidence first, then the board
groupSize: 5
prepare:
  - Students read the Silvertree Clinics case file, at least Exhibits 4, 5 and 7.
  - A two-column table on paper or a whiteboard, headed hygiene factors and motivators.
roles:
  - stakeholder: Thandiwe Mokoena
    task: Proposes one option, or a sequence led by one, and links it to the evidence.
  - stakeholder: Dr Pieter van Wyk and Dr Aisha Patel
    task: Played by one student for both founders. Asks whether the plan brings back the continuity of care the clinics were built on.
  - stakeholder: Atlantic Health Partners
    task: Asks what the plan costs each year and how its effect will be measured.
  - stakeholder: Nurses
    task: Says, from Exhibits 4 and 5, what would make a nurse stay.
  - stakeholder: Clinic managers
    task: Says what the plan asks of a manager who already runs a wide span of control.
phases:
  - minutes: 10
    title: Why do nurses leave?
    what: In pairs, students sort the reasons in the exit interviews (Exhibit 5) and the survey (Exhibit 4) into hygiene factors and motivators, and circle the two reasons cited most often.
  - minutes: 8
    title: Match the options
    what: Groups match each of the five options in Exhibit 7 to the reasons it addresses, and cross out any option that addresses none.
  - minutes: 12
    title: The board meeting
    what: Thandiwe proposes. The investor and the founders question her; the nurses and the clinic managers each give their view in a minute. The board decides.
  - minutes: 8
    title: Write the recommendation
    what: Each group writes a recommendation of about 250 words, with the evidence for it, its yearly cost and effect, and how it will be measured clinic by clinic.
  - minutes: 10
    title: Debrief
    what: Take the questions below in order, then compare the groups' plans with the case's own debrief.
output: A recommendation to the board of about 250 words, as the case's exercise sets it.
debrief:
  - The pay rise made more nurses feel fairly paid, and turnover rose anyway. What does that tell you, in Herzberg's terms?
  - Which option is cheapest on paper, and does it do anything about why nurses leave?
  - At HL, how would you calculate labour turnover at one clinic, and why does the formula divide by the average number of nurses?
  - At HL, which of the needs in self-determination theory does each option meet?
  - What would you expect to see within a year if your plan is working?

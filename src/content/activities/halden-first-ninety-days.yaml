# A classroom activity built on the Halden Distribution Decision Room. The
# roles are the case's own stakeholders, shown on the page with their
# interests and concerns.
title: 'Leading Halden through ninety days and one bad night'
summary: >
  Groups of four become Halden's leadership in miniature: the new site manager, a team leader, a night-shift
  picker and an owner. They read the evidence shift by shift, choose an approach to leadership, then lead through a
  crisis against the clock.
basis: { kind: decision, id: halden-leadership }
subtopics: ['2.3', '2.4']
format: Leadership team in role, against the clock
groupSize: 4
prepare:
  - Students read the Halden Distribution case file, at least Exhibits 2, 3 and 4.
  - One device per group with the Decision Room open, and a timer the class can see.
roles:
  - stakeholder: Amara Osei
    task: Makes each decision after hearing the others, and has to explain it to them.
  - stakeholder: Team leaders
    task: Says what support the team leaders need, and what they can run without the manager.
  - stakeholder: Night-shift pickers
    task: Speaks from the night shift's evidence, its turnover, its training and how little it was consulted.
  - stakeholder: Halden's owners
    task: Keeps the client's deadline in front of the group, and asks what each choice risks for the contract.
phases:
  - minutes: 6
    title: The deadline
    what: Read the client's deadline (Exhibit 4) and the room's three objectives aloud. Each group agrees which objective it would give up last.
  - minutes: 10
    title: Evidence, shift by shift
    what: Groups compare the two shifts in Exhibits 2 and 3 and write the three differences that matter most. Take one difference from each group before anyone chooses.
  - minutes: 8
    title: Round one, the approach
    what: Each role argues for one minute from its own interest, then Amara chooses the approach for the first ninety days and the group commits.
  - minutes: 6
    title: Round two, the night the scanners fail
    what: Start the timer at three minutes. The group must commit before it runs out; Amara decides if the group cannot agree.
  - minutes: 12
    title: Debrief
    what: Take the questions below in order, then open the room's own debrief together.
  - minutes: 5
    title: Exit ticket
    what: Each student names the leadership style the group used in round two and says, in two sentences, whether it would have worked on the day shift.
output: A one-paragraph account of the group's two decisions, naming the leadership style behind each and the evidence it rested on.
debrief:
  - Did your group lead both shifts the same way? What in Exhibits 2 and 3 should decide that?
  - Which style did the crisis push you towards, and is that a problem for the ninety-day plan?
  - What is the difference between a paternalistic and a democratic leader, using Halden's founder (Exhibit 6) as the example?
  - When would stepping back and leaving a team to decide be the right call at Halden?
  - If most night-shift leavers had left over pay, what could leadership alone have achieved?

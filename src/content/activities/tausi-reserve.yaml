# A classroom activity built on the Tausi Beverages case file. Every figure
# students use is in the case's exhibits; the roles are the case's own
# stakeholders, shown on the page with their interests and concerns.
title: 'Tausi: four plans for one marketing reserve'
summary: >
  A drinks maker has one reserve and four plans that each spend all of it. Groups place the portfolio with the
  figures, argue the plans in a board meeting where each director pushes a different product, and set a milestone
  that would show the chosen plan is working.
basis: { kind: case, id: tausi-beverages }
subtopics: ['4.1', '4.5', '4.4']
format: Portfolio analysis, then the board
groupSize: 5
prepare:
  - Students read the Tausi Beverages case file, at least Exhibits 3, 5, 6 and 7.
  - A blank Boston Consulting Group matrix per group, on paper or on the board.
roles:
  - stakeholder: Brian Otieno
    task: Presents the plan the group prefers and defends its estimates.
  - stakeholder: Wanjiru Kamau
    task: Chairs the meeting and decides, with an eye on the portfolio's future.
  - stakeholder: Joseph Kamau
    task: Argues against dropping any product the distributors have stocked for years.
  - stakeholder: Hassan Abdi
    task: Argues for the products the sales team needs in shops.
  - stakeholder: Faith Njeri
    task: Argues for the plan with the best return over two years.
phases:
  - minutes: 10
    title: Place the portfolio
    what: Groups place each product on the matrix with figures from the retail audit in Exhibit 3, its share against the largest rival and its segment's growth, not by impression.
  - minutes: 8
    title: Read the evidence critically
    what: Each group writes one reason to doubt the price test (Exhibit 5) and one reason to doubt the survey (Exhibit 6) before it reads the plans.
  - minutes: 12
    title: The board meeting
    what: Brian presents the four plans in Exhibit 7 and the one he backs. Joseph, Hassan and Faith each argue their position for a minute; Wanjiru decides.
  - minutes: 5
    title: Set the milestone
    what: The group agrees one measurable milestone for the chosen plan, and what Tausi will do if it is missed.
  - minutes: 10
    title: Debrief
    what: Take the questions below in order, then compare the groups' plans with the case's own debrief.
output: A recommendation of about 250 words with the plan, the portfolio reasoning, one milestone and the main risk, as the case's exercise sets it.
debrief:
  - Where did each product sit on the matrix, and which figures put it there?
  - Is a shopper who says they would try a product the same as a sale? What does that do to the plans that rely on the survey?
  - Does a price cut that raises revenue also raise profit? Use the price test to answer.
  - Which plan has the best return over two years, and which over three? Which should the board care about more?
  - What would make Wanjiru right to keep the cola, whatever the matrix says?
next:
  - { label: 'Notes on 4.1 Introduction to marketing', href: '/topics/introduction-to-marketing/' }
  - { label: 'The BCG matrix in the Strategy Studio', href: '/strategy-studio/bcg-matrix/' }
  - { label: 'Market metrics in the Market Studio', href: '/market-studio/market-metrics/' }
order: 6

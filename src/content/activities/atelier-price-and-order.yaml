# A classroom activity built on the Atelier Barro Decision Room. Every figure
# students use is in the case's exhibits; the roles are the case's own
# stakeholders, shown on the page with their interests and concerns.
title: 'Price, cost and a half-price order'
summary: >
  Teams of three run the Atelier Barro Decision Room as the studio's owner, manager and throwers. They work the
  numbers before each commitment, defend their choices to another team, and finish on the question the case is
  built to test: is an order below average cost a loss?
basis: { kind: decision, id: atelier-pricing }
subtopics: ['3.3', '5.5']
format: Teams commit, then defend
groupSize: 3
prepare:
  - Students read the Atelier Barro case file, at least Exhibits 1, 3 and 5.
  - One device per team with the Decision Room open, and a calculator.
roles:
  - stakeholder: Inês Carvalho
    task: Holds the final say. Keeps the studio's premium position in view and asks what each choice does to it.
  - stakeholder: Rui Mendes
    task: Works the figures from Exhibit 1 before every commitment and reads them out to the team.
  - stakeholder: The two throwers
    task: Speaks for the people paid by the mug. Asks what each choice does to the number of mugs made.
phases:
  - minutes: 5
    title: Set up
    what: Read the briefing aloud. Each student predicts, on paper and alone, which price will leave the studio with the most profit, and keeps the prediction for the debrief.
  - minutes: 12
    title: Round one, the cost rise
    what: >
      Rui works out the contribution per mug and the break-even quantity at the price the team favours, using the
      new costs in Exhibit 1 and the estimated sales in Exhibit 3. Only then does the team commit. Remind teams that
      the card and platform fee is a share of the price.
  - minutes: 10
    title: Round two, the hotel's order
    what: >
      Before committing, each team writes down the change in November profit if it accepts 300 mugs at the hotel's
      price, and what it would change in December (Exhibit 5). Judging a special order on contribution is part of the
      HL toolkit's contribution analysis; an SL class can treat it as a question about contribution per unit.
  - minutes: 8
    title: Defend it to another team
    what: Pairs of teams swap board packs. Each team has two minutes to defend its choices and one minute to question the other's.
  - minutes: 10
    title: Debrief
    what: Take the questions below in order, then open the room's own debrief together.
  - minutes: 5
    title: Exit ticket
    what: Each student writes the break-even quantity at the team's chosen price, rounded the right way, and one sentence on why it is rounded that way.
output: Two sentences to Inês for each round, each with the figure that decided it.
debrief:
  - Which price did your team choose, and what would have to be true about the sales estimate in Exhibit 3 for it to work?
  - Why does the card and platform fee matter more when the price rises?
  - Was the hotel's price below the cost of a mug? Which cost is the right comparison, and when would the answer change?
  - What might the order cost the studio's ability to charge its shop price?
  - Look back at your prediction from the start. What changed your mind, if anything?

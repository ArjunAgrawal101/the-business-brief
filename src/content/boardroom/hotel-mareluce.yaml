# Boardroom scenario: Hotel Mareluce. A fictional company on a fictional
# island; every figure is simulated. The board pack, the dashboard and every
# figure in the narrative are computed by the Boardroom engine
# (src/lib/boardroom/engine.ts) from the model, the starting position and the
# history below.

title: 'Hotel Mareluce: full rooms or a future'
dek: A family resort hotel on a small island must choose between filling every room and protecting the place its guests come for.
question: Can a resort hotel grow its profit and cut its footprint at the same time, and which should it put first when it cannot?
challenge: profit-versus-sustainability
order: 3
company:
  name: Hotel Mareluce
  industry: Resort hotel and hospitality
  sector: tertiary
  location: Isola Brezza, a fictional island in the Mediterranean
  legalForm: Private limited company
  founded: '1988'
  size: 140 rooms, open from April to October, with 46 staff in the season
  owners: The Serra family owns every share; Giulia Serra is the second generation to run the hotel.
currency: { code: EUR, symbol: '€', name: euro }
units: { singular: room night, plural: room nights }
sustainability:
  label: Carbon per room night
  unit: kg CO₂e per room night
  note: Emissions from electricity, hot water, laundry and food for each room night sold. Isola Brezza's electricity comes mostly from diesel generators. The figures are simulated.
syllabus: ['1.3', '1.4', '4.2', '4.5', '3.8', '2.4', '3.5', '5.6']
concepts: [sustainability, ethics, change]
level: SL/HL
hlNote: >
  Capacity utilization (5.6) and dynamic pricing (4.5) are HL only. SL students can play every round; those parts
  of the debrief are marked HL.

background:
  - >
    Hotel Mareluce stands above the only sandy bay on Isola Brezza, a small island an hour by ferry from the mainland.
    Paolo and Lucia Serra opened it in 1988 with forty rooms; it now has 140, open from April to October. Their
    daughter Giulia runs it, with her brother Marco in charge of the building and the grounds. Two-thirds of its staff
    are islanders.
  - >
    For years the hotel has filled its rooms two ways: guests who book directly, often returning families who pay
    full price, and a block of rooms sold in advance to a tour operator at a discount. The block guarantees occupancy
    in the shoulder months and brings the hotel guests it would never reach on its own.
  - >
    Profit has stopped growing. Operating profit fell to {{pbit}} in 2026, from {{pbit.prev}} the year before: food and
    energy cost more, a new resort on the other side of the island has pulled prices down, and in the busiest weeks the
    pool is crowded and reviews mention it. The island has its own limits too: its
    electricity comes from diesel generators, and in dry summers its water is trucked in.
  - >
    Now the tour operator wants a bigger block for the next three years, a sustainability certifier has approached the
    hotel, and the island council is talking about a levy on high-emission hotels. The simulation runs from 2027 to
    2030, one season a round. You take one seat at the board table; your seat decides what you are judged on.

context:
  - >
    **Occupancy is not profit.** A room sold to the tour operator brings in €126 for room and half board; a room sold
    directly, about €225. Filling a room at a discount makes sense when it would otherwise stand empty; it costs money
    when a full-price guest is turned away for it.
  - >
    **The product is the place and the people.** Guests come for the bay, the quiet and the staff who remember them.
    Crowding, tired seasonal staff or a dry pool show up in reviews, and reviews drive direct bookings.
  - >
    **Sustainability as cost, risk and selling point.** Cutting energy and water use costs money now. It also cuts
    bills, protects the hotel against fuel prices, droughts and levies, and attracts guests who choose hotels on their
    footprint.

challenges:
  - '**Margins.** The profit margin fell to {{profitMargin}} in 2026 as costs rose and a new competitor pulled prices down.'
  - '**The block.** The tour operator wants 14,000 room nights a year for three years, at €128.'
  - '**Footprint.** Each room night emits {{emissionsPerUnit}} of CO₂e, mostly from diesel-generated electricity.'
  - '**People.** Seasonal staff turn over quickly, and service suffers in the busiest weeks.'
  - '**The island.** Water, energy and the council''s patience are all limited.'

stakeholders:
  - name: Giulia Serra and the Serra family
    group: Owners and directors
    interest: A hotel that stays in the family, earns enough to reinvest, and is still welcome on the island.
    influence: high
    view: '“My parents built this for people who love the island. I will not turn it into a place that uses the island up.”'
  - name: The tour operator
    group: Largest single customer
    interest: Guaranteed rooms at a price it can package.
    influence: high
    view: '“We filled your shoulder months for twenty years. Give us more rooms and we will fill them.”'
  - name: Returning guests
    group: Direct customers
    interest: The quiet bay, good food and staff who know them.
    influence: medium
    view: '“We come back for how it feels. Last August it felt like an airport.”'
  - name: Island staff and seasonal workers
    group: Employees
    interest: Fair pay, secure seasons and somewhere to live.
    influence: medium
    view: '“The islanders come back every year. The agency staff come once.”'
  - name: Isola Brezza council
    group: Local government
    interest: Jobs, a living island, and limits on water and energy use.
    influence: high
    view: '“Tourism keeps this island alive. It must not drink it dry.”'
  - name: The sustainability certifier
    group: External body
    interest: Hotels that meet and prove its standards.
    influence: low
    view: '“Certification is earned with meters and invoices, not with brochures.”'

market:
  summary: >
    The figures are simulated. Isola Brezza sells about 600,000 room nights a year across hotels, resorts and rentals,
    growing about 3% a year. Guests booking directly compare reviews, the setting and, increasingly, a hotel's
    footprint; tour operators compare price. Mareluce's share is {{marketShare}}.
  competitors:
    - { name: Grand Hotel Brezza (fictional), share: 6, price: 290, position: 'Luxury hotel in the island''s harbour town' }
    - { name: Club Sole resort (fictional), share: 14, price: 150, position: 'Large all-inclusive resort, sold mostly through tour operators' }
    - { name: 'Holiday apartments and rentals (various, fictional)', share: 38, price: 120, position: 'Self-catering, booked online' }
  trends:
    - More guests say they choose hotels partly on their environmental record, and certification schemes are spreading.
    - Tour operators are buying larger blocks from fewer hotels, at lower prices.
    - Small islands are putting limits and levies on water and energy use in the peak season.


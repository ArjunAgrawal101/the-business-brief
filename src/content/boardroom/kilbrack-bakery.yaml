# Boardroom scenario: Kilbrack Bakery. A fictional company; every figure is
# simulated. The board pack, the dashboard and every figure in the narrative
# are computed by the Boardroom engine (src/lib/boardroom/engine.ts) from the
# model, the starting position and the history below.

title: 'Kilbrack Bakery: machines, people and the price of bread'
dek: A family bakery must double its output for the supermarkets, and decide whether people or machines will make it.
question: Should a family bakery automate production to win the volume its customers want, and what does it owe the people whose jobs the machines would do?
challenge: automation
order: 2
company:
  name: Kilbrack Bakery
  industry: Bread and bakery products
  sector: secondary
  location: Kilbrack, a fictional market town in County Limerick, Ireland
  legalForm: Private limited company
  founded: '1971'
  size: 63 production staff, and 22 more in sales, delivery and the office
  owners: The Hartigan family owns every share; three generations sit on the board.
currency: { code: EUR, symbol: '€', name: euro }
units: { singular: loaf, plural: loaves }
sustainability:
  label: Carbon per loaf
  unit: kg CO₂e per loaf
  note: Emissions from the ovens, the refrigeration and the delivery vans, for each loaf made. The figures are simulated.
syllabus: ['5.2', '5.6', '5.3', '3.8', '2.1', '2.7', '5.5', '1.3']
concepts: [change, ethics, sustainability]
level: SL/HL
hlNote: >
  Capacity utilization, productivity and operating leverage (5.6), lean production and quality (5.3), industrial
  relations (2.7) and net present value (3.8) are HL only. SL students can play every round; those parts of the
  debrief are marked HL.

background:
  - >
    Kilbrack Bakery has baked bread in the same market town since 1971. Seamus and Brigid Hartigan started it with one
    oven and a van; their granddaughter Niamh Hartigan runs it now, and her father and aunt still sit on the board.
    It bakes sliced pan, soda bread, wholemeal and seeded loaves for two supermarket chains, and fresher, crustier bread
    for cafés, hotels and delis across the region. It is the largest employer in Kilbrack.
  - >
    The bakery is full. Its ovens and lines can make about eleven million loaves a year in two shifts, and for two years
    demand has run past that. The supermarkets have kept asking for more, and each year the bakery has turned away
    orders from its own cafés and hotels, its best-paying customers, to keep the contracts it signed.
  - >
    This autumn the larger supermarket chain renewed its contract: nine million loaves in 2027 and nearly ten million
    in 2028, at €1.06 a loaf instead of €1.10. The board has agreed to it. What it has not agreed is how the bakery
    will make that much bread.
  - >
    The simulation runs from 2027 to 2030, one year a round. You take one seat at the board table. The decisions are the
    whole board's; your seat decides what you are judged on.

context:
  - >
    **Three ways to make more bread.** An automated line would double the plant's capacity and need far fewer people
    per loaf, at a cost of €4.6m and a year to install. Robotic cells for dividing and packing would add less capacity
    for a third of the money. A third shift would use the ovens through the night with the people the bakery already
    knows how to train, and no new machines at all.
  - >
    **Fixed against variable.** Machines turn wages, which can be flexed, into depreciation, maintenance and interest,
    which cannot. That makes profit rise faster when volume is high, and fall faster when it is not: operating
    leverage.
  - >
    **A town's employer.** About one household in twelve in Kilbrack has someone working at the bakery. Its workforce is
    represented by a union, and the board has always prided itself on never having made a compulsory redundancy.

challenges:
  - '**Capacity.** The plant is at its limit and the new contract needs over a million more loaves a year.'
  - '**Price.** The supermarket price has fallen to €1.06 a loaf, and the next tender will push it lower.'
  - '**People.** Labour is the largest cost the bakery controls, and the workforce is skilled, loyal and unionized.'
  - '**Quality.** Running flat out, the bakery scraps or has rejected {{defectRate}} of what it makes, and the supermarkets have noticed.'
  - '**Energy.** Gas ovens make the bakery exposed to energy prices, and its customers have started to ask about carbon.'

stakeholders:
  - name: Niamh Hartigan and the family board
    group: Owners and directors
    interest: A bakery that survives and grows, a fair dividend, and the family's name in the town.
    influence: high
    view: '“My grandparents built this with the town. I want it here in fifty years. That may need machines; it does not need us to forget who works here.”'
  - name: The supermarket buyer
    group: The largest customer
    interest: Consistent bread, delivered on time, at a falling price.
    influence: high
    view: '“Kilbrack makes good bread. At the next tender we will compare price, reliability and how many loaves we reject, in that order.”'
  - name: The bakery's union branch
    group: Employees' representatives
    interest: Jobs, pay and a say in how change happens.
    influence: medium
    view: '“Nobody here is against machines. We are against finding out about them from the newspaper.”'
  - name: Production staff
    group: Employees
    interest: Secure work, fair pay and work they can take pride in.
    influence: medium
    view: '“Two years of overtime. We want the help; we want to still have jobs when it arrives.”'
  - name: Cafés, hotels and delis
    group: Food-service customers
    interest: Fresh, distinctive bread every morning.
    influence: medium
    view: '“We buy Kilbrack because it does not taste like factory bread. If it starts to, we will buy elsewhere.”'
  - name: The bank
    group: Lender
    interest: A loan that is serviced and repaid.
    influence: medium
    view: '“We would lend against the line. We would want to see the volume that pays for it.”'

market:
  summary: >
    The figures are simulated. Kilbrack sells into the market for bread made in Ireland for supermarkets and food
    service, about 120 million loaves a year, growing about 2% a year. Supermarkets buy on price and reliability; cafés
    and hotels buy on freshness and character. Kilbrack's share is {{marketShare}}.
  competitors:
    - { name: Cairnfield Foods (fictional), share: 22, price: 0.98, position: 'National plant bakery, fully automated, supermarket bread' }
    - { name: Contract bakeries for supermarket own brands (fictional), share: 18, price: 0.92, position: 'Low-cost own-label loaves' }
    - { name: Ardrigh Artisan (fictional), share: 4, price: 1.65, position: 'Premium sourdough for delis and cafés' }
  trends:
    - Supermarkets are consolidating their suppliers and tendering contracts every three years.
    - Demand for sourdough and seeded bread is growing faster than for sliced pan.
    - Large customers are starting to ask suppliers for figures on carbon emissions.


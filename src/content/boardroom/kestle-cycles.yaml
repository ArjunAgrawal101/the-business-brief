# Boardroom scenario: Kestle Cycles. A fictional company; every figure is
# simulated. The board pack, the dashboard and every figure in the narrative
# are computed by the Boardroom engine (src/lib/boardroom/engine.ts) from the
# model, the starting position and the history below. Nothing is typed twice:
# change a number here and every exhibit follows. tests/unit/boardroom.test.ts
# runs every path and checks the accounting identities.

title: 'Kestle Cycles: the cash runs out first'
dek: A profitable, growing e-bike maker has a year to stop its overdraft swallowing the business.
question: How does a profitable business that is running out of cash get through the next year without giving up what made it profitable?
challenge: liquidity-crisis
order: 1
company:
  name: Kestle Cycles
  industry: Electric bicycle design and assembly
  sector: secondary
  location: Sheffield, United Kingdom
  legalForm: Private limited company
  founded: '2016'
  size: 46 assembly staff, and 14 more in design, sales and administration
  owners: The two founders, Hannah Kestle and Dev Malhotra, own every share.
currency: { code: GBP, symbol: '£', name: pounds sterling }
units: { singular: bike, plural: bikes }
syllabus: ['3.7', '3.5', '3.6', '3.2', '5.6', '1.4', '2.4', '4.5']
concepts: [change, ethics]
level: SL/HL
hlNote: >
  Efficiency ratios and insolvency (3.6), and just-in-time, just-in-case and capacity utilization (5.6), are HL only.
  SL students can play every round; the parts of the debrief that depend on them are marked HL.

background:
  - >
    Kestle Cycles designs and assembles electric bicycles in a workshop on the edge of Sheffield. Hannah Kestle and
    Dev Malhotra, two engineers who met at a car parts maker, started it in 2016 to build city e-bikes for people who
    commute up hills. Frames, motors and batteries come from suppliers in Asia; Kestle designs the bikes, assembles
    them, tests every one and sells them through about 120 independent bike shops, which have done most of its
    marketing for it.
  - >
    In 2026 the business changed shape. Fellside Outdoor, a national chain of outdoor stores, began selling two Kestle
    models under a contract: 250 bikes in the first quarter, rising to 650 a quarter by the end of the year. Fellside
    pays less than the shops do and pays later, 90 days after delivery against the shops' 30. To keep up, Kestle took
    on twelve assemblers, and after a shortage of motors in the spring it began holding much more stock of parts.
  - >
    On paper 2026 was Kestle's best year: sales up by about a third, and a profit in every quarter. In the bank account
    it was the worst. Money went out to suppliers months before it came back from Fellside, and the overdraft that
    used to be a cushion ended the year close to its £1m limit. The bank has asked for a plan.
  - >
    This simulation is Kestle's next year, one quarter at a time: four decisions for the board, with an event after
    each that nobody on the board controls. You take one seat at the table. The decisions are the whole board's; your
    seat decides what you are judged on.

context:
  - >
    **Growth eats cash.** Kestle pays for parts long before it is paid for bikes. Every extra bike sold to Fellside
    needs about £900 of parts and freight bought weeks earlier, and brings in its £1,330 three months after delivery. Profit says
    the Fellside contract is working; the bank balance says each new order makes the problem worse. This is
    overtrading: growing faster than the cash to support the growth.
  - >
    **Two channels, two kinds of customer.** The independent shops pay more, pay sooner and sell Kestle on its quality.
    Fellside brings volume and national visibility at a lower price, and the shops have noticed. Any decision about
    Fellside is also a decision about the shops.
  - >
    **A workshop near its limit.** Forty-six assemblers can build about 2,000 bikes a quarter in normal hours, and a
    little more with overtime. Above about 90% of capacity, quality starts to slip and warranty returns rise.

challenges:
  - '**Liquidity.** The overdraft stands at {{overdraft}} against a £1m limit, and the bank reviews the account every quarter.'
  - '**Working capital.** Kestle holds {{stockDays}} of parts, and its customers owe it {{debtors}}, most of it Fellside''s.'
  - '**Capacity.** The workshop runs at {{utilization}} of capacity; a bigger Fellside order would push it towards its limit.'
  - '**People.** The annual pay review falls in the third quarter, and staff expect a rise in line with living costs.'
  - '**Ownership.** The founders have never given up a share of the company, and say they would rather not.'

stakeholders:
  - name: Hannah Kestle and Dev Malhotra
    group: Founders and owners
    interest: A company that survives, stays theirs and keeps its name for quality.
    influence: high
    view: '“We built this on the shops. Fellside got us noticed, but I did not start a company to work for one customer.”'
  - name: Northern Counties Bank
    group: Lender
    interest: Interest, and an overdraft that comes back down.
    influence: high
    view: '“The business is profitable, but profit does not repay an overdraft. We need to see the balance falling, not a forecast that says it will.”'
  - name: Fellside Outdoor
    group: The largest customer
    interest: Reliable supply of bikes it can sell at a good margin.
    influence: high
    view: '“Kestle sells well in our stores. We would like more, and we would like it at a better price.”'
  - name: Independent bike shops
    group: The established channel
    interest: A brand they can recommend without being undercut down the road.
    influence: medium
    view: '“When a customer has seen the same bike cheaper at Fellside, the conversation in the shop gets harder.”'
  - name: Assembly staff
    group: Employees
    interest: Fair pay, manageable hours and secure jobs.
    influence: medium
    view: '“Last year was flat out. People will put up with overtime in a busy spring; they will not put up with it for ever.”'
  - name: Component suppliers
    group: Suppliers
    interest: Prompt payment and steady orders.
    influence: medium
    view: '“Small, frequent orders cost us more to pack and ship, and we will charge for it.”'

market:
  summary: >
    The figures are simulated. Kestle competes in the market for mid-priced electric bicycles, which in this
    simulation grows about 1.5% a quarter. Buyers compare price, range, reliability and the advice of the shop that
    sells it. Kestle's share is {{marketShare}} of the market by volume.
  competitors:
    - { name: Brightline E-Bikes (fictional), share: 9, price: 1350, position: 'Mass market, sold through national chains' }
    - { name: Strata Electric (fictional), share: 6, price: 1750, position: 'Premium, sold online direct to riders' }
    - { name: Moorland Mobility (fictional), share: 3.5, price: 1450, position: 'Regional, sold through independent shops' }
  trends:
    - Commuters are replacing second cars with e-bikes, which keeps the market growing even when spending is tight.
    - National chains are pressing suppliers for lower prices and longer payment terms.
    - Shipping times from Asia have become less predictable, so assemblers hold more stock than they used to.


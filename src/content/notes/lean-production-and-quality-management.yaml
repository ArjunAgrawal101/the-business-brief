# Notes: 5.3 Lean production and quality management (HL only). Written in the
# platform's own words from the guide's seven content statements (p. 34), so
# every section and question is HL. No coursebook chapter for 5.3 was supplied:
# the notes were checked against the guide, the teacher support material's
# glossary (pp. 80 to 90) and its pages on the circular economy and circular
# business models (pp. 48 to 51), and nothing from either is reproduced. The
# guide sets no formula for this subtopic; the defect rate and labour
# productivity use the standard forms in the notes for 5.6. The origins of
# lean production and of cradle to cradle design are given from subject
# knowledge and attributed. Every business named is fictional and every figure
# simulated; each figure was checked by script.
code: '5.3'
title: Lean production and quality management
level: HL
introduction: |
  Two businesses can buy the same machines, hire people with the same skills and pay the same for materials, yet one delivers faster, wastes less and makes fewer faulty products. Much of the difference lies in how operations are organized. **Lean production** sets out to remove everything that adds cost without adding value, and **quality management** sets out to get things right first time rather than finding mistakes at the end.

  This HL subtopic covers the features and methods of lean production, cradle to cradle design, quality control and quality assurance, three methods of managing quality and the importance of quality standards (AO1 and AO2), and asks you to evaluate what lean production and total quality management do to an organization (AO3).
objectives:
  - '**Describe** the features of lean production: less waste and greater efficiency.'
  - '**Explain** kaizen and just-in-time as methods of lean production, and the features of cradle to cradle design and manufacturing.'
  - '**Distinguish** between quality control and quality assurance.'
  - '**Explain** quality circles, benchmarking and total quality management, and the importance of national and international quality standards.'
  - '**Evaluate** the impact of lean production and total quality management on an organization.'
situation:
  title: Ashgrove Furniture's full order book
  fictional: true
  text: |
    Ashgrove Furniture, a fictional workshop with 60 employees, makes solid-wood tables and chairs for hotels and furniture shops. Its order book is full, yet it is struggling. Half-finished chairs wait in stacks between workstations for days, tying up cash and floor space. About 6% of chairs fail the final inspection and have to be repaired or scrapped, and customers complain that deliveries are often a week late.

    Now its largest customer, a hotel group, has said that from next year it will buy only from suppliers certified to an international quality standard, and that it wants furniture designed so that worn pieces can be taken back and remade rather than thrown away. Ashgrove's new operations manager proposes a move to lean production and total quality management. The owner, who has run the workshop for thirty years, worries about the cost, the disruption and whether his staff will accept it.

    What would going lean change at Ashgrove, and is it worth it?
sections:
  - id: lean-features
    title: 'Lean production: less waste, greater efficiency'
    kind: concept
    level: HL
    body: |
      **Lean production** is a way of organizing operations that removes anything which adds cost or time without adding value for the customer. The approach grew out of the Toyota Production System, developed in Japan in the decades after the Second World War, and the name was popularized by researchers at the Massachusetts Institute of Technology in *The Machine That Changed the World* (1990). The guide names two features, which are two sides of the same idea.

      The first is **less waste**. In lean thinking, waste means far more than rubbish: it is any activity or resource the customer would not willingly pay for. A chair that waits three days between the sanding and finishing benches gains nothing from the wait, yet the business pays for the space, the cash tied up in it and the risk of damage. Lean practitioners usually list seven kinds of waste, below, and many add an eighth: the unused ideas and skills of employees.

      The second is **greater efficiency**: more output from the same or fewer inputs, in less time. As waste is removed, products flow through the process faster, less stock is needed, fewer faults have to be fixed and the same people and machines produce more. Efficiency is not the same as effectiveness, which asks whether the right product is being made at all, and lean production aims at both by starting from what the customer values.
    points:
      - term: Overproduction
        text: Making more, or earlier, than customers need. Often called the worst waste, because it creates several others, from storage to stock that is never sold.
      - term: Waiting
        text: People, machines or products standing idle, for materials, information, a decision or the next stage of the process.
      - term: Transport and motion
        text: Moving products between distant workstations or buildings, and people walking, reaching or searching for tools and parts more than the job needs.
      - term: Over-processing
        text: Doing more than the customer requires, such as polishing a hidden surface or filling in a form nobody reads.
      - term: Excess stock
        text: Raw materials, work in progress and finished goods beyond what is needed now, which tie up cash and space and hide problems such as unreliable suppliers.
      - term: Defects
        text: Faulty products that must be inspected, repaired or scrapped, or that reach customers and come back as complaints and returns.
    example:
      title: A waste walk at Ashgrove
      fictional: true
      text: The operations manager walks the workshop with a notebook, following one chair from timber to delivery. It is worked on for about four hours but takes nine days to get through the workshop. Most of that time it waits in stacks (waiting and excess stock). Chair parts are carried between two buildings (transport), sanders walk to a shared cupboard for paper several times an hour (motion), and every chair is polished underneath where no customer looks (over-processing). Six chairs in every hundred fail the final inspection (defects). None of this waste appears as a single line in the accounts, which is why it has gone unnoticed for years.
  - id: kaizen
    title: 'Kaizen: continuous improvement'
    kind: method
    level: HL
    body: |
      **Kaizen**, a Japanese word usually translated as change for the better, is the method of improving a process through a continuous stream of small changes, suggested and made by the people who do the work. Instead of waiting for an occasional large project, such as a new machine, every employee is expected to look for better ways of working every day.

      The changes are small, cheap and quick to test: moving a tool closer to where it is used, changing the order of two tasks, adding a guide that makes a part impossible to fit the wrong way round. Each saves seconds or prevents an occasional fault, but over months and years hundreds of them add up to large gains in productivity and quality, and because staff design the changes, they understand and support them. Many businesses use a simple cycle: **plan** a change, **do** it on a small scale, **check** the results, and **act** by adopting it as the new standard or trying something else.

      Kaizen works only in the right culture. Employees must be trained, trusted and listened to, managers must act on suggestions quickly, and people must not fear that an improvement will cost a colleague's job. It links closely to empowerment and teamwork in subtopic 2.4, to quality circles, and to incremental innovation in subtopic 5.8. Its weakness is the same as incremental innovation's: small steps may not be enough when a market or a technology changes suddenly.
    diagram: kaizen
    points:
      - term: Small, frequent steps
        text: Many low-cost changes rather than a few expensive projects, so risk is low and improvement never stops.
      - term: Everyone involved
        text: Ideas come from the people closest to the work, from the shop floor to the office, not only from managers or engineers.
      - term: Standard work
        text: Each improvement becomes the new standard way of doing the job, so gains are kept and become the starting point for the next improvement.
      - term: Plan, do, check, act
        text: A repeated cycle for testing changes on a small scale before adopting them, so decisions rest on evidence.
    advantages:
      - Improvements are cheap, low-risk and add up over time.
      - Staff own the changes, which supports motivation and acceptance of change.
      - It uses the knowledge of the people who know the work best.
    limitations:
      - It needs a culture of trust and training that takes years to build.
      - Gains can level off once the obvious improvements have been made.
      - Small steps may not be enough when the market needs a radical change.
    example:
      title: Kaizen at Ashgrove
      fictional: true
      text: Ashgrove gives each team a board for ideas and fifteen minutes at the start of each Monday to review them. In the first six months staff put forward 210 suggestions and 140 are adopted, two-thirds of the total. Sanders fit a small paper rack to every bench, which ends the trips to the cupboard; assemblers make a wooden jig that holds chair legs at the right angle, which cuts wobbly chairs; and the delivery driver suggests loading lorries in reverse order of drop-offs. No single idea is dramatic, but together they cut the time each chair takes and the number that fail inspection.
  - id: just-in-time
    title: Just-in-time production
    kind: method
    level: HL
    body: |
      **Just-in-time (JIT)** is the lean method of producing only what is needed, when it is needed and in the quantity needed. Materials and components arrive just before they are used, and products are made to meet actual orders rather than a forecast, so very little stock is held at any stage. Subtopic 5.6 compares JIT with just-in-case stock control and shows stock on a control chart; here the focus is on JIT as a way of running production.

      JIT turns production from **push** into **pull**. In a push system each stage makes as much as it can and pushes it on to the next, whether or not it is needed, so stock piles up. In a pull system nothing is made until the next stage, or ultimately the customer, asks for it. A common way to signal demand is **kanban**, a card or empty container that travels back up the line to say that more of a part is needed. To make pull work, businesses make products in small batches, cut the time it takes to change a machine from one product to another, and keep workers multi-skilled so they can move to wherever the demand is.

      Holding little stock removes the cushion that hides problems. With a pile of spare parts, a supplier's late delivery or a machine that keeps breaking can be ignored; under JIT it stops the line at once, so the cause has to be fixed. That is the strength of JIT and its risk. It depends on reliable suppliers, often working in close, long-term partnership with the business, on consistent quality and on stable demand, and it leaves the business exposed when a supply chain is disrupted.
    diagram: jit-jic
    points:
      - term: Pull production
        text: Each stage makes only what the next stage has asked for, so work in progress stays low and nothing is made without a customer for it.
      - term: Kanban
        text: A simple visual signal, often a card or an empty bin, that tells the previous stage or a supplier to send more of a particular part.
      - term: Small batches and quick changeovers
        text: Making a few of each product at a time, which is affordable only if machines can be switched quickly from one product to the next.
      - term: Supplier partnerships
        text: Frequent, reliable deliveries of parts that are right first time, usually from a small number of trusted suppliers on long-term contracts.
      - term: Right first time
        text: With no spare stock to replace faulty parts, quality has to be built in, which is why JIT and total quality management usually go together.
    example:
      title: Pulling chairs through Ashgrove
      fictional: true
      text: Ashgrove stops cutting parts for a week's chairs at a time. Instead, each assembly team keeps two small bins of each part; when one is empty it goes back to the cutting shop as a kanban, and only then are more parts cut. Batches fall from 100 chairs of one design to 20, and a new clamp lets the cutting machine switch designs in ten minutes instead of an hour. The stacks between benches disappear, and the value of work in progress falls from about $180,000 to about $60,000, freeing **$120,000** of cash. But when the timber merchant's delivery is two days late in the first month, the whole workshop stops, and Ashgrove agrees a new contract with guaranteed delivery times and a second merchant as a fallback.
  - id: cradle-to-cradle
    title: Cradle to cradle design and manufacturing
    kind: concept
    level: HL
    body: |
      Most products follow a **cradle to grave** path: materials are extracted, made into a product, used, and thrown away. **Cradle to cradle** design rejects the idea of waste altogether. Products, and the way they are made, are designed from the start so that at the end of their use every material either returns safely to nature or is recovered as a raw material for new products of equal quality. The idea was set out by the architect William McDonough and the chemist Michael Braungart in *Cradle to Cradle: Remaking the Way We Make Things* (2002), and it is often summed up as waste equals food.

      The design separates materials into two cycles. In the **biological cycle**, materials such as natural fibres, wood with natural finishes and compostable packaging are designed to break down safely and return nutrients to the soil. In the **technical cycle**, durable materials such as metals and some plastics are designed to be taken back, separated and remade without losing quality, rather than recycled into something worse. A product that mixes the two in a way that cannot be separated, such as a wooden chair glued to a plastic seat, fits neither cycle, so designers choose safe materials, avoid toxic substances, and make products easy to repair and take apart. Cradle to cradle thinking also favours renewable energy in manufacturing.

      Cradle to cradle sits naturally beside the circular business models in the toolkit, such as resource recovery and product life extension, and the teacher support material presents the circular economy as a way of thinking about business that links to all four key concepts. It shares lean production's dislike of waste, but with a different meaning: lean waste is effort and time that add no value, while cradle to cradle waste is material that leaves the economy for good.
    diagram: cradle-to-cradle
    points:
      - term: Waste equals food
        text: Every material is designed to become an input to something else at the end of its use, so nothing is simply thrown away.
      - term: Biological cycle
        text: Natural, non-toxic materials that can safely break down and return to the soil, such as untreated timber, natural oils and plant-based fibres.
      - term: Technical cycle
        text: Durable materials, such as metals, that are kept separate so they can be recovered and remade at the same quality again and again.
      - term: Design for disassembly
        text: Products held together with screws and clips rather than glues, so parts can be repaired, replaced or separated into their cycles.
      - term: Take-back
        text: The business collects used products, often in return for a discount on new ones, so the materials come back to it rather than going to landfill.
    advantages:
      - Lower spending on raw materials, and less exposure to their prices, once materials come back.
      - Less waste sent to landfill and less pollution, which supports corporate social responsibility.
      - A strong story for customers and a way to meet buyers' sustainability requirements.
      - Durable, repairable products can support premium prices and repeat business through take-back.
    limitations:
      - Redesigning products and finding safe materials takes time and investment.
      - It depends on getting used products back, which needs collection systems and willing customers.
      - Some materials, such as certain mixed plastics or electronics, are hard to keep in a closed cycle.
      - Claims of circularity can outrun reality, which risks accusations of misleading customers.
    example:
      title: A chair designed to come back
      fictional: true
      text: To meet the hotel group's request, Ashgrove redesigns its best-selling chair. The frame is untreated oak with a natural oil finish, so offcuts and worn parts can be composted (biological cycle). The glued joints become screwed joints, so a broken leg can be replaced rather than the whole chair scrapped. The steel glides on the feet clip off and go back to the steel supplier (technical cycle). Ashgrove offers to collect worn chairs, refurbish the frames and sell them back at a discount, which keeps the hotel group as a customer for the whole life of the furniture.
  - id: quality-control-and-assurance
    title: Quality control and quality assurance
    kind: concept
    level: HL
    body: |
      **Quality** means meeting customers' needs and expectations consistently, every time. A cheap product can be of good quality if it does what its buyers expect at that price; a luxury product that fails is of poor quality. Poor quality is expensive: faulty products have to be inspected, repaired or scrapped, and those that reach customers bring refunds, complaints and damage to the brand. The guide distinguishes two approaches to achieving it.

      **Quality control (QC)** is about **detection**. Products are checked, usually at the end of production or of a stage, often by specialist inspectors testing a sample, and those that fail are repaired or rejected. Quality control stops many faulty items reaching customers, but it does not stop them being made, so the materials, time and energy spent on them are still wasted, and inspection itself adds cost. It can also suggest to workers that quality is the inspectors' job, not theirs.

      **Quality assurance (QA)** is about **prevention**. Quality is built into every stage of the process through agreed standards and procedures, from the materials suppliers send to the way each task is done and checked by the person doing it. Responsibility for quality moves from inspectors to everyone involved. Because faults are prevented rather than found, waste and rework fall, and the business can show customers that its processes meet agreed standards, which is the basis of certification. Most businesses use both: assurance to prevent faults, and some final checks to catch what gets through.
    diagram: quality-control-assurance
    points:
      - term: Features of quality control
        text: Inspection and testing, often of samples; carried out by specialist inspectors; at the end of production or of a stage; finds faults after they happen; rejects or reworks faulty items.
      - term: Features of quality assurance
        text: Standards and procedures for every stage; checks by the people doing the work; suppliers held to agreed specifications; documented processes; aims to prevent faults; supports certification to quality standards.
      - term: The cost of quality
        text: Spending on prevention, such as training and better design, is usually far cheaper than the cost of failure, which grows the later a fault is found, and is greatest when a faulty product reaches the customer.
    formulas:
      - name: Defect rate
        expression: Defect rate = units that fail to meet the quality standard ÷ units made × 100
        note: The standard form used in the notes for 5.6; the guide's list of formulae does not include it.
    example:
      title: From inspecting chairs to preventing faults
      fictional: true
      text: Ashgrove makes about 400 chairs a week, and its two inspectors reject 6% of them, about 24 chairs, at the final check, mostly for wobbly legs and uneven finishes. Each is repaired or scrapped at a cost of about $40. That is quality control, and it has kept faulty chairs away from customers, but not stopped them being made. Under quality assurance, timber is checked for moisture when it arrives, each assembler checks the angle of every leg with the new jig before gluing, and finishers follow a written procedure for each coat. The inspectors become trainers, and the final check becomes a quick sample.
  - id: managing-quality
    title: 'Managing quality: quality circles, benchmarking and total quality management'
    kind: method
    level: HL
    body: |
      The guide names three methods of managing quality. They work at different levels: a quality circle is a small group tackling problems in its own area, benchmarking compares the business with the best performers elsewhere, and total quality management is a philosophy for the whole organization.

      A **quality circle** is a small group of employees who do the same or similar work and meet regularly, often with a trained leader, to identify, analyse and solve problems of quality and efficiency in their area. The approach was developed in Japan in the 1960s. It draws on the knowledge of the people closest to the work and can motivate them through involvement, but it takes time away from production, and managers must act on its recommendations or staff quickly lose interest.

      **Benchmarking** means measuring a process or a result against the best performer, in the business's own industry or in another, and adopting the better practices found. It turns a vague wish to improve into a specific target based on what someone else already achieves. **Total quality management (TQM)** goes furthest. It makes every employee, in every department, responsible for quality, with the aims of meeting customers' needs and getting things right first time. Departments treat each other as internal customers, problems are tackled at their source using data, and improvement never stops. TQM needs strong commitment from senior managers and training at every level, and it can take years to become part of the culture.
    points:
      - term: Quality circle
        text: A volunteer group of five to ten staff from one area, meeting at set times to find the causes of quality problems and recommend solutions. Supports kaizen and TQM, and gives staff a voice.
      - term: Internal and competitive benchmarking
        text: Internal benchmarking compares branches, sites or teams within the business; competitive benchmarking compares the business with its rivals, whose data can be hard to obtain.
      - term: Functional benchmarking
        text: Comparing one process, such as delivery or customer service, with the best performer at that process in any industry, who may happily share methods because it is not a rival.
      - term: The benchmarking process
        text: Choose what to improve, find a suitable benchmark, collect and compare the data, find the reasons for the gap, adopt and adapt better practices, then measure the results and repeat.
      - term: Principles of TQM
        text: A focus on customers, including internal customers; everyone involved and responsible; right first time; decisions based on data; continuous improvement; and visible commitment from the top.
    example:
      title: Three methods at Ashgrove
      fictional: true
      text: |
        - **Quality circle:** six finishers meet every fortnight to find out why some tabletops come out patchy. They trace the problem to dust from the sanding area and propose a curtain between the two zones, which the owner agrees within a week.
        - **Benchmarking:** Ashgrove's deliveries are on time only about 70% of the time. Rather than compare itself with rival furniture makers, it visits a non-competing kitchen maker with an excellent delivery record and adopts its system of fixed weekly delivery slots.
        - **TQM:** every department gets quality targets, from sales, which must record each customer's exact requirements, to the office, which must send accurate delivery paperwork. The owner chairs a monthly quality review, a sign that quality is not just the workshop's job.
  - id: quality-standards
    title: National and international quality standards
    kind: concept
    level: HL
    body: |
      A **quality standard** is a published set of requirements, for a product, a service or the way an organization manages quality, set by a recognized standards body. A business that meets the requirements, usually after an independent audit, can be certified and display a mark or certificate that tells customers so.

      **National standards** are set by a country's own standards body and are often required by its laws or its public-sector buyers; their marks are familiar to customers in that country. **International standards** apply across borders. The best known in quality management is the ISO 9000 family, from the International Organization for Standardization, under which a business's quality management system can be certified to ISO 9001. Certification shows that the business has documented processes, follows them consistently, measures results and keeps improving, and it is checked by regular audits after the first.

      The guide asks for the importance of standards (AO2). They give customers confidence in a supplier they do not know, which matters most when buyers and sellers are far apart. They open doors, because many large businesses and governments buy only from certified suppliers, and an international standard is understood in every export market. They also help internally, by making processes clear and consistent. But certification costs money and staff time, it can bury a small business in paperwork, and it certifies that a process is followed consistently, not that the product is the best available. A business can be certified and still make a product customers do not want.
    points:
      - term: National standards
        text: Set by a country's standards body for products, safety or management systems. They suit businesses selling mainly at home, and are sometimes required by law or by public-sector buyers.
      - term: International standards
        text: Recognized across borders, such as ISO 9001 for quality management systems, so one certificate can satisfy customers in many countries.
      - term: Certification and audit
        text: The business documents its processes, an independent body audits them, and regular follow-up audits check that standards are kept, at a cost every year.
      - term: Why they matter
        text: Customer confidence, access to contracts and export markets, consistent processes, a marketing advantage, and evidence for regulators and insurers.
      - term: Their limits
        text: Cost and paperwork, a risk of box-ticking, and the fact that they certify the system rather than guaranteeing an excellent product.
    example:
      title: Keeping the hotel contract
      fictional: true
      text: The hotel group buys $1.2 million of furniture a year from Ashgrove, 40% of its $3 million revenue, and will soon buy only from suppliers certified to an international quality management standard. Certification would cost Ashgrove about $25,000 in consultants' and auditors' fees in the first year, plus around 300 hours of staff time writing down procedures, and about $5,000 a year for follow-up audits. Measured against the contract it protects, the cost is small. The bigger benefit may come later, because the certificate would let Ashgrove bid for hotel contracts in other countries whose buyers have never heard of it.
  - id: impact
    title: The impact of lean production and TQM on an organization
    kind: evaluation
    level: HL
    body: |
      The guide asks you to evaluate the impact of lean production and TQM on an organization (AO3). They touch almost every part of a business, so a strong answer considers costs, quality, cash, customers, employees, suppliers and culture, and then judges the balance for the organization in the case.

      When they work, the gains are large and lasting. Costs fall as waste, stock, rework and floor space shrink; cash tied up in stock is released; quality and reliability rise, which wins customers and supports higher prices; and faster, more flexible production lets the business respond to what customers actually order. Employees can gain too, through more varied work, training and a real say in how the job is done, which Herzberg and Deci and Ryan would expect to motivate.

      The costs and risks are just as real. Both approaches need heavy investment in training and a change of culture that can take years, during which output may dip. Employees may experience lean not as empowerment but as constant pressure to do more with fewer people, and if improvements lead to job losses, kaizen suggestions dry up. JIT leaves little protection against a supplier's failure or a sudden rise in demand. And many businesses copy the techniques without the culture, introducing kanban cards or quality circles while managers keep the old habits, and then conclude that the methods do not work.
    points:
      - term: What it depends on
        text: Senior managers' long-term commitment; a workforce that trusts management and is trained; reliable suppliers; reasonably stable demand; and operations with enough repetition for small improvements to add up.
      - term: Where it fits best
        text: High-volume, repetitive operations such as batch and flow production, and service processes with many identical steps. One-off job production benefits less from standard work and pull systems, although its quality still matters.
      - term: Lean and resilience
        text: Removing buffers saves money in normal times but leaves less room for shocks, so many businesses now keep extra stock of critical parts or a second supplier while staying lean elsewhere.
    advantages:
      - Lower costs through less waste, stock, rework and space.
      - Cash released from stock and work in progress.
      - Higher quality and reliability, and a better reputation.
      - Faster, more flexible response to customers' orders.
      - More involved, skilled and potentially motivated employees.
    limitations:
      - Training and culture change are costly and slow, and output may dip at first.
      - Work can intensify, raising stress, especially if jobs are cut.
      - Little stock leaves the business exposed to supply disruptions.
      - It depends on reliable suppliers and long-term management commitment.
      - Copying techniques without changing the culture usually fails.
    example:
      title: Ashgrove after one year
      fictional: true
      text: |
        A year after the change, with all figures simulated:

        - **Productivity:** the workshop makes 450 chairs a week with 1,800 labour hours, against 400 chairs with 2,000 hours before. Labour productivity rises from 0.20 to 0.25 chairs per labour hour, an increase of **25%**.
        - **Quality:** 9 of the 450 chairs fail the final check, a defect rate of **2%** against 6% before. At about $40 a chair, the cost of faults falls from $960 to $360 a week, about **$30,000** a year over 50 weeks.
        - **Cash:** work in progress falls by **$120,000**.
        - **Costs:** training and reorganization cost $90,000, and output fell to 300 chairs a week for three weeks during the changeover, losing about $18,000 of contribution at $60 a chair.

        The figures favour the change, but they leave out two things. Two experienced craftsmen retired early rather than adapt, taking skills with them, and the late timber delivery showed how much more exposed the workshop now is to its suppliers.
applications:
  - industry: Car manufacturing
    text: The industry where lean production began. Assembly plants receive parts just in time, sometimes several times a day from suppliers located nearby, and workers can stop the line to fix a fault at its source. The same tight supply chains mean a shortage of one component can halt production across a whole region.
  - industry: Healthcare
    text: Hospitals and clinics use lean thinking to cut waiting times and the walking and searching that take staff away from patients, and quality means safety above all. Quality assurance through checklists and standard procedures prevents errors, and accreditation to recognized standards reassures patients and those who pay for their care.
  - industry: Hospitality
    text: Hotels and restaurants apply TQM by training every employee to solve a guest's problem on the spot and to record it so the cause can be fixed. Benchmarking against the best hotels, often through mystery guests and online reviews, sets the targets, and consistency across branches is a large part of what customers pay for.
  - industry: Technology and software
    text: Software teams work in short cycles of small improvements, a form of kaizen, and quality assurance relies on automated testing at every stage rather than inspection at the end. Quality standards for information security matter because business customers often require certified suppliers.
  - industry: Food manufacturing
    text: Quality assurance is a matter of safety and law, with procedures controlling every point where food could be contaminated and retailers requiring certified suppliers. JIT suits fresh products with short shelf lives, while cradle to cradle thinking appears in compostable packaging and the recovery of food waste.
  - industry: Social enterprise
    text: Many social enterprises are built on cradle to cradle and circular ideas, such as refurbishing furniture or electronics and training disadvantaged people to do it. Kaizen and quality circles suit their participative cultures, but the cost of certification to quality standards can be hard to justify on small budgets, even when buyers ask for it.
stakeholders:
  - group: Employees
    text: They can gain more varied work, training, responsibility and a voice through kaizen and quality circles. They may also face pressure to work harder and faster, more monitoring, and fear that efficiency will cost jobs, so their support depends on how the change is led and whether gains are shared.
  - group: Customers
    text: They gain better quality, faster and more reliable delivery and, if savings are passed on, lower prices. Certification to quality standards gives business customers confidence, and cradle to cradle products appeal to those who care about waste. They suffer if a lean supply chain fails and orders cannot be met.
  - group: Owners and shareholders
    text: Lower costs, released cash and a better reputation raise profit and the value of the business over time. But the upfront cost of training, reorganization and certification, and the dip in output during the change, fall on them first, so owners focused on short-term returns may resist.
  - group: Suppliers
    text: Lean customers want frequent, small, reliable deliveries of parts that are right first time, often under long-term contracts that give suppliers security. They also push the cost of holding stock back down the supply chain and may require suppliers to be certified, which can strain small firms.
  - group: Managers
    text: They must give up some control to teams, listen to suggestions and lead a long change in culture. Middle managers whose role was to supervise and inspect may feel threatened, which is one reason lean programmes stall.
  - group: Community and environment
    text: Less waste, less stock to store and cradle to cradle design reduce landfill and the use of raw materials. Local suppliers may gain from a preference for nearby deliveries, although efficiency gains can also mean fewer jobs in the area.
evaluation:
  - Lean production and TQM are cultures, not toolkits. A business that introduces kanban cards and quality circles while managers keep making every decision is likely to conclude, wrongly, that the methods do not work; long-term commitment from the top matters more than any technique.
  - The benefits take time and the costs come first. Training, reorganization and a dip in output are certain and immediate, while lower costs and better quality build over months or years, so a business under short-term financial pressure may abandon the change before it pays.
  - Removing waste can remove resilience. Little stock and few suppliers save money in normal times, but leave the business exposed when supply chains are disrupted, so a sensible lean business keeps buffers where the cost of running out is high.
  - The effect on employees cuts both ways. Kaizen and quality circles can empower people and draw on their knowledge, but lean can also become constant pressure to do more with less; motivation theory suggests the outcome depends on whether staff gain autonomy and share in the gains.
  - Quality standards certify that a process is followed consistently, not that a product is excellent or wanted. They can be essential for winning contracts and exporting, yet costly and bureaucratic for a small firm, so their value depends on who the customers are.
  - Cradle to cradle design is an ambitious goal that few products fully reach. Its value depends on recovering used products and finding safe materials, and partial steps, such as designing for repair and take-back, are often where a business realistically starts.
decision:
  title: How should Ashgrove change?
  fictional: true
  brief: |
    Ashgrove's owner must decide how to respond to the hotel group's requirements and the workshop's problems. Ashgrove has revenue of $3 million, profit of about $240,000 a year, and 60 employees, many of whom have worked there for decades. All figures are simulated.

    The operations manager estimates that a full lean programme would release about $120,000 of cash from work in progress, save about $30,000 a year in faults and let the workshop make more chairs with fewer hours. The hotel group, 40% of revenue, will buy only from certified suppliers from next year and wants furniture designed for take-back.
  options:
    - label: Transform everything at once
      text: Introduce lean production and TQM across the whole workshop, seek certification and redesign the main products for cradle to cradle within 18 months, at a cost of about $175,000 ($90,000 for the lean programme, $25,000 for certification and $60,000 for redesign).
    - label: Meet the customer's demands first
      text: Seek certification and introduce quality assurance procedures, at a cost of about $45,000, to keep the hotel contract; leave the rest of the workshop as it is for now.
    - label: Pilot lean on chairs, certify in parallel
      text: Run a lean pilot on the chair line, with kanban, kaizen and a quality circle, for about $40,000, while seeking certification for $25,000, a total of about $65,000. Extend lean to tables only if the pilot meets agreed targets.
  guidance: |
    The hotel contract sets a floor: without certification Ashgrove risks 40% of its revenue, so every sensible option includes it. The question is how much more to do, and how fast.

    Transforming everything at once offers the largest gains soonest, but its $175,000 cost is about 73% of a year's profit, and the disruption falls on a workforce that has worked the same way for decades. Lean and TQM depend on culture, and culture rarely changes on an 18-month timetable; a failed rollout could leave staff cynical about the whole idea.

    Meeting only the customer's demands is cheapest and safest in the short run, but certification does not fix the waiting, the stock or the defects. Ashgrove would still tie up cash in half-finished chairs, still deliver late, and still miss the efficiency gains that would let it compete for new contracts.

    Piloting on the chair line keeps the hotel contract, tests the operations manager's estimates on a real product, and lets staff see the benefits before being asked to change everything. Its risk is that a pilot loses momentum, or that the owner treats it as a way of putting off the bigger decision.

    A strong answer usually favours certification plus a pilot, with clear targets for the pilot, such as the defect rate and the value of work in progress, and a date for deciding on the rest. It should also address the take-back request, perhaps by redesigning one product first, and say what would change the decision: for example, the hotel group demanding the full redesign by next year, or the pilot showing that staff resist the change.
exam:
  - q: Describe **two** features of lean production.
    marks: 4
    command: describe
    level: HL
    paper: '2'
    answer: |
      A strong answer describes the two features the guide names, each with a little development:

      - **Less waste:** removing any activity or resource that adds cost or time without adding value for the customer, such as overproduction, waiting, unnecessary movement, excess stock and defects.
      - **Greater efficiency:** producing more output from the same or fewer inputs, in less time, as products flow through the process with fewer delays and faults.

      Naming a method such as kaizen or JIT instead of a feature would miss the question, although a method can be used to illustrate a feature.
  - q: Distinguish between *quality control* and *quality assurance*.
    marks: 4
    command: distinguish
    level: HL
    paper: '2'
    answer: |
      - **Quality control** detects faults: products are inspected or tested, usually at the end of production or of a stage, often by specialist inspectors, and faulty items are rejected or reworked.
      - **Quality assurance** prevents faults: quality is built into every stage through standards and procedures, with everyone, including suppliers, responsible for the quality of their own work.
      - A strong answer makes the contrast explicit, such as detection after the event against prevention before it, or inspectors against everyone, and may add that assurance reduces waste because faulty items are not made in the first place.
  - q: |
      Pembury Ceramics, a fictional pottery, introduced kaizen in its mug workshop. Before the change, the workshop made 1,200 mugs a day using 300 labour hours, and 60 mugs a day were defective. After the change, it made 1,350 mugs a day using 270 labour hours, and 27 mugs a day were defective. All figures are simulated.

      Calculate the defect rate and the labour productivity (mugs per labour hour) before and after the change.
    marks: 4
    command: calculate
    level: HL
    paper: '2'
    answer: |
      - Defect rate before: 60 ÷ 1,200 × 100 = **5%**.
      - Defect rate after: 27 ÷ 1,350 × 100 = **2%**.
      - Labour productivity before: 1,200 ÷ 300 = **4 mugs per labour hour**.
      - Labour productivity after: 1,350 ÷ 270 = **5 mugs per labour hour**, a rise of 25%.

      These are the measures of subtopic 5.6. A full answer shows the working, gives the units, and uses the number of mugs made, not the number of good mugs, as the base for the defect rate.
  - q: |
      Stridewell, a fictional maker of running shoes, wants to apply cradle to cradle design to its next range.

      Explain **two** features of cradle to cradle design that Stridewell could adopt.
    marks: 4
    command: explain
    level: HL
    paper: '2'
    answer: |
      A strong answer explains two distinct features and applies each to running shoes. For example:

      - **Separating the biological and technical cycles:** an upper made of natural, compostable fibres and a sole made of a durable material that can be recovered and remade, so neither is lost to landfill.
      - **Design for disassembly:** joining the upper and sole with stitching or clips rather than glue, so the shoe can be taken apart at the end of its life and each part sent to its cycle.
      - **Take-back:** collecting worn shoes, perhaps for a discount on a new pair, so the materials return to Stridewell.

      Safe, non-toxic materials and the use of renewable energy are also valid features. Each feature should be explained, not just named, and linked to Stridewell.
  - q: |
      Evaluate the impact of lean production and total quality management on Ashgrove Furniture.
    marks: 10
    command: evaluate
    level: HL
    paper: '2'
    answer: |
      A strong response uses the evidence from Ashgrove's first year, considers several stakeholders, and reaches a judgement.

      - **Positive impacts:** labour productivity up 25% (0.20 to 0.25 chairs per labour hour); defect rate down from 6% to 2%, saving about $30,000 a year; $120,000 of cash released from work in progress; shorter lead times and more reliable deliveries, which help keep the hotel group's custom.
      - **Negative impacts:** $90,000 of training and reorganization and about $18,000 of lost contribution during the changeover; the workshop stopped when the timber delivery was late, showing the risk of JIT; two experienced craftsmen retired rather than adapt, taking skills with them.
      - **People and culture:** kaizen and quality circles gave staff a voice and produced 140 adopted ideas in six months, which suggests real engagement, but long-serving staff may experience the change as pressure, and support depends on whether gains are shared and jobs protected.
      - **Judgement:** for example, that the impact is positive overall, because the one-off costs are smaller than the cash released plus a few years of savings, provided Ashgrove manages supplier risk with a fallback supplier and keeps staff involved. The best answers state what would change the judgement, such as further supply failures or rising staff turnover.
  - q: |
      ReNest, a fictional social enterprise, collects unwanted furniture, trains long-term unemployed people to repair it, and sells it at low prices to families moving out of temporary housing. A local council has offered ReNest a large contract, on condition that it introduces formal quality procedures.

      Explain **two** challenges ReNest may face in introducing total quality management.
    marks: 6
    command: explain
    level: HL
    paper: '3'
    answer: |
      A strong response explains two distinct challenges, each developed and applied to ReNest. For example:

      - **Variable inputs and skills.** Donated furniture arrives in every condition and the trainees are still learning, so achieving consistent, right-first-time quality is much harder than in a factory with standard materials and experienced staff.
      - **Cost and time.** Training, documenting procedures and possibly certification cost money and management time that ReNest, with a small budget, would otherwise spend on its social mission.
      - **Balancing quality and mission.** TQM's demand for consistency could push ReNest to take only the best donations or the most skilled trainees, which would conflict with its purpose of helping long-term unemployed people.
      - **Culture and staff turnover.** Trainees move on once they find work, so building the shared, long-term commitment to quality that TQM needs is difficult.
summary:
  - '**Lean production** removes whatever adds cost or time without adding value for the customer. Its two features are **less waste** (overproduction, waiting, transport and motion, over-processing, excess stock, defects, and unused ideas) and **greater efficiency**.'
  - '**Kaizen** is continuous improvement through many small changes by everyone, kept as standard work, often using plan, do, check, act. It needs a culture of trust.'
  - '**Just-in-time** produces only what is needed, when it is needed, using pull production, kanban, small batches and reliable suppliers. It exposes problems but leaves little protection against disruption.'
  - '**Cradle to cradle** design means every material returns safely to nature (biological cycle) or is remade at equal quality (technical cycle), through safe materials, design for disassembly and take-back.'
  - '**Quality control** detects faults by inspection after they happen; **quality assurance** prevents them by building quality into every stage, with everyone responsible.'
  - '**Quality circles** are staff groups solving problems in their own area; **benchmarking** adopts the practices of the best performers; **TQM** makes quality everyone''s job across the whole organization.'
  - '**Quality standards**, national or international such as ISO 9001, build customers'' confidence and open contracts and export markets, but cost money, add paperwork and certify processes rather than excellence.'
  - The **impact** of lean production and TQM can be lower costs, released cash, better quality and more involved staff, but they need investment, time and culture change, can intensify work and reduce resilience, and fail when copied as techniques alone.
retrieval:
  - q: What are the two features of lean production named in the guide?
    a: Less waste and greater efficiency.
  - q: Name five of the kinds of waste that lean production aims to remove.
    a: For example, overproduction, waiting, unnecessary transport and motion, over-processing, excess stock and defects, and many add the unused ideas of employees.
  - q: What is kaizen, and why does it depend on the culture of the business?
    a: Continuous improvement through many small changes suggested by the people who do the work. It needs employees who are trained, trusted and listened to, and who do not fear that improvements will cost jobs.
  - q: What is the difference between push and pull production?
    a: In push production each stage makes as much as it can and passes it on, so stock builds up. In pull production nothing is made until the next stage, or the customer, asks for it.
  - q: What is a kanban?
    a: A visual signal, such as a card or an empty container, that tells the previous stage or a supplier to send more of a particular part.
  - q: Explain the two cycles in cradle to cradle design.
    a: In the biological cycle, natural materials break down safely and return to the soil. In the technical cycle, durable materials are recovered and remade at the same quality, again and again.
  - q: What is the main difference between quality control and quality assurance?
    a: Quality control detects faults by inspection after products are made; quality assurance prevents faults by building quality into every stage of the process.
  - q: What is a quality circle?
    a: A small group of employees doing similar work who meet regularly to identify, analyse and solve quality problems in their own area and recommend improvements.
  - q: What is functional benchmarking, and why might it be easier than comparing with rivals?
    a: Comparing a process with the best performer at that process in any industry. Because that business is not a rival, it may be willing to share its data and methods.
  - q: Give three principles of total quality management.
    a: For example, a focus on customers including internal customers, everyone responsible for quality, right first time, decisions based on data, continuous improvement and commitment from senior managers.
  - q: Why are international quality standards important to an exporter?
    a: They are recognized across borders, so certification gives unfamiliar foreign customers confidence and meets the requirements of buyers who deal only with certified suppliers.
  - q: Of 900 units made, 27 fail to meet the standard. What is the defect rate?
    a: 27 ÷ 900 × 100 = 3%.
connections:
  - code: '5.6'
    text: Just-in-time is set against just-in-case stock control and shown on stock control charts, and the defect rate measures what quality management sets out to cut.
  - code: '5.2'
    text: Lean methods suit batch and flow production with many repeated steps, and mass customization relies on the quick changeovers JIT requires.
  - code: '2.4'
    text: Kaizen, quality circles and TQM depend on empowerment and teamwork, and motivation theory explains when they motivate and when lean feels like pressure.
  - code: '5.8'
    text: Kaizen is incremental innovation applied to processes; neither on its own protects a business from a disruptive change.
  - code: '1.3'
    text: Cradle to cradle design and less waste support corporate social responsibility and the sustainability of the business.
  - code: '2.5'
    text: Lean production and TQM succeed only when they become part of the organizational culture, and a clash with the existing culture is a common reason they fail.

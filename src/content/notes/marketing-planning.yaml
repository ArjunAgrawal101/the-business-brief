retrieval:
  - q: What is the role of marketing planning?
    a: To turn the business's objectives into specific marketing objectives and actions, setting out who to target, how to position the product, which marketing mix to use, at what cost and by when, and how results will be measured.
  - q: Name four common bases for segmenting a market.
    a: Demographic (such as age, income and family), geographic (such as region and climate), psychographic (lifestyle and values) and behavioural (usage, loyalty, occasion and the benefit sought).
  - q: What makes a market segment worth targeting?
    a: It can be measured, it is large enough to be profitable, it can be reached through promotion and distribution, and it responds to marketing differently from other segments.
  - q: Distinguish between a niche market and a mass market.
    a: A niche market is a small, clearly defined segment with specific needs, served with a specialized product, often at a premium price. A mass market is large and served with a standardized product and one broad marketing mix, relying on high volumes and economies of scale.
  - q: What does a position map show, and what is its main limitation?
    a: Where customers place competing brands on two attributes, such as price and perceived quality. It shows one sample's perceptions on only two attributes, not facts, and a gap on it may be empty for a good reason.
  - q: What are the four steps in constructing a position map?
    a: Choose two attributes that matter to customers; collect and average customers' ratings of each brand; draw and label the axes and plot the brands; then read the map for clusters, weak positions and gaps.
  - q: What three tests must a USP pass to be valuable?
    a: Customers must care about it, it must be genuinely different, and rivals must not be able to copy it easily.
  - q: Give three ways an organization can differentiate itself from its competitors.
    a: For example through product features, quality or design; branding; customer service; convenient distribution; ethical and sustainable practices; and, for a service, its people, processes and physical evidence.
  - q: Why is repositioning a brand slow and expensive?
    a: It means changing customers' settled perceptions, which takes time, and every element of the marketing mix has to change consistently to support the new position.

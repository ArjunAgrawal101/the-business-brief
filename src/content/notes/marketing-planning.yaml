# Notes: 4.2 Marketing planning. Written in the platform's own words from the
# guide's five content statements (p. 31), with the unit's tools (pp. 14, 30).
# Definitions were checked against the TSM glossary (pp. 86, 89 to 90) and the
# site's unit 4 glossary. The supplied coursebook extracts do not cover unit 4,
# so none was used. The coffee brands are those of the position-map diagram;
# every business named is fictional.
code: '4.2'
title: Marketing planning
level: SL/HL
introduction: |
  No business can sell to everyone, and none can afford to try. **Marketing planning** is how a business decides where to aim: what marketing should achieve, which customers to serve, how it wants those customers to see it, and what it will do, spend and measure to get there.

  This subtopic gives you the tools that sit underneath every marketing decision: segmenting a market and choosing a target, positioning a brand and drawing a position map, telling a niche market from a mass market, and finding the unique selling point and the differences that give customers a reason to choose one business over its rivals. In a case study, these tools explain why a business's marketing mix ([4.5](/topics/the-seven-ps-of-the-marketing-mix/)) looks the way it does, and whether it fits the customers the business wants.
objectives:
  - '**Explain** the role of marketing planning and what a marketing plan contains.'
  - '**Apply** segmentation, targeting and positioning to a business and its customers.'
  - '**Construct** a position map from customer ratings, and read it for clusters, weak positions and possible gaps.'
  - '**Distinguish** between niche markets and mass markets.'
  - '**Explain** why a unique selling point (USP) matters to a business.'
  - '**Discuss** how organizations differentiate themselves and their products from competitors.'
sections:
  - id: role-of-marketing-planning
    title: The role of marketing planning
    kind: concept
    body: |
      Marketing planning is the process of deciding what marketing should achieve and how it will be done. Its result is a **marketing plan**, a document that sets out the marketing objectives, the analysis behind them, the customers the business will target, how it wants to be positioned, the marketing mix it will use, the budget, the timetable and how success will be measured.

      The plan's role is to turn the business's overall objectives (1.3) into specific marketing actions. A business aiming to grow might set the objective of raising its market share (4.1) from 8% to 12% within two years; one aiming to protect its profit might aim to raise prices without losing its regular customers. Without a plan, marketing tends to become a series of unconnected campaigns whose results nobody can judge.

      A plan rests on evidence, and it ties the business together. Market research (4.4) shows what customers want. Toolkit tools such as [SWOT analysis](/glossary/swot-analysis/) and [STEEPLE analysis](/glossary/steeple-analysis/) show the business's position and the forces around it, and the [Ansoff matrix](/glossary/ansoff-matrix/) helps it choose between selling more of its existing products in its existing markets and moving into new markets or new products. The plan is also a commitment the other functions must be able to keep: operations must be able to make what marketing intends to sell, finance must fund the campaign, and human resources must supply the people to deliver it.
    points:
      - term: Marketing objectives
        text: What marketing must achieve, such as a sales target, a market share, a level of brand awareness or a successful launch. Good objectives are specific and measurable, with a deadline, so that results can be judged.
      - term: Where the business stands
        text: An analysis of its customers, its competitors and the trends in its market, from market research and tools such as SWOT and STEEPLE analysis.
      - term: Target market and positioning
        text: The segments the business will serve, and how it wants those customers to see it compared with its rivals. The rest of this subtopic explains both.
      - term: The marketing mix
        text: The seven Ps (4.5) the business will use to reach its target market and support its position.
      - term: Budget and timescale
        text: How much will be spent, on what, and when each action will happen.
      - term: Monitoring and review
        text: How results will be measured against the objectives, for example through sales, market share or the number of new customers, and when the plan will be revised.
      - term: Gantt chart (toolkit)
        level: HL
        text: An HL toolkit tool for scheduling the plan. It shows each marketing activity against time, which activities overlap and which must wait for others, so managers can check whether the plan is on schedule.
    advantages:
      - Makes the business study its market and its rivals before it spends money.
      - Gives every function a shared target, so marketing, operations, finance and human resources pull in the same direction.
      - Measurable objectives show whether a campaign worked, so managers can change course early.
      - A clear plan helps persuade lenders and investors that a business's sales forecasts are realistic.
    limitations:
      - A plan is only as good as the research and forecasts behind it.
      - Markets, rivals and technology change quickly, so a fixed plan can go out of date and needs regular review.
      - Planning takes time and money that a small business may not have.
      - 'A plan can create false confidence: following it is not the same as succeeding.'
    example:
      title: A plan for the quiet hours
      fictional: true
      text: |
        Corner Brew, a fictional café that roasts its own coffee, is full before 9 a.m. and nearly empty after 2 p.m. Its marketing plan sets one objective: raise afternoon sales by 25% within six months. Research among its customers shows that students from the college nearby want somewhere to study after classes.

        The plan targets them with a study-hours offer of refillable filter coffee from 2 to 5 p.m. on weekdays, more power sockets, and posts on the college's student pages, with a budget of $3,000. Afternoon sales are checked every month. If the offer brings students in but not revenue, the price of the refill will be reviewed.
  - id: segmentation
    title: Segmentation
    kind: types
    body: |
      Segmentation, targeting and positioning are three linked steps, shown in the diagram below. **Segmentation** comes first: dividing a market into groups of customers, called segments, who share characteristics or needs and respond to marketing in similar ways. A business that understands its segments can design products, prices and messages that fit each group, instead of one average offer that fits nobody particularly well.

      There is no single correct way to segment a market. The four bases below are the most widely used, and businesses usually combine them: for example, young professionals (demographic) in city centres (geographic) who care about sustainability (psychographic) and buy coffee every working day (behavioural).

      A segment is worth targeting only if it is **measurable**, so the business can estimate its size and spending; **large enough** to be profitable; **reachable** through promotion and distribution; and **distinct**, responding to marketing differently from other segments. Market research (4.4) supplies the data.
    diagram: segmentation-targeting-positioning
    points:
      - term: Demographic
        text: By measurable features of the population, such as age, gender, income, occupation, education, family size or stage of life. The data are easy to find, for example in government publications, but people with the same profile can want very different things.
      - term: Geographic
        text: By where customers live or work, such as country, region, city, urban or rural area, or climate. Useful when tastes, laws or costs differ from place to place, but it hides the differences between neighbours.
      - term: Psychographic
        text: By lifestyle, values, attitudes, interests and personality. It explains why two people of the same age and income buy differently, but the data are harder and more expensive to collect.
      - term: Behavioural
        text: By how customers buy and use the product, such as how often they buy, how loyal they are, the occasion and the benefit they look for. Past behaviour is a strong guide to future buying, and loyalty schemes and online data make it easier to observe.
    advantages:
      - Products and messages fit customers' needs more closely, which raises sales and loyalty.
      - Promotion is spent on likely buyers rather than everyone, so less of it is wasted.
      - It can reveal segments that rivals serve badly, which may become opportunities.
    limitations:
      - Researching a market well enough to segment it costs time and money.
      - 'Segments are averages: real customers do not fit neatly, and labels can harden into stereotypes.'
      - Serving several segments with different mixes raises costs and gives up some economies of scale.
      - Collecting detailed personal data raises questions of privacy and ethics.
    example:
      title: Four segments, one café
      fictional: true
      text: |
        Corner Brew segments the coffee drinkers within a ten-minute walk of the café. Commuters buy a takeaway every weekday and want speed (behavioural). Students from the college have little money to spend and stay for hours (demographic and behavioural). People who work from home want a calm place with reliable wi-fi that feels like a workplace (psychographic: their lifestyle). Home brewers want freshly roasted beans to take away (behavioural: the benefit they seek).

        The same coffee is a different product to each group, and each would respond to a different offer.
  - id: targeting-niche-and-mass
    title: 'Targeting: niche markets and mass markets'
    kind: types
    body: |
      **Targeting** is choosing which segments to serve. The chosen group is the **target market**, often described as a customer profile: the typical buyer's age, income, lifestyle and buying habits. A clear target tells the business which marketing mix to build, and where not to spend.

      There are three broad choices, shown in the diagram above: aim one offer at most of the market (**mass marketing**), aim a different mix at each of several segments, or concentrate on one small segment (**niche marketing**). The guide asks you to distinguish niche markets from mass markets, so the points below set the two side by side.

      Neither is better in general. The right choice depends on the business's size and resources, the size and growth of each segment, the strength of rivals and what the business does best. Many businesses begin in a niche and grow towards the mass market, and some mass-market businesses launch separate brands for niches their main brand cannot reach.
    points:
      - term: What each is
        text: A **niche market** is a small, clearly defined segment of a larger market whose customers have specific needs. A **mass market** is a large market in which most customers buy a standardized product sold with one broad marketing mix.
      - term: Product
        text: 'Niche: specialized, often made in small quantities or tailored to the customer. Mass: standardized and made in large volumes.'
      - term: Price and margin
        text: 'Niche: often a premium price and a high margin per unit, because customers value the specialism and have few alternatives. Mass: lower prices and thinner margins, made up for by high volumes and economies of scale.'
      - term: Promotion and place
        text: 'Niche: targeted promotion, such as specialist media, direct marketing and social media, and selective distribution. Mass: mass media and wide distribution, which need large budgets.'
      - term: Competition
        text: 'Niche: fewer direct rivals, though larger firms may move in once the niche proves profitable. Mass: intense competition, often on price.'
      - term: Risk
        text: 'Niche: a small customer base, so a change in taste or one new rival can hit hard. Mass: heavy spending is at stake, and a product designed for everyone may fully satisfy no one, which leaves room for niche competitors.'
    example:
      title: One coffee market, two strategies
      fictional: true
      text: |
        Quickcup, a fictional national chain, sells one standard range from drive-through kiosks at low prices and advertises on national radio: a mass-market strategy that depends on high volumes and low costs.

        Slow Bean, a fictional roaster, sells only decaffeinated coffee from single farms, by monthly subscription, to a few thousand customers who want flavour without caffeine. It charges a premium price, spends almost nothing on mass media and knows many of its customers by name. If a large roaster launched a similar range, Slow Bean's niche would be at risk; its defence is the loyalty it has built.
  - id: positioning-and-position-maps
    title: Positioning and position maps
    kind: method
    body: |
      **Positioning** is the last step: deciding how the business wants its target customers to see its product compared with rivals, and then making every element of the marketing mix support that view. A position might be the cheapest choice, the most luxurious, the most reliable or the most environmentally responsible. What counts is the position in customers' minds, which may differ from the one the business intends.

      A **position map**, also called a perceptual map, shows positions visually. Each axis shows an attribute customers care about, such as price or perceived quality, and each brand is plotted where customers place it. To construct one:

      1. Choose two attributes that matter in the target market's buying decisions.
      2. Ask a sample of customers to rate each brand on both attributes, and average the ratings.
      3. Draw the axes, label both ends of each, and plot every brand.
      4. Read the map: look for clusters of rivals, brands in weak positions and empty spaces.

      An empty space may be a **gap in the market**, a combination customers want that nobody offers. It may also be empty because few customers want that combination, or because nobody can supply it at a profit, so a gap is a question for more research, not an answer. Moving a brand to a new place on the map, **repositioning**, means changing customers' settled perceptions, which is slow and costly because every P has to change together.

      You can build maps from a simulated survey, and judge whether a gap is worth filling, in the [Market Studio](/market-studio/positioning-map/), where you can also plot a market of your own.
    points:
      - term: Choosing the axes
        text: Pick attributes that customers actually use when they choose, and on which brands differ. Different pairs tell different stories, so the same market can be mapped in several ways.
      - term: Clusters
        text: Brands close together compete head to head for the same customers. Entering a crowded area needs a strong reason for customers to switch.
      - term: Weak positions
        text: A brand seen as high in price but low in quality, such as Saltmarsh on the map below, must raise its quality, or the way customers perceive it, or cut its price.
    diagram: position-map
    advantages:
      - Shows at a glance where a brand stands against its rivals, as customers see it.
      - Helps to spot crowded areas to avoid and possible gaps to investigate.
      - Checks whether customers see the brand as the business intends, and whether a repositioning has worked.
    limitations:
      - It shows one sample's perceptions, not facts about the products; another sample or other axes would give another map.
      - Only two attributes appear at a time, though customers weigh many.
      - A map drawn from managers' opinions rather than research may show only what managers hope.
      - 'It is a snapshot: positions shift as rivals act and tastes change.'
    example:
      title: Reading the coffee map
      fictional: true
      text: |
        The diagram plots six fictional coffee brands as surveyed customers see them. Kettle Lane and Harbour Roast hold the high-price, high-quality area, while Quickcup and Daybreak are cheap and seen as ordinary. Saltmarsh is in a weak position: customers see a high price and low quality.

        The circle marks a possible gap, good perceived quality at a modest price. Corner Brew is the nearest brand to it, with a below-average price and quality rated a little above average. Before it moves towards the gap, it should ask three questions. Do customers really want that combination? Can it supply good quality at that price and still make a profit? How quickly would rivals follow?
  - id: unique-selling-point
    title: The unique selling point (USP)
    kind: concept
    body: |
      A **unique selling point** (or proposition), the **USP**, is a feature or benefit that makes a product different from its rivals and gives customers a reason to choose it. It answers the customer's question: why this one?

      A USP matters because most customers have plenty of alternatives. A product with nothing distinctive has to compete on price, which squeezes profit margins. A clear USP helps a business stand out, gives its promotion something specific to say, supports a higher price, and builds loyalty, because customers cannot get the same thing elsewhere. It is often the centre of a brand's positioning.

      A USP is valuable only if three things are true: customers **care** about it, it is genuinely **different**, and rivals **cannot easily copy** it. Most USPs are copied in the end, so businesses have to keep renewing them.
    points:
      - term: The product
        text: A feature, design, ingredient or level of quality that no rival offers.
      - term: Price or value
        text: Being the cheapest, or the best value, can be a USP if the business's costs are low enough to keep it up; otherwise rivals can simply match the price.
      - term: Service
        text: Speed, convenience, guarantees or after-sales care.
      - term: How it is made or sourced
        text: Hand-made, local, organic or ethically sourced production.
      - term: The brand
        text: A reputation or identity, built up over years, that customers value for itself.
    advantages:
      - Gives customers a clear reason to buy, which helps a new or small business win attention.
      - Makes promotion sharper and easier to remember.
      - Reduces direct price competition and can support a premium price.
      - Builds loyalty and, over time, brand value.
    limitations:
      - Creating and protecting a USP costs money, for example in research, design or patents.
      - Successful USPs attract imitators, so the advantage is often temporary.
      - A difference that customers do not value is not a selling point.
      - 'Claims must be true: an exaggerated USP damages trust and may break advertising law.'
    example:
      title: Roasted this morning
      fictional: true
      text: |
        Corner Brew roasts its beans on the premises every morning and prints the roasting date on every cup and every bag. The chains nearby cannot match this, because they roast centrally and ship to their branches.

        The USP gives Corner Brew's promotion one simple message, and it supports the position it is aiming for: good quality at a modest price. The test is whether customers notice and care. If they cannot taste the difference, the USP is just a fact about the café.
  - id: differentiation
    title: How organizations differentiate themselves and their products
    kind: evaluation
    body: |
      **Differentiation** means making a business or its products different from rivals in ways that customers value, so that customers are less likely to choose on price alone. A USP is usually the sharpest point of a wider differentiation strategy.

      A business can differentiate through almost anything it offers, and the strongest differentiation combines several routes that reinforce each other. A difference is worth having only if customers value it more than it costs to provide, and if it lasts long enough to repay the investment.

      The guide sets this statement at AO3, so an examination answer should go beyond listing routes: judge how far a particular route would work for the business in the case, at what cost, and for how long.
    points:
      - term: Product features, quality and design
        text: Better performance, durability, design or ingredients. Patents and design rights protect some differences for a time, but rivals catch up.
      - term: Branding and image
        text: A distinctive identity and reputation (4.5) that customers trust or admire.
      - term: Customer service
        text: Advice, speed, guarantees and after-sales care from well-trained staff. It is hard to copy, because it depends on people and culture.
      - term: Distribution and convenience
        text: Being easier to buy from, through more outlets, faster delivery, longer opening hours or a better app.
      - term: Ethical and sustainable practices
        text: Fair trade sourcing, lower emissions or recyclable packaging, which matter more and more to some segments. They must be genuine, because claims that cannot be backed up destroy trust.
      - term: People, processes and physical evidence
        text: For a service, the staff, the way the service is delivered and the look of the premises (4.5).
      - term: "Porter's generic strategies (toolkit)"
        level: HL
        text: An HL toolkit tool. Porter treats differentiation as one route to competitive advantage, set against cost leadership, with a focus version of each for a narrow segment. A business that tries to be both the cheapest and the most distinctive risks being stuck in the middle, with neither advantage.
    advantages:
      - Customers become less sensitive to price, so the business can charge more and protect its margins.
      - Builds loyalty and repeat custom.
      - Reduces head-to-head competition with rivals.
      - Strengthens the brand, which helps when the business launches new products.
    limitations:
      - Differentiating costs money, in research, design, training or better materials, which raises prices or cuts margins.
      - Rivals imitate successful differences, so they have to be renewed.
      - Customers may not value, or even notice, the difference.
      - Some customers will always buy the cheapest option, so differentiation narrows the market a business can win.
    example:
      title: Two cafés, one street
      fictional: true
      text: |
        Corner Brew and a branch of a national chain sit on the same street. The chain is cheaper and faster. Corner Brew differentiates on several routes at once: beans roasted on site (product), staff who can explain each coffee (service), a refillable cup scheme and compostable packaging (sustainability), and an evening tasting club (an experience the chain does not offer).

        Each route alone could be copied; together they give customers a reason to walk past the chain. Whether it pays depends on whether enough customers value the difference more than it costs Corner Brew to provide.
evaluation:
  - A marketing plan is a means, not an end. It improves decisions only when it rests on reliable research and is reviewed as the market changes; in a fast-moving market, a short plan revised often can be worth more than a detailed one that is never updated.
  - Segmentation, targeting and positioning stand or fall together. A precise segment is useless if the business cannot reach it or serve it profitably, and a position on a map means little unless every element of the marketing mix supports it.
  - A position map shows perceptions, not facts. It depends on which customers were asked and which two attributes were chosen, and a gap on it is a question to test, not proof of demand.
  - Niche or mass is a strategic choice that depends on resources. A niche suits a small business with specialist strengths but leaves it exposed to changes in one small group; a mass market brings scale but demands large budgets and fierce price competition.
  - A USP and differentiation are worth only what customers will pay for them, and only for as long as rivals cannot copy them. Most advantages fade, so the real question is how a business will keep renewing its difference.
  - In an examination answer, apply the tools to the case's own customers and rivals. Name the segment, explain why it suits the business, and judge whether the proposed position or USP is believable and defensible. A generic list of segmentation bases or differentiation routes earns little.
connections:
  - code: '1.3'
    text: Marketing objectives follow from the business's overall objectives, and ethical objectives shape which differences a business promotes.
  - code: '1.5'
    text: Serving a profitable niche is one reason a business may choose to stay small.
  - code: '4.1'
    text: Market orientation starts from customers' needs, and market share shows whether a plan worked.
  - code: '4.4'
    text: Market research identifies segments, customer needs and possible gaps, and supplies the ratings behind a position map.
  - code: '4.5'
    text: The marketing mix delivers the target market, position and USP chosen in the plan.
  - code: '4.6'
    text: At HL, segmenting and positioning are applied to foreign markets.

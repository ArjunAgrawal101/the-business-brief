retrieval:
  - q: Give two reasons why a profitable business can be short of cash.
    a: For example, sales made on credit (revenue now, cash later), cash paid for stock before it is sold, an asset bought with cash while its cost reaches profit only gradually as depreciation, or loan repayments, which take cash out but are not costs.
  - q: Define working capital, and give its formula.
    a: The money a business has for its day-to-day running once its short-term debts are allowed for. Working capital = current assets − current liabilities.
  - q: In a cash flow forecast, how is the closing balance found, and where does it go next?
    a: Closing balance = opening balance + net cash flow, where net cash flow = total cash inflows − total cash outflows. It becomes the next month's opening balance.
  - q: A business sells $8,000 of goods in March on 60 days' credit. In which month is the cash inflow entered in its forecast?
    a: In May, when the customer pays, not in March, when the sale is made.
  - q: Why does depreciation never appear in a cash flow forecast?
    a: No cash moves when depreciation is charged. The cash left the business when the asset was paid for, and that payment is what the forecast shows.
  - q: What is overtrading, and why can it sink a business whose sales are growing?
    a: Expanding faster than working capital allows. Each new order means stock and wages paid for before customers pay, so the cash gap widens as sales grow, until the business cannot pay its bills.
  - q: Give two pieces of evidence you would use to judge a business's liquidity position.
    a: For example, its cash balance and forecast closing balances, its working capital and what it is made of, its current and acid test ratios, and how much of its overdraft is unused.
  - q: Why can a new investment reduce cash flow, and perhaps profit, at first?
    a: The cash is paid out at the start, with set-up costs, while the returns arrive later. Depreciation of the new assets and interest on any loan also reduce profit in the early years.
  - q: Give one way to bring cash inflows forward, and its drawback.
    a: For example, debt factoring (the fee cuts profit, and customers may see it as a sign of trouble), a discount for prompt payment (it cuts revenue), or shorter credit terms (customers may go to rivals).

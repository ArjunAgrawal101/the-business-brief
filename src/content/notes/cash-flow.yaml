# Notes: 3.7 Cash flow. Written in the platform's own words from the guide's
# six content statements (pp. 29 to 30), the tools it suggests for unit 3
# (p. 28), its cash flow forecast layout (figure 10, p. 63) and its formula
# list (pp. 64 to 65), which gives no cash flow formulas, so the standard
# forms that follow from the layout are used.
# The teacher support material's glossary was read to check terms; no
# coursebook chapter for unit 3 was supplied. Every business named is
# fictional, and every figure was checked by arithmetic. The strategies are
# common options, not a list the guide prescribes.
code: '3.7'
title: Cash flow
level: SL/HL
introduction: |
  Cash is what a business pays its bills with. Staff, suppliers, landlords and banks want cash on the day it is due, and the promise of a profit next month will not do instead. A business that runs out of cash can be forced to close even while it is making a profit.

  This subtopic explains why profit and cash flow differ, and how working capital and a business's liquidity position show whether it can keep going. It shows how to construct and read a **cash flow forecast** in the layout the IB uses, why investing can drain cash before it adds to profit, and what a business can do when its cash runs short.
objectives:
  - '**Distinguish** between profit and cash flow, and **explain** why a profitable business can run short of cash.'
  - '**Calculate** working capital, and **explain** how the working capital cycle ties up cash.'
  - '**Analyse** a business''s liquidity position from its cash, its working capital and its liquidity ratios.'
  - '**Construct** a cash flow forecast in the guide''s layout, and **comment** on what it shows.'
  - '**Explain** the relationship between investment, profit and cash flow.'
  - '**Evaluate** strategies for dealing with cash flow problems.'
sections:
  - id: profit-and-cash-flow
    title: Profit and cash flow are different
    kind: concept
    body: |
      **Profit** is revenue minus costs for a period, counted when the revenue is earned and the costs are incurred. **Cash flow** is the money that actually moves into and out of the business in that period: **cash inflows** coming in and **cash outflows** going out. The two measure different things, and the gap between them is mostly a matter of timing.

      A sale made on credit in March is March's revenue and adds to March's profit, but if the customer pays in May, the cash arrives in May. Going the other way, the cash for a new van leaves on the day the van is paid for, while its cost reaches the statement of profit or loss a little at a time, as depreciation. Some cash flows are never revenue or costs at all: a bank loan brings cash in but is not revenue, and repaying it takes cash out but is not a cost.

      So a business can be profitable and short of cash at the same time, or make a loss and still have money in the bank, for a while. Over a long enough period profit and cash come together; in any one month they can be far apart.
    points:
      - term: Credit sales
        text: Count as revenue, and so towards profit, when the sale is made. The cash arrives later, when the customer pays.
      - term: Credit purchases
        text: Supplies bought on trade credit can be used, and even sold, before they are paid for, which helps cash flow.
      - term: Stock
        text: Cash goes out when stock is paid for, but its cost reaches profit only when the stock is sold, which may be months later.
      - term: Assets and depreciation
        text: Buying an asset takes cash out at once, but its cost reaches profit only gradually, as depreciation. Depreciation itself is never a cash outflow.
      - term: Loans and owners' money
        text: Loans and new share capital bring cash in but are not revenue. Repaying a loan takes cash out but is not a cost.
    example:
      title: A profitable job that drains the bank
      fictional: true
      text: Pinecrest Joinery, a fictional maker of fitted kitchens, finishes a $40,000 kitchen for a property developer in April. Materials cost $16,000 and wages $10,000, so the job earns a profit of $14,000 in April. But the wages are paid in April, the materials were bought on 30 days' credit and are paid for in May, and the developer has 60 days to pay, so the $40,000 arrives in June. The job's cash flow is ($10,000) in April, ($16,000) in May and $40,000 in June. Over the three months the cash and the profit agree, at $14,000, but for two months the profitable job drains the bank account.
  - id: working-capital
    title: Working capital
    kind: concept
    body: |
      **Working capital** is current assets minus current liabilities: the money a business has for its day-to-day running once its short-term debts are allowed for. It pays for the stock, wages and bills that keep the business trading until its customers pay.

      Working capital does not sit still. It moves round the **working capital cycle**: cash buys materials and labour, these become stock, the stock is sold, often on credit, and when customers pay, the debtors turn back into cash. The longer the cycle takes, the more working capital the business needs. Holding stock for less time, collecting from customers sooner and paying suppliers later all shorten it.

      What working capital is made of matters as much as its size. Cash can pay a bill today; debtors depend on customers paying; stock has first to be sold.
    diagram: working-capital-cycle
    formulas:
      - name: Working capital
        expression: Working capital = current assets − current liabilities
        note: The guide's formula list does not include it; this is the standard definition, from two lines of the statement of financial position.
    points:
      - term: Too little working capital
        text: The business may be unable to pay its suppliers and staff on time, may lose its credit terms and discounts, and has no buffer against a slow month.
      - term: Too much working capital
        text: Cash, stock or debtors are tied up instead of earning a return elsewhere, and stock may go out of date.
      - term: Overtrading
        text: Growing faster than working capital allows. More orders mean more stock and wages paid for before customers pay, so the cash gap widens with every sale, and a business whose sales are booming can run out of cash.
    example:
      title: Working capital that is not cash
      fictional: true
      text: |
        Hollow Oak Furniture, a fictional maker of dining tables, has current assets of $96,000 (cash $12,000, debtors $36,000 and stock $48,000) and current liabilities of $60,000. Its working capital is $96,000 − $60,000 = $36,000.

        It wins an order for 40 tables at $1,500 each from a hotel group that pays 60 days after delivery. Each table needs $700 of timber and wages, paid while the tables are being made. The order will earn a profit, but it needs $28,000 of cash two months before the $60,000 arrives, and only $12,000 of Hollow Oak's working capital is cash. Unless it arranges finance first, or collects faster from its own debtors, it could find itself unable to pay its bills: growth that outruns working capital is overtrading.
  - id: liquidity-position
    title: Liquidity position
    kind: application
    body: |
      A business's **liquidity position** is how well it can pay its debts as they fall due. It is strong when the business has enough cash, or assets that will soon become cash, to meet what it owes over the coming months with room to spare. It is weak when one late payment or one slow month would leave it unable to pay.

      No single number settles it. Judge it from several pieces of evidence together:

      - the cash balance now, and the closing balances in the cash flow forecast;
      - the working capital, and what it is made of;
      - the current ratio and the acid test ratio ([3.5](/topics/profitability-and-liquidity-ratio-analysis/));
      - how much of the agreed overdraft is still unused, and how all of these have changed over recent months.

      A weak liquidity position is dangerous even for a profitable business. Suppliers stop giving credit, the bank may cut the overdraft, and a business that cannot pay its debts as they fall due is **insolvent**, which can end in its closure. HL students compare insolvency with bankruptcy in [3.6](/topics/efficiency-ratio-analysis/).
    example:
      title: Same working capital, different positions
      fictional: true
      text: Two fictional shops each have current assets of $50,000 and current liabilities of $30,000, so each has working capital of $20,000 and a current ratio of 1.67. Eastbrook Pharmacy's current assets are $18,000 of cash, $2,000 owed by customers and $30,000 of medicines that sell every day. Westbrook Furniture's are $2,000 of cash, $8,000 of debtors and $40,000 of sofas that sell slowly, and $20,000 of its current liabilities are supplier bills due this month. Eastbrook's acid test ratio is 0.67 and Westbrook's 0.33. Westbrook cannot pay this month's bills without selling sofas quickly or borrowing, so the same working capital hides a much weaker liquidity position.
  - id: cash-flow-forecasts
    title: Cash flow forecasts
    kind: method
    body: |
      A **cash flow forecast** estimates the cash a business expects to receive and to pay out in each month of a coming period, often six or twelve months, and so the cash it will hold at the end of each month. It is a plan built on estimates: of sales, of when customers will pay, and of the costs the business expects to meet.

      The guide's layout runs down each month's column in this order: the **opening balance**; the cash inflows, item by item, then **total cash inflows**; the cash outflows, item by item, then **total cash outflows**; the **net cash flow**; and the **closing balance**, which becomes the next month's opening balance. Negative figures, such as a negative net cash flow or an overdrawn balance, are shown in brackets.

      The rule that matters most is to enter each item in the month the cash moves, not the month the sale or purchase is made. A sale on 30 days' credit in March is a cash inflow in April. Depreciation never appears, because no cash moves; the purchase of the asset does, in the month it is paid for.

      In the diagram, February's net cash flow of ($5,000) takes the balance from $3,000 to ($2,000), so the business would need an overdraft of at least $2,000 to get through the month.
    diagram: cash-flow-forecast
    formulas:
      - name: Net cash flow
        expression: Net cash flow = total cash inflows − total cash outflows
      - name: Closing balance
        expression: Closing balance = opening balance + net cash flow
      - name: Opening balance
        expression: Opening balance = the previous month's closing balance
        note: The guide's formula list does not include these; they follow from its cash flow forecast layout (p. 63).
    advantages:
      - Warns of a cash shortfall early enough to act, for example by arranging an overdraft before it is needed.
      - Supports an application for a loan or an overdraft, since lenders often ask to see one.
      - Helps to time spending, such as buying equipment in a month when cash is high.
      - Gives a benchmark, so that actual cash flows can be compared with the forecast each month and problems show up early.
    limitations:
      - It is only as good as its estimates, and sales forecasts can be wrong, especially for a new business with no history.
      - Customers may pay late, and costs such as energy, materials and wages can change.
      - Events outside the business, such as a new competitor or a recession, are hard to foresee.
      - It takes time to prepare, and it has to be updated as conditions change.
    example:
      title: Ridgeway Cycles, April to June
      fictional: true
      # In the forecast rows below, each middle dot between the months' figures
      # has a no-break space on both sides, so a row's three figures stay
      # together on a phone.
      text: |
        Ridgeway Cycles, a fictional bicycle shop, has $2,000 in the bank at the start of April. It expects cash sales of $6,000, $7,000 and $8,000 in April, May and June. A courier firm that uses its repair service pays 30 days after each invoice; it was invoiced $3,000 in March and in April, and will be invoiced $4,000 in May. Parts are bought on 30 days' credit: $2,000 in March, and $2,500 in each of April and May. Wages are $4,500 a month and rent is $1,500. In May Ridgeway plans to pay $6,000 for equipment to service electric bikes.

        Figures in $, for April, May and June:

        - Opening balance: 2,000 · 3,000 · (1,500)
        - Cash sales: 6,000 · 7,000 · 8,000
        - Courier firm (paid a month after invoicing): 3,000 · 3,000 · 4,000
        - Total cash inflows: 9,000 · 10,000 · 12,000
        - Parts (paid a month after delivery): 2,000 · 2,500 · 2,500
        - Wages: 4,500 · 4,500 · 4,500
        - Rent: 1,500 · 1,500 · 1,500
        - Equipment: 0 · 6,000 · 0
        - Total cash outflows: 8,000 · 14,500 · 8,500
        - Net cash flow: 1,000 · (4,500) · 3,500
        - Closing balance: 3,000 · (1,500) · 2,000

        The forecast shows Ridgeway overdrawn by $1,500 at the end of May. The cause is one large payment in one month, not weak trade: in every month the inflows more than cover the regular outflows.
  - id: investment-profit-and-cash-flow
    title: Investment, profit and cash flow
    kind: concept
    body: |
      **Investment** means spending now on assets or projects, such as machinery, a new store or research, in order to earn more in the future. It links profit and cash flow in a pattern that repeats over time.

      1. **At the start**, the investment takes a large sum of cash out, and set-up costs, training and launch marketing come before any extra revenue. Cash flow is strongly negative, and profit may fall.
      2. **As it begins to earn**, extra revenue arrives, but profit also carries the depreciation of the new assets, and the interest on any loan that paid for them.
      3. **When it succeeds**, the returns lift both profit and cash inflows, and over its life the investment repays the cash it used.

      The danger lies in the gap between the cash going out and the returns coming in. A business can make an investment that will be very profitable and still run out of cash before the returns arrive. That is why long-term investment should be paid for with long-term finance ([3.2](/topics/sources-of-finance/)) rather than from working capital or an overdraft, and why its timing is checked with investment appraisal ([3.8](/topics/investment-appraisal/)). The same pattern runs through a product's life cycle: cash flow is usually negative around the launch and strongest in maturity ([4.5](/topics/the-seven-ps-of-the-marketing-mix/)). The [BCG matrix](/glossary/bcg-matrix/), a toolkit tool the guide suggests for this unit, rests on the same idea: question marks usually need more cash than they earn, stars use most of what they earn to keep growing, and cash cows produce the surplus that pays for the others.
    example:
      title: 'A new oven: profit from the first year, cash from the fourth'
      fictional: true
      text: |
        Millstone Bakery, a fictional bakery, pays $60,000 in January for a second oven so that it can supply local cafés. It expects the oven to last six years, with no value at the end, so it charges $10,000 a year of depreciation. Each year the café orders bring in $40,000 of extra revenue for $22,000 of extra flour, staff and energy.

        - Profit: $40,000 − $22,000 − $10,000 = $8,000 more profit every year, from the first year.
        - Cash: in year 1, $40,000 comes in and $22,000 plus the $60,000 oven goes out, a net cash flow of ($42,000). From year 2 the oven adds $18,000 a year. The bakery has its $60,000 back partway through year 4, after about 3.33 years.

        Over the six years the oven adds $48,000 to profit and $48,000 to cash. The totals are the same; only the timing differs, and in year 1 that timing turns a profit of $8,000 into a cash drain of $42,000.
  - id: causes-of-cash-flow-problems
    title: Why cash runs short
    kind: application
    body: |
      A cash flow problem has a cause, and a strategy works only if it fits the cause. Most shortfalls come from one or more of these.
    points:
      - term: Overtrading
        text: Growing faster than working capital allows, so that stock and wages are paid for long before customers pay.
      - term: Poor credit control
        text: Customers are given too long to pay, late payers are not chased, or some never pay at all.
      - term: Too much stock
        text: Cash is tied up in stock that sells slowly, or that goes out of date before it sells.
      - term: Seasonal demand
        text: Sales come in a few months of the year while rent, wages and loan repayments continue in every month, as for a ski school or a garden centre.
      - term: Unexpected costs or falling sales
        text: A breakdown, a supplier's price rise, a new competitor or a recession can open a gap that the forecast did not show.
      - term: Investment and borrowing
        text: Buying assets out of working capital, or repaying debt faster than the business can afford, takes cash it needs for its everyday running.
      - term: Poor planning
        text: Without a forecast, or with one that is never updated, the business sees the shortfall only when a payment fails.
  - id: cash-flow-strategies
    title: Strategies for dealing with cash flow problems
    kind: evaluation
    body: |
      There are three ways to close a cash gap: **reduce or delay cash outflows**, **increase or bring forward cash inflows**, or **find extra finance** to cover it. Each has a cost. The best choice depends on the cause of the problem, how long it will last and what the business can afford to give up. A seasonal dip calls for a short-term fix, but a business that loses money every month needs more than a bigger overdraft. These are the usual options, not a list the IB prescribes.
    points:
      - term: Ask suppliers for longer credit
        text: Delays outflows and keeps cash in the business for longer, at no direct cost. Suppliers may refuse, raise their prices or withdraw credit if payments become late, and any discount for prompt payment is lost.
      - term: Lease or rent instead of buying
        text: Replaces one large outflow with smaller regular payments. Over the life of the asset, leasing usually costs more than buying, and the business never owns the asset unless the agreement lets it buy.
      - term: Delay or cut spending that can wait
        text: Postponing a replacement machine, ordering less stock or trimming costs such as some marketing reduces outflows quickly. Delays can store up problems, since old machines break down and low stock risks lost sales.
      - term: Chase debtors and tighten credit terms
        text: Invoicing promptly, following up late payers, shortening the time allowed to pay or asking for deposits brings cash in sooner. Customers may move to rivals that offer better terms.
      - term: Offer a discount for prompt payment
        text: Brings cash in sooner, but the discount cuts the revenue, and the profit, on every sale where it is taken.
      - term: Debt factoring
        text: A factor pays most of the value of the business's invoices at once and then collects them itself. Its fee reduces profit, and some customers may read the use of a factor as a sign of trouble.
      - term: Sell surplus stock or assets
        text: Clearing slow-selling stock or selling equipment the business no longer needs brings cash in. Stock may have to be discounted, and with sale and leaseback the business keeps using an asset but pays to lease it for years.
      - term: Overdraft or short-term loan
        text: Quick to arrange, and suited to a short gap such as a seasonal dip. Interest is usually higher than on a long-term loan, the bank can withdraw an overdraft at short notice, and borrowing does not fix the cause.
      - term: Owners' funds or new share capital
        text: Adds cash with no interest to pay. A sole trader puts personal savings at risk, new shareholders dilute the owners' control, and raising share capital takes time.
    example:
      title: Three ways through Ridgeway's May
      fictional: true
      text: |
        Ridgeway Cycles' forecast showed it overdrawn by $1,500 at the end of May, because of the $6,000 equipment payment. Each option below is set against the original forecast.

        - Buy the equipment in June instead. May closes at $4,500 and June at $2,000. The cost is a month without the new equipment, and the work it would have brought in.
        - Lease the equipment for $200 a month over three years, from May. May closes at $4,300 and June at $7,600. Over three years Ridgeway pays $7,200 for equipment it could buy for $6,000, and it never owns it.
        - Keep the plan and agree an overdraft of at least $1,500 for May. It is simple and short, but it costs interest and depends on the bank agreeing.

        The gap comes from one payment in one month, and the shop's trading brings in more cash than it pays out every month, so a short fix fits the cause: a month's delay, or a small overdraft. Leasing answers a one-month problem with a three-year commitment, although it might still suit Ridgeway if it would rather not tie up $6,000 at all.
evaluation:
  - Profit and cash answer different questions. Profit shows whether the business is worth running; cash shows whether it can keep running. Over the life of an investment the two come together, as Millstone's oven shows, but in any one month they can be far apart, and a business has to survive every month to reach the long run.
  - A forecast is a set of estimates. Its closing balances are only as reliable as the sales figures and payment dates behind them, and a new business has the least history to estimate from. Treat the lowest balance as a warning, plan for a worse case, and update the forecast as actual figures arrive.
  - Fit the fix to the cause. An overdraft suits a short, seasonal or one-off gap; it does not cure overtrading, poor credit control or a product that loses money. If the cash problem comes from losses, the business needs to improve its profitability, not just its cash.
  - Every strategy moves the cost to someone else, whether suppliers paid later, customers pushed to pay sooner, owners asked for money or lenders charging interest. Squeezing stakeholders too hard damages relationships the business will need later, and paying small suppliers late raises ethical questions.
  - More cash is not always better. Cash that sits idle earns little and lowers the return on capital employed ([3.5](/topics/profitability-and-liquidity-ratio-analysis/)). The aim is enough liquidity to meet debts with a margin of safety, not as much cash as possible.
  - Investment often drains cash before it adds to profit. The answer is rarely to avoid investing; it is to match long-term spending with long-term finance, and to check when the returns will arrive before committing.

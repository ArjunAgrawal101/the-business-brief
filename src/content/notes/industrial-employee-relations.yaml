# Notes: 2.7 Industrial/employee relations. HL only, so the notes are HL
# throughout. Written in the platform's own words from the guide's three
# content statements (p. 27). The three lenses on conflict (unitarist,
# pluralist and critical) and the point that collective bargaining has become
# less prominent come from the teacher support material's lesson plan for 2.7
# (pp. 40 to 41); its glossary (pp. 80 to 90) was read to check definitions.
# Nothing from either is reproduced. Laws on unions, strikes, lockouts and
# contracts differ between countries, so the notes state none as fact. No
# coursebook chapter for unit 2 was supplied. Every business named is
# fictional, and every figure was checked by script.
code: '2.7'
title: Industrial/employee relations
level: HL
introduction: |
  Every organization depends on its people, and their interests and their employer's overlap without being the same. Employees want fair pay, security and a say in how they work; owners and managers want lower costs, flexibility and the freedom to change. **Industrial relations**, or **employee relations**, is the management of that relationship, including the disagreements it produces.

  This HL subtopic asks you to explain where conflict at work comes from (AO2), and to evaluate the approaches each side can take in a dispute and the ways of resolving one (AO3). Questions usually give you a dispute in a case and ask what a side should do, so the skill that matters is judging which approach would work, at what cost, and for whom.
objectives:
  - '**Explain** the main sources of conflict between employers and employees, and why conflict arises even when both sides gain from the organization''s success.'
  - '**Evaluate** the approaches employees can take in a dispute: collective bargaining, work-to-rule and strike action.'
  - '**Evaluate** the approaches employers can take: collective bargaining, threats of redundancies, changes of contract, closure and lockouts.'
  - '**Distinguish** between conciliation and arbitration, and **evaluate** each as a way of ending a dispute.'
  - '**Discuss** how employee participation, industrial democracy, no-strike agreements and single-union agreements can reduce conflict.'
  - '**Examine** what decides the balance of power in a dispute, and why a short-term win can carry long-term costs.'
situation:
  title: A dispute at Harrowfield Foods
  fictional: true
  text: |
    Harrowfield Foods, a fictional maker of chilled ready meals, employs 600 people at one plant, most of them members of the union it recognizes. Prices in the area have risen by about 6% in a year. The union has asked for a 7% pay rise. Management has offered 3%, and only if staff accept a new pattern of four 12-hour shifts a week, including weekends, so that the lines can run seven days a week.

    Last month staff began a work-to-rule: no overtime, and every hygiene check done in full and by the book. Output has fallen by 15%, and two supermarket customers have complained about late deliveries. The managing director has now told the union that unless the offer is accepted, the plant's best-selling range will move to the group's other plant, 200 km away, putting 150 jobs at risk. The union is balloting its members on a strike.

    How did a dispute about pay and shifts become a threat to 150 jobs, and what could either side do now to settle it without lasting damage?
sections:
  - id: employee-relations
    title: Employee relations and the parties involved
    kind: concept
    level: HL
    body: |
      **Industrial relations**, also called **employee relations**, is the relationship between an organization's managers and its employees, and the representatives of each, including how pay and conditions are agreed and how disagreements are handled. The older word *industrial* suggests factories, but the ideas apply just as much to hospitals, schools, airlines, banks and shops.

      Relations can be handled **individually**, between one employee and a manager, or **collectively**, between management and a group of employees acting together, usually through a trade union. Collective relations are the focus of this subtopic, because acting together changes the balance of power: one employee who refuses to work can be replaced, while a whole workforce cannot easily be.

      Good relations are worth a great deal. They make change easier to introduce, reduce absence and labour turnover, and avoid the lost output, missed deliveries and damaged reputation that a dispute brings. Poor relations turn every change into a battle. The diagram maps the whole subtopic: the sources of conflict, the approaches each side can take, and the routes towards a settlement.
    diagram: industrial-relations
    points:
      - term: Employees
        level: HL
        text: Want pay that keeps up with prices and is fair compared with others, security, safe and reasonable conditions, respect, and a say in decisions that affect them. Their power rests on the fact that the organization cannot work without them.
      - term: Trade unions
        level: HL
        text: Organizations of employees that represent their members in dealings with employers. They negotiate pay and conditions, advise and represent members in grievances and disciplinary cases, and campaign on issues such as health and safety. Members pay a subscription. A union is **recognized** when the employer agrees to negotiate with it.
      - term: Employers and managers
        level: HL
        text: Want to control costs, keep the flexibility to change how work is organized, and keep production going. Employers in the same industry sometimes form an employers' association to negotiate together.
      - term: Government
        level: HL
        text: Sets the legal framework, such as minimum pay, the rules on recognizing unions, how a lawful strike must be called and what employers may do in response. It may also offer conciliation services, and in public services it is often the employer. The law differs a great deal between countries.
    example:
      title: An annual round of talks
      fictional: true
      text: Each spring, the managers of Brenmoor Hospital, a fictional hospital, meet the union that represents its nurses to agree pay, staffing levels and shift patterns for the coming year. A joint committee meets every month in between to deal with problems before they grow, and both sides follow a written procedure if talks break down, first a meeting of senior managers and union officials, then an independent conciliator. Most years, nobody outside the hospital notices, which is what good employee relations look like.
  - id: three-views
    title: Three ways of seeing conflict at work
    kind: theory
    level: HL
    body: |
      Why does conflict at work happen at all? The answer shapes how managers respond to it. The IB's teacher support material suggests looking at industrial relations through three lenses, which are widely used in the study of employment relations. They are ways of interpreting conflict rather than theories that can be proved right or wrong, and most managers lean towards one without saying so.

      The lens matters in practice. A manager with a unitarist view treats a dispute as a failure of communication or the work of a few troublemakers, and may prefer to deal with staff one by one rather than through a union. A pluralist manager expects disagreement, negotiates with the union and builds procedures for settling disputes. The critical view warns that procedures can contain conflict without removing its causes, which is one reason why the same disputes keep returning.
    points:
      - term: Unitarist view
        level: HL
        text: The organization is a team with shared goals, and managers have the right to manage. Conflict is abnormal, a sign of poor communication, poor management or troublemakers, so unions are unnecessary at best. The view is common in small firms and among some large employers that do not recognize unions, but it can mistake real grievances for disloyalty.
      - term: Pluralist view
        level: HL
        text: The organization contains groups with different, legitimate interests, such as owners, managers and employees, so some conflict is normal and can even be useful. The task is to manage it through negotiation, agreed procedures and compromise, with unions as legitimate partners. Collective bargaining rests on this view.
      - term: Critical view
        level: HL
        text: Conflict reflects a deeper inequality of power between those who own and control organizations and those who work for them. Bargaining and procedures can contain disputes but not remove their cause, so conflict is unlikely ever to be fully resolved. It explains why disputes recur, but offers managers little practical guidance.
    example:
      title: Three readings of one dispute
      fictional: true
      text: When drivers at Pellow Logistics, a fictional delivery firm, refuse to use a new system that tracks their every stop, a unitarist reading blames poor communication and a few agitators, and calls for a better briefing. A pluralist reading sees a genuine clash of interests, efficiency against privacy and autonomy, to be negotiated with the union, perhaps by limiting what the data may be used for. A critical reading sees the system as one more way for the owners to control and intensify work, so any deal will only paper over the conflict. Each reading leads to a different response.
  - id: sources-of-conflict
    title: Sources of conflict in the workplace
    kind: concept
    level: HL
    body: |
      At root, conflict at work comes from interests that overlap without being the same. Both sides gain if the organization succeeds, but they also divide what it earns: every dollar of a pay rise is a dollar of cost to the employer, and every gain in flexibility for managers may mean less predictable lives for staff. Most disputes start from one of the sources below, and many from several at once.

      The guide sets this statement at AO2, so a question will usually ask you to explain the sources of conflict in a case. Look first for what has changed, since disputes most often begin with a change: prices rise and pay does not, a new system arrives, a contract is altered, or a new manager behaves differently from the last. Then ask how each side sees that change, because what managers see as necessary efficiency, staff may see as a broken promise.

      Conditions outside the organization shape how often conflict breaks out and how it ends. Rising prices put pressure on pay; low unemployment and shortages of skills strengthen employees' hand; recession, strong competition and the option of moving work elsewhere strengthen employers'.
    points:
      - term: Pay and benefits
        level: HL
        text: The commonest source. Pay that falls behind rising prices; rises that seem unfair compared with other groups or with directors' pay; cuts to bonuses, pensions or overtime rates; and unequal pay for work of equal value.
      - term: Hours and working conditions
        level: HL
        text: Shift patterns, weekend and night working, workloads, staffing levels, breaks, and health and safety. Changes that disrupt family life cause particular anger.
      - term: Job security
        level: HL
        text: Redundancies, closures, outsourcing, moving work to another site or country, temporary contracts, and new technology that replaces jobs.
      - term: Change
        level: HL
        text: New technology, restructuring, new targets or monitoring systems, and mergers, especially when they are introduced without explanation or consultation.
      - term: How people are treated
        level: HL
        text: Management style, discipline and dismissals felt to be unfair, discrimination, bullying, favouritism, and the sense of not being listened to.
      - term: Recognition and voice
        level: HL
        text: Whether the employer will recognize a union and negotiate with it at all, and how much information and say employees are given.
    example:
      title: Sources of conflict at Harrowfield
      fictional: true
      text: |
        The Harrowfield dispute in the situation combines four sources. **Pay**: a 3% rise when prices have risen by about 6% means that wages will buy less than before. **Hours and conditions**: four 12-hour shifts including weekends would disrupt staff's family lives. **Job security**: the threat to move the best-selling range puts 150 jobs at risk. **How people are treated**: tying the pay offer to the shift change, then announcing a threat rather than discussing it, tells staff that they are being handed terms rather than consulted.

        Management sees it differently. Competitors already run seven days a week, and supermarkets want deliveries every day. Both views are reasonable, which is exactly why the dispute is hard to settle.
  - id: employee-approaches
    title: Approaches to conflict by employees
    kind: types
    level: HL
    body: |
      The guide names three approaches that employees can take, in rising order of pressure: **collective bargaining**, **work-to-rule** and **strike action**. Other forms of industrial action exist, such as an overtime ban or a go-slow, but these three are the ones to know and to evaluate.

      The guide sets these approaches at AO3, so describing them is not enough. For each one, ask how much pressure it puts on the employer, what it costs the employees, how customers and the public are likely to react, and what it does to the relationship afterwards. An approach that wins this year's dispute but destroys trust can leave employees worse off in the long run.

      How much pressure employees can apply depends on their **bargaining power**: how hard they are to replace, how costly their absence is to the employer, how united they are, the state of the labour market and the law. Nurses, pilots and dock workers, whose absence causes immediate and visible harm, have more power than workers whose output can be made up later or bought elsewhere.
    points:
      - term: Collective bargaining
        level: HL
        text: |
          Employees negotiate as a group, usually through their union, rather than one by one. It is the normal first step and often the only one, and it ends in a collective agreement on pay and conditions.

          **For:** it gives employees far more power than bargaining alone, costs them no pay and keeps the relationship intact. **Against:** it works only if the employer is willing to negotiate and the union is credible, and it can be slow. Behind every negotiation lies the question of what each side will do if talks fail.
      - term: Work-to-rule
        level: HL
        text: |
          Employees do exactly what their contracts and the rules require and nothing more: no overtime, no covering for absent colleagues, every procedure followed to the letter.

          **For:** employees usually keep their basic pay because they are still working within their contracts, yet output falls and delays build up, which shows how much the organization relies on their goodwill. **Against:** the pressure builds slowly, managers may respond with threats of their own, and it can sour relationships and service for a long time.
      - term: Strike action
        level: HL
        text: |
          Employees collectively stop working, for a day, a series of days or until the dispute is settled. Strikes range from short token stoppages that show strength, through selective strikes by key groups, to all-out stoppages.

          **For:** it applies the greatest pressure, especially at busy times or where output cannot be made up later. **Against:** strikers usually lose pay, may put their jobs at risk and can lose public sympathy if customers or patients suffer, and the business may lose customers for good, which harms employees too. Many countries set legal conditions, such as a vote of union members and notice to the employer, before a strike is lawful.
    example:
      title: Harrowfield's work-to-rule
      fictional: true
      text: |
        Harrowfield's staff chose a work-to-rule before a strike. Refusing overtime and carrying out every hygiene check by the book has cut output by 15% while staff keep their basic pay, and the late deliveries have already drawn complaints from two supermarkets, which is exactly the pressure the union wanted.

        A strike would raise the pressure sharply, because chilled meals cannot be made in advance and supermarkets will not wait. But it would cost staff their wages, and if a supermarket moved its contract to another supplier, the jobs the union is trying to protect could be lost anyway. The union's choice is about how much risk it is willing to take, not only about how much pressure it can apply.
  - id: employer-approaches
    title: Approaches to conflict by employers
    kind: types
    level: HL
    body: |
      Employers have approaches of their own. The guide names five: **collective bargaining**, **threats of redundancies**, **changes of contract**, **closure** and **lockouts**. Collective bargaining appears in both lists because negotiation is open to both sides; the other four are ways of applying pressure, roughly in rising order of severity.

      Each pressure tactic carries the same risk: it may win the dispute and lose the workforce. Threats that are not carried out damage the employer's credibility; threats that are carried out cost money, skills and reputation. They also depend on the law, which in many countries limits how and when contracts can be changed, redundancies made or workers locked out, and requires consultation first.

      The employer's power depends on factors that mirror the employees': how easily it can replace staff or move the work elsewhere, how long it can survive lost production, how much stock or spare capacity it holds, and what customers, investors and the public will tolerate.
    points:
      - term: Collective bargaining
        level: HL
        text: Negotiating with employees' representatives to reach an agreement. It is usually the cheapest way to settle a dispute and to secure changes the business needs, for example by offering higher pay in exchange for new working practices, sometimes called a productivity deal. It requires compromise and can be slow.
      - term: Threats of redundancies
        level: HL
        text: Warning that jobs will go unless demands are dropped or changes accepted, for example because higher pay would make the business uncompetitive. It can persuade employees to settle, and the warning may be honest. But it creates fear and resentment, and if staff think it is a bluff it hardens opposition. Carrying it out costs redundancy payments, skills and morale.
      - term: Changes of contract
        level: HL
        text: Altering employees' terms, such as hours, shifts, duties or pay, or threatening to, sometimes by ending existing contracts and offering new ones on the changed terms. It can force through a change that negotiation could not, but in many countries it is restricted without agreement or proper notice, and it badly damages trust and can provoke a strike.
      - term: Closure
        level: HL
        text: Shutting a site or the whole business, or threatening to, for example by moving production elsewhere. A believable threat puts enormous pressure on employees, but both sides lose if it happens. The employer loses the site's capacity and skilled people, and pays the costs of closing it.
      - term: Lockouts
        level: HL
        text: Preventing employees from entering the workplace, so that they cannot work or be paid, until they accept the employer's terms. It is the employer's counterpart to a strike. It puts pressure on staff quickly, including those who never supported the dispute, but the business loses output while it lasts and its reputation can suffer for years.
    example:
      title: Harrowfield's threat
      fictional: true
      text: |
        Harrowfield's managing director has combined two approaches: a threat of **closure** of part of the plant, by moving the best-selling range to the group's other site, and with it a threat of **redundancies** for 150 staff. The aim is to make continuing the work-to-rule, or striking, look more costly to staff than accepting the offer.

        Whether it works depends on whether staff believe it. If the other plant has spare capacity and the group has moved work before, the threat is credible and may end the dispute quickly. If staff think it is a bluff, it will harden opposition and make a strike more likely. The managing director will then have to carry it out, at great cost, or back down and lose credibility in every future negotiation.
  - id: conciliation-and-arbitration
    title: Conciliation and arbitration
    kind: method
    level: HL
    body: |
      When the two sides cannot agree on their own, an independent third party can help. The guide pairs **conciliation** and **arbitration**, and the difference between them is who decides the outcome.

      In **conciliation**, a neutral third party, the conciliator, helps the two sides to talk: keeping communication open, clarifying what each side really needs, testing proposals and suggesting compromises. The conciliator decides nothing, so either side can reject the result, and any agreement belongs to the two sides. Some writers separate **mediation**, in which the third party goes further and recommends a settlement, but the guide does not draw that line.

      In **arbitration**, both sides present their case and evidence to an independent arbitrator, or a panel, who then decides the outcome. The sides usually agree in advance that the decision will be **binding** for an agreed period. Arbitration guarantees an end to the dispute, but each side gives up control of the result. In **pendulum arbitration**, the arbitrator must choose one side's final offer in full rather than splitting the difference, which pushes both sides to make reasonable offers in the first place.

      Conciliation is usually tried first, and arbitration follows if it fails, or is the step both sides commit to in advance, as in many no-strike agreements. In some countries the state provides both services free of charge.
    advantages:
      - Both can end a dispute without the lost output, lost pay and lasting bitterness of industrial action.
      - An independent view can break a deadlock and let each side move without appearing to back down.
      - Conciliation leaves the agreement in the two sides' hands, so both are more likely to keep it.
      - Arbitration guarantees a final outcome, which suits essential services that cannot be allowed to stop.
    limitations:
      - Conciliation works only if both sides are willing to move; it cannot force a settlement.
      - Arbitration takes control away from both sides, and the losing side may resent an outcome it never agreed to.
      - An arbitrator who usually splits the difference encourages extreme opening positions; pendulum arbitration removes that incentive but raises the stakes for both sides.
      - Both take time, and the third party may not understand the business in detail.
    example:
      title: Harrowfield meets a conciliator
      fictional: true
      text: |
        Suppose both sides at Harrowfield agree to meet an independent conciliator. Talking to each side separately, she finds that the union's deepest objection is not the 3% but compulsory weekend working, and that management's real need is seven-day production, not 12-hour shifts as such. She suggests a compromise neither side had proposed: a voluntary weekend rota paid at a premium, with 12-hour shifts only for staff who want them.

        If that fails, the two sides could agree to pendulum arbitration on pay. Facing an arbitrator who must pick one final offer in full, the union might lower its claim from 7% and management raise its offer from 3%, because the more reasonable offer is the one more likely to be chosen.
  - id: participation-and-democracy
    title: Employee participation and industrial democracy
    kind: method
    level: HL
    body: |
      Conciliation and arbitration deal with disputes once they have started. **Employee participation** and **industrial democracy** aim to prevent them, by giving employees a voice before decisions are made, so that changes are shaped with them rather than imposed on them.

      **Employee participation** means involving employees in decisions that affect their work. It ranges from informing them, through consulting them before a decision, to sharing decisions with them. Common methods include team briefings, suggestion schemes, staff surveys, quality circles that solve problems in their own area, and works councils in which elected representatives discuss plans with managers before they are carried out.

      **Industrial democracy** goes further, giving employees a genuine share of power over the organization's decisions. In its narrower sense it means **co-determination**, with elected employee representatives sitting on the board of directors, which some countries require of large companies. In a broader sense it includes employee-owned businesses and worker cooperatives, in which employees own the organization and elect its leaders.

      Both reduce conflict in the same way. Employees who understand the reasons for a change, and helped to design it, are less likely to resist it, and problems surface early, when they are cheaper to solve. But both depend on trust: consultation that managers then ignore breeds more cynicism than no consultation at all.
    advantages:
      - Draws on employees' knowledge of how the work is really done, which can improve decisions.
      - Raises motivation and commitment, through the responsibility and autonomy that Herzberg and self-determination theory describe (2.4).
      - Brings problems to light early and makes change easier to introduce.
      - Builds trust, which makes the next negotiation easier.
    limitations:
      - Takes time, which slows decisions, especially in a crisis.
      - Raises expectations; if managers ignore what they hear, cynicism and conflict increase.
      - Employee directors may feel torn between their colleagues and the board's duty to the whole organization, and may lack information or training.
      - Some decisions, such as redundancies, create real losers, and participation cannot remove that conflict of interests.
    example:
      title: A works council at Harrowfield?
      fictional: true
      text: Harrowfield's dispute might never have reached a threat of closure if staff had been involved earlier. Had management set up a works council and shared the supermarkets' demand for seven-day deliveries a year before, staff representatives could have helped to design a rota, perhaps the voluntary weekend teams the conciliator later suggested, before any offer was made. Participation would not have removed the disagreement about pay, but it would have separated it from the anger at being handed terms.
  - id: no-strike-and-single-union
    title: No-strike and single-union agreements
    kind: types
    level: HL
    body: |
      The guide's last two approaches to resolving conflict are agreements that change the rules of the relationship in advance, so that disputes are less likely to arise and less damaging when they do. They are often found together, for example when an employer opens a new site and agrees terms with a union before any staff are hired.

      Both are trade-offs. Each side gives something up in exchange for predictability, and whether the trade is a good one depends on how far the two sides trust each other, and on how fair the procedures are that replace the right to strike or the choice of union.
    points:
      - term: No-strike agreement
        level: HL
        text: |
          A union promises not to call strikes, usually for the life of a collective agreement, in exchange for benefits such as better pay and conditions and an agreed way of settling disputes, often binding or pendulum arbitration.

          **For the employer:** production is not interrupted, which suits continuous processes, essential services and businesses with demanding customers. **For employees:** guaranteed improvements and a route to settling disputes without losing pay. **Against:** the union gives up its strongest source of power, so employees depend on the fairness of the procedure, and critics argue that such agreements weaken unions. How far they can be enforced depends on the law.
      - term: Single-union agreement
        level: HL
        text: |
          The employer recognizes, and negotiates with, only one union for all of its employees, or for all of those at a site.

          **For the employer:** one set of negotiations instead of several, and no disputes between rival unions over whom each represents or which jobs belong to whose members. **For employees:** a single, stronger voice, and agreements that treat all groups consistently. **Against:** employees lose the choice of union, the one union may represent some groups better than others, and if the employer chose the union, staff may doubt its independence.
    example:
      title: Terms agreed before the first hire
      fictional: true
      text: When Coldmere Batteries, a fictional manufacturer, planned a new factory, it agreed terms with one union before recruiting anyone. The single-union agreement covers production, maintenance and office staff alike. The union agreed not to strike for the three years of the deal, and both sides agreed that any dispute that talks could not settle would go to pendulum arbitration. In return, starting pay was set above the local average, and a works council must be consulted on every change to shifts. The factory has run without a stoppage since it opened, but some of its engineers say the union, most of whose members work on the production lines, has not pressed their concerns hard enough.
  - id: bargaining-power
    title: Who wins, and at what cost
    kind: evaluation
    level: HL
    body: |
      The approaches in this subtopic are moves in a negotiation, and which ones work depends on the **balance of bargaining power** between the two sides. The same strike that wins a quick settlement in one business can destroy jobs in another, so judging an approach means judging the power behind it.

      It also means looking beyond the end of the dispute. A side that wins by force may face a less cooperative partner for years: lower productivity, more grievances and resistance to the next change. Settlements in which both sides gain something, such as a pay rise funded by agreed changes in working practices, tend to last longer than victories. The cost of a dispute is not only the output and pay lost while it lasts, but also the trust lost with them.

      Approaches also have an ethical side, which the teacher support material suggests discussing. A lockout punishes employees who never supported a dispute; a strike in a hospital can harm patients who have no part in it; a threat of closure that is really a bluff deceives employees; and an employer can impose new contracts within the law and still act unfairly.
    points:
      - term: Employees are stronger when
        level: HL
        text: Unemployment is low and their skills are scarce; many are union members and they are united; their absence causes immediate, visible and costly disruption, as with perishable food, transport or a peak season; the public supports them; and they can afford to lose pay for a while.
      - term: Employers are stronger when
        level: HL
        text: Unemployment is high and staff are easy to replace; work can be moved, automated or outsourced; the business holds large stocks or spare capacity elsewhere; demand is weak, so lost output costs little; and the law limits industrial action.
      - term: Both sides lose when
        level: HL
        text: A long dispute drives customers to competitors, damages the brand and leaves the business weaker, so that jobs and profits both fall. Recognizing that shared risk is often what brings the two sides back to the table.
    example:
      title: The cost of not settling
      fictional: true
      text: |
        Harrowfield's 600 staff earn an average of $30,000 a year, so its wage bill is $18,000,000. The union's 7% claim would add $1,260,000 a year and management's 3% offer $540,000, a gap of $720,000 a year.

        Management estimates that a full strike would cost about $250,000 of profit a week, after allowing for the wages it would not pay. A three-week strike would therefore cost about $750,000, more than the whole first-year gap. The comparison is not straightforward, though. A pay rise is built into the wage bill for every future year, while a strike's cost is paid once, and the larger risk is that a supermarket moves its contract elsewhere for good. Both sides have reasons to fear a long dispute, which is the strongest argument for a settlement.
applications:
  - industry: Healthcare and public services
    text: The employer is often the government or a public body, so disputes are partly political and pay is limited by public budgets. A strike harms patients, pupils or passengers rather than profits, which can cost strikers public sympathy, so the two sides often agree minimum levels of service during action, and independent pay review or arbitration is common.
  - industry: Manufacturing
    text: Large workforces on one site, often with many union members, can stop production entirely, and in just-in-time supply chains a strike at one supplier can halt a customer's factory within days. Employers' counter-threats to automate or move production abroad are often credible, which shapes how far unions push.
  - industry: Transport and logistics
    text: Ports, railways, airlines and delivery networks sell services that cannot be stored, so a stoppage is felt at once. Small groups, such as pilots, signal workers or crane operators, can halt a whole operation, which gives them strong bargaining power and makes no-strike agreements and arbitration attractive to employers.
  - industry: Hospitality and retail
    text: Workforces are often part-time, young and fast-changing, with fewer union members, so conflict more often shows as individual grievances, absence and resignations than as strikes. Disputes usually concern hours, rotas and low pay, and employers rely more on direct communication with staff than on collective bargaining.
  - industry: Technology
    text: Union membership has traditionally been low in technology firms, and highly skilled staff often settle disagreements by leaving for a rival. Conflict is more likely over monitoring, remote working, job cuts and the ethics of what the company builds, and disagreements on these can lead employees to act collectively as well.
  - industry: Social enterprises and cooperatives
    text: In a worker cooperative, industrial democracy is built in, because the employees own the business and elect its leaders. That narrows the divide between managers and workers, but not every disagreement, since members still argue over pay, hours and the balance between paying themselves and pursuing the social mission, a challenge Paper 3 may raise.
stakeholders:
  - group: Employees
    text: Pay, security and conditions are at stake, but so are their wages during any action and possibly their jobs if a dispute drives customers away. Employees do not always agree among themselves, since those who can afford a strike, or whose jobs are safe, may push harder than those who cannot.
  - group: Trade unions
    text: A union must win improvements to keep its members and its credibility, but a failed strike or a closure weakens it badly. No-strike and single-union agreements trade some of its power for recognition and influence, which some members welcome and others see as surrender.
  - group: Managers and owners
    text: They want lower costs and the freedom to change, and shareholders may press for savings that trigger disputes. Yet they also bear the cost of lost output, lost customers and damaged reputation, so a quick win by force can cost them more over time than a negotiated settlement.
  - group: Customers
    text: Customers face late deliveries, cancelled services or higher prices, and they may switch to competitors for good. In public services they are also voters and taxpayers, and their sympathy, for staff or for the employer, can decide how a dispute ends.
  - group: Government
    text: Government sets the law on unions, strikes and contracts, and is often the employer in public services. It must balance the right to take industrial action against the harm disputes cause the public and the economy, which puts it in conflict with unions, employers or both.
  - group: Suppliers and the local community
    text: A long strike or a closure hits suppliers' orders and local shops and services. A threat to move work elsewhere matters to a whole town, which is why local politicians and media often take sides.
evaluation:
  - No approach is good or bad in itself. Its effect depends on the balance of bargaining power in the case, shaped by the labour market, the cost of disruption, each side's finances, the law and public opinion, so an evaluation must use the evidence about these.
  - Think beyond the end of the dispute. Victories won by force leave resentment and less cooperation, while settlements in which both sides gain, such as pay linked to agreed changes in working practices, tend to last. The long-term relationship is usually worth more than this year's terms.
  - Preventing conflict is cheaper than resolving it. Consultation, participation and fair procedures stop many disputes before positions harden, but not all conflict can or should be prevented; on the pluralist and critical views, some interests genuinely conflict, and suppressing disagreement only hides problems.
  - Laws and customs differ widely between countries, for example on how a lawful strike is called, whether lockouts are allowed, how contracts can be changed and whether strikers can be replaced. An answer should say that an approach depends on the law, rather than assume it is always available.
  - The world of work is changing. The teacher support material notes that collective bargaining has become less prominent in recent decades, and part-time, temporary and gig workers are often not represented by unions at all, so conflict may show as turnover and individual grievances rather than as the collective approaches in the guide.
  - In an examination answer, identify the sources of conflict in the case, set out each side's interests and power, evaluate the approaches available in that context, weigh short-term against long-term effects and the stakeholders affected, and reach a justified judgement.
decision:
  title: Harrowfield's next move
  fictional: true
  brief: |
    Harrowfield Foods' managing director must decide her next step before the union's strike ballot closes in two weeks. The plant normally earns a contribution of $400,000 a week. The work-to-rule has cut output by 15%, which costs $60,000 a week in lost contribution, and its four weeks so far have cost $240,000. Both supermarket customers have warned that more late deliveries will put their contracts at risk.

    The wage bill is $18,000,000. The union's 7% claim would cost $1,260,000 a year; management's 3% offer costs $540,000 and depends on the new shift pattern, which is expected to save about $600,000 a year in overtime premiums.
  options:
    - label: Improve the offer and rethink the shifts
      text: Raise the offer to 5%, costing $900,000 a year, and replace compulsory 12-hour shifts with a voluntary weekend rota designed with staff representatives. Withdraw the threat to move production.
    - label: Conciliation, then pendulum arbitration
      text: Keep the 3% offer for now, propose independent conciliation at once, and offer binding pendulum arbitration on pay if conciliation fails, so that a third party settles the dispute while production continues.
    - label: Hold firm and prepare the move
      text: Impose the new shift pattern through changes to contracts, keep the 3% offer, and begin consulting on moving the best-selling range and its 150 jobs to the other plant if the work-to-rule continues.
  guidance: |
    Start with the figures. The current offer more than pays for itself: $540,000 a year of extra basic pay against about $600,000 of overtime premiums that the new shifts are expected to save, and that saving comes out of staff's pockets. Seen from the shop floor, staff are being asked to fund their own rise and work weekends as well, which is why the union is unlikely to accept the offer as it stands. Option A costs $360,000 a year more than the current offer, the same as six weeks of the work-to-rule at $60,000 a week, before counting the risk to the supermarket contracts.

    **Option A** is the most likely to end the dispute quickly and rebuild trust, because it meets both grievances, pay and compulsory weekends, and removes the threat. Its risks are the cost, which recurs every year, and the precedent: if action reliably wins concessions, the union may use it again. **Option B** hands the decision to a third party and keeps production running, and pendulum arbitration pushes both sides towards reasonable final offers. But it is slower, management may lose control of the outcome, and the shift question still needs staff's agreement. **Option C** might win quickly if the threat is believed, but it makes a strike more likely just when the business can least afford one, costs redundancy payments and skills if carried out, damages trust in every future negotiation and is the option most exposed to legal challenge.

    A strong recommendation justifies one option, or a sequence such as B leading towards A, using the figures and each stakeholder's position, and says what would change it: for example, evidence that the other plant could take the range cheaply would strengthen C, while a supermarket ending its contract would make a quick settlement urgent.
exam:
  - q: |
      Saltfleet Port, a fictional container port, plans to introduce automated cranes over two years, which would remove about a third of its crane operators' jobs. It has also frozen pay for a year, although prices are rising.

      Explain two possible sources of conflict between Saltfleet Port's management and its crane operators.
    marks: 4
    command: explain
    level: HL
    paper: '2'
    answer: |
      A strong response explains two distinct sources, each tied to the case:

      - **Job security:** automation would remove about a third of the operators' jobs, so operators may resist the cranes or demand guarantees, retraining or redundancy terms, while management sees automation as necessary to cut costs.
      - **Pay:** a pay freeze while prices rise cuts what operators' wages will buy, so they are likely to press for a rise, while management wants to hold costs down during an expensive investment.
      - Change imposed without consultation would be a valid alternative if the answer links it to the way the automation and the freeze are being introduced.

      Each source is worth up to two marks: one for identifying it, one for explaining why it causes conflict at Saltfleet.
  - q: Distinguish between conciliation and arbitration.
    marks: 4
    command: distinguish
    level: HL
    paper: '2'
    answer: |
      A strong response makes the difference clear for both methods:

      - **Who decides:** in conciliation the independent third party only helps the two sides reach their own agreement; in arbitration the third party hears both cases and decides the outcome.
      - **Whether the outcome binds:** either side can reject a conciliator's suggestions, while an arbitrator's decision is usually binding because both sides agree to accept it in advance.
      - A consequence may be added: conciliation keeps control with the two sides, while arbitration guarantees an end to the dispute but gives up control.

      Two clear differences, each made for both methods, make a complete answer.
  - q: Explain one advantage and one disadvantage, for employees, of a work-to-rule compared with strike action.
    marks: 4
    command: explain
    level: HL
    paper: '2'
    answer: |
      A strong response:

      - **Advantage:** employees usually keep their basic pay, because they are still doing what their contracts require, yet they still disrupt output by refusing overtime and goodwill; a strike usually costs them their pay. It may also keep more public sympathy.
      - **Disadvantage:** the pressure builds more slowly and may be easier for the employer to absorb, for example by rescheduling work or asking managers to cover, so it may take longer to win concessions than a strike would.

      Each point needs the explanation and the comparison with a strike, roughly two marks each.
  - q: |
      Kellmoor Buses, a fictional bus company, has told its 460 drivers that it will end their contracts and offer new ones with longer shifts and fewer paid breaks. The company says the change will save $1.1 million a year and is needed to compete for a new city contract. The drivers' union says the new rota would cut drivers' average pay by about $2,400 a year through lost overtime, and its members have voted for strike action.

      Evaluate Kellmoor Buses' decision to impose new contracts on its drivers.
    marks: 10
    command: evaluate
    level: HL
    paper: '2'
    answer: |
      A strong response would:

      - explain the approach as a **change of contract**, an employer's approach to conflict, and why Kellmoor chose it: savings of $1.1 million a year and the need to win the city contract;
      - use the figures: $1,100,000 ÷ 460 = about $2,391 a driver, almost exactly the $2,400 the union says drivers will lose, so the saving is in effect a transfer from drivers to the company, which explains the strength of feeling;
      - analyse the benefits for Kellmoor: lower costs, a stronger bid, and a quick end to negotiations it believed were going nowhere;
      - analyse the costs and risks: a strike that stops services and harms passengers and the company's reputation, perhaps the city contract itself; lost trust and motivation among drivers who stay; resignations in a job where drivers may be hard to replace; and possible legal challenges, depending on the law;
      - consider alternatives, such as negotiating a productivity deal that shares the savings, or conciliation;
      - reach a justified conclusion, for example that imposing contracts may secure the savings in the short run but risks losing far more than it saves if a strike costs Kellmoor the city contract, so negotiation, or conciliation, is likely to be the better route.
  - q: |
      Loomhouse, a fictional social enterprise, is a worker cooperative that recycles textiles and employs people who have struggled to find work. Each of its 45 members has one vote on major decisions, and all are paid the same hourly rate. A large retailer has offered a contract that would double Loomhouse's size, but members disagree about hiring staff who would not be members and about introducing supervisors.

      Explain two challenges Loomhouse may face in keeping its industrial democracy if it accepts the contract.
    marks: 6
    command: explain
    level: HL
    paper: '3'
    answer: |
      A strong response explains two distinct challenges, each linked to Loomhouse, for example:

      - **A two-tier workforce.** Hiring non-member staff would create employees with no vote working beside members who have one, which may lead to resentment, conflict over pay and conditions, and calls for a union, undermining the equality on which the cooperative rests.
      - **Slower, harder decisions at a larger size.** One member, one vote works with 45 people who know each other; with twice as many, and a retailer demanding fast, reliable delivery, voting on decisions may be too slow, pushing the cooperative towards supervisors and managers who hold real power.
      - Other valid challenges include the strain on equal pay if skilled staff must be recruited at higher rates, and the risk that the retailer's demands crowd out the social mission of employing people who have struggled to find work.

      Each challenge needs the cause, its effect on the cooperative's democracy and why it matters for Loomhouse's purpose: roughly three marks for each.
  - q: |
      Tallow Ridge Components, a fictional maker of car parts, is opening a new plant that will employ 800 people. It plans to offer one union a single-union agreement with a no-strike clause, backed by pendulum arbitration, in return for pay above the local average.

      Discuss whether such an agreement would benefit both Tallow Ridge Components and its future employees.
    marks: 10
    command: discuss
    level: HL
    paper: '2'
    answer: |
      A strong response would:

      - explain both agreements: one recognized union for all staff, and a promise not to strike, with disputes going to pendulum arbitration instead;
      - analyse the benefits for the company: uninterrupted production, which matters to a car-parts maker supplying customers who may run just-in-time; one set of negotiations; no disputes between rival unions; a clear way to settle disagreements;
      - analyse the benefits for employees: above-average pay, a single strong voice, consistent treatment of all groups, and a route to settle disputes without losing pay;
      - analyse the drawbacks for employees: giving up the right to strike, their strongest source of power; no choice of union; a risk that the union represents some groups, such as skilled maintenance staff, less well; doubts about the union's independence if the company chose it;
      - weigh what the outcome depends on: the fairness of the arbitration procedure, trust between the two sides, the local labour market and the law;
      - reach a balanced conclusion, for example that the agreement suits the company clearly and can suit employees if the pay premium is real and arbitration is fair, but that employees bear more of the risk.
summary:
  - Industrial or employee relations is the relationship between managers and employees, and their representatives such as trade unions, including how pay and conditions are agreed and disputes handled.
  - Conflict arises because interests overlap without being the same. The commonest sources are pay, hours and conditions, job security, change, and how people are treated.
  - "Three lenses on conflict: unitarist (shared goals, conflict is abnormal), pluralist (different legitimate interests, manage through bargaining) and critical (unequal power, conflict never fully resolved)."
  - "Employees' approaches: collective bargaining, work-to-rule and strike action, in rising order of pressure and of cost to themselves."
  - "Employers' approaches: collective bargaining, threats of redundancies, changes of contract, closure and lockouts."
  - Conciliation helps the two sides reach their own agreement; arbitration has a third party decide, usually bindingly; pendulum arbitration picks one final offer in full.
  - Employee participation gives staff a voice in decisions; industrial democracy gives them real power, such as seats on the board or ownership.
  - A no-strike agreement swaps the right to strike for benefits and arbitration; a single-union agreement has the employer negotiate with one union only.
  - Which approach works depends on bargaining power, and a win by force can cost more over time than a settlement both sides accept.
retrieval:
  - q: What is meant by industrial or employee relations?
    a: The relationship between an organization's managers and its employees, and their representatives such as trade unions, including how pay and conditions are agreed and how disputes are handled.
  - q: Give four sources of conflict in the workplace.
    a: For example pay and benefits, hours and working conditions, job security, change such as new technology or restructuring, and how people are treated by managers.
  - q: What is the difference between the unitarist and the pluralist view of conflict?
    a: The unitarist view sees the organization as a team with shared goals, so conflict is abnormal and unions unnecessary. The pluralist view sees groups with different, legitimate interests, so conflict is normal and is managed through negotiation with unions.
  - q: Name the three approaches to conflict the guide lists for employees.
    a: Collective bargaining, work-to-rule and strike action.
  - q: Name the five approaches to conflict the guide lists for employers.
    a: Collective bargaining, threats of redundancies, changes of contract, closure and lockouts.
  - q: Why do employees usually keep their pay during a work-to-rule but not during a strike?
    a: In a work-to-rule they are still doing what their contracts require, just nothing more; in a strike they stop working altogether.
  - q: What is a lockout?
    a: An employer preventing employees from entering the workplace, so that they cannot work or be paid, until they accept its terms; the employer's counterpart to a strike.
  - q: What is the key difference between conciliation and arbitration?
    a: A conciliator helps the two sides reach their own agreement and decides nothing; an arbitrator hears both sides and decides the outcome, usually bindingly.
  - q: How does pendulum arbitration encourage reasonable offers?
    a: The arbitrator must choose one side's final offer in full, so each side has an incentive to make the offer that looks more reasonable.
  - q: What is the difference between employee participation and industrial democracy?
    a: Participation involves employees in decisions through consultation, works councils or quality circles; industrial democracy gives them a real share of power, such as elected representatives on the board or ownership of the business.
  - q: What does each side gain and give up in a no-strike agreement?
    a: The union gives up the right to strike for a period; in return employees usually gain better pay or conditions and an agreed procedure such as arbitration, and the employer gains uninterrupted production.
  - q: Give two factors that strengthen employees' bargaining power.
    a: For example low unemployment and scarce skills, high union membership and unity, disruption that is costly and immediate for the employer, and public support.
connections:
  - code: '1.4'
    text: Employees, unions, owners and customers are stakeholders whose interests conflict in a dispute, and stakeholder mapping helps to judge each one's power.
  - code: '2.1'
    text: Change and resistance to change are common sources of conflict, and the growth of gig and temporary work leaves many workers outside collective bargaining.
  - code: '2.3'
    text: Leadership style shapes how disputes start and end, from autocratic managers who impose change to democratic ones who consult first.
  - code: '2.4'
    text: Pay, rewards and the way people are treated are the commonest causes of disputes, and participation can motivate as well as prevent conflict.
  - code: '2.5'
    text: A culture of trust makes disputes rarer and easier to settle, while mergers often bring negotiations over harmonizing pay and conditions.
  - code: '5.3'
    text: At HL, quality circles and continuous improvement are forms of employee participation, and lean production depends on cooperative relations.

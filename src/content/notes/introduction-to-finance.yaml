retrieval:
  - q: What is the role of the finance function?
    a: To raise funds, plan and control spending, manage cash, record and report results, and analyse performance and proposals, so the business has the money it needs and uses it well.
  - q: What is capital expenditure?
    a: Spending on assets the business will keep and use for more than a year, such as premises, machinery, vehicles and computer systems.
  - q: What is revenue expenditure?
    a: Spending on the day-to-day running of the business whose benefit is used up within the accounting period, such as wages, materials, rent and routine repairs.
  - q: What is the test for telling capital and revenue expenditure apart?
    a: Whether the benefit lasts beyond the current accounting period. If it buys or improves an asset used for more than a year, it is capital expenditure.
  - q: Is repairing a roof capital or revenue expenditure? And adding an extension?
    a: Repairing a roof restores the building to its previous condition, so it is revenue expenditure. An extension makes the building bigger, so it is capital expenditure.
  - q: A business buys a van and pays for its fuel and insurance. Which is capital expenditure?
    a: The van. Its fuel and insurance are revenue expenditure, because they are used up in running it.
  - q: How does capital expenditure affect profit in the year it is made?
    a: Only the year's depreciation is charged against profit; the rest of the cost remains on the statement of financial position as a non-current asset.
  - q: Why can a business report a profit while its cash falls?
    a: Capital expenditure takes the full cost out of the bank when it is paid, but only a share of it, the depreciation, reduces profit each year.
  - q: A van bought for $24,000 is depreciated by $4,000 a year. Over how many years is its cost spread?
    a: 24,000 ÷ 4,000 = 6 years.
  - q: What happens to profit if revenue expenditure is wrongly recorded as capital expenditure?
    a: This year's profit and assets are overstated, and later years' profits are understated as the false asset is depreciated.
  - q: Why is postponing capital expenditure not free?
    a: Old assets often need rising repairs, which are revenue expenditure that cuts profit in full, and breakdowns can cost customers and quality.
  - q: Which kinds of finance usually suit capital and revenue expenditure?
    a: Capital expenditure usually suits long-term finance such as loans, share capital, retained profit or leasing; revenue expenditure is paid from revenue, with short-term finance such as trade credit or an overdraft for timing gaps.

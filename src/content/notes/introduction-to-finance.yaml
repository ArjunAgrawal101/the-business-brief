# Notes: 3.1 Introduction to finance. Written in the platform's own words from
# the guide's content statement, the role of finance for businesses with
# capital expenditure and revenue expenditure (p. 28, AO2), and the unit's
# conceptual understandings (p. 28). The teacher support material's glossary
# entries for capital and revenue expenditure (pp. 81 and 89) were read to
# check the definitions; nothing is reproduced. Line names follow the guide's
# statement layouts (p. 59) as used in the platform's 3.4 notes. Calculating
# depreciation is HL content in 3.4, so depreciation charges are given, never
# calculated, in SL material, and the HL points are marked HL. Because the
# statement is set at AO2, the one evaluative question draws on 3.7 as well.
# Every business named is fictional, every figure simulated, and every worked
# figure was checked by script.
code: '3.1'
title: Introduction to finance
level: SL/HL
introduction: |
  Every business has to spend money before it can earn any. It must pay for premises, equipment, materials and people long before customers pay for what they produce, and it must decide which of those payments are investments in the future and which simply keep today's operations running. The **finance function** raises the money, plans and controls how it is spent, and records and reports the results.

  The guide frames the role of finance through two kinds of spending: **capital expenditure**, on assets that last, and **revenue expenditure**, on the day-to-day running of the business (AO2). The distinction looks simple, but it decides how spending is paid for, how it appears in the accounts, and why a business can report a healthy profit while its bank balance falls. It is the foundation for the rest of unit 3.
objectives:
  - '**Explain** the role of finance in a business and how it supports the other functions.'
  - '**Distinguish** between capital expenditure and revenue expenditure, with examples.'
  - '**Apply** the distinction to borderline items, such as repairs, improvements and software.'
  - '**Explain** how each kind of spending affects profit, cash and the statement of financial position.'
  - '**Analyse** why the classification of spending matters for decisions and for honest accounts.'
situation:
  title: Where did the profit go?
  fictional: true
  text: |
    Orrin Print, a fictional printing business run by Dara Orrin, has had its best year. Sales reached $400,000, and in March Dara paid $80,000 from the business bank account for a new digital press that should last eight years. Her accountant has just told her that the business made a profit of $90,000.

    Dara is puzzled. The bank balance has risen by only $20,000 over the year, and she had expected the press to wipe out most of the year's profit. Meanwhile the older of her two presses keeps breaking down: its repair bills have tripled in two years, to $18,000, and her biggest client has warned that late orders will cost her its contract. She is short of cash and wonders whether to put off replacing it.

    **Why did the new press cut the bank balance by $80,000 but the profit by far less, and how should a business think about the money it spends?**
sections:
  - id: role-of-finance
    title: The role of finance
    kind: concept
    body: |
      Finance is one of the four business functions, alongside human resources, marketing and operations ([1.1](/topics/what-is-a-business/)). Its role is to make sure the business has the money it needs, when it needs it, and uses it well. Every other function depends on it: HR needs money for wages and training, marketing for promotion, and operations for premises, equipment and materials.

      The work of finance falls into a few connected tasks. It **raises funds** from sources that suit the purpose, the amount and the time they are needed for ([3.2](/topics/sources-of-finance/)). It **plans and controls** spending, so that money goes where it is most useful and costs do not drift. It **manages cash**, so that bills can be paid on time even when customers pay late ([3.7](/topics/cash-flow/)). It **records and reports** what happened, in the final accounts that owners, lenders, the government and others rely on ([3.4](/topics/final-accounts/)). And it **analyses** performance and proposals, using tools such as ratios, break-even and investment appraisal, so that managers can make better decisions.

      The guide frames the role of finance through the two kinds of spending that every business makes. **Capital expenditure** buys assets that will serve the business for years; **revenue expenditure** pays for running it now. Telling them apart is the first job of anyone who handles a business's money, because they are paid for differently, recorded differently and judged differently. The unit's conceptual understandings add an ethical edge: creativity in financial reporting can have diverse impacts, and ethical accounting is part of sustainable behaviour.
    points:
      - term: Raising funds
        text: Choosing internal or external sources of finance that suit what the money is for and how long it is needed ([3.2](/topics/sources-of-finance/)).
      - term: Planning and controlling spending
        text: Forecasting what the business will spend and earn, setting limits, and checking actual spending against the plan.
      - term: Managing cash and liquidity
        text: Making sure there is enough cash to pay suppliers, employees and lenders on time, which is a different question from whether the business is profitable ([3.7](/topics/cash-flow/)).
      - term: Recording and reporting
        text: Keeping accurate records and preparing the final accounts, the statement of profit or loss and the statement of financial position ([3.4](/topics/final-accounts/)).
      - term: Analysing and advising
        text: Using ratios, break-even analysis and investment appraisal to judge performance and proposals, and advising managers on decisions.
      - term: Meeting legal and tax obligations
        text: Paying tax correctly and, for companies, preparing accounts in the form the law requires.
      - term: Budgets (HL)
        level: HL
        text: HL students study how budgets plan income and spending for each part of the business, and how variances between budgeted and actual figures guide decisions ([3.9](/topics/budgets/)).
    example:
      title: The finance function at Orrin Print
      fictional: true
      text: Orrin Print is too small to have a finance department. Dara Orrin handles the money herself, with a part-time bookkeeper and an accountant who prepares the year-end accounts. Between them they arranged the overdraft, chased late-paying customers, paid the suppliers, recorded every sale and payment, and worked out whether the new press would pay for itself. These are the tasks of the finance function, whether they are done by one person or by a department of fifty.
  - id: capital-expenditure
    title: Capital expenditure
    kind: concept
    body: |
      **Capital expenditure** is spending on assets that the business will keep and use for more than a year, such as land and buildings, machinery, vehicles, computer systems and fixtures, and also bought intangible assets such as patents or a software licence that lasts several years. These are the business's **non-current assets**: the equipment and property it uses to produce and sell, not the things it sells.

      Capital expenditure is usually large, infrequent and hard to reverse. A business might spend more on one machine than on a month's wages, and once a building is bought or a production line installed, the money is committed for years. That is why capital spending is normally planned in advance, approved by the owners or directors, and tested with investment appraisal before it is made ([3.8](/topics/investment-appraisal/)). Because the benefit lasts for years, it is usually paid for with long-term finance, such as a loan, new share capital or retained profit, rather than with an overdraft ([3.2](/topics/sources-of-finance/)).

      Businesses make capital expenditure for different reasons: to **expand** capacity, to **replace** assets that are worn out, to **improve efficiency** with better technology, to **meet legal or safety requirements**, or to offer **new products**. Each reason suggests a different way of judging whether the spending is worthwhile.
    points:
      - term: Examples
        text: Premises and land, production machinery, delivery vehicles, computers and servers, shop fittings, and bought patents or licences that last for several years.
      - term: In the accounts
        text: Recorded as a non-current asset on the statement of financial position. Its cost is spread over the years it is used through depreciation, which appears as an expense each year.
      - term: Usual sources of finance
        text: Long-term sources, such as loan capital, share capital, retained profit or leasing, matched to the life of the asset.
  - id: revenue-expenditure
    title: Revenue expenditure
    kind: concept
    body: |
      **Revenue expenditure** is spending on the day-to-day running of the business, whose benefit is used up within the accounting period, usually a year. It includes wages and salaries, raw materials and goods bought for resale, rent, electricity, insurance, advertising, routine repairs and maintenance, and interest on loans. It keeps the business operating at its current level; it does not create an asset that lasts.

      Revenue expenditure is regular and recurring, and in total it is usually much larger than capital expenditure. It is recorded in full as a cost in the statement of profit or loss for the period in which it is incurred, either as **cost of sales** (the direct cost of the goods or services sold) or as **expenses** (the other running costs), so it reduces that period's profit by its full amount. It is normally paid for out of the revenue the business earns, with short-term finance such as trade credit or an overdraft to cover timing gaps ([3.2](/topics/sources-of-finance/)).

      Much revenue expenditure is what [3.3](/topics/costs-and-revenues/) calls the business's costs: fixed costs such as rent and salaries, and variable costs such as materials. Controlling it is a constant task, because small savings repeated every month add up, and because cutting the wrong running cost, such as maintenance or training, can do lasting damage.
    points:
      - term: Examples
        text: Wages, salaries, raw materials, stock for resale, rent, utilities, insurance, advertising, routine repairs and maintenance, fuel, subscriptions and interest.
      - term: In the accounts
        text: Charged in full as cost of sales or expenses in the statement of profit or loss for the period, reducing that period's profit.
      - term: Usual sources of finance
        text: Revenue from sales, with short-term sources such as trade credit and overdrafts to bridge gaps between paying out and getting paid.
  - id: telling-them-apart
    title: Telling capital and revenue expenditure apart
    kind: method
    body: |
      The test is simple to state: **does the benefit of the spending last beyond the current accounting period?** If it buys or improves an asset that will be used for more than a year, it is capital expenditure. If it is used up within the year, or only keeps an existing asset working as before, it is revenue expenditure.

      The hard cases are at the boundary, and examination questions like them. Repairing a roof restores the building to its old condition, so it is revenue expenditure; adding an extension makes the building bigger or better, so it is capital expenditure. The price of a new machine, with its delivery and installation, is capital expenditure; the routine servicing that keeps it running is revenue expenditure. A software licence bought outright for several years is capital expenditure on an intangible asset; a monthly subscription is revenue expenditure.

      In practice, businesses also use a size limit. Items such as staplers or a kettle may last for years, but recording each as an asset would cost more effort than it is worth, so they are treated as revenue expenditure. In an answer, state the test and apply it to the item, especially when it could be argued either way.
    diagram: capital-revenue-expenditure
    points:
      - term: Repair or improvement?
        text: Restoring an asset to its previous condition is revenue expenditure; making it bigger, better or longer-lasting is capital expenditure.
      - term: The cost of getting an asset ready
        text: Delivery, installation and testing of a new machine are part of its cost, so they are capital expenditure, as is the machine itself.
      - term: Using an asset
        text: Fuel, insurance, servicing and the driver's wages for a van are revenue expenditure, even though the van itself was capital expenditure.
      - term: Software and digital services
        text: A licence or system bought for several years is capital expenditure on an intangible asset; a subscription paid monthly or yearly is revenue expenditure.
      - term: Small items
        text: Cheap items that last for years are usually treated as revenue expenditure, because recording each as an asset is not worth the effort.
    example:
      title: Sorting a café's spending
      fictional: true
      text: |
        Fern and Kettle, a fictional café, spent $233,800 in its last financial year (simulated figures). Sorted by the test:

        - **Capital expenditure, $58,000:** a new espresso machine ($9,000), an extension adding 20 seats ($45,000) and a till system expected to last four years ($4,000).
        - **Revenue expenditure, $175,800:** coffee, milk and food ($62,000), staff wages ($85,000), rent ($24,000), repainting the walls ($3,000), repairing the espresso machine's pump ($600) and a yearly subscription to booking software ($1,200).

        The repainting and the pump repair keep existing assets as they were, so they are revenue expenditure, while the extension adds seats the café did not have before. The till is capital expenditure and the booking software revenue expenditure, although both are technology, because one is bought to last four years and the other is paid for year by year.
  - id: effect-on-the-accounts
    title: How each kind of spending affects profit and cash
    kind: method
    body: |
      This is where the distinction matters most. **Revenue expenditure reduces profit in full in the year it is incurred.** **Capital expenditure does not**: it is recorded as an asset, and only a share of its cost, the **depreciation** for the year, is charged against profit each year of its life. Cash is different again. Whether spending is capital or revenue, the cash leaves the bank when it is paid.

      So a year of heavy capital expenditure can show a healthy profit and a falling bank balance at the same time, which is exactly Dara Orrin's puzzle. The reverse is also possible: a year with little capital spending can show strong cash flow while depreciation on old assets keeps profit lower than the cash suggests. This is one of the reasons profit and cash flow differ, which [3.7](/topics/cash-flow/) explains in full.

      Classifying spending correctly matters for honesty as well as accuracy. Treating capital expenditure as revenue expenditure understates profit and assets this year and overstates profit in later years. Treating revenue expenditure as capital expenditure does the opposite: it makes this year's profit and assets look bigger than they are. Recording running costs as assets is a known way of flattering profit, which is why auditors check how spending is classified and why the unit's conceptual understandings link ethical accounting to sustainable business behaviour.
    points:
      - term: Effect on profit
        text: Revenue expenditure is charged in full this year. Capital expenditure is charged gradually, through depreciation, over the asset's life.
      - term: Effect on cash
        text: Both reduce cash when they are paid, whatever their effect on profit.
      - term: Effect on the statement of financial position
        text: Capital expenditure adds a non-current asset, shown at cost less accumulated depreciation. Revenue expenditure adds no asset.
      - term: Calculating depreciation (HL)
        level: HL
        text: HL students calculate depreciation by the straight line and units of production methods, and judge which suits an asset ([3.4](/topics/final-accounts/)). At SL, a depreciation figure will be given if it is needed.
    example:
      title: Solving Dara's puzzle
      fictional: true
      text: |
        Orrin Print's year, in simulated figures, with every sale paid for and every bill paid in the year:

        - Sales revenue: $400,000.
        - Revenue expenditure: $300,000 (materials $140,000, wages $110,000, rent and other running costs $50,000), all charged against this year's profit.
        - Capital expenditure: the $80,000 press, expected to last eight years. Its depreciation charge for the year is $10,000.

        **Profit** = $400,000 − $300,000 − $10,000 = **$90,000**. Only a year's share of the press's cost reduces profit.

        **Cash** = $400,000 − $300,000 − $80,000 = **$20,000** more in the bank. The whole price of the press left the bank in March.

        At the year end the press appears on the statement of financial position at $80,000 − $10,000 = $70,000. Had the press been wrongly charged as revenue expenditure, profit would have been $400,000 − $300,000 − $80,000 = $20,000, understated by $70,000, and each of the next seven years would carry no depreciation for it, overstating their profit by $10,000. Had $30,000 of routine repairs been wrongly recorded as an asset, this year's profit would have looked like $120,000, overstated by $30,000.
  - id: why-the-distinction-matters
    title: Why the distinction matters for decisions
    kind: evaluation
    body: |
      Because the two kinds of spending affect profit and cash so differently, the distinction shapes decisions throughout a business. Capital expenditure is a decision about the future: it commits large sums for years, needs long-term finance and is judged with investment appraisal. Revenue expenditure is a decision about running the business efficiently now, judged against budgets and against what it achieves.

      The danger is **short-termism**. When cash is tight or profit is under pressure, it is tempting to postpone capital expenditure, because nothing appears to change at once: the old machine still works, for now. But postponing replacement often shifts the cost into revenue expenditure that hits profit in full, such as rising repairs, wasted materials and overtime to make up for breakdowns, and it can cost customers who expect reliability and quality. Cutting certain running costs, such as maintenance, training, marketing or research, raises this year's profit too, but these are often investments in the future even though the accounts treat them as revenue expenditure.

      There are also choices about *how* to acquire an asset. Leasing replaces one large capital outlay with regular payments spread over the asset's use, which protects cash but usually costs more in total ([3.2](/topics/sources-of-finance/)). Renting computing power from a cloud provider, instead of buying servers, turns a capital purchase into a running cost. Each choice changes the business's cash flow, its profit and the assets on its statement of financial position.
    advantages:
      - Matching capital expenditure with long-term finance, and revenue expenditure with revenue and short-term finance, keeps a business liquid.
      - Spreading the cost of a long-lived asset over its life gives a fairer picture of each year's profit than charging it all at once.
      - Separating investment from running costs helps managers judge each by the right test, investment appraisal for one and budgets for the other.
    limitations:
      - The line is not always clear, so classification involves judgement, and different judgements give different profits.
      - Some spending that builds the future, such as training, research and brand building, is usually treated as revenue expenditure, so the accounts can understate how much a business invests.
      - The distinction says nothing about whether spending is worthwhile; that needs investment appraisal, budgets and judgement.
    example:
      title: Dara's dilemma
      fictional: true
      text: 'Dara''s older press needed $6,000 of repairs two years ago and $18,000 last year, three times as much, and every breakdown risks a late order for her biggest client. Postponing its replacement saves $80,000 of cash now, but the repairs are revenue expenditure that cuts profit in full each year, and losing the client would cut revenue far more. The question is not only whether to spend, but how to pay: a loan, a lease or the sale of an asset she no longer needs might let her replace the press without draining her cash, which is the subject of [3.2](/topics/sources-of-finance/).'
applications:
  - industry: Manufacturing
    text: Capital-intensive businesses spend heavily on machinery and plants that last for decades, so depreciation is a large expense and capital budgets are carefully planned. Maintenance is revenue expenditure that keeps the capital working; cutting it to save money invites breakdowns.
  - industry: Retail
    text: Store fit-outs, tills and warehouses are capital expenditure, while stock, wages, rent and energy, the bulk of a retailer's spending, are revenue expenditure. Many retailers rent their stores, which keeps capital expenditure low but makes rent one of their largest running costs.
  - industry: Technology and software
    text: The main investment is often people writing software, much of which is treated as revenue expenditure, so the accounts may understate what the business is building. Buying cloud services instead of servers has turned much capital expenditure into running costs.
  - industry: Airlines and transport
    text: Aircraft, trains and trucks are enormous capital purchases, often leased to spread the cost, while fuel, crew, landing charges and maintenance are revenue expenditure that rises and falls with the number of journeys.
  - industry: Healthcare
    text: Hospitals buy scanners, theatres and buildings with capital budgets, often from governments or donors, but most of their spending is on staff and medicines. A new building that cannot be staffed is a common warning about planning the two kinds of spending together.
  - industry: Charities and social enterprises
    text: Donors and grant-makers often prefer to fund visible capital projects, such as a new building, rather than the running costs that keep a service going, so organizations can end up with assets they struggle to run. Explaining the difference to funders is part of their finance role.
stakeholders:
  - group: Owners and shareholders
    text: Want profit and dividends now and a business that keeps growing. Capital expenditure cuts the cash available for dividends today but should raise future profit, so owners weigh present returns against future ones.
  - group: Managers
    text: Must plan capital spending, control running costs and explain both. Managers judged on this year's profit may be tempted to postpone capital expenditure or cut useful running costs, which conflicts with the business's long-term interest.
  - group: Lenders
    text: Look at what the business owns and at its cash flow before lending. Assets bought with capital expenditure can often be pledged as security, while heavy revenue expenditure relative to revenue warns of weak profits.
  - group: Employees
    text: Benefit from capital expenditure on safer and better equipment, but automation can replace jobs. Wages and training are revenue expenditure, so they are among the first costs examined when profit is under pressure.
  - group: Government and tax authorities
    text: Tax rules treat capital and revenue spending differently, so the classification affects how much tax a business pays, and the authorities check that it is done correctly.
evaluation:
  - The definitions are clear, but applying them takes judgement. Repairs and improvements, software, development work and small items can be argued either way, and the choice changes the reported profit.
  - Profit and cash tell different stories. Capital expenditure drains cash at once but reduces profit only gradually, so a profitable business that invests heavily can still run short of cash; finance managers need both pictures.
  - Postponing capital expenditure is not free. It protects cash today but often raises revenue expenditure on repairs and inefficiency and risks losing customers, so the short-term saving must be weighed against the long-term cost.
  - The accounts can understate investment. Training, research and marketing build future earnings but are usually treated as revenue expenditure, which makes businesses that invest in people and ideas look less profitable than those that invest in machines.
  - Classification is an ethical matter. Recording running costs as assets flatters profit and misleads owners, lenders and tax authorities, which is why accounts are audited and why the unit links ethical accounting to sustainable business.
  - The guide sets this subtopic at AO2, so questions on it alone ask you to explain, distinguish or analyse. Evaluation questions usually combine it with sources of finance (3.2), cash flow (3.7) or investment appraisal (3.8).
decision:
  title: Replace, repair or lease the vans?
  fictional: true
  brief: |
    Hazel Lane Deliveries, a fictional courier business, runs six vans that are seven years old. Keeping them on the road costs about $40,000 a year in repairs and extra fuel, a figure that is rising, and breakdowns cost it 25 delivery days last year. New vans cost $30,000 each and should last six years, with maintenance of about $4,000 a year for all six. The business has $90,000 in the bank and an overdraft limit of $50,000. It must decide what to do before its busiest season.
  options:
    - label: Buy six new vans
      text: Capital expenditure of $180,000. The vans become non-current assets; with depreciation of $30,000 a year over six years plus $4,000 of maintenance, the first year's profit is reduced by about $34,000, but $180,000 of cash leaves the business.
    - label: Keep repairing the old vans
      text: Revenue expenditure of about $40,000 a year and rising, charged in full against profit each year, with more breakdowns and no new asset.
    - label: Lease six new vans
      text: Payments of $7,200 a van, $43,200 a year in all, including maintenance, for six years. No large outlay, but no ownership.
  guidance: |
    Compare the options on profit, cash and risk, not only on total cost. **Buying** has the smallest effect on the first year's profit, about $34,000, and the lowest total cost over six years, $180,000 + 6 × $4,000 = $204,000. But it needs $180,000 of cash at once, more than the $90,000 in the bank and the $50,000 overdraft together, so the business would need a loan or other long-term finance for at least $40,000, and an overdraft is the wrong source for an asset that lasts six years.

    **Repairing** keeps cash in the bank for now, but every dollar is revenue expenditure that cuts profit in full, at least $40,000 a year and $240,000 over six years if costs do not rise, and the breakdowns cost deliveries and customers in the busiest season.

    **Leasing** protects cash, gives new, reliable vans and fixes the cost, but at $43,200 a year it costs $259,200 over six years, about $55,000 more than buying, and the business owns nothing at the end.

    A strong judgement weighs these against the business's cash position and its customers. If a loan can be arranged on good terms, buying is cheapest and most reliable; if cash and borrowing are tight, leasing buys reliability now at a known price. Repairing is hard to justify unless the business expects to stop deliveries soon. Say what would change your mind: the interest rate on a loan, how reliable the old vans really are, or the chance of a large contract that would need more vans.
exam:
  - q: Define the term *revenue expenditure*.
    marks: 2
    command: define
    level: SL/HL
    paper: '2'
    answer: |
      A strong response gives a precise definition: spending on the day-to-day running of the business, whose benefit is used up within the accounting period, such as wages, materials and rent, and which is charged in full against that period's profit.

      - A full answer includes the time element (used up within the period) or the accounting treatment (charged against profit).
      - Listing examples without a definition earns little.
  - q: |
      A fictional bakery made the following payments this year: flour and butter; a new oven expected to last ten years; the bakers' wages; repairing a broken window; a delivery van; and electricity.

      Identify the **two** items of capital expenditure.
    marks: 2
    command: identify
    level: SL/HL
    paper: '2'
    answer: |
      - The new oven.
      - The delivery van.

      Both are assets the bakery will use for more than a year. Repairing the window restores an existing asset to its previous condition, so it is revenue expenditure, like the flour, butter, wages and electricity.
  - q: Distinguish between capital expenditure and revenue expenditure.
    marks: 4
    command: distinguish
    level: SL/HL
    paper: '1'
    answer: |
      A strong response makes the differences clear on more than one dimension, with an example of each.

      - **Duration of benefit:** capital expenditure buys assets used for more than a year, such as machinery or vehicles; revenue expenditure pays for items used up within the year, such as wages or materials.
      - **Accounting treatment:** capital expenditure is recorded as a non-current asset on the statement of financial position and charged against profit gradually through depreciation; revenue expenditure is charged in full in the statement of profit or loss for the period.
      - **Typical finance:** capital expenditure is usually financed long-term; revenue expenditure from revenue and short-term finance.
  - q: |
      Orrin Print, a fictional printing business, had sales revenue of $400,000 this year and revenue expenditure of $300,000. It also bought a press for $80,000, which will be depreciated by $10,000 a year. All sales were paid for, and all payments were made, within the year.

      Explain how buying the press affected Orrin Print's profit and its cash this year.
    marks: 4
    command: explain
    level: SL/HL
    paper: '2'
    answer: |
      A strong response uses the figures to show that the press affects profit and cash differently, and explains why.

      - **Profit:** only the year's depreciation of $10,000 is charged, so profit = 400,000 − 300,000 − 10,000 = **$90,000**. The press is capital expenditure, recorded as an asset, and its cost is spread over its life.
      - **Cash:** the full $80,000 left the bank, so cash rose by only 400,000 − 300,000 − 80,000 = **$20,000**.
      - **Why it matters:** the business is profitable but has much less extra cash than its profit suggests, a difference that explains Dara's puzzle and that the cash flow forecast must plan for.
  - q: Dara Orrin's bookkeeper suggests recording $30,000 of routine repairs as capital expenditure instead of revenue expenditure. Analyse the effects of this on Orrin Print's accounts and on **two** of its stakeholders.
    marks: 6
    command: analyse
    level: SL/HL
    paper: '1'
    answer: |
      A strong response explains the accounting effects, then traces them to the stakeholders, linking each to the case.

      - **On the accounts:** profit for the year would be overstated by $30,000, appearing as $120,000 instead of $90,000, and non-current assets would be overstated by the same amount. In later years, depreciation on this false asset would understate profit.
      - **On the classification itself:** repairs restore an asset to its previous condition, so they are revenue expenditure; recording them as an asset is wrong, not merely a matter of opinion.
      - **Stakeholders, for example:** a bank considering a loan would see higher profit and assets than really exist and might lend on a false picture; the tax authorities would see a higher profit, but the misstatement breaks the rules and risks penalties; Dara herself might make decisions, such as drawing more money out, on profits that are not real.
      - A strong analysis notes the ethical dimension: deliberately flattering profit misleads the people who rely on the accounts.
  - q: |
      Orrin Print is short of cash. Its older press needed $6,000 of repairs two years ago and $18,000 last year, and its biggest client has warned that late orders could cost Orrin the contract. A replacement press would cost $80,000. Dara proposes postponing the replacement for two years to protect the business's cash.

      Evaluate Dara's proposal.
    marks: 10
    command: evaluate
    level: SL/HL
    paper: '2'
    answer: |
      This question draws on cash flow (3.7) and sources of finance (3.2) as well as 3.1, because 3.1 on its own is set at AO2. A strong response weighs strengths and limitations, uses the case figures and reaches a supported judgement.

      - **For postponing:** it keeps $80,000 of cash in the business, avoids new borrowing and interest while cash is short, and the old press still works some of the time.
      - **Against postponing:** repairs are revenue expenditure that cuts profit in full, and they tripled from $6,000 to $18,000 in two years, so they may rise further; breakdowns risk late orders and the loss of the biggest client, which would cut revenue far more than the repairs; quality and capacity may suffer just as the business is growing.
      - **The real choice:** the issue is less whether to spend than how to pay. A loan, a lease or the sale of an unused asset could replace the press without draining cash, while matching a long-lived asset to long-term finance.
      - **Judgement:** for example, that postponing is a false economy if the client contract is large, and that Dara should replace the press now with long-term finance or a lease, unless the contract is small and the repairs can be contained.
      - **Limits:** the case does not give the value of the contract, the likely repair bill or the terms of finance available.

      The teacher support material advises at least two arguments for and two against when evaluating one option, applied to the case, and a conclusion that goes beyond repeating them (pp. 56 and 60).
summary:
  - The **finance function** raises funds, plans and controls spending, manages cash, records and reports results, and analyses decisions, supporting every other function.
  - '**Capital expenditure** buys assets used for more than a year, such as buildings, machinery, vehicles and IT systems; it is large, infrequent and hard to reverse.'
  - '**Revenue expenditure** pays for day-to-day running, such as wages, materials, rent and routine repairs, whose benefit is used up within the period.'
  - 'The test: does the benefit last beyond the accounting period? Repairs are revenue expenditure; improvements are capital expenditure; delivery and installation are part of an asset''s cost.'
  - Revenue expenditure reduces profit in full in the year; capital expenditure becomes a non-current asset and reduces profit gradually through depreciation.
  - Both reduce cash when paid, so heavy capital expenditure can leave a profitable business short of cash.
  - Capital expenditure suits long-term finance and investment appraisal; revenue expenditure is paid from revenue and short-term finance and controlled with budgets.
  - Misclassifying spending distorts profit and assets, and doing it deliberately is unethical; postponing capital expenditure often shifts cost into rising revenue expenditure.
connections:
  - code: '1.1'
    text: Finance is one of the four business functions, and every other function depends on it.
  - code: '3.2'
    text: Capital expenditure is usually matched with long-term sources of finance, and revenue expenditure with revenue and short-term sources.
  - code: '3.3'
    text: Most revenue expenditure is the business's fixed and variable costs.
  - code: '3.4'
    text: Capital expenditure appears as non-current assets on the statement of financial position, and revenue expenditure as cost of sales or expenses in the statement of profit or loss.
  - code: '3.7'
    text: Capital expenditure drains cash at once but reduces profit gradually, one reason why profit and cash flow differ.
  - code: '3.8'
    text: Investment appraisal judges whether capital expenditure is worth making before the money is committed.

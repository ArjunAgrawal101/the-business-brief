# Notes: 3.6 Efficiency ratio analysis. HL only, so the notes are HL
# throughout. Written in the platform's own words from the guide's three
# content statements (p. 29) and its formula list (p. 64): every formula here
# is the guide's, including its definitions of average stock and capital
# employed, and matches the platform's ratio code (src/lib/ratios.ts), which
# uses trade creditors for creditor days. The worked example continues
# Tidewater Outdoors, the fictional retailer of the 3.4 and 3.5 notes: its 2025
# figures are those notes' figures, and its 2026 current liabilities are split
# here (overdraft 18, trade creditors 80, other short-term loans 20, in $000)
# within the 3.5 total of 118. The teacher support material's glossary (pp. 80
# to 90) was read to check the meanings of insolvency and bankruptcy; nothing
# from it is reproduced. No coursebook chapter for unit 3 was supplied. Every
# business named is fictional, and every figure was checked by script. The
# strategies are common options, not a list the guide prescribes.
code: '3.6'
title: Efficiency ratio analysis
level: HL
introduction: |
  Two businesses can make the same profit and be in very different health. One sells its stock in a month, collects from customers in thirty days and borrows little; the other holds stock for a quarter, waits two months to be paid and relies on loans. The first has cash to spare; the second may struggle to pay its bills. **Efficiency ratios** measure these differences: how well a business manages its stock, its customers' credit, its suppliers' credit and its long-term finance.

  This HL subtopic adds four ratios to the profitability and liquidity ratios of 3.5: **stock turnover**, **debtor days**, **creditor days** and the **gearing ratio**. You need to calculate each from the accounts with the guide's formulas, explain what the result shows, evaluate strategies to improve it, and distinguish **insolvency** from **bankruptcy**, the two words for what happens when a business cannot pay what it owes.
objectives:
  - '**Calculate** stock turnover (in times and in days), debtor days, creditor days and the gearing ratio from a set of final accounts, using the guide''s formulas.'
  - '**Comment** on each ratio by comparing it with earlier years, with similar businesses and with credit terms, and **explain** what it shows about the business.'
  - '**Analyse** how the efficiency ratios help to explain changes in liquidity and profitability.'
  - '**Evaluate** strategies to improve each efficiency ratio, weighing what each one costs and who bears the cost.'
  - '**Distinguish** between insolvency and bankruptcy, and **explain** why a profitable business can become insolvent.'
situation:
  title: Tidewater's second store
  fictional: true
  text: |
    Tidewater Outdoors Ltd, a fictional retailer of camping and hiking gear, opened a second store in 2026, paid for with a long-term loan. Sales rose by a quarter, from $840,000 to $1,050,000, and the business stayed profitable. Yet by the end of the year its cash had fallen from $25,000 to $5,000, and its bank overdraft had grown.

    The 3.5 notes found that every profitability and liquidity ratio was worse, and that the acid test ratio had roughly halved, to 0.55. But those ratios say *that* Tidewater's position weakened, not *where* the money went. Its owners have three questions for their accountant. Is stock piling up in the new store? Are customers paying more slowly, or is Tidewater paying its suppliers more slowly to cope? And how risky is the new loan?

    Which ratios answer those questions, what do they show, and what should Tidewater do about it?
sections:
  - id: what-efficiency-ratios-show
    title: What efficiency ratios show
    kind: concept
    level: HL
    body: |
      The guide's **efficiency ratios** measure how well a business manages four things: its **stock**, the **credit it gives customers**, the **credit it takes from suppliers** and the **mix of borrowing and owners' money** in its long-term finance. The first three concern working capital, the day-to-day cycle in which cash buys stock, stock is sold, often on credit, and customers' payments become cash again. The fourth concerns financial risk.

      These ratios matter because they explain the other ratios. Profit is earned when goods are sold, but cash arrives only when customers pay, and cash leaves when suppliers are paid. Stock that sits on shelves and customers who pay late tie up cash that the business could use, so a business can be profitable and short of cash at the same time. High gearing adds interest that must be paid whatever profit is made. When a liquidity ratio worsens, the efficiency ratios often show why.

      Like every ratio, they mean little alone. Compare them with the same business in earlier years, with similar businesses in the same industry, and with benchmarks such as the credit terms the business offers its customers. The diagram shows the formulas, which candidates receive in the examination, so the marks go to choosing the right figures, showing the working and explaining the result.
    diagram: ratio-families
    points:
      - term: Stock turnover
        level: HL
        text: How quickly stock is used or sold, as the number of times average stock is replaced in a year or the average number of days stock is held.
      - term: Debtor days
        level: HL
        text: How many days, on average, customers take to pay what they owe.
      - term: Creditor days
        level: HL
        text: How many days, on average, the business takes to pay its suppliers.
      - term: Gearing ratio
        level: HL
        text: The share of capital employed, the long-term finance, that comes from borrowing rather than from the owners.
      - term: Gearing is not usually called an efficiency ratio
        level: HL
        text: The guide groups the gearing ratio with the efficiency ratios. In most accounting and finance writing it is a solvency or financial structure ratio, because it measures risk rather than how well resources are used. Use the guide's grouping in the examination, and know that other sources differ.
    example:
      title: Same profit, different cash
      fictional: true
      text: |
        Two fictional wholesalers, Oriel Supplies and Quarry Lane Supplies, each have sales revenue of $1,095,000 and cost of sales of $730,000 a year, so they make the same gross profit. That is $3,000 of sales and $2,000 of cost of sales a day.

        - Oriel holds average stock of $60,000, so its stock turns over (730,000 ÷ 60,000) = 12.17 times a year, every (60,000 ÷ 730,000) × 365 = 30 days. Its debtors are $90,000: (90,000 ÷ 1,095,000) × 365 = 30 debtor days.
        - Quarry Lane holds average stock of $180,000, turning over 4.06 times a year, every 90 days, and its debtors are $180,000, or 60 debtor days.

        Quarry Lane has $120,000 more tied up in stock and $90,000 more in debtors: $210,000 of cash that Oriel has free to spend, save or use to pay its own bills. Their profit is the same; their ability to pay their bills is not.
  - id: stock-turnover
    title: Stock turnover
    kind: method
    level: HL
    body: |
      **Stock turnover** measures how quickly a business uses up or sells its stock. The guide gives two versions, which tell the same story from different angles. In **number of times**, it shows how often the business uses up and replaces its average stock in a year: a higher figure means faster turnover. In **number of days**, it shows how long, on average, stock is held before it is sold or used: a lower figure means faster turnover. Both use **cost of sales**, not sales revenue, because stock is valued at cost, and both use **average stock**, the mean of the opening and closing figures, because the stock held changes through the year.

      Faster turnover is usually better. Less cash is tied up in stock, storage and insurance cost less, and there is less risk that goods spoil, go out of fashion or become obsolete before they sell. A slowing turnover is a warning that stock is building up, perhaps because sales have fallen, the business has bought too much, or some lines are not selling.

      What counts as fast depends entirely on the product. A bakery or florist turns its stock over every few days; a furniture or jewellery shop may hold stock for months. Very fast turnover is not always good either, since a business that holds too little risks running out and losing sales. And the ratio means little for businesses that hold little stock, such as consultancies and many service firms.
    formulas:
      - name: Stock turnover (number of times)
        expression: Stock turnover (number of times) = cost of sales ÷ average stock
        note: Guide, p. 64. The answer is a number of times a year, not a percentage.
      - name: Stock turnover (number of days)
        expression: Stock turnover (number of days) = (average stock ÷ cost of sales) × 365
        note: Guide, p. 64. Dividing 365 by the number of times gives the same answer.
      - name: Average stock
        expression: Average stock = (opening stock + closing stock) ÷ 2
        note: Guide, p. 64. If a question gives only one stock figure, say that you have used it in place of the average.
    example:
      title: Is stock piling up at Tidewater?
      fictional: true
      text: |
        Tidewater's figures, in $000: cost of sales 370 in 2025 and 525 in 2026; stock 60 at the start of 2025, 70 at the end of 2025 and 125 at the end of 2026.

        - 2025: average stock = (60 + 70) ÷ 2 = 65. Stock turnover = 370 ÷ 65 = **5.69 times**, or (65 ÷ 370) × 365 = **64.12 days**.
        - 2026: average stock = (70 + 125) ÷ 2 = 97.5. Stock turnover = 525 ÷ 97.5 = **5.38 times**, or (97.5 ÷ 525) × 365 = **67.79 days**.

        Stock now takes about four days longer to sell, a modest slowdown. But the average hides how the year ended: closing stock rose by 78.57% while cost of sales rose by 41.89%. Measured on closing stock alone, a check rather than the guide's formula, Tidewater held 86.90 days of stock at the end of 2026, against 69.05 days a year earlier. The new store needed stock, but some of the build-up looks like buying ahead of sales, and outdoor gear that misses its season may have to be sold at a discount.
  - id: debtor-and-creditor-days
    title: Debtor days and creditor days
    kind: method
    level: HL
    body: |
      **Debtor days** show how long, on average, customers take to pay. Fewer days means cash arrives sooner. The most useful comparison is with the credit terms the business offers: if customers are given 30 days and debtor days are 45, they are paying two weeks late on average, and the business should ask who is late and why. Rising debtor days are also a warning of **bad debts**, money that will never be paid.

      **Creditor days** show how long, on average, the business takes to pay its suppliers. More days means the business keeps its cash for longer, so a rise helps liquidity, but only up to a point. Paying later than agreed can lose discounts for prompt payment, damage relationships and lead suppliers to shorten their terms or demand cash on delivery. A sudden rise can be a sign of distress rather than good management: the business may be paying late because it cannot pay on time.

      Read the two together. A business whose customers pay faster than it pays its suppliers is partly financed by its suppliers, which helps its cash flow; one that pays suppliers quickly but waits a long time for its customers is financing them. Two quirks of the guide's formulas matter when you comment. Debtor days divide by **total** sales revenue, including cash sales, so for a business that sells mostly for cash, such as a shop, the ratio understates how long its credit customers take. Creditor days divide by cost of sales, which is only an approximation of what was bought on credit.
    formulas:
      - name: Debtor days
        expression: Debtor days ratio (number of days) = (debtors ÷ total sales revenue) × 365
        note: Guide, p. 64.
      - name: Creditor days
        expression: Creditor days ratio (number of days) = (creditors ÷ cost of sales) × 365
        note: Guide, p. 64. Creditors means trade creditors, the suppliers waiting to be paid.
    points:
      - term: Debtor days rising
        level: HL
        text: Customers are paying more slowly, credit control has weakened, or the business has offered longer credit to win sales. Cash is tied up, and the risk of bad debts grows.
      - term: Creditor days rising
        level: HL
        text: The business is taking longer to pay. It may have negotiated better terms, which is good for cash, or it may be short of cash and stretching its suppliers, which is a warning.
      - term: The cash cycle
        level: HL
        text: Stock days plus debtor days minus creditor days gives roughly how long cash is tied up between paying suppliers and being paid by customers. This combination is enrichment beyond the guide, but it shows how the three ratios work together.
    example:
      title: Who is paying whom at Tidewater?
      fictional: true
      text: |
        In $000: debtors 55 in 2025 and 60 in 2026; total sales revenue 840 and 1,050; trade creditors 45 and 80; cost of sales 370 and 525.

        - Debtor days: (55 ÷ 840) × 365 = **23.90 days** in 2025; (60 ÷ 1,050) × 365 = **20.86 days** in 2026.
        - Creditor days: (45 ÷ 370) × 365 = **44.39 days** in 2025; (80 ÷ 525) × 365 = **55.62 days** in 2026.

        Most of Tidewater's customers pay at the till, so its debtors are mainly clubs and schools buying on account, and debtor days are low and slightly improving. Creditor days tell a different story: Tidewater took about eleven days longer to pay its suppliers. Had it paid as quickly as in 2025, its trade creditors would have been about $64,000 rather than $80,000, so slower payment kept about $16,000 in the business, more than three times its closing cash of $5,000.

        Taken together, the cash cycle shortened from about 44 days to about 33, which looks like an improvement. It is not: it shortened mainly because Tidewater is paying its suppliers later, not because it is selling stock or collecting cash faster.
  - id: gearing
    title: The gearing ratio
    kind: method
    level: HL
    body: |
      The **gearing ratio** shows how much of a business's long-term finance is borrowed. It divides **non-current liabilities**, mainly long-term loans, by **capital employed**, which the guide defines as non-current liabilities plus equity. A business with a gearing ratio of 40% has borrowed 40 cents of every dollar of its long-term finance; the owners have provided the other 60.

      Borrowing is not bad in itself. Interest is often cheaper than the return owners expect, and a loan lets a business grow without the owners giving up control by selling shares. When the business earns a return on its capital above the interest rate on its loans, borrowing raises the return to the owners. But interest and repayments must be paid whatever happens to profit, so a highly geared business is more exposed when sales fall or interest rates rise, and lenders may refuse it further credit or charge more for it.

      A common rule of thumb treats gearing above 50% as **high** and below 25% as **low**. This is not an IB rule, and what is safe depends on how stable the business's profits and cash flows are. A utility with steady income can carry more debt than a fashion retailer whose sales swing with the seasons.
    formulas:
      - name: Gearing ratio
        expression: Gearing ratio = (non-current liabilities ÷ capital employed) × 100
        note: Guide, p. 64.
      - name: Capital employed
        expression: Capital employed = non-current liabilities + equity
        note: Guide, p. 64. The same definition as in ROCE (3.5).
    advantages:
      - Low gearing means less interest to pay, less risk if profits fall or interest rates rise, and more room to borrow if an opportunity or a crisis comes.
      - High gearing lets a business grow faster than its owners could fund alone, without diluting their control.
      - When returns exceed the interest rate, higher gearing raises the return to the owners.
    limitations:
      - High gearing commits the business to interest and repayments whatever its profits, and makes it vulnerable to rising interest rates.
      - Highly geared businesses find it harder and dearer to borrow more, and lenders may impose conditions.
      - Very low gearing can mean missed opportunities, or owners putting in more money than the business needs.
      - The ratio uses values from one date, and overdrafts and other short-term borrowing count as current liabilities, so a business that relies on them can look less geared than it is.
    example:
      title: How risky is Tidewater's loan?
      fictional: true
      text: |
        In $000: non-current liabilities 120 in 2025 and 300 in 2026; equity 405 and 432.

        - 2025: 120 ÷ (120 + 405) × 100 = **22.86%**.
        - 2026: 300 ÷ (300 + 432) × 100 = 300 ÷ 732 × 100 = **40.98%**.

        Gearing nearly doubled because of the loan for the second store. At 40.98% it is below the 50% rule of thumb, but the trend matters as much as the level. In 2025 Tidewater paid $12,000 of interest on about $150,000 of borrowing, roughly 8%, while its return on capital employed was 26.67%. In 2026 its ROCE fell to 14.34%. If the new loan costs a similar rate, borrowing still adds to the owners' returns, but the gap between what the capital earns and what the loans cost has narrowed sharply.
  - id: reading-the-ratios
    title: 'Reading the ratios together: Tidewater'
    kind: application
    level: HL
    body: |
      A question will often give you two years of accounts and ask you to calculate and comment. A steady routine earns the marks: write each formula, substitute the figures, give the answer to two decimal places with its unit (times, days or a percentage), then explain what the change shows and why it matters for the business in the case. The final step, linking the ratios into one story, is what separates a strong answer from a list.

      Tidewater's results, in 2025 and then 2026:

      - Stock turnover: 5.69 times and 5.38 times; 64.12 days and 67.79 days.
      - Debtor days: 23.90 days and 20.86 days.
      - Creditor days: 44.39 days and 55.62 days.
      - Gearing: 22.86% and 40.98%.

      The story they tell answers the owners' three questions. **Stock is building up**: the slower turnover, and especially the year-end jump, means cash is sitting in the stockroom. **Customers are not the problem**: debtor days are low and falling. **Suppliers are funding the gap**: Tidewater is paying about eleven days later, which kept cash in the business but cannot be stretched much further. And **the loan has raised the risk**: gearing has nearly doubled while profit fell. Together these explain the weaker acid test ratio found in 3.5: stock has risen, cash has fallen, and the business is leaning on its suppliers and its bank. To practise on another set of accounts, the [ratio desk](/finance-desk/ratios/) works every ratio for a fictional distribution company and lets you test strategies.
    example:
      title: A commentary in exam style
      fictional: true
      text: Tidewater's efficiency ratios show where its cash went in 2026. Stock turnover slowed from 5.69 to 5.38 times, and closing stock rose by 78.57% while cost of sales rose by 41.89%, so stock bought for the new store is not yet selling fast enough. Debtor days fell from 23.90 to 20.86, so customers are paying promptly. Creditor days rose from 44.39 to 55.62, which suggests that Tidewater is paying suppliers later because it is short of cash, a risk if suppliers tighten their terms in the busy season. Gearing rose from 22.86% to 40.98% as a result of the loan, still below 50% but with less profit to cover the interest. Tidewater's priority should be to sell down its surplus stock, which would release cash, let it pay its suppliers on time and reduce its need for the overdraft.
  - id: improving-the-ratios
    title: Strategies to improve the efficiency ratios
    kind: evaluation
    level: HL
    body: |
      The guide sets the strategies at AO3, so each needs weighing, not just naming. Every strategy below has a cost, a risk or a stakeholder who loses, and the right choice depends on what caused the weak ratio. "Improve" also needs care: for stock turnover and debtor days, improving means faster; for creditor days, a rise helps cash but strains suppliers; and for gearing, lower is safer, though not always better.

      A strategy can also help one ratio and harm another. Clearing stock with discounts speeds up stock turnover but cuts the gross profit margin; paying suppliers sooner to win their goodwill lowers creditor days and the cash balance; repaying a loan from cash lowers gearing but weakens liquidity. Look at the whole set of accounts before recommending anything. The options below are common ones, not a list the guide prescribes.
    points:
      - term: Speed up stock turnover
        level: HL
        text: Order smaller quantities more often, move towards just-in-time supply (5.6), clear slow-moving lines with discounts, cut the range to the lines that sell, and forecast sales more accurately (4.3). **Costs:** more risk of running out and losing sales, the loss of bulk-buying discounts, more frequent deliveries, and lower margins on discounted stock.
      - term: Reduce debtor days
        level: HL
        text: Check customers' creditworthiness before giving credit, set credit limits, invoice promptly, chase late payers, offer a discount for early payment, shorten credit terms, or sell the debts to a factor (debt factoring). **Costs:** customers may move to rivals that offer easier credit, discounts and factors' fees reduce profit, and pressing customers can damage relationships.
      - term: Raise creditor days
        level: HL
        text: Negotiate longer credit terms with suppliers, make full use of the credit already offered, or move to suppliers with better terms. **Costs:** lost discounts for prompt payment, strained relationships, the risk that suppliers demand payment in advance or put the business's orders last, and an ethical question when a large business makes small suppliers wait.
      - term: Reduce gearing
        level: HL
        text: Issue new shares, retain more profit instead of paying dividends, repay loans from cash, or sell assets and use the proceeds to repay debt (sale and leaseback is one way). **Costs:** new shares dilute the owners' control and their share of profit, lower dividends disappoint shareholders, repaying debt drains cash, and selling assets can leave the business paying rent for what it used to own.
    example:
      title: Two moves for Tidewater
      fictional: true
      text: |
        **Sell down the stock.** Had Tidewater ended 2026 with stock of 95 rather than 125 ($000), average stock would have been (70 + 95) ÷ 2 = 82.5, and stock turnover 525 ÷ 82.5 = 6.36 times, or 57.36 days, faster than in 2025. The $30,000 released would let it pay its suppliers on time. The cost is the discount needed to sell the surplus, which lowers this year's gross profit margin.

        **Replace some of the loan with shares.** If the owners put in 100 of new share capital and Tidewater used it to repay 100 of the loan, capital employed would stay at 732, but gearing would fall to 200 ÷ 732 × 100 = 27.32%. Interest costs and risk fall, but only if the owners have the money, and if new investors provided it the founders would give up part of their control.
  - id: insolvency-and-bankruptcy
    title: Insolvency versus bankruptcy
    kind: concept
    level: HL
    body: |
      The two words are often used as if they meant the same thing, but they describe different stages. **Insolvency** is a **financial state**: a person or business cannot pay its debts. **Bankruptcy** is a **legal process** that may follow: a court becomes involved in dealing with debts that cannot be paid.

      Insolvency has two senses. In the first, a business cannot pay its debts **as they fall due**, because it lacks the cash, even if it owns valuable assets. In the second, its **liabilities are greater than its assets**, so even selling everything would not pay what it owes. Either way, it cannot meet its obligations. Insolvency need not be the end: a business may recover by raising new finance, selling assets, agreeing more time to pay with its creditors, or being bought.

      If it cannot recover, creditors may go to court, or the business may apply itself. **Bankruptcy** proceedings then deal with the debts under the court's supervision, either by restructuring them so that the business can carry on, or by selling its assets to repay creditors as far as possible. For a company, the sale of all its assets and its closure is called **liquidation**. The words and procedures differ between countries: in some, bankruptcy applies only to individuals, including sole traders, and an insolvent company goes through other procedures with other names. For the examination, the distinction to make is between being unable to pay (insolvency) and the legal process that may follow (bankruptcy).
    points:
      - term: A profitable business can be insolvent
        level: HL
        text: Profit is not cash (3.7). A business can sell at a profit and still run out of cash if customers pay late, stock piles up, it grows faster than its cash allows, or a loan falls due.
      - term: Warning signs in the ratios
        level: HL
        text: Slowing stock turnover, rising debtor days, creditor days that rise because bills are being paid late, falling liquidity ratios and high gearing with falling profit. No single ratio proves insolvency is coming, but together they show pressure building.
      - term: Who loses
        level: HL
        text: In bankruptcy, creditors are paid in an order set by law, and many receive only part of what they are owed. A sole trader or partner, with unlimited liability, can lose personal possessions; shareholders in a limited company lose at most what they invested, which is often everything.
    example:
      title: Could Tidewater become insolvent?
      fictional: true
      text: |
        At the end of 2026 Tidewater had $5,000 of cash and owed its suppliers $80,000. Suppose its main supplier, tired of waiting, demanded payment within a week, and its bank refused to extend the overdraft. Tidewater could not pay, so it would be **insolvent** in the first sense, even though it made a profit in 2026 and its assets exceed its liabilities by $432,000, its equity.

        Insolvency of this kind can often be cured. Tidewater could sell surplus stock at a discount, agree a timetable for paying the supplier, or ask its owners for more capital. Only if all of these failed, and its creditors went to court, would it face bankruptcy proceedings, or liquidation as a company. Its position shows why efficiency ratios matter: they warn of the cash pressure long before a creditor's demand turns it into a crisis.
applications:
  - industry: Supermarkets and retail
    text: Food retailers turn their stock over in days, are paid at the till so their debtor days are close to zero, and often pay suppliers after several weeks. Their customers effectively pay them before they pay their suppliers, which frees cash for expansion but puts the burden on suppliers, especially small ones.
  - industry: Manufacturing
    text: Manufacturers hold raw materials, work in progress and finished goods, so stock turnover is slower, and they usually sell on credit to other businesses, so debtor days of 30 to 60 are normal. Machinery is often bought with long-term loans, which raises gearing, and just-in-time supply is the main way to speed up stock turnover.
  - industry: Construction
    text: Builders are often paid in stages, sometimes only when a project is finished, so debtor days are long and cash flow is lumpy, while subcontractors and suppliers want paying monthly. That gap is one reason construction firms become insolvent more often than many others, even with full order books.
  - industry: Hospitality
    text: "Restaurants and hotels turn food stock over within days, since it is perishable, and most customers pay at once, so debtor days are low. Their main efficiency risk is gearing: hotels in particular are often financed with large loans secured on the building, so a fall in bookings quickly squeezes their ability to pay interest."
  - industry: Technology and software
    text: Software firms hold little or no stock, so stock turnover means little, and customers on subscriptions often pay in advance. Their key ratio is usually debtor days on contracts with large business customers, who may take months to pay, and many young technology firms have low gearing because they are funded by investors' equity rather than loans.
stakeholders:
  - group: Managers
    text: Managers use the ratios to control working capital, setting targets for stock levels, credit terms and payment of suppliers. They face trade-offs between departments, since sales staff want generous credit and plenty of stock to sell from, while the finance team wants both kept low.
  - group: Suppliers
    text: Creditor days measure how long suppliers wait for their money. A business that stretches its suppliers improves its own cash at their expense, and suppliers, especially small ones, may respond by shortening terms, raising prices or refusing to supply, a direct conflict of interest.
  - group: Banks and other lenders
    text: Lenders watch gearing and liquidity before lending and often set conditions, such as a maximum gearing ratio, in loan agreements. A business that breaks them may face higher interest or demands for repayment, so lenders' interests can push managers towards cutting stock and debt quickly.
  - group: Owners and shareholders
    text: Gearing affects both their risk and their return. Borrowing can raise their returns and keep their control, but it raises the risk of insolvency, in which shareholders are paid last. Reducing gearing by issuing shares protects the business but dilutes existing owners.
  - group: Customers
    text: Customers benefit from generous credit terms and from stock being available when they want it, so tighter credit control and leaner stock can push them to rivals. Business customers may resist shorter credit terms most strongly, since it affects their own cash flow.
  - group: Employees
    text: Employees rarely see the ratios, but they bear the consequences of insolvency, which can cost them their jobs and, in some cases, unpaid wages. Working capital problems can also lead to cost-cutting, such as frozen pay or hiring, before a crisis is visible.
evaluation:
  - The ratios are only as reliable as the accounts behind them. The statement of financial position shows a single day, which may be unrepresentative for a seasonal business, and figures can be window-dressed, for example by delaying purchases before the year end. The guide's use of average stock smooths some of this, but not all.
  - Comparisons must be like with like. Normal stock turnover, debtor days and gearing differ enormously between industries, so compare a business with its own past and with similar businesses, not with a general standard.
  - The guide's formulas are approximations. Debtor days use total sales revenue, including cash sales, and creditor days use cost of sales rather than credit purchases, so treat the results as indicators and compare them on the same basis each year.
  - Higher or lower is not always better. Very fast stock turnover can mean lost sales from empty shelves, very low debtor days can mean refusing credit that customers expect, high creditor days can mean a business in distress, and low gearing can mean missed opportunities. Judge each ratio against the business's strategy and circumstances.
  - "Ratios show symptoms, not causes. They point to where to look, such as at the new store's stock or the late payment of suppliers, but explaining why needs other evidence: the market, management decisions and the business's plans."
  - Insolvency is about cash, not profit. The efficiency ratios are valuable because they show cash pressure building before it becomes a crisis, but only if managers act on them; a profitable business that ignores them can still fail.
decision:
  title: Penwarden's cash squeeze
  fictional: true
  brief: |
    Penwarden Supplies, a fictional wholesaler of catering equipment to restaurants and hotels, sells everything on credit with 30-day terms. Its overdraft is close to its limit. Its accounts show sales revenue of $7,300,000, cost of sales of $5,110,000, debtors of $1,400,000, trade creditors of $420,000, average stock of $840,000, non-current liabilities of $1,200,000 and equity of $2,800,000.

    Its ratios: debtor days (1,400,000 ÷ 7,300,000) × 365 = 70 days; creditor days (420,000 ÷ 5,110,000) × 365 = 30 days; stock turnover 6.08 times, or 60 days; gearing 1,200,000 ÷ 4,000,000 × 100 = 30%. Each day of debtor days ties up $20,000, so customers paying 40 days beyond the terms tie up $800,000. The finance director has three proposals.
  options:
    - label: Factor the debts
      text: A factor would pay Penwarden 80% of each invoice at once, $1,120,000 on the current debtors, and collect from customers itself, for a fee of 1.5% of the value of the invoices it handles, about $109,500 a year.
    - label: Tighten credit control
      text: Offer a 2% discount for payment within 10 days, check new customers' credit, chase overdue accounts weekly and stop supplying customers more than 60 days overdue. If half of sales by value take the discount, it costs $73,000 a year; management expects debtor days to fall to about 45, which would cut debtors to $900,000 and release $500,000.
    - label: Take a long-term loan
      text: Borrow $600,000 over five years at 7% to replace part of the overdraft, costing $42,000 of interest in the first year. Gearing would rise to (1,800,000 ÷ 4,600,000) × 100 = 39.13%.
  guidance: |
    Begin with the cause. Penwarden is profitable enough; its problem is that customers take 70 days to pay on 30-day terms, while Penwarden pays its own suppliers in 30. It is, in effect, lending $800,000 to its customers, financed by an overdraft.

    **Option C** is the cheapest each year and the quickest to arrange, but it treats the symptom, not the cause. The debtors stay at 70 days, gearing rises from 30% to 39.13%, and if customers pay even later the cash problem returns with a loan on top. **Option A** raises the most cash fastest and transfers the work of collecting to the factor, but it is the most expensive at about $109,500 a year, it reduces profit permanently, and restaurants and hotels used to dealing with Penwarden may resent a third party chasing them. **Option B** tackles the cause and costs less than factoring, but its $500,000 depends on customers responding as expected, and stopping supplies to slow payers may lose customers, many of whom are small businesses with cash problems of their own, which raises the risk of bad debts.

    A strong answer will probably favour B, perhaps with a short-term measure, such as factoring only the slowest accounts, while it takes effect. It should also notice what the ratios say beyond debtors: Penwarden pays suppliers in 30 days, so negotiating 45-day terms would keep about $210,000 more in the business at no interest cost, if suppliers agree. What would change the recommendation? Evidence that customers would move to rivals over tighter terms would favour factoring, and a business that needed the cash within weeks, not months, could not wait for B to work.
exam:
  - q: |
      Juniper Home Stores, a fictional retailer of kitchenware, had opening stock of $45,000 and closing stock of $35,000 for the year. Its cost of sales was $480,000.

      Calculate Juniper Home Stores' stock turnover (i) in number of times and (ii) in number of days.
    marks: 4
    command: calculate
    level: HL
    paper: '2'
    answer: |
      A strong response shows each stage:

      - Average stock = (45,000 + 35,000) ÷ 2 = $40,000.
      - (i) Stock turnover = 480,000 ÷ 40,000 = **12 times** a year.
      - (ii) Stock turnover = (40,000 ÷ 480,000) × 365 = **30.42 days**.

      Two marks for each part: one for the correct working, including the average stock, and one for the answer with its unit. Using closing stock instead of the average, or sales revenue instead of cost of sales, loses the method mark.
  - q: |
      Ashby Print, a fictional printing business, had debtors of $54,000 and total sales revenue of $657,000. Its trade creditors were $42,000 and its cost of sales $438,000.

      Calculate Ashby Print's (i) debtor days and (ii) creditor days.
    marks: 4
    command: calculate
    level: HL
    paper: '2'
    answer: |
      A strong response shows each stage:

      - (i) Debtor days = (54,000 ÷ 657,000) × 365 = **30.00 days**.
      - (ii) Creditor days = (42,000 ÷ 438,000) × 365 = **35.00 days**.

      Two marks for each part. A common error is to divide debtors by cost of sales or creditors by sales revenue. A good answer might add that Ashby is paid five days sooner than it pays its suppliers, which helps its cash flow.
  - q: |
      Kittiwake Hotels, a fictional hotel group, borrowed to build a new hotel in 2026. Its non-current liabilities rose from $2.0 million in 2025 to $4.5 million in 2026; its equity was $3.0 million in both years.

      Comment on the change in Kittiwake Hotels' gearing ratio between 2025 and 2026.
    marks: 4
    command: comment
    level: HL
    paper: '2'
    answer: |
      A strong response first calculates the ratios, then judges them:

      - 2025: 2.0 ÷ (2.0 + 3.0) × 100 = **40.00%**; 2026: 4.5 ÷ (4.5 + 3.0) × 100 = **60.00%**.
      - Gearing has risen by 20 percentage points, and at 60% Kittiwake is now highly geared by the usual rule of thumb: most of its long-term finance is borrowed.
      - It must pay more interest whatever its profits, which is risky in an industry where bookings can fall sharply, and lenders may be reluctant to lend more.
      - The judgement depends on the new hotel: if it earns a return above the interest rate, the borrowing raises returns to the owners; if bookings disappoint, the interest becomes a burden.
  - q: Distinguish between insolvency and bankruptcy.
    marks: 4
    command: distinguish
    level: HL
    paper: '2'
    answer: |
      A strong response makes the difference clear for both terms:

      - **Insolvency** is a financial state: a business cannot pay its debts as they fall due, or its liabilities exceed its assets.
      - **Bankruptcy** is a legal process that may follow insolvency, in which a court oversees how the debts are dealt with, through restructuring or the sale of assets to repay creditors.
      - The key difference: insolvency can be temporary and resolved without the courts, for example by raising new finance, while bankruptcy is the formal legal outcome when it is not.

      An example of a business that is insolvent but recovers would strengthen the answer.
  - q: Explain why a profitable business can become insolvent.
    marks: 4
    command: explain
    level: HL
    paper: '2'
    answer: |
      A strong response explains the difference between profit and cash and gives causes:

      - Profit is recorded when sales are made, but cash arrives only when customers pay, so a business selling on long credit terms can be profitable while short of cash.
      - Cash can be tied up in stock that has not yet sold, shown by slow stock turnover.
      - Rapid growth (overtrading), large loan repayments or the purchase of assets can use up cash faster than profit replaces it.
      - If the business cannot then pay its suppliers, its lenders or its staff when payment falls due, it is insolvent, whatever its profit.

      Two causes, each clearly linked to the gap between profit and cash, make a complete answer.
  - q: |
      Rookwood Furniture, a fictional manufacturer, has cost of sales of $3,650,000 a year and average stock of $730,000, so its stock turns over 5 times a year, every 73 days, compared with 8 times two years ago. Its non-current liabilities are $2.9 million and its equity $2.1 million, a gearing ratio of 58%. Interest rates are rising.

      Evaluate two strategies Rookwood Furniture could use to improve its efficiency ratios.
    marks: 10
    command: evaluate
    level: HL
    paper: '2'
    answer: |
      A strong response would choose two strategies that fit the evidence, for example:

      - **Reduce stock**, by ordering materials closer to when they are needed (moving towards just-in-time), making more furniture to order and clearing slow-selling finished goods. Returning to 8 times a year would cut average stock to 3,650,000 ÷ 8 = $456,250, about 45.63 days, and release $273,750 of cash. Weigh: the risk of running out of materials and missing delivery dates, losing bulk discounts, the cost of discounting old stock, and whether suppliers can deliver reliably.
      - **Reduce gearing**, by issuing shares, retaining profit, or using the cash released from stock to repay part of the loans. Repaying $273,750 would cut gearing to (2,626,250 ÷ 4,726,250) × 100 = 55.57%, still high, so a share issue may also be needed. Weigh: dilution of the owners' control, lower dividends, and the cost of issuing shares, against lower interest costs and less risk as interest rates rise.

      It would note that the strategies support each other, since cash released from stock can repay debt, and reach a justified judgement, for example that reducing stock comes first because it is within Rookwood's control and funds part of the debt reduction, while gearing above 50% with rising interest rates makes further action necessary. Answers that list strategies without using the figures or the case are limited.
summary:
  - Efficiency ratios show how well a business manages its stock, the credit it gives and takes, and the mix of borrowing and owners' money in its long-term finance.
  - Stock turnover (times) = cost of sales ÷ average stock; stock turnover (days) = (average stock ÷ cost of sales) × 365; average stock = (opening stock + closing stock) ÷ 2.
  - Debtor days = (debtors ÷ total sales revenue) × 365; creditor days = (creditors ÷ cost of sales) × 365.
  - Gearing ratio = (non-current liabilities ÷ capital employed) × 100, where capital employed = non-current liabilities + equity.
  - Faster stock turnover and fewer debtor days free cash; more creditor days keep cash longer but strain suppliers; above about 50% gearing is usually seen as high.
  - Compare each ratio with past years, similar businesses and credit terms, and read them together to explain changes in liquidity and profitability.
  - Every strategy has a cost, and helping one ratio can harm another, so judge strategies against the cause of the problem and the whole set of accounts.
  - Insolvency is being unable to pay debts; bankruptcy is the legal process that may follow. A profitable business can become insolvent because profit is not cash.
retrieval:
  - q: Which four ratios does the guide call efficiency ratios?
    a: Stock turnover, debtor days, creditor days and the gearing ratio.
  - q: Write the two formulas for stock turnover.
    a: Stock turnover (number of times) = cost of sales ÷ average stock; stock turnover (number of days) = (average stock ÷ cost of sales) × 365, where average stock = (opening stock + closing stock) ÷ 2.
  - q: Why does stock turnover use cost of sales rather than sales revenue?
    a: Because stock is valued at cost, so it must be compared with the cost of the goods sold, not with their selling price.
  - q: Cost of sales is $300,000, opening stock $20,000 and closing stock $30,000. Calculate stock turnover in times.
    a: Average stock = (20,000 + 30,000) ÷ 2 = $25,000. Stock turnover = 300,000 ÷ 25,000 = 12 times a year.
  - q: Write the formulas for debtor days and creditor days.
    a: Debtor days = (debtors ÷ total sales revenue) × 365; creditor days = (creditors ÷ cost of sales) × 365.
  - q: A business gives 30 days' credit and its debtor days are 48. What does this suggest?
    a: Customers are paying 18 days late on average, so cash is tied up and credit control needs attention; the risk of bad debts may be rising.
  - q: Why can a rise in creditor days be a warning sign?
    a: It may mean the business is paying late because it lacks cash, which can lose discounts, damage relationships and lead suppliers to tighten their terms.
  - q: Write the gearing formula and the guide's definition of capital employed.
    a: Gearing ratio = (non-current liabilities ÷ capital employed) × 100, where capital employed = non-current liabilities + equity.
  - q: Non-current liabilities are $1.5 million and equity $3.5 million. Calculate the gearing ratio.
    a: 1.5 ÷ (1.5 + 3.5) × 100 = 30%.
  - q: Give one strategy to improve each of stock turnover and debtor days, with a cost of each.
    a: For example, just-in-time ordering, at the risk of running out; and early-payment discounts or factoring, which cost profit.
  - q: What is the difference between insolvency and bankruptcy?
    a: Insolvency is a financial state in which a business cannot pay its debts; bankruptcy is the legal process, overseen by a court, that may follow.
  - q: Why can a profitable business become insolvent?
    a: Profit is not cash. Cash can be tied up in stock and debtors, or used for growth and loan repayments, so a profitable business can still be unable to pay its bills on time.

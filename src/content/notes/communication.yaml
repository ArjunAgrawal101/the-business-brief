retrieval:
  - q: What are the five parts of the communication process?
    a: A sender, a message, a channel, a receiver and feedback.
  - q: Why is two-way communication usually more effective than one-way communication?
    a: Feedback lets the sender check that the message was understood and correct any misunderstanding; one-way communication gives no such check.
  - q: In which three directions can formal communication flow?
    a: Downward (instructions and decisions to staff), upward (reports, problems and ideas to managers) and horizontal (coordination between people or departments at the same level).
  - q: Give two advantages and two disadvantages of formal communication.
    a: 'Advantages: accurate, recorded, carries authority, consistent. Disadvantages: can be slow, filtered through levels, often one-way, impersonal.'
  - q: What is the grapevine?
    a: The informal network through which news and rumours spread from person to person in an organization, often faster than official announcements.
  - q: When does the grapevine spread rumours most?
    a: When formal communication is slow, vague or silent, so people fill the gap with guesses.
  - q: Why does face-to-face communication suit sensitive messages?
    a: It is rich and two-way, carrying tone and body language, so the receiver can ask questions and the sender can see how the message is received and respond.
  - q: Name six questions to ask when choosing a method of communication.
    a: What is the purpose, how urgent is it, how sensitive is it, how complex is it, does it need a record, and who is the audience?
  - q: How many possible one-to-one links are there between 6 people?
    a: 6 × 5 ÷ 2 = 15.
  - q: Give five barriers to communication.
    a: For example, jargon, language differences, cultural differences, information overload, the wrong channel, too many levels in the hierarchy, distance and time zones, technology failure, distrust and poor listening.
  - q: Why do tall structures make communication harder?
    a: Messages pass through more levels, which slows them down and gives each level a chance to filter or distort them.
  - q: (HL) How can high power distance act as a barrier to communication?
    a: Employees may hesitate to question managers or report problems upwards, so upward communication is weak unless managers actively ask for feedback.

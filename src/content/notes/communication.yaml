# Notes: 2.6 Communication. Written in the platform's own words from the
# guide's two content statements (p. 27), the unit's inquiry statement on
# effective communication (p. 27) and its theory of knowledge question on how
# language can influence, persuade or manipulate employees (p. 28). Hofstede's
# cultural dimensions are an HL toolkit tool and are marked HL. Media richness
# and high- and low-context cultures are enrichment, attributed to their
# authors and explained from subject knowledge. No coursebook chapter for unit
# 2 was supplied. Every business named is fictional, every figure simulated,
# and every worked figure was checked by script.
code: '2.6'
title: Communication
level: SL/HL
introduction: |
  Every plan, instruction, warning and idea in an organization travels as a message, and every message can arrive late, garbled or not at all. When **communication** works, people know what to do and why, problems surface early and change is understood. When it fails, the costs show up as mistakes, rumours, wasted time, lost customers and staff who feel ignored.

  The guide asks two things of this subtopic. You should be able to explain the **barriers** that stop messages getting through (AO2), and to judge which **formal and informal methods** of communication suit an organization in a given situation (AO3). That second statement is the demanding one: there is no best method in general, only methods that fit a particular message, audience and moment.
objectives:
  - '**Describe** the communication process, from sender to receiver and back through feedback.'
  - '**Explain** formal communication and the directions in which it flows, and informal communication, including the grapevine.'
  - '**Compare** the main methods of communication, oral, written, visual and digital, and what each does well.'
  - '**Explain** the barriers to communication and how they can be reduced.'
  - '**Evaluate** which formal and informal methods suit an organization in a given situation, and **recommend** a choice.'
situation:
  title: Too big for Friday lunch
  fictional: true
  text: |
    Three years ago Kinloch Bikes, a fictional maker of electric bikes, had 15 people in one workshop. Every Friday the founder, Isla Kinloch, bought lunch and told everyone what was happening. Today it has 160 staff: a factory in one city, a design studio in another and a sales office abroad, six hours ahead.

    The Friday lunch no longer reaches anyone. Designers and factory engineers blame each other for a model that is four months late, and each team learns of the other's changes only when something fails to fit. The sales office found out about a price rise from a customer. Email traffic has tripled, yet a staff survey finds that most people hear important news first from colleagues or the staff chat group, not from their managers. This week the chat group is full of rumours that a larger bike company is about to buy Kinloch, and two senior designers have asked whether their jobs are safe.

    **How should Kinloch communicate now that it has outgrown its founder's lunch, and what is stopping its messages getting through?**
sections:
  - id: the-communication-process
    title: Communication and the communication process
    kind: concept
    body: |
      **Communication** is the transfer of information, ideas or instructions from a sender to a receiver, so that the receiver understands them as the sender intended. Inside an organization it coordinates work, passes on decisions, carries problems and ideas upwards, and builds the relationships people need to cooperate. Outside, it reaches customers, suppliers, investors and the community. This subtopic is mainly about communication inside the organization.

      Every act of communication follows the same process, shown in the diagram. A **sender** has an idea and turns it into a **message**, in words, figures or images. The message travels through a **channel**, such as a meeting, an email, a notice or an app, to a **receiver**, who interprets it and acts on it. **Feedback**, the receiver's reply, question or action, tells the sender whether the message was understood. Anything along the way that distorts or blocks the message is a **barrier**.

      The process shows why communication fails so often: there are many places for it to go wrong. The sender may be unclear, the channel unsuitable, the receiver distracted or distrustful. Feedback is the safeguard. **One-way communication**, such as a notice or an announcement, is fast but gives the sender no way of knowing whether the message landed. **Two-way communication**, such as a conversation or a meeting with questions, is slower but lets misunderstandings be caught and corrected.
    diagram: communication-process
    points:
      - term: Sender
        text: The person or group with the message, who decides what to say, to whom and through which channel.
      - term: Message
        text: The content, in words, numbers, images or actions. A clear message suits its purpose and its receiver.
      - term: Channel
        text: The route or medium the message travels through, such as a meeting, a report, an email, a phone call or the intranet.
      - term: Receiver
        text: The person or group the message is for. What they understand depends on their knowledge, language, attitude and attention.
      - term: Feedback
        text: The receiver's response, which confirms understanding or reveals confusion. Without it, the sender is guessing.
    example:
      title: A message that did not land
      fictional: true
      text: Kinloch's operations manager emailed the factory to say that a new frame design would be used "from the next batch". She meant the next batch ordered from the supplier, due in six weeks; the factory read it as the next batch on the production line, due on Monday. Nobody replied, so she assumed the message was clear, and the factory spent a weekend preparing for parts that did not exist. A two-minute phone call, with one question back, would have caught the mistake.
  - id: formal-communication
    title: Formal communication
    kind: types
    body: |
      **Formal communication** uses the official channels the organization sets up, usually following its structure and chain of command. It is how decisions, policies, instructions and results are passed on with the organization's authority behind them. Because it is planned and often recorded, it is accurate and can be checked later, which matters for anything with legal, safety or financial consequences.

      Formal communication flows in three directions. **Downward** communication passes decisions, instructions and policies from managers to the people they manage. **Upward** communication carries reports, results, problems, ideas and feedback from employees to managers. **Horizontal** (or lateral) communication coordinates work between people or departments at the same level, such as design and production. A healthy organization needs all three: one that only communicates downwards loses the early warnings and ideas that come from the people doing the work.

      The structure shapes formal communication. In a tall structure, messages pass through many levels, which slows them down and gives each level a chance to filter or distort them ([2.2](/topics/organizational-structure/)). In a flatter structure messages travel faster, but managers with wide spans of control may be overloaded with them.
    points:
      - term: Meetings and briefings
        text: Team meetings, department briefings and all-staff meetings, often with an agenda and minutes. Two-way, but costly in time.
      - term: Reports and memos
        text: Written documents that record results, analysis or decisions, from a weekly sales report to a board paper.
      - term: Official emails and letters
        text: Fast written messages with a record, for instructions, confirmations and anything that must be kept, such as a contract change.
      - term: Intranet, handbooks and notice boards
        text: Places where policies, procedures and news are published for everyone to refer to.
      - term: Appraisals and one-to-one reviews
        text: Formal conversations between a manager and an employee about performance and development, which give feedback in both directions.
      - term: Consultation committees
        text: Formal meetings between managers and employee representatives to discuss changes before they are decided.
    advantages:
      - Accurate and consistent, because messages are planned and can be checked.
      - Leaves a record, which matters for legal, safety and financial matters.
      - Carries authority, so people know the message is official.
      - Everyone receives the same message through the same channel.
    limitations:
      - Can be slow, especially in tall structures with long chains of command.
      - Messages may be filtered or distorted as they pass through each level.
      - Often one-way, so misunderstandings go unnoticed.
      - Can feel impersonal and bureaucratic, and too much of it adds to information overload.
    example:
      title: Formal channels at Kinloch
      fictional: true
      text: |
        Kinloch has started to build formal channels for each direction:

        - **Downward:** a monthly all-staff video briefing by Isla Kinloch, recorded for the overseas office, and a written summary on the intranet.
        - **Upward:** a weekly report from each site manager, and a quarterly staff survey.
        - **Horizontal:** a fortnightly design-and-production meeting to review every change before it reaches the factory, which should end the blame over parts that do not fit.
  - id: informal-communication
    title: Informal communication and the grapevine
    kind: types
    body: |
      **Informal communication** is the unofficial exchange of information between people outside the organization's formal channels: conversations over coffee, chats in a corridor, messages in staff chat groups, social media and talk after work. Its best-known form is the **grapevine**, the network through which news and rumours spread from person to person, often far faster than any official announcement.

      Informal communication cannot be abolished, and managers should not want to abolish it. It builds the relationships that make cooperation easy, it carries problems and ideas across departmental boundaries without waiting for a meeting, and it tells managers what people really think. Much of the creativity in organizations comes from informal conversations between people in different teams.

      Its danger is that it is unchecked. Rumours spread most when formal communication is slow, vague or silent: people fill the gap with guesses, usually pessimistic ones. The most effective defence against harmful rumours is not to suppress the grapevine but to communicate formally, early and honestly, and to listen to what the grapevine is saying. Some managers make a habit of walking around the workplace and talking to staff informally, which keeps them in touch with problems that formal reports may never mention.
    points:
      - term: Speed
        text: News on the grapevine can reach the whole organization within hours, ahead of the official version.
      - term: Relationships and trust
        text: Informal contact builds the goodwill that makes formal cooperation easier, especially between departments.
      - term: Honest feedback
        text: People say informally what they would not say in a meeting, so the grapevine can warn managers of problems early.
      - term: Rumour and inaccuracy
        text: Messages change as they pass from person to person, and rumours can cause anxiety, damage morale and lead good staff to leave.
      - term: Exclusion
        text: People outside the informal networks, such as remote, part-time or new staff, can miss information others have.
    advantages:
      - Fast, and flows across departments and levels without waiting for the formal channels.
      - Builds relationships, trust and a sense of belonging.
      - Gives managers an honest picture of morale and of problems.
      - Supports creativity, as people in different teams share ideas.
    limitations:
      - Often inaccurate, and spreads rumours, especially when formal communication is poor.
      - No record and no control over who hears what.
      - Can undermine official messages and leak confidential information.
      - Leaves out people who are not part of the informal networks.
    example:
      title: Why Friday lunch stopped working
      fictional: true
      text: |
        With 15 people, Kinloch had 15 × 14 ÷ 2 = 105 possible one-to-one links between staff, few enough for everyone to hear everything informally. With 160 people there are 160 × 159 ÷ 2 = **12,720**, about 121 times as many, although the workforce has grown less than eleven times. Informal communication that once reached everyone now reaches only the people who happen to talk to each other. This simple count is an illustration, not a formula the guide uses, but it shows why growing organizations need formal channels that small ones can do without.

        It also explains the rumours. In a staff survey answered by 150 of Kinloch's 160 employees, 93 (**62%**) said they first heard important news from colleagues or the chat group, 39 (26%) from their line manager and only 18 (12%) from an email. When the formal channels say little, the grapevine fills the gap.
  - id: methods-of-communication
    title: 'Methods of communication: oral, written, visual and digital'
    kind: types
    body: |
      Formal and informal describe the *route* a message takes. The method, or medium, describes its *form*. The same formal message, such as a change to working hours, could be given in a meeting, in a letter, in an email, on a poster or in a short video, and each would land differently.

      Methods differ in how much they can carry. Face-to-face conversation carries words, tone, facial expression and the chance to ask questions at once, so it suits messages that are complex, sensitive or open to misunderstanding. A written notice carries only words, but it is precise, permanent and can reach everyone at once, so it suits simple facts and anything that must be kept. Researchers Richard Daft and Robert Lengel described this as the *richness* of a medium in the 1980s, arguing that rich media suit ambiguous messages and lean media suit routine ones. Their framework is enrichment, not part of the guide, but the idea is useful when you judge a method.
    points:
      - term: Oral, face to face
        text: Conversations, meetings and presentations. Rich, personal and two-way, with tone and body language, but leaves no record unless notes are taken, and takes everyone's time at once.
      - term: Oral, at a distance
        text: Phone and video calls. Fast and two-way across distances, though video loses some of the cues of a meeting, and time zones limit when people can talk.
      - term: Written
        text: Letters, reports, memos, emails, handbooks and contracts. Precise and permanent, and can be studied and kept, but one-way, slower to produce, and easy to misread without tone.
      - term: Visual
        text: Charts, diagrams, infographics, signs and videos. Make data and procedures easy to grasp and can cross language barriers, but can oversimplify.
      - term: Digital
        text: Intranets, instant messaging, collaboration platforms and video conferencing. Fast and cheap, reaching dispersed teams, but they add to information overload, blur the line between work and home, and depend on the technology working.
      - term: Non-verbal
        text: Body language, tone, facial expression and actions. Part of every face-to-face message; when words and actions disagree, people tend to believe the actions.
    example:
      title: One message, three methods
      fictional: true
      text: Kinloch must tell factory staff that a new torque check is required on every motor mount. A long email would be read by few people on the shop floor and could be misunderstood. A short briefing at each shift change, a one-page visual guide at each workstation and a sign-off sheet showing that every assembler has been shown the check does the job, because the message is about safety, must reach people who do not sit at a computer, and needs a record that each person has understood it.
  - id: choosing-a-method
    title: Choosing formal and informal methods for a given situation
    kind: evaluation
    body: |
      The guide's AO3 statement asks which formal and informal methods suit an organization *in a given situation*. That is a judgement, so the answer is always "it depends", followed by what it depends on. A strong answer starts from the message and the audience, not from the method.

      Ask six questions. What is the **purpose**: to inform, instruct, consult, persuade or reassure? How **urgent** is it? How **sensitive** or confidential is it, and how will people feel about it? How **complex** is it, and is it likely to be misunderstood? Does it need a **record** for legal, safety or financial reasons? And who is the **audience**: how many people, where, in what language, and with what access to technology? Cost, the organization's culture and its structure then narrow the choice.

      Most important messages need more than one method: a rich, two-way method to explain and listen, a written method to record and confirm, and attention to the informal channels, which will carry the message on regardless. The order matters too. Bad news delivered in person first and confirmed in writing afterwards is received very differently from bad news that arrives by email or, worse, through the grapevine before anyone official has spoken.
    points:
      - term: Announcing redundancies or other bad news
        text: Face to face, by senior managers, to everyone affected at the same time, then confirmed in writing, with time for questions and support available. Never by email alone, and never after a leak if it can be avoided.
      - term: A new safety rule
        text: Formal and written, so there is a record, backed by a briefing or demonstration and visual signs at the point of use, and a check that each person has understood.
      - term: A crisis, such as a product recall
        text: Fast and frequent, through several channels at once, from a single trusted source so that messages do not conflict. HL students study communication in a crisis in [5.7](/topics/crisis-management-and-contingency-planning/).
      - term: Consulting on a change
        text: Two-way methods, such as meetings, workshops and surveys, before the decision is fixed, with informal conversations to bring out concerns people will not raise in public.
      - term: Routine results and information
        text: Lean, written or digital channels, such as a weekly dashboard or an intranet page, that people can consult when they need to.
      - term: Coordinating teams across sites and time zones
        text: Shared written channels that people can read at any time, combined with regular video calls at hours that suit everyone in turn.
      - term: Building morale and belonging
        text: Informal contact, such as social events, recognition in person and managers who walk around and talk, supported by formal recognition schemes.
    example:
      title: Kinloch's sales office learns of a price rise from a customer
      fictional: true
      text: The price rise was decided at a factory meeting and announced in an email to "all staff" that went out at 17:00 head-office time, 23:00 in the sales office. By the next morning, a customer had seen the new prices online and called to complain, before the sales team had read the email. The situation called for a formal message that reached the sales team *before* customers, with the reasons, so they could answer questions. A short video call at a time that suited the overseas office, followed by a written note with the new price list and suggested answers for customers, would have cost an hour.
  - id: barriers-to-communication
    title: Barriers to communication
    kind: concept
    body: |
      A **barrier to communication** is anything that stops a message being sent, received or understood as the sender intended. Barriers can arise at every stage of the process: in the sender, the message, the channel, the receiver or the feedback. The guide sets this statement at AO2, so you should be able to explain how a barrier affects a particular organization, not only name it.

      Barriers matter because their costs are real even when they are hard to see: errors and rework, delays, duplicated effort, poor decisions made on poor information, low morale and staff who feel ignored. In a hospital or a factory, a misunderstood instruction can be a matter of safety.

      Structure is one barrier that is easy to overlook. Suppose that each time a message is passed on, about 80% of its detail survives. A message from the board that passes down four further levels to the shop floor would arrive with about 0.8 × 0.8 × 0.8 × 0.8 = 0.41, or **41%**, of its original detail; with only two levels to pass, about 64% would survive. The percentages are an illustration, but the point is real: every extra level of hierarchy is another chance for a message to be shortened, softened or misread.
    points:
      - term: Jargon and technical language
        text: Specialist terms that the receiver does not understand, such as engineering or finance terms used with non-specialists.
      - term: Language differences
        text: Receivers working in a second language, or a message in one language sent to a workforce that speaks several.
      - term: Cultural differences
        text: |
          Different expectations about directness, hierarchy, formality and silence can lead to offence or misunderstanding. As enrichment beyond the guide, the anthropologist Edward T. Hall distinguished high-context cultures, where much is left unsaid and understood from the situation, from low-context cultures, where people expect everything to be stated explicitly.
      - term: Information overload
        text: So many messages that important ones are missed, skimmed or ignored, a growing problem with email and messaging apps.
      - term: The wrong channel
        text: A complex or sensitive message sent through a lean channel, such as bad news by email, or a simple fact buried in a long meeting.
      - term: Too many levels in the hierarchy
        text: Long chains of command slow messages and let them be filtered or distorted at each level.
      - term: Distance, time zones and noise
        text: Physical separation, working hours that do not overlap, and noisy or distracting workplaces.
      - term: Technology failure
        text: Unreliable networks, systems people have not been trained to use, or messages lost in filters and folders.
      - term: Attitudes and emotions
        text: Distrust of the sender, fear, anger, stress or lack of interest change how a message is heard, and people tend to hear what they expect.
      - term: Poor listening and no feedback
        text: Receivers who do not pay attention, and senders who never check understanding.
      - term: Power distance (Hofstede, toolkit)
        level: HL
        text: In Hofstede's cultural dimensions, an HL toolkit tool, power distance describes how far people accept that power is unequally distributed. Where it is high, employees may hesitate to question managers or report problems upwards, so upward communication is weak unless managers actively ask for it.
    example:
      title: The barriers at Kinloch
      fictional: true
      text: |
        Kinloch's problems trace back to several barriers at once.

        - **Distance and time zones:** three sites, one six hours ahead, so a message sent at the end of one day arrives in the middle of another's night.
        - **The wrong channel:** important news arrives by email to people who rarely read it, while the founder's Friday lunch reaches only one site.
        - **Information overload:** email traffic has tripled, so important messages are buried.
        - **Jargon between departments:** designers and engineers use different terms for the same parts, so "next batch" and "revision B" mean different things in each place.
        - **Attitudes:** with rumours of a takeover, staff read every message for hidden bad news.
  - id: reducing-barriers
    title: Reducing the barriers
    kind: application
    body: |
      Each barrier has a remedy, and the best remedies are matched to the barrier that is actually causing the problem. Clearer writing will not fix a message that arrives in the middle of the night; a better app will not fix a lack of trust.

      Three principles run through them. **Know the receiver:** write and speak for the people who must understand, in their language and at their level. **Match the method to the message:** rich, two-way methods for complex or sensitive messages, lean and written ones for routine facts and records. **Close the loop:** ask for feedback, check understanding and act on what comes back, so that communication is a conversation rather than a broadcast. Communication is also a matter of trust built over time: people believe managers whose words have matched their actions before.
    points:
      - term: Plain language
        text: Short sentences, everyday words and jargon explained, with translation or visuals where people speak different languages.
      - term: The right method and timing
        text: Choose the method by the purpose, urgency, sensitivity and audience, and time messages so that every group receives them before outsiders do.
      - term: Feedback and listening
        text: Questions at the end of briefings, surveys, suggestion schemes and managers who walk around and listen.
      - term: Fewer, clearer messages
        text: Cut unnecessary emails, put the key point first, and use one trusted channel for official news, which reduces overload.
      - term: Shorter chains of command
        text: Delayering, or allowing direct communication across levels, so that messages pass through fewer hands.
      - term: Training
        text: Teach managers to brief, listen and give feedback, and teach staff to use the communication tools the organization relies on.
      - term: Repetition through several channels
        text: Important messages repeated in more than one form, for example in a meeting, in writing and on the intranet, so that one failed channel does not lose the message.
    example:
      title: Kinloch's first changes
      fictional: true
      text: Kinloch replaced the Friday lunch with a monthly video briefing at a time that alternates between the sites, followed by a written summary and a question channel that the founder answers personally. It created a shared glossary of part names for designers and engineers, made the design-and-production meeting compulsory before any change reaches the factory, and set a rule that customer-facing staff are told of price changes at least two working days before they take effect. The next survey will show whether the share of staff who hear news first through the grapevine has fallen from 62%.
applications:
  - industry: Hospitals and healthcare
    text: Communication is a matter of patient safety, so hospitals use structured, formal handovers between shifts, written records and checklists, and encourage staff to speak up about problems whatever their seniority. Jargon, fatigue, noise and steep hierarchies are recognized barriers.
  - industry: Manufacturing
    text: Many staff work on the shop floor, in noise and in shifts, without computers, so short briefings at the start of a shift, visual signals and signs at workstations matter more than email. Several languages may be spoken on one site.
  - industry: Professional services
    text: Law and accountancy firms depend on precise written communication with a record, and on confidentiality. Informal communication between colleagues spreads knowledge, but careless informal talk can leak client information.
  - industry: Retail chains
    text: Head office must reach hundreds of stores and many part-time staff on different shifts, so it relies on store managers, short daily briefings, staff apps and the intranet. Messages that must reach the shop floor before customers do, such as price changes, test every channel.
  - industry: Technology and remote teams
    text: Teams spread across cities and time zones rely on written, digital channels that people can read when they choose, with video calls for discussion. Overload and the loss of informal contact are the main risks, so firms deliberately create informal ways for people to meet.
  - industry: Multinational companies
    text: Language, culture and time zones all act as barriers, and messages from head office can read very differently in each host country. At HL, Hofstede's dimensions help to explain why the same method of communication works in one country and fails in another.
stakeholders:
  - group: Employees
    text: Need timely, honest information about their work and their future, and a voice upwards. When formal communication fails they turn to the grapevine, and poor communication is a common cause of low morale and resistance to change.
  - group: Managers
    text: Depend on accurate information flowing up and across to make decisions, and must pass decisions down clearly. Middle managers can become bottlenecks, filtering messages in both directions, and suffer most from information overload.
  - group: Owners and shareholders
    text: Want clear, regular information about performance and strategy. Companies whose shares are traded publicly must report formally to investors, and what managers say in public affects the share price, so formal communication with shareholders is closely controlled.
  - group: Customers
    text: 'Experience the results of internal communication: a sales team that knows about a price change, or a delivery that arrives as promised because departments talked to each other. In a crisis, fast and honest external communication protects trust.'
  - group: Employee representatives
    text: Expect formal consultation before major changes. Communication with them that is late or one-sided can turn concern into conflict, which HL students study in [2.7](/topics/industrial-employee-relations/).
  - group: Suppliers
    text: Need accurate forecasts, specifications and changes in good time; a design change that is not communicated to a supplier causes waste and delay on both sides.
evaluation:
  - There is no best method in general. The right choice depends on the purpose, urgency, sensitivity and complexity of the message, the need for a record and the audience, and most important messages need a rich, two-way method together with a written one.
  - Informal communication cannot be abolished, only managed. Strong, early and honest formal communication starves rumours of oxygen, while listening to the grapevine gives managers early warning of problems.
  - More communication is not better communication. Digital tools make messages faster and cheaper, but also multiply them, and information overload is itself a barrier. Fewer, clearer messages through trusted channels often work better.
  - Structure and culture shape communication. Tall structures slow and filter messages; flatter ones speed them up but may overload managers. Organizational culture decides whether people feel safe to speak up, and at HL, national culture and Hofstede's power distance help to explain why.
  - Communication is two-way. A message is only effective if it is understood and acted on, so feedback and listening are as important as clear sending. Judging effectiveness needs evidence, such as surveys, errors, rumours and how fast news reaches each group.
  - Communication raises ethical questions. Timing, honesty and the choice of words can inform people or manipulate them; the guide's theory of knowledge questions for this unit ask how language can be used to influence, persuade or manipulate employees (p. 28). Trust, once lost through spin or silence, is slow to rebuild.
decision:
  title: Telling Kinloch's staff about the investment
  fictional: true
  brief: |
    Kinloch Bikes has agreed to sell a 60% stake to a larger bike company, which will keep the Kinloch brand and all three sites for at least two years. The deal will be signed on Thursday at 16:00 head-office time, when the sales office abroad will be closing. Rumours are already circulating on the staff chat group, two senior designers have asked about their jobs, and local journalists cover the company closely. Isla Kinloch must decide how to tell 160 staff on three sites.
  options:
    - label: An email from the founder
      text: Send all staff an email from Isla Kinloch at 16:30 on Thursday, with a detailed set of questions and answers on the intranet. Fast, consistent and cheap, and everyone gets the same words at the same moment.
    - label: Briefings at every site
      text: Hold face-to-face briefings at 16:30 on Thursday at the factory and studio, led by Isla and the site managers, with a video call to the sales office early on Friday morning their time, then send a written summary and open a question channel the founder answers for a month.
    - label: A cascade through managers
      text: Brief all managers in confidence on Wednesday, so each can tell their own team on Thursday afternoon, with a formal written announcement on Friday.
  guidance: |
    Start with the nature of the message. It is sensitive, people fear for their jobs, and rumours already exist, so the method must be rich enough to reassure and to answer questions, fast enough to beat the grapevine, and consistent across sites.

    **Option A** is consistent and quick, but a lean, one-way channel for news this personal invites people to read between the lines, and an email is easily forwarded to journalists. It answers the facts but not the fear. **Option B** is rich and two-way: staff hear the news from the founder, can ask questions at once and can judge her tone. It costs managers' time and needs careful timing so that no site hears it second-hand; the sales office will hear it last, which the video call and an early message from their manager must manage. **Option C** uses managers who know their teams, but briefing managers a day early risks a leak, each manager may tell the story differently, and the managers themselves may have the same worries as their staff.

    A strong judgement weighs speed, richness, consistency and confidentiality, and may combine options: for example, B for the announcement, with A's written questions and answers sent the moment the briefings start so that every site has the same facts in writing, and managers briefed only an hour before. Say what would change your mind: a high risk of the news leaking before Thursday would favour speed over richness, and a deal that put jobs at risk would make face-to-face delivery essential, not merely better.
exam:
  - q: Define the term *informal communication*.
    marks: 2
    command: define
    level: SL/HL
    paper: '1'
    answer: |
      A strong response gives a precise definition: the unofficial exchange of information between people outside the organization's formal channels, such as conversations, chat groups and the grapevine.

      - The key contrast is with the official channels set by the structure.
      - An example alone, such as "gossip", is not a definition.
  - q: Kinloch Bikes, a fictional manufacturer, has grown from 15 to 160 staff on three sites, one in another country six hours ahead (see the situation above). Explain **two** barriers to communication at Kinloch.
    marks: 4
    command: explain
    level: SL/HL
    paper: '1'
    answer: |
      A strong response identifies two distinct barriers and explains how each stops messages getting through at Kinloch. For example:

      - **Distance and time zones:** the sales office is six hours ahead, so messages sent at the end of the day at head office arrive overnight, and the sales team learned of a price rise from a customer.
      - **Information overload:** email traffic has tripled, so important messages are missed among routine ones.
      - Other valid choices include the wrong channel (news by email to staff who rarely read it), jargon between designers and engineers, and attitudes shaped by takeover rumours.

      Each barrier needs both an explanation of how it works and a link to Kinloch. The teacher support material notes that AO2 answers without application are typically limited to half the marks (p. 56).
  - q: Distinguish between formal and informal communication, using examples from Kinloch Bikes.
    marks: 4
    command: distinguish
    level: SL/HL
    paper: '1'
    answer: |
      A strong response makes the differences clear, with an example of each from the case.

      - **Route:** formal communication uses official channels set by the structure, such as the monthly briefing or the weekly site reports; informal communication runs outside them, such as the staff chat group.
      - **Authority and accuracy:** formal messages carry the organization's authority and are usually accurate and recorded; informal ones are unofficial, unchecked and can spread rumours, such as the takeover rumours.
      - **Speed and control:** informal communication is often faster, which is why most Kinloch staff hear news first from colleagues, but managers cannot control it.
  - q: |
      In a survey answered by 150 of Kinloch's 160 staff, 93 said they first heard important news from colleagues or the staff chat group, 39 from their line manager and 18 from an email.

      Comment on what these results suggest about communication at Kinloch.
    marks: 4
    command: comment
    level: SL/HL
    paper: '2'
    answer: |
      A strong response turns the figures into percentages and then judges what they show.

      - **The figures:** 93 ÷ 150 × 100 = **62%** first hear news informally, 39 ÷ 150 × 100 = 26% from their line manager and 18 ÷ 150 × 100 = 12% from email.
      - **Judgement:** formal communication is failing to reach staff first. Line managers, who should be the main channel for news, reach only about a quarter of staff first (26%), and email, the channel the business uses most, reaches only 12%.
      - **Implication:** the grapevine is filling the gap, which explains the takeover rumours, and messages reaching staff informally may be inaccurate.
      - A top response notes a limit: the survey shows where news is heard first, not whether the formal message is understood once it arrives.
  - q: (HL) Staff in Kinloch's overseas sales office come from a national culture that scores high on power distance in Hofstede's cultural dimensions. Explain how this might affect upward communication from the sales office to head office.
    marks: 4
    command: explain
    level: HL
    paper: '1'
    answer: |
      A strong response explains the dimension and applies it.

      - **Power distance:** the extent to which people accept that power is unequally distributed. Where it is high, employees tend to defer to managers and may avoid questioning or contradicting them.
      - **Effect:** sales staff may not report problems, such as customers' complaints about the price rise, or challenge head office's decisions, so upward communication is weak and head office loses early warnings.
      - **Response:** head office may need to ask for feedback explicitly, through anonymous surveys or one-to-one conversations, rather than waiting for it.
      - A careful answer notes that a national score describes a tendency, not every individual.
  - q: Recommend how Kinloch Bikes should use formal and informal methods of communication between its three sites in future.
    marks: 10
    command: recommend
    level: SL/HL
    paper: '1'
    answer: |
      A strong response recommends a set of methods matched to Kinloch's problems, supports it with evidence from the case and weighs alternatives. One way to organize it:

      - **Diagnose:** the problems are horizontal (design and factory do not coordinate), cross-border (the sales office hears news late) and downward (62% hear news first through the grapevine).
      - **Formal methods, applied:** a compulsory design-and-production meeting before any change reaches the factory; a monthly briefing at times that rotate between sites, recorded and summarized in writing; a rule that customer-facing staff hear of price changes before customers. Weigh each: they add meetings and cost time, but give accuracy and a record.
      - **Informal methods, applied:** keep the chat group but use it to point to official news; create occasions for designers and engineers to meet informally; managers who talk to staff. Weigh the benefit of relationships and honest feedback against the risk of rumours.
      - **Alternatives considered:** for example, relying on email alone (cheap, but already failing) or a full new intranet (useful, but technology will not fix trust or coordination on its own).
      - **Recommendation with conditions:** for example, a small number of reliable formal channels, matched to each direction of communication, with informal contact deliberately encouraged; judged by whether the share hearing news first from the grapevine falls at the next survey.

      A recommendation that names methods without linking them to Kinloch's specific problems, or ignores informal communication altogether, will score low.
summary:
  - '**Communication** passes a message from a sender, through a channel, to a receiver; **feedback** shows whether it was understood, and barriers can distort it at any stage.'
  - '**Formal communication** uses official channels set by the structure and flows downward, upward and horizontally; it is accurate, recorded and authoritative, but can be slow, filtered and one-way.'
  - '**Informal communication**, including the grapevine, is fast, builds relationships and reveals what people think, but spreads rumours, especially when formal communication is poor.'
  - Methods differ in richness. Face-to-face suits complex and sensitive messages; written methods suit facts and records; visual methods suit data and procedures; digital methods reach dispersed teams but add to overload.
  - Choosing a method for a given situation depends on the purpose, urgency, sensitivity, complexity, the need for a record and the audience, then on cost, culture and structure.
  - Important messages usually need a rich, two-way method together with a written one, delivered in the right order and before outsiders hear.
  - Barriers include jargon, language and cultural differences, information overload, the wrong channel, too many levels in the hierarchy, distance and time zones, technology failure, attitudes and poor listening.
  - Barriers are reduced by knowing the receiver, matching the method to the message and closing the loop with feedback; trust built over time makes every message more credible.
  - At HL, high power distance can weaken upward communication, so managers must ask for feedback rather than wait for it.
connections:
  - code: '2.2'
    text: The structure sets the formal channels; tall structures with long chains of command slow and filter messages, and delayering shortens them.
  - code: '2.1'
    text: Early, honest, two-way communication is the first strategy for reducing resistance to change, and rumours fill any gap it leaves.
  - code: '2.3'
    text: Leadership style shapes communication, from one-way instruction under autocratic leadership to two-way consultation under democratic leadership.
  - code: '2.4'
    text: Recognition and feedback are motivators, and feeling unheard is a common cause of demotivation.
  - code: '1.6'
    text: Multinational companies communicate across languages, cultures and time zones, where barriers multiply.
  - code: '5.7'
    text: At HL, transparency and communication are among the factors in effective crisis management.

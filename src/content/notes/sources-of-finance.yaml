# Notes: 3.2 Sources of finance. Written in the platform's own words from the
# guide's three content statements (p. 28): the three internal sources, the
# eight external sources (both AO2) and the appropriateness of short- or
# long-term sources for a given situation (AO3). The teacher support
# material's inquiry question on crowdfunding (p. 11) and its advice on
# evaluating options (pp. 56 and 60) were read; nothing is reproduced. The
# guide's formula list (pp. 64 to 65) gives no formula for interest, so the
# simple forms used are labelled as standard forms; the gearing ratio is the
# guide's HL formula and sits in an HL point. No coursebook chapter for unit 3
# was supplied. Every business named is fictional, every figure simulated, and
# every worked figure was checked by script.
code: '3.2'
title: Sources of finance
level: SL/HL
introduction: |
  Every business needs money that it does not yet have: to start up, to buy equipment, to carry stock, to survive a slow month or to grow. Where that money comes from matters almost as much as what it is spent on. Each **source of finance** has its own cost, its own risk and its own strings attached, from interest that must be paid whatever happens to owners who expect a say in how the business is run.

  The guide names three **internal** sources and eight **external** ones, to be understood and applied (AO2), and then asks which **short- or long-term** source suits a given situation (AO3). That last statement is the heart of the subtopic. Answers that list advantages and disadvantages of every source score little; answers that match a source to the purpose, the amount, the time and the business in the case score well.
objectives:
  - '**Explain** the internal sources of finance: personal funds for sole traders, retained profit and the sale of assets.'
  - '**Explain** the external sources of finance: share capital, loan capital, overdrafts, trade credit, crowdfunding, leasing, microfinance providers and business angels.'
  - '**Distinguish** between internal and external, short-term and long-term, and debt and equity finance.'
  - '**Analyse** the cost, risk and control that come with each source, using simple figures where they help.'
  - '**Evaluate** which short- or long-term sources suit a given situation, and **recommend** a choice.'
situation:
  title: Half a million for a second brewery
  fictional: true
  text: |
    Saltmarsh Brewing Co., a fictional brewery, is a privately held company owned equally by its two founders, Theo and Priya. Its beer sells out every week, and a second brewery with a taproom would double its capacity. The project needs $500,000: $350,000 for brewing equipment and the fit-out, and $150,000 to cover stock, staff and marketing until the taproom pays its way.

    Last year the company made a profit after tax of $95,000. It has $120,000 of retained profit in the bank, still owes $60,000 on an old loan, and owns its first site outright. Its bank will lend, but wants the first site as security. A regular customer, a retired hotelier, has offered to invest in return for a share of the company and a seat on the board. A crowdfunding platform has suggested selling shares to its customers instead, and an equipment supplier offers leasing.

    The founders want to keep control, but they do not want to bet the first brewery on the second.

    **Where should the $500,000 come from, and what would each source really cost them?**
sections:
  - id: classifying-sources
    title: Why businesses need finance, and how sources are classified
    kind: concept
    body: |
      Businesses need finance for four broad purposes: to **start up**, before any revenue arrives; for **capital expenditure** on assets that last, such as premises and equipment ([3.1](/topics/introduction-to-finance/)); for **working capital**, the cash tied up in stock and in customers who have not yet paid ([3.7](/topics/cash-flow/)); and to **grow**, by opening sites, launching products or buying other businesses ([1.5](/topics/growth-and-evolution/)). The purpose, more than anything else, decides which source suits.

      The guide sorts sources in two ways. **Internal sources** come from within the business: the owner's own money for a sole trader, profit kept in the business, and cash from selling assets. **External sources** come from outside: investors, banks, suppliers, leasing companies, crowds of backers, microfinance providers and business angels. Its AO3 statement adds a second division, by time. **Short-term finance** is needed for less than a year, usually for working capital; **long-term finance** is needed for more than a year, usually for capital expenditure and growth. Some writers add a medium term of one to five years; the guide does not.

      A third division, not named in the guide but used throughout this unit, applies to most external sources. **Debt** must be repaid, usually with interest, whatever happens to the business; lenders gain no ownership. **Equity** is money invested in return for a share of ownership; it need not be repaid, but the investors share in the profits and in control. Reward and donation crowdfunding are neither: backers receive a product, or nothing at all. Most decisions about finance are, at bottom, a choice between the risk of debt and the dilution of equity.
    diagram: sources-of-finance
    points:
      - term: Internal sources
        text: Money from within the business. No interest and no new owners, but limited in amount.
      - term: External sources
        text: Money from outside the business, from investors, lenders, suppliers or the public. Larger amounts, but with interest, fees or a loss of control.
      - term: Short-term finance
        text: Needed for less than a year, usually for working capital and cash flow gaps. Overdrafts and trade credit are the main short-term sources.
      - term: Long-term finance
        text: Needed for more than a year, usually for non-current assets, start-up and growth. Share capital, loan capital, retained profit and leasing are the main long-term sources.
      - term: Debt and equity
        text: Debt, such as loans and overdrafts, must be repaid with interest but leaves ownership unchanged. Equity, such as share capital and investment by business angels, gives investors a share of ownership instead.
  - id: internal-sources
    title: Internal sources of finance
    kind: types
    body: |
      Internal finance is usually the cheapest and quickest money a business can find, because there is no lender to persuade, no interest to pay and no new owner to satisfy. Its limit is size. A business can only use the savings, profit and spare assets it has, which are rarely enough for a large project, and are least available exactly when a young business needs money most.

      The guide names **personal funds** as an internal source *for sole traders*, and the qualification matters. A sole trader and the business are the same legal person, so the owner's savings put into the business are its own money. For a company, which is a separate legal person, money from the owners arrives as share capital, which the guide counts as an external source ([1.2](/topics/types-of-business-entities/)).

      **Retained profit** is the main internal source for established businesses: the profit left after tax and dividends, kept and reinvested. In a business with several products, it often moves from mature products to new ones; in the BCG matrix, a toolkit tool the guide suggests for this unit, the cash cows fund the question marks. The **sale of assets** raises a one-off sum from property, vehicles or equipment the business no longer needs. A variant, **sale and leaseback**, sells an asset the business does need, such as its premises, to an investor and leases it back, releasing cash while keeping the use of the asset.
    points:
      - term: Personal funds (for sole traders)
        text: The owner's own savings, put into the business. Available at once, with no interest or loss of control, and they show lenders that the owner is committed. But they are usually small, and with unlimited liability the owner risks personal wealth beyond what was invested.
      - term: Retained profit
        text: Profit kept in the business after tax and dividends. No interest, no repayment and no dilution of ownership. Only available to a profitable business, limited by the size of the profit, and every dollar retained is a dollar not paid to shareholders, which can cause conflict with those who want dividends.
      - term: Sale of assets
        text: Selling assets the business no longer needs, such as surplus land, old vehicles or unused equipment. Turns idle assets into cash, but it is a one-off source, assets may have to be sold below their value to sell quickly, and once sold they are gone.
      - term: Sale and leaseback
        text: Selling an asset the business still uses and leasing it back. Releases a large sum while keeping the asset in use, but the business then pays rent for years and loses any rise in the asset's value.
    advantages:
      - No interest, so it adds no fixed financial burden.
      - No new owners, so control stays where it is.
      - Usually quick, with no lender or investor to convince.
    limitations:
      - Limited in amount, and often too small for major investment.
      - Least available to new or loss-making businesses, which most need finance.
      - Has an opportunity cost, since retained profit could have been paid as dividends or kept as a cash buffer.
    example:
      title: A florist's internal finance
      fictional: true
      text: Juniper Flowers, a fictional florist run as a sole trader, opened with $15,000 of its owner's personal savings. After three profitable years, she used $22,000 of retained profit to buy a refrigerated van for deliveries, and raised a further $4,500 by selling a cold-storage unit she no longer needed once the van arrived. In all, $41,500 came from inside the business, without a loan or a partner. When she wanted to open a second shop costing $90,000, internal sources were no longer enough.
  - id: share-and-loan-capital
    title: 'Long-term external sources: share capital and loan capital'
    kind: types
    body: |
      **Share capital** is money raised by selling shares, units of ownership, in a company. A privately held company sells shares only privately, for example to family, friends, employees or invited investors, although in some countries regulated crowdfunding platforms let such companies sell shares to members of the public within strict limits. A publicly held company can sell shares to anyone through a stock exchange, which can raise far larger sums ([1.2](/topics/types-of-business-entities/)). Share capital is permanent: the company never has to repay it, and dividends are paid only when the directors decide the company can afford them. The price is ownership. New shareholders gain votes and a claim on future profits, so existing owners' control is diluted, and issuing shares, especially to the public, takes time and costs money in fees.

      **Loan capital** is money borrowed for a fixed period, usually more than a year, and repaid in instalments with interest. Banks normally ask for **collateral**, an asset such as property that they can take and sell if the loan is not repaid, and loans to buy property are often called mortgages. Larger companies can also borrow by issuing debentures, long-term loans from investors at a fixed rate of interest. The lender gains no ownership, so control is unchanged, and interest is a known cost that can be planned for. But interest and repayments must be paid whatever happens to sales, and missing them can cost the business its collateral or its survival.

      The two are mirror images. Share capital shares the risk with new owners and asks for nothing fixed in return; loan capital keeps ownership intact and leaves the risk with the existing owners. HL students measure how far a business relies on long-term borrowing with the gearing ratio ([3.6](/topics/efficiency-ratio-analysis/)).
    points:
      - term: Share capital, for
        text: Never has to be repaid; dividends are not compulsory; large sums are possible, especially for publicly held companies; investors share the risk.
      - term: Share capital, against
        text: Dilutes ownership and control; shareholders expect dividends and a rising share value; issues take time and cost money; only companies can issue shares, and, apart from regulated equity crowdfunding in some countries, only publicly held companies can offer them to the public.
      - term: Loan capital, for
        text: Ownership and control are unchanged; repayments can be planned; interest is usually cheaper than the return equity investors expect; suits assets whose life matches the loan.
      - term: Loan capital, against
        text: Interest and repayments must be paid even in a bad year; lenders usually want collateral, which a new business may lack; high borrowing raises the risk of failure and the cost of further loans.
    formulas:
      - name: Interest for a year on a loan
        expression: Interest = amount still owed × annual interest rate
        note: A standard form; the guide lists no formula for interest. On a loan repaid in instalments, the amount still owed falls each year, and so does the interest.
    example:
      title: Shares or a loan for Corbie Engineering?
      fictional: true
      text: |
        Corbie Engineering Ltd, a fictional privately held company wholly owned by its founder, needs $100,000 for a new machine (simulated figures).

        - **A bank loan** of $100,000 over four years at 8% a year, repaying $25,000 of the sum borrowed each year with interest on what is still owed: interest of $8,000, $6,000, $4,000 and $2,000, so **$20,000** in all and $120,000 repaid. The first year's payment is $33,000, the last $27,000. The founder keeps 100% of the company.
        - **New shares:** selling 50,000 new shares at $4 each to two investors would raise $200,000, more than needed, and nothing would ever have to be repaid. But the founder's 150,000 shares would then be 150,000 ÷ 200,000 = **75%** of the company, and the investors would share in every future profit.

        The loan costs $20,000 in interest but keeps the company; the shares cost nothing in interest but give away a quarter of it for good.
  - id: short-term-sources
    title: 'Short-term external sources: overdrafts and trade credit'
    kind: types
    body: |
      An **overdraft** is an arrangement with a bank that lets a business spend more than it has in its current account, up to an agreed limit. Interest is charged only on the amount overdrawn and only for the days it is overdrawn, so it is cheap for short, irregular gaps, such as a month when customers pay late or a season when stock must be bought before it sells. It is flexible and quick to arrange. But the interest rate is usually higher than on a loan, there may be fees, and the bank can reduce the limit or demand repayment at short notice, which makes an overdraft a dangerous way to pay for anything long-term.

      **Trade credit** is the time suppliers allow a business to pay for goods and services it has already received, typically 30, 60 or 90 days. It is one of the most widely used sources of finance, because in effect it is a short-term loan without interest: a shop can sell stock before it has paid for it. Its hidden cost is the discount some suppliers offer for paying early, which a business using the full credit period gives up. Paying late damages relationships and credit ratings, and new businesses with no track record may be offered little or no credit at first.

      Both are short-term sources for short-term needs. They finance working capital, not buildings or machines, and [3.7](/topics/cash-flow/) shows how both are used, and misused, in managing cash flow.
    points:
      - term: Overdraft, for
        text: Flexible; interest only on the amount used, for the days it is used; quick to arrange; ideal for short or seasonal gaps.
      - term: Overdraft, against
        text: Higher interest than a loan; fees; the bank can withdraw it at short notice; unsuitable for long-term needs.
      - term: Trade credit, for
        text: Usually no interest; goods can be sold before they are paid for; widely available to established businesses.
      - term: Trade credit, against
        text: Early-payment discounts are lost; paying late harms supplier relationships and credit ratings; new businesses may not be offered it.
    formulas:
      - name: Overdraft interest for a number of days
        expression: Interest ≈ amount overdrawn × annual interest rate × (days ÷ 365)
        note: A standard form for a simple estimate; the guide lists no formula. Banks calculate interest on the balance each day.
    example:
      title: Larkspur Interiors and the 2% discount
      fictional: true
      text: |
        Larkspur Interiors, a fictional furniture retailer, has an overdraft at 12% a year (simulated figures).

        - Being $20,000 overdrawn for 30 days costs about 20,000 × 12% × 30 ÷ 365 = **$197** in interest.
        - A supplier invoices $50,000, payable in 30 days, or with a 2% discount ($1,000) if paid within 10 days. Paying $49,000 on day 10 from the overdraft, 20 days early, costs about 49,000 × 12% × 20 ÷ 365 = $322 in interest. Taking the discount saves $1,000 − $322 = **$678**.

        Giving up the discount means paying $1,000 to keep $49,000 for 20 more days, which is equivalent to borrowing at about 1,000 ÷ 49,000 × 365 ÷ 20 × 100 = 37.2% a year, far dearer than the overdraft. Trade credit is free only when there is no discount to lose.
  - id: crowdfunding-angels-microfinance
    title: Crowdfunding, business angels and microfinance providers
    kind: types
    body: |
      Three of the guide's sources exist largely for the businesses that banks and stock markets find too small, too new or too risky.

      **Crowdfunding** raises money from a large number of people, each contributing a small sum, usually through an online platform. Backers may receive a **reward** (often the product itself, so the campaign is a form of pre-selling), **shares** in the business (equity crowdfunding), **interest** on a loan (peer-to-peer lending), or nothing at all, giving because they support the cause. A successful campaign proves that people want the product and builds a community of early customers; a failed one is public. Platforms charge fees, rewards cost money to make and deliver, ideas are exposed to copycats, and some platforms release the money only if the target is reached. The teacher support material asks whether crowdfunding is a sustainable source of finance (p. 11): it can launch a product, but few businesses can return to the crowd again and again.

      **Business angels** are wealthy individuals who invest their own money in start-ups and small businesses, usually in return for shares. Many have run businesses themselves and offer advice, contacts and credibility as well as money, which can be worth as much as the cash. In return they take a share of ownership and often a say in decisions, and they usually expect to sell their stake, ideally at a large profit, within a few years. **Microfinance providers** lend small sums, and often offer savings and insurance, to people on low incomes who cannot borrow from banks because they have no collateral or credit history. Some lend to groups whose members guarantee one another. Microfinance has helped many people start small businesses, especially women in low-income communities, but the loans are small, the cost of administering them makes interest rates relatively high, and borrowers can be pushed into debt they cannot repay.
    points:
      - term: Crowdfunding, for
        text: Reaches finance that banks will not offer; tests demand before production; builds publicity and a loyal customer base; reward-based campaigns give away no ownership.
      - term: Crowdfunding, against
        text: Platform fees and the cost of rewards; failure is public; the idea is exposed to copycats; it takes a great deal of marketing effort; equity crowdfunding creates many small shareholders.
      - term: Business angels, for
        text: Finance for risky young businesses with no collateral; no interest or repayments; expertise, contacts and mentoring come with the money.
      - term: Business angels, against
        text: A share of ownership, profits and control is given away; angels may disagree with the founders; they usually expect to sell their stake within a few years; good angels are hard to find.
      - term: Microfinance providers, for
        text: Lend to people excluded from banks, often without collateral; support entrepreneurship and incomes in poor communities; often come with training and support.
      - term: Microfinance providers, against
        text: Only small sums; interest rates can be high relative to the amount; strict, frequent repayments; a risk of over-indebtedness if borrowers take several loans.
    example:
      title: Three ways to fund a small idea
      fictional: true
      text: |
        - **Crowdfunding:** Tidepool Games, a fictional studio, raised $46,000 from 920 backers on a reward platform, an average of $50 each. After platform and payment fees of 8% ($3,680) and $14 per backer to make and post the rewards ($12,880), it kept **$29,440**, about 64% of what it raised, and had 920 customers waiting for the game.
        - **A business angel:** Rowan Robotics, a fictional start-up, accepted $90,000 from an angel for 30% of its shares, which values the company at $90,000 ÷ 0.30 = $300,000. The founders gave up almost a third of the business, and gained an investor who had built and sold a robotics firm.
        - **Microfinance:** a fictional market trader borrows $400 from a microfinance provider to buy a sewing machine, repaying $18.50 a week for 24 weeks, $444 in all. The loan costs $44, 11% of the sum borrowed over six months, which is dear for its size, but no bank would lend her $400 at all.
  - id: leasing
    title: Leasing
    kind: types
    body: |
      **Leasing** lets a business use an asset, such as a vehicle, a machine, a computer system or a building, in return for regular payments to the leasing company that owns it. The business never has to find the full price, so leasing turns one large capital outlay into a stream of payments spread over the asset's use, matching the cost to the years in which the asset earns its keep.

      Leases vary. Some are short, and the asset goes back to the leasing company at the end, which suits equipment that goes out of date quickly; others cover most of the asset's working life and may let the business buy it at the end. Maintenance is often included, which makes costs predictable. The price of this convenience is usually a higher total cost than buying, because the leasing company must cover its own costs and make a profit, and the business owns nothing when the lease ends. Ending a lease early can be expensive.

      Leasing is particularly useful for businesses that are short of cash or cannot borrow easily, for assets that need frequent upgrading, and as a way to keep cash and borrowing capacity free for other uses. How leases appear in published accounts depends on accounting rules that are beyond the course.
    points:
      - term: For
        text: No large outlay, so cash is preserved; payments are spread over the asset's use; maintenance and upgrades are often included; easier to obtain than a loan for some businesses.
      - term: Against
        text: Usually costs more than buying over the asset's life; no ownership and no resale value at the end; a contract that is costly to end early.
    example:
      title: Lease or buy a scanner?
      fictional: true
      text: |
        Harbour Dental, a fictional dental practice, needs a new imaging scanner (simulated figures).

        - **Buy:** $60,000 now, plus about $2,000 a year of maintenance; after four years the scanner could be sold for $12,000. Net cost over four years: 60,000 + 4 × 2,000 − 12,000 = **$56,000**.
        - **Lease:** $1,450 a month for four years, including maintenance, with a newer model at the end. Total: 1,450 × 48 = **$69,600**.

        Leasing costs $13,600 more over four years, but it avoids a $60,000 payment the practice would otherwise have to borrow, fixes the cost, and replaces an ageing machine with a current one. Which is better depends on how scarce cash is and how fast scanners improve.
  - id: choosing-a-source
    title: Matching the source to the situation
    kind: evaluation
    body: |
      The guide's AO3 statement asks which short- or long-term source suits a given situation. Start with the **matching principle**: finance a need with a source that lasts about as long as the need. Long-term needs, such as premises, machinery and growth, call for long-term sources, such as share capital, loan capital, retained profit or leasing. Short-term needs, such as stock, a seasonal gap or late-paying customers, call for short-term sources, such as an overdraft or trade credit. Paying for a five-year machine with an overdraft risks the bank calling in the money before the machine has earned it back; paying for a few weeks' stock with a five-year loan means paying interest on money that is not needed for most of the time.

      Then weigh the other factors. **Cost**: interest, fees, dividends, lost discounts and the opportunity cost of using retained profit. **Control**: equity brings new owners and votes; debt does not. **Risk**: debt adds fixed payments that must be met in bad years as well as good. **Amount**: personal funds, microfinance and crowdfunding suit small sums; share issues and large loans suit large ones. **Legal form**: sole traders and partnerships cannot issue shares, and in general only publicly held companies can sell shares to the public. **The business's position**: a profitable business with assets to offer as collateral can borrow cheaply; a young one with none may have to give away equity to angels or the crowd. And **the wider economy**: when interest rates are high, debt is dearer.

      Most real decisions combine sources, and the best answer is often a package: retained profit for part, a loan or a lease for the asset, and an overdraft for working capital. A strong answer explains why each part of the package fits, and what would make it change.
    points:
      - term: A sole trader starting up
        text: Personal funds first, perhaps with a small bank loan secured on the owner's property, trade credit once suppliers trust the business, or a microfinance loan where banks will not lend.
      - term: A growing privately held company buying a factory
        text: Retained profit and a long-term loan secured on the factory, or new shares sold to private investors if the owners will accept dilution.
      - term: A seasonal retailer stocking up
        text: An overdraft and trade credit, repaid from the season's sales.
      - term: A risky technology start-up with no assets
        text: Business angels or equity crowdfunding, because banks will not lend without collateral or a track record.
      - term: A social entrepreneur in a low-income community
        text: Microfinance, donation or reward crowdfunding, and personal funds.
      - term: A profitable business with a cash crisis and valuable premises
        text: An overdraft for the immediate gap, or sale and leaseback to release a larger sum without leaving the premises.
      - term: The gearing ratio (HL)
        level: HL
        text: HL students measure reliance on long-term borrowing with the guide's gearing ratio, non-current liabilities ÷ capital employed × 100, where capital employed is non-current liabilities plus equity ([3.6](/topics/efficiency-ratio-analysis/)). A business with $440,000 of long-term borrowing and $660,000 of equity has a gearing ratio of 440,000 ÷ 1,100,000 × 100 = 40%. The higher the ratio, the riskier more borrowing becomes.
    advantages:
      - Matching sources to needs protects liquidity and avoids paying for finance that is not needed.
      - Weighing cost, control and risk together exposes trade-offs that a comparison of interest rates alone would miss.
      - A package of sources can combine the strengths of each, such as low-cost retained profit with a loan for the remainder.
    limitations:
      - The choice is constrained by what lenders and investors will offer, which a small or new business may find very limited.
      - Future interest rates, sales and profits are uncertain, so a source that suits today may not suit next year.
      - Qualitative factors, such as the founders' wish to keep control or a backer's expertise, are hard to weigh against figures.
    example:
      title: Saltmarsh's first sort
      fictional: true
      text: Saltmarsh's $500,000 need has two parts with different time spans. The $350,000 of equipment and fit-out will serve for years, so it calls for long-term finance, such as a loan, an angel's equity or a lease. The $150,000 for stock, staff and launch marketing is partly working capital that will be recovered as the taproom trades, and partly a one-off launch cost, so retained profit fits it well, with an overdraft for any short gap. An overdraft for the equipment, or a seven-year loan for the stock, would break the matching principle. The decision below weighs three packages built on this sort.
applications:
  - industry: Technology start-ups
    text: With few physical assets, little revenue and high risk, they rarely qualify for bank loans, so they rely on founders' money, business angels, equity crowdfunding and, at a larger scale, specialist investors. They give away equity early, so the founders' share shrinks with each round of funding.
  - industry: Retail
    text: Seasonal peaks are financed with trade credit and overdrafts, repaid from sales. Many retailers lease their shops rather than buying them, and some raise cash by sale and leaseback of the stores they own.
  - industry: Manufacturing
    text: Capital-intensive businesses use long-term loans secured on their plant and property, lease machinery, and reinvest retained profit. Their tangible assets make them attractive borrowers, but heavy borrowing makes them vulnerable when demand falls.
  - industry: Social enterprises and charities
    text: Microfinance, donation and reward crowdfunding, grants and loans from investors who seek social impact matter more than share issues, which many social enterprises cannot or will not make. Trading income, the core of a social enterprise, is reinvested as retained surplus.
  - industry: Hospitality
    text: Restaurants, bars and hotels often start with personal funds and bank loans secured on property, and lease kitchen equipment. Their earnings are seasonal and sensitive to the economy, so lenders can be cautious, and trade credit from food and drink suppliers is vital.
  - industry: Large publicly held companies
    text: They can raise very large sums by issuing new shares to the public or by borrowing from many investors, but most of their investment is paid for from retained profit. Every new share issue is watched closely, because it dilutes existing shareholders.
stakeholders:
  - group: Owners and founders
    text: Want finance that keeps control and does not put their personal wealth or their business at risk. These aims conflict, because the sources that keep control, loans, add risk, and the sources that share risk, equity, give away control.
  - group: Existing shareholders
    text: Lose a share of ownership and future dividends when new shares are issued, and may oppose retaining profit if they want dividends now.
  - group: Banks and other lenders
    text: Want to be repaid with interest, so they look for profit, cash flow and collateral, and may attach conditions to a loan. Their caution decides which businesses can borrow at all.
  - group: Suppliers
    text: Effectively lend to their customers when they give trade credit, so they carry the risk of not being paid. They watch a customer's liquidity and may shorten credit terms if it weakens.
  - group: Employees
    text: Gain security from a business that is financed soundly, but heavy borrowing makes jobs depend on meeting repayments, and an investor seeking a quick profit may push for cost cuts.
  - group: Investors, angels and backers
    text: Want a return that matches their risk, a say in decisions in proportion to their stake, and honest information. Crowd backers who were promised a product expect it to arrive.
evaluation:
  - There is no best source in general. The right choice depends on the purpose and how long the money is needed, the amount, the cost, the effect on control, the risk, the legal form and what lenders and investors will offer the business in the case.
  - Cost is wider than interest. Equity costs dividends and a share of every future profit; retained profit has an opportunity cost; trade credit can cost the discount; crowdfunding costs fees and rewards; an angel's stake may cost the founders control of their own company.
  - Debt and equity trade risk against control. Borrowing keeps ownership but adds payments that must be met in bad years; issuing shares spreads the risk but dilutes control. HL students measure the balance with the gearing ratio.
  - The matching principle is a strong guide but not a rule. Many businesses keep a permanent overdraft, and young businesses use whatever finance they can get. Breaking the principle is a risk to be judged, not an automatic error.
  - Access is unequal. Small and new businesses, and entrepreneurs in poor communities, often cannot borrow from banks, which is why crowdfunding, angels and microfinance matter, each with its own costs and risks. The teacher support material's question on whether crowdfunding is sustainable (p. 11) is a good test of that judgement.
  - In an examination, match the source to the purpose and the time span, apply it to the business's legal form and position, and weigh at least one argument for and one against each option before recommending (pp. 56 and 60 of the teacher support material).
decision:
  title: Financing Saltmarsh's second brewery
  fictional: true
  brief: |
    Saltmarsh Brewing must raise $500,000 for its second brewery and taproom: $350,000 for equipment and fit-out and $150,000 for working capital and launch. It made $95,000 profit after tax last year, has $120,000 of retained profit available, owes $60,000 on an old loan and owns its first site. The founders, who each own half the company, have three packages to choose from.
  options:
    - label: Borrow, using retained profit
      text: A bank loan of $380,000 over eight years at 7%, secured on the first site, repaying $47,500 of the sum borrowed each year, plus the $120,000 of retained profit. The founders keep 100% of the company.
    - label: Bring in a business angel
      text: The retired hotelier invests $350,000 for 35% of the shares and a seat on the board, plus the $120,000 of retained profit and a $30,000 overdraft facility for working capital. No repayments or interest on the angel's money.
    - label: Lease the equipment
      text: Lease the brewing equipment and fit-out at $5,800 a month for seven years, and fund the $150,000 of working capital with the retained profit and a $30,000 overdraft facility. No new owners and no large loan.
  guidance: |
    Start by matching each package to the two parts of the need. All three use retained profit, which fits the launch costs well, and only option C leans on an overdraft for part of a need that may last longer than a season.

    **Option A** keeps control but adds the most risk. In the first year the business would pay $47,500 of the loan plus interest of $380,000 × 7% = $26,600, a total of $74,100, about 78% of last year's profit after tax, on top of the $60,000 it still owes. Over eight years the interest would total $119,700. If the taproom is slow to fill, the repayments still fall due, and the first site, pledged as security, is at risk: the very bet the founders want to avoid.

    **Option B** carries no repayments, so it is the safest for cash flow, and the hotelier brings hospitality expertise the founders lack. But $350,000 for 35% values the company at $1 million, and the founders would each fall from 50% to 32.5%, giving up 35% of every future profit and, with a board seat, part of their control. They should ask what the angel expects in return and when he will want to sell.

    **Option C** keeps ownership and puts no property at risk. The lease costs $69,600 a year, close to option A's first-year payment, and $487,200 over seven years, $137,200 more than the equipment's price, and the brewery owns nothing at the end. Using part of a $30,000 overdraft for launch costs stretches the matching principle.

    A strong judgement weighs control, risk and cost against the founders' priorities and their confidence in the taproom. If they are confident of quick success, A is cheapest in the long run; if they want to protect the first site and their cash, B or C. A mixed package is worth considering, such as a smaller loan with leased equipment. Say what would change your mind: the angel's terms and exit plans, the bank's willingness to lend without the first site as security, or evidence of how quickly the taproom will make money.
exam:
  - q: Define the term *trade credit*.
    marks: 2
    command: define
    level: SL/HL
    paper: '1'
    answer: |
      A strong response gives a precise definition: an arrangement in which a supplier allows a business to pay for goods or services some time after receiving them, for example 30 or 60 days later, usually without charging interest.

      - The key features are the delay between receiving goods and paying for them, and that the supplier provides the finance.
      - "Buying on credit" alone is too vague to earn full marks.
  - q: Saltmarsh Brewing, a fictional privately held company, has $120,000 of retained profit available (see the situation above). Explain **two** advantages for Saltmarsh of using retained profit to finance part of its expansion.
    marks: 4
    command: explain
    level: SL/HL
    paper: '1'
    answer: |
      A strong response gives two distinct advantages, each explained and applied to Saltmarsh. For example:

      - **No interest or repayments:** unlike a bank loan, retained profit adds no fixed payments, which matters because Saltmarsh still owes $60,000 on an old loan and the taproom's early trading is uncertain.
      - **No loss of control:** unlike the angel's offer, it brings no new shareholders, so Theo and Priya keep their 50% stakes and full control.
      - Other valid points include speed and no need to offer the first site as security.

      A strong answer may note a limit: $120,000 covers less than a quarter of the $500,000 needed, so retained profit can only be part of the package.
  - q: |
      Larkspur Interiors, a fictional furniture retailer, has an overdraft at an interest rate of 12% a year. A supplier sends an invoice for $50,000, payable in 30 days, and offers a 2% discount if it is paid within 10 days.

      Comment on whether Larkspur should take the discount by paying early from its overdraft.
    marks: 4
    command: comment
    level: SL/HL
    paper: '2'
    answer: |
      A strong response works out the figures, then judges them.

      - **The discount:** 2% × $50,000 = $1,000, so paying early costs $49,000.
      - **The cost of paying early:** borrowing $49,000 on the overdraft for 20 days costs about 49,000 × 12% × 20 ÷ 365 = **$322**.
      - **Net effect:** taking the discount saves about $1,000 − $322 = **$678**.
      - **Judgement:** Larkspur should take the discount, as long as the overdraft limit has room and the extra borrowing does not leave it short for other payments. Giving up the discount is in effect borrowing at about 37% a year, far dearer than the overdraft.
  - q: Distinguish between share capital and loan capital as sources of finance.
    marks: 4
    command: distinguish
    level: SL/HL
    paper: '1'
    answer: |
      A strong response makes the differences clear on more than one dimension.

      - **Ownership and control:** share capital gives investors a share of ownership and votes, diluting existing owners; loan capital gives the lender no ownership, so control is unchanged.
      - **Repayment and cost:** share capital is never repaid and dividends are not compulsory; loan capital must be repaid with interest on fixed dates whatever the business's results.
      - **Availability and security:** only companies can issue shares; loans are available to any business that can satisfy the lender, who usually wants collateral.
  - q: Amara, a fictional dressmaker in a rural area of a low-income country, wants $300 to buy a second sewing machine and hire an apprentice. She has no property and no credit history. Explain **two** reasons why a microfinance provider may suit her better than a commercial bank.
    marks: 4
    command: explain
    level: SL/HL
    paper: '1'
    answer: |
      A strong response gives two reasons, each explained and applied to Amara. For example:

      - **No collateral or credit history needed:** a bank would usually refuse a loan without security or a record of borrowing, while microfinance providers lend to people in Amara's position, sometimes through groups whose members guarantee one another.
      - **Loans of the right size:** $300 is too small for most banks to arrange profitably, but it is the kind of loan microfinance exists to provide, often with training and support.
      - A strong answer notes a limit, for example that interest may be high relative to the sum and repayments frequent, so Amara must be confident that the second machine will earn enough to repay the loan.
  - q: |
      ClearCurrent, a fictional start-up, has designed a reusable water bottle with a built-in filter and needs $80,000 to begin production. Its founders are choosing between two options.

      - A reward-based crowdfunding campaign that pre-sells bottles at $40 each. The platform and payment fees total 8% of the money raised, and each bottle costs $14 to make and post.
      - A business angel who offers $80,000 for 25% of the company and a seat on its board.

      Discuss which option ClearCurrent should choose.
    marks: 10
    command: discuss
    level: SL/HL
    paper: '2'
    answer: |
      A strong response weighs both options, applies them to ClearCurrent and reaches a supported conclusion. One way to organize it:

      - **Crowdfunding, for:** no loss of ownership or control; it tests demand before production and builds a base of customers and publicity, valuable for a new consumer product.
      - **Crowdfunding, against:** each backer nets only $40 × 92% − $14 = $22.80, so raising $80,000 for production needs about 3,509 backers and $140,360 of pledges; a public failure would damage the brand; the design may be copied once it is shown.
      - **The angel, for:** the $80,000 arrives in one sum with no repayments, and an experienced investor may bring manufacturing and retail contacts.
      - **The angel, against:** the founders give up 25% of the company, valuing it at $320,000, share every future profit and accept a voice on the board; the angel will expect to sell the stake at a profit in a few years.
      - **Conclusion:** for example, that crowdfunding suits ClearCurrent if the founders can reach a large audience and value control, because it proves demand at the same time; the angel suits them if speed and expertise matter more than ownership. A combination, such as a smaller campaign to prove demand followed by angel investment on better terms, is a strong original conclusion.
      - **Limits:** the case gives no evidence of likely demand, the angel's experience or what the founders most value.

      The teacher support material advises at least one argument for and one against each option when choosing between two, applied to the case, and a conclusion that does more than repeat them (pp. 56 and 60).
summary:
  - Businesses need finance to start up, for capital expenditure, for working capital and to grow; the purpose largely decides the source.
  - '**Internal sources** are personal funds (for sole traders), retained profit and the sale of assets: cheap, quick and without new owners, but limited in size.'
  - '**External sources** are share capital, loan capital, overdrafts, trade credit, crowdfunding, leasing, microfinance providers and business angels.'
  - '**Debt** (loans, overdrafts) must be repaid with interest but keeps control; **equity** (shares, angels, equity crowdfunding) need not be repaid but dilutes ownership.'
  - '**Short-term** sources, overdrafts and trade credit, finance working capital; **long-term** sources, share capital, loans, retained profit and leasing, finance assets and growth.'
  - The matching principle finances a need with a source that lasts about as long as the need; an overdraft for a machine or a long loan for stock is a mismatch.
  - Choosing also weighs cost, control, risk, amount, legal form, the business's position and the economy; most real decisions combine several sources.
  - Crowdfunding, business angels and microfinance reach businesses banks will not serve, each at a price in fees, ownership or interest.
  - At HL, the gearing ratio measures reliance on long-term borrowing, and so the risk of borrowing more.
connections:
  - code: '1.2'
    text: The legal form decides which sources are open; sole traders cannot sell shares, and in general only publicly held companies can sell them to the public.
  - code: '1.5'
    text: Growth needs finance, and the choice of source shapes who owns and controls the bigger business.
  - code: '3.1'
    text: Capital expenditure is usually matched with long-term sources, and revenue expenditure with revenue and short-term sources.
  - code: '3.4'
    text: Share capital and retained earnings appear in equity, and loans and overdrafts among the liabilities, on the statement of financial position.
  - code: '3.7'
    text: Overdrafts, trade credit, leasing and sale and leaseback are among the strategies for dealing with cash flow problems.
  - code: '3.6'
    text: At HL, the gearing ratio measures how far a business relies on long-term borrowing.

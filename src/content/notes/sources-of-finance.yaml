retrieval:
  - q: Name the three internal sources of finance in the guide.
    a: Personal funds (for sole traders), retained profit and the sale of assets.
  - q: Why does the guide count personal funds as internal only for sole traders?
    a: A sole trader and the business are the same legal person, so the owner's savings are the business's own money. A company is a separate legal person, so owners' money arrives as share capital, an external source.
  - q: What is retained profit, and what is its opportunity cost?
    a: Profit kept in the business after tax and dividends. Its opportunity cost is the dividends shareholders could have received, or the cash buffer it could have provided.
  - q: Give one advantage and one disadvantage of share capital.
    a: 'Advantage: it never has to be repaid and dividends are not compulsory. Disadvantage: it dilutes the ownership and control of existing owners.'
  - q: What is collateral?
    a: An asset, such as property, that a borrower pledges to a lender, who can take and sell it if the loan is not repaid.
  - q: Why is an overdraft unsuitable for buying a machine?
    a: It is short-term finance with high interest that the bank can withdraw at short notice, while the machine earns its cost back over several years.
  - q: An overdraft of $10,000 lasts 73 days at 10% a year. Roughly how much interest is charged?
    a: 10,000 × 10% × 73 ÷ 365 = $200.
  - q: When does trade credit stop being free?
    a: When the supplier offers a discount for early payment, because using the full credit period means giving up the discount.
  - q: Name four types of crowdfunding.
    a: Reward-based, equity-based, lending-based and donation-based.
  - q: What does a business angel usually offer besides money, and what does it ask in return?
    a: Advice, contacts and credibility; in return it takes a share of ownership and often a say in decisions, and usually expects to sell its stake within a few years.
  - q: Who do microfinance providers serve, and why?
    a: People on low incomes who cannot borrow from banks because they lack collateral or a credit history, lending them small sums, often with training and support.
  - q: What is the matching principle?
    a: Finance a need with a source that lasts about as long as the need, long-term sources for assets and growth and short-term sources for working capital.

retrieval:
  - q: Name the seven Ps of the marketing mix, and say which three matter especially for services.
    a: Product, price, promotion, place, people, processes and physical evidence. People, processes and physical evidence matter most when marketing a service.
  - q: How do profit and cash flow usually change over the product life cycle?
    a: Both are negative in development and introduction, because investment and launch costs come before sales. Profit and then cash flow turn positive during growth, are usually highest in maturity, when sales peak and the heavy investment has been made, and fall in decline.
  - q: Give three extension strategies and one limitation of extending a product's life.
    a: For example new markets, new uses, new versions or features, new packaging, price changes, and new promotion or channels. A limitation is that they only delay decline, and they use money that could fund new products.
  - q: Name the four boxes of the BCG matrix and link each to the product life cycle.
    a: Question marks (low share of a fast-growing market) are often new products in introduction; stars (high share of a fast-growing market) are usually in growth; cash cows (high share of a slow-growing market) are mature; dogs (low share of a slow-growing market) are often in decline. Cash from the cash cows funds the stars and the most promising question marks.
  - q: Name the four aspects of branding in the guide, and give two reasons why branding matters.
    a: Awareness, development, loyalty and value. Branding matters because, for example, it builds recognition and trust, supports higher prices, steadies sales through loyalty, and makes new products easier to launch.
  - q: Distinguish between penetration pricing and predatory pricing.
    a: Both use low prices. Penetration pricing aims to win customers and market share for a new product, and the price is usually raised later. Predatory pricing aims to drive rivals out of the market so that prices can then rise, and it is illegal in many countries.
  - q: A product costs $25 a unit. What is its cost-plus price with a 60% mark-up?
    a: $25 + ($25 × 60 ÷ 100) = $25 + $15 = $40.
  - q: 'HL only: a 10% price rise cuts quantity demanded by 20%. What is the PED, and what happens to total revenue?'
    a: PED = −20% ÷ 10% = −2. Ignoring the sign, 2 is greater than 1, so demand is price elastic and total revenue falls, by about 12% (1.10 × 0.80 = 0.88).
  - q: 'HL only: when is contribution pricing appropriate, and what is its main risk?'
    a: When the business has spare capacity, several products that share fixed costs, or a special order, since any price above the variable cost per unit adds to profit in the short run. The risk is that total contribution may not cover fixed costs in the long run, and regular customers may resent the lower price.
  - q: Distinguish between above, below and through the line promotion.
    a: Above the line uses paid mass media to reach a broad audience; below the line is aimed directly at chosen customers without mass media; through the line combines both in one integrated campaign.
  - q: Give two advantages and two limitations of social media marketing as a promotional strategy.
    a: Advantages include its low cost, precise targeting with data on results, two-way communication, and sharing that spreads the message. Limitations include criticism that spreads fast, the need for constant fresh content, platforms that control reach, and concerns about privacy and other ethical issues.
  - q: Why might a producer use a longer distribution channel rather than selling direct?
    a: Intermediaries bring reach, storage, breaking bulk, local knowledge and selling skill, so the product reaches more customers with less effort. The cost is a smaller margin and less control over how the product is sold.
  - q: Why do people, processes and physical evidence matter more for services than for goods?
    a: A service is intangible, produced and consumed at the same time, and variable in quality, so customers judge it by the staff who deliver it, how smoothly it is delivered, and the tangible cues they can see, such as the premises, uniforms and website.
  - q: What four tests can you use to judge whether a marketing mix is appropriate?
    a: It fits the target market and position; the Ps are consistent with each other; it fits the product's stage in the life cycle and whether it is a good or a service; and it fits the business's resources and objectives.

# Notes: 4.5 The seven Ps of the marketing mix. Written in the platform's own
# words from the guide's content statements (pp. 31 to 32), with the unit's
# tools (pp. 14, 30) and the formula list (pp. 64 to 65), which has no pricing
# formula and no price elasticity of demand. Definitions were checked against
# the TSM glossary (pp. 80 to 90) and the site's unit 4 glossary. The supplied
# coursebook extracts do not cover unit 4, so none was used. Dynamic,
# competitive and contribution pricing and price elasticity of demand are HL
# only and sit in one HL section. Every business named is fictional. The
# situation and decision continue the Brightfield example, the exam-style
# questions reuse Spinwise and add Hearthstone Bakery, and every figure in them
# was checked by script.
code: '4.5'
title: The seven Ps of the marketing mix
level: SL/HL with HL-only content
introduction: |
  The **marketing mix** is the set of decisions a business makes to bring a product to its target customers: what it sells, at what price, how it tells people about it and where they can buy it. For goods, those four Ps (product, price, promotion and place) do most of the work. Services add three more, people, processes and physical evidence, because a service cannot be seen or tested before it is bought and is usually delivered by people while the customer is there. The guide treats all seven as the marketing mix.

  The mix is how a business carries out its marketing plan ([4.2](/topics/marketing-planning/)): every P should fit the target market and the position the business has chosen, and every P should fit the others. These notes take the Ps in the guide's order, and end with the question that brings them together: which mix is appropriate for this product or business? Dynamic, competitive and contribution pricing and price elasticity of demand are HL only, and are marked HL.
objectives:
  - '**Analyse** how the product life cycle relates to the product portfolio and the marketing mix, and to investment, profit and cash flow.'
  - '**Evaluate** extension strategies for a product in maturity.'
  - '**Explain** brand awareness, development, loyalty and value, and why branding matters.'
  - '**Evaluate** the appropriateness of pricing methods, including, at HL, dynamic, competitive and contribution pricing and price elasticity of demand.'
  - '**Distinguish** between promotion above, below and through the line, and weigh up social media marketing as a promotional strategy.'
  - '**Recommend** an appropriate marketing mix for a product or business, including its distribution channels and, for a service, its people, processes and physical evidence.'
situation:
  title: A star stops growing
  fictional: true
  text: |
    Six years after its launch, the sparkling tea made by Brightfield, a fictional drinks maker, sells about $2 million a year and has become one of the business's biggest sources of cash. But sales have stopped growing. A supermarket chain has launched its own sparkling tea at a lower price, and younger drinkers are trying canned iced coffee instead, including Brightfield's own new one.

    The board is divided. The finance director wants to cut the tea's price to see off the supermarket. The brand manager wants new flavours, a smaller can and a campaign on social media. The managing director wonders whether the tea's best days are over, and whether its promotion budget would do more for the iced coffee.

    Every one of these choices touches several Ps at once, and the cash the tea earns pays for the products that will follow it.

    Where is the tea in its life cycle, what should Brightfield do with it, and how should the rest of its marketing mix change?
sections:
  - id: product-life-cycle
    title: 'Product: the product life cycle'
    kind: theory
    body: |
      The **product life cycle** is a model of the stages a product's sales pass through over time: development, introduction, growth, maturity and decline. Some versions add a saturation stage between maturity and decline, when the market is full and rivals fight over the same customers.

      The life cycle matters because investment, profit, cash flow and the marketing mix all change from stage to stage. Spending comes first: research, design, equipment, stock and launch promotion are paid for before the product earns much, so **cash flow is negative** through development and introduction, and the product usually makes a loss. As sales grow, revenue overtakes costs, and profit and then cash flow turn positive during growth. In maturity, sales peak while the heavy investment has already been made, so profit and cash flow are usually at their highest. In decline, both fall.

      Profit and cash flow are not the same thing (3.7). In growth, a product can be profitable while its cash flow is still weak, because the business is paying for extra capacity, stock and promotion, and some customers pay on credit.

      The points below show how the marketing mix typically changes at each stage. They describe patterns, not rules: nobody knows in advance how long a stage will last, and the business's own decisions change the curve.
    points:
      - term: Development
        text: No sales yet. Research, design, testing and preparing production make cash flow negative. The mix is being designed, including the product's features, a planned price, the launch promotion and the channels to use.
      - term: Introduction
        text: Sales are low and grow slowly, and launch costs usually mean a loss and negative cash flow. Promotion informs customers and builds awareness. The price is often either low, to win customers quickly (penetration pricing), or high, to signal quality (premium pricing). Distribution is limited at first.
      - term: Growth
        text: Sales rise quickly and rivals notice. Profit turns positive, and cash flow follows as revenue overtakes spending, though investment in capacity and promotion continues. Distribution widens, promotion shifts to persuading customers to prefer the brand, and new versions may be added.
      - term: Maturity
        text: Sales level off and peak as the market nears saturation, and competition is fierce. Profit and cash flow are usually at their highest, because the heavy investment has been made and less promotion is needed for each sale. Promotion reminds and reassures existing customers, prices come under pressure from rivals, and this is when extension strategies are usually considered.
      - term: Decline
        text: Sales and profit fall as tastes change or better products appear. The business cuts promotion and narrows the range, then decides whether to keep selling to loyal customers at low cost, to extend the product's life, or to withdraw it.
    diagram: product-life-cycle
    advantages:
      - Helps managers plan the marketing mix, investment and cash needs for each stage.
      - Shows why a business needs new products ready before its current ones decline.
      - Links marketing to finance, by explaining why new products use up cash and mature ones generate it.
    limitations:
      - The length and shape of each stage cannot be known in advance, so the model describes rather than predicts.
      - It is often hard to tell which stage a product is in until afterwards.
      - Treating a dip in sales as decline can make decline happen, if support is withdrawn too early.
      - It fits some products poorly, such as fads that rise and vanish within months, or staple foods that stay mature for decades.
    example:
      title: A drink's first five years
      fictional: true
      text: |
        Brightfield, a fictional drinks maker, spends $500,000 developing and launching a sparkling tea. In its first year, sales of $200,000 do not cover production and heavy launch promotion, so the tea makes a loss and cash flows out.

        In years two and three, sales rise to $900,000 and then $1.6 million. Profit turns positive in year two, but cash flow stays negative until year three, because Brightfield is paying for a second production line and building stock for new retailers. By year five, sales have levelled off at about $2 million and promotion only needs to remind customers, so the tea produces more cash than in any earlier year. Only now has it paid back the spending on its development and launch, and its cash starts to fund Brightfield's next product.
  - id: extension-strategies
    title: 'Product: extension strategies'
    kind: method
    body: |
      An **extension strategy** is an action that lengthens a product's life cycle by renewing its sales, usually in maturity, before decline sets in. The life cycle diagram shows the idea as a second curve rising out of maturity.

      Extension strategies are attractive because the product already exists, customers already know it, and its development has been paid for. Extending a successful product is usually cheaper and less risky than launching a new one, and it keeps a profitable product earning the cash that funds new ones. The danger is spending money to delay the inevitable: if the product is genuinely outdated, the extra sales may not cover the cost, and the money could have done more for a replacement.

      The guide sets extension strategies at AO3, so an answer should judge which strategy fits the product and its customers, and whether extending is better than replacing the product or withdrawing it. Timing matters too: an extension works best while the product is still in maturity, not after its customers have drifted away.
    points:
      - term: New markets
        text: Selling the product to new segments or in new countries, which is market development in the [Ansoff matrix](/glossary/ansoff-matrix/). The product already exists, but the business needs research and may have to adapt the mix for its new customers.
      - term: New uses
        text: Finding and promoting new ways to use the product, so that existing customers buy more and new customers start.
      - term: New versions or features
        text: Updating the product, or adding features, sizes or flavours, so that it feels new. It costs more than most other strategies but can renew interest strongly.
      - term: New packaging or design
        text: A fresh look or more convenient packs, such as smaller or larger sizes, refills or multipacks. It is relatively cheap, but a purely cosmetic change may not convince customers for long.
      - term: Price changes
        text: Cutting the price, or offering better value, to attract customers who are sensitive to price. It is quick to do, but it cuts margins and can cheapen the brand.
      - term: New promotion or channels
        text: A new campaign aimed at a different segment, or selling through new channels such as online marketplaces or different retailers.
    advantages:
      - Cheaper and less risky than developing a new product, because the product and its brand already exist.
      - Keeps a profitable product, often a cash cow, earning the cash that funds new products.
      - Keeps the loyal customers who still want the product, and protects the brand.
    limitations:
      - 'Only delays decline: no extension strategy works for ever.'
      - Uses money and managers' time that could go to new products.
      - Can fail if the product is outdated or the change is only cosmetic.
      - Repeated relaunches and price cuts can damage a premium brand's image.
    example:
      title: More life for an old favourite
      fictional: true
      text: |
        Millbrook, a fictional biscuit maker, sees sales of its classic ginger biscuit level off after twenty years. It tries three extension strategies: lunchbox snack packs aimed at parents (new packaging and a new segment), a ginger and dark chocolate version (a new version), and exports to a neighbouring country where ginger biscuits are little known (a new market).

        The snack packs and the export sales lift total sales for several years; the chocolate version adds little and is withdrawn after a year. The biscuit is still in maturity, but Millbrook knows the extension will not last for ever, and it has started developing a replacement.
  - id: product-portfolio
    title: 'Product: the product portfolio'
    kind: framework
    body: |
      A business's **product portfolio** is the full set of products it sells. The products in a portfolio are usually at different stages of their life cycles, and that is the point: mature products earn the cash that pays for new ones, and new products are ready to take over when older ones decline. A portfolio with every product at the same stage is risky, whether they are all new and using up cash, or all mature with nothing ready to replace them.

      The **Boston Consulting Group (BCG) matrix**, a toolkit tool, analyses a portfolio on two measures: the growth rate of each product's market, and the product's market share relative to that of its largest rival (4.1). Its four boxes follow the life cycle closely. Question marks are often new products in the introduction stage, and stars are usually in growth, both in fast-growing markets; cash cows are mature products in slow-growing markets; dogs are often in decline.

      Each box calls for a different marketing mix, which completes the link between the life cycle, the portfolio and the mix. The business uses the cash from its cash cows to back its stars and its most promising question marks.
    points:
      - term: Stars
        text: A high share of a fast-growing market. They earn a lot but need heavy promotion and investment in capacity to keep their lead, so they may produce little spare cash. The mix stresses strong promotion, wide distribution and new versions to stay ahead.
      - term: Question marks
        text: A low share of a fast-growing market. They need cash to build share, and their future is uncertain. Those the business backs get heavy promotion, wider distribution and perhaps a low price to win customers; the rest are withdrawn.
      - term: Cash cows
        text: A high share of a slow-growing, mature market. They generate more cash than they need. The mix holds the position at low cost, with reminder promotion, prices that keep loyal customers, and extension strategies to keep them earning.
      - term: Dogs
        text: A low share of a slow-growing market. They usually earn little, so promotion and investment are cut to a minimum, and they are often withdrawn or sold, unless they still make a contribution, complete a range or keep customers buying other products.
    diagram: bcg-matrix
    advantages:
      - Shows whether the portfolio is balanced, with enough cash cows to fund the products of the future.
      - Guides how a limited marketing budget should be shared between products.
      - Simple to construct from market share and market growth data.
    limitations:
      - It uses only two measures, and a high market share does not guarantee profit.
      - Defining the market is a judgement, and a different definition can move a product into another box.
      - 'It is a snapshot, not a forecast: it does not say what will happen next.'
      - The labels can mislead, because a dog may still be profitable or support the sales of other products.
    example:
      title: A drinks portfolio
      fictional: true
      text: |
        Three years after launching its sparkling tea, Brightfield reviews its portfolio. Its long-established lemonade leads a mature market: a cash cow. The tea now has the largest share of a fast-growing market: a star. A new canned iced coffee has a small share of another fast-growing market: a question mark. A blackcurrant cordial sells a little in a shrinking market: a dog.

        Brightfield cuts the cordial's promotion to almost nothing, keeps the lemonade on reminder advertising, and spends most of its marketing budget on the tea and on a trial of the iced coffee in two cities, paid for largely by the lemonade's cash. If the iced coffee has not gained share within a year, it will be withdrawn.
  - id: branding
    title: 'Product: branding'
    kind: concept
    body: |
      A **brand** is a name, symbol, design or other feature that identifies a business's products and sets them apart from rivals', together with everything customers associate with it. The guide names four aspects of branding, shown in the diagram as steps that build on each other: awareness, development, loyalty and value.

      Branding matters because a strong brand works for the business in several ways at once. It makes the product easy to recognize on a crowded shelf or screen. It reassures customers about quality, which matters most when they cannot judge a product before buying it. It builds loyalty, which makes sales steadier and promotion cheaper per sale. It lets the business charge more than for an unbranded equivalent, and it makes new products easier to launch under a name customers already trust.

      The other side is cost and fragility. A brand takes years of consistent marketing to build and can be damaged in days by a faulty product, poor service or an ethical scandal, which is one reason the guide's conceptual understandings link ethical marketing with a stronger brand image.
    points:
      - term: Brand awareness
        text: How far customers in the target market recognize the brand, can recall it and know what it offers. It is the first step, because customers rarely buy a brand they have never heard of. It is built through promotion, distribution and word of mouth, and measured by asking customers which brands they know.
      - term: Brand development
        text: Building the brand's identity, values and reputation over time, through consistent design and messages and by keeping the brand's promises. It can include brand extension, putting a trusted name on new products, which works only if the new product fits what the brand stands for.
      - term: Brand loyalty
        text: Customers' tendency to keep buying the brand rather than switching, even when rivals are cheaper or easier to find. Loyal customers bring repeat sales and recommendations, and they are less sensitive to price.
      - term: Brand value
        text: What the brand is worth to its owner, from the extra sales and higher prices it brings compared with an unbranded product. A brand a business builds itself does not appear on its balance sheet, but when one business buys another, part of the price it pays can be recorded as an [intangible asset](/glossary/intangible-asset/) (3.4).
    diagram: brand-development
    advantages:
      - Customers recognize and find the product quickly.
      - A known brand reduces the risk customers feel, especially with services and expensive products.
      - Loyal customers accept higher prices, which raises margins.
      - New products carry the brand's reputation from their first day.
    limitations:
      - Building awareness and loyalty takes years and large promotion budgets.
      - One scandal or product failure can damage the brand and every product that carries it.
      - Stretching a brand over too many products can confuse customers and weaken it.
      - When incomes fall, many customers switch to cheaper own-label and unbranded products.
    example:
      title: A bicycle light becomes a brand
      fictional: true
      text: |
        Glowline, a fictional maker of bicycle lights, starts with no awareness at all. It builds awareness by lending lights to cycling clubs and posting videos of night rides online. It develops the brand by using the same orange logo everywhere and by keeping one clear promise, a free repair for any Glowline light for five years.

        Riders who have had a light repaired stay loyal and recommend the brand to friends. Within five years Glowline can charge about a third more than unbranded lights of similar quality, and that premium is its brand value at work.
  - id: pricing-methods
    title: 'Price: cost-plus, penetration, loss leader, predatory and premium pricing'
    kind: types
    body: |
      Price is the only P that brings in revenue; the others cost money. Price also sends a message: a low price can suggest good value or poor quality, and a high price can suggest high quality or poor value. The guide asks you to judge how **appropriate** each pricing method is (AO3), which depends on the business's costs and objectives, the product's position, how sensitive customers are to price, and what competitors charge.

      The five methods below are for SL and HL. They differ in what drives the price: cost (cost-plus pricing), the aim of winning customers or market share (penetration pricing and the loss leader), the aim of removing rivals (predatory pricing), or the image the business wants (premium pricing). A business may use different methods for different products, or for one product at different stages of its life cycle.

      You may meet **price skimming** in textbooks: launching a new product at a high price and lowering it in stages. It is not on the 2024 guide's list of pricing methods. Premium pricing is the closest method the guide names, and it differs because the high price is kept to signal lasting quality, not cut once the keenest buyers have paid it.
    points:
      - term: Cost-plus (mark-up) pricing
        text: Adds a mark-up, a percentage or a fixed amount, to the cost of each unit. It is simple, makes sure each sale covers its cost and is easy to justify, which suits retailers with many products and businesses quoting for one-off jobs. It ignores demand and rivals' prices, so the price may be too high to sell or lower than customers would happily pay, and it needs an accurate unit cost, which changes with output.
      - term: Penetration pricing
        text: A low price when a product enters a market, to win customers and market share quickly, usually raised later. It suits mass markets where customers are sensitive to price and high volumes bring economies of scale. Profit is thin at first, customers may resist later rises, and rivals may cut their own prices in reply.
      - term: Loss leader
        text: Selling a product below cost to attract customers who will also buy other, profitable products. It suits retailers with a wide range, and products that need profitable extras, such as cheap printers and expensive ink. It loses money unless customers buy enough else, it can cheapen the brand, and some countries restrict selling below cost.
      - term: Predatory pricing
        text: Setting prices so low, often below cost, that rivals cannot compete and leave the market, so that prices can rise once they have gone. It needs large financial reserves, is illegal in many countries because it destroys competition, and is widely seen as unethical. Its aim, removing rivals, is what separates it from penetration pricing.
      - term: Premium pricing
        text: Setting a price deliberately higher than rivals' to signal quality, exclusivity or status. It suits strong brands with a clear USP, luxury goods and niche markets, and it brings high margins per unit. Sales volumes are lower, and quality, service and promotion must justify the price, or customers will stop paying it.
    formulas:
      - name: Cost-plus price
        expression: Price = unit cost + (unit cost × mark-up % ÷ 100)
        note: The unit cost should include a share of indirect costs as well as the direct costs. The guide's formula list has no pricing formulas, so this is the standard working.
    example:
      title: Pricing a new fitness tracker
      fictional: true
      text: |
        Pulsewear, a fictional electronics firm, is launching a fitness tracker that costs $40 a unit to make and sell. Cost-plus pricing with a 50% mark-up gives $40 + ($40 × 50 ÷ 100) = $60. Two rival trackers sell for $55 and $70.

        Penetration pricing at $45 would win customers quickly in a fast-growing market, but would leave only $5 a unit until the price could rise, and buyers might resent the rise. Premium pricing at $90 would need a feature rivals lack and a brand customers trust; Pulsewear is new and has neither. A launch price near $60, with a clear reason to choose the tracker, looks the most appropriate here, but the answer depends on what Pulsewear wants most: market share or early profit.
  - id: hl-pricing
    title: 'Price at HL: dynamic, competitive and contribution pricing, and PED'
    kind: types
    level: HL
    body: |
      HL students judge three more pricing methods, and use **price elasticity of demand** (PED) as evidence for pricing decisions.

      PED measures how much the quantity demanded responds to a change in price. It is usually negative, because a higher price means fewer sales, so it is often quoted without the minus sign. Demand is **price elastic** when the value, ignoring the sign, is greater than 1: quantity changes by a larger percentage than price, so a price cut raises total revenue and a price rise lowers it. Demand is **price inelastic** when the value is less than 1: quantity changes by a smaller percentage than price, so a price rise raises total revenue. At exactly 1, revenue stays about the same.

      Demand tends to be inelastic for necessities, habits and products with few close substitutes, including strong brands with loyal customers. It tends to be elastic where there are many close substitutes, where the product takes a large share of customers' income, and over longer periods, as customers find alternatives. This is why a strong brand and differentiation (4.2) matter for pricing: they make demand less elastic.

      Revenue is not profit. A price cut that raises revenue also means making and selling more units, so whether profit rises depends on costs.
    points:
      - term: Dynamic pricing
        text: Changing prices frequently, often automatically, as demand, the time, stock levels or rivals' prices change, so that prices are higher at busy times and lower at quiet ones. It suits businesses whose capacity is fixed and cannot be stored, such as seats, rooms and rides, and that have software to track demand. Customers can see it as unfair, especially when prices jump during an emergency, and it needs good data and systems.
      - term: Competitive pricing
        text: Setting prices mainly by reference to rivals' prices for similar products, at, just below or just above them. It suits markets where products are similar and customers compare prices easily, so no business can stray far from the going rate. It is simple and reduces the risk of a price war, but it ignores the business's own costs, so the price may not be profitable, and it leaves the business following the market leader.
      - term: Contribution pricing
        text: Setting a price above the variable cost per unit, so that each sale contributes towards fixed costs and then profit. It suits a business with spare capacity, several products that share fixed costs, or a special order at a lower price than usual. A hotel with empty rooms and a variable cost of $30 a guest-night can accept a tour group at $50 a night, because each room then contributes $20 to fixed costs it must pay anyway. In the long run, total contribution must cover all fixed costs, and low prices for some customers can upset those paying more.
      - term: Price elasticity of demand
        text: Not a pricing method but evidence for choosing one. Elastic demand makes price cuts and low-price methods such as penetration pricing more effective, while inelastic demand allows premium pricing and price rises. Estimates come from past sales and market research, and they change as rivals, incomes and tastes change.
    formulas:
      - name: Contribution per unit
        expression: Contribution per unit = price − variable cost per unit
        note: Any price above the variable cost per unit gives a positive contribution, which goes first towards fixed costs and then to profit. The [Finance Desk](/finance-desk/contribution/) judges a special order on contribution.
      - name: Price elasticity of demand (PED)
        expression: PED = percentage change in quantity demanded ÷ percentage change in price
        note: The guide's formula list does not include PED, so this is the standard form, as in the glossary entry. Each percentage change is (new value − old value) ÷ old value × 100. Read the result without its minus sign, so that above 1 is elastic and below 1 is inelastic.
    example:
      title: One ferry, two elasticities
      fictional: true
      text: |
        Gullwing Ferries, a fictional operator, raises its weekday fare from $20 to $22, a rise of 10%. Weekday passengers fall from 4,000 to 3,800 a week, a fall of 5%. PED = −5% ÷ 10% = −0.5, so weekday demand is inelastic, and weekly revenue rises from $80,000 to $83,600.

        At weekends, when a coach service runs on the same route, the same 10% rise cuts passengers by 15%. PED = −15% ÷ 10% = −1.5, so weekend demand is elastic, and the rise lowers revenue. One product can have different elasticities at different times, which is one reason for dynamic pricing: Gullwing now sets fares by day and time, higher when demand is inelastic and lower when it is elastic.
  - id: promotion-lines
    title: 'Promotion: above, below and through the line'
    kind: types
    body: |
      Promotion is how a business communicates with its customers: to **inform** them that a product exists, to **persuade** them to choose it, and to **remind** them to keep buying it. The guide groups promotion by a line between mass media and targeted methods, as the diagram shows.

      The categories describe the audience a method reaches. A method is above the line when it reaches a broad, mass audience that the business cannot select, below the line when it is aimed at chosen customers or segments, and through the line when a campaign deliberately combines both. Digital media blur the boundary, since an online advert can be shown to everyone or only to a narrow segment, so classify a method by how it is used in the case.

      The right promotional mix depends on the target market, the product and its stage in the life cycle, the budget and what rivals do. Mass-market launches lean on above the line methods to build awareness fast; niche businesses and small budgets lean on below the line methods.
    points:
      - term: Above the line
        text: Paid promotion through mass media, such as television, radio, cinema, newspapers, magazines and billboards. It builds awareness quickly across a whole market and suits mass-market products and big launches. It is expensive, hard to aim at one segment, and its effect on sales is difficult to measure.
      - term: Below the line
        text: Promotion aimed directly at chosen customers without mass media, such as sales promotions (discounts, free samples, loyalty rewards), direct mail and email, public relations, sponsorship, personal selling and in-store displays. It is usually cheaper per customer and easier to target and measure, which suits niche markets and small businesses. It reaches fewer people, and frequent discounts can cut margins and cheapen a brand.
      - term: Through the line
        text: One integrated campaign that uses both, with one consistent message, so that mass media build awareness and targeted methods turn it into sales. It gets the most from each method, with social media often bridging the two, but it needs careful coordination and a larger budget.
    diagram: promotion-lines
    example:
      title: One launch, three lines
      fictional: true
      text: |
        Voltway, a fictional maker of electric scooters, launches a new model. Cinema adverts and billboards build awareness across the country (above the line). Owners of its older model receive an email offering a trade-in discount, and test rides are held at universities (below the line).

        Every advert carries a code that unlocks a free helmet online, so Voltway can see which adverts led to sales. Together the parts make a through the line campaign, each supporting the others.
  - id: social-media-marketing
    title: 'Promotion: social media marketing'
    kind: evaluation
    body: |
      **Social media marketing** uses social media platforms to promote a business and its products. As a promotional strategy it combines several methods: the business's own posts and videos, paid adverts shown to chosen audiences, influencers who recommend the product to their followers, and conversations with customers in comments and messages.

      It is a clear case of the guide's conceptual understanding that social, cultural and technological change alters the language and medium of marketing. Social media are cheap enough for a one-person business and precise enough for a multinational, but they also change the relationship with customers, who can now answer back in public.

      The guide sets this statement at AO3, so judge social media marketing as a strategy for the business in the case: whether its target market spends time on the platforms, whether the product suits the medium, and whether the business can keep producing content worth watching.
    points:
      - term: Owned content
        text: Posts, videos and stories on the business's own accounts. They are cheap to produce, but how many people see them depends on each platform's rules.
      - term: Paid social adverts
        text: Adverts shown to people chosen by age, location, interests or behaviour, with detailed data on who sees, clicks and buys.
      - term: Influencer marketing
        text: Paying or partnering with people whose followers trust them. It reaches the right segment through a credible voice, but results are hard to predict, an influencer's behaviour can damage the brand, and sponsored posts should be clearly labelled as advertising so that followers are not misled.
      - term: Engaging with customers
        text: Replying to comments, sharing customers' posts and handling complaints in public. It builds relationships and loyalty, but a complaint handled badly is seen by everyone.
    advantages:
      - Costs far less than mass media, so it suits small businesses and niche markets.
      - Reaches chosen segments precisely, with detailed data on results.
      - Two-way communication builds relationships and gives instant feedback.
      - Content that customers share spreads the message further at no extra cost.
    limitations:
      - Criticism and mistakes spread as fast as praise, and can damage a brand within hours.
      - It needs a constant flow of fresh content and someone skilled to manage it.
      - Platforms decide who sees each post and can change their rules, so reach is never guaranteed.
      - It raises ethical concerns about personal data, hidden advertising and marketing to children.
      - Not every target market uses social media heavily, and attention there is short.
    example:
      title: A plant shop on camera
      fictional: true
      text: |
        Leafline, a fictional online plant shop, posts short videos on caring for houseplants, answers every question in the comments and pays to show its adverts to people nearby who follow gardening accounts. Sales triple in a year, at a fraction of the cost of local radio advertising.

        Then a video of a plant arriving damaged spreads widely. Leafline's quick public apology and free replacement win back most of its critics, but handling it takes the owner two full days. The strategy works because Leafline's customers use social media and plants make good videos; it would do far less for a firm that sells industrial boilers to a few factory managers, where personal selling matters more.
  - id: distribution-channels
    title: 'Place: distribution channels'
    kind: types
    body: |
      Place is about getting the product to customers where and when they want it. A **distribution channel** is the route a product takes from the producer to the final customer, including any **intermediaries**: agents, wholesalers and retailers. The diagram shows the main types, from selling direct to chains of intermediaries.

      Each intermediary takes a share of the final price and some control over how the product is sold, but it adds something in return: reach, storage, breaking bulk into smaller quantities, local knowledge or selling skill. The choice is a trade-off between **control and margin**, which favour short channels, and **reach and convenience**, which favour longer ones. Many businesses use several channels at once, such as their own website alongside retailers.

      The guide asks for the **importance** of different types of channel (AO3). The channel can decide whether a product reaches its target market at all, it shapes the product's image, and it affects costs and so the price. A luxury brand sold in discount stores loses its premium; a snack sold only online misses the shoppers who buy on impulse. The right channel depends on:

      - the product: perishable, technical, customized or expensive products suit short channels;
      - the customers: many customers spread over a wide area need intermediaries to reach them;
      - the image: premium brands choose a few carefully selected outlets;
      - cost and control: each intermediary's margin, set against the cost of doing its job yourself;
      - what customers expect and rivals offer, such as next-day delivery.
    points:
      - term: Direct
        text: Producer to consumer, through the business's own website, app, shops or sales staff. It gives full control of the mix, the customer data and the margin, but the producer does all the work of storing, selling and delivering. E-commerce has made this possible for many small producers.
      - term: One intermediary
        text: Producer to retailer to consumer. Retailers give visibility, convenience, advice and after-sales service close to customers, and large retailers buy in bulk. They take a margin and can have strong bargaining power over producers.
      - term: Two intermediaries
        text: Producer to wholesaler to retailer to consumer. The wholesaler buys in bulk and supplies many small retailers, saving the producer from dealing with each one. It suits everyday goods sold through many small shops, though the extra stage raises the final price or cuts the producer's margin.
      - term: Through an agent
        text: An agent arranges sales for a commission without owning the goods, often in a distant or foreign market where it has local knowledge and contacts. It is cheaper than setting up there, but the producer depends on the agent's effort and honesty.
    diagram: distribution-channels
    example:
      title: Four channels for one chilli sauce
      fictional: true
      text: |
        Redcliff, a fictional maker of chilli sauces, sells through several channels at once. Its own website (direct) earns the highest margin and gives it customer data, but every order must be packed and posted. Delicatessens in nearby cities (one intermediary) display the sauces to food lovers who would never find the website. A wholesaler supplies hundreds of small grocery shops (two intermediaries), selling far more bottles at a much lower margin per bottle.

        When Redcliff begins to export, it appoints an agent in its first foreign market, paid by commission, rather than opening an office of its own. Each channel reaches different customers at a different cost, so the question is never which channel is best, but which combination of channels fits the target market.
  - id: service-ps
    title: People, processes and physical evidence
    kind: concept
    body: |
      Services differ from goods in ways that make three more Ps necessary. A service is **intangible**, so customers cannot see or test it before they buy. It is usually produced and consumed **at the same time**, often with the customer present, so the people delivering it are part of the product. It is **variable**: the same haircut or hotel stay can be excellent one day and poor the next. And it **cannot be stored**: a hotel room left empty tonight is revenue lost for good.

      People, processes and physical evidence are how a service business manages these problems, and they are often what customers really compare. Two hotels with similar rooms and prices compete on their staff, on how easy they are to book and check in to, and on how the place looks and feels. The guide sets all three at AO3, so judge their importance for the particular service in the case.
    points:
      - term: People
        text: The employees who deal with customers, and the relationships they build with them. Their skills, product knowledge, attitude and appearance shape the customer's experience, so recruitment, training and motivation (unit 2) become marketing decisions. A good relationship wins repeat custom and recommendations; one rude employee can lose a customer for good.
      - term: How relationships vary between cultures
        text: What customers expect from staff differs between cultures, including how formal or friendly staff should be, whether service should feel personal or simply efficient, how directly problems are raised, how much small talk is welcome, and whether tipping is expected. A business operating in several countries may adapt how its staff behave while keeping the standards that define its brand.
      - term: Processes
        text: The procedures through which a service is delivered, from finding and booking it to paying, receiving it and any follow-up. Fast, reliable and convenient processes raise satisfaction and can become a USP; delays and errors drive customers away.
      - term: Changes in processes
        text: Online booking, apps, self-service, contactless payment, automated reminders and chatbots cut costs and waiting times, and many customers prefer them. They can also lose the personal contact some customers value, exclude people less comfortable with technology, and cause new problems when systems fail.
      - term: Physical evidence
        text: The tangible things that show what an intangible service is like, such as the premises and their cleanliness, decor, uniforms, the website, brochures, tickets, receipts and packaging. Good physical evidence reassures customers before they buy, justifies the price and supports the brand's position; a shabby waiting room or a confusing website can lose a sale before the service begins.
      - term: "Hofstede's cultural dimensions (toolkit)"
        level: HL
        text: An HL toolkit tool for comparing national cultures, for example on power distance and individualism. It can help explain why customers in one country expect formality and deference from staff while customers in another expect a relaxed, personal manner. It describes national averages, not individual customers.
    example:
      title: One hotel brand, two countries
      fictional: true
      text: |
        Wren Hotels, a fictional chain, runs hotels in two countries. In one, guests expect to be called by their family names and served by staff in formal uniforms who never sit down while serving them; in the other, guests prefer first names and a relaxed chat at check-in. Wren trains its staff differently in each country.

        Its processes are the same everywhere: online check-in, a room key on the guest's phone, and any problem solved by the first employee the guest speaks to. So is its physical evidence: quiet lobbies in the chain's wood-and-linen style, which signal calm and quality before a guest has slept a night.
  - id: appropriate-marketing-mix
    title: Choosing an appropriate marketing mix
    kind: application
    body: |
      No marketing mix is right in general. The guide asks you to judge which mix is **appropriate** for a particular product or business (AO3), and the diagram puts the target customer at the centre for that reason: every P should be chosen for the customers the business has targeted and the position it wants (4.2).

      A useful way to judge a mix, and a method rather than a list from the guide, is to apply four tests:

      1. **It fits the target market and the position.** A premium position needs a high-quality product, a premium price, selective distribution and promotion that builds image; a mass-market position needs low costs, low prices, wide distribution and broad promotion.
      2. **The Ps are consistent.** Each P must support the others. A luxury price with discount-store distribution, or a budget brand with costly personal service, confuses customers and wastes money.
      3. **It fits the product's stage and type.** The mix changes over the life cycle, and services depend on people, processes and physical evidence far more than goods do.
      4. **It fits the business's resources and objectives.** A small business cannot fund national television, and a business aiming for market share prices differently from one aiming for early profit.

      The mix also has to work in its setting: what rivals do, the law, ethics and sustainability, and how customers' tastes and technology are changing. A mix that is appropriate today may need to change next year.
    points:
      - term: A mass-market consumer good
        text: A standardized product, a low or penetration price, above the line and social media promotion, and wide distribution through wholesalers and retailers.
      - term: A luxury or niche good
        text: A distinctive product and a strong brand, a premium price, selective promotion such as public relations, sponsorship and influencers, and a few carefully chosen outlets or direct sales.
      - term: A product sold to other businesses
        text: A technical or customized product, prices set by cost-plus or negotiated with each customer, personal selling and trade events, and direct distribution or specialist agents.
      - term: A service
        text: All seven Ps, with people, processes and physical evidence often deciding whether customers come back.
    diagram: seven-ps
    example:
      title: Two businesses, two mixes
      fictional: true
      text: |
        Basalt, a fictional maker of hand-made kitchen knives, sells a few hundred knives a year at a premium price, through its own website and three specialist cookware shops. Chefs who use the knives, and demonstrations at food festivals, promote them, and each knife arrives in a wooden box signed by its maker.

        Spinwise, a fictional laundry service, collects and returns washing within a day across one city. It prices by the bag, below the cost of a trip to a launderette, takes bookings only through its app, advertises on buses and social media, and relies on drivers who are punctual and polite. Swap the two mixes and both businesses would fail; each fits its own customers and position.
applications:
  - industry: Packaged food and drink
    text: Products are sold through supermarkets and wholesalers to a mass market, so branding, wide distribution and above the line promotion carry most of the load. Retailers' own-label products compete on price on the same shelves, which is why mature brands lean on extension strategies and loyalty rather than price cuts.
  - industry: Luxury goods
    text: Premium pricing, a few carefully chosen outlets and promotion through public relations, sponsorship and selected influencers protect an image of exclusivity. Discounting or wide distribution would raise sales briefly and damage the brand value that justifies the price.
  - industry: Hotels and hospitality
    text: A stay cannot be tested before it is bought, so people, processes and physical evidence, from the welcome at the desk to the look of the lobby and the booking website, do much of the marketing. At HL, dynamic pricing is common, because an empty room tonight cannot be sold tomorrow.
  - industry: Industrial products sold to other businesses
    text: Buyers are few, expert and buying in large quantities, so personal selling, trade events and technical support matter more than advertising. Prices are often set by cost-plus pricing or negotiated with each customer, and distribution is direct or through specialist agents.
  - industry: Apps and digital services
    text: Distribution is direct through app stores and websites, promotion relies heavily on social media and recommendations, and many apps use a low or free starting price to win users quickly. The process, how easy the app is to start, use and pay for, is often what decides whether customers stay.
  - industry: Healthcare
    text: Patients judge a clinic or a pharmacy by its people and its physical evidence, since they cannot judge the treatment itself, and trust matters more than price. Promotion is limited by law and by professional ethics, so reputation and recommendations do most of the work.
stakeholders:
  - group: Customers
    text: Gain from products and services that fit their needs and from honest promotion, but can lose from prices that feel unfair, such as surge prices at busy times, or from predatory pricing that removes rivals and then lets prices rise. Social media gives them a public voice in the mix.
  - group: Employees
    text: Are the people P in any service, so their training, pay and morale shape what customers experience. A mix that promises personal service puts pressure on frontline staff, and cultural expectations of how staff should behave vary from one market to another.
  - group: Retailers and other intermediaries
    text: Take a share of the price in return for reach, and resist when a producer starts selling direct online at a lower price. Large retailers can also become competitors, launching own-label versions of the products they stock.
  - group: Competitors
    text: React to every move in the mix, matching price cuts, copying successful features and fighting for shelf space and attention. Penetration or predatory pricing can start a price war that damages every business in the market, and predatory pricing is illegal in many countries.
  - group: Owners and shareholders
    text: Branding and promotion take years to pay back, while price cuts and promotions can lift sales quickly at the cost of margins. Owners have to balance spending on today's best sellers against investment in the products that will replace them.
  - group: Regulators and the community
    text: Advertising standards, laws on pricing and rules on marketing to children limit the mix. Communities also judge packaging waste and the environmental claims made in promotion, which can strengthen a brand or damage it.
evaluation:
  - The Ps work as a mix, not a list. A change to one, such as a price cut, changes how customers read the others, so an answer that shows these links is stronger than one that treats each P on its own.
  - The product life cycle and the BCG matrix simplify. They help to organize thinking about investment, cash and priorities, but they describe patterns rather than predict them, and the business's own decisions change the curve.
  - Pricing is never just arithmetic. Cost-plus pricing gives a starting point, but the appropriate price depends on demand, rivals, the brand's position and the business's objectives. At HL, price elasticity of demand adds evidence, but estimates rest on past behaviour and change over time.
  - Branding and promotion take time to pay back and are hard to measure. Social media make measurement easier and costs lower, but they give customers a public voice, so they reward businesses whose products and service can stand scrutiny.
  - For services, people, processes and physical evidence are often what customers actually compare, and they depend on human resource and operations decisions as much as on marketing.
  - Ethics and sustainability are part of the mix. Predatory pricing, hidden advertising and misleading claims can bring sales in the short run but damage the brand and may break the law; the guide's conceptual understandings link ethical and sustainable marketing with a stronger brand and business success.
  - In an examination answer, recommend a mix for the business in the case, given its target market, position, resources and stage of the life cycle. Justify each P with evidence from the case and show how the Ps support each other.
decision:
  title: Cut, extend or harvest?
  fictional: true
  brief: |
    Brightfield sells about 1.6 million cans of its sparkling tea a year at $1.25, about $2 million of sales. Each can costs $0.50 to make and deliver, so each contributes $0.75, and the tea contributes $1.2 million a year towards fixed costs and profit. It spends $300,000 a year promoting it. A supermarket's own-label sparkling tea now sells at about $1.00.
  options:
    - label: Cut the price to $1.10
      text: Each can would contribute $0.60. To keep the tea's contribution of $1.2 million a year, Brightfield would need to sell 2 million cans, a quarter more than now, against a rival that is still cheaper.
    - label: Extend the tea's life
      text: Two new flavours, a slim can for younger drinkers and a social media campaign would cost $250,000 at the start. If they lift sales by 15% for three years at the same price, the extra 240,000 cans a year add $180,000 a year of contribution, $540,000 over the three years.
    - label: Harvest the tea and back the iced coffee
      text: Cut the tea's promotion from $300,000 to $100,000 and move $200,000 to the iced coffee. If the tea's sales then fall by 10% a year, it loses $120,000 of contribution in the first year, less than the $200,000 saved, but $228,000 in the second.
  guidance: |
    Start with the life cycle. Sales have stopped growing and a cheaper rival has arrived, which are the signs of maturity, the stage at which extension strategies are usually considered and at which a product earns the most cash. The tea is now closer to a cash cow than a star, so the question is how to keep its cash coming for as long as possible.

    **The price cut** is the weakest fit. It needs a quarter more volume just to stand still, leaves Brightfield still dearer than the own-label tea, and may cheapen a brand built on quality. HL students can put a number on it: a 12% cut that needs a 25% rise in volume only works if demand has a price elasticity of about −2.1, which is unlikely for a product with loyal buyers. **The extension** works with the tea's strengths, its brand and its loyal drinkers, and on these forecasts returns $540,000 for $250,000. But the forecast is a hope, the new flavours may take sales from the original rather than from rivals, and an extension only delays decline. **Harvesting** pays for one year, but by the second year the tea loses more contribution than the promotion saved, so it makes sense only if the iced coffee earns more from the $200,000 than the tea gives up.

    The judgement also involves place. The supermarket is both one of the tea's biggest retailers and now its competitor, so Brightfield needs a reason for that retailer to keep the tea on its shelves, which is easier with new flavours than with a price war. A defensible recommendation is the extension, with its results checked within a year, while the iced coffee is backed from the lemonade's cash rather than the tea's; harvesting becomes the better choice if the extension's trial fails. Say what evidence would change the choice: early sales of the new flavours, how much the own-label tea is taking, and the iced coffee's growth.
exam:
  - q: |
      Hearthstone Bakery, a fictional chain of bakeries, sets its prices by cost-plus pricing. Its sourdough loaf costs $2.40 to make and sell, including a share of indirect costs.

      Calculate (i) the price of the loaf with a mark-up of 75%, and (ii) the mark-up that would give a price of $4.50.
    marks: 4
    command: calculate
    level: SL/HL
    paper: '2'
    answer: |
      A strong response writes the standard working, since the guide's formula list has no pricing formula, and shows each step.

      - **(i)** Price = unit cost + (unit cost × mark-up % ÷ 100) = 2.40 + (2.40 × 75 ÷ 100) = 2.40 + 1.80 = **$4.20**.
      - **(ii)** Mark-up = (price − unit cost) ÷ unit cost × 100 = (4.50 − 2.40) ÷ 2.40 × 100 = 2.10 ÷ 2.40 × 100 = **87.5%**.

      A strong answer adds that cost-plus pricing guarantees a margin on each loaf but ignores what customers will pay and what rivals charge.
  - q: Brightfield has just launched a canned iced coffee. Explain how the iced coffee's profit and cash flow are likely to change as it moves through its life cycle.
    marks: 4
    command: explain
    level: SL/HL
    paper: '1'
    answer: |
      A strong response follows the product through the stages and keeps profit and cash flow apart.

      - **Development and introduction:** spending on recipes, equipment, stock and launch promotion comes before sales, so the product makes a loss and its cash flow is negative.
      - **Growth:** as sales rise, profit turns positive, but cash flow can stay weak for a while, because Brightfield is still paying for capacity, stock and promotion and some retailers pay on credit.
      - **Maturity:** with sales at their peak and the heavy investment already made, profit and cash flow are usually at their highest, and the iced coffee could fund later products.
      - **Decline:** both fall, unless an extension strategy renews sales. A strong answer links this to the portfolio: as a question mark, the iced coffee needs cash from Brightfield's cash cows until it can earn its own.
  - q: Distinguish between above the line and below the line promotion, using examples for Hearthstone Bakery.
    marks: 4
    command: distinguish
    level: SL/HL
    paper: '1'
    answer: |
      A strong response explains the difference in audience and method, with an example of each for the bakery.

      - **Above the line** uses paid mass media to reach a broad audience the business cannot select, such as a local radio advert or a billboard announcing a new branch. It builds awareness quickly but is costly and hard to measure.
      - **Below the line** is aimed directly at chosen customers without mass media, such as a loyalty card, free tasting samples in store or an email offer to existing customers. It is cheaper per customer and easier to measure, but reaches fewer people.
      - A strong answer notes the difference that matters for a local bakery: most of its customers live nearby, so targeted below the line methods may reach them more cheaply than mass media.
  - q: Spinwise, the fictional laundry service in these notes, collects and returns washing within a day, takes bookings only through its app and relies on its drivers. Explain the importance of people and processes in marketing Spinwise's service.
    marks: 4
    command: explain
    level: SL/HL
    paper: '1'
    answer: |
      A strong response explains why each P matters for this service in particular.

      - **People:** the drivers are the only staff most customers ever meet, so their punctuality and politeness are the service in the customer's eyes; one careless driver can lose a customer and, through reviews, others too. Recruitment, training and motivation become marketing decisions.
      - **Processes:** the app booking, the collection window, the one-day turnaround and the way lost items are handled are what customers are paying for. A reliable, simple process can be a USP; a missed collection breaks the promise the whole mix rests on.
      - A strong answer adds why both matter more for a service than for a good: customers cannot inspect a laundry service before buying it, so they judge it by the people and the process.
  - q: Hearthstone Bakery plans a subscription service that delivers fresh bread and pastries to homes before 7 a.m. each day, ordered through an app. Recommend an appropriate marketing mix for the new service.
    marks: 10
    command: recommend
    level: SL/HL
    paper: '1'
    answer: |
      A strong response recommends each P for this service and its likely customers, shows how the Ps support each other and justifies the whole mix.

      - **Product and target market:** a weekly or monthly subscription of fresh bread and pastries, aimed at busy households who value convenience and quality, with the option to skip days.
      - **Price:** a subscription price set from cost-plus pricing for a floor, with a premium for convenience, since the service saves a trip to the shop; a first month at a reduced price could win trial customers, at the cost of margin.
      - **Promotion:** below the line methods suit a local service, such as free samples in the shops, flyers with each in-store purchase and targeted social media adverts to nearby households; reviews and recommendations will matter most.
      - **Place:** direct delivery from the nearest bakery, which keeps control and freshness, but limits the service to the areas the vans can reach before 7 a.m.
      - **People, processes and physical evidence:** reliable drivers and a simple app for ordering, pausing and paying; insulated, branded bags and the bakery's name on the vans as evidence of quality.
      - **Judgement:** for example, a premium-convenience mix built on reliability, since one late or missing delivery would undo the value of the service, with the reduced first month used only to build trial. A strong answer notes the risks, such as delivery costs early in the morning and rivals copying the idea, and says what research would test the demand first.
  - q: Hearthstone raises the price of its sourdough loaf from $4.20 to $4.62, and weekly sales fall from 5,000 loaves to 4,600. Calculate the price elasticity of demand (PED) and the change in weekly revenue, and state whether demand is price elastic or price inelastic.
    marks: 4
    command: calculate
    level: HL
    paper: '2'
    answer: |
      A strong response writes the standard formula, since PED is not on the guide's formula list, and shows each percentage change.

      - Percentage change in price = (4.62 − 4.20) ÷ 4.20 × 100 = **+10%**.
      - Percentage change in quantity demanded = (4,600 − 5,000) ÷ 5,000 × 100 = **−8%**.
      - PED = −8% ÷ 10% = **−0.8**. Ignoring the sign, 0.8 is less than 1, so demand is **price inelastic**.
      - Weekly revenue rises from 5,000 × $4.20 = $21,000 to 4,600 × $4.62 = $21,252, an increase of **$252**.

      A strong answer adds that the rise in revenue fits inelastic demand, and that profit rises by more than revenue, because 400 fewer loaves also means 400 fewer loaves to bake.
summary:
  - The marketing mix is the seven Ps, product, price, promotion and place, plus people, processes and physical evidence for services. Every P should fit the target market, the position and the other Ps.
  - The product life cycle runs from development and introduction through growth and maturity to decline. Cash flow is negative at first, profit turns positive in growth, and cash flow is usually strongest in maturity.
  - The product portfolio, analysed with the BCG matrix's stars, question marks, cash cows and dogs, links the life cycle to investment, because the cash cows fund the products of the future.
  - Extension strategies, such as new markets, uses, versions, packaging, prices, promotion or channels, renew sales in maturity, but they only delay decline.
  - Branding builds awareness, development, loyalty and value. A strong brand supports higher prices and new products, but it takes years to build and can be lost quickly.
  - Cost-plus, penetration, loss leader, predatory and premium pricing are each appropriate in some conditions, depending on costs, objectives, the product's position, rivals and how sensitive customers are to price.
  - (HL only) Dynamic, competitive and contribution pricing add three more methods, and PED = percentage change in quantity demanded ÷ percentage change in price shows whether demand is elastic (above 1, ignoring the sign) or inelastic (below 1).
  - Promotion is above the line (mass media), below the line (aimed at chosen customers) or through the line (both together). Social media marketing is cheap and precise but public and demanding.
  - Place trades control and margin, in short channels, against reach, in longer ones. For services, people, processes and physical evidence often decide whether customers come back.

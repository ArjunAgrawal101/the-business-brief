# Notes: 1.2 Types of business entities. Written in the platform's own words
# from the guide's four content statements (p. 23), following the guide's
# classification exactly: private sector companies, public sector companies
# and cooperatives as for-profit social enterprises, and NGOs as a non-profit
# social enterprise, all at AO3. The supplied coursebook chapter (Hodder,
# pp. 71 to 83) was read to check coverage and conventions; no passage, table
# or case from it is reproduced. Where it differs from the guide, the guide is
# followed: its syllabus box calls these social enterprises "not-for-profit"
# and sets AO2 for them and for the four types of organization (p. 71), and
# its body teaches private and public sector companies as ordinary company
# types (pp. 75 to 77). The guide names the three for-profit forms without
# defining them; the definitions here follow the platform's glossary and the
# TSM's social enterprise guidance (pp. 62 to 63). Every business named is
# fictional.
code: '1.2'
title: Types of business entities
level: SL/HL
introduction: |
  Before a business can trade, its founders must decide who will own it, who will carry the risk if it fails and what it is for. Those decisions fix its legal form, and the legal form shapes almost everything that follows: how much finance it can raise, how quickly it can decide, what it must publish and whose interests come first.

  This subtopic maps the choices. It starts with the split between the private and public sectors, works through the four types of commercial organization from the sole trader to the publicly held company, and ends with social enterprises, which trade in order to serve a social purpose. The guide sets the features of every type at AO3, so you must be able to weigh each form and judge which suits a particular business at a particular stage.
objectives:
  - '**Distinguish** between the private and public sectors, and explain why governments run some organizations themselves.'
  - '**Compare** sole traders, partnerships, privately held companies and publicly held companies by ownership, liability, finance and control.'
  - '**Examine** the features of the three for-profit social enterprises that the guide names: private sector companies, public sector companies and cooperatives.'
  - '**Discuss** the strengths and weaknesses of non-governmental organizations (NGOs) as non-profit social enterprises.'
  - '**Recommend** a legal form for a business at a given stage, weighing control, risk, finance and purpose.'
sections:
  - id: private-and-public-sectors
    title: The private and public sectors
    kind: concept
    body: |
      Every organization belongs to one of two sectors, depending on who owns it. The **private sector** is everything owned privately: by one person, a family, a group of partners, shareholders or members. The **public sector** is everything owned or controlled by the government, national or local.

      The two sectors usually differ in what they are for. Most privately owned businesses exist to earn a profit for their owners, although social enterprises, charities and NGOs in the private sector put a purpose first. Public sector organizations aim mainly to provide a service. Some charge for what they provide and try to break even or earn a surplus, but any surplus goes back into the service or to the government rather than to private owners.

      Governments usually run an activity themselves for one of three reasons: they see it as something everyone should have whatever their income, such as basic schooling or clean water; it is too important to the country to leave to the market, such as defence or air traffic control; or private firms would provide too little of it because it would not pay, such as street lighting. Where the line falls differs between countries and moves over time, through **privatization**, which sells or transfers public activities to private owners, and nationalization, which brings private businesses into public ownership.
    points:
      - term: Private sector
        text: Owned privately and funded mainly by sales, the owners' money and borrowing. Alongside profit-seeking businesses of every size, it includes cooperatives, charities and NGOs.
      - term: Public sector
        text: Owned or controlled by the government and funded mainly by taxation and borrowing, plus sales for the organizations that trade. It includes government departments, state schools and hospitals, the police and government-owned companies.
      - term: Publicly held is not public sector
        text: The shares of a publicly held company are traded on a stock exchange, but its owners are private shareholders, so it is in the **private** sector. Mixing the two up is one of the commonest errors in this subtopic.
    diagram: business-entities
    example:
      title: A hospital and a clinic
      fictional: true
      text: |
        In the fictional city of Corran, the public hospital treats everyone without charge at the point of use, is paid for through taxes and must accept every emergency. Bayview Clinic, a privately owned business, charges fees, chooses which treatments to offer and competes on comfort and short waiting times.

        When the government considers paying Bayview to carry out some routine operations to shorten hospital waiting lists, supporters point to speed and spare capacity, while critics worry about the cost to taxpayers and about public money flowing to private owners.
  - id: sole-traders
    title: Sole traders
    kind: types
    body: |
      A **sole trader** is a business owned by one person. The owner may employ staff, but takes every major decision, keeps all the profit and carries all the risk. It is the most common form of business in many countries, typical of tradespeople, small shops, freelancers and personal services.

      In law the business has no identity of its own: the business and the owner are the same person. That is why the owner has **unlimited liability**. If the business cannot pay its debts, creditors can claim the owner's personal assets, such as savings, a car or a home. It is also why the business has no continuity: it ends when the owner stops, unless someone buys it.
    advantages:
      - Easy and cheap to start, with very little paperwork.
      - The owner has full control and can decide quickly.
      - The owner keeps all the profit after tax.
      - Accounts usually stay private, apart from what goes to the tax authorities.
      - Close contact with customers allows a personal service.
    limitations:
      - Unlimited liability puts the owner's personal assets at risk.
      - Raising money is hard, because the owner relies on savings, profits and loans, and small firms often pay more to borrow.
      - Long hours and little cover for illness or holidays, with every decision resting on one person.
      - No continuity, because the business depends on one person.
      - The owner may lack some skills, and growing is hard without partners or shareholders.
    example:
      title: Spoke and Chain
      fictional: true
      text: |
        Dina Haddad, a fictional bicycle mechanic, runs Spoke and Chain as a sole trader from a rented garage. She chose the form because she could register with the tax office in an afternoon, needs no one's permission to decide anything and keeps every dollar of profit.

        The risk became real when a wholesaler she owed $4,000 for parts demanded payment during a slow winter. The business had no cash to spare, so she paid from her own savings: as a sole trader, the debts of the business are her debts.
  - id: partnerships
    title: Partnerships
    kind: types
    body: |
      In a **partnership**, two or more people own the business together: each puts in money, skills or both, they run it jointly and they share the profits. Law firms, accountants, architects and medical practices are often partnerships, because the partners can bring different specialisms and share clients and costs.

      Like a sole trader, an ordinary partnership is not a separate legal entity, so the partners usually have unlimited liability, and each partner can be made to pay for debts that a fellow partner ran up on the firm's behalf. Some countries offer a limited liability partnership, which protects the partners' personal assets, but the rules differ from country to country.

      Partners are strongly advised to sign a **deed of partnership**, a legal agreement that sets out how much capital each puts in, how profits are shared, who decides what, how disputes are settled and what happens when a partner leaves or dies. If they do not, the country's partnership law fills the gaps, and in many countries that means equal shares of profit even when one partner put in far more.
    advantages:
      - More capital than one owner can usually provide.
      - Partners bring different skills, ideas and contacts, and can specialize.
      - The workload is shared, and the business does not stop when one partner is ill or away.
      - Still fairly simple to set up, and the accounts usually stay private.
    limitations:
      - Usually unlimited liability, including for business decisions that other partners make.
      - Profits are split between the partners.
      - Disagreements can slow decisions or break the business up.
      - Finance is still limited compared with a company, and the partnership may have to be re-formed when a partner leaves.
    example:
      title: A design partnership
      fictional: true
      text: |
        Two architects form Lattice Studio, a fictional partnership. Maya puts in $30,000 and her client contacts; Tomasz puts in $10,000 and his skill in low-energy design. Their deed pays each partner 5% interest on the capital they put in ($1,500 a year to Maya, $500 to Tomasz) and splits the rest of the profit equally, because they expect to work equal hours.

        In their second year Tomasz signs a $12,000 software contract without asking Maya. Both partners are liable for it, so they add a rule to the deed that any spending over $5,000 needs both signatures.
  - id: privately-held-companies
    title: Companies and privately held companies
    kind: types
    body: |
      Incorporating a business creates a **company**: a new legal person, separate from the people who own it. The company, not its owners, holds the property, signs the contracts, borrows the money and can be taken to court, and it carries on when its owners change. It is owned by **shareholders**, each holding part of it, and run by directors whom the shareholders appoint. In a small company the shareholders and the directors are often the same people.

      Because the company is a separate legal person, its debts are its own. Its shareholders have **limited liability**: if the company fails, they can lose the money they paid for their shares, but not their personal assets. Limited liability is what makes people willing to invest in businesses they do not run themselves.

      A **privately held company** keeps its shares out of public hands. They are not sold to the general public and do not trade on any stock exchange, and the existing shareholders normally have a say over who may buy them. Many family businesses, and many young firms backed by a few investors, are privately held. Privately held does not mean small: some very large businesses choose to stay private.
    advantages:
      - Limited liability protects the personal assets of the shareholders.
      - The company continues if an owner dies or leaves.
      - Selling shares to people the owners choose raises more finance than a sole trader or partnership can.
      - The owners keep control over who joins them.
      - Company status can make lenders, suppliers and large customers take the business more seriously.
    limitations:
      - Costs more to set up and run, with registration, legal duties, annual filings and, above a certain size in most countries, an independent audit.
      - Accounts must usually be filed publicly, where rivals can read them.
      - Cannot raise money from the general public, so finance is still limited.
      - Shares are hard to sell, because there is no public market for them.
      - Lenders often ask the owners of small companies for personal guarantees, which weakens the protection of limited liability.
    example:
      title: A family firm takes in an outsider
      fictional: true
      text: |
        Marlowe and Daughters, a fictional maker of kitchen knives, became a privately held company when the founder's two daughters joined. Of its 1,000 shares, the founder holds 500 and each daughter 250. The company's rules say that no shareholder may sell to an outsider unless the others have first refused to buy.

        To pay for a larger workshop, the family agreed to issue 200 new shares to a long-standing steel supplier. The company gained the money, but the founder's stake fell from half to about 42% (500 of 1,200 shares): the price of new finance was a smaller share of control.
  - id: publicly-held-companies
    title: Publicly held companies
    kind: types
    body: |
      A **publicly held company** is one whose shares anyone can buy: they are listed on a stock exchange and change hands there every trading day. A company usually goes public when it needs more finance than private investors can provide, and its first sale of shares to the public, often called a flotation or an initial public offering, can raise very large sums.

      Going public brings obligations. The company must publish detailed accounts checked by independent auditors, obey the stock exchange's rules and announce promptly any news that could move its share price. Because anyone can buy its shares, ownership is spread across many shareholders, including pension funds and other investors who take no part in running the business. Professional directors and managers run it instead. This **divorce of ownership and control** means that the owners and the decision-makers are different people, and their objectives may differ.

      Ordinary shares usually carry one vote each, so a shareholder or group with more than half the votes controls ordinary decisions. Publicly held companies are in the private sector: "public" describes who can buy the shares, not who owns the company.
    advantages:
      - Access to very large sums from the public, for growth and investment.
      - Limited liability, and shares that are easy to buy and sell, which attracts investors.
      - Size and a public profile can raise the status of the company and help it borrow more cheaply.
      - Shares can be used to buy other companies or to reward staff.
    limitations:
      - Expensive to float and to stay listed, with legal, accounting and stock exchange costs.
      - Detailed public disclosure, including information that rivals can use.
      - The founders may lose control, and because anyone can buy shares, the company can be taken over.
      - Investors may press for quick results, which can discourage long-term investment.
      - Managers may pursue their own objectives rather than the shareholders' interests.
    example:
      title: Tallgrass Fitness goes public
      fictional: true
      text: |
        Tallgrass Fitness, a fictional chain of 40 gyms, has 10 million shares, 8 million of them held by its two founders (80%). To fund 60 new gyms, it floats on its national stock exchange and sells 6 million new shares to the public at $15 each, raising $90 million.

        The founders still hold 8 million shares, but now out of 16 million: 50%. Together they can still block a vote, but they can no longer win one on their own. The company must now publish its results every six months, and a year later a larger rival buys 15% of the shares on the stock exchange, the first sign of a possible takeover bid.
  - id: for-profit-social-enterprises
    title: For-profit social enterprises
    kind: types
    body: |
      A **social enterprise** is a business with a mission. It sells goods or services and has to cover its costs like any other business, but it exists to tackle a social or environmental problem, and most of any surplus is spent on that problem rather than paid to owners. It differs from a charity in where its money comes from: most of it is earned by trading, not given. Success is measured in impact as well as money, often using the triple bottom line of people, planet and profit.

      The guide divides social enterprises into for-profit and non-profit types. A **for-profit social enterprise** sets out to make a profit, since profit is what lets it stand on its own feet and do more good, but the profit serves the mission rather than the owners. The guide names three forms, at AO3, without defining them; the definitions below are the platform's, consistent with the IB's teacher support material on social enterprises.

      Some textbooks teach private sector companies and public sector companies simply as ordinary types of company. These notes follow the guide, which lists both, with cooperatives, as for-profit social enterprises.
    points:
      - term: Private sector companies
        text: |
          Privately owned companies that put a social or environmental purpose first. They trade for a profit, but most of it goes back into the mission. In law they are companies like any other, so their owners have limited liability. The name is easily confused with a privately held company: that label is about who may buy the shares, while this one is about what the company exists to do. In some countries the law offers company types whose rules lock profits or assets into the mission.
      - term: Public sector companies
        text: Companies owned wholly or mostly by the government that sell to customers like any business and aim to make a surplus, but exist to serve the public, for example by keeping a service affordable or reaching places a private firm would not. Their surplus is reinvested in the service or paid to the government.
      - term: Cooperatives
        text: |
          Businesses owned and run by the people who use them or work in them: their workers (a worker cooperative), their customers (a consumer cooperative) or the producers who supply them, such as farmers who pack and sell their crops together (a producer cooperative). Decisions are democratic, normally one member, one vote, however much each has invested. Any surplus belongs to the members: it is paid back to them, usually in line with how much each traded with or worked for the cooperative, or ploughed back into the business.
    advantages:
      - Trading income gives independence from donors and grants, and profit pays for a wider impact.
      - A clear purpose attracts customers, committed staff and support from the community.
      - In a cooperative, democratic control and a shared surplus can motivate members and keep the benefits local.
      - A public sector company can serve people that a purely profit-seeking firm would drop, while still covering its costs.
    limitations:
      - Balancing profit and purpose is hard, and pressure to earn more can pull an enterprise away from its mission.
      - Raising finance is harder, because investors seeking high returns stay away, and a cooperative cannot sell shares to outsiders.
      - Social impact is hard to measure, so success is harder to prove to customers and funders.
      - One member, one vote can slow the decisions of a cooperative, and public sector companies can suffer political interference.
    example:
      title: Three ways to trade for a purpose
      fictional: true
      text: |
        In one region, three for-profit social enterprises work side by side. Second Spin, a privately owned company, refurbishes old laptops and sells them cheaply to schools in poor districts, putting 80% of its profit back into collecting and repairing more.

        Harbourline, the ferry company owned by the regional government, must earn a surplus to pay for its next boats, but its founding rules also fix island residents' fares at half the visitor price, a promise no private operator on the route has made.

        Loom and Lathe, a furniture workshop, is a worker cooperative owned by its 14 staff. Every worker-member has an equal say in electing the managers each year, and the surplus is shared according to the hours each person worked.
  - id: ngos
    title: Non-governmental organizations (NGOs)
    kind: types
    body: |
      In a **non-profit social enterprise**, nobody takes a share of the surplus: whatever is left after costs is spent on the purpose. Making a surplus is still a sensible aim, because it pays for more of the work. What sets it apart from a for-profit social enterprise is who benefits from a surplus, not whether there is one. The guide names one type to know, the NGO.

      A **non-governmental organization (NGO)** is independent of government and exists to advance a cause: human rights, the environment, health, education or the fight against poverty, for example. Some are a handful of volunteers in one town; others employ thousands of staff across many countries. Many are registered charities.
    points:
      - term: Independence
        text: An NGO is neither part of government nor run for profit, and its credibility rests on that independence and on its record of honesty.
      - term: Funding
        text: Mainly donations, grants from foundations, businesses and sometimes governments, and membership fees, often with some trading income from services, publications or merchandise.
      - term: Activities
        text: Many deliver services directly, such as disaster relief, clinics or schools. Many also campaign and lobby, using research, publicity and petitions to change laws and the behaviour of businesses; in that role they act as pressure groups.
      - term: Charities
        text: In many countries a charity is a non-profit body registered as serving the public benefit, which brings tax relief in return for tight rules on how it spends its money. Many NGOs are charities. A charity that lives mostly on donations is not a social enterprise in the strict sense, because social enterprises earn most of their income by trading.
    advantages:
      - Can reach people and causes that governments and businesses neglect.
      - Public trust and independence give them influence over businesses and governments.
      - Donations, grants, volunteers and tax advantages keep their costs down.
      - Often close to the communities they serve, so they can act quickly and with local knowledge.
    limitations:
      - Income can be unpredictable, rising and falling with the generosity of donors and the state of the economy.
      - Relying on large donors or government grants can compromise their independence, or appear to.
      - Impact is hard to measure, and large sums for long-term investment are hard to raise.
      - Reputation is fragile, and a scandal over spending or conduct can collapse donations.
    example:
      title: An eye-care NGO
      fictional: true
      text: |
        Lumen Eye Trust, a fictional NGO, runs mobile eye clinics in rural districts. Of its $400,000 annual income, 60% ($240,000) comes from donations, 30% ($120,000) from foundation grants and 10% ($40,000) from selling low-cost reading glasses. It also campaigns for the government to add eye tests to school health checks.

        With only a tenth of its income from trading, it is closer to a traditional charity than to a trading social enterprise. That is one reason its board wants to sell more glasses: more trading income would make it less dependent on donors.
  - id: choosing-a-legal-form
    title: Choosing and changing the legal form
    kind: evaluation
    body: |
      No legal form is best in general. The right choice depends on the size and riskiness of the business, how much finance it needs, how much control its owners want to keep and what the organization is for.

      Many businesses change form as they grow. A sole trader takes on a partner; a partnership incorporates as a privately held company to gain limited liability; a privately held company floats on a stock exchange to fund expansion. Each step brings more finance and protection, at the price of more formality, more disclosure and shared control. Some businesses move the other way, as when a small group of investors buys all the shares of a publicly held company and takes it private again.
    points:
      - term: Control
        text: Every new owner brings money but takes a share of the decisions. Founders who value control stay small or stay private.
      - term: Risk and liability
        text: The riskier the business and the larger its debts, the more limited liability is worth.
      - term: Finance
        text: Sole traders and partnerships depend on the owners' money and on loans; companies can sell shares; only publicly held companies can sell them to the public.
      - term: Cost and privacy
        text: Incorporating, and still more floating, costs money and means publishing accounts that rivals can read.
      - term: Continuity
        text: A company carries on when owners leave or die; a sole trader's business does not.
      - term: Purpose
        text: If the main aim is social, a social enterprise, cooperative or NGO may fit better than a conventional company, and may attract customers, staff and grants that a profit-seeking firm would not.
    example:
      title: Spoke and Chain, five years on
      fictional: true
      text: |
        Dina Haddad's repair business now has three workshops, nine staff and about $60,000 owed to suppliers at any one time. As a sole trader she is personally liable for every dollar of it.

        Incorporating as a privately held company would protect her home and make the business easier to pass on or sell, at the cost of registration, published accounts and more paperwork. Taking a partner instead would bring capital and a second manager, but no limited liability. With large debts and plans to grow, the case for incorporation is stronger. Going public would make no sense at her size, because the costs of a flotation would swamp the money she needs.
evaluation:
  - Every legal form is a trade-off between control, risk, finance and disclosure. The useful question is never which form is best, but which suits this business, at this stage, given what its owners want; a recommendation that says what would change it is stronger than one that does not.
  - Limited liability protects the owners of small companies less than it seems, because lenders often demand personal guarantees. In larger companies it shifts risk from shareholders to creditors, which is one reason companies must disclose more.
  - Going public raises finance but changes the business. Founders lose control, investors press for short-term results, and the divorce of ownership and control can set managers against shareholders. Some very large businesses stay private for exactly these reasons.
  - Neither sector is automatically better. Public provision can guarantee access to essential services; private provision can bring competition and efficiency. The result depends on the service, on regulation and on how each organization is run.
  - Social enterprises live with a lasting tension between profit and purpose. Too little profit and they cannot survive or grow; too much attention to profit and they drift from the mission. And because social impact is harder to measure than profit, their success is harder to prove.
  - The guide's grouping is a classification, not a fact of nature. It calls NGOs social enterprises, yet many NGOs live mainly on donations, which the IB's teacher support material associates with traditional charities rather than social enterprises. Real organizations sit on a spectrum from charity to business, so judge an organization by how it earns and spends its money, not by its label.
connections:

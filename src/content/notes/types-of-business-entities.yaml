retrieval:
  - q: Distinguish between the private and the public sector.
    a: The private sector is owned privately, by individuals, families, partners, shareholders or members; the public sector is owned or controlled by the government. Most private sector businesses aim for profit, while public sector organizations aim mainly to provide a service.
  - q: Why is a publicly held company in the private sector?
    a: It is owned by private shareholders. "Publicly held" means that anyone can buy its shares on a stock exchange, not that the government owns it.
  - q: What is unlimited liability, and which forms of business usually have it?
    a: The owners are personally responsible for all the debts of the business, so their own assets are at risk. Sole traders and most partnerships.
  - q: Give three things that a deed of partnership usually sets out.
    a: For example the capital each partner puts in, how profits are shared, who decides what, how disputes are settled, and what happens when a partner leaves or dies.
  - q: Give two differences between a privately held and a publicly held company.
    a: A publicly held company may offer shares to anyone, and they trade on a stock exchange; a privately held company may not, and its owners control who joins them. A publicly held company must also disclose more, and can be taken over.
  - q: Name the three for-profit social enterprises that the guide lists, and the non-profit one.
    a: Private sector companies, public sector companies and cooperatives; and NGOs.
  - q: How does a cooperative differ from a company owned by investors?
    a: It is owned and controlled by its members (its workers, customers or producers), normally with one vote each whatever they have invested, and its surplus is shared among them or reinvested instead of rewarding outside investors.
  - q: How are NGOs usually funded, and why can that be a weakness?
    a: Mainly through donations, grants and membership fees, with some trading. Income can be unpredictable, and relying on large donors or on governments can threaten their independence.

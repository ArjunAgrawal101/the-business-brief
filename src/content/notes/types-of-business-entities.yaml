  - code: '1.4'
    text: Ownership decides who the shareholders are and how much power they have.
  - code: '1.5'
    text: Growth, takeovers and flotation change the legal form of a business and who controls it.
  - code: '3.2'
    text: The legal form limits the sources of finance, from personal funds for sole traders to share capital for companies.

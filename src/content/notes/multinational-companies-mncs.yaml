retrieval:
  - q: What is the difference between an MNC and a business that exports?
    a: An MNC owns or controls operations, such as factories, offices or stores, in more than one country. An exporter sells abroad goods it makes at home and has no operations in the countries it sells to.
  - q: Distinguish between a home country and a host country.
    a: The home country is where the MNC has its head office and legal base. A host country is any other country in which it operates.
  - q: What is foreign direct investment, and what are its three main forms?
    a: Investment in operations the investor will own or control in another country. It can build a new site (greenfield), buy or merge with an existing business, or form a joint venture with a local partner.
  - q: Give four reasons why a company might invest abroad.
    a: For example, new markets, lower costs, access to resources, getting round trade barriers, economies of scale and spreading risk, and incentives offered by host governments.
  - q: What is technology transfer, and how does it reach local firms?
    a: The spread of technology, skills and know-how from the MNC to the host. It reaches local firms when trained staff move to them and when suppliers raise their standards to meet the MNC's requirements.
  - q: Why does the repatriation of profits matter to a host country?
    a: Profits sent home leave the host's economy instead of being reinvested there, so less of the value the MNC creates stays in the country.
  - q: How can transfer pricing reduce the tax an MNC pays in a host country?
    a: Its subsidiaries can set the prices at which they trade with each other so that costs appear in the high-tax host and profits in a low-tax country.
  - q: What is meant by footloose investment?
    a: Investment by an MNC that is easily moved, for example a plant attracted by low wages or incentives, which may close and leave when those advantages end.
  - q: Why might a greenfield investment benefit a host more than an acquisition?
    a: A greenfield investment adds new capacity and jobs; an acquisition changes the owner of existing capacity and may lead to job cuts as the business is reorganized.
  - q: Name three conditions a host government could attach to an MNC's investment.
    a: For example, local content requirements, a local partner or joint venture, targets for training and employing local people, environmental standards, and a limited tax holiday.
  - q: A plant has sales of $200 million. It buys $60 million from local suppliers, pays local wages of $30 million and local taxes of $10 million, and reinvests $5 million of profit locally. What share of its sales stays in the host country?
    a: (60 + 30 + 10 + 5) ÷ 200 × 100 = 105 ÷ 200 × 100 = 52.5%.
  - q: Why is it important to ask what would have happened without the MNC?
    a: Because gross effects overstate the gain. Jobs at the MNC may replace jobs lost at local competitors, and an incentive is wasted if the company would have come anyway.

# Notes: 1.6 Multinational companies (MNCs). Written in the platform's own
# words from the guide's single content statement, the impact of MNCs on host
# countries (p. 24, AO3), with the unit's conceptual understandings and
# suggested tools (p. 23). The teacher support material's debatable inquiry
# question on multinationals (p. 6) and its advice on applied and theoretical
# answers (pp. 56 to 57) were read; nothing from them is reproduced. No
# coursebook chapter for 1.6 was supplied, so the ideas are explained from
# subject knowledge. Hofstede's cultural dimensions are an HL toolkit tool and
# are marked HL. Every business and place is fictional, every figure simulated,
# and every worked figure was checked by script.
code: '1.6'
title: Multinational companies (MNCs)
level: SL/HL
introduction: |
  Some of the largest organizations in the world operate in dozens of countries at once. When one of them builds a factory, opens a chain of stores or buys a local firm, the effects reach far beyond its own accounts: jobs, wages, taxes, local businesses, the environment and even the culture of the **host country** can change.

  The guide asks one thing of this subtopic, at its most demanding level: to evaluate the impact of **multinational companies (MNCs)** on the countries that host them (AO3). That means weighing benefits against costs for a particular company in a particular country, and saying what the balance depends on, rather than reciting a list of advantages and disadvantages.
objectives:
  - '**Describe** what makes a company multinational, and the difference between its home country and its host countries.'
  - '**Explain** why companies invest abroad, and why their motive shapes their impact.'
  - '**Analyse** the benefits an MNC can bring to a host country, and the costs and risks it can impose.'
  - '**Examine** how far the impact depends on the type of investment, the industry, the terms agreed and the strength of the host''s institutions.'
  - '**Evaluate** the impact of a particular MNC on its host country, using STEEPLE and the interests of different stakeholders.'
situation:
  title: A battery plant for the coast
  fictional: true
  text: |
    Halvard Batteries, a fictional maker of batteries for electric cars, has never produced outside its home country. Car makers abroad now buy most of its output, and its board wants a factory closer to them. It has shortlisted a coastal province of a middle-income country, where wages are about a third of those at home and a deep-water port is ten kilometres away.

    The plan is a $900 million plant on farmland outside the port town, employing 2,000 people. The provincial government is keen. Youth unemployment is high, the plant would be the province's largest private employer, and the government is offering ten years free of corporate tax. Local parts makers hope for contracts. The town's small engineering firms fear losing their best staff. Farmers and an environmental group worry about the plant's water use and the waste that battery production creates.

    Halvard's managers know that the plant's welcome will depend on what it does for the province, not only on what it saves the company. Every name in these notes is fictional and every figure simulated.

    **Would the plant be good for its host country, and what would that depend on?**
sections:
  - id: what-makes-an-mnc
    title: What makes a company multinational
    kind: concept
    body: |
      A **multinational company (MNC)** is a business that owns or controls operations, such as factories, offices, mines, stores or service centres, in more than one country. It is directed from a head office in its **home country**, where it is legally based and where its main decisions are taken. Every other country in which it operates is a **host country**, and the guide's question is about those countries: what does the MNC's presence do to them?

      The key word is *operations*. A business that only exports, selling abroad what it makes at home, trades internationally but is not multinational, because it has nothing in the countries it sells to. An MNC invests in its host countries through **foreign direct investment (FDI)**: it builds a new site from scratch (a *greenfield* investment), buys or merges with a business that already operates there, or forms a joint venture with a local partner. These are the external growth methods of [1.5](/topics/growth-and-evolution/), used across a border. Franchising sits on the boundary: a franchisor may have outlets in fifty countries, but local franchisees invest in and own them, so its own presence in each host is small.

      MNCs range from global giants to medium-sized firms with a single plant abroad, and they work in every sector: mining and farming, manufacturing, retailing, banking, technology and services. The largest employ hundreds of thousands of people and can choose between many possible host countries. That choice is the source of their bargaining power over governments that compete for their investment, and it runs through every judgement about their impact.
    points:
      - term: Multinational company (MNC)
        text: A business with operations in at least two countries, directed from a head office in its home country. Also called a multinational corporation or multinational enterprise.
      - term: Home country
        text: The country where the MNC has its head office and legal base. Its main shareholders and senior managers are usually there, and profits earned abroad are often sent back to it.
      - term: Host country
        text: Any country in which the MNC operates outside its home country. One MNC can have many host countries, and its impact can differ in each.
      - term: Foreign direct investment (FDI)
        text: Investment in operations that the investor will own or control in another country, by building, buying or partnering. Buying a few shares in a foreign company purely for income is not FDI, because it brings no say in how the business is run.
      - term: International trade is not enough
        text: Exporting, or licensing a brand or patent to a foreign firm, involves no operations abroad, so on its own it does not make a business multinational.
    example:
      title: One company, three routes abroad
      fictional: true
      text: |
        Halvard Batteries, the fictional company in the situation above, could serve car makers abroad in three ways.

        - **Export** batteries from its home factories. It stays a domestic company that trades abroad, and the host country gains cheaper batteries but no jobs.
        - **Build its own plant** in the province, a greenfield investment. It becomes an MNC, and the province gains new capacity, jobs and spending.
        - **Buy a struggling local battery maker** and expand it. It also becomes an MNC, but at first the province gains a new owner for a factory it already had, not new capacity.

        All three put Halvard's batteries in front of the same customers. Their impact on the host country is very different.
  - id: why-companies-invest-abroad
    title: Why companies invest abroad, and why the motive matters
    kind: concept
    body: |
      Operating abroad is costly and risky. A company must learn new laws, languages and customs, manage people at a distance and accept exposure to changes in exchange rates and politics. It takes on these costs because it expects higher returns than it could earn by staying at home or simply exporting, and its reasons usually fall into a few groups. Most investments combine more than one.

      The motive matters here because it predicts much of the impact. A company that comes for the host's customers builds stores, offices or a local factory and competes with local firms. One that comes for low wages employs many people, but may leave when wages rise. One that comes for minerals or oil brings enormous capital and pays large royalties, but employs relatively few people and leaves a physical mark on the land. Before judging an MNC's impact, ask why it came, and what it is likely to do next.
    points:
      - term: New markets
        text: Selling to customers in the host country and its region, especially when the home market is mature. Being close to customers also makes it easier to adapt products to local tastes and to deliver quickly.
      - term: Lower costs
        text: Cheaper labour, land, energy or materials lower the cost of each unit. Weaker regulation can lower costs too, which is where the ethical questions begin.
      - term: Access to resources
        text: Minerals, energy, farmland, water or specialist skills that exist only in particular places. A mining company has to go where the ore is.
      - term: Getting round trade barriers
        text: Producing inside a country, or inside a group of countries that trade freely with each other, avoids tariffs and quotas on imports and can earn goodwill from the government.
      - term: Economies of scale and spreading risk
        text: Selling in many markets spreads fixed costs, such as research and brand building, over more units, and a slump in one country can be offset by growth in another.
      - term: Incentives from host governments
        text: Tax holidays, grants, cheap land or places in special economic zones offered to attract investment. They change the balance of costs, sometimes decisively.
    example:
      title: Three motives, three footprints
      fictional: true
      text: |
        Three fictional companies invest in the same host country for different reasons, and leave different footprints.

        - **Brightwell Foods**, a supermarket chain, comes for the customers. It opens 40 stores employing 2,400 people and buys fresh produce from local farms, but small shops near its stores lose trade.
        - **Tessaro Garments** comes for low wages. Its clothing factory employs 3,000 machinists, imports almost all its fabric, and will move if wages rise faster than its productivity.
        - **Granick Copper** comes for the ore. Its mine cost $1.2 billion but employs only 600 people. Its royalties are a large part of the province's budget, and the dam holding its mining waste is the biggest environmental risk in the region.

        Asking why each came tells you most of what to look for when you judge its impact.
  - id: benefits-for-host-countries
    title: Benefits for the host country
    kind: types
    body: |
      An MNC can bring a host country things it would struggle to provide for itself: capital, technology, management skills and access to markets around the world. Governments compete to attract foreign investment for exactly these reasons. Each benefit is real, but each is *possible* rather than guaranteed, and each depends on what the company does and on the terms it has agreed.

      The benefits also reach beyond the MNC's own gates. A factory buys components, food, transport and cleaning from local businesses, and its employees spend their wages in local shops, so each direct job can support others in the wider economy. Economists call this a multiplier effect. It works only to the extent that the money is spent locally: the benefits shrink when an MNC imports most of what it uses and sends most of its profit home. That is why the share of an MNC's revenue that stays in the host country is a useful test of how much it contributes, as the example shows.
    diagram: mnc-host-impact
    points:
      - term: Jobs and incomes
        text: Direct jobs at the MNC, and indirect jobs at its suppliers and in the businesses where its employees spend their wages. MNCs often pay more than local employers, especially for skilled work, and may offer better training and conditions.
      - term: Investment and capital
        text: FDI brings money for factories, equipment and infrastructure that the host could not raise at home, without the government having to borrow it.
      - term: Technology transfer and skills
        text: New technology, production methods and management practices arrive with the MNC. They spread when local staff are trained and later move to local firms, and when suppliers must raise their standards to win the MNC's orders.
      - term: Tax revenue
        text: Taxes on the company's profits, its employees' incomes and its sales help to pay for schools, hospitals and roads, unless incentives reduce them or the company avoids them.
      - term: Exports and foreign currency
        text: An MNC that sells abroad from the host earns foreign currency for the country and can open export markets for local suppliers.
      - term: Local suppliers and linkages
        text: Contracts to supply parts, food, services and transport give local firms a larger market, and meeting the MNC's quality standards can make them competitive elsewhere.
      - term: Infrastructure
        text: Roads, ports, power lines and telecommunications built for or by the MNC can serve the whole area once they exist.
      - term: Choice and competition
        text: Consumers gain new products, often at lower prices or higher quality, and local firms are pushed to improve.
    example:
      title: How much stays in the province?
      fictional: true
      text: |
        In its first full year, Halvard's plant expects sales of $500 million (simulated figures). That revenue is spent as follows.

        - $275 million on components and materials imported from Halvard's home country.
        - $75 million on parts and services from local suppliers.
        - $50 million on the wages of 2,000 local employees, an average of $25,000 each.
        - $25 million to local providers of energy, water, transport and premises.
        - $75 million is profit. With the tax holiday, no corporate tax is due. Halvard plans to send $60 million (80%) home and reinvest $15 million (20%) in the plant.

        The value that stays in the host country is $75m + $50m + $25m + $15m = **$165 million**, or **33% of sales**. The other 67% leaves: 55% as payments for imports and 12% as profit sent home. A third of half a billion dollars a year is a large injection for one province, but the figure also shows where more could stay: local suppliers provide only $75 million of the $350 million of parts, materials and services the plant buys in, about 21%.
  - id: costs-for-host-countries
    title: Costs and risks for the host country
    kind: types
    body: |
      The same investment that brings jobs and capital can also impose costs, and they often fall on different people from those who gain. Critics argue that governments eager for good news overstate the benefits, and that the costs arrive later, once the incentives have been paid and the company has the stronger hand.

      Many of the costs come from an imbalance of power. A large MNC can usually place its next investment elsewhere, while the host's workers, suppliers and communities cannot move. That gives the company leverage over wages, taxes and regulation, and it means the host can lose heavily if the company leaves. None of the costs below is inevitable, but each is a reason to look closely at the evidence before accepting a government's or a company's claims.
    points:
      - term: Local firms forced out
        text: Domestic businesses may not be able to match the MNC's prices, brands or technology. If local competitors close, the market comes to depend on foreign owners, and the jobs lost offset some of those created.
      - term: Profits sent home
        text: Repatriated profits leave the host's economy. Over the life of an investment, the outflow of profit can exceed the capital that came in.
      - term: Tax avoidance through transfer pricing
        text: Subsidiaries of the same MNC trade with one another, and the prices they set can make profit appear in countries with low taxes. The host where the work is done may then collect little tax.
      - term: The cost of incentives
        text: Tax holidays and grants mean taxpayers pay for jobs that might have come anyway, and hosts competing for the same investment can bid each other's terms down.
      - term: Low pay and poor conditions, in some cases
        text: Where labour laws are weak or poorly enforced, some MNCs and their suppliers pay very low wages, demand long hours or run unsafe workplaces.
      - term: Environmental damage
        text: Pollution, waste, heavy water use and the depletion of natural resources, most serious in mining, energy, chemicals and farming, and where regulation is lax.
      - term: Footloose investment
        text: An MNC drawn by low costs or incentives may leave when they end, closing plants and leaving unemployment behind. Such investment is called footloose.
      - term: Skills drawn away
        text: The MNC's higher pay can draw the best engineers, managers and graduates away from local firms and public services.
      - term: Political and cultural influence
        text: A large MNC can lobby for laws that suit it, and global brands can crowd out local products, customs and languages.
    example:
      title: When the incentives ran out
      fictional: true
      text: Tessaro Garments, the fictional clothing maker above, was given five years free of corporate tax. In the sixth year the tax holiday ended and the host country raised its minimum wage by 15%. Within eighteen months Tessaro had moved its sewing lines to a lower-wage country. Its 3,000 machinists lost their jobs, the bus companies and caterers that served the factory lost their main customer, and because Tessaro had trained its staff only to operate its machines, few had skills that other employers wanted. The host had gained wages and exports for six years, and very little that lasted.
  - id: weighing-the-impact-with-steeple
    title: Weighing the impact with STEEPLE
    kind: framework
    body: |
      Because an MNC's impact touches almost every part of a host country, a framework helps to make sure an answer covers the effects that matter and then weighs them. The guide suggests **STEEPLE analysis** as a toolkit tool for this unit. It is usually used to scan the external environment of a business. Here it is turned around, to scan the effects of a business on its environment.

      Work through the seven headings for the particular MNC and host country in the case. Under each, note the likely benefits and costs, the evidence for them, and who feels them. Then judge which effects matter most. The headings will not carry equal weight: for a software company the technological and legal effects may dominate, for a mine the environmental and economic ones. A STEEPLE list is the start of an evaluation, not the evaluation itself.
    diagram: steeple
    points:
      - term: Social
        text: Jobs, skills, working conditions, people moving to the area for work, and the effects on local communities, health and culture.
      - term: Technological
        text: New production methods, management practices and digital systems, and whether local people learn to adapt and improve them or only to operate them.
      - term: Economic
        text: Investment, output and incomes, tax revenue, exports and imports, profits sent home, and the effect on local suppliers and competitors.
      - term: Environmental
        text: Pollution, waste, water and energy use, land use and the depletion of resources, set against any cleaner technology the MNC introduces.
      - term: Political
        text: The government's bargaining power and the incentives it offers, the influence the MNC may gain over policy, and the risk that it leaves.
      - term: Legal
        text: Whether the host's laws on employment, health and safety, competition, tax and the environment are strong and enforced, and whether the MNC keeps to them.
      - term: Ethical
        text: How the MNC behaves where the law is weak or silent, on pay, conditions, tax, bribery and honesty with communities. This is where its corporate social responsibility ([1.3](/topics/business-objectives/)) is tested.
      - term: Hofstede's cultural dimensions (toolkit)
        level: HL
        text: An HL toolkit tool for comparing national cultures. Large differences between the home and host country, for example in attitudes to hierarchy or to uncertainty, help to explain why an MNC's ways of managing may clash with local expectations, which affects both its success and the experience of its local employees.
    advantages:
      - Makes sure the analysis covers social, environmental, legal and ethical effects, not only jobs and money.
      - Gives a clear structure for a long answer, with each heading a possible paragraph.
      - Separates effects that are often confused, such as a law's existence and its enforcement.
    limitations:
      - It lists effects but does not weigh them; the judgement still has to be made.
      - The headings overlap. Weak labour laws are a legal, social and ethical issue at once.
      - It is only as good as the evidence, much of which comes from parties with an interest in the result.
    example:
      title: A STEEPLE scan of the Halvard plant
      fictional: true
      text: |
        - **Social:** 2,000 jobs in a province with high youth unemployment, and training for people new to factory work; but housing in the port town will come under pressure as workers move in.
        - **Technological:** battery production and automated assembly arrive, but the research stays at home unless Halvard opens a development centre or trains local engineers.
        - **Economic:** about $165 million a year stays in the province, 33% of sales; there is no corporate tax for ten years; local engineering firms may lose staff.
        - **Environmental:** heavy water use in a farming area, and hazardous waste that must be stored and treated safely.
        - **Political:** the provincial government has staked its reputation on the deal and may find it hard to enforce rules strictly against its largest employer.
        - **Legal:** the province's environmental rules are strict on paper, but its regulator has twelve inspectors for the whole coast.
        - **Ethical:** whether Halvard applies its home standards on safety and waste where local enforcement is weaker.

        A judgement from this scan: the economic and social gains are large and come quickly, while the environmental risk and the weak enforcement are what could reverse the balance. The conditions attached to water and waste may matter more to the province than the length of the tax holiday.
  - id: what-the-balance-depends-on
    title: What the balance depends on
    kind: evaluation
    body: |
      Whether an MNC is good or bad for a host country cannot be settled in general. The same company can be a valuable partner in one country and a burden in another, and the same investment can look different after ten years than after one. A strong evaluation names the factors that decide the balance in the case, says which way each points, and reaches a judgement that states its conditions.

      Two habits help. First, compare with the alternative: what would have happened without the MNC? Jobs at a new supermarket chain are not all new jobs if local shops close, and a tax holiday is a waste of public money if the company would have come anyway. Second, ask *for whom*. An investment can benefit a country on average while particular groups lose, and deciding whose interests come first is an ethical judgement, not only an economic one.
    points:
      - term: The type of investment
        text: A greenfield plant adds new capacity and jobs. An acquisition changes the owner of capacity that already exists and may bring job cuts as the business is reorganized, though it can also rescue a struggling local firm.
      - term: The industry and the motive
        text: Mining is capital-intensive, with few jobs but large royalties and environmental risks. Assembly is labour-intensive but footloose. Retailing competes directly with local businesses.
      - term: Links with the local economy
        text: The more an MNC buys from local suppliers and trains and promotes local managers, the more of its spending and know-how stays in the host. A plant that imports everything and fills its senior posts from abroad adds little beyond its wages.
      - term: The terms agreed
        text: Local content requirements, training commitments, environmental standards and the length of any tax holiday shape what the host receives.
      - term: The strength of the host's institutions
        text: Laws are only as good as their enforcement. Corruption, slow courts and under-resourced regulators let damaging practices go unchecked.
      - term: The MNC's own conduct
        text: Two companies in the same industry can behave very differently. Ethical objectives and CSR matter most where the law is weak.
      - term: The time horizon
        text: Construction jobs and tax receipts come quickly; technology transfer and supplier development take years; so can the costs of pollution or of a closure.
      - term: Who gains and who loses
        text: An overall gain can hide losers, such as the owners of local firms that close or communities moved off their land. A judgement should say whose interests it puts first.
    example:
      title: Gross jobs and net jobs
      fictional: true
      text: Brightwell Foods, the fictional supermarket chain, announces that its 40 stores have created 2,400 jobs. A study for the city council estimates that independent shops near the new stores cut 900 jobs in their first three years. The net gain is about 2,400 − 900 = 1,500 jobs, still positive but well below the company's figure. The jobs lost were mostly owners and family members running their own shops; the jobs gained are mostly employees, many of them part-time. Whether that is a good exchange depends on what the city values, not only on the number.
  - id: how-host-governments-shape-the-impact
    title: How host governments shape the impact
    kind: application
    body: |
      Host governments are not passive. They decide whether to let an MNC in, on what terms and under what rules, and those decisions shape much of the impact. They face a trade-off. Generous incentives and light rules attract investment but leave the host with a smaller share of its value; tough conditions capture more of the value but may send the company to a rival host.

      Their bargaining power varies. A country with a large and growing market, scarce resources or a skilled workforce can set conditions, because the MNC needs what only it can offer. A small country competing with many others for the same factory has far less room, and may find itself bidding against its neighbours with ever larger incentives. The terms are also not fixed for ever: once a plant is built, the company cannot easily move it, and some governments use that moment to raise taxes or tighten rules, which is one reason MNCs value political stability so highly.
    points:
      - term: Incentives
        text: Tax holidays, grants, subsidized land or energy, and special economic zones with lighter rules. They attract investment but cost public money, and they can draw companies that leave once the incentives end.
      - term: Local content requirements
        text: Rules that a share of components or services must be bought from local suppliers. They build links with the local economy but can raise the MNC's costs and lower its quality at first.
      - term: Local partners or ownership
        text: Requiring a joint venture with a local firm, which shares profits and know-how but can deter investors that want full control of their technology.
      - term: Training and employment commitments
        text: Targets for hiring and training local people, including for senior roles, so that skills stay when the MNC's managers move on.
      - term: Regulation and enforcement
        text: Employment, environmental, competition and tax law, including rules on transfer pricing, with regulators who have the resources to enforce them.
      - term: Screening
        text: Reviewing proposed investments in sensitive sectors, such as energy, defence or data, and approving them only with conditions, or not at all.
    example:
      title: Pricing a tax holiday
      fictional: true
      text: |
        Halvard expects the plant to make a profit of $75 million a year once it is running (simulated). At the province's corporate tax rate of 20%, the normal tax bill would be $15 million a year, so a ten-year tax holiday gives up about **$150 million** if profits stay at that level. Across the 2,000 direct jobs, that is **$7,500 per job each year**, or $75,000 per job over the decade.

        Is it worth it? Each job pays $25,000 a year in wages, and the plant buys $75 million a year from local suppliers, so the province gains far more than the tax it gives up, *if* the plant would not have come without the holiday. If Halvard would have chosen the province anyway, for its port and its workers, the holiday is a gift. A five-year holiday, costing $75 million, tied to a target of buying 30% of the plant's parts, materials and services locally ($105 million a year instead of $75 million) might keep most of the benefit at half the cost. The risk is that Halvard takes its plant to a rival province instead.
applications:
  - industry: Mining and energy
    text: Projects are capital-intensive, so a huge investment creates relatively few jobs, but royalties and taxes can fund a large share of public spending. The environmental and community risks are the highest of any sector. A host has most bargaining power when prices for its resource are high, and countries that come to rely on one resource export can find their other industries weakening.
  - industry: Manufacturing and assembly
    text: Plants employ many people and can build strong local supplier networks, through which technology spreads. Low-wage assembly is often footloose, so a host's aim is to move its workforce and suppliers up to more skilled work before rising wages push the MNC elsewhere.
  - industry: Hotels and tourism
    text: International hotel chains bring visitors, foreign currency and jobs. Much of the spending can leak abroad through imported food and drink, foreign managers and profits sent home, especially in all-inclusive resorts, and many of the jobs are seasonal. Pressure on water, coastlines and local culture can be heavy.
  - industry: Retail and fast food
    text: Chains bring choice, lower prices and modern supply chains, and some buy much of their food locally. Independent shops and markets may close. When a chain grows by franchising, local owners keep more of the profit, but the brand, the rules and the fees still come from abroad.
  - industry: Technology platforms
    text: Online platforms can serve a country with few local staff, so they create few direct jobs, and their profits are hard to tax where their users are. Local businesses may gain access to customers, advertising and payment systems, while regulators worry about data, competition and the platform's power over local firms.
  - industry: Pharmaceuticals and healthcare
    text: MNCs can bring new medicines, clinical expertise and research jobs. Their impact is debated over the prices of patented medicines in poorer host countries and over the ethics of running clinical trials where patients have few other options.
stakeholders:
  - group: Host government
    text: Gains tax revenue, jobs, growth and a reputation for attracting investors, but pays for incentives, loses some freedom over policy and carries the risk of a closure. It is in conflict with the MNC over tax and regulation, and with local firms that resent favours for a foreign competitor.
  - group: Local employees
    text: Gain jobs, training and often higher pay than local employers offer. But a single large employer can hold down wages in a small town, conditions vary between companies, and the jobs depend on decisions taken abroad. Their interest in pay conflicts with shareholders' interest in low costs.
  - group: Local businesses
    text: Suppliers gain orders and learn to meet higher standards; competitors face a powerful rival; and all may lose skilled staff to the MNC's higher pay. Local business owners are rarely of one mind about an MNC's arrival.
  - group: Local community and environmental groups
    text: Gain new roads, services and spending, but may bear the pollution, congestion, water use and loss of land. They often oppose the terms a government offers, which can delay or block a project.
  - group: Consumers in the host country
    text: Gain choice, lower prices and often better quality and safety standards, but may lose familiar local brands and see profits leave the country.
  - group: The MNC's shareholders and managers
    text: Seek returns from lower costs and new markets, which pushes them towards generous incentives and low taxes. Damage to the host can come back as protests, boycotts and stricter rules, so a company that plans to stay has a reason to care about its impact. Workers in the home country may also lose jobs when production moves abroad.
evaluation:
  - There is no general verdict. The impact depends on why the MNC came, the type of investment, the industry, its links with local suppliers, the terms agreed and the host's institutions, so a strong answer names these for the case and says which way they point.
  - Gross gains are not net gains. Jobs at the MNC may replace jobs lost at local competitors, and a factory may have come without the incentives offered for it. Asking what would have happened without the MNC is the most powerful question in this subtopic.
  - Time changes the balance. Construction jobs and tax revenue arrive quickly, technology transfer and supplier development take years, and so can pollution and the risk of a closure. A judgement should say over what period it holds.
  - Averages hide who wins and who loses. A host can gain overall while local firms, displaced communities or a town that depends on one employer lose. Whose interests come first is an ethical judgement, and ethics and sustainability are two of the course's four key concepts.
  - Bargaining power decides how the gains are shared. Hosts with large markets, scarce resources or skilled workers can set conditions; small hosts competing for the same investment often cannot. The same MNC may therefore behave differently in different countries.
  - The evidence is contested. Figures from the company, the government and pressure groups each serve a purpose, so say where the case's evidence is incomplete. The teacher support material notes that even a strong answer to a 10-mark question tends to score 4 marks or fewer if it stays theoretical and never applies its points to the case (p. 57).
decision:
  title: How should Halvard enter the province?
  fictional: true
  brief: |
    Halvard's board must decide how to start production in the coastal province from the situation above. It wants batteries coming off the line within three years, and expects the plant to make a profit of about $75 million a year once running. The provincial government will offer a tax holiday, but the opposition party and the environmental group are campaigning against what they call a giveaway to a foreign company, and an election is due in two years. The board has three proposals.
  options:
    - label: A wholly owned plant with the full tax holiday
      text: Halvard builds, owns and runs the plant, imports most components from its home suppliers and takes the ten-year tax holiday. It is the fastest route and gives full control of the technology. About a third of sales would stay in the province.
    - label: A joint venture with local conditions
      text: Halvard owns 60% of the plant and a local engineering group 40%. It commits to buying 30% of parts, materials and services locally by year five and to a training academy costing $4 million a year, and accepts a five-year tax holiday. Slower, with shared profit and control.
    - label: Buy and expand a local battery maker
      text: Halvard buys Pellam Power, a struggling local firm with 600 staff and an old factory, and expands it. Approvals are quicker and no farmland is needed, but the factory must be modernized and some of the 600 jobs may go.
  guidance: |
    Start with what each option does for the host, because Halvard's own risk depends on it. **Option A** keeps about a third of sales in the province and gives up corporate tax for ten years, roughly $75,000 per direct job. It is the most profitable on paper, but it is the option the opposition can most easily attack as a giveaway, and a deal that a new government reopens, or that a community delays in the courts, is worth less than its forecast suggests.

    **Option B** gives up part of the profit and control: the partner takes 40% of the profit, the academy costs $4 million a year and tax starts after five years. In return, more of each sale stays in the province, through local suppliers and the partner's share of the profit; the partner knows the regulators and the supply base; and the academy answers the engineering firms' complaint that Halvard will simply take their staff. The risks are slower decisions, disputes with the partner and local parts that may not meet Halvard's standards at first.

    **Option C** is quick to approve and spares the farmland, but it buys old capacity rather than adding new, so the province gains little at first, and job cuts at Pellam would turn the welcome sour.

    A strong judgement weighs these against Halvard's objectives and time horizon. If the board wants the quickest return and believes the political deal will last, A is defensible. If it means to stay for decades, B buys support and resilience at a cost it can estimate. Say what would change your mind: evidence that local suppliers can meet the quality standard, the opposition's chances at the election, or a rival province offering similar terms.
exam:
  - q: Define the term *host country*.
    marks: 2
    command: define
    level: SL/HL
    paper: '1'
    answer: |
      A strong response gives a precise definition in one or two sentences: a country in which a multinational company operates, other than its home country, where it has its head office.

      - A full definition makes the contrast with the home country clear.
      - "The country an MNC invests in" is only partly right, because it does not say that the host is outside the MNC's home country.
      - No example is needed, and an example cannot replace the definition.
  - q: Halvard Batteries, a fictional battery maker, plans a $900 million plant employing 2,000 people in a coastal province with high youth unemployment (see the situation above). Explain **two** benefits the plant could bring to the host country.
    marks: 4
    command: explain
    level: SL/HL
    paper: '1'
    answer: |
      A strong response identifies two distinct benefits and explains each with a reason, applied to Halvard and the province. For example:

      - **Jobs and incomes:** 2,000 direct jobs in a province with high youth unemployment, plus indirect jobs at local suppliers and in the shops where employees spend their wages.
      - **Technology transfer and skills:** workers new to factory work are trained in battery production and automated assembly, skills that can later spread to local firms.
      - Other valid choices include investment the province could not raise itself, orders for local parts makers, infrastructure, and exports earning foreign currency.

      Tax revenue is a weak choice for this case, because the plant pays no corporate tax for ten years; a response that spots this shows good use of the stimulus. The teacher support material notes that answers to AO2 questions without application to the case are typically limited to half the marks (p. 56).
  - q: Distinguish between a greenfield investment and the acquisition of a local firm as ways for an MNC to enter a host country, in terms of their impact on the host.
    marks: 4
    command: distinguish
    level: SL/HL
    paper: '1'
    answer: |
      A strong response makes the difference clear on both sides, rather than describing each separately.

      - **Greenfield:** the MNC builds new facilities, so it adds new capacity, construction work and new jobs to the host economy, but it may use new land and compete with existing firms.
      - **Acquisition:** the MNC buys a business that already operates in the host, so at first the capacity and jobs already exist; the host gains a new owner, possibly new investment and know-how, but the business may be reorganized with job cuts, and decisions move abroad.
      - The key distinction: a greenfield investment adds to what the host has, while an acquisition changes who owns it. An acquisition can still benefit the host, for example by rescuing a struggling firm.
  - q: |
      Halvard forecasts these figures for the plant's first full year (all $ million): sales 500; components and materials imported from its home country 275; purchases from local suppliers 75; wages for 2,000 local employees 50; energy, water, transport and premises from local providers 25; profit 75, of which 60 will be sent to the home country and 15 reinvested in the plant. No corporate tax is due during the tax holiday.

      Using these figures, comment on how much of the plant's sales revenue would stay in the host country.
    marks: 4
    command: comment
    level: SL/HL
    paper: '1'
    answer: |
      A strong response works out the figure, then makes a judgement about it.

      - Revenue that stays in the host: 75 + 50 + 25 + 15 = **$165 million**, which is 165 ÷ 500 × 100 = **33%** of sales.
      - Revenue that leaves: imports of $275 million (55%) and repatriated profit of $60 million (12%), 67% in all.
      - Judgement: $165 million a year is a large injection for one province, but two-thirds of the revenue leaves, mainly because most components are imported, and during the tax holiday the government receives no corporate tax.
      - A top response adds what would raise the share, such as buying more parts locally, reinvesting more profit or taxing profit after the holiday, and notes that these are the company's own forecasts.
  - q: Analyse how a ten-year tax holiday affects the balance of benefits and costs of Halvard's plant for the host country.
    marks: 6
    command: analyse
    level: SL/HL
    paper: '1'
    answer: |
      A strong response breaks the question into its parts and links each to the case.

      - **The benefit it may secure:** the holiday may be what persuades Halvard to choose this province over rivals, bringing 2,000 jobs, $75 million a year of local purchases and $50 million of wages.
      - **The cost:** at a 20% tax rate on a $75 million profit, the province gives up about $15 million a year, $150 million over ten years, or $7,500 per job each year.
      - **The counterfactual:** if Halvard would have come anyway for the port and the workforce, the holiday is a transfer from taxpayers to the company with no gain.
      - **The risk:** investment attracted mainly by incentives can be footloose, leaving when the holiday ends, as low-cost plants sometimes do.
      - A strong analysis ends by identifying what the balance depends on, such as whether a shorter holiday tied to local purchasing or training targets could secure similar benefits at lower cost.
  - q: Evaluate the likely impact of Halvard Batteries' plant on its host country.
    marks: 10
    command: evaluate
    level: SL/HL
    paper: '1'
    answer: |
      A strong response weighs strengths and limitations, uses the case throughout and reaches a supported judgement. One way to organize it:

      - **Define and frame:** an MNC operating in a host country; the question is whether the benefits to the province outweigh the costs, and for whom.
      - **Benefits, applied:** 2,000 jobs where youth unemployment is high; training and technology; local orders for parts makers; $165 million a year staying in the province, about a third of sales.
      - **Costs, applied:** no corporate tax for ten years; water use in a farming area and hazardous waste; engineering firms losing staff; profit sent home; the risk of a footloose exit when the holiday ends.
      - **What the balance depends on:** whether Halvard buys more locally over time, whether the regulator can enforce environmental rules, and whether the plant would have come without the incentive. A STEEPLE scan helps to show that the environmental and political factors could reverse the economic gains.
      - **Judgement:** for example, that the plant is likely to benefit the province overall, because the jobs and local spending are large and immediate, *provided* conditions on water, waste and local purchasing are agreed and enforced; without them, the costs could fall heavily on farmers and the town.
      - **Limits of the evidence:** the figures are the company's forecasts, and nothing is known about Halvard's conduct elsewhere.

      The teacher support material advises at least two arguments for and two against when evaluating one option, each applied to the case, and a conclusion that goes beyond repeating them (p. 56). A list of general advantages and disadvantages of MNCs, not applied to Halvard, scores low.
summary:
  - An **MNC** owns or controls operations in more than one country, directed from its **home country**; every other country it operates in is a **host country**.
  - 'MNCs enter through **foreign direct investment**: greenfield sites, acquisitions or joint ventures. Exporting alone does not make a business multinational.'
  - Companies invest abroad for new markets, lower costs, resources, to get round trade barriers, for scale and for incentives. The motive predicts much of the impact.
  - Possible benefits for the host are jobs and incomes, capital, technology transfer and skills, tax, exports, orders for local suppliers, infrastructure, and choice for consumers.
  - Possible costs are local firms forced out, profits sent home, tax avoidance through transfer pricing, the cost of incentives, poor conditions in some cases, environmental damage, footloose plants, skills drawn away, and political and cultural influence.
  - The share of revenue that stays in the host, through local purchases, wages, taxes and reinvested profit, is a practical test of the benefit.
  - The balance depends on the type of investment, the industry, local links, the terms agreed, the host's institutions, the MNC's conduct and the time horizon.
  - Host governments shape the impact through incentives, conditions and enforcement, limited by their bargaining power.
  - STEEPLE structures the evaluation; the judgement must say who gains, who loses, over what period, and compared with what alternative.
connections:
  - code: '1.5'
    text: Acquisitions, joint ventures, strategic alliances and franchising are how many MNCs enter host countries, and economies of scale are one of their motives.
  - code: '1.4'
    text: An MNC's impact lands differently on each stakeholder group, and the conflicts between them, such as host communities against shareholders, are central to evaluating it.
  - code: '1.3'
    text: Ethical objectives and corporate social responsibility decide how an MNC behaves where a host's laws are weak or poorly enforced.
  - code: '5.4'
    text: Location decisions, including offshoring and reshoring, explain why MNCs arrive in a host country and why they sometimes leave.
  - code: '4.6'
    text: At HL, the opportunities and threats of operating in international markets are the other side of the same investment, seen from the company's point of view.

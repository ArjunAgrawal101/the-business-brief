retrieval:
  - q: Why are location decisions so important?
    a: They are long-term, costly and hard to reverse, and they affect a business's costs, speed of delivery, access to staff, quality and reputation.
  - q: Distinguish between quantitative and qualitative location factors, with an example of each.
    a: Quantitative factors can be measured in money, such as rent or wages. Qualitative factors cannot easily be, such as the skills of the local workforce or political stability.
  - q: Why do bulk-increasing businesses tend to locate near their customers?
    a: Their products are heavier, bulkier or more perishable than their materials, so transporting the finished product is the larger cost.
  - q: What is industrial inertia?
    a: The tendency of a business or industry to stay in a location after the original reasons for it have faded, because moving would lose its workforce, suppliers, reputation and existing buildings.
  - q: Two factors have weights of 3 and 2. Site X scores 8 and 5; site Y scores 6 and 9. Which has the higher weighted score?
    a: 'Site X: 3 × 8 + 2 × 5 = 34. Site Y: 3 × 6 + 2 × 9 = 36. Site Y scores higher.'
  - q: Give two limitations of weighted scoring.
    a: For example, the weights and scores are subjective, the total gives false precision, a high total can hide a weakness that should rule a site out, and factors left out are ignored.
  - q: What is the difference between outsourcing and offshoring?
    a: Outsourcing changes who does the work (another firm); offshoring changes where it is done (another country). A move can be both.
  - q: Define insourcing and reshoring.
    a: Insourcing brings work done by an outside firm back in-house; reshoring brings work done abroad back to the home country.
  - q: What is landed cost, and why does it matter?
    a: The full cost of a bought-in product delivered to the business, including freight, duties, inspection and stock in transit. It shows the true saving from offshoring, which the supplier's price alone overstates.
  - q: Give two reasons why a business might reshore production.
    a: For example, rising costs abroad, long and unreliable supply chains, quality problems, the need for faster response, protection of know-how, automation reducing the importance of wages, and customers who prefer local products.
  - q: Why is outsourcing riskier for core activities?
    a: Core activities are what make the business distinctive; handing them to another firm loses control of the quality customers value and may share know-how with potential rivals.

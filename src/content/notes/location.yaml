# Notes: 5.4 Location. Written in the platform's own words from the guide's two
# content statements (p. 34): the reasons for a specific location of
# production (AO2), and outsourcing or subcontracting, offshoring, insourcing
# and reshoring, nationally and internationally (AO3). Weighted scoring is not
# named in the guide; it is taught as a standard technique, labelled so, and
# matches the Operations Floor's location tool (src/lib/operations.ts).
# Nearshoring is mentioned only as everyday usage beyond the guide. HL material
# (Hofstede's cultural dimensions and make or buy analysis, both HL toolkit
# tools) sits in HL points that the SL view hides. The teacher support
# material's glossary (pp. 84, 87, 89 and 90) and its notes on outsourcing (pp.
# 36 and 70) were read to check definitions and scope; nothing from them is
# reproduced. No coursebook chapter for 5.4 was supplied. Calder Packs, its
# three towns and the four businesses in the second example are fictional, and
# every figure was checked by script.
code: '5.4'
title: Location
level: SL/HL
introduction: |
  Where a business makes its products shapes its costs, its speed, its quality and its reputation, and the choice is hard to undo once a factory is built or a supplier contract signed. Many of the biggest operations decisions of recent decades have been about location: moving production to cheaper countries, handing it to specialist firms, and, more recently, bringing some of it back.

  This subtopic covers the reasons for a specific location of production (AO2), and the four ways of reorganizing production that the guide names, outsourcing or subcontracting, offshoring, insourcing and reshoring (AO3). The second statement asks for judgement: when moving work to another firm or another country pays, and when it costs more than it saves.
objectives:
  - '**Explain** the quantitative and qualitative reasons for a specific location of production.'
  - '**Analyse** how the type of business and its product shape its location, including clustering and industrial inertia.'
  - '**Apply** cost comparisons and weighted scoring to choose between locations, and **comment** on their limits.'
  - '**Distinguish** between outsourcing or subcontracting, offshoring, insourcing and reshoring.'
  - '**Evaluate** decisions to outsource, offshore, insource or reshore production, using the full landed cost.'
situation:
  title: The cheap pack that was not so cheap
  fictional: true
  text: |
    Calder Packs, a fictional business, designs hiking backpacks at its studio in its home country. For nine years the packs have been sewn by a contract manufacturer on another continent, which charges $21.50 a pack, almost $9 less than a pack would cost to make at home. Lately the savings have looked thinner. Shipments have arrived up to seven weeks late, a batch of 3,000 packs had to be recalled for weak seams, and in a customer survey two-thirds of buyers said they would pay at least $5 more for a pack made in their own country.

    The founder, Iona Calder, has three choices: stay with the current supplier and check its work more closely, move sewing to a contract manufacturer in a neighbouring country, or open Calder's own workshop at home, in one of three towns. Her finance director warns that the factory price is not the whole cost; her head of design says the real problem is control.

    Where should Calder make its packs, and should it make them itself at all?
sections:
  - id: why-location-matters
    title: Why location matters
    kind: concept
    body: |
      Where a business produces affects almost everything about it: its costs, how quickly it can reach customers, the people it can employ, the quality it can achieve, and how customers and communities see it. Location decisions are long-term, expensive and hard to reverse. Once a factory is built or a lease signed, moving again means new costs, lost staff and disrupted customers, so a poor choice can burden a business for decades.

      A business faces a location decision when it starts up, when it expands, when it relocates because costs or markets have changed, and when it reorganizes production, for example by moving work to another firm or another country. The decision can be national, choosing between regions or towns, or international, choosing between countries, where currencies, laws, cultures and trade barriers add to the factors.

      The guide sets the reasons for a specific location at AO2, so you need to explain how particular factors make a location suitable for a particular business. A good decision follows a sequence: decide what the operation needs, draw up a shortlist, compare the sites on measurable costs and on qualitative factors, and decide, knowing that the comparison rests on forecasts and judgements.
    points:
      - term: Starting up
        text: A new business often chooses a location it can afford near its first customers, or near the founder's home, which may not be where it would choose later.
      - term: Expanding
        text: A growing business may extend its site, open a second one or move to larger premises.
      - term: Relocating
        text: A business moves when its costs, its market or its needs change enough to justify the disruption.
      - term: Reorganizing production
        text: A business moves work to another firm, or to or from another country, by outsourcing, offshoring, insourcing or reshoring, covered later in these notes.
    example:
      title: Where Calder works now
      fictional: true
      text: |
        Calder Packs keeps its design studio in its country's capital, where it can recruit designers and is close to the outdoor brands, magazines and retailers that shape its market. Its warehouse sits beside a motorway near the main port. Its packs have been sewn for nine years by a contract manufacturer on another continent, chosen because wages there were much lower.

        Each part of the business is located for a different reason, and the question now is whether the reason for the third still holds.
  - id: location-factors
    title: Reasons for a specific location
    kind: types
    body: |
      The factors that influence where a business produces are usually divided into two kinds. **Quantitative factors** can be measured in money and compared directly: the cost of land and buildings, wages, transport, energy and other utilities, taxes, government grants and tariffs. **Qualitative factors** cannot easily be given a money value but can matter just as much: the skills of the local workforce, the quality of the infrastructure, nearness to customers and suppliers, political stability, regulation, culture, the quality of life for staff and the attitude of the local community.

      No location is best on every factor. A cheap site may be far from customers; a city site may be close to customers and skilled people but expensive. A business must decide which factors matter most for its own operation, which is why the same town can be ideal for a call centre and hopeless for a steelworks.

      Governments use location factors deliberately. Grants, tax breaks and cheap land attract businesses to areas that need jobs, while planning rules and environmental laws limit where some activities can go. In international decisions, trade agreements, tariffs, exchange rates and political risk come into play as well.
    points:
      - term: Land and building costs
        text: Rent, or the price of land and premises, which varies greatly between city centres, suburbs and rural areas, and between countries.
      - term: Labour
        text: The cost of wages and the availability of workers with the right skills. Low wages are worth little if the skills are missing, and scarce skills can justify high costs.
      - term: Transport and access to markets
        text: The cost and time of moving materials in and products out. Bulky, fragile or perishable products are expensive to move far, and services delivered in person must be close to their customers.
      - term: Infrastructure
        text: Roads, ports, railways and airports, reliable power and water, and fast internet connections.
      - term: Suppliers and clusters
        text: Nearness to suppliers cuts delivery costs and times. Where many firms in one industry gather, a **cluster**, they share skilled workers, specialist suppliers and ideas, the external economies of scale of 1.5.
      - term: Government incentives and regulation
        text: Grants, tax breaks and cheap land offered to attract investment, set against the planning rules, taxes and regulations that can add cost or delay.
      - term: Trade barriers and market access
        text: Producing inside a market can avoid tariffs and quotas on imports, and a trade agreement can make producing in a neighbouring country almost as easy as producing at home.
      - term: Political and economic stability
        text: Stable government, the rule of law and a stable currency reduce the risk that a costly investment is lost to unrest, seizure or sudden swings in exchange rates.
      - term: Quality of life and culture
        text: Housing, schools, safety and amenities affect whether skilled staff and managers will move to an area; language and business culture affect how easily a site abroad can be managed.
      - term: Environment and community
        text: Local attitudes to noise, traffic and pollution, environmental laws, and the business's own sustainability aims, such as cutting the emissions from transport.
    example:
      title: Four businesses, four reasons
      fictional: true
      text: |
        - **Greystone Quarries**, a fictional stone producer, works where the stone is. Stone is heavy and loses much of its value if it travels far, so the quarry, and the cutting yard beside it, cannot move.
        - **Orchardgate Juices**, a fictional bottler, presses fruit within an hour of its orchards, because fresh fruit spoils, and sends the juice to the cities in refrigerated lorries.
        - **Northlight Data**, a fictional data centre, chose a cool region with cheap renewable electricity, because cooling and power are its largest costs and its customers reach it online from anywhere.
        - **Pinto Hair**, a fictional salon, needs a busy street where its customers live and work; for a service delivered in person, being near customers outweighs a higher rent.
  - id: location-patterns
    title: How the type of business shapes its location
    kind: application
    body: |
      The factors combine in recognizable patterns. **Primary** businesses, such as farms, mines and fishing fleets, must go where the resources are. In **manufacturing**, the deciding factor is often the cost of transport. A process that turns heavy, bulky materials into lighter products, such as smelting ore into metal, is **bulk-reducing** and tends to locate near its materials; a process that makes products heavier, bulkier or more perishable than their materials, such as bottling drinks or baking bread, is **bulk-increasing** and tends to locate near its customers. Where labour is a large share of costs and products are light and easy to ship, as with clothing and electronics assembly, labour costs and skills dominate, which is why so much of this work moved to lower-wage countries.

      **Services** delivered in person, such as shops, restaurants, gyms, banks and hospitals, must locate near their customers, so they weigh footfall and convenience against rent. Services delivered online, such as software, design and customer support, can locate almost anywhere, so they follow talent, costs, time zones and the rules on data. Many knowledge businesses still gather in a few cities, because skilled people and ideas concentrate there.

      Two effects explain locations that the factors alone cannot. **Clustering** draws firms in the same industry together, and once a cluster exists it attracts more firms, workers and suppliers, so it reinforces itself. **Industrial inertia** is the tendency of a business or an industry to stay where it is after the original reasons have faded, because moving would mean losing a trained workforce, nearby suppliers, a local reputation and the buildings and equipment already paid for.
    points:
      - term: Bulk-reducing
        text: Processes whose products weigh less than their materials, so they locate near the materials to cut transport costs.
      - term: Bulk-increasing
        text: Processes whose products weigh more, take up more space or perish faster than their materials, so they locate near customers.
      - term: Footloose
        text: Businesses that can locate almost anywhere because transport is a small share of their costs, such as software firms and many online services.
      - term: Clustering
        text: Firms in the same industry locating close to one another to share skilled workers, specialist suppliers, customers and ideas. Crowding can push up rents and wages.
      - term: Industrial inertia
        text: Staying in a location after the original reasons for choosing it have weakened, because the costs and losses of moving outweigh the gains.
    example:
      title: Why packs travel well
      fictional: true
      text: |
        A backpack is light, compact and does not spoil, so shipping it across the world costs Calder $2.40 a pack, about a ninth of the factory price, while sewing it takes hours of skilled labour. For a light, labour-intensive product, wages outweigh transport, which is why Calder could offshore its sewing in the first place.

        The same logic explains why its design studio stays in the capital: there, the scarce input is talent, not labour hours.
  - id: comparing-locations
    title: 'Comparing locations: costs and weighted scoring'
    kind: method
    body: |
      Because no location wins on every factor, businesses use methods that bring the factors together. The first is a **cost comparison**: forecast the annual costs of each site, such as rent, wages, transport, energy and taxes, less any grants, and compare the cost per unit of output. A cost comparison can be extended with the tools of other subtopics: a break-even analysis for each site (5.5), an investment appraisal of the cost of setting up (3.8), or a decision tree where the outcome is uncertain (toolkit).

      The second is **weighted scoring**, which also brings in qualitative factors. The guide does not name it and it is not a required calculation, but it is widely used, and it makes a judgement explicit and open to challenge. The business lists the factors that matter, gives each a **weight** for its importance, **scores** each site on each factor, multiplies each score by its weight and adds the results. The site with the highest total is the strongest on the business's own priorities.

      A weighted score looks objective, but it is built from judgements: someone chose the factors, the weights and the scores. Two checks make it more useful. Test its **sensitivity** by changing the weights to see whether the ranking changes, because a ranking that flips with a small change is a close call, not a clear answer. And look for **fatal weaknesses** that a total can hide, such as a site that scores well overall but has no reliable power supply. The [Operations Floor's location tool](/operations-floor/#ix-ops-location-marigold) lets you set the weights yourself for a fictional restaurant chain and see where its ranking changes.
    formulas:
      - name: Weighted score
        expression: Weighted score of a site = the sum of (weight of each factor × the site's score on that factor)
        note: Not in the guide; a standard way of comparing options. Agree the weights before the sites are scored, so that they are not chosen to favour one site.
    advantages:
      - Brings quantitative and qualitative factors into one comparison.
      - Makes priorities explicit, so they can be discussed and challenged.
      - Simple to build and to explain to others.
      - Allows the ranking to be tested by changing the weights.
    limitations:
      - The weights and scores are subjective, and a preferred site can be favoured without anyone noticing.
      - Totals give a false sense of precision.
      - A high total can hide a weakness that should rule a site out.
      - Factors that are left out, such as the owners' own preferences, play no part.
    example:
      title: Choosing Calder's town
      fictional: true
      text: |
        If Calder makes its packs at home, it must choose between three towns. Its managers weight five factors from 1 to 5 and score each town from 1 (poor) to 10 (excellent).

        - **Brennock**, an old textile town: skilled sewing labour 9 × 5 = 45, rent 8 × 4 = 32, transport links 4 × 3 = 12, grant 8 × 2 = 16, quality of life 5 × 1 = 5, a total of **110**.
        - **Torvale**, a business park by the motorway: 6 × 5 + 6 × 4 + 8 × 3 + 5 × 2 + 6 × 1 = **94**.
        - **Dunmere**, a city near the warehouse: 5 × 5 + 3 × 4 + 9 × 3 + 2 × 2 + 8 × 1 = **76**.

        Brennock leads clearly, with 110 of a possible 150. But the ranking rests on the weights. If computer-controlled cutting made sewing skill less important (a weight of 3), the grant were withdrawn (a weight of 0) and transport mattered more (5), Torvale would score 88 to Brennock's 84. Brennock's low score for transport also needs checking: if its road to the port is often closed in winter, no total could make up for it.
  - id: reorganizing-production
    title: 'Reorganizing production: four ways'
    kind: types
    body: |
      The guide names four ways of reorganizing production, both nationally and internationally (p. 34), and sets them at AO3. They answer two separate questions, as the diagram shows: **who** does the work, the business itself or another firm, and **where** it is done, at home or abroad.

      **Outsourcing**, which the guide pairs with **subcontracting**, moves work from the business to another firm, which may be in the same country or abroad. **Insourcing** reverses it, bringing outsourced work back to the business's own staff and facilities. **Offshoring** moves work from the home country to another country, either to the business's own operation abroad or to a foreign supplier. **Reshoring** reverses it, bringing work back to the home country. One move can combine both: outsourcing to a firm abroad is offshoring as well, and bringing that work back to the business's own factory at home is both insourcing and reshoring.

      These moves apply to almost anything a business does, not only manufacturing: customer service, accounting, IT, cleaning, design and logistics are often outsourced, and many have been offshored. The decision is never purely about cost. It is also about control, quality, speed, risk and responsibility, which is why businesses that once outsourced or offshored sometimes reverse course.
    points:
      - term: Outsourcing or subcontracting
        text: Paying another business to carry out an activity that the business used to do, or could do, itself. In everyday use, subcontracting often means passing part of a particular contract or project to another firm, while outsourcing means handing over a whole activity for the long term; the guide treats them together.
      - term: Offshoring
        text: Carrying out an activity in another country instead of the home country, through the business's own site abroad or through a foreign supplier.
      - term: Insourcing
        text: Bringing back in-house work that an outside firm had been doing.
      - term: Reshoring
        text: Bringing work that had been moved abroad back to the home country. Moving it to a neighbouring country instead, often called nearshoring, is a related idea that the guide does not name.
    diagram: reorganizing-production
    example:
      title: Calder's choices, mapped
      fictional: true
      text: |
        Calder's current arrangement, with sewing done by a contract manufacturer on another continent, is outsourced and offshored. Moving to a contract manufacturer in a neighbouring country would keep the work outsourced and offshore, but much closer: nearshoring. Opening its own workshop at home would be insourcing and reshoring at once.

        Smaller moves sit alongside the big one: if Calder opened its own workshop but hired a cleaning firm to look after it, that would be a small act of outsourcing.
  - id: outsourcing-and-offshoring
    title: 'Outsourcing and offshoring: benefits, costs and risks'
    kind: evaluation
    body: |
      Businesses outsource and offshore mainly to cut costs and to gain capabilities they lack. A specialist supplier may do the work more cheaply, because of its scale and expertise, and offshoring can reach much lower wages and rents. Outsourcing also turns fixed costs into variable ones, since the business pays for what it orders rather than for its own staff and equipment, and it frees managers to concentrate on the activities that make the business distinctive, such as design, brand and customer relationships. Offshoring can bring a business closer to new markets, and a site inside a market may avoid the tariffs charged on imports.

      The costs and risks are less visible. The business gives up direct control of quality, delivery and working conditions, so it must specify, inspect and manage the supplier, which costs time and money. Long supply chains add freight, insurance, duties, stock to cover weeks in transit, and exposure to delays, disruption and exchange rates. Communication across languages, time zones and business cultures is harder, and sharing designs can put intellectual property at risk. At home, jobs are lost, which can damage morale and reputation. And in customers' eyes the business stays responsible for how its products are made, so poor labour standards or environmental damage at a supplier become the brand's problem too.

      The usual conclusion is to outsource activities that are not central to what makes the business distinctive and that suppliers can do better or more cheaply, and to keep **core** activities in-house. Judging a proposal means comparing the full **landed cost**, the risks and the ethical exposure, not the supplier's headline price.
    points:
      - term: Landed cost
        text: The full cost of a product delivered to the business, namely the supplier's price plus freight, insurance, duties, inspection and the cost of holding stock in transit. It is the right figure to compare with the cost of making the product at home.
      - term: "Hofstede's cultural dimensions (toolkit)"
        level: HL
        text: An HL toolkit tool that helps explain why working with a supplier abroad can be difficult. In a culture with high power distance, for example, staff may be reluctant to report problems to senior people, so faults surface late; differences in uncertainty avoidance shape attitudes to rules, schedules and change.
      - term: Make or buy (toolkit)
        level: HL
        text: An HL toolkit tool, part of contribution, that compares the cost of making a product or part in-house with the price of buying it in (5.6). The comparison should include qualitative factors, such as control of quality and reliability of supply, as well as the figures.
    advantages:
      - Lower costs, from suppliers' scale and expertise or from lower wages and rents abroad.
      - Fixed costs become variable, so the business is more flexible when demand changes.
      - Managers can concentrate on core activities, such as design, brand and customers.
      - Access to skills, capacity and markets the business does not have.
    limitations:
      - Less control over quality, delivery times and working conditions.
      - Hidden costs of freight, duties, inspection, stock and management erode the savings.
      - Long supply chains bring delays and exposure to disruption and exchange rates.
      - Job losses at home, risks to intellectual property, and ethical exposure if suppliers treat workers or the environment badly.
    example:
      title: The real cost of a pack from abroad
      fictional: true
      text: |
        Comparing the factory price of $21.50 with the $30.30 a pack would cost in Calder's own workshop at home suggests that offshoring saves $8.80 a pack, or 29%. The landed cost tells a different story:

        - Factory price: $21.50
        - Sea freight and insurance: $2.40
        - Import duty at 8% of the factory price: 0.08 × $21.50 = $1.72
        - Inspection visits and agents: $0.90
        - Holding stock through the weeks at sea: $1.10
        - **Landed cost: $27.62** a pack

        The hidden costs add $6.12 to every pack. The real saving is $30.30 − $27.62 = **$2.68** a pack, 8.8%, or $160,800 a year on 60,000 packs. That is still worth having, but it must be weighed against seven-week delays, a recall and the loss of control that caused them.
  - id: insourcing-and-reshoring
    title: 'Insourcing and reshoring: bringing production back'
    kind: evaluation
    body: |
      Businesses bring work back when the reasons for moving it have weakened. Wages and costs rise in countries that were once cheap; freight costs and delivery times rise, and disruptions to long supply chains expose the cost of depending on distant suppliers; and automation reduces the share of labour in costs, so cheap labour matters less. Insourcing restores direct control of quality and of know-how the business did not want to share. Reshoring shortens supply chains, so the business can respond faster to changes in demand, hold less stock and cut the emissions of transport. Some customers prefer products made in their own country and may pay more for them, and some governments offer incentives to bring production home.

      Bringing work back is expensive and slow. The business must invest in buildings and equipment, recruit and train staff, often in skills that have faded locally, and accept higher wage costs. It loses the supplier's scale and specialist expertise, and fixed costs return to its own accounts, so it carries more risk if demand falls. The decision therefore depends on volume, on how much labour the product needs once automated, on how much customers value speed, quality and origin, and on how much risk the business can bear.
    advantages:
      - Direct control of quality, delivery and working conditions.
      - Faster response to changes in demand, with shorter lead times and less stock.
      - Protection of know-how and intellectual property.
      - A "made at home" story that some customers value, and lower transport emissions.
    limitations:
      - Higher wage and running costs, especially for labour-intensive work.
      - Large investment in premises, equipment and training.
      - Skills may be scarce at home after years of offshoring.
      - More fixed costs, and more risk, carried by the business itself.
    example:
      title: Calder's workshop at home
      fictional: true
      text: |
        A workshop in Brennock would cost $650,000 to equip, less a government grant of $150,000. Computer-controlled cutting would keep labour to $13.30 a pack, and materials would cost $9.50, a variable cost of $22.80; rent, machines and managers would add fixed costs of $420,000 a year. Delivery to the warehouse and the small stock held would add $0.50 a pack.

        - **At 60,000 packs a year:** $22.80 + ($420,000 ÷ 60,000) + $0.50 = $22.80 + $7.00 + $0.50 = **$30.30** a pack.
        - **At 80,000 packs a year:** $22.80 + $5.25 + $0.50 = **$28.55** a pack.

        Lead times would fall from about nine weeks to one, and Calder would control every seam. Whether that is worth $2.68 a pack more than today depends on growth, and on whether buyers really pay more for a pack made at home.
applications:
  - industry: Car manufacturing
    text: Car plants are huge, long-term investments, usually placed inside large markets to avoid tariffs and close to clusters of component suppliers, whose parts arrive just in time. Location decisions are made for decades, and a plant's closure can reshape a whole region.
  - industry: Clothing and footwear
    text: Labour-intensive and light to ship, so much production moved to lower-wage countries, usually through contract manufacturers. The industry shows the ethical risks of long supply chains most clearly, and fast-moving fashion brands increasingly use suppliers closer to their markets for speed.
  - industry: Software and IT services
    text: Programming, testing and customer support are often outsourced or offshored to places with skilled engineers at lower cost. Time zones can allow round-the-clock work, but communication, data protection and quality must be managed with care.
  - industry: Food processing
    text: Perishable and often bulky products tie processors to their farms or to their markets. Local sourcing can also be a selling point, so location is part of the product's story as well as its cost.
  - industry: Retail and hospitality
    text: Services delivered in person must be where their customers are, so footfall, visibility and convenience are weighed against rent. Back-office work, such as accounts and booking systems, is often outsourced while the customer-facing operation stays in-house.
stakeholders:
  - group: Employees at home
    text: Lose jobs when work is outsourced or offshored, and may gain them when it is reshored, though the new jobs may need different skills. Outsourcing even part of a function can unsettle the staff who remain.
  - group: Workers at suppliers abroad
    text: Gain jobs and incomes from offshored work, but depend on the business and its suppliers for fair pay and safe conditions. A business that buys only on price can push suppliers to cut corners on both, and reshoring ends their work.
  - group: Customers
    text: Gain from lower prices, but suffer when quality slips or deliveries are late. Some value products made locally or ethically and will pay more for them, which can conflict with owners seeking the lowest cost.
  - group: Owners and shareholders
    text: Seek lower costs and flexibility from outsourcing and offshoring, but carry the risks of disruption and reputational damage. Reshoring may raise costs in the short term in exchange for control and resilience.
  - group: Governments and local communities
    text: Compete with grants and tax breaks to attract production, gain jobs and taxes when a plant arrives and suffer when it leaves, and weigh those jobs against traffic, noise and emissions.
evaluation:
  - Location factors pull in different directions, so the best site is the one that fits the operation's most important needs. Quantitative factors are easier to measure, but qualitative ones, such as skills and stability, often decide.
  - Weighted scoring makes a judgement explicit, not objective. Its weights and scores are opinions, so test whether the ranking survives a change of weights, and look for weaknesses that should rule a site out whatever its total.
  - Headline savings from offshoring are often smaller than they look. Freight, duties, inspection, stock in transit and management time erode them, so compare full landed costs, and then weigh the risks of delay, disruption and poor quality.
  - Outsourcing trades control for cost and flexibility. It usually suits activities outside the business's core, and is riskiest for the activities that make the business distinctive or that depend on quality customers can see.
  - No reorganization is permanent. Changes in wages, freight costs, technology, trade rules and customers' preferences can turn yesterday's offshoring into today's reshoring, so judge each decision on current evidence.
  - Responsibility does not end at the factory gate. Customers, the media and the law increasingly hold a business to account for its suppliers' labour and environmental standards, so ethics belongs in every outsourcing decision.
decision:
  title: Where should Calder make its packs?
  fictional: true
  brief: |
    Calder Packs, a fictional business, sells about 60,000 backpacks a year. Its packs, sewn by a contract manufacturer on another continent, have a landed cost of $27.62 each, but arrive up to seven weeks late, and a batch of 3,000 was recalled this year. In a survey, two-thirds of buyers said they would pay at least $5 more for a pack made in their own country. Iona Calder has three options.
  options:
    - label: Stay, and check more closely
      text: Keep the current supplier and pay an independent inspector at the factory, $0.35 a pack, raising the landed cost to $27.97. The lead time stays at about nine weeks.
    - label: Nearshore
      text: Move sewing to a contract manufacturer in a neighbouring country inside a trade agreement, so no duty is paid. Landed cost $27.90 a pack; lead time two weeks.
    - label: Reshore and insource
      text: Open Calder's own workshop in Brennock, costing $650,000 to equip less a $150,000 grant. Cost per pack $30.30 at 60,000 packs a year, or $28.55 at 80,000; lead time one week.
  guidance: |
    Begin with the full costs. Options A and B cost almost the same, $27.97 and $27.90 a pack, so nearshoring buys a seven-week cut in lead time and easier oversight at no extra cost. It keeps the work outsourced, though, so control of quality still rests with another firm. Option C costs $2.33 a pack more than A at today's volume, $139,800 a year, but only $0.58 more at 80,000 packs, so its case depends heavily on growth.

    The survey is the swing factor, and it is weak evidence (4.4): saying you would pay $5 more is not the same as paying it. If the premium did hold on all 60,000 packs, it would bring in $300,000 a year, cover the extra cost and repay the net investment of $500,000 in a little over three years. If it does not, option C adds cost and risk for benefits of speed and control that option B delivers more cheaply.

    Weigh the qualitative factors too. Calder's brand rests on quality, which argues for control, and the recall shows the cost of distance. Reshoring would create jobs at home and cut transport emissions, while ending work for the supplier's employees abroad. A strong answer might recommend B now, with a test of the "made at home" premium on a small range, and C if the test succeeds and volume grows, and it should say which evidence would change its mind.
exam:
  - q: Define the term *offshoring*.
    marks: 2
    command: define
    paper: '1'
    answer: |
      A precise definition: carrying out a business activity in another country instead of the home country, either through the business's own operation abroad or through a foreign supplier.

      A full answer makes clear that offshoring is about where the work is done. "Using another company" defines outsourcing instead, a common confusion.
  - q: Explain two reasons why a business might locate its production close to its customers.
    marks: 4
    command: explain
    paper: '1'
    answer: |
      Two reasons, each explained with its effect:

      - **The product is bulk-increasing or perishable:** products that are heavier, bulkier or more perishable than their materials, such as bottled drinks or bread, are expensive or impossible to transport far, so locating near customers cuts transport costs and keeps products fresh.
      - **The service is delivered in person:** shops, salons and restaurants must be where customers can reach them, because footfall and convenience drive their sales.

      Other valid reasons include faster delivery and shorter lead times, better knowledge of local tastes, and avoiding tariffs by producing inside a market.
  - q: Distinguish between outsourcing and offshoring, with reference to Calder Packs.
    marks: 4
    command: distinguish
    paper: '1'
    answer: |
      A strong answer separates the two questions they answer and applies both:

      - Outsourcing changes **who** does the work: another firm does it instead of the business. Calder pays a contract manufacturer to sew its packs.
      - Offshoring changes **where** the work is done: in another country instead of at home. Calder's sewing is done on another continent.
      - The two can combine or occur separately: Calder's arrangement is both, but a workshop of Calder's own abroad would be offshoring without outsourcing, and a contract manufacturer at home would be outsourcing without offshoring.
  - q: |
      Calder's contract manufacturer charges $21.50 a pack. Freight and insurance add $2.40 a pack, import duty is 8% of the factory price, inspection costs $0.90 a pack and holding stock in transit costs $1.10 a pack. A pack made in Calder's own workshop at home would cost $30.30.

      Calculate (i) the landed cost of a pack from the contract manufacturer, and (ii) the difference in cost between the two options for 60,000 packs a year.
    marks: 4
    command: calculate
    paper: '2'
    answer: |
      - (i) Duty = 0.08 × $21.50 = $1.72. Landed cost = $21.50 + $2.40 + $1.72 + $0.90 + $1.10 = **$27.62** a pack.
      - (ii) Difference = ($30.30 − $27.62) × 60,000 = $2.68 × 60,000 = **$160,800** a year in favour of the contract manufacturer.

      Show the duty as a separate step. A common error is to compare the factory price of $21.50 directly with $30.30, which overstates the saving more than three times over.
  - q: Explain two qualitative factors that could affect Calder's choice of town for its own workshop.
    marks: 4
    command: explain
    paper: '1'
    answer: |
      Two factors, each explained and applied:

      - **The skills of the local workforce:** sewing quality is central to Calder's brand, and a town with experienced sewers, such as an old textile town, would need less training and make fewer faults.
      - **Transport links and their reliability:** packs must reach the warehouse and the port on time; a town whose road is often closed in winter could undo the faster lead times that reshoring is meant to bring.

      Other valid factors include the quality of life that would attract managers and designers, the local community's attitude to a new workshop, and the availability of suitable premises.
  - q: |
      Calder Packs is considering reshoring the sewing of its packs to its own workshop at home, at a cost of $30.30 a pack at 60,000 packs a year against a landed cost of $27.62 from its current supplier abroad.

      Discuss whether Calder should reshore its production.
    marks: 10
    command: discuss
    paper: '2'
    answer: |
      An extended response that weighs the case for and against and reaches a reasoned conclusion:

      - **The figures:** reshoring costs $2.68 a pack more today, $160,800 a year, but the gap narrows as volume grows ($28.55 a pack at 80,000), and the investment of $650,000 is reduced by a $150,000 grant.
      - **For:** control of quality after a recall; lead times cut from about nine weeks to one; protection of designs; a possible "made at home" premium; jobs at home and lower transport emissions.
      - **Against:** higher costs and fixed costs carried by Calder; the risk if demand falls; scarce skills; the survey's premium is a stated intention, not proven behaviour; and nearshoring may offer speed and oversight at no extra cost.
      - **It depends on:** growth in volume, evidence that customers will pay more, and how much Calder's brand depends on visible quality.
      - **Conclusion:** for example, nearshoring now and testing the premium before committing to a workshop; or reshoring if growth and the premium are confirmed. State what would change the judgement.

      An answer that lists advantages and disadvantages without the figures or a conclusion does not do what the command term asks.
summary:
  - Location is a long-term, costly and hard-to-reverse decision that affects costs, speed, quality and reputation.
  - Quantitative factors can be measured in money, such as land, wages, transport, utilities, taxes, grants and tariffs; qualitative factors cannot, such as skills, infrastructure, nearness to customers and suppliers, stability, regulation, culture and community.
  - Bulk-reducing processes locate near their materials; bulk-increasing and perishable ones, and services delivered in person, near their customers. Clustering and industrial inertia explain much of the rest.
  - Weighted scoring, beyond the guide, combines factors into one total built from judgements, so test its sensitivity and look for fatal weaknesses.
  - Outsourcing or subcontracting changes who does the work; offshoring changes where. Insourcing and reshoring reverse them.
  - Outsourcing and offshoring cut costs and give access to specialists and markets, but they cost control and add hidden costs, risks and ethical exposure.
  - Compare the full landed cost, not the headline price.
  - Insourcing and reshoring regain control, speed and resilience, at the price of higher costs, investment and risk.
  - Reorganizations are not permanent; they follow wages, freight costs, technology, trade rules and customers' preferences.

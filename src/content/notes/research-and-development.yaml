# Notes: 5.8 Research and development (HL only). Written in the platform's own
# words from the guide's four content statements (p. 35), so every section and
# question is HL. The guide sets no formula for this subtopic. The R&D
# appraisal uses the guide's NPV formula (p. 65) and discount factors (p. 66),
# as in the notes for 3.8; R&D intensity is a standard measure the guide does
# not list, labelled as such. Christensen's theory of disruptive innovation is
# explained from subject knowledge and attributed to him. The supplied
# coursebook chapter (Hodder, pp. 540 to 548) and the teacher support
# material's glossary (pp. 82 to 90) were read only to check coverage and
# definitions; nothing from either is reproduced. Every business named is
# fictional and every figure simulated; each figure was checked by script.
code: '5.8'
title: Research and development
level: HL
introduction: |
  Every product a business sells today will one day be overtaken, by a rival, a new technology or a change in what customers want. **Research and development** is how a business prepares its next products and processes before the current ones run out of road, and **innovation** is what it gets when that work succeeds.

  This HL subtopic asks you to judge how important R&D is for a particular business (AO3), and to explain why products should meet customers' unmet needs, how intellectual property protects new ideas, and the difference between incremental and disruptive innovation (all AO2).
objectives:
  - '**Evaluate** the importance of research and development for a business, weighing its rewards against its costs and risks.'
  - '**Explain** why businesses develop goods and services for unmet needs, both those customers know about and those they do not.'
  - '**Distinguish** between copyrights, patents and trademarks, and explain how each protects the results of R&D.'
  - '**Distinguish** between incremental and disruptive innovation, and analyse why established businesses often miss disruption.'
  - '**Calculate** the net present value of an R&D project, using the method of subtopic 3.8, and comment on how far the result can be trusted.'
situation:
  title: Kelderwick Tools and the patent that is about to expire
  fictional: true
  text: |
    Kelderwick Tools, a fictional family firm, has made premium power drills for professional builders for forty years. Its best-selling drill, protected by a patent on its gearbox, earns about 60% of the firm's profit, but the patent expires next year and rivals are expected to copy the design. Meanwhile a young rival has begun renting out a light, cheap cordless drill by monthly subscription. Home users love it; Kelderwick's sales team calls it a toy.

    Kelderwick spends 2% of its revenue on research and development, almost all of it on making its existing drills slightly lighter and more powerful. The finance director wants to cut that budget to protect profit. The head of engineering wants to double it, to develop a smart drill that records how tightly every bolt was fastened, after noticing builders writing the readings on paper for safety inspectors. No customer has asked for such a drill.

    Should Kelderwick spend more on research and development, less, or differently?
sections:
  - id: what-rd-is
    title: What research and development is
    kind: concept
    level: HL
    body: |
      **Research and development (R&D)** is the systematic work a business does to create new products and processes, or to improve existing ones. **Research** is the search for new knowledge: testing materials, trying out technologies, studying how people use a product. It can be basic, exploring an idea with no product yet in mind, or applied, aimed at a particular problem. **Development** turns that knowledge into something that can be made, delivered and sold at a profit, through designs, prototypes, trials and testing.

      R&D is not only laboratory work. A software firm's R&D is writing and testing code; a bank's may be designing a new mobile service; a restaurant chain's may be a test kitchen creating dishes that 200 kitchens can cook the same way. It covers new **products**, what the business sells, and new **processes**, how it makes or delivers them, and a process improvement that cuts costs can be worth as much as a new product.

      R&D is also different from market research (subtopic 4.4). Market research finds out what customers want and will pay for; R&D finds out what is technically possible and how to deliver it. Successful businesses need both, because a technically brilliant product that meets no need fails, and so does a product customers want that cannot be made at a price they will pay. A new product typically passes through stages from generating and screening ideas to prototypes, testing, test marketing and launch, and the HL toolkit's Gantt charts and critical path analysis can schedule those stages.
    points:
      - term: Research
        text: Investigating to discover new knowledge or to test an idea, such as a new material, a new recipe or a better way to store energy. Its results are uncertain by nature, and many lines of research lead nowhere.
      - term: Development
        text: Turning research into a usable product or process by designing it, building prototypes, testing them for safety and reliability, and preparing for production at a cost that allows a profit.
      - term: Product and process R&D
        text: Product R&D changes what is sold. Process R&D changes how it is made or delivered, usually to cut costs, raise quality or speed up delivery, and customers may never see it.
      - term: R&D intensity
        text: R&D spending as a percentage of revenue, a common way to compare how much businesses invest. A high figure shows commitment, not success, because what matters is what the spending produces.
    formulas:
      - name: R&D intensity
        expression: R&D intensity = R&D expenditure ÷ sales revenue × 100
        note: A standard measure; the guide gives no formula for 5.8 and does not require this one.
    example:
      title: Kelderwick's R&D department
      fictional: true
      text: |
        Kelderwick's revenue is $40 million a year, and it spends $800,000 on R&D, so its R&D intensity is 800,000 ÷ 40,000,000 × 100 = **2%**. The money pays for six engineers and a testing workshop. About nine-tenths of their time goes on small improvements to existing drills, such as a lighter casing or a longer-lasting motor, and the rest on process changes that cut assembly time. Almost nothing goes on research into products the firm does not yet make.
  - id: why-rd-matters
    title: Why research and development matters
    kind: evaluation
    level: HL
    body: |
      The guide asks you to judge the importance of R&D for a business (AO3). That means weighing what R&D can bring against what it costs and risks, for the business in front of you. For some businesses it decides whether they survive; for others it barely matters.

      The case for R&D rests on the future. Every product eventually declines (the product life cycle in subtopic 4.5), and R&D supplies the products that replace it. A new or better product can give a business a **unique selling point**, letting it charge a premium price and build brand loyalty. Process R&D lowers costs, which raises margins or allows lower prices. R&D opens new markets through product development and diversification in the Ansoff matrix, and the intellectual property it creates can be licensed to others for royalties. An innovative reputation also attracts talented staff, investors and partners. Where products change fast, a business that stops investing soon has nothing new to sell.

      The case against rests on cost and uncertainty. R&D is expensive and usually has to be paid for long before any revenue arrives, often out of retained profit. Most projects never reach the market, and many that do fail. Returns can take years, and rivals may copy a success or overtake it. Because R&D reduces this year's profit, managers under pressure for short-term results are tempted to cut it, and the damage shows only years later. So the question is never simply whether R&D is good, but how much a particular business should spend, on what, and how it will turn the spending into products customers buy.
    points:
      - term: R&D matters more when
        text: Technology changes fast; product life cycles are short; rivals compete on innovation and quality rather than price; patents on key products are about to expire; customers expect new features; or new rules demand safer or cleaner products.
      - term: R&D matters less when
        text: The business competes mainly on price, location or service; its products change slowly, as basic foods or building materials do; its strategy is to follow leaders and copy proven ideas quickly; or it has little finance to spare.
      - term: How well, not only how much
        text: Spending more does not guarantee innovation. A focus on customers' needs, skilled people, a culture that accepts failure, and the discipline to stop projects that are going nowhere matter as much as the size of the budget.
    advantages:
      - New products replace those in decline and keep revenue growing.
      - A unique selling point supports premium prices and brand loyalty.
      - Process R&D lowers costs and raises quality.
      - New intellectual property can be licensed or sold for income.
      - An innovative reputation attracts staff, investors and partners.
    limitations:
      - It is expensive, and the cost comes long before any revenue.
      - Outcomes are uncertain; most projects never reach the market.
      - It reduces profit now, which can bring pressure from shareholders.
      - Successful products can be copied, or overtaken by a rival's innovation.
      - It needs finance and skilled people that small businesses may lack.
    example:
      title: What is at stake for Kelderwick
      fictional: true
      text: |
        Kelderwick's best-seller earns 60% of its profit. Once the gearbox patent expires, copies will push its price down, so the profit that has paid for everything else will shrink however well the firm runs. Its incremental R&D keeps the current range competitive, but it creates nothing to replace that profit. That is why R&D matters more to Kelderwick now than at any time in its history. It also shows the danger of the finance director's proposal: cutting R&D would raise profit next year while leaving the firm with an ageing range and no new protected product.
  - id: appraising-rd
    title: Judging an R&D project with investment appraisal
    kind: method
    level: HL
    body: |
      Because R&D is an investment, spending now for returns later, the methods of investment appraisal in subtopic 3.8 can be used to judge a project: the payback period, the average rate of return and, at HL, **net present value (NPV)**, which uses discount factors to value future returns in today's money.

      The difficulty is the forecasts. A new machine's returns can be estimated from its output; an R&D project's returns depend on whether the research works, whether customers buy the result, how quickly rivals respond and how long the product lasts. So NPV is best used with **sensitivity analysis**: recalculate it with lower returns or a later launch, and see how far the forecasts can fall before the NPV turns negative.

      Appraisal also misses part of what R&D is worth. A failed project may still teach the business something it uses later, a small project may open a market worth far more, and not investing has a cost too if rivals move ahead. A negative NPV is a serious warning, but the final decision still needs judgement about strategy.
    formulas:
      - name: Present value
        expression: Present value = return in a year × discount factor for that year and rate
        note: The standard form. Read the factor from the guide's discount table (p. 66), and do not discount the original cost.
      - name: Net present value (NPV)
        expression: NPV = ∑ present values of return − original cost
        note: As on the guide's formula sheet (p. 65). A positive NPV means the returns are worth more than the cost in today's money.
    example:
      title: Is the smart drill worth developing?
      fictional: true
      text: |
        Kelderwick's engineers estimate that the smart drill would cost $1.5 million to develop, and forecast net returns of $200,000, $500,000, $600,000, $600,000 and $400,000 in its first five years. The firm uses a discount rate of 10%.

        - Year 1: $200,000 × 0.9091 = $181,820
        - Year 2: $500,000 × 0.8264 = $413,200
        - Year 3: $600,000 × 0.7513 = $450,780
        - Year 4: $600,000 × 0.6830 = $409,800
        - Year 5: $400,000 × 0.6209 = $248,360

        The present values total $1,703,960, so **NPV = $1,703,960 − $1,500,000 = $203,960**. The project pays back in 3 years and 4 months: $1,300,000 is recovered by the end of year 3, and the remaining $200,000 is a third of year 4's $600,000.

        Now the sensitivity test. If every year's return were 20% lower, the present values would total $1,363,168 and the NPV would be **−$136,832**. The project breaks even only if returns reach about 88% of the forecast. A positive NPV that disappears after a 12% shortfall is a thin margin for a product no customer has yet asked for.
    advantages:
      - It allows for the time value of money, which matters when returns from R&D arrive years after the spending.
      - It forces managers to state their forecasts, so the assumptions behind a project can be questioned.
      - It puts projects of different sizes and timings on one scale, so they can be compared.
      - Combined with sensitivity analysis, it shows how much room for error a project has.
    limitations:
      - The forecasts are the weakest part, because nobody knows whether the research will work or customers will buy the result.
      - The choice of discount rate changes the answer, and riskier projects arguably deserve a higher one.
      - It ignores what the business learns from a project, and options it opens up later.
      - It treats a project on its own, while the real alternative may be losing the market to a rival.
  - id: unmet-needs
    title: Products for customers' unmet needs
    kind: concept
    level: HL
    body: |
      An **unmet need** is a problem or want that existing goods and services do not solve, or do not solve well. The guide stresses developing goods and services that address unmet needs, including needs customers are not aware of. Products that meet a real need sell. Many launches fail because they solve a problem nobody has, or solve it no better than what is already available.

      Some unmet needs are **known**: customers can describe them, complain about them and say what they would pay to have them solved. Market research finds them through surveys, focus groups, complaints and online reviews, and developing a product for a known need carries less risk, because the demand is already visible. Other needs are **latent**: customers have them but cannot put them into words, because they cannot imagine the solution or have simply learned to live with the problem. Asking customers rarely reveals a latent need. Watching them can, and so can studying data on what they do, working with unusually demanding users and R&D that discovers what has newly become possible.

      Meeting a latent need can create a whole new market and give the first business there a head start: a strong brand, loyal customers and time to improve before rivals arrive. It is also riskier, because there is no proof of demand until the product is launched, and customers may first have to be persuaded that they want it. The two routes are often called **market pull**, where demand leads and R&D follows, and **technology push**, where R&D leads and the business then finds its customers. They echo the difference between market orientation and product orientation in subtopic 4.1.
    diagram: market-product-orientation
    points:
      - term: Known need
        text: A need customers are aware of and can express, such as a complaint that a product is too heavy or too slow. Market research can measure it, so the risk of developing a product for it is lower.
      - term: Latent need
        text: A need customers have but are not aware of, or cannot describe until a product appears that meets it. It is found by observation and experiment rather than by asking, and the risk is higher because demand is unproven.
      - term: Finding latent needs
        text: Watching people use products in real settings, analysing data on behaviour, noticing the workarounds people invent, working with the most demanding users, and testing early prototypes to see how people react.
      - term: The first-mover trade-off
        text: The first business to meet a need can build a brand and loyal customers before rivals arrive, but it also pays to teach the market, and followers can learn from its mistakes and copy what works.
    example:
      title: Two needs at Kelderwick
      fictional: true
      text: |
        Builders often complain about wrist strain from heavy drills: a **known** need, which Kelderwick meets with incremental R&D on lighter casings. Nobody has asked for a drill that records how tightly each bolt was fastened. But engineers who spent a week on building sites saw builders writing the readings on paper so that safety inspectors could check them, a slow job that is easy to get wrong. That is a **latent** need: the builders had a real problem but had never imagined a tool could solve it. To test the idea before spending $1.5 million, the engineers give working prototypes to 20 builders for a month and record how often they use the feature.
  - id: intellectual-property
    title: 'Intellectual property protection: copyrights, patents and trademarks'
    kind: types
    level: HL
    body: |
      Ideas are expensive to create and cheap to copy. A rival that copies a new product skips the cost of the R&D and can undercut the business that paid for it, which would leave little reason to invest in R&D at all. **Intellectual property (IP)** is the legal ownership of creations of the mind, such as inventions, brand names and creative works. IP protection lets the owner stop others using them without permission for a period, so the business can recover what it spent and earn a return. IP can also be sold, or licensed to other businesses in return for a **royalty**.

      The guide names three forms of protection. A **patent** protects an invention, a product or process that is new, involves an inventive step and can be made or used. It must be applied for, is granted country by country, and in most countries lasts up to 20 years, in return for the invention's details being published. **Copyright** protects original creative work, such as writing, music, film, artwork and software code. In most countries it arises automatically, without registration, and lasts for many decades, but it protects the expression of an idea, not the idea itself. A **trademark** protects a brand identity, such as a name, logo or slogan. It is registered and can usually be renewed again and again while it is used, so a brand can outlive every patent behind it.

      Protection has limits. It is territorial, so a business must apply, pay and enforce in each country where it wants protection. Defending it can mean long and costly court cases that small firms may not afford. A patent expires and publishes the invention, so rivals can study it and design around it. Some businesses therefore rely instead, or as well, on secrecy, keeping a recipe or method confidential, and on speed, improving faster than others can copy. Other forms of protection exist, such as registered designs, but the guide names these three.
    diagram: intellectual-property
    points:
      - term: Patent
        text: Protects an invention. It must be new, inventive and capable of being made or used, it is granted only after an application and examination, and it gives the owner the right to stop others making, using or selling the invention for a limited period. Renewal fees are often payable to keep it in force.
      - term: Copyright
        text: Protects the expression of original creative work, from books and music to photographs, films and software. It usually arises automatically when the work is created, so there is nothing to register, and its length varies between countries.
      - term: Trademark
        text: Protects a sign that identifies a business's goods or services, such as a name, logo, slogan or sometimes a colour or sound. It stops rivals using the same or a confusingly similar sign, and it is the main legal weapon against counterfeits.
      - term: Licensing and royalties
        text: An owner can let other businesses use its IP for a fee or a royalty on each sale. Licensing earns income from markets the owner could not reach itself, but it gives up some control and can create a future competitor.
      - term: What protection cannot do
        text: It cannot stop a rival inventing a different solution to the same problem, it lapses at the end of its term, and it is worth only as much as the owner's ability to enforce it.
    example:
      title: Kelderwick's intellectual property
      fictional: true
      text: |
        - **Patent:** the gearbox patent expires next year. Its details were published when it was granted, so rivals have had years to prepare their copies.
        - **Trademark:** the Kelderwick name and logo are registered and can be renewed indefinitely. After the patent expires, the brand's reputation for reliability is what lets Kelderwick charge more than the copies.
        - **Copyright:** if the smart drill goes ahead, the code in the drill and its app, and the manuals, will be protected by copyright from the moment they are written.
        - **A new patent:** if the sensor that measures bolt tension is new and inventive, Kelderwick can apply for a patent on it, and could license the design to makers of other tools for a royalty on each one sold.
  - id: innovation-types
    title: 'Innovation: incremental and disruptive'
    kind: types
    level: HL
    body: |
      **Innovation** is turning a new idea into a product, service or process that people actually use. It is wider than invention, which is the idea or device itself, and R&D is only one of its sources; others include employees' suggestions, customers' feedback and ideas borrowed from other industries. The guide distinguishes two kinds.

      **Incremental innovation** is a series of small improvements to existing products, services or processes: a longer battery life, a new flavour, a faster checkout. It is by far the most common kind. It costs less, carries less risk and keeps existing customers satisfied, and it is close to kaizen in lean production (subtopic 5.3) and to extension strategies in the product life cycle. Its weakness is that a business can keep improving yesterday's product while the market moves somewhere else.

      **Disruptive innovation** creates a new market or transforms an existing one, and in time displaces the businesses that led it. The idea comes from Clayton Christensen, a professor at Harvard Business School, who set it out in the 1990s, most fully in *The Innovator's Dilemma* (1997). In his account, a disruptive product usually starts out simpler, cheaper or more convenient, and worse on the measures the leaders' best customers care about. So it first serves people the leaders ignore: customers who want something basic, or people who were not buying at all. The leaders see little threat. The newcomer keeps improving until it is good enough for mainstream customers, who then switch, and the leaders lose a market they once dominated.

      Watch the language. In everyday speech any dramatic new technology is called disruptive. The teacher support material's glossary treats disruptive innovation as rare, and as creating a new market while upsetting an existing one; Christensen's stricter meaning adds the route, entering from below and moving up. Not every breakthrough is disruptive: a far better product that a market leader sells to its existing customers strengthens the leader instead, and Christensen called such improvements sustaining innovations.
    diagram: innovation-types
    points:
      - term: Incremental innovation
        text: Small, continuous improvements to what already exists. Low cost and low risk, valued by existing customers, but rarely enough on its own when a market changes direction.
      - term: Disruptive innovation
        text: An innovation that creates a new market or reshapes an existing one and displaces its leaders, usually by starting simple and cheap and improving until mainstream customers switch.
      - term: Low-end disruption
        text: A newcomer serves the least demanding customers of an existing market with a cheaper, simpler product that is good enough for them, then moves up.
      - term: New-market disruption
        text: A newcomer reaches people who were not buying at all, because the existing products were too expensive, complicated or inconvenient for them.
      - term: Product and process innovation
        text: Another way to classify innovation, by what changes. Product innovation changes what is sold; process innovation changes how it is made or delivered. Either can be incremental or disruptive.
    example:
      title: Incremental, disruptive or neither?
      fictional: true
      text: |
        - Each year's slightly lighter Kelderwick drill is **incremental** innovation: a better version of the same product for the same customers.
        - The rival's subscription drill could be a **low-end disruption**. It is cheaper, simpler and weaker than a professional drill, it serves home users Kelderwick ignores, and each year its batteries improve. If it becomes good enough for builders, it could take Kelderwick's core market from below.
        - The smart drill would be a significant product innovation, but it would be sold to Kelderwick's existing customers by an established leader, so in Christensen's terms it is a sustaining innovation, not a disruptive one.
  - id: managing-innovation
    title: Why leaders miss disruption, and how they respond
    kind: application
    level: HL
    body: |
      Christensen's central puzzle was why well-run market leaders so often lose to newcomers. His answer was that they fail by doing the sensible thing. They listen to their best customers, invest in the improvements those customers ask for, and ignore small, low-margin markets that cannot yet move their profits. Each decision is rational, and together they leave the door open.

      Established businesses respond in several ways. Some set up a separate unit with its own targets, so that the new product is not judged against the profits of the old one. Some buy promising newcomers or form alliances with them. Some launch products that compete with their own best-sellers, accepting the lost sales, known as cannibalization, rather than leaving the market to others. Others decide that the threat is not real and focus on the customers who still value what they do best. No response is right in every case; it depends on how fast the newcomer is improving and how much of the market it could reach.

      Most businesses need both kinds of innovation at once: incremental improvement to keep today's customers, and some exploration of bigger, riskier ideas for tomorrow. Getting the balance right is a matter of strategy, finance and culture. Bold R&D needs people who are allowed to fail without blame, and a way to stop projects that are going nowhere before they absorb the budget.
    points:
      - term: A separate unit
        text: A small team with its own budget, targets and freedom, so that a low-margin new product is not killed by comparison with the core business.
      - term: Buy or partner
        text: Acquiring a promising newcomer, or forming a joint venture or strategic alliance with it, buys speed and skills but can be expensive, and the newcomer's culture may not survive inside a large firm.
      - term: Cannibalization
        text: Launching a product that takes sales from the business's own existing products. It is painful, but if someone is going to take those sales, it is better that it is the business itself.
      - term: An innovation portfolio
        text: Spreading R&D across safe incremental projects and a few riskier bets, and reviewing the balance as the market changes.
    example:
      title: The map publisher that changed course
      fictional: true
      text: Fenmoor Maps, a fictional publisher of printed road atlases, at first dismissed free navigation apps as inaccurate. When its sales to drivers began to fall each year, it set up a small digital team in a separate office with its own targets. The team built detailed walking and cycling maps for an app, a market the large app makers had ignored, while the print business kept serving the customers who still wanted paper. Within five years the digital team earned more than the atlases, and the decision to let it compete with its own parent was what saved the firm.
applications:
  - industry: Pharmaceuticals and healthcare
    text: R&D is the heart of the business. Developing a new medicine can take a decade or more of trials, most candidates fail, and the patent on a success is what lets the company recover the cost of all the failures. When the patent expires, cheaper copies arrive and prices fall sharply, so a steady pipeline of new medicines matters more than almost anything else.
  - industry: Technology and software
    text: Products change in months, so incremental updates are constant and the threat of disruption never goes away. Copyright protects code, while the rules on patenting software differ between countries, and in practice speed, data and a large base of users often protect a business better than any legal right.
  - industry: Manufacturing
    text: Much of the R&D is process R&D, cutting cost and raising quality through automation and better materials, alongside steady incremental improvement of products. Occasionally a shift in technology, such as a move to electric power, forces a manufacturer to make a large, risky R&D bet or lose its market.
  - industry: Food and consumer goods
    text: R&D goes into new flavours, healthier recipes and packaging, and most of it is incremental. Recipes are hard to patent, so businesses rely on secrecy and on trademarks, and because many new products fail within a year, testing ideas with customers before launch is essential.
  - industry: Retail and services
    text: There is little laboratory R&D, but process innovation, such as apps, self-service and faster delivery, changes how customers are served. New service ideas are easy to copy, so the brand and the quality of delivery, rather than legal protection, are what keep an advantage.
  - industry: Social enterprise
    text: Social enterprises often innovate for needs that commercial markets ignore, such as products for people on very low incomes or in remote places, using simple and cheap designs. Some publish their designs freely rather than patenting them, because spreading the benefit matters more to their mission than earning royalties.
stakeholders:
  - group: Owners and shareholders
    text: R&D cuts profit now for uncertain gains later, so long-term owners, such as founding families, often support it more readily than investors seeking quick returns. A successful project can raise the value of the business sharply; a string of failures destroys value, and the two groups may judge the same budget very differently.
  - group: Employees
    text: Scientists, engineers and designers are often motivated by challenging, creative work and by a culture that lets them experiment. But process innovation can automate jobs, so other employees may see R&D as a threat to their security, and change needs to be managed with retraining and consultation.
  - group: Customers
    text: They gain better, safer and sometimes cheaper products, and disruptive innovations often bring products to people who were priced out before. Patents, however, let the owner charge high prices for a period, which is most controversial where the product is a medicine and patients' needs conflict with shareholders' returns.
  - group: Competitors
    text: Intellectual property blocks them from copying for a time, so they must license the idea, design around it or wait for protection to end. Newcomers with disruptive products are a threat to established leaders, while leaders' large R&D budgets can make it hard for small rivals to keep up.
  - group: Government and society
    text: Governments fund much basic research through universities, grant patents and often offer tax incentives for R&D, because innovation raises productivity and living standards. A patent is a deliberate trade-off between rewarding the inventor with a temporary monopoly and the public's interest in competition and low prices.
evaluation:
  - Spending more on R&D does not guarantee more innovation. What the money produces depends on its focus on real customer needs, the quality of the people, a culture that accepts failure, and the discipline to stop weak projects, so judge an R&D budget by its results and its management, not its size.
  - The returns to R&D are uncertain and long term, so appraisal methods such as NPV rest on guesses, and sensitivity analysis matters more than the headline figure. That uncertainty also tempts businesses under short-term pressure to cut R&D, protecting profit now at the expense of the future.
  - Intellectual property protection makes R&D worth paying for, but it is territorial, costly to enforce and temporary, and a patent publishes the invention. For some businesses secrecy, speed and a strong brand protect an advantage better than the law.
  - Meeting a latent need can create a market and a lasting lead, but no survey can prove the demand in advance, so the risk is high. Prototypes, trials and test markets reduce the risk without removing it.
  - Disruption is far easier to recognize in hindsight. Many products hailed as disruptive fail, and leaders can respond by buying or copying the newcomer, so treat a claim of disruption as a hypothesis to test against the evidence in the case.
  - How important R&D is depends on the business. It is vital where technology and tastes change fast and rivals compete on innovation, and much less so for a business that competes on price, location or service, where copying proven ideas quickly can be the wiser strategy.
decision:
  title: More, less or different R&D at Kelderwick?
  fictional: true
  brief: |
    Kelderwick's board must set its R&D budget for the next three years. The business has revenue of $40 million, profit of $3.6 million and an R&D budget of $800,000 (2% of revenue). The gearbox patent on its best-seller, which earns about 60% of profit, expires next year. The rival's subscription drill is spreading among home users, and its batteries improve every year. The smart drill has an estimated NPV of $203,960 at 10%, which turns negative if returns fall more than about 12% short of the forecast. All figures are simulated.
  options:
    - label: Cut R&D and back the brand
      text: Reduce R&D to 1% of revenue ($400,000) and spend $200,000 a year more on promoting the Kelderwick brand to professionals, relying on its reputation to hold prices after the patent expires. Profit rises to about $3.8 million next year.
    - label: Keep improving the range
      text: Keep R&D at $800,000 a year, all of it on incremental improvements to the professional range, so the drills stay ahead of the copies on weight, power and reliability.
    - label: Double R&D for new products
      text: Raise R&D to 4% of revenue ($1.6 million a year) for three years, to develop the smart drill and a cheaper cordless model of Kelderwick's own. The extra $800,000 a year cuts profit to about $2.8 million, a fall of 22.2%.
  guidance: |
    Begin with the threat, because it decides how much R&D matters. Once the patent expires, the profit from the best-seller will shrink whatever Kelderwick does, so cutting R&D trades a small rise in profit now ($3.8 million) for a range that will age just as the copies arrive. The brand can slow the decline, since the trademark lasts as long as Kelderwick uses it, but a brand alone rarely holds a price premium against copies that perform as well.

    Keeping R&D at 2% defends today's customers, which matters, but it is the classic response Christensen warned about: improving the product for the best customers while a cheaper, simpler rival improves from below. If the subscription drill becomes good enough for builders, a lighter professional drill will not stop them switching.

    Doubling R&D is the riskiest option and the only one that creates new protected products. The smart drill meets a latent need, so there is no proof of demand; its NPV is positive but thin, and the prototype trial with 20 builders should be finished before the full $1.5 million is committed. A cheaper model of its own would cannibalize some of Kelderwick's sales, but it would answer the disruptive threat instead of ignoring it. The extra $2.4 million over three years is affordable from profit of $3.6 million a year, though it cuts profit by 22.2%, which a family owner focused on the long term may accept more readily than outside investors would.

    A strong answer usually rejects the cut, then chooses between the other two with conditions: for example, doubling R&D in stages, with each stage released only if the builders' trial and early sales meet agreed targets. It should also say what would change the decision, such as a trial showing that builders rarely use the recording feature, or evidence that the rival's drill cannot be made tough enough for building sites.
exam:
  - q: Define *research and development*.
    marks: 2
    command: define
    level: HL
    paper: '2'
    answer: |
      A strong definition covers both parts: systematic **investigation** to discover new knowledge or test ideas (research), and the work of turning that knowledge into new or improved **products or processes** that can be made and sold (development). Mentioning that R&D can concern processes as well as products, or that its outcomes are uncertain, strengthens the answer.
  - q: Distinguish between a *patent* and a *trademark*.
    marks: 4
    command: distinguish
    level: HL
    paper: '2'
    answer: |
      - A **patent** protects an **invention**, a new and inventive product or process, by giving the owner the right to stop others making, using or selling it. It must be applied for and lasts for a limited period, in most countries up to 20 years, after which anyone may use the invention.
      - A **trademark** protects a **brand identity**, such as a name, logo or slogan, by stopping others using the same or a confusingly similar sign. It is registered and can usually be renewed indefinitely while it is used.
      - A strong answer states the difference explicitly, in what each protects (the invention itself or the brand that identifies the product) and in how long the protection lasts, ideally with a brief example of each.
  - q: |
      With reference to Kelderwick Tools, analyse the threat posed by the rival's subscription drill as a possible disruptive innovation.
    marks: 6
    command: analyse
    level: HL
    paper: '2'
    answer: |
      A strong response explains what makes an innovation disruptive and applies it to the evidence, rather than defining the term in general.

      - The rival's drill fits the pattern of **low-end disruption**: it is cheaper, simpler and weaker than Kelderwick's, and it serves home users, a market Kelderwick ignores because the margins are low.
      - Kelderwick's reaction, calling it a toy, is the classic mistake of a leader judging a newcomer by the standards of its own best customers.
      - The threat depends on improvement: the rival's batteries get better every year, and if the drill becomes good enough for builders, its low price and subscription model could take part of Kelderwick's core market.
      - The timing makes it worse, because the gearbox patent is about to expire and copies will already be pressing on Kelderwick's prices.
      - The best answers weigh the evidence: the threat is real but not certain, because professional drills must survive harsh conditions, and Kelderwick could respond with a cheaper model of its own.
  - q: |
      Brightwell Optics, a fictional maker of spectacle lenses, is considering an R&D project to develop an anti-glare coating. The project would cost $400,000 now. The forecast net returns, all simulated, are $150,000 a year in years 1 to 3 and $100,000 in year 4. Brightwell uses a discount rate of 8%. The discount factors at 8% are 0.9259 (year 1), 0.8573 (year 2), 0.7938 (year 3) and 0.7350 (year 4).

      Calculate the net present value (NPV) of the project.
    marks: 4
    command: calculate
    level: HL
    paper: '2'
    answer: |
      - Year 1: $150,000 × 0.9259 = $138,885
      - Year 2: $150,000 × 0.8573 = $128,595
      - Year 3: $150,000 × 0.7938 = $119,070
      - Year 4: $100,000 × 0.7350 = $73,500
      - Total present value = $460,050
      - **NPV = $460,050 − $400,000 = $60,050**

      This applies the NPV method of subtopic 3.8 to an R&D project. A full answer shows each present value, does not discount the original cost, and gives the answer in dollars. Its positive sign means the forecast returns are worth more than the cost in today's money.
  - q: |
      Further information about Brightwell Optics: a rival lens maker launched its own anti-glare coating last year. Brightwell's engineers believe their coating would be patentable, but the R&D team has missed its deadlines on two of its last three projects.

      Discuss whether Brightwell Optics should go ahead with the coating project.
    marks: 10
    command: discuss
    level: HL
    paper: '2'
    answer: |
      A strong response uses the NPV, questions it, and weighs it against the other evidence before reaching a judgement.

      - **For going ahead:** the NPV of $60,050 is positive; a patent would protect the coating from copying for years and could earn royalties through licensing; and with a rival already selling a coating, not investing risks losing customers who now expect one.
      - **Against, or with caution:** the NPV is small relative to the $400,000 cost, so a modest shortfall in returns or a delay would turn it negative; the rival's head start may cut Brightwell's sales or price below the forecast; and the team's record of missed deadlines suggests the forecasts and timetable are optimistic. A patent is only worth having if it is granted and Brightwell can afford to defend it.
      - **Judgement:** for example, go ahead in stages, releasing the budget for each stage only after the previous one meets its targets, or seek a licence from the rival if that would cost less. The best answers state what would change the decision, such as a sensitivity test showing how far returns can fall before the NPV turns negative.
  - q: |
      SunKettle, a fictional social enterprise, has developed a low-cost solar kettle that heats water hot enough to make it safe to drink. It sells the kettle at cost to families in rural villages where the only water comes from rivers and shallow wells, and where firewood is scarce.

      Describe the human need that SunKettle's product aims to meet.
    marks: 2
    command: describe
    level: HL
    paper: '3'
    answer: |
      A strong answer identifies the need and describes it in the context: families need **safe drinking water**, a basic physiological need, because untreated river and well water can carry disease. It may add that boiling water over firewood is costly and difficult where wood is scarce, so the need is not met by existing options. This is also an example of developing a product for an unmet need that commercial businesses have largely ignored.
summary:
  - '**Research and development** is systematic investigation (research) and the work of turning the results into new or improved products and processes (development). It covers processes as well as products, and services as well as goods.'
  - R&D is an investment, so its importance must be judged for the business. It matters most where technology and tastes change fast, rivals compete on innovation and patents on key products are expiring.
  - 'Its rewards: new products to replace declining ones, a unique selling point and premium prices, lower costs from process R&D, new markets and licensing income. Its costs: high spending long before any revenue, uncertain outcomes, lower profit now and the risk of being copied.'
  - NPV can appraise an R&D project, but the forecasts are the weakest part, so test how far returns can fall before the NPV turns negative.
  - '**Unmet needs** can be known, which market research can find, or **latent**, which customers cannot express and which observation, data and R&D reveal. Latent needs can create new markets but carry more risk.'
  - '**Intellectual property** protection lets a business recover the cost of R&D: a **patent** protects an invention for a limited period, **copyright** protects creative work automatically, and a **trademark** protects a brand and can be renewed indefinitely.'
  - Protection is territorial, costly to enforce and temporary, so secrecy, speed and brand strength also matter.
  - '**Incremental innovation** improves what exists in small steps; **disruptive innovation** creates or reshapes a market, usually entering from below, and displaces the leaders.'
  - Leaders often miss disruption by serving their best customers well; they can respond with a separate unit, an acquisition, a product that cannibalizes their own, or a balanced portfolio of R&D.
retrieval:
  - q: What is the difference between research and development?
    a: Research is the search for new knowledge or the testing of ideas. Development turns that knowledge into products or processes that can be made, delivered and sold at a profit.
  - q: How is R&D different from market research?
    a: Market research finds out what customers want and will pay for; R&D finds out what is technically possible and how to deliver it. Successful products usually need both.
  - q: Give three reasons why R&D can matter to a business.
    a: For example, new products replace those in decline, a unique selling point supports premium prices, process R&D cuts costs, it opens new markets, and its intellectual property can be licensed for income.
  - q: Why do businesses under short-term pressure often cut R&D?
    a: Because R&D reduces profit now while its benefits are uncertain and arrive years later, so cutting it raises this year's profit even though it weakens the business's future.
  - q: What is the difference between a known need and a latent need?
    a: Customers are aware of a known need and can describe it, so market research can find it. A latent need is one customers have but cannot express until a product meets it, so it is found by observation, data and R&D rather than by asking.
  - q: What does a patent protect, and roughly how long does it last in most countries?
    a: An invention, a new and inventive product or process. In most countries a patent lasts up to 20 years, after which anyone may use the invention.
  - q: How does copyright differ from a patent in the way protection is obtained?
    a: Copyright usually arises automatically when an original work is created, with nothing to register, while a patent must be applied for and granted.
  - q: Why can a trademark be more valuable in the long run than a patent?
    a: A trademark can usually be renewed indefinitely while it is used, so the brand's protection can outlast every patent behind the product.
  - q: Give two limits of intellectual property protection.
    a: For example, it applies only in the countries where it is granted, it is costly to enforce, patents expire, and a patent publishes the invention so rivals can design around it.
  - q: What is the difference between incremental and disruptive innovation?
    a: Incremental innovation makes small, continuous improvements to what already exists. Disruptive innovation creates a new market or reshapes an existing one, usually starting simple and cheap, and in time displaces the leaders.
  - q: According to Christensen, why do well-run leaders often miss disruptive innovations?
    a: They focus on their best customers and on the improvements those customers want, and ignore small, low-margin markets, so each rational decision leaves room for a newcomer to grow from below.
  - q: An R&D project costs $100,000 and its returns have a total present value of $112,000. What is its NPV, and what does it suggest?
    a: NPV = $112,000 − $100,000 = $12,000. It is positive, so on the forecasts the project is worthwhile, but the margin is small and the returns of an R&D project are uncertain.
connections:
  - code: '4.1'
    text: Market orientation and product orientation mirror market pull and technology push, the two routes to products for unmet needs.
  - code: '4.4'
    text: Market research finds the needs customers know about, while latent needs call for observation and experiment.
  - code: '4.5'
    text: R&D supplies the products that replace those in decline, and incremental improvements act as extension strategies in the product life cycle.
  - code: '3.8'
    text: R&D projects are investments, so payback, ARR and NPV can appraise them, with extra care over uncertain forecasts.
  - code: '5.3'
    text: Kaizen in lean production is incremental innovation applied to processes, many small improvements suggested by the people who do the work.
  - code: '1.5'
    text: Product development and diversification in the Ansoff matrix depend on R&D, and buying an innovative newcomer is one form of external growth.

retrieval:
  - q: What makes an organization a business, even if it does not aim to make a profit?
    a: It organizes resources to provide goods or services that others value. Public sector bodies and social enterprises are businesses in this sense, even though profit for owners is not their purpose.
  - q: Name the four factors of production, with an example of each for a café.
    a: "Land: the site and natural resources such as water. Labour: the baristas and kitchen staff. Capital: the building, coffee machines, ovens and furniture. Enterprise: the owner's initiative and risk in opening it."
  - q: A bookshop sells a book for $20. It paid the publisher $12 for it and pays $1 a book for delivery. What is the added value per book, and is it the same as profit?
    a: $20 − ($12 + $1) = $7 a book. It is not profit, because wages, rent and other costs must still be paid out of it.
  - q: Classify by sector catching fish, canning it, selling it in a supermarket, and writing software that tracks fish stocks.
    a: Primary, secondary, tertiary and quaternary, in that order.
  - q: What is sectoral change, and why does it happen?
    a: A shift over time in each sector's share of output and jobs, usually from primary to secondary to tertiary and quaternary. Its causes include rising incomes, technology raising output per worker, globalization and education.
  - q: Distinguish between an entrepreneur and an intrapreneur.
    a: An entrepreneur starts a new venture and carries its risk. An intrapreneur shows the same initiative inside an existing organization, which provides the resources and carries most of the risk.
  - q: Give two opportunities and two challenges for a start-up.
    a: "Opportunities: for example a gap in the market, a change such as a new law or trend, or low-cost online tools. Challenges: for example finding the money, persuading customers to switch from brands they know, running short of cash, or inexperience."
  - q: Name the five circular business models that the guide lists.
    a: Circular supply, resource recovery, product life extension, sharing, and product service system models.

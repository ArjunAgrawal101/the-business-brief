# Notes: 1.1 What is a business? Written in the platform's own words from the
# guide's four content statements (p. 23), with circular business models from
# the toolkit (pp. 13 to 14). The supplied coursebook chapter (Hodder, pp. 58
# to 70) and its toolkit pages on circular business models and business plans
# (pp. 22 to 24 and 45 to 46) were read to check coverage and conventions; no
# passage, table or case from them is reproduced. The coursebook's syllabus box
# for 1.1 leaves out the guide's "Entrepreneurship (AO2)" statement and the
# chapter has no section on it, so that section follows the guide and the
# platform's glossary. Every business named is fictional.
code: '1.1'
title: What is a business?
level: SL/HL
introduction: |
  Every organization you deal with, from a street food stall to a hospital to a global software firm, does the same basic thing: it brings resources together and turns them into goods or services that people want. This subtopic gives you the language for that process: inputs, outputs and added value; the four sectors that classify what a business does; the entrepreneurs who start new businesses; and what helps or holds back a new venture.

  It is the foundation for the rest of the course. Units 2 to 5 study the four functions that run the transformation process, and examination cases are built around organizations that you will need to describe in exactly these terms: what they produce, for whom, in which sector, and how they add value.
objectives:
  - '**Describe** the nature of business: how a business turns the factors of production into goods and services and adds value.'
  - '**Distinguish** between the primary, secondary, tertiary and quaternary sectors, and classify the activities of a business by sector.'
  - '**Explain** why the balance between the sectors changes as an economy develops, and what that means for businesses.'
  - '**Explain** the role of entrepreneurs and intrapreneurs, what drives them and why they matter to the economy.'
  - '**Analyse** the opportunities and challenges that a particular start-up faces.'
  - '**Apply** the five circular business models from the toolkit to the inputs and outputs of a business.'
sections:
  - id: what-a-business-is
    title: What a business is
    kind: concept
    body: |
      A **business** is an organization that brings resources together and uses them to provide goods or services for others. The resources might be a field, a team of nurses, a set of ovens or a piece of software; the customers might be households, other businesses or the government.

      Two features make an activity a business rather than a hobby. It is **organized**: people and resources are coordinated towards a purpose. And it is **directed at other people's needs and wants**: it exists to supply something that someone values enough to pay for, or that a government or donor pays for on their behalf.

      Many businesses exist mainly to make a profit for their owners, but not all do. A state hospital exists to provide a public service and a social enterprise to pursue a social purpose; both are businesses in this sense too, because each organizes resources to provide something people value.

      Businesses matter beyond their customers. They create jobs and incomes, pay taxes, buy from other businesses and develop new products and methods. And because the resources they use are limited, every choice about what to produce, and how, has an **opportunity cost**.
    points:
      - term: Needs and wants
        text: Needs are the essentials of a safe life, such as food, clean water and somewhere to live; wants are everything people would like beyond them, such as concert tickets or a designer jacket. Businesses supply both, and the line between them moves with income and culture.
      - term: Goods
        text: Physical things a customer buys and keeps, such as a pair of trainers or a laptop. Because they can be stored, they can be made in advance and held in stock until someone buys them.
      - term: Services
        text: "Work done for a customer rather than an object they take away, such as a haircut, a bus journey or a lesson. Services cannot be stored, so capacity that goes unused is lost: an empty seat on today's train cannot be sold tomorrow. Many businesses sell a mix of the two, such as a phone shop that also repairs phones."
      - term: Opportunity cost
        text: The value of the best alternative that a choice rules out. A bakery that spends its last $3,000 on a second oven cannot also spend it on a month of advertising, so if advertising was its next-best use, that is what the oven really cost.
    example:
      title: Three businesses in one town
      fictional: true
      text: |
        In the fictional town of Ashby, Juniper Lane Bakery aims to make a profit for its owner; the council-run swimming pool charges low prices to keep residents healthy; and Second Rise, a social enterprise café, uses its profits to pay for breakfast clubs in local schools.

        Their purposes differ, but each one organizes people, premises and equipment to provide something others value, so each is a business.
  - id: transformation-process
    title: Inputs, the transformation process and outputs
    kind: concept
    body: |
      Every business, whatever it sells, can be described in the same way. It gathers **inputs**, changes them through a **transformation process** and produces **outputs** that it sells or provides to customers. The same model fits a gold mine, a car factory and a bank, which is what makes it useful: it lets you compare organizations that look nothing alike.

      The inputs are the four **factors of production**. Inside the business, the four functions share the work of transformation. Human resources finds, trains and keeps the people; finance and accounts raises the money and keeps track of it; marketing finds out what customers want and persuades them to buy; operations turns the inputs into the finished good or service. In a very small business the owner may do all four.

      The outputs are goods and services, but most processes also create **by-products and waste**, such as offcuts, packaging, waste water or emissions. Some by-products can become another business's inputs; the rest are a cost to the business, to the environment or to both.

      One common slip: profit is not an input. It is what the owner hopes to earn once the inputs have been turned into something customers will pay for, and in that sense it is the reward for enterprise.
    points:
      - term: Land
        text: Natural resources of every kind, including the site itself and the soil, water, minerals, timber, fish or sunlight that a business draws on. For a farm, a mine or a hotel by the sea, the quality and location of the land can decide success.
      - term: Labour
        text: Human effort, physical and mental. The number of workers matters, and so do their skills, attitudes and experience; the same café with better-trained staff is selling a different product.
      - term: Capital
        text: Equipment and buildings made to help production, such as machinery, vehicles, tools, premises and software. In finance, capital also means money invested in a business; here it means the things that money buys.
      - term: Enterprise
        text: The initiative and willingness to take risks that spots an opportunity and combines the other three factors. It is supplied by the entrepreneur, and its reward is profit.
    diagram: inputs-outputs
    example:
      title: A fruit farm
      fictional: true
      text: |
        Highfield Berries, a fictional fruit farm, uses fields, soil and rainwater (land); eight seasonal pickers, a farm manager and a part-time bookkeeper (labour); and polytunnels, a cold store, a tractor and a website (capital). Its owner, Ruth Okafor, supplied the enterprise when she took the risk of turning a dairy farm into a fruit business.

        Its outputs are fresh berries and jam (goods) and pick-your-own visits (a service). Its by-products are bruised fruit, which goes into the jam, and plant waste, which is composted and dug back into the fields.
  - id: adding-value
    title: Adding value
    kind: concept
    body: |
      A business survives only if customers value what it produces more than it costs to make. **Added value** measures that gap in its simplest form: what customers pay for the output, minus what the business paid other businesses for the materials and services that went into it.

      Added value is not profit. Out of it the business must still pay wages, rent, interest and its other costs; only what is left after those is profit. A business that adds a great deal of value can still make a loss if its other costs are higher still.

      There are two broad ways to add more value: persuade customers to pay more for the output, or spend less on bought-in inputs without making the output worth less to customers.
    points:
      - term: Raising what customers will pay
        text: Through design, quality, convenience, speed, reliability, service or a strong [brand](/glossary/brand/), or through a [unique selling point](/glossary/unique-selling-point/) (USP) that rivals lack.
      - term: Cutting the cost of bought-in inputs
        text: By finding cheaper suppliers, buying in bulk, wasting less material or redesigning the product, as long as customers do not end up valuing it less.
    formulas:
      - name: Added value
        expression: Added value = selling price − cost of bought-in materials and services
        note: Per unit, as here, or in total, using sales revenue in place of the selling price. Wages, rent and other costs are paid out of added value; what remains is profit.
    example:
      title: Added value in a jar of jam
      fictional: true
      text: |
        Highfield Berries sells its jam for $6.50 a jar. For each jar it buys in sugar ($0.40), a jar and lid ($0.70), a label ($0.15) and delivery to shops by a courier ($0.75).

        Bought-in materials and services come to $0.40 + $0.70 + $0.15 + $0.75 = $2.00 a jar, so the added value is $6.50 − $2.00 = $4.50 a jar, or $9,000 on the 2,000 jars it sells in a month.

        The fruit comes from its own fields, so it is not bought in: the added value includes the value the farm created by growing it. Out of the $9,000 the farm must still pay its kitchen staff and its other costs before it makes any profit.
  - id: four-sectors
    title: The four sectors of economic activity
    kind: types
    body: |
      Economic activity is classified into four sectors according to what is being done at each stage of production. Read them as a chain: raw materials are extracted in the primary sector, turned into products in the secondary sector and delivered to customers, along with other services, in the tertiary sector, while the quaternary sector supplies knowledge and information along the way.

      The classification describes **activities**, not whole businesses. A single business can work in several sectors at once, so the useful question is not only "which sector is it in?" but "which of its activities are in which sector, and where does its added value come from?"

      The sector matters for analysis because it shapes what a business depends on. Primary businesses depend on land and the weather and are exposed to swings in world prices; secondary businesses depend on machinery and gain from producing on a large scale; tertiary businesses depend on people and on the customer's experience; quaternary businesses depend on highly skilled people and on ideas, which they often protect as intellectual property.
    points:
      - term: Primary sector
        text: Extracting or harvesting natural resources, as in farming, fishing, forestry, mining, quarrying and drilling for oil and gas. Its output is usually sold on as raw material to other businesses.
      - term: Secondary sector
        text: "Making things: turning raw materials and parts into finished products and buildings, as in manufacturing, food processing, energy generation and construction."
      - term: Tertiary sector
        text: "Selling services rather than physical products, to households and to other businesses: retail, transport, banking, insurance, tourism, hairdressing and health care. It is the biggest employer in most developed economies."
      - term: Quaternary sector
        text: "Work based on knowledge and information: research and development, software, data analysis and consultancy. Many writers count it as a branch of the tertiary sector; it is listed separately because so much modern work is of this kind."
    diagram: business-sectors
    example:
      title: One business, four sectors
      fictional: true
      text: |
        Highfield Berries grows fruit (primary), makes jam in its own kitchen (secondary), and runs a farm shop and pick-your-own visits (tertiary). It also charges other growers for advice on its low-water growing method (quaternary).

        Asked which sector it is in, the best answer is mainly primary, with activities in all three other sectors. Much of its added value now comes from turning fruit into jam and visits rather than selling it raw.
  - id: sectoral-change
    title: Sectoral change
    kind: application
    body: |
      The share of output and jobs in each sector changes over time. As an economy develops, work usually moves first off the land and into factories, and later out of factories into services and knowledge-based work: primary, then secondary, then tertiary and quaternary. When manufacturing's share of jobs falls, the process is called deindustrialization.

      Several forces drive the shift.

      - **Rising incomes.** Richer households spend a smaller share of their income on food and basic goods and a larger share on services such as travel, health care, education and entertainment.
      - **Technology.** Machines raise output per worker on farms and in factories, so fewer workers are needed there, while digital technology creates new knowledge-based work.
      - **Globalization.** Manufacturing often moves to countries with lower costs, while richer economies specialize in design, finance and research.
      - **Education.** A more educated workforce makes knowledge-based activity possible.

      Sectoral change is a tendency, not a law. Economies follow different paths: some developed economies keep large manufacturing industries, and some developing economies grow their service sectors quickly without a long industrial stage.
    points:
      - term: Opportunities for businesses
        text: New and growing markets in services and knowledge, such as health and fitness, online learning and tourism, and a growing supply of skilled workers.
      - term: Threats to businesses
        text: Falling demand or tougher foreign competition in declining sectors. Businesses there must cut costs, move into higher-value products or change what they sell.
      - term: Jobs and skills
        text: Employers need different skills, so businesses invest in training and compete for scarce specialists, while workers from declining industries may need to retrain or move.
    example:
      title: A mill town changes
      fictional: true
      text: |
        For decades most jobs in the fictional town of Stanmoor were at two textile mills. When the mills could no longer compete with cheaper imports, one closed and the other cut its workforce by half and switched to technical fabrics for hospitals, which sell at a higher price.

        The empty mill became flats, a climbing centre and offices for a software company. A local bus firm that once ran early buses for the mill shifts now runs a route to the new business park. Sectoral change closed some businesses, forced others to adapt and created new ones.
  - id: entrepreneurship
    title: Entrepreneurship
    kind: concept
    body: |
      **Entrepreneurship** is finding an opportunity and taking the risk of building a business around it: raising the money, gathering the people and other resources, and organizing them to sell something people want. Someone who does it is an **entrepreneur**. As a factor of production, enterprise is what sets the other three to work; without it, land, labour and capital sit idle.

      People become entrepreneurs for many reasons, usually more than one: to earn a profit, to be independent, to turn a skill or a passion into a living, to solve a problem they have met themselves, or to make a social or environmental difference. A push can matter as much as a pull, such as losing a job or finding no work that fits around family life.

      Qualities often linked with successful entrepreneurs include initiative, creativity, resilience after setbacks, a willingness to take calculated risks and the ability to persuade customers, lenders and staff. None of them guarantees success: the idea, the timing, the market and access to finance matter at least as much.

      Entrepreneurship matters to the whole economy. New businesses create jobs, compete with established firms, which pushes prices down and quality up, and bring new products and methods to market. That is why many governments support start-ups with advice, grants or cheaper loans.
    points:
      - term: Entrepreneur
        text: Starts and runs a new venture, puts in time and usually money, carries the risk of failure and keeps the reward of success.
      - term: Intrapreneur
        text: An employee who acts like an entrepreneur inside an existing organization, for example by proposing and leading a new product. The organization provides the money and carries most of the financial risk. Organizations encourage it to keep new ideas coming and to hold on to restless, creative people.
      - term: Social entrepreneur
        text: An entrepreneur who sets out mainly to tackle a social or environmental problem, and pays for the work by trading rather than relying only on donations. The organizations they build are social enterprises ([1.2](/topics/types-of-business-entities/)), and the HL Paper 3 is built around the challenges one faces.
    example:
      title: The same initiative, two routes
      fictional: true
      text: |
        Amara Osei, a fictional physiotherapist, kept seeing patients give up their exercises once they left the clinic. She designed short video routines, tested them with twenty patients and left her job to sell subscriptions to clinics. She put in $15,000 of savings, borrowed $10,000 from her brother and earned far less than her old salary in the first year. An opportunity spotted, resources organized and a personal risk accepted: that is entrepreneurship.

        Leon Varga, a physiotherapist at a large hospital, had a similar idea and persuaded the hospital to fund an app for its own patients, with him leading a small team. He showed the same initiative, but as an intrapreneur: the hospital paid for the project, carried the risk and owns the result.
  - id: starting-up
    title: 'Starting up: opportunities and challenges'
    kind: application
    body: |
      New businesses start when someone sees an opportunity that seems worth the risk. Many opportunities come from **change**: in what customers want, in technology, in the economy, in laws or in attitudes. The challenges come from inside the new business, such as too little money or experience, and from outside it, such as established rivals or a weak economy.

      How much each challenge matters depends on the business. A tutoring service run from home needs very little finance but must win the trust of parents; a restaurant needs a large investment before it serves its first meal and faces strict hygiene rules. And a change that sinks one start-up can be the making of another.

      A **business plan**, one of the planning tools in the toolkit, is the usual way to test an idea before committing to it. It sets out the product, the target customers, how the business will reach them, what it will cost and when cash will come in. Writing it forces the founder to think the idea through, and banks and investors usually ask to see one. Its forecasts are still guesses, though, and forecasts written by someone in love with their idea are rarely cautious.
    points:
      - term: 'Opportunity: a gap in the market'
        text: A need that no business meets, or meets badly, such as late-night food near a university or repairs for an unusual product.
      - term: 'Opportunity: a change in the environment'
        text: Social, technological, economic, environmental, political, legal or ethical change creates new demand, such as more people working from home, a new law that requires safety inspections, or shoppers who want refillable packaging.
      - term: 'Opportunity: low-cost ways to start'
        text: Online shops, social media, shared workspaces and renting rather than buying equipment let many businesses start small and test demand before investing heavily.
      - term: 'Opportunity: independence and reward'
        text: Being your own boss, deciding how to work and keeping the profit are powerful reasons to start.
      - term: 'Challenge: raising finance'
        text: A new business has no track record, so lenders see it as risky and may charge high interest or refuse. Founders often rely on savings, family and small loans, which limits what they can do.
      - term: 'Challenge: winning customers'
        text: Customers stick with brands they know, and retailers are reluctant to stock an unknown product. Building awareness takes time and money that a start-up may not have.
      - term: 'Challenge: cash flow'
        text: "Money goes out before it comes in: equipment, stock and rent must be paid for before the first sale, new suppliers often want cash up front, and big customers may take months to pay. Many start-ups that could have become profitable fail because they run out of cash first."
      - term: 'Challenge: lack of experience'
        text: Running a business takes many skills at once. A brilliant baker may know nothing about pricing, contracts, employment law or bookkeeping, and has nobody to hand them to.
      - term: 'Challenge: rules and paperwork'
        text: Registration, licences, tax, insurance and health and safety rules take time and money, and differ between countries and industries.
      - term: 'Challenge: pressure on the founder'
        text: Long hours, personal financial risk and little time off strain health and family life.
    example:
      title: Weighing a start-up
      fictional: true
      text: |
        Two friends plan Pedal Post, a fictional cargo-bike courier service, in a city that has just banned vans from its centre during the day. The ban is their opportunity: shops in the centre still need deliveries.

        Their challenges are just as clear. They need $18,000 for bikes, insurance and a small depot, but have $7,000 between them. Their first two customers, both large shops, want to pay 60 days after each delivery. Neither founder has managed staff before.

        Their business plan shows the cash running out in the fourth month. So they decide to lease the bikes instead of buying them, and to offer the shops a small discount for paying within 14 days.
  - id: circular-business-models
    title: Circular business models
    kind: framework
    body: |
      Most production still runs in a line: extract or grow materials, make a product, use it, discard it. A **circular business model** bends that line into a loop, so that products, parts and materials are used again and again and waste is avoided at the design stage.

      Circular business models are part of the business management toolkit rather than one of the four content statements for 1.1. The guide names five, suggests using them in units 1 and 5, and includes among the unit's inquiry statements how businesses could benefit from adopting them. They belong here because each one changes what a business takes in, how it transforms it or what happens to its outputs.

      Businesses adopt them for several reasons: raw materials are becoming scarcer and dearer, customers and staff increasingly care about environmental impact, investors weigh environmental risk, and laws on waste and emissions keep tightening.
    points:
      - term: Circular supply
        text: Replacing scarce or newly extracted inputs with renewable, recycled or biodegradable ones, such as packaging made from crop waste instead of plastic.
      - term: Resource recovery
        text: Capturing value from waste, scraps and by-products by turning them into new inputs, for the business itself or for another, such as a brewery selling its spent grain as animal feed.
      - term: Product life extension
        text: Designing products to last and to be repaired, upgraded or resold, such as a phone with replaceable parts, or a retailer that buys back and refurbishes the furniture it sold.
      - term: Sharing
        text: Letting many users share one item instead of each owning one, often through an app, such as a car club or a tool library.
      - term: Product service system
        text: The customer pays to use a product while the business keeps ownership, maintains it and takes it back, such as washing machines rented by the wash or lighting paid for by the month. The business then earns more from products that last than from selling replacements.
    diagram: circular-business-models
    advantages:
      - Lower costs over time, as less is spent on new materials and on getting rid of waste.
      - Can win customers, recruits and investors who care about the environment.
      - Puts the business ahead of tightening environmental rules.
      - Creates new income from repairs, rentals, refills or the sale of by-products.
    limitations:
      - Redesigning products, processes and supply chains takes investment and time.
      - Many customers still choose on price, and some do not want refurbished goods or products they cannot own.
      - Recovered materials can be harder to source reliably and can vary in quality.
      - Renting products out instead of selling them means paying for the stock up front and waiting longer for the money to come back.
      - Claims can run ahead of reality, and a business that calls itself circular but changes little risks being accused of greenwashing.
    example:
      title: A more circular farm
      fictional: true
      text: |
        Highfield Berries replaces its plastic punnets with card ones made from recycled paper (circular supply), turns bruised fruit into jam and composts its plant waste (resource recovery), and lends sturdy picking baskets to pick-your-own visitors for a refundable deposit (sharing).

        The changes cost $6,000 in the first year. The farm expects to save $1,500 a year on waste charges and to earn $2,500 a year more from jam, $4,000 a year in all, so the spending should pay for itself in a year and a half.
evaluation:
  - The four sectors classify activities, not businesses. Many businesses work in several sectors, and the line between the tertiary and quaternary sectors is blurred, so in an answer say which activity you are classifying and why.
  - Added value shows what a business contributes, but it is not profit, and it rests on what customers believe a product is worth. Value created mainly by branding can vanish quickly if tastes change or a rival offers more.
  - Sectoral change describes what has usually happened, not what must happen. One of the guide's theory of knowledge questions for this unit asks whether business can discover laws in the way the natural sciences do; patterns like this one are tendencies that particular countries and industries can break.
  - Entrepreneurial qualities help, but they are neither necessary nor sufficient. Many start-ups with talented founders fail because the market, the timing, the finance or the execution was wrong, and luck plays a larger part than success stories admit.
  - The challenges of starting up are not equal. A service run from home needs little capital but must build trust; a manufacturer needs heavy investment before its first sale. Weigh the challenges for the particular business, not in general.
  - Circular business models can cut costs and win customers, but they take time and money, and not every customer will pay for them. Whether one suits a business depends on its product, its customers and whether its actions match its claims.
  - In an examination answer, describe the business in the case precisely, with its own inputs, outputs and sectors, and use its figures. Two or three challenges explained with the case's evidence and weighed for that business earn more than a long general list.

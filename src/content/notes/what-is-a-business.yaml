# Notes: 1.1 What is a business? Written in the platform's own words from the
# guide's four content statements (p. 23), with circular business models from
# the toolkit (pp. 13 to 14). The supplied coursebook chapter (Hodder, pp. 58
# to 70) and its toolkit pages on circular business models and business plans
# (pp. 22 to 24 and 45 to 46) were read to check coverage and conventions; no
# passage, table or case from them is reproduced. The coursebook's syllabus box
# for 1.1 leaves out the guide's "Entrepreneurship (AO2)" statement and the
# chapter has no section on it, so that section follows the guide and the
# platform's glossary. Every business named is fictional.
#
# The opening situation, industries, stakeholders, decision, exam-style
# practice and revision summary were added on 3 November 2026. The guide sets
# 1.1 at AO1 and AO2 (p. 23) and allows no command term above a statement's
# level (p. 42), so the one evaluative question draws on 1.2 and 3.2 and says

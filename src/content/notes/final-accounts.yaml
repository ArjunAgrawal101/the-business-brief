retrieval:
  - q: What does each of the two final accounts show?
    a: The statement of profit or loss shows revenue, costs and profit over a period, usually a year. The statement of financial position shows assets, liabilities and equity on one date, usually the last day of the year.
  - q: What other names does the syllabus use for the two statements?
    a: The profit and loss account (also called the income statement) and the balance sheet. Examination papers use statement of profit or loss and statement of financial position.
  - q: Put these lines in the guide's order. Profit for the period, gross profit, retained profit, profit before interest and tax, profit before tax.
    a: Gross profit, profit before interest and tax, profit before tax, profit for the period, retained profit.
  - q: Why do net assets always equal total equity?
    a: Everything a business owns was paid for either with money it owes (liabilities) or with its owners' money (equity), so total assets minus total liabilities must equal equity.
  - q: Give one thing a lender and one thing an employee looks for in the accounts.
    a: 'A lender: for example whether profit covers the interest, how much the business already owes, its cash, or assets that could secure a loan. An employee: for example whether jobs are secure, or whether the business can afford a pay rise.'
  - q: Name three types of intangible asset. Why is a brand that a business has built itself usually missing from its accounts?
    a: For example goodwill, brands, patents, copyrights, trademarks, licences and franchise rights. Intangible assets are usually recorded only when bought, at the price paid, because otherwise their value is too uncertain to measure.
  - q: Why does closing stock appear in both statements?
    a: It is deducted inside cost of sales, because it has not been sold, and it is a current asset in the statement of financial position, because the business still owns it.
  - q: (HL only) A machine costs $20,000, is expected to last 6 years and then to sell for $2,000. What is the annual straight line depreciation?
    a: ($20,000 − $2,000) ÷ 6 = $3,000 a year.
  - q: (HL only) When is the units of production method more appropriate than the straight line method?
    a: When the asset wears out with use, the use varies from year to year and it can be measured, as with a production machine or a delivery van. Straight line suits assets that lose value steadily with age, such as buildings or furniture.

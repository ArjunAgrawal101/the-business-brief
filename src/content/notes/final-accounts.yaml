# Notes: 3.4 Final accounts. Written in the platform's own words from the
# guide's five content statements (p. 29), the unit's conceptual
# understandings (p. 28), its statement layouts (pp. 59 to 62) and its formula
# list (pp. 64 to 65), which gives no formula for depreciation, so the
# standard forms are used and labelled as such. The line names follow the
# guide's layouts and the platform's finance code (src/lib/ratio-view.ts). The
# teacher support material's glossary was read to check terms; no coursebook
# chapter for unit 3 was supplied. Every business named is fictional, and
# every figure was checked by arithmetic.
code: '3.4'
title: Final accounts
level: SL/HL with HL-only content
introduction: |
  Every business keeps a record of what it sells and spends, and of what it owns and owes. At the end of each financial year it turns those records into its **final accounts**: a statement of profit or loss, which shows the profit (or loss) made over the year, and a statement of financial position, which shows what the business owns and owes on the last day of it.

  The accounts matter because so many people make decisions with them. Owners decide whether to put in more money, banks whether to lend, suppliers whether to give credit, and managers where to cut or invest. This subtopic shows who reads the accounts and why, how to read and prepare both statements in the layout the IB uses, and which intangible assets a business can own. At HL it adds how to calculate depreciation by two methods, and how to judge which method suits an asset.
objectives:
  - '**Explain** why different stakeholders need a business''s final accounts, and what each looks for in them.'
  - '**Prepare** a statement of profit or loss and a statement of financial position in the guide''s layout.'
  - '**Explain** the main types of intangible asset, and why they are hard to value.'
  - '**Calculate** depreciation by the straight line and units of production methods, with the net book value each year (HL only).'
  - '**Justify** the choice of depreciation method for a particular asset (HL only).'
sections:
  - id: purpose-of-accounts
    title: Who reads the accounts, and why
    kind: concept
    body: |
      **Final accounts** are the financial statements a business prepares at the end of its financial year. The guide names two: the **statement of profit or loss**, which shows the revenue, costs and profit of the year, and the **statement of financial position**, which shows the assets, liabilities and equity on the last day of it.

      Accounts do three jobs. They **record** what happened, so that the owners can see how their money has been used and how well the managers have looked after it. They **inform decisions**, inside the business and outside it. And they meet the **law**: limited companies must usually prepare accounts every year, and many must publish them and have them checked by independent auditors, while sole traders and partnerships keep accounts mainly for tax and for their own planning.

      Each stakeholder opens the accounts with its own question, so the same figures matter in different ways to different readers.
    points:
      - term: Shareholders and owners
        text: Is the business profitable, is it growing in value, and can it pay a dividend? They also judge how well the directors have used the money entrusted to them.
      - term: Managers
        text: How did the business perform against its targets, and where should it invest, cut costs or change prices? The accounts supply the figures for planning, for control and for ratio analysis.
      - term: Employees and trade unions
        text: Are jobs secure, and can the business afford better pay? Rising profit strengthens a pay claim; losses may warn of redundancies.
      - term: Lenders
        text: Can the business pay the interest and repay a loan on time? Banks look at profit, at existing debts, at cash and at the assets that could secure a loan.
      - term: Suppliers
        text: If they deliver on credit, will they be paid, and on what terms? A supplier checks the business's liquidity before agreeing to trade credit.
      - term: Customers
        text: Will the business still be there to honour a guarantee, supply spare parts or finish a long contract?
      - term: Government
        text: Has the right amount of tax been paid, and has the business followed the law on reporting? Governments also use accounts for statistics and when deciding on grants.
      - term: Competitors and potential investors
        text: How does the business compare with others in its industry? Published accounts let rivals benchmark themselves, and investors compare businesses before they buy shares.
      - term: Local community and pressure groups
        text: Is the business secure enough to keep jobs in the area, and how much does it earn while its activities affect the people around it?
    example:
      title: Three readers, one set of accounts
      fictional: true
      text: Clearview Optics, a fictional maker of spectacle lenses, publishes accounts showing its profit for the period up from $400,000 to $480,000, a rise of a fifth, and a new $2 million bank loan to pay for a factory extension. Its shareholders welcome the profit and ask for a bigger dividend. Its bank asks whether the profit will cover the interest on the new loan comfortably. The trade union notes the rise in profit and opens pay talks. The accounts are the same; each reader is looking at a different line.
  - id: statement-of-profit-or-loss
    title: The statement of profit or loss
    kind: method
    body: |
      The statement of profit or loss shows how much profit or loss a business made over a period, usually a year. It starts with sales revenue and takes away each kind of cost in turn, so that profit can be seen at several stages. The syllabus calls it the **profit and loss account**, and it is also known as the income statement; examination papers present it as the statement of profit or loss, so use that name.

      It counts revenue when it is **earned** and costs when they are **incurred**, not when cash changes hands. A sale made on credit in December belongs to that year's accounts even if the customer pays in February, which is one reason profit is not the same as cash ([3.7](/topics/cash-flow/)).

      The diagram follows the guide's order, line by line, for a fictional company. Sales revenue of $500,000 leaves gross profit of $200,000 after cost of sales, profit before interest and tax of $80,000 after expenses, and a profit for the period of $56,000 after interest and tax. The company pays $20,000 in dividends and keeps the remaining $36,000 as retained profit.

      A non-profit entity, such as a charity, uses the same layout, but its profit lines are called **surpluses** (gross surplus, surplus for the period and so on), and there is no dividend line, because there are no shareholders to pay.
    diagram: profit-or-loss-waterfall
    points:
      - term: Sales revenue
        text: The value of everything sold in the period, whether for cash or on credit.
      - term: Cost of sales
        text: The direct cost of the goods or services actually sold. For a business that buys goods to resell, it is opening stock + purchases − closing stock.
      - term: Gross profit
        text: Sales revenue minus cost of sales, the profit on trading before the running costs are paid.
      - term: Expenses
        text: The running costs that are not part of cost of sales, such as rent, salaries, marketing, insurance and depreciation.
      - term: Profit before interest and tax
        text: Gross profit minus expenses, the profit from the business's operations. The profit margin and ROCE are both calculated from it ([3.5](/topics/profitability-and-liquidity-ratio-analysis/)).
      - term: Interest and tax
        text: Interest on loans and overdrafts is deducted to give profit before tax. Tax on the profit is then deducted to give the profit for the period.
      - term: Profit for the period
        text: What is left for the owners once every cost, the interest and the tax have been deducted.
      - term: Dividends and retained profit
        text: Dividends are the part of the profit for the period paid to shareholders. The rest is **retained profit**, kept in the business, which adds to retained earnings in the statement of financial position.
    formulas:
      - name: Gross profit
        expression: Gross profit = sales revenue − cost of sales
      - name: Profit before interest and tax
        expression: Profit before interest and tax = gross profit − expenses
      - name: Profit before tax
        expression: Profit before tax = profit before interest and tax − interest
      - name: Profit for the period
        expression: Profit for the period = profit before tax − tax
      - name: Retained profit
        expression: Retained profit = profit for the period − dividends
        note: The guide's formula list does not include these; they follow from the order of its statement of profit or loss.
  - id: statement-of-financial-position
    title: The statement of financial position
    kind: method
    body: |
      The statement of financial position shows what a business **owns** (its assets), what it **owes** (its liabilities) and what belongs to its **owners** (its equity) on one date, usually the last day of the financial year. It is a snapshot, not a record of the year: a week later the figures could look quite different. The syllabus calls it the **balance sheet**; examination papers use statement of financial position.

      It always balances, because everything a business owns has been paid for either with money it owes (liabilities) or with its owners' money (equity). Total assets minus total liabilities, the **net assets**, must therefore equal **total equity**. If a statement you prepare does not balance, an item is missing, counted twice or in the wrong place.

      In the diagram's fictional company, total assets of $450,000 less total liabilities of $200,000 leave net assets of $250,000, exactly the share capital of $150,000 plus retained earnings of $100,000. A non-profit entity has no share capital, so in the guide's layout its equity is its retained earnings alone.
    diagram: financial-position-balance
    points:
      - term: Non-current assets
        text: Assets kept and used for more than a year. The guide's layout shows property, plant and equipment at cost, less **accumulated depreciation**, the total wear charged against them so far.
      - term: Current assets
        text: Cash, debtors (customers who still owe the business money) and stock, all expected to turn into cash or be used up within a year.
      - term: Current liabilities
        text: Debts due within a year. The guide lists the bank overdraft, trade creditors (suppliers waiting to be paid) and other short-term loans.
      - term: Non-current liabilities
        text: Debts due in more than a year, shown in the guide's layout as long-term borrowings.
      - term: Net assets
        text: Total assets minus total liabilities, the value of the owners' stake as the accounts record it.
      - term: Equity
        text: Share capital (the money owners paid in for their shares) plus retained earnings (all the profit kept in the business since it began).
    formulas:
      - name: Non-current assets
        expression: Non-current assets = property, plant and equipment − accumulated depreciation
      - name: Total assets
        expression: Total assets = non-current assets + current assets
      - name: Total liabilities
        expression: Total liabilities = current liabilities + non-current liabilities
      - name: Net assets
        expression: Net assets = total assets − total liabilities
      - name: Total equity
        expression: Total equity = share capital + retained earnings
        note: Total equity always equals net assets. Calculating depreciation is HL only, but every student needs to know where accumulated depreciation sits.
  - id: preparing-final-accounts
    title: Preparing the accounts from a list of figures
    kind: method
    body: |
      A common task gives a list of figures in no particular order and asks you to prepare one or both statements. Work through it in five steps.

      1. Sort the items. Revenue, costs, interest, tax and dividends for the year belong in the statement of profit or loss; what is owned and owed at the year end belongs in the statement of financial position.
      2. Give each statement a full heading: the name of the business, the statement, and the period ("for the year ended 31 December 2025") or the date ("as at 31 December 2025").
      3. Put the items in the guide's order, and work out each subtotal as you go.
      4. Show deductions in brackets, as the guide's statement of financial position does for accumulated depreciation.
      5. Check that net assets equal total equity, and that retained earnings have grown by this year's retained profit.
    example:
      title: Tidewater Outdoors, year ended 31 December 2025
      fictional: true
      text: |
        Tidewater Outdoors Ltd, a fictional retailer of camping and hiking gear, gives these figures for 2025, in $000: sales revenue 840; opening stock 60; purchases 380; closing stock 70; expenses 330; interest 12; tax 32; dividends 36; property, plant and equipment 600; accumulated depreciation 150; cash 25; debtors 55; bank overdraft 10; trade creditors 45; other short-term loans 20; long-term borrowings 120; share capital 150; retained earnings at the start of the year 195.

        **Statement of profit or loss for the year ended 31 December 2025** ($000)

        - Sales revenue: 840
        - Cost of sales: (370), that is 60 + 380 − 70
        - Gross profit: 470
        - Expenses: (330)
        - Profit before interest and tax: 140
        - Interest: (12)
        - Profit before tax: 128
        - Tax: (32)
        - Profit for the period: 96
        - Dividends: (36)
        - Retained profit: 60

        **Statement of financial position as at 31 December 2025** ($000)

        - Non-current assets: property, plant and equipment 600, accumulated depreciation (150), non-current assets 450
        - Current assets: cash 25, debtors 55, stock 70, current assets 150
        - Total assets: 600
        - Current liabilities: bank overdraft 10, trade creditors 45, other short-term loans 20, current liabilities 75
        - Non-current liabilities: long-term borrowings 120, non-current liabilities 120
        - Total liabilities: 195
        - Net assets: 405
        - Equity: share capital 150, retained earnings 255 (195 + 60), total equity 405

        Net assets of 405 equal total equity of 405, so the statement balances. Closing stock appears twice, as a deduction inside cost of sales and as a current asset, because the stock still on the shelves at the year end has not yet been sold.
  - id: intangible-assets
    title: Intangible assets
    kind: types
    body: |
      An **intangible asset** has no physical form but still has value, because it will help the business earn money in the future. For many businesses, such as software firms, drinks brands and drug companies, intangible assets are worth more than all their buildings and machines together.

      Intangible assets are non-current assets, kept for more than a year, and they raise two problems for the accounts. They are **hard to value**, because their worth depends on future earnings that no one can know for certain. For that reason the accounts usually record them only when they have been **bought**, at the price paid. A brand that a business has built up itself rarely appears in its statement of financial position, so the accounts can understate what the business is really worth. The guide's layout shows only property, plant and equipment among the non-current assets; published accounts usually give intangible assets a line of their own.

      Patents, copyrights and trademarks are forms of intellectual property, whose legal protection HL students study in [5.8](/topics/research-and-development/).
    points:
      - term: Goodwill
        text: The amount paid for a business above the value of its separate net assets, a price for its reputation, customers, location and staff. It appears only when one business buys another.
      - term: Brands
        text: The name, logo and reputation that let a product sell at a higher price or in greater volume. A bought brand is recorded at its cost; a home-grown one usually is not.
      - term: Patents
        text: The legal right to be the only one to make, use or sell an invention for a fixed period, commonly 20 years. Once it expires, rivals can copy the invention freely.
      - term: Copyrights
        text: The right to control the copying of an original work, such as software, music, a book or a film, for many years.
      - term: Trademarks
        text: A registered name, logo, symbol or slogan that identifies a business's products and that others may not use. Registration can usually be renewed, so the protection can last indefinitely.
      - term: Licences and franchise rights
        text: Rights bought to do something for a period, such as to broadcast, to run a mobile network or to trade under a franchisor's brand.
    example:
      title: Paying for a name
      fictional: true
      text: Orchard Fizz, a fictional drinks maker, buys Hillside Juices for $4.2 million. Hillside's factory, stock and other assets, less its debts, are worth $2.6 million. The extra $1.6 million pays for things Hillside's own statement of financial position never showed, such as its brand, its supermarket contracts and its loyal customers, and Orchard Fizz records it among its intangible assets as the brand and goodwill. If a food scare later damaged the Hillside name, Orchard Fizz would have to reduce the value of these assets in its accounts, and the reduction would cut its profit.
  - id: depreciation
    title: 'Depreciation: straight line and units of production'
    kind: method
    level: HL
    body: |
      Most non-current assets wear out, become out of date or are used up. **Depreciation** spreads the cost of such an asset, less the amount it should fetch when the business has finished with it (its **residual value**), over the years it is used. Each year's share is an **expense** in the statement of profit or loss, which lowers profit. The total charged so far is the **accumulated depreciation** taken off the asset's cost in the statement of financial position, and what remains is its **net book value**.

      Depreciation does two things. It matches the cost of an asset to the years that benefit from it, so one year's profit does not carry the whole price of a machine that will work for five. And it involves **no cash**: the cash left the business when the asset was bought, and the yearly charge only moves part of the cost from the statement of financial position to the statement of profit or loss.

      The guide names two methods but gives no formulas for them (its formula list, pp. 64 to 65, has none for depreciation), so the forms below are the standard ones. The **straight line method** charges the same amount every year. The **units of production method** charges according to how much the asset is used in the year.
    diagram: depreciation-methods
    formulas:
      - name: Straight line method
        expression: Annual depreciation = (cost − residual value) ÷ useful life in years
        note: Not on the guide's formula list; this is the standard form.
      - name: Units of production method, the rate
        expression: Depreciation per unit = (cost − residual value) ÷ expected total units over the asset's life
        note: Not on the guide's formula list; this is the standard form. A unit can be an item made, an hour run or a kilometre driven.
      - name: Units of production method, the year's charge
        expression: Depreciation for the year = depreciation per unit × units produced in the year
      - name: Net book value
        expression: Net book value = cost − accumulated depreciation
    example:
      title: One machine, two methods
      fictional: true
      text: |
        Fernway Plastics, a fictional maker of garden chairs, buys a moulding machine for $50,000. It expects to use it for five years, make 90,000 chairs with it and then sell it for $5,000. The amount to depreciate is $50,000 − $5,000 = $45,000. The diagram plots this machine.

        - Straight line: $45,000 ÷ 5 = $9,000 a year. Net book value at the end of years 1 to 5: $41,000, $32,000, $23,000, $14,000 and $5,000.
        - Units of production: $45,000 ÷ 90,000 = $0.50 a chair. With 30,000, 25,000, 15,000, 12,000 and 8,000 chairs made in years 1 to 5, the charges are $15,000, $12,500, $7,500, $6,000 and $4,000. Net book value: $35,000, $22,500, $15,000, $9,000 and $5,000.

        Both methods charge $45,000 in total and end at the residual value; they differ only in **when** the cost falls. In year 1, units of production charges $6,000 more than straight line, so year 1's profit is $6,000 lower. From year 3 it charges less.
  - id: choosing-a-method
    title: Which depreciation method is appropriate?
    kind: evaluation
    level: HL
    body: |
      Neither method is right for every asset. The test is how the asset actually loses its value: **with time**, or **with use**. The closer the method follows that pattern, the more fairly each year's profit carries the cost of the assets used to earn it.

      Two further questions decide it in practice. Can the business measure the asset's use, and estimate its total lifetime output with some confidence? And does the asset lose value even when it stands idle, because it ages or goes out of date, as a computer does? Whichever method is chosen should then be used consistently from year to year, so that one year's profit can be compared with the next.
    points:
      - term: Straight line suits
        text: Assets that lose value steadily with age, whatever the level of output, such as buildings, shop fittings, furniture and office equipment.
      - term: Units of production suits
        text: Assets that wear out with use, where the use varies from year to year and is easy to measure, such as production machinery, delivery vehicles (in kilometres) and aircraft engines (in flying hours).
      - term: The straight line method
        text: Simple to calculate and to explain, and the same charge every year makes profits easy to compare and to plan. But it ignores how hard the asset is worked, so a machine run day and night carries the same charge as one that stands idle.
      - term: The units of production method
        text: Puts the cost into the years when the asset is busy, so it matches the cost to the revenue the asset helps to earn. But it needs a reliable estimate of lifetime output and a record of use every year, and it charges very little in a quiet year, although the asset is still ageing.
      - term: The estimates matter too
        text: Both methods rest on estimates of useful life and residual value. A longer life or a higher residual value lowers each year's charge and raises reported profit, which is why these choices can be used to make the accounts look better than they are.
    example:
      title: A van and a desk
      fictional: true
      text: Pelham Couriers, a fictional delivery firm, buys a van for $36,000. It expects to drive it 200,000 km over about five years and then sell it for $6,000. By the straight line method it would charge ($36,000 − $6,000) ÷ 5 = $6,000 every year. By the units of production method, counted in kilometres, it charges $30,000 ÷ 200,000 = $0.15 a kilometre, so $7,500 in a busy year of 50,000 km and $4,500 in a quiet year of 30,000 km. The van wears out with the distance driven, and the firm records the distance anyway, so units of production matches its cost to the deliveries that earned the revenue. Pelham's office desks and chairs age at the same rate whatever the volume of trade, so the straight line method suits them.
evaluation:
  - Final accounts look backwards. They describe last year at last year's values, while most stakeholders want to know about next year. Treat them as evidence about the business's prospects, read alongside its plans and its market, not as a forecast.
  - The statement of financial position is a snapshot of one day, and a business can arrange that day, for example by selling assets, delaying purchases or chasing debts just before the year end, or by recording sales early. This **window dressing** can be legal and still mislead. The guide's conceptual understandings for unit 3 note that creativity in financial reporting can have diverse impacts, and that ethical accounting can be a form of sustainable behaviour. Accounts read over several years, with their notes and the auditors' report, are much harder to dress.
  - Many figures are judgements, not facts. Depreciation (HL) rests on estimates of useful life and residual value; stock may be worth less than it cost; some debtors will never pay. Two honest accountants can report different profits for the same year, so comparisons between businesses need care.
  - Some of a business's most valuable resources are missing. Brands it has built itself, the skills of its staff, its reputation and its customers' loyalty rarely appear, so net assets can be far below what the business would sell for, especially in services and technology. Social and environmental effects are left out altogether.
  - Which figure matters depends on who is reading. A large dividend pleases shareholders but may worry a lender; a rise in profit strengthens a pay claim; a supplier cares more about cash than about profit. Judging accounts means asking whose question they are being used to answer.
  - Profit is not cash. A healthy profit for the period can sit beside an empty bank account if customers pay late or stock piles up, so read the cash line in the statement of financial position, and a cash flow forecast, before deciding that a profitable business is safe.

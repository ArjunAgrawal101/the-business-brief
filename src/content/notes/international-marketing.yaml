# Notes: 4.6 International marketing (HL only). Written in the platform's own
# words from the guide's single content statement (p. 32), so every section and
# question is HL. The statement is the opportunities and threats of entering
# and operating internationally (AO3); the ways of entering a market and the
# choice between standardizing and adapting the marketing mix are taught as
# the means through which those opportunities and threats arise, a teaching
# choice the notes state. The capacity utilization formula is the guide's
# (p. 65); the exchange rate and tariff arithmetic is standard and labelled as
# such. The toolkit tools named (STEEPLE, Hofstede's cultural dimensions, the
# Ansoff matrix, Porter's generic strategies) are from the guide (pp. 13 to
# 14). No coursebook chapter for 4.6 was supplied; the teacher support
# material's glossary (pp. 80 to 90) was read to check the terms for methods of
# entry, and nothing from it is reproduced. Countries are left unnamed and
# currencies generic, so that no claim is made about a real economy. Every
# business named is fictional and every figure simulated; each figure was
# checked by script.
code: '4.6'
title: International marketing
level: HL
introduction: |
  For a business whose home market has stopped growing, the rest of the world looks like an obvious answer: more customers, more sales, and more chances to spread its costs and risks. But every advantage of going abroad comes with a matching danger, from customers who want something different to currencies, laws and rivals the business does not understand.

  This HL subtopic has a single statement in the guide: the opportunities and threats of entering and operating in international markets, at AO3. To judge them you also need to know the main ways of entering a market and the choice between keeping the marketing mix the same everywhere and adapting it, so these notes cover both as the means through which the opportunities and threats arise.
objectives:
  - '**Explain** the main ways of entering an international market, and how risk and control change between them.'
  - '**Explain** the opportunities that entering and operating in international markets can bring.'
  - '**Analyse** the threats a business faces when it enters and operates in international markets.'
  - '**Discuss** how far a business should standardize or adapt its marketing mix for an international market.'
  - '**Evaluate** the opportunities and threats of international marketing for a given business, and **recommend** whether and how it should enter a market.'
situation:
  title: Brightfield looks beyond its borders
  fictional: true
  text: |
    Brightfield, a fictional maker of oat-based breakfast foods, has grown for twenty years in its home country, where it now sells in every major supermarket. Sales growth has slowed to almost nothing, and its factory works at only 60% of its capacity. The board sees two chances abroad.

    A neighbouring country, in the same trading bloc, has similar tastes, no tariffs on Brightfield's products and a strong local rival brand. A large, distant market is growing fast as incomes rise, but breakfast there is usually a hot, savoury meal, imported food faces a 20% tariff, and its currency has swung sharply against Brightfield's over the past two years. A local food company has offered a joint venture to make and sell Brightfield products there.

    The marketing director wants to move fast. The finance director fears that going abroad could cost the firm its strong position at home. What opportunities and threats would Brightfield face in each market, and should it go?
sections:
  - id: going-international
    title: What international marketing involves
    kind: concept
    level: HL
    body: |
      **International marketing** is marketing a business's products in more than one country. It involves three linked decisions: **which markets** to enter, **how** to enter them, and **how far to adapt** the marketing mix for each. Each decision shapes the opportunities the business can seize and the threats it is exposed to.

      More businesses face these decisions than ever before. **Globalization**, the growing integration of economies through trade, investment, technology and the movement of people, has lowered many barriers between markets. **E-commerce** lets even a small business sell to customers abroad from its own website, and **trading blocs** remove tariffs and harmonize rules between their members. Yet selling abroad is still harder than selling at home. Primary research is more expensive and secondary research may rest on less reliable data, customers behave differently, and the business knows less about the laws, the rivals and the distribution channels.

      International marketing is not the same as becoming a multinational company (subtopic 1.6). A business that only exports is marketing internationally but does not operate in other countries; it becomes a multinational company when it owns and controls operations, such as factories, offices or shops, abroad. Choosing a market usually starts with the questions any marketing plan asks, about market size, growth, competition and customers' needs, together with an analysis of the market's external environment, for which the toolkit's STEEPLE analysis is designed.
    points:
      - term: Which markets
        text: Judged on size and growth, the strength of local competition, customers' incomes and tastes, ease of access, and how different the market is from home in culture, law, economy and distance.
      - term: How to enter
        text: From exporting, with little investment and little control, to owning operations abroad, with full control and full exposure to risk. The choice decides how much the business can gain and how much it can lose.
      - term: How far to adapt
        text: From one standardized marketing mix everywhere to a mix adapted for each market, with most businesses somewhere between the two.
      - term: Kinds of distance (enrichment)
        text: Some writers, such as Pankaj Ghemawat in his CAGE framework, group the differences between countries into cultural, administrative (legal and political), geographic and economic distance. It is beyond the syllabus, but a useful checklist of why a market that looks attractive on paper can be hard to enter.
    example:
      title: Brightfield's first question
      fictional: true
      text: Before choosing a way in, Brightfield's marketing team compares the two markets. The neighbouring country is close in every sense, with similar tastes, the same trading rules and a short road journey, but it is small and already has a strong local brand. The distant market is large and growing, but far away in tastes, law, currency and geography. The team's conclusion is that the first market offers lower risk and modest reward, and the second a much larger prize that is much harder to win.
  - id: entry-methods
    title: Ways of entering an international market
    kind: types
    level: HL
    body: |
      A business can enter a foreign market in several ways, and the choice changes the balance of opportunity and threat. The methods form a ladder. At the bottom, **exporting** needs little investment and carries little risk, but gives the business little control over how its products are sold and little knowledge of the market. At the top, **owning operations abroad**, by building or buying them, gives full control and the whole of the profit, but needs large investment and exposes the business to every local risk.

      Between the two lie methods that share the reward, the risk and the control with a local partner. **Licensing** and **franchising** let a partner use the business's brand, designs or way of working in return for fees and royalties. **Joint ventures** and **strategic alliances** combine the business's products and know-how with a partner's local knowledge, contacts and distribution. Several of these are also the external growth methods of subtopic 1.5, seen here from the point of view of reaching new countries.

      Many businesses climb the ladder in stages: test demand by exporting or selling online, then appoint a local distributor, then form a partnership, and invest in their own operations only once the market has proved itself. Others jump straight to a joint venture or an acquisition because tariffs make exporting uncompetitive, because the law requires a local partner, or because speed matters more than caution.
    points:
      - term: Exporting
        text: Selling goods made at home to customers abroad, directly, online or through agents and distributors. Low cost and low risk, and a good way to test demand, but tariffs, transport costs and exchange rates bite, and the business depends on intermediaries for local knowledge.
      - term: Licensing
        text: Allowing a business abroad to make or sell products using the licensor's brand, designs or patents, in return for a fee or royalty. Fast and cheap, but the licensor earns only the royalty, loses control over quality and may create a future rival.
      - term: Franchising
        text: Selling a franchisee abroad the right to run a business under the franchisor's brand and system. Rapid growth using others' capital and local knowledge, but the franchisor's reputation rests on franchisees it does not manage day to day.
      - term: Joint venture and strategic alliance
        text: Sharing the investment, risk and rewards with a local partner, through a jointly owned business or a looser agreement to cooperate. Gains local knowledge, contacts and sometimes legal access, but the partners may disagree over goals, control and the sharing of profit.
      - term: Acquisition or own operations
        text: Buying a business abroad or setting up a subsidiary from scratch, which is foreign direct investment. Full control and all the profit, and a way round tariffs, but the largest investment and the greatest exposure to political, economic and cultural risk.
    example:
      title: Brightfield's possible routes
      fictional: true
      text: |
        - **Neighbouring country:** inside the trading bloc there are no tariffs, so **exporting** through a national supermarket distributor is cheap and quick, and would test demand before any larger commitment.
        - **Distant market:** exporting would face the 20% tariff and the swinging currency. The **joint venture** offered by a local food company would make the products locally, avoiding the tariff, and bring the partner's knowledge of local tastes and shops, at the cost of sharing control and profit with a company Brightfield does not yet know.
  - id: opportunities
    title: The opportunities of entering and operating internationally
    kind: types
    level: HL
    body: |
      The opportunities of international marketing come down to growth, efficiency and resilience. The most obvious is **growth**: new customers when the home market is saturated, or when competition at home is fierce. A product that is mature or declining at home may be new abroad, so international markets can also **extend the product life cycle**, earning more from products, brands and know-how the business has already paid to develop.

      Growth brings **efficiency**. Selling more spreads fixed costs such as research and development, design, advertising and factory overheads over more units, giving **economies of scale** and lowering average costs, which can then fund lower prices or higher margins at home as well as abroad. A business with spare capacity gains most, because extra output from an existing factory costs only its variable cost. Operating abroad can also give access to cheaper materials, labour or skills, and to new ideas, since a product developed for one market sometimes succeeds back home.

      International markets can also bring **resilience**. A business that sells in several countries is less exposed to a recession, a new rival or a change in taste in any one of them, because its markets rarely move together. Inside a trading bloc, free trade with other members makes all of this cheaper, and a strong international presence can raise a brand's status, which helps it everywhere.
    diagram: international-marketing
    points:
      - term: New customers and growth
        text: Larger total sales when the home market is saturated or highly competitive, especially in markets where incomes are rising.
      - term: Economies of scale
        text: Fixed costs spread over more units lower the average cost of each, especially where the business has spare capacity.
      - term: A longer product life cycle
        text: A product in maturity or decline at home can be launched into the introduction or growth stage abroad.
      - term: Spreading risk
        text: Problems in one market are offset by others, so revenue and profit become more stable.
      - term: Access to resources and ideas
        text: Cheaper or scarcer materials, labour and skills, and products or methods learned abroad that can be used at home.
      - term: A stronger brand
        text: An international presence can raise a brand's status and recognition, which supports its price in every market.
    formulas:
      - name: Capacity utilization rate
        expression: Capacity utilization rate = actual output ÷ productive capacity × 100
        note: As on the guide's formula sheet (p. 65, HL). It shows how much room a business has to supply new markets from its existing factory.
    example:
      title: Filling Brightfield's factory
      fictional: true
      text: |
        Brightfield's factory can make 50 million packs a year but makes 30 million, a capacity utilization rate of 30 ÷ 50 × 100 = **60%**. Its fixed costs are $6 million a year, about **$0.20** a pack. All figures are simulated.

        If exports to the neighbouring country added 12.5 million packs, output would rise to 42.5 million and capacity utilization to 42.5 ÷ 50 × 100 = **85%**. Fixed costs would fall to $6 million ÷ 42.5 million, about **$0.14** a pack, lowering the average cost of every pack Brightfield sells, at home as well as abroad. This is the opportunity in its simplest form: spare capacity turned into sales without building anything new.
  - id: threats
    title: The threats of entering and operating internationally
    kind: types
    level: HL
    body: |
      Each opportunity has a threat attached, and many threats come from the same source: the business knows less about a foreign market than about its own. **Cultural differences** in language, tastes, customs, values, religion and ways of doing business can make a product, a brand name, a colour or an advertisement fail, or offend. What customers expect from staff also varies between cultures, which matters for services. The HL toolkit's Hofstede's cultural dimensions help a business anticipate some of these differences, though they describe national averages, not individual customers.

      Many threats are set by governments and economies. **Trade barriers**, such as tariffs, quotas and strict product rules, raise costs or block entry, and can change quickly with politics. **Exchange rates** move: if the exporter's currency rises, its products become dearer abroad, or it must accept lower margins. Laws on product safety, labelling, advertising, employment and the protection of intellectual property differ, and the costs of compliance add up. **Political risk**, from instability and sudden changes of policy to sanctions or conflict, can wipe out an investment, and economic conditions, such as inflation, recession or low incomes, change what customers can afford.

      Others come from operating at a distance. Local rivals know the market, the customers and the distribution channels, and may be favoured by buyers or governments. Transport, communication and time zones raise costs and slow decisions, and managing staff, partners or franchisees abroad is harder than managing them at home. A business can also damage its reputation through the conduct of suppliers or partners abroad, and, perhaps most often overlooked, it can weaken its home market by diverting money and management attention to the new one.
    points:
      - term: Cultural and language differences
        text: Different tastes, customs, values, meanings and expectations of service, which can make a product or message fail or offend, and a brand name that sounds odd or rude in another language.
      - term: Trade barriers
        text: Tariffs, quotas, embargoes and product rules that raise prices or block entry, and that can change with little warning.
      - term: Exchange rate movements
        text: A rise in the exporter's currency makes its products dearer abroad or cuts its margin; a fall makes imported materials dearer. Movements make prices and profits harder to plan.
      - term: Legal and political risk
        text: Different laws on products, advertising, employment and intellectual property; instability, sudden policy changes, sanctions or conflict that can make an investment worthless.
      - term: Local competition
        text: Rivals who know the customers, the channels and the officials, and who can respond quickly to a newcomer.
      - term: Distance and control
        text: Higher costs of transport and communication, slower decisions, and less control over partners, franchisees and staff, which puts quality and reputation at risk.
    example:
      title: The currency and the tariff
      fictional: true
      text: |
        Brightfield's export price is $2.00 a pack. Two years ago one dollar bought 5 units of the distant market's local currency (LC5); now it buys LC6. Imported food also pays a 20% tariff. The figures are simulated and the arithmetic is the standard conversion, not a formula from the guide.

        - Two years ago: $2.00 × 5 = LC10, and with the tariff LC10 × 1.2 = **LC12** a pack.
        - Now: $2.00 × 6 = LC12, and with the tariff LC12 × 1.2 = **LC14.40** a pack, 20% dearer for the same product, before any retailer's margin.

        To keep the price at LC12, Brightfield would have to cut its export price to LC10 ÷ 6, about **$1.67** a pack, giving up 16.7% of its revenue on each one. Making the products locally through the joint venture would avoid the tariff on each pack and most of the currency risk on costs, which is why the offer is attractive despite the loss of control.
  - id: standardize-or-adapt
    title: Standardize or adapt the marketing mix
    kind: application
    level: HL
    body: |
      Once in a market, a business must decide how far to change its marketing mix. A **standardized** approach uses the same product, brand, price strategy and promotion everywhere. It brings economies of scale in production and advertising, one consistent brand image and simpler management. It works best for products whose use barely varies between cultures, such as industrial components, many technology products and luxury brands whose appeal rests on being the same everywhere.

      An **adapted** approach changes the mix for each market to fit local tastes, incomes, laws and habits. It fits customers better but costs more, adds complexity and can weaken a global brand. Most businesses choose a mix of the two, often called **glocalization**: keep the brand, the core product and the values global, and adapt the elements where customers really differ. Food and drink, media and services are usually adapted the most, because they are tied most closely to culture.

      Each P raises its own questions. The product may need different ingredients, sizes, features or packaging, and must meet local rules. Price must reflect local incomes, competitors, tariffs and exchange rates. Promotion must suit the language, cultural symbols, media habits and advertising laws. Place depends on how goods reach customers locally, from small family shops to online marketplaces. For services, people, processes and physical evidence must fit local expectations, which is where the cultural variation in employee and customer relationships named in subtopic 4.5 matters most.
    diagram: hofstede-dimensions
    points:
      - term: Standardized marketing
        text: One mix for every market. Lower costs, a consistent brand and simple management, but a risk of ignoring real differences in culture, income and law.
      - term: Adapted marketing
        text: A different mix for each market. A better fit with local customers, but higher costs, more complexity and less benefit from scale.
      - term: Glocalization
        text: A global brand and core product with local changes where they matter, such as recipes, sizes, prices or advertising. The most common choice, and the question is always where to draw the line.
      - term: Culture-bound or culture-free products
        text: The more closely a product is tied to culture, as food, clothing and media are, the more it usually needs adapting; products used the same way everywhere can be standardized.
      - term: "Hofstede's cultural dimensions (HL toolkit)"
        text: A tool for comparing national cultures, for example on individualism and power distance, that can suggest how promotion, service and branding should change between markets. It describes national averages, not individual customers.
    example:
      title: Oats for a savoury breakfast
      fictional: true
      text: |
        In the neighbouring country, Brightfield can sell its existing range almost unchanged, translating only part of the packaging, which keeps costs low. In the distant market, where breakfast is a hot, savoury meal, its sweet cereals would struggle. With its joint venture partner it develops a quick savoury oat porridge in local flavours, sold in single-serve sachets at a price set for local incomes, and promoted with local cooks rather than its home advertising. The brand name, logo and promise of wholesome oats stay the same: glocalization in practice.
  - id: judging-entry
    title: Judging the opportunities and threats for a given business
    kind: evaluation
    level: HL
    body: |
      The guide sets this subtopic at AO3, so the task is not to list opportunities and threats but to weigh them for the business in front of you and reach a judgement. The same market can be a sound move for one business and a mistake for another.

      Start with the business. What is it selling, and how culture-bound is it? How much spare capacity, money and management time does it have, and how much international experience? How strong is its position at home, and would going abroad weaken it? Then the market: its size and growth, local competition, trade barriers, the stability of its currency and politics, and how far customers would need a different product. The toolkit helps here: STEEPLE to scan each market's external environment, SWOT to set the opportunities and threats against the business's strengths and weaknesses, the Ansoff matrix, which places entering new markets with existing products as market development, and, at HL, Porter's generic strategies to decide whether to compete abroad on low cost or on difference.

      Finally, weigh the method of entry, because it changes the balance. A cautious, staged entry, testing a market by exporting or selling online before committing to a partner or to owning operations, limits the downside but may let rivals get there first. A bold entry through a joint venture or an acquisition seizes the opportunity faster but stakes far more on forecasts that, in an unfamiliar market, are especially uncertain.
    diagram: steeple
    points:
      - term: Questions about the business
        text: How culture-bound is the product? Is there spare capacity? Can the business afford the investment and the management time? How strong, and how safe, is its home market?
      - term: Questions about the market
        text: How large and fast-growing is it? How strong are local rivals? What barriers, laws and currency risks apply? How different are customers' needs?
      - term: Questions about the method
        text: How much control does the business need over quality and brand? How much risk can it bear? Does it need a partner's local knowledge, or does the law require one?
    advantages:
      - Growth beyond a saturated home market, and a longer life for existing products.
      - Lower average costs through economies of scale and better use of capacity.
      - Risk spread across markets that rarely move together.
    limitations:
      - Cultural, legal and political differences that the business may not understand.
      - Exposure to exchange rates, trade barriers and political change.
      - Higher costs of research, adaptation, distance and management, and a risk of neglecting the home market.
    example:
      title: Two markets, two judgements
      fictional: true
      text: |
        For Brightfield the neighbouring market offers modest growth at low risk, and the spare capacity makes even modest sales valuable, since they lower the cost of every pack. Its main threat is the strong local rival. The distant market offers far greater growth, but every threat applies at once: tastes, tariff, currency, distance and a partner it does not know. A reasonable judgement is to enter the neighbouring market now and to treat the distant one as a larger, slower decision, testing the savoury product and the partner before committing much money.
applications:
  - industry: Food and drink
    text: Tastes, religious and dietary rules and food laws vary widely, so recipes, portion sizes and labels are usually adapted, and agricultural products often face high tariffs. Many food businesses enter through local partners who know the shoppers and the supermarkets, and keep the brand while changing the product.
  - industry: Fashion and retail
    text: Sizes, styles, seasons and price expectations differ between markets, and shoppers in one country may treat a brand as everyday while another sees it as a luxury. Franchising and partnerships with local retailers are common ways in, with online stores now often the first step.
  - industry: Technology and software
    text: Digital products cross borders cheaply, with little extra cost for each new customer, so standardization and fast international growth are common. Language, payment methods and data protection laws still differ, and some governments restrict foreign technology firms.
  - industry: Hospitality
    text: Hotel and restaurant brands often expand abroad through franchising or management contracts, letting local owners invest while the brand sets the standards. Service expectations differ between cultures, so the people, processes and physical evidence of the mix are adapted while the brand promise stays the same.
  - industry: Manufacturing
    text: Exporters of machinery and components can often standardize, because buyers use the products in the same way everywhere. Where tariffs are high or customers want local supply, manufacturers assemble or produce inside the market, which turns exporting into foreign direct investment.
  - industry: Social enterprise
    text: A social enterprise may spread its model abroad by licensing it to local organizations or forming partnerships, which spreads its impact quickly without large investment. Local partners understand the community's needs, but the founders must accept less control over how their mission is carried out.
stakeholders:
  - group: Owners and shareholders
    text: International growth can raise sales, lower average costs and spread risk, increasing the value of the business. But it needs investment, exposes profits to exchange rates and political risk, and can fail expensively, so cautious owners and growth-hungry ones may judge the same plan very differently.
  - group: Employees at home
    text: Growth abroad can bring promotions, international roles and job security, especially if exports fill spare capacity at home. But if the business later produces abroad to save costs or avoid tariffs, home employees may fear for their jobs, a conflict with owners' interest in lower costs.
  - group: Customers
    text: Customers in the new market gain more choice and, if competition increases, lower prices or better products. Customers at home may benefit from lower costs through economies of scale, or lose out if the business's attention and investment move abroad.
  - group: Local businesses in the new market
    text: |
      Local rivals face new competition and may lose sales, while local partners, distributors and suppliers gain business and skills. Their interests conflict: what a joint venture partner gains, a local rival may lose.
  - group: Governments
    text: Host governments may welcome jobs, investment and tax revenue, or protect local producers with tariffs and rules. Home governments often support exporters, since exports earn foreign currency and support jobs at home, but both can change policy in ways that alter the opportunities and threats overnight.
evaluation:
  - Opportunities and threats usually come from the same features. A different culture is both a new market and a source of mistakes; a fast-growing economy is both a prize and a risk of instability. A strong answer shows the link rather than writing two separate lists.
  - The product matters. Culture-free products, such as industrial components or software, can often be standardized and sold widely, while culture-bound products, such as food, clothing and media, face more threats and need more adaptation.
  - The method of entry changes the balance. Exporting limits both the opportunity and the threat; a joint venture or acquisition raises both. Judging a market without saying how the business would enter it leaves the evaluation incomplete.
  - Some threats change quickly and lie beyond the business's control, such as exchange rates, tariffs and political decisions, so forecasts for international markets are especially uncertain, and plans that work only if conditions stay as they are carry hidden risk.
  - The home market is part of the decision. Diverting money and management attention abroad can weaken a business's position at home, which is often where most of its profit is still made.
  - Evidence is harder to get abroad. Market research is costlier and secondary data may be less reliable, which is why local partners, test markets and staged entry are common ways of reducing the risk of judging an unfamiliar market wrongly.
decision:
  title: Where should Brightfield go first?
  fictional: true
  brief: |
    Brightfield's board must choose its international strategy for the next three years. Its home revenue is $80 million and its profit about $8 million a year. All figures are simulated estimates.

    - **Neighbouring market:** exporting through a distributor would cost about $1.5 million to launch and could add 12.5 million packs a year, lifting capacity utilization from 60% to 85% and cutting fixed costs from about $0.20 to $0.14 a pack. A strong local rival will fight back.
    - **Distant market:** the joint venture would need $6 million from Brightfield, three-quarters of a year's profit, for a half share. The market is large and growing, but the product must be adapted, the partner is untested, and the currency and politics are less stable.
  options:
    - label: Export to the neighbour now
      text: Enter the neighbouring market by exporting a standardized range through a distributor, and decide on the distant market later.
    - label: Join the venture in the distant market
      text: Commit $6 million to the joint venture and launch an adapted savoury range, aiming for a large share of a fast-growing market before rivals arrive.
    - label: Test both before committing
      text: Spend about $0.5 million over a year testing both markets, selling online and through one small distributor in each, and trialling the savoury product with the partner before signing the joint venture.
  guidance: |
    Begin with the opportunity Brightfield already owns: spare capacity. Any extra sales lower the cost of every pack, which favours entering the neighbouring market, where there is no tariff, tastes are similar and the cost of entry is modest. Its threat is competitive rather than structural: a strong local rival may cut prices, so the forecast of 12.5 million packs should be tested against a fight for shelf space.

    The joint venture is a different kind of decision. Its prize is much larger and making locally answers the tariff and currency threats, but it concentrates almost every threat in the subtopic: an adapted product with no sales record, a partner whose goals may differ, a currency that has already moved sharply, and an investment worth three-quarters of a year's profit. If it fails, the money and the management time diverted from the home market are both lost.

    Testing both markets limits the downside and produces evidence on the two biggest uncertainties, the rival's response next door and the savoury product's appeal far away, but it may let a rival secure the distant market or the partner find someone else. A year's delay matters less in the neighbouring market, where Brightfield's main advantage, low cost from spare capacity, will not disappear.

    A strong answer often combines the first and third options: export to the neighbour now, and test the savoury product and the partner before committing $6 million. Whatever is chosen, say what would change the decision, such as the partner insisting on an answer within weeks, a further sharp fall in the distant market's currency, or early sales next door falling well short of forecast.
exam:
  - q: Describe **two** methods a business could use to enter an international market.
    marks: 4
    command: describe
    level: HL
    paper: '2'
    answer: |
      A strong answer describes two distinct methods, each with what it involves and one feature that sets it apart. For example:

      - **Exporting:** making goods at home and selling them to customers abroad, directly, online or through agents and distributors. It needs little investment but gives little control.
      - **Joint venture:** creating a business jointly owned with a partner in the foreign market, sharing the investment, risk and profit, and gaining the partner's local knowledge.

      Licensing, franchising, strategic alliances, acquisitions and setting up a subsidiary are equally valid. Naming methods without describing them would not be enough.
  - q: |
      Norland Bikes, a fictional bicycle maker, can make 25,000 bikes a year but currently makes 17,500. Its fixed costs are $3,150,000 a year. It plans to export 5,000 bikes a year to a neighbouring country, using its existing factory. All figures are simulated.

      Calculate the capacity utilization rate and the fixed cost per bike before and after the exports begin.
    marks: 4
    command: calculate
    level: HL
    paper: '2'
    answer: |
      - Capacity utilization before: 17,500 ÷ 25,000 × 100 = **70%**.
      - Capacity utilization after: (17,500 + 5,000) ÷ 25,000 × 100 = 22,500 ÷ 25,000 × 100 = **90%**.
      - Fixed cost per bike before: $3,150,000 ÷ 17,500 = **$180**.
      - Fixed cost per bike after: $3,150,000 ÷ 22,500 = **$140**.

      The capacity utilization rate is the guide's formula (HL, p. 65), from subtopic 5.6. A full answer shows the working and gives units, and may note what the result shows: exporting turns spare capacity into economies of scale, lowering the cost of every bike, not only the exported ones.
  - q: |
      Lakeside Ceramics, a fictional pottery, exports teapots priced at $40 each. A year ago one dollar was worth 2.5 units of the importing country's local currency (LC2.5); it is now worth LC3. The importing country charges a 10% tariff on the value of imported teapots. All figures are simulated.

      Explain, using calculations, how the change in the exchange rate affects the competitiveness of Lakeside's teapots in the importing country.
    marks: 4
    command: explain
    level: HL
    paper: '2'
    answer: |
      A strong answer shows the effect on the price and explains what it means for Lakeside.

      - A year ago: $40 × 2.5 = LC100, and with the tariff LC100 × 1.10 = **LC110**.
      - Now: $40 × 3 = LC120, and with the tariff LC120 × 1.10 = **LC132**, a rise of (132 − 110) ÷ 110 × 100 = **20%**.
      - The rise in the dollar makes the teapots 20% dearer for buyers in the importing country, so Lakeside becomes less competitive against local potters and other importers and is likely to sell fewer, unless its customers are loyal or have few alternatives.
      - To hold the price at LC110, Lakeside would have to cut its dollar price to about $33.33, accepting a lower margin. Either way, the threat comes from a change Lakeside cannot control.

      The arithmetic is a standard currency conversion, not a formula from the guide.
  - q: |
      With reference to Brightfield, analyse the threats it would face in entering the distant market.
    marks: 6
    command: analyse
    level: HL
    paper: '2'
    answer: |
      A strong response identifies several threats from the evidence and analyses their effects, rather than listing general threats.

      - **Cultural difference in tastes:** breakfast there is a hot, savoury meal, so the existing sweet range is likely to fail, and adapting the product costs money and carries the risk that the new version also fails.
      - **The tariff:** a 20% tariff on imported food makes exported packs dearer than local products or cuts Brightfield's margin.
      - **Exchange rate movements:** the currency has swung sharply, so the local price of an exported pack, and the value of profits sent home, are hard to predict.
      - **Dependence on a partner:** the joint venture brings local knowledge but less control, and the partners' goals may clash.
      - **Risk to the home market:** money and management attention diverted abroad could weaken Brightfield's strong position at home.

      The best answers link the threats, for example noting that local production through the joint venture reduces the tariff and currency threats but increases dependence on the partner.
  - q: |
      Evaluate the opportunities and threats for Brightfield of entering the distant market through the joint venture.
    marks: 10
    command: evaluate
    level: HL
    paper: '2'
    answer: |
      A strong response weighs both sides using the evidence and reaches a supported judgement.

      - **Opportunities:** a large market growing as incomes rise; a way to grow when home sales have stalled; local production that avoids the 20% tariff and much of the currency risk on costs; the partner's knowledge of tastes, shops and officials; and the chance to establish the brand before rivals do.
      - **Threats:** the product must be adapted to a savoury breakfast with no sales record; the partner is untested and control is shared; the currency and politics are less stable; the $6 million investment is three-quarters of a year's profit; and the home market could suffer from diverted attention.
      - **Weighing:** the joint venture reduces some threats, the tariff and currency, while adding others, dependence on the partner. The size of the prize is real, but so is the uncertainty, because there is no evidence yet that the adapted product will sell.
      - **Judgement:** for example, that the opportunity is worth pursuing but not yet worth $6 million; a trial of the savoury product with the partner, and agreed terms on control and profit, should come first. The best answers say what would change the judgement, such as a successful trial or a rival preparing to enter.
  - q: |
      Second Spring, a fictional social enterprise, runs cafés staffed by older people returning to work after retirement, and wants to open its first café abroad with a local partner organization.

      Explain **two** challenges Second Spring may face in operating in another country.
    marks: 6
    command: explain
    level: HL
    paper: '3'
    answer: |
      A strong response explains two distinct challenges, each developed and applied to Second Spring. For example:

      - **Cultural differences in work and service:** attitudes to older people working, to retirement and to how café staff should treat customers vary between countries, so the model and the service may need adapting while keeping the social mission.
      - **Legal differences:** employment law, pensions and rules on working after retirement, food hygiene regulations and the legal forms available to social enterprises differ, adding costs and possibly limiting how the model works.
      - **Control through a partner:** the local partner brings knowledge and contacts, but Second Spring has less control over how its mission and brand are carried out, and the partners' priorities may differ.
      - **Funding and currency:** money raised at home loses or gains value as exchange rates move, and funders may be reluctant to support work abroad.
summary:
  - '**International marketing** means marketing products in more than one country, with three decisions: which markets, how to enter and how far to adapt the mix. Globalization, e-commerce and trading blocs have made it more common, but foreign markets are still harder to understand.'
  - 'Ways in form a ladder of risk and control: **exporting**, **licensing**, **franchising**, **joint ventures and alliances**, and **acquisitions or own operations** (foreign direct investment). Many businesses enter in stages.'
  - '**Opportunities:** growth beyond a saturated home market, economies of scale (especially with spare capacity), a longer product life cycle, risk spread across markets, access to resources and ideas, and a stronger brand.'
  - '**Threats:** cultural and language differences, trade barriers, exchange rate movements, legal and political risk, local competition, the costs and control problems of distance, and neglect of the home market.'
  - A rise in the exporter's currency, or a tariff, raises the local price or squeezes the margin; producing locally can remove both, at the cost of investment and control.
  - The mix can be **standardized**, **adapted** or **glocalized**. Culture-bound products such as food and services need the most adaptation, and Hofstede's cultural dimensions can guide it.
  - The guide sets the subtopic at AO3, so weigh opportunities against threats for the business in the case, using STEEPLE, SWOT, the Ansoff matrix and, at HL, Porter's generic strategies, and judge the method of entry as part of the answer.
retrieval:
  - q: What three decisions does international marketing involve?
    a: Which markets to enter, how to enter them, and how far to adapt the marketing mix for each.
  - q: Why does exporting not make a business a multinational company?
    a: A multinational company owns and controls operations in other countries. An exporter makes its products at home and only sells them abroad.
  - q: Place exporting, a joint venture and an acquisition in order of the risk and control they bring.
    a: Exporting brings the least risk and least control, a joint venture shares both with a partner, and an acquisition brings the most risk and full control.
  - q: Give one advantage and one disadvantage of licensing as a way into a foreign market.
    a: 'Advantage: for example, fast entry with little investment, using the licensee''s local knowledge. Disadvantage: for example, earning only a royalty, losing control of quality, or creating a future rival.'
  - q: Explain how international marketing can extend a product's life cycle.
    a: A product that is mature or declining at home can be launched into the introduction or growth stage in a market where it is new, so it earns revenue for longer.
  - q: A factory can make 80,000 units but makes 56,000. What is its capacity utilization rate, and why does it matter for exporting?
    a: 56,000 ÷ 80,000 × 100 = 70%. The spare 30% could supply exports without new investment, spreading fixed costs over more units.
  - q: How does a rise in the value of an exporter's currency affect it?
    a: Its products become dearer for foreign customers, so it either sells less or cuts its price in its own currency and accepts a lower margin.
  - q: Name four kinds of trade barrier.
    a: Tariffs, quotas, embargoes and strict product rules or standards.
  - q: What is glocalization?
    a: Keeping a global brand, core product and values while adapting parts of the marketing mix, such as recipes, sizes, prices or advertising, to local markets.
  - q: Which products usually need the most adaptation for international markets, and why?
    a: Culture-bound products such as food, clothing, media and services, because tastes, customs and expectations differ most for them.
  - q: Give two toolkit tools that help judge an international market.
    a: For example, STEEPLE analysis of the market's external environment, SWOT analysis, the Ansoff matrix (market development), Hofstede's cultural dimensions and Porter's generic strategies.
  - q: Why might entering a new market harm a business at home?
    a: It diverts money and management attention from the home market, where most of its profit may still be made, and rivals at home may take advantage.

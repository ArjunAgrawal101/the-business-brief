# Notes: 2.2 Organizational structure. Written in the platform's own words from
# the guide's four content statements (p. 25). The last, changes in structure
# such as project-based organization and Handy's Shamrock Organization, is HL
# only and sits in an HL section. The glossary of the IB teacher support
# material (pp. 80 to 90) was read to check definitions; nothing from it is
# reproduced. Handy's and Weber's ideas are explained from subject knowledge
# and attributed to them. Every business named is fictional.
code: '2.2'
title: Organizational structure
level: SL/HL with HL-only content
introduction: |
  Once a business grows beyond a handful of people, someone has to decide who does which job, who reports to whom and who is allowed to decide what. The answers make up its **organizational structure**: the way it arranges its jobs, departments and lines of authority. A structure is more than a diagram on a wall. It decides how quickly the business can act, how much it spends on managers, how well information travels and how much freedom its people have.

  This subtopic gives you the vocabulary to describe any structure, the main shapes an organization chart can take, and the judgement the examination rewards most: which structure suits a business when the world around it changes. At HL you also weigh newer, more flexible forms, such as project-based organization and Charles Handy's Shamrock Organization.
objectives:
  - '**Explain** the terms used to describe a structure: delegation, span of control, levels of the hierarchy, chain of command, bureaucracy, centralization, decentralization, delayering and matrix structure.'
  - '**Construct** an organization chart from a description of a business, and read its levels, spans of control and chains of command.'
  - '**Distinguish** between tall and flat structures, and between structures organized by function, by product and by region.'
  - '**Evaluate** which structure suits an organization when external factors change.'
  - '**Discuss** changes in structure such as project-based organization and Handy''s Shamrock Organization (HL only).'
sections:
  - id: the-hierarchy
    title: The hierarchy and the organization chart
    kind: concept
    body: |
      Most organizations are arranged as a **hierarchy**: layers of authority, with a few senior managers at the top and more people at each level below. Authority, the right to make decisions and give instructions, passes down the hierarchy. Accountability, the duty to answer for results, passes up.

      An **organization chart** is a diagram of this formal structure. Each box is a post or a department, each line a reporting relationship and each row a level. A chart shows formal relationships only. Informal networks, such as the colleague everyone asks for advice, and the way work really gets done can look quite different.

      The guide sets organization charts at AO4 as well as AO2, so you may be asked to draw one from a case, not only to read one. To construct a chart:

      1. Put the most senior post (the owner, the chief executive or the board) at the top.
      2. Place each post or department one row below the person it reports to, so that posts of equal rank share a row. Each row is then a level of the hierarchy.
      3. Join each post to its manager with a line, and label each box with a job title or a department.
      4. Check the result: count the levels, count each manager's direct reports and trace a chain of command from the bottom to the top.
    points:
      - term: Levels of the hierarchy
        text: The number of layers of authority, from the most senior managers down to the employees with no one reporting to them. More levels make a taller structure, with more steps for promotion but longer lines of communication.
      - term: Span of control
        text: The number of subordinates who report **directly** to one manager. A wide span means lighter supervision and more freedom; a narrow span allows close control and support. For the same number of staff, wider spans mean fewer levels.
      - term: Chain of command
        text: The formal line of authority through which instructions pass down and accountability passes up, from the top of the hierarchy to the bottom. Long chains slow decisions and distort messages as they pass through many people.
      - term: Delegation
        text: Passing the authority to carry out a task or make a decision to someone lower in the hierarchy. The manager who delegates stays **accountable** for the result, so delegation needs trust, clear instructions and staff with the right skills. It frees managers' time and can motivate the people trusted with the work, but delegating without support can overload them.
    example:
      title: Reading a chart
      fictional: true
      text: |
        Marrick Cycles, a fictional bicycle maker, employs 27 people. The owner manages three managers: production, sales and finance. The production manager runs two supervisors, each in charge of eight assemblers. The sales manager has three sales staff and the finance manager two clerks. Try drawing its chart before you read on.

        Drawn as a chart, the business has four levels: the owner, the three managers, the supervisors with the sales staff and clerks, and the assemblers. The owner's span of control is three, the production manager's two and each supervisor's eight. An assembler's chain of command runs through the supervisor and the production manager to the owner, so a request for new tools must pass two people before it reaches the person who can approve it.
  - id: where-decisions-are-made
    title: Centralization, decentralization and bureaucracy
    kind: concept
    body: |
      Two organizations can have the same chart and still work very differently, because a chart does not show **where decisions are actually made**. That depends on how much authority stays at the top.

      In practice it is a matter of degree. Most organizations centralize some decisions, such as finance, brand and major investment, and decentralize others, such as staff rotas, local promotions and dealing with complaints. The question for an answer is which decisions should sit where, for this business, now.

      **Delegation** and **decentralization** are easily confused. Delegation passes a particular task from one manager to one subordinate. Decentralization is a feature of the whole structure: it passes decision-making power down to lower levels, regions or branches.
    points:
      - term: Centralization
        text: Keeping decision-making authority with a small group of senior managers, usually at head office. It brings consistent decisions and a uniform brand, tight control of costs and quick action in a crisis, since few people decide. Its drawbacks are slow responses to local conditions, overloaded senior managers and less motivated staff lower down.
      - term: Decentralization
        text: Passing decision-making authority from the centre to lower levels, or to regional and branch managers. Decisions are made close to customers and problems, responses are faster and managers develop their skills. The risks are inconsistent decisions, duplicated effort and weaker central control.
      - term: Bureaucracy
        text: A way of organizing based on formal rules, written procedures, clearly defined roles and set approval processes. The German sociologist Max Weber saw it as the most efficient way to run a large organization, because rules replace personal favour. It brings consistency, fairness, clear accountability and control, which suits large organizations and work where mistakes are costly, but decisions are slow and staff have little room for initiative. In the course the word is a neutral description, not the everyday insult for red tape.
    example:
      title: Who decides at a café chain
      fictional: true
      text: Larkspur Cafés, a fictional chain of forty cafés, decides its menu, prices, suppliers and shop design at head office, so every café looks and tastes the same and buys at the best price. Each café manager decides staff rotas, local events and how to settle a complaint. When a rival opened next to three of its cafés, their managers could not cut prices without head office's approval, which took a month. That delay is the cost of centralizing prices.
  - id: tall-and-flat
    title: Tall and flat structures, and delayering
    kind: types
    body: |
      Levels of hierarchy and spans of control together give a structure its shape. The same number of people can be arranged as a **tall** structure, with many levels and narrow spans, or as a **flat** one, with few levels and wide spans. The diagram arranges fifteen people both ways.

      **Delayering** means removing one or more levels of the hierarchy, usually layers of middle management, to make a structure flatter. Businesses delayer to cut costs, to speed up decisions, or because technology lets fewer managers coordinate more people. The managers who remain take on wider spans of control.
    diagram: tall-flat-structures
    points:
      - term: Tall or vertical structure
        text: Many levels and narrow spans of control. It allows close supervision, clear roles and a ladder of promotion, but communication is slow, messages are distorted along the long chain of command, management costs are high and staff at the bottom may feel far from decisions. It is common in large, traditional organizations such as armed forces, banks and government departments.
      - term: Flat or horizontal structure
        text: Few levels and wide spans of control. Communication is fast, management costs are lower and employees have more responsibility, which can motivate. Managers may be overloaded, supervision is lighter and there are fewer chances of promotion. It suits smaller organizations and work that needs speed and initiative.
    advantages:
      - Delayering cuts salary costs and shortens the chain of command, so decisions and messages travel faster.
      - After delayering, the staff who remain often gain responsibility and authority, which can motivate them.
      - Senior managers end up closer to customers and to frontline staff.
    limitations:
      - The managers left behind take on wider spans of control and may be overloaded.
      - Fewer levels mean fewer steps on the promotion ladder.
      - Delayering often brings redundancies, which can damage the morale and trust of the staff who stay.
      - Experience and knowledge leave with the managers who go.
    example:
      title: Removing a layer
      fictional: true
      text: Brannock Hardware, a fictional chain of 48 stores, had six area managers, each overseeing eight store managers, and the six reported to a head of retail. It removed the area manager layer. The head of retail's span of control rose from 6 to 48, far too wide to supervise each store closely, so store managers were given more authority over stock and staffing. The business saved six salaries and decisions reached the stores faster, but store managers lost their next step up.
  - id: function-product-region
    title: Organizing by function, product or region
    kind: types
    body: |
      A chart also shows how the work is **grouped** below the top. The guide names three ways, and the diagram shows one business arranged each way. Large organizations often combine them: a multinational may have a division for each region, each organized by function inside.

      The right grouping follows the strategy. A business with one main product in one market groups by function. A business with distinct product ranges, each facing different customers and rivals, groups by product. A business that sells in many countries, with different tastes, laws and cultures, groups by region.
    diagram: org-charts-by-type
    points:
      - term: By function
        text: Departments based on the work people do, such as marketing, operations, finance and human resources. Specialists work together, which builds expertise, avoids duplication and gives clear career paths. Departments can become inward-looking, communicate poorly with each other and put their own goals first.
      - term: By product
        text: A division for each product or product range, each usually with its own marketing, production and finance staff. Each division can focus on its own customers and competitors, and it is easy to see which products perform well. Functions are duplicated across divisions, which adds cost, and divisions may compete for resources.
      - term: By region
        text: A division for each geographical area, such as a country or a continent, each responsible for its own market. Local managers can adapt products, prices and promotion to local conditions and respond quickly. Functions are duplicated in each region, and head office may lose control and consistency.
    example:
      title: One business, three structures
      fictional: true
      text: Aldern Home, a fictional maker of ceramics, glassware and textiles, began with a functional structure when it sold one range in one country. When its glassware grew into a business with its own customers and rivals, it created product divisions. Once half its sales came from abroad, it added regional sales teams inside each division, combining grouping by product with grouping by region.
  - id: matrix
    title: Matrix structure
    kind: concept
    body: |
      In a **matrix structure** employees report to two managers at once: the head of their function, such as engineering or marketing, and the manager of the project or product they are working on. Project teams are laid across a functional structure, so people keep their specialist home while working with colleagues from other departments.

      A matrix suits organizations whose work comes as complex projects that need several kinds of expertise at once, such as engineering, consultancy, software and product development. Its cost is the break with a single chain of command: when the two managers want different things, the employee is caught between them.
    diagram: matrix-structure
    advantages:
      - Brings people with different skills together around a project, which helps creativity and problem-solving.
      - Uses staff flexibly, moving expertise to wherever it is needed.
      - Keeps functional expertise and standards while focusing teams on results.
      - Improves communication between departments.
    limitations:
      - Two managers can mean conflicting priorities, confusion and divided loyalty.
      - Decisions slow down when the two managers disagree.
      - It is costly and complex to coordinate, with more meetings and more managers.
      - Answering to two people adds to employees' stress.
    example:
      title: Two managers, one engineer
      fictional: true
      text: An electrical engineer at Vantor Aerospace, a fictional firm, works on a new delivery drone. The head of engineering sets her technical standards and decides her training; the drone's project manager sets her deadlines and budget. When the project manager wants a design finished in a week and the head of engineering insists on two more weeks of safety tests, she cannot satisfy both, and the dispute has to go up to a director.
  - id: structure-and-external-change
    title: Choosing a structure when external factors change
    kind: application
    body: |
      No structure is best in every situation. A structure suits a business when it fits its size, strategy, culture and people, and the environment it works in. When external factors change, a structure that served the business well can become a handicap. A STEEPLE analysis is a useful way to identify the change; the next step is to ask what the change demands of the structure: speed, control, local knowledge, flexibility or lower cost.

      Changing a structure is itself costly and disruptive. Staff may resist new reporting lines, managers may lose status, and a new structure takes time to settle. A good answer weighs the gain from a better fit against the cost of the change, and says which matters more for this business.
    points:
      - term: Fast-changing markets or technology
        text: Speed and new ideas matter most, so a flatter, more decentralized structure, or project teams in a matrix, can respond faster than a tall bureaucracy.
      - term: Expansion into new countries
        text: Tastes, laws and cultures differ, so organizing by region, with authority passed to local managers, helps the business adapt.
      - term: Recession or low-cost competition
        text: Cost matters most, so delayering and centralizing purchasing can cut overheads, though cuts can damage morale when staff are already worried about their jobs.
      - term: New regulation or a crisis
        text: Control and consistency matter most, so some decisions may be centralized and procedures tightened, for example on safety, data or finance.
      - term: Remote work and digital communication
        text: Online tools let one manager coordinate more people, wherever they are, so wider spans of control and fewer layers become possible.
      - term: Growth into new product markets
        text: Each range faces different customers and rivals, so product divisions keep each one focused on its own market.
    example:
      title: A structure that stopped fitting
      fictional: true
      text: |
        Tessaly Travel, a fictional tour operator, had a tall, centralized structure built for selling holidays through printed brochures and travel agents: seven levels, with every price change approved at head office. When customers moved to booking online and rivals began changing prices every day, its decisions were far too slow.

        It removed two layers of management and gave a small team of pricing analysts the authority to change prices within set limits. Decisions became faster and overhead costs fell. The cost was a year of disruption and the loss of experienced managers. Whether the change was worth it depends on how long the online market keeps moving this fast, but the old structure could not have kept up with it.
  - id: changing-structures
    title: 'Changing structures: project-based organization and the Shamrock'
    kind: theory
    level: HL
    body: |
      Many organizations have moved away from fixed hierarchies towards structures that can change shape as their work changes. The guide gives two examples to evaluate.

      **Project-based organization** builds the work around projects. Each project has a temporary team drawn from different functions, with its own goal, budget and deadline. When the project ends the team disbands and its members move to the next project. It goes further than a matrix: in a matrix, people keep a permanent functional home and report to two managers, while here the project is the main unit of the organization. It is common in consultancy, construction, film, advertising and software.

      **The Shamrock Organization** was described by Charles Handy, an Irish management writer, in *The Age of Unreason* (1989). He argued that organizations would keep only a small core of essential people on permanent contracts and buy in the rest of their work as it was needed, so that the workforce would have three parts, like the three leaves of a shamrock. Each leaf has a different relationship with the organization, so each has to be managed, rewarded and motivated differently. Handy also pointed to a possible fourth leaf: customers who do part of the work themselves, as in self-service.
    diagram: shamrock-organization
    points:
      - term: Professional core
        text: Permanent, highly skilled managers, professionals and technicians whose knowledge is essential and hard to replace. They are kept few, paid well and expected to be highly committed, and keeping them is a priority.
      - term: Contractual fringe
        text: Outside firms and self-employed specialists who do work that is not central, such as cleaning, catering, IT support or payroll, and who are paid for results rather than for their time. This turns fixed costs into variable ones but gives the organization less control over quality.
      - term: Flexible labour force
        text: Part-time, temporary and seasonal workers taken on when demand rises and released when it falls. Labour costs follow demand, but these workers usually have less pay, security and training than the core, so their commitment may be lower.
    advantages:
      - Both forms are flexible, so the organization can respond quickly as projects, demand or technology change.
      - The Shamrock lowers fixed labour costs and lets the business concentrate on what it does best, buying in specialist skills when it needs them.
      - Project teams bring different skills together around a clear goal, which can encourage creativity and develop staff.
    limitations:
      - Loyalty and commitment are weaker outside the core, and frequent changes of people add recruitment and training costs.
      - Quality, communication and coordination are harder to manage across contractors, temporary staff and changing teams.
      - People on projects or short contracts may lack security and a clear career path, which can demotivate them and raises ethical questions.
      - The core may be overloaded, and knowledge can be lost when project teams disband or contractors leave.
    example:
      title: A Shamrock at a festival company
      fictional: true
      text: Lumenfield Events, a fictional festival organizer, employs twelve permanent staff, its directors, programmers and finance team, who form the core. Staging, security and catering are contracted to specialist firms, the contractual fringe. For its three summer weekends it hires around 400 temporary stewards and bar staff, the flexible labour force. Its wage bill stays low for most of the year, but every summer it must train hundreds of newcomers, and one poor security contractor can damage its reputation overnight.
evaluation:
  - No structure is right in itself. The best structure fits the organization's size, strategy, culture, people and environment, and a structure that fits today may not fit in five years. Judge a structure against the case, not against an ideal.
  - Flat structures are often praised for speed and empowerment, but they work only when staff are skilled and willing to take responsibility and managers can cope with wide spans. Without those conditions, flattening brings overload and confusion rather than freedom.
  - Charts show the formal structure only. Much real coordination happens through informal networks, so a chart can make an organization look tidier, or more rigid, than it really is.
  - 'Changing a structure has costs of its own: redundancies, lost knowledge, resistance and a period of confusion. Delayering can cut costs on paper while raising them in practice if the managers who remain are overstretched or the best people leave.'
  - Structure and culture work together. The same matrix can succeed where people trust each other and fail where they fear blame; at HL, link this to Handy's role and task cultures in 2.5.
  - At HL, flexible structures such as the Shamrock shift risk from the organization to its workers. Weigh the savings and flexibility against weaker loyalty, harder quality control and the ethics of insecure work.
  - In an examination answer, use the case's evidence. Count the levels and spans if a chart is given, name the external change, explain what it demands of the structure, and only then recommend a structure and say what the change would cost.
connections:
  - code: '1.5'
    text: Growth adds levels, rules and managers, and poor communication and coordination are diseconomies of scale.
  - code: '2.1'
    text: A change of structure is a change people may resist, and the gig economy and flexible working supply the Shamrock's flexible labour force (HL).
  - code: '2.3'
    text: How far leaders are willing to delegate shapes spans of control and how decentralized a structure can be.
  - code: '2.4'
    text: Delegation, empowerment and job enrichment can motivate, while delayering can remove promotion steps and damage morale.
  - code: '2.5'
    text: At HL, Handy's role culture fits tall bureaucracies and his task culture fits matrix and project structures.
  - code: '2.6'
    text: The chain of command sets the formal channels of communication, and long chains distort messages.
  - code: '5.4'
    text: Outsourcing work to other firms creates the Shamrock's contractual fringe (HL).

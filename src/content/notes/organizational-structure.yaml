retrieval:
  - q: What is the difference between span of control and levels of the hierarchy?
    a: Span of control is the number of people who report directly to one manager. Levels of the hierarchy are the number of layers of authority. For the same workforce, wider spans mean fewer levels.
  - q: How does delegation differ from decentralization?
    a: Delegation passes a particular task or decision from one manager to a subordinate, while the manager stays accountable. Decentralization passes decision-making power down the whole structure, to lower levels, regions or branches.
  - q: Give two advantages and two disadvantages of a flat structure.
    a: 'Advantages: for example faster communication, lower management costs, and more responsibility for staff, which can motivate. Disadvantages: for example overloaded managers, lighter supervision and fewer chances of promotion.'
  - q: What is delayering, and what is one risk of it?
    a: Removing one or more levels of the hierarchy, usually middle managers, to make a structure flatter. Risks include overloaded managers, fewer promotion steps, low morale after redundancies and lost experience.
  - q: Which grouping suits a business selling in many countries with different tastes and laws, and why?
    a: Grouping by region, because regional managers can adapt products, prices and promotion to local conditions and respond quickly.
  - q: What is a matrix structure, and what is its main drawback?
    a: Employees report to two managers at once, the head of their function and the manager of their project. The main drawback is conflict between the two managers' priorities, which causes confusion and divided loyalty.
  - q: Why might a business facing fast technological change flatten and decentralize its structure?
    a: So that decisions are taken quickly and close to customers and problems, without waiting for approval to pass up and down a long chain of command.
  - q: (HL) Name the three parts of Handy's Shamrock Organization.
    a: The professional core of permanent key staff, the contractual fringe of outside contractors paid for results, and the flexible labour force of part-time, temporary and seasonal workers.

retrieval:
  - q: Give two advantages and two risks of a global supply chain.
    a: Advantages, for example lower costs and access to materials or skills found elsewhere. Risks, for example long lead times, disruption from storms, conflict or pandemics, changes in exchange rates or tariffs, and harder checks on suppliers' ethics.
  - q: Why does just-in-time depend on reliable suppliers?
    a: Because it holds little or no buffer stock, so one late or faulty delivery stops production.
  - q: A business uses 50 units a day, its lead time is 4 days and its buffer stock is 100 units. What is its reorder level?
    a: 100 + (50 × 4) = 300 units.
  - q: What is the difference between the reorder level and the reorder quantity?
    a: The reorder level is the stock level at which an order is placed (when to order); the reorder quantity is the amount ordered each time (how much).
  - q: A factory can make 12,000 units a month and makes 9,000. What is its capacity utilization rate, and how could it raise it?
    a: 9,000 ÷ 12,000 × 100 = 75%. For example by boosting demand, using the spare capacity to make products for other firms, or rationalizing to cut capacity.
  - q: Of 1,500 units made, 45 fail inspection. What is the defect rate?
    a: 45 ÷ 1,500 × 100 = 3%.
  - q: Total contribution is $90,000 and fixed costs are $60,000. What is the degree of operating leverage, and what does it mean?
    a: Operating profit is $30,000, so 90,000 ÷ 30,000 = 3. A 1% change in sales changes operating profit by 3%.
  - q: Give two reasons why a business might make a component even though its cost to make is above its cost to buy.
    a: For example control over quality and supply, protecting its know-how, using spare capacity, or avoiding dependence on a single supplier or on suppliers with poor ethical standards.

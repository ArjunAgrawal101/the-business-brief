# Notes: 5.6 Production planning (HL only). Written in the platform's own words
# from the guide's seven content statements (pp. 34 to 35). The capacity
# utilization and productivity rate formulas are the guide's (p. 65). The guide
# gives no formula for the other measures, so the standard forms used across
# the site (src/lib/operations.ts and the glossary) are given and labelled as
# such; for operating leverage the note uses the degree of operating leverage,
# as the glossary does. The supplied coursebook chapter (Hodder, pp. 519 to 533)
# was read to check coverage; no passage, figure, table or case from it is
# reproduced, and its operating leverage formula is not followed. Wrenhurst
# Cycles and Hollowmere Bikes are fictional; the stock figures match the site's
# stock control chart, and every worked figure was checked by script. The
# situation and decision continue the Wrenhurst example (a year is 9,600
# bikes, as in the make-or-buy example); the exam-style questions add Marram
# Paints and Fairloom, also fictional, and every figure was checked by script.
code: '5.6'
title: Production planning
level: HL
introduction: |
  A business that makes things has to get the right materials to the right place at the right time, use its capacity well, keep faults to a minimum and decide what to make itself and what to buy in. **Production planning** is the set of tools for those decisions.

  This HL subtopic covers the supply chain that feeds production, the choice between holding stock **just in case** and receiving it **just in time**, the stock control chart, and the measures managers use to judge operations: capacity utilization, the defect rate, productivity and operating leverage. It ends with the choice between making and buying. Several of these are calculations (AO4), but each result needs interpreting: a number on its own decides nothing.
objectives:
  - '**Explain** how a local and a global supply chain work, and the risks of each.'
  - '**Evaluate** just-in-time and just-in-case stock control, and judge which suits a given business.'
  - '**Construct** and interpret a stock control chart using lead time, buffer stock, reorder level and reorder quantity.'
  - '**Calculate** capacity utilization, the defect rate, labour and capital productivity, the productivity rate and operating leverage, and comment on the results.'
  - '**Recommend** whether to make or buy, using the cost to make and the cost to buy alongside non-financial factors.'
situation:
  title: A ship three weeks late
  fictional: true
  text: |
    Wrenhurst Cycles, a fictional bicycle maker, assembles about 200 bikes a week on a line that could build 250. Its aluminium frames come by sea from a single partner factory overseas, eight weeks away, and it keeps about six weeks of them in its warehouse: 1,200 frames, worth $108,000.

    This month a container ship carrying its frames was held up for three weeks. Wrenhurst's line kept running on the frames in its warehouse, while a rival that buys its frames just in time had to stop production for a fortnight.

    Even so, Wrenhurst's new finance manager wants the stock cut, because $108,000 of frames on shelves is cash the business cannot use. The production manager wants more stock, and a second supplier. The owner wonders whether Wrenhurst should simply make its own frames, in spare space in its factory.

    How much stock should Wrenhurst hold, how well is it using its capacity, and when should it make a part rather than buy it?
sections:
  - id: supply-chain
    title: The local and global supply chain
    kind: concept
    level: HL
    body: |
      A **supply chain** is the sequence of businesses and activities that turns raw materials into a product in a customer's hands: growing or extracting the materials, making components, assembling the product, storing and transporting it, and selling it. Goods flow forward along the chain; information, such as orders, sales data and complaints, flows back.

      **Supply chain management** is the work of coordinating that chain: choosing suppliers; agreeing prices, quality standards and delivery dates, often with penalties for late delivery; deciding what to make and what to buy; organizing transport and storage; and checking that suppliers meet the business's standards on working conditions and the environment. Customers judge a business by the whole chain, not only by its own part of it. A late component, a faulty part or a supplier's unsafe factory becomes its problem.

      A **local** supply chain keeps most of its stages in one country or region. A **global** one spreads them across the world to reach lower costs, scarce materials or specialist skills.
    diagram: supply-chain
    points:
      - term: Strengths of a local chain
        text: Short lead times; easy communication in one language and time zone; closer checks on quality and working conditions; lower transport costs and emissions; and a "made locally" story for marketing.
      - term: Weaknesses of a local chain
        text: Often higher costs, especially of labour; a smaller choice of suppliers; and some materials or skills may not be available locally at all.
      - term: Strengths of a global chain
        text: Lower costs from cheaper labour and suppliers' economies of scale; access to materials and expertise found elsewhere; and a wider choice of suppliers.
      - term: Weaknesses of a global chain
        text: Long lead times and high transport costs; exposure to disruption from storms, conflict, blocked shipping routes or pandemics; changes in exchange rates and tariffs; and harder checks on how suppliers treat their workers and the environment.
      - term: Managing the chain well
        text: Brings reliable deliveries, lower costs, flexibility when demand changes, consistent quality and a reputation for ethical sourcing. Technology helps, because shared data and tracking show where every order is.
      - term: Building resilience
        text: After a disruption, many businesses spread their orders across more suppliers, hold more stock of critical parts, or bring some production closer to home (reshoring, subtopic 5.4), accepting some extra cost in return for a chain that is harder to break.
    example:
      title: Wrenhurst Cycles' supply chain
      fictional: true
      text: |
        Wrenhurst Cycles, a fictional bicycle maker, assembles about 200 bikes a week. Its aluminium frames are welded by a partner factory overseas and take eight weeks to arrive by sea; its gear sets come from a supplier in a neighbouring country, two weeks away; tyres, saddles and boxes come from local firms that deliver within two days. Finished bikes go to independent bike shops and to customers who order on its website, and the shops' orders and the website's sales data flow back, telling Wrenhurst what to build next.

        The overseas frames are the cheapest part of the chain and the riskiest: one delayed ship could stop the whole assembly line.
  - id: jit-and-jic
    title: Just-in-time versus just-in-case
    kind: types
    level: HL
    body: |
      Businesses hold three kinds of **stock**: raw materials and components waiting to be used, work in progress, and finished goods waiting to be sold. How much to hold is a trade-off. Too little and production stops; too much ties up cash and space in goods sitting on shelves. The two approaches the guide names sit at either end.

      **Just-in-case (JIC)** holds generous stocks, including a buffer, as insurance against late deliveries, faults or a sudden rise in demand. **Just-in-time (JIT)** holds as little as possible: materials arrive just as they are needed and products are made to order, so stock is used almost as soon as it arrives. JIT is a method of lean production (subtopic 5.3), because stock that sits waiting is a form of waste.

      Neither is right for every business. The choice depends on how reliable the suppliers are, how predictable demand is, how costly a stock-out would be compared with the cost of holding stock, and the nature of the product: perishable or fashion goods favour JIT, while critical spare parts favour JIC.
    diagram: jit-jic
    points:
      - term: JIT gains
        text: Lower storage, insurance and security costs; cash and space freed for other uses; less waste from damage, theft and goods going out of date; and problems are exposed quickly instead of being hidden behind piles of stock.
      - term: JIT risks
        text: Production stops if a single delivery is late; there is no stock to meet a sudden surge in demand; more frequent, smaller orders lose bulk discounts and raise ordering and delivery costs; and the whole system depends on suppliers being reliable.
      - term: What JIT needs
        text: Reliable suppliers, often close by; good communication and shared data with them; a flexible, multi-skilled workforce; and quality that is right first time, because there is no spare stock to replace faulty parts.
      - term: JIC gains
        text: Production and sales continue when deliveries are late or demand jumps; buying in bulk earns discounts and means fewer orders; and customers can be served at once from stock.
      - term: JIC costs
        text: Cash tied up in stock that could be used elsewhere, an opportunity cost that also weakens liquidity; storage, insurance and handling costs; and the risk of stock perishing, being stolen or going out of fashion.
      - term: Mixing the two
        text: Many businesses use JIT for cheap, easily replaced items from nearby suppliers and keep buffer stocks of critical parts with long or uncertain lead times.
    example:
      title: Wrenhurst's mix
      fictional: true
      text: |
        Wrenhurst takes tyres and boxes just in time, delivered by local suppliers twice a week: a late delivery would cost it a day at most. But it holds about six weeks of frames just in case, about 1,200 frames worth $108,000 at $90 each. That stock ties up cash the business could use elsewhere, and it needs a warehouse; but with an eight-week sea crossing and a single supplier, running out would halt the line for weeks.
  - id: stock-control-charts
    title: Stock control charts
    kind: method
    level: HL
    body: |
      A **stock control chart** plots the level of one stock item over time and is used to plan when to reorder and how much. Stock falls steadily as it is used, then jumps when a delivery arrives, giving a saw-tooth pattern. The guide names four terms the chart uses:

      - **Lead time**: the time between placing an order and the goods arriving, ready to use.
      - **Buffer stock**: the minimum stock kept in reserve for late deliveries or unexpectedly high usage. In a normal cycle each delivery arrives just as stock reaches this level.
      - **Reorder level**: the stock level at which a new order is placed, high enough to cover usage during the lead time on top of the buffer.
      - **Reorder quantity**: how much is ordered each time, which is the height of each jump on the chart.

      The top of each tooth is the **maximum stock level**, the buffer plus the reorder quantity. The slope of the falling line shows the usage rate: the steeper the line, the faster stock is used.

      To construct one, put time on the horizontal axis and units of stock on the vertical. Draw horizontal lines for the maximum stock, the reorder level and the buffer stock. Then draw the saw-tooth, falling at the usage rate from the maximum to the buffer and jumping back up by the reorder quantity, and mark where each order is placed and the lead time that follows. The [Operations Floor](/operations-floor/#of-stock) lets you test a stock plan against late deliveries.
    formulas:
      - name: Reorder level
        expression: Reorder level = buffer stock + (usage per period × lead time in periods)
        note: The standard form; the guide gives no formula. Measure usage and lead time in the same periods, for example weeks.
      - name: Maximum stock level
        expression: Maximum stock level = buffer stock + reorder quantity
        note: The standard form. It holds when each delivery arrives just as stock reaches the buffer.
    diagram: stock-control-chart
    points:
      - term: What sets the buffer stock
        text: How reliable suppliers are, how much usage varies, the length of the lead time, the cost of running out, the storage space available and how perishable the stock is. Businesses using JIT keep very little.
      - term: What sets the reorder quantity
        text: Bulk discounts and the cost of placing orders, which favour large orders, against storage space, holding costs, the cash tied up and shelf life, which favour small ones.
      - term: What a stock-out costs
        text: Lost sales and perhaps lost customers, idle workers and machines, and the extra cost of rush deliveries. The buffer stock exists to make a stock-out unlikely, not impossible.
      - term: A common confusion
        text: The reorder level says **when** to order; the reorder quantity says **how much**.
    example:
      title: Gear sets at Wrenhurst
      fictional: true
      text: |
        Wrenhurst uses 200 gear sets a week, one per bike. The supplier's lead time is 2 weeks, and Wrenhurst keeps a buffer of 200. So its **reorder level** is 200 + (200 × 2) = **600 gear sets**. Each order is for 800, its **reorder quantity**, so stock peaks at 200 + 800 = **1,000**. Stock falls from 1,000; the order goes in at 600, two weeks later; and the delivery arrives two weeks after that, just as stock reaches the buffer, so the cycle repeats every four weeks. These are the figures in the chart above.

        - **A delivery one week late:** Wrenhurst uses its 200-set buffer and reaches zero just as the order arrives. The buffer covers exactly one week's delay at normal usage; a two-week delay would stop production for a week.
        - **Usage rises to 250 a week:** during the 2-week lead time Wrenhurst now uses 500, so stock falls to 100 before the delivery arrives and half the buffer is gone. To protect the buffer, the reorder level should rise to 200 + (250 × 2) = 700.
        - **The lead time lengthens to 3 weeks:** the reorder level must rise to 200 + (200 × 3) = 800.
    advantages:
      - Shows at a glance when to order and how much, and how long the business can last if a delivery is late.
      - Makes the trade-off between the cost of holding stock and the risk of running out visible and easy to discuss.
    limitations:
      - Assumes stock is used at a steady rate, although demand varies by day and by season.
      - Assumes the lead time is fixed and every delivery complete, which one late or short delivery breaks.
      - Shows one item at a time, so a business with thousands of items needs software that reorders automatically.
  - id: capacity-utilization
    title: Capacity utilization
    kind: method
    level: HL
    body: |
      **Productive capacity** is the most a business can produce in a period with the resources it has now: its buildings, machines and staff. It is measured in units that suit the business, such as bikes a week, seats a night or patients a day. The **capacity utilization rate** shows how much of that capacity is actually being used.

      The rate matters because fixed costs have to be paid whatever the output. The more of its capacity a business uses, the more units share the fixed costs, so the lower its cost per unit and the better its margins.

      That does not make 100% the goal. A business working flat out has no room for maintenance, breakdowns or a rush order from a good customer; staff may be overstretched and quality may slip. Most businesses aim for a high rate with some room to spare. Explore the effect of output on cost per unit on the [Operations Floor](/operations-floor/#of-capacity).
    formulas:
      - name: Capacity utilization rate
        expression: Capacity utilization rate = actual output ÷ productive capacity × 100
        note: As in the guide's formula list (p. 65).
    points:
      - term: Low utilization
        text: Idle machines and staff push up the fixed cost of each unit. The business can try to boost demand through marketing or lower prices; use the spare capacity to make products for other businesses, or rent it out; or, if the fall in demand looks permanent, **rationalize** by closing sites, selling equipment or cutting staff.
      - term: Demand above capacity
        text: Customers have to wait or go elsewhere. The business can add overtime or extra shifts; subcontract work to other firms, at some risk to quality and margins; raise its price to ration demand; or invest in more capacity if the demand looks likely to last.
      - term: Temporary or lasting?
        text: A short dip or a seasonal peak may need no response at all; only a lasting change justifies changing the capacity itself.
    example:
      title: Wrenhurst's assembly line
      fictional: true
      text: |
        Wrenhurst's line can assemble 250 bikes a week and is building 200, so its capacity utilization rate is 200 ÷ 250 × 100 = **80%**. Its fixed costs are $30,000 a week, which is **$150 a bike** at 200 bikes. At full capacity the fixed cost per bike would fall to $120; if a slump cut output to 150 bikes a week (60%), it would rise to $200.

        The spare capacity of 50 bikes a week also gives Wrenhurst room to accept a large order, or to make parts it now buys in.
  - id: quality-and-productivity
    title: Defect rate and productivity
    kind: method
    level: HL
    body: |
      Four more measures show how well operations turn inputs into good output: the defect rate and three measures of productivity.

      The **defect rate** is the share of the units made that fail to meet the required quality standard. Defects cost money twice: once to scrap or rework the faulty units, and again if any reach customers, through returns, complaints, recalls and damage to the brand. Cutting the defect rate is a main aim of quality management (subtopic 5.3).

      **Productivity** measures output against the inputs used to produce it. **Labour productivity** is output per worker, or per hour worked; **capital productivity** is output per unit of capital, such as per machine or per machine hour. The guide's **productivity rate** compares total output with total input and multiplies by 100. For the percentage to mean something, value both in the same currency: output at its selling price and inputs at their cost.

      Higher productivity lowers the cost of each unit and can pay for higher wages without higher prices. It can be raised through training, better equipment and technology, better methods and better motivation. Pushing it too hard has costs: rushed work can raise the defect rate, and long hours and pressure raise stress and labour turnover, which is an ethical question as well as a practical one. Each measure means most when it is compared over time or with competitors.
    formulas:
      - name: Defect rate
        expression: Defect rate = units that fail to meet the quality standard ÷ units made × 100
        note: The standard form; the guide gives no formula.
      - name: Labour productivity
        expression: Labour productivity = total output ÷ number of workers (or labour hours)
        note: The standard form; the guide gives no formula.
      - name: Capital productivity
        expression: Capital productivity = total output ÷ capital input (such as machine hours)
        note: The standard form; the guide gives no formula.
      - name: Productivity rate
        expression: Productivity rate = total output ÷ total input × 100
        note: As in the guide's formula list (p. 65).
    example:
      title: A month at Wrenhurst
      fictional: true
      text: |
        In a four-week month Wrenhurst assembles 800 bikes. Inspection rejects 16 of them, which are reworked before sale.

        - **Defect rate:** 16 ÷ 800 × 100 = **2%**.
        - **Labour productivity:** with 25 assembly workers, 800 ÷ 25 = **32 bikes per worker** a month.
        - **Capital productivity:** the line's machines run for 400 hours in the month, so 800 ÷ 400 = **2 bikes per machine hour**.
        - **Productivity rate:** the bikes sell for $500 each, so the output is worth $400,000; all the inputs (materials, labour, energy and the fixed costs of the factory) cost $360,000. 400,000 ÷ 360,000 × 100 = **111.1%**, so each $100 of inputs produces about $111 of output.

        Halving the defects would save the time and parts spent reworking eight bikes a month, raising productivity without a single extra worker or machine.
  - id: operating-leverage
    title: Operating leverage
    kind: concept
    level: HL
    body: |
      **Operating leverage** is the extent to which a business's costs are fixed rather than variable. It decides how sharply profit responds when sales change.

      A business with **high operating leverage**, typically capital-intensive, with expensive machinery or premises, has high fixed costs and low variable costs, so each unit sold brings a large contribution. Once its fixed costs are covered, profit climbs quickly as sales rise; but when sales fall the fixed costs remain, and profit falls just as quickly. A business with **low operating leverage**, typically labour-intensive or paying for resources only when it uses them, has low fixed costs and high variable costs, so its profit is steadier in both directions but grows more slowly in good times.

      The guide names operating leverage but gives no formula, and textbooks measure it in different ways; some simply compare fixed costs with variable costs. The most widely used measure, used here, is the **degree of operating leverage**: total contribution divided by operating profit. A result of 4 means that a 1% change in sales changes operating profit by 4%. Whichever measure you use, state it and show your working.
    formulas:
      - name: Degree of operating leverage
        expression: Degree of operating leverage = total contribution ÷ operating profit
        note: The standard form; the guide gives no formula. Operating profit here is total contribution − fixed costs.
    points:
      - term: The link to break-even
        text: |
          High operating leverage usually comes with a higher break-even quantity and a smaller margin of safety. In fact the degree of operating leverage equals 1 ÷ the margin of safety as a fraction of sales: Wrenhurst, below, breaks even at 600 bikes and sells 800, a margin of safety of 25% of sales, and its degree of operating leverage is 1 ÷ 0.25 = 4.
      - term: Why it matters
        text: It shows how much risk a cost structure carries. A business facing unstable demand may prefer lower operating leverage, for example by leasing equipment, outsourcing or paying staff partly by output, even if that raises its cost per unit.
    example:
      title: Two ways to build a bike
      fictional: true
      text: |
        Wrenhurst, with its automated line, and a fictional rival, Hollowmere Bikes, which builds by hand, each sell 800 bikes a month at $500.

        - **Wrenhurst:** variable cost $300 a bike and fixed costs of $120,000 a month. Total contribution is 800 × $200 = $160,000 and operating profit $40,000, so its degree of operating leverage is 160,000 ÷ 40,000 = **4**.
        - **Hollowmere:** variable cost $400 a bike and fixed costs of $40,000 a month. Total contribution is 800 × $100 = $80,000 and operating profit $40,000, so its degree of operating leverage is 80,000 ÷ 40,000 = **2**.

        Same sales, same profit, different risk. If sales fall 10% to 720 bikes, Wrenhurst's profit falls 40% to $24,000 and Hollowmere's 20% to $32,000. If sales rise 10% to 880 bikes, Wrenhurst's profit rises 40% to $56,000 and Hollowmere's 20% to $48,000.
  - id: make-or-buy
    title: Cost to buy versus cost to make
    kind: application
    level: HL
    body: |
      Should a business make a product or component itself, or buy it from a supplier? On cost alone, compare the **cost to buy (CTB)**, what the supplier would charge for the quantity needed, with the **cost to make (CTM)**, the fixed and variable costs of making that quantity in-house. If CTM is higher than CTB, buying is cheaper on financial grounds; if it is lower, making is.

      Because making carries fixed costs and buying usually does not, the answer depends on the **quantity**. The more units are needed, the more widely the fixed costs of making are spread, so making tends to win at high volumes and buying at low ones. Spare capacity matters too: if machines and staff would otherwise stand idle, some of the costs of making are being paid already.

      The guide sets CTB and CTM at AO3 as well as AO4, so the cost comparison is the start of an answer, not the end of it.
    formulas:
      - name: Cost to buy (CTB)
        expression: Cost to buy = supplier price per unit × quantity
        note: The standard form; the guide gives no formula. Add delivery charges or import duties if the buyer pays them.
      - name: Cost to make (CTM)
        expression: Cost to make = total fixed costs of making + (variable cost per unit × quantity)
        note: The standard form; the guide gives no formula.
    points:
      - term: Reasons to make, even at a higher cost
        text: Control over quality and delivery dates; protecting designs and know-how from rivals; using spare capacity and keeping skilled staff busy; not depending on one supplier; and avoiding suppliers whose labour or environmental standards could damage the brand.
      - term: Reasons to buy, even at a higher cost
        text: A specialist supplier may offer better quality or newer technology; buying frees capacity, cash and management time for the business's core activities; it avoids investing in equipment; and it is easier to change the quantity, or the supplier, if demand changes.
    example:
      title: Should Wrenhurst make its own rear racks?
      fictional: true
      text: |
        Wrenhurst fits a rear rack to every bike, 9,600 a year. A supplier quotes $14 a rack, so **CTB** = 9,600 × $14 = **$134,400**. Making them would need a bending and welding machine and a supervisor, fixed costs of $48,000 a year, plus $8 a rack in steel tube, paint and labour, so **CTM** = $48,000 + (9,600 × $8) = **$124,800**. Making saves $9,600 a year.

        But the saving depends on volume. The two costs are equal at 48,000 ÷ (14 − 8) = 8,000 racks a year; if sales fell to 7,000 bikes, CTB would be $98,000 and CTM $104,000, and buying would be cheaper. Wrenhurst would also weigh the use of its spare capacity, the risk of a new process and whether racks deserve management time at all. A decision tree, a toolkit method, could set out the two options and their likely outcomes.
applications:
  - industry: Car manufacturing
    text: A car is assembled from thousands of parts supplied by several tiers of suppliers, and car makers were among the first to run their plants just in time. Because one missing component can stop a whole assembly line, many now keep buffer stocks of the parts that are hardest to replace.
  - industry: Supermarkets and food retail
    text: Fresh food is perishable, so it is delivered from distribution centres every day or two, close to just in time, with software placing the orders as items are sold. Long-life goods are stocked more generously before holidays, when a stock-out would cost sales on the busiest days.
  - industry: Hospitals and healthcare
    text: A stock-out of a critical medicine or of blood can cost lives, so hospitals hold buffers just in case even though some stock expires unused. Bed and theatre capacity matters as much as stock, because a hospital running close to full utilization has no room for a sudden rise in patients.
  - industry: Hotels and airlines
    text: An empty room or seat cannot be stored and sold tomorrow, so capacity utilization, measured as occupancy or load factor, decides profit. Their high fixed costs give them high operating leverage, which is why they adjust prices to fill the last places.
  - industry: Fashion retail
    text: Styles date within weeks, so stock left unsold loses value quickly. Some retailers buy cheaply from distant factories with long lead times, while others pay more for nearby suppliers that can make and deliver a new design within weeks, trading cost for speed.
  - industry: Software and online services
    text: Capacity means servers and bandwidth, which cloud providers let a business rent as demand rises rather than buy in advance. Make or buy becomes build or buy; writing software in-house gives control, while buying or renting an existing product is usually cheaper and quicker.
stakeholders:
  - group: Suppliers
    text: Just-in-time pushes stock and delivery pressure onto suppliers, who must make frequent small deliveries on time, often under long-term contracts with penalties for lateness. A supplier that fails can halt its customer's production, so the two depend on each other more than under just-in-case.
  - group: Employees
    text: Productivity drives, overtime at high capacity utilization and the multi-skilling that JIT needs all change how people work. A decision to make rather than buy can create jobs in-house, while buying in can remove them, so employees have a direct stake in every make-or-buy choice.
  - group: Customers
    text: Gain from low defect rates and from products that are in stock when they want them, and lose when a lean supply chain breaks and orders are delayed. They rarely see the stock policy, but they feel its failures.
  - group: Owners and shareholders
    text: Cash tied up in stock earns nothing, so owners favour lean stock and high capacity utilization, which raise returns. High operating leverage magnifies profit in good years and losses in bad ones, so the cost structure is also a decision about how much risk the owners carry.
  - group: Local community and environment
    text: A local supply chain keeps work and income in the area and cuts transport emissions, while a global one may lower prices at the cost of longer journeys. Frequent small JIT deliveries can also add lorries to local roads.
  - group: Managers across the business
    text: Finance managers want less stock to free cash; production managers want enough to keep the line running; marketing managers want products always available. A stock policy is a compromise between them, and the stock control chart is where the compromise is made explicit.
evaluation:
  - JIT and JIC trade efficiency against resilience. JIT cuts costs and waste when suppliers are reliable and demand is steady, but a single disruption, from a storm to a blocked shipping route, shows why many businesses keep buffers of their most critical parts.
  - Supply chain and stock decisions cannot be separated. A global chain may lower costs, but its longer lead times raise the reorder level and the buffer stock needed, and with them the cash tied up in stock.
  - The measures are most useful together and over time. One capacity utilization rate or productivity figure says little, while a trend, or a comparison with a rival, says much more. They also interact, because pushing utilization or productivity too hard can raise the defect rate.
  - High operating leverage is not a weakness in itself. It magnifies profit when sales grow as well as losses when they fall, so the right cost structure depends on how stable demand is and how much risk the owners can bear.
  - A cost comparison rarely settles a make-or-buy decision. The result depends on the quantity and on whether spare capacity exists, and quality, reliability, control and ethics, which the numbers leave out, can outweigh a small saving.
  - In an examination, write the formula before substituting, give units or a percentage with every answer, state which measure of operating leverage you use, and interpret each result in the case before recommending.
decision:
  title: Where should the frames come from?
  fictional: true
  brief: |
    Wrenhurst Cycles builds 9,600 bikes a year, one frame each. Its overseas partner charges $90 a frame, with a lead time of eight weeks by sea, and Wrenhurst keeps about six weeks of frames, 1,200 worth $108,000. Each bike earns a contribution of $200, so a week without frames, 200 bikes, costs about $40,000 of contribution. After this month's three-week shipping delay, the owner is weighing three ways forward.
  options:
    - label: Stay overseas, but hold less
      text: Keep the $90 frames and cut the stock to about two weeks, 400 frames worth $36,000, freeing $72,000 of cash. This month's three-week delay would then have stopped the line for a week.
    - label: Switch to a local frame maker
      text: A maker nearby charges $102 a frame but delivers within a week, so Wrenhurst could hold just one week's stock, 200 frames worth $20,400. The frames would cost $115,200 a year more, and $87,600 of cash would be freed from stock.
    - label: Make the frames in-house
      text: Welding equipment, three welders and a supervisor would cost $240,000 a year, plus $66 a frame in tube and materials. At 9,600 frames the cost to make is $873,600 against a cost to buy of $864,000, so making costs $9,600 a year more today. The two costs are equal at 10,000 frames a year.
  guidance: |
    Weigh three things: cost, resilience and control.

    **Holding less** frees $72,000 of cash at no extra cost, but it leaves Wrenhurst exposed to exactly the disruption it has just survived. At an interest rate of, say, 8%, the four weeks of stock it would give up cost about $5,760 a year in interest forgone, while one week of lost production costs about $40,000, so a single long delay could wipe out years of savings. It suits a supply route that has proved reliable, and this one has just shown that it is not.

    **The local maker** buys resilience at a price: $115,200 a year is roughly the contribution from three weeks of production, paid every year whether or not a ship is delayed. In return come short lead times, little stock, easier checks on quality and working conditions, and the ability to change designs quickly. It makes most sense if long delays look likely to recur.

    **Making the frames** costs almost the same as buying today, and becomes cheaper as output grows: at the line's full capacity, 250 bikes a week or 12,000 a year, making would cost $1,032,000 against $1,080,000 to buy, a saving of $48,000. It also removes the sea crossing altogether. But it needs welding skills Wrenhurst does not have, management time and a new quality risk, and it commits the business to $240,000 of fixed costs, which raises its operating leverage.

    A strong judgement ties the choice to Wrenhurst's plans. If it expects to grow towards capacity and can recruit skilled welders, making the frames may be the best long-term answer; if not, a mix, some frames bought locally and the rest overseas with a buffer of three or four weeks, may balance cost and risk better than any single option. What would change the decision: how often long delays are expected, the growth forecast, and whether the local maker would offer a lower price for a long contract.
exam:
  - q: |
      Marram Paints, a fictional paint maker, uses 30 drums of pigment a week. The supplier's lead time is 3 weeks, Marram keeps a buffer stock of 40 drums, and it orders 180 drums at a time.

      Calculate the reorder level, the maximum stock level and the number of weeks between deliveries.
    marks: 4
    command: calculate
    level: HL
    paper: '2'
    answer: |
      A strong response states each standard formula, since the guide gives none for stock control, and shows the working.

      - Reorder level = buffer stock + (usage per week × lead time) = 40 + (30 × 3) = **130 drums**.
      - Maximum stock level = buffer stock + reorder quantity = 40 + 180 = **220 drums**.
      - Weeks between deliveries = reorder quantity ÷ usage per week = 180 ÷ 30 = **6 weeks**.

      Check: stock falls from 220 to 130 in 3 weeks, the order is placed, and over the 3-week lead time another 90 drums are used, so the delivery arrives just as stock reaches the buffer of 40.
  - q: |
      Marram's factory can produce 12,800 tins of paint a month. Last month it produced 9,600 tins, of which 240 failed inspection and were reworked before sale. The tins sell for $20 each, and all the inputs used, materials, labour, energy and the factory's fixed costs, cost $168,000.

      Calculate Marram's capacity utilization rate, its defect rate and its productivity rate for the month.
    marks: 4
    command: calculate
    level: HL
    paper: '2'
    answer: |
      A strong response writes each formula, two of them from the guide's formula list, and gives each result as a percentage.

      - Capacity utilization rate = actual output ÷ productive capacity × 100 = 9,600 ÷ 12,800 × 100 = **75%**.
      - Defect rate = units that fail the quality standard ÷ units made × 100 = 240 ÷ 9,600 × 100 = **2.5%**.
      - Productivity rate = total output ÷ total input × 100. Output is worth 9,600 × $20 = $192,000, so 192,000 ÷ 168,000 × 100 = **114.29%**: each $100 of inputs produces about $114 of output.

      A strong answer adds that a quarter of capacity is idle, so the fixed costs are spread over fewer tins than they could be.
  - q: |
      Marram buys the empty metal tins it fills, 115,200 a year, at $1.20 each. Making them would need a machine leased for $30,000 a year, plus $0.85 a tin in steel and labour.

      Calculate the cost to buy and the cost to make, and the number of tins a year at which the two are equal.
    marks: 4
    command: calculate
    level: HL
    paper: '2'
    answer: |
      A strong response states both standard formulas, works each cost and finds the volume at which they cross.

      - Cost to buy = 115,200 × $1.20 = **$138,240** a year.
      - Cost to make = $30,000 + (115,200 × $0.85) = $30,000 + $97,920 = **$127,920** a year, so making is cheaper by $10,320.
      - The costs are equal where 30,000 = (1.20 − 0.85) × quantity, so at 30,000 ÷ 0.35 = **85,714.3 tins**, about 85,715 a year. Above that, making is cheaper; below it, buying is.

      At 115,200 tins Marram is well above that volume, but a strong answer notes that the saving would shrink if output fell, and that quality, reliability and the use of factory space also matter.
  - q: Each tin of Marram's paint sells for $20 and has a variable cost of $10. Its fixed costs are $72,000 a month and it sells 9,600 tins a month. Calculate Marram's degree of operating leverage, and use it to estimate the effect on profit of a 10% fall in sales.
    marks: 4
    command: calculate
    level: HL
    paper: '2'
    answer: |
      A strong response states the measure used, since the guide gives no formula, and checks the estimate.

      - Total contribution = 9,600 × ($20 − $10) = $96,000; operating profit = 96,000 − 72,000 = $24,000.
      - Degree of operating leverage = total contribution ÷ operating profit = 96,000 ÷ 24,000 = **4**.
      - A 10% fall in sales should therefore cut operating profit by about 4 × 10% = **40%**, to $14,400.
      - Check: at 8,640 tins, contribution is $86,400 and profit $86,400 − $72,000 = $14,400.

      A strong answer adds what this means: with fixed costs three-quarters of the size of its contribution, Marram's profit is very sensitive to sales.
  - q: |
      Fairloom, a fictional social enterprise, trains and employs refugees to make school uniforms. It buys all its cloth from one mill overseas, with a lead time of ten weeks. Last term a late delivery left its sewing team idle for three weeks, and two schools moved to other suppliers.

      Explain **two** ways in which Fairloom could reduce the risks in its supply chain.
    marks: 6
    command: explain
    level: HL
    paper: '3'
    answer: |
      A strong response explains each way, applies it to Fairloom's mission as well as its costs, and notes its drawback.

      - **A second, nearer supplier.** Buying some cloth from a mill with a shorter lead time means one late delivery no longer stops all work, which protects both the schools' orders and the trainees' employment, the heart of Fairloom's mission. The cloth may cost more, and a social enterprise has to check that the new supplier's own labour standards fit its values.
      - **A larger buffer stock of cloth.** Holding stock just in case covers a late delivery, and the cost of three idle weeks and two lost schools suggests the buffer would pay for itself. But it ties up cash, which a small social enterprise may not have, and needs storage space.
      - Earlier ordering, sharing school order forecasts with the mill, or tracking each shipment are also valid. A strong answer links every way back to the people Fairloom exists to employ.
  - q: |
      Wrenhurst Cycles holds about six weeks of frames, 1,200 worth $108,000, bought from one overseas supplier with an eight-week lead time. This month a three-week shipping delay stopped a rival that uses just-in-time, but not Wrenhurst. A week of lost production costs Wrenhurst about $40,000 of contribution.

      Evaluate whether Wrenhurst should move to just-in-time (JIT) for its frames.
    marks: 10
    command: evaluate
    level: HL
    paper: '2'
    answer: |
      A strong response weighs what JIT would gain against what it requires and risks, uses the figures, and reaches a judgement.

      - **What JIT would gain:** most of the $108,000 now tied up in frames would be freed, along with warehouse space and the risk of damage. At an interest rate of, for example, 8% a year, that stock costs about $8,640 a year in interest forgone, before storage and insurance.
      - **What JIT requires:** reliable suppliers, usually nearby, frequent small deliveries and good shared information. A single supplier eight weeks away by sea is close to the opposite.
      - **What JIT risks:** this month's three-week delay would have cost about 3 × $40,000 = $120,000 of contribution, more than the whole value of the stock, as well as late orders and lost customers.
      - **Other options:** JIT could work for Wrenhurst's local parts, such as tyres and boxes, while frames are held just in case; or a local supplier, or making the frames in-house, would shorten the lead time enough to make lean stock safer.
      - **Judgement:** for example, that Wrenhurst should not move to JIT for frames while they come from one supplier eight weeks away, because the cost of one disruption outweighs years of holding costs, but it could cut the buffer if it found a nearer source. The decision depends on how often delays occur and on the cost of the alternatives.
summary:
  - A supply chain turns raw materials into a product in a customer's hands. Local chains are shorter and easier to control; global chains can be cheaper but are slower and more exposed to disruption.
  - Just-in-time holds as little stock as possible and needs reliable, nearby suppliers and quality that is right first time; just-in-case holds buffers against delays and surges, at the cost of cash, space and waste.
  - 'On a stock control chart, reorder level = buffer stock + (usage × lead time) and maximum stock = buffer stock + reorder quantity: the reorder level says when to order, the reorder quantity how much.'
  - Capacity utilization rate = actual output ÷ productive capacity × 100. High utilization spreads fixed costs, but running at 100% leaves no room for maintenance, breakdowns or rush orders.
  - Defect rate = units that fail the quality standard ÷ units made × 100. Defects cost twice, in rework and in reputation.
  - Labour productivity = output ÷ workers or hours; capital productivity = output ÷ capital input; productivity rate = total output ÷ total input × 100.
  - Degree of operating leverage = total contribution ÷ operating profit. High fixed costs magnify the effect of any change in sales on profit.
  - Cost to buy = supplier price × quantity; cost to make = fixed costs + (variable cost × quantity). Making tends to win at high volumes, and quality, control, risk and ethics often decide.
  - The guide gives formulas only for capacity utilization and the productivity rate, so state the standard form for every other measure before substituting.
connections:
  - code: '5.3'
    text: Just-in-time is a lean production method, and the defect rate is what quality management sets out to cut.
  - code: '5.4'
    text: Outsourcing, offshoring, insourcing and reshoring reshape the supply chain, and each is a decision to make or to buy on a larger scale.
  - code: '5.5'
    text: Contribution and the margin of safety underpin operating leverage, and capacity limits the output any break-even target can ask for.
  - code: '3.6'
    text: Stock turnover measures how quickly stock moves, which JIT sets out to speed up.
  - code: '3.7'
    text: Stock ties up working capital, so stock control decisions affect cash flow.
  - code: '5.7'
    text: Contingency planning prepares for the supply chain failures to which JIT is most exposed.

# Notes: 2.5 Organizational (corporate) culture. HL only, so the notes are HL
# throughout. Written in the platform's own words from the guide's three
# content statements (p. 27), with Hofstede's cultural dimensions from the HL
# toolkit (pp. 14 to 15). Handy's model is explained from subject knowledge and
# attributed to him; Schein's levels and the classifications of Deal and
# Kennedy and of Cameron and Quinn are marked as enrichment beyond the guide.
# The teacher support material's glossary (pp. 80 to 90) was read to check
# definitions; nothing from it is reproduced. No coursebook chapter for unit 2
# was supplied. Every business named is fictional.
code: '2.5'
title: Organizational (corporate) culture
level: HL
introduction: |
  Two businesses can have the same organization chart, the same pay scales and the same products and still feel completely different to work in. In one, people speak up, try things and help each other; in the other, they keep their heads down and wait to be told. The difference is **organizational culture**: the shared values, beliefs and habits that shape how people behave when no rule tells them what to do.

  Culture matters most when an organization changes. Growth, a merger or a new leader can set one way of working against another, and a **culture clash** can wreck a strategy that looked sound on paper. This HL subtopic asks you to know what culture is (AO1), to apply Charles Handy's four types of culture to an organization (AO2), and to evaluate the clashes that change can cause (AO3).
objectives:
  - '**Define** organizational culture and **describe** how it shows in what people do, say and take for granted.'
  - '**Outline** where an organization''s culture comes from and why it matters to its performance.'
  - '**Explain** Charles Handy''s four types of culture, power, role, task and person, and **apply** them to an organization.'
  - '**Analyse** which type of culture suits an organization''s size, work, structure and leadership.'
  - '**Evaluate** the causes and effects of culture clashes when organizations grow, merge or change their style of leadership.'
  - '**Discuss** how far managers can prevent or resolve a culture clash.'
situation:
  title: Kitewing Games joins Halberd
  fictional: true
  text: |
    Kitewing Games, a fictional studio of 40 people, made its name with two small, inventive games. Its two founders sat among the developers, decisions were made over lunch, and anyone could pitch an idea at the Friday demo. Teams formed around each game and broke up when it was released. Hours were long but flexible, and nobody had a job title.

    Halberd Interactive, a fictional publisher with 3,000 staff, bought Kitewing for its talent. Within a month the studio had job grades, fixed core hours, a spending limit of $500 for team leaders and a four-stage approval process for new game ideas, run from head office. The founders became creative directors, reporting to a vice-president they rarely saw.

    A year later, nine of the 40 have left, including both lead designers, and the studio's next game is six months late. Halberd's managers say Kitewing lacks discipline; Kitewing's staff say Halberd kills ideas. Why did a deal that looked sensible on paper go wrong so quickly, and what could Halberd have done instead?
sections:
  - id: what-culture-is
    title: What organizational culture is
    kind: concept
    level: HL
    body: |
      **Organizational culture**, also called **corporate culture**, is the set of values, beliefs, attitudes and habits that the people in an organization share, and that shape how they think, behave and make decisions. It is often summed up as "the way we do things around here". Culture tells people what is valued and what is frowned on: whether to ask permission or act first, whether mistakes are punished or discussed, whether the customer or the rulebook comes first.

      Culture is not the same as structure. The organization chart shows who reports to whom; culture shows how people actually behave inside that structure. Two businesses with identical charts can have very different cultures, and a culture can survive a complete restructuring.

      Culture cannot be seen directly, but it can be read from evidence. Some signs are on the surface and easy to notice in a single visit; others lie deeper, because they are assumptions that people no longer question. The first three points below follow the organizational psychologist Edgar Schein, who described culture at three levels. His model is enrichment beyond the guide, but it helps you to look past what an organization says about itself to what its people actually do.
    points:
      - term: Visible signs
        level: HL
        text: What a visitor notices in a day. Dress, office layout, how people address each other, rituals such as meetings and celebrations, the stories told about the organization's heroes and disasters, its logo and its language. Easy to see, but easy to misread without knowing what lies behind them.
      - term: Stated values
        level: HL
        text: What the organization says it believes, in its mission statement, its list of values and its codes of conduct, and what its leaders say in speeches and interviews. They show what leaders want the culture to be, which is not always what it is.
      - term: Shared assumptions
        level: HL
        text: Beliefs so taken for granted that nobody questions them, such as "never bring the boss bad news", "the customer is always right" or "safety comes before speed". They drive behaviour most strongly and are the hardest to change.
      - term: Strong and weak cultures
        level: HL
        text: In a **strong** culture most people share the same values and act on them, so the culture guides behaviour without detailed rules. In a **weak** culture values are unclear or not widely shared, so behaviour depends more on rules, supervision and individual choice.
      - term: Subcultures
        level: HL
        text: Large organizations rarely have a single culture. Departments, sites and professions develop their own, such as a sales team that prizes speed beside a finance team that prizes accuracy, and the gap between them is a common source of friction inside one business.
    example:
      title: Two banks on the same street
      fictional: true
      text: Two fictional banks, Ravelin Bank and Stowford Bank, sell almost identical accounts in the same town, and their branch structures are the same. At Ravelin, staff wear suits, any decision worth more than $1,000 goes to the branch manager, and the story every new employee hears is about a colleague dismissed for breaking a lending rule. At Stowford, staff can refund a customer up to $200 on the spot, managers sit at desks in the banking hall, and the favourite story is about a cashier who drove a forgotten wallet to a customer's home. Same products, same charts, different cultures, and customers notice the difference.
  - id: origins-and-importance
    title: Where culture comes from, and why it matters
    kind: concept
    level: HL
    body: |
      Cultures are rarely designed in a single decision. They build up over years from several sources:

      - **Founders and leaders.** A founder's values and habits can shape an organization for decades. Later leaders change culture mainly through what they do, reward and tolerate, rather than what they say.
      - **History.** Past successes and crises leave stories and rules of thumb. A business that once nearly failed from overspending may stay cautious long after the danger has passed.
      - **The industry and the work itself.** Safety comes first in an airline or a chemical plant, creativity and speed in an advertising agency, precision in an accountancy firm.
      - **National culture.** Organizations absorb the expectations of the society around them, for example about authority, formality and the balance between work and family.
      - **Recruitment, induction and rewards.** Organizations tend to hire people who seem to fit, teach newcomers how things are done, and reward the behaviour they value, so a culture reproduces itself.

      Culture matters because it reaches places that rules and supervision cannot. A culture that values customers, quality or safety makes good behaviour normal even when nobody is watching; one that values only results can make cutting corners normal too. Culture affects motivation and labour turnover, how quickly decisions are made, how open people are to change, and whether an organization attracts the people it needs. Because it is hard to copy, a culture that fits the strategy can be a lasting source of competitive advantage. The lists below weigh the strengths and dangers of a **strong** culture.
    advantages:
      - Guides behaviour without detailed rules, so decisions can be passed down to the people closest to the customer.
      - Builds commitment, loyalty and motivation, which can lower absence and labour turnover.
      - Makes service and quality more consistent across sites and shifts.
      - Is hard for rivals to copy, so it can give a lasting advantage.
    limitations:
      - Resists change, because people defend the way things have always been done.
      - Can lead to **groupthink**, where nobody questions shared assumptions or reports bad news.
      - Can exclude people who do not fit, which narrows the range of ideas and becomes unfair when fitting in really means being the same.
      - A strong culture built on the wrong values, such as winning at any cost, spreads bad behaviour as effectively as good.
    example:
      title: A founder's habits become the culture
      fictional: true
      text: Tamsin Okafor opened the first shop of Lowmoor Bakeries, a fictional chain, fifteen years ago. She tasted every new recipe herself, threw away any batch she thought below standard and personally phoned every customer who complained. Today there are 30 shops and she rarely visits a kitchen, yet shop managers still bin underweight loaves, and on their first day new staff hear the story of the wedding cake she remade overnight. Nobody wrote a rule about quality; the founder's habits became the culture.
  - id: handy
    title: Handy's Gods of management
    kind: theory
    level: HL
    body: |
      Charles Handy, an Irish writer on management, set out four types of organizational culture in *Gods of Management* (1978), building on an earlier classification by the organizational psychologist Roger Harrison. Handy named each culture after a god of ancient Greece whose character matched it, and gave each an image that shows where power and influence sit.

      The four types are **ideal types**: simplified pictures that real organizations resemble more or less closely. Handy argued that no type is best. Each suits a different kind of work: power cultures suit fast, risky decisions; role cultures suit routine, predictable work; task cultures suit solving problems and developing new things; person cultures suit independent professionals. Most organizations need a mix, with different cultures in different parts, and they run into trouble when the culture does not fit the work or when one culture is imposed on work that needs another.

      To identify the culture in a case, look for evidence on three questions. Where does power come from: a person, a position, expertise, or each individual's own skill? How are decisions made: by the leader, by procedure, by the team, or by each professional alone? And when something goes wrong, who acts, and how fast?
    diagram: handy-gods-of-management
    points:
      - term: 'Power culture: Zeus'
        level: HL
        text: Power sits with one person or a small group at the centre, like a spider at the middle of a web; Handy also called it a club culture. Influence depends on closeness to the centre, decisions are fast and personal, and there are few rules or committees. It suits small, entrepreneurial firms and crises. It depends heavily on the judgement of the central figure, can leave others feeling powerless, and struggles when the organization grows too large for one person to run or when the leader leaves.
      - term: 'Role culture: Apollo'
        level: HL
        text: Power comes from position, and work is governed by job descriptions, rules and procedures, like a Greek temple whose pillars, the departments, support the senior managers above. It is efficient, fair and predictable in a stable environment, and suits large organizations doing routine work, such as government departments and insurers. It is slow to change, and it frustrates people who want to use their initiative.
      - term: 'Task culture: Athena'
        level: HL
        text: Influence comes from expertise, not rank. Teams form around particular jobs or projects and break up when they are done, like the knots of a net. It is flexible, creative and good at solving problems, and suits consultancies, advertising agencies and research teams, often in a matrix structure. It is expensive and hard to control, teams may compete for people and money, and under pressure it can slide back into a power or role culture.
      - term: 'Person culture: Dionysus'
        level: HL
        text: The organization exists to serve the individuals in it, who are skilled professionals with their own clients and reputations, forming a loose cluster. It suits partnerships of lawyers, doctors and architects, and some university departments. Individuals have great freedom, but they accept little authority, so the organization is hard to direct or change.
    advantages:
      - Gives a simple, memorable vocabulary for describing how an organization really works.
      - Links culture to structure and leadership, and helps to explain why people thrive in some organizations and not in others.
      - Helps to predict clashes, for example when a role culture takes over a power or task culture.
      - Shows that the right culture depends on the work, not on fashion.
    limitations:
      - Real organizations mix the types, so a single label can mislead.
      - It describes cultures but says little about how to change one.
      - It rests on Handy's observation and argument rather than on systematic measurement.
      - It leaves out national culture, which also shapes how people behave at work.
    example:
      title: Four gods in one university
      fictional: true
      text: |
        Kestrel Bay University, a fictional university, contains all four cultures. Its vice-chancellor, appointed to rescue the university's finances, decided with a small inner circle, in a fortnight, to close two loss-making departments: a power culture at work in a crisis. The admissions and finance offices run on procedures, forms and deadlines, a role culture. Research projects bring together chemists, engineers and data scientists for three years and then disband, which is a task culture. And many senior professors run their own research groups, find their own funding and resist instructions from the centre, as in a person culture.

        Each culture suits its part of the work. Trouble starts when one is applied everywhere, for example when the centre tries to manage research teams with the procedures it uses for admissions.
  - id: which-culture-fits
    title: Which culture fits?
    kind: application
    level: HL
    body: |
      Handy's central point is that culture should fit the work. The same type can be a strength in one setting and a weakness in another, so judging a culture means asking first what the organization needs to do well.

      **Size and stage of growth.** Most businesses begin with a power culture around the founder, which suits a small firm that must move fast. As they grow, one person can no longer make every decision, so procedures, job descriptions and layers of managers arrive and the culture drifts towards a role culture. Some then deliberately build task cultures in the parts that must keep innovating. **The environment** matters too: a role culture works well when markets, technology and laws change slowly, because procedures can be planned in advance, but it becomes a handicap when they change fast, and task cultures, which regroup around each new problem, cope better.

      **National culture.** Organizations sit inside national cultures. Where people accept large differences in authority, high power distance in the terms of Hofstede's cultural dimensions, an HL toolkit tool, power and role cultures can feel natural; where people expect to be consulted, task cultures fit more easily. A multinational may find that the culture that works at home meets resistance abroad, so the diagram's six dimensions are a useful check before expanding or merging across borders.
    diagram: hofstede-dimensions
    points:
      - term: Culture and structure
        level: HL
        text: Tall, bureaucratic structures go with role cultures; matrix and project-based structures with task cultures; a small, flat firm run by its founder with a power culture; a partnership of equals with a person culture.
      - term: Culture and leadership
        level: HL
        text: An autocratic leader tends to create or keep a power culture, a democratic leader encourages a task culture, and a laissez-faire style suits a person culture of independent experts. A paternalistic leader often sits at the centre of a power culture that treats staff as family.
      - term: Culture and the work
        level: HL
        text: Routine, high-volume work suits a role culture; novel problems suit a task culture; crises suit a power culture; work that depends on individual expertise and reputation suits a person culture.
      - term: Other classifications
        level: HL
        text: The guide names Handy's model as an example, and others exist. Deal and Kennedy sorted cultures by the risk of decisions and the speed of feedback, and Cameron and Quinn describe clan, adhocracy, market and hierarchy cultures. Both are enrichment beyond the guide; Handy's is the one to know well.
    example:
      title: Three stages at Fenmarsh Robotics
      fictional: true
      text: |
        Fenmarsh Robotics, a fictional maker of warehouse robots, began with four engineers in a rented unit. Its founder decided everything, often the same day: a power culture, and the right one for a firm racing to build its first product.

        At 120 staff, that culture had become a bottleneck. Orders waited for the founder's signature and engineers queued for decisions. Fenmarsh appointed department heads and introduced written procedures for purchasing, safety and quality, moving towards a role culture that suited reliable production.

        The procedures then began to slow product development, so Fenmarsh created a separate development unit with project teams that choose their own methods and report on results, a task culture inside a role culture. Each step fitted the work at that stage; keeping the start-up's culture at 120 staff, or the factory's procedures in the development unit, would not have.
  - id: culture-clashes
    title: Culture clashes when organizations change
    kind: concept
    level: HL
    body: |
      A **culture clash** is the conflict and misunderstanding that arise when people with different cultures must work together, or when an organization's existing culture meets a change it does not fit. It is rarely about any single rule. It happens because culture is tied to people's identity, status, security and daily routines, so a change that challenges the culture feels like a challenge to them. Assumptions that nobody noticed suddenly become visible, and defended.

      The guide names growth, mergers and changes of leadership style, and says that clashes are not limited to these. In each case, ask which cultures are meeting, which one has the power, and what each side stands to lose.

      Warning signs include falling morale, more absence and complaints, rising labour turnover, especially among the most able staff, who find new jobs most easily, open conflict between groups, slower decisions, and an "us and them" language in which people still describe themselves by their old company or their old manager.
    points:
      - term: Growth
        level: HL
        text: As a business grows, the founder's power culture meets procedures, middle managers and specialists. Long-serving staff miss the closeness and speed of the early days; newcomers find the informal ways confusing or unfair. Growth by opening new sites or countries can also create subcultures that drift away from head office.
      - term: Mergers and acquisitions
        level: HL
        text: Two cultures must become one, usually quickly and under pressure to show savings. In an acquisition the buyer's culture tends to dominate, and the acquired staff may feel conquered. Differences in pay, titles, hours, dress, decision-making and attitudes to risk all surface at once, often in the parts of the business that were meant to deliver the deal's benefits.
      - term: A change of leadership style
        level: HL
        text: A new leader who replaces a democratic style with an autocratic one, perhaps to cut costs, can unsettle a culture built on consultation; a democratic leader can equally frustrate staff used to clear direction. The style changes faster than people's expectations.
      - term: Expansion abroad
        level: HL
        text: "Opening operations in another country, or merging with a foreign firm, brings national cultures into play: attitudes to hierarchy, directness, time and the balance between work and family can differ sharply."
      - term: Other changes
        level: HL
        text: New technology that monitors work, a restructuring or delayering, a move to remote or hybrid working, or a change of ownership from public to private can each threaten the habits and assumptions a culture rests on.
    example:
      title: Back to Kitewing
      fictional: true
      text: |
        The Kitewing case in the situation above is a clash between Handy's types. Kitewing combined a task culture, with teams forming around each game and influence coming from talent, with a power culture around its two founders, who made decisions quickly and personally. Halberd is a large role culture: job grades, spending limits and a four-stage approval process are exactly the procedures that make a 3,000-person publisher predictable.

        Halberd imposed its procedures on work that needed the opposite. Approval from head office slowed the fast, informal decisions that games development depended on, and job grades replaced influence based on talent with influence based on rank. The founders lost their power without gaining a role they valued. The people best able to leave, the lead designers, left first, and they took the knowledge Halberd had paid for with them. The section on reducing a clash, below, shows what Halberd could have done instead.
  - id: effects-of-a-clash
    title: Weighing the effects of a clash
    kind: evaluation
    level: HL
    body: |
      The guide sets culture clashes at AO3, so it is not enough to list effects. You need to judge how serious a clash is likely to be in the case, what it depends on, and whether any good can come of it.

      The costs fall on people first and on performance soon after. Uncertainty and resentment lower motivation and raise stress; conflict and absence follow; the most able staff leave first; customers notice slower service or falling quality. In a merger, the savings and new products that justified the price may never arrive, because the people needed to deliver them are busy defending their old ways, or have gone.

      Yet a clash is not always harmful. A newcomer can expose habits that no longer serve the organization, such as a cosy culture that tolerated poor performance or a founder's culture that could not grow, and the friction can be the price of necessary change. The question is whether the change is worth its cost, and whether it is managed well enough to keep that cost down.
    points:
      - term: How far apart the cultures are
        level: HL
        text: Two role cultures merging face smaller gaps than a role culture absorbing a power or task culture. Comparing the cultures with Handy's types before a deal shows where the gaps lie.
      - term: How the change is handled
        level: HL
        text: Explaining the reasons, consulting people and keeping what they value reduce resistance; imposing change quickly, with little explanation, maximizes it.
      - term: The balance of power
        level: HL
        text: When one side dominates, its culture usually wins, at the cost of the other side's commitment. When the sides are equal, a clash can drag on with neither culture prevailing.
      - term: Speed and pressure
        level: HL
        text: Pressure to show savings fast pushes managers to impose the stronger culture, which can save money in the short run and lose the people and ideas that made the deal worthwhile.
      - term: What the business needs
        level: HL
        text: If the old culture was failing, a clash may be the necessary cost of renewal. If the old culture was the reason for buying the business, destroying it destroys the value of the deal.
    example:
      title: A clash worth having?
      fictional: true
      text: Fenwold Pharmacies, a fictional family chain of 40 pharmacies, had a warm paternalistic culture in which long-serving managers were rarely challenged, even as stock losses and errors in dispensing rose. A new chief executive introduced monthly performance reviews and published each branch's figures. Several managers resigned, and morale fell for a year. Errors then fell by half and the chain returned to profit. The clash was real and costly, but it removed a culture that had been protecting poor performance. Whether it was worth the cost depends on whether the new culture keeps the loyalty of the staff who stayed.
  - id: reducing-a-clash
    title: Reducing a culture clash
    kind: application
    level: HL
    body: |
      Culture cannot be changed by announcement, but the damage from a clash can be reduced. The work starts before the change, with an honest assessment of both cultures, and continues long after it, because people's assumptions change far more slowly than structures and job titles.

      **Before the change**, managers can compare the cultures, using evidence such as staff surveys, interviews and Handy's types, and decide which differences matter for the strategy and which do not. A buyer that knows which habits created the value it is paying for can protect them. **During the change**, people need to hear early and honestly what will change and what will not, from leaders they trust, and to be involved in designing the new ways of working. Mixed teams from both sides, shared training, visible symbols such as a new joint name, and quick, fair decisions on pay, titles and jobs all help. **After the change**, leaders must model the culture they want, because staff watch what leaders reward and tolerate more than what they say, and recruitment, induction, appraisal and rewards must all point the same way.

      In a merger or acquisition there is also a strategic choice about how far to integrate. The options below are common terms in management writing rather than terms from the guide.
    points:
      - term: Absorb
        level: HL
        text: The buyer's culture replaces the acquired firm's. Quick and clear, and suitable when the acquired business was failing or its culture does not matter to the value of the deal, but it risks losing its best people.
      - term: Preserve
        level: HL
        text: The acquired firm keeps its own culture and much of its independence, with the buyer setting financial targets. Suitable when its culture is the source of its value, as with a creative studio, but it limits the savings from combining the two.
      - term: Blend
        level: HL
        text: The two cultures are combined, keeping the best of each, sometimes under a new name and new values. Fairer and more likely to win commitment from both sides, but slow and hard to do, and it can leave neither side satisfied.
    example:
      title: What Halberd could have done
      fictional: true
      text: |
        Returning to the situation: Halberd bought Kitewing for its talent and its ideas, both products of its culture, so a strategy closer to **preserve** would have fitted better than absorb. Halberd could have kept Kitewing's teams, hours and Friday demos, set it clear targets for budgets and release dates, and applied group procedures only where they mattered, such as legal checks, finance and data protection.

        Before the deal, it could have asked Kitewing's staff what they valued and what worried them; during it, it could have given the founders real authority over new ideas, with a fast route to a decision-maker, rather than a title without power. Some clash was inevitable, since a 40-person studio inside a 3,000-person publisher cannot work exactly as it did. But the costs Halberd actually paid, nine departures and a six-month delay, came largely from the choice to absorb.
applications:
  - industry: Technology start-ups
    text: Young technology firms usually combine a power culture around the founders with task cultures in their product teams, and they value speed over procedure. Their culture is often what investors and buyers are paying for, which is why acquisitions by large, rule-bound companies so often lead to clashes and departures.
  - industry: Hospitality
    text: A hotel or restaurant chain needs consistency across sites, which pushes it towards a role culture of brand standards and procedures, but excellent service depends on staff who use their judgement with guests. With high labour turnover, induction has to pass the culture on quickly, so stories and the example set by managers matter more than manuals.
  - industry: Healthcare
    text: Hospitals contain strong professional subcultures, with senior doctors often behaving like a person culture and managers working in a role culture, which makes change slow and contested. Patient safety depends on a culture in which junior staff feel able to question seniors and report mistakes without fear of blame.
  - industry: Banking and financial services
    text: Banks rely on role cultures of rules, approvals and compliance, because errors and fraud are costly. A culture that rewards sales above everything can push staff to sell products customers do not need, which is why banks pay close attention to how targets and bonuses shape behaviour, and why bank mergers face long, difficult integrations of systems and cultures.
  - industry: Manufacturing
    text: Factories have often run on command-and-control role cultures, but lean production and total quality management at HL depend on a culture in which every employee looks for improvements and stops the line when something is wrong. Changing that culture usually takes years, and it fails if managers keep punishing the people who raise problems.
  - industry: Social enterprises
    text: Social enterprises are often built on a strong shared mission and the commitment of founders and volunteers. As they grow and hire professional managers, procedures and targets can clash with that mission-driven culture, a challenge that suits Paper 3's focus on the organizational challenges facing a social entrepreneur.
stakeholders:
  - group: Employees
    text: Culture decides much of what work feels like day to day, so employees who fit it are more motivated and more likely to stay. In a clash they face uncertainty about jobs, status and routines, and those who identify with the losing culture often feel betrayed. The most marketable employees have the most choice, so they are often the first to leave.
  - group: Managers
    text: Managers carry a culture through what they do, reward and tolerate, and they must make a new one work. Middle managers in a merger are caught between two cultures and between pressure from above for quick savings and resistance from below. Leaders who say one thing and do another lose their staff's trust quickly.
  - group: Owners and shareholders
    text: Owners want the benefits a growth strategy or merger promised, and they may press for fast savings. That brings them into conflict with employees, since imposing one culture quickly can cut costs in the short run while losing the people and ideas that made the business valuable.
  - group: Customers
    text: Customers meet the culture through the service they receive. A clash that distracts or demotivates staff shows up as late deliveries, mistakes and poorer service, while a strong service culture can be the main reason customers stay loyal.
  - group: Trade unions and employee representatives
    text: After a merger, unions often negotiate over harmonizing pay, hours and conditions between two workforces, so a culture clash can turn into a formal dispute. A culture of trust and consultation makes such negotiations easier; one of suspicion makes industrial action more likely (2.7).
evaluation:
  - Culture is real but hard to pin down. It can be inferred from behaviour, stories, staff surveys and labour turnover, but not measured precisely, and what an organization says about its culture in its mission statement may differ from what its people experience. Base a judgement on evidence from the case, not on a single statement of values.
  - Handy's types are ideal types. Most organizations mix them, and different departments can have different cultures, so use the model to describe tendencies and to spot mismatches, not to give a whole organization one label.
  - There is no best culture, only a fit between culture and the work, the organization's size and the environment. A culture that drove success, such as a founder's power culture during early growth, can later be what holds the business back.
  - Culture clashes are a common reason why mergers disappoint, but rarely the only one. The price paid, a weak strategy or a change in the market can matter as much, so weigh culture alongside the other causes in a case rather than blaming it for everything.
  - Culture changes slowly and mainly through what leaders do, reward, tolerate and recruit for, not through announcements. Imposing a new culture quickly is possible, but its costs, in resistance and departures, are usually higher than planned. Link this to the management of change and resistance to change in 2.1.
  - In an examination answer, identify the culture from the evidence (where power sits, how decisions are made, how rules are used), name Handy's type, then judge whether it fits what the organization now needs. For a clash, say which cultures meet, why, what the likely effects are and what they depend on.
decision:
  title: Brindle and Oak grows up
  fictional: true
  brief: |
    Brindle and Oak, a fictional furniture maker, employs 25 craftspeople in one workshop. Its founder, Ewan Brindle, designs most pieces, sets every price, hires every employee and walks the workshop floor each morning. Staff are loyal, quality is high and decisions take minutes. Labour turnover is under 5% a year.

    A national retailer has offered a five-year contract that would require a second workshop and around 120 staff within two years, about half of them making a standard range in volume. Ewan must decide how the business will be run as it grows, knowing that the way he runs it now will not survive the change unaltered.
  options:
    - label: Keep the founder at the centre
      text: Grow with the current power culture. Ewan keeps final say on designs, prices and hiring, with a trusted supervisor in each workshop. Decisions stay fast and the culture familiar, but everything still depends on one person.
    - label: Professionalize with procedures
      text: Appoint an operations manager and department heads, write procedures for production, quality and hiring, and introduce job grades, moving towards a role culture. Volume production becomes predictable and less dependent on Ewan, but long-serving craftspeople may see it as the end of the business they joined.
    - label: Build teams around shared values
      text: "Organize each product range as a self-managing team with its own targets and the authority to decide how to meet them, held together by a few firm rules on safety and quality and values Ewan sets out clearly: a task culture with the founder as coach. Teams can adapt to each range, but the approach is untested at scale and needs managers who can work this way."
  guidance: |
    Start with the work, as Handy would. The new business has two kinds of work: bespoke pieces, where craft judgement and flexibility matter, and a standard range made in volume to a retailer's deadlines, where consistency and planning matter. One culture is unlikely to suit both.

    Option A fails the size test. A power culture works at 25 people because Ewan can see everything; at 120 people on two sites, decisions will queue for him, supervisors will lack authority, and the business will be exposed if he falls ill. It protects the culture in the short run by storing up a crisis.

    Option B suits the volume work and the retailer, who will want reliable delivery and documented quality. Its risk is a clash with the long-serving craftspeople whose skills built the brand; turnover among them would damage the bespoke side most. Option C suits the bespoke work and keeps much of what staff value, but on its own it may give the retailer too little predictability.

    A strong answer is likely to combine them: role-culture procedures where they matter, in volume production, safety, quality and finance, and task-culture teams for design and bespoke work, with Ewan's role changing from deciding everything to setting values and coaching. The decision should also say how to manage the change: explaining the reasons to staff early, involving long-serving craftspeople in writing the procedures and training new supervisors. Signs that would change the judgement include rising turnover among experienced staff, missed delivery dates, or Ewan's own unwillingness to let go.
exam:
  - q: Define the term *organizational culture*.
    marks: 2
    command: define
    level: HL
    paper: '2'
    answer: |
      A full definition has two parts:

      - the shared values, beliefs, attitudes and norms of the people in an organization;
      - which shape how they behave and make decisions, "the way things are done" there.

      An answer that gives only one part, or describes a sign of culture such as a dress code without saying what culture is, is worth about half the marks.
  - q: |
      Pentreath Engineering, a fictional family firm of 60 employees, is run by its founder, Gordon Pentreath. He approves all spending over $200, interviews every job applicant and settles disagreements between departments himself. There are few written procedures, and staff say the quickest way to get anything done is to "catch Gordon in the corridor".

      Using Handy's Gods of management, explain the type of culture at Pentreath Engineering.
    marks: 4
    command: explain
    level: HL
    paper: '2'
    answer: |
      A strong response:

      - identifies a **power culture** (Zeus), with Gordon at the centre of the web;
      - supports it with evidence from the case: he approves spending, hires every employee and settles disputes, so power comes from closeness to him, not from procedures, of which there are few;
      - explains a consequence for the firm, for example that decisions can be fast and personal, but everything depends on Gordon, so the firm is exposed if he is absent or retires, and junior managers may feel powerless.

      Naming the type without evidence from the case limits the answer to about half the marks.
  - q: Distinguish between a role culture and a task culture.
    marks: 4
    command: distinguish
    level: HL
    paper: '2'
    answer: |
      A strong response makes the differences clear, point against point:

      - **Source of power:** in a role culture power comes from a person's position; in a task culture influence comes from expertise.
      - **How work is organized:** a role culture runs on job descriptions, rules and procedures, like Handy's Greek temple; a task culture forms teams around projects that break up when the work is done, like a net.
      - **Suitability:** a role culture suits stable, routine work and is predictable but slow to change; a task culture suits problem-solving and innovation and is flexible but costly and harder to control.

      Two clear differences, each explained for both cultures, make a complete answer; describing only one of the cultures is worth at most half the marks.
  - q: |
      Hearthstep, a fictional social enterprise, trains young people leaving the care system to work in its cafés. It has grown from one café run by its founder and volunteers to eleven cafés with 140 paid staff. Volunteers describe the early days as "a family with a mission". The founder has now hired an operations director from a large restaurant chain to standardize menus, rotas and costs.

      Explain two challenges Hearthstep may face in keeping its culture as it grows.
    marks: 6
    command: explain
    level: HL
    paper: '3'
    answer: |
      A strong response explains two distinct challenges, each linked to Hearthstep, for example:

      - **A clash between mission and procedures.** The operations director brings a role culture of standard menus, rotas and cost targets. Volunteers and long-serving staff, motivated by the mission of helping young people from care, may see this as putting profit and efficiency before the trainees, which can lower their commitment and lead some to leave.
      - **A founder-centred culture that cannot stretch.** A family atmosphere around the founder works with one café but not with eleven. The founder can no longer know every trainee, so the culture must be passed on through managers, induction and stories, or it will weaken as new staff arrive who never knew the early days.
      - Another valid challenge is the tension between treating trainees with patience, which may mean slower service, and the consistency customers expect from a chain.

      Each challenge needs the cause, the effect on Hearthstep's culture and why it matters for its social purpose: roughly three marks for each well-explained challenge.
  - q: |
      Ostrander Freight, a fictional logistics company, made losses for two years. Its board replaced the chief executive, who had consulted staff widely and given depot managers freedom to run their depots, with a new chief executive known for cutting costs fast. She has centralized decisions on spending and routes at head office and told depot managers that targets are not negotiable.

      Evaluate the likely impact of the new chief executive's leadership style on the organizational culture of Ostrander Freight.
    marks: 10
    command: evaluate
    level: HL
    paper: '2'
    answer: |
      A strong response would:

      - identify the old culture as closer to a **task culture**, or a role culture with high autonomy, built on a democratic style, and the new style as **autocratic**, pushing towards a **power culture** at the centre;
      - analyse likely benefits: faster, consistent decisions in a crisis; costs cut where depots had diverged; a clear message to the market and the board that losses will be tackled;
      - analyse likely costs: a clash with depot managers used to freedom, who may feel distrusted and leave, taking local knowledge with them; less initiative and fewer ideas from below; lower motivation (linking to 2.4) and possible disputes if changes affect drivers' conditions (2.7);
      - weigh what the impact depends on: how severe the crisis is, since staff accept direction more readily when the business is clearly in danger; whether the chief executive explains her reasons and consults on how, not whether, to cut; whether the centralization is temporary;
      - reach a justified conclusion, for example that the style may be right for the short-term crisis but will damage the culture, and with it long-term performance, unless authority is handed back to depots once costs are under control.

      Answers that describe autocratic leadership without linking it to culture, or that ignore the case, are weak however accurate the description.
  - q: To what extent can managers prevent a culture clash when two organizations merge?
    marks: 10
    command: to-what-extent
    level: HL
    paper: '2'
    answer: |
      A strong response would:

      - explain why mergers cause clashes: two sets of values, routines and assumptions must become one, under pressure for quick savings, and people's identity, status and jobs are at stake;
      - explain what managers can do: assess both cultures before the deal, communicate early and honestly, involve staff from both sides, choose an integration approach (absorb, preserve or blend) that fits the reason for the merger, model the new culture and align rewards and recruitment with it;
      - weigh the limits: culture changes slowly; some differences, such as pay and job losses, create real losers whatever managers say; the larger the gap between the cultures, the harder prevention becomes; and pressure from owners for fast results can push managers to impose a culture anyway;
      - use examples, which may be fictional or from cases studied in class, to support the argument;
      - conclude with a judgement, for example that managers cannot prevent some clash in a merger of very different cultures, but can greatly reduce its cost, and that the decisions made before the deal matter most.
summary:
  - Organizational culture is the shared values, beliefs, norms and habits that shape how people in an organization behave, often summed up as "the way we do things around here".
  - It shows in visible signs (dress, layout, rituals, stories), in stated values, and most powerfully in shared assumptions nobody questions.
  - It comes from founders and leaders, history, the industry, national culture, and who is recruited, trained and rewarded.
  - "Handy's Gods of management: power culture (Zeus, the web), role culture (Apollo, the temple), task culture (Athena, the net) and person culture (Dionysus, the cluster)."
  - No culture is best. The right one fits the work, the organization's size and its environment, and most organizations mix them.
  - Culture clashes happen when organizations grow, merge, change leadership style, expand abroad or change in other ways, because culture is bound up with identity, status and routine.
  - Clashes bring falling morale, conflict, absence, turnover and lost merger benefits, but can sometimes clear away a culture that was holding the business back.
  - Managers can reduce a clash by assessing cultures early, communicating, involving staff, choosing how far to integrate and modelling the new culture, but cannot change culture quickly by decree.
retrieval:
  - q: What is organizational culture?
    a: The shared values, beliefs, attitudes and norms of the people in an organization, which shape how they behave and make decisions; "the way we do things around here".
  - q: Give two visible signs of an organization's culture.
    a: For example dress, office layout, how people address each other, rituals such as meetings and celebrations, and the stories people tell about the organization.
  - q: What is the difference between a strong and a weak culture?
    a: In a strong culture most people share the same values and act on them, so the culture guides behaviour without detailed rules. In a weak culture values are unclear or not widely shared, so behaviour depends more on rules and supervision.
  - q: Name Handy's four cultures with their gods.
    a: Power culture (Zeus), role culture (Apollo), task culture (Athena) and person culture (Dionysus).
  - q: Which image did Handy use for each culture?
    a: Power, a spider's web; role, a Greek temple; task, a net; person, a loose cluster.
  - q: Where does power come from in a role culture, and in a task culture?
    a: In a role culture, from a person's position in the hierarchy; in a task culture, from expertise.
  - q: What kind of organization suits a person culture?
    a: One made up of independent, skilled professionals, such as a partnership of lawyers, doctors or architects, where the organization exists to serve the individuals.
  - q: Why does a founder's power culture often struggle as a business grows?
    a: One person can no longer make every decision, so decisions queue at the centre, others lack authority, and the business depends too heavily on the founder.
  - q: Name three situations in which culture clashes are likely.
    a: For example growth, a merger or acquisition, a change of leadership style, expansion into another country, and a restructuring or new technology.
  - q: Give three possible effects of a culture clash.
    a: For example falling morale and motivation, more conflict and absence, higher labour turnover, slower decisions, poorer customer service, and merger benefits that never arrive.
  - q: What is the difference between absorbing and preserving an acquired firm's culture?
    a: Absorbing replaces the acquired firm's culture with the buyer's; preserving lets it keep its own culture and much of its independence, with the buyer setting targets.
  - q: Why can a strong culture be a weakness?
    a: It can resist change, encourage groupthink, exclude people who are different, and spread bad behaviour if it is built on the wrong values.
connections:
  - code: '1.5'
    text: Mergers, acquisitions and takeovers bring two cultures together, and growth changes what culture a business needs.
  - code: '2.1'
    text: Culture shapes how people respond to change, and the HR strategies for reducing resistance to change are the tools for reducing a clash.
  - code: '2.2'
    text: Role cultures fit tall, bureaucratic structures, task cultures fit matrix and project-based structures, and a founder's power culture fits a small, flat firm.
  - code: '2.3'
    text: Leadership style builds and reinforces culture, and a change of style is one of the guide's named causes of a clash.
  - code: '2.4'
    text: Culture shapes which rewards motivate, and a clash is a common cause of demotivation and labour turnover.
  - code: '2.7'
    text: A culture of trust or suspicion shapes employee relations, and mergers often lead to negotiations, and sometimes disputes, over harmonizing pay and conditions.

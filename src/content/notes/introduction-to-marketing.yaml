retrieval:
  - q: What is the difference between product orientation and market orientation?
    a: A product-oriented business starts from the product it makes best and then looks for buyers. A market-oriented business starts from research into what customers want and then designs products to meet those wants.
  - q: Give two situations in which product orientation is likely to succeed.
    a: For example, a genuinely new technology that customers could not have asked for, specialist engineering where technical excellence is what buyers pay for, or luxury craft where the maker's skill is the point.
  - q: A business sold $6m in a market worth $40m. What is its market share?
    a: $6m ÷ $40m × 100 = 15%.
  - q: A market grew from $50m to $56m. What was its growth?
    a: ($56m − $50m) ÷ $50m × 100 = 12%.
  - q: Why can a business's sales rise while its market share falls?
    a: Because its market grew faster than its sales. Share is its sales divided by market sales, so if the market grows by more, the share falls.
  - q: Why might a business's share by value be higher than its share by volume?
    a: Because its prices are above the market average, so each unit it sells brings in more revenue than an average unit. A premium brand shows this pattern.
  - q: A share falls from 25% to 20%. By how many percentage points has it fallen, and by what percentage?
    a: By 5 percentage points, which is a fall of 20% in the share (5 ÷ 25 × 100).
  - q: A market's value grew by 10% but its volume by only 2%. What does that suggest?
    a: That average prices rose, by about 7.8% (1.10 ÷ 1.02), so most of the growth in value came from higher prices rather than more units sold.
  - q: Why must a market be defined before share is measured?
    a: Because the business's sales are divided by the market total. A narrow definition gives a larger share and a broad one a smaller share, for the same business.
  - q: (HL) Give three benefits of being the market leader.
    a: For example, economies of scale that lower unit costs, brand recognition and trust, bargaining power with retailers and suppliers, price leadership, and profits to fund investment.
  - q: (HL) Why might a business choose not to chase market share?
    a: Winning share often needs price cuts or heavy promotion that reduce profit and can start a price war; a premium or niche business may earn more with a smaller share; and a large share of a shrinking market may be worth little.

# Notes: 4.1 Introduction to marketing. Written in the platform's own words
# from the guide's four content statements (p. 31); the last, the importance of
# market share and market leadership, is HL only and sits in an HL section. The
# guide's formula list (pp. 64 to 65) has no market share or market growth
# formula, so the standard forms used across the site (src/lib/market.ts and
# the glossary) are given and labelled as such. The teacher support material's
# glossary (pp. 86 and 88) was read to check definitions; nothing from it is
# reproduced. No coursebook chapter for unit 4 was supplied. Kelda Oat Co.,
# Fieldmilk, Grainline and their market are fictional, and every figure was
# checked by script.
code: '4.1'
title: Introduction to marketing
level: SL/HL with HL-only content
introduction: |
  A business can make an excellent product and still fail, because too few people want it at the price, or because a rival reaches them first. **Marketing** is the work of understanding customers and meeting their wants better than competitors do, and this subtopic starts with the two questions behind every marketing decision: does the business begin with its customers or with its product, and how is it doing against its rivals?

  You will learn to tell market orientation from product orientation, and to calculate and interpret market share and market growth (AO2 and AO4), the kind of figures that suit Paper 2, whose questions are mostly quantitative. At HL you also judge why market share and market leadership matter, and when they matter less than they seem (AO3).
objectives:
  - '**Explain** what marketing is, what a market is, and why the way a market is defined changes every figure about it.'
  - '**Distinguish** between market orientation and product orientation, and **explain** when each suits a business.'
  - '**Calculate** market share and market growth, by value and by volume, from sales data.'
  - '**Analyse** what changes in market share and market growth show about a business and its rivals.'
  - '**Evaluate** the importance of market share and market leadership to a business (HL only).'
situation:
  title: Growing, or shrinking?
  fictional: true
  text: |
    Kelda Oat Co., a fictional business, makes a creamy oat drink that its founder, Ruth Okafor, first developed for the baristas in her own café. The recipe was hers alone: she tested it on espresso machines, not on shoppers, and baristas loved the way it foamed. Six years later Kelda sells through supermarkets as well as to cafés, and last year its sales rose by 10% to $16.5 million.

    Ruth wanted to celebrate. Then Tom, her new marketing manager, put a market report on the table. Chilled oat drinks had grown by 20% in value. Grainline, a rival that had asked shoppers what they wanted before launching three flavoured drinks, had overtaken Kelda. And Fieldmilk, the market leader, was cutting its prices to win more supermarket shelf space.

    "We are growing," said Ruth. "We are shrinking," said Tom. Which of them is right, and what should Kelda do about it?
sections:
  - id: what-marketing-is
    title: What marketing is, and what a market is
    kind: concept
    body: |
      **Marketing** is the process of finding out what customers want and meeting those wants in a way that achieves the organization's objectives, whether that means profit for a company or reaching more people for a charity. In everyday speech the word often means advertising, but advertising is only one part of it. Marketing covers researching customers and competitors (4.4), planning which customers to serve and how (4.2), and the whole marketing mix: the product, its price, how it is promoted and where it is sold, and for services the people, processes and physical evidence as well (4.5).

      Marketing is one of the four business functions, and the one that faces outwards. It brings information about customers into the business and carries the business's products and messages out to them. It also depends on the other three functions: operations must be able to make what marketing promises, finance must fund it, and human resources must supply the people who sell and serve. A campaign that promises next-day delivery which the warehouse cannot manage damages the brand it was meant to build.

      A **market** is all the buyers and sellers of a particular kind of good or service, whether they meet in a shop, at an auction or online. Its size is the total sales of every seller over a period, measured by **value** (revenue) or by **volume** (units sold). How a market is defined matters enormously: oat drinks, plant-based drinks and all milk drinks are three markets of very different sizes, and the same business has a different share of each. Every figure in this subtopic depends on that definition, so state it before you calculate.
    points:
      - term: Marketing
        text: Identifying what customers want and meeting those wants through the marketing mix, so that the organization reaches its objectives. Non-profit organizations market too, for example a charity marketing itself to donors, volunteers and the people it serves.
      - term: Market
        text: All the buyers and sellers of one kind of product. A market can be local, such as hairdressing in one town, national or global, and physical or online.
      - term: Consumer and business-to-business markets
        text: Consumer markets sell to individuals and households for their own use. Business-to-business (B2B) markets sell to organizations that use the product in their own work or resell it. B2B buyers are usually fewer, larger and more expert, so relationships and personal selling matter more.
      - term: Market size
        text: The total sales of all the sellers in a market over a period, by value or by volume. Every market share is calculated against it, so a share is only as reliable as the market total behind it.
      - term: Ethical marketing
        text: Marketing that is honest, fair and responsible, with truthful claims, no exploitation of vulnerable groups and no misleading environmental claims. One of the guide's conceptual understandings for unit 4 is that ethical marketing can enhance a business's brand image (p. 30).
    example:
      title: Kelda's two markets
      fictional: true
      text: |
        Kelda Oat Co. sells in two markets at once. To cafés it is a business-to-business supplier: baristas buy its oat drink by the case because it foams well in coffee. To shoppers it is a consumer brand, sold through supermarkets.

        Tom defines Kelda's main market as chilled oat drinks sold in shops and to cafés in its home country. On that definition the market was worth $84.0 million this year, or 46.0 million litres. Had he defined it as all plant-based drinks, the market would be several times larger and Kelda's share of it much smaller, although nothing about Kelda would have changed.
  - id: market-and-product-orientation
    title: Market orientation and product orientation
    kind: types
    body: |
      The guide contrasts two ways of running a business's marketing, which differ in where the business starts. A **product-oriented** business starts from the product: it concentrates on making the best product it can, or the product it is best at making, and then looks for customers who will buy it. Its confidence rests on quality, invention or technical skill, and research and development matters more to it than market research. A **market-oriented** business starts from the customer: it researches what customers want, designs and prices products to meet those wants, and keeps listening after launch, adapting the product as tastes change.

      Neither is right in general. Product orientation suits markets where customers cannot easily say what they want because the product is genuinely new, where technical excellence is what buyers pay for, or where the maker's skill is the point, as in specialist engineering, medical equipment and luxury craftsmanship. Its danger is a product that is excellent but unwanted, or priced beyond what customers will pay. Market orientation suits competitive consumer markets where tastes change quickly and buyers have many alternatives, such as food, fashion and mobile apps. Its dangers are the cost of research, products that differ little from rivals' because everyone asks customers the same questions, and missing the breakthrough that customers could not have imagined.

      Most successful businesses combine the two: they build on what they do well, and use research to decide which of their ideas to develop and how to present them. When a case asks about a business's orientation, look at the evidence: where its new products come from, how much it spends on market research compared with research and development, and how it responds when customers ask for something different.
    points:
      - term: Starting point
        text: '**Product orientation:** the product, and what the business can make well. **Market orientation:** the customer, and what the market wants.'
      - term: Role of market research
        text: '**Product orientation:** limited, and often used after the product exists, to find buyers for it. **Market orientation:** central, used before launch and continued after it.'
      - term: Where new products come from
        text: "**Product orientation:** research and development, engineers, designers or the founder's own vision. **Market orientation:** customers' stated needs, complaints, trends and sales data."
      - term: Main strength
        text: '**Product orientation:** distinctive, high-quality or breakthrough products that rivals find hard to copy. **Market orientation:** products that stay relevant to what customers want, so fewer launches fail.'
      - term: Main risk
        text: "**Product orientation:** making something too few people want, and missing changes in taste. **Market orientation:** research costs time and money, findings can be wrong, and following what customers already know can produce products that look like everyone else's."
      - term: 'Beyond the guide: other orientations'
        text: Management textbooks also describe a production orientation (making as much as possible as cheaply as possible), a sales orientation (pushing what has been made with heavy selling) and a societal orientation (meeting customers' wants while protecting society's long-term interests). The guide contrasts only market and product orientation, so treat the others as enrichment. Do not confuse product orientation with product development, a growth strategy in the Ansoff matrix.
    diagram: market-product-orientation
    example:
      title: Two ways to build an oat drink
      fictional: true
      text: |
        Ruth developed Kelda's recipe for one purpose: to foam and taste good in coffee. She tested it on espresso machines rather than on shoppers, and baristas loved it. That is product orientation, and it gave Kelda a product its rivals struggled to match.

        Grainline, a fictional rival, started from the other end. It surveyed supermarket shoppers, found that many wanted flavoured oat drinks with less sugar for breakfast, and launched vanilla, chocolate and unsweetened versions within a year. Grainline's sales rose by 35.7% in a year, while Kelda's rose by 10.0%. Neither approach is wrong in itself, but Kelda's product was built for cafés, while most of the market's growth was in supermarkets.
  - id: market-share
    title: Market share
    kind: method
    body: |
      **Market share** is one business's sales as a percentage of the total sales in its market over the same period. It is the clearest single measure of how a business is doing against its rivals. A business can watch its own sales rise every year, but only its share shows whether it is gaining ground or losing it.

      Share can be measured by **value**, using revenue, or by **volume**, using units sold, and the two often tell different stories. A premium brand that charges more than its rivals has a larger share by value than by volume; a budget brand has the reverse. Which measure matters depends on the question. Volume says more about production, capacity and how many customers a business reaches; value says more about revenue. Whichever you use, use the same measure, the same market and the same period for the business and for the market, and say which you used.

      The figures come mostly from secondary research (4.4): market analyses from research firms, figures published by industry associations, and retailers' sales data. A small business may only be able to estimate the size of its market, so its share is an estimate too. Treat a share as precise only when you know where the market total came from.
    formulas:
      - name: Market share
        expression: Market share = the business's sales ÷ total market sales × 100
        note: By value (revenue) or by volume (units), with the same measure, market and period for both figures. The guide's formula list (pp. 64 to 65) does not include it; this is the standard form used across the site.
    diagram: market-share-growth
    example:
      title: Kelda's share, measured two ways
      fictional: true
      text: |
        The chilled oat drink market was worth $84.0 million this year (46.0 million litres), up from $70.0 million (40.0 million litres) last year.

        - **Kelda by value, this year:** $16.5m ÷ $84.0m × 100 = **19.6%**. Last year: $15.0m ÷ $70.0m × 100 = 21.4%.
        - **Kelda by volume, this year:** 5.5m litres ÷ 46.0m litres × 100 = **12.0%**. Last year: 5.0 ÷ 40.0 × 100 = 12.5%.
        - **Fieldmilk, the leader, this year:** $31.5m ÷ $84.0m × 100 = 37.5% by value, and 20.0 ÷ 46.0 × 100 = 43.5% by volume.

        Kelda's share by value is about 1.6 times its share by volume, because its price of $3.00 a litre is about 1.6 times the market's average price of $84.0m ÷ 46.0m litres = $1.83. Fieldmilk, cheaper than average, shows the opposite pattern. On both measures Kelda's share fell, even though it sold more.
  - id: market-growth
    title: Market growth
    kind: method
    body: |
      **Market growth** is the percentage change in the total sales of a market from one period to the next. Like share, it can be measured by value or by volume, and comparing the two is revealing. If a market's value grows faster than its volume, average prices have risen, because of inflation or because customers are buying dearer products; if volume grows faster, prices have fallen. A market that grows in value but not in volume is not selling any more units.

      Growth changes how a business can grow. In a fast-growing market a business can increase its sales without taking a single customer from its rivals, and new entrants are drawn in by the opportunity. In a mature market that has stopped growing, a business grows mainly by winning customers from rivals, which usually means fiercer competition on price and promotion. A shrinking market is a warning to every seller in it. These stages mirror the product life cycle (4.5), and market growth is one of the two axes of the BCG matrix.

      The same formula gives one business's own sales growth, and comparing the two is what links growth to share. A business whose sales grow more slowly than its market loses share; one whose sales grow faster gains it.
    formulas:
      - name: Market growth
        expression: Market growth = (sales this period − sales last period) ÷ sales last period × 100
        note: Using the total sales of the market, by value or by volume. With one business's own sales, the same formula gives its sales growth. Not on the guide's formula list; the standard form used across the site.
    example:
      title: How fast did the oat drink market grow?
      fictional: true
      text: |
        - **By value:** ($84.0m − $70.0m) ÷ $70.0m × 100 = **20.0%**.
        - **By volume:** (46.0m − 40.0m) ÷ 40.0m × 100 = **15.0%** more litres.
        - **Average price:** $70.0m ÷ 40.0m litres = $1.750 a litre last year, and $84.0m ÷ 46.0m litres = $1.826 this year, a rise of 4.3%. Part of the market's growth in value came from higher prices, not from more drinking.
        - **Kelda's own sales growth:** ($16.5m − $15.0m) ÷ $15.0m × 100 = **10.0%**, by value and by volume alike.

        Kelda grew at half the market's rate by value and two-thirds of its rate by volume, which is why its share fell on both measures.
  - id: reading-share-and-growth
    title: Reading share and growth together
    kind: application
    body: |
      The guide sets market share and market growth at AO2 and AO4: you need to calculate them, and then explain what they mean for the business in the case. A calculation on its own earns little. The figures become useful when they are compared: with the business's own past, with its rivals and with the market as a whole.

      Four patterns cover most cases. If a business's sales grow faster than its market, its share rises: it is winning customers from rivals or reaching new ones first. If its sales grow more slowly than the market, its share falls even as it sells more, which is Kelda's position. If its sales fall, but more slowly than a shrinking market, its share rises: it is holding on better than its rivals, although its revenue is still falling. If its sales fall faster than the market, it is losing on every measure.

      Two cautions apply. Market share measures position, not performance: a business can gain share by cutting prices so far that it loses money, and lose share while its profit rises because it chose not to chase low-margin sales. And the shares of every seller in a market add up to 100%, so in a market that is not growing, one seller's gain is another's loss. Practise in the [Market Studio's workspace](/market-studio/#ix-market-share-porto), where you change two years of sales in a fictional market and watch every share, and the growth of the market, recalculate.
    points:
      - term: Percentage points and per cent
        text: A change in share is measured in **percentage points**. If a share falls from 20% to 18%, it has fallen by 2 percentage points, but by 10% of its previous size. Kelda's share by value fell by 1.8 percentage points. Say which kind of change you mean.
      - term: Standing still
        text: To keep its share, a business must grow exactly as fast as its market. Kelda would have needed sales of ($15.0m ÷ $70.0m) × $84.0m = $18.0m this year just to hold its share; it sold $16.5m.
      - term: Sales up, share down
        text: The commonest misreading in a case. Rising sales prove only that the business sold more, not that it is doing well against its rivals.
      - term: Share, growth and the BCG matrix
        text: The BCG matrix (toolkit) places each of a business's products by the growth of its market and by its **relative market share**, its share divided by the share of its largest rival. A product with a high relative share of a fast-growing market is a star; with a high share of a slow-growing market, a cash cow. Subtopic 4.5 uses it to manage a product portfolio.
      - term: Where the figures come from
        text: Shares depend on how the market is defined, on whether value or volume is used, and on the data behind the market total. In a case, use the figures given; when comparing sources, check that they measure the same thing.
    diagram: bcg-matrix
    example:
      title: Ruth or Tom?
      fictional: true
      text: |
        Both are right, about different things. Ruth is right that Kelda sold 10.0% more. Tom is right that Kelda lost ground: its share by value fell by 1.8 percentage points to 19.6%, Grainline overtook it, and to hold its share it would have needed sales of $18.0m, $1.5m more than it achieved.

        The figures do not say what Kelda should do. A business that values its premium position may accept a smaller share of a market increasingly driven by cheaper, flavoured drinks; one that wants to grow cannot ignore a market expanding twice as fast as it is. That judgement depends on Kelda's objectives, which is where the HL question of why share matters begins.
  - id: importance-of-share-and-leadership
    title: The importance of market share and market leadership
    kind: evaluation
    level: HL
    body: |
      The **market leader** is the business or brand with the largest share of a market. Leadership can be measured by value or by volume, and the two can disagree, so say which is meant. The guide asks HL students to evaluate why share and leadership matter (AO3), which means weighing the benefits against the costs for a particular business, not listing them.

      Share matters because its advantages feed one another. A large share means large volumes, and large volumes bring economies of scale (1.5), so the leader's cost per unit is lower than its rivals'. It can use that gap to undercut them or to earn a higher margin at the same price, and the extra profit pays for the promotion, research and investment that defend its share. Recognition works the same way: the best-known brand gets the best shelf positions, which make it better known still. In some markets, especially online platforms, each new user makes the service more valuable to the others, so share builds on itself. The lists below set out these benefits, and the costs, one by one.

      How much share matters depends on whether that chain is strong in the market in question. It is strongest where fixed costs are high and scale lowers unit costs sharply, as in bottling, telecommunications or car making; where retailers ration shelf space to a few brands; and where customers choose the safest, best-known option. It is weakest in fragmented, local or personal markets, such as hairdressing or bespoke furniture, where scale brings few savings and a small share of loyal customers can be very profitable. The business's own strategy matters too: a business competing on low cost needs share, while one competing on quality or distinctiveness may be harmed by chasing it. So does its strength: fighting a leader for share takes deep pockets, and in a shrinking market even a rising share may not be worth the cost of winning it.
    points:
      - term: Market leader
        text: The business or brand with the largest share of a market, by value or by volume. A business can lead a segment, such as oat drinks for cafés, without leading the market as a whole.
      - term: Price leader
        text: A business whose price changes rivals tend to follow, often the market leader. When it cuts its price, rivals must choose between matching the cut and losing margin, or holding their price and risking the loss of customers.
      - term: Leading a segment
        text: Leadership of a clearly defined segment or niche can bring many of the same advantages, such as recognition, loyalty and bargaining power within that segment, without the cost of leading the whole market.
      - term: "Porter's generic strategies (toolkit)"
        text: An HL toolkit tool that explains why share matters more to some businesses than others. A cost leader needs large volumes to keep its costs the lowest, so share is central to its strategy; a differentiator, or a business focused on a narrow segment, competes on what makes it different and can prosper with a modest share.
    advantages:
      - Economies of scale lower costs per unit, which allow lower prices or higher margins.
      - Brand recognition and trust make customers more willing to buy, and new products easier to launch.
      - Bargaining power with retailers, for shelf space and listings, and with suppliers, for lower prices.
      - Price leadership, so rivals react to the leader's prices rather than the other way round.
      - Higher profits and cash flow fund the research, promotion and investment that defend the lead.
      - In network markets, a large base of users attracts more users and deters new entrants.
    limitations:
      - Winning share through price cuts or promotion can reduce profit, and invite a price war.
      - Defending a lead is expensive, and leaders can become complacent and slow to change.
      - Dominant firms face scrutiny from competition authorities, which may restrict how they price or grow.
      - Share says nothing about profit, and a premium or niche business can earn more with less of it.
      - A large share of a shrinking or narrowly defined market may be worth little.
      - Share depends on how the market is defined and measured, so claims of leadership can be selective.
    example:
      title: Should Kelda chase the leader?
      fictional: true
      text: |
        Fieldmilk leads chilled oat drinks with 43.5% of the volume and 37.5% of the value. Its scale gives it the lowest cost per litre and the best supermarket shelf positions, and its price cuts this year are designed to keep them. Kelda cannot win a contest on cost: it sells little more than a quarter of Fieldmilk's volume, and its recipe costs more to make.

        But Kelda may already lead a segment. Tom believes it sells more to cafés than any rival, and there its foam is what buyers pay for. For Kelda, the shares that matter most may be its share of the café segment and its share by value, not its share of supermarket litres. A strong HL answer weighs that segment leadership, with its loyalty and premium price, against the risk of being squeezed out of supermarkets as the market grows.
applications:
  - industry: Technology
    text: Many technology firms are product-oriented at launch, because customers cannot ask for a technology they have never seen; research then refines what engineers invented. Share can matter enormously where products depend on networks, such as payment and messaging apps, because each new user makes the service more valuable to the rest, so firms may accept years of losses to win share. Growth in such markets can be very fast and then slow abruptly once most potential users have joined.
  - industry: Packaged food and drink
    text: Strongly market-oriented. Tastes change quickly, research is continuous, and new flavours and pack sizes follow consumer data. Share is tracked closely, by value and by volume, from retailers' sales data, and supermarkets give their shelf space to leaders and fast-growing brands, which makes share and growth reinforce each other.
  - industry: Pharmaceuticals
    text: Research and development drives new medicines, so the industry looks product-oriented, yet each project starts from an unmet medical need, a form of market orientation. A patented medicine can hold a very high share of its narrow market until its patent expires and cheaper copies arrive, when its share can fall sharply.
  - industry: Luxury fashion
    text: Often product-oriented, because the designer's vision and the craft are the product and asking customers what they want can dilute the brand. Share by value is far larger than share by volume, and luxury houses may deliberately limit volume to protect exclusivity, so a rising share of units could even signal a weakening brand.
  - industry: Social enterprise
    text: A social enterprise markets to the people it serves, to the customers who buy its products and to its funders. Market share is rarely an objective in itself; what matters is how much of the need it meets. Growth also reads differently. A growing market for fair trade or recycled goods widens its opportunity, but a growing need, such as more families needing help, measures the problem, not success.
stakeholders:
  - group: Customers
    text: Gain from market orientation, which gives them products that fit their wants, and from product orientation's breakthroughs. Competition for share, including price cuts, usually benefits them in the short run, but a leader with a very large share may later use its power to raise prices or narrow their choice.
  - group: Employees
    text: A growing share in a growing market brings job security and promotion. A shift from product to market orientation can unsettle the engineers or craftspeople whose expertise used to set the direction, and a fight for share on price often brings cost cutting that falls on staff.
  - group: Owners and shareholders
    text: Watch share as a sign of future revenue and of the business's strength against its rivals. They may disagree with managers about how much profit to give up for share, because buying share can reduce dividends for years before it pays off, if it ever does.
  - group: Competitors
    text: In a mature market one seller's gain in share is another's loss, so a rival's campaign forces a response. A leader's price cut squeezes smaller firms' margins, which is why challengers often avoid fighting on price and look for a segment of their own.
  - group: Retailers and suppliers
    text: Retailers favour leaders and fast-growing brands with shelf space, but they resist depending on one dominant supplier and promote their own labels against it. Suppliers win volume from a leader but face its bargaining power, which can squeeze their margins.
evaluation:
  - Market and product orientation are the two ends of a range, not a strict choice. The question in a case is whether the balance suits the market. Product orientation is a strength where customers cannot imagine what is possible, and a weakness where tastes are shifting and rivals are listening more closely.
  - "Every share depends on how the market is defined. A narrow definition flatters a business and a broad one humbles it, so a claim of market leadership deserves two questions: leader of what, and measured how?"
  - Value and volume answer different questions. Growth in value can come from inflation rather than more customers, and a premium seller's share by value overstates how many customers it reaches. Use both when the data allow.
  - Share and growth describe position, not profit or cash. A business can gain share and lose money, or lose share while its profit rises, so judge them alongside profit margins and the business's objectives (1.3).
  - Market data are often estimates, built from secondary research or from a sample of retailers. A difference in share of half a percentage point may be within the error of the data, so do not build a conclusion on it alone.
  - At HL, the importance of share and leadership depends on the industry and the strategy. Where economies of scale, network effects and retailers' power are strong, share comes close to essential; in fragmented, local or premium markets, a business can thrive with a small share of the right customers.
decision:
  title: Kelda's response to a falling share
  fictional: true
  brief: |
    Kelda Oat Co., a fictional business, has seen its share of chilled oat drinks by value fall from 21.4% to 19.6% in a year, while its sales rose by 10.0% to $16.5 million. Fieldmilk, the market leader, is cutting its supermarket prices, and Grainline's flavoured range is growing fast.

    Kelda sells 5.5 million litres a year at $3.00 a litre. Each litre costs $1.80 in ingredients, packaging and delivery, so its contribution is $1.20 a litre, or $6.6 million in total. Its factory can make about 7.0 million litres a year without new equipment. Ruth and Tom must agree a response at next month's board meeting.
  options:
    - label: Cut the price to win back share
      text: Lower the supermarket price by 15%, to $2.55 a litre, to win back shoppers from Fieldmilk and Grainline.
    - label: Stay premium and develop the range
      text: Keep the price, and spend $400,000 on research and two new products built on the foam baristas value, a barista range for home coffee machines and a version with less sugar.
    - label: Launch a cheaper second brand
      text: Keep Kelda premium for cafés, and launch a cheaper brand for supermarkets, made with the factory's spare capacity.
  guidance: |
    Start with the objective. If Kelda wants share for its own sake, option A is the obvious route, but the arithmetic is unforgiving. At $2.55 the contribution per litre falls from $1.20 to $0.75, so to keep its total contribution of $6.6 million Kelda would need to sell 6.6 ÷ 0.75 = 8.8 million litres, 60% more than now, in a market that grew by 15% in volume last year. That is more than the factory can make without investment, and Fieldmilk, with lower costs, can afford to cut further. A price war against the leader is a contest Kelda is likely to lose.

    Option B accepts a falling share by volume in exchange for protecting the margin and the brand: a market-oriented use of a product-oriented strength. Its success depends on research showing that people who make coffee at home, and shoppers watching their sugar, will pay a premium; without that evidence it is a gamble. Option C uses the factory's 1.5 million litres of spare capacity and could win share in the fastest-growing part of the market, but a cheaper brand may take sales from Kelda itself, could confuse customers, and would put Kelda in a direct contest with Fieldmilk on price.

    A strong answer recommends one option on the evidence, perhaps B, supported by research before the money is spent, and says what would change the judgement: research showing that shoppers are highly sensitive to price, for example, or Fieldmilk's cuts beginning to take Kelda's café customers. At HL, price elasticity of demand (4.5) and Porter's generic strategies sharpen the argument: Kelda is a differentiator, and a differentiator that competes on price gives up its advantage.
exam:
  - q: Define the term *market orientation*.
    marks: 2
    command: define
    paper: '1'
    answer: |
      A precise definition in one or two sentences: an approach in which a business starts from research into what customers want, and then designs, prices and sells products to meet those wants.

      A full answer makes clear that the customer comes first and that research drives the product. "Listening to customers" on its own is incomplete, and an example without a definition does not answer the question.
  - q: |
      The chilled oat drink market was worth $70.0 million last year and $84.0 million this year. Kelda Oat's sales were $15.0 million last year and $16.5 million this year.

      Calculate (i) the market growth by value, and (ii) Kelda's market share by value this year. Show all your working.
    marks: 4
    command: calculate
    paper: '2'
    answer: |
      - (i) Market growth = ($84.0m − $70.0m) ÷ $70.0m × 100 = $14.0m ÷ $70.0m × 100 = **20.0%**.
      - (ii) Market share = $16.5m ÷ $84.0m × 100 = **19.6%**.

      Show the formula, the substitution and the answer with its unit for each part, so that a slip in the arithmetic does not cost the method. A common error is to divide by this year's market in the growth formula, which gives 16.7%.
  - q: Using the figures in question 2, explain why Kelda's market share fell even though its sales rose by 10.0%.
    marks: 4
    command: explain
    paper: '2'
    answer: |
      A strong answer links the two growth rates to the share formula:

      - Market share is Kelda's sales divided by the market's sales, so it rises only if Kelda's sales grow faster than the market's.
      - Kelda's sales grew by 10.0% while the market grew by 20.0%, so the market total that Kelda's sales are divided by grew faster than Kelda's sales, and the share fell from 21.4% to 19.6%.
      - Rivals took most of the market's growth: Grainline's sales rose by 35.7%, enough to overtake Kelda.
      - It may add that the figures say nothing yet about profit: Kelda may have chosen not to chase lower-priced supermarket sales.
  - q: Distinguish between product orientation and market orientation, with reference to Kelda Oat and Grainline.
    marks: 4
    command: distinguish
    paper: '1'
    answer: |
      A strong answer defines both and makes the difference explicit, applied to the two businesses:

      - Product orientation starts from the product and what the business does well, then looks for buyers: Ruth developed Kelda's recipe for coffee and tested it on espresso machines, not on shoppers.
      - Market orientation starts from research into what customers want: Grainline surveyed shoppers and launched the flavoured, lower-sugar drinks they asked for.
      - The difference lies in the starting point and the role of research, with a consequence of each, such as Kelda's distinctive product and Grainline's faster growth in supermarkets.

      Two separate definitions with no comparison, or with no reference to the businesses, do not do what the command term asks.
  - q: |
      Kelda is considering cutting its supermarket price by 15%, from $3.00 to $2.55 a litre, to win back market share. Each litre costs $1.80 to make and deliver, Kelda sells 5.5 million litres a year, and its factory can make about 7.0 million litres a year.

      Recommend whether Kelda should cut its price.
    marks: 10
    command: recommend
    paper: '2'
    answer: |
      This question also draws on 4.5, where pricing methods are set at AO3. An extended response: build the argument on both sides and reach a justified recommendation.

      - **Use the figures.** Contribution per litre falls from $1.20 to $0.75. Keeping total contribution at $6.6 million would need 8.8 million litres, a 60% rise in volume, against market growth of 15.0% by volume and a factory limit of about 7.0 million litres.
      - **For the cut:** it could win back price-sensitive supermarket shoppers, slow the loss of share in the fastest-growing channel and use spare capacity.
      - **Against the cut:** it reduces the contribution on every litre already sold; Fieldmilk, with lower costs, can cut further and start a price war; a lower price may damage Kelda's premium image with cafés; and share bought this way may never pay for itself.
      - **Alternatives:** compare it with staying premium and developing new products, or with a second brand, and say what evidence is needed, such as research into how shoppers respond to price (4.4).
      - **Judgement:** for example, recommend against a general price cut, because the volume it needs is out of reach and Kelda's advantage is its difference, not its cost; perhaps test a short promotion in a few stores first. Say what would change the recommendation.

      An answer that only lists advantages and disadvantages, without using the figures or reaching a recommendation, does not do what the command term asks.
  - q: Evaluate the importance of market share and market leadership to Kelda Oat.
    marks: 10
    command: evaluate
    level: HL
    paper: '2'
    answer: |
      A strong answer defines market share and market leadership, then weighs them for Kelda in particular:

      - **Why share matters:** economies of scale lower the cost of each litre; recognition and supermarket shelf space follow share; Fieldmilk's leadership gives it bargaining power and prices that Kelda must react to; and losing share in the fastest-growing channel could leave Kelda squeezed as the market grows.
      - **Why it may matter less for Kelda:** Kelda is a premium, differentiated brand; its share by value (19.6%) is much higher than its share by volume (12.0%); it may lead the café segment; and chasing share by cutting price could destroy its margin.
      - **What it depends on:** Kelda's objectives (growth, or profit and reputation), how large the economies of scale in oat drinks are, how sensitive supermarket shoppers are to price, and whether Fieldmilk's cuts reach the café trade.
      - **Conclusion:** for example, that Kelda's share of the café segment and its share by value matter more than overall leadership, which it cannot realistically win; but that it cannot ignore a falling share in a market growing twice as fast as it is.

      Porter's generic strategies or the BCG matrix can strengthen the argument when they are applied to Kelda, not just named.
summary:
  - Marketing finds out what customers want and meets those wants; a market is all the buyers and sellers of one kind of product, measured by value or by volume.
  - Product orientation starts from what the business makes best; market orientation starts from research into customers. Most businesses blend the two.
  - Market share = the business's sales ÷ total market sales × 100, with the same measure, market and period for both figures.
  - Market growth = (sales this period − sales last period) ÷ sales last period × 100; compare growth by value and by volume to see how much came from prices.
  - A business whose sales grow more slowly than its market loses share, even while its sales rise.
  - A change in share is measured in percentage points. A fall from 20% to 18% is 2 points, but 10% of the share.
  - Share shows position, not profit, so always ask "share of what, measured how?"
  - At HL, leadership brings scale, recognition, bargaining power and price leadership, but winning and defending share can cost more than it earns.

retrieval:
  - q: What does the payback period measure, and what does the usual method assume?
    a: How long a project takes for its net cash flows to add up to its capital cost. Working out the months assumes that each year's cash arrives evenly through the year.
  - q: A $60,000 machine returns $20,000, $25,000 and $30,000 in years 1 to 3. What is its payback period?
    a: After two years $15,000 is still to recover. 15,000 ÷ 30,000 × 12 = 6 months, so payback is 2 years and 6 months.
  - q: A $50,000 project has total returns of $70,000 over four years. What is its ARR?
    a: (70,000 − 50,000) ÷ 4 = $5,000 a year; 5,000 ÷ 50,000 × 100 = 10%.
  - q: Give two limitations of payback and one of ARR.
    a: Payback ignores the returns after payback and the time value of money, so it says nothing about profitability. ARR ignores when the returns arrive, and relies on forecasts for every year of the project's life.
  - q: Why might a business choose the project with the shorter payback, even though its ARR is lower?
    a: For example because it is short of cash, its market or technology changes quickly, or its owners are cautious, so getting the money back quickly matters more than the highest average return.
  - q: HL only. Why is the original cost not discounted in an NPV calculation?
    a: It is paid at the start, so it is already in today's money. Only the future returns are discounted.
  - q: HL only. What does a negative NPV at a 10% discount rate tell a business?
    a: The present value of the returns is less than the cost, so the project earns less than 10% a year and, on financial grounds, should be rejected at that rate.
  - q: Name four qualitative factors in an investment decision.
    a: For example fit with the business's objectives, the effect on employees, ethical and environmental effects, the brand, the reliability of the forecasts, the availability of finance and competitors' reactions.

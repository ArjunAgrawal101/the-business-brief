retrieval:
  - q: What did Taylor assume motivates workers, and which method of payment did he recommend?
    a: Money. He assumed workers want to earn as much as they can and will otherwise do as little as possible, so he recommended piece rates, which pay for each unit produced.
  - q: Name Maslow's five levels of need, starting from the bottom.
    a: Physiological, safety, social (love and belonging), esteem and self-actualization.
  - q: According to Herzberg, why might a pay rise stop complaints without increasing effort?
    a: Pay is a hygiene factor. Improving it removes dissatisfaction but does not motivate; motivation comes from motivators in the job itself, such as achievement, recognition and responsibility.
  - q: What is the difference between job enrichment and job enlargement?
    a: Job enrichment adds responsibility and more challenging tasks. Job enlargement adds more tasks at the same level, so the job has more variety but no more responsibility.
  - q: What is the difference between commission and profit-related pay?
    a: Commission is a percentage of the value of the sales an individual makes. Profit-related pay is a share of the whole organization's profit, so it depends on how well the business does, not on one person's results.
  - q: Distinguish between on-the-job and off-the-job training.
    a: On-the-job training happens while doing the job in the normal workplace, for example working beside an experienced colleague. Off-the-job training happens away from normal work, for example on a course or at a college.
  - q: What is induction, and why does it matter?
    a: Training that introduces new employees to the organization, its people, rules and procedures and their job. It helps them become productive sooner and makes them less likely to leave in their first months.
  - q: (HL) Name McClelland's three acquired needs and Deci and Ryan's three basic needs.
    a: 'McClelland: achievement, affiliation and power. Deci and Ryan: autonomy, competence and relatedness.'
  - q: (HL) Using expectancy theory, explain why a large bonus might fail to motivate.
    a: Motivation depends on expectancy × instrumentality × valence. If staff think the target cannot be reached, doubt that the bonus will be paid, or do not value it, one of the three is close to zero, and so is motivation.
  - q: (HL) A firm employed 120 people at the start of the year and 140 at the end, and 26 left during the year. Calculate labour turnover.
    a: Average number of employees = (120 + 140) ÷ 2 = 130. Labour turnover = (26 ÷ 130) × 100 = 20%.
  - q: (HL) Give one advantage and one disadvantage of internal recruitment.
    a: 'Advantage: for example it is quicker and cheaper, the candidate is known, and promotion motivates other staff. Disadvantage: for example the pool is small, no new ideas come in, colleagues passed over may resent it, and it leaves another vacancy.'
  - q: (HL) What is 360-degree feedback?
    a: Appraisal that gathers feedback on an employee from people all around them at work, such as their manager, colleagues, the people they manage and sometimes customers, often with their own self-assessment.

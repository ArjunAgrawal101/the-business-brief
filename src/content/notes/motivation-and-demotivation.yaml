# Notes: 2.4 Motivation and demotivation. Written in the platform's own words
# from the guide's nine content statements (pp. 26 to 27). HL only, and placed
# in HL sections: the theories of McClelland, Deci and Ryan, equity and
# expectancy; labour turnover; the types of appraisal; methods of recruitment;
# internal and external recruitment. The theories are explained from subject
# knowledge and attributed to their originators. The guide's list of formulae
# (pp. 64 to 65) has no labour turnover formula, so the standard form is used,
# as in data/calculations.yaml. The guide's Paper 3 overview (p. 42) and the
# teacher support material's description of Paper 3 (p. 65) support the link to
# human needs. The teacher support material's glossary (pp. 80 to 90) was read
# to check definitions; nothing from it is reproduced. Every business named is
# fictional.
#
# The opening situation, industries, stakeholders, decision, exam-style
# practice and revision summary were added on 3 November 2026. The two HL

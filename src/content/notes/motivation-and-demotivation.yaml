code: '2.4'
title: Motivation and demotivation
level: SL/HL with HL-only content
introduction: |
  A business can buy machines and buildings, but it cannot buy effort. Two employees on the same pay, doing the same job, can differ enormously in how hard and how carefully they work and in how long they stay. **Motivation** is what makes the difference, and **demotivation**, its loss, shows up as absence, mistakes, complaints and resignations.

  This subtopic gives you the main theories of what drives people at work, starting with Taylor, Maslow and Herzberg, and the practical tools a business can use: financial rewards, non-financial rewards and training. At HL you add four further theories, the measurement of labour turnover, appraisal and recruitment. Examination questions rarely ask you to recite a theory. They ask you to use one to explain what is happening in a case, and to judge how well it fits.
objectives:
  - '**Evaluate** the motivation theories of Taylor, Maslow and Herzberg, and **apply** them to a workplace.'
  - '**Explain** the financial and non-financial rewards in the guide, and when each is likely to motivate.'
  - '**Distinguish** between induction, on-the-job and off-the-job training.'
  - '**Evaluate** McClelland''s acquired needs theory, Deci and Ryan''s self-determination theory, and equity and expectancy theory (HL only).'
  - '**Explain** the types of appraisal and the methods of recruitment, and **evaluate** internal against external recruitment (HL only).'
  - '**Calculate** labour turnover and **comment** on what the figure shows (HL only).'
situation:
  title: A pay rise that changed nothing
  fictional: true
  text: |
    Ines Haworth runs the customer service centre of Thornvale Energy, a fictional regional energy supplier. Its 60 or so advisers answer calls from a script, are timed on every call and are ranked each week on a screen above the office floor. Last year, after complaints about pay, the company raised advisers' wages by 8%.

    The complaints about pay stopped. Nothing else improved: absence is still high, customers' satisfaction scores are falling, and experienced advisers keep leaving for a rival that lets its staff solve problems in their own way.

    The finance director proposes a bonus for the advisers with the shortest calls. A team leader suggests letting advisers settle refunds of up to $100 without asking a manager, and training them to handle the hardest cases. Ines has the budget for one change this year.

    *Why did the pay rise fail, what really drives people at work, and which rewards would make Ines's advisers want to do their best?*
sections:
  - id: what-motivation-is
    title: Motivation and demotivation
    kind: concept
    body: |
      **Motivation** is the drive that makes a person put effort into reaching a goal. At work it shows in how hard, how carefully and how long someone works, and in whether they do more than the minimum. It is not the same as job satisfaction: a contented employee is not necessarily a hard-working one.

      Motivation matters because labour is one of the largest costs of most businesses, and its people are the source of most of its quality, service and ideas. A motivated workforce raises productivity and quality and makes change easier to carry through. A demotivated one costs money in ways that rarely appear under a single heading.

      **Demotivation** is the loss of that drive. It is seldom announced, but it shows in the evidence:

      - More absence and lateness.
      - Falling output and quality, and more complaints from customers.
      - Fewer ideas, less cooperation, and more grievances and disputes.
      - More employees leaving, which raises the costs of recruitment and training.

      Common causes are pay that feels unfair, poor management, dull or repetitive work, a lack of recognition, job insecurity, poor working conditions and changes imposed without consultation. The theories that follow try to explain both sides: what drives people, and what switches the drive off.
    points:
      - term: Intrinsic motivation
        text: Comes from the work itself, because it is interesting, challenging or meaningful. It tends to last, and it supports creativity and quality.
      - term: Extrinsic motivation
        text: Comes from outside the work, from rewards such as pay, bonuses, praise and promotion, or from the wish to avoid a penalty. It can change behaviour quickly, but its effect may fade once the reward is received or taken for granted.
      - term: Both at once
        text: Most people respond to a mix of the two. Financial rewards work mainly on extrinsic motivation, while most non-financial rewards aim at intrinsic motivation. The theories disagree about which matters more.
    example:
      title: Same pay, different results
      fictional: true
      text: Hollin Bakery, a fictional business, had a loyal team of twelve bakers who designed the seasonal range themselves. A new owner introduced fixed recipes, timed breaks and a camera above the ovens. Pay did not change. Within six months absence had more than doubled, two of the most experienced bakers had left and customers were complaining about quality. Nothing financial had been taken away; something else had.
  - id: taylor
    title: 'Taylor: scientific management'
    kind: theory
    body: |
      Frederick Winslow Taylor (1856 to 1915), an American engineer, set out his ideas in *The Principles of Scientific Management* (1911). He believed that most work was done inefficiently, by habit and rule of thumb, and that managers could find the **one best way** to do any job by studying it scientifically.

      His method had five parts, the first four of which appear in the diagram:

      1. Observe the task and time each part of it, the practice that became known as time-and-motion study.
      2. Find the most efficient method, and the output a trained worker should reach with it.
      3. Select workers suited to the job and train them in the method.
      4. Pay by output through a **piece rate**, so that more work earns more money. Taylor's own scheme paid a higher rate per piece to workers who reached the standard.
      5. Separate planning from doing: managers design and control the work, and workers carry it out.

      Behind the method lies a view of people. Taylor assumed that workers are motivated mainly by money and that, left to themselves, they deliberately work slowly, a habit he called soldiering. Tie pay to output, he argued, and they will work hard, so he saw financial reward, not the work itself, as the motivator. He also argued that higher output would benefit both sides, with higher wages for workers and lower costs for employers.
    diagram: taylor-scientific-management
    advantages:
      - It raised productivity sharply in factories, and its ideas underpin mass production.
      - Standard methods make output, costs and quality predictable.
      - Clear targets with pay linked to output suit simple tasks whose output can be counted.
      - Workers can be trained quickly for simple, specialized tasks.
    limitations:
      - It treats people as motivated only by money and ignores their social and psychological needs.
      - Repetitive, closely controlled work is dull and deskilling, which can cause absence, resignations and conflict.
      - Piece rates can push speed at the expense of quality and safety.
      - Workers' ideas are wasted, because they are never asked how the job could be done better.
      - It is hard to apply to service, creative or knowledge work, where output cannot simply be counted.
    example:
      title: Scientific management with scanners
      fictional: true
      text: Strandline Parcels, a fictional warehouse operator, gives each picker a handheld scanner that sets the route, times every pick against a standard and shows a live ranking, with a bonus for beating the target. Output per hour rose by a tenth in three months. So did picking errors and resignations, and the pickers' ideas for a better layout went unheard because no one asked for them. This is Taylor's method with modern tools, often called digital Taylorism.
  - id: maslow
    title: 'Maslow: the hierarchy of needs'
    kind: theory
    body: |
      Abraham Maslow (1908 to 1970), an American psychologist, argued in 1943 that people have five levels of need, arranged in a hierarchy. A person is driven mainly by the lowest need that is not yet met. Once it is broadly satisfied, the next level up becomes the motivator, and a need that is satisfied no longer motivates. The top level, self-actualization, is never fully met, so it can go on motivating.

      For managers, the message is that employees are motivated by different things, depending on which needs their job and their life already meet. Pay and security matter most when they are in doubt. Once they are secure, belonging, recognition, responsibility and challenge matter more, so a business that offers only money will reach a limit.
    diagram: maslow-hierarchy
    points:
      - term: Physiological needs
        text: Food, water, warmth and shelter. At work, pay that is enough to live on, rest breaks, drinking water and a warm, dry place to work.
      - term: Safety needs
        text: Security and freedom from danger. At work, a secure contract, safe working conditions, sick pay and a pension.
      - term: Social needs
        text: Love, friendship and belonging. At work, teamwork, friendly colleagues and a sense of being part of the group.
      - term: Esteem needs
        text: Self-respect and the respect of others. At work, recognition, praise, status, responsibility and promotion.
      - term: Self-actualization
        text: Reaching one's full potential. At work, challenging and creative work and the chance to grow, which looks different for every person.
    advantages:
      - It is simple and intuitive, and reminds managers that people want more from work than money.
      - It explains why the same reward motivates one employee and not another.
      - It suggests a range of non-financial rewards for employees whose basic needs are already met.
    limitations:
      - People do not always move up the levels in order. Some put esteem or creative work before security, and needs at several levels can act at once.
      - Needs are hard to observe or measure, so a manager cannot easily tell which level an employee has reached.
      - Later research has found little support for a fixed order. Maslow himself said the order is not rigid, and the familiar pyramid, used in the diagram above, was drawn by later writers rather than by Maslow.
      - The order reflects an individualistic, Western view. In cultures that value the group, social needs or security may rank above personal esteem.
      - Self-actualization is vague, which makes it hard to act on.
    example:
      title: One offer, two reactions
      fictional: true
      text: Pennick Logistics, a fictional firm, invites its warehouse staff to lead a weekly improvement group, without extra pay. Tomas, who joined last month on a temporary contract and is worried about his rent, shows no interest; what would motivate him is a permanent contract and overtime, which meet his physiological and safety needs. Ana, a team leader with ten secure years behind her, jumps at it, because the recognition and the chance to shape the work meet her esteem needs and her wish to grow.
  - id: herzberg
    title: 'Herzberg: motivation-hygiene theory'
    kind: theory
    body: |
      Frederick Herzberg (1923 to 2000), an American psychologist, interviewed around 200 engineers and accountants in Pittsburgh in the 1950s. He asked them to describe times when they had felt exceptionally good, and exceptionally bad, about their jobs, and found that the causes of the good times were different from the causes of the bad. He published the results, with two colleagues, in *The Motivation to Work* (1959).

      His conclusion is that satisfaction and dissatisfaction are not two ends of one scale but two separate scales, which is why the theory is also called two-factor theory:

      - **Hygiene factors** surround the job. When they are poor they cause dissatisfaction; putting them right removes the dissatisfaction but does not motivate.
      - **Motivators** lie in the job itself. They create satisfaction, and they are what lead people to work harder and better.

      The opposite of dissatisfaction is therefore not satisfaction but simply no dissatisfaction. A business must get the hygiene factors right first, to stop the complaints, absence and resignations they cause, and then motivate through the content of the work. Herzberg's practical answer was **job enrichment**: giving people complete, challenging tasks and responsibility for the result.
    diagram: herzberg-two-factor
    points:
      - term: Hygiene factors
        text: Pay, working conditions, company policy and administration, supervision, relationships at work and job security. Poor hygiene factors cause dissatisfaction; good ones prevent it.
      - term: Motivators
        text: Achievement, recognition, the work itself, responsibility, advancement and personal growth. These create satisfaction and effort.
      - term: Pay as a hygiene factor
        text: Herzberg classed pay as a hygiene factor. A pay rise can end complaints about pay, but its effect on effort soon fades, while pay that feels unfair quickly causes dissatisfaction.
    advantages:
      - It explains why pay rises and better conditions often stop complaints without raising effort.
      - It points managers towards job design, recognition and responsibility, which may cost little.
      - It underpins job enrichment and empowerment, which are widely used.
    limitations:
      - The sample was small and narrow, professional men in one American city in the 1950s; manual and low-paid workers may respond differently.
      - The method invites bias, because people tend to credit themselves for good times and blame their surroundings for bad times, which could itself produce two factors.
      - Pay clearly does motivate some people, especially when it is linked to performance or when income is low.
      - Satisfaction is not the same as productivity, and a satisfied worker does not necessarily work harder.
      - Not everyone wants more responsibility, and enrichment without training and support can cause stress.
    example:
      title: Fixing the canteen, then the job
      fictional: true
      text: Quillon Hotels, a fictional chain, repaired its staff canteen and its unreliable rota system after a wave of complaints. Complaints fell, but guests' ratings of cleanliness barely moved. Ratings rose only when each housekeeping team was given responsibility for its own floors, with guests' comments sent to the team by name. The first change dealt with hygiene factors; the second used motivators.
  - id: mcclelland-and-deci-ryan
    title: 'Needs theories: McClelland, and Deci and Ryan'
    kind: theory
    level: HL
    body: |
      **McClelland's acquired needs theory.** David McClelland (1917 to 1998), an American psychologist, argued that three needs drive behaviour at work: the needs for achievement, affiliation and power. People **acquire** them through their experiences, upbringing and culture, rather than being born with them. Everyone has all three in some degree, but one is usually dominant, and it shapes what motivates that person. Unlike Maslow, McClelland did not arrange the needs in a hierarchy: which need dominates depends on the person, not on which needs are already met.

      For managers, the theory is a tool for matching people to work. Find each employee's dominant need, then give them the tasks, roles and rewards that feed it.

      **Deci and Ryan's self-determination theory.** Edward Deci and Richard Ryan, American psychologists, developed the theory from the 1970s onwards. It holds that everyone shares three basic psychological needs, for autonomy, competence and relatedness, and that work which meets them builds **intrinsic** motivation: people work because the task is interesting or worthwhile, not because they are pushed.

      The theory separates **autonomous motivation**, acting by choice because one values the work, from **controlled motivation**, acting under pressure, for a reward or to avoid a penalty. Autonomous motivation brings more lasting effort, better work and greater well-being. Rewards and close monitoring that feel controlling can crowd out intrinsic motivation, which is a direct challenge to Taylor.
    diagram: self-determination-theory
    points:
      - term: Need for achievement
        text: In McClelland's theory, the drive to succeed at challenging but realistic goals, with personal responsibility for the result and frequent feedback. Motivate with stretching targets and regular feedback. Strong achievers can make poor managers, because they would rather do the work themselves than delegate it.
      - term: Need for affiliation
        text: In McClelland's theory, the wish to be liked, to belong and to keep relationships warm. Motivate with teamwork and cooperative roles. People driven by affiliation may avoid conflict and find tough decisions about colleagues hard.
      - term: Need for power
        text: In McClelland's theory, the wish to influence and lead others and to make an impact. Motivate with responsibility, status and leadership roles. McClelland found that a need for power directed at the organization's goals, rather than personal gain, often marks effective managers.
      - term: Autonomy
        text: In Deci and Ryan's theory, the need to act by choice, with a say in how, when or in what order work is done and an understanding of why it matters. It does not mean working alone. Empowerment and flexible working support it.
      - term: Competence
        text: In Deci and Ryan's theory, the need to feel capable and to master challenges. Training, useful feedback and tasks that stretch people without overwhelming them support it.
      - term: Relatedness
        text: In Deci and Ryan's theory, the need to feel connected to other people and valued by them. Supportive managers, teamwork and a sense of belonging support it.
    advantages:
      - McClelland's theory recognizes that people differ, so roles and rewards can be matched to the person, and it helps in choosing managers and in spotting likely entrepreneurs.
      - Because McClelland's needs are learned, training and experience can strengthen them.
      - Self-determination theory is supported by a large body of research across many countries and kinds of work.
      - Self-determination theory explains why empowerment, training and teamwork can motivate more lastingly than pay alone.
    limitations:
      - A person's dominant need is hard to identify. McClelland measured it by interpreting the stories people told about pictures, a subjective method.
      - Needs can change with a person's role and circumstances, so labelling someone an achiever or a power-seeker can mislead.
      - Self-determination theory gives less guidance for routine, low-skilled work, where autonomy is hard to offer.
      - Meeting Deci and Ryan's three needs does not replace fair pay and security, which people still need before anything else motivates.
    example:
      title: Three needs in one studio
      fictional: true
      text: |
        Ferrow Architects, a fictional practice, matches work to people. Priya, driven by achievement, is given a small building to design alone, with a tight deadline and a weekly review. Daniel, driven by affiliation, mentors new graduates and runs the studio's team reviews. Sofia, driven by power, leads the bid team for a large contract.

        The practice also applies self-determination theory. Teams choose how to meet their deadlines (autonomy), the firm pays for professional courses and gives monthly feedback (competence), and the whole studio reviews its finished projects together (relatedness). It pays no individual bonuses, and few of its staff leave.
  - id: equity-and-expectancy
    title: Equity theory and expectancy theory
    kind: theory
    level: HL
    body: |
      These two theories are less about what people need than about how they **think** about rewards. Motivation depends on what employees believe about fairness and about the link between effort and reward, which is why the same scheme can motivate one person and leave another cold.

      **Equity theory.** J. Stacy Adams, a psychologist who studied behaviour at work, argued in the 1960s that employees compare what they get from a job (outcomes, or outputs, such as pay, benefits, recognition and promotion) with what they put into it (inputs such as effort, skill, experience, time and loyalty). They then compare this ratio with the same ratio for other people: colleagues, people in similar jobs elsewhere, or themselves in the past. When the ratios seem equal, people feel fairly treated. When they feel under-rewarded, they act to restore the balance: they cut their effort, ask for more, change whom they compare themselves with, or leave. Feeling over-rewarded can bring guilt, though people adjust to it more easily. What matters is **perceived** fairness, not actual fairness.

      **Expectancy theory.** Victor Vroom, a Canadian-born psychologist who worked in the United States, set out the theory in *Work and Motivation* (1964). Effort depends on three beliefs, each judged by the employee:

      - **Expectancy:** will my effort lead to the performance required?
      - **Instrumentality:** will that performance actually be rewarded?
      - **Valence:** do I value the reward?

      Because the three combine by multiplication, motivation is weak if any one of them is close to zero. Managers can strengthen each: realistic targets, training and resources raise expectancy; a clear and trusted reward system raises instrumentality; rewards that suit the individual raise valence.
    diagram: expectancy-theory
    formulas:
      - name: Expectancy theory
        expression: Motivational force = expectancy × instrumentality × valence
        note: The three terms are beliefs held by the employee, not figures a manager can measure, and the guide sets no calculation for them. The multiplication makes the key point that if any one is close to zero, so is motivation.
    advantages:
      - Equity theory explains why relative pay matters as much as the amount, and why a pay rise can demotivate if a colleague received more.
      - Equity theory supports open, consistent decisions on pay and promotion.
      - Expectancy theory gives managers a test for any incentive scheme. Is the target reachable, is the reward certain, and is it wanted?
      - Expectancy theory recognizes that people value different rewards, so one scheme rarely suits everyone.
    limitations:
      - In equity theory, people choose different comparison groups and value their inputs differently, so fairness is hard to predict or manage.
      - Equity theory says little about how to correct a perception of unfairness that is mistaken.
      - Expectancy theory assumes that people weigh their chances rationally before acting, but much behaviour is habitual or emotional.
      - The beliefs are hard to measure, so both theories explain behaviour after the event more easily than they predict it.
    example:
      title: A bonus nobody chased
      fictional: true
      text: |
        Brackwater Motors, a fictional car dealer, offered a holiday to any salesperson who doubled their monthly sales. Nobody tried. The target looked impossible, so expectancy was close to zero, and several staff with young children did not want a week away, so valence was low as well.

        The next year it paid a bonus for a 15% rise in sales, paid every month without fail, in cash or extra days off as each person chose. Effort rose, because all three beliefs were now strong. Then two experienced salespeople found out that a newer colleague was on a higher basic salary for the same work. They cut their effort and one resigned: an equity problem that no bonus scheme could fix.
  - id: financial-rewards
    title: Financial rewards
    kind: types
    body: |
      **Financial rewards** are payments in money, or with a clear money value. They meet the needs at the base of Maslow's hierarchy, work mainly through extrinsic motivation and are, in Taylor's view, the main motivator. Herzberg adds a warning: pay is a hygiene factor, so pay that feels unfair demotivates quickly, while a rise motivates only for a while.

      The method of payment matters as much as the amount. A good scheme rewards something the employee can influence, is seen as fair, is simple to understand and does not reward the wrong behaviour. Most businesses combine methods: a salary or wage for security, something linked to performance, and fringe payments to attract and keep staff.
    diagram: rewards-financial-non-financial
    points:
      - term: Salary
        text: A fixed annual amount, usually paid monthly, that does not change with the exact hours worked or the output. It gives a secure, predictable income and suits managerial, professional and office jobs where output is hard to measure, but it gives no direct reward for extra effort.
      - term: 'Wages: time rates'
        text: Pay for each hour or other period worked, usually paid weekly. It is simple to run and suits work where output is hard to count, and extra hours are often paid as overtime at a higher rate. It rewards time spent, not effort or results.
      - term: 'Wages: piece rates'
        text: A fixed amount for each unit produced, so that pay rises with output, as Taylor recommended. It rewards effort directly, but can lead workers to rush at the expense of quality and safety, and it suits only work where output can be counted and depends on the individual. Many schemes guarantee a minimum.
      - term: Commission
        text: A percentage of the value of the sales an employee makes, usually on top of a basic salary. It motivates sales staff and links pay costs to revenue, but it can encourage pushy selling, mis-selling and rivalry between colleagues, and income falls when sales fall for reasons the employee cannot control.
      - term: Performance-related pay (PRP)
        text: A bonus or a larger pay rise for meeting or beating agreed targets, usually an individual's and sometimes a team's, judged at a review of performance. It rewards the best performers and links pay to the organization's goals, but performance in many jobs is hard to measure fairly, targets can narrow people's focus, and those who miss out may think the system unfair.
      - term: Profit-related pay
        text: A bonus paid out of the organization's profit, so that pay rises and falls with how well the business does. It gives everyone an interest in its success and can encourage cooperation and cost saving, but one person's effort makes little visible difference to total profit, and in a bad year the bonus disappears however hard people worked.
      - term: Employee share ownership schemes
        text: Shares in the company given to employees, or sold to them at a discount, often on condition that they keep them for a period. As part-owners, employees gain from dividends and a rising share price, which can build loyalty and long-term thinking. The link to individual effort is weak, employees' savings become tied to their employer, and only companies with shares can offer them.
      - term: Fringe payments
        text: Rewards in addition to pay, such as a company car, health insurance, pension contributions, staff discounts or subsidized meals; also called fringe benefits or perks. They help to recruit and keep staff and can be valued more than a pay rise of the same cost, but they are soon taken for granted.
    example:
      title: Salary or commission?
      fictional: true
      text: |
        Kittering Kitchens, a fictional showroom, offers its sales advisers a choice. Plan A is a salary of $30,000 a year. Plan B is a basic salary of $18,000 plus commission of 2% on sales.

        An adviser who sells $500,000 of kitchens earns $18,000 + (2% × $500,000) = $18,000 + $10,000 = $28,000 on plan B, less than on plan A. One who sells $800,000 earns $18,000 + $16,000 = $34,000. The plans pay the same at sales of $600,000, because the extra $12,000 of salary in plan A equals 2% of $600,000. Plan B rewards selling more and costs the showroom less in a bad year, but the adviser's income is less certain.
  - id: non-financial-rewards
    title: Non-financial rewards
    kind: types
    body: |
      **Non-financial rewards** motivate without money changing hands. Most of them change the job itself or the way people work together, so they act mainly on intrinsic motivation, on the higher levels of Maslow's hierarchy and on Herzberg's motivators. The diagram in the section above lists them beside the financial rewards.

      They often cost little in money, and their effect can last longer than a one-off payment because the work itself becomes more rewarding. But they need management time, training and trust, they do not suit everyone, and they will not motivate people who feel underpaid or insecure. In Herzberg's terms, the hygiene factors must be right first.
    points:
      - term: Job enrichment
        text: Redesigning a job to give more responsibility, more challenging tasks and a complete piece of work, so that people use more of their abilities. It comes from Herzberg and acts on his motivators. It needs training and support, not everyone wants more responsibility, and staff may expect their pay to rise with it.
      - term: Job rotation
        text: Moving employees between different tasks or jobs at a similar level at regular intervals. It reduces boredom, builds a multi-skilled workforce that can cover absences and helps people understand the wider process. If every task is simple, it only swaps one dull task for another, and output dips while people learn.
      - term: Job enlargement
        text: Adding more tasks of a similar level to a job, which gives more variety but no more responsibility. It can make work less monotonous, but employees may see it as more work for the same pay, especially when it follows delayering or job cuts.
      - term: Empowerment
        text: Giving employees the authority, resources and confidence to make decisions about their own work without asking a manager first. It can speed up service, draw on staff knowledge and raise commitment. It needs training, trust and a culture that accepts some mistakes, and it goes further than delegation, which passes down particular tasks.
      - term: 'Purpose: the opportunity to make a difference'
        text: The sense that one's work makes a positive difference to customers, colleagues, society or the environment. Businesses build it through a clear mission, by showing staff the effect of their work, and through ethical and sustainable practices. Claims of purpose that do not match how the business behaves breed cynicism.
      - term: Teamwork
        text: Organizing work so that employees cooperate in groups with shared responsibility for a goal. It meets social needs, spreads skills and ideas, and can raise quality and commitment. Teams can also bring conflict, pressure to conform and members who rely on others' effort, and they need good leadership.
    advantages:
      - They can motivate for longer than a one-off payment, because they change the work itself.
      - They often cost little in money, so they suit businesses that cannot afford to raise pay.
      - They build skills and flexibility, which benefit the business as well as the employee.
    limitations:
      - They need management time, training and trust, and done badly they feel like extra work.
      - They do not motivate people whose pay or security is inadequate.
      - Not everyone wants more responsibility or variety; some people prefer predictable work.
      - Their results are hard to measure, so their value is easy to doubt.
    example:
      title: Changing the work, not the pay
      fictional: true
      text: Wrenfold Print, a fictional printing firm, reorganized its finishing department into teams of six. Each team rotates between cutting, binding and packing (job rotation), checks its own quality and deals directly with customers' queries (job enrichment and empowerment), and each month reads the letters from the schools and charities whose materials it printed (purpose). In a year, absence fell from 6% to 4% of shifts and complaints about quality halved, with no change in pay.
  - id: recruitment
    title: Recruitment
    kind: method
    level: HL
    body: |
      **Recruitment** is the process of filling a vacancy: working out what the job needs, attracting suitable applicants, choosing among them and making an offer. It links to motivation in two ways. A good appointment brings in people whose needs and abilities the job can meet, and promotion from inside is itself a reward, a step up Maslow's hierarchy and one of Herzberg's motivators.

      A typical process has seven stages:

      1. **Confirm the vacancy.** Check against the workforce plan whether the post needs filling at all, or whether the work could be reorganized.
      2. **Write a job description**, setting out the job's title, purpose, duties and responsibilities, its conditions and whom the holder reports to.
      3. **Write a person specification**, setting out the qualifications, skills, experience and qualities needed, often divided into essential and desirable.
      4. **Advertise the post**, inside the organization, outside it, or both.
      5. **Shortlist** by comparing applications or CVs with the person specification.
      6. **Select** with one or more methods: interviews (one-to-one, by a panel or by video), aptitude, skills and personality tests, work samples or trial days, assessment centres with group tasks and presentations, and references from previous employers.
      7. **Appoint** the chosen candidate and plan their induction.

      Ways of reaching applicants from outside include job websites and social media, the organization's own careers page, newspapers and specialist journals, recruitment agencies and government job centres, headhunters who approach people already working elsewhere, job fairs and visits to universities, and referrals from current staff. The criteria at every stage should relate to the job itself, so that the process is fair and lawful and does not exclude good candidates.

      Neither internal nor external recruitment is better in general. Internal recruitment suits a business that values continuity, has people ready for promotion and wants to reward loyalty; external recruitment suits one that needs skills it lacks, fresh ideas or a change of culture. Many organizations advertise inside and outside at once and let the candidates compete.
    points:
      - term: Internal recruitment
        text: |
          Filling the post with someone who already works for the organization, by promotion, transfer or redeployment.

          **For:** it is quicker and cheaper; the candidate's abilities and record are known, so the risk is lower; little induction is needed; and the chance of promotion motivates other staff.

          **Against:** the pool of applicants is small; no new ideas or experience come in; colleagues who are passed over may resent it; and the promotion leaves another vacancy to fill.
      - term: External recruitment
        text: |
          Filling the post with someone from outside the organization, through the methods above.

          **For:** a wider choice of applicants; new skills, ideas and experience, including skills no one inside has; and an outsider's view when the business needs to change.

          **Against:** it costs more and takes longer; a full induction is needed; the risk of a poor fit is greater, because the candidate is known only from the selection process; and internal candidates may be demotivated.
    example:
      title: Two posts, two routes
      fictional: true
      text: Pell and Hart, a fictional accountancy firm, has two vacancies. For a team leader in its audit department it promotes an accountant with six years at the firm, who knows the clients and the systems and needs only a week's handover; the promotion also shows junior staff that there is a way up. For a new head of data analytics it uses a headhunter, because no one inside has the skills. That appointment costs far more, takes four months and needs a full induction, but it brings in expertise the firm could not grow quickly itself.
  - id: training
    title: Types of training
    kind: types
    body: |
      Training develops the skills, knowledge and attitudes that employees need now and in the future. It raises productivity and quality, cuts mistakes and accidents, prepares staff for change and promotion, and can motivate: it meets esteem needs, opens the way to Herzberg's advancement and growth, and shows people that the business values them.

      Training costs money and time, and trained staff may be poached by rivals. The cost of not training is usually higher, though: mistakes, accidents, poor service and staff who leave because they see no future.

      The line between on-the-job and off-the-job training is not always sharp. The IB teacher support material defines the two by place: on-the-job training happens at the workplace during working hours, and can include classroom-style sessions there, while off-the-job training happens away from the workplace, usually run by an outside provider. Some textbooks instead count any session that takes employees away from their normal work as off the job, even in the company's own training room. In an answer, say what the training involves, not only its label.
    points:
      - term: Induction
        text: Training that introduces new employees to the organization, its people, procedures, facilities, culture and health and safety rules, and to their own job. It helps new starters become productive sooner, feel welcome and avoid early mistakes, and it reduces the number who leave in their first months. Too much information at once is soon forgotten.
      - term: On-the-job training
        text: Training while doing the job in the normal workplace, for example by watching and copying an experienced colleague, coaching, mentoring or job rotation. It is usually cheap and directly relevant, and the trainee keeps producing. But its quality depends on the trainer, who may pass on bad habits, it can slow experienced staff down, and it may not develop wider or theoretical knowledge.
      - term: Off-the-job training
        text: Training away from the employee's normal work, such as courses, college programmes, conferences, workshops, online learning or simulations. It can give specialist knowledge, qualifications and new ideas without the distractions of the workplace. It costs more, the employee produces nothing while training, what is learned may not transfer easily to the job, and newly qualified staff may become more attractive to rivals.
    example:
      title: A new starter's first three months
      fictional: true
      text: A new dispensing assistant at Elmscott Pharmacy, a fictional chain, spends her first two days on induction, covering fire drills, the rules on patients' data, a tour of the branch and the chain's values. She then works for four weeks beside an experienced dispenser who shows her each task and checks her work, which is on-the-job training. In her third month she attends a three-day accredited course on medicine safety at a local college, off the job.
  - id: appraisal
    title: Appraisal
    kind: types
    level: HL
    body: |
      **Appraisal** is a structured review of how well an employee is performing against agreed objectives. Businesses use it to give feedback, recognize good work, identify training needs, set new targets and gather evidence for decisions on pay and promotion, including performance-related pay.

      Appraisal can motivate. It offers recognition and a plan for advancement, two of Herzberg's motivators, meets esteem needs in Maslow's hierarchy and, through useful feedback, builds the sense of competence that Deci and Ryan describe. Done badly, it demotivates. A rushed annual meeting, a one-sided judgement or a review tied too tightly to pay makes employees defensive, so they hide problems rather than solve them. The guide names four types, and most organizations combine several.
    diagram: appraisal-types
    points:
      - term: Formative appraisal
        text: Ongoing, often informal feedback during a period of work, to help the employee improve rather than to judge final results, like a coach's advice during a season. Problems are put right early and confidence grows, but it takes managers' time and may not produce the formal records needed for decisions on pay.
      - term: Summative appraisal
        text: A formal review at the end of a period, often a year, that judges and records performance against targets, usually to decide pay, promotion or further action, and to set targets for the next period. It gives a clear record and links performance to rewards, but it can feel threatening, and feedback that comes once a year arrives too late to help during that year.
      - term: 360-degree feedback
        text: Feedback on an employee gathered from people all around them at work, such as their manager, colleagues, the people they manage and sometimes customers, often alongside their own view. It gives a fuller and more balanced picture than one manager's opinion and is often used to develop managers. It takes time and money to collect, and it works only where feedback is honest, anonymous where needed and given in a culture of trust.
      - term: Self-appraisal
        text: The employee assesses their own performance against their objectives, usually before discussing it with their manager, and it can form part of either formative or summative appraisal. It encourages reflection and ownership of development and suits a culture of empowerment, but people may rate themselves too generously or too harshly, so it is normally combined with another type.
    advantages:
      - It recognizes good work and plans each person's development, which can motivate.
      - It identifies training needs and future leaders.
      - It links each employee's targets to the organization's objectives.
    limitations:
      - It takes managers' and employees' time, often at busy points in the year.
      - It depends on the appraiser's skill and fairness, and bias or favouritism undermines it.
      - Tying it closely to pay can make employees defensive and hide problems.
    example:
      title: Four types in one clinic
      fictional: true
      text: At Sorrel Health, a fictional group of clinics, each nurse has a short monthly conversation with a senior nurse about what went well and what to work on, which is formative appraisal. Once a year each nurse completes a self-appraisal form before a formal review with the clinic manager, which records performance against targets and decides any pay rise, a summative appraisal. Clinic managers also receive anonymous 360-degree feedback from their staff, from fellow managers and from a sample of patients, which shapes their own leadership training.
  - id: labour-turnover
    title: Labour turnover
    kind: method
    level: HL
    body: |
      **Labour turnover** measures the share of a workforce that leaves an organization during a period, usually a year. It is one of the clearest signs of whether people are motivated to stay, and managers read it alongside absence rates and what leavers say in exit interviews.

      The guide's list of formulae does not include labour turnover, so the form below is the standard one, used throughout this platform. Divide by the **average** number of employees over the period, not by the number at the start or the end.
    formulas:
      - name: Labour turnover
        expression: Labour turnover = (number of employees leaving ÷ average number of employees) × 100
        note: The result is a percentage for the period. When only the numbers at the start and the end are known, the average is usually taken as (employees at the start + employees at the end) ÷ 2.
    points:
      - term: Causes of high turnover
        text: Pay below rivals' or seen as unfair, poor management, little training or chance of promotion, dull work, a poor induction, and plenty of jobs available elsewhere. In some industries, such as seasonal tourism, high turnover is part of the work.
      - term: Costs of high turnover
        text: The costs of recruitment, selection and induction; lost skills and knowledge; lower output and more mistakes while new staff learn; extra pressure and lower morale for those who stay; and poorer service to customers.
      - term: Benefits of some turnover
        text: New employees bring fresh ideas and skills, and leavers let a business reshape its workforce without redundancies. Very low turnover can mean a stale workforce and rising pay costs as everyone moves up the pay scale.
      - term: Judging the figure
        text: Compare it with the business's own past, with rivals and the industry average, and between departments, shifts or sites. A rate that is normal in fast food would be alarming in a law firm. Look also at **who** is leaving, since losing the best performers matters more than the rate.
    advantages:
      - It is simple to calculate and to compare over time and between parts of the business.
      - It gives early warning of demotivation, poor management or uncompetitive pay.
    limitations:
      - It shows how many people leave, not why; exit interviews and staff surveys are needed for that.
      - It treats every leaver alike, whether they retired, were dismissed or were the best performer.
      - In a small team, one or two leavers change the rate sharply.
    example:
      title: Working out and reading the rate
      fictional: true
      text: |
        Wenlow Care, a fictional group of care homes, employed 180 people on 1 January and 220 on 31 December. During the year, 46 employees left.

        Average number of employees = (180 + 220) ÷ 2 = 200. Labour turnover = (46 ÷ 200) × 100 = **23%**. Dividing by the 220 employed at the end of the year would give 20.9%, which understates the problem.

        Two years ago the rate was 16%, and a similar care group reports 15%. Exit interviews show that most leavers worked night shifts and had received little training. The evidence points to a targeted response, such as better training and rotas for night staff, rather than a pay rise for everyone.
applications:
  - industry: Warehousing and manufacturing
    text: Output is easy to count, so piece rates, targets and close monitoring in Taylor's tradition are common, and handheld scanners now time every task. They raise output on simple work but can cost more in errors, injuries and resignations, which is why some firms add job rotation and teamwork to keep people engaged.
  - industry: Health and social care
    text: Purpose is a powerful motivator because staff see the difference they make, but pay, shift patterns and staffing levels are hygiene factors that cause burnout and resignations when they are poor. Training and appraisal matter for patients' safety as well as for motivation, and at HL labour turnover, as at Wenlow Care, is a key sign of how well staff are managed.
  - industry: Hospitality and retail
    text: Many jobs are part-time, low-paid and seasonal, so turnover is high, and fringe payments such as staff discounts and meals help to recruit and keep people. Empowering staff to put problems right themselves, as Quillon Hotels did with its housekeeping teams, can improve service without raising pay.
  - industry: Technology and creative work
    text: Autonomy, mastery of difficult problems and the chance to build something new drive many employees, so these firms rely on flexible working, project teams and employee share ownership more than on piece rates. Research on intrinsic motivation suggests that bonuses do less for complex, creative work, so the work itself has to carry much of the motivation.
  - industry: Financial services and sales
    text: Commission and performance-related pay dominate because sales are easy to measure, but rewards tied narrowly to sales have encouraged pushy selling and mis-selling. At HL, expectancy and equity theory explain why a scheme fails when its targets look unreachable or colleagues seem better rewarded for the same work.
  - industry: Charities and social enterprises
    text: Many staff accept lower pay because they believe in the mission, and volunteers work for none, so purpose and teamwork carry much of the motivation. The risk is that goodwill is taken for granted, because pay that falls too far behind still causes dissatisfaction, as Herzberg would predict.
stakeholders:
  - group: Employees
    text: They gain from fair pay, interesting work, training and recognition, and lose from monitoring and targets that treat them as machines. Their interests conflict with the owners' when rewards are cut to save money, and with each other's when individual bonuses and rankings set colleagues against each other.
  - group: Managers
    text: They choose and run the rewards, appraisals and training that motivate, which takes time and skill, and poor management is as often the cause of demotivation as its cure. Pressure for this quarter's output can push them towards Taylor's methods even when the work needs more autonomy.
  - group: Owners and shareholders
    text: Pay is one of the largest costs, so owners want rewards that raise productivity by more than they cost. Profit-related pay and share schemes tie employees' rewards to the owners' own, while high labour turnover, at HL, shows the price of getting motivation wrong.
  - group: Customers
    text: Motivated staff give better service and make fewer mistakes, so customers gain from good management without seeing it. Rewards tied narrowly to sales or speed can work against them, as when commission encourages mis-selling or a target for short calls cuts a customer off before the problem is solved.
  - group: Trade unions
    text: They bargain over pay and conditions, Herzberg's hygiene factors, and resist piece rates, close monitoring and changes imposed without consultation. At HL, these conflicts between employees and employers are the subject of industrial relations (2.7).
  - group: Job applicants
    text: At HL, the way a business recruits decides who it attracts and whether they stay, since a realistic job description, fair selection and a good induction reduce early resignations. Internal candidates and outsiders compete for the same promotions, so the choice between internal and external recruitment can motivate one group and disappoint the other.
evaluation:
  - No theory is a law. Each was built from particular evidence in a particular time and place, Taylor's from American factories around 1900 and Herzberg's from about 200 engineers and accountants in the 1950s, while Maslow's rested more on argument than on measurement. Use a theory as a lens on the case, and say where it fits and where it does not.
  - Culture changes what motivates. The best-known theories come from the United States, a strongly individualistic culture. Where loyalty to the group, security or respect for seniority matter more, Maslow's order and the appeal of individual bonuses may not hold; at HL, Hofstede's cultural dimensions help to explain why.
  - Money matters, but not in the same way for everyone. Taylor treats pay as the motivator and Herzberg as a hygiene factor, and both are partly right. Studies of piece rates show that they can raise output on simple tasks that can be counted, while research on intrinsic motivation suggests that bonuses do less for complex or creative work. People on low or insecure incomes are more likely to respond to money.
  - The theories overlap more than they compete. Maslow's lower needs resemble Herzberg's hygiene factors, and his higher needs resemble Herzberg's motivators. At HL, Deci and Ryan's relatedness echoes Maslow's social needs and McClelland's need for affiliation. Showing the links, and the differences, is a mark of understanding.
  - What people believe matters as much as what they receive. A generous reward fails if the target seems impossible, the reward seems unlikely to be paid or a colleague seems to get more for less; at HL, expectancy and equity theory explain why. Judge any reward scheme by how employees will see it, not only by what it costs.
  - Motivation is only one cause of performance. Output also depends on training, equipment, the way the work is organized and leadership, and people leave for reasons such as better pay elsewhere, family or a strong local job market. Before blaming motivation, check the other causes in the case.
  - In an examination answer, choose the one or two theories that best explain the evidence in the case and apply them to it, rather than describing every theory in full. Then judge which rewards the business should use, given its costs, its workforce and its culture.
  - At HL, Paper 3 opens by asking you to describe the human need in its stimulus about a social enterprise (guide, p. 42), and the teacher support material suggests linking that need to a theory such as motivation (p. 65). Maslow's levels give you precise words for it.
decision:
  title: More benches, without losing quality
  fictional: true
  brief: |
    Ostler Benches, a fictional maker of garden benches, employs 20 assemblers on a time rate of $16 an hour for an eight-hour day. Each assembler completes about four benches a day, so the team makes 80 benches a day and labour costs $32 a bench. About 2% of benches come back from customers with faults, and putting each one right costs $60.

    Orders are rising, and the owner, Beth Ostler, wants more output without losing the quality her brand is known for. A staff survey shows that the assemblers think their pay is fair but find the work repetitive, because each person does one stage of the job all day.
  options:
    - label: Piece rates
      text: Pay $30 a bench, with a guaranteed minimum of $110 a day. A trial at a similar workshop raised output to five benches per person a day, but faults rose to 5%.
    - label: Team performance-related pay
      text: Keep the time rate and pay the team a bonus of $12 for every bench above 80 a day, shared equally, but only on days when no more than 2% of benches fail inspection.
    - label: Job enrichment and training
      text: Each assembler builds whole benches, checks and signs each one, and attends a two-day finishing course costing $400 a person, $8,000 in all. Pay stays the same.
  guidance: |
    Work out what each option does to cost and quality, then ask which explanation of the problem the evidence supports.

    - **Now:** 20 × $16 × 8 = $2,560 a day for 80 benches, $32 a bench in labour, plus 1.6 faulty benches a day at $60, which is $96 a day or $1.20 a bench: $33.20 a bench in all.
    - **Piece rates:** if output reaches 100 benches a day, labour falls to $30 a bench and each assembler earns $150 a day instead of $128, about 17% more. But at 5% faults, five benches a day come back at $60 each, $300 a day or $3 a bench, so the total is $33 a bench, barely less than now, and the brand's name for quality is at risk. Taylor would expect the money to raise effort; Herzberg would point out that the work stays as dull as before.
    - **Team bonus:** at 90 benches a day the bonus is $120, or $6 for each assembler, and labour costs ($2,560 + $120) ÷ 90 = $29.78 a bench, while the quality condition protects the brand. But $6 a day is a small reward, some members may rely on others' effort, and the target must look reachable for the bonus to motivate at all.
    - **Enrichment:** it costs $8,000 once and leaves labour at $32 a bench unless output rises, but it acts on Herzberg's motivators (complete work, responsibility, and recognition through the signature) and on the repetitive work the survey found. If faults fell from 2% to 1%, repairs would cost $48 a day instead of $96, a saving that would pay for the course in about 167 working days.

    A strong judgement starts from the survey. Pay is seen as fair, so in Herzberg's terms the hygiene factors are in place and the problem lies in the work itself, which points to enrichment, perhaps combined with the team bonus. Piece rates fit Taylor's view but buy output at the cost of quality. At HL, expectancy theory adds a test for any bonus: can the team reach the target, will the bonus really be paid, and is it worth having? The answer would change if the trial's fault rate proved unusual, if the assemblers said they wanted more money, or if output is held back by the equipment rather than by effort.
exam:
  - q: Define the term *job enrichment*.
    marks: 2
    command: define
    level: SL/HL
    paper: '1'
    answer: |
      A strong response gives a precise definition: redesigning a job to give the employee more responsibility, more challenging tasks and a complete piece of work, so that they use more of their abilities.

      - The key idea is more responsibility, not just more tasks, which would be job enlargement.
      - It may note the link to Herzberg's motivators.
  - q: |
      Fenn Ceramics, a fictional pottery, is considering paying its glazers a piece rate instead of a time rate. Under the time rate, a glazer earns $15 an hour for a 40-hour week. Under the piece rate, a glazer would earn $5 for each item glazed. One glazer currently glazes 140 items a week.

      Calculate the glazer's weekly pay under each method, and the weekly output at which the two methods pay the same.
    marks: 4
    command: calculate
    level: SL/HL
    paper: '2'
    answer: |
      - **Time rate:** $15 × 40 = **$600** a week.
      - **Piece rate:** $5 × 140 = **$700** a week.
      - **Output at which they pay the same:** $600 ÷ $5 = **120 items** a week.

      A strong response shows the working and may add what it means: any glazer who glazes more than 120 items a week earns more under the piece rate, which rewards speed, but the pottery should watch quality and safety, as critics of Taylor's approach warn.
  - q: Using Herzberg's motivation-hygiene theory, explain why Thornvale Energy's 8% pay rise stopped the complaints about pay but did not reduce absence or resignations.
    marks: 4
    command: explain
    level: SL/HL
    paper: '1'
    answer: |
      A strong response applies the two factors to the case.

      - **Pay is a hygiene factor:** when advisers felt underpaid it caused dissatisfaction, so raising pay removed that dissatisfaction and the complaints stopped, but in Herzberg's theory removing dissatisfaction does not create motivation.
      - **The motivators are missing:** scripted calls, timing and a weekly ranking leave advisers little achievement, responsibility or recognition, and no control over the work itself, so absence and resignations continue. The rival that lets staff solve problems in their own way offers exactly the motivators Thornvale lacks.
      - A strong answer may add that the team leader's proposal, authority over refunds and training, would act on the motivators.
  - q: Evaluate Strandline Parcels' use of scientific management in its warehouse.
    marks: 10
    command: evaluate
    level: SL/HL
    paper: '1'
    answer: |
      A strong response weighs Taylor's approach as Strandline applies it, using the case, and reaches a supported judgement.

      - **For:** output per hour rose by a tenth in three months; picking is simple, repeatable work whose output can be counted, which is where Taylor's methods work best; the scanners give clear targets and a bonus that links pay to effort.
      - **Against:** picking errors rose, which costs money and customers; resignations rose, which brings recruitment and training costs; the pickers' ideas for a better layout went unheard; and constant timing and ranking ignore the social and esteem needs in Maslow's hierarchy and the motivators in Herzberg's theory.
      - **Weighing it:** the gain in output must be set against the cost of errors and turnover, which the case does not quantify, so the method may be raising activity rather than results.
      - **Judgement:** for example, scientific management suits the counting and routing of picks, but Strandline should combine it with teamwork, job rotation and a channel for the pickers' ideas, or the errors and resignations may cancel the gain. A strong answer says what is missing: the cost of errors and of replacing staff who leave.

      When weighing one option, the teacher support material advises at least two arguments for and two against (pp. 56 and 60).
  - q: |
      Thornvale Energy's contact centre employed 58 advisers at the start of last year and 62 at the end. During the year, 21 advisers left. A survey of similar contact centres in the region reports an average labour turnover of 26%.

      Comment on the labour turnover at Thornvale's contact centre.
    marks: 4
    command: comment
    level: HL
    paper: '2'
    answer: |
      A strong response calculates the rate correctly, then judges it in context.

      - **The rate:** average number of employees = (58 + 62) ÷ 2 = 60, so labour turnover = (21 ÷ 60) × 100 = **35%**. Dividing by the 62 employed at the end would give 33.9%, which understates it.
      - **Compared with others:** 35% is nine percentage points above the regional average of 26%, so Thornvale is losing advisers faster than similar employers.
      - **What it means:** the case says that experienced advisers are leaving for a rival with more freedom, so the cost is greater than the rate suggests, in recruitment, training and service. One year's figure, and a survey whose methods are not given, call for some caution, and exit interviews would confirm the reasons.
  - q: Using self-determination theory and expectancy theory, evaluate the finance director's proposal to pay a bonus to the Thornvale advisers with the shortest calls.
    marks: 10
    command: evaluate
    level: HL
    paper: '2'
    answer: |
      A strong response applies both theories to the proposal, uses the case and reaches a supported judgement.

      - **Expectancy theory, for:** advisers can shorten their calls, so expectancy is high; if the bonus is paid reliably, instrumentality is high; and if it is worth having, valence is high, so the scheme is likely to change behaviour.
      - **Expectancy theory, against:** it will change the wrong behaviour. The bonus rewards speed, not solved problems, so calls may be cut short and customers' satisfaction, already falling, may fall further.
      - **Self-determination theory:** a bonus for speed, on top of scripts, timing and rankings, adds controlled motivation and does nothing for autonomy, competence or relatedness, and rewards that feel controlling can crowd out intrinsic motivation. The team leader's proposal, authority over refunds of up to $100 and training for hard cases, supports autonomy and competence directly.
      - **Equity:** advisers who take the hardest calls would lose out to colleagues with easy ones, which equity theory predicts will feel unfair.
      - **Judgement:** for example, the bonus would probably shorten calls but worsen service and do little about resignations, while the evidence that experienced advisers leave for a rival offering more freedom supports the team leader's proposal. A strong answer notes the limits: the case gives no cost for either option or the risk of refund authority being misused.

      When weighing one option, the teacher support material advises at least two arguments for and two against (pp. 56 and 60).
summary:
  - '**Motivation** is the drive to put effort into a goal, and **demotivation** shows in absence, mistakes, complaints and resignations. Intrinsic motivation comes from the work itself, extrinsic motivation from rewards.'
  - '**Taylor**: people work mainly for money, so find the one best way, train workers in it, pay by piece rate and separate planning from doing. It raises output on simple, countable work but ignores social and psychological needs.'
  - '**Maslow**: physiological, safety, social, esteem and self-actualization needs, with the lowest unmet need driving behaviour, so the same reward motivates some people and not others. The order is not rigid.'
  - '**Herzberg**: hygiene factors, pay among them, prevent dissatisfaction but do not motivate, while motivators in the job itself, such as achievement, recognition and responsibility, do; hence job enrichment.'
  - '**Financial rewards** are salary, wages (time and piece rates), commission, performance-related pay, profit-related pay, employee share ownership schemes and fringe payments; the method of payment matters as much as the amount.'
  - '**Non-financial rewards** are job enrichment, job rotation, job enlargement, empowerment, purpose and teamwork. They act on intrinsic motivation but need trust, training and fair pay first.'
  - '**Training** is induction for new starters, on-the-job training in the workplace, or off-the-job training away from it.'
  - '(HL) **McClelland**: acquired needs for achievement, affiliation and power. **Deci and Ryan**: autonomy, competence and relatedness build autonomous motivation. **Equity theory**: perceived fairness compared with others. **Expectancy theory**: expectancy × instrumentality × valence.'
  - '(HL) **Labour turnover** = (number of employees leaving ÷ average number of employees) × 100, judged against the past, rivals and who is leaving. **Appraisal** is formative, summative, 360-degree or self-appraisal, and **recruitment** internal or external, each with its trade-offs.'
connections:
  - code: '2.1'
    text: Recruitment and training carry out the workforce plan, and change imposed without consultation is a common cause of demotivation.
  - code: '2.2'
    text: Delegation, empowerment and flatter structures give people the responsibility Herzberg's motivators need, while delayering can remove promotion steps.
  - code: '2.3'
    text: Leadership style is one of the biggest influences on motivation. Close autocratic control echoes Taylor, while democratic and laissez-faire styles build autonomy and responsibility.
  - code: '2.5'
    text: At HL, organizational culture shapes which rewards fit, and culture clashes are a common cause of demotivation.
  - code: '2.7'
    text: At HL, pay and conditions, Herzberg's hygiene factors, are among the commonest sources of conflict between employees and employers.
  - code: '3.3'
    text: Pay and rewards are a major cost. Salaries are fixed costs, while piece rates and commission vary with output and sales.
  - code: '5.3'
    text: At HL, lean production and total quality management rely on empowered, motivated teams.
  - code: '5.9'
    text: At HL, using data to monitor employees revives Taylor's ideas as digital Taylorism.

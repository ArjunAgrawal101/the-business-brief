retrieval:
  - q: What is human resource management?
    a: Managing the people an organization employs so that they help it achieve its objectives, through planning the workforce, recruitment, training, rewards, welfare, employee relations and managing departures.
  - q: What are the five steps of human resource planning?
    a: Forecast the demand for labour, audit the current supply, find the gap, plan the action to close it, and monitor and review the plan.
  - q: A shop needs 30 staff next year. It has 26 now and expects 4 to leave. How many must it recruit or find?
    a: 30 − (26 − 4) = 8 staff.
  - q: Name three internal factors that influence human resource planning.
    a: For example, objectives and strategy, the finance available, technology and automation, working patterns such as flexi-time, the skills and age profile of the current workforce, and structure and culture.
  - q: How does an ageing population affect human resource planning?
    a: More staff retire and fewer young people enter work, so recruitment is harder; businesses may retain and retrain older workers, offer flexible hours, recruit from further afield or automate.
  - q: Distinguish between occupational and geographical mobility of labour.
    a: Occupational mobility is how easily workers can move into a different kind of job; geographical mobility is how easily they can move to work in a different place.
  - q: What is the gig economy, and what does it offer a business?
    a: A labour market of short-term, task-by-task work, often through digital platforms, usually by self-employed workers. It lets a business buy labour only when it needs it, turning a fixed cost into a variable one.
  - q: What is natural wastage?
    a: The fall in staff numbers as people resign or retire and are not replaced. It avoids redundancies but is slow, and the business cannot choose who leaves.
  - q: Give four reasons why employees resist change.
    a: For example, fear of the unknown, threats to job security or pay, loss of status or skills, habit, poor communication or no consultation, low trust in management, disagreement with the change, and change fatigue.
  - q: Why can hidden resistance be more damaging than open resistance?
    a: Managers may not see it. Absence, low effort and the quiet departure of skilled staff continue while managers believe the change has been accepted.
  - q: Why should consultation happen before a decision is fixed?
    a: If employees are consulted after the decision has been made, the consultation is seen as a sham and increases distrust instead of reducing resistance.
  - q: (HL) In force field analysis, why is weakening a restraining force often better than adding a driving force?
    a: Pushing harder for a change tends to provoke more resistance, while removing a reason for resistance lets the change move forward without extra pressure.

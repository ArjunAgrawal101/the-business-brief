# Notes: 2.1 Introduction to human resource management. Written in the
# platform's own words from the guide's four content statements (p. 25), the
# unit's conceptual understandings, suggested tools and inquiry statements
# (pp. 25 and 27), and the toolkit's note that tools are taught at AO2 and AO4
# (p. 13). Force field analysis is an HL toolkit tool, so its section is
# marked HL. Kotter and Schlesinger's reasons for resistance and approaches to
# change are enrichment, attributed to their authors and explained from
# subject knowledge. No coursebook chapter for unit 2 was supplied. Every
# business named is fictional, every figure simulated, and every worked figure
# was checked by script.
code: '2.1'
title: Introduction to human resource management
level: SL/HL
introduction: |
  Every plan a business makes, to grow, to automate, to open a new site or to cut costs, depends in the end on people: enough of them, with the right skills, in the right place, willing to work in new ways. **Human resource management (HRM)** is how an organization plans for, finds, develops, rewards and looks after those people, and how it manages them through change.

  This subtopic sets out what HRM does, the internal and external factors that shape a workforce plan, such as demographic change, labour mobility, immigration, flexi-time and the gig economy, and why people so often resist change at work. Its most demanding statement asks you to evaluate the HR strategies that reduce the impact of change and the resistance to it (AO3), which means judging which strategy fits which situation, not listing them.
objectives:
  - '**Explain** the role of human resource management and how it supports an organization''s objectives.'
  - '**Explain** how human resource planning matches the workforce to the organization''s plans, and work through a simple workforce plan.'
  - '**Analyse** the internal and external factors that influence human resource planning, including demographic change, labour mobility, immigration, flexi-time and the gig economy.'
  - '**Explain** why employees resist change in the workplace.'
  - '**Evaluate** human resource strategies for reducing the impact of change and resistance to change.'
  - '**Apply** force field analysis to a proposed change (HL only).'
situation:
  title: The robots arrive at Brennock
  fictional: true
  text: |
    Brennock Foods, a fictional maker of chilled ready meals, employs 340 people at one factory in a small town. Its biggest customer, a supermarket chain, wants lower prices and faster delivery, and Brennock's directors have approved an automated packing line. It will need 20 technicians to run it and 60 fewer packers.

    The factory has a long-serving workforce: the average packer has been there eleven years, and a quarter of all staff are over 55. Younger people in the town tend to leave for the city, so vacancies already take months to fill, and the night shift relies on agency workers found through an app. News of the machines reached the shop floor through a supplier's engineer before managers had said a word. Absence on the packing lines has risen by a third in a month, and two of the best line leaders have asked about jobs elsewhere.

    The HR manager has been asked for a plan by Friday.

    **What does Brennock's workforce need to look like in a year's time, and how can it get there without losing the people it most needs?**
sections:
  - id: role-of-hrm
    title: The role of human resource management
    kind: concept
    body: |
      **Human resource management (HRM)** is the management of the people an organization employs so that they help it achieve its objectives. People are usually a business's largest cost and the source of most of its ideas, quality and service, so decisions about them shape its costs, its productivity and its culture. The guide sets this statement at AO2: you should be able to explain what HRM does in a particular organization, not only list its tasks.

      HRM follows employees through their working lives with the organization: planning how many people are needed and with which skills, recruiting and selecting them, introducing and training them, reviewing their performance, rewarding them and looking after their welfare, managing relations with them and their representatives, and handling their departure through retirement, resignation, dismissal or redundancy. In a small business the owner does all of this; in a large one an HR department sets policies and gives specialist advice, while line managers do much of the day-to-day work of managing people.

      HRM is also *strategic*. A plan to expand abroad, to automate or to move to a new site is partly a plan about people, and it fails if the right people are not there or will not work in new ways. The unit's conceptual understandings make the same point from several sides: people drive organizational change, creative employees can be essential to success, and ethical HR systems can improve performance. Technology is changing the work itself: HR information systems hold staff records, track absence and analyse why people leave, though using data to monitor employees raises ethical questions that HL students meet in [5.9](/topics/management-information-systems/).
    points:
      - term: Human resource planning
        text: Forecasting the workforce the organization will need and planning how to close the gap with the one it has. The next section explains it.
      - term: Recruitment and selection
        text: Attracting suitable applicants and choosing among them. The methods, and the choice between internal and external recruitment, are HL content in [2.4](/topics/motivation-and-demotivation/).
      - term: Training and development
        text: Induction for new staff, and on-the-job and off-the-job training to build skills for now and for the future ([2.4](/topics/motivation-and-demotivation/)).
      - term: Reward and welfare
        text: Pay, benefits, health and safety, and support such as counselling, flexible working and help with stress.
      - term: Employee relations
        text: Communicating and consulting with employees and their representatives, and handling grievances, discipline and disputes. At HL, conflict and its resolution are studied in [2.7](/topics/industrial-employee-relations/).
      - term: Managing departures
        text: Retirement, resignation, dismissal for misconduct or poor performance, and redundancy, when a job is no longer needed. How departures are handled affects the morale of those who stay.
    example:
      title: HRM in a week at Brennock
      fictional: true
      text: In one week, Brennock's two-person HR team advertises for a quality technician, runs an induction for six new agency workers on the night shift, helps a line manager prepare an appraisal, meets a packer whose shift pattern no longer fits her childcare, and starts to plan the staffing of the automated line. Only the last of these will be on the directors' agenda, but all of them affect whether the factory runs well, and the line managers on each shift carry out most of the decisions the team makes.
  - id: human-resource-planning
    title: 'Human resource planning: matching people to plans'
    kind: method
    body: |
      **Human resource planning**, also called workforce planning, is forecasting how many employees, with which skills, an organization will need, comparing this with the workforce it will have, and planning how to close the gap. It starts from the organization's objectives, because a plan to grow, automate, relocate or cut costs changes the workforce it needs.

      A plan usually works through five steps.

      1. **Forecast the demand for labour:** how many people, with which skills, where and when, given the business's plans and its expected sales.
      2. **Audit the supply:** the people already employed, their skills, ages and contracts, and how many are likely to leave or retire.
      3. **Find the gap:** a shortage of people or skills, a surplus, or often both at once, with too many people in one role and too few in another.
      4. **Plan the action:** recruit, train or retrain, redeploy staff to other roles, promote, use flexible or agency labour, or reduce numbers through natural wastage, voluntary redundancy or, as a last resort, compulsory redundancy.
      5. **Monitor and review:** compare what happens with the plan, and change it as the business's plans and the labour market change.

      The forecast is the weak point. Demand for labour depends on sales forecasts and on how technology changes the work, while supply depends on how many people choose to leave, which is hard to predict. A good plan states its assumptions and is reviewed often, and the further ahead it looks, the less reliable it becomes.
    points:
      - term: Shortage
        text: The organization will need more people, or more of a particular skill, than it will have. It closes the gap by recruiting, training, promoting or using flexible labour.
      - term: Surplus
        text: The organization will have more people in some roles than it needs. It closes the gap by redeploying, retraining, natural wastage or redundancy.
      - term: Natural wastage
        text: The fall in staff numbers as people leave of their own accord, through resignation or retirement, and are not replaced. It avoids redundancies but is slow, and the organization cannot choose who leaves. At HL, the rate of leaving is measured as labour turnover ([2.4](/topics/motivation-and-demotivation/)).
      - term: Redeployment
        text: Moving employees to other roles in the organization, often with retraining, instead of making them redundant.
    example:
      title: A workforce plan for a care group
      fictional: true
      text: |
        Larchmont Care, a fictional group of care homes, looks after 960 residents with 240 care staff, one carer for every four residents, a ratio it must keep (simulated figures).

        - **Demand:** a new home opens next year with 144 places, 15% more residents, taking the total to 1,104. At one carer for every four residents, Larchmont will need 1,104 ÷ 4 = **276 carers**.
        - **Supply:** past records suggest 30 carers will resign during the year, and the age profile shows 6 will retire, so without action Larchmont will have 240 − 30 − 6 = **204**.
        - **Gap:** 276 − 204 = **72 carers** to find within the year.
        - **Action:** recruit 50 carers, including some from abroad where the law allows; take on 12 apprentices; and build a bank of 10 flexible staff to cover peaks and absences, which makes 72.

        The plan also has a skills dimension. A third of the new places, 48, are for residents with dementia, so it includes dementia training for 30 existing carers. The numbers are only as good as the assumptions: if more carers resign than in past years, the gap grows.
  - id: internal-factors
    title: Internal factors in human resource planning
    kind: concept
    body: |
      Some influences on a workforce plan come from inside the organization, so its managers can control or at least shape them. The most important is the organization's own direction: its objectives and strategy decide what work there will be. A business that plans to grow needs more people; one that automates needs fewer people with different skills; one that moves to a new site may lose staff who cannot follow it.

      The diagram shows these internal factors beside the external ones in the next section. Flexi-time sits on the border between the two. The guide names it among the factors without saying which kind it is: a business decides whether to offer flexi-time, which makes it internal, but it is often responding to what employees and rival employers expect, which is an external pressure. In an answer, say which way the pressure runs in the case.
    diagram: hr-planning-factors
    points:
      - term: Objectives and strategy
        text: Growth, new products, new markets, a merger, relocation or a drive to cut costs each change how many people are needed, with which skills and where.
      - term: Finance available
        text: The budget for pay, recruitment and training limits what the plan can do. A business short of cash may freeze recruitment even when it is short of staff.
      - term: Technology and automation
        text: New machines and software change the number of people needed and the skills they need, often creating a surplus in one role and a shortage in another.
      - term: Working patterns, including flexi-time
        text: How the business organizes working time, such as shifts, part-time roles, remote working and **flexi-time**, in which employees choose when to start and finish around agreed core hours. These choices change how many people are needed to cover the hours, and whom the business can attract.
      - term: The current workforce
        text: Its skills, its age profile, how many people leave and how often they are absent. An ageing workforce means retirements to plan for; high turnover means constant recruitment.
      - term: Structure and culture
        text: Delayering removes management posts, a flatter structure needs managers with wider spans of control ([2.2](/topics/organizational-structure/)), and the culture shapes whom the business hires and how readily people accept change.
    example:
      title: Flexi-time as a recruitment tool
      fictional: true
      text: 'Corran Mutual, a fictional insurer, could not fill eleven vacancies for claims handlers on fixed nine-to-five hours. It introduced flexi-time, with core hours of 10:00 to 15:00, and received three times as many applications in the next round, many from parents and carers. The change was an internal decision, made in response to an external pressure: rival employers already offered flexible hours.'
  - id: external-factors
    title: External factors in human resource planning
    kind: concept
    body: |
      Other influences come from outside the organization. It cannot control them, only forecast them and plan around them, and they can change quickly. The guide names four examples: demographic change, changes in labour mobility, immigration and the gig economy. Employment law, the state of the economy and technology in the wider world matter too. A STEEPLE analysis, one of the toolkit tools the guide suggests for this unit, is a systematic way to scan them.

      The external factors work mainly through the **supply of labour**: how many people with the right skills are available, where, and at what wage. A business in a region with an ageing population, little immigration and high employment will struggle to recruit, and will need to raise pay, train its own people, automate or move work elsewhere. One in a region with a young, growing population and high unemployment will find recruitment easier and cheaper.
    points:
      - term: Demographic change
        text: Changes in the size and make-up of the population, such as an ageing population, falling birth rates or more women in paid work. An ageing population means more retirements and fewer young people entering work, so businesses may need to retain and retrain older staff, offer flexible hours or recruit from further afield. It also changes demand, for example raising the need for care workers.
      - term: Labour mobility
        text: How easily workers move between occupations (occupational mobility) or between places (geographical mobility). High mobility makes vacancies easier to fill but also makes it easier for staff to leave for rivals. Housing costs, family ties and the need to retrain limit mobility; remote working has raised it for some jobs.
      - term: Immigration
        text: People moving into a country to live and work. It adds to the supply of labour and can fill skills shortages and seasonal peaks, but depends on government rules that can change, and brings costs such as work permits, language support and checking qualifications.
      - term: The gig economy
        text: A labour market in which many people work task by task, often through digital platforms, usually as self-employed contractors rather than employees. It gives businesses a pool of labour they can use when they need it, as the section on flexible work explains.
      - term: Employment law
        text: Minimum wages, limits on working hours, rules on contracts, discrimination, redundancy and consultation. A new law can change labour costs or the way a business may use flexible workers.
      - term: The economy and the labour market
        text: When unemployment is low, recruitment is harder, pay rises and more staff leave for other jobs; in a downturn, the reverse. Rivals' pay and conditions set what a business must offer.
      - term: Technology and social attitudes
        text: New tools make remote and flexible working possible and change which skills are scarce, while rising expectations of work-life balance change what employees ask for.
    example:
      title: Brennock's labour market
      fictional: true
      text: Brennock's town shows several external factors at once. A quarter of its staff are over 55 (demographic change), young people leave for the city and few move in (low geographical mobility into the town), and its night shift depends on agency workers found through an app (the gig economy). The government is reviewing the rules on seasonal work visas, which could cut the supply of workers from abroad on whom the town's farms and food factories rely (immigration). None of this is in Brennock's control, but all of it shapes how easily it can find 20 technicians.
  - id: flexible-work-and-the-gig-economy
    title: Flexi-time, flexible work and the gig economy
    kind: types
    body: |
      Two of the guide's examples, flexi-time and the gig economy, are both forms of flexibility, but they serve different purposes. Flexi-time gives **employees** some control over when they work, within a permanent job. Gig work gives the **business** flexibility over how much labour it buys, task by task, usually without employing the worker at all. Between the two lie many other arrangements, and most organizations use several.

      Flexibility helps an organization match its labour to demand, cut costs and recruit people who cannot work fixed full-time hours. Its costs are less visible: coordinating people who are rarely in the same place, weaker loyalty from workers who are not employees, and the training and quality control that a constantly changing workforce needs. Flexibility for the business can mean insecurity for the worker, which is why the gig economy raises ethical and legal questions as well as economic ones. In several countries, courts and governments have examined whether people who work through platforms are really self-employed or should have employees' rights.
    points:
      - term: Flexi-time
        text: Employees choose when to start and finish, within limits, provided they work during agreed core hours and complete their total hours. It can raise motivation and cut absence and lateness. It suits office and knowledge work better than jobs tied to a production line or fixed opening hours.
      - term: Part-time work and job sharing
        text: Jobs with fewer than full-time hours, or one full-time job split between two people. They widen the pool of applicants, for example to parents, carers and older workers, but need careful handovers.
      - term: Remote and hybrid working
        text: Working from home or elsewhere for some or all of the week. It saves office costs and lets a business recruit from a wider area, but makes supervision, training and teamwork harder.
      - term: Temporary and agency work
        text: Workers hired for a fixed period or supplied by an agency, to cover peaks, absences or projects. Quick to arrange and end, but usually dearer per hour and less committed.
      - term: Gig work
        text: Short tasks found and paid through digital platforms, by workers who are usually self-employed. It turns a fixed labour cost into a variable one, but the business has less control over quality, and the workers usually have no guaranteed hours, sick pay, holiday pay or pension.
    advantages:
      - Labour can be matched to demand, so the business pays for work only when it is needed.
      - A wider pool of applicants, including people who cannot work fixed full-time hours.
      - Flexi-time and remote work can raise motivation and retention, and save office space.
      - Gig and agency labour can be scaled up quickly for a peak or a new service.
    limitations:
      - Harder coordination, supervision and communication when people work at different times and places.
      - Gig and agency workers may be less loyal and less trained, which can affect quality and safety.
      - Insecure work raises ethical concerns and the risk of disputes or new laws on employment status.
      - Constant changes of staff add to induction and training costs.
    example:
      title: Two kinds of flexibility in one factory
      fictional: true
      text: Brennock's office staff work flexi-time, starting between 07:00 and 10:00, which helped it keep two experienced planners who care for elderly parents. Its night shift is topped up each week with eight to fifteen agency workers booked through an app. The first kind of flexibility serves employees and costs Brennock little. The second serves Brennock, but the agency workers receive only a short induction, and the night shift's error rate on labelling is twice the day shift's.
  - id: resistance-to-change
    title: Why people resist change at work
    kind: concept
    body: |
      **Resistance to change** is employees' reluctance to accept, or active opposition to, a change in how they work, such as new technology, a restructuring, new working hours or a move to another site. It is a normal human response, not a sign of a bad workforce, and it is often a sign that people expect to lose something they value.

      Resistance takes two forms. Some is **open**: complaints, petitions, grievances, refusals and, where employees are organized, industrial action (HL students study this in [2.7](/topics/industrial-employee-relations/)). Much is **hidden**: more absence, less effort, slow adoption of new methods, mistakes, and the quiet departure of people who can find work elsewhere, often the most skilled. Hidden resistance is harder to see and can do more damage, because managers think the change has been accepted.

      Resistance is not always irrational. Employees often know the work better than the managers planning the change, and their objections may reveal real flaws: a system that does not suit the task, a timetable that is too fast, or training that is too short. Treating every objection as obstruction throws that knowledge away.
    points:
      - term: Fear of the unknown
        text: People do not know what the change will mean for them, and uncertainty is uncomfortable, especially when information arrives through rumour.
      - term: Job security and pay
        text: Automation, restructuring or relocation can threaten jobs, hours, overtime or bonuses, the most powerful reasons of all.
      - term: Status, skills and power
        text: A change can make hard-won skills worthless, remove a supervisor's authority or break up a respected team.
      - term: Habit and comfort
        text: Familiar routines are easy; new ones take effort and bring the risk of looking incompetent while learning.
      - term: Poor communication and no consultation
        text: People told late, told little or not asked at all assume the worst and feel the change is being done to them rather than with them.
      - term: Low trust in management
        text: Where past changes went badly, or promises were broken, employees doubt the reasons they are given now.
      - term: Disagreement with the change
        text: Employees may believe, sometimes correctly, that the change is a mistake.
      - term: Change fatigue
        text: Too many changes in a short time exhaust people, so even a sensible change meets resistance.
      - term: 'Enrichment: Kotter and Schlesinger'
        text: 'In a widely taught 1979 article, John Kotter and Leonard Schlesinger grouped the reasons into four: self-interest (people expect to lose out), misunderstanding and a lack of trust, different assessments of whether the change makes sense, and a low tolerance for change. This framework is not named in the guide.'
    example:
      title: Reading the resistance at Brennock
      fictional: true
      text: |
        The signs at Brennock point to several causes at once. Packers fear for their jobs, since 60 packing roles will go (job security). Many have done the same work for over a decade and have never used automated equipment (skills and habit). They heard about the machines from a supplier's engineer, not from their managers (poor communication). And the rise in absence, with two line leaders looking elsewhere, is hidden resistance that will cost Brennock its most experienced people first.

        The platform's [Halden Distribution case](/cases/halden-distribution/) shows the same pattern in a warehouse, where new scanners introduced with two hours of training and no consultation were followed by rising errors and the departure of over half the night shift.
  - id: reducing-resistance
    title: HR strategies for reducing the impact of change and resistance to it
    kind: evaluation
    body: |
      The guide asks for strategies that reduce two things: the **impact** of change on employees, and their **resistance** to it. The two are linked. People resist less when the change hurts them less, and when they understand it, have shaped it and can see how they will cope with it.

      No strategy suits every situation. The right choice depends on why people are resisting, how urgent the change is, how much the organization needs employees' ideas and commitment, how much trust already exists, and what it can afford. Most successful changes combine several strategies, starting with communication and involvement and adding training, support and negotiated guarantees where jobs or skills are at stake. Coercion, forcing the change through with threats, is fast, but it buys compliance rather than commitment, damages trust for the next change, and can turn hidden resistance into open conflict.

      Timing matters too. Strategies that build understanding, such as early communication and consultation, must come *before* the decision is fixed, or they are seen as a sham. Strategies that reduce the impact, such as retraining, redeployment and support for anyone made redundant, run alongside the change and after it.
    points:
      - term: Communicate early and honestly
        text: Explain why the change is needed, what will happen, when, and what it means for each group, before rumours fill the gap. Cheap and essential, but it does not remove a real threat to jobs.
      - term: Consult and involve
        text: Ask employees how the change should work and let them shape its details, through meetings, working groups or representatives. People resist less what they have helped to design, and their knowledge improves the plan. It takes time, and it fails if the decision has already been made.
      - term: Train and support
        text: Training in new skills, coaching, and counselling for those who are anxious. It reduces fear of incompetence and builds confidence, but costs money and takes people away from their work.
      - term: Retrain and redeploy
        text: Move people whose jobs are going into new roles, with the training they need. It reduces the impact of change on jobs and keeps experienced staff, but there may not be enough suitable roles.
      - term: Negotiate incentives and guarantees
        text: Offer something in return, such as a bonus for new skills, a guarantee of no compulsory redundancies, or protected pay for a period. Effective where people stand to lose, but it can be expensive and may encourage resistance next time.
      - term: Introduce change in stages or pilot it
        text: Try the change in one team first, learn from it, and use the pilot team as champions. It lowers the risk of a failed change but slows it down.
      - term: Support people who leave
        text: Voluntary redundancy before compulsory redundancy, fair redundancy pay, and help to find new work. It reduces the harm to those affected and shows those who stay that they will be treated fairly.
      - term: Coercion, as a last resort
        text: Imposing the change and threatening those who resist. Quick when time is short, but it damages trust, morale and future cooperation, and drives the best people to leave.
      - term: 'Enrichment: Kotter and Schlesinger''s approaches'
        text: The same 1979 article set out six approaches, from education and communication, participation and involvement, and facilitation and support, through negotiation and agreement and manipulation and co-optation, to explicit and implicit coercion, and argued that the choice should match the reason for resistance and the urgency of the change. The first four match the strategies above; manipulation raises obvious ethical problems.
    advantages:
      - Communication, involvement and training are relatively cheap and build the trust that later changes need.
      - Retraining and redeployment keep experienced people and their knowledge of the business.
      - Strategies matched to the cause of resistance deal with it, rather than suppressing it.
    limitations:
      - Consultation and phased change take time, which a business in a crisis may not have.
      - Guarantees and incentives cost money and can raise expectations for future changes.
      - No strategy removes resistance when the change genuinely makes people worse off; it can only reduce and compensate.
    example:
      title: Retrain or replace?
      fictional: true
      text: |
        Brennock's new line needs 20 technicians and 60 fewer packers. The HR manager compares two ways of staffing it (simulated figures).

        - **Retrain and support:** train 20 packers as technicians at $3,000 each ($60,000); offer the other 40 packers voluntary redundancy at an average of $8,000, expecting 25 to accept ($200,000), and redeploy the other 15 into vacancies in the warehouse. Total: **$260,000**.
        - **Replace:** make all 60 packers redundant at $8,000 each ($480,000) and recruit 20 qualified technicians at a recruitment cost of $5,000 each ($100,000). Total: **$580,000**.

        Retraining is $320,000 cheaper, keeps people who know the products and the hygiene rules, and shows the rest of the workforce that the business looks after its people, which reduces resistance in its own right. Its risks are that some packers may not master the technical work, and that the line will run below speed while they learn. Announcing the plan early, with the line leaders involved in designing the training, would deal with the communication failure that has already happened.
  - id: force-field-analysis
    title: Force field analysis (HL toolkit)
    kind: framework
    level: HL
    body: |
      **Force field analysis** is an HL toolkit tool for planning a change, developed from the work of the psychologist Kurt Lewin. It sets out the **driving forces** that push for a change and the **restraining forces** that hold it back, so that managers can see whether the change is likely to succeed and what they could do to help it.

      The method has four steps. Describe the proposed change. List the driving and restraining forces. Give each force a score for its strength, commonly from 1 (weak) to 5 (strong), and add up each side. Then decide what to do: go ahead, strengthen the driving forces, weaken the restraining forces, or drop the change. Lewin's insight was that weakening a restraining force is often more effective than adding a driving one, because pushing harder tends to provoke more resistance, while removing a reason for resistance lets the change move on its own.

      The scores are judgements, not measurements, so the tool is most useful when the people involved discuss them together, which is itself a form of consultation. The diagram shows an example for a design agency considering a four-day working week.
    diagram: force-field
    advantages:
      - Makes the forces against a change visible, so they can be planned for rather than discovered too late.
      - Points to the restraining forces worth weakening, which links directly to HR strategies for reducing resistance.
      - Simple to draw and discuss, and building it with staff involves them in the change.
    limitations:
      - The scores are subjective, and different people would score the same forces differently.
      - Totals can hide one force that is decisive on its own, such as a legal requirement or a key client's refusal.
      - It shows the balance at one moment, while forces change as the change proceeds.
    example:
      title: Weakening the strongest restraint
      fictional: true
      text: |
        In the diagram, a fictional design agency scores the driving forces for a four-day week at 4 (better staff retention), 3 (easier recruitment) and 2 (fewer sick days), a total of **9**, and the restraining forces at 4 (clients expect five-day cover), 2 (rota and scheduling costs) and 2 (managers' doubts), a total of **8**. The change narrowly has the edge, which is not enough to rely on.

        The strongest restraint is client cover. If the agency staggers days off so that every client team is staffed five days a week, that force might fall from 4 to 2, and the restraining total from 8 to 6, against 9 on the driving side. Weakening one restraint does more than inventing new arguments for the change.
applications:
  - industry: Healthcare
    text: Ageing populations raise the demand for care while older nurses and doctors retire, so health systems plan years ahead and often recruit from abroad, which makes them sensitive to immigration rules. New digital records and rotas meet resistance from staff who are already stretched, so involving clinicians in their design matters.
  - industry: Hospitality and tourism
    text: Demand is seasonal and staff turnover is high, so hotels and restaurants rely on part-time, temporary, agency and gig workers and on mobile young workers, including from abroad. The HR plan is less about headcount than about recruiting and training quickly, every season.
  - industry: Manufacturing
    text: Automation creates surpluses in manual roles and shortages of technicians at the same time, so retraining and redeployment are central. Long-serving, often unionized workforces and the threat to jobs make resistance to change likely and consultation important.
  - industry: Technology
    text: Skills are scarce and mobile, so firms compete hard for talent, recruit across borders and use remote work and freelancers widely. Change is constant, which makes change fatigue a real risk and a culture that accepts change an asset.
  - industry: Retail
    text: Large part-time workforces work flexible shifts matched to footfall, and self-service and online ordering keep changing the work. Plans must cover seasonal peaks, such as the end-of-year holidays, with temporary staff.
  - industry: A social enterprise
    text: Limited funds and a mission-driven workforce, often including volunteers, mean pay cannot be the main tool. Purpose and involvement in decisions matter more, and change that seems to drift from the mission can meet strong resistance from committed staff.
stakeholders:
  - group: Employees
    text: Want security, fair pay, development and some control over their working time. Change that threatens jobs or skills affects them most directly, and flexibility that suits the business can mean insecurity for them.
  - group: Managers
    text: Line managers carry out most HR decisions and must lead their teams through change while keeping output up. They are often caught between directors' plans and employees' concerns.
  - group: Owners and shareholders
    text: Want labour costs controlled and productivity raised, which can favour automation, flexible labour and fast change. Their interest conflicts with employees' interest in security, though both lose if a badly managed change drives away key staff.
  - group: Employee representatives and trade unions
    text: Negotiate on pay, conditions and how change is introduced, and may resist redundancies. Involving them early can make change smoother; ignoring them can turn resistance into conflict (HL, [2.7](/topics/industrial-employee-relations/)).
  - group: Government
    text: Sets employment and immigration law, the minimum wage and often funds retraining. It wants high employment and fair treatment of workers, which can limit how far businesses rely on insecure work.
  - group: Customers
    text: Feel the effects of HR decisions through service quality. A poorly managed change, high staff turnover or untrained temporary staff can lower quality, while a well-planned workforce improves it.
evaluation:
  - A workforce plan is only as good as its forecasts. Demand for labour depends on sales and technology, and supply on people's choices to stay or leave, so plans need stated assumptions and frequent review, and they become less reliable the further ahead they look.
  - Flexibility is not free. Flexi-time, part-time roles and remote work can serve both sides, but gig and agency work shifts risk from the business to the worker. The savings must be weighed against weaker loyalty, lower quality and the ethical and legal questions insecure work raises.
  - Resistance carries information. Employees often understand the work better than the planners, so some resistance signals a flawed change. Listening can improve the plan as well as reduce opposition.
  - The best strategy depends on the cause and the situation. Communication answers misunderstanding, training answers fear of incompetence, guarantees answer threats to jobs, and coercion is a last resort when time is short. Matching the strategy to the cause is what turns a list into an evaluation.
  - Speed and commitment pull against each other. Consultation and phased change build commitment but take time; imposed change is fast but costly in trust, morale and the departure of the best people, costs that appear later and are easy to underestimate.
  - Context changes what works. Laws on consultation and redundancy, the strength of unions and national attitudes to authority differ between countries; at HL, Hofstede's cultural dimensions help to explain why. In an answer, apply each strategy to the business in the case rather than describing it in general.
decision:
  title: Staffing the claims team at Ashdown Insurance
  fictional: true
  brief: |
    Ashdown Insurance, a fictional insurer, is introducing software that sorts and checks routine claims automatically. Its claims team of 120 handlers will need to shrink by 30%, to 84, within two years, and it needs 8 new data specialists to run and monitor the system. About 14 handlers leave each year of their own accord. Each handler costs about $38,000 a year. The team is experienced and loyal, but rumours about the software have started, and a competitor has been recruiting Ashdown's best handlers.
  options:
    - label: Restructure quickly
      text: Announce the change, make 36 handlers compulsorily redundant within six months at an average cost of $12,000 each ($432,000), and recruit 8 data specialists from outside.
    - label: Shrink gradually and retrain
      text: Freeze recruitment, let natural wastage reduce the team (about 28 over two years), and retrain 8 handlers as data specialists at $5,000 each ($40,000). That leaves 120 − 28 − 8 = 84 handlers in two years, with no compulsory redundancies.
    - label: Pilot first
      text: Run the software for six months in one team of 20 volunteers, involve them in fixing its problems, and decide on the wider plan when the results are known.
  guidance: |
    Start with the trade-off between speed and commitment. **Option A** reaches the smaller team within six months, so the salary savings of about $1.37 million a year (36 × $38,000) begin almost at once, but it costs $432,000 in redundancy pay and confirms the rumours in the worst way. Survivors may lose trust, the competitor will find it easier to recruit Ashdown's best handlers, and the business loses experience just when the new software is most likely to make mistakes.

    **Option B** costs far less in redundancy pay and keeps people who know the claims, and the retrained specialists understand the work the software is doing. But its savings build up slowly over two years, it depends on about 14 handlers leaving each year, which may not happen if jobs elsewhere become scarce, and Ashdown cannot choose who leaves: the best handlers are the most likely to go. A recruitment freeze also stretches the team while it learns the new system.

    **Option C** tests whether the software works before the workforce is reshaped around it, and gives the change a group of employees who can vouch for it. It delays the savings and does not, on its own, answer the question of the 36 roles.

    A strong judgement may combine options, for example a pilot (C) followed by gradual reduction (B), with voluntary redundancy if wastage runs slow. Say what would change it: evidence on how reliable the software is, how fast handlers are really leaving, and whether the competitor's recruiting is targeting the people Ashdown can least afford to lose.
exam:
  - q: Define the term *human resource planning*.
    marks: 2
    command: define
    level: SL/HL
    paper: '1'
    answer: |
      A strong response gives a precise definition: forecasting how many employees, with which skills, an organization will need, comparing this with the workforce it will have, and planning how to close any gap, for example by recruiting, training, redeploying or reducing staff.

      - A full answer includes both the forecast of need and the plan to close the gap.
      - "Planning how many workers to recruit" is only partly right, because planning also covers skills, timing and reducing staff.
  - q: |
      Seabright Hotels, a fictional hotel group, employs 180 permanent staff. Next year it will open a new hotel that needs 60 more permanent staff. It expects 25 staff to resign and 5 to retire during the year. In the 12-week summer peak it also needs 40 extra staff across its hotels.

      Using the data, explain the size of the workforce gap Seabright must close next year, and **one** way it could close it.
    marks: 4
    command: explain
    level: SL/HL
    paper: '2'
    answer: |
      A strong response works out the gap from the data, then explains a suitable way to close it.

      - **Demand:** 180 + 60 = 240 permanent staff needed.
      - **Supply:** 180 − 25 − 5 = 150 still employed by the end of the year without action.
      - **Gap:** 240 − 150 = **90 permanent staff**, plus **40 temporary staff** for the 12-week peak.
      - **One way to close it, explained in context:** for example, recruit the 90 permanent staff partly from the local labour market and partly from abroad where the law allows, starting early because new hotel staff need training before opening; and cover the 40 peak roles with temporary or agency workers, or with gig workers booked through an app, because the need lasts only 12 weeks and permanent contracts would leave Seabright paying for staff it does not need for the rest of the year.

      A response that treats the 40 seasonal roles as permanent misses the point of the data.
  - q: Distinguish between flexi-time and gig work as ways of meeting a business's need for labour.
    marks: 4
    command: distinguish
    level: SL/HL
    paper: '1'
    answer: |
      A strong response makes clear differences, rather than describing each in turn.

      - **Who the flexibility serves:** flexi-time gives *employees* control over when they work, within agreed core hours; gig work gives the *business* control over how much labour it buys, task by task.
      - **Employment status:** flexi-time workers are usually permanent employees with employees' rights; gig workers are usually self-employed contractors without guaranteed hours, sick pay or holiday pay.
      - **Effect on costs and planning:** flexi-time does not change the size of the workforce, while gig work turns part of labour cost from fixed to variable and lets the business scale up and down quickly.
      - Application to an example business strengthens the answer.
  - q: Fenwick Engineering, a fictional firm with 85 design engineers, is replacing its drawing software with a system that automates routine drafting, and expects to need 15 fewer drafting roles within a year. Engineers heard about the change through rumours, and many have used the old software for over a decade. Explain **two** reasons why Fenwick's engineers might resist the change.
    marks: 4
    command: explain
    level: SL/HL
    paper: '1'
    answer: |
      A strong response gives two distinct reasons, each explained and linked to the case. For example:

      - **Job security:** 15 drafting roles will go, so engineers fear redundancy, and without information each assumes the worst for themselves.
      - **Loss of skills and habit:** engineers with a decade on the old software lose the expertise that gave them status, and fear looking incompetent while learning the new system.
      - **Poor communication:** hearing about the change through rumours breeds distrust and suggests the decision was made without them.

      Two reasons, each with an explanation and application, reach the top of the range; a list of four reasons without explanation does not.
  - q: Evaluate **two** human resource strategies that Fenwick Engineering could use to reduce resistance to the change.
    marks: 10
    command: evaluate
    level: SL/HL
    paper: '1'
    answer: |
      A strong response chooses two strategies that fit the causes of resistance in the case, weighs the strengths and limitations of each, and reaches a supported judgement. For example:

      - **Communication and consultation:** explaining why the software is needed and inviting engineers to shape how it is introduced answers the rumours and the sense of exclusion, and their expertise could improve the rollout. It is cheap, but it cannot remove the fear of redundancy on its own, and it fails if the decision on the 15 roles is already fixed and presented as open.
      - **Retraining with a guarantee on compulsory redundancies:** training engineers in the new system answers the fear of incompetence, and reducing the 15 roles through natural wastage, redeployment and voluntary redundancy answers the threat to jobs. It costs money and time, the business cannot choose who leaves, and some engineers may never adapt.
      - **Judgement:** for example, that the two work best together, because the causes of resistance are both misunderstanding and a real threat to jobs: communication first, before the plan is fixed, then training and a no-compulsory-redundancy commitment. The judgement depends on how quickly Fenwick needs the savings and how many engineers leave of their own accord.
      - **Limits:** the case does not say how fast staff usually leave, or whether the software has been tested.

      The teacher support material advises that when evaluating two options, a response gives at least one argument for and one against each, applied to the case, and a conclusion that does more than repeat them (pp. 56 and 60).
  - q: |
      (HL) Fenwick's managers score the forces for and against the change from 1 (weak) to 5 (strong). Driving forces: lower costs (4), faster delivery to clients (3), clients asking for the new file format (3). Restraining forces: fear of job losses (5), loss of familiar skills (3), cost of training (2).

      Apply force field analysis to the change, and explain which force managers should address first.
    marks: 4
    command: apply
    level: HL
    paper: '2'
    answer: |
      A strong response totals both sides, interprets the balance and chooses a force to act on, with a reason.

      - **Totals:** driving 4 + 3 + 3 = **10**; restraining 5 + 3 + 2 = **10**. The forces are balanced, so the change is likely to stall or meet strong resistance if pushed through as it stands.
      - **Which force first:** the strongest restraint, fear of job losses (5). Weakening it, for example with a commitment to reduce the 15 roles through natural wastage, redeployment and voluntary redundancy rather than compulsory redundancy, could bring it down to about 2, making the restraining total 7 against 10.
      - **Why weaken rather than push:** adding pressure for the change, such as stressing the cost savings, may increase the fear of job losses; removing the reason for resistance lets the change proceed.
      - A top response notes that the scores are judgements and could be tested by consulting the engineers.
summary:
  - '**Human resource management** is managing people so they help the organization meet its objectives: planning, recruiting, training, rewarding, looking after them and managing their departure. Line managers do much of it.'
  - '**Human resource planning** forecasts the demand for labour, audits the supply, finds the gap and plans to close it: recruit, train, redeploy, use flexible labour, or reduce through natural wastage or redundancy.'
  - Internal factors include objectives and strategy, finance, technology and automation, working patterns such as flexi-time, the current workforce, and structure and culture.
  - External factors include demographic change, labour mobility, immigration and the gig economy, plus employment law, the economy, technology and social attitudes. They work mainly through the supply of labour.
  - Flexi-time gives employees flexibility within a job; gig work gives the business flexibility over how much labour it buys, at the cost of security for the worker.
  - People resist change through fear of the unknown, threats to jobs, pay, status or skills, habit, poor communication, low trust, disagreement and change fatigue. Resistance can be open or hidden, and is not always wrong.
  - HR strategies reduce both the impact of change and resistance to it, through communication, consultation, training, retraining and redeployment, negotiated guarantees, piloting, support for those who leave and, as a last resort, coercion.
  - The right strategy depends on the cause of resistance, the urgency, the trust that exists and the cost; most changes need several.
  - At HL, force field analysis weighs driving against restraining forces; weakening a restraint often works better than pushing harder.
connections:
  - code: '2.4'
    text: Recruitment, training and rewards carry out the workforce plan, and change imposed without consultation is a common cause of demotivation.
  - code: '2.2'
    text: Restructuring and delayering are changes that meet resistance, and flexible work reshapes structures; at HL, Handy's Shamrock Organization describes a flexible labour force.
  - code: '2.3'
    text: The leadership style used to introduce change, from autocratic to democratic, shapes how much resistance it meets.
  - code: '2.6'
    text: Early, honest communication through the right channels is the first strategy for reducing resistance, and rumours fill any gap it leaves.
  - code: '1.3'
    text: The workforce plan starts from the organization's objectives, and ethical objectives shape how it treats people affected by change.
  - code: '2.7'
    text: At HL, change imposed without consultation, especially redundancy, is a common source of conflict between employees and employers.

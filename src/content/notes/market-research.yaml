# Notes: 4.4 Market research. Written in the platform's own words from the
# guide's five content statements (p. 31): why and how organizations carry out
# market research (AO3), the four primary and five secondary methods the guide
# names, qualitative and quantitative research, and quota, random and
# convenience sampling (all AO2). Descriptive statistics, a toolkit tool for
# unit 4 (pp. 14 and 30), is used to analyse quantitative results; the guide's
# formula list (pp. 64 to 65) gives no formulas for it. The rule of thumb for
# the margin of error of a random sample is enrichment beyond the guide, and is
# labelled so. The teacher support material's glossary (p. 89) was read to
# check the definition of sampling; nothing from it is reproduced. No coursebook
# chapter for unit 4 was supplied. Avonmere Leisure Centre is fictional, and
# every figure was checked by script.
code: '4.4'
title: Market research
level: SL/HL
introduction: |
  Every marketing decision is a bet on how customers will behave, and **market research** is how a business improves its odds. Done well, it tells a business who its customers are, what they want and how they will respond before money is committed; done badly, it gives false confidence, which can be worse than no evidence at all.

  This subtopic covers why and how organizations research their markets, which the guide sets at AO3, so you must be able to judge research as well as describe it. It also covers the four primary and five secondary methods the guide names, the difference between qualitative and quantitative research, and the three sampling methods. Case studies often hand you a piece of research to criticize: who was asked, how, and whether the answer can be trusted.
objectives:
  - '**Evaluate** why organizations carry out market research, and how well a given piece of research supports a decision.'
  - '**Explain** the research process, from defining the problem to acting on the findings.'
  - '**Explain** the four methods of primary research and the five sources of secondary research in the guide, with the strengths and weaknesses of each.'
  - '**Distinguish** between qualitative and quantitative research, and **calculate** the mean, median and mode of quantitative results.'
  - '**Distinguish** between quota, random and convenience sampling, and **apply** them to a research plan.'
situation:
  title: Eighty-two per cent said yes
  fictional: true
  text: |
    Avonmere Leisure Centre, a fictional business, runs a pool and gym in a town of about 40,000 adults. Its manager, Priya Nair, wants to open the pool at 6 a.m. on weekdays for people who swim before work. Extra lifeguards, heating and lighting would cost about $57,200 a year, so she ran a quick poll on the centre's social media page: "Would you use the pool if we opened at 6 a.m.?" Within a week 400 people had replied, and 82% said yes.

    At the board meeting the chair was not convinced. Who had answered? Mostly current members who follow the page, many of them young. Would people who said yes to a free question really get up at 5.30 on a wet Tuesday? And what about the thousands of adults in the town who never use the centre at all?

    Priya has a month to come back with better evidence. What research should she carry out, and how far could the board trust the answer?
sections:
  - id: why-research
    title: Why organizations carry out market research
    kind: concept
    body: |
      **Market research** is the systematic gathering and analysis of information about customers, competitors and markets to help a business make marketing decisions. It is how a market-oriented business (4.1) finds out what customers want, and it supports almost every other marketing decision: which segments to target and how to position a product (4.2), which price, promotion and distribution to choose (4.5), and, at HL, how much the business is likely to sell (4.3).

      Its main purpose is to reduce risk. Launching a product, entering a market or changing a price all commit money before anyone knows how customers will respond, and research replaces some of the guessing with evidence. It also has a monitoring role after a decision: tracking sales, satisfaction and brand awareness shows whether a campaign or a new product is working while there is still time to change it. For a start-up, research is often the only evidence it can show a bank or an investor that customers exist (1.1).

      The guide sets this statement at AO3, so you must be able to judge research, not just describe it. Its value depends on the decision it supports. Research is worth most when a decision is expensive, hard to reverse and genuinely uncertain, and worth least when the decision is cheap, easily undone, or so urgent that the answer would arrive too late. Even good research only narrows uncertainty: customers change their minds, rivals react and the future differs from the past.
    points:
      - term: Understanding customers
        text: What customers need and want, why they buy, and what stops them buying. This is the starting point of market orientation.
      - term: Measuring the market
        text: Its size, its growth and the shares of rival businesses (4.1), and the trends that will change them.
      - term: Finding segments and gaps
        text: Groups of customers with distinct needs, and needs that no rival meets well, which feed segmentation and position maps (4.2).
      - term: Testing before committing
        text: Trying products, prices, packaging and advertisements on customers before a full launch, while changes are still cheap.
      - term: Watching competitors
        text: Rivals' prices, products and promotions, and how customers see them.
      - term: Monitoring results
        text: Sales, satisfaction and brand awareness after a decision, to check that it is working.
    example:
      title: Three questions for Avonmere
      fictional: true
      text: |
        Avonmere Leisure Centre has three questions it could research this year. Would enough people use the pool at 6 a.m. to cover the $57,200 a year it would cost? Would a café attract visitors who do not swim? And why did 410 members cancel their membership last year?

        The first is a large, uncertain decision that is hard to reverse once lifeguards are hired, so it deserves careful research. The third needs research of a different kind, not counting but understanding, by asking former members why they left.
  - id: how-research
    title: How organizations carry out market research
    kind: method
    body: |
      Good research starts with a decision, not with a questionnaire. A business first defines the problem and the information it needs, then looks for that information in the cheapest place, and only then designs research of its own. A typical sequence:

      1. **Define the problem and the objectives:** the decision the research must support, and what the business needs to know to make it.
      2. **Search existing sources first:** published and internal data that may already answer part of the question (secondary research).
      3. **Design primary research for the gaps:** choose the method, the sample and the questions, and decide whether qualitative or quantitative evidence is needed.
      4. **Test the design:** try the questionnaire or discussion guide on a few people first, a pilot, to find questions that confuse or lead.
      5. **Collect the data**, in person, by phone or online.
      6. **Analyse the results:** summarize quantitative data with descriptive statistics and charts, and look for themes in qualitative data.
      7. **Report and act:** present the findings with their limitations, make the decision, and monitor what happens.

      The budget and the time should match the size of the decision. A small business deciding on a new flavour of ice cream may rely on secondary data, a few conversations and a trial batch; a manufacturer about to build a new factory may commission months of research. Spending more on research than the decision is worth, or researching until a rival has already acted, is a failure of judgement too.
    points:
      - term: Desk research and field research
        text: Everyday names for secondary and primary research. Desk research uses data that already exist; field research goes out to collect new data. Desk research usually comes first because it is quicker and cheaper.
      - term: A pilot
        text: A small trial run of a questionnaire or interview on a few people, to find unclear or leading questions before the full study.
      - term: In-house or agency
        text: Research done by the business's own staff is cheaper and keeps the findings confidential. A specialist agency brings expertise, larger samples and an outsider's objectivity, at a price.
      - term: Ethics and data protection
        text: Participants should know who is asking and why, take part by choice, and be able to trust that their personal data will be kept securely and used only for the purpose they were told, as data protection laws in many countries require. Research with children or vulnerable people needs extra care, and research must never be a disguise for selling.
    example:
      title: Priya's research plan
      fictional: true
      text: |
        Priya starts with the decision: open at 6 a.m. on weekdays or not, and the evidence that would justify $57,200 a year.

        Desk research comes first. The government census shows how many adults of each age live in the town, the council's published survey of sport and exercise shows how many of them swim, and rival pools' websites show that none opens before 7 a.m. Only then does she design primary research for the gap these sources leave: whether enough of Avonmere's own potential customers would really come at 6 a.m.
  - id: primary-research
    title: 'Primary research: surveys, interviews, focus groups and observations'
    kind: types
    body: |
      **Primary research** collects new data first-hand for a specific purpose. Its great advantage is fit: the business asks exactly the questions it needs answered, of exactly the people it cares about, and the findings are up to date and its own, so rivals do not see them. Its disadvantages are cost and time, and the skill needed to avoid misleading results. The guide names four methods.

      The methods differ in what they can reveal. **Surveys** and **observations** can cover many people and produce numbers; **interviews** and **focus groups** reach fewer people but explain the reasons behind the numbers. They also differ in whether they record what people *say* or what they *do*. Surveys, interviews and focus groups all rely on what people report, which can differ from how they behave, especially when a question is hypothetical or has a socially approved answer. Observation records behaviour directly but cannot say why it happens. Many studies therefore combine methods: a survey to measure, and a few interviews to explain.
    points:
      - term: Surveys
        text: The same set of questions asked of many people, on paper, online, by phone or face to face. **Closed questions** (yes or no, a list of options, a rating scale) produce quantitative data that are easy to count; **open questions** let people answer in their own words. Surveys reach many people cheaply, especially online, but response rates can be low, the people who choose to reply may differ from those who do not, and leading or unclear questions distort the answers.
      - term: Interviews
        text: A researcher questions one person at a time, face to face, by phone or online. A structured interview follows a fixed script; an in-depth interview follows up on answers to explore reasons and feelings. Interviews give depth and flexibility and suit sensitive topics and business buyers, but they are slow and expensive per person, so samples are small, and the interviewer's manner can influence the answers.
      - term: Focus groups
        text: A small group, often six to ten people, discusses a product, an idea or an advertisement, guided by a moderator. Ideas build on one another, and the business can watch reactions to prototypes. But a few confident voices can dominate, members may go along with the group, the sample is too small to measure anything, and the results depend on the moderator's skill.
      - term: Observations
        text: Watching and recording what people actually do, such as counting customers, following how shoppers move around a store, watching how a product is used, or posing as a customer (mystery shopping). Observation avoids the gap between what people say and what they do, and online records of clicks and purchases now allow it on a huge scale. It cannot explain why people behave as they do, people who know they are watched may act differently, and watching people raises questions of privacy and consent.
    diagram: market-research-methods
    advantages:
      - Fits the business's exact question and target customers.
      - Up to date, and collected in a way the business controls.
      - Confidential, so competitors do not see the findings.
      - Can explore reasons and reactions as well as numbers.
    limitations:
      - Expensive and slow compared with secondary research.
      - Needs skill to design questions and choose samples without bias.
      - Small samples may not represent the market.
      - What people say can differ from what they actually do.
    example:
      title: Avonmere's four methods
      fictional: true
      text: |
        Priya could use all four. A **survey** of town residents could ask how often they swim and whether they would come at 6 a.m. **Interviews** with a few shift workers and parents could explore what would make an early swim possible for them. A **focus group** of local runners and cyclists could react to a proposed early timetable and price.

        **Observation** is possible at once: staff could count how many people queue at the door before the 7 a.m. opening each morning. A queue shows that demand exists without anyone being asked, although it cannot say how many more would come an hour earlier.
  - id: secondary-research
    title: 'Secondary research: market analyses, journals, government data, media and online content'
    kind: types
    body: |
      **Secondary research** uses data that someone else has already collected for another purpose. It usually comes first, because it is quicker and cheaper than collecting new data and may answer part of the question at once. Much of it is free, and some, such as a national census, covers far more people than any business could survey itself.

      Its weakness is that it was not designed for the business's decision. It may describe a wider market, a different country or a period that has passed; its methods may be unknown; and anything published is available to competitors too. Before using a source, ask who produced it, for what purpose, when, and how. A report paid for by an industry association may present its industry favourably, and a figure with no stated method is hard to trust. Checking one source against another, known as triangulation, is the best protection.

      The guide names five external sources, below. A business also holds its own records, such as sales figures, customer accounts and loyalty card data. These are often counted as internal secondary data, because they were collected to run the business rather than for research, and they can be the cheapest and most revealing source of all.
    points:
      - term: Market analyses
        text: Published studies of a market by specialist research firms, covering its size, growth, trends, competitors and customers. Detailed and professional, but often expensive, and written for a whole industry rather than one business.
      - term: Academic journals
        text: Research articles by university researchers and other experts, checked by independent experts before publication. Rigorous and good for understanding consumer behaviour or a trend in depth, but often theoretical, slow to appear and sometimes costly to read.
      - term: Government publications
        text: Censuses, surveys of household income and spending, trade figures and other official statistics. Usually free, based on very large samples and reliable, but they can be several years old and too broad for a small local market.
      - term: Media articles
        text: Newspaper, magazine, broadcast and online news reports on markets, competitors and trends. Current and easy to find, but they may simplify, rely on a single source or favour a dramatic angle, so check them against other sources.
      - term: Online content
        text: Competitors' websites, customer reviews, social media posts, forums and blogs. Cheap, current and revealing about customers' opinions, but unrepresentative, because people with strong views post most, and sometimes fake or of unknown origin.
    advantages:
      - Quick and cheap, and often free.
      - Some sources, such as government statistics, cover very large samples.
      - Shows trends over time and the shape of the wider market.
      - Helps the business design better primary research.
    limitations:
      - Collected for another purpose, so it may not fit the question.
      - May be out of date, or describe a different market.
      - Its method and accuracy can be unknown, and some sources are biased.
      - Available to competitors, so it gives no advantage on its own.
    example:
      title: What Avonmere can learn without asking anyone
      fictional: true
      text: |
        From the census, Priya learns that the town has about 40,000 adults: 11,200 aged 18 to 34, 15,200 aged 35 to 54 and 13,600 aged 55 and over. Avonmere's own membership records show 3,200 members, 8% of the town's adults. A media article reports a national rise in early-morning exercise, and rival pools' websites show that none opens before 7 a.m. A market analysis of the leisure industry would cost more than she can spend.

        None of this says whether Avonmere's customers would come at 6 a.m. But it shows who lives in the town, it suggests that an early slot would face no local rival, and it gives Priya the figures she needs to choose a sample.
  - id: qualitative-and-quantitative
    title: Qualitative and quantitative research
    kind: concept
    body: |
      **Quantitative research** collects numerical data: how many people buy, how often, at what price, and what share of customers prefer one option to another. It usually needs large samples and closed questions, and its results can be summarized statistically and compared over time. **Qualitative research** collects non-numerical information about opinions, feelings and motives: why customers buy, what they think of a brand, how they react to an idea. It works with small samples and open questions, and its results are interpreted rather than counted.

      Each answers a question the other cannot. Quantitative research says *how many* and *how much* but not *why*; qualitative research explains *why* but not how common a view is. Both can come from primary or secondary research, as the grid in the primary research section shows: a survey with closed questions is primary and quantitative, a published government statistic is secondary and quantitative, and online reviews are secondary and qualitative. Businesses often use the two in sequence: qualitative research first, to discover what matters to customers and which questions to ask, then quantitative research to measure how widely those views are held; or numbers first, to spot a pattern, and interviews afterwards to explain it.

      Quantitative results are summarized with the toolkit's **descriptive statistics**: the mean, median and mode, measures of spread such as the range, and charts such as bar charts and pie charts. Choosing the right summary matters. The mean uses every value, so one extreme answer can pull it a long way; the median, the middle value, is not moved by extremes; the mode shows the most common answer. The diagram applies all of them to eleven weeks of a fictional shop's sales.
    points:
      - term: What each collects
        text: '**Quantitative:** numbers, from closed questions, counts and sales data. **Qualitative:** words, opinions and reasons, from open questions, interviews and focus groups.'
      - term: Typical sample
        text: '**Quantitative:** large, so that the results can stand for the population. **Qualitative:** small, because each response is explored in depth.'
      - term: Main strength
        text: '**Quantitative:** measurable, comparable and easy to summarize in charts. **Qualitative:** rich, explains motives and reveals ideas the researcher did not expect.'
      - term: Main weakness
        text: "**Quantitative:** shows what, not why, and is limited by the questions asked. **Qualitative:** slow to analyse, hard to generalize, and open to the researcher's interpretation."
    formulas:
      - name: Mean
        expression: Mean = total of the values ÷ number of values
      - name: Median
        expression: Median = the middle value when the values are in order
        note: With an even number of values, the median is the mean of the two middle values. Descriptive statistics is a toolkit tool (guide, p. 14); the guide's formula list gives no formulas for it.
    diagram: descriptive-statistics
    example:
      title: What would an early swim be worth?
      fictional: true
      text: |
        Priya pilots her questionnaire on nine people, asking how much they would pay for one early swim. Their answers, in order: $4, $4, $5, $5, $5, $6, $6, $8 and $20.

        - **Mean:** total $63 ÷ 9 = **$7.00**.
        - **Median:** the fifth of the nine values in order = **$5**.
        - **Mode:** the most common answer = **$5**.

        The mean is pulled up by one answer of $20, from someone who, it turns out, thought the question meant a month of early swims. Without that answer, the mean of the other eight is $43 ÷ 8 = $5.38. The median and the mode are the better guide here, and the stray answer shows why a pilot is worth running: the question needs rewording before the real survey. The numbers say what people would pay; they do not say why, which is a question for interviews.
  - id: sampling
    title: 'Sampling: quota, random and convenience'
    kind: method
    body: |
      Most research cannot ask everyone. The **population** is the whole group a business wants to learn about, such as all the adults in a town or all its customers; a **sample** is the smaller group actually asked. A sample is useful only if it represents the population, so that what is true of the sample is likely to be true of the whole.

      Two things can make a sample's results differ from the truth. **Sampling error** is the chance difference that arises because only some people were asked, and it shrinks as the sample grows. **Bias** is a systematic distortion: a sample that leaves out or over-represents certain groups, or questions that push people towards an answer. Bias does not shrink with a larger sample. A biased survey of 10,000 people is as misleading as a biased survey of 100, only more expensive, so choosing how to sample matters as much as choosing how many to ask.

      The guide names three methods. In practice the choice depends on whether a full list of the population exists, on the budget and the time available, and on how accurate the decision needs the results to be.
    points:
      - term: Random sampling
        text: Every member of the population has an equal chance of being chosen, for example by software picking names from a complete list, the **sampling frame**. Because the researcher does not choose who is asked, selection bias is avoided and the results are the most likely to be representative, especially from a large sample. It needs a complete, up-to-date list, which often does not exist; the people chosen may be hard to reach or may refuse; and a small random sample can still miss a group by chance.
      - term: Quota sampling
        text: The population is divided into groups, such as age bands, and the researcher must question a set number from each, usually in proportion to the group's size. It guarantees that every important group is represented, needs no full list, and is quicker and cheaper than random sampling. But within each quota the interviewer chooses whom to ask, perhaps the most approachable people in the busiest street, so it is not random and can still be biased.
      - term: Convenience sampling
        text: Whoever is easiest to reach, such as passers-by, friends, customers already in the shop, or followers who answer an online poll. It is the quickest and cheapest method and is useful for testing a questionnaire or getting a first reaction to an idea, but it is the least likely to represent the population, and people who choose to answer often differ from those who do not.
      - term: 'Sample size: a rule of thumb (enrichment)'
        text: Beyond the guide, statistics gives a rule of thumb for random samples. If half of a random sample of 400 says yes, the true figure for the population is likely, 95 times in 100, to lie within about 4.9 percentage points of 50%; for a sample of 100 the margin is about 9.8 points. Quadrupling the sample halves the margin. The rule holds only for random samples, and no sample size cures bias.
    diagram: sampling-methods
    example:
      title: Choosing Avonmere's sample
      fictional: true
      text: |
        **The poll.** Priya's social media poll was a convenience sample of people who follow the centre's page and chose to answer. Of its 400 respondents, 91% were members, although members are only 8% of the town's adults, and 59% were aged 18 to 34, against 28% of the town. Whatever the 82% figure means, it is not the town's view.

        **A quota sample.** To survey 500 of the town's 40,000 adults in proportion to their ages, the quotas are:

        - 18 to 34: 11,200 ÷ 40,000 × 500 = **140** people.
        - 35 to 54: 15,200 ÷ 40,000 × 500 = **190** people.
        - 55 and over: 13,600 ÷ 40,000 × 500 = **170** people.

        **A random sample of members.** To learn what members think, Priya can use the membership list of 3,200 as a sampling frame and let software pick 320 at random, giving every member the same 1 in 10 chance of being asked.
  - id: trusting-research
    title: How far to trust market research
    kind: evaluation
    body: |
      Good research is **reliable**, meaning the same research repeated would give similar results, and **valid**, meaning it measures what it claims to measure. Research can be reliable without being valid. Ask thousands of people whether they would use a new service and they may answer consistently, yet many of them will never use it. Judging research means asking where its results could have gone wrong.

      The commonest weaknesses are a sample that does not represent the market; questions that lead, confuse or invite the answer people think is wanted; interviewers who influence the answers; and the gap between what people say and what they do, which is widest for hypothetical questions that cost the respondent nothing. Timing matters too: in a fast-changing market, research can be out of date by the time it is acted on.

      Research is also a cost to weigh against its value. Sometimes the best evidence comes not from asking at all but from a small, real test, such as a trial, a launch in one area, or a new price tried in a few stores, which measures behaviour rather than intentions. The strongest evidence usually combines sources: secondary data to frame the question, qualitative research to understand it, and quantitative research or a trial to measure it.
    advantages:
      - Reduces the risk of costly mistakes, such as launching a product few people want.
      - Keeps the business close to changing customer needs and to rivals' moves.
      - Gives managers, lenders and investors evidence to act on.
      - Measures the effect of decisions, so the business can learn and adjust.
    limitations:
      - Costs money and time, which a small business may not have.
      - Results can be biased or invalid, and false confidence in them can be worse than none.
      - Customers cannot always predict their own behaviour, or imagine something genuinely new.
      - Brings ethical duties of consent, privacy and honesty towards participants.
    example:
      title: The poll reconsidered
      fictional: true
      text: |
        Priya's poll fails on several counts. Its sample chose itself and leaned towards young members. Its question was hypothetical and free to answer yes to, since it mentioned neither a price nor what a 6 a.m. start means on a winter morning. And it measured what people say, not what they do. The board was right to doubt it.

        A stronger design uses the census to set quotas, a short survey of a quota sample to measure interest across the town, a few interviews to understand who would really come and why, and, before committing $57,200 a year, a trial that counts the people who actually turn up.
applications:
  - industry: Supermarkets
    text: Loyalty cards and till records give supermarkets internal data on millions of purchases, quantitative research on a scale no survey could match. They observe how shoppers move through stores and test prices or layouts in a few branches before changing them everywhere. Surveys and focus groups fill in what the data cannot show, such as why shoppers switch to a rival.
  - industry: Technology
    text: Apps and websites record every click, so observation happens continuously, and firms show two versions of a page to different users to see which works better. Early users who volunteer to test new features are a convenience sample of enthusiasts, useful for finding faults but a poor guide to how ordinary users will react.
  - industry: Hospitality
    text: Hotels and restaurants read online reviews as a constant stream of secondary, qualitative data, and use mystery guests to observe service as a customer experiences it. Budgets are usually small, so secondary research and short guest surveys do most of the work.
  - industry: Manufacturing for other businesses
    text: A manufacturer selling components to a few dozen large customers gains little from sampling, because it can talk to almost all of them. In-depth interviews with buyers and engineers, and market analyses from industry bodies, matter more than surveys.
  - industry: Social enterprise
    text: Government publications measure the size of the need it exists to meet, and interviews and focus groups with the people it serves shape what it offers. Research with vulnerable people needs particular care over consent and privacy, and tight budgets push it towards free secondary data and small qualitative studies.
stakeholders:
  - group: Customers and respondents
    text: Benefit from products and services that fit their needs, but give their time and their personal data. They expect to be told why data are collected and to have them kept safely, and research that feels intrusive or manipulative damages their trust in the business.
  - group: Managers
    text: Gain evidence for their decisions and a defence if things go wrong. The risk is commissioning research to confirm a decision already made, or reading the results selectively.
  - group: Owners, lenders and investors
    text: Want evidence that demand exists before they commit money, especially in a start-up's business plan. They also want research to be worth its cost, which can bring them into conflict with marketing managers seeking larger budgets.
  - group: Employees
    text: Front-line staff see customers every day and are a cheap source of insight. Research findings can change their work, as early opening would change lifeguards' shifts, so employees may resist conclusions that cost them, a conflict between what customers want and staff's working conditions.
  - group: Government
    text: Publishes much of the secondary data businesses rely on, such as census and spending statistics, and sets the data protection rules that research must follow.
evaluation:
  - Research reduces risk but never removes it. It describes what people think and do now; customers change their minds, rivals react and markets move, so a decision built on research can still fail.
  - How a sample is chosen matters more than how large it is. A large biased sample is worse than a small random one, because it gives false confidence, so in a case always ask who was asked and who was left out.
  - What people say is not what they do. Answers to hypothetical questions overstate demand, especially when saying yes costs nothing, so evidence of behaviour, from sales data, observation or a trial, is stronger where it can be had.
  - Research must be worth its cost. It pays for itself when a decision is expensive, uncertain and hard to reverse; for cheap decisions that are easy to undo, a quick test or plain judgement may be better value, and slow research can miss the moment.
  - No single method is enough. Secondary data frame the question, qualitative research explains it and quantitative research measures it; strong conclusions come from combining them.
  - Research has ethical limits. Consent, privacy and honesty with participants are obligations, not options, and data collected for one purpose should not quietly be used for another.
decision:
  title: How should Avonmere find out?
  fictional: true
  brief: |
    Avonmere Leisure Centre, a fictional business, must decide whether to open its pool at 6 a.m. on weekdays. Each early session would cost about $220 in lifeguards, heating and lighting, or $57,200 a year for 260 weekday mornings. The board wants early opening to pay its way, which at the $5 visitor price means about 44 extra paying swims each morning.

    The social media poll is not good enough evidence, and Priya has three ways to get better evidence.
  options:
    - label: A quick online survey of members
      text: Email a ten-question survey to all 3,200 members and repost it on social media. Cost about $300; results in two weeks.
    - label: An agency study of the town
      text: A research agency surveys a quota sample of 500 adults across the town, in proportion to their ages, and runs two focus groups. Cost $9,500; results in six weeks.
    - label: A twelve-week trial
      text: Open at 6 a.m. on Tuesdays and Thursdays for twelve weeks, count every early swimmer, and ask each one three questions on the way out. Cost 24 mornings × $220 = $5,280; results in three months.
  guidance: |
    Start with what the board needs to know: not whether people like the idea, but whether about 44 extra paying swimmers would turn up each morning, including people who are not members now. Then weigh each option's evidence against its cost and its speed.

    Option A is cheap and fast, but it repeats the poll's main flaw in a milder form: it asks only members, who are 8% of the town's adults, and only those who choose to reply. It is useful for testing the questions, not for making the decision. Option B is the only one that reaches the whole town in proportion, and its focus groups would explain what makes an early swim possible or impossible. But it still measures intentions, and people overstate what they will do at 6 a.m. Its cost of $9,500 is about a sixth of a year's running cost.

    Option C measures behaviour, the strongest evidence for this decision, for less than a tenth of a year's cost, and the trial itself starts to build the habit. Its weaknesses are time, the limits of testing two days in one season, and a slow start while word spreads. If the trial averaged 31 swimmers a morning, each session would lose about $65 at $5 a swim, a clear warning; if it averaged 50, the case would be strong. A good answer might combine C with free secondary data or a smaller survey, and should say what result would change the decision.
exam:
  - q: Define the term *secondary research*.
    marks: 2
    command: define
    paper: '1'
    answer: |
      A precise definition: research that uses data already collected by someone else, for another purpose, such as government statistics, market analyses or online reviews.

      A full answer makes both points, that the data already exist and that they were gathered for a different purpose. "Research from the internet" is too narrow and does not define the term.
  - q: Distinguish between qualitative and quantitative research, with reference to Avonmere Leisure Centre.
    marks: 4
    command: distinguish
    paper: '1'
    answer: |
      A strong answer defines both and makes the difference explicit, applied to the case:

      - Quantitative research collects numerical data, such as the number of town residents who say they would swim at 6 a.m., from a large sample with closed questions, and can be summarized statistically.
      - Qualitative research collects opinions and reasons, such as why shift workers find early swimming hard, from a small number of interviews or a focus group with open questions.
      - The key difference: quantitative research measures how many; qualitative research explains why. Avonmere needs both, to measure demand and to understand what would turn intention into attendance.
  - q: |
      Priya asked nine people how much they would pay for one early swim. Their answers were $4, $4, $5, $5, $5, $6, $6, $8 and $20.

      Calculate the mean and the median of the answers.
    marks: 4
    command: calculate
    paper: '2'
    answer: |
      - **Mean** = total of the answers ÷ number of answers = $63 ÷ 9 = **$7.00**.
      - **Median** = the middle value in order, the fifth of nine = **$5**.

      Show the total and the division for the mean, and the ordered list for the median. A strong answer could go on to note that the single answer of $20 pulls the mean above most of the answers, so the median is the better guide to a typical answer.
  - q: Explain two limitations of Priya's social media poll as evidence for the decision to open at 6 a.m.
    marks: 4
    command: explain
    paper: '1'
    answer: |
      Two limitations, each explained and applied:

      - **An unrepresentative sample.** It was a convenience sample of people who follow the centre's page and chose to reply: 91% were members, who make up only 8% of the town's adults, and young people were over-represented, so the result cannot stand for the town.
      - **A hypothetical question.** "Would you use the pool?" costs nothing to answer yes to and mentions no price or the reality of a 6 a.m. start, so stated intentions are likely to overstate how many would actually come.

      Other valid points include the poll's timing, since one week in one season may not reflect winter mornings, and the lack of any evidence on how often people would come.
  - q: Analyse the advantages and disadvantages of using quota sampling for Avonmere's survey of the town.
    marks: 6
    command: analyse
    paper: '1'
    answer: |
      A strong answer explains how quota sampling would work in this case and weighs its effects:

      - **How it works here:** quotas in proportion to the census, 140 people aged 18 to 34, 190 aged 35 to 54 and 170 aged 55 and over, in a sample of 500.
      - **Advantages:** every age group is represented in proportion, correcting the poll's tilt towards young members; no complete list of the town's adults is needed, which Avonmere does not have; and it is quicker and cheaper than a random sample of the town.
      - **Disadvantages:** interviewers choose who fills each quota, so they may approach people near the centre or people who look sporty, which biases the results; the quotas control only age, not other factors such as working hours; and because the sample is not random, its margin of error cannot be measured properly.
      - **A link to the decision:** it would show how interest varies by age, which matters for who would really come at 6 a.m.
  - q: Evaluate the methods of market research that Avonmere could use to decide whether to open its pool at 6 a.m.
    marks: 10
    command: evaluate
    paper: '1'
    answer: |
      An extended response that weighs methods against the decision and reaches a judgement:

      - **The decision:** $57,200 a year, needing about 44 extra paying swims a morning, so the research must estimate real attendance, including non-members.
      - **Secondary research:** the census and the council's sport survey are cheap and show the town's age structure and swimming habits, but say nothing about 6 a.m. at Avonmere.
      - **Surveys:** a quota survey of the town measures interest across age groups, but measures intentions, which overstate behaviour; a survey of members only would be quick but biased.
      - **Interviews and focus groups:** explain what stops or enables early swimming and test a price, but involve too few people to measure demand.
      - **Observation and a trial:** counting the queue before 7 a.m. costs nothing; a twelve-week trial measures behaviour directly for $5,280, less than a tenth of a year's cost, but takes time and tests only two days.
      - **Judgement:** for example, combine free secondary data with a trial, perhaps preceded by a small quota survey, because behaviour is the evidence that matters for a costly, recurring commitment. Say what result would change the decision.

      An answer that describes the methods without applying them to Avonmere's decision, or without weighing them, does not do what the command term asks.
summary:
  - Market research gathers and analyses information about customers, competitors and markets to reduce the risk of marketing decisions. It is worth most when a decision is costly, uncertain and hard to reverse.
  - Start with the decision, search existing sources first, then design primary research for the gaps; pilot it, collect, analyse, act and review.
  - Primary research collects new data for the purpose, through surveys, interviews, focus groups and observations. It fits the question but costs time and money.
  - Secondary research uses existing data, from market analyses, academic journals, government publications, media articles and online content, as well as the business's own records. It is quick and cheap but not made for the question.
  - Quantitative research measures how many and how much; qualitative research explains why. Strong research combines them.
  - Summarize numbers with descriptive statistics. The median resists extreme values; the mean does not.
  - A sample must represent its population. Random sampling gives everyone an equal chance, quota sampling fills a set number from each group, and convenience sampling takes whoever is easiest to reach.
  - Sampling error shrinks with a bigger sample; bias does not.
  - What people say is not what they do, so evidence of behaviour, from sales data, observation or a trial, is stronger than stated intentions.

retrieval:
  - q: Give three reasons why a business carries out market research.
    a: For example, to understand customers' needs, to measure the market and rivals' shares, to find segments and gaps, to test products, prices or adverts before launch, and to monitor the results of a decision. Above all, to reduce the risk of a costly mistake.
  - q: What is the difference between primary and secondary research?
    a: Primary research collects new data first-hand for the business's own purpose. Secondary research uses data that already exist, collected by someone else for another purpose.
  - q: Why should secondary research usually come before primary research?
    a: It is quicker and cheaper, may answer part of the question at once, and helps the business design better primary research for the gaps that remain.
  - q: Give one advantage and one disadvantage of a focus group.
    a: 'Advantage: ideas build on one another and the business can see reactions to a product or advert. Disadvantage: a few confident voices can dominate, and the group is too small to represent the market.'
  - q: Why can observation give more valid evidence than a survey?
    a: It records what people actually do rather than what they say they would do, so it avoids the gap between stated intentions and behaviour. It cannot, however, explain why.
  - q: Name the five sources of secondary research in the guide.
    a: Market analyses, academic journals, government publications, media articles and online content.
  - q: Distinguish between a closed question and an open question.
    a: A closed question offers a fixed set of answers, such as yes or no or a rating scale, and gives quantitative data. An open question lets people answer in their own words and gives qualitative data.
  - q: A population is 60% women and 40% men. How many of each should a quota sample of 250 include?
    a: 150 women (60% of 250) and 100 men (40% of 250).
  - q: Why does random sampling need a sampling frame?
    a: Every member of the population must have an equal chance of being chosen, which needs a complete list to choose from.
  - q: What is the difference between sampling error and bias?
    a: Sampling error is the chance difference between a sample's result and the truth, and it shrinks as the sample grows. Bias is a systematic distortion from how the sample was chosen or the questions asked, and a bigger sample does not remove it.
  - q: Nine answers are 3, 4, 4, 5, 6, 7, 9, 10 and 24. What are the mean and the median?
    a: Mean = 72 ÷ 9 = 8. Median = the fifth value in order = 6. The answer of 24 pulls the mean above the median.
  - q: Why might a trial give better evidence than a survey?
    a: A trial measures how many people actually buy or turn up, while a survey measures what they say they would do, which usually overstates real behaviour.

# Notes: 3.9 Budgets. HL only, so the notes are HL throughout. Written in the
# platform's own words from the guide's five content statements (p. 30) and
# its budget layout (p. 63), whose columns (budgeted figures, actual figures,
# variance), totals and [F] and [A] labels the notes follow. The guide's
# formula list (pp. 64 to 65) has no variance formula, so the standard form is
# given and labelled. Every 3.9 statement is set at AO2 (with AO4 for
# constructing budgets and variances), so the objectives and questions stay
# at that depth; the one extended question draws its evaluation from 2.4's
# motivation theories (AO3) and says so. Flexed, incremental and zero-based
# budgets are marked as enrichment. The worked variance example uses the
# figures of the budget-variances diagram. The teacher support material's
# glossary (pp. 80 to 90) was read to check terms; nothing from it is
# reproduced. No coursebook chapter for unit 3 was supplied. Every business
# named is fictional, and every figure was checked by script.
code: '3.9'
title: Budgets
level: HL
introduction: |
  Every organization has to decide in advance what it expects to earn, what it can afford to spend and who is responsible for each part of the money. A **budget** is that plan in figures. It turns objectives into targets, shares resources between departments and gives managers a yardstick: when the actual results come in, the differences from the budget, called **variances**, show where things went better or worse than planned.

  This HL subtopic covers the difference between **cost centres** and **profit centres** and what each is for, how to **construct a budget** in the layout the guide uses, how to calculate variances and label them **favourable** or **adverse**, and why budgets and variances matter for decisions. Every statement is set at AO2, with AO4 for the calculations, so expect to construct, calculate, explain and analyse.
objectives:
  - '**Distinguish** between cost centres and profit centres, and **explain** the roles each plays in an organization.'
  - '**Construct** a budget from given information, in the guide''s layout of budgeted figures, actual figures and variances.'
  - '**Calculate** variances for each line and for the totals, and label each one favourable [F] or adverse [A].'
  - '**Analyse** the possible causes of variances, including why a favourable variance is not always good news.'
  - '**Explain** the importance of budgets and variances in decision-making, and their limitations.'
situation:
  title: The spa that may close
  fictional: true
  text: |
    Larkhill Hotel, a fictional hotel by the sea, runs three parts of its business as profit centres: its rooms, its restaurant and bar, and its spa. Housekeeping, maintenance and the office are cost centres, and their costs are shared between the profit centres according to the floor area each occupies.

    The spa's annual report has just arrived. It was budgeted to make a profit of $20,000; instead it made a loss of $10,000. Its revenue was $40,000 below budget, although its own costs came in $10,000 below. The hotel's owner wants to close the spa and lease the space to a gym operator, which has offered $50,000 a year. The spa manager says the figures are unfair, because the spa is charged for a share of the hotel's costs that would not go away if it closed.

    Who is right? What do the budget and its variances really say about the spa, and how should the owner use them to decide?
sections:
  - id: what-a-budget-is
    title: What a budget is, and why organizations use one
    kind: concept
    level: HL
    body: |
      A **budget** is a financial plan, agreed in advance, of the revenues an organization, or one part of it, expects to earn and the costs it expects to incur over a future period, usually a year divided into months. It is a plan with an owner: a named manager, the **budget holder**, is responsible for meeting it and for explaining any differences.

      A budget is not the same as a forecast. A forecast is an estimate of what is likely to happen, such as next year's sales; a budget is a target the organization commits to. It is built from forecasts, but also from objectives and from decisions about how to use resources: the sales forecast may suggest one figure, while the budget sets a slightly higher one backed by a marketing plan.

      Most organizations build several budgets that fit together: a sales budget, budgets for production or purchases, labour and overheads, a capital expenditure budget for new assets, and a cash budget, which is the cash flow forecast of 3.7. Because each depends on the others, preparing them forces the different parts of the organization to plan together.
    points:
      - term: Planning
        level: HL
        text: A budget makes managers think ahead about what they will sell, what it will cost and what resources they need, and turns objectives into figures.
      - term: Coordination
        level: HL
        text: The sales budget drives production, purchasing, staffing and cash, so building budgets makes departments plan together rather than separately.
      - term: Allocating resources
        level: HL
        text: Money is limited, so the budget decides how much each department, project or site may spend, and therefore what the organization will and will not do.
      - term: Control
        level: HL
        text: Comparing actual results with the budget shows where revenue or costs are off course, early enough to act.
      - term: Motivation and accountability
        level: HL
        text: A clear, achievable target gives managers something to aim for, and naming a budget holder makes it clear who must explain the results.
    example:
      title: One forecast, many budgets
      fictional: true
      text: Pellucid Bikes, a fictional maker of city bicycles, budgets to sell 12,000 bikes next year. That one figure sets most of the others. Holding stock steady, the production budget is 12,000 bikes; at 3 hours of assembly per bike, the labour budget is 12,000 × 3 = 36,000 hours, or $720,000 at $20 an hour. The purchasing budget needs 12,000 frames, 24,000 wheels and the other parts, and the cash budget shows when suppliers must be paid and when customers will pay. If the sales figure is wrong, every budget built on it is wrong too.
  - id: cost-and-profit-centres
    title: Cost centres and profit centres
    kind: types
    level: HL
    body: |
      To plan and control its money, an organization divides itself into parts whose costs, and sometimes revenues, can be measured separately. The guide distinguishes two kinds.

      A **cost centre** is a part of an organization, such as a department, a site, a team or even a machine, to which costs can be charged but which earns no revenue of its own. Human resources, IT, maintenance, cleaning and a hospital's laundry are typical. A **profit centre** is a part that earns its own revenue as well as incurring costs, so that its profit can be measured: a branch, a shop in a chain, a product range or a division.

      The difference is **revenue**. Because a cost centre sells nothing, it can be judged only on how well it controls its costs and on the quality of its service; a profit centre can be judged on its profit. Centres usually follow the organizational structure (2.2), by department, product, region or project, and each has a manager responsible for its budget. Whether a part of the business is a cost centre or a profit centre is partly a choice about how it is measured: a staff canteen that gives meals away is a cost centre, while one that charges prices can be run as a profit centre.
    points:
      - term: Cost centre
        level: HL
        text: Has costs that can be identified and controlled, but no revenue of its own, so it is judged on cost and service, not profit. Examples include HR, IT, maintenance, the finance office and a school's science department.
      - term: Profit centre
        level: HL
        text: Earns revenue and incurs costs, so its profit can be calculated and compared. Examples include each store in a chain, each hotel in a group, a product division and a restaurant within a hotel.
      - term: Shared costs
        level: HL
        text: Costs that serve several centres, such as rent, insurance and head office, are indirect costs. To work out each profit centre's full profit they must be shared out, or allocated, between the centres, which is where much of the difficulty with profit centres lies.
    example:
      title: The centres at Larkhill Hotel
      fictional: true
      text: Larkhill Hotel, the fictional hotel in the situation, treats its rooms, its restaurant and bar, and its spa as profit centres, because each earns revenue from guests and has its own staff and supplies. Housekeeping, maintenance, the laundry and the office are cost centres, since they serve the whole hotel and sell nothing directly. Each centre has a manager who holds its budget. The costs of the cost centres, together with rent and insurance, are shared between the three profit centres by floor area, so each profit centre's reported profit depends partly on that choice.
  - id: roles-of-centres
    title: The roles of cost and profit centres
    kind: application
    level: HL
    body: |
      Dividing an organization into centres is not just bookkeeping. It gives managers information they would not otherwise have, and it changes how people behave.

      The main roles are these. Centres show **where costs arise and where profit is made**, which informs decisions on pricing, investment and which activities to grow or close. They make **control and accountability** possible, because each centre has a budget and a budget holder who must explain its variances. They support **delegation and motivation**: the manager of a profit centre runs something close to a business within the business, with the authority to make decisions and the satisfaction of seeing the results (2.2 and 2.4). And they allow **comparison**: similar centres, such as branches, can be compared and the best practice spread, while a cost centre's costs can be compared with the price an outside firm would charge.

      The difficulties are real too. Shared costs have to be allocated between centres, and any method, by floor area, by revenue, by staff numbers, is partly arbitrary, so a centre's reported profit can depend as much on the method as on its performance. Centres can start to compete rather than cooperate, managers may be blamed for costs they cannot control, and running the system takes time and money.
    advantages:
      - Show which activities earn money and which cost it, so decisions rest on evidence.
      - Make named managers accountable for their centre's budget, which improves control.
      - Delegate authority, which can speed up decisions and motivate managers.
      - Allow centres to be compared with each other and with outside providers.
    limitations:
      - Shared costs must be allocated, often arbitrarily, which can make a centre look worse or better than it really is.
      - Centres may compete for resources or customers at the expense of the whole organization.
      - Managers may be held responsible for costs they cannot control, which is unfair and demotivating.
      - Measuring every centre takes time and money, and can encourage a narrow focus on each centre's own figures.
    example:
      title: What does the laundry really cost?
      fictional: true
      text: Westmere Hospital, a fictional hospital, runs its laundry as a cost centre. Because its costs are recorded separately, managers know that it spends $1,200,000 a year washing 600,000 kg of linen, or $2.00 a kilogram. An outside laundry has quoted $1.70 a kilogram, which would cost $1,020,000, a saving of $180,000 a year. Without the cost centre, the hospital could not have made the comparison. The figures do not settle the decision, though. The hospital must also weigh how quickly the outside firm could replace linen in an emergency, its standards of infection control, and what would happen to the laundry's staff.
  - id: constructing-a-budget
    title: Constructing a budget
    kind: method
    level: HL
    body: |
      The guide sets constructing a budget at AO4 as well as AO2, so you may be asked to build one from information in a case. Budgets in examination questions follow the layout on p. 63 of the guide: a heading naming the organization and the period, then columns for **budgeted figures**, **actual figures** and **variance**. The rows list each **revenue** line and **total revenues**, then each **cost** line and **total costs**, and the bottom line is the **excess of revenues over (under) costs**, which is the profit, or the surplus of a non-profit organization. When you construct a budget, only the budgeted column is filled in; the other two come later.

      A budget is usually built in this order:

      1. Start from the objectives the budget must serve, such as growing sales or breaking even.
      2. Forecast sales (4.3), the starting point for most budgets, because sales limit what everything else can be.
      3. Build the revenue lines: expected volume × expected price, plus any other income.
      4. Build the cost lines: variable costs from the expected volume, fixed costs from contracts and quotes, and the other expenses.
      5. Add up the totals and the excess of revenues over costs, check it against the objectives, and revise if necessary.
      6. Agree each part with its budget holder, approve the budget and divide it into months.
      7. During the period, record the actual figures, calculate the variances and act on them.

      In practice the figures are often based on last year's, adjusted for expected changes, and the people who will hold the budget are consulted, because they know the costs best and will be more committed to a budget they helped to set.
    points:
      - term: Revenue lines
        level: HL
        text: Each source of income, usually forecast volume × price, such as ticket sales, product sales, fees, sponsorship or interest earned.
      - term: Cost lines
        level: HL
        text: Each type of cost, such as materials, wages and salaries, rent, marketing and utilities. Variable costs follow the expected volume; fixed costs come from contracts and quotes.
      - term: The bottom line
        level: HL
        text: Total revenues minus total costs, shown as the excess of revenues over (under) costs. A negative figure is an excess of costs over revenues, a planned loss or deficit.
      - term: Incremental and zero-based budgets
        level: HL
        text: An **incremental** budget takes last year's figures and adjusts them, which is quick but carries old inefficiencies forward. A **zero-based** budget makes every line justify itself from nothing each time, which challenges waste but takes far longer. Both terms are enrichment beyond the guide.
    example:
      title: A budget for a festival weekend
      fictional: true
      text: |
        The Saltmarsh Arts Festival, a fictional charity, is constructing its budget for next summer's festival weekend from these plans: 2,400 tickets forecast at $25 each; $15,000 of sponsorship already agreed; 30 food and craft stalls at $200 each; performers' fees of $36,000; venue and staging hire of $18,000; marketing of $6,000; security and first aid of $7,500; and insurance of $2,500.

        Budgeted figures:

        - Revenue: ticket sales 2,400 × $25 = $60,000; sponsorship $15,000; stall fees 30 × $200 = $6,000. **Total revenues $81,000.**
        - Costs: performers' fees $36,000; venue and staging $18,000; marketing $6,000; security and first aid $7,500; insurance $2,500. **Total costs $70,000.**
        - **Excess of revenues over costs: $81,000 − $70,000 = $11,000.**

        The planned surplus funds the charity's workshops in schools during the rest of the year. Notice that almost everything rests on one forecast, ticket sales; question 2 below shows what happened when the weather turned.
  - id: variances
    title: Calculating variances
    kind: method
    level: HL
    body: |
      A **variance** is the difference between a budgeted figure and the actual figure for the same item and period. Calculating it is simple subtraction; the skill lies in labelling it correctly.

      In the guide's layout, each variance is written as a positive amount followed by **[F]** for favourable or **[A]** for adverse. The label describes the variance's effect on profit, not whether the number went up or down. A **favourable** variance makes profit higher than budgeted: revenue above budget, or a cost below budget. An **adverse** variance makes profit lower than budgeted: revenue below budget, or a cost above budget. So a rise is favourable for a revenue line and adverse for a cost line.

      The totals need care. The variance on total revenues is the difference between the two totals, not the sum of the separate variances regardless of their labels: a favourable variance of 30 on one revenue line and an adverse one of 8 on another give a net variance of 22 [F]. The variance on the bottom line, the excess of revenues over costs, combines the two: a revenue variance of 22 [F] and a cost variance of 35 [A] give 13 [A], because the extra costs outweigh the extra revenue. Checking that the bottom-line variance equals the difference between budgeted and actual profit is a quick way to catch mistakes.
    diagram: budget-variances
    formulas:
      - name: Variance
        expression: Variance = actual figure − budgeted figure
        note: The guide's formula list gives no variance formula; this is the standard form. In the guide's layout (p. 63) the variance is shown as a positive amount labelled [F] or [A] by its effect on profit.
    points:
      - term: Favourable variance [F]
        level: HL
        text: Revenue above budget, or a cost below budget, so profit is higher than planned.
      - term: Adverse variance [A]
        level: HL
        text: Revenue below budget, or a cost above budget, so profit is lower than planned.
      - term: No variance
        level: HL
        text: Actual equals budget, shown as 0 with no label, as for most fixed costs such as rent.
      - term: Judging the size
        level: HL
        text: A variance means more as a percentage of the budget. An overspend of $6,000 is 15% of a $40,000 budget but only 1.5% of a $400,000 one, so the first deserves more attention.
    example:
      title: A month at Rowan Lane Bakery
      fictional: true
      text: |
        The figures in the diagram are one month's budget and results for Rowan Lane Bakery, a fictional wholesale bakery, in $000. The diagram's profit line is what the guide's layout calls the excess of revenues over costs.

        - Sales revenue, the only revenue line and so also the total revenues: budget 120, actual 132, variance **12 [F]**, since revenue is above budget.
        - Raw materials: budget 40, actual 46, variance **6 [A]**, since the cost is above budget.
        - Wages: budget 30, actual 29, variance **1 [F]**, since the cost is below budget.
        - Rent: budget 10, actual 10, variance **0**.
        - Total costs: budget 80, actual 85, variance **5 [A]**.
        - Excess of revenues over costs: budget 120 − 80 = 40, actual 132 − 85 = 47, variance **7 [F]**.

        Check: a revenue variance of 12 [F] and a cost variance of 5 [A] give 12 − 5 = 7 [F], the same as the difference between the actual and budgeted profit. The month was better than planned. Whether it was well managed is a separate question, answered in the next section.
  - id: analysing-variances
    title: Reading variances
    kind: application
    level: HL
    body: |
      A variance says *what* differed from the plan, not *why*. Before acting on it, managers ask what caused it and whether anyone could have controlled it, because the right response to a cost overspend caused by waste is very different from the right response to one caused by a rise in world prices.

      Two warnings matter most. A **favourable variance is not always good news**: costs below budget may mean cheaper, poorer materials, maintenance put off or training cancelled, and revenue above budget may only show that the budget was set too low. An **adverse variance is not always bad news**: if the business sold more than planned, it will also have used more materials, so a cost above budget may simply reflect success. Variances must be read together, not one at a time.

      One way to separate the effect of selling more from the effect of spending more is to **flex** the budget: recalculate what each variable cost should have been at the actual level of output, and compare the actual cost with that figure. Flexed budgets are enrichment beyond the guide, but they explain why a business can show an adverse cost variance and still be controlling its costs well. Many organizations also investigate only variances above a set size, so that managers spend their time where it matters.
    formulas:
      - name: Flexed budget for a variable cost
        expression: Flexed budget = original budget × (actual output ÷ budgeted output)
        note: A standard form beyond the guide, shown here as enrichment. It applies only to costs that vary with output.
    points:
      - term: Revenue variances
        level: HL
        text: Caused by selling a different volume (demand, competition, the weather, the economy) or at a different price (discounts, price rises, a different mix of products).
      - term: Cost variances
        level: HL
        text: Caused by paying a different price for inputs (suppliers' prices, wage rates, energy), using a different quantity (waste, efficiency, overtime), or producing a different volume.
      - term: Controllable or not
        level: HL
        text: A budget holder can fairly be asked to explain waste or overtime, but not a rise in a regulated energy price or a change in tax. Holding managers to account for what they cannot control demotivates them.
      - term: Interdependence
        level: HL
        text: Variances affect each other. Higher sales raise variable costs; cheaper materials may raise waste and wages; cutting marketing may cut revenue next month.
    example:
      title: Was Rowan Lane's month well managed?
      fictional: true
      text: |
        Rowan Lane's sales revenue was 10% above budget, and its raw materials cost 15% above. If the extra revenue came entirely from selling 10% more bread at the budgeted prices, the materials budget flexed to the actual output is 40 × (132 ÷ 120) = 44 ($000). Of the 6 [A] on materials, 4 is explained by the extra volume, and only 2 is a genuine overspend, perhaps dearer flour or more waste, which is the part the manager should investigate.

        Wages tell a similar story the other way: the bakery produced more for 1 less in wages, which is either good efficiency or a sign that staff were stretched, worth checking against quality complaints. And if the extra revenue had come from higher prices rather than more bread, the flexed materials budget would stay at 40 and the whole 6 [A] would need explaining. The same variance report supports different conclusions depending on facts it does not contain.
  - id: budgets-in-decision-making
    title: Why budgets and variances matter for decisions
    kind: evaluation
    level: HL
    body: |
      Budgets and variances feed decisions at every stage. Before the period, building the budget forces decisions about priorities: which departments grow, which projects go ahead, what the business can afford. During the period, variances give early warning, so managers can cut a cost, change a price, step up marketing or revise a plan before a small problem becomes a large one. Afterwards, comparing results with the budget shows which managers, centres and plans delivered, and the lessons shape the next budget.

      The quality of those decisions depends on how budgets are set and used. A budget agreed with the people who must meet it, realistic and reviewed when circumstances change, supports good decisions. A budget imposed from above, set unrealistically high or low, or treated as fixed whatever happens, can lead to poor ones: managers who pad their budgets to make them easy to meet, spend whatever is left at the end of the year so that next year's budget is not cut, or hit this month's cost target by putting off maintenance that will cost more later.
    advantages:
      - Turn objectives into specific targets for each part of the organization.
      - Coordinate departments and allocate limited money to the activities that matter most.
      - Give early warning through variances, so problems can be corrected in time.
      - Create accountability and, when budget holders take part in setting them, commitment.
      - Provide evidence for decisions such as pricing, investment and whether to close an activity.
    limitations:
      - Rest on forecasts, so an inaccurate sales forecast undermines every figure.
      - Can be rigid, so managers keep to the plan after circumstances have changed.
      - Invite gaming, such as padding budgets or spending what is left so that it is not lost.
      - Can encourage short-term decisions that meet the budget but harm the business later.
      - Take time to prepare and monitor, and can demotivate if imposed or unrealistic.
    example:
      title: Two managers, one overspend
      fictional: true
      text: Two leisure centres run by Hallam Vale Leisure, a fictional trust, each report an adverse variance on energy halfway through the year. The first manager closes the sauna on weekdays and postpones a boiler service to bring spending back to budget, which meets the target but loses customers and risks a breakdown. The second finds that most of the overspend comes from a rise in the energy price that nobody could control, asks for the budget to be revised, and fixes a faulty timer that was heating the pool overnight. Both responded to the same variance; only the second used it to make a better decision.
applications:
  - industry: Hospitality
    text: Hotels and restaurant groups often treat each outlet, and each department within a hotel, as a profit centre with a weekly or monthly budget. Food and labour costs are watched as a percentage of revenue, because a few points of overspend on perishable stock or overtime can wipe out the margin in a business with high fixed costs.
  - industry: Healthcare and public services
    text: Most hospital departments and public services are cost centres with spending limits rather than revenue targets, so variances measure overspending against an allocation. The pressure to spend what remains before the year end, so that next year's budget is not cut, is a well-known weakness of budgets in this sector.
  - industry: Retail chains
    text: Each store is usually a profit centre, which lets head office compare stores of similar size and spread the practices of the best. How head office costs, such as marketing and the distribution centre, are shared out can decide whether a small store appears to make a profit or a loss.
  - industry: Manufacturing
    text: Manufacturers budget materials, labour and machine hours for each product and investigate variances closely, often splitting each cost variance into a price part and a usage part. Because so many costs vary with output, flexing the budget to actual output is essential before judging a production manager.
  - industry: Charities and social enterprises
    text: Grant-givers and donors often require a budget before they fund a project and an explanation of variances afterwards, and some funds can be spent only on particular purposes. The bottom line is a surplus or deficit rather than a profit, as in the guide's layout for non-profit entities.
  - industry: Technology start-ups
    text: "A start-up's budget is closely tied to its cash: investors watch how fast it spends its funding against the budget, because that decides how many months it has before it must raise more money. Revenue forecasts for new products are highly uncertain, so budgets are often revised every quarter."
stakeholders:
  - group: Budget holders
    text: Managers who hold budgets gain authority and clear targets, and are judged on the variances. They want budgets they can meet and the freedom to explain variances they could not control, which can bring them into conflict with senior managers who want demanding targets.
  - group: Senior managers and owners
    text: They use budgets to allocate money, coordinate the business and check performance. They want budgets that stretch managers without being padded, and they rely on honest variance reporting, which a culture of blame discourages.
  - group: Employees
    text: Budgets decide staffing levels, overtime, training and pay rises, so an adverse variance can lead to cuts that fall on employees. Teams that help set a budget understand the reasons for it and are more likely to work towards it.
  - group: Lenders and investors
    text: A bank or investor considering finance will often ask for budgets and a cash flow forecast, and may monitor actual results against them. Repeated adverse variances weaken confidence and can make further finance harder or dearer to obtain.
  - group: Donors and funders
    text: For a charity or social enterprise, funders want to see that money is spent as planned. Variances must be explained, and unspent restricted funds may have to be returned, which can conflict with the organization's wish to use money where it is most needed.
  - group: Customers
    text: Customers rarely see budgets, but they feel the decisions budgets drive. Cost cuts made to meet a budget can lower service or quality, while a well-planned budget keeps stock, staff and services available when customers want them.
evaluation:
  - A budget is only as good as the forecasts behind it. The sales forecast drives most other budgets, so its limitations (4.3) pass straight into every figure, and a budget should be revised when the forecast is clearly wrong.
  - Variances are questions, not answers. The [F] and [A] labels describe the effect on profit, not the quality of management, so each significant variance needs a cause before anyone is praised or blamed.
  - Variances must be read together. Selling more raises variable costs, and saving on one cost can raise another, so judging lines one at a time can mislead; flexing the budget to actual output is one way to see through this.
  - How a budget is set shapes how people behave. Participation builds commitment but invites padding; imposed targets can be demanding but demotivate; rigid budgets encourage short-term decisions and spending to use up what is left.
  - Profit centre figures depend on how shared costs are allocated. A centre that shows a loss after its share of overheads may still contribute towards them, so a decision to close one should compare the revenue and costs that would actually disappear, not the allocated profit.
  - In an examination answer, show each variance with its amount and label, take the totals as differences between totals, check the bottom line, and then explain likely causes in the context of the case.
decision:
  title: Close Larkhill's spa?
  fictional: true
  brief: |
    Larkhill Hotel shares $600,000 a year of overheads (the cost centres, rent and insurance) between its profit centres by floor area. The spa occupies 15% of the floor area, so it is charged $90,000.

    The spa's annual budget and results: revenue budget $340,000, actual $300,000 (variance $40,000 [A]); direct costs, the spa's own staff, products and energy, budget $230,000, actual $220,000 ($10,000 [F]); share of overheads $90,000 in both. Budgeted profit was $20,000; the actual result is a loss of $10,000, a variance of $30,000 [A]. The spa's revenue fell after a new day spa opened in the town. The owner must decide what to do.
  options:
    - label: Close the spa and lease the space
      text: Close the spa and lease the space to a gym operator for $50,000 a year. The spa's staff would be offered jobs elsewhere in the hotel where possible.
    - label: Keep the spa and act on the variances
      text: Keep the spa, investigate why revenue fell, and set a revised budget with packages that combine rooms and treatments, shorter opening hours on quiet weekdays and a new revenue target agreed with the spa manager.
    - label: Change how the overheads are shared
      text: Keep the spa and share the overheads by revenue instead of floor area. The spa earns 7.5% of the hotel's $4,000,000 revenue, so it would be charged $45,000, and its result would become a profit of $35,000.
  guidance: |
    Start with what would actually change. The $600,000 of overheads would not disappear if the spa closed: the building, the office and maintenance would still have to be paid for. What would disappear is the spa's revenue of $300,000 and its direct costs of $220,000, so the spa contributes $80,000 a year towards the hotel's overheads and profit. **Option A** would replace that $80,000 with $50,000 of rent, so the hotel's profit would fall by about $30,000 a year, before counting any guests who choose Larkhill because of its spa and might stay elsewhere without it.

    **Option C** changes nothing real. Sharing the overheads by revenue moves $45,000 of cost from the spa to the other profit centres; the hotel's total profit is exactly the same. It might be fairer, since the spa's large treatment rooms earn less per square metre than bedrooms, and it might matter for the spa manager's motivation, but it cannot be a reason to keep or close the spa.

    The variances point to **option B** as the place to start. The $40,000 [A] on revenue is the real problem, and it has a cause outside the spa's control, a new competitor, which the business can respond to with packages for hotel guests and better use of quiet times. The $10,000 [F] on direct costs is mostly the result of fewer treatments, not better control, so it is not a reason for praise. A strong recommendation would keep the spa with a revised budget and a review date, and would say what would change the decision: a lease offer above the spa's contribution of $80,000, savings in overheads if it closed, or revenue that kept falling despite the new packages.
exam:
  - q: Distinguish between a cost centre and a profit centre, using an example of each from a hotel.
    marks: 4
    command: distinguish
    level: HL
    paper: '2'
    answer: |
      A strong response makes the difference clear for both and gives an example of each:

      - A **cost centre** has costs that can be identified and controlled but earns no revenue of its own, for example housekeeping or maintenance, so it is judged on cost and service.
      - A **profit centre** earns revenue as well as incurring costs, for example the hotel's restaurant or its rooms, so its profit can be measured.
      - The key difference is revenue, and therefore whether profit can be calculated for that part of the hotel.

      About one mark for each accurate definition and one for each appropriate example.
  - q: |
      The Saltmarsh Arts Festival, a fictional charity, budgeted the following for its festival weekend: ticket sales $60,000; sponsorship $15,000; stall fees $6,000; performers' fees $36,000; venue and staging $18,000; marketing $6,000; security and first aid $7,500; insurance $2,500. Heavy rain on the Sunday meant it sold 2,150 tickets at $25 instead of 2,400. The actual figures were: ticket sales $53,750; sponsorship $15,000; stall fees $6,800 (34 stalls); performers' fees $36,000; venue and staging $19,200; marketing $6,900; security and first aid $7,100; insurance $2,500.

      Calculate the variance for each line, for total revenues, for total costs and for the excess of revenues over costs, labelling each favourable [F] or adverse [A].
    marks: 6
    command: calculate
    level: HL
    paper: '2'
    answer: |
      A strong response sets out the working in the guide's layout:

      - Ticket sales: 60,000 budget, 53,750 actual, **6,250 [A]**. Sponsorship: **0**. Stall fees: 6,000 and 6,800, **800 [F]**.
      - Total revenues: 81,000 and 75,550, **5,450 [A]**.
      - Performers' fees: **0**. Venue and staging: 18,000 and 19,200, **1,200 [A]**. Marketing: 6,000 and 6,900, **900 [A]**. Security and first aid: 7,500 and 7,100, **400 [F]**. Insurance: **0**.
      - Total costs: 70,000 and 71,700, **1,700 [A]**.
      - Excess of revenues over costs: 11,000 budget and 3,850 actual, **7,150 [A]**, which equals the revenue variance of 5,450 [A] plus the cost variance of 1,700 [A].

      Marks go to correct amounts, correct labels and correct totals. A common error is to label the higher cost figures favourable because the numbers rose, or to add the line variances without regard to their labels.
  - q: |
      Elm Court Café, a fictional café, is constructing its budget for June. It forecasts 4,000 meals at $12 each and 5,000 drinks at $3 each. Food ingredients cost 30% of meal revenue and drinks cost 25% of drinks revenue. Wages will be $18,000, rent $6,000, utilities $2,100 and marketing $900.

      Construct a budget for Elm Court Café for June, showing total revenues, total costs and the excess of revenues over costs.
    marks: 6
    command: construct
    level: HL
    paper: '2'
    answer: |
      A strong response uses the guide's layout, with a heading, the budgeted figures and clear totals:

      - Revenue: meals 4,000 × $12 = $48,000; drinks 5,000 × $3 = $15,000. **Total revenues $63,000.**
      - Costs: food ingredients 30% × $48,000 = $14,400; drinks 25% × $15,000 = $3,750; wages $18,000; rent $6,000; utilities $2,100; marketing $900. **Total costs $45,150.**
      - **Excess of revenues over costs: $63,000 − $45,150 = $17,850.**

      Marks go to the correct revenue lines, the correct variable costs, the totals and the bottom line, and to a clear layout. The actual and variance columns stay empty, because the month has not happened yet.
  - q: Explain why a favourable variance is not always good news for a business.
    marks: 4
    command: explain
    level: HL
    paper: '2'
    answer: |
      A strong response explains two reasons, for example:

      - A cost below budget may have been achieved by cutting quality or putting off spending, such as buying cheaper materials, delaying maintenance or cancelling training, which saves money now but may cost more later in complaints, breakdowns or lost skills.
      - Revenue or costs better than budget may only show that the budget was badly set, too low for revenue or too high for costs, so the variance reflects poor planning rather than good performance.
      - Another valid reason: a favourable variance on one line may cause an adverse one elsewhere, such as cheaper materials raising waste.

      Two reasons, each explained with its consequence, make a complete answer.
  - q: |
      Pinfold Print, a fictional printing firm, budgeted $25,000 for paper last quarter and spent $27,500. Its output was 12% higher than budgeted.

      Comment on Pinfold Print's paper variance.
    marks: 4
    command: comment
    level: HL
    paper: '2'
    answer: |
      A strong response calculates and then judges:

      - The variance is 27,500 − 25,000 = **$2,500 [A]**, a cost 10% above budget.
      - But output was 12% above budget, and paper varies with output. At the actual output, the paper budget would have been 25,000 × 1.12 = $28,000, so Pinfold spent $500 less than expected for the work it did.
      - The adverse variance therefore reflects higher sales, not poor control; paper use per job actually improved, perhaps through less waste.
      - A good answer adds a caveat: this assumes that paper use rises in proportion to output and that the price of paper did not change. If paper became cheaper, part of the saving came from the price rather than from less waste.
  - q: |
      Elmhurst Academy, a fictional secondary school, has always set each department's budget centrally: the head teacher decides how much each department receives and holds heads of department responsible for any overspend. Several heads of department say they have no say in their budgets and no reason to look for savings, and two have spent their remaining budget on equipment in the last month of the year so that it would not be cut. The head teacher is considering letting heads of department propose their own budgets each year, within a total set by the school.

      With reference to motivation theory, discuss whether Elmhurst Academy should let its heads of department propose their own budgets.
    marks: 10
    command: discuss
    level: HL
    paper: '2'
    answer: |
      The guide sets budgets (3.9) at AO2, so this extended question takes its evaluation from the motivation theories of 2.4, which are set at AO3. A strong response would:

      - explain the current problem: imposed budgets give heads of department responsibility without a say, which encourages spending what is left so that next year's budget is not cut;
      - apply motivation theory to the proposal: responsibility and recognition are Herzberg's motivators; Deci and Ryan's autonomy and competence suggest that heads who shape their budgets will be more committed to them; at HL, expectancy theory suggests targets heads helped to set will seem more achievable;
      - weigh the drawbacks: heads may pad their proposals to make them easy to meet; proposals take time; departments may compete for a fixed total, causing conflict; and some heads may lack the financial skills, which would need training;
      - consider how the school could manage these, for example by asking heads to justify each item, keeping a central contingency fund and allowing unspent money to be carried forward so that end-of-year spending stops;
      - reach a justified conclusion, for example that participation is likely to improve motivation and control, provided the school keeps the overall limit and reviews proposals against its priorities.
summary:
  - A budget is a financial plan, agreed in advance, of expected revenues and costs for a future period, held by a named manager, the budget holder.
  - Budgets plan, coordinate, allocate resources, control and motivate; most start from the sales forecast.
  - A cost centre has costs but no revenue of its own; a profit centre has both, so its profit can be measured. The difference is revenue.
  - Centres show where money is made and spent, create accountability, support delegation and allow comparison, but shared costs must be allocated, often arbitrarily.
  - "The guide's budget layout: budgeted figures, actual figures and variance, with revenue lines and total revenues, cost lines and total costs, and the excess of revenues over (under) costs."
  - Variance = actual figure − budgeted figure, shown as an amount with [F] if it raises profit (revenue above or cost below budget) or [A] if it lowers it.
  - Totals are differences between totals, and the bottom-line variance equals the revenue variance combined with the cost variance.
  - Variances show what differed, not why. Favourable is not always good, adverse not always bad, and selling more raises variable costs.
  - Budgets support decisions before, during and after the period, but rest on forecasts and can be rigid, padded or gamed.
retrieval:
  - q: What is a budget?
    a: A financial plan, agreed in advance, of the revenues an organization or one of its parts expects to earn and the costs it expects to incur over a future period.
  - q: How does a budget differ from a forecast?
    a: A forecast estimates what is likely to happen; a budget is a target the organization commits to, built from forecasts, objectives and decisions about resources.
  - q: What is the difference between a cost centre and a profit centre?
    a: A cost centre has costs but earns no revenue of its own; a profit centre earns revenue as well as incurring costs, so its profit can be measured.
  - q: Give two roles of cost and profit centres.
    a: For example, showing where costs arise and profit is made, making managers accountable, delegating authority to motivate managers, and allowing comparison between centres or with outside providers.
  - q: Why can a profit centre's reported profit be misleading?
    a: Because shared costs must be allocated between centres, often by an arbitrary method, so the profit depends partly on the method chosen.
  - q: What are the three columns of the guide's budget layout?
    a: Budgeted figures, actual figures and variance.
  - q: Budgeted sales revenue is $50,000 and actual sales revenue is $46,000. What is the variance?
    a: $4,000 [A], because revenue is below budget.
  - q: Budgeted wages are $20,000 and actual wages are $18,500. What is the variance?
    a: $1,500 [F], because the cost is below budget.
  - q: When is a cost variance adverse?
    a: When the actual cost is above the budgeted cost, so profit is lower than planned.
  - q: A business sold more than budgeted and its materials cost more than budgeted. Why might the adverse materials variance not be a concern?
    a: Selling more requires more materials, so some or all of the extra cost reflects the higher volume rather than poor control; flexing the budget to actual output shows how much.
  - q: Give two limitations of budgets.
    a: For example, they rest on forecasts that may be wrong, they can be rigid, they invite padding and spending to use up what is left, and they can encourage short-term decisions.
  - q: Should a profit centre that shows a loss after its share of overheads always be closed?
    a: No. If its revenue exceeds the costs that would disappear on closure, it contributes towards the shared overheads, which would remain, so closing it could lower total profit.
connections:
  - code: '1.3'
    text: Budgets turn strategic and tactical objectives into financial targets for each part of the organization.
  - code: '2.2'
    text: Cost and profit centres follow the organizational structure, and budget holders are an example of delegation.
  - code: '2.4'
    text: Budget targets and the responsibility of holding a budget can motivate, while imposed or unrealistic budgets demotivate.
  - code: '3.3'
    text: Budgets plan the fixed, variable, direct and indirect costs and the revenue streams of 3.3.
  - code: '3.7'
    text: A cash flow forecast is a budget for cash, built from the same sales and cost plans.
  - code: '4.3'
    text: At HL, the sales forecast is the starting point for most budgets, so its limitations pass into every figure.

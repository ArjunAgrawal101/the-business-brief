retrieval:
  - q: What is operations management?
    a: The business function that plans, runs and improves the processes that turn inputs into the goods and services a business sells.
  - q: Name the three stages of the transformation process, with an example of each for a bakery.
    a: Inputs, such as flour, bakers and ovens; the process, mixing, proving and baking; and outputs, loaves sold to customers (and waste, which must be managed too).
  - q: Give two differences between operations for goods and for services.
    a: For example, goods can be stored and services usually cannot; goods can be checked before the customer sees them, while services are experienced as they are produced; services often involve the customer directly and vary more from one occasion to the next.
  - q: Name the five operations objectives that textbooks commonly describe.
    a: Cost, quality, speed, dependability and flexibility, with sustainability increasingly added as a sixth.
  - q: Why can an operation not be the best at all of its objectives at once?
    a: They conflict. Flexibility and speed usually raise cost, and checking every item for quality slows production, so a business must choose which objectives matter most to its customers.
  - q: Fixed costs are $2,000 a day, the variable cost is $3 a unit, and output is 500 units. What is the unit cost?
    a: ($2,000 + 500 × $3) ÷ 500 = $3,500 ÷ 500 = $7, which is $4 of fixed costs plus $3 of variable cost a unit.
  - q: What is the difference between efficiency and effectiveness?
    a: Efficiency is producing with as few resources as possible; effectiveness is producing the right output, one that meets customers' needs.
  - q: Give one way operations depends on marketing, and one way marketing depends on operations.
    a: Operations depends on marketing's forecasts to know how much to make; marketing depends on operations to keep the promises it makes, such as quality and delivery times.
  - q: Name the five circular business models in the toolkit.
    a: Circular supply, resource recovery, product life extension, sharing, and product service system models.
  - q: Why can sustainable operations lower costs?
    a: Using less energy and fewer materials, wasting less and keeping products in use for longer all save money as well as reducing harm to the environment.
  - q: (HL) Ovens can bake 3,000 loaves a day and bake 2,400. What is the capacity utilization rate?
    a: 2,400 ÷ 3,000 × 100 = 80%.

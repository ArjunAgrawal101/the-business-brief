# Notes: 5.1 Introduction to operations management. Written in the platform's
# own words from the guide's single content statement, the role of operations
# management (AO2, p. 33), read with the unit's conceptual understandings and
# suggested tools (p. 33), the key concept of sustainability (p. 13) and the
# toolkit's circular business models (p. 14). The five operations objectives
# are a framework from operations management textbooks that the guide does not
# list, and are labelled so. HL material (capacity utilization, the HL
# subtopics of unit 5 and the HL planning tools) sits in HL points that the SL
# view hides. The teacher support material's lesson on production (pp. 34 to
# 35) was read to check scope; nothing from it is reproduced. No coursebook
# chapter for 5.1 was supplied. Copperleaf Bakery is fictional, and every
# figure was checked by script.
code: '5.1'
title: Introduction to operations management
level: SL/HL
introduction: |
  Every business makes something, whether it is a car, a haircut, a loan or a loaf of bread, and **operations management** is the function that makes it happen. It is where most of a business's costs are incurred and most of its promises to customers are kept or broken, so a business with a brilliant product and a clever campaign still fails if it cannot make and deliver what it sells, well and on time.

  This subtopic sets out the role of operations management (AO2): the transformation of inputs into outputs, the difference between producing goods and services, what operations aims for, the decisions it makes, and how it depends on the other business functions and on sustainable, ethical practice. The rest of unit 5 studies its decisions one at a time.
objectives:
  - '**Explain** the role of operations management in transforming inputs into outputs and adding value.'
  - '**Distinguish** between operations that produce goods and operations that produce services.'
  - '**Explain** the objectives of operations management, the trade-offs between them, and how output and waste change unit cost.'
  - '**Analyse** how operations decisions affect, and depend on, marketing, finance and human resources.'
  - '**Explain** how sustainable and ethical practices, including circular business models, shape operations.'
situation:
  title: The bakery that outgrew its kitchen
  fictional: true
  text: |
    Copperleaf Bakery, a fictional business, began as one shop and now has three, as well as supplying bread to 14 cafés every morning. Its owner, Dev Malhotra, bakes about 2,400 loaves a day in a kitchen built for far fewer. In six months the share of deliveries reaching cafés on time has fallen from 96% to 81%, two cafés have complained that their sourdough varies from day to day, and 8% of everything baked is thrown away. The overtime bill has doubled, and two experienced bakers have resigned.

    Dev's first thought was to spend more on marketing to win better-paying café customers. His new operations manager, Hana Sato, disagrees. None of the problems starts in marketing, she says, and more customers would make every one of them worse; they all start in how the bread is made and delivered.

    What is operations management for, and where should Hana start?
sections:
  - id: what-operations-management-is
    title: What operations management is
    kind: concept
    body: |
      **Operations management** is the business function that plans, runs and improves the processes that turn inputs into the goods and services a business sells. Every organization has an operations function, whether or not it uses the name. In a factory it runs the production line; in a hospital it runs the wards and operating theatres; in a bank it processes payments and loans; in a bakery it turns flour, water and the bakers' skill into bread on the shelf by 7 a.m.

      Its role is easiest to see in the **transformation process** (1.1). Inputs come in: materials, labour, equipment and buildings, energy and information. The process transforms them by making, assembling, moving, storing or serving. Outputs go out: the goods and services customers want. Operations management decides how the transformation happens and makes sure it happens well, with the right products, of the right quality, in the right quantity, at the right time and at an acceptable cost.

      The transformation should **add value**: customers should value the output more than the inputs cost. Operations is where most of a business's costs arise, which is why small improvements in operations can have a large effect on profit and on customers' loyalty. The guide's first conceptual understanding for unit 5 makes the point from another angle: change in operations affects the business's other activities (p. 33).
    points:
      - term: Inputs
        text: The factors of production, namely land and materials, labour, capital such as machinery and buildings, and enterprise, together with energy and information.
      - term: Processes
        text: The activities that transform the inputs, such as making, assembling, mixing, moving, storing and checking, and in services, serving the customer directly.
      - term: Outputs
        text: The goods and services sold to customers, and also unwanted outputs such as waste, emissions and noise, which operations must manage too.
      - term: Added value
        text: The difference between what customers pay for the output and the cost of the materials and services bought in to make it. Operations creates value by turning inputs into something worth more, and destroys it through waste, delays and faults.
      - term: Efficiency and effectiveness
        text: Efficiency is producing an output with as few resources as possible; effectiveness is producing the right output, one that meets customers' needs. An operation can be very efficient at making something customers do not want.
    diagram: inputs-outputs
    example:
      title: Added value in a loaf
      fictional: true
      text: |
        Each sourdough loaf at Copperleaf uses $0.62 of bought-in flour, salt, yeast and packaging. It sells for $3.20 in Copperleaf's shops and $2.40 to cafés, so the bakery adds $3.20 − $0.62 = **$2.58** of value to a loaf sold in a shop, and $2.40 − $0.62 = **$1.78** to one sold to a café.

        Out of that added value come the bakers' wages, the rent, the ovens and any profit. A loaf that is baked and then thrown away adds no value at all, but its flour, energy and labour have still been paid for.
  - id: goods-and-services
    title: Operations for goods and for services
    kind: types
    body: |
      Operations management applies to services as much as to goods, but services raise problems of their own. A **good** is tangible: it can be made in advance, stored, checked before the customer sees it and transported. A **service** is intangible: it is usually produced at the moment it is consumed, often with the customer present, so it cannot be stored, inspected before delivery or easily standardized. A hotel room left empty tonight is revenue lost for ever; a car not sold today can still be sold next month.

      These differences change what operations managers do. A manufacturer can smooth production by building stock in quiet months; a service business must match its capacity to demand hour by hour, through rotas, appointments and prices that change with demand. A manufacturer controls quality mainly inside its factory; a service business depends on the behaviour of its front-line staff at the moment of service, which is why the marketing mix for services adds people, processes and physical evidence (4.5).

      Most products sit between the two. A restaurant sells food, a good, together with the service of cooking and serving it; a car maker sells finance, servicing and warranties as well as cars; a software company's product is code, delivered as a service. The four sectors of 1.1 give the same picture: primary and secondary operations are mostly about goods, tertiary and quaternary operations mostly about services, and most businesses now combine both.
    points:
      - term: Tangibility
        text: Goods can be seen and touched before they are bought; services cannot, so customers judge them by cues such as staff, premises and reviews.
      - term: Storability
        text: Goods can be held as stock; most services perish if they are not used at the moment they are offered, such as an empty seat on a flight.
      - term: Customer involvement
        text: Goods are usually made away from the customer; many services are produced with the customer present, so the customer becomes part of the process.
      - term: Standardization
        text: Goods can be made identically by machines; services vary with the person delivering them and the customer receiving them.
      - term: Correcting faults
        text: A faulty good can be caught before it leaves the factory; a poor service is experienced before anyone can put it right.
    example:
      title: Bread and service at Copperleaf
      fictional: true
      text: |
        Copperleaf sells both. Its bread is a good: it can be baked overnight, checked, packed and delivered. Its shops and deliveries are services: the welcome at the counter, the length of the queue at 8 a.m., and a van that must reach each café before it opens.

        Bread keeps fresh for only a few hours, which makes it almost as perishable as a service, so the night's baking must match the next morning's orders closely. Too little, and cafés go short; too much, and the surplus is thrown away. That is why waste and late deliveries are operations problems, not marketing ones.
  - id: operations-objectives
    title: What operations aims for
    kind: framework
    body: |
      Operations managers judge their work against a small set of objectives. The guide does not list them, but operations textbooks commonly describe five, set out below: cost, quality, speed, dependability and flexibility. Sustainability, one of the course's four key concepts, is increasingly treated as a sixth. Together they describe what customers and owners expect from the way a business makes and delivers its products.

      The objectives pull against each other, so no operation can be best at all of them. Making a wide range of products (flexibility) usually costs more per unit than making one product in volume; promising delivery within the hour (speed) means keeping spare staff and stock, which raises cost; checking every item (quality) slows production down. Operations management is therefore a matter of choosing which objectives matter most to the business's customers and strategy, and accepting a cost on the others. A budget airline and a private jet company both fly passengers, but they rank these objectives in almost opposite orders.

      **Efficiency** links several of them. An efficient operation produces its output with few resources: little waste of materials, little idle time for staff and machines, and a low **unit cost**, the average cost of producing one unit. Unit cost falls when fixed costs are spread over more output and when less is wasted, which is why capacity, waste and the production method (5.2) matter so much.
    points:
      - term: Cost
        text: Producing at a low cost per unit, which allows lower prices or higher margins. It depends on efficiency, scale and waste.
      - term: Quality
        text: Meeting customers' expectations consistently, every time. A fault that reaches a customer costs far more, in refunds and reputation, than one prevented in the process.
      - term: Speed
        text: How quickly a customer receives the product after asking for it.
      - term: Dependability
        text: Delivering when promised. For a café that opens at 7 a.m., bread that arrives at 7.30 is a failure, however good it is.
      - term: Flexibility
        text: The ability to change what is produced, how much or when, such as handling a rush order or adding a new product, without large extra costs.
      - term: Capacity utilization
        level: HL
        text: At HL, subtopic 5.6 measures how fully an operation uses what it could produce, with the guide's formula (p. 65), capacity utilization rate = actual output ÷ productive capacity × 100. Copperleaf's ovens can bake 3,000 loaves a day, so at 2,400 loaves they run at 2,400 ÷ 3,000 × 100 = 80% of capacity.
    formulas:
      - name: Unit cost (average cost)
        expression: Unit cost = total costs ÷ output
        note: Total costs are fixed costs plus variable costs (3.3). A standard form; the guide's formula list does not include it.
    example:
      title: What waste costs Copperleaf
      fictional: true
      text: |
        Copperleaf's fixed costs, such as rent, oven leases and salaried staff, come to $1,560 a day. Each loaf has a variable cost of $0.95 in ingredients, packaging, energy and hourly wages.

        - **Unit cost at 2,400 loaves:** total costs = $1,560 + (2,400 × $0.95) = $3,840, so $3,840 ÷ 2,400 = **$1.60** a loaf baked.
        - **The effect of waste:** with 8% unsold, only 2,208 loaves are sold, so each loaf sold really costs $3,840 ÷ 2,208 = **$1.74**.
        - **Cutting waste to 3%:** baking 2,276 loaves to sell the same 2,208 saves 124 loaves a day, or 124 × $0.95 = $117.80 a day, about $42,400 over 360 baking days, and far less bread goes to waste.

        Better forecasting of each café's order, an operations task, would improve cost, dependability and sustainability at the same time.
  - id: operations-decisions
    title: The decisions operations managers make
    kind: application
    body: |
      The role of operations management is clearest in the decisions it takes. Some are long-term and expensive to reverse: which production method to use, how much capacity to build and where to locate. Others are made every day: how much to make, in what order, with which staff, and how to keep quality up and costs down. Most of the rest of unit 5 studies these decisions one by one.

      Each decision shapes the objectives in the previous section. A larger kitchen adds capacity but raises fixed costs; a cheaper location may lengthen deliveries; buying a part instead of making it may save money but gives up control of its quality. Good operations decisions start from what the business's customers value most and what its strategy needs, not from what looks cheapest in isolation.
    points:
      - term: Design of the product and the process
        text: What exactly will be made or offered, and the sequence of steps that produces it. Good design makes a product easy to make well, first time.
      - term: Operations method (5.2)
        text: Job, batch or mass production, or mass customization, depending on the volume and variety of output.
      - term: Location and make or buy (5.4)
        text: Where to produce, which activities to keep in-house and which to buy from other firms, and whether to reorganize production by outsourcing, offshoring, insourcing or reshoring.
      - term: Technology and layout
        text: Which equipment to use, how far to automate, and how to arrange the workplace so that work flows without delays or wasted movement.
      - term: Capacity, stock and the supply chain (5.6)
        level: HL
        text: At HL, how much the operation can produce, how much stock to hold, and how materials flow from suppliers to customers, locally and globally.
      - term: Lean production and quality (5.3)
        level: HL
        text: At HL, cutting waste through continuous improvement and just-in-time, and managing quality through quality control, quality assurance and total quality management.
      - term: Planning projects (HL toolkit)
        level: HL
        text: Gantt charts and critical path analysis, HL tools the guide suggests for unit 5 (p. 33), schedule the activities of a project and show which delays would hold up the whole.
      - term: Risk, innovation and information (5.7 to 5.9)
        level: HL
        text: At HL, preparing for crises through contingency planning, developing new products and processes through research and development, and using management information systems and data to decide.
    example:
      title: Hana's list
      fictional: true
      text: |
        Hana sorts Copperleaf's problems by the decision behind them. Late deliveries are a scheduling and capacity problem: the vans leave late because the last batches finish at 6.40 a.m. Inconsistent sourdough is a process problem: three bakers follow three versions of the recipe. Waste is a planning problem: the shops bake to habit, not to a forecast of what they will sell.

        None of the three needs more customers. Each needs a decision about how the bakery works.
  - id: operations-and-other-functions
    title: Operations and the other business functions
    kind: application
    body: |
      Operations cannot work alone. **Marketing** tells it what to make, how much and by when, through research, sales forecasts and the promises made in the marketing mix, and operations decides whether those promises can be kept. **Finance and accounts** funds equipment, stock and buildings, sets budgets, and counts the costs that operations creates, which then shape prices and profit. **Human resources** recruits, trains and motivates the people the production method needs, in the right numbers and with the right skills, and plans their shifts (2.1).

      The functions often want different things. Marketing wants variety and fast delivery to please customers; operations wants long, steady runs of standard products to keep costs down. Finance wants little money tied up in stock; operations wants a buffer in case a delivery is late. HR must find people willing to work the hours that production needs. None of these wishes is wrong, but they cannot all be met, so good management settles the conflicts through planning and communication, and makes the trade-offs deliberately rather than by accident.

      This is why an operations decision is never only an operations decision, and why an examination answer about one should follow its consequences into the other functions and out to the stakeholders.
    points:
      - term: Marketing and operations
        text: Forecasts and the marketing mix set volumes, features and delivery promises; in return, operations' costs, capacity and quality limit what marketing can promise and the prices it can charge.
      - term: Finance and operations
        text: Finance funds the equipment and stock that operations needs and judges investments in them (3.8); operations' efficiency largely determines the business's costs and profit margins.
      - term: Human resources and operations
        text: The production method decides how many people are needed, with what skills and on which shifts; recruitment, training and motivation decide how well the work is done.
      - term: Shared information
        text: Each function needs the others' plans. A sales campaign that operations was not told about, or a machine breakdown that marketing did not hear of, ends in disappointed customers.
    example:
      title: One decision, four functions
      fictional: true
      text: |
        Copperleaf's plan to start baking at 2 a.m. instead of 4 a.m. looks like an operations decision. It is also an HR decision, because the bakers' contracts, their pay for unsocial hours and their safety on a night shift must all change. It is a finance decision, because the extra energy and wages must be paid for. And it is a marketing decision, because it would let cafés offer fresh bread from 7 a.m., a promise Copperleaf could then advertise.
  - id: sustainable-and-ethical-operations
    title: Sustainable and ethical operations
    kind: concept
    body: |
      Sustainability is one of the course's four key concepts, and the guide describes it through the triple bottom line of people, planet and profit (p. 13). Operations is where most of a business's effect on the environment arises, from the materials and energy it uses to the waste and emissions it produces. The guide's conceptual understandings for unit 5 put the link directly: sustainability ensures efficiency in business operations, and operational changes may affect a business's ethical stance (p. 33).

      Sustainability and efficiency often point the same way. Using less energy, wasting fewer materials and keeping products in use for longer cut costs as well as harm to the environment. The toolkit's **circular business models**, the five shown in the diagram, are ways of designing waste out of operations instead of following a pattern of take, make, use and throw away. But not every sustainable choice saves money. Recycled materials, cleaner energy and fair pay for suppliers' workers can all cost more, at least at first, so the business must decide how far to go and how to explain its choices honestly.

      Ethics runs through operations as well: the safety and working conditions of employees, the treatment of the workers who make a supplier's goods, honesty about what a product contains, and the effect of a site on its neighbours. Switching to a supplier with poor labour standards may look efficient, but it changes the business's ethical stance, and the damage to its reputation when the truth comes out can cost far more than was saved.
    points:
      - term: Circular supply models
        text: Using inputs that can be regrown, composted or recycled, such as plant-based materials or recycled metal, instead of new raw materials.
      - term: Resource recovery models
        text: Collecting used products, scraps and by-products and turning them into materials or energy that can be used again.
      - term: Product life extension models
        text: Keeping products in use for longer through durable design, repair, maintenance, upgrading and resale.
      - term: Sharing models
        text: Letting many people use one item by renting, borrowing or sharing it, often arranged through an app.
      - term: Product service system models
        text: Selling the use or performance of a product, by leasing or paying per use, while the business keeps ownership and so has a reason to make it last.
    diagram: circular-business-models
    advantages:
      - Less waste and energy lower costs as well as harm to the environment.
      - A genuine record on sustainability and ethics strengthens the brand and customers' loyalty.
      - It helps to recruit and keep employees who care about how the business behaves.
      - It reduces exposure to rising prices of scarce materials and to tighter regulation.
    limitations:
      - Sustainable materials, equipment and fair pay for suppliers' workers can cost more, at least at first.
      - Benefits such as reputation are hard to measure, while the costs are immediate.
      - Claims that operations do not support are greenwashing, and they destroy trust when exposed.
      - Price-sensitive customers may not pay more for a more sustainable product.
    example:
      title: Copperleaf's waste, put to use
      fictional: true
      text: |
        Copperleaf's unsold bread used to go in the bin. Hana now sends the day-old loaves to a local food bank, and a nearby brewery collects the rest to brew into beer, a resource recovery model.

        Cutting waste from 8% to 3% matters more, though: the most sustainable loaf is the one that was never baked without a buyer. Together the two changes cut costs, reduce what goes to landfill and give the bakery a story its customers value.
applications:
  - industry: Manufacturing
    text: Operations is most visible here, in production lines, stock and quality checks. Unit cost and dependability dominate, and the production method (5.2) and the location (5.4) are the decisions with the longest consequences.
  - industry: Hospitality
    text: The service is produced in front of the customer, so operations means matching staff to demand hour by hour, managing the flow of guests through check-in or a dining room, and keeping each visit as good as the last. Empty rooms and tables cannot be stored, which makes forecasting demand central.
  - industry: Healthcare
    text: In a hospital, quality means safety, and dependability can be a matter of life and death. Operations managers plan the flow of patients through beds, theatres and clinics, where a bottleneck in one ward delays every other.
  - industry: Digital services
    text: For a software or streaming business, operations means keeping servers running, releasing updates and protecting data. Serving one more customer costs very little, so the challenge is reliability and security at scale rather than the cost of each unit.
  - industry: Agriculture
    text: In the primary sector, operations works with nature. Harvests depend on weather and seasons, produce is perishable, and land and water are finite, so sustainable practices, such as careful use of water and soil, are a condition of the business surviving at all.
stakeholders:
  - group: Customers
    text: Experience operations directly, as the price, quality and speed of what they buy. A business that cuts costs at the expense of quality or dependability loses them.
  - group: Employees
    text: Their jobs, hours and safety are shaped by operations decisions such as shifts, automation and the production method. Efficiency gains can mean pressure, unsocial hours or job losses, a conflict with owners who want lower costs.
  - group: Owners and shareholders
    text: Want operations to keep costs down and quality up, because both drive profit. Investment in equipment or in sustainability may reduce profit in the short term even when it raises it later.
  - group: Suppliers
    text: Depend on the business's schedules and payments. A business that squeezes their prices or changes orders at short notice gains in the short term but can lose reliable partners.
  - group: Local community
    text: Gains jobs and spending from a business's operations but bears their noise, traffic and pollution, so an expansion that pleases the owners can be opposed by the neighbours.
evaluation:
  - Operations is where promises are kept or broken. Most of a business's costs, and most of what customers experience, come from operations, so it is a source of competitive advantage that is harder to copy than a price or an advertisement.
  - Efficiency is not the same as effectiveness. Cutting unit cost is worthwhile only if the output still meets customers' needs; an operation that is cheap but late or unreliable loses the customers it was meant to serve.
  - Every operation trades its objectives off against each other. The right balance depends on what the business's customers value and on its strategy, so judge an operations decision against the business's own position, not against an ideal of being best at everything.
  - Operations decisions ripple through the business. A change of method, shift pattern or location affects staff, finance and marketing, so a full analysis follows the consequences across functions and stakeholders.
  - Sustainability and efficiency often align, but not always. Less waste and energy save money; ethical sourcing and cleaner materials can cost more. Judge each case on its evidence, and be wary of claims of sustainability that the operations do not support.
  - In an examination, 5.1 is set at AO2. Explain and analyse the role of operations in the case's own business, with its own inputs, processes and outputs, rather than giving a general definition.
decision:
  title: Copperleaf's growing pains
  fictional: true
  brief: |
    Copperleaf Bakery, a fictional business, bakes about 2,400 loaves a day: 1,300 for its three shops and 1,100 for 14 cafés, which pay $2.40 a loaf against $3.20 in the shops. Its ovens can bake about 3,000 loaves a day, but the morning rush means the last batches finish too late for the café vans, and three more cafés want to join next year.

    Each loaf has a variable cost of $0.95, and the bakery's fixed costs are $1,560 a day, so a loaf costs $1.60 to bake at today's output. Hana has three proposals for the board.
  options:
    - label: Buy a second oven and add a night shift
      text: A second oven costs $85,000 and a night shift of three bakers $96,000 a year. Capacity would rise to about 5,000 loaves a day, and the café bread could be finished by 5 a.m.
    - label: Narrow the range and bake to forecast
      text: Cut the range from 38 products to 22, so that each oven bakes longer runs with fewer changes, and bake shop bread to a daily forecast instead of habit.
    - label: Outsource the café orders
      text: Buy the 1,100 café loaves from a large contract bakery at $1.45 a loaf, delivered, and keep Copperleaf's own ovens for its shops.
  guidance: |
    Judge each option against the operations objectives and its effects on the other functions, not on cost alone.

    Option A tackles capacity and dependability directly, keeps quality in Copperleaf's hands and makes room for the three new cafés. But it commits $85,000 of capital, which finance must raise, and a night shift that HR must recruit, pay and keep safe. At today's output the bakery would use less than half of its new capacity, so its fixed costs would rise faster than its output until demand grows.

    Option B costs little and attacks waste and inconsistency, the causes that need no new money. Fewer changes between products raise efficiency, and baking to a forecast could cut waste from 8% towards 3%. The cost falls on marketing: customers who loved the products that disappear may go elsewhere, and the range is part of Copperleaf's appeal.

    Option C solves the capacity problem at once, but at a price. Each café loaf baked in-house earns a contribution of $2.40 − $0.95 = $1.45; bought in at $1.45, it would earn only $0.95, so the café trade would contribute $550 a day less. Copperleaf's fixed costs would stay while its own output fell to 1,300 loaves, raising the unit cost of its shop bread from $1.60 to about $2.15. And the cafés would be selling another bakery's bread delivered in Copperleaf's van, a risk to quality, and an ethical one if they are not told.

    A strong answer might start with B, because it is cheap and fixes the causes, and plan for A if café demand keeps growing, while saying what evidence would change the order, such as a firm forecast of café orders or the results of a month's trial with the narrower range.
exam:
  - q: Define the term *operations management*.
    marks: 2
    command: define
    paper: '1'
    answer: |
      A precise definition: the business function that plans, runs and improves the processes that turn inputs into the goods and services a business sells.

      A full answer names both the transformation of inputs into outputs and the management of it. "Making products" alone is incomplete, because it leaves out services and the planning and control that the function provides.
  - q: Explain the role of operations management at Copperleaf Bakery.
    marks: 4
    command: explain
    paper: '1'
    answer: |
      A strong answer applies the role to the bakery rather than defining it in general:

      - Operations transforms inputs (flour, the bakers' labour, ovens, energy) into outputs (bread for the shops and cafés), adding value: a shop loaf sells for $3.20 against $0.62 of bought-in materials.
      - It is responsible for doing this at the right quality, quantity, time and cost: consistent sourdough, enough loaves without waste, and deliveries before the cafés open.
      - The case shows what happens when the role is done badly: late deliveries, inconsistent bread, 8% waste and rising overtime, all operations problems.
  - q: Distinguish between operations that produce goods and operations that produce services, with reference to Copperleaf Bakery.
    marks: 4
    command: distinguish
    paper: '1'
    answer: |
      A strong answer sets out a clear difference and applies it to both sides of the bakery:

      - Goods are tangible and can be made in advance, stored and checked before sale: Copperleaf bakes overnight and checks each batch.
      - Services are intangible and produced as they are consumed, usually with the customer present, so they cannot be stored or checked in advance: the welcome in the shop and the delivery to each café happen once, in real time.
      - A consequence for operations: goods can be stocked to smooth production, but services, and very perishable goods like bread, must match capacity to demand closely.
  - q: |
      Copperleaf's fixed costs are $1,560 a day, and each loaf has a variable cost of $0.95.

      Calculate the unit cost of a loaf when the bakery bakes (i) 2,400 loaves a day and (ii) 3,000 loaves a day.
    marks: 4
    command: calculate
    paper: '2'
    answer: |
      - (i) Total costs = $1,560 + (2,400 × $0.95) = $1,560 + $2,280 = $3,840. Unit cost = $3,840 ÷ 2,400 = **$1.60**.
      - (ii) Total costs = $1,560 + (3,000 × $0.95) = $1,560 + $2,850 = $4,410. Unit cost = $4,410 ÷ 3,000 = **$1.47**.

      Show total costs before dividing. The unit cost falls because the fixed costs are spread over more loaves: $0.65 a loaf at 2,400, but $0.52 at 3,000.
  - q: Analyse how a decision to add a night shift would affect Copperleaf's other business functions.
    marks: 6
    command: analyse
    paper: '1'
    answer: |
      A strong answer takes each function in turn and traces cause and effect, using the case:

      - **Human resources:** three bakers must be recruited and trained; contracts, pay for unsocial hours and safety at night must be arranged; the night shift may also ease the overtime that is driving experienced bakers to resign.
      - **Finance:** wages of about $96,000 a year, and the $85,000 oven if capacity is added, must be funded and budgeted; at today's output, fixed costs would rise faster than output.
      - **Marketing:** earlier baking means café bread on time and fresh from 7 a.m., a promise Copperleaf could advertise, and room for the three new cafés.
      - **A conclusion on balance:** for example, the shift helps marketing and may help retention, but only pays if café demand grows to use the extra capacity.
  - q: |
      Copperleaf is considering buying its 1,100 café loaves a day from a contract bakery at $1.45 a loaf, instead of baking them. The cafés pay $2.40 a loaf, and a loaf baked in-house has a variable cost of $0.95.

      Recommend whether Copperleaf should outsource its café orders.
    marks: 10
    command: recommend
    paper: '2'
    answer: |
      This question also draws on 5.4, where outsourcing is set at AO3. A strong answer weighs the option against the role of operations and reaches a justified recommendation:

      - **The figures:** an in-house café loaf contributes $1.45; a bought-in one $0.95, so the café trade would contribute $550 a day less. Fixed costs of $1,560 would remain while output fell to 1,300, raising the unit cost of shop bread from $1.60 to about $2.15.
      - **For outsourcing:** it frees capacity at once, ends the late deliveries and the overtime, and the contract bakery's scale may bring consistency.
      - **Against:** a loss of contribution, a loss of control over quality and of Copperleaf's distinctive bread, dependence on one supplier, and an ethical question if cafés are not told whose bread they are selling.
      - **Alternatives:** narrowing the range and baking to forecast, or a second oven and a night shift, may solve the problem while keeping the café trade's contribution.
      - **Judgement:** for example, recommend against outsourcing now, because it gives away contribution and control to fix a problem that cheaper changes may solve; reconsider if café demand outgrows any realistic expansion. State what would change the decision.
summary:
  - Operations management plans, runs and improves the processes that turn inputs into goods and services.
  - Inputs, the factors of production, are transformed into outputs; operations should add value, and it must also manage unwanted outputs such as waste.
  - Goods can be stored and checked before sale; services are usually produced as they are consumed, often with the customer present.
  - Operations aims for low cost, quality, speed, dependability and flexibility, and increasingly sustainability. The objectives conflict, so each business chooses which matter most.
  - Unit cost = total costs ÷ output. It falls as fixed costs are spread over more output and as waste is cut.
  - Operations makes long-term decisions (method, capacity, location, make or buy) and daily ones (scheduling, quality, stock).
  - Operations depends on marketing, finance and human resources, and a change in operations affects them all.
  - Sustainable and ethical operations, including circular business models, can cut costs and protect reputation, though some choices cost more.

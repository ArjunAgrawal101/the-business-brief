# Notes: 5.7 Crisis management and contingency planning (HL only). Written in
# the platform's own words from the guide's three content statements (p. 35),
# so every section and question is HL. The guide sets no formula for this
# subtopic: the expected values use the decision tree method from the toolkit
# (guide pp. 13 to 14) in the form used across the site (data/calculations.yaml),
# and the risk score is a common risk-assessment practice that the guide does
# not require, labelled as such. The supplied coursebook chapter (Hodder, pp.
# 534 to 539) was read only to check coverage and terminology; no passage,
# example or case from it is reproduced. Every business named is fictional and
# every figure simulated; each figure was checked by script.
code: '5.7'
title: Crisis management and contingency planning
level: HL
introduction: |
  Sooner or later every business meets an event it did not want: a faulty product, a fire, a cyberattack, a supplier that collapses overnight. What separates the businesses that recover from those that do not is rarely luck. It is whether they prepared before the event, through **contingency planning**, and how well they responded during it, through **crisis management**.

  This HL subtopic asks you to tell the two apart and to explain the four factors that make a crisis response effective (both AO2), and then to judge what contingency planning costs and gains a particular organization in money, time, risk and safety (AO3).
objectives:
  - '**Distinguish** between contingency planning and crisis management, and explain how each supports the other.'
  - '**Explain** how transparency, communication, speed and control affect how well a crisis is managed.'
  - '**Analyse** a business''s response to a crisis using those four factors.'
  - '**Evaluate** the impact of contingency planning on cost, time, risks and safety for a given organization or situation.'
  - '**Recommend** which risks an organization should plan for, and how far, using the evidence in a case.'
situation:
  title: A Friday evening at Brennock Dairy
  fictional: true
  text: |
    Brennock Dairy, a fictional family business, makes yoghurts and desserts for about 400 supermarkets from a single plant. At 6 p.m. on a Friday, an engineer finds that a rubber seal inside one filling machine has split, and small pieces of it are missing. The machine has filled strawberry yoghurt all afternoon, and about 18,000 pots are already in lorries on their way to stores. Nobody knows yet whether any pot contains a fragment.

    The managing director would rather wait for Monday's laboratory results than alarm the supermarkets. The production manager wants every pot from that line withdrawn tonight. The sales director is worried about the supermarkets' reaction and a story in the local news. Brennock has no written recall plan: three years ago the board decided one would cost too much for an event that had never happened, so nobody is sure who should phone whom, or which batches went to which stores.

    What should Brennock do in the next few hours, and was its board right not to plan for a night like this?
sections:
  - id: what-is-a-crisis
    title: What makes an event a crisis
    kind: concept
    level: HL
    body: |
      A **crisis** is a sudden, usually unexpected event that seriously threatens a business's people, operations, finances or reputation, and that demands a response before the full facts are known. Most problems a business meets are routine: a machine breaks, a customer complains, a delivery is late, and normal procedures deal with them. An event becomes a crisis when it is too serious, too fast or too public for those procedures to cope.

      Crises share a pattern. They threaten something that matters, very often people's safety. They arrive with little warning, or build quietly until they suddenly break into the open. They leave little time to decide, so managers must act on incomplete and changing information. And they draw attention from customers, employees, investors, regulators and the media, and from thousands of people sharing photographs and opinions online within minutes.

      The cause can be **internal**, in the business's own decisions and systems, or **external**, in its environment. The difference shapes the response. Stakeholders forgive a business hit by a flood more readily than one whose own failings caused the harm, so an internal cause puts more weight on honesty and on putting things right. Either way, how a business handles a crisis often affects its reputation more than the event itself.
    points:
      - term: Features of a crisis
        text: A serious threat, an element of surprise, urgency, incomplete information and intense scrutiny. An event with all five is a crisis, whatever the size of the business.
      - term: Internal causes
        text: A product fault or contamination, an industrial accident or a fire started by faulty equipment, a failure of the business's own IT systems, fraud or misconduct by managers or staff, or a sudden shortage of cash.
      - term: External causes
        text: Floods, storms and other natural disasters, a pandemic, a cyberattack, the collapse of a key supplier or customer, a sudden change in the law, or political unrest in a country where the business operates.
      - term: Sudden or slow-burning
        text: Some crises strike without warning, such as a fire. Others build for months, such as a stream of ignored customer complaints or a safety concern raised by staff and never acted on, until a single event makes them public.
      - term: A risk or a crisis?
        text: A risk is something that might happen; a crisis is a serious risk that has happened, or is happening now. Contingency planning works on risks, and crisis management deals with crises.
    example:
      title: Two crises, two causes
      fictional: true
      text: |
        Brennock Dairy's split seal is an **internal** crisis: its own maintenance missed a worn part, so stakeholders will judge it above all on how honestly it owns the problem.

        Suppose that a week later a flood closes the only road to the plant for two days, so no milk can come in and no yoghurt can go out. That is an **external** crisis. Nobody blames Brennock for the rain, but the supermarkets will still judge whether it kept them informed and found another way to deliver.
  - id: planning-or-managing
    title: Contingency planning and crisis management
    kind: concept
    level: HL
    body: |
      The guide asks you to know the difference between the two, and answers that blur them are common. The simplest test is **timing**.

      **Contingency planning** happens *before* anything goes wrong. It means identifying the events that could seriously harm the business, judging how likely and how damaging each one is, and deciding in advance how the business would respond: who would do what, with what resources, and who would tell which stakeholders. It is **proactive**: it anticipates. A contingency plan may never be used, and the best outcome is often that it is not.

      **Crisis management** happens *during* a crisis and straight after it. It is the work of protecting people, containing the damage, keeping stakeholders informed and getting the business back to normal operations. It is **reactive**: it responds to what is actually happening, which is never exactly what anyone planned.

      The two depend on each other. A contingency plan is the starting point for crisis management, because it saves the hours that would otherwise go on working out who is in charge and what to do first. Every crisis then tests the plan, and a good business reviews afterwards what worked and rewrites the plan, so the cycle starts again. A business can manage a crisis without a plan, but it starts later and makes more mistakes; a plan without leaders able to adapt it on the day is only paper.
    diagram: crisis-contingency
    points:
      - term: When
        text: Contingency planning comes before an event, in calm conditions. Crisis management comes during and just after it, under pressure.
      - term: Purpose
        text: Contingency planning prepares a response to events that may never happen. Crisis management limits the harm from an event that has happened.
      - term: Mindset
        text: Contingency planning is proactive and deliberate, with time to consult and test. Crisis management is reactive and fast, with decisions taken on incomplete information.
      - term: Cost
        text: Contingency planning costs time and money now, for an uncertain return. Crisis management costs whatever the crisis demands, and the bill is usually larger without a plan.
      - term: How they connect
        text: The plan speeds up and steadies the response, the response tests the plan, and the review after the crisis improves the next plan.
    example:
      title: What a plan would have given Brennock
      fictional: true
      text: |
        With a recall plan, Brennock's engineer would have phoned a named duty manager, who would have called together a crisis team of four with an agreed list of first tasks. Batch codes would have shown at once which stores had received the afternoon's yoghurt, and prepared notices for supermarkets and customers would have needed only the details filling in.

        Instead, the managers spent the first three hours arguing about whose decision it was and searching paper delivery notes. The plan would not have prevented the split seal. It would have turned a chaotic evening into a practised routine, and that is the difference between contingency planning and crisis management.
  - id: making-a-plan
    title: How a contingency plan is made
    kind: method
    level: HL
    body: |
      No business can plan for everything, so contingency planning starts by deciding what is worth planning for. The usual test combines two questions: how **likely** is the event, and how **damaging** would it be? Events that score high on both deserve the most preparation. Events that are unlikely but catastrophic, such as a fire that destroys the only factory, still need a plan or insurance, because the business might not survive them. Events that are both unlikely and minor can simply be accepted.

      A typical process has six stages:

      1. **Identify the risks**, by asking staff in every department, studying past incidents in the business and its industry, and scanning the environment with tools such as [STEEPLE analysis](/toolkit/steeple-analysis/) and SWOT analysis.
      2. **Assess each risk** for likelihood and impact, and rank them.
      3. **Decide the response** to each risk worth acting on: remove it, reduce it, insure against it, or prepare to deal with it.
      4. **Write the plan**: the crisis team and its leader, each person's role and deputy, the resources set aside, the alternative suppliers or sites, and how each stakeholder group will be told.
      5. **Train and rehearse**, through drills and desk-top exercises in which managers work through an imagined crisis hour by hour.
      6. **Review and update** the plan regularly, and after every incident or near miss, because staff, suppliers, technology and risks keep changing.

      The process often pays off before any crisis happens. Looking hard at what could go wrong exposes weaknesses, such as dependence on one supplier, one machine or one key person, that can be fixed at once.
    points:
      - term: Alternatives and backups
        text: A second approved supplier, a standby agreement to use another firm's site or equipment, copies of data held off site or in the cloud, spare parts for critical machines, and buffer stock of key materials.
      - term: People
        text: A named crisis team with clear roles and deputies, staff trained in more than one job so that absences can be covered, and up-to-date contact details for everyone who must be reached at night or at weekends.
      - term: Communication
        text: A list of stakeholders to contact and in what order, a trained spokesperson, prepared statements that need only the facts adding, and agreed channels such as a website notice, social media and a phone line. Some businesses also arrange in advance to call on public relations specialists.
      - term: Money
        text: Insurance against property damage, lost profits and product recalls, and a cash reserve or agreed overdraft to pay the immediate costs of a crisis.
      - term: Rehearsal
        text: A plan that has never been tested usually fails in ways nobody expected. Drills show whether the phone numbers work, whether people know their roles and how long each step really takes.
    formulas:
      - name: Risk score
        expression: Risk score = likelihood score × impact score
        note: A common risk-assessment practice, usually with each score on a scale of 1 to 5. It is not on the guide's list of formulae and the guide does not require it. It ranks risks rather than measuring them, because both scores are judgements.
    example:
      title: Brennock's risk register
      fictional: true
      text: |
        After the recall, Brennock's managers score six risks from 1 (low) to 5 (high). The scores are their own judgements.

        - Foreign body in a product: likelihood 3, impact 5, **score 15**.
        - Breakdown of the main cold store: likelihood 3, impact 4, **score 12**.
        - Ransomware locking the ordering system: likelihood 3, impact 3, **score 9**.
        - Failure of the only supplier of fruit purée: likelihood 2, impact 3, **score 6**.
        - Fire putting the plant out of action: likelihood 1, impact 5, **score 5**.
        - Loss of the main haulier for a week: likelihood 2, impact 2, **score 4**.

        They write full plans for every risk scoring 9 or more, and for the fire as well, because an impact of 5 could end the business however unlikely it is. They approve a second purée supplier, which removes most of that risk at little cost, and accept the haulier risk, since other hauliers could be hired within days.
  - id: four-factors
    title: 'Effective crisis management: transparency, communication, speed and control'
    kind: framework
    level: HL
    body: |
      The guide names four factors that affect how effective crisis management is. They are not a list to recite. They are the four questions stakeholders ask, consciously or not, as they watch a business handle a crisis: are you being honest with us, are you telling us what we need to know, are you acting fast enough, and is anyone actually in charge?

      The factors depend on each other. Speed without control produces confusion and contradictory statements. Control without communication looks like a cover-up. Transparency that arrives days late is no longer transparency, because others will have told the story first. And communication without transparency is spin, which stakeholders usually detect. The most effective responses are fast, honest, clear and coordinated at the same time.

      The factors can also pull against each other, and handling the tension is where judgement comes in. Lawyers may advise saying little, to avoid admitting liability, when transparency calls for saying more. Acting fast risks announcing facts that later prove wrong. Tight central control can stop local managers acting on what they see in front of them. When the factors conflict, a sound rule is to put people's safety first, honesty second, and the business's legal and financial position after both.
    points:
      - term: Transparency
        text: Being open and honest about what has happened, what the business knows and does not yet know, what it is doing about it, and its own part in the cause. Transparency builds the trust a business needs to come through a crisis. Silence or evasion lets rumours fill the gap, and a cover-up that is later exposed turns a crisis into a scandal.
      - term: Communication
        text: Getting clear, consistent and timely messages to every stakeholder group, through the channels each one uses, and listening in return. Employees should hear the news from their employer, not from the media. One trained spokesperson, updates at stated times and a helpline or web page for questions keep the message consistent. The barriers to communication in subtopic 2.6, such as jargon and information overload, matter more under pressure, not less.
      - term: Speed
        text: Acting quickly to protect people, contain the damage and get ahead of the story. The first hours of a crisis often decide how the public sees it, and delay lets a problem spread, physically and online. But speed is not haste. A rushed statement that later proves wrong damages trust more than a short delay, and a rehearsed plan is what lets a business be fast without being careless.
      - term: Control
        text: Someone clearly in charge, with the authority, information and resources to act, usually a small crisis team with a leader, defined roles and one up-to-date account of the facts. Control means directing the response, checking whether actions are working and adjusting them. It does not mean controlling information by hiding it. A more directive, even autocratic, leadership style (subtopic 2.3) often suits the first hours of a crisis.
    example:
      title: Brennock's next 48 hours, done well
      fictional: true
      text: |
        - **Control:** by 7 p.m. the managing director is leading a crisis team of the heads of production, sales and quality, with a deputy who logs every decision and every confirmed fact.
        - **Speed:** by 9 p.m. the lorries have been called back and the supermarkets have taken the afternoon's batch off their shelves, without waiting for Monday's tests.
        - **Communication:** supermarkets hear first, by phone and then in writing; staff are briefed before the night shift; a notice on the website and social media tells customers which batch codes to return for a refund, and a helpline opens at 8 a.m.
        - **Transparency:** the notice says plainly that a machine part failed, that no injuries have been reported and that test results will be published on Monday. They are, and they show fragments in 3 of the 400 pots tested.

        The recall costs Brennock a weekend's sales and some of the supermarkets' patience. But no customer is hurt, and no supermarket stops stocking its products.
  - id: judging-a-response
    title: Judging a crisis response
    kind: application
    level: HL
    body: |
      Examination questions often give you a crisis and ask how well a business handled it, or how it should handle it. The four factors give you a structure, but each must be applied to the evidence: what did the business actually do, when, and with what effect on which stakeholders?

      Start with the crisis itself: what is at stake, whose safety, which stakeholders, and how public it already is. Then take each factor in turn and look for evidence. How quickly did the business act, and was the speed sensible? Was it honest about the cause and about what it did not know? Did each stakeholder group hear what it needed, in time, through a channel it uses? Was someone visibly in charge, and did actions match words? Finally, judge the overall effect and say which factor mattered most in this case, because the answer changes from one crisis to the next. In a contamination it is usually speed; in a data breach, often transparency.

      Stakeholders judge the response, not only the event. A crisis handled well can even strengthen a reputation, because it shows customers and employees how the business behaves under pressure. A crisis handled badly can harm a business long after the original problem has been fixed.
    points:
      - term: Signs of a strong response
        text: Safety put first; early action, even before every fact is known; a named leader and a visible spokesperson; regular, honest updates that include what is still unknown; a clear apology where the business is at fault; and practical help for those affected, such as refunds or a helpline.
      - term: Signs of a weak response
        text: Silence or "no comment"; denial followed by reluctant admission; blaming customers, staff or suppliers; contradictory statements from different managers; legal language that ignores the people affected; and promises that are not kept.
      - term: Ethics in a crisis
        text: The temptation to hide information, delay a recall or play down harm is strongest when honesty is most expensive. Putting safety and honesty first is the ethical choice, and it usually protects the business's long-term interests as well.
    example:
      title: The same breach, two responses
      fictional: true
      text: |
        Larkspur Home and Orrin Outdoor, two fictional online retailers, suffer the same attack: criminals copy their customers' names, addresses and order histories, though not their card details.

        Larkspur detects the attack on a Tuesday and emails every customer on Wednesday, saying what was taken, what was not, what customers should watch for and what it is changing. Its chief executive answers questions in a video, a helpline opens, and a second update follows a week later.

        Orrin says nothing for ten days. Customers first learn of the breach from a journalist, and Orrin's statement then blames "a third-party supplier" and calls the incident minor. Two weeks later it admits that more data was taken than it first said.

        Larkspur does well on all four factors and keeps most of its customers. Orrin fails on speed and transparency, and its communication contradicts itself, so even customers whose data was never at risk start to shop elsewhere.
  - id: impact-of-planning
    title: 'The impact of contingency planning: cost, time, risks and safety'
    kind: evaluation
    level: HL
    body: |
      The guide asks you to judge the impact of contingency planning for a given organization or situation under four headings. Each heading has two sides, which is what makes this an AO3 statement: a strong answer weighs them for the business in the case rather than listing them.

      At the centre is a trade-off between a **certain cost now** and an **uncertain benefit later**. The costs of planning appear in every year's accounts. The benefits appear only if a crisis happens, and even then they are hard to see, because nobody records the damage that did not happen. This is why contingency planning is an easy target for cuts when profits are squeezed, and why a business that has just been through a crisis is often far readier to pay for it than one that has not.

      One way to weigh cost against risk is with **expected values**, the method behind [decision trees](/toolkit/decision-trees/) in the toolkit: multiply the cost of each event by its probability, and compare the expected cost with and without a plan. The answer is only as good as the probabilities, which are estimates. An expected value also treats a small chance of a loss that would close the business as if it were one more cost, which few owners would accept. Use the calculation to inform the judgement, not to replace it.
    points:
      - term: Cost
        text: Planning costs money in managers' time, training, rehearsals, insurance premiums, backup systems, spare capacity, buffer stock and the higher prices a second supplier may charge. Against that, a business that responds quickly and in an orderly way usually loses far less in damage, fines, compensation, lost sales and lost contracts. The question is whether the expected savings justify the certain costs.
      - term: Time
        text: Writing, testing and updating a plan takes time that could go on day-to-day work, and rehearsals take staff away from production. But in the crisis itself the plan saves the most valuable time of all. Decisions already made, roles already given and contacts already listed mean the response starts in minutes rather than hours, and the business recovers sooner.
      - term: Risks
        text: A plan lowers the likelihood of some crises, because risk assessment exposes weaknesses that can be fixed, and the damage from others. It never removes risk. A business may plan for the wrong events and be caught out by one nobody imagined, a plan that is never updated gives false confidence, and money spent preparing for a crisis that never comes has an opportunity cost.
      - term: Safety
        text: The first purpose of most plans is to protect people, whether employees, customers or the public. Evacuation drills, recall procedures and plans for dangerous incidents prevent injuries and save lives, and in many countries some of them are a legal requirement. Here the case for planning is strongest, because harm to people cannot be undone, and a business that fails to protect them faces legal action and lasting damage to its reputation.
    formulas:
      - name: Expected value (decision trees)
        expression: Expected value = Σ (probability of outcome × payoff of outcome) − cost of the option
        note: The toolkit's decision tree method, in the form used across the site; the guide gives no formula for 5.7. When the outcomes are losses, the payoffs are negative, so in the example below each option's expected cost is worked out and the lower one is better on this measure alone.
    advantages:
      - A faster, calmer and better coordinated response when a crisis happens.
      - Less damage, smaller losses and a quicker return to normal operations.
      - People are better protected, and legal duties of care are met.
      - Weaknesses, such as dependence on one supplier, are found and fixed before they cause harm.
      - Customers, insurers, lenders and investors gain confidence in the business.
    limitations:
      - It costs time and money, with no visible return if the event never happens.
      - It cannot cover every possible event, and the crisis that strikes is often one nobody planned for.
      - Plans go out of date as staff, suppliers and technology change, unless they are reviewed and rehearsed.
      - A detailed plan can make managers rigid, following the script when the situation needs fresh judgement.
      - The likelihoods and impacts it rests on are estimates, usually drawn from the past.
    example:
      title: Is a recall plan worth $25,000 a year to Brennock?
      fictional: true
      text: |
        Brennock's managers estimate a 10% chance in any year of another contamination. Without a plan, a recall would cost about $900,000, because poor records force a wide recall and some supermarkets would stop stocking its products. A batch-tracing system, a written plan and two rehearsals a year would cost $25,000 a year, and would make a recall narrower and faster, costing about $300,000. All the figures are simulated.

        - Expected annual cost without a plan: 0.10 × $900,000 = **$90,000**.
        - Expected annual cost with the plan: $25,000 + (0.10 × $300,000) = $25,000 + $30,000 = **$55,000**.

        On these estimates the plan saves $35,000 a year in expected terms. It stops paying for itself only if the chance of a recall falls below $25,000 ÷ $600,000, about **4.2%** a year. And the calculation leaves out the most important benefit, a lower chance that a customer is harmed, which strengthens the case further.
  - id: when-planning-pays
    title: Judging the impact for a given organization
    kind: application
    level: HL
    body: |
      The same plan can be essential for one business and a waste of money for another, which is why the guide asks about the impact of contingency planning *for a given organization or situation*. Before judging, look in the case for the features that decide how much planning is worth.

      The first is the **size and likelihood of the risks**. An airline, a chemicals haulier or a food manufacturer faces events that can kill people, while a small design studio's worst case is lost files and a few days' work. The second is how far the business depends on **single points of failure**: one site, one supplier, one IT system, one major customer or one key person. The third is its **resources**. A large business can afford backup sites and specialist staff, while a small one must rely on cheaper measures such as insurance, cloud backups and staff who can cover each other's jobs. The fourth is its **environment**: regulators may make some plans compulsory, business customers may demand them, and fast-changing technology or politics makes plans go stale sooner.

      Culture matters too. A plan works only if people take it seriously, turn up to the rehearsals and feel able to raise problems early. Where bad news is unwelcome, the warning signs of a crisis are often known on the shop floor long before managers hear of them.
    points:
      - term: Planning matters most when
        text: The risks include harm to people or the environment; a single failure could stop the whole business; the business is in the public eye; customers or regulators require a plan; and the cost of a crisis would be more than the business could absorb.
      - term: Lighter planning may be enough when
        text: The worst outcomes are minor and recoverable; the business has several suppliers, sites and customers; and simple measures, such as insurance and backups, cover most of the risk at low cost.
      - term: Plans and planning
        text: Even when a crisis does not match any plan, the habit of planning helps. The business already has a team, contact lists, communication channels and practice at deciding under pressure, and these carry over to events nobody foresaw.
    example:
      title: One question, two answers
      fictional: true
      text: |
        Corrin Chemicals, a fictional road haulier of industrial chemicals, and Pell Studio, a fictional three-person design agency, each ask whether a full contingency plan is worth having.

        For Corrin the answer is clearly yes. A spill could injure the public and pollute a river, its operating licence requires emergency procedures, and its customers will not hire a haulier without them. The cost of planning is small next to the cost of one unmanaged accident.

        For Pell, a full plan would be out of proportion. Its biggest risks are a stolen laptop or a ransomware attack, and cloud backups, insurance and an hour spent agreeing who calls clients if the studio cannot work cover most of the risk for a few hundred dollars a year. On cost, time, risks and safety alike, the same tool earns a different verdict.
applications:
  - industry: Food manufacturing
    text: The defining crisis is contamination, because it threatens health and spreads through a supply chain within hours. Contingency planning centres on traceability, so that a recall can be limited to the batches affected, and on mock recalls that test whether every store can be reached in time. Large retailers often expect suppliers to show a tested recall plan before they will stock their products.
  - industry: Hospitality
    text: Hotels and restaurants plan for fires, food poisoning, outbreaks of illness and accidents to guests, where safety comes first and any incident can appear in online reviews the same day. High staff turnover means plans must be simple and training constant, because the person on duty when a crisis starts may have joined last week.
  - industry: Technology and online services
    text: The typical crises are outages and cyberattacks, measured in minutes and felt by every customer at once. Plans rely on copies of systems in separate data centres or in the cloud, and transparency often takes the form of a live status page and a published account of what went wrong. Speed, and honesty about what is not yet known, matter more here than polished statements.
  - industry: Healthcare
    text: A private clinic or pharmacy chain plans for power cuts, shortages of medicines, failures of patient records and outbreaks of infection, with patients' safety outweighing cost in almost every decision. Plans are closely regulated and regularly rehearsed, and transparency with patients is often a professional duty as well as good crisis management.
  - industry: Banking
    text: Customers' trust is the product, so an IT failure that stops payments, or a fraud that drains accounts, is a crisis even if no money is lost in the end. Banks keep backup systems and sites, and regulators in many countries expect them to show that they can keep essential services running through a disruption.
  - industry: Social enterprise
    text: A small social enterprise has little money for backup systems, but its reputation with funders, volunteers and the people it serves is its most valuable asset, so one scandal or safety lapse can end it. Planning tends to be cheap and practical, such as volunteers trained to cover each other, a cash reserve and an agreed spokesperson, and openness with funders is essential in any crisis.
stakeholders:
  - group: Customers
    text: They want to be safe, to be told quickly and honestly what has happened and what to do, and to be compensated fairly. Their interest in early, full disclosure can conflict with managers' and shareholders' wish to limit the cost and the damage to the brand, especially before the facts are certain.
  - group: Employees
    text: They need to be safe, to know their role in a crisis and to hear the news from their employer before the media. Planning brings training and drills that take time from their normal work, and in a crisis they may face long hours, angry customers and worries about their jobs. A business that publicly blames staff for its own failures loses their goodwill fast.
  - group: Owners and shareholders
    text: Contingency planning protects the value of their investment, but it reduces profit in every year without a crisis, so investors focused on the short term may resist it. In a crisis the cost of a full recall or compensation falls on them, which can tempt managers to play the problem down. Protecting this year's profit and protecting the business's long-term value then pull in opposite directions.
  - group: Suppliers and business customers
    text: A supermarket or other business customer needs to know at once what is affected and whether supply will continue, and may make a tested plan a condition of trading. A supplier may lose orders when a business adds a second supplier as a contingency measure, which can strain a long relationship. Yet suppliers belong in the plan, because many crises start in the supply chain.
  - group: Local community and government
    text: People living near a site want protection from fires, spills and pollution, and governments set and enforce safety rules, inspect plans and investigate after a crisis. The community's interest in full information can conflict with a business's wish to control the story, and a poor response can bring fines, tighter rules and lasting local hostility.
evaluation:
  - Planning and managing are different, but each needs the other. A plan without leaders able to adapt it on the day is only paper, and a crisis handled without a plan starts late and makes more mistakes. In an answer, always make clear whether you are discussing the preparation before an event or the response during it.
  - The benefits of contingency planning are invisible when it works, because a crisis that is prevented or contained leaves no record of the damage it would have done. Expect plans to be under-funded in good times, and treat a clean record as weak evidence that a business is safe.
  - Expected values help to weigh the certain cost of planning against an uncertain loss, but the probabilities are estimates, often based on a past that may not repeat, and an average hides the danger of a single catastrophic loss. The owners of a family business facing a 1% chance of ruin each year are not reassured by an expected value.
  - No plan covers every event, and the events that do the most damage are often the ones nobody imagined. Much of the value of planning lies in the team, contacts and habits it builds, which adapt to the unexpected, rather than in the plan for any one event.
  - The four factors of crisis management interact and sometimes conflict. Speed can undermine accuracy, transparency can raise legal risk, and tight control can slow local action. Effective crisis management balances them case by case, with people's safety first.
  - The right amount of planning depends on the organization, its risks, its single points of failure, its resources, its regulators and its culture. A judgement that suits a chemicals haulier would be wrong for a small design studio, so base every evaluation on the evidence in the case.
decision:
  title: How far should Brennock Dairy plan?
  fictional: true
  brief: |
    Six months after the recall, Brennock's board must decide how much to spend on contingency planning. The business makes an annual profit of about $1.2 million and holds cash reserves of $800,000, and its two largest supermarket customers have asked to see a tested recall plan by the end of the year. The managers' estimates, all simulated, are these:

    - **A recall:** a 10% chance in any year. It would cost $900,000 with no plan, or $300,000 with a batch-tracing system and a rehearsed recall plan.
    - **Losing the plant for three months**, through fire or flood: a 1% chance in any year. Supermarkets would switch to other suppliers, and the lost contracts would cost about $5 million, a loss no insurer will cover. With a standby agreement for another dairy to make Brennock's products, the loss would fall to about $1 million.

    Doing nothing has an expected cost of $140,000 a year: (0.10 × $900,000) + (0.01 × $5,000,000).
  options:
    - label: Insure and write a basic procedure
      text: Product recall insurance and a written recall procedure, with no new systems and no rehearsals, for $18,000 a year. The insurer would pay $400,000 towards the cost of a recall, but nothing for lost contracts.
    - label: A targeted recall plan
      text: A batch-tracing system, a written recall and communication plan, a trained crisis team and two rehearsals a year, for $25,000 a year. It meets the supermarkets' request.
    - label: Full business continuity
      text: Everything in the targeted plan, plus a standby agreement with another dairy to make Brennock's products if its plant is out of action, for $70,000 a year in total.
  guidance: |
    Start with the expected annual cost of each option, using the decision tree method:

    - Insure and write a procedure: $18,000 + 0.10 × ($900,000 − $400,000) + (0.01 × $5,000,000) = $18,000 + $50,000 + $50,000 = **$118,000**.
    - Targeted recall plan: $25,000 + (0.10 × $300,000) + (0.01 × $5,000,000) = $25,000 + $30,000 + $50,000 = **$105,000**.
    - Full business continuity: $70,000 + (0.10 × $300,000) + (0.01 × $1,000,000) = $70,000 + $30,000 + $10,000 = **$110,000**.

    On expected cost alone the targeted plan is cheapest, full continuity costs $5,000 a year more, insurance alone is the weakest, and all three beat doing nothing. But the averages hide what matters most. Without the standby agreement, Brennock carries a 1% chance each year of a $5 million loss: more than six times its cash reserves and about four years' profit, an event it might not survive. Full continuity cuts that worst case to $1 million, which the business could just about absorb. For owners who want the business to last, paying $5,000 a year more in expected terms to remove the threat of ruin may be sound judgement, not waste.

    Then weigh what the numbers leave out. **Safety:** both plans with batch tracing make a recall faster and so protect customers better; insurance does not. **Time:** the two plans take managers' time to set up and staff time to rehearse, while insurance alone leaves Brennock as slow on the night as it was before. **Risks:** the probabilities are guesses, and a 1% chance of losing the plant could as easily be 2% or 0.5%; the less reliable the estimates, the more a cautious board might prefer full continuity. **Stakeholders:** insurance alone does not meet the supermarkets' request, which on its own puts Brennock's largest contracts at risk.

    A strong recommendation chooses between the targeted plan and full continuity, uses the figures without stopping at them, and says what would change the decision: for example, if no other dairy would agree to a standby arrangement at that price, or if better evidence showed the risk to the plant to be much lower.
exam:
  - q: Define *contingency planning*.
    marks: 2
    command: define
    level: HL
    paper: '2'
    answer: |
      A strong definition has both parts of the idea: preparing **in advance** for events that may or may not happen, and deciding beforehand **how the business will respond** if they do, for example who will act, with what resources and how stakeholders will be told. An example, such as approving a second supplier, can support the definition but cannot replace it.
  - q: With reference to Brennock Dairy, distinguish between *contingency planning* and *crisis management*.
    marks: 4
    command: distinguish
    level: HL
    paper: '2'
    answer: |
      - **Contingency planning** is preparation before an event: identifying serious risks and deciding the response in advance. Brennock's board decided three years ago not to write a recall plan, so there was no crisis team, no batch tracing and no contact list.
      - **Crisis management** is the response during and after the event: protecting customers, containing the damage and informing stakeholders. For Brennock that means deciding on Friday night whether to recall the 18,000 pots, and telling the supermarkets, staff and customers.
      - A strong answer makes the difference explicit, through timing (before versus during), mindset (proactive versus reactive) or purpose (preparing for a possible event versus limiting the harm of an actual one), and uses the case for both sides. It may add that the missing plan is why Brennock's crisis management started so slowly.
  - q: |
      Velto Air, a fictional regional airline, cancels all its flights for two days after its booking and check-in systems fail. About 6,000 passengers are affected, and many learn of the cancellations only when they reach the airport.

      Explain how **transparency** and **speed** could affect the effectiveness of Velto Air's crisis management.
    marks: 6
    command: explain
    level: HL
    paper: '2'
    answer: |
      A strong answer explains each factor and applies it to Velto Air, rather than defining the four factors in general.

      - **Transparency:** saying openly what has failed, how many flights and passengers are affected, what Velto does not yet know (such as when the systems will be back) and what passengers are entitled to. That builds trust and reduces angry speculation online. If Velto hides the cause or promises a restart time it cannot meet, it loses passengers' trust, and every later statement is doubted.
      - **Speed:** contacting passengers before they travel, rebooking them and arranging refunds or hotels quickly. Fast action limits the number of people stranded at airports, the cost of compensation and the volume of complaints spreading on social media. Velto's evidence of passengers turning up to find flights cancelled shows a slow response.
      - The best answers note the tension between the two: acting fast must not mean announcing a restart time that later proves false, which would damage transparency.
  - q: |
      Arnholt Payroll, a fictional business, runs the payroll for 300 client firms, so their employees are paid through its systems. Its directors are considering a standby data centre that would take over if the main one failed. The directors' estimates, all simulated, are:

      - the standby centre would cost $60,000 a year;
      - the chance of a major outage in any year is 20%;
      - an outage would cost Arnholt $500,000 in compensation and lost clients without the standby centre, but only $50,000 with it.

      Calculate the expected annual cost to Arnholt of having the standby data centre and of not having it, and state which is lower.
    marks: 4
    command: calculate
    level: HL
    paper: '2'
    answer: |
      - Without the standby centre: 0.20 × $500,000 = **$100,000** a year.
      - With the standby centre: $60,000 + (0.20 × $50,000) = $60,000 + $10,000 = **$70,000** a year.
      - Having the standby centre has the lower expected cost, by $30,000 a year.

      This is the decision tree method from the toolkit, with costs in place of payoffs. A full answer shows the working, counts the $60,000 cost in the option that pays it, and gives units. On these figures the standby centre pays for itself in expected terms whenever the chance of an outage is above $60,000 ÷ $450,000, about 13.3% a year.
  - q: |
      Further information about Arnholt Payroll: last year it made a profit of $400,000. Rehearsing the switch to the standby centre would take each of its 45 staff two days a year. A rival payroll firm was hit by a ransomware attack last year, and its clients' employees were paid four days late.

      Evaluate the impact of contingency planning on Arnholt Payroll in terms of cost, time, risks and safety.
    marks: 10
    command: evaluate
    level: HL
    paper: '2'
    answer: |
      A strong response weighs each heading for Arnholt, not for businesses in general, and reaches a supported judgement.

      - **Cost:** the standby centre costs $60,000 a year, 15% of last year's profit, a certain cost for an uncertain benefit. In expected terms it saves $30,000 a year, but only if the 20% estimate is right; the rival's attack suggests the risk is real, though one event is weak evidence of a probability.
      - **Time:** rehearsals take 45 × 2 = 90 staff-days a year from client work. Against that, payroll runs to fixed dates, so a response measured in hours rather than days is what keeps clients' employees paid on time. The rival's four-day delay shows the cost of a slow recovery.
      - **Risks:** the plan reduces the damage from an outage, not its likelihood; Arnholt still needs strong cybersecurity, and if both centres share the same weakness an attack could hit both. A plan built around a centre failure could also miss a different crisis, such as a fraud by staff. But without it, one outage could cost more than a year's profit and lose clients.
      - **Safety:** there is little physical danger, which makes this heading less central than for a food or chemicals business. But the financial well-being of thousands of clients' employees depends on being paid on time, and the security of their personal data is part of keeping them safe.
      - **Judgement:** for example, that the standby centre is justified because Arnholt's whole value rests on reliability and the worst case threatens its client base, provided it is rehearsed and updated. The best answers say what would change the judgement, such as evidence that the chance of an outage is well below 13.3% a year, or a cheaper cloud-based backup offering the same protection.
  - q: |
      FoodBridge, a fictional social enterprise, collects surplus chilled food from supermarkets in two refrigerated vans and delivers it to 30 community kitchens that serve free meals. It has three paid staff and about 60 volunteers, and it is funded by grants and donations.

      Explain **two** challenges FoodBridge faces in planning for and managing a crisis such as a food-safety incident.
    marks: 6
    command: explain
    level: HL
    paper: '3'
    answer: |
      A strong response explains two distinct challenges, each developed and applied to FoodBridge. Possible challenges:

      - **Limited money for contingency measures.** With grant funding and two vans, FoodBridge can hardly afford a standby vehicle, backup refrigeration or insurance against every risk. If a van's cooling fails, food may have to be thrown away and kitchens left short, and the people who rely on those meals bear the cost.
      - **Reliance on volunteers.** With 60 volunteers who change often, it is hard to train everyone in food-safety procedures, rehearse a response or keep clear control when something goes wrong, so a crisis could be handled inconsistently.
      - **Reputation with funders and donors.** Supermarkets donate food and funders give grants on trust. A food-safety incident handled without transparency could end both, yet being open about a mistake also feels risky for an organization that depends on goodwill.
      - **Vulnerable service users.** The people eating the meals may be elderly, ill or homeless, so the safety stakes are high and the duty to act quickly, even at the cost of withdrawing food, is greater.
summary:
  - A **crisis** is a sudden, serious threat to people, operations, finances or reputation that must be handled urgently, on incomplete information and under scrutiny. Its cause may be internal or external.
  - '**Contingency planning** happens before an event and is proactive: identify the risks, judge their likelihood and impact, decide the responses, assign roles and resources, rehearse and review.'
  - '**Crisis management** happens during and after an event and is reactive: protect people, contain the damage, inform stakeholders and restore normal operations.'
  - The two depend on each other. The plan speeds up the response, the response tests the plan, and the review after a crisis improves the next plan.
  - 'The guide''s four factors in effective crisis management: **transparency** (honest, including about what is unknown), **communication** (clear, consistent and timely, to every stakeholder), **speed** (fast but not hasty) and **control** (someone in charge, with roles, resources and monitoring).'
  - The factors interact and can conflict, so they must be balanced case by case, with people's safety first and honesty second.
  - 'The impact of contingency planning is judged on **cost** (a certain cost now against smaller losses later), **time** (time to prepare against a faster response), **risks** (lower but never zero) and **safety** (where the case for planning is strongest).'
  - Expected values from decision trees can weigh the cost of a plan against the risk, but the probabilities are estimates and an average hides a catastrophic loss.
  - How much planning is worth depends on the organization's risks, single points of failure, resources, regulators and culture.
retrieval:
  - q: What is the simplest test for telling contingency planning from crisis management?
    a: Timing. Contingency planning happens before an event, to prepare a response; crisis management happens during and after it, to limit the harm.
  - q: Give five features that make an event a crisis.
    a: A serious threat, surprise, urgency, incomplete information and intense scrutiny from stakeholders and the media.
  - q: Name the four factors the guide says affect how effective crisis management is.
    a: Transparency, communication, speed and control.
  - q: Why can speed undermine transparency in a crisis?
    a: A business that rushes out statements may announce facts that later prove wrong, and correcting them damages trust more than a short delay would have done.
  - q: In crisis management, what does control mean, and what does it not mean?
    a: Someone clearly in charge, with defined roles, the resources to act and a check on whether actions are working. It does not mean controlling information by hiding it.
  - q: List the six stages of making a contingency plan.
    a: Identify the risks, assess their likelihood and impact, decide the response to each, write the plan, train and rehearse, and review and update.
  - q: Why might a business plan for an event that is very unlikely?
    a: Because its impact would be catastrophic, for example harm to people or a loss the business could not survive, such as a fire that destroys its only site.
  - q: Under which four headings does the guide ask you to judge the impact of contingency planning?
    a: Cost, time, risks and safety.
  - q: A plan costs $20,000 a year. The event it covers has a 5% chance a year and would cost $500,000 without the plan or $200,000 with it. Compare the expected annual costs.
    a: 'Without the plan: 0.05 × $500,000 = $25,000. With it: $20,000 + (0.05 × $200,000) = $30,000. On expected cost alone the plan is $5,000 a year worse, so the case for it would rest on safety, the uncertainty of the estimate or the size of the worst case.'
  - q: Why are the benefits of contingency planning hard to see?
    a: When planning works, the crisis is prevented or contained, and nobody records the damage that did not happen, while the costs appear in every year's accounts.
  - q: Give three reasons a contingency plan might fail.
    a: For example, it planned for the wrong event, it was out of date, it was never rehearsed, or managers followed it rigidly when the situation called for fresh judgement.
  - q: How can a crisis strengthen a business's reputation?
    a: A fast, honest and well-led response shows customers, employees and investors how the business behaves under pressure, which can build trust.
connections:
  - code: '2.6'
    text: The methods of communication and the barriers to it decide whether crisis messages reach every stakeholder group and are understood.
  - code: '1.4'
    text: A crisis tests whose interests come first, and conflicts such as customers' safety against shareholders' profit come to the surface.
  - code: '2.3'
    text: A more directive, even autocratic, leadership style often suits the first hours of a crisis, when clear and quick direction matters most.
  - code: '5.6'
    text: Buffer stock, just-in-case stock and second suppliers are contingency measures against disruption in the supply chain.
  - code: '5.9'
    text: Cybercrime is a growing cause of crises, and backups held in data centres or the cloud are among the commonest contingency measures.
  - code: '3.7'
    text: A cash reserve or an agreed overdraft lets a business pay the immediate costs of a crisis and survive until it recovers.

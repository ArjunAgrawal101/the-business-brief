retrieval:
  - q: What is job production?
    a: Making each product individually, usually to a particular customer's specification, such as a made-to-measure suit or a bridge.
  - q: Why does batch production involve idle time?
    a: Equipment must be cleaned and reset between batches, and nothing is produced during the changeover.
  - q: Why is flow production the cheapest method per unit at high volume?
    a: Its large fixed costs are spread over a very large output, and specialized, often automated, tasks are done quickly and consistently, giving economies of scale.
  - q: What is mass customization, and what makes it possible?
    a: Making products in volume with features each customer chooses, made possible by flexible technology such as computer-aided design, computer-controlled machines and online configurators, usually adding the choices to standard parts late in the process.
  - q: Give two disadvantages of flow production for employees.
    a: For example, repetitive, closely timed work that can demotivate; narrow skills that are easily replaced; and the risk that automation removes their jobs.
  - q: A line has fixed costs of $50,000 a week and a variable cost of $10 a unit. What is the average cost at 5,000 units and at 25,000 units a week?
    a: $50,000 ÷ 5,000 + $10 = $20 a unit; $50,000 ÷ 25,000 + $10 = $12 a unit.
  - q: Which method suits a wedding cake, bread loaves, soft drinks and trainers designed online?
    a: Job production, batch production, flow production and mass customization respectively.
  - q: Why can mass customization reduce unsold stock?
    a: Many products are made only after the customer has ordered and often paid for them, so the business does not build stock that may not sell.
  - q: Distinguish between labour-intensive and capital-intensive production.
    a: Labour-intensive production relies mainly on people, so labour is the largest cost; capital-intensive production relies mainly on machinery and technology, so capital is the largest cost.
  - q: Name four factors a business weighs when choosing an operations method.
    a: For example, the volume and stability of demand, the nature of the product, what customers value, the finance available, the skills and technology available, and the business's objectives and image.
  - q: Why might a premium brand avoid flow production even if it could afford it?
    a: Its customers pay for individuality and craft; standardized products would weaken the brand and the premium price it supports.

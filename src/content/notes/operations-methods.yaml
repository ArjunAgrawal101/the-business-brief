# Notes: 5.2 Operations methods. Written in the platform's own words from the
# guide's content statement (p. 33): job, batch and mass (flow) production, and
# mass customization, all at AO3. The teacher support material's glossary (pp.
# 80, 85 and 86) and its activities on production methods (pp. 7, 34 to 35 and
# 47) were read to check definitions and scope; nothing from them is
# reproduced. No coursebook chapter for 5.2 was supplied. The unit cost formula
# is the standard form used across the site; the guide's formula list has none.
# Ashgrove Guitars, Larchmere Kitchens and the guitar factory are fictional, and
# every figure was checked by script.
code: '5.2'
title: Operations methods
level: SL/HL
introduction: |
  How a business makes its products decides much of what it can offer customers: how much choice, at what price, and how quickly. A tailor and a clothing factory both make shirts, but one makes each shirt for one person and the other makes a hundred thousand identical ones, and almost everything else about the two businesses follows from that difference.

  The guide names four operations methods, job, batch and mass (flow) production and mass customization, and sets them at AO3 (p. 33). You need to know how each works, but above all to judge which suits a particular business, weighing unit costs against variety, investment against flexibility, and efficiency against the people who do the work.
objectives:
  - '**Describe** job, batch and mass (flow) production and mass customization, with examples.'
  - '**Explain** the trade-off between volume and variety, and why unit cost falls as volume rises.'
  - '**Analyse** how the operations method changes the average cost of each unit, using the figures in a case.'
  - '**Evaluate** the advantages and disadvantages of each method for a particular business.'
  - '**Recommend** an operations method for a business, or a change of method, and justify it.'
situation:
  title: Forty weeks to wait
  fictional: true
  text: |
    Ashgrove Guitars, a fictional business, is a workshop of nine luthiers who build acoustic guitars entirely to order. Each customer chooses the shape, the woods, the neck and the inlays, and each guitar takes about 54 hours of skilled work, so the workshop finishes six a week and charges about $3,400 for each. Last year a video of one of its guitars was shared widely online. Orders flooded in, and the waiting list has grown to 240 guitars, forty weeks of work. Some customers have cancelled rather than wait.

    The founder, Leila Haddad, has three suggestions in front of her. Her production manager wants to build three standard models in batches and sell them through music shops. A software firm offers an online configurator and a computer-controlled router, so that customers could design their own guitar from a menu of options. Her oldest luthier says Ashgrove should simply raise its prices and stay as it is.

    Which operations method should Ashgrove use as it grows, and what would it gain and lose with each?
sections:
  - id: volume-and-variety
    title: 'Choosing how to produce: volume and variety'
    kind: concept
    body: |
      An **operations method** is the way a business organizes production: how many units it makes at a time, how standard they are, and how work moves from one stage to the next. The guide names four methods: job, batch and mass (flow) production, and mass customization. It sets them at AO3, so you must be able to judge which suits a particular business, not just describe them.

      The choice turns on two things: the **volume** a business needs to produce and the **variety** its customers want. Job production makes one item at a time, each different; batch production makes groups of identical items and then switches to another group; mass or flow production makes a standard product continuously in very large numbers. Along that line, volume rises, variety falls and the cost of each unit falls, because fixed costs are spread over more output and the work can be divided into simple, repeated tasks. Mass customization tries to break the trade-off, using flexible technology to make high volumes with features chosen by each customer, as the diagram shows.

      The method also decides how **labour-intensive** or **capital-intensive** production is. Job production relies on skilled people with general-purpose tools; flow production relies on specialized machinery, often automated, with far less labour in each unit. So the choice of method is also a choice about costs, skills, investment and the kind of work people do.
    points:
      - term: Volume
        text: How many units a business needs to make in a period. High, steady volumes justify specialized equipment; low or unpredictable volumes do not.
      - term: Variety
        text: How much the product differs from one customer or order to the next. Variety needs flexible people and equipment.
      - term: Standardization
        text: Making every unit to the same specification. It allows specialized machines, simple tasks and consistent quality, but it limits choice.
      - term: Labour-intensive production
        text: Production that relies mainly on people, so labour is the largest share of its costs. Typical of job production and of many services.
      - term: Capital-intensive production
        text: Production that relies mainly on machinery and technology, so capital is the largest share of its costs. Typical of flow production.
    formulas:
      - name: Average (unit) cost
        expression: Average cost = total fixed costs ÷ output + variable cost per unit
        note: The same as total costs ÷ output. As output rises, the fixed cost carried by each unit falls, which is why unit costs fall from job to batch to flow production. A standard form; the guide's formula list does not include it.
    diagram: operations-methods
    example:
      title: Where Ashgrove stands
      fictional: true
      text: |
        Ashgrove sits at the top left of the diagram: very low volume and very high variety. Each guitar is different, built by skilled luthiers with hand tools, so production is labour-intensive.

        Its three options would move it in different directions. Batch production of three standard models would take it towards the middle; a configurator with a computer-controlled router would take it towards the top right, where mass customization sits; and a price rise would leave it where it is.
  - id: job-production
    title: Job production
    kind: types
    body: |
      In **job production**, each product is made individually, usually to a particular customer's specification. Examples range from a made-to-measure suit, a wedding cake and an architect's design to a bridge, a ship and a film. Every job is different, so the business needs skilled, flexible employees and general-purpose equipment, and it usually agrees the price of each job in advance.

      Job production gives customers exactly what they want, and they will often pay a premium for it. The work is varied and creative, which can be highly motivating for skilled staff: in Herzberg's terms it is rich in achievement and responsibility (2.4). But the cost of each unit is high, because little can be standardized and few economies of scale are available; production is slow; and the business depends on skilled people who are scarce and take years to train. Demand can also be uneven, with weeks of overtime followed by idle ones.

      Job production suits products that are unique by nature, low volumes, customers who value exclusivity or a perfect fit more than price, and small businesses whose skill is their advantage. It is the natural method for many start-ups, and for most construction and professional services.
    advantages:
      - Products match each customer's wishes exactly, which supports premium prices.
      - Varied, skilled work can motivate employees.
      - Flexible, because a job can be changed during production if the customer wishes.
      - Little capital is needed to start, because the tools are general-purpose.
    limitations:
      - High cost per unit, with few economies of scale.
      - Slow, so customers may wait a long time.
      - Depends on scarce, skilled employees being available.
      - Workload can be uneven, and each job must be priced separately.
    example:
      title: The cost of a custom guitar
      fictional: true
      text: |
        Ashgrove's workshop costs $4,200 a week to run in rent, tools, insurance and salaries. Each guitar uses $650 of materials and 54 hours of a luthier's time at $28 an hour, which is $1,512, so its variable cost is $2,162.

        - **Fixed cost per guitar** at six a week: $4,200 ÷ 6 = $700.
        - **Average cost:** $700 + $2,162 = **$2,862** a guitar.
        - **Profit:** $3,400 − $2,862 = $538 a guitar, or $538 × 6 = **$3,228** a week.

        The nine luthiers have 360 hours a week between them, and six guitars use 324 of them, so the workshop is close to its limit. More guitars would need more luthiers, and luthiers take years to train.
  - id: batch-production
    title: Batch production
    kind: types
    body: |
      In **batch production**, a group of identical items moves through each stage of production together, and when the batch is finished the equipment is reset for a different group. A bakery bakes a tray of white loaves, then a tray of rye; a paint maker mixes one colour, cleans the vats and mixes another; a clothing factory cuts and sews a run of one style in several sizes.

      Batching gives a business some variety and some economies of scale at once. Within a batch, work can be divided into specialized stages, equipment can be designed for the task and materials can be bought in bulk, so each unit costs much less than in job production. Between batches, the business can still change the product to meet different orders or seasons.

      Its costs come from the changes. While equipment is cleaned and reset, the **changeover** or set-up time, nothing is produced, so frequent changes waste capacity. Larger batches mean fewer changes but leave more stock waiting between stages and in the warehouse, tying up cash and space and risking waste if tastes change. The work is more repetitive than in job production, and a batch made wrongly is wrong in every unit. Batch production suits products with moderate, fairly predictable demand in a range of standard versions.
    points:
      - term: Lean production (5.3)
        level: HL
        text: At HL, lean production attacks the waste that batch production creates. Quicker changeovers make smaller batches worthwhile, so less stock waits between stages, and just-in-time delivery brings materials as they are needed rather than in large stocks.
    advantages:
      - Lower unit costs than job production, through specialization and bulk buying.
      - Some variety for customers, such as sizes, flavours or colours.
      - Equipment can be used for several products, spreading its cost.
      - Production can follow demand by changing which batches are made.
    limitations:
      - Idle time and cost at every changeover.
      - Stock builds up between stages and in storage, tying up cash.
      - More repetitive work, which can demotivate.
      - A mistake affects the whole batch.
    example:
      title: Why Ashgrove would batch its finishing
      fictional: true
      text: |
        Ashgrove's spray booth lacquers a guitar in 1.5 hours, and changing from one colour of lacquer to another takes 2 hours of cleaning.

        - **Fifteen guitars in three batches of five:** 15 × 1.5 = 22.5 hours of spraying, plus 3 × 2 = 6 hours of changeovers, **28.5 hours**.
        - **Fifteen guitars, each in its own colour:** 22.5 hours plus 15 × 2 = 30 hours of changeovers, **52.5 hours**, more than a 40-hour week.

        Batching three standard models would raise fixed costs to $6,000 a week for jigs, templates and the booth, but cut each guitar to 22 hours of labour ($616) and $560 of materials bought in bulk, a variable cost of $1,176. Fifteen guitars a week would cost $6,000 ÷ 15 + $1,176 = **$1,576** each. Sold to music shops at $1,900, each would earn $324, or $4,860 a week.
  - id: mass-production
    title: Mass or flow production
    kind: types
    body: |
      In **mass production**, also called flow production, a standardized product is made continuously in very large numbers. Work flows along a line of specialized stages, each performed by a worker or, increasingly, a machine or robot, and units are started and finished all the time. Cars, smartphones, soft drinks and light bulbs are made this way.

      Flow production delivers the lowest cost per unit of any method, provided that volume is high. Its heavy fixed costs, the line, the robots and the factory, are spread over enormous output, and each simple, repeated task is done quickly and consistently: the technical and purchasing economies of scale of 1.5. Quality is consistent, and output is predictable enough to plan stock and deliveries precisely.

      The weaknesses are the mirror image. The investment is huge and specific to one product, so the line is inflexible, and a change of design can mean costly retooling. It needs high, steady demand: running a line at half its speed doubles the fixed cost carried by each unit. A breakdown at one stage stops the whole line. And the work, divided into short repeated tasks, is the kind Taylor designed and Herzberg criticized (2.4): dull, closely timed and demotivating, which shows in absence, errors and labour turnover unless the business automates the dullest tasks or rotates and enriches jobs.
    advantages:
      - The lowest cost per unit at high volumes, through economies of scale.
      - Consistent quality, because each task is standardized and often automated.
      - Fast, predictable output that suits planning and mass distribution.
      - Low prices can open up mass markets.
    limitations:
      - A very high initial investment, specific to one product.
      - Inflexible, so changing the product is slow and costly.
      - Needs high, steady demand, or the fixed cost carried by each unit soars.
      - Repetitive work can demotivate, and a breakdown at one stage stops the whole line.
    example:
      title: Volume makes the difference
      fictional: true
      text: |
        A fictional guitar factory makes one standard model on a flow line. Its fixed costs are $90,000 a week, and each guitar adds $204 of materials, energy and labour.

        - **At 500 guitars a week:** $90,000 ÷ 500 + $204 = **$384** a guitar.
        - **At 2,000 guitars a week:** $90,000 ÷ 2,000 + $204 = **$249** a guitar.

        At full volume the factory can sell to wholesalers at $420 and still earn $171 on each guitar, a price Ashgrove could never approach. But it makes only one model, and if demand halved to 1,000 a week, each guitar would cost $294, nearly a fifth more. For Ashgrove, whose customers come for individual guitars, flow production is the wrong answer.
  - id: mass-customization
    title: Mass customization
    kind: types
    body: |
      **Mass customization** combines the low unit costs of mass production with products tailored to each customer. It usually works by making standard parts, or modules, in volume and adding the customer's choices as late as possible in the process, using flexible technology: computer-aided design, computer-controlled cutting and printing, 3D printing, and online configurators where customers choose and see their product before ordering. Trainers, bicycles, cars, furniture and computers are often sold this way, and personalized printed products are a simple case.

      For the customer it offers choice, and a product made to order, at a price far below that of job production. For the business it can support a premium over standard products, build loyalty, give detailed data on what customers prefer, and reduce unsold stock, because many products are made only after they are ordered, and often paid for in advance.

      It is not free. The technology, software and information systems are expensive, and the operation is complex to plan: every order differs, so errors are easier to make and harder to spot. Customers usually wait longer than for a product off the shelf, returned items are hard to resell, and too many options can confuse buyers. Mass customization suits products whose value to customers rises with personal choice and whose variations can be built from a manageable set of standard parts.
    advantages:
      - Personal products at a much lower cost than job production.
      - Supports premium prices and builds loyalty.
      - Made to order, so less unsold stock, and often paid for in advance.
      - Gives rich data on customers' preferences.
    limitations:
      - Expensive technology and information systems.
      - Complex to plan and run, with more scope for errors.
      - Customers wait longer than for products in stock, and returns are hard to resell.
      - Too many choices can confuse customers and slow sales.
    example:
      title: Ashgrove's configurator
      fictional: true
      text: |
        The software firm's proposal costs $240,000 for a computer-controlled router and an online configurator. Customers would choose a body shape, woods, neck, finish and inlay from a menu; the router would cut the parts, and the luthiers would assemble, set up and finish each guitar in about 30 hours.

        - Weekly fixed costs would rise to $7,800, and each guitar would use $620 of materials and 30 hours of labour ($840), a variable cost of $1,460.
        - At 12 guitars a week, the average cost is $7,800 ÷ 12 + $1,460 = **$2,110**.
        - At an average price of $2,600, each earns $490, or **$5,880** a week.

        Customers would still get a guitar that is theirs, chosen from a menu rather than designed from scratch, and the luthiers' 360 hours a week would be fully used.
  - id: choosing-and-changing
    title: Choosing and changing the method
    kind: evaluation
    body: |
      Choosing an operations method means matching it to the business and its market. The main factors are the **size and stability of demand**, since flow production needs high, steady volumes; the **nature of the product**, unique or standard; what **customers value**, whether price, choice, speed or exclusivity; the **finance** available for equipment; the **skills** of the workforce and the technology available; and the business's **objectives and image**, since a premium brand built on craft may lose its appeal if it is seen to mass-produce.

      Methods are not exclusive. Many businesses combine them: a car maker mass-produces engines and bodies, batch-produces options and lets buyers choose the finish; a restaurant prepares sauces in batches and cooks each dish to order. Businesses also change method as they grow, often from job to batch to flow production, and sometimes back towards customization as technology makes variety cheaper.

      Changing method is a major decision. It needs investment, which should be appraised (3.8); it changes jobs, skills and working practices, which can meet resistance (2.1); it changes costs and capacity, which must match demand; and it changes what the business offers, so marketing must agree. Each method also carries implications for sustainability: making to order, as in job production and mass customization, avoids unsold stock, while mass production is efficient per unit but can encourage overproduction and short product lives.
    points:
      - term: Unit cost
        text: Highest in job production, lower in batch and lowest in flow production. Mass customization sits between job and batch, depending on its technology.
      - term: Variety and flexibility
        text: Highest in job production, moderate in batch and lowest in flow production. Mass customization offers wide but bounded choice.
      - term: Capital needed
        text: Low for job production, moderate for batch, and very high for flow production and mass customization.
      - term: Skills
        text: Broad, high skills for job production; narrower ones for batch and flow production; technical and IT skills for mass customization.
      - term: Stock
        text: Little finished stock in job production and mass customization, which make to order; stock between stages in batch production; large planned stocks in flow production.
      - term: Motivation
        text: Job production offers varied, whole tasks; flow production offers repetitive ones, unless they are automated, rotated or enriched.
    example:
      title: One kitchen, three methods
      fictional: true
      text: |
        Larchmere Kitchens, a fictional manufacturer, makes cabinet frames on a flow line in standard sizes, paints doors in batches of each colour, and cuts every worktop to the measurements of the customer's room. Customers choose the layout, colour and worktop online from these standard parts.

        Taken as a whole, the business practises mass customization, built from flow, batch and job production. The combination keeps costs low on the parts customers never see and offers choice where they do.
applications:
  - industry: Construction
    text: Most building is job production, because every site, design and client differs. Builders increasingly make standard parts, such as wall panels, bathroom pods or whole modules, in factories in batches, bringing some of the cost and quality advantages of batch production to a job-production industry.
  - industry: Food and drink
    text: Bakeries, breweries and sauce makers use batch production, with long cleaning changeovers between products for hygiene. Soft drinks and snacks run on flow lines at enormous volumes, and some brands offer personalized labels or mixes, a simple form of mass customization.
  - industry: Car manufacturing
    text: The classic flow-production industry, now heavily automated. Buyers choose engines, colours and trim online, and each car is built to order on the same line, so modern car making combines flow production with mass customization.
  - industry: Clothing
    text: Most clothing is batch-produced, a run of each style in each size, and fast fashion relies on quick, small batches that follow trends. Made-to-measure tailoring is job production, and body scanning with computer-controlled cutting is bringing it closer to mass customization.
  - industry: Healthcare
    text: Each patient is in a sense a job, with treatment fitted to the individual. Yet hospitals organize routine operations into dedicated lists run in a standard sequence, gaining some of the efficiency of batch production without losing care for each patient.
stakeholders:
  - group: Customers
    text: Weigh price against choice and waiting time. Flow production gives low prices and instant availability; job production gives exactly what they want, at a price and after a wait; mass customization offers a middle way.
  - group: Employees
    text: Job production uses and rewards their skills; flow production can deskill and bore them, and automation may replace them. A change of method means retraining, new working practices and sometimes job losses, which is why it can meet resistance.
  - group: Owners and investors
    text: Weigh the lower unit costs of volume against the capital and risk it needs. Flow production and mass customization need large investments that pay only if demand is high and steady, while job production needs little capital but limits growth.
  - group: Suppliers
    text: Flow and batch production give them large, regular orders; job production gives small, irregular ones; mass customization needs suppliers flexible enough to deliver many variants quickly.
  - group: The environment and local community
    text: Making to order avoids unsold stock and waste, while mass production uses resources efficiently per unit but can encourage overproduction. A large flow-production plant brings many jobs to an area, and many lost jobs if it closes.
evaluation:
  - No method is best in general. The right method fits the volume and variety of demand, the product, what customers value, and the business's finance, skills and image; judge it for the business in the case, not in the abstract.
  - The trade-off between volume and variety is real. Mass customization narrows it but does not abolish it, because the technology is costly, every order adds complexity, and customers still wait longer than for a product in stock.
  - The unit cost advantage of flow production depends on high, steady demand. When demand falls or swings, idle capacity raises the fixed cost carried by each unit, and the inflexible line becomes a burden.
  - Changing method is costly and disruptive. It needs investment, retraining and new working practices, can meet resistance from employees, and can change how customers see the brand, so the expected gains must be large enough to justify the risk.
  - The human side matters. Job production can be deeply motivating and flow production dull, but automation can remove the dullest tasks, and job rotation and enrichment can improve the rest.
  - In an examination, use the figures. Compare unit costs, capacity and payback where the case gives them, then weigh them against the qualitative factors, such as quality, flexibility, motivation and brand, before recommending a method.
decision:
  title: How should Ashgrove grow?
  fictional: true
  brief: |
    Ashgrove Guitars, a fictional business, builds about six custom guitars a week with nine luthiers, has a waiting list of 240 guitars, and earns $3,228 a week at an average price of $3,400. It is considering three ways forward, each of which uses its luthiers' 360 hours a week differently.
  options:
    - label: Stay with job production and raise prices
      text: Raise the average price to $3,900 and keep building six custom guitars a week. If orders hold, profit rises to $6,228 a week, with no investment.
    - label: Batch-produce three standard models
      text: Invest $60,000 in jigs, templates and a spray booth, and build 15 guitars a week in batches, sold through music shops at $1,900. Profit would be $4,860 a week.
    - label: Mass customization
      text: Invest $240,000 in a router and an online configurator, and build 12 guitars a week to customers' choices at an average of $2,600. Profit would be $5,880 a week.
  guidance: |
    At first the figures look decisive: option A earns most and costs nothing. But the three rest on different assumptions, and the judgement lies in testing them.

    Option A assumes that customers will pay $500 more and still wait. With 240 on the waiting list some will, but the cancellations show that patience has limits, and growth stops at six guitars a week, all of them depending on nine people. It protects the brand completely, and gives up the market the video created.

    Option B earns $1,632 a week more than today, so its $60,000 would be repaid in about 37 weeks. But it changes what Ashgrove is: standard guitars sold through shops at $1,900, competing with factories that can make similar guitars far more cheaply. The luthiers' work becomes more repetitive, and a brand built on individual guitars may be diluted.

    Option C earns $2,652 a week more, repaying its $240,000 in about 90 weeks, or 1.7 years, with more risk if orders fall short of 12 a week. It keeps the promise of a personal guitar at a lower price, uses every luthier hour and shows what customers choose; its risks are the technology, the complexity of orders that all differ, and whether customers accept a menu instead of a blank page.

    A strong answer weighs these figures against the risks and against Ashgrove's objectives. It might recommend A in the short term and C if demand holds, or C because it grows the business without abandoning its identity, and it should name the evidence that would change its mind, such as how many waiting customers would accept a configured guitar.
exam:
  - q: Define the term *mass customization*.
    marks: 2
    command: define
    paper: '1'
    answer: |
      A precise definition: producing goods in volume at a low cost per unit while letting each customer choose some of the product's features, usually by combining standard parts with flexible technology.

      A full answer contains both halves, the volume and low cost of mass production and the tailoring to each customer. "Making products to order" alone describes job production.
  - q: Distinguish between job production and batch production, with reference to Ashgrove Guitars.
    marks: 4
    command: distinguish
    paper: '1'
    answer: |
      A strong answer makes the difference explicit and applies it:

      - Job production makes each product individually to the customer's specification: each Ashgrove guitar is designed with its customer and built by one luthier over about 54 hours.
      - Batch production makes groups of identical products, which move through each stage together before the equipment is reset: Ashgrove's proposed standard models would be cut, sprayed and finished in batches.
      - The difference in consequence: job production gives maximum variety at a high unit cost ($2,862), while batching lowers the unit cost ($1,576) but limits customers to a few standard versions.
  - q: |
      Ashgrove's workshop has fixed costs of $4,200 a week under job production, with a variable cost of $2,162 a guitar and an output of 6 guitars a week. Under batch production its fixed costs would be $6,000 a week, its variable cost $1,176 a guitar and its output 15 guitars a week.

      Calculate the average cost of a guitar under each method.
    marks: 4
    command: calculate
    paper: '2'
    answer: |
      - **Job production:** $4,200 ÷ 6 + $2,162 = $700 + $2,162 = **$2,862** a guitar.
      - **Batch production:** $6,000 ÷ 15 + $1,176 = $400 + $1,176 = **$1,576** a guitar.

      Show the fixed cost per guitar and the addition for each. Batch production is cheaper per guitar for two reasons: higher fixed costs are spread over more than twice as many guitars, and each guitar needs far less labour.
  - q: Explain two reasons why flow production would not suit Ashgrove Guitars.
    marks: 4
    command: explain
    paper: '1'
    answer: |
      Two reasons, each explained and applied:

      - **Volume:** flow production is economic only at very high, steady volumes; Ashgrove sells tens of guitars a month, nowhere near enough to spread the fixed costs of a line, so its unit costs would be far higher than a factory's.
      - **Variety and brand:** flow production makes one standard product, but Ashgrove's customers come for individual guitars, so it would destroy the variety and craft its premium price depends on.

      Other valid reasons include the huge investment Ashgrove cannot finance, and the deskilling of luthiers whose craft is the business's main asset.
  - q: Analyse how a move from job production to batch production could affect Ashgrove's luthiers.
    marks: 6
    command: analyse
    paper: '1'
    answer: |
      A strong answer traces the effects through the case and links them to motivation theory:

      - **The work changes:** each luthier would perform a few stages on many guitars instead of building whole guitars, so tasks become narrower and more repetitive.
      - **Motivation:** in Herzberg's terms, achievement, responsibility and the work itself, the motivators of job production, would weaken; Taylor's approach would see higher output per hour as the gain.
      - **Skills and security:** a craft that took years to learn would matter less, which may feel like a loss of status, although output of 15 guitars a week would secure jobs and could fund pay rises.
      - **A judgement:** for example, the effects could be eased by rotating luthiers between stages and keeping some custom work, but some resistance to the change is likely.
  - q: |
      Ashgrove is choosing between staying with job production at a higher price, batch production of three standard models, and mass customization with an online configurator.

      Recommend which operations method Ashgrove should adopt as it grows.
    marks: 10
    command: recommend
    paper: '2'
    answer: |
      An extended response that uses the figures, weighs the qualitative factors and reaches a justified recommendation:

      - **The figures:** weekly profit of $6,228 for job production at $3,900 (if orders hold), $4,860 for batch production with $60,000 repaid in about 37 weeks, and $5,880 for mass customization with $240,000 repaid in about 90 weeks.
      - **Job production at a higher price:** no investment and the brand protected, but no growth, a risk that customers will not pay or wait, and dependence on nine people.
      - **Batch production:** lower unit costs and more output, but standard guitars compete with factories, the brand may be diluted and the luthiers' work becomes repetitive.
      - **Mass customization:** personal guitars at a lower price, full use of the luthiers' time and data on demand, but heavy investment, complexity and the risk that customers reject a menu.
      - **Judgement:** for example, mass customization fits Ashgrove's identity and growth best if the configurator is trialled first; or a price rise now, with mass customization later. Say what evidence would change the recommendation.

      An answer that only describes the methods, without the figures or a recommendation, does not do what the command term asks.
summary:
  - Job production makes one-off products to each customer's specification, with high variety, skilled labour and a high unit cost.
  - Batch production makes groups of identical items and then changes over, giving some variety and some economies of scale, at the cost of idle changeovers and stock between stages.
  - Mass or flow production makes a standard product continuously, with the lowest unit cost at high, steady volumes, but it is inflexible, capital-intensive and repetitive.
  - Mass customization adds customers' choices to standard parts late in the process, using flexible technology, to give personal products at a moderate cost.
  - Volume and variety trade off. Average cost = fixed costs ÷ output + variable cost per unit, so unit cost falls as volume rises.
  - The choice depends on demand, the product, what customers value, finance, skills, technology and the business's image.
  - Methods can be combined, and businesses change method as they grow; a change needs investment and can meet resistance.
  - Judge a method with figures and with people, weighing unit cost against flexibility, motivation, brand and sustainability.
connections:
  - code: '1.5'
    text: Unit costs fall from job to flow production because of technical and purchasing economies of scale.
  - code: '2.4'
    text: Job production offers Herzberg's motivators, while the repetitive tasks of flow production echo Taylor's scientific management.
  - code: '3.3'
    text: Fixed and variable costs explain why higher volumes cut unit costs, and why idle capacity raises them.
  - code: '4.2'
    text: Niche markets suit job production and mass customization; mass markets suit flow production.
  - code: '5.1'
    text: The method shapes every operations objective, from cost and quality to flexibility and dependability.
  - code: '5.3'
    text: At HL, lean production, kaizen and just-in-time cut the changeover times and stock that batch production creates.

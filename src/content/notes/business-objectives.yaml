    text: Objectives follow from the type of entity, from profit to public service to social purpose.
  - code: '1.4'
    text: Stakeholders' interests shape objectives, and CSR is how a business answers to them.
  - code: '1.5'
    text: Growth is a common objective; 1.5 covers why businesses grow and how they do it.
  - code: '3.5'
    text: Profitability ratios measure progress towards profit objectives.
  - code: '4.2'
    text: Niche and mass markets, USPs and differentiation in marketing planning; at HL, Porter's strategies return there.

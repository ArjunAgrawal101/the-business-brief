retrieval:
  - q: Distinguish between a vision statement and a mission statement.
    a: "A vision says where the organization wants to be in the long term; a mission says why it exists now: what it does, for whom and why, often with the values it works by."
  - q: Name the four common business objectives that the guide lists.
    a: Growth, profit, protecting shareholder value and ethical objectives.
  - q: Why might a business aim for a satisfactory profit rather than the largest possible profit?
    a: For example because its owners also care about control or a life outside work, because squeezing out the maximum would harm relations with staff, customers or the community, or because it is giving up profit now for growth later.
  - q: What does protecting shareholder value involve?
    a: Making the owners' shares worth more over time, through a rising share price and dependable dividends, and avoiding decisions that would damage either.
  - q: What is the difference between an objective and a strategy?
    a: An objective is the result the business is aiming for; a strategy is the long-term plan for getting there.
  - q: Give three differences between strategic and tactical objectives.
    a: Strategic objectives are long term, cover the whole organization, are set by senior managers and commit large, hard-to-reverse resources. Tactical objectives are short to medium term, cover a department or team, are set by middle managers and are easier to change.
  - q: What is CSR, and how does it differ from obeying the law?
    a: A business accepting that it is accountable for its effects on people and the environment, and acting for its stakeholders beyond what the law demands. The law sets the minimum; CSR goes further.
  - q: What are the three parts of the triple bottom line?
    a: People (social impact), planet (environmental impact) and profit (financial results).
  - q: Give two reasons why the objectives of a business might change.
    a: For example a recession, a new competitor, a new owner or chief executive, a new stage of growth, or changing expectations from stakeholders.
  - q: At HL, name Porter's generic strategies and the two questions that decide between them.
    a: Cost leadership, differentiation, cost focus and differentiation focus. Will the business win on lower cost or on being different, and will it serve the whole market or one segment?

# Notes: 1.3 Business objectives. Written in the platform's own words from the
# guide's four content statements (pp. 23 to 24), with SWOT analysis and
# Porter's generic strategies (HL only) from the toolkit (p. 14) and the key
# concept of sustainability and its triple bottom line (p. 13). The supplied
# coursebook chapter (Hodder, pp. 84 to 96) and its toolkit pages on SWOT and
# Porter (pp. 14 to 16 and 29 to 31) were read to check coverage and
# conventions; no passage, table or case from them is reproduced. SMART is
# presented as a widely used idea, not a requirement: neither the guide nor the
# TSM names it, and the coursebook expands it two different ways (pp. 85 and
# 86). The notes are SL/HL except the section on Porter, which is HL only.
# Every business named is fictional.
#
# The opening situation, industries, stakeholders, decision, exam-style
# practice and revision summary were added on 3 November 2026. The one HL
# question, on Porter, comes last and is set in the style of paper 2, which
# includes HL material and the HL tools (guide p. 46, TSM p. 60); paper 1
# excludes them (p. 43). Every figure was recomputed before publication.
code: '1.3'
title: Business objectives
level: SL/HL
introduction: |
  A vision says where an organization hopes to be, a mission says what it is for, and objectives turn both into targets that people can plan for and be judged against. Without them, staff pull in different directions and nobody can tell whether the business is succeeding.

  This subtopic follows that chain from the vision down to the tactical objectives of a single team. It covers the four common objectives that the guide names (growth, profit, protecting shareholder value and ethical objectives) and corporate social responsibility: the idea that a business answers for its effects on society and the environment, not only to its owners. Strategic and tactical objectives and CSR are set at AO3, so expect to weigh them, not just describe them.
objectives:
  - '**Distinguish** between a vision statement and a mission statement, and explain how each guides a business.'
  - '**Explain** the common objectives of growth, profit, protecting shareholder value and ethical objectives, and why they can conflict.'
  - '**Compare** strategic and tactical objectives, and examine how they fit together.'
  - '**Evaluate** corporate social responsibility from the point of view of a business and of its stakeholders.'
  - "**Apply** SWOT analysis, and at HL Porter's generic strategies, to the choice of objectives and strategy."
situation:
  title: A board that wants everything
  fictional: true
  text: |
    Ridgeway Outdoor, a fictional maker of hiking gear, has six shops and sales of $12 million a year. Last spring a large foreign brand opened stores in its home market and began selling jackets at prices Ridgeway cannot match. At the next board meeting, every director has a different answer.

    The finance director wants to cut costs and protect this year's dividend, because two family shareholders depend on it. The sales director wants to open four more shops before the newcomer takes the best sites. The head of the repair workshop points out that more and more customers ask to rent gear rather than buy it. And a group of younger staff has written to the board asking it to stop using a waterproof coating that pollutes rivers, even though the alternative costs more.

    The founder's mission is still painted above the door: gear that lasts a lifetime, made by people who love the hills.

    *What should Ridgeway be aiming for, who should decide, and how do long-term aims become this year's targets?*
sections:
  - id: vision-and-mission
    title: Vision and mission statements
    kind: concept
    body: |
      A **vision statement** says where the organization wants to be in the long term, or what kind of world it wants to help create. It looks ahead and is meant to inspire. A **mission statement** sets out why the organization exists today: what it does, for whom and why, and often the values it works by. The vision answers "where are we going?"; the mission answers "why do we exist, and how do we behave?"

      Both are usually short and broad. Senior managers usually write them, ideally with staff involved, because a statement that nobody believes changes nothing.

      Because they are broad, neither can be checked directly; the measurable work is done by the objectives that sit beneath them.
    advantages:
      - "Give a shared sense of direction, and a test for any decision: does it fit our purpose?"
      - Can motivate staff who share the purpose, and attract recruits who do.
      - Tell customers, investors and other stakeholders what to expect.
      - Provide the starting point for strategic objectives.
    limitations:
      - Often vague or generic, so they guide few real decisions.
      - Cannot be measured directly, so progress towards them is hard to judge.
      - Can become public relations, and a fine statement that behaviour contradicts damages trust.
      - Need revising as the business changes, or they stop describing it.
    example:
      title: A mission put to the test
      fictional: true
      text: |
        Brightwell Home Repairs, a fictional firm, states its vision as "a safe, warm home for every family in the valley" and its mission as "we fix homes quickly and honestly, at a fair price, and train local young people to do the same".

        A developer offers a large, profitable contract that would leave nobody free for emergency repairs for six months. The managers turn it down because it fits neither statement. The mission did not make the decision, but it gave a reason that staff and customers understood.
  - id: common-objectives
    title: Common business objectives
    kind: types
    body: |
      An **objective** is a target that can be planned for and checked: it says what is to be achieved, usually in numbers, and by when. "Improve customer service" is too vague to be an objective; "answer every customer email within 24 hours by the end of March" is one.

      A widely used checklist for writing objectives is **SMART**: specific, measurable, achievable, realistic and time-bound. Versions differ (some use agreed, attainable or relevant), and the guide does not name it, so treat it as a useful test rather than an IB requirement. And a target can pass every test and still be the wrong target.

      The guide names four common objectives. Most businesses pursue several at once, and they can pull against each other.
    points:
      - term: Growth
        text: Getting bigger, whether in sales revenue, output, market share, outlets or staff. Size can lower costs per unit through economies of scale, give more power over suppliers and prices, and make the business harder to knock over, but growing costs money and often eats into profit at first.
      - term: Profit
        text: The surplus of revenue over costs. Some businesses aim for the largest profit possible (profit maximization); many are content with a satisfactory profit, because owners also care about keeping control, having a life outside work or staying on good terms with staff, customers and the community. Even organizations with other aims need some profit, or a surplus, to survive and invest.
      - term: Protecting shareholder value
        text: For companies, making the owners' investment worth more over time, through a rising share price and dependable dividends. Managers must weigh how much profit to pay out against how much to reinvest, and avoid gambles or scandals that would knock the share price.
      - term: Ethical objectives
        text: Targets based on what the business believes is morally right, not merely legal, such as sourcing only certified sustainable materials, refusing to advertise to young children or closing the pay gap between men and women. They can win trust and loyalty, but they usually cost money.
      - term: Other common objectives
        text: Survival, above all for a start-up or in a crisis; cash flow; market share; and, for public sector organizations and social enterprises, service to the community or social impact.
    example:
      title: Objectives that pull apart
      fictional: true
      text: |
        Tandem Coffee, a fictional chain of eight cafés, made a profit of $500,000 last year. For this year it sets three objectives: open two new cafés (growth), raise profit by 10% to $550,000 (profit), and buy only fair-trade coffee from April (ethical).

        Then the managers do the sums. The existing cafés are on course to make $550,000, but the fair-trade coffee will cost $45,000 more this year and the two new cafés are expected to lose $20,000 between them before they find their customers. Profit is likely to be $550,000 − $45,000 − $20,000 = $485,000, a 3% fall on last year.

        They keep the growth and the fair-trade coffee, revise the profit objective and explain to the owners why. Choosing which objective comes first, not just listing them, is the job of management.
  - id: objectives-change
    title: Why objectives differ and change
    kind: application
    body: |
      Objectives depend on who sets them and on the situation they are in.

      Different organizations aim at different things. A sole trader may want a steady income and independence; a publicly held company is under pressure to protect shareholder value; a public sector organization aims to provide a service and at least cover its costs; a social enterprise puts its social impact first.

      Objectives also change over time.

      - **Stage of development.** A start-up may aim simply to survive and break even; an established business may aim for growth or market share; a mature one may concentrate on profit and dividends.
      - **The economy.** In a recession, survival and cash flow come before growth; in a boom, growth targets rise.
      - **Competition.** A new rival may force a business to defend its market share at the expense of profit.
      - **Owners and managers.** A new chief executive, a takeover or the retirement of a founder can bring new priorities.
      - **Stakeholders and society.** Pressure from customers, staff, investors and governments has led many businesses to add ethical and environmental objectives.

      Targets also shape behaviour, and not always for the better. If bonuses depend on a sales figure, some staff will push products that customers do not need; if they depend on cutting costs, some will skimp on safety. Setting objectives well means checking what behaviour they reward, and many organizations publish a code of ethics alongside them.
    example:
      title: Objectives after a shock
      fictional: true
      text: |
        Northpoint Travel, a fictional tour operator, had a strategic objective of opening offices in three new cities within two years. When a sharp fall in bookings halved its cash reserves, the board replaced it with two objectives for the next twelve months: keep enough cash to cover three months of costs, and keep 90% of its regular business clients. Growth returned as an objective only when bookings recovered.
  - id: swot-analysis
    title: 'SWOT analysis: where the business stands'
    kind: framework
    body: |
      Before setting strategic objectives, managers need an honest picture of where the business stands. **SWOT analysis**, one of the tools in the business management toolkit, organizes that picture into four boxes.

      Strengths and weaknesses are **internal**: features of the business now, such as its skills, brand, finances, assets or costs. Opportunities and threats are **external**: changes in its environment that could help or harm it, such as new markets, new technology, rivals, regulation or a recession. A STEEPLE analysis of the external environment often feeds the second half.

      A SWOT is a starting point, not a decision. Its value lies in what managers do next: build on strengths to take opportunities, fix or work around weaknesses, and prepare for threats. Those choices become strategic objectives and the strategy to reach them.
    diagram: swot
    advantages:
      - Simple, quick and easy to share, so managers start from the same picture.
      - Links the internal position of the business to the changes around it.
      - Leads naturally into strategic objectives and strategy.
    limitations:
      - It can only reflect what managers know, and it cannot list what nobody foresaw.
      - People inside a business tend to overrate its strengths and play down its weaknesses.
      - A list does not show which factors matter most; they still have to be weighed.
      - A snapshot that dates quickly, so it needs regular review.
    example:
      title: Ridgeway Outdoor takes stock
      fictional: true
      text: |
        Ridgeway Outdoor, a fictional maker of hiking gear with six shops, lists its strengths (loyal customers, well-reviewed waterproof jackets, a skilled repair workshop), weaknesses (a narrow range, a website that cannot take bookings), opportunities (more hikers who would rather rent gear than buy it, customers who want repairs instead of replacements) and threats (a large foreign brand entering its home market with lower prices, rising fabric prices).

        The threat on price and the opportunities in renting and repair point the same way: compete on service and durability, not on price.
  - id: strategic-and-tactical
    title: Strategic and tactical objectives
    kind: framework
    body: |
      Objectives work at different levels. **Strategic objectives** are long-term objectives for the organization as a whole, usually several years ahead, set by the board and senior managers. They commit large resources, are hard to reverse and carry high risk: entering a new country, launching a new product range, becoming carbon neutral. Some writers call them corporate objectives.

      **Tactical objectives** are the shorter-term steps that deliver the strategy: targets for a department, team, product or region over months or a year or two, usually set by middle managers. They are more specific and quicker to change: open three shops this year, cut delivery times to two days, recruit twelve engineers by June.

      Alongside the objectives sit the plans for reaching them. A **strategy** is the long-term plan for reaching strategic objectives; **tactics** are the short-term actions that carry it out. Keep the two ideas apart in answers: an objective is the destination (*what*), while strategy and tactics are the route (*how*).
    points:
      - term: Time horizon
        text: Strategic objectives look several years ahead; tactical objectives run for a few months, a year, or perhaps two.
      - term: Scope
        text: Strategic objectives cover the whole organization; tactical objectives cover a department, product, region or team.
      - term: Who sets them
        text: Strategic objectives are set by the board and senior managers; tactical objectives by middle managers, often with their teams.
      - term: Resources and risk
        text: Strategic objectives commit large, hard-to-reverse resources with uncertain results; tactical objectives involve smaller, more routine commitments that are easier to adjust.
    diagram: objectives-hierarchy
    advantages:
      - Linking every tactical objective to a strategic one points everyone's work in the same direction.
      - Breaking a long-term objective into short steps makes progress visible and keeps people motivated.
      - Tactics can change quickly while the strategy holds steady.
    limitations:
      - Tactical success can undermine the strategy, as when a factory meets its monthly cost target by skipping maintenance and a breakdown later stops production.
      - Long-term objectives can go out of date as the environment changes, and pursuing them rigidly wastes resources.
      - Objectives imposed on staff who think them unachievable can demotivate, so involving the people who must deliver them helps.
    example:
      title: From a strategic objective to this year's targets
      fictional: true
      text: |
        After its SWOT, Ridgeway Outdoor sets a strategic objective: earn 25% of its revenue from rentals and repairs within four years, up from 5% now. Its strategy is to open rental counters in its shops first and add a mail-in repair service later.

        This year's tactical objectives follow from it. Operations must open rental counters in two shops by May; marketing must sign up 1,000 rental members by December; human resources must train eight staff as repair technicians.

        The percentages hide a large target. Today 5% of revenue of $12 million is $0.6 million. If revenue reaches $16 million in four years, 25% means $4 million from rentals and repairs, more than six times today's figure.
  - id: porters-generic-strategies
    title: Porter's generic strategies
    kind: framework
    level: HL
    body: |
      Once a strategic objective is set, the business must decide how it will compete to reach it. The management writer Michael Porter argued that there are only a few broad ways to gain a competitive advantage, and that a business should choose one deliberately. His generic strategies are part of the HL toolkit, and the guide suggests using them in unit 1.

      The choice rests on two questions. Will the business win through **lower cost**, or through **differentiation**, offering something customers value enough to pay more for? And will it target the **whole market** (a broad scope) or a **niche** (a narrow scope)?
    points:
      - term: Cost leadership
        text: Having the lowest costs in the industry, through scale, efficient processes, cheaper inputs or a stripped-back product. The business can then win on price, or charge the same as its rivals and earn a higher margin.
      - term: Differentiation
        text: Offering something customers see as distinctive and will pay more for, such as design, quality, brand, features or service. It pays only if the extra price exceeds the extra cost.
      - term: Cost focus
        text: Having the lowest costs in a niche, such as the cheapest beds for students in one city.
      - term: Differentiation focus
        text: Offering something distinctive to a niche, such as equipment designed for one sport at the highest level.
      - term: Stuck in the middle
        text: Porter warned that a business that fails to commit to one of these risks ending up neither the cheapest nor clearly different. Some writers disagree, pointing to businesses that manage to combine low cost with a difference customers value.
    diagram: porters-generic-strategies
    advantages:
      - Forces a clear choice about how to compete, which then guides objectives and tactics.
      - Simple to apply, and to explain to staff and investors.
    limitations:
      - Real businesses often blend low cost and differentiation, so the categories can oversimplify.
      - Advantages wear out as rivals copy them, so a position has to be defended and renewed.
      - "A label is not a capability: a firm that calls itself a cost leader without the scale or methods to back it up is simply cheap."
    example:
      title: Ridgeway chooses how to compete
      fictional: true
      text: |
        Ridgeway Outdoor cannot match the costs of the large foreign brand, so cost leadership is closed to it. It chooses differentiation focus: gear for serious hikers in cold, wet mountains, backed by rentals and free repairs for life.

        Its tactical objectives follow from that choice, such as having its jackets tested and reviewed by mountain guides, rather than cutting prices to match the newcomer.
  - id: csr
    title: Corporate social responsibility (CSR)
    kind: concept
    body: |
      **Corporate social responsibility** means a business accepting that it is accountable for how its activities affect people and the planet, and choosing to act for its stakeholders beyond the legal minimum. Obeying the law is what every business must do; CSR begins where the law stops.

      In practice CSR reaches every stakeholder group.

      - **Employees:** fair pay, safe conditions, training and a voice in decisions.
      - **Customers:** honest marketing, safe products, and personal data handled with care.
      - **Suppliers:** fair prices and terms, and checks on how workers are treated further down the supply chain.
      - **The community:** local jobs and training, and keeping noise, traffic and pollution down.
      - **The environment:** cutting emissions, waste and water use, and designing products to last.

      Many socially responsible businesses report on the **triple bottom line**, an idea introduced by the writer John Elkington: they measure their social impact (people) and their environmental impact (planet) alongside their financial results (profit). The guide uses the same three dimensions in its key concept of sustainability.

      CSR is not the same as being a social enterprise. A conventional business that practises CSR still exists mainly to earn a return for its owners, and CSR shapes how it does so. For a social enterprise, the social purpose is the reason it exists.
    example:
      title: Responsibility beyond the law
      fictional: true
      text: |
        Inkwell Print, a fictional printing company with 70 staff, offers paid apprenticeships to local school leavers, has switched to vegetable-based inks and recycled paper as standard, and gives each employee two paid days a year to volunteer locally. None of this is required by law.

        It costs about $35,000 a year, 4% of the firm's profit of $875,000. Each year Inkwell reports how many apprentices it trained, how much waste it recycled and how many hours its staff volunteered, alongside its accounts.
  - id: weighing-csr
    title: Weighing CSR
    kind: evaluation
    body: |
      Views on CSR differ, and an answer at AO3 should show that.

      - **It is right in itself.** A business uses society's resources and affects many people's lives, so it has duties beyond its owners, whether or not those duties pay.
      - **It is good business.** Responsible behaviour builds reputation and loyalty, helps to recruit and keep staff, lowers the risk of scandals, fines and boycotts, attracts investors who weigh social and environmental risk, and prepares the business for tighter regulation. On this view CSR serves long-term shareholder value.
      - **It is not the business's job.** A company's duty is to earn money for its owners while obeying the law; social goals belong to governments, and managers who spend the owners' money on causes are spending money that is not theirs.

      Expectations also change. Practices once seen as generous, such as basic safety standards, are now the legal minimum in many countries, while issues such as emissions, labour conditions in supply chains and the use of customers' data have moved up the agenda. Expectations differ between cultures too, so a multinational may face different standards in each country where it operates.
    advantages:
      - A stronger reputation and brand, and more loyal customers.
      - Easier recruitment, better motivation and lower staff turnover.
      - Lower risk of scandals, fines, boycotts and campaigns by pressure groups.
      - Access to investors and lenders who screen for social and environmental risk.
      - Can spark creativity, such as products designed to be repaired or new uses for waste.
    limitations:
      - Costs money now, while many of the benefits are uncertain and long term.
      - The benefits are hard to measure, which makes them hard to justify to shareholders.
      - Claims that run ahead of actions, known as greenwashing, destroy the trust that CSR was meant to build.
      - Stakeholders disagree about what is responsible, so a choice that pleases one group can anger another.
    example:
      title: When claims outrun actions
      fictional: true
      text: |
        Verdant Home, a fictional brand of cleaning products, advertised its bottles as "100% planet-friendly". A pressure group showed that only the caps could be recycled in most areas. Sales fell for two quarters, and repairing the reputation of the brand cost more than redesigning the bottle would have done. Stakeholders now check CSR claims against the evidence.
applications:
  - industry: Retail chains
    text: Publicly held retailers are judged quarter by quarter on sales growth, margins and the share price, so protecting shareholder value dominates their objectives, and new stores are a common growth target. Their size makes their supply chains a focus of CSR, and campaigners and investors now ask about the pay and safety of the people who make the products, not only the prices on the shelves.
  - industry: Technology start-ups
    text: Survival and growth come long before profit, because investors often accept years of losses in return for users and market share, and a bold vision helps to recruit staff who could earn more elsewhere. The risk is that growth targets crowd out everything else, including ethical objectives on customers' data and privacy.
  - industry: Public services
    text: Hospitals, schools and emergency services set service objectives, such as waiting times, results or response times, within a budget, and any surplus goes back into the service. Their missions matter because many staff are driven by purpose, but targets set by government can distort behaviour when hitting the number becomes the point.
  - industry: Manufacturing and energy
    text: Strategic objectives stretch over decades because plants and equipment last that long, and environmental objectives, such as cutting emissions, are driven more and more by regulation and investors as well as by choice. Tactical objectives are set plant by plant, on output, cost, safety and waste.
  - industry: Family businesses
    text: Owners often value control, continuity and the family name above the largest possible profit or rapid growth, so many aim for a satisfactory profit and steady growth paid for from their own profits. Objectives can change sharply when a founder retires and the next generation, or a buyer from outside, takes over.
  - industry: Social enterprises and cooperatives
    text: Social impact is the main objective and profit a means to it, so success is reported through the triple bottom line rather than through profit alone. Balancing the two is a constant tension, because members or funders may disagree about how much surplus to spend on the mission and how much to keep.
stakeholders:
  - group: Shareholders
    text: They want a rising share price and dependable dividends, which is what protecting shareholder value means, so some resist growth or CSR spending that cuts this year's profit. Long-term investors may back the same spending if it protects the reputation and future earnings of the business, so shareholders do not always speak with one voice.
  - group: Directors and senior managers
    text: They set the vision, the mission and the strategic objectives and are judged against them, and their own pay is often tied to targets, which can tempt them to favour short-term results. Where ownership and control are separate, managers may also pursue growth for the status it brings rather than the returns the owners want.
  - group: Employees
    text: Tactical objectives become their daily targets, and targets tied to bonuses can push them towards behaviour the business would not want, such as overselling or skipping safety checks. Ethical objectives and genuine CSR can make work more meaningful and help recruitment, but staff notice quickly when the mission statement and reality part company.
  - group: Customers
    text: They gain from ethical objectives such as safer products and honest marketing, but they will not always pay more for them, so a business that raises prices to pay for CSR can lose customers to cheaper rivals. Greenwashing like Verdant Home's damages trust, and customers increasingly check claims against the evidence.
  - group: Suppliers
    text: Ethical objectives can bring fairer prices and steadier orders, as Tandem Coffee's switch to fair-trade coffee does for its growers, but cost-cutting objectives often land on suppliers first. Businesses that set CSR standards for their supply chains expect suppliers to meet them, which raises the suppliers' standards and their costs.
  - group: Local communities and pressure groups
    text: CSR programmes such as Inkwell Print's apprenticeships bring local benefits, and pressure groups hold businesses to the objectives they publish. They also push for ethical objectives that owners may resist, and their power grows when the media and customers take up their cause.
evaluation:
  - Mission and vision statements cannot be measured, but that does not make them worthless, which is the issue behind one of the guide's theory of knowledge questions for this unit. Their value lies in whether they shape real decisions; a statement that behaviour contradicts does more harm than having none.
  - Objectives conflict, so the useful question is which comes first, and for how long. Growth and ethical objectives often cost profit in the short run and support it in the long run, while a business short of cash may rightly put survival first.
  - Protecting shareholder value and serving other stakeholders clash less over the long term than they appear to, but in the short term they can clash sharply, for example over job cuts or dividends in a downturn. Whose interests come first is a matter of judgement and ethics, not calculation.
  - Strategic and tactical objectives work only if they are aligned and revised. Rigid objectives in a changing environment waste resources, and targets that are too demanding can encourage unethical behaviour.
  - "CSR can be genuine, strategic or cosmetic, and the same activity can be any of the three. Judge it by evidence: what the business does, what it costs, whether it continues when times are hard, and whether it changes the core of the business or only its advertising."
  - SWOT and, at HL, Porter's generic strategies help to structure the choice of objectives and strategy, but they do not make it. What comes out of them depends on the evidence and judgement that go in.
decision:
  title: Keep the CSR programme in a bad year?
  fictional: true
  brief: |
    Inkwell Print, the fictional printing company with 70 staff, spends about $35,000 a year on its CSR programme: $14,000 on volunteering days (two paid days a year for each employee, 140 days in all), $12,000 on apprenticeships (the cost above what the apprentices' work brings in) and $9,000 on the extra cost of vegetable-based inks and recycled paper. Last year that was 4% of a profit of $875,000.

    This year its largest customer has gone out of business, and profit is forecast to fall to $500,000. Two shareholders propose stopping the whole programme until profit recovers. In surveys, about a fifth of Inkwell's customers, mostly schools and charities, say its recycled paper is one reason they use the firm.
  options:
    - label: Keep the whole programme
      text: Spend the $35,000 as usual, 7% of the forecast profit, and tell staff, customers and shareholders that the commitment stands.
    - label: Suspend it for a year
      text: Save $35,000, raising the forecast profit to $535,000, and restart when profit recovers. No new apprentices would be taken on, and the volunteering days and the greener inks and paper would stop.
    - label: Keep the core, trim the rest
      text: Keep the apprenticeships and the inks and paper ($21,000), and cut volunteering from two days to one ($7,000), so the programme costs $28,000, 5.6% of the forecast profit.
  guidance: |
    Treat the decision as a test of whether Inkwell's CSR is genuine, strategic or cosmetic, and weigh it against its other objectives.

    - **Keep it all:** $35,000 is now 7% of the forecast profit, up from 4% last year, a bigger share of a smaller profit but nowhere near a threat to the firm. Keeping it shows staff, customers and the community that the commitment survives hard times, which is what makes CSR credible.
    - **Suspend it:** it raises forecast profit by $35,000, or 7%, and protects dividends, which serves shareholder value in the short run. But dropping the recycled paper puts at risk the fifth of customers who chose Inkwell partly for it, just after the firm has lost its largest customer, and stopping apprenticeships may make skilled printers harder to find later. A programme that vanishes at the first downturn looks cosmetic.
    - **Trim it:** it saves $7,000 while keeping the parts that matter most to customers, the recycled paper, and to the firm's future skills, the apprentices, and it cuts the part with the least direct effect on the business. Staff may still resent losing a volunteering day, so the reason needs explaining.

    A strong judgement compares the saving with what is at risk. If even a few of the schools and charities would leave without the recycled paper, suspending everything could cost more than it saves, which strengthens the case for keeping or trimming; if the downturn threatened the firm's survival, every cost would be open to question. Say what the case does not give: the revenue from the customers who value the paper, and how long the downturn will last.
exam:
  - q: Define the term *mission statement*.
    marks: 2
    command: define
    level: SL/HL
    paper: '1'
    answer: |
      A strong response gives a precise definition: a short statement of why an organization exists, setting out what it does, for whom and why, often with the values it works by.

      - It is about the organization's purpose now, which distinguishes it from a vision statement, which describes where the organization wants to be in the future.
      - A full answer goes beyond "what the business wants to do".
  - q: With reference to Ridgeway Outdoor, distinguish between a strategic objective and a tactical objective.
    marks: 4
    command: distinguish
    level: SL/HL
    paper: '1'
    answer: |
      A strong response makes two clear differences, each illustrated with Ridgeway's own objectives.

      - **Time and scope:** a strategic objective is long term and covers the whole organization, such as Ridgeway's aim of earning 25% of its revenue from rentals and repairs within four years; a tactical objective is shorter term and covers one part of it, such as opening rental counters in two shops by May.
      - **Who sets it and what it commits:** strategic objectives are set by the board and senior managers and commit large, hard-to-reverse resources; tactical objectives, such as marketing's target of 1,000 rental members by December, are set by middle managers and are easier to adjust.
      - A strong answer shows the link: the tactical objectives are the steps that deliver the strategic one.
  - q: |
      Dunmore Foods, a fictional food manufacturer, sent 2,500 tonnes of waste to landfill last year. Its strategic objective is to cut that figure by 40% within three years, and its tactical objective for this year is a cut of 15%.

      Calculate the most waste Dunmore can send to landfill in three years' time, and the further cut in tonnes it will need after this year to meet its strategic objective.
    marks: 4
    command: calculate
    level: SL/HL
    paper: '2'
    answer: |
      - **Strategic target:** 2,500 × (1 − 0.40) = **1,500 tonnes** a year, a cut of 1,000 tonnes.
      - **After this year's tactical objective:** 2,500 × (1 − 0.15) = 2,125 tonnes, a cut of 375 tonnes.
      - **Further cut needed:** 2,125 − 1,500 = **625 tonnes** over the next two years.

      A strong response shows the working and notices what the figures mean: this year's tactical objective delivers only 37.5% of the total cut, and the remaining 625 tonnes is 29.4% of the waste Dunmore will still be sending at the end of this year, to be removed in the two years that follow.
  - q: Explain **two** ways in which Tandem Coffee's objectives for this year conflict.
    marks: 4
    command: explain
    level: SL/HL
    paper: '1'
    answer: |
      A strong response explains two distinct conflicts with the case's figures.

      - **Ethical against profit:** buying only fair-trade coffee from April will cost $45,000 more this year, which pulls profit away from the target of $550,000, a 10% rise on last year's $500,000.
      - **Growth against profit:** the two new cafés are expected to lose $20,000 between them before they find their customers, so opening them also cuts this year's profit.
      - **The combined effect:** profit is likely to be $550,000 − $45,000 − $20,000 = $485,000, a 3% fall, so the profit objective cannot be met alongside the other two. A strong answer may add that growth and ethical sourcing could support profit in later years.
  - q: Evaluate the proposal by Ridgeway Outdoor's younger staff to replace its waterproof coating with a more expensive alternative that does not pollute rivers.
    marks: 10
    command: evaluate
    level: SL/HL
    paper: '1'
    answer: |
      A strong response weighs the proposal as a CSR decision, using the case, and reaches a supported judgement.

      - **For:** it is an ethical objective that fits Ridgeway's mission of gear made by people who love the hills; customers who walk in the hills are likely to care about clean rivers, so it can strengthen the brand and set Ridgeway apart from a cheaper rival; it shows staff that their views count, which helps motivation and recruitment; and it prepares the firm for stricter rules on pollution.
      - **Against:** it raises costs just as a large rival is undercutting Ridgeway's prices; it threatens the profit the finance director wants to protect and the dividend two family shareholders depend on; the alternative may not perform as well; and any claim about it must be accurate, or Ridgeway risks the kind of damage that greenwashing brought Verdant Home.
      - **Judgement:** for example, the switch is justified because Ridgeway cannot win on price and its future lies in quality and trust, provided the extra cost per jacket is modest and customers are told honestly what has changed; a phased switch, starting with the best-selling jacket, would limit the risk. A strong answer says what is missing: the extra cost, how the alternative performs, and how much more customers will pay.

      When weighing one option, the teacher support material advises at least two arguments for and two against (pp. 56 and 60).
  - q: Using Porter's generic strategies, analyse why Ridgeway Outdoor chose differentiation focus rather than cost leadership to compete with the foreign brand.
    marks: 6
    command: analyse
    level: HL
    paper: '2'
    answer: |
      A strong response uses the two questions behind Porter's strategies, compete on cost or on difference, across the market or in a niche, and applies them to the case.

      - **Cost leadership is closed:** the foreign brand has the scale to produce more cheaply, Ridgeway has six shops, and rising fabric prices squeeze its costs further, so a price war is one it would lose.
      - **Differentiation fits its strengths:** loyal customers, well-reviewed waterproof jackets and a skilled repair workshop give it something customers value and will pay more for, backed by rentals and free repairs for life.
      - **A focus fits its size:** concentrating on serious hikers in cold, wet mountains lets it be the specialist in a segment where a broad brand is less expert.
      - **Risks:** the niche may be too small to reach the revenue its strategic objective needs, the extra price must cover the extra cost, and rivals may copy the service; a strong answer notes that a firm which also tries to match prices risks being stuck in the middle.
summary:
  - A **vision statement** says where an organization wants to be in the long term; a **mission statement** says why it exists now, for whom and with what values. Neither can be measured directly.
  - '**Objectives** are measurable targets with a deadline. SMART is a useful test of them, although the guide does not name it.'
  - 'The guide''s four common objectives are **growth, profit, protecting shareholder value and ethical objectives**. They often conflict in the short run, so managers must decide which comes first.'
  - Objectives differ with the type of organization and change with its stage of growth, the economy, competition, its owners and what stakeholders expect.
  - '**SWOT analysis** sets internal strengths and weaknesses beside external opportunities and threats, as a starting point for strategic objectives.'
  - '**Strategic objectives** are long-term targets for the whole organization, set by senior managers; **tactical objectives** are shorter-term targets for parts of it that deliver the strategy. Objectives are the *what*; strategy and tactics are the *how*.'
  - '**CSR** means acting for stakeholders beyond the legal minimum, and the **triple bottom line** reports on people, planet and profit. Judge CSR by evidence, because it can be genuine, strategic or cosmetic.'
  - '(HL) **Porter''s generic strategies** are cost leadership, differentiation, cost focus and differentiation focus, chosen by asking whether to compete on cost or on difference, across the market or in a niche.'
  - The guide sets strategic and tactical objectives and CSR at AO3, so expect to evaluate them; vision and mission statements and the common objectives are set at AO2.

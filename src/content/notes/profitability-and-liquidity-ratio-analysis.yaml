retrieval:
  - q: State the formula for ROCE, and the guide's definition of capital employed.
    a: ROCE = (profit before interest and tax ÷ capital employed) × 100, where capital employed = non-current liabilities + equity.
  - q: Which profit figure do the profit margin and ROCE both use?
    a: Profit before interest and tax.
  - q: Why does the acid test ratio leave out stock?
    a: Stock is the least liquid current asset. It has to be sold, often on credit, before it becomes cash, and some may not sell at its full value.
  - q: A business's gross profit margin is steady but its profit margin has fallen. What does this suggest?
    a: Its expenses (overheads) have grown faster than its sales, so they take a bigger share of each dollar of revenue.
  - q: Current assets are $90,000, of which stock is $30,000, and current liabilities are $60,000. Calculate the current ratio and the acid test ratio.
    a: Current ratio = 90,000 ÷ 60,000 = 1.50. Acid test ratio = (90,000 − 30,000) ÷ 60,000 = 1.00.
  - q: Give one strategy to improve the profit margin, and its main drawback.
    a: For example, raise prices (customers may buy less or switch to rivals) or cut expenses (less marketing or fewer staff can reduce sales or service).
  - q: Why does collecting money from debtors leave the current ratio unchanged?
    a: Debtors and cash are both current assets, so turning one into the other leaves current assets, and the ratio, the same. The cash position improves, but the ratio does not move.
  - q: How can ROCE fall just after a business makes a sound investment?
    a: Capital employed rises at once, through the new loan or shares, while the extra profit from the investment arrives later.

# Notes: 3.5 Profitability and liquidity ratio analysis. Written in the
# platform's own words from the guide's four content statements (p. 29), its
# statement layouts (pp. 59 and 61) and its formula list (p. 64): every ratio
# formula here is the guide's, including its definition of capital employed,
# and matches the platform's ratio code (src/lib/ratios.ts). The teacher
# support material's glossary was read to check terms; no coursebook chapter
# for unit 3 was supplied. Every business named is fictional, and every figure
# was checked by arithmetic. The strategies are common options, not a list the
# guide prescribes. The situation and decision continue the Tidewater Outdoors
# example (the decision adds a split of its 2026 current liabilities that sums
# to the example's total), and every figure in them and in the exam-style
# questions was checked by script.
code: '3.5'
title: Profitability and liquidity ratio analysis
level: SL/HL
introduction: |
  A statement of profit or loss tells you that a business made $105,000 of profit before interest and tax. Is that good? It depends on how much the business sold to earn it, how much money was invested to earn it, and whether the business can still pay its bills. **Ratio analysis** answers those questions by comparing one figure in the accounts with another.

  This subtopic covers the five ratios the guide sets for SL and HL: three **profitability ratios**, which show how well a business turns its sales and its capital into profit, and two **liquidity ratios**, which show whether it can pay the debts that fall due within a year. You need to calculate each one from the accounts, explain what it shows, and judge the strategies a business could use to improve it, including what each strategy costs.
objectives:
  - '**Calculate** the gross profit margin, the profit margin and the return on capital employed from a set of final accounts.'
  - '**Calculate** the current ratio and the acid test (quick) ratio, and **explain** what each shows about liquidity.'
  - '**Comment** on a business''s ratios by comparing them with earlier years and with other businesses.'
  - '**Evaluate** strategies to improve the profitability ratios, weighing what each one costs.'
  - '**Evaluate** strategies to improve the liquidity ratios, including those that change the cash position without moving the ratios.'
situation:
  title: Record sales, awkward questions
  fictional: true
  text: |
    A year after opening its second store, Tidewater Outdoors Ltd, a fictional retailer of camping and hiking gear, has had its best year for sales: $1,050,000 in 2026, a quarter more than in 2025. The directors had planned a celebration.

    Then the bank that lent the $180,000 for the new store sent three questions about the 2026 accounts. Why has profit before interest and tax fallen from $140,000 to $105,000 when sales grew so much? What return is the business now earning on all the money invested in it? And why is there only $5,000 in the bank when the stockroom holds $125,000 of tents, stoves and boots?

    The directors read the year as a success, because the business is bigger. The bank reads it as a warning, because the business looks weaker. Both are looking at the same two statements.

    How can ratios turn the figures in a set of accounts into evidence about profitability and liquidity, and what could Tidewater do about what they show?
sections:
  - id: what-ratio-analysis-is
    title: What ratio analysis is for
    kind: concept
    body: |
      A ratio compares two figures from the final accounts, as a percentage or as a number to one. Comparing turns amounts into evidence. Profit of $105,000 is a great deal for a corner shop and very little for a chain of stores, but a profit margin of 10% means the same thing for both.

      The guide groups the ratios into families. This subtopic covers the profitability and liquidity families, for SL and HL. The diagram also shows the efficiency family (stock turnover, debtor days, creditor days and the gearing ratio), which is HL only and belongs to [3.6](/topics/efficiency-ratio-analysis/).

      A single ratio on its own says little. It becomes useful when it is compared:

      - with the same business in earlier years, to show a trend;
      - with competitors or the average for the industry, to show how the business is doing relative to others;
      - with the business's own targets, to show whether it is on course.
    diagram: ratio-families
    points:
      - term: Profitability ratios
        text: The gross profit margin, the profit margin and return on capital employed (ROCE). They show how much profit the business makes from its sales and from the capital invested in it.
      - term: Liquidity ratios
        text: The current ratio and the acid test (quick) ratio. They show whether the business can meet the debts due within a year from the assets it can turn into cash soon.
    advantages:
      - Makes businesses of different sizes comparable, and one business across years in which its sales differed.
      - Picks out trends and warning signs quickly, such as a falling margin or a weakening acid test ratio.
      - Gives managers, banks and investors a common language for judging the same business.
      - Helps to set targets and to check afterwards whether a strategy worked.
    limitations:
      - Shows what changed, not why. A falling margin can come from price cuts, dearer supplies or a change in what is sold.
      - Uses past figures, and the statement of financial position shows a single day that can be window-dressed.
      - Comparisons mislead when businesses work in different industries, use different accounting methods or have different year ends.
      - Leaves out what is not in the accounts, such as the quality of staff and managers, the strength of the brand and the state of the market.
  - id: profitability-ratios
    title: Profitability ratios
    kind: method
    body: |
      Profitability is profit measured against something else. The two **margins** measure profit against sales revenue; **ROCE** measures it against the long-term capital invested in the business. Candidates receive the guide's formula list in the examination, so the marks go to choosing the right figures, showing the working and explaining the result.

      The **gross profit margin** shows how much of each dollar of sales is left after paying for the goods or services sold, so it reflects prices and the direct cost of what is sold. The **profit margin** uses profit before interest and tax, so it also takes account of the expenses of running the business. The gap between the two margins is the share of sales taken by expenses: if the gross profit margin holds steady while the profit margin falls, the expenses are growing faster than sales.

      **ROCE** compares profit before interest and tax with **capital employed**, the long-term finance provided by lenders and owners. It answers the question an investor asks: what return does the money tied up in this business earn? Compare it with what the same money could earn elsewhere, such as the interest on savings, and with the interest rate the business pays on its loans.

      In the diagram, the fictional company's gross profit margin is (200 ÷ 500) × 100 = 40%, and its profit margin is (80 ÷ 500) × 100 = 16%, so expenses take 24 cents of every dollar of sales.
    diagram: profit-or-loss-waterfall
    formulas:
      - name: Gross profit margin
        expression: Gross profit margin = (gross profit ÷ sales revenue) × 100
        note: Guide, p. 64. Gross profit is sales revenue minus cost of sales.
      - name: Profit margin
        expression: Profit margin = (profit before interest and tax ÷ sales revenue) × 100
        note: Guide, p. 64. It uses profit before interest and tax, not profit before tax or the profit for the period.
      - name: Return on capital employed (ROCE)
        expression: ROCE = (profit before interest and tax ÷ capital employed) × 100
        note: Guide, p. 64.
      - name: Capital employed
        expression: Capital employed = non-current liabilities + equity
        note: The guide's definition (p. 64). Because the statement of financial position balances, it also equals total assets minus current liabilities, a useful check.
    points:
      - term: What moves the gross profit margin
        text: It falls if prices are cut or the cost of sales rises faster than revenue. It rises with higher prices, cheaper supplies, less waste, or a shift towards products with a bigger margin.
      - term: What moves the profit margin
        text: Everything that moves the gross margin, plus the expenses. Rent, salaries or marketing that grow faster than sales pull it down.
      - term: What moves ROCE
        text: It falls if profit falls, or if capital employed rises faster than profit, as it often does just after a business borrows or issues shares to invest. A ROCE below the interest rate the business pays on its loans is a warning sign.
  - id: liquidity-ratios
    title: Liquidity ratios
    kind: method
    body: |
      **Liquidity** is a business's ability to pay its debts as they fall due. A business can be profitable and still fail if it cannot pay its suppliers, its staff and its bank on time. The liquidity ratios compare the assets that will turn into cash within a year with the debts due within a year, both taken from the statement of financial position.

      The **current ratio** counts all the current assets: cash, debtors and stock. The **acid test ratio** leaves out stock, because stock has first to be sold, often on credit, before it becomes cash, and some of it may never sell at full price. A wide gap between the two ratios shows that much of the business's liquidity is tied up in stock.

      Both ratios are written as a number to one, for example 1.5 or 1.5:1. In the diagram, the fictional company's current ratio is 150 ÷ 70 = 2.14, and its acid test ratio is (150 − 70) ÷ 70 = 1.14.
    diagram: financial-position-balance
    formulas:
      - name: Current ratio
        expression: Current ratio = current assets ÷ current liabilities
        note: Guide, p. 64.
      - name: Acid test (quick) ratio
        expression: Acid test (quick) ratio = (current assets − stock) ÷ current liabilities
        note: Guide, p. 64. Stock is taken from current assets, not from current liabilities.
    points:
      - term: A current ratio below 1
        text: Current liabilities are greater than current assets, so the business may struggle to pay its short-term debts without new finance.
      - term: A current ratio of about 1.5 to 2
        text: Often described as comfortable. This is a rule of thumb, not an IB rule, and what is normal differs between industries.
      - term: An acid test ratio of about 1
        text: The business could pay its short-term debts without selling any stock. Below 1, it is relying on its stock selling.
      - term: Very high ratios
        text: Not always good news. They can mean cash sitting idle and earning little, stock piling up, or customers slow to pay.
      - term: The industry matters
        text: A supermarket sells for cash every day, holds stock that sells within days and pays its suppliers weeks later, so it can run safely with ratios well below these figures. A builder that is paid only when each project ends needs far more.
  - id: worked-example
    title: 'Calculating and commenting: a worked example'
    kind: application
    body: |
      Ratio questions reward a steady routine. Write the formula, substitute the figures from the accounts, and give the answer to two decimal places with its unit: a percentage for the profitability ratios, a number to one for the liquidity ratios. Then say what it means. Compare it with the earlier year or with a rival, give the likely cause, and say what follows for the business.

      The example uses two years of accounts for one fictional retailer. Its 2025 statements are prepared in full in the notes on [3.4 Final accounts](/topics/final-accounts/).
    example:
      title: 'Tidewater Outdoors: bigger, but weaker'
      fictional: true
      text: |
        Tidewater Outdoors Ltd, a fictional retailer of camping and hiking gear, opened a second store in 2026, paid for with a long-term loan. The figures, in $000, for 2025 and then 2026:

        - Sales revenue 840 and 1,050. Gross profit 470 and 525. Profit before interest and tax 140 and 105.
        - Non-current liabilities 120 and 300. Equity 405 and 432.
        - Current assets 150 and 190, including stock of 70 and 125 and cash of 25 and 5. Current liabilities 75 and 118.

        The ratios:

        - Gross profit margin: (470 ÷ 840) × 100 = 55.95% in 2025; (525 ÷ 1,050) × 100 = 50.00% in 2026.
        - Profit margin: (140 ÷ 840) × 100 = 16.67%; (105 ÷ 1,050) × 100 = 10.00%.
        - ROCE: 140 ÷ (120 + 405) × 100 = 26.67%; 105 ÷ (300 + 432) × 100 = 14.34%.
        - Current ratio: 150 ÷ 75 = 2.00; 190 ÷ 118 = 1.61.
        - Acid test ratio: (150 − 70) ÷ 75 = 1.07; (190 − 125) ÷ 118 = 0.55.

        Every ratio is worse. Sales grew by 25%, but cost of sales (sales revenue minus gross profit) grew faster, from 370 to 525, probably because the new store opened with discounts, so the gross profit margin fell by almost 6 percentage points. That explains most of the fall in the profit margin. Expenses (gross profit minus profit before interest and tax) took 39.29% of sales in 2025 and 40.00% in 2026, hardly any change.

        ROCE almost halved, because profit fell while capital employed rose by 207, of which 180 was extra long-term borrowing: the new store's capital is in place, but its profit is not yet. On liquidity, the current ratio still looks comfortable, but the acid test ratio has roughly halved. Stock rose from 70 to 125 while cash fell from 25 to 5, so if the new stock does not sell, Tidewater will struggle to pay its suppliers.
  - id: improving-profitability
    title: Strategies to improve the profitability ratios
    kind: evaluation
    body: |
      Every strategy works on one of three things: the **price** charged, the **costs** of making and selling, or the **capital** needed to earn the profit. None is free. Each has a cost, a risk or a stakeholder who loses, and the right choice depends on what caused the weak ratio, on the market and on the business's objectives. The strategies below are the usual options, not a list the IB prescribes.
    points:
      - term: Raise prices
        text: Lifts all three ratios if customers keep buying. The risk is lost sales. If customers are sensitive to price, or rivals hold their prices, revenue and profit can fall even as the margin rises.
      - term: Cut the cost of sales
        text: Cheaper suppliers, bulk buying, less waste or more productive staff lift the gross profit margin, and the profit margin and ROCE with it. But cheaper inputs can lower quality and harm the brand, bulk buying ties up cash in stock, and a new supplier may be less reliable.
      - term: Control expenses
        text: Cheaper premises, lower energy use, fewer layers of management or less advertising lift the profit margin and ROCE, though not the gross margin. Cuts can go too deep. Less marketing can mean lower sales next year, and job cuts can damage morale and service.
      - term: Sell more of the higher-margin products
        text: Shifting the product mix towards items with a bigger margin raises the average margin without changing any price. It depends on customers wanting those products, and dropping low-margin lines can lose customers who bought both.
      - term: Increase sales volume
        text: More sales spread the fixed expenses, such as rent and salaries, more thinly, which lifts the profit margin and ROCE. Winning the sales costs money first, in promotion or extra capacity, and price cuts to win volume lower the gross margin.
      - term: Use less capital for the same profit
        text: Selling assets the business does not need and using the money to repay long-term loans lowers capital employed, so ROCE rises on the same profit. But assets sold may be needed later, and a business that avoids investing to protect this year's ROCE may earn less in the future.
    example:
      title: A price rise that pays, and one that does not
      fictional: true
      text: |
        Brookfield Soap, a fictional maker of handmade soap, sells 50,000 bars a year at $6.00. Each bar costs $3.00 in materials and labour, so gross profit is $150,000 and the gross profit margin 50%. Brookfield raises its price to $6.60.

        - If sales fall to 45,000 bars: revenue $297,000, cost of sales $135,000, gross profit $162,000. The margin rises to 54.55%, and gross profit rises by $12,000.
        - If sales fall to 40,000 bars: revenue $264,000, cost of sales $120,000, gross profit $144,000. The margin is still 54.55%, but gross profit falls by $6,000.

        The margin rises either way, because each bar now earns $3.60 instead of $3.00. Whether Brookfield is better off depends on how many customers it keeps: the rise pays only if sales stay above about 41,667 bars ($150,000 ÷ $3.60), five bars in every six it sold before. A better margin is not the same as more profit.
  - id: improving-liquidity
    title: Strategies to improve the liquidity ratios
    kind: evaluation
    body: |
      The liquidity ratios rise when current assets rise or current liabilities fall. The quickest strategies bring in money from outside the everyday cycle of trading, from long-term finance or from selling assets the business does not need. Read each strategy for its effect on both ratios, and on cash, because they do not always move together.

      Collecting debts faster, for example, turns debtors into cash. The business can pay its bills more easily, but current assets are unchanged, so neither ratio moves. Liquidity and the liquidity ratios are not quite the same thing. As with profitability, these are common options, not a list the IB prescribes, and each has a cost.
    points:
      - term: Sell surplus stock
        text: Turning slow-selling stock into cash raises the acid test ratio, because cash counts in it and stock does not. The current ratio stays the same if the stock sells at its recorded value, and falls slightly if it has to be discounted. The risks are selling stock that customers later want, and discounts that lower the gross profit margin.
      - term: Sell non-current assets, or sale and leaseback
        text: Selling property or equipment adds cash to current assets, so both ratios rise. With sale and leaseback the business keeps using the asset, but it takes on years of lease payments and gives up an asset that could have secured a loan.
      - term: Turn an overdraft into a long-term loan
        text: Moving the debt out of current liabilities raises both ratios at once. The business is committed to interest for several years and to the lender's conditions, and it owes exactly as much as before.
      - term: Raise long-term finance
        text: New share capital, or a long-term loan, held as cash raises both ratios. New shares dilute the owners' control; a loan adds interest and, at HL, raises gearing.
      - term: Retain more profit
        text: Paying smaller dividends keeps cash in the business and builds up current assets over time. Shareholders who rely on dividends may object, and it is slow.
      - term: Collect debts sooner, or use debt factoring
        text: Chasing late payers, shortening credit terms or factoring turns debtors into cash sooner. That helps the cash position, but on its own it leaves both ratios unchanged, and a factor's fee even reduces current assets slightly. Tighter credit terms may also send customers to rivals.
      - term: Pay suppliers later
        text: Keeps cash in the bank for longer, but the debt stays in current liabilities, so the ratios do not improve, and suppliers may tighten their terms. It is a way of managing cash flow ([3.7](/topics/cash-flow/)), not a cure for weak liquidity.
    example:
      title: Same business, three moves
      fictional: true
      text: |
        Marlow Print, a fictional printing firm, has current assets of $120,000 (cash $10,000, debtors $50,000 and stock $60,000) and current liabilities of $100,000 (an overdraft of $40,000 and trade creditors of $60,000). Its current ratio is 1.20 and its acid test ratio 0.60. Take each move on its own.

        - Collect $30,000 of overdue debts. Cash rises to $40,000 and debtors fall to $20,000, but current assets are still $120,000, so the ratios stay at 1.20 and 0.60, although Marlow can now pay its bills more easily.
        - Sell $20,000 of surplus paper stock at cost. Stock falls to $40,000 and cash rises to $30,000. The current ratio stays at 1.20, but the acid test ratio rises to 0.80.
        - Replace the $40,000 overdraft with a three-year loan. Current liabilities fall to $60,000, so the current ratio rises to 2.00 and the acid test ratio to 1.00. The debt has not gone; it has moved to non-current liabilities, with interest to pay for three years.
applications:
  - industry: Supermarkets and grocery retail
    text: Competition is on price, so gross profit margins are low and profit comes from volume; a small slip in the margin moves profit a long way. Customers pay at the till while suppliers are paid weeks later, so a current ratio below 1 is normal and safe, as long as the stock keeps selling quickly.
  - industry: Software and online services
    text: Serving one more customer costs little, so gross profit margins are usually high, but developers, sales staff and marketing sit in expenses, so the profit margin can be low or negative while the business grows. Because it needs few physical assets, a mature software business can earn a high ROCE, unless it holds large cash balances from share issues, which raise capital employed without adding profit.
  - industry: Manufacturing
    text: Factories and machinery tie up a large capital employed, so ROCE is the ratio owners watch most closely, and a new production line can depress it for a year or two before its profit arrives. Stock is held as materials, work in progress and finished goods, which opens a wide gap between the current ratio and the acid test ratio.
  - industry: House building
    text: Land, half-built homes and materials are all stock, so a builder's acid test ratio is often far below its current ratio, and its liquidity depends on selling homes on time. A delayed project or a slow housing market leaves it paying wages and suppliers while its cash is locked in unsold stock.
  - industry: Hotels and restaurants
    text: Food and drink stock is small and perishable, so the acid test ratio sits close to the current ratio, while buildings and fittings make capital employed large. Many costs, such as staff and premises, are fixed, so profit margins swing with occupancy, and a quiet season can turn a healthy margin into a loss.
  - industry: Social enterprises
    text: A social enterprise reinvests its surplus in its mission, so it may accept a lower profit margin than a commercial rival, and ROCE serves less as a goal than as a check that capital is not being wasted. Lenders and grant-makers still look hard at liquidity, because an organization that cannot pay its bills cannot pursue any mission.
stakeholders:
  - group: Shareholders and investors
    text: Compare ROCE with what their money could earn elsewhere and with the interest rate the business pays, and watch the margins for trends. They may press for strategies that lift ROCE quickly, such as selling surplus assets or cutting costs, which can conflict with managers who want to invest for the long term.
  - group: Banks and other lenders
    text: Read the liquidity ratios first, to judge whether short-term debts can be met, then ROCE against the interest rate, to judge whether borrowed money earns its keep. A lender worried about liquidity may restrict dividends, raise its charges or ask for repayment, which sets it against shareholders who want a payout.
  - group: Suppliers
    text: Check the acid test ratio before giving trade credit, because a weak one warns that the business needs its stock to sell before it can pay them. Delaying payment to suppliers keeps cash in the business but leaves current liabilities unchanged, so it does not improve the ratios, and a supplier that sees liquidity weakening may shorten its terms or ask for payment in advance.
  - group: Managers
    text: Use the margins to find where costs are rising, and ROCE to judge divisions and projects. When a bonus depends on a ratio, they may manage the ratio rather than the business, for example by postponing a worthwhile investment because it would lower ROCE for a year.
  - group: Employees and trade unions
    text: Strategies to lift the margins often fall on labour, through pay freezes, fewer staff or more work for each person. A rising profit margin strengthens a pay claim, so employees and shareholders read the same ratio as evidence for opposite conclusions.
  - group: Customers
    text: A price rise is the quickest way to lift every profitability ratio, and customers pay for it; cheaper inputs can lower quality. In a competitive market they can switch to rivals, which limits how far a business can raise its margins at their expense.
evaluation:
  - A ratio is a question, not an answer. It shows that something has changed; the cause has to come from the business's situation. A falling gross profit margin might mean price cuts to win market share, which may be a sound strategy, or rising supplier prices, which is a problem.
  - Profitability and liquidity can pull in opposite directions. Holding plenty of cash and stock makes the liquidity ratios look safe but earns little and lowers ROCE; squeezing stock and cash to raise returns leaves no buffer. A business needs enough liquidity to survive and enough profitability to be worth running, and one that is short of cash must put survival first.
  - The benchmark decides the verdict. A current ratio of 0.8 is a warning for a manufacturer but normal for a supermarket, and a gross profit margin of 30% is high for a grocer but low for a software company. Compare with the same business over time and with similar businesses, not with an ideal number.
  - The ratios are only as honest as the accounts. Because the statement of financial position shows a single day, a business can lift its liquidity ratios by selling assets or delaying stock purchases just before the year end, and it can lift its profit with generous estimates. This window dressing is harder to hide in ratios taken over several years.
  - Ratios use the past and leave out what is not in the accounts, such as a new competitor, a large contract about to end, the quality of management or the morale of the staff. Use them alongside the other evidence in a case, and say what they cannot show.
  - Different readers look at different ratios. A bank or a supplier deciding whether to give credit looks first at liquidity; a shareholder looks at ROCE; managers look at the margins to find which costs to control. A good answer says whose decision the ratios are informing.
decision:
  title: Answering the bank
  fictional: true
  brief: |
    Tidewater Outdoors' 2026 accounts, in the worked example above, show every ratio weaker than in 2025: the gross profit margin down from 55.95% to 50.00%, ROCE from 26.67% to 14.34% and the acid test ratio from 1.07 to 0.55. The causes are clear enough. The new store opened with heavy discounts, and stock has risen to $125,000 while cash has fallen to $5,000.

    Its current liabilities of $118,000 are trade creditors of $70,000, a bank overdraft of $38,000 and other short-term loans of $10,000; expenses were $420,000. The bank wants to know what the directors will do, and they can put management time and money behind one main strategy this year.
  options:
    - label: Clear the surplus stock
      text: Sell last season's tents and boots, which cost $50,000, in a clearance sale for $40,000. Taken at the 2026 year end, stock falls to $75,000 and cash rises to $45,000, so the current ratio slips from 1.61 to 1.53 but the acid test ratio rises from 0.55 to 0.89. The $10,000 loss comes straight off profit before interest and tax.
    - label: End the opening discounts
      text: Return the new store to normal prices. If sales hold at $1,050,000 and the gross profit margin recovers to 54%, gross profit rises to $567,000 and, with expenses unchanged, profit before interest and tax to $147,000, a profit margin of 14.00% and a ROCE of 20.08%. If the higher prices cost a tenth of sales, profit before interest and tax falls to $90,300.
    - label: Turn the overdraft into a loan
      text: Replace the $38,000 overdraft with a three-year bank loan. Current liabilities fall to $80,000, so the current ratio rises to 2.38 and the acid test ratio to 0.81, but capital employed rises to $770,000 and ROCE dips to 13.64%. Tidewater owes exactly as much as before.
  guidance: |
    Match each option to the cause it treats. The acid test ratio collapsed because cash went into stock that has not sold; the margins fell because of the opening discounts. Clearing the stock treats the first cause, ending the discounts treats the second, and converting the overdraft treats neither: it moves a debt from one line of the statement of financial position to another.

    **Clearing the stock** is the most direct cure for liquidity. It turns slow-moving stock into cash at once and lifts the acid test ratio by more than half, at the price of a $10,000 loss and a weaker margin this year. It also improves the cash position, not just the ratio, which matters if suppliers are pressing for payment. **Ending the discounts** treats the deeper problem: at a 54% gross margin, ROCE would be back above 20%. But it rests entirely on how customers respond to higher prices, which nobody yet knows, and it does nothing for cash this month. **Converting the overdraft** gives the best-looking current ratio and removes the risk of the bank withdrawing the overdraft at short notice, but the business is no more liquid in fact, it commits to three years of interest, and ROCE falls a little further.

    With $5,000 in the bank, liquidity is the urgent problem, so a strong answer usually puts it first: clear the stock, or convert the overdraft if the bank offers fair terms, while testing the end of the discounts gradually, on a few ranges, to see how customers react. The judgement would change with evidence on how sensitive the new store's customers are to price, whether the surplus stock would sell at full price next season, and the interest rate on the loan.
exam:
  - q: Define the term *liquidity*.
    marks: 2
    command: define
    level: SL/HL
    paper: '1'
    answer: |
      A strong response gives a precise definition: a business's ability to pay its short-term debts as they fall due, from its cash and from the assets it can turn into cash quickly.

      - A complete definition includes the idea of paying debts as they fall due, or within the coming year.
      - Confusing liquidity with profitability, or defining it only as "having cash", earns little.
  - q: |
      Saltmere Ceramics Ltd, a fictional maker of tableware, reports these figures for 2025, in $000: sales revenue 940; cost of sales 611; expenses 216; non-current liabilities 180; equity 520; cash 12; debtors 88; stock 150; current liabilities 190.

      Calculate Saltmere's profit margin and its return on capital employed (ROCE) for 2025.
    marks: 4
    command: calculate
    level: SL/HL
    paper: '2'
    answer: |
      A strong response writes each formula from the guide, substitutes the figures, and gives each result as a percentage to two decimal places.

      - Gross profit = 940 − 611 = 329; profit before interest and tax = 329 − 216 = 113.
      - Profit margin = (113 ÷ 940) × 100 = **12.02%**.
      - Capital employed = non-current liabilities + equity = 180 + 520 = 700.
      - ROCE = (113 ÷ 700) × 100 = **16.14%**.

      The usual error is to use gross profit, or a profit after interest, in place of profit before interest and tax.
  - q: Using the figures in question 2, calculate Saltmere's current ratio and acid test (quick) ratio for 2025.
    marks: 4
    command: calculate
    level: SL/HL
    paper: '2'
    answer: |
      A strong response shows the working and writes each ratio as a number to one.

      - Current assets = 12 + 88 + 150 = 250.
      - Current ratio = 250 ÷ 190 = **1.32**.
      - Acid test ratio = (250 − 150) ÷ 190 = 100 ÷ 190 = **0.53**.

      Stock is taken away from current assets, not from current liabilities, and neither ratio is a percentage.
  - q: |
      In 2024, Saltmere's gross profit margin was 38.20%, its profit margin 14.50%, its ROCE 18.30%, its current ratio 1.65 and its acid test ratio 0.92. During 2025 it agreed lower prices with a hotel chain that now buys a third of its output, and it bought a year's supply of clay and glazes in bulk ahead of a supplier's price rise.

      Using your answers to questions 2 and 3, comment on the changes in Saltmere's profitability and liquidity.
    marks: 4
    command: comment
    level: SL/HL
    paper: '2'
    answer: |
      A strong response links each change in the ratios to a cause in the case and says what follows.

      - **Profitability.** The gross profit margin fell from 38.20% to 35.00% (329 ÷ 940 × 100), consistent with the lower prices agreed with the hotel chain. Expenses took a slightly smaller share of sales, 22.98% against 23.70%, so the fall in the profit margin, from 14.50% to 12.02%, came from the gross margin, not from overheads. ROCE fell from 18.30% to 16.14%; whether that is enough depends on the interest rate Saltmere pays and on what similar businesses earn, which the case does not give.
      - **Liquidity.** The acid test ratio fell much further than the current ratio, from 0.92 to 0.53 against 1.65 to 1.32, because the bulk purchase moved cash into stock, which the acid test ratio leaves out. With $12,000 of cash against $190,000 of current liabilities, Saltmere relies on selling stock and collecting $88,000 from its debtors to pay its bills.
      - A strong comment adds a judgement: the bulk purchase may pay for itself once the supplier's prices rise, but the lower margin on a third of output, from one customer, is the change to watch.
  - q: Explain **two** strategies Saltmere could use to improve its acid test ratio.
    marks: 4
    command: explain
    level: SL/HL
    paper: '2'
    answer: |
      A strong response explains how each strategy changes the parts of the ratio, applies it to Saltmere and notes a drawback.

      - **Sell some of the surplus stock.** Stock is left out of the acid test ratio, so turning it into cash raises the ratio. Selling $40,000 of stock at its recorded value would lift the ratio from 0.53 to (250 − 110) ÷ 190 = 0.74. But the bulk purchase was meant to beat a price rise, so Saltmere might later have to buy the same clay at the higher price.
      - **Replace short-term borrowing with long-term finance.** If part of the current liabilities is an overdraft or a short-term loan, moving it into a long-term loan lowers current liabilities and raises both liquidity ratios. The debt remains, with interest to pay for several years.
      - Raising share capital held as cash, or selling an unneeded non-current asset, are also valid. Collecting debts faster helps cash but leaves the acid test ratio unchanged, because debtors and cash both count in it.
  - q: Saltmere's directors want to restore the profit margin to at least its 2024 level. Evaluate **two** strategies they could use to improve Saltmere's profitability.
    marks: 10
    command: evaluate
    level: SL/HL
    paper: '2'
    answer: |
      A strong response analyses two strategies in Saltmere's situation, uses the figures, weighs each and reaches a judgement.

      - **The size of the gap.** Each percentage point of gross profit margin on sales of $940,000 is worth $9,400 of gross profit. Recovering the 2024 gross margin of 38.20% would add $30,080, lifting profit before interest and tax from $113,000 to $143,080 and the profit margin to 15.22%, if expenses stayed the same.
      - **Strategy 1: raise prices, or renegotiate the hotel contract.** This attacks the cause of the fall directly. But the hotel chain takes a third of output, so pressing it too hard risks losing a customer whose sales are worth far more than the margin regained, and other customers may also resist higher prices.
      - **Strategy 2: cut the cost of sales.** Less kiln waste, cheaper glazes or the savings the bulk purchase should bring would lift the gross margin without touching any customer's price. But cheaper materials risk quality, which matters for tableware sold to hotels, and further bulk buying ties up cash that the weak acid test ratio shows Saltmere can ill afford.
      - **Other routes,** such as shifting sales towards higher-margin products, controlling expenses or selling surplus assets to lower capital employed, are also valid when they are applied to the case.
      - **Judgement.** For example, that cutting the cost of sales is the safer first step because it does not put the largest customer at risk, with a price review when the hotel contract is renewed; or the reverse, if the hotel contract barely covers its costs. The answer turns on the hotel chain's alternatives and on how far costs can fall before quality suffers.
summary:
  - A ratio compares two figures from the final accounts. It becomes evidence only when it is compared with earlier years, with rivals or with targets.
  - '**Gross profit margin** = (gross profit ÷ sales revenue) × 100, which reflects prices and the direct cost of what is sold.'
  - '**Profit margin** = (profit before interest and tax ÷ sales revenue) × 100. The gap below the gross margin is the share of sales taken by expenses.'
  - '**ROCE** = (profit before interest and tax ÷ capital employed) × 100, where capital employed = non-current liabilities + equity. Compare it with the interest rate and with other uses of the money.'
  - '**Current ratio** = current assets ÷ current liabilities, and **acid test ratio** = (current assets − stock) ÷ current liabilities, both written as a number to one.'
  - What counts as safe depends on the industry, and very high liquidity ratios can mean idle cash or stock piling up.
  - Profitability improves through price, the cost of sales, expenses, the product mix, volume or using less capital, and every route has a cost or a stakeholder who loses.
  - The liquidity ratios rise when current assets rise or current liabilities fall. Collecting debts sooner or paying suppliers later changes the cash position but not the ratios.
  - Ratios show what changed, not why. They rest on past figures that may be window-dressed, and leave out what the accounts cannot measure.

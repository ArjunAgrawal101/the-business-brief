retrieval:
  - q: What is the difference between contribution per unit and total contribution?
    a: Contribution per unit is the price minus the variable cost of one unit, what one more sale adds. Total contribution is contribution per unit times the number sold (or total revenue minus total variable costs), what all the sales add towards fixed costs and profit.
  - q: Fixed costs are $12,000 a month, the price is $8 and the variable cost is $5 a unit. What is the break-even quantity?
    a: 12,000 ÷ (8 − 5) = 4,000 units a month.
  - q: Why is a break-even quantity that is not a whole number rounded up?
    a: Because one unit fewer would leave a small loss, so the business must sell the next whole unit to cover all its costs.
  - q: The same business sells 5,000 units a month. What is its margin of safety?
    a: 5,000 − 4,000 = 1,000 units, or 1,000 ÷ 5,000 × 100 = 20% of sales.
  - q: How does a rise in fixed costs appear on a break-even chart, and what happens to the break-even quantity?
    a: The fixed cost and total cost lines shift up in parallel and the revenue line does not move, so they cross further to the right. The break-even quantity rises, and at unchanged sales the margin of safety and profit fall.
  - q: A price rise lowers the break-even quantity. Why might profit still fall?
    a: Customers may buy fewer units at the higher price. If sales fall far enough, the extra contribution on each unit does not make up for the units lost.
  - q: How is the target price worked out?
    a: Add the fixed costs and the target profit, divide by the expected sales, then add the variable cost per unit.
  - q: Give three limitations of break-even analysis.
    a: For example, it assumes everything made is sold, that price and variable cost per unit stay constant, and that fixed costs stay fixed; it is hard to apply to several products; and it is only as good as the sales forecast.

retrieval:
  - q: What is the difference between a stakeholder and a shareholder?
    a: A stakeholder is anyone affected by, or able to affect, a business. A shareholder owns part of a company through its shares, and is only one stakeholder group.
  - q: Name three internal and three external stakeholder groups.
    a: 'Internal: employees, managers and directors, owners and shareholders. External: for example customers, suppliers, lenders, government, the local community, pressure groups and competitors.'
  - q: Give two reasons why stakeholders' objectives conflict.
    a: Their objectives differ (profit, pay, prices, a quiet neighbourhood), and the business has limited resources to share between them, so a gain for one group is often a cost for another.
  - q: What two things does stakeholder mapping compare, and which group must be managed closely?
    a: Each group's power over the business and its interest in the decision. Groups with high power and high interest, the key players, must be managed closely.
  - q: Give one limitation of stakeholder mapping.
    a: For example, placing a group is a judgement; power and interest change over time; weak groups can join together and become powerful.
  - q: How can a business reduce conflict between stakeholders?
    a: For example by consulting and communicating early, compromising or phasing changes, and prioritizing groups by their power, interest and the business's objectives.

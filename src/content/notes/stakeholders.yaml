# Notes: 1.4 Stakeholders. Written in the platform's own words from the guide's
# two content statements (p. 24). The supplied coursebook chapter (Hodder,
# pp. 97 to 106) was read to check coverage and conventions; no passage,
# table or case from it is reproduced. Every business named is fictional.
code: '1.4'
title: Stakeholders
level: SL/HL
introduction: |
  Every decision a business takes lands on people: the staff who carry it out, the customers who pay for it, the neighbours who live next to it. These people are its **stakeholders**, and they are not passive. They can buy elsewhere, strike, lend on harder terms, campaign or pass new laws.

  This subtopic gives you two things the examination asks for again and again: a way to name the groups a decision affects, inside and outside the business, and a way to analyse why their interests pull in different directions. Almost every Paper 1 and Paper 3 answer is stronger when it says which stakeholders gain, which lose, and how much each can push back.
objectives:
  - '**Define** a stakeholder and distinguish it from a shareholder.'
  - '**Distinguish** between internal and external stakeholders, with the objectives of each group.'
  - '**Explain** why stakeholders'' objectives conflict, and where they overlap.'
  - '**Analyse** a decision for its effect on two or three stakeholder groups, using their power and interest.'
  - '**Apply** stakeholder mapping to decide how a business should treat each group.'
sections:
  - id: what-a-stakeholder-is
    title: What a stakeholder is
    kind: concept
    body: |
      A stakeholder is any individual, group or organization that is affected by a business's activities or can affect them. The relationship runs both ways: the business needs things from its stakeholders (work, money, custom, permission) and they want things from it in return.

      Each group joins the relationship for its own reasons, so each has its own **objectives**. That is the root of everything else in this subtopic: a decision is never good or bad for "the business" alone, but better for some stakeholders and worse for others.
    points:
      - term: Stakeholder
        text: Anyone affected by, or able to affect, what the business does.
      - term: Shareholder
        text: An owner of part of a company, through its shares. Shareholders are **one** stakeholder group among many; the two words are not interchangeable, and confusing them costs marks.
      - term: Stakeholder objectives
        text: What a group wants from the business, such as fair pay, low prices, reliable orders, prompt repayment or a quiet neighbourhood.
    example:
      title: One decision, many stakeholders
      fictional: true
      text: Harbour Bakery, a fictional business, decides to open at 5 a.m. instead of 7 a.m. Commuters gain fresh bread on the way to work; the owners hope for higher sales; bakers must start at 2 a.m.; neighbours hear delivery vans earlier; the flour supplier must deliver before dawn. One change, five stakeholder groups, five different reactions.
  - id: internal-and-external
    title: Internal and external stakeholders
    kind: types
    body: |
      **Internal stakeholders** are part of the organization: the people who work in it and the people who own it. **External stakeholders** are outside it but are affected by what it does, or can influence it.

      Textbooks differ on where to put shareholders. Owners are usually counted as internal stakeholders, because they belong to the organization; some writers treat outside investors in a large public company as external. Say which view you take if it matters to your answer.
    diagram: stakeholder-map
    points:
      - term: Employees (internal)
        text: Want fair pay, job security, safe conditions, training and respect. They can work harder, or leave, or take industrial action.
      - term: Managers and directors (internal)
        text: Want rewards, status and the success of the part of the business they run. They make many decisions, so their objectives shape those of everyone else.
      - term: Owners and shareholders (internal)
        text: Want profit, dividends and a rising share price, or, in a small firm, a living and independence. In a large company they can vote out the directors.
      - term: Customers (external)
        text: Want quality, value, choice and good service. Without them there is no revenue, which makes them among the most influential groups.
      - term: Suppliers (external)
        text: Want regular orders, fair prices and prompt payment. A supplier with few rivals has a great deal of power over its customer.
      - term: Lenders (external)
        text: Banks and other creditors want interest and repayment on time. They can refuse further credit or raise its price.
      - term: Government (external)
        text: Wants taxes paid, laws obeyed, jobs created and growth. It sets the rules everyone else plays by.
      - term: Local community (external)
        text: Wants jobs and local spending, but also little noise, traffic or pollution.
      - term: Pressure groups (external)
        text: Campaign on a cause, such as the environment or animal welfare, through publicity, boycotts and lobbying.
      - term: Competitors (external)
        text: Affected by the business's prices and products, and able to respond with their own.
  - id: power-and-influence
    title: How stakeholders push back
    kind: application
    body: |
      Stakeholders do not just receive decisions; they respond to them. How strongly a group can respond depends on how much the business depends on it, how organized it is, and whether it has alternatives.

      - Shareholders can sell their shares, or vote against the directors.
      - Employees can leave, refuse overtime or, through a union, strike.
      - Customers can buy from a rival or complain in public, often on social media.
      - Suppliers can raise prices, demand payment on delivery or stop supplying.
      - Lenders can refuse new loans or set higher interest rates.
      - Government can tax, regulate, fine or license.

      A group's power is not fixed. One large shareholder holding 60% of the shares can decide alone; a thousand holders of tiny stakes rarely act together. A supplier of a rare component is powerful; a supplier of something sold by many firms is not.
    example:
      title: A small supplier and a large one
      fictional: true
      text: Fernhill Furniture, a fictional maker of tables, buys screws from dozens of suppliers and walnut veneer from one. When the screw supplier raises its prices, Fernhill switches supplier in a week. When the veneer supplier does the same, Fernhill pays, because it has nowhere else to go.
  - id: conflict
    title: Conflict between stakeholders
    kind: concept
    body: |
      Stakeholders conflict because their objectives differ and the business has limited money, time and attention to share among them. A gain for one group is often a cost for another: higher wages may mean lower profit; lower prices may mean lower wages or squeezed suppliers.

      Conflict is not inevitable, though. Over the long term many objectives **overlap**: a profitable, well-run business can pay better wages, reward its owners, keep its customers and pay its taxes. The analysis that earns marks shows both: where interests clash in the short run, and whether they meet in the long run.
    points:
      - term: Owners against employees
        text: Owners may want to cut costs to raise profit; employees want pay rises and job security.
      - term: Customers against owners
        text: Customers want low prices; owners want healthy profit margins.
      - term: Business against community
        text: Expansion brings jobs, but also traffic, noise and pressure on local services.
      - term: Managers against owners
        text: Where ownership and control are separate, managers may pursue growth, status or their own rewards rather than the owners' returns.
      - term: Government against business
        text: Environmental and employment rules protect society, but raise costs and prices.
    example:
      title: A second shift
      fictional: true
      text: Fernhill Furniture plans a night shift to meet a large order. The owners welcome the extra profit and the bank is reassured. Night-shift workers are paid a premium, but some current staff object to working nights. Neighbours complain about lorries at midnight. The council, keen on local jobs, is torn. The decision is the same; the verdicts are not.
  - id: stakeholder-mapping
    title: Stakeholder mapping
    kind: framework
    body: |
      Managers cannot satisfy every group equally, so they need a way to decide whose views to put first for a particular decision. **Stakeholder mapping** plots each group by its **power** over the business and its **interest** in the decision.

      It is a widely used planning tool, though the guide does not name it, so treat it as a recommended way to structure your analysis rather than an IB requirement.
    diagram: stakeholder-mapping
    points:
      - term: Manage closely (high power, high interest)
        text: The key players. Consult them early and involve them in the decision.
      - term: Keep satisfied (high power, low interest)
        text: Make sure the decision does not provoke them, for example a major lender.
      - term: Keep informed (low power, high interest)
        text: Explain the decision and listen, for example local residents.
      - term: Monitor (low power, low interest)
        text: Little effort is needed, but watch for changes.
    advantages:
      - Shows managers where to spend their time and attention.
      - Helps to anticipate opposition before it becomes a problem.
      - Makes the trade-offs in a decision visible to everyone involved.
    limitations:
      - Placing a group is a judgement, and different managers will place it differently.
      - Power and interest change, sometimes quickly, so a map soon goes out of date.
      - 'Groups can join forces: weak groups acting together, or with the media, can become powerful.'
      - It can be used to justify ignoring groups with little power, which raises ethical questions.
  - id: managing-conflict
    title: How businesses manage the conflict
    kind: method
    body: |
      There is no single answer, but businesses tend to combine several approaches.

      1. **Communicate and consult.** Explaining a decision, and listening before it is made, often reduces opposition.
      2. **Compromise.** Phase a change in, share a gain, or offer something in return, such as retraining when jobs change.
      3. **Prioritize.** Use the power and interest of each group, and the business's own objectives, to decide whose interests come first this time.
      4. **Take a wider view.** Some organizations follow the **stakeholder concept**, treating all stakeholders as partners whose interests matter, often through corporate social responsibility. Others put shareholders first and meet other groups' needs only as far as the law and good business require.
    advantages:
      - Consulting early builds trust and can bring better ideas into the decision.
      - A reputation for treating stakeholders fairly helps with recruitment, sales and finance.
    limitations:
      - Consultation takes time and money, and can slow decisions down.
      - 'Some conflicts have no compromise: a factory either closes or it does not.'
evaluation:
  - The importance of each stakeholder depends on the decision and the business. Customers matter most to a retailer facing new rivals; lenders matter most to a firm running short of cash.
  - Short-term conflict often hides long-term common interest. A pay rise that cuts this year's profit may raise productivity and loyalty for years.
  - Power is not the same as legitimacy. A stakeholder map shows who **can** push back, not whose claim is **fair**, which is a question of ethics.
  - Ownership matters. In a sole trader the owner and manager are the same person; in a large public company the separation of ownership and control adds a conflict between managers and shareholders.
  - In an examination answer, choose the two or three stakeholders most affected, explain the effect on each with the case's evidence, and judge which effect matters most. A long list of groups with one line each earns less than a focused analysis.
connections:
  - code: '1.2'
    text: Ownership decides who the shareholders are and how much control they have.
  - code: '1.3'

# Notes: 1.4 Stakeholders. Written in the platform's own words from the guide's
# two content statements (p. 24). The supplied coursebook chapter (Hodder,
# pp. 97 to 106) was read to check coverage and conventions; no passage,
# table or case from it is reproduced. Every business named is fictional.
#
# The opening situation, industries, stakeholders, decision, exam-style
# practice and revision summary were added on 3 November 2026. The guide sets
# 1.4 at AO2 (p. 24) and allows no command term above a statement's level
# (p. 42), so the one evaluative question draws on 1.3 and 1.5 and says so.
# Every figure in them was recomputed before publication.
code: '1.4'
title: Stakeholders
level: SL/HL
introduction: |
  Every decision a business takes lands on people: the staff who carry it out, the customers who pay for it, the neighbours who live next to it. These people are its **stakeholders**, and they are not passive. They can buy elsewhere, strike, lend on harder terms, campaign or pass new laws.

  This subtopic gives you two things the examination asks for again and again: a way to name the groups a decision affects, inside and outside the business, and a way to analyse why their interests pull in different directions. Almost every Paper 1 and Paper 3 answer is stronger when it says which stakeholders gain, which lose, and how much each can push back.
objectives:
  - '**Define** a stakeholder and distinguish it from a shareholder.'
  - '**Distinguish** between internal and external stakeholders, with the objectives of each group.'
  - '**Explain** why stakeholders'' objectives conflict, and where they overlap.'
  - '**Analyse** a decision for its effect on two or three stakeholder groups, using their power and interest.'
  - '**Apply** stakeholder mapping to decide how a business should treat each group.'
situation:
  title: Twelve kilometres that change everything
  fictional: true
  text: |
    Fernhill Furniture, a fictional maker of solid wood tables, has outgrown its workshop in the centre of a small town. Customers now wait ten weeks for a table, and the owners, Ellen and Marcus Hale, have found a unit on a business park twelve kilometres away with room to double production. The move would need a bank loan of $400,000.

    The news travels fast. Several of the 38 employees walk to work and do not own a car. The cafés near the old workshop depend on the staff who buy lunch there, while the neighbours would welcome an end to the noise and the lorries. The town council wants to keep jobs in the town and offers to help find a larger site closer by. The walnut veneer supplier, Fernhill's only source, wants to know whether its contract is safe. And a local wildlife group objects to the extra car park the new unit would need on a meadow beside the park.

    *Who has a stake in this decision, what does each group want, and how should Fernhill weigh them against each other?*
sections:
  - id: what-a-stakeholder-is
    title: What a stakeholder is
    kind: concept
    body: |
      A stakeholder is any individual, group or organization that is affected by a business's activities or can affect them. The relationship runs both ways: the business needs things from its stakeholders (work, money, custom, permission) and they want things from it in return.

      Each group joins the relationship for its own reasons, so each has its own **objectives**. That is the root of everything else in this subtopic: a decision is never good or bad for "the business" alone, but better for some stakeholders and worse for others.
    points:
      - term: Stakeholder
        text: Anyone affected by, or able to affect, what the business does.
      - term: Shareholder
        text: An owner of part of a company, through its shares. Shareholders are **one** stakeholder group among many; the two words are not interchangeable, and confusing them costs marks.
      - term: Stakeholder objectives
        text: What a group wants from the business, such as fair pay, low prices, reliable orders, prompt repayment or a quiet neighbourhood.
    example:
      title: One decision, many stakeholders
      fictional: true
      text: Harbour Bakery, a fictional business, decides to open at 5 a.m. instead of 7 a.m. Commuters gain fresh bread on the way to work; the owners hope for higher sales; bakers must start at 2 a.m.; neighbours hear delivery vans earlier; the flour supplier must deliver before dawn. One change, five stakeholder groups, five different reactions.
  - id: internal-and-external
    title: Internal and external stakeholders
    kind: types
    body: |
      **Internal stakeholders** are part of the organization: the people who work in it and the people who own it. **External stakeholders** are outside it but are affected by what it does, or can influence it.

      Textbooks differ on where to put shareholders. Owners are usually counted as internal stakeholders, because they belong to the organization; some writers treat outside investors in a large public company as external. Say which view you take if it matters to your answer.
    diagram: stakeholder-map
    points:
      - term: Employees (internal)
        text: Want fair pay, job security, safe conditions, training and respect. They can work harder, or leave, or take industrial action.
      - term: Managers and directors (internal)
        text: Want rewards, status and the success of the part of the business they run. They make many decisions, so their objectives shape those of everyone else.
      - term: Owners and shareholders (internal)
        text: Want profit, dividends and a rising share price, or, in a small firm, a living and independence. In a large company they can vote out the directors.
      - term: Customers (external)
        text: Want quality, value, choice and good service. Without them there is no revenue, which makes them among the most influential groups.
      - term: Suppliers (external)
        text: Want regular orders, fair prices and prompt payment. A supplier with few rivals has a great deal of power over its customer.
      - term: Lenders (external)
        text: Banks and other creditors want interest and repayment on time. They can refuse further credit or raise its price.
      - term: Government (external)
        text: Wants taxes paid, laws obeyed, jobs created and growth. It sets the rules everyone else plays by.
      - term: Local community (external)
        text: Wants jobs and local spending, but also little noise, traffic or pollution.
      - term: Pressure groups (external)
        text: Campaign on a cause, such as the environment or animal welfare, through publicity, boycotts and lobbying.
      - term: Competitors (external)
        text: Affected by the business's prices and products, and able to respond with their own.
  - id: power-and-influence
    title: How stakeholders push back
    kind: application
    body: |
      Stakeholders do not just receive decisions; they respond to them. How strongly a group can respond depends on how much the business depends on it, how organized it is, and whether it has alternatives.

      - Shareholders can sell their shares, or vote against the directors.
      - Employees can leave, refuse overtime or, through a union, strike.
      - Customers can buy from a rival or complain in public, often on social media.
      - Suppliers can raise prices, demand payment on delivery or stop supplying.
      - Lenders can refuse new loans or set higher interest rates.
      - Government can tax, regulate, fine or license.

      A group's power is not fixed. One large shareholder holding 60% of the shares can decide alone; a thousand holders of tiny stakes rarely act together. A supplier of a rare component is powerful; a supplier of something sold by many firms is not.
    example:
      title: A small supplier and a large one
      fictional: true
      text: Fernhill Furniture, a fictional maker of tables, buys screws from dozens of suppliers and walnut veneer from one. When the screw supplier raises its prices, Fernhill switches supplier in a week. When the veneer supplier does the same, Fernhill pays, because it has nowhere else to go.
  - id: conflict
    title: Conflict between stakeholders
    kind: concept
    body: |
      Stakeholders conflict because their objectives differ and the business has limited money, time and attention to share among them. A gain for one group is often a cost for another: higher wages may mean lower profit; lower prices may mean lower wages or squeezed suppliers.

      Conflict is not inevitable, though. Over the long term many objectives **overlap**: a profitable, well-run business can pay better wages, reward its owners, keep its customers and pay its taxes. The analysis that earns marks shows both: where interests clash in the short run, and whether they meet in the long run.
    points:
      - term: Owners against employees
        text: Owners may want to cut costs to raise profit; employees want pay rises and job security.
      - term: Customers against owners
        text: Customers want low prices; owners want healthy profit margins.
      - term: Business against community
        text: Expansion brings jobs, but also traffic, noise and pressure on local services.
      - term: Managers against owners
        text: Where ownership and control are separate, managers may pursue growth, status or their own rewards rather than the owners' returns.
      - term: Government against business
        text: Environmental and employment rules protect society, but raise costs and prices.
    example:
      title: A second shift
      fictional: true
      text: Fernhill Furniture plans a night shift to meet a large order. The owners welcome the extra profit and the bank is reassured. Night-shift workers are paid a premium, but some current staff object to working nights. Neighbours complain about lorries at midnight. The council, keen on local jobs, is torn. The decision is the same; the verdicts are not.
  - id: stakeholder-mapping
    title: Stakeholder mapping
    kind: framework
    body: |
      Managers cannot satisfy every group equally, so they need a way to decide whose views to put first for a particular decision. **Stakeholder mapping** plots each group by its **power** over the business and its **interest** in the decision.

      It is a widely used planning tool, though the guide does not name it, so treat it as a recommended way to structure your analysis rather than an IB requirement.
    diagram: stakeholder-mapping
    points:
      - term: Manage closely (high power, high interest)
        text: The key players. Consult them early and involve them in the decision.
      - term: Keep satisfied (high power, low interest)
        text: Make sure the decision does not provoke them, for example a major lender.
      - term: Keep informed (low power, high interest)
        text: Explain the decision and listen, for example local residents.
      - term: Monitor (low power, low interest)
        text: Little effort is needed, but watch for changes.
    advantages:
      - Shows managers where to spend their time and attention.
      - Helps to anticipate opposition before it becomes a problem.
      - Makes the trade-offs in a decision visible to everyone involved.
    limitations:
      - Placing a group is a judgement, and different managers will place it differently.
      - Power and interest change, sometimes quickly, so a map soon goes out of date.
      - 'Groups can join forces: weak groups acting together, or with the media, can become powerful.'
      - It can be used to justify ignoring groups with little power, which raises ethical questions.
  - id: managing-conflict
    title: How businesses manage the conflict
    kind: method
    body: |
      There is no single answer, but businesses tend to combine several approaches.

      1. **Communicate and consult.** Explaining a decision, and listening before it is made, often reduces opposition.
      2. **Compromise.** Phase a change in, share a gain, or offer something in return, such as retraining when jobs change.
      3. **Prioritize.** Use the power and interest of each group, and the business's own objectives, to decide whose interests come first this time.
      4. **Take a wider view.** Some organizations follow the **stakeholder concept**, treating all stakeholders as partners whose interests matter, often through corporate social responsibility. Others put shareholders first and meet other groups' needs only as far as the law and good business require.
    advantages:
      - Consulting early builds trust and can bring better ideas into the decision.
      - A reputation for treating stakeholders fairly helps with recruitment, sales and finance.
    limitations:
      - Consultation takes time and money, and can slow decisions down.
      - 'Some conflicts have no compromise: a factory either closes or it does not.'
applications:
  - industry: Mining and energy
    text: Local communities, landowners and environmental groups have an unusually strong interest, because a mine or a wind farm changes the land around it for decades, and governments hold the licences without which nothing can happen. Businesses in these industries often talk of needing a social licence to operate, the acceptance of the people nearby, which can be lost long before any law is broken.
  - industry: Healthcare
    text: Patients, staff, the government that funds care and the taxpayers behind it all have a high interest, and their objectives collide over waiting times, budgets and pay. Clinical staff hold unusual power through their scarce skills and their professional bodies, so changes imposed without them rarely succeed.
  - industry: Clothing retail
    text: Customers want low prices and constant new ranges, which pushes retailers to squeeze their suppliers, while the workers who make the clothes, often far away, have a high interest but little power of their own. Pressure groups and the media can act on those workers' behalf, which is how a group with little power can suddenly matter to a retailer's reputation.
  - industry: Technology platforms
    text: Users, advertisers, the people who create content and regulators all have a stake, and a platform's revenue may come from one group while its value comes from another. Disputes over data, privacy and what may be posted show how users, each with almost no power alone, gain it through their numbers, publicity and regulators.
  - industry: Banking
    text: Savers want their money safe, borrowers want credit on good terms, shareholders want returns and regulators want a stable financial system, so the bank's appetite for risk is the central conflict. Because a bank's failure harms people far beyond its owners, governments act as an especially powerful stakeholder.
  - industry: Social enterprises
    text: The people a social enterprise serves are often not the people who pay, so beneficiaries, paying customers, funders, staff and volunteers all have to be weighed, and the beneficiaries may have the most interest and the least power. That is why the HL Paper 3, set on a social enterprise, asks students to make decisions for its stakeholders.
stakeholders:
  - group: Employees
    text: Their interest in most decisions is high, but their power depends on how scarce their skills are and whether they act together, so a stakeholder map often leaves them to be kept informed rather than managed closely. Consultation gives them a voice before decisions are made, and their conflicts with owners over pay and jobs are among the commonest in business.
  - group: Owners and shareholders
    text: They hold formal power over the business and expect their objectives to come first, a view the stakeholder concept qualifies by treating other groups as partners too. In large companies they also conflict with the managers who run the business on their behalf.
  - group: Managers
    text: They decide how to weigh every other group and are judged on the result, so they feel the conflicts most directly. Their own job security, status and bonuses are a stake as well, and stakeholder mapping is a tool they apply, which is why its judgements are open to bias.
  - group: Customers
    text: Their power rises with the number of alternatives they have and the ease of complaining in public, and falls when one supplier dominates. Their wish for low prices conflicts with owners' margins and employees' pay, though a business that serves them well usually serves its owners well too.
  - group: Suppliers
    text: Their power depends on how replaceable they are, as Fernhill Furniture's suppliers of screws and of walnut veneer show. They conflict with the business over prices and payment terms, but a long relationship can turn a supplier into a partner whose interests overlap with the firm's.
  - group: Local communities and pressure groups
    text: They often have the least formal power and the most to lose from noise, traffic or pollution, which is why a stakeholder map can tempt managers to overlook them. Their power grows quickly when they organize, win the attention of the media or persuade the government to act.
evaluation:
  - The importance of each stakeholder depends on the decision and the business. Customers matter most to a retailer facing new rivals; lenders matter most to a firm running short of cash.
  - Short-term conflict often hides long-term common interest. A pay rise that cuts this year's profit may raise productivity and loyalty for years.
  - Power is not the same as legitimacy. A stakeholder map shows who **can** push back, not whose claim is **fair**, which is a question of ethics.
  - Ownership matters. In a sole trader the owner and manager are the same person; in a large public company the separation of ownership and control adds a conflict between managers and shareholders.
  - In an examination answer, choose the two or three stakeholders most affected, explain the effect on each with the case's evidence, and judge which effect matters most. A long list of groups with one line each earns less than a focused analysis.
decision:
  title: Keep the village bus running?
  fictional: true
  brief: |
    Moorlink Buses, a fictional privately owned bus company, runs a rural route that links six villages to the nearest market town. It is the only public transport the villages have, and about 120 regular passengers use it, many of them older people, students and workers without cars. The route costs $150,000 a year to run and takes $90,000 in fares, a loss of $60,000 a year, which the company's shareholders want stopped. Two drivers work on the route.

    Each option settles the conflict between the stakeholders differently.
  options:
    - label: Close the route
      text: The $60,000 loss ends at once. The two drivers would be offered work on other routes when vacancies arise, and the villages would be left without buses.
    - label: Raise fares by 25%
      text: If passenger numbers fall by 10%, fare revenue rises to $101,250 and the loss falls to $48,750. The passengers who can least afford it pay more, and some stop travelling.
    - label: A council subsidy and a smaller bus
      text: The council would pay $40,000 a year to keep the route, and a smaller bus would cut costs by $20,000, so the route would break even. The council's money comes from local taxpayers and from other services.
  guidance: |
    Map the stakeholders by power and interest before weighing the options, then judge which conflicts matter most.

    - **Who is affected:** shareholders, with high power and an interest in profit, want the loss stopped; the 120 passengers have the highest interest but little power alone; the two drivers face a move or redundancy; the council has high power through its money and its say over local transport, and wants the villages connected; village shops and the town's market lose customers if the buses stop.
    - **Close:** it serves the shareholders at once, but it cuts the villages off, invites a public campaign, and may be remembered by the council when Moorlink bids for other contracts. It is the option with the fewest winners.
    - **Raise fares:** it cuts the loss by only $11,250, to $48,750, and it falls hardest on the poorest passengers. The 10% fall in passengers is a guess: a 20% fall would leave fare revenue at $90,000 and the loss exactly where it is now.
    - **Subsidy and a smaller bus:** $150,000 − $20,000 = $130,000 of costs is matched by $90,000 + $40,000 = $130,000 of income, so the route breaks even and keeps running, which satisfies the passengers and the council. But it depends on public money that has other uses, on the smaller bus carrying everyone at busy times, and on the council's budget next year.

    A strong judgement might favour the subsidy, because it is the only option that meets the objectives of the two most powerful groups, the shareholders and the council, while protecting the group with the most at stake, the passengers. It is also the most fragile, so Moorlink should agree in advance what happens if the subsidy ends. The answer would change if the council refused, if passengers would accept higher fares, or with Moorlink's own objectives: a company that values its reputation in the region may accept a small loss that one focused only on profit would not.
exam:
  - q: Define the term *stakeholder*.
    marks: 2
    command: define
    level: SL/HL
    paper: '1'
    answer: |
      A strong response gives a precise definition: any individual, group or organization that is affected by a business's activities or can affect them.

      - Both directions are needed: being affected by the business and being able to influence it.
      - Defining a shareholder instead, or treating the two words as the same, is a common error.
  - q: Using examples from Fernhill Furniture, distinguish between internal and external stakeholders.
    marks: 4
    command: distinguish
    level: SL/HL
    paper: '1'
    answer: |
      A strong response states the difference clearly and gives a correct example of each from the case.

      - **Internal stakeholders** belong to the organization: Fernhill's 38 employees and its owners, Ellen and Marcus Hale.
      - **External stakeholders** are outside it but affected by it or able to influence it: for example its customers, the bank that would lend $400,000, the walnut veneer supplier, the town council, the neighbours or the wildlife group.
      - A strong answer shows why the difference matters, for example that internal stakeholders work inside the decisions while external ones respond from outside, by buying, lending or campaigning.
  - q: Explain **two** conflicts between Fernhill Furniture's stakeholders that the move to the business park could cause.
    marks: 4
    command: explain
    level: SL/HL
    paper: '1'
    answer: |
      A strong response explains two distinct conflicts, naming the groups on each side and why their objectives clash.

      - **Owners against employees:** the owners want room to double production and cut the ten-week wait, but employees who walk to work and have no car may find the new site hard or impossible to reach, so the owners' growth could cost some staff their jobs.
      - **Owners against the community:** the move takes jobs and lunchtime trade away from the town, which the council and the cafés want to keep, while the wildlife group opposes the car park on the meadow.
      - Other valid conflicts include neighbours, who welcome the end of the noise, against the cafés, who lose trade. Conflicts explained without the case's evidence earn little.
  - q: Moorlink Buses is considering closing its loss-making rural route. Analyse the likely response of **two** stakeholder groups to the closure.
    marks: 6
    command: analyse
    level: SL/HL
    paper: '1'
    answer: |
      A strong response chooses two groups, explains how each would respond and why, and analyses how much their response could affect Moorlink.

      - **Passengers:** the 120 regular passengers, many older people, students and workers without cars, would lose their only public transport, so their interest is very high. Alone they have little power, but by organizing a petition, contacting the local media and lobbying the council, they could damage Moorlink's reputation and draw in more powerful groups.
      - **The council:** it wants the villages connected and controls money and local transport contracts, so it has high power. It might respond by offering a subsidy to keep the route, or remember the closure when Moorlink next bids for a contract.
      - Other groups could be analysed instead, such as the shareholders, who would welcome the end of a $60,000 loss, or the two drivers. A strong answer notes how the groups interact: the passengers' campaign matters most if it moves the council.
  - q: Recommend whether Fernhill Furniture should move to the business park.
    marks: 10
    command: recommend
    level: SL/HL
    paper: '1'
    answer: |
      This question draws on the reasons for growth (1.5) and on CSR (1.3) as well as on stakeholders, because 1.4 on its own is set at AO2. A strong response weighs the move for the main stakeholder groups, using the case, and reaches a justified recommendation.

      - **For:** room to double production would cut the ten-week wait, which may be costing Fernhill orders; growth can bring economies of scale and higher profit for the owners; and the neighbours would gain from less noise and traffic.
      - **Against:** some of the 38 staff, those who walk to work and have no car, might leave, taking their skills with them; the $400,000 loan adds risk if demand falls; the town loses jobs and trade, which strains the relationship with the council; and the car park on the meadow invites opposition from the wildlife group.
      - **Ways to reduce the conflict:** a staff minibus or help with transport, consultation before the decision, or taking up the council's offer to find a larger site in the town, if one exists at a similar cost.
      - **Judgement:** for example, Fernhill should move only if the council cannot find a suitable site closer by, and should fund transport for staff so that it keeps its skilled workforce; growth that loses the people who make the tables would defeat its purpose. A strong answer says what is missing, such as the cost of a site in the town and how many staff could not travel.

      When weighing one option, the teacher support material advises at least two arguments for and two against (pp. 56 and 60).
summary:
  - A **stakeholder** is anyone affected by a business or able to affect it; a **shareholder** owns part of a company and is only one stakeholder group.
  - '**Internal stakeholders**, the employees, managers and owners, belong to the organization; **external stakeholders**, such as customers, suppliers, lenders, government, the local community, pressure groups and competitors, are outside it but affected by it or able to influence it.'
  - Each group has its own objectives, so a decision is better for some stakeholders and worse for others, never simply good or bad for the business.
  - Stakeholders respond by leaving, buying elsewhere, striking, lending on harder terms, campaigning or regulating; their power depends on how much the business needs them, how organized they are and what alternatives they have.
  - '**Conflict** arises because objectives differ and resources are limited, but over the long term many objectives overlap, and strong answers show both.'
  - '**Stakeholder mapping** plots power against interest to decide whom to manage closely, keep satisfied, keep informed or monitor. The guide does not name it, and power is not the same as a fair claim.'
  - Businesses manage conflict by consulting, compromising and prioritizing; the **stakeholder concept** treats every group as a partner, while other businesses put shareholders first within the law.
  - The guide sets 1.4 at AO2, so analyse the two or three groups most affected with the case's evidence rather than listing every group; evaluation questions combine stakeholders with objectives and CSR (1.3) or growth (1.5).
connections:
  - code: '1.2'
    text: Ownership decides who the shareholders are and how much control they have.
  - code: '1.3'
    text: Objectives, ethics and corporate social responsibility decide how far a business weighs stakeholders beyond its owners.
  - code: '1.5'
    text: Growth, mergers and takeovers change the balance of power between stakeholders.
  - code: '2.7'
    text: At HL, industrial relations are the conflict between employees and employers in detail.

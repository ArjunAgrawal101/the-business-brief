# Sources for the executive simulation (/boardroom/executive/). Each is a
# published work cited as a bibliographic reference in the debrief's ideas
# beyond the IB course; none was opened in full for this release. The
# bibliographic details were checked against publishers' and indexing records
# found by web search on 16 November 2026. The company, its people and its
# figures are fictional and simulated; nothing in the simulation is drawn
# from these works except the ideas named in each note.

- id: sterman-1989
  title: 'Modeling Managerial Behavior: Misperceptions of Feedback in a Dynamic Decision Making Experiment'
  author: John D. Sterman
  publisher: Management Science, vol. 35, no. 3, pp. 321 to 339
  year: '1989'
  kind: academic
  availability: referenced
  note: >
    The experiment in which people managed a simulated distribution system with time delays, performed poorly, and
    were found to be insensitive to the feedback from their own decisions. Cited in the executive simulation's debrief,
    on decisions whose results arrive late. Cited as a bibliographic reference; the article was not opened for this
    release.
- id: tversky-kahneman-1974
  title: 'Judgment under Uncertainty: Heuristics and Biases'
  author: Amos Tversky and Daniel Kahneman
  publisher: Science, vol. 185, no. 4157, pp. 1124 to 1131
  year: '1974'
  kind: academic
  availability: referenced
  note: >
    The account of three heuristics people use in judging under uncertainty (representativeness, availability, and
    adjustment from an anchor) and the systematic errors they lead to. Cited in the executive simulation's debrief, on
    anchoring a budget on last year's figures. Cited as a bibliographic reference; the article was not opened for this
    release.
- id: staw-1976
  title: 'Knee-deep in the Big Muddy: A Study of Escalating Commitment to a Chosen Course of Action'
  author: Barry M. Staw
  publisher: Organizational Behavior and Human Performance, vol. 16, no. 1, pp. 27 to 44
  year: '1976'
  kind: academic
  availability: referenced
  note: >
    The study that found decision makers committing more resources to a course of action after it had gone badly. Cited
    in the executive simulation's debrief, on escalating commitment. Cited as a bibliographic reference; the article was
    not opened for this release.
- id: kaplan-norton-1992
  title: 'The Balanced Scorecard: Measures That Drive Performance'
  author: Robert S. Kaplan and David P. Norton
  publisher: Harvard Business Review, January to February 1992, pp. 71 to 79
  year: '1992'
  kind: academic
  availability: referenced
  note: >
    The article that proposed a balanced scorecard of financial, customer, internal business, and innovation and
    learning measures. Cited in the executive simulation, whose seven roles each watch a different part of such a set of
    measures. Cited as a bibliographic reference; the article was not opened for this release.
- id: simon-1955
  title: A Behavioral Model of Rational Choice
  author: Herbert A. Simon
  publisher: The Quarterly Journal of Economics, vol. 69, no. 1, pp. 99 to 118
  year: '1955'
  kind: academic
  availability: referenced
  note: >
    A model of rational choice by decision makers of limited computational ability, who seek an alternative that meets
    their aspirations rather than compute every possibility. Cited in the executive simulation's debrief. Cited as a
    bibliographic reference; the article was not opened for this release.

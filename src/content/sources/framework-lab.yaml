# The Framework Application Lab: the published works the frameworks library
# and the Lab's tools come from. Each is a bibliographic reference to a work
# whose author, year, title and publisher are well established; none was
# opened for this release, and the platform's explanations are its own.
# Frameworks name these by id in `references`; the Strategy Studio's
# scenario, salience and fit tools cite them in their notes.

- id: porter-1979
  title: How Competitive Forces Shape Strategy
  author: Michael E. Porter
  publisher: Harvard Business Review
  year: '1979'
  kind: academic
  availability: referenced
  note: The article that set out the five competitive forces. The basis of the five forces framework and the Strategy Studio's Five Forces assessor. Cited as a bibliographic reference; the article was not opened for this release.
- id: porter-1980
  title: 'Competitive Strategy: Techniques for Analyzing Industries and Competitors'
  author: Michael E. Porter
  publisher: Free Press
  year: '1980'
  kind: academic
  availability: referenced
  note: The book that developed industry analysis by the five forces and set out the generic strategies of cost leadership, differentiation and focus. Cited as a bibliographic reference; the book was not opened for this release.
- id: porter-1985
  title: 'Competitive Advantage: Creating and Sustaining Superior Performance'
  author: Michael E. Porter
  publisher: Free Press
  year: '1985'
  kind: academic
  availability: referenced
  note: The book that introduced the value chain of primary and support activities. Cited as a bibliographic reference; the book was not opened for this release.
- id: porter-1996
  title: What Is Strategy?
  author: Michael E. Porter
  publisher: Harvard Business Review
  year: '1996'
  kind: academic
  availability: referenced
  note: The article that argues a strategy rests on a distinct set of activities that fit and reinforce one another. Cited for the idea of internal fit behind the Strategy Studio's strategic fit check. Cited as a bibliographic reference; the article was not opened for this release.
- id: andrews-1971
  title: The Concept of Corporate Strategy
  author: Kenneth R. Andrews
  publisher: Dow Jones-Irwin
  year: '1971'
  kind: academic
  availability: referenced
  note: The classic statement of strategy as the match between a company's capabilities and the opportunities and risks of its environment. Cited for the idea of external fit behind the strategic fit check. Cited as a bibliographic reference; the book was not opened for this release.
- id: henderson-1970
  title: The Product Portfolio
  author: Bruce D. Henderson
  publisher: The Boston Consulting Group (Perspectives series)
  year: '1970'
  kind: academic
  availability: referenced
  note: The short essay in which the founder of the Boston Consulting Group set out the growth-share portfolio, the origin of the BCG matrix. Cited as a bibliographic reference; the essay was not opened for this release.
- id: mitchell-agle-wood-1997
  title: 'Toward a Theory of Stakeholder Identification and Salience: Defining the Principle of Who and What Really Counts'
  author: Ronald K. Mitchell, Bradley R. Agle and Donna J. Wood
  publisher: Academy of Management Review, vol. 22, no. 4
  year: '1997'
  kind: academic
  availability: referenced
  note: The article that classifies stakeholders by three attributes, power, legitimacy and urgency, into seven classes, and argues that salience to managers rises with the number of attributes a stakeholder holds. The basis of the Strategy Studio's stakeholder salience tool, explained in the platform's own words. Cited as a bibliographic reference; the article was not opened for this release.
- id: freeman-1984
  title: 'Strategic Management: A Stakeholder Approach'
  author: R. Edward Freeman
  publisher: Pitman
  year: '1984'
  kind: academic
  availability: referenced
  note: The book usually credited with establishing the stakeholder view of the firm, on which stakeholder mapping and stakeholder salience both build. Cited as a bibliographic reference; the book was not opened for this release.
- id: schwartz-1991
  title: 'The Art of the Long View: Planning for the Future in an Uncertain World'
  author: Peter Schwartz
  publisher: Doubleday Currency
  year: '1991'
  kind: academic
  availability: referenced
  note: A practitioner's account of scenario planning, from the focal question and the driving forces to the critical uncertainties, the scenario plots and the indicators that show which future is unfolding. One basis of the Strategy Studio's scenario analysis. Cited as a bibliographic reference; the book was not opened for this release.
- id: van-der-heijden-1996
  title: 'Scenarios: The Art of Strategic Conversation'
  author: Kees van der Heijden
  publisher: John Wiley & Sons
  year: '1996'
  kind: academic
  availability: referenced
  note: The book that treats scenarios as a way for an organization to think together about uncertainty and to test its strategy against several futures. One basis of the Strategy Studio's scenario analysis. Cited as a bibliographic reference; the book was not opened for this release.
- id: wack-1985
  title: 'Scenarios: Uncharted Waters Ahead'
  author: Pierre Wack
  publisher: Harvard Business Review
  year: '1985'
  kind: academic
  availability: referenced
  note: The article on scenario planning at Royal Dutch Shell, which separates predetermined elements from the uncertainties that make futures differ. Cited as a bibliographic reference; the article was not opened for this release.
- id: waterman-peters-phillips-1980
  title: Structure Is Not Organization
  author: Robert H. Waterman Jr, Thomas J. Peters and Julien R. Phillips
  publisher: Business Horizons, vol. 23, no. 3
  year: '1980'
  kind: academic
  availability: referenced
  note: The article that set out the seven interdependent elements of an organization, the origin of the McKinsey 7S framework and of the consistency check in the Strategy Studio's strategic fit tool. Cited as a bibliographic reference; the article was not opened for this release.
- id: peters-waterman-1982
  title: "In Search of Excellence: Lessons from America's Best-Run Companies"
  author: Thomas J. Peters and Robert H. Waterman Jr
  publisher: Harper & Row
  year: '1982'
  kind: academic
  availability: referenced
  note: The book that made the 7S framework widely known. Cited as a bibliographic reference; the book was not opened for this release.
- id: kaplan-norton-1992
  title: 'The Balanced Scorecard: Measures That Drive Performance'
  author: Robert S. Kaplan and David P. Norton
  publisher: Harvard Business Review
  year: '1992'
  kind: academic
  availability: referenced
  note: The article that introduced the balanced scorecard of financial, customer, internal process and learning and growth measures. Cited as a bibliographic reference; the article was not opened for this release.
- id: osterwalder-pigneur-2010
  title: 'Business Model Generation: A Handbook for Visionaries, Game Changers, and Challengers'
  author: Alexander Osterwalder and Yves Pigneur
  publisher: John Wiley & Sons
  year: '2010'
  kind: academic
  availability: referenced
  note: The book that presents the Business Model Canvas of nine building blocks. Cited as a bibliographic reference; the book was not opened for this release.
- id: maslow-1943
  title: A Theory of Human Motivation
  author: Abraham H. Maslow
  publisher: Psychological Review, vol. 50, no. 4
  year: '1943'
  kind: academic
  availability: referenced
  note: The article that set out the hierarchy of needs. Cited as a bibliographic reference; the article was not opened for this release.
- id: herzberg-1959
  title: The Motivation to Work
  author: Frederick Herzberg, Bernard Mausner and Barbara Bloch Snyderman
  publisher: John Wiley & Sons
  year: '1959'
  kind: academic
  availability: referenced
  note: The study, built on interviews about good and bad times at work, that separated motivators from hygiene factors. Cited as a bibliographic reference; the book was not opened for this release.
- id: taylor-1911
  title: The Principles of Scientific Management
  author: Frederick Winslow Taylor
  publisher: Harper & Brothers
  year: '1911'
  kind: academic
  availability: referenced
  note: 'The book that set out scientific management: work studied and timed, one best way, selected and trained workers, and pay linked to output. Cited as a bibliographic reference; the book was not opened for this release.'
- id: mcclelland-1961
  title: The Achieving Society
  author: David C. McClelland
  publisher: D. Van Nostrand
  year: '1961'
  kind: academic
  availability: referenced
  note: The book in which McClelland developed his account of the need for achievement, alongside the needs for affiliation and power. Cited as a bibliographic reference; the book was not opened for this release.
- id: deci-ryan-1985
  title: Intrinsic Motivation and Self-Determination in Human Behavior
  author: Edward L. Deci and Richard M. Ryan
  publisher: Plenum Press
  year: '1985'
  kind: academic
  availability: referenced
  note: The book that set out self-determination theory and its basic needs for autonomy, competence and relatedness. Cited as a bibliographic reference; the book was not opened for this release.
- id: adams-1963
  title: Toward an Understanding of Inequity
  author: J. Stacy Adams
  publisher: Journal of Abnormal and Social Psychology, vol. 67, no. 5
  year: '1963'
  kind: academic
  availability: referenced
  note: The article that set out equity theory, in which people compare the ratio of their outcomes to their inputs with that of others. Cited as a bibliographic reference; the article was not opened for this release.
- id: vroom-1964
  title: Work and Motivation
  author: Victor H. Vroom
  publisher: John Wiley & Sons
  year: '1964'
  kind: academic
  availability: referenced
  note: The book that set out expectancy theory, in which motivation depends on expectancy, instrumentality and valence. Cited as a bibliographic reference; the book was not opened for this release.
- id: hofstede-1980
  title: "Culture's Consequences: International Differences in Work-Related Values"
  author: Geert Hofstede
  publisher: Sage Publications
  year: '1980'
  kind: academic
  availability: referenced
  note: The study of employees of one multinational in many countries from which the cultural dimensions come. Cited as a bibliographic reference; the book was not opened for this release.
- id: hofstede-2010
  title: 'Cultures and Organizations: Software of the Mind (third edition)'
  author: Geert Hofstede, Gert Jan Hofstede and Michael Minkov
  publisher: McGraw-Hill
  year: '2010'
  kind: academic
  availability: referenced
  note: The edition that presents the six dimensions, adding indulgence against restraint to the earlier five. Cited as a bibliographic reference; the book was not opened for this release.
- id: kotter-1995
  title: 'Leading Change: Why Transformation Efforts Fail'
  author: John P. Kotter
  publisher: Harvard Business Review
  year: '1995'
  kind: academic
  availability: referenced
  note: The article that set out the errors behind failed transformations, from which the eight steps come; developed in his book Leading Change (Harvard Business School Press, 1996). Cited as a bibliographic reference; the article was not opened for this release.
- id: lewin-1947
  title: 'Frontiers in Group Dynamics: Concept, Method and Reality in Social Science; Social Equilibria and Social Change'
  author: Kurt Lewin
  publisher: Human Relations, vol. 1, no. 1
  year: '1947'
  kind: academic
  availability: referenced
  note: The article usually cited for the unfreezing, moving and refreezing of group standards, the origin of the three-stage change model. Cited as a bibliographic reference; the article was not opened for this release.
- id: lewin-lippitt-white-1939
  title: "Patterns of Aggressive Behavior in Experimentally Created 'Social Climates'"
  author: Kurt Lewin, Ronald Lippitt and Ralph K. White
  publisher: Journal of Social Psychology, vol. 10, no. 2
  year: '1939'
  kind: academic
  availability: referenced
  note: The experiments with groups led in autocratic, democratic and laissez-faire ways, the usual origin of those style names. Cited as a bibliographic reference; the article was not opened for this release.
- id: doran-1981
  title: "There's a S.M.A.R.T. Way to Write Management's Goals and Objectives"
  author: George T. Doran
  publisher: Management Review, vol. 70, no. 11
  year: '1981'
  kind: academic
  availability: referenced
  note: The short article usually credited with the SMART acronym for objectives. Doran's own letters stood for specific, measurable, assignable, realistic and time-related; later versions vary. Cited as a bibliographic reference; the article was not opened for this release.
- id: levitt-1965
  title: Exploit the Product Life Cycle
  author: Theodore Levitt
  publisher: Harvard Business Review
  year: '1965'
  kind: academic
  availability: referenced
  note: The article that urged managers to use the product life cycle to plan ahead, including ways to extend a product's life. Cited as a bibliographic reference; the article was not opened for this release.
- id: magee-1964
  title: Decision Trees for Decision Making
  author: John F. Magee
  publisher: Harvard Business Review
  year: '1964'
  kind: academic
  availability: referenced
  note: The article that brought decision trees with expected values to business readers. Cited as a bibliographic reference; the article was not opened for this release.
- id: aguilar-1967
  title: Scanning the Business Environment
  author: Francis J. Aguilar
  publisher: Macmillan
  year: '1967'
  kind: academic
  availability: referenced
  note: The study of how managers scan their environment, usually cited as the origin of the headings from which PEST, PESTLE and STEEPLE grew. Cited as a bibliographic reference; the book was not opened for this release.
- id: kelley-walker-1959
  title: Critical-Path Planning and Scheduling
  author: James E. Kelley Jr and Morgan R. Walker
  publisher: Proceedings of the Eastern Joint Computer Conference
  year: '1959'
  kind: academic
  availability: referenced
  note: The paper that described the critical path method developed for project scheduling. Cited as a bibliographic reference; the paper was not opened for this release.

# Sources for the Advanced Management and Strategy modules in operations and
# entrepreneurship (src/content/advanced/). Two kinds of entry:
#   - documents of real organizations and regulators, opened and read in full
#     on 16 November 2026 (availability web-search, with url and accessed);
#     each module states only what these documents say, dated, and labels its
#     own interpretation separately;
#   - published academic works and books, cited from knowledge as
#     bibliographic references (availability referenced) and not opened here.
# Ids start with adv-oe- so that they cannot collide with other areas.


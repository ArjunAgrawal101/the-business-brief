# Sources for the Boardroom Briefings (src/content/boardroom-briefings/).
# Every company in the series is fictional, so no source here describes a
# real organization. The research is cited for its central idea only: each
# work is a bibliographic reference that was not opened for this release, so
# the briefings state the idea in the platform's own words, with no figures,
# findings or quotations from it. Ids start with bbr- so they cannot collide
# with sources added by other parts of the platform.

- id: bbr-method
  title: How the Boardroom Briefings and their figures were made
  author: Arjun Agrawal | The Business Brief
  year: '2026'
  kind: method
  availability: repository
  note: 'Each briefing is about a fictional company. Its figures come from a small model stated in the briefing itself: the exhibits hold the inputs and the results, each exhibit''s checks rework its results from its inputs, and the briefing declares every other figure its text quotes, with the formula that produces it. The integrity check in `src/lib/boardroom-briefings/integrity.ts` recomputes all of them on every build and fails on any figure in the text that the model does not account for; `tests/unit/boardroom-briefings.test.ts` reworks the key results with the platform''s finance functions.'
- id: bbr-johanson-vahlne-1977
  title: 'The Internationalization Process of the Firm: A Model of Knowledge Development and Increasing Foreign Market Commitments'
  author: Jan Johanson and Jan-Erik Vahlne
  publisher: Journal of International Business Studies
  year: '1977'
  kind: academic
  availability: referenced
  note: The usual source for the stages (Uppsala) model of internationalization, in which a firm commits more resources to a foreign market as it learns about it. Cited as a bibliographic reference in the market entry briefing; the article was not opened for this release.
- id: bbr-ghemawat-2001
  title: 'Distance Still Matters: The Hard Reality of Global Expansion'
  author: Pankaj Ghemawat
  publisher: Harvard Business Review
  year: '2001'
  kind: academic
  availability: referenced
  note: The article that set out the CAGE framework, in which the distance between two countries has cultural, administrative, geographic and economic dimensions. Cited as a bibliographic reference in the market entry briefing; the article was not opened for this release.
- id: bbr-roll-1986
  title: The Hubris Hypothesis of Corporate Takeovers
  author: Richard Roll
  publisher: The Journal of Business
  year: '1986'
  kind: academic
  availability: referenced
  note: The argument that bidders can overpay for targets because their managers are overconfident in their own valuations. Cited as a bibliographic reference in the acquisition briefing; the article was not opened for this release.
- id: bbr-jensen-1986
  title: Agency Costs of Free Cash Flow, Corporate Finance, and Takeovers
  author: Michael C. Jensen
  publisher: American Economic Review
  year: '1986'
  kind: academic
  availability: referenced
  note: The argument that managers of firms with cash beyond their profitable investments may spend it on growth that does not create value for shareholders, and that paying cash out or borrowing can discipline them. Cited as a bibliographic reference in the acquisition and shareholder returns briefings; the article was not opened for this release.
- id: bbr-porter-1980
  title: 'Competitive Strategy: Techniques for Analyzing Industries and Competitors'
  author: Michael E. Porter
  publisher: Free Press
  year: '1980'
  kind: academic
  availability: referenced
  note: The book that set out the five competitive forces and the generic strategies of cost leadership, differentiation and focus, and the risk of being stuck in the middle. Cited as a bibliographic reference in the profit recovery and disruption briefings; the book was not opened for this release.
- id: bbr-porter-1985
  title: 'Competitive Advantage: Creating and Sustaining Superior Performance'
  author: Michael E. Porter
  publisher: Free Press
  year: '1985'
  kind: academic
  availability: referenced
  note: The book that introduced the value chain, the activities through which a firm creates value and incurs cost. Cited as a bibliographic reference in the vertical integration briefing; the book was not opened for this release.
- id: bbr-autor-2015
  title: 'Why Are There Still So Many Jobs? The History and Future of Workplace Automation'
  author: David H. Autor
  publisher: Journal of Economic Perspectives
  year: '2015'
  kind: academic
  availability: referenced
  note: The argument that automation takes over particular tasks rather than whole jobs, and that it can complement the tasks people keep as well as replace the ones machines take. Cited as a bibliographic reference in the automation briefing; the article was not opened for this release.
- id: bbr-coombs-2007
  title: 'Protecting Organization Reputations During a Crisis: The Development and Application of Situational Crisis Communication Theory'
  author: W. Timothy Coombs
  publisher: Corporate Reputation Review
  year: '2007'
  kind: academic
  availability: referenced
  note: The source of situational crisis communication theory, in which an organization's response should match how much responsibility the public attributes to it for the crisis. Cited as a bibliographic reference in the crisis and reputation briefings; the article was not opened for this release.
- id: bbr-penrose-1959
  title: The Theory of the Growth of the Firm
  author: Edith Penrose
  publisher: Basil Blackwell
  year: '1959'
  kind: academic
  availability: referenced
  note: The book that argued a firm's rate of growth is limited by its managers' capacity to plan and absorb expansion. Cited as a bibliographic reference in the growth and profitability briefing; the book was not opened for this release.
- id: bbr-christensen-1997
  title: 'The Innovator''s Dilemma: When New Technologies Cause Great Firms to Fail'
  author: Clayton M. Christensen
  publisher: Harvard Business School Press
  year: '1997'
  kind: academic
  availability: referenced
  note: The book that set out the theory of disruptive innovation, in which an entrant begins with a simpler, cheaper product that the leaders' best customers do not want, and improves until it serves the mainstream. Cited as a bibliographic reference in the disruption briefing; the book was not opened for this release.
- id: bbr-williamson-1975
  title: 'Markets and Hierarchies: Analysis and Antitrust Implications'
  author: Oliver E. Williamson
  publisher: Free Press
  year: '1975'
  kind: academic
  availability: referenced
  note: A founding work of transaction cost economics, which explains when a firm does better to organize an activity itself than to buy it in the market, as when few suppliers can provide it and no contract can foresee every problem. Cited as a bibliographic reference in the vertical integration briefing; the book was not opened for this release.
- id: bbr-coase-1937
  title: The Nature of the Firm
  author: Ronald H. Coase
  publisher: Economica
  year: '1937'
  kind: academic
  availability: referenced
  note: The article that asked why firms exist at all, and answered that using the market has costs, so some exchanges are cheaper to organize inside a firm. Cited as a bibliographic reference in the vertical integration briefing; the article was not opened for this release.
- id: bbr-lintner-1956
  title: Distribution of Incomes of Corporations Among Dividends, Retained Earnings, and Taxes
  author: John Lintner
  publisher: American Economic Review
  year: '1956'
  kind: academic
  availability: referenced
  note: The study behind the idea that managers smooth dividends, raising them only when they expect to sustain the increase and cutting them reluctantly. Cited as a bibliographic reference in the shareholder returns briefing; the article was not opened for this release.
- id: bbr-miller-modigliani-1961
  title: Dividend Policy, Growth, and the Valuation of Shares
  author: Merton H. Miller and Franco Modigliani
  publisher: The Journal of Business
  year: '1961'
  kind: academic
  availability: referenced
  note: The argument that, under idealized conditions with no taxes or transaction costs, the way a firm divides its earnings between dividends and retention does not change its value; what matters is the investment it makes. Cited as a bibliographic reference in the shareholder returns briefing; the article was not opened for this release.
- id: bbr-fombrun-1996
  title: 'Reputation: Realizing Value from the Corporate Image'
  author: Charles J. Fombrun
  publisher: Harvard Business School Press
  year: '1996'
  kind: academic
  availability: referenced
  note: A book that treats corporate reputation as an intangible asset of real value, formed from the judgements that a company's many stakeholders make of it over time. Cited as a bibliographic reference in the reputation briefing; the book was not opened for this release.

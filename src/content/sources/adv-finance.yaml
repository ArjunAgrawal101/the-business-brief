# Sources for the advanced financial management mode of the Finance Desk
# (/finance-desk/advanced/): beyond the IB course. Each is a published work
# cited as a bibliographic reference; none was opened for this release, and
# nothing is reproduced from them. The details were confirmed by web search
# on 16 November 2026.

- id: brealey-myers-allen-2020
  title: Principles of Corporate Finance, thirteenth edition
  author: Richard A. Brealey, Stewart C. Myers and Franklin Allen
  publisher: McGraw-Hill Education
  year: '2020'
  kind: academic
  availability: referenced
  note: The standard reference for net present value and the other investment criteria (payback, discounted payback, the internal rate of return and its pitfalls, the profitability index), for sensitivity, scenario and break-even analysis and operating leverage, and for the cost of capital. Cited for the methods of the capital budgeting comparator, the forecast's scenarios and the break-even scenarios, which are explained in the platform's own words; the book was not opened for this release.
- id: koller-goedhart-wessels-2020
  title: 'Valuation: Measuring and Managing the Value of Companies, seventh edition'
  author: Tim Koller, Marc Goedhart and David Wessels (McKinsey & Company)
  publisher: John Wiley & Sons
  year: '2020'
  kind: academic
  availability: referenced
  note: The standard reference for forecasting a company's financial statements from drivers, so that they link and balance, and for analysing historical performance by splitting returns into margin and turnover. Cited for the method of the integrated forecast and the performance dashboard, in a simplified form; the book was not opened for this release.
- id: sharpe-1964
  title: 'Capital Asset Prices: A Theory of Market Equilibrium under Conditions of Risk'
  author: William F. Sharpe
  publisher: The Journal of Finance, volume 19, number 3, pages 425 to 442
  year: '1964'
  kind: academic
  availability: referenced
  note: The original statement of the capital asset pricing model, from which the cost of equity is taken as the risk-free rate plus beta times the market risk premium. Cited for the WACC helper of the capital budgeting comparator; the article was not opened for this release.
- id: lorie-savage-1955
  title: Three Problems in Rationing Capital
  author: James H. Lorie and Leonard J. Savage
  publisher: The Journal of Business, volume 28, number 4, pages 229 to 239
  year: '1955'
  kind: academic
  availability: referenced
  note: The article that set out, among other problems, that a project whose cash flows change sign more than once can have more than one internal rate of return. Cited for the comparator's statement of that limitation; the article was not opened for this release.
- id: richards-laughlin-1980
  title: A Cash Conversion Cycle Approach to Liquidity Analysis
  author: Verlyn D. Richards and Eugene J. Laughlin
  publisher: Financial Management, volume 9, number 1, pages 32 to 38
  year: '1980'
  kind: academic
  availability: referenced
  note: The article that proposed the cash conversion cycle as a measure of liquidity over time, to set beside static ratios such as the current ratio. Cited for the cycle on the performance dashboard; the article was not opened for this release.
- id: method-adv-finance
  title: How the advanced mode's example figures were built
  author: Arjun Agrawal | The Business Brief
  year: '2026'
  kind: method
  availability: repository
  note: 'Every figure in the advanced mode belongs to Emberly Roasters, the Financial Laboratory''s fictional coffee roaster, and is simulated. The forecast opens from the lab''s statement of financial position at 31 December 2025 and takes its first year from the lab''s month of 2026; the cost structures change that month by the same amounts as the forecast''s two alternatives; the performance dashboard adds 2022 and 2023 before the lab''s 2024 and 2025 accounts, with retained earnings and stock carried from year to year. The unit tests (`tests/unit/adv-finance.test.ts`) check every link and every default result against values worked by hand.'

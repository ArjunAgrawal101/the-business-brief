  author: David J. Teece
  publisher: Research Policy 15(6)
  year: '1986'
  kind: academic
  availability: referenced
  note: Appropriability regimes and complementary assets, which decide who captures the value of an innovation. Cited as a bibliographic reference.
- id: adv-strat-teece-2010
  title: Business models, business strategy and innovation
  author: David J. Teece
  publisher: Long Range Planning 43(2-3)
  year: '2010'
  kind: academic
  availability: referenced

# Mergers, acquisitions and alliances: published works
# ---------------------------------------------------------------------------
- id: adv-strat-roll-1986
  title: The hubris hypothesis of corporate takeovers
  author: Richard Roll
  publisher: Journal of Business 59(2)
  year: '1986'
  kind: academic
  availability: referenced
  note: The argument that bidders overpay because managers trust their own valuations over the market's. Cited as a bibliographic reference.
- id: adv-strat-andrade-mitchell-stafford-2001
  title: New evidence and perspectives on mergers
  author: Gregor Andrade, Mark Mitchell and Erik Stafford
  publisher: Journal of Economic Perspectives 15(2)
  year: '2001'
  kind: academic
  availability: referenced
  note: A survey of American mergers from 1973 to 1998, with large gains for target shareholders, small or negative returns for bidders and a small positive combined effect. Cited as a bibliographic reference.
- id: adv-strat-moeller-schlingemann-stulz-2005
  title: 'Wealth destruction on a massive scale? A study of acquiring-firm returns in the recent merger wave'
  author: Sara B. Moeller, Frederik P. Schlingemann and René M. Stulz
  publisher: Journal of Finance 60(2)
  year: '2005'
  kind: academic
  availability: referenced
  note: Evidence that a small number of very large deals between 1998 and 2001 accounted for most of the value acquirers lost. Cited as a bibliographic reference.
- id: adv-strat-king-et-al-2004
  title: 'Meta-analyses of post-acquisition performance: indications of unidentified moderators'
  author: David R. King, Dan R. Dalton, Catherine M. Daily and Jeffrey G. Covin
  publisher: Strategic Management Journal 25(2)
  year: '2004'
  kind: academic
  availability: referenced
  note: A meta-analysis finding that, on average, acquisitions do not improve the acquirer's performance and that the usual explanations do not account for the variation. Cited as a bibliographic reference.
- id: adv-strat-haspeslagh-jemison-1991
  title: 'Managing Acquisitions: Creating Value Through Corporate Renewal'
  author: Philippe C. Haspeslagh and David B. Jemison
  publisher: Free Press
  year: '1991'
  kind: academic
  availability: referenced
  note: The integration matrix of strategic interdependence against the need for organisational autonomy. Cited as a bibliographic reference.
- id: adv-strat-sirower-1997
  title: 'The Synergy Trap: How Companies Lose the Acquisition Game'
  author: Mark L. Sirower
  publisher: Free Press
  year: '1997'
  kind: academic
  availability: referenced
  note: The argument that the premium is a promise of synergies above those already in the target's price, and an account of why those promises are so often broken. Cited as a bibliographic reference.
- id: adv-strat-dyer-singh-1998
  title: 'The relational view: cooperative strategy and sources of interorganizational competitive advantage'
  author: Jeffrey H. Dyer and Harbir Singh
  publisher: Academy of Management Review 23(4)
  year: '1998'
  kind: academic
  availability: referenced
  note: The four sources of relational rent in alliances and the governance that protects them. Cited as a bibliographic reference.
- id: adv-strat-williamson-1975
  title: 'Markets and Hierarchies: Analysis and Antitrust Implications'
  author: Oliver E. Williamson
  publisher: Free Press
  year: '1975'
  kind: academic
  availability: referenced
  note: Transaction cost economics, the basis for choosing between market contracts, hybrid arrangements and ownership. Cited as a bibliographic reference.
- id: adv-strat-thaler-1988
  title: 'Anomalies: the winner''s curse'
  author: Richard H. Thaler
  publisher: Journal of Economic Perspectives 2(1)
  year: '1988'
  kind: academic
  availability: referenced
  note: Why the winner of an auction for an uncertain asset tends to overpay. Cited as a bibliographic reference.
- id: adv-strat-fuller-netter-stegemoller-2002
  title: 'What do returns to acquiring firms tell us? Evidence from firms that make many acquisitions'
  author: Kathleen Fuller, Jeffry Netter and Mike Stegemoller
  publisher: Journal of Finance 57(4)
  year: '2002'
  kind: academic
  availability: referenced
  note: Evidence that bidders gain when buying private firms or subsidiaries and lose when buying listed companies. Cited as a bibliographic reference.
- id: adv-strat-puranam-singh-zollo-2006
  title: 'Organizing for innovation: managing the coordination-autonomy dilemma in technology acquisitions'
  author: Phanish Puranam, Harbir Singh and Maurizio Zollo
  publisher: Academy of Management Journal 49(2)
  year: '2006'
  kind: academic
  availability: referenced
  note: How structural integration helps coordination but disrupts innovation in acquired technology firms. Cited as a bibliographic reference.
- id: adv-strat-hamel-1991
  title: Competition for competence and inter-partner learning within international strategic alliances
  author: Gary Hamel
  publisher: Strategic Management Journal 12 (Summer Special Issue)
  year: '1991'
  kind: academic
  availability: referenced
  note: Alliances as learning races, in which the faster learner can capture the partner's skills. Cited as a bibliographic reference.
- id: adv-strat-kogut-1991
  title: Joint ventures and the option to expand and acquire
  author: Bruce Kogut
  publisher: Management Science 37(1)
  year: '1991'
  kind: academic
  availability: referenced
  note: Joint ventures as real options to acquire a partner's business later. Cited as a bibliographic reference.
- id: adv-strat-kale-dyer-singh-2002
  title: 'Alliance capability, stock market response, and long-term alliance success: the role of the alliance function'
  author: Prashant Kale, Jeffrey H. Dyer and Harbir Singh
  publisher: Strategic Management Journal 23(8)
  year: '2002'
  kind: academic
  availability: referenced
  note: Evidence that firms with a dedicated alliance function achieve better alliance outcomes. Cited as a bibliographic reference.
- id: adv-strat-raiffa-1968
  title: 'Decision Analysis: Introductory Lectures on Choices under Uncertainty'
  author: Howard Raiffa
  publisher: Addison-Wesley
  year: '1968'
  kind: academic
  availability: referenced
  note: The classic treatment of decision trees and the expected value of acting under uncertainty. Cited as a bibliographic reference.


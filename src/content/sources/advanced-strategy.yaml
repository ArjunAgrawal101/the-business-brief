# Sources for the Advanced Management and Strategy modules of the strategy
# domain (src/content/advanced/, domain: strategy). Published works are cited
# from knowledge as bibliographic references; company and regulator documents
# were read in full on 16 November 2026. The session's web tool could not reach
# these hosts, so each page was opened directly through the session's network
# proxy and read as text; nothing here rests on a search excerpt.

# ---------------------------------------------------------------------------
# Competitive advantage and industry analysis: published works
# ---------------------------------------------------------------------------
- id: adv-strat-porter-1980
  title: 'Competitive Strategy: Techniques for Analyzing Industries and Competitors'
  author: Michael E. Porter
  publisher: Free Press
  year: '1980'
  kind: academic
  availability: referenced
  note: The full statement of the five forces and the generic strategies. Cited as a bibliographic reference; the book was not opened for this release.
- id: adv-strat-porter-1985
  title: 'Competitive Advantage: Creating and Sustaining Superior Performance'
  author: Michael E. Porter
  publisher: Free Press
  year: '1985'
  kind: academic
  availability: referenced
  note: The value chain and the analysis of cost and differentiation advantage activity by activity. Cited as a bibliographic reference.
- id: adv-strat-porter-1996
  title: What is strategy?
  author: Michael E. Porter
  publisher: Harvard Business Review 74(6)
  year: '1996'
  kind: academic
  availability: referenced
  note: The argument that operational effectiveness is not strategy, and that durable advantage comes from trade-offs and a system of fitting activities. Cited as a bibliographic reference.
- id: adv-strat-porter-2008
  title: The five competitive forces that shape strategy
  author: Michael E. Porter
  publisher: Harvard Business Review 86(1)
  year: '2008'
  kind: academic
  availability: referenced
  note: Porter's own restatement of the five forces, with the common errors in applying them. Cited as a bibliographic reference.
- id: adv-strat-barney-1991
  title: Firm resources and sustained competitive advantage
  author: Jay Barney
  publisher: Journal of Management 17(1)
  year: '1991'
  kind: academic
  availability: referenced
  note: The founding statement of the resource-based view, with the tests of value, rarity, imitability and substitutability. Cited as a bibliographic reference.
- id: adv-strat-barney-1995
  title: Looking inside for competitive advantage
  author: Jay B. Barney
  publisher: Academy of Management Executive 9(4)
  year: '1995'
  kind: academic
  availability: referenced
  note: The practitioner version of the resource-based view, which adds the question of organisation and gives the VRIO framework its name. Cited as a bibliographic reference.
- id: adv-strat-wernerfelt-1984
  title: A resource-based view of the firm
  author: Birger Wernerfelt
  publisher: Strategic Management Journal 5(2)
  year: '1984'
  kind: academic
  availability: referenced
  note: The paper that named the resource-based view. Cited as a bibliographic reference.
- id: adv-strat-rumelt-1991
  title: How much does industry matter?
  author: Richard P. Rumelt
  publisher: Strategic Management Journal 12(3)
  year: '1991'
  kind: academic
  availability: referenced
  note: The variance decomposition that found business-unit effects far larger than industry effects in explaining differences in profitability. Cited as a bibliographic reference.
- id: adv-strat-mcgahan-porter-1997
  title: How much does industry matter, really?
  author: Anita M. McGahan and Michael E. Porter
  publisher: Strategic Management Journal 18 (Summer Special Issue)
  year: '1997'
  kind: academic
  availability: referenced
  note: The reply to Rumelt, with a broader sample and a larger industry effect, which varies by sector. Cited as a bibliographic reference.
- id: adv-strat-teece-pisano-shuen-1997
  title: Dynamic capabilities and strategic management
  author: David J. Teece, Gary Pisano and Amy Shuen
  publisher: Strategic Management Journal 18(7)
  year: '1997'
  kind: academic
  availability: referenced
  note: The argument that advantage in changing markets rests on the capacity to integrate, build and reconfigure competences. Cited as a bibliographic reference.
- id: adv-strat-brandenburger-stuart-1996
  title: Value-based business strategy
  author: Adam M. Brandenburger and Harborne W. Stuart Jr.
  publisher: Journal of Economics and Management Strategy 5(1)
  year: '1996'
  kind: academic
  availability: referenced
  note: The definition of value created as willingness to pay minus supplier opportunity cost, and of added value as the limit on what any party can capture. Cited as a bibliographic reference.
- id: adv-strat-lieberman-montgomery-1988
  title: First-mover advantages
  author: Marvin B. Lieberman and David B. Montgomery
  publisher: Strategic Management Journal 9 (Summer Special Issue)
  year: '1988'
  kind: academic
  availability: referenced
  note: The mechanisms by which pioneers gain an advantage, and the disadvantages that let followers overtake them. Cited as a bibliographic reference.
- id: adv-strat-brandenburger-nalebuff-1996
  title: Co-opetition
  author: Adam M. Brandenburger and Barry J. Nalebuff
  publisher: Currency Doubleday
  year: '1996'
  kind: academic
  availability: referenced
  note: The value net, which adds complementors to customers, suppliers and competitors. Cited as a bibliographic reference.
- id: adv-strat-dierickx-cool-1989
  title: Asset stock accumulation and sustainability of competitive advantage
  author: Ingemar Dierickx and Karel Cool
  publisher: Management Science 35(12)
  year: '1989'
  kind: academic
  availability: referenced
  note: Why strategic assets built through flows of investment over time resist imitation, including time compression diseconomies. Cited as a bibliographic reference.
- id: adv-strat-coff-1999
  title: 'When competitive advantage doesn''t lead to performance: the resource-based view and stakeholder bargaining power'
  author: Russell W. Coff
  publisher: Organization Science 10(2)
  year: '1999'
  kind: academic
  availability: referenced
  note: How employees and other stakeholders can capture the rents that a firm's resources generate. Cited as a bibliographic reference.
- id: adv-strat-priem-butler-2001
  title: Is the resource-based "view" a useful perspective for strategic management research?
  author: Richard L. Priem and John E. Butler
  publisher: Academy of Management Review 26(1)
  year: '2001'
  kind: academic
  availability: referenced
  note: The critique that the resource-based view risks tautology when value is defined by its outcome. Cited as a bibliographic reference.
- id: adv-strat-wiggins-ruefli-2005
  title: 'Schumpeter''s ghost: is hypercompetition making the best of times shorter?'
  author: Robert R. Wiggins and Timothy W. Ruefli
  publisher: Strategic Management Journal 26(10)
  year: '2005'
  kind: academic
  availability: referenced
  note: Evidence that periods of persistent superior performance have become shorter across many industries. Cited as a bibliographic reference.
- id: adv-strat-mcnamara-vaaler-devers-2003
  title: 'Same as it ever was: the search for evidence of increasing hypercompetition'
  author: Gerry McNamara, Paul M. Vaaler and Cynthia Devers
  publisher: Strategic Management Journal 24(3)
  year: '2003'
  kind: academic
  availability: referenced
  note: A study that found little evidence that competitive conditions had become more hypercompetitive over time. Cited as a bibliographic reference.

# ---------------------------------------------------------------------------
# Corporate strategy and restructuring: published works
# ---------------------------------------------------------------------------
- id: adv-strat-porter-1987
  title: From competitive advantage to corporate strategy
  author: Michael E. Porter
  publisher: Harvard Business Review 65(3)
  year: '1987'
  kind: academic
  availability: referenced
  note: The attractiveness, cost-of-entry and better-off tests for diversification, and the record of diversified American companies that divested most of their acquisitions. Cited as a bibliographic reference.
- id: adv-strat-goold-campbell-alexander-1994
  title: 'Corporate-Level Strategy: Creating Value in the Multibusiness Company'
  author: Michael Goold, Andrew Campbell and Marcus Alexander
  publisher: John Wiley and Sons
  year: '1994'
  kind: academic
  availability: referenced
  note: Parenting advantage, the parenting fit matrix and the idea that a corporate centre must add more value than it costs. Cited as a bibliographic reference.
- id: adv-strat-prahalad-hamel-1990
  title: The core competence of the corporation
  author: C. K. Prahalad and Gary Hamel
  publisher: Harvard Business Review 68(3)
  year: '1990'
  kind: academic
  availability: referenced
  note: The case for organising a diversified company around shared competences rather than a portfolio of business units. Cited as a bibliographic reference.
- id: adv-strat-berger-ofek-1995
  title: Diversification's effect on firm value
  author: Philip G. Berger and Eli Ofek
  publisher: Journal of Financial Economics 37(1)
  year: '1995'
  kind: academic
  availability: referenced
  note: The excess value measure and the estimate that diversified American firms traded at a discount of roughly 13 to 15 percent to the sum of comparable single-segment firms. Cited as a bibliographic reference.
- id: adv-strat-villalonga-2004
  title: 'Diversification discount or premium? New evidence from the Business Information Tracking Series'
  author: Belén Villalonga
  publisher: Journal of Finance 59(2)
  year: '2004'
  kind: academic
  availability: referenced
  note: Evidence that the measured discount depends on how business segments are defined, and that with establishment-level data it can become a premium. Cited as a bibliographic reference.
- id: adv-strat-campa-kedia-2002
  title: Explaining the diversification discount
  author: José Manuel Campa and Simi Kedia
  publisher: Journal of Finance 57(4)
  year: '2002'
  kind: academic
  availability: referenced
  note: The selection argument, that firms which choose to diversify were already trading at a discount before they did so. Cited as a bibliographic reference.
- id: adv-strat-jensen-1986
  title: Agency costs of free cash flow, corporate finance, and takeovers
  author: Michael C. Jensen
  publisher: American Economic Review 76(2)
  year: '1986'
  kind: academic
  availability: referenced
  note: The argument that managers with free cash flow overinvest, and that debt, payouts and the threat of takeover discipline them. Cited as a bibliographic reference.
- id: adv-strat-henderson-1970
  title: The Product Portfolio
  author: Bruce D. Henderson
  publisher: The Boston Consulting Group
  year: '1970'
  kind: academic
  availability: referenced
  note: The short essay that introduced the growth-share matrix. Cited as a bibliographic reference.
- id: adv-strat-khanna-palepu-1997
  title: Why focused strategies may be wrong for emerging markets
  author: Tarun Khanna and Krishna Palepu
  publisher: Harvard Business Review 75(4)
  year: '1997'
  kind: academic
  availability: referenced
  note: The argument that diversified business groups fill institutional voids in capital, labour and product markets. Cited as a bibliographic reference.
- id: adv-strat-stein-1997
  title: Internal capital markets and the competition for corporate resources
  author: Jeremy C. Stein
  publisher: Journal of Finance 52(1)
  year: '1997'
  kind: academic
  availability: referenced
  note: The case for headquarters as a better allocator of capital than outside markets, through winner-picking. Cited as a bibliographic reference.
- id: adv-strat-scharfstein-stein-2000
  title: 'The dark side of internal capital markets: divisional rent-seeking and inefficient investment'
  author: David S. Scharfstein and Jeremy C. Stein
  publisher: Journal of Finance 55(6)
  year: '2000'
  kind: academic
  availability: referenced
  note: How lobbying by divisional managers leads headquarters to subsidise weak divisions. Cited as a bibliographic reference.
- id: adv-strat-teece-1982
  title: Towards an economic theory of the multiproduct firm
  author: David J. Teece
  publisher: Journal of Economic Behavior and Organization 3(1)
  year: '1982'
  kind: academic
  availability: referenced
  note: The argument that economies of scope justify common ownership only when contracting for the shared input is costly. Cited as a bibliographic reference.
- id: adv-strat-cusatis-miles-woolridge-1993
  title: 'Restructuring through spinoffs: the stock market evidence'
  author: Patrick J. Cusatis, James A. Miles and J. Randall Woolridge
  publisher: Journal of Financial Economics 33(3)
  year: '1993'
  kind: academic
  availability: referenced
  note: Evidence of positive returns to spun-off firms and their parents, concentrated among those later involved in takeovers. Cited as a bibliographic reference.


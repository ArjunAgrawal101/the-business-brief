- id: adv-strat-gilbert-2005
  title: 'Unbundling the structure of inertia: resource versus routine rigidity'
  author: Clark G. Gilbert
  publisher: Academy of Management Journal 48(5)
  year: '2005'
  kind: academic
  availability: referenced

- id: adv-strat-henderson-clark-1990
  title: 'Architectural innovation: the reconfiguration of existing product technologies and the failure of established firms'
  author: Rebecca M. Henderson and Kim B. Clark
  publisher: Administrative Science Quarterly 35(1)
  year: '1990'
  kind: academic
  availability: referenced

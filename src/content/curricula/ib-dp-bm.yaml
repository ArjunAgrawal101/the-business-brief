# IB Diploma Programme Business Management: the syllabus spine.
#
# STATUS OF THIS FILE. The IB Business management guide (first assessment 2024)
# was not available when this file was written. The units, subtopics and HL-only
# status below were assembled from secondary sources found with a web search on
# 29 October 2026 and recorded in src/content/data/claims.yaml. Every line carries
# its own verification status. When the Guide is supplied, check each line
# against it, change `verification` to `primary`, and record the page number in
# claims.yaml. Do not add content statements from memory.

name: IB Diploma Programme Business Management
shortName: IB DP Business Management
awardingBody: International Baccalaureate Organization
guide: Business management guide, first assessment 2024
verification: corroborated
note: >
  The structure below follows the full syllabus numbering used by sources that list
  HL subtopics: thirty-seven subtopics across five units, which matches the count one
  provider gives for the HL course. Some revision sites renumber subtopics on their SL
  pages by leaving out the HL-only ones (for example, they show Location as 5.3 and
  Break-even analysis as 5.4). This platform keeps the full numbering for SL and HL
  alike, so that a code always means the same subtopic.
sources: [ib-bm-guide-2024, web-secondary-2026-10-29, ib-ap-2027-record]
concepts:
  list: [change, creativity, ethics, sustainability]
  verification: corroborated
  note: Several independent sources list the same four concepts for the course first assessed in 2024.
units:
  - id: unit-1
    number: 1
    title: Introduction to business management
    verification: corroborated
    subtopics:
      - { code: '1.1', title: Introduction to business management, level: SL/HL, verification: corroborated }
      - { code: '1.2', title: Types of business entities, level: SL/HL, verification: corroborated }
      - { code: '1.3', title: Business objectives, level: SL/HL, verification: corroborated }
      - { code: '1.4', title: Stakeholders, level: SL/HL, verification: corroborated }
      - code: '1.5'
        title: Growth and evolution
        level: SL/HL
        verification: corroborated
        topic: growth-and-evolution
        tools: [ansoff-matrix, decision-trees, force-field-analysis, swot-analysis]
        calculations: [expected-value]
      - { code: '1.6', title: Multinational companies (MNCs), level: SL/HL, verification: corroborated }
  - id: unit-2
    number: 2
    title: Human resource management
    verification: corroborated
    subtopics:
      - { code: '2.1', title: Introduction to human resource management, level: SL/HL, verification: corroborated, calculations: [labour-turnover] }
      - { code: '2.2', title: Organizational structure, level: SL/HL, verification: unverified, note: Title not confirmed by a source in this session. Whether part of the content is HL only has not been checked. }
      - code: '2.3'
        title: Leadership and management
        level: SL/HL with HL-only content
        verification: corroborated
        note: Secondary sources mark part of this subtopic as HL only. Which part is HL only must be checked against the Guide.
        topic: leadership-and-management
        tools: [force-field-analysis]
      - { code: '2.4', title: Motivation and demotivation, level: SL/HL, verification: corroborated, note: Whether any motivation theory is HL only has not been checked. }
      - { code: '2.5', title: Organizational (corporate) culture, level: HL, verification: corroborated }
      - { code: '2.6', title: Communication, level: SL/HL, verification: corroborated }
      - { code: '2.7', title: Industrial/employee relations, level: HL, verification: unverified }
  - id: unit-3
    number: 3
    title: Finance and accounts
    verification: corroborated
    subtopics:
      - { code: '3.1', title: Introduction to finance, level: SL/HL, verification: corroborated }
      - { code: '3.2', title: Sources of finance, level: SL/HL, verification: corroborated }
      - code: '3.3'
        title: Costs and revenues
        level: SL/HL
        verification: corroborated
        topic: costs-and-revenues
        tools: [contribution]
        calculations: [total-cost, total-revenue, profit]
      - { code: '3.4', title: Final accounts, level: SL/HL with HL-only content, verification: corroborated, note: A secondary source lists the appropriateness of depreciation methods as HL only. }
      - { code: '3.5', title: Profitability and liquidity ratio analysis, level: SL/HL, verification: corroborated }
      - { code: '3.6', title: Debt/equity ratio analysis, level: HL, verification: conflicting, note: One source titles 3.6 Efficiency ratio analysis (the title used in the previous course). Both describe HL-only ratio analysis. Check the title against the Guide. }
      - { code: '3.7', title: Cash flow, level: SL/HL, verification: corroborated }
      - { code: '3.8', title: Investment appraisal, level: SL/HL with HL-only content, verification: corroborated, note: Secondary sources mark part of investment appraisal as HL only (net present value). }
      - { code: '3.9', title: Budgets, level: HL, verification: corroborated }
  - id: unit-4
    number: 4
    title: Marketing
    verification: corroborated
    subtopics:
      - { code: '4.1', title: Introduction to marketing, level: SL/HL, verification: corroborated }
      - { code: '4.2', title: Marketing planning, level: SL/HL, verification: corroborated }
      - { code: '4.3', title: Sales forecasting, level: HL, verification: corroborated }
      - { code: '4.4', title: Market research, level: SL/HL, verification: corroborated }
      - { code: '4.5', title: The seven Ps of the marketing mix, level: SL/HL, verification: corroborated }
      - { code: '4.6', title: International marketing, level: HL, verification: conflicting, note: Numbered 4.6 by a source listing the 2024 syllabus and 4.7 by sources describing the previous course. }
  - id: unit-5
    number: 5
    title: Operations management
    verification: corroborated
    subtopics:
      - { code: '5.1', title: Introduction to operations management, level: SL/HL, verification: corroborated }
      - { code: '5.2', title: Operations methods, level: SL/HL, verification: corroborated }
      - { code: '5.3', title: Lean production and quality management, level: HL, verification: corroborated }
      - { code: '5.4', title: Location, level: SL/HL, verification: corroborated }
      - code: '5.5'
        title: Break-even analysis
        level: SL/HL
        verification: corroborated
        note: Worked in the Finance Desk break-even workspace and used throughout the costs and revenues brief. A dedicated topic brief is planned.
        calculations: [contribution-per-unit, total-contribution, break-even-quantity, break-even-revenue, margin-of-safety, target-profit-output, target-price]
      - { code: '5.6', title: Production planning, level: HL, verification: corroborated }
      - { code: '5.7', title: Crisis management and contingency planning, level: HL, verification: conflicting, note: Listed as HL only by a course book listing; one revision site lists it without the HL label. }
      - { code: '5.8', title: Research and development, level: HL, verification: unverified }
      - { code: '5.9', title: Management information systems, level: HL, verification: corroborated }

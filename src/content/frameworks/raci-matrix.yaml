name: The RACI matrix
aliases: [RACI chart, Responsibility assignment matrix]
summary: "A grid of tasks against people that shows, for each task, who is responsible, who is accountable, who is consulted and who is informed."
question: "For each part of this project, who does the work, who decides, who is asked and who is told?"
group: people
status: enrichment
subtopics: ['2.2']
qualifications: [undergraduate, mba, professional]
diagram: raci-matrix
explanation: |
  A RACI matrix lists the tasks or decisions of a project down one side and the people or roles across the top. Each cell holds a letter. R, responsible, marks the person who does the work. A, accountable, marks the one person who owns the result and signs it off. C, consulted, marks people whose views are sought before a decision, in two-way discussion. I, informed, marks people who are told once a decision is made.

  Two rules make the matrix useful: every task has exactly one A, so that ownership is clear, and at least one R, so that someone actually does the work. Reading down a column shows each person's load; a column full of Rs is a bottleneck, and a column of Cs is someone who will slow every decision. It is a practical tool from project management rather than a theory, and it connects to the guide's ideas of delegation, chain of command and the matrix structure.
purpose: |
  To make roles explicit in a project or a change, especially where people work across departments or report to two managers, so that tasks are not duplicated, dropped or argued over, and so that people are consulted and informed without slowing everything down.
steps:
  - "List the main tasks and decisions of the project, in the order they happen."
  - "List the roles involved, by role rather than by name where possible."
  - "For each task, mark the one person accountable, then who is responsible for doing the work."
  - "Add who must be consulted before it is done and who must be informed afterwards; keep both lists short."
  - "Check the rules: one A for every task, at least one R, and no person overloaded with Rs."
  - "Share the matrix with everyone involved and revise it when roles change."
example:
  fictional: true
  business: Kettle and Crumb
  title: Kettle and Crumb opens a second café
  body: |
    The owner of Kettle and Crumb, a fictional café, plans a second branch with four colleagues. In the first draft of the plan, nobody was clearly accountable for fitting out the premises, and both the owner and the operations manager thought they were choosing the site.

    The RACI matrix in the diagram settles it. The owner is accountable for choosing the site, agreeing the budget and planning the opening week; the operations manager is accountable for the fit-out and for recruiting and training staff; the head barista is responsible for the fit-out and the training, because that is where her expertise lies.
  result: |
    Each task now has exactly one person accountable and at least one responsible, which the check in the diagram confirms. The matrix also showed the finance officer consulted on four of the five tasks, so the team agreed she would be consulted only on spending above a set amount, to avoid slowing decisions down.
advantages:
  - "Simple and visual, it removes confusion about who does what and who decides."
  - "It shows workloads and bottlenecks at a glance by reading down each column."
  - "It suits matrix structures and cross-department projects, where reporting lines alone do not settle responsibility."
limitations:
  - "It shows roles, not how well people work together; a clear matrix cannot fix a lack of trust."
  - "For large projects the grid becomes long and hard to maintain."
  - "Assigning letters does not give people the authority or the time to carry them out."
exercise:
  prompt: |
    A student council is organizing a charity concert. Draw a RACI matrix with at least five tasks and four roles, then check it against the two rules and identify any person who is overloaded.
  guidance:
    - "Choose tasks that cover the whole project, from booking the venue to counting the money raised."
    - "Give each task exactly one A and at least one R, and keep the Cs and Is to the people who really need them."
    - "Read down each column to spot overload, and say how you would rebalance it."
    - "Explain one task where the person accountable and the person responsible should be different, and why."

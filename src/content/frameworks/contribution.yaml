name: Contribution
aliases: [Contribution analysis, Make or buy analysis]
summary: "Judging a decision by what it adds towards fixed costs and profit, as in accepting a special order, making or buying a component, or comparing contribution and absorption costing."
question: "Does this decision add to profit once only the costs it changes are counted?"
group: performance
status: toolkit
guidePages: '14'
subtopics: ['5.5', '3.3']
level: HL
qualifications: [ib, undergraduate, mba, professional]
tool: contribution
diagram: break-even-chart
explanation: |
  Contribution is the selling price minus the variable cost per unit: what each sale adds towards fixed costs and then profit. The guide's contribution tool includes make or buy analysis, contribution costing and absorption costing. In a decision, the question is what changes: if fixed costs stay the same whatever is decided, the decision should be judged by its effect on total contribution, less any costs caused only by the decision.

  That is why an order priced below the average total cost of a unit can still be worth taking when there is spare capacity, and why a product that shows a loss after its share of overheads can still be worth keeping. Absorption costing shares all costs, including overheads, among products to find a full cost; contribution costing leaves fixed costs as a total, which is clearer for short-run decisions.
purpose: |
  To make short-run decisions about orders, products and sourcing on the basis of the costs and revenues they actually change. The toolkit guide sets out the method in full, with a worked case and an interaction for testing a special order.
steps:
  - "Identify the costs and revenues that change with the decision, and those that do not."
  - "Find the contribution per unit: price minus variable cost per unit."
  - "Multiply by the quantity, and subtract any fixed costs caused only by the decision."
  - "For make or buy, compare the cost to make with the cost to buy, using relevant costs only."
  - "Check the conditions: spare capacity, the effect on regular customers and prices, and the qualitative factors."
example:
  fictional: true
  business: Kiln and Clay
  title: Kiln and Clay weighs a café's order
  body: |
    Kiln and Clay, a fictional pottery, normally sells bowls at $18. A café chain offers to buy 400 bowls at $11 each in a quiet month. Each bowl has a variable cost of $6.50, and the order needs a custom stamp costing $200. The pottery's average total cost per bowl, including its share of rent and salaries, is $13.

    The order's effect on profit is ($11.00 − $6.50) × 400 − $200 = $1,600.
  result: |
    On contribution the order adds $1,600 to profit, even though its price is below the $13 average total cost, because the rent and salaries are paid anyway. The decision still rests on two conditions: the kiln has spare capacity that month, and regular customers will not learn of the lower price and expect it too.
advantages:
  - "It focuses decisions on the costs and revenues that actually change."
  - "It explains why orders below average cost can still raise profit in the short run."
  - "It gives a clear basis for make or buy decisions and for judging products."
limitations:
  - "It is a short-run tool; in the long run every cost must be covered."
  - "It depends on separating fixed and variable costs correctly."
  - "It can ignore the effect of a low price on regular customers and the brand."
exercise:
  prompt: |
    A bicycle repair shop normally charges $40 for a service. A delivery company offers a contract for 50 services a month at $28 each. Each service uses $10 of parts and $8 of a mechanic's paid-by-the-job time, and the shop has spare capacity on weekday mornings. Should the shop accept? Calculate the monthly effect on profit and give two factors beyond the figures.
  guidance:
    - "Find the contribution per service from the variable costs only."
    - "Multiply by the 50 services, and note that the shop's rent does not change."
    - "Consider capacity: what happens if the contract services crowd out full-price customers?"
    - "Weigh the qualitative factors, such as a steady income against the risk to the shop's price position."
structure:
  - name: Contribution per unit
    text: "Price minus variable cost per unit: what each sale adds towards fixed costs and then to profit."
  - name: Total contribution
    text: "Contribution per unit multiplied by the number of units, the amount a product or an order adds before fixed costs."
  - name: Relevant costs and revenues
    text: "Only the costs and revenues that change with the decision. Fixed costs paid whatever is decided, such as rent, are left out; fixed costs caused only by the decision, such as special tooling, are included."
  - name: The decision rule
    text: "Accept an order, keep a product or make rather than buy when the decision adds contribution, so long as the conditions behind it hold."
  - name: The conditions
    text: "Spare capacity, no displaced regular sales, no knock-on effect on regular prices, and the qualitative factors, such as the brand and relations with existing customers."
situations:
  suits:
    - "Judging a special order at a price below average total cost in a quiet period, such as a pottery offered a bulk order from a café chain."
    - "Deciding whether to drop a product that shows a loss once fixed costs are shared out, but still covers its variable costs."
    - "Make-or-buy choices, where only the costs that change between the two options should be compared."
  poorFit:
    - "Long-run pricing: in the long run every cost must be covered, so contribution alone would set prices too low."
    - "A business at full capacity, where an extra order displaces regular sales and the lost contribution of those sales must be counted."
interpretation: |
  A positive contribution means the decision adds to profit in the short run, because the fixed costs are paid whatever is decided. The size of the contribution says how much room there is: an order that adds a little, at a price far below the usual one, has little margin for error if regular customers hear of it.

  Read the result together with its conditions. If capacity is full, subtract the contribution of the regular sales displaced; if the low price could spread, the decision's true cost includes the margin lost on future sales. A negative contribution is a strong signal to refuse, unless the order has a strategic purpose worth paying for, such as winning a new customer.
implications:
  justifies:
    - "Accepting a special order at a price above variable cost when capacity is spare and the price will not spread to regular customers."
    - "Keeping a product that covers its variable costs and contributes to fixed costs, while a better use of its capacity is found."
    - "Buying in a component when the supplier's price is below the costs that would be saved by not making it."
  doesNotJustify:
    - "Setting regular prices at a level that covers only variable costs."
    - "Ignoring the qualitative factors, such as the brand, staff workload or the reaction of loyal customers, because the figures are positive."
mistakes:
  - mistake: "Including a share of fixed costs that the decision does not change."
    fix: "Leave out costs paid anyway, such as rent and salaries, and include only fixed costs caused by the decision."
  - mistake: "Comparing the order's price with average total cost."
    fix: "Compare the price with variable cost per unit; average total cost includes costs that do not change."
  - mistake: "Forgetting displaced sales when capacity is full."
    fix: "Subtract the contribution of the regular sales the order would push out, or the extra cost of overtime to avoid it."
apply:
  - href: /finance-desk/contribution/
    scope: full
    use: "Judge a special order on contribution on a worked case, and see when the rule fails because the order displaces regular sales."
  - href: /finance-desk/lab/contribution/
    scope: full
    use: "Calculate contribution per unit, total contribution and profit from your own price, costs and sales, with the working, a chart and a sensitivity check."
  - href: /finance-desk/lab/break-even-quantity/
    scope: part
    use: "Carry contribution on to break-even: fixed costs divided by contribution per unit gives the output a business needs to cover its costs."

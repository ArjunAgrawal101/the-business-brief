name: STEEPLE analysis
aliases: [STEEPLE]
summary: "A scan of seven kinds of external factor, social, technological, economic, environmental, political, legal and ethical, that bear on a business decision."
question: "What is changing outside the business that could affect this decision?"
group: environment
status: toolkit
guidePages: '14'
subtopics: ['1.5', '2.1', '4.6']
level: SL/HL
qualifications: [ib, undergraduate, mba, professional]
tool: steeple-analysis
diagram: steeple
explanation: |
  STEEPLE is a checklist for scanning the external environment: social factors (demographics, lifestyles, attitudes), technological (new products and processes), economic (growth, inflation, interest and exchange rates), environmental (climate, resources, waste), political (policy, stability, trade), legal (employment, consumer and competition law) and ethical (what stakeholders consider right).

  It is the IB toolkit's version of the PESTLE family; its ethical heading asks directly about questions of right and wrong that other versions fold into social or legal factors. Its findings feed the opportunities and threats of a SWOT analysis.
purpose: |
  To make sure no important external factor is missed before a decision, and to judge which factors matter most for it. The toolkit guide gives the full method and a worked case.
steps:
  - "Name the decision and the market or country it concerns."
  - "Under each heading, list factors that could affect the decision, with dated evidence."
  - "Judge each factor's direction, size and timing, and keep the few that matter."
  - "Carry them into the opportunities and threats of a SWOT and into the options being compared."
example:
  fictional: true
  business: Saltmarsh Ferries
  title: Saltmarsh Ferries looks ahead
  body: |
    Saltmarsh Ferries, a fictional ferry operator, considers replacing two diesel boats. Its STEEPLE scan finds more tourists visiting the islands (social), electric ferries now able to cover its short routes (technological), rising fuel prices (economic), a regional target to cut emissions (environmental and political), new safety certification rules for electric vessels (legal), and islanders' concern about noise and fumes in the harbour (ethical).
  result: |
    Several factors point the same way: electric ferries would cut running costs as fuel prices rise and meet the emissions target, and islanders would welcome them. The legal factor, certification, is the main risk to timing, so the firm plans the order around the certification date.
advantages:
  - "A simple structure that makes a scan of the environment systematic and complete."
  - "The ethical heading brings stakeholder concerns into the analysis explicitly."
  - "It feeds directly into SWOT and the comparison of options."
limitations:
  - "It can produce long lists without priorities unless the analyst ranks the factors."
  - "Factors overlap and change quickly, so the scan dates fast."
  - "It identifies factors but does not by itself say what the business should do."
exercise:
  prompt: |
    A fast-food chain is deciding whether to open restaurants in a country it has never traded in. Carry out a STEEPLE analysis with one factor under each heading for a country you know, and identify the two factors that would most affect the decision.
  guidance:
    - "Give specific factors, ideally with a date or source, rather than general words."
    - "Keep to factors outside the business's control."
    - "Explain why your two key factors matter more than the others for this decision."
    - "Say how each could become an opportunity or a threat in a SWOT."

name: Gantt charts
aliases: [Gantt chart]
summary: "A chart of a project's tasks as bars against a timeline, showing when each starts and ends, which overlap, and the milestones along the way."
question: "When does each task happen, and is the project on schedule?"
group: change
status: toolkit
guidePages: '14'
subtopics: ['5.1', '4.2']
level: HL
qualifications: [ib, undergraduate, mba, professional]
tool: gantt-chart
diagram: gantt-chart
explanation: |
  A Gantt chart lists the tasks of a project down the side and time along the top. Each task is a bar from its start to its finish, so the chart shows at a glance the order of work, which tasks run at the same time, and the milestones, such as a launch date. Dependencies, where one task cannot start until another ends, can be shown with arrows, and progress can be shaded in as the project runs.

  It is easy to read and good for communicating a schedule to a team. It shows dependencies less rigorously than a critical path network, and does not by itself reveal which tasks have float, so the two tools are often used together.
purpose: |
  To plan and track a project's timing, allocate people to tasks and communicate the schedule. The toolkit lists it as an HL tool for units 4 and 5; its full guide is in preparation.
steps:
  - "List the tasks and estimate the duration of each."
  - "Identify which tasks depend on others finishing first."
  - "Draw each task as a bar on the timeline, starting when its dependencies allow."
  - "Mark milestones and the project's end date."
  - "Track progress against the plan and adjust the bars when tasks slip."
example:
  fictional: true
  business: Juniper Café
  title: Juniper Café plans its opening
  body: |
    The owner of Juniper Café, a fictional business, plans the twelve weeks to opening day, as in the diagram above: find and sign a site (weeks 1 to 3), arrange finance (weeks 2 to 4), fit out the café (weeks 5 to 9), recruit staff (weeks 6 to 8), train staff (weeks 9 and 10) and run the launch marketing (weeks 8 to 11), with the opening in week 12.
  result: |
    The chart shows that training cannot start until recruitment ends in week 8, and that the café cannot open until the trained staff are in place, so a delay of two weeks in hiring would leave almost no margin before opening day. The owner starts advertising the jobs a week earlier to build one in.
advantages:
  - "Easy to read, so everyone can see what happens when."
  - "Good for allocating people and spotting overlaps and clashes."
  - "Progress can be tracked against the plan visually."
limitations:
  - "Dependencies are harder to read than on a network diagram, especially in large projects."
  - "It does not by itself identify the critical path or the float on each task."
  - "Estimates of duration are uncertain, so the chart needs updating."
exercise:
  prompt: |
    Plan a school charity fair with six tasks, such as booking the hall, recruiting volunteers and advertising. Draw a Gantt chart over six weeks, show one dependency and one milestone, and explain which task would most delay the fair if it ran late.
  guidance:
    - "Give each task a realistic duration and a reason for its start date."
    - "Show at least one task that cannot start until another ends."
    - "Mark the fair itself as the milestone."
    - "Explain the delay using the dependencies, which is where critical path analysis adds detail."
structure:
  - name: The task list
    text: "Every task in the project, in the order they happen, with an estimated duration for each."
  - name: The timeline
    text: "A horizontal scale of days, weeks or months across the top of the chart."
  - name: The bars
    text: "One bar per task, starting when its dependencies allow and as long as its duration, so overlapping bars show tasks that run at the same time."
  - name: Dependencies
    text: "The tasks that must finish before another can start, shown by the bars' positions or by linking arrows."
  - name: Milestones
    text: "Key dates, such as an opening day or a sign-off, usually marked with a diamond."
  - name: Progress
    text: "How much of each task is done, shaded within its bar or marked against a line for today's date."
situations:
  suits:
    - "Communicating a project's timetable to a team, a client or a board who need to see at a glance what happens when."
    - "Tracking a project week by week, so that a task that slips is seen early."
    - "Planning the use of shared people or equipment, by seeing which tasks overlap."
  poorFit:
    - "Finding the critical path and the float of each task in a complex network, where critical path analysis is clearer."
    - "Work whose tasks are unknown or keep changing, where a fixed chart soon misleads."
interpretation: |
  Read the chart for its pinch points: places where several tasks overlap and compete for the same people, and chains of dependent tasks with no gap between them, where any delay passes straight through to the finish.

  Compare the plan with progress regularly. A bar that is behind today's line is a problem only if a later task depends on it and has no room to absorb the delay, so check the dependency before reacting.
implications:
  justifies:
    - "Starting early tasks sooner, or adding resources to a chain of dependent tasks, to build in a margin before a fixed date."
    - "Re-planning the bars when a task slips, and telling the people whose tasks depend on it."
  doesNotJustify:
    - "Concluding that tasks without visible dependencies can slip freely; the chart does not calculate float."
    - "Treating the end date as certain while the durations are estimates."
mistakes:
  - mistake: "Drawing bars without showing which tasks depend on which."
    fix: "Mark the dependencies, so that the effect of a delay can be traced."
  - mistake: "Making the chart once and never updating it."
    fix: "Record progress against the plan regularly and move the bars when tasks slip."
  - mistake: "Treating the Gantt chart as a substitute for critical path analysis in a complex project."
    fix: "Use critical path analysis to find the critical path and float, and the Gantt chart to communicate and track the plan."

name: The business plan
aliases: [Business plan]
summary: "A document that sets out what a new business or project will do, for whom, how it will operate and what it will cost and earn, to test an idea and win support for it."
question: "Is this business idea viable, and can we convince others to back it?"
group: strategy
status: toolkit
guidePages: '14'
subtopics: ['1.1']
level: SL/HL
qualifications: [ib, secondary, undergraduate, mba, professional]
tool: business-plan
diagram: business-plan
explanation: |
  A business plan usually has eight parts: an executive summary; the business and its objectives; the market and the research behind the plan; the marketing plan; operations; people and management; the financial plan, with start-up costs, sources of finance, a sales forecast, a cash flow forecast, break-even and a profit forecast; and the risks with contingency plans.

  It does two jobs. For the owners it is a planning tool that forces them to check the idea from every side. For lenders and investors it is a case to be judged: lenders look for evidence the business can repay, investors for growth and a return, and both for realistic assumptions.
purpose: |
  To test whether a business idea or project is viable before money is committed, and to persuade others to provide finance or support. The toolkit lists it for every unit, because the plan draws on all five; its full guide is in preparation.
steps:
  - "Define the opportunity and the objectives, in SMART terms where possible."
  - "Research the market: customers, size, competitors and evidence of demand."
  - "Set out the marketing, operations and people plans that would deliver the offer."
  - "Build the financial plan: costs, finance, a sales forecast, a cash flow forecast and break-even."
  - "Identify the main risks and the contingency plan for each."
  - "Write the executive summary last, and revise the plan as the business learns."
example:
  fictional: true
  business: Wheel and Brew
  title: Wheel and Brew asks for a loan
  body: |
    The founder of Wheel and Brew, a fictional mobile coffee van, writes a business plan to borrow $18,000. It covers her target customers (commuters at two railway stations), research from a two-week trial with a borrowed van, her prices, the van and equipment costs, a twelve-month cash flow forecast and a break-even of 85 cups a day.
  result: |
    The bank's first question is about the cash flow forecast: winter sales in the trial were a third lower. She revises the plan with a lower winter forecast and an agreed overdraft for the quietest months, which makes the loan more likely, because the plan now shows she has thought about the risk.
advantages:
  - "It forces a founder to test an idea from every angle before committing money."
  - "It is the usual way to persuade lenders and investors, and sets targets to check progress against."
  - "It brings together tools from every unit, from market research to cash flow."
limitations:
  - "It is only as good as its assumptions, and forecasts for new businesses are uncertain."
  - "Writing a detailed plan takes time, and the plan can date quickly as conditions change."
  - "A polished plan can create false confidence in an untested idea."
exercise:
  prompt: |
    Write a one-page outline business plan for a small business you could run, such as tutoring, dog walking or reselling clothes. Give one sentence for each of the eight sections, and name the assumption a lender would question first.
  guidance:
    - "Be specific about the customers and the evidence of demand."
    - "Include at least one figure in the financial section, such as start-up costs or a break-even level."
    - "For the risks, give one realistic risk and a contingency plan."
    - "Explain why the assumption you name matters most to whether the business can repay."
structure:
  - name: Executive summary
    text: "The opportunity, the plan, the finance needed and what the backer can expect, written last so that it summarizes what the rest of the plan shows."
  - name: The business and its objectives
    text: "What the business does, its legal form and ownership, and objectives that can be monitored."
  - name: Market research and analysis
    text: "The target customers, the size and growth of the market, the competitors, and the evidence that customers will buy."
  - name: Marketing plan
    text: "The marketing mix for the target segment: product, price, promotion and place, and for a service the extra elements of people, process and physical evidence."
  - name: Operations and people
    text: "How the product will be made or the service delivered: premises, equipment, suppliers and the people needed, with their roles."
  - name: Financial plan
    text: "Start-up costs, sources of finance, a sales forecast, a cash flow forecast, a projected profit and the break-even point."
  - name: Risks and contingencies
    text: "The main risks, what the business would do if each happened, and the assumptions the forecasts rest on."
situations:
  suits:
    - "Asking a bank, an investor or a grant body for finance, where the plan is the evidence that the founder has thought the business through."
    - "Testing whether an idea that worked in a small trial will cover its costs at full scale."
    - "Agreeing targets and responsibilities between partners before they commit their money."
  poorFit:
    - "The earliest stage of an idea, when the customer and the model are still guesses: a canvas and cheap experiments come first."
    - "A venture that expects to change its model within months, where a long plan dates before anyone uses it."
interpretation: |
  Read a plan as a chain of assumptions that ends in a cash flow forecast. Its quality lies not in how complete it looks but in whether the figures follow from the evidence: does the sales forecast rest on research or on hope, do the costs match the operations described, and does the forecast show the month when cash is lowest?

  The two figures to find first are the break-even point and the lowest cash balance; then find the assumptions that most change them. A plan that shows its risks and its fall-back is more credible than one that shows none.
implications:
  justifies:
    - "Asking for an amount and a type of finance, over a term, that matches the gap the cash flow forecast shows."
    - "Delaying or changing a launch when the forecast shows the business cannot survive its first quiet season."
    - "Setting monitored objectives and review dates for the first year."
  doesNotJustify:
    - "Believing the forecasts because they are detailed: precision is not accuracy."
    - "Committing everything to the plan before its riskiest assumption has been tested."
mistakes:
  - mistake: "Writing the executive summary first and fitting the plan to it."
    fix: "Write it last, from the figures and the evidence the rest of the plan contains."
  - mistake: "Forecasting sales as a steady line from the first month."
    fix: "Build the forecast from research and capacity, with a slow start and seasonal months, and show the lowest cash balance it produces."
  - mistake: "Leaving the risks out to make the plan more persuasive."
    fix: "Name the main risks and the contingency for each; a lender trusts a plan that shows them."
apply:
  - href: /entrepreneurship-lab/business-plan/
    scope: full
    use: "Outline the plan section by section; it gathers the results of the Lab's other tools, so that the figures in the plan agree with them."
  - href: /entrepreneurship-lab/start-up-costs/
    scope: part
    use: "Cost the launch item by item and see how long the money would last before the business covers its costs."
  - href: /entrepreneurship-lab/revenue-planner/
    scope: part
    use: "Build the sales forecast from customers, prices and growth assumptions you can defend."

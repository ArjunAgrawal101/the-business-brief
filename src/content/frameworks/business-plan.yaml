name: The business plan
aliases: [Business plan]
summary: "A document that sets out what a new business or project will do, for whom, how it will operate and what it will cost and earn, to test an idea and win support for it."
question: "Is this business idea viable, and can we convince others to back it?"
group: strategy
status: toolkit
guidePages: '14'
subtopics: ['1.1']
level: SL/HL
qualifications: [ib, secondary, undergraduate, mba, professional]
tool: business-plan
diagram: business-plan
explanation: |
  A business plan usually has eight parts: an executive summary; the business and its objectives; the market and the research behind the plan; the marketing plan; operations; people and management; the financial plan, with start-up costs, sources of finance, a sales forecast, a cash flow forecast, break-even and a profit forecast; and the risks with contingency plans.

  It does two jobs. For the owners it is a planning tool that forces them to check the idea from every side. For lenders and investors it is a case to be judged: lenders look for evidence the business can repay, investors for growth and a return, and both for realistic assumptions.
purpose: |
  To test whether a business idea or project is viable before money is committed, and to persuade others to provide finance or support. The toolkit lists it for every unit, because the plan draws on all five; its full guide is in preparation.
steps:
  - "Define the opportunity and the objectives, in SMART terms where possible."
  - "Research the market: customers, size, competitors and evidence of demand."
  - "Set out the marketing, operations and people plans that would deliver the offer."
  - "Build the financial plan: costs, finance, a sales forecast, a cash flow forecast and break-even."
  - "Identify the main risks and the contingency plan for each."
  - "Write the executive summary last, and revise the plan as the business learns."
example:
  fictional: true
  business: Wheel and Brew
  title: Wheel and Brew asks for a loan
  body: |
    The founder of Wheel and Brew, a fictional mobile coffee van, writes a business plan to borrow $18,000. It covers her target customers (commuters at two railway stations), research from a two-week trial with a borrowed van, her prices, the van and equipment costs, a twelve-month cash flow forecast and a break-even of 85 cups a day.
  result: |
    The bank's first question is about the cash flow forecast: winter sales in the trial were a third lower. She revises the plan with a lower winter forecast and an agreed overdraft for the quietest months, which makes the loan more likely, because the plan now shows she has thought about the risk.
advantages:
  - "It forces a founder to test an idea from every angle before committing money."
  - "It is the usual way to persuade lenders and investors, and sets targets to check progress against."
  - "It brings together tools from every unit, from market research to cash flow."
limitations:
  - "It is only as good as its assumptions, and forecasts for new businesses are uncertain."
  - "Writing a detailed plan takes time, and the plan can date quickly as conditions change."
  - "A polished plan can create false confidence in an untested idea."
exercise:
  prompt: |
    Write a one-page outline business plan for a small business you could run, such as tutoring, dog walking or reselling clothes. Give one sentence for each of the eight sections, and name the assumption a lender would question first.
  guidance:
    - "Be specific about the customers and the evidence of demand."
    - "Include at least one figure in the financial section, such as start-up costs or a break-even level."
    - "For the risks, give one realistic risk and a contingency plan."
    - "Explain why the assumption you name matters most to whether the business can repay."

name: The balanced scorecard
aliases: [Balanced scorecard, Strategy map]
summary: "A way to measure performance against a strategy from four perspectives, financial, customer, internal processes, and learning and growth, rather than by profit alone."
question: "Are we on track with our strategy, and will our results last?"
group: performance
status: enrichment
subtopics: ['1.3', '3.9']
qualifications: [undergraduate, mba, professional]
origin: "Robert Kaplan and David Norton, writing on performance measurement."
diagram: balanced-scorecard
explanation: |
  Financial results show how a business has done, but they arrive late and say little about why. The balanced scorecard adds three more perspectives. The customer perspective asks how customers see the business; the internal process perspective asks which processes it must excel at; and the learning and growth perspective asks whether its people, systems and culture can keep improving.

  Each perspective has a few objectives, measures, targets and initiatives, all derived from the strategy. The perspectives are linked by cause and effect, often drawn as a strategy map: skilled, motivated people and good systems improve processes, better processes win and keep customers, and loyal customers produce the financial results. Balance means covering all four, and mixing leading measures that predict with lagging measures that confirm.
purpose: |
  To translate a strategy into a small set of measures that managers can track, so that short-term financial pressure does not crowd out the things that build long-term success, such as training, quality and customer loyalty.
steps:
  - "Start from the vision and strategy: what the organization is trying to achieve, and how."
  - "Set two or three strategic objectives in each of the four perspectives."
  - "Choose a measure for each objective, with a clear definition and data source, and a target."
  - "Link the objectives in a chain of cause and effect from learning and growth to financial results, and check the chain makes sense."
  - "Name the initiatives that will move each measure, and who owns them."
  - "Review the scorecard regularly, and change measures that encourage the wrong behaviour."
example:
  fictional: true
  business: Brookfield Community Hospital
  title: Brookfield's first scorecard
  body: |
    Brookfield Community Hospital, a fictional hospital whose strategy is to cut waiting times without raising costs, builds a scorecard with one measure in each perspective to start:

    - **Financial:** cost per patient treated, against last year's.
    - **Customer:** the share of patients who rate their care as good or very good.
    - **Internal processes:** the average wait from referral to treatment.
    - **Learning and growth:** training hours per member of staff in the new booking system.
  result: |
    The scorecard shows the chain the strategy relies on: training in the new system should cut waiting times, which should raise patient ratings without extra cost. When waiting times fall in two wards but not a third, the training measure shows the third ward had not yet been trained, which points the board to the cause rather than the symptom.
advantages:
  - "It links measures to strategy, so managers track what matters rather than what is easy to count."
  - "It balances financial results with the drivers of future performance, which discourages short-termism."
  - "The chain of cause and effect makes the strategy's assumptions explicit and testable."
limitations:
  - "Choosing a few good measures is hard; scorecards often swell into long lists that no one uses."
  - "The assumed links between perspectives may not hold, and testing them takes time and data."
  - "Measures that become targets can be gamed, which distorts behaviour."
exercise:
  prompt: |
    Design a balanced scorecard for a school canteen that wants to serve healthier food without losing money. Give one objective and one measure in each of the four perspectives, and explain the chain of cause and effect that links them.
  guidance:
    - "Make sure each measure can actually be collected, with a source and a frequency."
    - "Include at least one leading measure, such as staff trained in new recipes, as well as lagging ones such as profit."
    - "Explain the links in order, from learning and growth through processes and customers to the financial result."
    - "Name one way a measure could be gamed, and how you would guard against it."
structure:
  - name: Financial perspective
    text: "How the strategy should show in the accounts and to the owners: measures such as revenue growth, profit margin, cost per unit or return on capital employed."
  - name: Customer perspective
    text: "How the organization must look to the customers it targets: satisfaction, retention, share of the target segment, complaints or delivery on time."
  - name: Internal process perspective
    text: "The few processes it must excel at to deliver the customer and financial results: cycle times, defect rates, waiting times or the share of products launched on schedule."
  - name: Learning and growth perspective
    text: "The people, systems and culture the processes depend on: skills, training, staff turnover, information systems and engagement."
  - name: The chain of cause and effect
    text: "The scorecard's logic: learning and growth improve the processes, better processes win and keep customers, and customers drive the financial results. Each link is a claim to be tested, not a fact."
  - name: Objectives, measures, targets and initiatives
    text: "For each perspective, a few objectives; for each objective, one measure with a definition and a target; and the initiatives that should move it, each with an owner."
situations:
  suits:
    - "Turning an agreed strategy into a handful of measures people can act on, before targets are set for the year."
    - "Organizations whose financial results lag months behind the work that produces them, such as hospitals, schools or software firms, where training or new processes take time to show."
    - "Correcting a reporting system that tracks only profit or only activity, and so rewards short-term cuts."
  poorFit:
    - "A start-up still searching for its business model, whose strategy will change before the measures settle."
    - "A one-off decision, such as whether to accept an order or enter a market: the scorecard monitors a strategy rather than choosing one."
interpretation: |
  Read a scorecard across and down. Across: are the measures in each perspective moving towards their targets? Down: does the chain hold, so that the learning and process measures that improved are followed, some months later, by the customer and financial measures they were meant to move?

  A lagging financial measure with improving leading measures may simply need time. Leading measures that improve for a long period while results stay flat suggest that the strategy's assumed links are wrong. A measure that hits its target while the measure above it stalls is a warning that people may be managing the number rather than the work.
implications:
  justifies:
    - "Deciding where to look when results fall short: the scorecard points to the perspective, and the link in the chain, where the strategy is breaking down."
    - "Replacing a measure that encourages the wrong behaviour, or an initiative that has not moved its measure after a fair trial."
    - "Revisiting the strategy when a link it assumed, such as training shortening waiting times, turns out not to hold."
  doesNotJustify:
    - "Judging a person or a department on one measure taken out of the chain."
    - "Concluding that the strategy is right because every measure is on target: the measures test the strategy only if they were chosen to test its assumptions."
    - "Adding a measure for everything; a scorecard of forty measures directs attention to none of them."
mistakes:
  - mistake: "Starting from the measures already collected rather than from the strategy."
    fix: "Write the strategic objectives first, then find or build a measure for each, even if that means collecting new data."
  - mistake: "Filling each perspective with as many measures as possible."
    fix: "Keep to a few objectives in each perspective, each with one measure, and drop any measure that no decision would follow from."
  - mistake: "Treating the four perspectives as four separate lists."
    fix: "Draw the chain of cause and effect between them, and say which measure is expected to move which, and how soon."
  - mistake: "Setting targets with no owner and no initiative."
    fix: "Give each measure an owner and name the initiative that should move it; otherwise the scorecard only reports."
apply:
  - href: /finance-desk/ratios/
    scope: part
    use: "Work the measures of the financial perspective, profitability, liquidity and, at HL, efficiency and gearing, from two years of accounts in the IB layout."
  - href: /market-studio/campaign-planner/
    scope: part

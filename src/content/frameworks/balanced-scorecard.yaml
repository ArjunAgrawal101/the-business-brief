name: The balanced scorecard
aliases: [Balanced scorecard, Strategy map]
summary: "A way to measure performance against a strategy from four perspectives, financial, customer, internal processes, and learning and growth, rather than by profit alone."
question: "Are we on track with our strategy, and will our results last?"
group: performance
status: enrichment
subtopics: ['1.3', '3.9']
qualifications: [undergraduate, mba, professional]
origin: "Robert Kaplan and David Norton, writing on performance measurement."
diagram: balanced-scorecard
explanation: |
  Financial results show how a business has done, but they arrive late and say little about why. The balanced scorecard adds three more perspectives. The customer perspective asks how customers see the business; the internal process perspective asks which processes it must excel at; and the learning and growth perspective asks whether its people, systems and culture can keep improving.

  Each perspective has a few objectives, measures, targets and initiatives, all derived from the strategy. The perspectives are linked by cause and effect, often drawn as a strategy map: skilled, motivated people and good systems improve processes, better processes win and keep customers, and loyal customers produce the financial results. Balance means covering all four, and mixing leading measures that predict with lagging measures that confirm.
purpose: |
  To translate a strategy into a small set of measures that managers can track, so that short-term financial pressure does not crowd out the things that build long-term success, such as training, quality and customer loyalty.
steps:
  - "Start from the vision and strategy: what the organization is trying to achieve, and how."
  - "Set two or three strategic objectives in each of the four perspectives."
  - "Choose a measure for each objective, with a clear definition and data source, and a target."
  - "Link the objectives in a chain of cause and effect from learning and growth to financial results, and check the chain makes sense."
  - "Name the initiatives that will move each measure, and who owns them."
  - "Review the scorecard regularly, and change measures that encourage the wrong behaviour."
example:
  fictional: true
  business: Brookfield Community Hospital
  title: Brookfield's first scorecard
  body: |
    Brookfield Community Hospital, a fictional hospital whose strategy is to cut waiting times without raising costs, builds a scorecard with one measure in each perspective to start:

    - **Financial:** cost per patient treated, against last year's.
    - **Customer:** the share of patients who rate their care as good or very good.
    - **Internal processes:** the average wait from referral to treatment.
    - **Learning and growth:** training hours per member of staff in the new booking system.
  result: |
    The scorecard shows the chain the strategy relies on: training in the new system should cut waiting times, which should raise patient ratings without extra cost. When waiting times fall in two wards but not a third, the training measure shows the third ward had not yet been trained, which points the board to the cause rather than the symptom.
advantages:
  - "It links measures to strategy, so managers track what matters rather than what is easy to count."
  - "It balances financial results with the drivers of future performance, which discourages short-termism."
  - "The chain of cause and effect makes the strategy's assumptions explicit and testable."
limitations:
  - "Choosing a few good measures is hard; scorecards often swell into long lists that no one uses."
  - "The assumed links between perspectives may not hold, and testing them takes time and data."
  - "Measures that become targets can be gamed, which distorts behaviour."
exercise:
  prompt: |
    Design a balanced scorecard for a school canteen that wants to serve healthier food without losing money. Give one objective and one measure in each of the four perspectives, and explain the chain of cause and effect that links them.
  guidance:
    - "Make sure each measure can actually be collected, with a source and a frequency."
    - "Include at least one leading measure, such as staff trained in new recipes, as well as lagging ones such as profit."
    - "Explain the links in order, from learning and growth through processes and customers to the financial result."
    - "Name one way a measure could be gamed, and how you would guard against it."

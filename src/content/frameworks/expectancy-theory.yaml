name: Expectancy theory
aliases: [Vroom's expectancy theory, VIE theory]
summary: "Vroom's theory that people put in effort only when they expect it to lead to performance, expect performance to be rewarded, and value the reward."
question: "Will this incentive actually change effort, given what people believe about it?"
group: people
status: syllabus
guidePages: '26'
subtopics: ['2.4']
level: HL
qualifications: [ib, undergraduate, mba]
origin: "Victor Vroom, a psychologist who studied motivation and decision-making."
diagram: expectancy-theory
explanation: |
  Expectancy theory explains motivation as a decision built from three beliefs. Expectancy is the belief that effort will lead to the required performance: "if I try, can I hit the target?" Instrumentality is the belief that performance will lead to the reward: "if I hit it, will I really get the bonus?" Valence is the value the person places on the reward: "do I want it?"

  Motivation depends on all three together, and the theory is often written as their product. If any one is close to zero, motivation is close to zero: an unreachable target, a reward that is not reliably paid, or a reward nobody wants will each defeat an incentive scheme, however generous it looks.
purpose: |
  To design and test incentive schemes, targets and promotion systems by checking each of the three beliefs, and to diagnose why a scheme is not working. The guide names it, with equity theory, among the HL motivation theories, and asks students to evaluate it (AO3).
steps:
  - "Describe the effort, the performance target and the reward in the scheme."
  - "Judge expectancy: do people believe their effort can reach the target?"
  - "Judge instrumentality: do they trust that reaching it brings the reward?"
  - "Judge valence: do they value the reward?"
  - "Fix the weakest link, then re-check all three."
example:
  fictional: true
  business: Summit Electrical
  title: Summit Electrical's unclaimed bonus
  body: |
    Summit Electrical, a fictional wholesaler, offers its sales staff a bonus of two weeks' pay for raising sales by 30% in a year. Almost nobody tries. Staff say the target is impossible in a flat market, and last year's bonus was withdrawn when the company missed its profit forecast.
  result: |
    Expectancy theory locates the failure: expectancy is low, because the target looks out of reach, and instrumentality is low, because staff no longer trust the reward to be paid. The bonus itself is valued. Summit replaces the single target with three steps of 10% each, with a smaller bonus at each, and guarantees in writing that bonuses earned will be paid.
advantages:
  - "Shows precisely why an incentive scheme fails, and which part to fix."
  - "Takes account of individual perceptions and values, not just the size of the reward."
  - "Links motivation to target-setting, trust and the choice of rewards."
limitations:
  - "The three beliefs are hard to measure, and the multiplication is a model, not a calculation managers can do precisely."
  - "It assumes people calculate rationally, which they often do not."
  - "It says little about intrinsic motivation, where the work itself is the reward."
exercise:
  prompt: |
    A school offers students a prize for the greatest improvement in their grades over a term, but few students seem motivated by it. Use expectancy theory to explain why, and redesign the scheme so that all three beliefs are stronger.
  guidance:
    - "Analyse each of expectancy, instrumentality and valence, with a reason."
    - "Identify the weakest link and explain why it matters most."
    - "Redesign the scheme with specific changes linked to each belief."
    - "Evaluate whether an extrinsic prize is the right approach at all, using another theory."
terms: [expectancy-theory, expectancy, instrumentality, valence, motivation]
related: [equity-theory, self-determination-theory, herzbergs-motivation-hygiene-theory, mcclellands-acquired-needs-theory]
sources: [ib-bm-guide-2024]
order: 7

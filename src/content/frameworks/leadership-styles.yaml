name: Leadership styles
aliases: [The five leadership styles, Styles of leadership]
summary: "The guide's five leadership styles, autocratic, paternalistic, democratic, laissez-faire and situational, from the leader deciding alone to the team deciding."
question: "Which way of leading suits this team, this task and this moment?"
group: people
status: syllabus
guidePages: '26'
subtopics: ['2.3']
level: SL/HL
qualifications: [ib, secondary, undergraduate, mba, professional]
diagram: leadership-styles
explanation: |
  The guide names five styles. An autocratic leader decides alone and gives instructions, which is fast and clear but can stifle initiative. A paternalistic leader also decides, but explains decisions and cares for staff welfare, like a parent, which builds loyalty but can create dependence. A democratic leader involves the team in decisions, which builds commitment and draws on its knowledge but takes longer. A laissez-faire leader sets goals and leaves the team to decide how to meet them, which suits experts but can drift without clear direction. A situational leader adapts the style to the task, the urgency and the team's experience.

  The styles can be read as a range, from the leader deciding to the team deciding. No style is best everywhere; the guide asks students to evaluate which suits a given situation (AO3).
purpose: |
  To choose or evaluate a leadership style for a particular situation, and to explain why the same leader may need to lead differently at different times. The [style matcher](/topics/leadership-and-management/#ix-lead-style-matcher) in the leadership brief lets you test your choices against scenarios.
steps:
  - "Describe the situation: the task, its urgency and the risk of mistakes."
  - "Describe the team: its experience, skill and motivation."
  - "Consider the culture of the organization and the country."
  - "Choose the style that fits, and explain what it would gain and risk."
  - "Plan when the style should change, for example as a new team gains experience."
example:
  fictional: true
  business: Beacon Hospitality
  title: Beacon Hospitality's new hotel manager
  body: |
    Beacon Hospitality, a fictional hotel group, sends an experienced manager to open a new hotel with a mostly new team. In the first weeks she gives clear instructions and checks work closely. Three months later, with the team trained, she asks departments to plan their own rotas and invites ideas at weekly meetings.
  result: |
    She leads situationally: directive while the team is inexperienced and errors are costly, then more democratic as its skills grow. A single fixed style would have been either too loose at the start or too controlling later.
advantages:
  - "Gives a shared vocabulary for describing and comparing how leaders lead."
  - "Links leadership to motivation, structure and culture across the course."
  - "The situational view explains why the right style depends on context."
limitations:
  - "Real leaders mix styles, and the categories simplify behaviour."
  - "The styles say how decisions are made, but little about vision, integrity or inspiration."
  - "Situational leadership is easier to describe than to do: it needs an accurate reading of each situation."
exercise:
  prompt: |
    A restaurant's head chef must lead the kitchen through a busy Saturday service, then plan a new menu with the team on Monday. Recommend a leadership style for each situation and justify your choice, considering the team and the task.
  guidance:
    - "Link each style to features of the situation, such as time pressure and the risk of mistakes."
    - "Consider the team's experience and what would motivate it."
    - "Explain what each style would gain and what it would risk."
    - "Show why one leader might reasonably use different styles on different days."
structure:
  - name: Autocratic
    text: "The leader decides alone and gives instructions. Fast and clear in a crisis or with inexperienced staff, but it can stifle initiative and lower morale among skilled people."
  - name: Paternalistic
    text: "The leader decides, but explains the decision and looks after staff welfare, like a parent. It builds loyalty but can create dependence and resentment among those who want a say."
  - name: Democratic
    text: "The leader involves the team in decisions. It draws on their knowledge and builds commitment, but takes longer and needs a team able to contribute."
  - name: Laissez-faire
    text: "The leader sets goals and leaves the team to decide how to meet them. It suits motivated experts, but can drift where direction or skills are lacking."
  - name: Situational
    text: "The leader adapts the style to the task, its urgency and the team's experience and motivation, and changes it as they change."
  - name: The range
    text: "Read together, the styles run from the leader deciding to the team deciding, so the choice is how much control to keep and how much to share."
situations:
  suits:
    - "Choosing how to lead a new team, or a team facing a crisis, such as a hotel opening with mostly new staff."
    - "Explaining why a leader who succeeded in one setting struggles in another, such as an engineer promoted to run a creative team."
    - "Evaluating a leader's choices in a case, against the task, the team and the culture."
  poorFit:
    - "Judging a leader's integrity, vision or ability to inspire, which the styles say little about."
    - "Choosing a style from a label alone, without evidence about the task and the team."
interpretation: |
  Read the choice of style as a fit between three things: the task (its urgency and the cost of mistakes), the team (its skill, experience and motivation) and the culture (of the organization and the country). A style fits when it gives the team as much say as it can use well, and no more.

  The useful reading also looks ahead: what would make a different style right later, such as a new team gaining skills? A strong analysis names the style, the evidence for it, what it risks, and when it should change.
implications:
  justifies:
    - "A more directive style when the task is urgent, mistakes are costly and the team is inexperienced."
    - "Moving towards democratic or laissez-faire styles as a team's skill and commitment grow."
    - "Training leaders to read situations, rather than to apply one style everywhere."
  doesNotJustify:
    - "Concluding that one style is best in general."
    - "Labelling a leader by one decision; real leaders mix styles from day to day."
mistakes:
  - mistake: "Arguing that democratic leadership is always best because it involves people."
    fix: "Judge the style against the situation: in a crisis or with an untrained team, a directive style may serve people better."
  - mistake: "Confusing laissez-faire with having no leader."
    fix: "Describe laissez-faire as a deliberate choice to delegate decisions to capable people, with the goals still set."
  - mistake: "Naming a style without evidence from the case."
    fix: "Point to the task, the team and the culture in the case, and explain how each supports the style chosen."
apply:
  - href: /people-and-culture/leadership-scenarios/
    scope: full
    use: "Choose a style for each of six situations, see its likely consequences, and read why the context calls for one style rather than another; situational leadership is read from your choices across all six."
decisions: [organize]

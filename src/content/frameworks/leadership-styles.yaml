name: Leadership styles
aliases: [The five leadership styles, Styles of leadership]
summary: "The guide's five leadership styles, autocratic, paternalistic, democratic, laissez-faire and situational, from the leader deciding alone to the team deciding."
question: "Which way of leading suits this team, this task and this moment?"
group: people
status: syllabus
guidePages: '26'
subtopics: ['2.3']
level: SL/HL
qualifications: [ib, secondary, undergraduate, mba, professional]
diagram: leadership-styles
explanation: |
  The guide names five styles. An autocratic leader decides alone and gives instructions, which is fast and clear but can stifle initiative. A paternalistic leader also decides, but explains decisions and cares for staff welfare, like a parent, which builds loyalty but can create dependence. A democratic leader involves the team in decisions, which builds commitment and draws on its knowledge but takes longer. A laissez-faire leader sets goals and leaves the team to decide how to meet them, which suits experts but can drift without clear direction. A situational leader adapts the style to the task, the urgency and the team's experience.

  The styles can be read as a range, from the leader deciding to the team deciding. No style is best everywhere; the guide asks students to evaluate which suits a given situation (AO3).
purpose: |
  To choose or evaluate a leadership style for a particular situation, and to explain why the same leader may need to lead differently at different times. The [style matcher](/topics/leadership-and-management/#ix-lead-style-matcher) in the leadership brief lets you test your choices against scenarios.
steps:
  - "Describe the situation: the task, its urgency and the risk of mistakes."
  - "Describe the team: its experience, skill and motivation."
  - "Consider the culture of the organization and the country."
  - "Choose the style that fits, and explain what it would gain and risk."
  - "Plan when the style should change, for example as a new team gains experience."
example:
  fictional: true
  business: Beacon Hospitality
  title: Beacon Hospitality's new hotel manager
  body: |
    Beacon Hospitality, a fictional hotel group, sends an experienced manager to open a new hotel with a mostly new team. In the first weeks she gives clear instructions and checks work closely. Three months later, with the team trained, she asks departments to plan their own rotas and invites ideas at weekly meetings.
  result: |
    She leads situationally: directive while the team is inexperienced and errors are costly, then more democratic as its skills grow. A single fixed style would have been either too loose at the start or too controlling later.
advantages:
  - "Gives a shared vocabulary for describing and comparing how leaders lead."
  - "Links leadership to motivation, structure and culture across the course."
  - "The situational view explains why the right style depends on context."
limitations:
  - "Real leaders mix styles, and the categories simplify behaviour."
  - "The styles say how decisions are made, but little about vision, integrity or inspiration."
  - "Situational leadership is easier to describe than to do: it needs an accurate reading of each situation."
exercise:
  prompt: |
    A restaurant's head chef must lead the kitchen through a busy Saturday service, then plan a new menu with the team on Monday. Recommend a leadership style for each situation and justify your choice, considering the team and the task.
  guidance:
    - "Link each style to features of the situation, such as time pressure and the risk of mistakes."
    - "Consider the team's experience and what would motivate it."
    - "Explain what each style would gain and what it would risk."
    - "Show why one leader might reasonably use different styles on different days."

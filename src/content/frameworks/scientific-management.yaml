name: Taylor's scientific management
aliases: [Scientific management, Taylorism]
summary: "Taylor's theory that work should be studied, broken into simple tasks done the one best way, and paid by results, because money is what motivates workers."
question: "Can we raise output by redesigning the work and paying people for what they produce?"
group: people
status: syllabus
guidePages: '26'
subtopics: ['2.4']
level: SL/HL
qualifications: [ib, secondary, undergraduate, mba]
origin: "Frederick Winslow Taylor, an American engineer, writing in the early years of the twentieth century."
diagram: taylor-scientific-management
explanation: |
  Taylor believed most work was done inefficiently, by rule of thumb. Managers should study each job scientifically, timing and observing it, find the one best way to do it, and standardize it. Workers should be selected and trained for their tasks, closely supervised, and paid by results, often through piece rates, because he assumed people work mainly for money and will work harder for more of it. Planning was the managers' job; doing the work was the workers'.

  The approach raised productivity sharply in repetitive work and still shapes standard procedures, time targets and data-driven monitoring, which the guide calls digital Taylorism (5.9). Its critics point to what it leaves out: people's social needs, their wish for interesting work and a voice, and the boredom, stress and conflict that close control and repetitive tasks can cause, which is where Maslow and Herzberg begin.
purpose: |
  To understand the oldest of the motivation theories the guide names, its assumption that pay is the main motivator, and why it still appears in workplaces that measure and reward output closely. The guide asks students to evaluate it (AO3).
steps:
  - "Identify a job and its tasks, and how output is measured."
  - "Ask how far the job is standardized and timed, and how pay is linked to output."
  - "Judge the effect on productivity, and on quality, morale and labour turnover."
  - "Compare with what Maslow, Herzberg or self-determination theory would predict for the same job."
  - "Conclude whether a Taylorist approach suits this work and this workforce."
example:
  fictional: true
  business: Swiftpack Fulfilment
  title: Swiftpack's warehouse targets
  body: |
    Swiftpack Fulfilment, a fictional warehouse operator, times every picking route, sets each worker a target of items per hour and pays a bonus for each item over the target, all tracked by handheld scanners. Output rises by a fifth in three months.
  result: |
    By Taylor's measure the change works. But labour turnover also rises, errors increase as people rush, and exit interviews mention stress and feeling watched. Swiftpack keeps the timed routes but adds team targets, job rotation and a say in route design, a mix of Taylor's methods with the motivators he ignored.
advantages:
  - "Raises productivity and consistency in simple, repetitive work."
  - "Clear standards and pay linked to output are easy to understand and measure."
  - "Its methods underlie efficient operations, quality standards and much of lean production's attention to process."
limitations:
  - "It treats people as motivated only by money, ignoring social and psychological needs."
  - "Repetitive, closely controlled work can cause boredom, stress, absence and high turnover."
  - "Paying for quantity can reduce quality, and it suits creative or complex work poorly."
exercise:
  prompt: |
    A call centre pays its staff a bonus for every call completed per hour and records every call's length. Evaluate this approach using Taylor's scientific management and one other motivation theory from the guide.
  guidance:
    - "Explain the Taylorist features of the approach: measurement, standard methods and pay by results."
    - "Weigh the likely gains in output against the effects on quality, customers and staff."
    - "Bring in a second theory, such as Herzberg's, to show what Taylor's view leaves out."
    - "End with a judgement on whether, and how, the call centre should change its approach."

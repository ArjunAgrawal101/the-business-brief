name: Lewin's change model
aliases: ["Unfreeze, change, refreeze", "Lewin's three-stage model"]
summary: "A three-stage model of change: unfreeze the current state, move to the new one, then refreeze so that the new way becomes stable."
question: "How do we move people from the way things are done now to a new way, and make it stick?"
group: change
status: enrichment
subtopics: ['2.1']
qualifications: [undergraduate, mba, professional]
origin: "Kurt Lewin, a social psychologist, who also gave force field analysis."
diagram: lewin-change-model
explanation: |
  Lewin saw an organization's current behaviour as an equilibrium held in place by opposing forces. Change happens in three stages. Unfreezing makes people ready to let go of the current way, by showing why it no longer works and by weakening the forces that keep it in place. Changing, or moving, introduces the new way, with training, support and communication, through a period of uncertainty in which performance often dips. Refreezing makes the new way stable, by aligning systems, rewards, structures and culture so that people do not slide back.

  The model is closely tied to force field analysis, the IB toolkit tool that also comes from Lewin. Unfreezing is the work of strengthening the driving forces or, often more effectively, weakening the restraining forces that the force field analysis has identified.
purpose: |
  To plan a change as a process with distinct stages, each needing different actions, and to explain why changes fail when organizations rush into the new way without unfreezing the old, or never refreeze.
steps:
  - "Describe the current state and the desired state, and the gap between them."
  - "List the forces for and against the change, using a force field analysis."
  - "Unfreeze: make the case with evidence, involve the people affected and reduce the strongest restraining forces."
  - "Change: introduce the new way with training and support, communicate often, and adjust as problems appear."
  - "Refreeze: change the systems, rewards and routines so they support the new way, and remove the old ones."
example:
  fictional: true
  business: Crumb and Co
  title: Crumb and Co goes digital
  body: |
    Crumb and Co, a fictional chain of six bakeries, wants branches to order flour and supplies through a tablet app instead of phoning the depot.

    To **unfreeze**, the owner shares figures on the waste caused by misheard phone orders and asks two branch managers to help choose the app. To **change**, the depot trains staff branch by branch and keeps the phone line open for a month. To **refreeze**, it then closes the phone line for orders, adds the app to every new starter's induction and reviews ordering errors at monthly meetings.
  result: |
    Ordering errors fall, and they stay low because the old route has gone and the new one is built into routines. The owner notes that the branch which skipped the briefing resisted longest, which is the unfreezing stage showing its worth.
advantages:
  - "Simple and memorable, with a clear sequence that managers can plan around."
  - "It explains common failures: changes that skip unfreezing meet resistance, and changes that skip refreezing fade."
  - "It connects directly with force field analysis, which gives the unfreezing stage practical tools."
limitations:
  - "It treats organizations as stable between changes, which fits fast-moving businesses where change is constant less well."
  - "It is a broad outline that says little about how to carry out each stage in detail."
  - "Refreezing can lock in rigidity if the organization then needs to change again soon."
exercise:
  prompt: |
    A café plans to stop taking cash and accept only card and phone payments. Use Lewin's three stages to plan the change, with at least two actions for each stage, and explain which stage you think the café is most likely to get wrong.
  guidance:
    - "For unfreezing, give evidence the café could share and the restraining forces it would need to weaken, such as regular customers who prefer cash."
    - "For changing, think about staff training and how to support customers during the switch."
    - "For refreezing, say what would stop the old way returning."
    - "Link your judgement to the café's stakeholders, such as staff, regular customers and suppliers."

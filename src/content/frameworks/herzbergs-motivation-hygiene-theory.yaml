name: Herzberg's motivation-hygiene theory
aliases: [Two-factor theory, Motivation-hygiene theory, Herzberg]
summary: "Herzberg's theory that hygiene factors, such as pay and conditions, only prevent dissatisfaction, while motivators, such as responsibility and recognition, create real motivation."
question: "Are we only stopping people being dissatisfied, or are we actually motivating them?"
group: people
status: syllabus
guidePages: '26'
subtopics: ['2.4']
level: SL/HL
qualifications: [ib, secondary, undergraduate, mba]
origin: "Frederick Herzberg, an American psychologist, from interviews about good and bad experiences at work."
diagram: herzberg-two-factor
explanation: |
  Herzberg found that the things that made people unhappy at work were different from the things that made them work harder. Hygiene factors are about the conditions around the job: pay, working conditions, job security, company policy, supervision and relationships. If they are poor, people are dissatisfied; if they are good, people are not dissatisfied, but they are not motivated either. Motivators are about the work itself: achievement, recognition, the work itself, responsibility and advancement. These create satisfaction and effort.

  The two sets of factors lie on separate scales, so fixing hygiene factors brings people to a neutral point rather than motivating them. The practical consequence is job enrichment: redesigning jobs to give people more responsibility, a complete piece of work and recognition for it.
purpose: |
  To explain why pay rises and better conditions may stop complaints without raising effort, and to design jobs that motivate. The guide names the theory with Taylor and Maslow and asks students to evaluate it (AO3).
steps:
  - "List the hygiene factors in the job and judge whether each is adequate."
  - "Fix any hygiene factor that is causing dissatisfaction; nothing else will work until it is."
  - "List the motivators the job offers, and those it lacks."
  - "Redesign the job to add motivators, for example through job enrichment or empowerment."
  - "Evaluate the result, and whether the theory fits these employees."
example:
  fictional: true
  business: Meridian Labs
  title: Meridian Labs' pay rise that changed nothing
  body: |
    Meridian Labs, a fictional testing laboratory, gives its technicians an 8% pay rise after complaints about pay. Complaints stop, but the error rate and the time taken on each test do not improve. Technicians carry out the same tests every day, follow every result up with a supervisor and never see what their work is used for.
  result: |
    Herzberg's theory explains the pattern: the pay rise fixed a hygiene factor and removed dissatisfaction, but the job still lacked motivators. Meridian lets experienced technicians sign off their own results, rotates them through different tests and shares the impact of their work with clients, and the error rate falls.
advantages:
  - "Distinguishes removing dissatisfaction from creating motivation, a useful insight for managers."
  - "Leads to practical job design: enrichment, responsibility and recognition."
  - "Explains why pay rises often have short-lived effects on effort."
limitations:
  - "The research relied on people's accounts of good and bad times, which may lead them to credit themselves for success and blame conditions for failure."
  - "For some people pay is a motivator, for example where it signals recognition or achievement."
  - "Enriched jobs are harder to create in routine work, and not everyone wants more responsibility."
exercise:
  prompt: |
    A supermarket's checkout staff complain about low pay and repetitive work. The manager can afford either a 5% pay rise or a programme of job rotation and responsibility for parts of the store. Use Herzberg's theory to evaluate the two options and recommend one.
  guidance:
    - "Classify each option as a hygiene factor or a motivator, and explain the theory's prediction for each."
    - "Consider whether pay is currently low enough to cause dissatisfaction that must be fixed first."
    - "Weigh the costs and practical difficulties of each option."
    - "Make a recommendation, and say when the theory might not apply."

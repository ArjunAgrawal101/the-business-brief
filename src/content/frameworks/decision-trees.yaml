name: Decision trees
aliases: [Decision tree, Decision-tree analysis]
summary: "A diagram of the options in a decision and their possible outcomes, with probabilities and payoffs, used to compare options by their expected value."
question: "Taking the risks into account, which option is likely to pay off best?"
group: strategy
status: toolkit
guidePages: '14'
subtopics: ['1.5', '5.4']
level: SL/HL
qualifications: [ib, undergraduate, mba, professional]
tool: decision-trees
diagram: decision-tree
studio: decision-tree
explanation: |
  A decision tree is drawn from left to right. A square, the decision node, branches into the options, each with its cost. A circle, a chance node, branches into the possible outcomes of an option, each with a probability (the probabilities at a node add up to 1) and a payoff. The tree is then worked from right to left: the expected value at each chance node is the sum of each payoff times its probability, and the net expected value of an option is that figure minus the option's cost. The option with the highest net expected value is preferred on the numbers, and the others are marked as rejected.

  The method makes uncertainty explicit, but it is only as good as its estimates, and expected value treats a risky option and a safe one with the same average as equal, which a cautious business may not.
purpose: |
  To compare options whose outcomes are uncertain, using numbers that can be questioned and tested. The toolkit guide sets out the method in full, with an interaction for building and testing a tree.
steps:
  - "Draw the decision node and the options, with the cost of each."
  - "Draw a chance node for each option's outcomes, with probabilities that add up to 1 and a payoff for each."
  - "Work from right to left: calculate the expected value at each chance node."
  - "Subtract each option's cost to find its net expected value, and mark the rejected branches."
  - "Test how sensitive the choice is to the probabilities, and add the qualitative factors."
example:
  fictional: true
  business: Coastline Kayaks
  title: Coastline Kayaks chooses where to expand
  body: |
    Coastline Kayaks, a fictional rental business, can open a second beach site for $40,000 or upgrade its current site for $15,000.

    - **New site:** a 60% chance of a busy summer earning $90,000 and a 40% chance of a quiet one earning $30,000. Expected value = 0.6 × $90,000 + 0.4 × $30,000 = $66,000; net of the cost, $26,000.
    - **Upgrade:** a 70% chance of $45,000 and a 30% chance of $25,000. Expected value = 0.7 × $45,000 + 0.3 × $25,000 = $39,000; net of the cost, $24,000.
  result: |
    On the numbers the new site is slightly ahead, $26,000 against $24,000, but the gap is small and the new site has the wider range of outcomes: in a quiet summer it would earn $10,000 less than it cost, while the upgrade covers its cost in both. A cautious owner could reasonably choose the upgrade.
advantages:
  - "It makes the options, risks and assumptions visible and open to challenge."
  - "Expected values give a consistent basis for comparing uncertain options."
  - "It shows how sensitive a decision is to its probabilities."
limitations:
  - "Probabilities and payoffs are estimates, often guesses, so the precision can be false."
  - "Expected value ignores attitudes to risk and the spread of outcomes."
  - "It leaves out qualitative factors such as staff, ethics and reputation."
exercise:
  prompt: |
    A school drama club must choose between staging one big musical, with a 50% chance of a $6,000 profit and a 50% chance of a $1,000 loss, and two smaller plays that will almost certainly make $1,800 each. Draw the decision tree, calculate the expected values and recommend a choice.
  guidance:
    - "Check the probabilities at each chance node add up to 1."
    - "Show the working: probability times payoff, added, for each option."
    - "Compare the expected values, then consider the risk of a loss."
    - "Add one qualitative factor that might change the recommendation."
structure:
  - name: Decision nodes (squares)
    text: "Points where the manager chooses between options, each branch carrying the cost of choosing it."
  - name: Chance nodes (circles)
    text: "Points where the outcome is uncertain. The branches out of each one carry probabilities that add up to 1."
  - name: Outcomes and payoffs
    text: "The end of each branch, with the financial result if that outcome happens."
  - name: Expected values
    text: "Worked from right to left: at each chance node, the sum of each probability multiplied by its payoff."
  - name: Net expected values and the choice
    text: "At each decision node, the expected value of each option minus its cost. The option with the highest value is chosen and the others are crossed out."
situations:
  suits:
    - "Choosing between a few options whose outcomes are uncertain but can be estimated, such as opening a second site or upgrading the first."
    - "Decisions taken in stages, where a later choice depends on an earlier outcome, such as a trial followed by a full launch."
    - "Showing how sensitive a choice is to an uncertain probability, by finding the probability at which the decision would change."
  poorFit:
    - "Decisions where the probabilities cannot be estimated with any honesty, such as a new technology's adoption over a decade; scenarios serve better."
    - "One-off decisions where a single bad outcome would ruin the business, so the average matters less than the worst case."
interpretation: |
  The expected value is the average result the option would give if the same decision could be taken many times. It ranks options on the numbers, but a decision is usually taken once, so read the spread of outcomes as well: the worst result, and the chance of a loss behind each option.

  When two options are close, the ranking is fragile, and small changes in a probability may reverse it; find the probability at which the decision would change and ask how confident anyone can be on either side of it. The figures are only as good as the estimates, so the tree's chief value is often that it makes those estimates explicit and open to challenge.
implications:
  justifies:
    - "Preferring the option with the highest expected value when the gap is clear and the worst outcome is affordable."
    - "Choosing a lower-value option with a narrower spread when the business cannot bear the worst outcome of the other."
    - "Investing in information, such as a trial or market research, when the decision turns on a probability no one can estimate well."
  doesNotJustify:
    - "Treating the expected value as the result the business will receive: no single outcome need equal it."
    - "Ignoring qualitative factors, such as staff, reputation and ethics, which the tree leaves out."
    - "Precise conclusions from rough estimates; a gap of a few per cent between options is within the error of the guesses."
mistakes:
  - mistake: "Probabilities at a chance node that do not add up to 1."
    fix: "List every outcome at the node and check that the probabilities sum to exactly 1."
  - mistake: "Forgetting to subtract the cost of each option."
    fix: "Subtract the cost at the decision node, after working out the expected value of its chance node."
  - mistake: "Working from left to right."
    fix: "Roll back from the outcomes on the right: expected values first, then costs, then the choice."
  - mistake: "Recommending on expected value alone."
    fix: "Add the spread, the worst case and the qualitative factors, and say how confident the estimates are."
apply:
  - href: /strategy-studio/decision-tree/
    scope: full
    use: "Build a tree of any shape with decision and chance nodes; it checks that probabilities add up, rolls back the expected values net of costs, marks the best branch and shows the worst result and the chance of a loss behind each option."
  - href: /strategy-studio/scenarios/
    scope: part
    use: "Where the probabilities cannot honestly be estimated, test the options against four scenarios instead of averaging over them."

name: Equity theory
aliases: [Adams's equity theory]
summary: "The theory that people compare what they put into their work and get out of it with what others put in and get out, and lose motivation when the comparison feels unfair."
question: "Do our people believe they are treated fairly compared with others?"
group: people
status: syllabus
guidePages: '26'
subtopics: ['2.4']
level: HL
qualifications: [ib, undergraduate, mba]
origin: "J. Stacy Adams, a workplace psychologist."
diagram: equity-theory
explanation: |
  Equity theory says people judge fairness by comparing ratios. Each person weighs their outcomes (pay, benefits, recognition, promotion) against their inputs (effort, skill, experience, time, loyalty), and compares that ratio with a referent: a colleague, someone doing similar work elsewhere, or their own past. If the ratios feel equal, they feel fairly treated. If they feel under-rewarded, they may reduce their effort, ask for more, change whom they compare themselves with, or leave. Feeling over-rewarded can also cause discomfort, though people tolerate it more easily.

  What matters is perception: people act on what they believe others receive, which is why secrecy about pay, or a promotion that is not explained, can damage motivation as much as the amounts involved.
purpose: |
  To understand reactions to pay, promotion and workload decisions, and to design reward systems that are, and are seen to be, fair. The guide names it, with expectancy theory, among the HL motivation theories, and asks students to evaluate it (AO3).
steps:
  - "Identify the group of employees and the decision that affects their outcomes or inputs."
  - "Identify whom they are likely to compare themselves with."
  - "Compare the perceived ratios of outcomes to inputs."
  - "Predict the response to any perceived unfairness: less effort, demands, or leaving."
  - "Recommend ways to restore fairness, including better explanation of how rewards are set."
example:
  fictional: true
  business: Granite and Glass
  title: Granite and Glass hires above the old rates
  body: |
    Granite and Glass, a fictional kitchen fitter, struggles to recruit, so it hires two new fitters on a higher hourly rate than its experienced fitters earn. Word spreads within a week. The experienced fitters, who train the new ones, start refusing overtime.
  result: |
    Equity theory predicts the reaction: the experienced fitters compare their ratio of pay to experience and effort with the newcomers' and feel under-rewarded. The firm raises the experienced fitters' rate to match and adds a payment for training new staff, and explains the new pay structure openly.
advantages:
  - "Explains why relative pay and fairness can matter as much as the amount of pay."
  - "Highlights the importance of transparency and clear criteria for rewards and promotion."
  - "Helps predict reactions to pay changes, recruitment and restructuring."
limitations:
  - "Perceptions of inputs, outcomes and referents are personal and hard to measure."
  - "People differ in how sensitive they are to unfairness."
  - "It explains reactions to unfairness better than what positively motivates people."
exercise:
  prompt: |
    A company gives a bonus to its sales team after a record year, but not to the customer service team that handled the extra orders. Use equity theory to predict the customer service team's response, and recommend how the company should respond.
  guidance:
    - "Identify the inputs and outcomes each team is likely to compare."
    - "Predict specific responses, such as reduced effort or higher turnover."
    - "Recommend a response that restores perceived fairness, financial or not."
    - "Evaluate how far the theory explains the situation, and what else might matter."
terms: [equity-theory, motivation, financial-rewards, performance-related-pay]
related: [expectancy-theory, herzbergs-motivation-hygiene-theory, maslows-hierarchy-of-needs]

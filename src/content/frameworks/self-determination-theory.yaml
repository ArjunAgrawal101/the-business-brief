name: Self-determination theory
aliases: [Deci and Ryan's self-determination theory, SDT]
summary: "Deci and Ryan's theory that people are most motivated, and do their best work, when their needs for autonomy, competence and relatedness are met."
question: "Does this work let people choose how they work, grow their skills and feel connected?"
group: people
status: syllabus
guidePages: '26'
subtopics: ['2.4']
level: HL
qualifications: [ib, undergraduate, mba]
origin: "Edward Deci and Richard Ryan, American psychologists."
diagram: self-determination-theory
explanation: |
  Self-determination theory holds that people have three basic psychological needs. Autonomy is the need to act with a sense of choice and to endorse what one does, not to feel controlled. Competence is the need to feel effective and to grow in skill. Relatedness is the need to feel connected to others and to belong. When work supports these needs, motivation becomes more autonomous, and people work with more persistence, creativity and wellbeing.

  The theory also says that the type of motivation matters, not only its amount. Controlled motivation, from pressure, surveillance or rewards that feel controlling, can produce effort in the short term but tends to crowd out intrinsic motivation, especially for interesting and complex tasks. Autonomy does not mean working alone or without goals; it means having a say in how the goals are reached.
purpose: |
  To design jobs, management styles and rewards that build lasting, high-quality motivation, and to explain why heavy monitoring or controlling incentives can backfire. The guide names it among the HL motivation theories and asks students to evaluate it (AO3).
steps:
  - "Examine how much choice people have over how they do their work (autonomy)."
  - "Examine whether they can build skills and see their progress (competence)."
  - "Examine whether they feel connected to colleagues and the organization (relatedness)."
  - "Identify practices that undermine the needs, such as close surveillance or controlling targets."
  - "Recommend changes that support all three, and evaluate them against the costs and the context."
example:
  fictional: true
  business: Tidewater Software
  title: Tidewater Software's support team
  body: |
    Tidewater Software, a fictional company, measures its customer support staff on calls handled per hour and reads every script they use. Staff follow the script even when it does not fit the problem, and many leave within a year.
  result: |
    Through self-determination theory, the job undermines all three needs: no choice over how to help customers, no growth in skill, and little contact with colleagues. Tidewater lets experienced staff solve problems their own way, sets up a weekly session where staff share difficult cases, and adds a skills ladder. Customer ratings rise, and fewer staff leave.
advantages:
  - "Explains the quality as well as the strength of motivation, and why controlling rewards can backfire."
  - "Gives clear, practical levers: choice, growth and connection."
  - "Fits well with empowerment, teamwork and purpose among the guide's non-financial rewards."
limitations:
  - "Autonomy can be harder to give in roles with strict safety or legal rules."
  - "The needs are hard to measure, so judging whether they are met can be subjective."
  - "It can understate the role of pay and security for people on low incomes."
exercise:
  prompt: |
    A hospital wants to motivate its nurses without raising pay. Using self-determination theory, recommend one change for each of the three needs and evaluate whether the theory is enough to explain nurses' motivation.
  guidance:
    - "Give a specific change for autonomy, competence and relatedness, suited to a hospital."
    - "Explain the mechanism: how each change supports the need."
    - "Consider constraints, such as clinical rules that limit autonomy."
    - "Evaluate the theory against another, such as Herzberg's view of pay as a hygiene factor."
terms: [self-determination-theory, autonomy, competence, relatedness, intrinsic-motivation, extrinsic-motivation]

name: Mendelow's matrix
aliases: [Stakeholder mapping, Power-interest grid, Power-interest matrix]
summary: "A grid that places each stakeholder group by its power over a decision and its interest in it, to decide how closely to involve each one."
question: "Which stakeholders must we manage closely on this decision, and which can we simply keep informed?"
group: environment
status: enrichment
subtopics: ['1.4']
qualifications: [undergraduate, mba, professional]
origin: "Usually credited to Aubrey Mendelow, who wrote on how organizations scan their environment."
diagram: stakeholder-mapping
studio: stakeholder-map
explanation: |
  The matrix plots stakeholders on two axes: their power to affect the organization or the decision, and their interest in it. Groups with high power and high interest are key players to manage closely and involve early. Groups with high power but low interest are kept satisfied, so that they do not become opponents. Groups with low power but high interest are kept informed, because they care and can gain power, for example by joining forces or attracting the media. Groups with low power and low interest are monitored with little effort.

  The IB guide's statements for 1.4 are internal and external stakeholders and conflict between stakeholders (p. 24); it does not name stakeholder mapping, so the matrix is enrichment for the course, though it is widely taught beside 1.4. Positions are specific to a decision and change over time, so a map is redrawn for each major decision.
purpose: |
  To prioritize stakeholders before a decision and plan how to engage each group, so that the business neither ignores a powerful group nor spends equal effort on everyone. It turns stakeholder conflict, which the guide does name, into a plan for handling it.
steps:
  - "Name the decision, because power and interest depend on the issue."
  - "List the stakeholder groups, internal and external, specifically enough to act on, such as 'night-shift staff' rather than 'employees'."
  - "Judge each group's power over this decision and its interest in it, with a reason for each."
  - "Place each group in a quadrant and decide how to engage it: manage closely, keep satisfied, keep informed or monitor."
  - "Look for groups that could move, such as a low-power group gaining media attention, and plan for that."
example:
  fictional: true
  business: Harrow Valley Foods
  title: Harrow Valley Foods plans a new warehouse
  body: |
    Harrow Valley Foods, a fictional food distributor, plans a warehouse on the edge of a village. Its map places:

    - **The local council** (planning permission): high power, high interest, a key player to consult from the start.
    - **The bank** financing the build: high power, low interest in the details, to be kept satisfied with regular reports.
    - **Village residents** worried about lorry traffic: low power alone, high interest, to be kept informed and consulted on lorry routes.
    - **Its existing customers:** low interest in this decision, to be monitored.
  result: |
    The map showed that the residents could gain power through the council's planning process, so Harrow treats them almost as key players: it agrees lorry routes away from the school and holds an open evening before submitting its plans. Planning permission is granted with fewer objections than the firm expected.
advantages:
  - "Quick, visual and easy to explain, which helps a team agree whom to involve and how."
  - "It links stakeholder analysis to action: a different engagement approach for each quadrant."
  - "It prompts managers to consider groups whose power or interest could change."
limitations:
  - "Power and interest are judgements, often made by managers with their own interests."
  - "It shows each group's position but not what each wants, or how groups might combine."
  - "It is a snapshot for one decision; positions change, so a map can go out of date quickly."
exercise:
  prompt: |
    A town's only cinema plans to close two of its four screens to open a café. Draw a stakeholder map for the decision with at least six groups, and explain how the cinema should engage the two groups you think matter most.
  guidance:
    - "Include internal and external groups, named specifically."
    - "Give a reason for each group's power and interest in this decision, not in general."
    - "Use the quadrant to choose an engagement approach, and say what the cinema would actually do."
    - "Name one group whose position could change, and what would change it."

name: The value chain
aliases: [Value chain analysis, Porter's value chain]
summary: "A way of breaking a business down into the activities that create value for its customers, to see where its costs and its advantages really come from."
question: "Which of our activities create value customers will pay for, and which only add cost?"
group: strategy
status: enrichment
subtopics: ['1.1', '5.1']
qualifications: [undergraduate, mba, professional]
origin: "Michael Porter, in his work on competitive advantage."
diagram: value-chain
explanation: |
  The value chain treats a business as a sequence of activities rather than as departments or a set of accounts. Five primary activities move the product from inputs to the customer: inbound logistics, operations, outbound logistics, marketing and sales, and service. Four support activities make all of them possible: the firm's infrastructure (management, planning, finance and quality systems), human resource management, technology development and procurement.

  Each activity costs money and can add value. The margin is the difference between what customers will pay for the whole and the cost of performing every activity. Competitive advantage comes from performing some activities more cheaply than rivals, or performing them in a distinctive way that customers value, and from the links between activities: better design can cut the cost of service, and closer purchasing can raise the quality of operations.
purpose: |
  To find the sources of a business's cost position and its differentiation, so that managers know which activities to protect and invest in, which to improve, and which another firm could do better and more cheaply. It connects the IB idea of added value to decisions about outsourcing, integration and strategy.
steps:
  - "Define the business unit and the product the analysis is for. A firm with very different products may need a separate chain for each."
  - "Map its activities onto the five primary and four support categories, in the business's own terms, such as 'roasting' rather than 'operations'."
  - "Estimate what each activity costs, at least roughly, and where the largest costs sit."
  - "Ask which activities customers notice and value: where the business is better, or different, from rivals."
  - "Look at the links: where one activity raises or lowers the cost or quality of another."
  - "Decide what follows: activities to strengthen, to redesign, to outsource or to bring in house."
example:
  fictional: true
  business: Ridgeback Roasters
  title: Ridgeback Roasters looks for its edge
  body: |
    Ridgeback Roasters, a fictional coffee roaster, sells beans to sixty independent cafés. Its value chain analysis finds three things.

    - **Inbound logistics** is distinctive: it buys directly from twelve farms, which gives it beans rivals cannot easily get and stories its cafés use in their marketing.
    - **Service** is valued: it trains each café's baristas, and cafés that receive training reorder more often than those that do not.
    - **Operations** includes packaging the beans, which costs it more per bag than a specialist packer charges and adds nothing customers notice.
  result: |
    Ridgeback's advantage sits at the two ends of its chain, sourcing and service, not in the middle. The analysis supports outsourcing packaging, which frees cash and space, and investing the savings in more barista training, the activity that links most directly to repeat orders.
advantages:
  - "It looks inside the business at activities, which explains where an advantage comes from in a way a profit figure cannot."
  - "It shows how activities connect, so that improvements are judged by their effect on the whole chain, not one department."
  - "It gives a clear basis for decisions on outsourcing, integration and investment."
limitations:
  - "It was designed around manufacturing; service, platform and digital businesses fit its categories less neatly."
  - "Costing activities, rather than departments, needs data many businesses do not keep."
  - "It describes one firm's activities and can miss value created with suppliers, partners and customers across a wider network."
exercise:
  prompt: |
    Choose a business you know well as a customer, such as a café, a gym or an online clothes shop. Map its main activities onto the primary and support activities, then pick the one activity you think creates most of the value you pay for and the one that adds cost without adding value. What should the business do about each?
  guidance:
    - "Use the business's own activities, not just the nine headings; name what actually happens at each stage."
    - "Back the choice of the most valuable activity with your experience as a customer, such as why you return."
    - "For the costly activity, consider whether it could be done more cheaply, redesigned or handed to a specialist, and what could go wrong if it were."
    - "Mention at least one link between activities, because that is where many advantages hide."
terms: [value-chain, added-value, competitive-advantage, core-competence, outsourcing, supply-chain]

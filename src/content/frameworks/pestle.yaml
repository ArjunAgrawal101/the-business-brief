name: PESTLE against STEEPLE
aliases: [PESTLE analysis, PEST analysis, PESTEL]
summary: "The family of checklists for scanning a business's external environment, and how the IB toolkit's STEEPLE extends the common PESTLE by giving ethics a heading of its own."
question: "Which forces outside the business could change its decision, and have we missed any?"
group: environment
status: enrichment
subtopics: ['1.5', '2.1', '4.6']
qualifications: [undergraduate, mba, professional]
diagram: pestle-steeple
explanation: |
  PEST, PESTLE and STEEPLE are versions of the same idea: a checklist of external factors, outside the business's control, that could affect a decision. PEST covers political, economic, social and technological factors. PESTLE adds legal and environmental factors. STEEPLE, the version in the IB toolkit, adds ethical factors as a seventh heading.

  The difference matters more than it looks. In PESTLE, ethical questions such as fair pay in the supply chain or honest marketing tend to be squeezed under social or legal, where they can be lost or reduced to what the law requires. STEEPLE asks about them directly. Outside the IB course, PESTLE (sometimes written PESTEL) is the version most often used in universities and business; the analysis itself is the same.
purpose: |
  To scan the external environment systematically before a decision, so that opportunities and threats are not missed, and to feed those findings into a SWOT analysis. Knowing both labels lets IB students read business sources that use PESTLE and translate them into the course's STEEPLE.
steps:
  - "Name the decision the scan is for, such as entering a new country or launching a product."
  - "Go through each heading and list factors that could affect that decision, with evidence and a date for each."
  - "If you start from PESTLE, ask the ethical question separately: what would a fair-minded stakeholder object to?"
  - "Judge each factor's likely direction, size and timing, and cut the ones that do not bear on the decision."
  - "Carry the most important factors into the opportunities and threats of a SWOT, and into the options you compare."
example:
  fictional: true
  business: Lumen Bikes
  title: Lumen Bikes scans a new market
  body: |
    Lumen Bikes, a fictional maker of electric bicycles, considers selling in a neighbouring country. A PESTLE scan by a consultant lists subsidies for electric vehicles (political), rising fuel prices (economic), more people cycling to work (social), better batteries (technological), new safety rules for electric bikes (legal) and city plans for cycle lanes (environmental).

    Reworking it as a STEEPLE analysis, Lumen's managers add an ethical heading and ask a question the scan had skipped: the cobalt in their batteries comes from a supplier that cannot show how it was mined.
  result: |
    The extra heading changed the decision. The market looked attractive on every PESTLE factor, but the ethical risk in the supply chain could damage the brand in a market where buyers care about sustainability. Lumen delays the launch until it can source batteries with a traceable supply chain.
advantages:
  - "A simple, memorable checklist that makes a scan of the environment systematic."
  - "Knowing the family of versions helps in reading sources that use PEST or PESTLE and comparing them fairly."
  - "STEEPLE's ethical heading brings questions of right and wrong into the analysis instead of leaving them to chance."
limitations:
  - "A checklist can produce long, unranked lists; the value lies in judging which factors matter."
  - "Factors overlap: a climate law is environmental, legal and political at once, and where it is listed matters less than what it means."
  - "It is a snapshot of a changing environment and needs updating as conditions change."
exercise:
  prompt: |
    Take a business decision from the news or your own experience, such as a supermarket deciding whether to stop selling single-use plastic bags. Carry out a PESTLE analysis, then add the ethical heading to make it a STEEPLE analysis. Does the ethical heading add anything the other six missed?
  guidance:
    - "Give one specific, dated factor under each heading rather than general words such as 'the economy'."
    - "Keep the decision in view: include only factors that would change it."
    - "On the ethical heading, ask what stakeholders would consider right or wrong, beyond what the law requires."
    - "End with a judgement on the two or three factors that matter most, and why."

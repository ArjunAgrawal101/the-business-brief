name: SWOT analysis
aliases: [SWOT]
summary: "A summary of a business's internal strengths and weaknesses and the external opportunities and threats it faces, as the starting point for a decision."
question: "Where does the business stand before it decides, inside and out?"
group: environment
status: toolkit
guidePages: '14'
subtopics: ['1.3', '1.5', '4.2']
level: SL/HL
qualifications: [ib, secondary, undergraduate, mba, professional]
tool: swot-analysis
diagram: swot
studio: swot
explanation: |
  A SWOT sorts the evidence about a business into four boxes. Strengths and weaknesses are internal, within the business's control: its skills, finances, brand, assets and costs. Opportunities and threats are external, outside its control: markets, competitors, technology, the economy and regulation, which a STEEPLE analysis can supply.

  A SWOT does not decide anything. Its value lies in what comes after the four lists: ranking the points that matter for the decision, and drawing the implications, such as a strength that matches an opportunity, or a weakness that a threat could exploit.
purpose: |
  To organize what is known about a business's position before comparing options, so that a recommendation builds on its strengths and deals with its most serious threat. The toolkit guide sets out the full method and a worked case.
steps:
  - "State the decision the SWOT is for; without one there is no way to judge what matters."
  - "List strengths and weaknesses (internal) and opportunities and threats (external), each backed by evidence."
  - "Rank the points by their importance to the decision and cut the rest."
  - "Draw the implications: which strengths meet which opportunities, and where a threat meets a weakness."
example:
  fictional: true
  business: Pinecrest Outdoor
  title: Pinecrest Outdoor weighs a move online
  body: |
    Pinecrest Outdoor, a fictional camping shop with two stores, is deciding whether to start selling online.

    - **Strengths:** staff who know the products deeply; a loyal local customer base.
    - **Weaknesses:** no experience of e-commerce; a small marketing budget.
    - **Opportunities:** more people camping since the town opened a new national park visitor centre; customers asking for online orders.
    - **Threats:** large online retailers with lower prices; rising delivery costs.
  result: |
    Pinecrest's advantage, expert advice, is exactly what the large online retailers lack, so the SWOT points to an online offer built around advice, such as video guides and a chat service, rather than a price war it would lose.
advantages:
  - "Quick and widely understood, so it is a good way to organize a case before an extended answer."
  - "It brings internal and external evidence together in one view."
  - "Its implications, matched pairs of factors, can give an evaluation its structure."
limitations:
  - "Lists are often long, vague and unranked, which hides the points that matter."
  - "The same factor can be a strength and a weakness at once, and the boxes conceal that."
  - "It is subjective and describes a moment, not how the position will change."
exercise:
  prompt: |
    Carry out a SWOT analysis for your school's canteen or a local business you know, for the decision of whether to start offering a delivery service. Give two points in each box, with evidence, and finish with the one implication that matters most.
  guidance:
    - "Check every strength and weakness is internal and every opportunity and threat is external."
    - "Support each point with evidence rather than a general statement."
    - "Rank the points; say which single factor would most affect the decision."
    - "End with an implication that links two boxes, not with four lists."

name: The Boston Consulting Group matrix
aliases: [BCG matrix, Boston matrix, Growth-share matrix]
summary: "A grid that classifies a business's products by market growth and relative market share, to decide where to invest the cash they generate."
question: "Which of our products should we invest in, keep, rethink or let go?"
group: strategy
status: toolkit
guidePages: '14'
subtopics: ['4.5', '3.7']
level: SL/HL
qualifications: [ib, undergraduate, mba, professional]
tool: bcg-matrix
diagram: bcg-matrix
studio: bcg-matrix
explanation: |
  The matrix plots each product, or business unit, by the growth rate of its market and its relative market share, its share compared with the largest competitor's. Stars have high share in a fast-growing market: they earn a lot but need heavy investment to keep up. Cash cows have high share in a slow-growing market: they need little investment and generate cash. Question marks have low share in a fast-growing market: they absorb cash and could become stars or fail. Dogs have low share in a slow-growing market.

  The logic is about cash: cash cows fund the investment that turns question marks into stars, which become the cash cows of the future as their markets mature. That links the matrix to the product life cycle and to cash flow.
purpose: |
  To balance a portfolio of products so that today's cash generators fund tomorrow's growth, and to start the discussion about which products deserve investment. The toolkit lists it; its full guide is in preparation, so this page gives the method in more detail.
steps:
  - "List the products or business units, and find each one's market growth rate and its relative market share."
  - "Choose the dividing lines, such as a growth rate that counts as high in this industry and a relative share of 1."
  - "Plot each product, often with a circle sized by its revenue."
  - "Read the portfolio: is there enough cash generation to fund the question marks and stars?"
  - "Draw cautious implications for each product, then test them against other evidence, such as contribution and strategic fit."
example:
  fictional: true
  business: Brightwater Brands
  title: Brightwater Brands reviews its drinks
  body: |
    Brightwater Brands, a fictional drinks company, has four products. Its original lemonade has the largest share of a mature market (a cash cow). Its sugar-free range leads a fast-growing segment (a star). A new energy drink has a small share of a fast-growing market (a question mark). Its bottled iced tea has a small share of a shrinking market (a dog).
  result: |
    The lemonade's cash can fund the star and a decision on the energy drink, which needs either serious investment to gain share or withdrawal. The iced tea still makes a positive contribution and uses the same bottling line, so the matrix prompts a review rather than an automatic withdrawal.
advantages:
  - "A simple picture of a whole portfolio and the cash flows within it."
  - "It links market position to investment decisions and to the product life cycle."
  - "It prompts questions about balance, such as too few cash cows to fund growth."
limitations:
  - "It relies on two measures only; market share and growth do not guarantee profit or cash."
  - "Defining the market changes a product's position, and the dividing lines are arbitrary."
  - "It ignores links between products, such as a dog that supports the sales of a star."
exercise:
  prompt: |
    Place four products of a company you know, such as a phone maker or a snack brand, on the BCG matrix, with a reason for each position. Then recommend what the company should do with its question mark.
  guidance:
    - "Use relative market share and market growth, and say how you judged them, even roughly."
    - "Explain the cash role of each product in the portfolio."
    - "For the question mark, weigh investing to build share against withdrawing, using the market's prospects."
    - "Mention one limitation of the matrix that affects your recommendation."
structure:
  - name: Relative market share (the horizontal axis)
    text: "A product's market share divided by that of its largest rival. Above 1, the product leads its market; the BCG reasoning links a lead to lower costs through experience and scale, and so to cash generation."
  - name: Market growth (the vertical axis)
    text: "How fast the product's market is growing, a rough measure of how much cash the product needs to keep its share as the market expands. Where high growth begins is a judgement for the industry."
  - name: Stars
    text: "A high share of a fast-growing market: strong, but usually needing heavy investment to keep pace. A star that holds its lead becomes a cash cow as the market slows."
  - name: Question marks
    text: "A low share of a fast-growing market: they absorb cash and earn little of it, so each one needs a decision, to build its share or to withdraw."
  - name: Cash cows
    text: "A high share of a slow-growing market: they generate more cash than they need, and that surplus funds the rest of the portfolio."
  - name: Dogs
    text: "A low share of a slow-growing market: they generate little cash and are candidates for review, though some still earn a positive contribution or support other products."
  - name: The circles
    text: "Each product is often drawn as a circle sized by its revenue, so the reader sees where the business's sales actually come from."
situations:
  suits:
    - "A business with several products or units competing for limited investment, such as a drinks maker deciding which brands to back next year."
    - "Checking whether today's cash generators can fund tomorrow's products before a cash cow's market starts to decline."
    - "Opening a discussion about a product everyone is attached to, by placing it, with evidence, beside the others."
  poorFit:
    - "A business with one product, or products whose markets cannot be defined with any confidence."
    - "Products whose sales depend on each other, such as printers and their ink, where judging each alone misleads."
    - "Markets where profit depends more on being different than on being big, so that a small share can be very profitable."
interpretation: |
  Read the matrix as a picture of cash, not of quality. The questions it raises are about balance: is there enough cash generation (the cows) to fund the products that need it (the stars and question marks)? Is there a successor to each cow before its market declines? Which question marks have a realistic path to a leading share?

  A portfolio heavy with dogs and question marks is short of cash; one made only of cows is ageing. Treat each product's position as a prompt for a question rather than a prescription: a dog with a healthy contribution may be worth keeping, and a star may not be worth the cash it would take to defend.
implications:
  justifies:
    - "Directing scarce investment towards the stars and the few question marks with a realistic route to leadership, and holding spending on the cash cows."
    - "Planning a successor before a cash cow's market declines."
    - "Reviewing a dog's contribution and its links to other products before deciding whether to keep it, reposition it or drop it."
  doesNotJustify:
    - "Dropping a product because it is a dog: it may still cover its own costs, share the fixed costs or support a star's sales."
    - "Investing in every question mark; few businesses can fund them all."
    - "Any conclusion about profit, which share and growth do not measure."
mistakes:
  - mistake: "Using absolute market share instead of relative market share."
    fix: "Divide the product's share by the largest rival's share: a 20% share leads a fragmented market but is weak beside a rival with 60%."
  - mistake: "Defining the market so that the product lands in a flattering box."
    fix: "Define the market as its customers would, and test whether a broader or narrower definition changes the position."
  - mistake: "Reading the labels as orders, such as 'milk the cows' and 'kill the dogs'."
    fix: "Use the position to ask what each product needs and returns in cash, then check its contribution, its links to other products and its fit with the strategy."
  - mistake: "Plotting a single year and calling it a strategy."
    fix: "Add where each product is heading, such as a star whose market is slowing, because the balance of the portfolio changes over time."
apply:
  - href: /strategy-studio/bcg-matrix/
    scope: full
    use: "Plot your products by relative market share and market growth, sized by revenue, set the line between high and low growth yourself, and read what the balance of the portfolio implies for cash."
  - href: /market-studio/market-metrics/
    scope: part
    use: "Calculate market share, market growth and relative market share from your own figures before you plot them."
  - href: /market-studio/product-life-cycle/
    scope: part
    use: "See how sales, profit and cash change through a product's life, which explains why a star needs cash and a cash cow releases it."

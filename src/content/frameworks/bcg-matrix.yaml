name: The Boston Consulting Group matrix
aliases: [BCG matrix, Boston matrix, Growth-share matrix]
summary: "A grid that classifies a business's products by market growth and relative market share, to decide where to invest the cash they generate."
question: "Which of our products should we invest in, keep, rethink or let go?"
group: strategy
status: toolkit
guidePages: '14'
subtopics: ['4.5', '3.7']
level: SL/HL
qualifications: [ib, undergraduate, mba, professional]
tool: bcg-matrix
diagram: bcg-matrix
explanation: |
  The matrix plots each product, or business unit, by the growth rate of its market and its relative market share, its share compared with the largest competitor's. Stars have high share in a fast-growing market: they earn a lot but need heavy investment to keep up. Cash cows have high share in a slow-growing market: they need little investment and generate cash. Question marks have low share in a fast-growing market: they absorb cash and could become stars or fail. Dogs have low share in a slow-growing market.

  The logic is about cash: cash cows fund the investment that turns question marks into stars, which become the cash cows of the future as their markets mature. That links the matrix to the product life cycle and to cash flow.
purpose: |
  To balance a portfolio of products so that today's cash generators fund tomorrow's growth, and to start the discussion about which products deserve investment. The toolkit lists it; its full guide is in preparation, so this page gives the method in more detail.
steps:
  - "List the products or business units, and find each one's market growth rate and its relative market share."
  - "Choose the dividing lines, such as a growth rate that counts as high in this industry and a relative share of 1."
  - "Plot each product, often with a circle sized by its revenue."
  - "Read the portfolio: is there enough cash generation to fund the question marks and stars?"
  - "Draw cautious implications for each product, then test them against other evidence, such as contribution and strategic fit."
example:
  fictional: true
  business: Brightwater Brands
  title: Brightwater Brands reviews its drinks
  body: |
    Brightwater Brands, a fictional drinks company, has four products. Its original lemonade has the largest share of a mature market (a cash cow). Its sugar-free range leads a fast-growing segment (a star). A new energy drink has a small share of a fast-growing market (a question mark). Its bottled iced tea has a small share of a shrinking market (a dog).
  result: |
    The lemonade's cash can fund the star and a decision on the energy drink, which needs either serious investment to gain share or withdrawal. The iced tea still makes a positive contribution and uses the same bottling line, so the matrix prompts a review rather than an automatic withdrawal.
advantages:
  - "A simple picture of a whole portfolio and the cash flows within it."
  - "It links market position to investment decisions and to the product life cycle."
  - "It prompts questions about balance, such as too few cash cows to fund growth."
limitations:
  - "It relies on two measures only; market share and growth do not guarantee profit or cash."
  - "Defining the market changes a product's position, and the dividing lines are arbitrary."
  - "It ignores links between products, such as a dog that supports the sales of a star."
exercise:
  prompt: |
    Place four products of a company you know, such as a phone maker or a snack brand, on the BCG matrix, with a reason for each position. Then recommend what the company should do with its question mark.
  guidance:
    - "Use relative market share and market growth, and say how you judged them, even roughly."
    - "Explain the cash role of each product in the portfolio."
    - "For the question mark, weigh investing to build share against withdrawing, using the market's prospects."
    - "Mention one limitation of the matrix that affects your recommendation."

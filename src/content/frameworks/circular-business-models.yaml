name: Circular business models
aliases: [Circular models]
summary: "Five ways for a business to earn money while keeping products and materials in use: circular supply, resource recovery, product life extension, sharing and product service systems."
question: "How can the business earn more while using fewer new resources?"
group: strategy
status: toolkit
guidePages: '14'
subtopics: ['1.1', '5.3']
level: SL/HL
qualifications: [ib, secondary, undergraduate, mba, professional]
tool: circular-business-models
diagram: circular-business-models
explanation: |
  The guide names five circular business models. Circular supply models use inputs that are renewable, recycled or biodegradable. Resource recovery models capture value from waste, scraps and by-products. Product life extension models keep products working longer through durable design, repair, upgrades and resale. Sharing models let many users share one item, often through a platform. Product service system models sell the use of a product, such as lighting or mobility, while the business keeps ownership and so has a reason to make it last.

  Each model changes where the money comes from, from selling more units to keeping resources in circulation, which puts the key concept of sustainability into practice. Each also needs new capabilities, such as collecting products back, and often a change in what customers are willing to pay for.
purpose: |
  To find ways for a business to reduce waste and its use of new materials while protecting or raising its profit, and to evaluate whether a circular model suits a particular business. Its full toolkit guide is in preparation.
steps:
  - "Map where the business's products and materials end up after use."
  - "For each of the five models, ask whether it could apply, and what the business would need to make it work."
  - "Estimate the effect on costs, revenues and customers for the most promising model."
  - "Identify the capabilities and partners it would need, such as reverse logistics or a repair network."
  - "Evaluate the model against the triple bottom line: people, planet and profit."
example:
  fictional: true
  business: Stride Footwear
  title: Stride Footwear closes the loop
  body: |
    Stride Footwear, a fictional maker of running shoes, reviews the five models. It already uses some recycled rubber (circular supply). It considers a take-back scheme that grinds old soles into running track material (resource recovery), and a resoling service for its premium shoes (product life extension).
  result: |
    The resoling service fits best: runners who pay a premium value their shoes, the service brings them back to the store, and it extends each pair's life. The take-back scheme needs a partner to process the soles and is planned for a later stage.
advantages:
  - "It links sustainability to profit, so circular ideas are judged as business decisions."
  - "Five distinct models give a structured way to generate options."
  - "Circular models can cut material costs and risks, and attract customers, staff and investors."
limitations:
  - "Changing a business model takes investment, time and new capabilities."
  - "Not every customer will pay more, or accept owning less, for environmental reasons."
  - "Environmental gains can be offset if cheaper second-hand or shared goods raise total consumption."
exercise:
  prompt: |
    Choose a business that sells physical products, such as a phone retailer, a toy maker or a clothing brand. For each of the five circular business models, give one way it could apply, then evaluate the most promising one for its effect on people, planet and profit.
  guidance:
    - "Make each example specific to the business, not a definition of the model."
    - "For the chosen model, consider costs, revenue, customers and the capabilities needed."
    - "Weigh the environmental gain against the risk to profit, honestly."
    - "Say what evidence would show the model is working."
structure:
  - name: Circular supply
    text: "Inputs that are renewable, recycled or biodegradable replace new, finite materials, so the product starts its life in the loop."
  - name: Resource recovery
    text: "Value is captured from waste, scraps, by-products and returned goods, by the business itself or by a partner that can use them."
  - name: Product life extension
    text: "Products are designed to last and kept working through repair, upgrades, refurbishment and resale, so each one earns for longer."
  - name: Sharing
    text: "Many users share one item, often through a platform, so fewer items are needed for the same use."
  - name: Product service systems
    text: "The business sells the use or the result of a product, such as lighting or mobility, and keeps ownership, which gives it a reason to make the product last."
  - name: What changes underneath
    text: "Each model moves revenue away from selling more units and towards keeping resources in use, and each needs capabilities a linear business may lack, such as collecting products back."
situations:
  suits:
    - "A business whose products end up as waste it could collect, repair or resell, such as clothing, electronics, furniture or tyres."
    - "Customers who pay a premium for durability or would rather pay for use than ownership, such as businesses leasing equipment."
    - "Rising prices or regulation of a key material, which make recovered or renewable inputs competitive."
  poorFit:
    - "Products that are cheap, used once and hard to collect, where the cost of bringing them back exceeds anything recovered."
    - "A business without the cash or partners to build reverse logistics, which may need to start with a single pilot rather than a new model."
interpretation: |
  Read each model as a change to the business model, not as a green addition to it. For the most promising model, ask three things: where the new revenue comes from (repairs, rentals, recovered material), what new costs and capabilities it brings (collection, inspection, refurbishment, a platform), and how customers' behaviour must change for it to work.

  The model fits when the value kept in circulation is larger than the cost of keeping it there, and when the business is better placed than anyone else to capture that value. Judge the environmental gain separately and honestly: a model that makes goods cheaper to use can raise total consumption.
implications:
  justifies:
    - "Piloting the one model that fits the business's products and customers best, such as a repair service for premium goods, before redesigning the whole business."
    - "Redesigning products for repair or disassembly where a life extension or recovery model is chosen."
    - "Seeking partners for the capabilities the business lacks, such as a processor for recovered material."
  doesNotJustify:
    - "Claiming an environmental benefit without measuring it against the extra transport, processing and possible rise in use."
    - "Assuming customers will pay more for circular products because they say they value sustainability."
mistakes:
  - mistake: "Treating recycling at the end as the whole of the circular economy."
    fix: "Look first at keeping products in use, through durability, repair and sharing, which usually keeps more value than recycling materials."
  - mistake: "Choosing a model without costing the return flow of products."
    fix: "Estimate collection, inspection and processing costs per item, and compare them with the value recovered."
  - mistake: "Ignoring what the model does to existing sales."
    fix: "Ask whether repairs and resale take sales from new products, and whether the margin on the service makes up for it."
apply:
  - href: /entrepreneurship-lab/business-model-canvas/
    scope: part
    use: "Redraw the canvas for a circular model: take-back, repair or sharing change the key activities, partners, cost structure and revenue streams, and the canvas shows which new assumptions that adds."
  - href: /entrepreneurship-lab/feasibility/
    scope: part
    use: "Score the circular idea against weighted criteria, such as demand, cost and the capabilities it needs, before committing to it."

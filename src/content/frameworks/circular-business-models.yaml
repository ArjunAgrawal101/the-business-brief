name: Circular business models
aliases: [Circular models]
summary: "Five ways for a business to earn money while keeping products and materials in use: circular supply, resource recovery, product life extension, sharing and product service systems."
question: "How can the business earn more while using fewer new resources?"
group: strategy
status: toolkit
guidePages: '14'
subtopics: ['1.1', '5.3']
level: SL/HL
qualifications: [ib, secondary, undergraduate, mba, professional]
tool: circular-business-models
diagram: circular-business-models
explanation: |
  The guide names five circular business models. Circular supply models use inputs that are renewable, recycled or biodegradable. Resource recovery models capture value from waste, scraps and by-products. Product life extension models keep products working longer through durable design, repair, upgrades and resale. Sharing models let many users share one item, often through a platform. Product service system models sell the use of a product, such as lighting or mobility, while the business keeps ownership and so has a reason to make it last.

  Each model changes where the money comes from, from selling more units to keeping resources in circulation, which puts the key concept of sustainability into practice. Each also needs new capabilities, such as collecting products back, and often a change in what customers are willing to pay for.
purpose: |
  To find ways for a business to reduce waste and its use of new materials while protecting or raising its profit, and to evaluate whether a circular model suits a particular business. Its full toolkit guide is in preparation.
steps:
  - "Map where the business's products and materials end up after use."
  - "For each of the five models, ask whether it could apply, and what the business would need to make it work."
  - "Estimate the effect on costs, revenues and customers for the most promising model."
  - "Identify the capabilities and partners it would need, such as reverse logistics or a repair network."
  - "Evaluate the model against the triple bottom line: people, planet and profit."
example:
  fictional: true
  business: Stride Footwear
  title: Stride Footwear closes the loop
  body: |
    Stride Footwear, a fictional maker of running shoes, reviews the five models. It already uses some recycled rubber (circular supply). It considers a take-back scheme that grinds old soles into running track material (resource recovery), and a resoling service for its premium shoes (product life extension).
  result: |
    The resoling service fits best: runners who pay a premium value their shoes, the service brings them back to the store, and it extends each pair's life. The take-back scheme needs a partner to process the soles and is planned for a later stage.
advantages:
  - "It links sustainability to profit, so circular ideas are judged as business decisions."
  - "Five distinct models give a structured way to generate options."
  - "Circular models can cut material costs and risks, and attract customers, staff and investors."
limitations:
  - "Changing a business model takes investment, time and new capabilities."
  - "Not every customer will pay more, or accept owning less, for environmental reasons."
  - "Environmental gains can be offset if cheaper second-hand or shared goods raise total consumption."
exercise:
  prompt: |
    Choose a business that sells physical products, such as a phone retailer, a toy maker or a clothing brand. For each of the five circular business models, give one way it could apply, then evaluate the most promising one for its effect on people, planet and profit.
  guidance:
    - "Make each example specific to the business, not a definition of the model."
    - "For the chosen model, consider costs, revenue, customers and the capabilities needed."
    - "Weigh the environmental gain against the risk to profit, honestly."
    - "Say what evidence would show the model is working."

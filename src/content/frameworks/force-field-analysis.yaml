name: Force field analysis
aliases: [Force field]
summary: "A way of weighing the forces driving a change against the forces resisting it, to judge whether it will succeed and how to help it."
question: "What is pushing for this change, what is holding it back, and which force should we work on?"
group: change
status: toolkit
guidePages: '14'
subtopics: ['2.1', '1.5']
level: HL
qualifications: [ib, undergraduate, mba, professional]
origin: "Kurt Lewin, whose three-stage change model it supports."
tool: force-field-analysis
diagram: force-field
studio: force-field
explanation: |
  The analysis lists the driving forces that push for a change and the restraining forces that resist it, and gives each a score, commonly from 1 (weak) to 5 (strong). Comparing the totals suggests whether the change is likely to succeed as planned. The more useful step is planning: a change can be helped by strengthening the driving forces or, often more effectively, by weakening the restraining forces, because pushing harder can simply increase resistance.

  It is the practical tool behind the unfreezing stage of Lewin's change model, and it links to the guide's reasons for resistance to change and the strategies for reducing it.
purpose: |
  To analyse a planned change before committing to it, and to decide where effort will do most good. The toolkit guide sets out the method in full, with an interaction for weighting the forces.
steps:
  - "State the change precisely, and the current state it would replace."
  - "List the driving and restraining forces, with evidence for each."
  - "Score each force, from 1 to 5, and record why."
  - "Compare the totals, but look most closely at the strongest single forces."
  - "Plan actions to weaken the key restraining forces or strengthen the driving ones, and check their effect on the scores."
example:
  fictional: true
  business: Fernhill Printing
  title: Fernhill Printing weighs a four-day week
  body: |
    Fernhill Printing, a fictional print works, considers a four-day working week of longer days. Driving forces: staff demand for it (4), lower energy costs from closing on Fridays (3) and an easier time recruiting (3), total 10. Restraining forces: customers who want Friday deliveries (4), supervisors worried about cover (3) and the cost of new scheduling software (2), total 9.
  result: |
    The totals are close, so the change is not safe as planned. The strongest restraining force is customers' Friday deliveries; a rota that keeps one dispatch team in on Fridays would weaken it from 4 to perhaps 1, which shifts the balance clearly towards the change.
advantages:
  - "It makes the forces for and against a change explicit and open to discussion."
  - "It points to specific actions, especially weakening resistance."
  - "It involves the people affected, which can itself reduce resistance."
limitations:
  - "The scores are subjective, and the totals can give a false sense of precision."
  - "A single strong force, such as a legal barrier, can outweigh any total."
  - "It describes forces at one moment; they change as the change proceeds."
exercise:
  prompt: |
    Your school plans to start lessons an hour later each day. Carry out a force field analysis with at least three driving and three restraining forces, scored from 1 to 5, and recommend two actions that would most improve the chance of success.
  guidance:
    - "Base each force on evidence or a stakeholder's view, not a guess."
    - "Explain the score for the strongest forces."
    - "Do not rely on the totals alone: identify the force that could block the change on its own."
    - "Prefer actions that weaken resistance, and say how each would change a score."

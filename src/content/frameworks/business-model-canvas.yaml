name: The business model canvas
aliases: [Business model canvas, BMC]
summary: "A one-page template of nine blocks that describes how a business creates value for customers, delivers it and earns money from it."
question: "How exactly will this business create value, reach customers and make money?"
group: strategy
status: enrichment
subtopics: ['1.1', '1.3']
qualifications: [secondary, undergraduate, mba, professional]
origin: "Alexander Osterwalder, developed with Yves Pigneur."
diagram: business-model-canvas
explanation: |
  The canvas lays out a business model on one page. On the right are the customer side: the customer segments a business serves, the value propositions it offers each one, the channels through which it reaches them, the customer relationships it builds and the revenue streams it earns. On the left is the delivery side: the key resources and key activities the offer depends on, and the key partners who supply or support it. Along the bottom, the cost structure sits beside the revenue streams, so the economics of the model are visible at a glance.

  Because everything is on one sheet, the canvas shows how the blocks depend on each other. A change of segment can change the channel, the resources needed and the revenue model, and the canvas makes those knock-on effects easy to see and discuss.
purpose: |
  To describe, design or compare business models quickly, and to turn a business idea into a set of assumptions that can be tested, such as "busy parents will pay for collection within 24 hours". It is a planning tool for founders and a thinking tool for established firms reviewing how they make money.
steps:
  - "Start with customer segments: who, specifically, the business serves. Separate segments with different needs."
  - "Write the value proposition for each segment: the problem it solves or the need it meets, and why customers would choose it."
  - "Fill in channels and customer relationships: how customers find, buy and receive the offer, and how they are kept."
  - "Set out revenue streams: what customers pay for, how and how much."
  - "Work back to the key resources, activities and partners the offer depends on."
  - "Complete the cost structure, then mark the assumptions you are least sure of and plan how to test them."
example:
  fictional: true
  business: Fold and Fetch
  title: Fold and Fetch sketches a laundry service
  body: |
    Two founders plan Fold and Fetch, a fictional laundry collection service. Their canvas reads:

    - **Customer segments:** busy parents and young professionals in flats without space for a dryer.
    - **Value proposition:** collection and return within 24 hours, booked in under a minute, at close to a launderette's price.
    - **Channels and relationships:** an app, leaflets in apartment blocks, and a monthly subscription.
    - **Key resources, activities and partners:** two vans, routing software, and a partner launderette that washes at night.
    - **Revenue and costs:** subscriptions and single bookings; drivers, vans, the launderette's fee and app development.
  result: |
    The canvas shows that the whole model rests on one partner, the launderette, and on enough orders per street to make routes efficient. Those become the first assumptions to test, with a trial in two apartment blocks, before the founders buy a second van.
advantages:
  - "It fits a whole business model on one page in a shared language that teams and investors understand quickly."
  - "It makes the links between the blocks visible, so that changes are thought through."
  - "It turns a vague idea into specific assumptions that can be tested with customers."
limitations:
  - "It is a snapshot and says little about competitors or how the model will defend itself."
  - "A neatly completed canvas can make an untested idea look finished and convincing."
  - "It leaves out goals, people and culture, and its brief boxes can hide important detail."
exercise:
  prompt: |
    Complete a business model canvas for a business you could start at school or in your community, such as tutoring younger students, selling refurbished phones or a weekend car-washing service. Then mark the two assumptions you are least sure of and describe a cheap way to test each.
  guidance:
    - "Be specific about the customer segment; 'everyone' is not a segment."
    - "Make sure the value proposition answers why customers would choose you over their current option, including doing nothing."
    - "Check that the revenue streams and the cost structure could produce a profit at a realistic volume."
    - "Choose tests that measure what customers do, such as pre-orders or sign-ups, rather than what they say they would do."

name: Maslow's hierarchy of needs
aliases: [Hierarchy of needs, Maslow]
summary: "Maslow's theory that people are motivated by five levels of need, from physiological needs up to self-actualization, each becoming important as the one below is met."
question: "Which of an employee's needs does this job meet, and which is left unmet?"
group: people
status: syllabus
guidePages: '26'
subtopics: ['2.4']
level: SL/HL
qualifications: [ib, secondary, undergraduate, mba]
origin: "Abraham Maslow, an American psychologist."
diagram: maslow-hierarchy
explanation: |
  Maslow arranged human needs in five levels. Physiological needs, such as food, water and rest, come first; at work they are met by pay sufficient to live on and decent conditions. Safety needs follow: security of employment, a safe workplace and predictable income. Next come love and belonging, met through teamwork, friendships and a sense of being part of the organization. Esteem needs, for recognition, status and respect, come fourth. At the top is self-actualization, the need to grow, use one's talents fully and achieve one's potential.

  The theory holds that a need motivates while it is unmet, and that once the lower needs are largely satisfied, higher ones become the main motivators. For managers, it suggests that pay and security matter first, but that people who have them are motivated by belonging, recognition and the chance to develop.
purpose: |
  To analyse which needs a job or a workplace meets, and to choose rewards and job designs that address the needs that are not yet met. The guide asks students to evaluate the theory (AO3).
steps:
  - "Describe the job and the people who do it."
  - "Go up the hierarchy and ask how well each level of need is met, with evidence."
  - "Find the lowest level that is not well met: the theory says that is where motivation will focus."
  - "Suggest rewards or changes that meet that need, financial or non-financial."
  - "Evaluate: would these people's needs really follow this order?"
example:
  fictional: true
  business: Riverside Care Homes
  title: Riverside Care Homes reviews its staff's needs
  body: |
    Riverside Care Homes, a fictional care provider, struggles to keep care workers. A review finds pay just above the legal minimum, rotas published only a week ahead, little contact between shifts, and no route to promotion.
  result: |
    Through Maslow's lens, safety needs are poorly met: unpredictable rotas make income and life hard to plan, so belonging and recognition schemes alone would do little. Riverside publishes rotas a month ahead and guarantees minimum hours first, then adds team handovers and a senior carer grade to meet the higher needs.
advantages:
  - "Simple and intuitive, it reminds managers that people have needs beyond pay."
  - "It helps match rewards to the needs that are actually unmet."
  - "It links to many non-financial rewards in the guide, such as teamwork, empowerment and purpose."
limitations:
  - "Research gives little support to a fixed order; people pursue several needs at once."
  - "Needs and their order vary between individuals and cultures."
  - "Self-actualization is hard to define or measure, and some jobs offer little room for it."
exercise:
  prompt: |
    A fast-food restaurant employs mostly students on part-time contracts. Use Maslow's hierarchy to analyse which of their needs the job is likely to meet, and recommend one change the manager could make to improve motivation, evaluating the theory as you go.
  guidance:
    - "Work through the levels with evidence about the job, not generic examples."
    - "Identify the lowest level that seems unmet and explain why it matters."
    - "Recommend a specific change and link it to the level it addresses."
    - "Evaluate: would these employees' needs follow Maslow's order, and does the theory fit part-time work?"

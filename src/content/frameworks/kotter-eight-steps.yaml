name: Kotter's eight steps
aliases: [Kotter's eight-step change model, Eight steps for leading change]
summary: "A sequence of eight steps for leading a major change, from creating urgency to anchoring the change in the organization's culture."
question: "How do we lead a big change so that people commit to it and it lasts?"
group: change
status: enrichment
subtopics: ['2.1', '2.3']
qualifications: [undergraduate, mba, professional]
origin: "John Kotter, a professor at Harvard Business School, from his study of why change efforts fail."
diagram: kotter-eight-steps
explanation: |
  Kotter's model sets out eight steps in three phases. To create a climate for change, leaders establish a sense of urgency, build a guiding coalition of people with the authority and credibility to lead, and form a clear vision and strategy. To engage and enable the organization, they communicate the vision widely and repeatedly, remove the obstacles that stop people acting on it, and plan visible short-term wins. To implement and sustain the change, they build on those gains rather than declaring victory early, and anchor the new ways in the culture, for example through promotion, training and stories.

  The steps are meant to be followed in order, each building on the last. The model grew from observing change efforts that failed, and many failures map onto a skipped step: no real urgency, a coalition too weak to lead, a vision nobody understood, or celebration before the new behaviour had taken root.
purpose: |
  To plan and lead large, planned changes, such as a merger, a new system or a new strategy, by setting out what leaders must do at each stage and in what order, and to diagnose why a change that is already under way has stalled.
steps:
  - "Create a sense of urgency with evidence that the current way cannot continue."
  - "Build a guiding coalition of people with the power, expertise and credibility to lead the change."
  - "Form a short, clear vision and the strategy for reaching it."
  - "Communicate the vision often, through every channel, and by leaders' own behaviour."
  - "Remove obstacles: structures, systems or managers that block people from acting on the vision."
  - "Plan and win visible short-term gains, and recognize the people who achieved them."
  - "Build on the gains: use the credibility to tackle bigger problems rather than declaring victory."
  - "Anchor the change in the culture by linking it to success, promotion and how new staff are inducted."
example:
  fictional: true
  business: Westmere Health Trust
  title: Westmere moves to electronic records
  body: |
    Westmere Health Trust, a fictional group of clinics, must move from paper notes to electronic patient records. Its plan follows Kotter's steps.

    It shares data showing how many appointments were delayed by missing paper notes (urgency), and asks respected senior doctors and nurses to lead the project (coalition). The vision is simple: every clinician sees a patient's full record in under a minute. It pilots the system in one clinic, publishes the fall in delayed appointments there (a short-term win), and only then rolls it out to the others.
  result: |
    The pilot's results did more than any memo to win over sceptical staff, and the clinical leaders, not the IT team, carried the message. The trust's remaining risk is the last step: unless new staff are trained in the system at induction and paper forms are withdrawn, old habits could return.
advantages:
  - "Clear, practical steps that leaders can plan around and check progress against."
  - "It emphasizes the human side of change, urgency, coalition and communication, that technical plans often miss."
  - "Its link to common reasons for failure makes it useful for diagnosing a stalled change."
limitations:
  - "It is linear and led from the top, which suits planned, one-off changes better than continuous or bottom-up change."
  - "Creating urgency can tip into fear and resistance if it is handled badly."
  - "It offers little on how to adapt when the change itself needs to be redesigned partway through."
exercise:
  prompt: |
    A school plans to ban phones during the whole school day. Using Kotter's eight steps, plan how the head teacher should lead the change, and identify the step most likely to be skipped and what would happen if it were.
  guidance:
    - "Give a concrete action for each step, such as who would be in the guiding coalition and why."
    - "Think about short-term wins that students, staff and parents would notice."
    - "Identify the stakeholders most likely to resist, and which step deals with them."
    - "For the skipped step, link it to a specific failure, such as the ban being dropped after a term."

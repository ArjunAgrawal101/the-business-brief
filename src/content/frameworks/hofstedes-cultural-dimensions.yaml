name: Hofstede's cultural dimensions
aliases: [Cultural dimensions theory, Hofstede]
summary: "Six scales for comparing national cultures, from power distance to indulgence, used to adapt management, marketing and negotiation across countries."
question: "How might this country's culture change the way we manage, sell or negotiate here?"
group: people
status: toolkit
guidePages: '14'
subtopics: ['2.5', '4.6']
level: HL
qualifications: [ib, undergraduate, mba, professional]
origin: "Geert Hofstede, a social psychologist, from research on employees in many countries."
tool: hofstedes-cultural-dimensions
diagram: hofstede-dimensions
explanation: |
  The model compares national cultures on six dimensions. Power distance is how far people accept that power is shared unequally. Individualism against collectivism is whether people look after themselves first or their group. Masculinity against femininity contrasts competition and achievement with care and quality of life. Uncertainty avoidance is how uneasy people are with ambiguity and risk. Long-term orientation contrasts persistence and saving with tradition and quick results. Indulgence against restraint is how freely people act on their wishes.

  Each country receives a score on each dimension. The scores are national averages that describe tendencies, not individuals, and they are best used to raise questions, such as whether a flat, participative management style will be welcomed, rather than to predict how a particular person will behave.
purpose: |
  To anticipate how culture may affect management style, motivation, communication, negotiation and marketing when a business operates in or enters another country, and to explain culture clashes after a merger or an expansion. The toolkit lists it as an HL tool for units 2, 4 and 5; its full guide is in preparation.
steps:
  - "Identify the countries involved and the decision, such as opening a branch or merging teams."
  - "Compare their positions on the dimensions most relevant to the decision."
  - "Ask what each difference implies, for example for how decisions are made or how products are advertised."
  - "Check the implications against local evidence, such as staff, partners and market research."
  - "Adapt the plan, and watch for differences within each country."
example:
  fictional: true
  business: Northline Software
  title: Northline Software opens an office abroad
  body: |
    Northline Software, a fictional firm from a country with low power distance, where staff expect to challenge managers openly, opens a development office in a country it believes to have higher power distance. Its managers expect the same open debate in meetings, but new staff rarely question their decisions.
  result: |
    The dimension prompts the managers to adapt rather than to stereotype: they introduce written suggestion rounds and one-to-one reviews, where staff are more comfortable raising concerns, and they check with local staff which approaches work. Ideas from the new office rise within a few months.
advantages:
  - "A structured way to think about cultural differences before they cause problems."
  - "Links directly to leadership, motivation, communication and international marketing in the course."
  - "Widely recognized, with scores available for many countries."
limitations:
  - "National averages can stereotype individuals and hide differences between regions, generations and organizations."
  - "The original research drew on employees of one multinational, and cultures change over time."
  - "Six dimensions simplify culture, which also has history, religion, language and politics."
exercise:
  prompt: |
    A clothing brand from a country high in individualism plans an advertising campaign in a country high in collectivism. Using Hofstede's dimensions, explain two ways the campaign might be adapted, and one risk of relying on the dimensions alone.
  guidance:
    - "Name the dimension behind each adaptation and explain the link to the message or images."
    - "Make the adaptations concrete, such as showing families or groups rather than individual achievement."
    - "For the risk, consider differences between consumers within the country, such as younger buyers in cities."
    - "Suggest how market research could check the assumptions."

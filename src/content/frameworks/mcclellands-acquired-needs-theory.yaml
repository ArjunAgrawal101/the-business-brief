name: McClelland's acquired needs theory
aliases: [Acquired needs theory, Three needs theory]
summary: "McClelland's theory that people are driven by three needs learned through experience, achievement, affiliation and power, in different strengths."
question: "Which need drives this person most, and what work and rewards suit it?"
group: people
status: syllabus
guidePages: '26'
subtopics: ['2.4']
level: HL
qualifications: [ib, undergraduate, mba]
origin: "David McClelland, an American psychologist."
diagram: mcclelland-needs
explanation: |
  McClelland argued that three needs, shaped by experience rather than fixed at birth, explain much of how people behave at work. The need for achievement drives people to set challenging but realistic goals, take personal responsibility and seek feedback on how they are doing. The need for affiliation drives people to seek friendly relationships, acceptance and harmony, and to avoid conflict. The need for power drives people to influence and control others; McClelland distinguished personal power, used for one's own ends, from institutional power, used for the organization's goals.

  Everyone has all three, but one is usually dominant. People high in achievement thrive on challenging targets and feedback but may struggle to delegate; those high in affiliation make good team members but may avoid hard decisions; those high in institutional power often make effective senior managers.
purpose: |
  To match people to roles, goals and rewards that suit their dominant need, and to understand why the same incentive motivates one person and not another. The guide names it among the HL motivation theories and asks students to evaluate it (AO3).
steps:
  - "Observe the person's behaviour: the goals they choose, how they respond to feedback, and how they relate to others."
  - "Judge which of the three needs is dominant, with evidence."
  - "Match the role, the targets and the rewards to that need."
  - "Watch for the risks of each need, such as the achiever who will not delegate."
  - "Evaluate how far the theory explains the person's motivation."
example:
  fictional: true
  business: Corvid Design
  title: Corvid Design assigns its new projects
  body: |
    Corvid Design, a fictional design agency, is choosing who should lead three new projects. Amira sets herself tight personal deadlines and asks for feedback after every pitch. Tom is the person everyone goes to, and the team works best when he is in it. Lena enjoys persuading clients and is happiest leading the whole team towards the agency's goals.
  result: |
    Using McClelland's needs, the agency gives Amira a demanding solo project with clear milestones and regular feedback, puts Tom at the centre of a large collaborative project, and asks Lena to lead the account with the most stakeholders. Each role plays to a dominant need, though the agency notes that Amira may need support to delegate if her project grows.
advantages:
  - "Explains why people respond differently to the same rewards and roles."
  - "Because the needs are learned, it suggests they can be developed through training and experience."
  - "Useful for recruitment, team design and choosing managers."
limitations:
  - "The needs are hard to measure reliably; judgements based on behaviour can be subjective."
  - "It focuses on individuals and says little about the job itself or working conditions."
  - "The three needs may not capture everything that motivates people, such as security or purpose."
exercise:
  prompt: |
    A sales manager has three representatives: one who chases every target, one who builds strong friendships with clients, and one who wants to run the team. Using McClelland's theory, recommend how to motivate each, and evaluate one limitation of the approach.
  guidance:
    - "Link each representative's behaviour to a dominant need, with evidence."
    - "Recommend specific targets, roles or rewards for each."
    - "Consider the risks of each need, such as conflict avoidance in the affiliation-driven representative."
    - "Evaluate the theory, for example how reliably the manager can judge the needs."

name: The McKinsey 7S model
aliases: [7S framework, Seven S model]
summary: "Seven elements of an organization, three hard and four soft, that must fit together for a strategy or a change to work."
question: "If we change one part of the organization, what else has to change for it to work?"
group: change
status: enrichment
subtopics: ['2.1', '2.2', '2.5']
qualifications: [undergraduate, mba, professional]
origin: "Developed by consultants at McKinsey and Company, among them Tom Peters and Robert Waterman."
diagram: mckinsey-7s
explanation: |
  The model describes an organization through seven elements. The hard elements are strategy (the plan to win), structure (who reports to whom and how work is divided) and systems (the processes and routines, such as budgeting, recruitment and IT). The soft elements are shared values (the core beliefs at the centre), style (how leaders actually behave), staff (the people, their numbers and development) and skills (what the organization is good at).

  Its central claim is that the elements are interdependent. A new strategy with an old structure, or a new structure with unchanged rewards, will stall, because the parts pull in different directions. The soft elements are harder to see and slower to change, which is why changes that alter only the hard elements so often disappoint.
purpose: |
  To diagnose why an organization is not performing, or to plan a change so that every element supports it. It turns "we reorganized and nothing happened" into a specific account of which elements still point the old way.
steps:
  - "Describe the current state of each of the seven elements, with evidence: documents, behaviour, results."
  - "Describe the desired state of each element that the strategy or change needs."
  - "Compare the two and find the misfits, starting with shared values, which shape all the others."
  - "Decide which elements must change, in what order, and who will lead each change."
  - "Check the plan again for fit: each change should support the others, not undo them."
example:
  fictional: true
  business: Calder Mutual
  title: Calder Mutual's stalled reorganization
  body: |
    Calder Mutual, a fictional regional bank, reorganized its branches into product teams for mortgages, savings and business lending, so that customers would see specialists. A year later, nothing had changed.

    A 7S review found the new **structure** fitted the new **strategy**, but **systems** still paid bonuses on each branch's total sales, so staff kept selling whatever was easiest. Branch managers' **style** remained directive, and the **skills** of the specialist teams had not been developed with training.
  result: |
    The misfits explained the failure: the bank had changed two hard elements and left the rest pointing the old way. Its plan now changes the bonus scheme to reward each team's product goals, trains the specialists, and coaches branch managers to lead the teams rather than direct them.
advantages:
  - "It gives a complete checklist, so that soft elements such as values and style are not forgotten in a change."
  - "Its focus on fit explains why changes stall, which is often more useful than a list of problems."
  - "It works at any scale, from a team to a whole company."
limitations:
  - "It describes how elements fit but does not say what the right state of each should be."
  - "It looks inward and says little about competitors, customers or the wider environment."
  - "The soft elements are hard to observe and measure, so judgements about them can be subjective."
exercise:
  prompt: |
    A school decides to replace end-of-year exams with project work assessed through the year. Use the seven elements to identify three things, beyond the timetable, that would also have to change for the new approach to work, and the order in which you would change them.
  guidance:
    - "Cover both hard and soft elements, such as the systems for recording grades and the skills teachers need to assess projects."
    - "Explain the fit: how each change supports the new strategy, and what would happen if it were left out."
    - "Start from shared values: what teachers, students and parents believe about assessment shapes whether the change is accepted."
    - "Justify the order, for example training before the new system goes live."

name: Porter's generic strategies
aliases: [Generic strategies, "Cost leadership, differentiation and focus"]
summary: "Three ways a business can build a competitive advantage: the lowest costs, a differentiated offer, or either of those aimed at a narrow segment."
question: "On what basis will we beat our competitors, and across how much of the market?"
group: strategy
status: toolkit
guidePages: '14'
subtopics: ['1.3', '4.2']
level: HL
qualifications: [ib, undergraduate, mba, professional]
origin: "Michael Porter, who also gave the five forces and the value chain."
tool: porters-generic-strategies
diagram: porters-generic-strategies
explanation: |
  Porter argued that a business must choose its source of advantage, lower cost or differentiation, and its competitive scope, the whole market or a narrow segment. Cost leadership aims at the lowest costs in the industry, so the business can win on price or earn higher margins at the same price. Differentiation offers something customers value and will pay more for, such as design, quality, brand or service. Focus applies either approach to a niche: cost focus or differentiation focus.

  A business that tries to be everything, neither the cheapest nor clearly different, risks being stuck in the middle, with no advantage over anyone. Critics point to businesses that combine low cost and differentiation, often through technology or scale, but the framework remains a sharp test of whether a strategy has a clear basis.
purpose: |
  To choose, or test, the basis of a business's competitive strategy, and to check that its marketing mix and operations are consistent with it. The toolkit lists it as an HL tool; its full guide is in preparation, so this page gives the method in more detail.
steps:
  - "Identify the market and the main competitors the business faces."
  - "Decide the scope: the whole market, or a segment with distinct needs."
  - "Decide the source of advantage: lower cost, or a difference customers will pay for."
  - "Check that operations, pricing, promotion and people support that choice."
  - "Test the risk of each strategy, such as a cheaper rival or customers no longer valuing the difference."
example:
  fictional: true
  business: Atlas Cycles
  title: Atlas Cycles chooses its ground
  body: |
    Atlas Cycles, a fictional bicycle maker, competes with mass-market brands that sell cheap bikes through supermarkets and with premium brands sold in specialist shops. It cannot match the mass brands' costs, and its general-purpose bikes look ordinary beside the premium ones.
  result: |
    Atlas is stuck in the middle. The framework points it towards differentiation focus: hand-built cargo bikes for families who want to replace a second car, a niche the big brands serve poorly, where customers value durability and service more than price.
advantages:
  - "It forces a clear choice about the basis of competition, which gives a strategy coherence."
  - "It links strategy to costs, pricing and the marketing mix."
  - "The idea of being stuck in the middle is a useful warning for businesses without a clear advantage."
limitations:
  - "Some businesses succeed by combining low cost and differentiation, which the framework treats as risky."
  - "An advantage based on cost or difference can be copied, so it must be defended."
  - "It says little about how to build the chosen advantage, only what it should be."
exercise:
  prompt: |
    Choose three businesses in the same industry, such as three supermarkets or three clothing brands, and classify each by Porter's generic strategies with evidence. Is any of them stuck in the middle, and what should it do?
  guidance:
    - "Give evidence for each classification from price, product, promotion and place."
    - "Distinguish low price from low cost: a cost leader may charge average prices."
    - "For a business stuck in the middle, recommend a direction and the changes it would require."
    - "Mention the main risk of the strategy you recommend."

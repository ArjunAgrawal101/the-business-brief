name: Descriptive statistics
aliases: [Summary statistics]
summary: "Measures and charts that summarize a set of data: the mean, median and mode, quartiles and standard deviation, and bar charts, pie charts and infographics."
question: "What does this data actually show, and how much does it vary?"
group: performance
status: toolkit
guidePages: '14'
subtopics: ['4.4', '2.4']
level: SL/HL
qualifications: [ib, secondary, undergraduate, professional]
tool: descriptive-statistics
diagram: descriptive-statistics
explanation: |
  The guide lists the mean, mode, median, quartiles and standard deviation, and bar charts, pie charts and infographics. The mean is the total divided by the number of values; the median is the middle value in order; the mode is the most frequent value. Quartiles divide ordered data into four equal parts, and the interquartile range, the upper quartile minus the lower, shows the spread of the middle half. The standard deviation measures the typical distance of values from the mean.

  Averages describe the centre and measures of spread describe the variation, and a business needs both: two shops with the same average weekly sales can differ greatly in how predictable those sales are. Outliers pull the mean but not the median, which is why the median is often the better average for skewed data such as pay.
purpose: |
  To summarize business data, such as sales, survey results, absence or waiting times, so that it can be compared and used in decisions, and to choose the measure and the chart that represent it fairly. Its full toolkit guide is in preparation.
steps:
  - "Decide the question the data must answer, and check the data are relevant and reliable."
  - "Put the values in order and find the mean, median and mode."
  - "Find the quartiles, the interquartile range and, where useful, the standard deviation."
  - "Choose a chart that suits the data: bars to compare categories, a pie for parts of one whole."
  - "Interpret the figures in context, noting outliers and what the spread means for the decision."
example:
  fictional: true
  business: Harbourside Bakery
  title: Harbourside Bakery reads its sales
  body: |
    Harbourside Bakery, a fictional business, records how many celebration cakes it sells each week for eleven weeks, the data in the diagram above: 12, 15, 15, 18, 20, 21, 23, 26, 28, 31 and 42. The mean is about 22.8, the median 21 and the mode 15; the lower quartile is 15 and the upper quartile 28, an interquartile range of 13. The one week of 42, before a public holiday, pulls the mean above the median.
  result: |
    The median of 21 is the better guide to a normal week, so the bakery plans its regular orders around 21 cakes and treats holiday weeks separately. The wide interquartile range shows sales vary a lot from week to week, which argues for a flexible order with its supplier.
advantages:
  - "Simple measures make large amounts of data quick to understand and compare."
  - "Measures of spread show risk and variability that an average alone hides."
  - "Well-chosen charts communicate findings clearly to managers and stakeholders."
limitations:
  - "A summary can hide important detail, and the wrong average can mislead."
  - "The results are only as reliable as the data and the sample behind them."
  - "Charts can be designed to exaggerate or hide differences."
exercise:
  prompt: |
    A café records the number of customers on ten weekday mornings: 40, 42, 45, 45, 47, 50, 52, 55, 58 and 96, the last on a day when a nearby office held a training event. Calculate the mean, median and mode, and advise the café which figure to use when planning staff rotas.
  guidance:
    - "Order the values before finding the median; with ten values it is the average of the fifth and sixth."
    - "Show how the one unusual morning affects the mean but not the median."
    - "Recommend a figure for planning and justify it from the context."
    - "Suggest what other data would help, such as a longer period or the day of the week."

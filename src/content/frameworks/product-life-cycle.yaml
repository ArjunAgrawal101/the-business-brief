name: The product life cycle
aliases: [Product life cycle, PLC]
summary: "The stages a product goes through, development, introduction, growth, maturity and decline, and how sales, profit, investment and cash flow change across them."
question: "Where is this product in its life, and what should the marketing mix do now?"
group: strategy
status: syllabus
guidePages: '31'
subtopics: ['4.5']
level: SL/HL
qualifications: [ib, secondary, undergraduate, mba, professional]
diagram: product-life-cycle
explanation: |
  The life cycle traces a product's sales over time. In development there are no sales and the business is spending, so cash flow is negative. At introduction sales are low and promotion is heavy. In growth, sales rise quickly, competitors appear and the product may begin to make a profit. In maturity sales level off, competition is intense, and the product typically earns its highest profit and cash flow, because the costs of development and launch are behind it. In decline sales fall, and the business must choose between extending the product's life, cutting support or withdrawing it.

  The guide asks how the life cycle relates to the product portfolio and the marketing mix, and to investment, profit and cash flow (p. 31). Extension strategies, such as new uses, new markets or a relaunch, aim to prolong maturity. The model describes a pattern; it does not predict how long any stage will last.
purpose: |
  To choose a marketing mix suited to each stage, to plan investment and cash flow across a portfolio of products, and to decide when to extend, replace or withdraw a product. The guide treats these relationships at AO2 and extension strategies at AO3.
steps:
  - "Place the product on the cycle, using evidence on its sales growth, competition and profit."
  - "Describe the marketing mix that suits the stage: price, promotion, place and product."
  - "Consider the cash position: is the product absorbing cash or generating it?"
  - "In maturity or decline, weigh extension strategies against a replacement product."
  - "Look across the portfolio to check that cash from mature products can fund new ones."
example:
  fictional: true
  business: Cobalt Audio
  title: Cobalt Audio's wireless speaker
  body: |
    Cobalt Audio, a fictional electronics firm, launched a wireless speaker four years ago. Sales grew fast for two years, then levelled off as rivals copied it; the price has been cut twice, but the speaker still earns most of the firm's profit. A new model with longer battery life is in development.
  result: |
    The speaker is in maturity: it is a cash generator, and its cash is funding the new model's development. Cobalt uses a modest extension strategy, a waterproof version for a new outdoor market, to hold sales until the new model launches, rather than spending heavily to revive a product nearing the end of its life.
advantages:
  - "Links marketing decisions, investment and cash flow to a product's stage."
  - "Helps plan a portfolio so that mature products fund new ones."
  - "A clear model for judging when to extend, replace or withdraw a product."
limitations:
  - "Stages vary greatly in length and shape, and are often recognized only afterwards."
  - "It can become self-fulfilling: managers who expect decline may cut support and cause it."
  - "It describes one product's sales pattern and says nothing about competitors' actions."
exercise:
  prompt: |
    Choose a product you know, such as a games console, a brand of trainers or a music streaming service. Place it on the product life cycle with evidence, and recommend a marketing mix and an extension strategy for its current stage.
  guidance:
    - "Support the stage with evidence on sales growth, competition and price."
    - "Make the mix recommendations specific to the product and the stage."
    - "Explain the cash flow position at this stage."
    - "Weigh the extension strategy against launching a replacement."

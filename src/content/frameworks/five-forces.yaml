name: Porter's five forces
aliases: [Five forces, Five forces analysis]
summary: A way to judge how attractive an industry is, by examining the five competitive forces that decide how much profit the firms in it can earn.
question: How much profit can a business in this industry expect to make, and what holds it down?
group: environment
status: enrichment
subtopics: ['1.3', '1.5', '4.1']
qualifications: [undergraduate, mba, professional]
origin: Michael Porter, a professor at Harvard Business School, whose work on competitive strategy also gave the generic strategies in the IB toolkit.
diagram: five-forces
studio: five-forces
explanation: |
  The five forces model looks at an industry, not a single firm. It asks why some industries, such as branded medicines, earn high profits year after year while others, such as airlines or restaurants, struggle to cover their costs, and it finds the answer in five pressures.

  Rivalry among existing competitors sits at the centre. Around it, the threat of new entrants decides whether outsiders can enter and compete profits away; the bargaining power of suppliers decides how much of the value they can claim through higher input prices; the bargaining power of buyers decides how far customers can push prices down; and the threat of substitutes, other ways of meeting the same need, puts a ceiling on what customers will pay. When the forces are strong, an average firm earns little; when they are weak, the industry is attractive.
purpose: |
  To understand the structure of an industry before deciding whether to enter it, stay in it or invest more in it, and to find the forces a strategy must defend against or can use. It turns a vague sense that "competition is tough" into a reasoned account of where the pressure on profit comes from.
steps:
  - Define the industry precisely, by product and by geography. "Budget gyms in one town" gives a different answer from "fitness".
  - For each force, list the factors that make it stronger or weaker, using evidence such as the number of rivals, the cost of switching, the size of buyers and the barriers to entry.
  - Rate each force as low, medium or high, and say why. A rating without reasons is only an opinion.
  - Identify the one or two forces that bear most on profit. They matter more than an average of all five.
  - Judge the industry's overall attractiveness, and how the forces are likely to change, for example with new technology or regulation.
  - Draw the implication for the business, such as entering, staying out, building switching costs, or choosing a niche where the forces are weaker.
example:
  fictional: true
  business: Harbour Fitness
  title: Harbour Fitness weighs a gym in a new town
  body: |
    Harbour Fitness, a fictional chain of three budget gyms, is deciding whether to open in a nearby town that already has two gyms.

    - **Rivalry: high.** The two existing gyms compete on monthly fees and both are running joining offers.
    - **New entrants: medium.** A gym needs a lease and equipment, but equipment can be leased, so the barrier is moderate.
    - **Suppliers: low.** Several equipment makers and landlords compete for business.
    - **Buyers: high.** Members can leave each month at no cost, and fees are easy to compare online.
    - **Substitutes: medium.** Running clubs, home workouts and fitness apps meet some of the same need for less.
  result: |
    Rivalry and buyer power are the forces that hold profit down: members switch freely and rivals compete on price. The analysis suggests that entering on price alone would be a poor bet, and points Harbour towards a way to weaken buyer power, such as classes that build loyalty, or a different town where rivalry is lower.
advantages:
  - It gives a structured, complete view of competition that goes beyond the obvious rivals, to suppliers, buyers, entrants and substitutes.
  - It explains differences in profit between industries, which helps in deciding where to invest or which markets to enter.
  - It points to specific defences, such as raising switching costs or securing supplies, rather than general advice to "compete harder".
limitations:
  - It describes an industry at a point in time; markets that change quickly, such as digital ones, can make the analysis out of date.
  - It treats firms as competitors only, and underplays cooperation, alliances and platforms where rivals also complement one another.
  - Defining the industry is a judgement, and a different definition can change every rating.
  - It assesses the industry, not the firm, so it says little about a business's own strengths, which a SWOT or a value chain analysis can add.
exercise:
  prompt: |
    Choose an industry you know as a customer, such as mobile phone networks, food delivery apps or local hairdressers. Rate each of the five forces as low, medium or high, with one piece of evidence for each, and decide whether a new entrant could expect to make a good profit.
  guidance:
    - Start by defining the industry narrowly enough to analyse, by product and by place.
    - Support each rating with a reason that could be checked, such as the number of firms, the cost of switching, or how standard the product is.
    - Name the strongest force and explain why it matters most, rather than counting high and low ratings.
    - End with a judgement for the entrant, and one thing that would change your view, such as a new regulation or technology.

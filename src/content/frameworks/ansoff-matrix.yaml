name: The Ansoff matrix
aliases: [Ansoff, Product-market growth matrix]
summary: "Four routes to growth, by whether a business sells existing or new products in existing or new markets, with risk rising as it moves away from what it knows."
question: "Which route to growth suits this business, and how much risk does it carry?"
group: strategy
status: toolkit
guidePages: '14'
subtopics: ['1.5', '4.2']
level: SL/HL
qualifications: [ib, undergraduate, mba, professional]
tool: ansoff-matrix
diagram: ansoff-matrix
explanation: |
  The matrix crosses products (existing or new) with markets (existing or new) to give four growth strategies. Market penetration sells more of the existing products to existing customers. Product development offers new products to existing customers. Market development takes existing products to new markets: new places, segments or uses. Diversification offers new products in new markets.

  Risk generally rises with each step away from what the business knows, so diversification is usually the riskiest. The matrix frames the options; choosing between them depends on the business's resources, the market and the evidence.
purpose: |
  To lay out the growth options and their relative risk before a business commits to one. The toolkit guide sets out how to build it, the evidence it needs and a worked case, with an interaction for placing strategies on the matrix.
steps:
  - "Describe the business's current products and markets precisely."
  - "Generate at least one concrete option for each quadrant."
  - "Judge each option's risk and its fit with the business's strengths and resources."
  - "Compare the options with evidence, such as market research or forecasts, and recommend one."
example:
  fictional: true
  business: Orchard Lane Juice
  title: Orchard Lane Juice plans its next step
  body: |
    Orchard Lane Juice, a fictional maker of bottled apple juice sold in its home region, maps four options: a loyalty offer to sell more to current stockists (market penetration), a sparkling version for the same stockists (product development), selling the existing juice in a neighbouring region (market development), and opening juice bars in city centres (diversification).
  result: |
    The juice bars excite the owners but need skills the firm does not have. The neighbouring region uses its existing product and equipment and has a similar customer profile, so the matrix points to market development as the better balance of growth and risk for now.
advantages:
  - "A clear, simple map of growth options that prompts managers to consider all four."
  - "It makes the relative risk of each route visible."
  - "It links strategy to the marketing mix and to market research."
limitations:
  - "The boundary between existing and new is a judgement, and many options sit between quadrants."
  - "It says nothing about competitors or about how profitable each option would be."
  - "Risk varies within each quadrant, so the general pattern can mislead in a specific case."
exercise:
  prompt: |
    A local bakery wants to grow. Suggest one realistic option in each quadrant of the Ansoff matrix, and recommend one, explaining the risk it carries and the evidence you would want first.
  guidance:
    - "Make each option specific to the bakery, not a definition of the quadrant."
    - "Explain why the risk rises or falls for each option, using what the bakery knows."
    - "Link your recommendation to its strengths and resources."
    - "Name the research that would test your recommendation before the bakery commits."

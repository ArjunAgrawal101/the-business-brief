name: The Ansoff matrix
aliases: [Ansoff, Product-market growth matrix]
summary: "Four routes to growth, by whether a business sells existing or new products in existing or new markets, with risk rising as it moves away from what it knows."
question: "Which route to growth suits this business, and how much risk does it carry?"
group: strategy
status: toolkit
guidePages: '14'
subtopics: ['1.5', '4.2']
level: SL/HL
qualifications: [ib, undergraduate, mba, professional]
tool: ansoff-matrix
diagram: ansoff-matrix
studio: ansoff
explanation: |
  The matrix crosses products (existing or new) with markets (existing or new) to give four growth strategies. Market penetration sells more of the existing products to existing customers. Product development offers new products to existing customers. Market development takes existing products to new markets: new places, segments or uses. Diversification offers new products in new markets.

  Risk generally rises with each step away from what the business knows, so diversification is usually the riskiest. The matrix frames the options; choosing between them depends on the business's resources, the market and the evidence.
purpose: |
  To lay out the growth options and their relative risk before a business commits to one. The toolkit guide sets out how to build it, the evidence it needs and a worked case, with an interaction for placing strategies on the matrix.
steps:
  - "Describe the business's current products and markets precisely."
  - "Generate at least one concrete option for each quadrant."
  - "Judge each option's risk and its fit with the business's strengths and resources."
  - "Compare the options with evidence, such as market research or forecasts, and recommend one."
example:
  fictional: true
  business: Orchard Lane Juice
  title: Orchard Lane Juice plans its next step
  body: |
    Orchard Lane Juice, a fictional maker of bottled apple juice sold in its home region, maps four options: a loyalty offer to sell more to current stockists (market penetration), a sparkling version for the same stockists (product development), selling the existing juice in a neighbouring region (market development), and opening juice bars in city centres (diversification).
  result: |
    The juice bars excite the owners but need skills the firm does not have. The neighbouring region uses its existing product and equipment and has a similar customer profile, so the matrix points to market development as the better balance of growth and risk for now.
advantages:
  - "A clear, simple map of growth options that prompts managers to consider all four."
  - "It makes the relative risk of each route visible."
  - "It links strategy to the marketing mix and to market research."
limitations:
  - "The boundary between existing and new is a judgement, and many options sit between quadrants."
  - "It says nothing about competitors or about how profitable each option would be."
  - "Risk varies within each quadrant, so the general pattern can mislead in a specific case."
exercise:
  prompt: |
    A local bakery wants to grow. Suggest one realistic option in each quadrant of the Ansoff matrix, and recommend one, explaining the risk it carries and the evidence you would want first.
  guidance:
    - "Make each option specific to the bakery, not a definition of the quadrant."
    - "Explain why the risk rises or falls for each option, using what the bakery knows."
    - "Link your recommendation to its strengths and resources."
    - "Name the research that would test your recommendation before the bakery commits."
structure:
  - name: Market penetration
    text: "Existing products in existing markets: winning share from rivals or persuading current customers to buy more often, through price, promotion or loyalty schemes. The business knows both the product and the customer, so the usual risk is lowest."
  - name: Product development
    text: "New products for existing markets: new versions, ranges or services for customers the business already knows. The risk lies in development costs and in whether those customers want the new product."
  - name: Market development
    text: "Existing products in new markets: new regions, countries, segments or channels. The product is proven, but the customers, rivals, laws and tastes are unfamiliar."
  - name: Diversification
    text: "New products in new markets, where both are unfamiliar. Related diversification builds on skills or assets the business already has; unrelated diversification does not, and carries the highest risk."
  - name: The two axes
    text: "Products and markets, each split into existing and new. 'New' is judged from the business's own position: a product new to this firm may be old to the industry."
situations:
  suits:
    - "Choosing between routes to growth when the owners want growth and several directions are open, such as a regional food brand weighing a new range against a new region."
    - "Explaining to a board or a lender why one route is riskier than another, before the figures for each have been worked out."
    - "Checking that a list of options is not all in one direction, so that the choice is not made by default."
  poorFit:
    - "Deciding whether to grow at all, or comparing the profit of options: the matrix ranks familiarity and usual risk, not return, so use investment appraisal or a decision tree for that."
    - "A business in crisis that must cut costs or turn round, where the question is survival rather than direction."
interpretation: |
  Read the matrix as a map of how far each option takes the business from what it already knows. The further an option sits from market penetration, the more the business must learn about customers, products or both, and the more ways the option can fail.

  A cell's usual risk is a starting point, not a verdict. Market penetration in a saturated market, where every extra sale is won by cutting price, can be riskier than market development into a region whose customers look like the ones at home. The useful reading compares the options on the same kind of evidence and asks, for each one, what the business would have to learn and what finding out would cost.
implications:
  justifies:
    - "Ranking the options by how familiar their products and markets are, and asking for stronger evidence the further an option moves from what the business knows."
    - "Choosing a lower-risk direction when the business lacks the skills, cash or time to learn a new market and a new product at once."
    - "Pairing each direction with a method of growth, such as entering a new market through a joint venture to borrow the local knowledge it lacks."
  doesNotJustify:
    - "Choosing an option because it sits in a low-risk cell: penetration in a market with no room to grow can be the poorer choice."
    - "Rejecting diversification out of hand; it may be the right answer for a business whose present market is in decline."
    - "Any claim about profit or return, which the matrix does not measure."
mistakes:
  - mistake: "Placing an option by how new it is to the industry rather than to the business."
    fix: "Judge 'new' from the business's own position: a café selling its coffee beans online for the first time is developing a market even though other firms already do it."
  - mistake: "Treating the cell's usual risk as the option's actual risk."
    fix: "Add the risk particular to each option, such as the strength of the rivals already in the new market, and let it change the ranking."
  - mistake: "Confusing the direction of growth with the method of growth."
    fix: "State both: market development (the direction) by franchising (the method). Any direction can be pursued by internal growth or by an external method."
  - mistake: "Writing one option per cell as though all four were equally serious."
    fix: "Generate options from the business's strengths and evidence, then compare the two or three that are realistic."
apply:
  - href: /strategy-studio/ansoff/
    scope: full
    use: "Place your own growth options by product and market, choose the method of growth for each, and compare them from the lowest usual risk to the highest, with your own note on the risk particular to each."
  - href: /strategy-studio/decision-tree/
    scope: part
    use: "When two directions are close, put figures on them: the tree weighs each option's outcomes by their probabilities and nets off its cost."

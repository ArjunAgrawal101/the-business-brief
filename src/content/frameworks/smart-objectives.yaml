name: SMART objectives
aliases: [SMART, SMART targets]
summary: "A test for writing objectives that can be checked: specific, measurable, achievable, relevant (or realistic) and time-bound."
question: "Is this objective written so that everyone knows what success looks like and when it is due?"
group: performance
status: enrichment
subtopics: ['1.3']
qualifications: [secondary, undergraduate, mba, professional]
diagram: smart-objectives
explanation: |
  SMART is a checklist for the wording of an objective. Specific: it says exactly what will change. Measurable: success can be shown in figures or clear evidence. Achievable: it can be done with the people, money and time available. Relevant, or in some versions realistic: it serves the organization's strategy. Time-bound: it has a deadline. Versions of the acronym differ, and none has a single agreed source.

  The guide's 1.3 statements cover vision and mission, common business objectives and strategic and tactical objectives (pp. 23 to 24) but do not name SMART, so the test is enrichment for the course, though it is widely used to write the tactical objectives that serve a strategy. It tests how an objective is written, not whether it is the right objective.
purpose: |
  To turn vague aims into objectives that can be delegated, monitored and evaluated, so that managers and staff know what they are working towards and can tell whether it has been achieved.
steps:
  - "Start from the strategic aim the objective should serve."
  - "Make it specific: name the product, market, team or measure involved."
  - "Make it measurable: choose the figure that will show success, and its starting value."
  - "Check it is achievable, against past performance and the resources available."
  - "Check it is relevant to the strategy, and set a deadline."
  - "Read the result as a whole and ask whether meeting it would actually be good for the organization."
example:
  fictional: true
  business: Thread and Needle
  title: Thread and Needle sharpens an aim
  body: |
    The manager of Thread and Needle, a fictional fabric shop, wants to "grow our online sales". Online sales revenue is $40,000 a month, and a similar marketing push last year raised it by 12%.

    Rewritten as a SMART objective: raise online sales revenue from $40,000 to $46,000 a month, a rise of 15%, by the end of June next year, led by the e-commerce manager. The diagram shows how each letter changes the wording.
  result: |
    The SMART version can be monitored month by month and tells the e-commerce manager exactly what is expected. The 15% target is a stretch beyond last year's 12% but within reach. The test cannot say whether growing online is the right priority; that judgement belongs to the strategy.
advantages:
  - "Simple and widely understood, so teams can check objectives quickly."
  - "Clear, measurable objectives make delegation, monitoring and appraisal possible."
  - "A deadline and a measure make progress visible and discussion of performance fairer."
limitations:
  - "A perfectly SMART objective can still aim at the wrong thing."
  - "Rigid targets can encourage gaming of the measure, or neglect of what is not measured."
  - "Some valuable aims, such as a culture of trust, are hard to make measurable without distorting them."
exercise:
  prompt: |
    Rewrite these three aims as SMART objectives for a fictional business of your choice: "improve customer service", "reduce waste" and "be more sustainable". For each, explain one risk the objective could create if it were pursued too rigidly.
  guidance:
    - "Name a specific measure and its starting value for each, such as the average response time to customer emails."
    - "Justify why the target is achievable, for example from past performance."
    - "Set a deadline and, where it helps, an owner."
    - "For the risk, think about what people might do to hit the number, such as answering emails fast but badly."
terms: [smart-objectives, business-objective, strategic-objective, tactical-objective, key-performance-indicator]

title: Leadership and management
code: '2.3'
unit: unit-2
qualification: ib-dp-bm
level: SL/HL with HL-only content
status: complete
summary: What managers do, how leadership differs from management, and how to choose a leadership style that fits the people, the task and the moment.
decisionQuestion: What kind of leadership does this team need now?
situation: >
  Halden Distribution's warehouse was run for fifteen years by a founder who decided everything himself and looked
  after his people. Since a new scanning system arrived, on-time dispatch has fallen, errors have doubled and over half
  the night shift has left in a year. A new site manager has four months to meet a client's deadline. How she leads
  will decide whether she does.
whyItMatters: >
  Every business decision is carried out by people, and how they are led decides how well it is carried out.
  Leadership questions reward judgement about a situation, not loyalty to a favourite style. The style that rescues
  one team can damage another.
syllabus:
  verification: primary
  note: >
    Checked against the Business management guide (p. 26). Subtopic 2.3 covers management and leadership (AO2), the five
    leadership styles (AO3) and, at HL only, scientific and intuitive thinking and management (AO2). The functions of
    management are taught here as a way into what managers do; the guide does not list them separately. Labour turnover,
    used as evidence in this brief, is HL-only content in subtopic 2.4 (p. 26), so its calculation is marked HL.
  items:
    - text: Management and leadership
      level: SL/HL
      verification: primary
    - text: 'Leadership styles: autocratic, paternalistic, democratic, laissez-faire and situational'
      level: SL/HL
      verification: primary
    - text: Scientific and intuitive thinking and management
      level: HL
      verification: primary
objectives:
  - text: Describe the functions of management and apply them to a manager's work.
  - text: Distinguish between management and leadership.
  - text: Explain the autocratic, paternalistic, democratic, laissez-faire and situational styles, with their strengths and limitations.
  - text: Recommend a leadership approach for a given team, task and deadline, and justify it with evidence.
  - text: Distinguish between scientific and intuitive thinking in management, and explain when each suits a decision.
    level: HL
  - text: Explain how the setting, from an emergency department to a start-up, changes which leadership style fits.
  - text: Analyse how a leadership approach affects stakeholders beyond the team that is led.

sections:
  - id: situation
    kind: situation
    title: The situation
    dek: A warehouse, two shifts, one deadline.
    blocks:
      - type: prose
        provenance: simulated-data
        body: >
          Amara Osei joined Halden Distribution in July as site manager, replacing a founder who had run the warehouse
          for fifteen years. Graham Pell knew everyone by name and decided everything. Last December, before Amara arrived,
          Halden introduced a warehouse management system. The day shift was trained and adapted; the night shift,
          newer and led by two new team leaders, was barely trained, and performance has fallen ever since.


          The largest client wants on-time dispatch above 97% by November. Amara could set targets and enforce them. She
          could bring back the founder's warmth. She could hand the problem to the people who do the work, or step back
          and trust the team leaders. Or she could lead each shift differently. Which is right depends on what the
          problem actually is, and the evidence says it is not the same on both shifts.
      - type: callout
        tone: framework
        title: How this brief works
        provenance: aa-framework
        body: >
          First what managers do, then how leading differs from managing, then the styles. Read the evidence by shift
          before you choose. At section 08 you will decide how Amara leads, in the Decision Room.

  - id: management
    kind: learn
    title: What managers do
    dek: The classic functions of management, made concrete.
    blocks:
      - type: definition
        provenance: subject-knowledge
        term: Management
        body: Getting work done through other people by planning, organizing, directing and controlling resources towards an organization's objectives.
      - type: list
        title: The functions of management
        style: numbered
        provenance: source-derived
        sources: [fayol-1916]
        intro: The classic list comes from Henri Fayol, an engineer and manager who wrote about his own practice in 1916.
        items:
          - label: Planning
            body: Deciding the objectives and how to reach them, looking ahead.
          - label: Organizing
            body: Arranging people, roles and resources into a structure that can carry out the plan.
          - label: Commanding
            body: Directing people in their work. Today this is usually called directing, or leading.
          - label: Coordinating
            body: Making the parts of the organization work together, so that their efforts fit.
          - label: Controlling
            body: Measuring performance against the plan and correcting it where it falls short.
      - type: interactive
        component: functions-sorter
        ref: lead-functions-sorter
        title: Sort a manager's week into the five functions
        provenance: source-derived
      - type: misconception
        provenance: subject-knowledge
        claim: Managing is mainly about controlling people.
        correction: >
          Control is one function of five, and it is the last. A manager who only controls, measuring and correcting
          without planning, organizing or coordinating, is reacting to problems that the other functions would have
          prevented.

  - id: leading
    kind: learn
    title: Management and leadership
    dek: Two jobs that the same person usually has to do.
    blocks:
      - type: definition
        provenance: subject-knowledge
        term: Leadership
        body: Influencing and motivating people to work towards a shared goal, often through vision, example and trust rather than through position alone.
      - type: comparison
        title: Management and leadership compared
        caption: A widely taught distinction, associated with John Kotter, is that management copes with complexity and leadership copes with change.
        provenance: source-derived
        sources: [kotter-1990]
        columns: [Management, Leadership]
        rows:
          - label: Purpose
            cells:
              - Keeps a complex organization running reliably.
              - Moves an organization in a new direction.
          - label: Focus
            cells:
              - Plans, budgets, structures and systems.
              - Direction, alignment and motivation.
          - label: Time
            cells:
              - The present, and the next plan.
              - The future, and the change needed to reach it.
          - label: Influence
            cells:
              - Comes mainly from position and systems.
              - Comes mainly from vision, trust and example.
          - label: At Halden
            cells:
              - Rotas, training schedules, the charging rota, daily dispatch figures.
              - Persuading a demoralized night shift that the new system can work for them.
      - type: misconception
        provenance: subject-knowledge
        claim: Leaders and managers are different people.
        correction: >
          They are different jobs, not different people. Most people in charge of others have to do both: run today's
          work reliably and lead people through change. Amara's problem needs both at once.

  - id: styles
    kind: learn
    title: Leadership styles
    dek: Five ways to lead, and what each is good for.
    blocks:
      - type: comparison
        title: The five styles
        provenance: subject-knowledge
        columns: [How decisions are made, Works well when, Risks]
        rows:
          - label: Autocratic
            cells:
              - The leader decides alone and tells others what to do.
              - Speed matters, the task is simple or dangerous, or people are new to it.
              - Low motivation, lost ideas, and dependence on the leader.
          - label: Paternalistic
            cells:
              - The leader decides alone, in what she sees as the staff's interest, and looks after their welfare.
              - Staff value security and trust the leader, as at Halden under its founder.
              - Decisions stay at the top; staff may not develop independence or skills.
          - label: Democratic
            cells:
              - The leader consults, and decisions are shaped by the people affected.
              - People have knowledge to contribute and commitment matters.
              - Slow decisions; consultation that is not acted on breeds cynicism.
          - label: Laissez-faire
            cells:
              - The leader sets few rules and leaves decisions to the team.
              - The team is expert, motivated and works best with autonomy.
              - With an inexperienced team it becomes an absence of leadership.
          - label: Situational
            cells:
              - The leader adapts the style to the task and to each team's readiness.
              - Teams and tasks differ, as Halden's two shifts do.
              - Different treatment can look unfair or inconsistent until it is explained.
      - type: interactive
        component: style-matcher
        ref: lead-style-matcher
        title: Match the style to the situation
        intro: For each situation, choose the style you think fits best. The feedback says whether it is a strong fit, a defensible one or a weak one.
        provenance: subject-knowledge
      - type: mechanism
        title: How an autocratic response can make Halden's problem worse
        provenance: aa-framework
        steps:
          - Dispatch is falling, so the manager sets strict targets and disciplines errors.
          - Effort and compliance rise quickly, and the easy problems are fixed.
          - The night shift's real gap, training on the system, is treated as a discipline problem.
          - Pressure rises without capability rising, and night-shift staff leave.
          - New starters are slower and less trained than the people they replace.
        conclusion: Performance stalls short of the target. The style fitted the problem the manager assumed, not the problem the evidence showed.
      - type: misconception
        provenance: subject-knowledge
        claim: There is one best leadership style.
        correction: >
          Each style works in some situations and damages others. A strong answer names the situation (the people, the
          task, the time available) and argues from it.
      - type: misconception
        provenance: subject-knowledge
        claim: Paternalistic leadership is a kind of democratic leadership, because the leader cares about the staff.
        correction: >
          A paternalistic leader cares about the staff but still decides alone. A democratic leader shares the decision.
          The difference is who decides, not how kind the leader is.
      - type: callout
        tone: enrichment
        title: A model of situational leadership
        provenance: enrichment
        sources: [hersey-blanchard]
        body: >
          One well-known version, from Paul Hersey and Kenneth Blanchard, matches the leader's mix of direction and
          support to the follower's readiness for a particular task: telling and selling for people who are new to it,
          participating and delegating as they become able and willing. Halden's night shift needs direction on the
          system and support to rebuild confidence; its day shift can be delegated to.

  - id: in-practice
    kind: learn
    title: Leadership across organizations
    dek: The same five styles, in very different workplaces.
    blocks:
      - type: prose
        provenance: subject-knowledge
        body: >
          Which style fits depends on the situation, and different organizations create different situations. Three
          features matter most. How much is at stake if a decision is wrong or late: where lives or large sums depend
          on seconds, someone must be able to decide alone. How expert and experienced the people are: experts work
          best with autonomy, while newcomers need direction. And how much the work changes from day to day: routine
          work can be run by rules, while new problems need the ideas of the people closest to them. Size matters too.
          A founder can lead fifteen people personally, but not five hundred.
      - type: comparison
        title: Leadership in six workplaces
        provenance: aa-framework
        caption: >
          Illustrative fits, not rules: in every workplace the right style still depends on the people, the task and
          the moment.
        columns: [The situation, Styles that often fit, Why]
        rows:
          - label: Hospital emergency department
            cells:
              - Decisions in seconds, by trained teams, with lives at stake.
              - Autocratic in the emergency itself; democratic in the review afterwards.
              - Clear command saves time when it matters most; the review needs everyone's view of what went wrong.
          - label: Software start-up
            cells:
              - Expert, motivated developers solving new problems.
              - Laissez-faire or democratic, within goals the founders set.
              - Experts do their best work with autonomy, and their ideas are the product.
          - label: Fast-food restaurant
            cells:
              - Young, often new staff following set procedures at speed.
              - Autocratic for safety and procedure, with situational coaching for new staff.
              - Consistency and hygiene need clear rules, and new staff need direction before they are given more freedom.
          - label: Family-owned manufacturer
            cells:
              - Long-serving staff and a founder who knows everyone.
              - Paternalistic, moving towards democratic as the next generation takes over.
              - Loyalty and security are valued, but a business that depends on one person's decisions cannot outlast them.
          - label: Research laboratory
            cells:
              - Highly qualified specialists on long, uncertain projects.
              - Laissez-faire within agreed goals, democratic for shared decisions.
              - Close control would waste expertise; agreed goals and regular reviews keep projects pointed the same way.
          - label: Volunteer-run charity
            cells:
              - Volunteers who give their time for the cause.
              - Democratic.
              - People who are not paid stay when they have a say, and a volunteer who is simply told what to do can stop coming.
      - type: example
        title: From founders to teams (fictional)
        provenance: simulated-data
        body: >
          Lumière Logiciels, a fictional software start-up in Montreal, was run in a laissez-faire way by its two
          founders while it had eight developers, who chose their own projects within the product's goals. At sixty
          staff, three teams were building overlapping features and two important customers' requests had waited
          months. The founders kept the developers' freedom over how work is done, but introduced goals agreed with
          each team every quarter and a weekly meeting at which priorities are set together: a move from laissez-faire
          towards democratic leadership, with more structure, as the business grew.
      - type: example
        title: One manager, two styles in one week (fictional)
        provenance: simulated-data
        body: >
          Sabiá Foods, a fictional frozen-food plant with 240 workers, had an alarm for a refrigerant leak on a
          Tuesday night. The shift manager gave orders and everyone followed the evacuation drill without discussion,
          as they should. The following Monday the same manager ran a meeting at which the team redesigned the drill,
          because the people on the floor had noticed that one exit was often blocked by pallets. Autocratic in the
          emergency, democratic in the review: situational leadership in a single week.
      - type: misconception
        provenance: subject-knowledge
        claim: Laissez-faire leadership means the leader does nothing.
        correction: >
          A laissez-faire leader sets the goals, provides the resources and stays available, but leaves the team to
          decide how to reach them. A leader who sets no goals and offers no support is absent, not laissez-faire,
          which is the risk on Halden's night shift if its two new team leaders are simply left alone.
      - type: callout
        tone: note
        title: Practise and revise
        provenance: aa-framework
        body: >
          Practise matching styles to situations in the [leadership
          scenarios](/people-and-culture/leadership-scenarios/), read the [leadership styles
          framework](/frameworks/leadership-styles/), and see the whole subtopic on one page in the [2.3
          mindmap](/mindmaps/leadership-and-management/).

  - id: evidence
    kind: evidence
    title: The evidence, by shift
    dek: The problem is not spread evenly, so the answer should not be either.
    blocks:
      - type: exhibit
        case: halden-distribution
        exhibit: ex-2
        provenance: simulated-data
        commentary: >
          Night-shift turnover is more than twice the day shift's, its team leaders have under a year's experience, and
          its staff had a third of the training. Each of those points to a different kind of leadership.
      - type: worked
        title: Labour turnover on the night shift
        calculation: labour-turnover
        level: HL
        provenance: simulated-data
        inputs: { leavers: 28, averageEmployees: 54 }
        interpretation: Over half of the night shift's average workforce left in the year.
        implication: Against 22.2% on days and 18.9% for the whole site two years ago, this is a problem concentrated on one shift, which a site-wide policy would treat in the wrong place.
      - type: exhibit
        case: halden-distribution
        exhibit: ex-3
        provenance: simulated-data
        commentary: The night shift does not lack effort. It lacks training, consultation and a team leader who can help. Those are leadership problems.
      - type: exhibit
        case: halden-distribution
        exhibit: ex-5
        provenance: simulated-data
        commentary: Eleven of the twenty-four leavers interviewed blamed the scanners. Only four cited pay, which is the one thing Amara cannot change before April.

  - id: tools
    kind: tools
    title: Tools for leading the change
    dek: A force field analysis turns a change into the forces a leader can work on.
    blocks:
      - type: prose
        provenance: ib-requirement
        sources: [ib-bm-guide-2024]
        body: >
          The guide lists [force field analysis](/toolkit/force-field-analysis/) among the seven HL-only tools of the
          business management toolkit, and suggests it for unit 2 (pp. 14 and 25). SL students do not need it for
          assessment, but the question it asks is useful to everyone leading a change: what is pushing the change
          forward, what is holding it back, and which of those forces can a leader actually move?
      - type: interactive
        component: force-field-builder
        ref: lead-forcefield-halden
        level: HL
        title: Weigh the forces for and against the new system
        intro: Score each force, then decide which restraining force Amara could weaken first, and how.
        provenance: simulated-data

  - id: decide
    kind: decide
    title: Make the decision
    dek: Choose an approach for ninety days, then lead through one bad night.
    blocks:
      - type: callout
        tone: framework
        title: Enter the Decision Room
        provenance: aa-framework
        body: >
          Choose how Amara leads, see the simulated results for each shift, then decide how she handles a system failure
          two weeks before the peak. [Open the Halden Distribution Decision Room](/decision-room/halden-leadership/).

  - id: evaluate
    kind: evaluate
    title: Choosing a style
    dek: Five questions to ask before deciding how to lead.
    blocks:
      - type: list
        title: Before choosing a style, ask
        style: numbered
        provenance: aa-framework
        items:
          - label: The people
            body: How skilled, experienced and motivated are they, for this particular task?
          - label: The task
            body: How complex, risky or standardized is it?
          - label: The time
            body: How urgent is the decision, and how long is there to act?
          - label: The culture
            body: What do people expect of a leader here, and why?
          - label: The leader
            body: Which styles can this leader carry out credibly?
      - type: definition
        level: HL
        provenance: subject-knowledge
        term: Scientific decision-making
        body: Making a decision by a logical process of gathering data, analysing it, setting out the options and choosing on the evidence.
      - type: definition
        level: HL
        provenance: subject-knowledge
        term: Intuitive decision-making
        body: Making a decision on judgement, experience and instinct, without a formal process of gathering and analysing data.
      - type: comparison
        title: Scientific and intuitive decision-making
        level: HL
        provenance: subject-knowledge
        columns: [Scientific, Intuitive]
        rows:
          - label: Speed
            cells:
              - Slower; data must be gathered and analysed.
              - Fast; useful when there is no time to analyse.
          - label: Reliability
            cells:
              - Less prone to bias, if the data are good.
              - Depends on the experience behind the instinct, and is exposed to bias.
          - label: Best when
            cells:
              - The decision is large, the data exist and there is time to use them.
              - The situation is urgent, familiar to the decision-maker, or the data do not exist.
          - label: At Halden, the night the scanners fail
            cells:
              - Twenty minutes sorting the queue by promised delivery protects the most important client's orders.
              - Taking charge at once gets the most orders out, but not the right ones first.
      - type: callout
        tone: caution
        title: Why this content carries an HL label
        level: HL
        provenance: ib-requirement
        sources: [ib-bm-guide-2024]
        body: >
          The guide lists scientific and intuitive thinking and management as HL-only content in 2.3, at AO2 (p. 26). SL
          students are not assessed on it, but the question it asks, when to trust analysis and when to trust
          experience, improves any answer about leadership.
      - type: misconception
        level: HL
        provenance: subject-knowledge
        claim: Scientific decision-making in 2.3 is the same thing as Taylor's scientific management.
        correction: >
          Taylor's scientific management (2.4) is a theory of how to design and pay for work, with each task timed and
          paid by output. Scientific thinking in 2.3 is a way of making decisions: gathering data, analysing it and
          choosing on the evidence. The two share a faith in measurement, but they answer different questions.
      - type: callout
        tone: enrichment
        title: When can intuition be trusted?
        level: HL
        provenance: enrichment
        sources: [adv-pm-kahneman-klein-2009]
        body: >
          Daniel Kahneman and Gary Klein (2009) argued that an expert's intuition deserves trust when the environment
          is regular enough to be learned and the expert has had long practice with quick, clear feedback, as an
          experienced firefighter or nurse often has. It deserves much less where outcomes are unpredictable or
          feedback comes slowly, as in many long-term business forecasts. A manager's intuition about a familiar
          warehouse floor may be sound; the same manager's intuition about next year's demand is closer to a guess.

  - id: stakeholders
    kind: evaluate
    title: Who feels the leadership
    dek: A style is chosen for a team, but its effects reach every group with a stake in the business.
    blocks:
      - type: prose
        provenance: subject-knowledge
        body: >
          Leadership is usually discussed as a matter between a leader and a team, but its effects travel. A team that
          is well led serves customers better, makes fewer costly mistakes and stays longer, which owners notice in
          the accounts and clients notice in the service. A team that is badly led passes its problems outwards:
          missed deliveries, unhappy customers, the cost of recruiting replacements and sometimes a public dispute. So
          a strong answer on leadership names the stakeholders a style affects beyond the team, and asks whether their
          interests pull the same way ([1.4](/topics/stakeholders/)).
      - type: comparison
        title: Two approaches at Halden, six stakeholders
        provenance: aa-framework
        caption: >
          Likely effects, reasoned from the evidence in this brief. The Decision Room shows simulated results for
          every approach.
        columns: [What it wants, An autocratic turnaround, Situational leadership by shift]
        rows:
          - label: Night-shift pickers
            cells:
              - Training, consultation and fair treatment.
              - More pressure without more training, so more of them leave.
              - Daily coaching, training on the system and a say in how it works.
          - label: Day-shift pickers
            cells:
              - Stability, and not to carry the night shift's problems.
              - New rules and targets they did not need, from a manager they hardly know.
              - Left to their experienced team leaders, though some may ask why the night shift gets more attention.
          - label: Team leaders
            cells:
              - Authority to run their teams, and help with problems they cannot solve.
              - Bypassed by a manager who decides everything.
              - Trusted to run the day shift; coached and supported on the night shift.
          - label: Amara Osei
            cells:
              - Results, and her authority, in her first role at Halden.
              - Visible control and quick early gains, with the risk of falling short of the deadline.
              - More work at first, adapting her style to each shift and explaining why.
          - label: Lumen Home, the client
            cells:
              - On-time dispatch above 97% by November.
              - Faster early gains, but nothing done about the cause on the night shift.
              - A slower start, then a fix aimed at the cause.
          - label: Halden's owners
            cells:
              - Keeping the client and the site's profit.
              - Quick signs of action, while turnover and its costs continue.
              - A plan that depends on the night shift's recovery, with lower turnover if it works.
      - type: list
        title: 'Beyond Halden: who else a leadership style reaches'
        style: pairs
        provenance: subject-knowledge
        items:
          - label: Customers
            body: >
              Meet the results of leadership in the service they receive. Staff who are trusted to solve problems can
              put a customer's complaint right on the spot.
          - label: Owners and shareholders
            body: >
              Gain from a well-led workforce through productivity and lower turnover, and lose when a dominant
              leader's mistakes go unchallenged.
          - label: Suppliers
            body: Deal with managers whose style shapes how disagreements are settled and whether agreements are kept.
          - label: The local community
            body: >
              Feels a leader's choices in a workplace's safety record, its treatment of local staff and its reputation
              as an employer.
          - label: Government and regulators
            body: >
              Hold managers to account for safety and employment law, which a leader who silences bad news may break
              without knowing.
      - type: misconception
        provenance: subject-knowledge
        claim: Leadership style only matters to the people being led.
        correction: >
          The style decides how well work is done and how long people stay, and both reach customers, owners and
          clients, as Halden's client deadline shows. A style can please the team and fail the customer, or the
          reverse.
      - type: callout
        tone: caution
        title: Whose interests does the leader serve?
        provenance: aa-framework
        body: >
          A leader can win quick results by pushing a team hard, and the owners and the client may approve while the
          cost falls on the staff who leave. Situational leadership treats groups differently, which is fair only if
          the reasons are explained and rest on what each group needs. When you judge a style, ask who gains, who
          pays, and whether they were told.

  - id: assess
    kind: assess
    title: Exam-style practice
    dek: >
      Original questions in the style of the papers, each followed by what a strong response does. They are not IB
      questions, and the guidance is not an official markscheme. Answer before you read it.
    blocks:
      - type: prose
        title: Question 1 · Outline · 4 marks
        provenance: original-practice
        body: >
          Outline **two** functions of management that Amara Osei carries out in her first month at Halden
          Distribution.
      - type: callout
        tone: exam
        title: 'Question 1: what a strong response does'
        provenance: assessment-explanation
        body: |
          A strong response states two distinct functions and gives the key feature of each from the case, in a sentence or two.

          - **Planning:** setting the target of on-time dispatch above 97% by November and deciding how to reach it.
          - **Controlling:** measuring dispatch, errors and turnover by shift, as in the exhibits, and correcting where they fall short.
          - Organizing (arranging training on the system), commanding or directing (instructing the shifts) and coordinating (making the two shifts and the client's needs fit together) are equally valid.

          One mark for each function and one for applying it to Amara's work.
      - type: prose
        title: Question 2 · Demonstrate · 4 marks
        provenance: original-practice
        body: Using Exhibit 3, demonstrate that the night shift's problem is one of leadership rather than effort.
      - type: callout
        tone: exam
        title: 'Question 2: what a strong response does'
        provenance: assessment-explanation
        body: |
          A strong response proves the point from the survey figures rather than asserting it.

          - **Training:** 33% of the night shift say they have had the training they need on the new system, against 72% of the day shift.
          - **Consultation and support:** 21% feel consulted about changes, against 38%, and 48% say their team leader helps them solve problems, against 74%.
          - **Clarity:** 54% know what is expected of them, against 81%.
          - **The conclusion:** each gap is about training, consultation, direction and support, which leaders provide, not about how hard people work. The exit interviews, in which leavers blamed the scanners far more often than pay, point the same way.
      - type: prose
        title: Question 3 · Compare and contrast · 10 marks
        provenance: original-practice
        body: Compare and contrast paternalistic and democratic leadership as approaches for Halden's day shift.
      - type: callout
        tone: exam
        title: 'Question 3: what a strong response does'
        provenance: assessment-explanation
        body: |
          A strong response sets out similarities and differences point by point, with both styles in every point and evidence from Halden, then judges which difference matters most for the day shift.

          - **Similarities:** both care about staff and their welfare, both can build loyalty, and both suit long-serving staff better than a purely autocratic approach.
          - **Who decides:** the paternalistic leader decides alone, in what she sees as the staff's interest; the democratic leader shares the decision with them.
          - **Use of the shift's experience:** the day shift has worked at Halden for 7.4 years on average and has adapted to the system, so a democratic approach can draw on what it knows, while a paternalistic one leaves that knowledge unused.
          - **Fit with expectations:** after fifteen years under a paternalistic founder, staff may expect to be looked after, so a move to democratic leadership may need explaining.
          - **Judgement:** for example, that who decides matters most, because the day shift is experienced and performing well, so democratic leadership, or delegation to its team leaders, makes better use of it than paternalism.

          An answer that describes each style in turn, without comparing them point by point, does not compare and contrast.
      - type: prose
        title: Question 4 · Suggest · 4 marks
        level: HL
        provenance: original-practice
        body: >
          Suggest when Amara should rely on intuitive rather than scientific decision-making during the peak season.
      - type: callout
        tone: exam
        title: 'Question 4: what a strong response does'
        level: HL
        provenance: assessment-explanation
        body: |
          A strong response puts forward situations in which intuition fits, each with a reason drawn from the case.

          - **When there is no time to gather data:** for example, a scanner failure in the middle of a night shift, when orders must start moving within minutes.
          - **When the situation is familiar to someone experienced:** for example, a day-shift team leader with about nine years in the role judging a sudden backlog, whose experience gives the intuition something to rest on.
          - A strong answer adds the limit: where data exist and there is a little time, such as deciding which orders to send first for the client, a short analysis protects the most important orders, as the night the scanners failed shows.

conceptLens:
  - concept: change
    question: What does the change ask of people, and were they asked?
    insight: >
      Halden's system was imposed without consultation or enough training. How a change is led often matters more than
      what the change is.
  - concept: creativity
    question: Who has the ideas?
    insight: >
      The night shift found the charging rota fault because they lived with it every night. Democratic and situational
      leadership can surface ideas that an autocratic leader never hears.
  - concept: ethics
    question: Is it fair to lead people differently?
    insight: >
      Leading the night shift differently is fair if it rests on their needs and is explained openly. It becomes unfair
      when it rests on favour, or is kept hidden.
  - concept: sustainability
    question: Can the leader step away?
    insight: >
      A team that performs only while the manager is on the floor is not sustainable. The test of leadership is what
      happens on the night she is not there.

lenses:
  - pathway: entrepreneurs
    title: From founder to leader
    provenance: aa-framework
    body: >
      Many founders lead as Halden's founder did, deciding everything and looking after everyone. It works until the
      business is bigger than one person's attention. Learning to delegate is usually the hardest step in a small
      business's growth, and it starts with knowing which decisions only you can make.
  - pathway: undergraduate
    title: Contingency theories of leadership
    provenance: enrichment
    body: >
      Situational approaches belong to a family of contingency theories, which hold that the effective style depends on
      the situation. University courses compare them with trait, behavioural and transformational theories and examine
      the evidence for each.
  - pathway: mba
    title: Leading a turnaround
    provenance: enrichment
    body: >
      Turnaround leadership often combines early directive action, to stabilize performance and show that things will
      change, with consultation, to find the real causes. The order matters: stabilize, diagnose, then involve. Halden's
      situational path follows that order on one shift and skips the first step on the other, where it is not needed.
  - pathway: secondary
    title: For IGCSE and other courses
    provenance: aa-framework
    body: >
      Secondary courses usually teach autocratic, democratic and laissez-faire styles. Check whether yours includes
      paternalistic and situational leadership, and whether it uses different names for the functions of management.

teaching:
  sequence:
    - minutes: 5
      activity: "Hook. Read the founder's quote (Exhibit 6) aloud and ask: was Graham a good leader?"
    - minutes: 10
      activity: Functions of management with the sorter. Discuss the items that combine two functions.
    - minutes: 15
      activity: Teach the five styles with the comparison table, then run the style matcher as a whole-class vote.
    - minutes: 15
      activity: Groups read Exhibits 2, 3 and 5 by shift and write one sentence each on what the night shift's problem is.
    - minutes: 15
      activity: Decision Room in groups. Each group commits to an approach and predicts peak-week dispatch before revealing it.
    - minutes: 5
      activity: Exit ticket. Distinguish between paternalistic and democratic leadership in two sentences.
  prompts:
    - Was the founder a good leader, a good manager, both or neither?
    - Can a leader be both autocratic and caring?
    - Is it fair to lead two shifts differently?
    - When should a leader ignore the results of consultation?
    - Who outside the team gains or loses from how it is led?
  notes: >
    Listen for answers that name a style without naming the situation, and for the confusion of paternalistic with
    democratic leadership. HL groups can extend the crisis round into scientific and intuitive decision-making.

revision:
  keyPoints:
    - The classic functions of management are planning, organizing, commanding (directing), coordinating and controlling.
    - Management copes with complexity; leadership copes with change. Most people in charge have to do both.
    - Autocratic leaders decide alone; paternalistic leaders decide alone in what they see as the staff's interest; democratic leaders consult; laissez-faire leaders leave decisions to the team.
    - Situational leadership adapts the style to the task and to the readiness of the people.
    - 'HL only: labour turnover = (employees leaving ÷ average number of employees) × 100.'
    - At HL, scientific decision-making analyses data before deciding; intuitive decision-making relies on experience and judgement.
    - 'Different workplaces create different situations: urgent, high-stakes work favours a decisive leader in the moment, expert and changing work favours democratic or laissez-faire leadership, and new staff on routine tasks need direction.'
    - 'Leadership reaches beyond the team: customers, clients, owners and regulators all feel how a team is led, so judge a style by its effects on them too.'
  retrieval:
    - q: Name the five classic functions of management.
      a: Planning, organizing, commanding (directing), coordinating and controlling.
    - q: What is the difference between paternalistic and democratic leadership?
      a: A paternalistic leader decides alone, in what they see as the staff's interest; a democratic leader involves staff in the decision.
    - q: When does laissez-faire leadership work well?
      a: With an expert, motivated team that works best with autonomy.
    - q: What is situational leadership?
      a: Adapting the leadership style to the task and to the readiness of the people being led.
    - q: (HL) How is labour turnover calculated?
      a: Number of employees leaving in a period, divided by the average number of employees, multiplied by 100.
    - q: When is intuitive decision-making most useful?
      a: When the decision is urgent, the situation is familiar to an experienced decision-maker, or the data do not exist.
    - q: Why might an emergency department use autocratic leadership during an emergency and democratic leadership afterwards?
      a: In the emergency, decisions must be made in seconds by someone with authority; in the review afterwards, everyone's view of what went wrong is needed to improve.
    - q: (HL) How does scientific thinking in 2.3 differ from Taylor's scientific management?
      a: Scientific thinking is a way of making decisions on gathered and analysed data; Taylor's scientific management (2.4) is a theory of designing work, timing tasks and paying by output.
  traps:
    - Naming a style without explaining why it fits the situation in the case.
    - Treating paternalistic leadership as democratic because the leader is kind.
    - Recommending one style for a whole organization when the evidence shows different teams with different needs.
    - Analysing a leadership style only for the team, and ignoring its effects on customers, owners and clients.


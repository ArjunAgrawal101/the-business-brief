title: Leadership and management
code: '2.3'
unit: unit-2
qualification: ib-dp-bm
level: SL/HL with HL-only content
status: complete
summary: What managers do, how leadership differs from management, and how to choose a leadership style that fits the people, the task and the moment.
decisionQuestion: What kind of leadership does this team need now?
situation: >
  Halden Distribution's warehouse was run for fifteen years by a founder who decided everything himself and looked
  after his people. Since a new scanning system arrived, on-time dispatch has fallen, errors have doubled and over half
  the night shift has left in a year. A new site manager has four months to meet a client's deadline. How she leads
  will decide whether she does.
whyItMatters: >
  Every business decision is carried out by people, and how they are led decides how well it is carried out.
  Leadership questions reward judgement about a situation, not loyalty to a favourite style. The style that rescues
  one team can damage another.
syllabus:
  verification: corroborated
  note: >
    The content of this subtopic is corroborated by secondary sources (claims register, leadership-content). One
    secondary source places scientific and intuitive decision-making in this subtopic as HL-only content. That is
    unverified (leadership-hl-decisions), and the platform teaches it with an HL label until the Guide is checked.
  items:
    - text: Key functions of management
      level: SL/HL
      verification: corroborated
    - text: Management versus leadership
      level: SL/HL
      verification: corroborated
    - text: 'Leadership styles: autocratic, paternalistic, democratic, laissez-faire and situational'
      level: SL/HL
      verification: corroborated
    - text: Scientific and intuitive decision-making
      level: HL
      verification: unverified
objectives:
  - text: Describe the functions of management and apply them to a manager's work.
  - text: Distinguish between management and leadership.
  - text: Explain the autocratic, paternalistic, democratic, laissez-faire and situational styles, with their strengths and limitations.
  - text: Recommend a leadership approach for a given team, task and deadline, and justify it with evidence.
  - text: Compare scientific and intuitive decision-making and judge when each is appropriate.
    level: HL

sections:
  - id: situation
    kind: situation
    title: The situation
    dek: A warehouse, two shifts, one deadline.
    blocks:
      - type: prose
        provenance: simulated-data
        body: >
          Amara Osei joined Halden Distribution in July as site manager, replacing a founder who had run the warehouse
          for fifteen years. Graham Pell knew everyone by name and decided everything. In February, before Amara arrived,
          Halden introduced a warehouse management system. The day shift was trained and adapted; the night shift,
          newer and led by two new team leaders, was barely trained, and performance has fallen ever since.


          The largest client wants on-time dispatch above 97% by November. Amara could set targets and enforce them. She
          could bring back the founder's warmth. She could hand the problem to the people who do the work, or step back
          and trust the team leaders. Or she could lead each shift differently. Which is right depends on what the
          problem actually is, and the evidence says it is not the same on both shifts.
      - type: callout
        tone: framework
        title: How this brief works
        provenance: aa-framework
        body: >
          First what managers do, then how leading differs from managing, then the styles. Read the evidence by shift
          before you choose. At section 07 you will decide how Amara leads, in the Decision Room.

  - id: management
    kind: learn
    title: What managers do
    dek: The classic functions of management, made concrete.
    blocks:
      - type: definition
        provenance: subject-knowledge
        term: Management
        body: Getting work done through other people by planning, organizing, directing and controlling resources towards an organization's objectives.
      - type: list
        title: The functions of management
        style: numbered
        provenance: source-derived
        sources: [fayol-1916]
        intro: The classic list comes from Henri Fayol, an engineer and manager who wrote about his own practice in 1916.
        items:
          - label: Planning
            body: Deciding the objectives and how to reach them, looking ahead.
          - label: Organizing
            body: Arranging people, roles and resources into a structure that can carry out the plan.
          - label: Commanding
            body: Directing people in their work. Today this is usually called directing, or leading.
          - label: Coordinating
            body: Making the parts of the organization work together, so that their efforts fit.
          - label: Controlling
            body: Measuring performance against the plan and correcting it where it falls short.
      - type: interactive
        component: functions-sorter
        ref: lead-functions-sorter
        title: Sort a manager's week into the five functions
        provenance: source-derived
      - type: misconception
        provenance: subject-knowledge
        claim: Managing is mainly about controlling people.
        correction: >
          Control is one function of five, and it is the last. A manager who only controls, measuring and correcting
          without planning, organizing or coordinating, is reacting to problems that the other functions would have
          prevented.

  - id: leading
    kind: learn
    title: Management and leadership
    dek: Two jobs that the same person usually has to do.
    blocks:
      - type: definition
        provenance: subject-knowledge
        term: Leadership
        body: Influencing and motivating people to work towards a shared goal, often through vision, example and trust rather than through position alone.
      - type: comparison
        title: Management and leadership compared
        caption: A widely taught distinction, associated with John Kotter, is that management copes with complexity and leadership copes with change.
        provenance: source-derived
        sources: [kotter-1990]
        columns: [Management, Leadership]
        rows:
          - label: Purpose
            cells:
              - Keeps a complex organization running reliably.
              - Moves an organization in a new direction.
          - label: Focus
            cells:
              - Plans, budgets, structures and systems.
              - Direction, alignment and motivation.
          - label: Time
            cells:
              - The present, and the next plan.
              - The future, and the change needed to reach it.
          - label: Influence
            cells:
              - Comes mainly from position and systems.
              - Comes mainly from vision, trust and example.
          - label: At Halden
            cells:
              - Rotas, training schedules, the charging rota, daily dispatch figures.
              - Persuading a demoralized night shift that the new system can work for them.
      - type: misconception
        provenance: subject-knowledge
        claim: Leaders and managers are different people.
        correction: >
          They are different jobs, not different people. Most people in charge of others have to do both: run today's
          work reliably and lead people through change. Amara's problem needs both at once.

  - id: styles
    kind: learn
    title: Leadership styles
    dek: Five ways to lead, and what each is good for.
    blocks:
      - type: comparison
        title: The five styles
        provenance: subject-knowledge
        columns: [How decisions are made, Works well when, Risks]
        rows:
          - label: Autocratic
            cells:
              - The leader decides alone and tells others what to do.
              - Speed matters, the task is simple or dangerous, or people are new to it.
              - Low motivation, lost ideas, and dependence on the leader.
          - label: Paternalistic
            cells:
              - The leader decides alone, in what she sees as the staff's interest, and looks after their welfare.
              - Staff value security and trust the leader, as at Halden under its founder.
              - Decisions stay at the top; staff may not develop independence or skills.
          - label: Democratic
            cells:
              - The leader consults, and decisions are shaped by the people affected.
              - People have knowledge to contribute and commitment matters.
              - Slow decisions; consultation that is not acted on breeds cynicism.
          - label: Laissez-faire
            cells:
              - The leader sets few rules and leaves decisions to the team.
              - The team is expert, motivated and works best with autonomy.
              - With an inexperienced team it becomes an absence of leadership.
          - label: Situational
            cells:
              - The leader adapts the style to the task and to each team's readiness.
              - Teams and tasks differ, as Halden's two shifts do.
              - Different treatment can look unfair or inconsistent until it is explained.
      - type: interactive
        component: style-matcher
        ref: lead-style-matcher
        title: Match the style to the situation
        intro: For each situation, choose the style you think fits best. The feedback says whether it is a strong fit, a defensible one or a weak one.
        provenance: subject-knowledge
      - type: mechanism
        title: How an autocratic response can make Halden's problem worse
        provenance: aa-framework
        steps:
          - Dispatch is falling, so the manager sets strict targets and disciplines errors.
          - Effort and compliance rise quickly, and the easy problems are fixed.
          - The night shift's real gap, training on the system, is treated as a discipline problem.
          - Pressure rises without capability rising, and night-shift staff leave.
          - New starters are slower and less trained than the people they replace.
        conclusion: Performance stalls short of the target. The style fitted the problem the manager assumed, not the problem the evidence showed.
      - type: misconception
        provenance: subject-knowledge
        claim: There is one best leadership style.
        correction: >
          Each style works in some situations and damages others. A strong answer names the situation (the people, the
          task, the time available) and argues from it.
      - type: misconception
        provenance: subject-knowledge
        claim: Paternalistic leadership is a kind of democratic leadership, because the leader cares about the staff.
        correction: >
          A paternalistic leader cares about the staff but still decides alone. A democratic leader shares the decision.
          The difference is who decides, not how kind the leader is.
      - type: callout
        tone: enrichment
        title: A model of situational leadership
        provenance: enrichment
        sources: [hersey-blanchard]
        body: >
          One well-known version, from Paul Hersey and Kenneth Blanchard, matches the leader's mix of direction and
          support to the follower's readiness for a particular task: telling and selling for people who are new to it,
          participating and delegating as they become able and willing. Halden's night shift needs direction on the
          system and support to rebuild confidence; its day shift can be delegated to.

  - id: evidence
    kind: evidence
    title: The evidence, by shift
    dek: The problem is not spread evenly, so the answer should not be either.
    blocks:
      - type: exhibit
        case: halden-distribution
        exhibit: ex-2
        provenance: simulated-data
        commentary: >
          Night-shift turnover is more than twice the day shift's, its team leaders have under a year's experience, and
          its staff had a third of the training. Each of those points to a different kind of leadership.
      - type: worked
        title: Labour turnover on the night shift
        calculation: labour-turnover
        provenance: simulated-data
        inputs: { leavers: 28, averageEmployees: 54 }
        interpretation: Over half of the night shift's average workforce left in the year.
        implication: Against 22.2% on days and 18.9% for the whole site two years ago, this is a problem concentrated on one shift, which a site-wide policy would treat in the wrong place.
      - type: exhibit
        case: halden-distribution
        exhibit: ex-3
        provenance: simulated-data
        commentary: The night shift does not lack effort. It lacks training, consultation and a team leader who can help. Those are leadership problems.
      - type: exhibit
        case: halden-distribution
        exhibit: ex-5
        provenance: simulated-data
        commentary: Eleven of the twenty-four leavers interviewed blamed the scanners. Only four cited pay, which is the one thing Amara cannot change before April.

  - id: tools
    kind: tools
    title: Tools for leading the change
    dek: A force field analysis turns a change into the forces a leader can work on.
    blocks:
      - type: prose
        provenance: assessment-explanation
        body: >
          Force field analysis is one of the seven tools that secondary sources list as HL only in the business
          management toolkit. SL students do not need it for assessment, but the question it asks is useful to everyone
          leading a change: what is pushing the change forward, what is holding it back, and which of those forces can a
          leader actually move?
      - type: interactive
        component: force-field-builder
        ref: lead-forcefield-halden
        level: HL
        title: Weigh the forces for and against the new system
        intro: Score each force, then decide which restraining force Amara could weaken first, and how.
        provenance: simulated-data

  - id: decide
    kind: decide
    title: Make the decision
    dek: Choose an approach for ninety days, then lead through one bad night.
    blocks:
      - type: callout
        tone: framework
        title: Enter the Decision Room
        provenance: aa-framework
        body: >
          Choose how Amara leads, see the simulated results for each shift, then decide how she handles a system failure
          two weeks before the peak. [Open the Halden Distribution Decision Room](/decision-room/halden-leadership/).

  - id: evaluate
    kind: evaluate
    title: Choosing a style
    dek: Five questions to ask before deciding how to lead.
    blocks:
      - type: list
        title: Before choosing a style, ask
        style: numbered
        provenance: aa-framework
        items:
          - label: The people
            body: How skilled, experienced and motivated are they, for this particular task?
          - label: The task
            body: How complex, risky or standardized is it?
          - label: The time
            body: How urgent is the decision, and how long is there to act?
          - label: The culture
            body: What do people expect of a leader here, and why?
          - label: The leader
            body: Which styles can this leader carry out credibly?
      - type: definition
        level: HL
        provenance: subject-knowledge
        term: Scientific decision-making
        body: Making a decision by a logical process of gathering data, analysing it, setting out the options and choosing on the evidence.
      - type: definition
        level: HL
        provenance: subject-knowledge
        term: Intuitive decision-making
        body: Making a decision on judgement, experience and instinct, without a formal process of gathering and analysing data.
      - type: comparison
        title: Scientific and intuitive decision-making
        level: HL
        provenance: subject-knowledge
        columns: [Scientific, Intuitive]
        rows:
          - label: Speed
            cells:
              - Slower; data must be gathered and analysed.
              - Fast; useful when there is no time to analyse.
          - label: Reliability
            cells:
              - Less prone to bias, if the data are good.
              - Depends on the experience behind the instinct, and is exposed to bias.
          - label: Best when
            cells:
              - The decision is large, the data exist and there is time to use them.
              - The situation is urgent, familiar to the decision-maker, or the data do not exist.
          - label: At Halden, the night the scanners fail
            cells:
              - Twenty minutes sorting the queue by promised delivery protects the most important client's orders.
              - Taking charge at once gets the most orders out, but not the right ones first.
      - type: callout
        tone: caution
        title: Why this content carries an HL label
        level: HL
        provenance: aa-framework
        body: >
          One secondary source places scientific and intuitive decision-making in subtopic 2.3 as HL-only content. The
          platform has not been able to check this against the Guide, so it is labelled HL and marked unverified in the
          claims register. If you are an SL student, read it anyway: it will improve your answers on leadership.

conceptLens:
  - concept: change
    question: What does the change ask of people, and were they asked?
    insight: >
      Halden's system was imposed without consultation or enough training. How a change is led often matters more than
      what the change is.
  - concept: creativity
    question: Who has the ideas?
    insight: >
      The night shift found the charging rota fault because they lived with it every night. Democratic and situational
      leadership can surface ideas that an autocratic leader never hears.
  - concept: ethics
    question: Is it fair to lead people differently?
    insight: >
      Leading the night shift differently is fair if it rests on their needs and is explained openly. It becomes unfair
      when it rests on favour, or is kept hidden.
  - concept: sustainability
    question: Can the leader step away?
    insight: >
      A team that performs only while the manager is on the floor is not sustainable. The test of leadership is what
      happens on the night she is not there.

lenses:
  - pathway: entrepreneurs
    title: From founder to leader
    provenance: aa-framework
    body: >
      Many founders lead as Halden's founder did, deciding everything and looking after everyone. It works until the
      business is bigger than one person's attention. Learning to delegate is usually the hardest step in a small
      business's growth, and it starts with knowing which decisions only you can make.
  - pathway: undergraduate
    title: Contingency theories of leadership
    provenance: enrichment
    body: >
      Situational approaches belong to a family of contingency theories, which hold that the effective style depends on
      the situation. University courses compare them with trait, behavioural and transformational theories and examine
      the evidence for each.
  - pathway: mba
    title: Leading a turnaround
    provenance: enrichment
    body: >
      Turnaround leadership often combines early directive action, to stabilize performance and show that things will
      change, with consultation, to find the real causes. The order matters: stabilize, diagnose, then involve. Halden's
      situational path follows that order on one shift and skips the first step on the other, where it is not needed.
  - pathway: secondary
    title: For IGCSE and other courses
    provenance: aa-framework
    body: >
      Secondary courses usually teach autocratic, democratic and laissez-faire styles. Check whether yours includes
      paternalistic and situational leadership, and whether it uses different names for the functions of management.

teaching:
  sequence:
    - minutes: 5
      activity: "Hook. Read the founder's quote (Exhibit 6) aloud and ask: was Graham a good leader?"
    - minutes: 10
      activity: Functions of management with the sorter. Discuss the items that combine two functions.
    - minutes: 15
      activity: Teach the five styles with the comparison table, then run the style matcher as a whole-class vote.
    - minutes: 15
      activity: Groups read Exhibits 2, 3 and 5 by shift and write one sentence each on what the night shift's problem is.
    - minutes: 15
      activity: Decision Room in groups. Each group commits to an approach and predicts peak-week dispatch before revealing it.
    - minutes: 5
      activity: Exit ticket. Distinguish between paternalistic and democratic leadership in two sentences.
  prompts:
    - Was the founder a good leader, a good manager, both or neither?
    - Can a leader be both autocratic and caring?
    - Is it fair to lead two shifts differently?
    - When should a leader ignore the results of consultation?
  notes: >
    Listen for answers that name a style without naming the situation, and for the confusion of paternalistic with
    democratic leadership. HL groups can extend the crisis round into scientific and intuitive decision-making.

revision:
  keyPoints:
    - The classic functions of management are planning, organizing, commanding (directing), coordinating and controlling.
    - Management copes with complexity; leadership copes with change. Most people in charge have to do both.
    - Autocratic leaders decide alone; paternalistic leaders decide alone in what they see as the staff's interest; democratic leaders consult; laissez-faire leaders leave decisions to the team.
    - Situational leadership adapts the style to the task and to the readiness of the people.
    - Labour turnover = (employees leaving ÷ average number of employees) × 100.
    - At HL, scientific decision-making analyses data before deciding; intuitive decision-making relies on experience and judgement.
  retrieval:
    - q: Name the five classic functions of management.
      a: Planning, organizing, commanding (directing), coordinating and controlling.
    - q: What is the difference between paternalistic and democratic leadership?
      a: A paternalistic leader decides alone, in what she sees as the staff's interest; a democratic leader involves staff in the decision.
    - q: When does laissez-faire leadership work well?
      a: With an expert, motivated team that works best with autonomy.
    - q: What is situational leadership?
      a: Adapting the leadership style to the task and to the readiness of the people being led.
    - q: How is labour turnover calculated?
      a: Number of employees leaving in a period, divided by the average number of employees, multiplied by 100.
    - q: When is intuitive decision-making most useful?
      a: When the decision is urgent, the situation is familiar to an experienced decision-maker, or the data do not exist.
  traps:
    - Naming a style without explaining why it fits the situation in the case.
    - Treating paternalistic leadership as democratic because the leader is kind.
    - Recommending one style for a whole organization when the evidence shows different teams with different needs.


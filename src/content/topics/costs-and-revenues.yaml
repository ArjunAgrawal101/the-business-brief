title: Costs and revenues
code: '3.3'
unit: unit-3
qualification: ib-dp-bm
level: SL/HL
status: complete
summary: What a business's costs are, how they behave as output changes, where its revenue comes from, and how contribution connects them to break-even, profit and the orders worth accepting.
decisionQuestion: What does each unit really cost, and what does that mean for the price and for the orders a business should accept?
situation: >
  Atelier Barro, a ceramics studio in Porto, sells about 640 hand-made mugs a month at €22. In the same week its
  electricity costs rose and a hotel group offered to buy 300 mugs at €11, half the shop price. The owner's instinct
  is to raise prices and refuse the order. To know whether her instinct is right, she needs to know which of her costs
  change with output, which do not, and what each mug contributes.
whyItMatters: >
  Almost every business decision changes costs or revenues: a price, an order, a new product, a cut. Classifying costs
  correctly is what makes those decisions calculable. Getting it wrong, by treating a fixed cost as variable or by
  forgetting a cost that rises with the price, gives a confident answer to the wrong question.
syllabus:
  verification: primary
  note: >
    Checked against the Business management guide. Subtopic 3.3 (pp. 28 to 29) covers types of cost (fixed, variable,
    direct and indirect or overhead) and total revenue and revenue streams, at AO2. This brief also teaches break-even
    analysis, subtopic 5.5 (p. 34), and, for HL, contribution costing from the toolkit (p. 14). Semi-variable costs are
    not in the guide's list; they are included because real cost ledgers contain them, and in an answer they should be
    split into their fixed and variable parts.
  items:
    - text: 'Types of cost: fixed, variable, direct and indirect (overhead), with examples'
      level: SL/HL
      verification: primary
    - text: Total revenue and revenue streams, with examples
      level: SL/HL
      verification: primary
    - text: 'Break-even analysis (5.5): contribution per unit and total contribution, the break-even chart, margin of safety, target profit output, target profit and target price, the effects of changes in price or cost, and the limitations of break-even'
      level: SL/HL
      verification: primary
    - text: 'Toolkit, contribution (HL): contribution costing, including special orders'
      level: HL
      verification: primary
objectives:
  - text: Classify costs as fixed, variable or semi-variable, and as direct or indirect for a stated cost object.
  - text: Calculate total cost, total revenue and profit, with working and units.
  - text: Identify a business's revenue streams and explain how each behaves.
  - text: Calculate contribution per unit and use it to find the break-even quantity, the margin of safety and the target profit output (5.5).
  - text: Evaluate a pricing decision using contribution, and state the limits of the model.
  - text: Use contribution to decide whether to accept a special order.
    level: HL
  - text: Explain how cost structures and revenue streams differ between industries, and why the difference matters for profit.
  - text: Analyse how a decision about costs or prices moves money between stakeholders.

sections:
  - id: situation
    kind: situation
    title: The situation
    dek: One studio, two letters, and an instinct to check.
    blocks:
      - type: prose
        provenance: simulated-data
        body: >
          Inês Carvalho's studio makes about €1,600 a month from its mugs, after every cost including her own salary.
          From November the kiln will cost more to run. In the same week a hotel group asked for 300 mugs at €11 each.
          She is inclined to raise her prices and to say no to the hotel, because €11 looks like less than a mug costs.


          Both instincts depend on what a mug costs, and that turns out to be two different questions. What does one
          more mug add to the studio's costs? And what does a mug cost on average, once every bill is shared out? The
          first answer is about €7. The second is about €20. Which one matters depends on the decision.
      - type: callout
        tone: framework
        title: How this brief works
        provenance: aa-framework
        body: >
          First classify the costs, then calculate, then decide. At section 08 you will make Atelier Barro's decisions in
          the Decision Room. Every number on this page comes from one cost ledger, and every calculation shows its
          working in the same eight parts.

  - id: costs
    kind: learn
    title: Types of costs
    dek: Two separate questions about every cost. How does it behave, and can it be traced?
    blocks:
      - type: definition
        provenance: subject-knowledge
        term: Fixed costs
        body: Costs that do not change with the level of output, within a range of output and over a given period. Rent and salaries are the usual examples.
      - type: definition
        provenance: subject-knowledge
        term: Variable costs
        body: Costs that change in direct proportion to output. Raw materials and packaging are the usual examples.
      - type: definition
        provenance: subject-knowledge
        term: Semi-variable costs
        body: Costs with a fixed part and a variable part, such as an electricity bill with a standing charge and a charge for each unit used.
        note: The guide's list of cost types (3.3) does not include semi-variable costs. In an examination answer, split one into its fixed part and its variable part.
      - type: definition
        provenance: subject-knowledge
        term: Direct and indirect costs
        body: >
          A direct cost can be traced to a particular cost object, such as a product. An indirect cost, or overhead,
          cannot, because it is shared across the business.
      - type: comparison
        title: Cost behaviour at Atelier Barro
        provenance: simulated-data
        columns: [How it behaves as output rises, Example at Atelier Barro]
        rows:
          - label: Fixed
            cells:
              - Stays the same in total, so it falls per unit.
              - Studio rent of €1,900 a month, whether the studio makes 200 mugs or 1,200.
          - label: Variable
            cells:
              - Rises in proportion to output, so it is the same per unit.
              - Clay and glaze at €2.30 for every mug.
          - label: Semi-variable
            cells:
              - Has a fixed part and a part that rises with output.
              - Electricity, at €340 a month plus about €0.75 for each mug fired.
      - type: callout
        tone: note
        title: Two classifications, not one
        provenance: subject-knowledge
        body: >
          Behaviour (fixed or variable) and traceability (direct or indirect) answer different questions, so a cost can
          be any combination. A machine leased for only one product is fixed but direct to that product. Electricity for
          a shared building is semi-variable and indirect. Always say what the cost object is: a cost can be direct to a
          product line and indirect to a single unit.
      - type: interactive
        component: cost-classifier
        ref: costs-classifier-atelier
        title: Classify Atelier Barro's costs
        intro: Classify each cost twice. The cost object is one mug.
        provenance: subject-knowledge
      - type: misconception
        provenance: subject-knowledge
        claim: Labour is always a fixed cost.
        correction: >
          It depends on how people are paid. Atelier Barro's throwers are paid €2.40 for each mug, so their pay is a
          variable, direct cost. A salaried studio manager is a fixed, indirect cost. The same work can be either.
      - type: misconception
        provenance: subject-knowledge
        claim: A cost the owner can cut, such as marketing, must be a variable cost.
        correction: >
          Whether a cost is fixed or variable depends on whether it changes with output, not on whether it can be
          changed by a decision. Marketing of €480 a month is fixed: it is the same whether the studio makes 500 mugs or
          700.
      - type: prose
        title: Fixed, within a range
        provenance: subject-knowledge
        body: >
          Fixed costs are fixed only within a range of output and over a period. The kiln can fire 1,200 mugs a month.
          To make more, Atelier Barro would need a second kiln, and its fixed costs would step up. Over a long enough
          period every cost can change, which is why break-even analysis is a short-run tool.

  - id: revenue
    kind: learn
    title: Revenue and revenue streams
    dek: Where the money comes from, before any cost is paid.
    blocks:
      - type: definition
        provenance: subject-knowledge
        term: Total revenue
        body: The value of a business's sales in a period, found by multiplying the price of each product by the quantity sold and adding up.
      - type: definition
        provenance: subject-knowledge
        term: Revenue stream
        body: A distinct source of revenue, such as sales of a product, fees for a service, subscriptions, commissions or licences.
      - type: exhibit
        case: atelier-barro
        exhibit: ex-2
        provenance: simulated-data
        commentary: >
          Atelier Barro has four revenue streams, but mugs bring in 92% of the money. The workshops and the firing
          service use the studio's spare capacity. Notice that each stream has its own costs: revenue alone does not say
          which stream is worth growing.
      - type: list
        title: Common revenue streams
        style: pairs
        provenance: subject-knowledge
        items:
          - { label: Sales of goods, body: 'The price of each item sold, as with Atelier Barro''s mugs.' }
          - { label: Fees for services, body: 'Payment for work done, as with the studio''s workshops and firing service.' }
          - { label: Subscriptions, body: 'Regular payments for continuing access, as with a streaming service.' }
          - { label: Commission, body: 'A share of the value of sales made on behalf of others, as with an estate agent.' }
          - { label: Licensing and royalties, body: 'Payment for the right to use a brand, design or idea, as with franchise royalties.' }
          - { label: Advertising, body: 'Payment for access to an audience, as with a free app or website.' }
          - { label: Rental, body: 'Payment for the use of an asset, as with renting out kiln time or equipment.' }
      - type: worked
        title: Total revenue from mugs in an average month
        calculation: total-revenue
        provenance: simulated-data
        currency: '€'
        labels: { unit: mug, units: mugs, period: month }
        inputs: { price: 22, quantity: 640 }
        interpretation: The mugs bring in €14,080 in an average month, before any cost is paid.
        implication: Revenue says nothing about profit on its own. The studio's costs that month are almost as large.
      - type: misconception
        provenance: subject-knowledge
        claim: Rising revenue means the business is doing better.
        correction: >
          Revenue is not profit. Suppose Atelier Barro cut its price to €20 and sales rose to 720 mugs a month. Revenue
          would rise from €14,080 to €14,400. But each mug would contribute only €12.90 instead of €14.82, so total
          contribution, and with it profit, would fall: from €9,484.80 to €9,288. The studio would work harder for less.

  - id: calculate
    kind: learn
    title: Total cost, total revenue and profit
    dek: Three calculations, each set out the same way.
    blocks:
      - type: formula
        name: Total cost
        expression: TC = TFC + (AVC × Q)
        provenance: subject-knowledge
        variables:
          - { symbol: TC, meaning: Total cost }
          - { symbol: TFC, meaning: Total fixed costs }
          - { symbol: AVC, meaning: Variable cost per unit }
          - { symbol: Q, meaning: Output }
      - type: worked
        title: Atelier Barro's total cost in an average month, from November
        calculation: total-cost
        provenance: simulated-data
        currency: '€'
        labels: { unit: mug, units: mugs, period: month }
        inputs: { fixedCosts: 8140, variableCost: 7.18, quantity: 640 }
        interpretation: Making and selling 640 mugs costs €12,735.20 a month in total.
        implication: Of that, €8,140 is paid whatever happens. Only €4,595.20 depends on how many mugs are made.
      - type: worked
        title: Atelier Barro's profit in an average month, from November, at €22
        calculation: profit
        provenance: simulated-data
        currency: '€'
        labels: { unit: mug, units: mugs, period: month }
        inputs: { price: 22, variableCost: 7.18, fixedCosts: 8140, quantity: 640 }
        interpretation: The studio makes €1,344.80 a month, down from €1,616.80 before the new electricity tariff.
        implication: The cost rise takes about a sixth of the studio's profit if nothing else changes. That is the problem the owner has to solve.

  - id: break-even
    kind: learn
    title: From costs to break-even
    dek: Contribution connects costs and revenue. Break-even analysis is subtopic 5.5; its inputs are the costs of 3.3.
    blocks:
      - type: definition
        provenance: subject-knowledge
        term: Contribution
        body: The amount each unit sold adds towards paying the fixed costs and, once they are covered, towards profit. Contribution per unit is the selling price minus the variable cost per unit.
      - type: worked
        title: Contribution per mug at €22, from November
        calculation: contribution-per-unit
        provenance: simulated-data
        currency: '€'
        labels: { unit: mug, units: mugs, period: month }
        inputs: { price: 22, variableCost: 7.18 }
        interpretation: Each mug sold adds €14.82 towards the studio's €8,140 of monthly costs.
        implication: This is the figure that answers "what does one more mug do for the business?"
      - type: worked
        title: Break-even quantity at €22, from November
        calculation: break-even-quantity
        provenance: simulated-data
        currency: '€'
        labels: { unit: mug, units: mugs, period: month }
        inputs: { fixedCosts: 8140, price: 22, variableCost: 7.18 }
        interpretation: The studio must sell 550 mugs a month to cover all its costs.
        implication: In an average month it sells 640, so it is above break-even, but only just.
      - type: worked
        title: Margin of safety at 640 mugs, from November
        calculation: margin-of-safety
        provenance: simulated-data
        currency: '€'
        labels: { unit: mug, units: mugs, period: month }
        inputs: { fixedCosts: 8140, price: 22, variableCost: 7.18, quantity: 640 }
        interpretation: Sales could fall by 90 mugs a month, about 14%, before the studio makes a loss.
        implication: A slow month, or a lost wholesale customer, could wipe out the profit. That is why the owner is worried.
      - type: callout
        tone: exam
        title: Round the break-even quantity up
        provenance: subject-knowledge
        body: >
          €8,140 ÷ €14.82 = 549.26. At 549 mugs the studio would be €3.82 short of covering its costs, so the
          break-even quantity in whole mugs is 550. Show the exact figure, then the rounded one, and say why.
      - type: interactive
        component: break-even-workspace
        ref: costs-break-even-atelier
        title: Work the numbers yourself
        intro: Change the price, the costs or the forecast and watch every figure, the chart and the working update. Try each scenario, then predict before you click the next.
        provenance: simulated-data
      - type: interactive
        component: error-diagnosis
        ref: costs-error-diagnosis
        title: Find the error
        intro: Each worked solution below contains one wrong line. Find it before you look at the explanation.
        provenance: subject-knowledge

  - id: in-practice
    kind: learn
    title: Costs and revenue streams across industries
    dek: >
      Every business has fixed and variable costs and at least one revenue stream; the balance decides how its profit
      behaves.
    blocks:
      - type: prose
        provenance: subject-knowledge
        body: >
          The same two questions about costs, how they behave and whether they can be traced, apply in every industry,
          but the answers differ. In some businesses most costs are fixed: an airline pays for its aircraft and crews
          whether a flight is full or half empty, and a software company pays its developers whatever it sells. In
          others most costs are variable: a supermarket's largest cost is the goods it sells, and a builder buys the
          materials for each job. Revenue streams differ as much, from a single product to tickets, subscriptions,
          advertising and licences.


          The balance matters because it decides how profit responds when sales change. Where fixed costs are high,
          each extra sale adds a large contribution, so profit rises fast when sales grow and falls fast when they
          shrink. Where variable costs are high, profit moves more gently in both directions. At HL, subtopic 5.6
          calls this operating leverage.
      - type: comparison
        title: Cost structures and revenue streams in six industries
        provenance: subject-knowledge
        caption: Typical patterns, which vary from one business to another within each industry.
        columns: [Typical fixed costs, Typical variable costs, Main revenue streams]
        rows:
          - label: Airline
            cells:
              - Aircraft leases, salaried crews, maintenance programmes and the head office.
              - Fuel and airport charges for each flight, and catering for each passenger.
              - Tickets, baggage and seat fees, cargo, and fees from partners in loyalty schemes.
          - label: Software sold by subscription
            cells:
              - Developers' salaries, offices and most server capacity.
              - Payment fees and some hosting for each extra user.
              - Monthly or annual subscriptions, premium tiers, and fees for setting up and supporting large customers.
          - label: Hotel
            cells:
              - The building or its lease, salaried staff and insurance.
              - Cleaning, laundry and energy for each occupied room, and commission to booking websites.
              - Room nights, food and drink, events and meeting rooms, and parking.
          - label: Supermarket
            cells:
              - Store rents, salaried managers, systems and distribution centres.
              - The goods it sells, by far the largest cost, plus packaging and card fees.
              - Sales of products, delivery charges, and payments from suppliers for promotions.
          - label: Professional football club
            cells:
              - Players' and staff wages under contract, and the stadium.
              - Stewarding and catering for each match.
              - Match tickets, broadcasting rights, sponsorship, merchandise and fees for players transferred to other clubs.
          - label: Social enterprise café
            cells:
              - Rent, and the salaries of the trainers who teach young people to cook.
              - Ingredients and packaging.
              - Food and drink sales, catering contracts, and grants for the training it provides.
      - type: example
        title: Two gyms, two cost structures (fictional)
        provenance: simulated-data
        body: |
          Two fictional gyms each have 1,000 members paying $45 a month, so each takes $45,000 a month and makes a profit of $5,000.

          - **Ironside Gym** employs salaried staff and owns its equipment: fixed costs of $38,000 a month and a variable cost of $2 a member, for towels and card fees. Each member contributes $43.
          - **Flowline Studios** pays its instructors for each class they teach, so its costs follow attendance: fixed costs of $15,000 a month and a variable cost of $25 a member. Each member contributes $20.

          If membership rises by 20% to 1,200, Ironside's profit rises to $13,600 and Flowline's to $9,000. If it falls by 20% to 800, Ironside makes a loss of $3,600 while Flowline still makes $1,000. Ironside breaks even at 884 members ($38,000 ÷ $43 = 883.7, rounded up) and Flowline at 750 ($15,000 ÷ $20). Same profit today, very different risk: the gym with high fixed costs gains more in a good year and loses more in a bad one.
      - type: example
        title: An aquarium's revenue streams (fictional)
        provenance: simulated-data
        body: >
          Tidewater Aquarium, a fictional charity, took $2,000,000 last year from five streams: tickets $1,040,000
          (52%), memberships $360,000 (18%), the café and shop $280,000 (14%), grants and donations $200,000 (10%) and
          school visits $120,000 (6%).


          Five streams look like a spread of risk, but tickets, the café and shop, and school visits all depend on
          people coming through the door: together $1,440,000, or 72% of revenue. A wet summer or a closure for
          repairs would hit all three at once. Memberships are paid in advance and grants are agreed for a year, so
          they are steadier, which is why the aquarium is trying to grow its membership.
      - type: misconception
        provenance: subject-knowledge
        claim: More revenue streams always make a business safer.
        correction: >
          Only if the streams do not depend on the same customers or events. Tidewater's tickets, café and school
          visits are three streams with one weakness, the number of visitors, so a bad season hits them together.
      - type: callout
        tone: note
        title: Use the numbers yourself
        provenance: aa-framework
        body: >
          Work through costs and revenue on the [Finance Desk](/finance-desk/costs-and-revenue/), test a break-even
          quantity in the [Financial Laboratory](/finance-desk/lab/break-even-quantity/), and see the subtopic on one
          page in the [3.3 mindmap](/mindmaps/costs-and-revenues/).

  - id: evidence
    kind: evidence
    title: The evidence
    dek: The ledger is the only source of costs. The survey is the only source of demand.
    blocks:
      - type: exhibit
        case: atelier-barro
        exhibit: ex-1
        provenance: simulated-data
        commentary: >
          Read down the second column: most of the studio's costs are incurred each month, whatever is made. The fee of
          4% of the price is the cost most often forgotten when the price changes.
      - type: exhibit
        case: atelier-barro
        exhibit: ex-3
        provenance: simulated-data
        commentary: >
          Every pricing decision rests on this table, and every figure in it except the current one is an estimate.
          Ask how much a decision would change if the estimate were wrong.

  - id: decide
    kind: decide
    title: Make the decisions
    dek: Price first, then the hotel's order.
    blocks:
      - type: callout
        tone: framework
        title: Enter the Decision Room
        provenance: aa-framework
        body: >
          Choose how Atelier Barro responds to the cost rise, then decide on the hotel's order. Each outcome shows its
          numbers, and you can check every one on the Finance Desk. [Open the Atelier Barro Decision Room](/decision-room/atelier-pricing/).

  - id: evaluate
    kind: evaluate
    title: The arithmetic and the judgement
    dek: A calculation answers a narrower question than the decision.
    blocks:
      - type: comparison
        title: What the calculation tells you, and what you still have to judge
        provenance: aa-framework
        columns: [What the calculation tells you, What you still have to judge]
        rows:
          - label: Raising the price to €24
            cells:
              - Contribution per mug rises to €16.74 and the break-even quantity falls to 487.
              - Whether sales really fall only to 590, and how regular customers feel about it.
          - label: Cutting marketing
            cells:
              - Fixed costs fall by €280 and the break-even quantity falls to 531.
              - How far sales depend on the advertising being cut.
          - label: The hotel's order
            cells:
              - The order adds €1,395 to November's profit.
              - Whether half-price mugs in hotel rooms change what shop customers will pay.
      - type: list
        title: The limits of break-even analysis
        style: bullets
        provenance: subject-knowledge
        items:
          - body: It assumes the price and the variable cost per unit stay the same at every level of output. In practice bulk discounts and price cuts change both.
          - body: It assumes every unit produced is sold, with no stock left over.
          - body: It assumes fixed costs are fixed. Above the kiln's capacity they would step up.
          - body: It is simplest for one product. With several products, the answer depends on the mix sold.
          - body: It is only as good as the estimates it uses, and the sales estimate is often the weakest.
      - type: callout
        tone: exam
        title: Contribution and special orders
        level: HL
        provenance: subject-knowledge
        sources: [ib-bm-guide-2024]
        body: >
          A special order is judged on contribution. If the business has spare capacity and the order does not affect its
          regular sales, an order adds to profit whenever its price is above the variable cost of fulfilling it, even if
          that price is below the average cost of a unit. Contribution, which includes contribution costing and make or
          buy analysis, is one of the HL-only tools of the business management toolkit (guide, p. 14).
      - type: worked
        title: The hotel's order at €11
        calculation: special-order
        level: HL
        provenance: simulated-data
        currency: '€'
        labels: { unit: mug, units: mugs, period: month }
        inputs: { orderPrice: 11, variableCost: 5.85, quantity: 300, extraFixedCosts: 150 }
        interpretation: The order adds €1,395 to November's profit.
        implication: On the numbers, accept. The judgement is whether the order harms the price position, and whether the kiln can take it in November.
      - type: interactive
        component: special-order
        ref: costs-special-order-atelier
        title: Test the order on contribution
        level: HL
        provenance: simulated-data
      - type: misconception
        level: HL
        provenance: subject-knowledge
        claim: An order priced below the average cost of a unit must lose money.
        correction: >
          Average cost includes fixed costs that are already covered by regular sales. If they are, the order only has to
          cover its own variable costs to add profit. The belief is right only when the order displaces sales at the full
          price or needs extra fixed costs.

  - id: stakeholders
    kind: evaluate
    title: Who pays, who gains
    dek: >
      Every decision about costs or prices moves money between groups. The arithmetic shows how much; the stakeholders
      decide whether it works.
    blocks:
      - type: prose
        provenance: subject-knowledge
        body: >
          A business can respond to a rise in costs by raising its price, cutting other costs, changing what it sells
          or accepting lower profit, and each response moves the burden onto a different group. A price rise falls on
          customers; cheaper materials may fall on quality and so, in time, on customers again; a cut in pay or hours
          falls on employees; slower payment falls on suppliers. Contribution and break-even show how large each
          effect is, which is what makes a stakeholder analysis ([1.4](/topics/stakeholders/)) of a cost decision
          precise rather than general.
      - type: comparison
        title: Atelier Barro's options and its stakeholders, in a month from November
        provenance: simulated-data
        caption: >
          From the cost ledger, the price test and the hotel's request. The price rise assumes that sales fall to 590
          mugs a month, as the survey and the price test suggest.
        columns: [Raise the price to €24, Cut marketing by €280, Accept the hotel's order]
        rows:
          - label: Inês, the owner
            cells:
              - Profit rises from €1,344.80 to €1,736.60 a month, if sales fall only to 590 mugs.
              - Profit rises by €280 a month if sales hold, but each lost mug costs €14.82, so 19 fewer mugs would wipe out the saving.
              - €1,395 more profit in November, and a possible repeat order next year.
          - label: The two throwers
            cells:
              - '50 fewer mugs a month, so €120 less pay between them at €2.40 a mug.'
              - No change, unless fewer advertisements mean fewer sales.
              - '300 more mugs, so €720 more pay between them in November.'
          - label: Rui, the studio manager
            cells:
              - Fewer orders to pack, and questions from regular customers about the price.
              - Less advertising to run, and more pressure on the website to sell without it.
              - A busier November, with 300 hotel mugs on top of the season's 830.
          - label: Online and studio customers
            cells:
              - Pay €2 more, about 9%; about 50 a month stop buying, by the survey estimate.
              - See fewer advertisements, so fewer new customers find the studio.
              - May find the same mugs in hotel rooms at half the price, which could change what they think a mug is worth.
          - label: Casa Alfama Hotels
            cells:
              - No effect.
              - No effect.
              - '300 distinctive local mugs at €11 each, delivered for its guests'' winter season.'
      - type: list
        title: 'Beyond the studio: who carries a change in costs'
        style: pairs
        provenance: subject-knowledge
        items:
          - label: Customers
            body: Pay for cost rises through prices, or through quality when cheaper materials replace better ones.
          - label: Employees
            body: >
              Paid by the piece, they share the risk of falling sales, because their pay is a variable cost. On
              salaries they are protected week to week, but a business with high fixed costs may cut jobs when sales
              fall.
          - label: Suppliers
            body: Feel cost-cutting as pressure on their prices or as slower payment.
          - label: Owners
            body: >
              Take what is left. A business with high fixed costs gives them large profits in good years and losses in
              bad ones.
          - label: Government
            body: >
              Collects taxes on profit and on sales, so it shares in the result, and sets rules, such as a minimum
              wage or taxes on energy, that change costs for many businesses at once.
          - label: The environment
            body: >
              Using less energy lowers a variable cost and emissions at the same time, which is why rising energy
              prices can push businesses towards more sustainable processes.
      - type: callout
        tone: caution
        title: Moving risk onto people with less power
        provenance: aa-framework
        body: >
          Paying workers by the piece, or only for the hours a business chooses, turns labour from a fixed cost into a
          variable one. That protects the business when sales fall, but moves the risk onto the workers, whose pay
          falls with the orders. Atelier Barro's throwers carry part of the studio's risk in this way. Whether that is
          fair depends on how their earnings compare with a salary, and on whether they chose the arrangement.
      - type: misconception
        provenance: subject-knowledge
        claim: Cutting costs is always good for a business.
        correction: >
          It depends on which costs, and on who bears the cut. Cutting marketing lowers fixed costs, but if Atelier
          Barro's sales then fall by 19 mugs a month or more, its profit falls. Cutting the piece rate would raise
          contribution, but could cost the studio its throwers, and with them its product.

  - id: assess
    kind: assess
    title: Exam-style practice
    dek: >
      Original questions in the style of the papers, each followed by what a strong response does. They are not IB
      questions, and the guidance is not an official markscheme. Answer before you read it.
    blocks:
      - type: prose
        title: Question 1 · Suggest · 4 marks
        provenance: original-practice
        body: >
          Suggest **two** ways Atelier Barro could reduce the effect of the electricity price rise on its costs, other
          than by raising its price.
      - type: callout
        tone: exam
        title: 'Question 1: what a strong response does'
        provenance: assessment-explanation
        body: |
          A strong response puts forward two plausible measures, each with a reason that fits the case.

          - **Fire fuller kilns:** firing now costs €0.75 a mug, so packing each firing as full as possible spreads its electricity over more mugs.
          - **Fire at cheaper times:** if the new tariff charges less at night or at weekends, scheduling firings then lowers the cost of each one.
          - Other valid suggestions include servicing or insulating the kiln so that it uses less energy. Selling spare kiln time to other potters adds revenue to offset the rise rather than cutting the cost, so it answers a slightly different question.

          Two marks for each: one for the measure and one for a reason linked to Atelier Barro's costs.
      - type: prose
        title: Question 2 · Demonstrate · 4 marks
        provenance: original-practice
        body: >
          Ironside Gym and Flowline Studios, two fictional gyms, each have 1,000 members paying $45 a month. Ironside
          has fixed costs of $38,000 a month and a variable cost of $2 a member; Flowline has fixed costs of $15,000 a
          month and a variable cost of $25 a member.


          Demonstrate why the gym with the higher fixed costs gains more when membership rises by 20%, and loses more
          when it falls by 20%.
      - type: callout
        tone: exam
        title: 'Question 2: what a strong response does'
        provenance: assessment-explanation
        body: |
          A strong response proves the point with the figures rather than asserting it.

          - **Today:** each makes $45,000 − its total costs = $5,000 (Ironside $38,000 + $2,000; Flowline $15,000 + $25,000).
          - **1,200 members:** Ironside makes $54,000 − $40,400 = $13,600; Flowline $54,000 − $45,000 = $9,000.
          - **800 members:** Ironside makes $36,000 − $39,600, a loss of $3,600; Flowline $36,000 − $35,000 = $1,000.
          - **Why:** each Ironside member contributes $43 against Flowline's $20, so every member gained or lost moves Ironside's profit more than twice as far.
      - type: prose
        title: Question 3 · Comment · 4 marks
        provenance: original-practice
        body: >
          Tidewater Aquarium, a fictional charity, took $2,000,000 last year: tickets $1,040,000, memberships
          $360,000, the café and shop $280,000, grants and donations $200,000, and school visits $120,000.


          Comment on the spread of the aquarium's revenue streams.
      - type: callout
        tone: exam
        title: 'Question 3: what a strong response does'
        provenance: assessment-explanation
        body: |
          A strong response works out the shares, then judges what they show.

          - **Shares:** tickets 52%, memberships 18%, café and shop 14%, grants and donations 10%, school visits 6%.
          - **The hidden concentration:** tickets, the café and shop, and school visits all depend on visitors, $1,440,000 or 72% of revenue.
          - **Judgement:** five streams look diverse, but one event that keeps visitors away would cut nearly three-quarters of revenue at once, so the aquarium is less protected than the count suggests.
          - A top response notes the steadier streams, memberships paid in advance and grants agreed for a year, and what the figures leave out, such as the costs of each stream.
      - type: prose
        title: Question 4 · Analyse · 6 marks
        provenance: original-practice
        body: >
          Analyse the effect of raising the price of a mug from €22 to €24 on **two** of Atelier Barro's stakeholders.
      - type: callout
        tone: exam
        title: 'Question 4: what a strong response does'
        provenance: assessment-explanation
        body: |
          A strong response chooses two groups, traces the effect on each with the case's figures, and analyses how they might respond.

          - **The owner:** contribution per mug rises from €14.82 to €16.74, because the 4% fee rises with the price; if sales fall to 590 mugs, profit rises from €1,344.80 to €1,736.60 a month, but only if the survey's estimate holds.
          - **The throwers:** paid €2.40 a mug, they make 50 fewer mugs a month and earn €120 less between them, although nothing about their work has changed.
          - **Customers** are an equally valid choice: they pay €2, about 9%, more, and about 50 a month are expected to stop buying.
          - **Analysis:** the price rise moves money from customers and throwers to the owner. Whether it works depends on how regular customers react, and the throwers' loss shows how piece rates pass the risk of lower sales on to the workers.

conceptLens:
  - concept: change
    question: What changes when a cost changes?
    insight: >
      An energy price rise changes contribution, the break-even quantity and the margin of safety at once. The concept
      asks how the business adapts: through its price, through its costs, or through what it makes.
  - concept: creativity
    question: Can the business change its cost structure rather than its price?
    insight: >
      Atelier Barro could fire fuller kilns, schedule firings at cheaper times, or sell spare kiln time to other
      potters. Creative answers change the numbers the calculation starts from.
  - concept: ethics
    question: Who pays for the cost rise?
    insight: >
      Customers through the price, the throwers through fewer mugs at a piece rate, or the owner through lower profit.
      Passing a cost to the people with the least power to object is a choice, and an ethical one.
  - concept: sustainability
    question: Can this cost structure be kept up?
    insight: >
      A margin of safety of 90 mugs leaves the studio one bad month from a loss. An energy-intensive process also raises
      the question of how to use less energy, not just how to pay for it.

lenses:
  - pathway: entrepreneurs
    title: Know your three numbers
    provenance: aa-framework
    body: >
      Contribution per unit, the break-even quantity and the margin of safety. Without them you cannot tell whether a
      discount, a hire or an order makes you richer or poorer. Include the costs that are a share of the price, such as
      card fees, marketplace commissions and royalties: they are the ones most often forgotten.
  - pathway: undergraduate
    title: From cost behaviour to relevant costing
    provenance: enrichment
    body: >
      University management accounting extends this topic into cost-volume-profit analysis, activity-based costing and
      relevant costing. The hotel's order is an example of relevant costing: only the costs and revenues that change
      because of the decision count.
  - pathway: mba
    title: Operating leverage
    provenance: enrichment
    body: >
      A business with high fixed costs and a high contribution per unit, like Atelier Barro, has high operating
      leverage, a measure HL students meet in subtopic 5.6: its profit rises fast when sales rise and falls fast when
      they fall. MBA finance courses combine it with financial leverage, the extra risk that borrowing adds, to judge
      how risky a business's profits are. That is why the margin of safety matters more than the profit in a good
      month.
  - pathway: secondary
    title: For IGCSE and other courses
    provenance: aa-framework
    body: >
      Most secondary courses teach fixed and variable costs and break-even, often by reading break-even from a chart.
      Check whether your course uses the word overheads for indirect costs, and whether it expects the contribution
      method of calculating break-even.

teaching:
  sequence:
    - minutes: 5
      activity: "Hook. Ask: should Atelier Barro sell a mug for €11 when it charges €22? Take a vote and keep the result."
    - minutes: 15
      activity: Pairs use the cost classifier, then the class discusses the three costs most pairs disagreed on.
    - minutes: 15
      activity: Work contribution, the break-even quantity and the margin of safety on the board in the eight-part form, stopping at the rounding.
    - minutes: 15
      activity: In the break-even workspace, each pair tests one scenario and reports what changed and why.
    - minutes: 10
      activity: Return to the hook with the special order panel (HL) or the profit comparison (SL), then vote again.
    - minutes: 5
      activity: Exit ticket. Explain, in one sentence, why the break-even quantity is rounded up.
  prompts:
    - Is the owner's salary a cost of the business?
    - When is it right to sell below average cost?
    - Who should bear an energy price rise?
    - What does break-even analysis assume that is not true at Atelier Barro?
    - Who should carry the risk when sales fall, the owner, the workers or the customers?
  notes: >
    Watch for students who divide fixed costs by the price, who round the break-even quantity down, and who leave out
    the 4% fee when the price changes. The error diagnosis activity targets all three.

revision:
  keyPoints:
    - Fixed costs do not change with output within a range. Variable costs change in proportion to output. Semi-variable costs have both parts.
    - Direct costs can be traced to a cost object such as a product. Indirect costs, or overheads, cannot.
    - Total cost = fixed costs + (variable cost per unit × output). Total revenue = price × quantity. Profit = total revenue − total cost.
    - Contribution per unit = price − variable cost per unit. Break-even quantity = fixed costs ÷ contribution per unit, rounded up.
    - Margin of safety = actual or forecast output − break-even output, measured in units.
    - Break-even analysis assumes a constant price and unit cost, and that everything produced is sold.
    - Cost structures differ by industry. Where fixed costs are high, profit rises fast when sales grow and falls fast when they shrink; where variable costs are high, profit moves more gently. At HL this is operating leverage (5.6).
    - 'Every cost or price decision moves money between stakeholders: a price rise falls on customers, a piece rate passes falling sales on to workers, and the owner takes what is left.'
  retrieval:
    - q: What is a semi-variable cost?
      a: A cost with a fixed part and a part that varies with output, such as electricity with a standing charge and a charge for each unit used.
    - q: Is a piece rate a fixed or a variable cost?
      a: Variable, because it is paid for each unit produced.
    - q: What is a revenue stream?
      a: A distinct source of revenue, such as product sales, service fees, subscriptions or commission.
    - q: How do you calculate contribution per unit?
      a: Selling price per unit minus variable cost per unit.
    - q: Why is the break-even quantity rounded up?
      a: Because one unit fewer than the exact figure leaves a loss.
    - q: In what is the margin of safety measured?
      a: In units of output, or as a share of sales. Not in money.
    - q: Two businesses make the same profit. One has high fixed costs and a large contribution per unit; the other has low fixed costs and a small contribution per unit. Whose profit changes more when sales change?
      a: The one with high fixed costs, because each unit gained or lost changes its profit by its larger contribution.
    - q: Why are several revenue streams not always safer than one?
      a: If the streams depend on the same customers or events, such as the number of visitors, one bad season hits them all at once.
  traps:
    - Dividing fixed costs by the price instead of by contribution per unit.
    - Rounding the break-even quantity down.
    - Forgetting that a cost which is a share of the price changes when the price changes.
    - Confusing the margin of safety with profit.
    - Counting revenue streams without asking whether they depend on the same customers or events.


title: Growth and evolution
code: '1.5'
unit: unit-1
qualification: ib-dp-bm
level: SL/HL
status: complete
summary: Why businesses grow, why some choose not to, and how the route to growth changes the business, from economies and diseconomies of scale to five external growth methods.
decisionQuestion: Should this business grow, how fast, and by which route?
situation: >
  Marigold Kitchens has four profitable restaurants in Pune and five ways to grow. It could open its own restaurants
  in Mumbai, franchise, form a joint venture with a mall operator, buy a rival, or stay at four and add a service. Each
  route would make the business bigger in a different way, and each would change who controls it, how it is financed
  and what it is like to work for.
whyItMatters: >
  Growth is one of the largest decisions a business makes and one of the hardest to undo. It changes costs, through
  economies and diseconomies of scale, and it changes control, culture, finance and stakeholders, all at once. That is
  why questions on growth ask for judgement: the right route depends on the business's objectives and on the evidence
  about its market and its people.
syllabus:
  verification: primary
  note: >
    Checked against the Business management guide (p. 24). The content statements below are in the platform's words;
    their depth of teaching follows the guide. The toolkit tools used here (Ansoff matrix, decision trees, SWOT analysis,
    and at HL force field analysis) are those the guide suggests for unit 1 and unit 2 (pp. 14, 23 and 25).
  items:
    - { text: Internal and external economies and diseconomies of scale (AO2), level: SL/HL, verification: primary }
    - { text: The difference between internal and external growth (AO2), level: SL/HL, verification: primary }
    - { text: Reasons for businesses to grow (AO3), level: SL/HL, verification: primary }
    - { text: Reasons for businesses to stay small (AO3), level: SL/HL, verification: primary }
    - text: 'External growth methods: mergers and acquisitions, takeovers, joint ventures, strategic alliances and franchising (AO3)'
      level: SL/HL
      verification: primary
objectives:
  - text: Explain how internal and external economies and diseconomies of scale change average cost as a business grows.
  - text: Distinguish internal growth from external growth, and say what each does to speed, control and finance.
  - text: Evaluate reasons for growing and for staying small against a business's own objectives.
  - text: Compare mergers and acquisitions, takeovers, joint ventures, strategic alliances and franchising as routes to growth.
  - text: Recommend a growth route for a business, using evidence, and state the conditions under which the recommendation would change.

sections:
  - id: situation
    kind: situation
    title: The situation
    dek: Four restaurants, five routes, one decision.
    blocks:
      - type: prose
        provenance: simulated-data
        body: >
          Meera Rao founded Marigold Kitchens in 2017. Today its four restaurants each sell about ₹24m of food a year and
          earn about ₹4.3m. The business is profitable and well liked, and that is exactly why it has choices. Forty-one
          people want to open a Marigold franchise. A mall operator wants a joint venture. A weaker rival is for sale.
          The bank will lend for new restaurants. The head chef wants to stay at four.


          The question is not whether growth is good. It is which kind of growth, if any, serves this business, its
          owner and its people. To answer it you need to know what growth does to costs, what each route involves, and
          how to weigh one route against another. That is what this brief covers.
      - type: callout
        tone: framework
        title: How this brief works
        provenance: aa-framework
        body: >
          Read the situation, then work through the ideas in order. At section 07 you will make Marigold's decision in
          the Decision Room before you see the analysis. Every brief follows the same sequence: **situation**, then
          **decision**, then **consequence**.

  - id: why-grow
    kind: learn
    title: Why grow, and why stay small
    dek: Growth is a means, not an objective.
    blocks:
      - type: prose
        provenance: subject-knowledge
        body: >
          Businesses grow because growth can serve their objectives: lower costs, more customers, more profit, less
          risk, more influence. But growth also has costs, and some businesses choose not to grow, or to grow slowly,
          because staying small serves their objectives better. A strong answer never treats growth as good in itself.
          It asks whether this growth serves this business.
      - type: comparison
        title: Reasons to grow and reasons to stay small
        provenance: subject-knowledge
        columns: [Reasons to grow, Reasons to stay small]
        rows:
          - label: Costs
            cells:
              - Economies of scale can lower average cost.
              - Small firms avoid diseconomies of scale and coordinate cheaply.
          - label: Market
            cells:
              - A larger share of the market brings bargaining power with suppliers and customers.
              - A niche or local market may not support a larger business.
          - label: Risk
            cells:
              - Serving more markets or products spreads risk.
              - Growth needs finance and commitment that can sink a business if demand disappoints.
          - label: Owners
            cells:
              - Ambition, recognition and higher profits for the owners.
              - Control, independence and a way of working the owner values.
          - label: Customers
            cells:
              - A recognized brand, available in more places.
              - Personal service and flexibility that customers will pay for.
          - label: Survival
            cells:
              - A larger business can be harder to squeeze out or take over.
              - A small business can adapt faster when conditions change.
      - type: misconception
        provenance: subject-knowledge
        claim: A business that stays small has failed to grow.
        correction: >
          Staying small can be a deliberate strategy. A business with a loyal local market, a premium price and an owner
          who values control may do better, by its own objectives, at its current size. Judge the size against the
          objectives, not against an assumption that bigger is better.

  - id: scale
    kind: learn
    title: Economies and diseconomies of scale
    dek: Why average cost tends to fall as a business grows, and why it can rise again.
    blocks:
      - type: definition
        provenance: subject-knowledge
        term: Economies of scale
        body: The fall in average cost per unit that results from an increase in the scale of a business's operations.
      - type: definition
        provenance: subject-knowledge
        term: Diseconomies of scale
        body: The rise in average cost per unit that results when a business grows beyond the scale it can manage efficiently.
      - type: comparison
        title: Internal economies of scale
        caption: Internal economies arise inside the business, from its own growth.
        provenance: subject-knowledge
        columns: [Where the saving comes from, At Marigold]
        rows:
          - label: Purchasing
            cells:
              - Larger orders win lower prices from suppliers (bulk buying).
              - Buying vegetables, grain and packaging for ten restaurants instead of four.
          - label: Technical
            cells:
              - Larger, more efficient equipment and processes become worthwhile.
              - A central kitchen preparing sauces and spice blends for every restaurant.
          - label: Financial
            cells:
              - Larger businesses can usually borrow more cheaply and raise finance more easily.
              - A bank offers better terms to a ten-restaurant group than to a single restaurant.
          - label: Managerial
            cells:
              - Specialist managers can be employed and their cost spread over more output.
              - A full-time purchasing manager and a training manager, instead of the founder doing both.
          - label: Marketing
            cells:
              - Advertising and brand-building costs are spread over more sales.
              - One campaign promotes every Marigold in a city.
          - label: Risk-bearing
            cells:
              - Serving several markets or products spreads risk.
              - A slow month in one city is offset by others.
      - type: comparison
        title: Internal diseconomies of scale
        caption: Internal diseconomies arise when the business becomes harder to run as it grows.
        provenance: subject-knowledge
        columns: [What goes wrong, At Marigold]
        rows:
          - label: Communication
            cells:
              - Messages pass through more layers and arrive later or distorted.
              - A recipe change reaches the sixteenth restaurant weeks after the first.
          - label: Coordination and control
            cells:
              - It becomes harder to make every part work to the same standard.
              - Restaurants in three cities interpret the same standards differently.
          - label: Motivation
            cells:
              - Employees in a large organization can feel distant from its purpose and its leaders.
              - Cooks who once knew the founder now report to an area manager they rarely see.
      - type: comparison
        title: External economies and diseconomies of scale
        caption: External effects come from the growth of the industry or the area around the business, not from the business itself.
        provenance: subject-knowledge
        columns: [External economies, External diseconomies]
        rows:
          - label: Labour
            cells:
              - A pool of trained cooks and managers in a city with many restaurants.
              - Competition for staff pushes up wages.
          - label: Suppliers
            cells:
              - Specialist suppliers and wholesale markets grow up around a busy food scene.
              - Shortages when many buyers compete for the same produce.
          - label: Place
            cells:
              - Shared infrastructure, transport links and a reputation for good food.
              - Rising rents and congestion in popular areas.
      - type: interactive
        component: scale-explorer
        ref: growth-scale-explorer
        title: Explore average cost and the size of the chain
        intro: >
          Predict first: at what number of restaurants is the average cost of a meal lowest? Then move the slider. The
          model is simulated, and every part of the cost is shown so that you can see which effect is winning.
        provenance: simulated-data
      - type: mechanism
        title: How growth can raise average cost
        provenance: subject-knowledge
        steps:
          - Marigold grows from four restaurants to sixteen in two years.
          - Head office adds area managers between the founder and the restaurants.
          - Instructions take longer to reach the kitchens, and problems take longer to reach the top.
          - Restaurants interpret recipes and standards differently, and managers spend more time checking and correcting.
          - Waste, rework and complaints rise, and so does the cost of managing them.
        conclusion: Average cost per meal rises. That is a diseconomy of scale. It is not inevitable, because training, systems and delegation can push it further out, at a cost.
      - type: misconception
        provenance: subject-knowledge
        claim: Spreading fixed costs over more output is the same thing as an economy of scale.
        correction: >
          Selling more meals from the same four restaurants lowers average fixed cost, without any change in the scale
          of the business. Economies of scale arise when the scale itself changes: bigger orders, specialist managers,
          cheaper finance. Both lower average cost as output rises, which is why they are easy to confuse.
      - type: misconception
        provenance: subject-knowledge
        claim: A bigger business always has lower average costs.
        correction: >
          Average cost tends to fall while economies of scale outweigh diseconomies, and to rise once the reverse is
          true. Where that point lies depends on the business. For a restaurant group it depends on how well recipes,
          training and management systems travel.

  - id: routes
    kind: learn
    title: Internal and external growth
    dek: Building the business yourself, or joining it to another.
    blocks:
      - type: definition
        provenance: subject-knowledge
        term: Internal (organic) growth
        body: Growth from within the business, by selling more, opening new sites or launching new products, financed by its own resources or by borrowing.
      - type: definition
        provenance: subject-knowledge
        term: External (inorganic) growth
        body: Growth by joining with, buying or cooperating with other businesses.
      - type: comparison
        title: Internal and external growth compared
        provenance: subject-knowledge
        columns: [Internal growth, External growth]
        rows:
          - label: Speed
            cells:
              - Slower. Each new site or product is built from scratch.
              - Faster. Assets, customers and staff come ready-made.
          - label: Control
            cells:
              - Kept. The business decides how it grows.
              - Shared or diluted. Partners and new owners have a say.
          - label: Finance
            cells:
              - Retained profit and borrowing, usually in smaller sums at a time.
              - Often large sums at once, sometimes paid for with shares.
          - label: Risk
            cells:
              - Lower and spread over time. The business can stop after each step.
              - Higher. Integration and partner risk come all at once.
          - label: Culture
            cells:
              - Preserved. New staff are trained in the existing ways.
              - At risk. Two cultures have to be combined or managed side by side.
      - type: comparison
        title: External growth methods
        provenance: subject-knowledge
        columns: [What it is, Control, Main risk]
        rows:
          - label: Merger
            cells:
              - Two businesses agree to combine into one.
              - Shared between the two sets of owners.
              - Two cultures and two management teams to combine.
          - label: Acquisition
            cells:
              - One business buys a controlling interest in another, usually with its agreement.
              - The buyer takes control.
              - Paying too much, and the cost of integration.
          - label: Takeover
            cells:
              - An acquisition, often against the wishes of the target's management (a hostile takeover).
              - The buyer takes control.
              - Resistance from the target's managers and staff, and a high price.
          - label: Joint venture
            cells:
              - Two or more businesses create a new business that they own together.
              - Shared, as set by the agreement.
              - Disagreement between partners, and the terms for leaving.
          - label: Strategic alliance
            cells:
              - Businesses agree to cooperate, sharing resources or customers, without creating a new jointly owned business.
              - Each keeps its independence.
              - A looser commitment that partners can leave.
          - label: Franchising
            cells:
              - A franchisor sells the right to use its brand and business model to franchisees, for fees and royalties.
              - The franchisor sets standards; franchisees run the outlets.
              - Quality in the hands of owners the franchisor does not employ.
      - type: list
        title: Useful vocabulary for mergers and acquisitions
        style: pairs
        provenance: subject-knowledge
        intro: Combinations are often described by the relationship between the two businesses.
        items:
          - label: Horizontal integration
            body: With a business at the same stage of the same industry, such as Marigold buying Tiffin Lane.
          - label: Vertical integration
            body: With a supplier (backward) or a customer (forward), such as Marigold buying the farm that grows its vegetables.
          - label: Conglomerate integration
            body: With a business in an unrelated industry, to spread risk.
      - type: example
        title: 'Franchising at scale: McDonald''s'
        provenance: external-evidence
        sources: [mcd-10k-2025]
        body: >
          **Fact.** At the end of 2025, about 95% of McDonald's 45,356 restaurants were franchised, according to the
          annual report the company filed with the US Securities and Exchange Commission.


          **Interpretation.** Most of the restaurants carrying the brand are owned and run by other people's capital and
          effort. That is the appeal of franchising: reach without ownership. It is also why a franchisor's own revenue
          is far smaller than the sales of the restaurants carrying its name.
      - type: example
        title: 'A joint venture to enter a market: Tata Starbucks'
        provenance: external-evidence
        sources: [tata-starbucks-2012]
        body: >
          **Fact.** Starbucks entered India through Tata Starbucks, a 50:50 joint venture with Tata Global Beverages (now
          Tata Consumer Products) announced in January 2012. Its first store opened on 19 October 2012 at Horniman Circle
          in Mumbai.


          **Interpretation.** A joint venture let a foreign brand share the cost and risk of entering a large, unfamiliar
          market with a partner that knew it. The price was shared control and shared profit.
      - type: example
        title: 'An acquisition: Disney and 21st Century Fox'
        provenance: external-evidence
        sources: [disney-fox-2019]
        body: >
          **Fact.** Disney completed its acquisition of 21st Century Fox's film and television businesses on 20 March
          2019, in a deal reported at $71.3 billion.


          **Interpretation.** Buying an established business is the fastest way to acquire assets, here film libraries and
          studios, that would take decades to build. It is also the most expensive route, and the hardest to integrate.
      - type: example
        title: 'A strategic alliance: Star Alliance'
        provenance: external-evidence
        sources: [star-alliance-1997]
        body: >
          **Fact.** Star Alliance was founded on 14 May 1997 by five airlines: Air Canada, Lufthansa, Scandinavian
          Airlines, Thai Airways International and United Airlines.


          **Interpretation.** In an alliance, businesses cooperate (here on routes, connections and loyalty schemes)
          without merging or creating a jointly owned company. Members keep their independence, which also means that a
          member can leave.
      - type: misconception
        provenance: subject-knowledge
        claim: A joint venture and a strategic alliance are the same thing.
        correction: >
          Both are forms of cooperation. A joint venture creates a new business that the partners own together. A
          strategic alliance is an agreement to cooperate that creates no new jointly owned business.
      - type: misconception
        provenance: subject-knowledge
        claim: A franchisor's revenue is the sales of all the outlets that carry its name.
        correction: >
          Franchisees' sales are their own revenue. The franchisor's revenue from them is the fees and royalties it
          charges. In the Marigold forecast, twelve franchises sell ₹228m in year two, and Marigold's royalty income is
          ₹13.68m.

  - id: evidence
    kind: evidence
    title: The evidence
    dek: What the case file says, and what it cannot tell you.
    blocks:
      - type: exhibit
        case: marigold-kitchens
        exhibit: ex-1
        provenance: simulated-data
        commentary: >
          Each restaurant earns 18% of its sales. Notice which costs move with sales (food and packaging) and which do
          not (staff, rent and the rest). That split decides how quickly a new restaurant becomes profitable.
      - type: exhibit
        case: marigold-kitchens
        exhibit: ex-7
        provenance: simulated-data
        commentary: >
          The evidence most answers miss. The franchise plan needs twelve franchisees in two years. Four of the
          forty-one people who asked could fund a restaurant without a loan.
      - type: exhibit
        case: marigold-kitchens
        exhibit: ex-6
        provenance: simulated-data
        commentary: The founder's aims are the test every route has to pass. Notice that the second and third pull against each other.
      - type: callout
        tone: caution
        title: Forecasts are evidence, not facts
        provenance: aa-framework
        body: >
          Every figure for the five routes is a forecast built on assumptions: how fast new restaurants find customers,
          whether franchisees can be found and trusted, how many of Tiffin Lane's staff stay. A strong answer uses the
          forecasts and names the assumption that would change the decision.

  - id: tools
    kind: tools
    title: Tools for the decision
    dek: Each tool answers a different question. None of them makes the decision.
    blocks:
      - type: interactive
        component: ansoff-placer
        ref: growth-ansoff-marigold
        title: Place Marigold's options on the Ansoff matrix
        intro: The Ansoff matrix classifies the direction of growth. Notice that franchising, joint ventures and acquisitions are methods, and can appear in any direction.
        provenance: subject-knowledge
      - type: interactive
        component: decision-tree-lab
        ref: growth-tree-marigold
        title: Compare three routes with a decision tree
        intro: Predict which route has the highest expected value before you calculate.
        provenance: simulated-data
      - type: interactive
        component: force-field-builder
        ref: growth-forcefield-marigold
        level: HL
        title: Weigh the forces for and against franchising
        provenance: simulated-data
      - type: comparison
        title: A SWOT analysis of Marigold Kitchens
        caption: A SWOT summarizes the position the decision starts from. It does not choose a route.
        provenance: simulated-data
        columns: [Internal, External]
        rows:
          - label: Positive
            cells:
              - '**Strengths.** Food customers come back for (a rating of 4.6 out of 5 and 62% returning visits); four profitable restaurants; ₹20m of cash; a trained, loyal kitchen team.'
              - '**Opportunities.** Demand from people who want a franchise; a mall operator seeking restaurants; a rival for sale; offices wanting lunches.'
          - label: Negative
            cells:
              - "**Weaknesses.** Quality depends on one head chef's training; no experience outside Pune; a small management team."
              - '**Threats.** Rivals entering the same cities; the cost of staff and rent in Mumbai; brand damage if growth outruns training.'

  - id: decide
    kind: decide
    title: Make the decision
    dek: Choose before you read the analysis.
    blocks:
      - type: callout
        tone: framework
        title: Enter the Decision Room
        provenance: aa-framework
        body: >
          Choose a route for Marigold, see its simulated consequences for profit, control, people and the brand, then
          decide how to implement it. Write one sentence first: which of Meera's four aims matters most, and why?
          [Open the Marigold Kitchens Decision Room](/decision-room/marigold-growth/).
      - type: prose
        title: Then read the analysis
        provenance: aa-framework
        body: >
          The [case file](/cases/marigold-kitchens/) works through the decision in four steps: the data, the insight the
          data gives, the options that follow, and one defensible recommendation, with the condition under which it would
          change. Compare its reasoning with yours. It is not the only defensible answer.

  - id: evaluate
    kind: evaluate
    title: Weighing the consequences
    dek: Four questions that turn a list of advantages into a judgement.
    blocks:
      - type: list
        title: Judge any growth route against four questions
        style: numbered
        provenance: aa-framework
        items:
          - label: Fit
            body: Does it serve the business's objectives, including the ones that are not financial?
          - label: Finance
            body: Can the business pay for it without risking its survival if demand disappoints?
          - label: Control
            body: Can it keep control of whatever made it successful in the first place?
          - label: Failure
            body: What would have to be true for this route to fail, and how likely is that?
      - type: comparison
        title: Who gains and who carries the risk, by route
        provenance: simulated-data
        columns: [Gains most, Carries most risk]
        rows:
          - label: Organic growth
            cells:
              - The founder (control) and senior staff (promotion).
              - The founder and the bank (debt in a new city).
          - label: Franchising
            cells:
              - Marigold (royalties with little capital).
              - Franchisees (their savings and loans) and the brand.
          - label: Joint venture
            cells:
              - Sterling Malls (footfall) and Marigold (reach).
              - Marigold's control of its menu.
          - label: Acquisition
            cells:
              - Banyan (growth to sell) and Tiffin Lane's owner (a sale).
              - Tiffin Lane's staff (closures) and Marigold's culture.
          - label: Stay focused
            cells:
              - Customers and staff who value things as they are.
              - The founder's ambition, and staff who want promotion.
      - type: callout
        tone: enrichment
        title: 'Beyond the course: why acquisitions disappoint'
        provenance: enrichment
        body: >
          Management research has long debated how often acquisitions create value for the buyer's shareholders. Common
          explanations for disappointing results are paying too much in a competitive bid, overestimating the savings,
          and underestimating the cost of combining two organizations' systems and cultures. University courses in
          corporate strategy examine this evidence. It is not required for the IB course.

conceptLens:
  - concept: change
    question: How does growth change the business itself, not just its size?
    insight: >
      Each route changes Marigold differently. Franchising changes who runs the kitchens, the joint venture changes who
      makes decisions, and the acquisition changes the culture and the owners. A strong answer says which change the
      business can manage.
  - concept: creativity
    question: Is there a route nobody has proposed?
    insight: >
      Sequencing is a creative option: open two restaurants, learn, then decide on two more; or pilot one franchise in
      one city. It turns one large, irreversible decision into smaller, reversible ones.
  - concept: ethics
    question: Who bears the cost of each route?
    insight: >
      Closing three Tiffin Lane restaurants costs jobs. Franchisees who borrow to open a Marigold carry the risk of
      decisions they do not make. Local suppliers may be replaced by bulk buyers. Ethics belongs in the weighing, not
      after it.
  - concept: sustainability
    question: Can the growth be kept up?
    insight: >
      Growth that outruns training, finance or the supply of fresh produce is not sustainable, however profitable year
      two looks. The light-touch franchise path in the Decision Room shows profit rising first and the brand paying later.

lenses:
  - pathway: entrepreneurs
    title: Before you grow, ask three questions
    provenance: aa-framework
    body: >
      What made the first site succeed, and can it be repeated without you in the room? What is the smallest step that
      would prove the next market? And what does the growth do to your cash in the months before a new site earns? Growth
      financed by debt makes a slow start dangerous.
  - pathway: mba
    title: Build, borrow or buy
    provenance: enrichment
    body: >
      Capron and Mitchell frame the growth decision as a choice between building resources internally, borrowing them
      through contracts and alliances, or buying them through acquisition. The choice turns on whether the needed
      resources can be developed inside the firm, whether they can be contracted for, and how much control is needed.
      Apply it to Marigold: can recipes taught by one head chef be contracted to franchisees?
  - pathway: undergraduate
    title: From the textbook model to the evidence
    provenance: enrichment
    body: >
      Economies and diseconomies of scale come from economics, where the long-run average cost curve is drawn U-shaped.
      Empirical work often finds long flat stretches instead, over which size makes little difference to cost. Treat the
      U shape as a teaching model, and ask where a particular business sits on its own curve.
  - pathway: secondary
    title: For IGCSE and other courses
    provenance: aa-framework
    body: >
      Most secondary business courses teach internal and external growth and the types of integration. Check your own
      specification for which external growth methods it names: not every course includes joint ventures, strategic
      alliances or franchising.

teaching:
  sequence:
    - minutes: 5
      activity: "Hook. Show Exhibit 2 and ask: Marigold is profitable, so why change anything? Collect reasons on the board under two headings, grow and stay small."
    - minutes: 15
      activity: Teach economies and diseconomies of scale with the scale explorer. Students predict where average cost is lowest before anyone moves the slider.
    - minutes: 15
      activity: In pairs, students classify the five routes as internal or external, then place them on the Ansoff matrix. Discuss the office lunch service, which can be argued three ways.
    - minutes: 20
      activity: Decision Room in groups of three. Each group commits to a route and writes its justification before it sees the consequences.
    - minutes: 10
      activity: Debrief. Groups compare their outcomes, and each says what would have to be true for its route to fail.
    - minutes: 5
      activity: Exit ticket. Distinguish between a joint venture and a strategic alliance, in two sentences.
  prompts:
    - Is a business that chooses to stay small less successful than one that grows?
    - Whose interests does the acquisition serve best, and whose least?
    - Can quality be franchised?
    - Why might the route with the highest forecast profit be the wrong one?
  notes: >
    Listen for two errors: counting franchisees' sales as Marigold's revenue, and treating economies of scale as
    automatic. Both are diagnosed in the brief and in the Decision Room's debrief.

revision:
  keyPoints:
    - Economies of scale lower average cost as the scale of operations grows (purchasing, technical, financial, managerial, marketing and risk-bearing). Diseconomies raise it (communication, coordination, motivation).
    - External economies and diseconomies come from the industry or the area, not from the business itself.
    - Internal growth is slower and keeps control. External growth is faster and brings integration and partner risk.
    - Mergers, acquisitions and takeovers combine ownership. A joint venture creates a new, jointly owned business. A strategic alliance cooperates without one. Franchising sells the right to use the business model.
    - Judge a growth route against the business's own objectives, its finance and its ability to keep what made it successful.
  retrieval:
    - q: What is a diseconomy of scale?
      a: A rise in average cost that results from an increase in the scale of operations, for example through slower communication and weaker coordination.
    - q: Give two internal economies of scale.
      a: 'Any two of: purchasing (bulk-buying), technical, financial, managerial, marketing and risk-bearing economies.'
    - q: What is the difference between a merger and an acquisition?
      a: In a merger two businesses agree to combine into one; in an acquisition one business buys a controlling interest in another.
    - q: What does a franchisee usually pay a franchisor?
      a: An initial fee and a continuing royalty, often a share of sales, for the right to use the brand and the business model.
    - q: Give two reasons a business might choose to stay small.
      a: 'For example: to keep control, to offer personal service, to serve a niche, to avoid diseconomies of scale, or because finance is limited.'
    - q: Which creates a new, jointly owned business, a joint venture or a strategic alliance?
      a: A joint venture.
  traps:
    - Counting franchisees' sales as the franchisor's revenue.
    - Assuming that bigger always means cheaper.
    - Listing the advantages and disadvantages of a growth method without applying them to the business's objectives.


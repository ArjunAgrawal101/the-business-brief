title: Cracker Barrel restores its old logo weeks after a rebrand, pauses remodels and plans for fewer guests
dek: >-
  In August 2025 the US restaurant and retail chain launched a campaign with a simplified logo and refreshed
  restaurants. Within weeks it went back to its Old Timer logo and paused the remodels, and its outlook for the next year
  assumed 4% to 7% fewer guests. By August 2026 it had sold a smaller chain and appointed a new chief executive.
organizations: [Cracker Barrel]
categories: [marketing, corporate-governance, leadership]
regions: [north-america]
industry: 'Restaurants and retail'
keyConcepts: [change, creativity]

title: Docker makes its secure container images free, and keeps a paid enterprise tier
dek: >-
  In December 2025 Docker released more than 1,000 hardened images free under an open-source licence, a product it had
  launched earlier that year, while charging businesses for customization, faster fixes and longer support.
organizations: [Docker]
categories: [marketing]
keyConcepts: [creativity, change]
date: '2025-12-17'
written: '2026-11-03'
checked: '2026-11-03'
figures:
  - value: 1,000+
    label: Hardened images made free under the Apache 2.0 licence
    source: docker-dhi
  - value: 20 billion
    label: Image downloads from Docker Hub each month, as Docker reports
    source: docker-dhi
  - value: 5 years
    label: Extra security cover sold as a paid add-on after upstream support ends
    source: docker-dhi

happened:
  - date: '2025-12-17'
    text: >-
      Docker made its catalogue of more than 1,000 Docker Hardened Images, built on the open-source Debian and Alpine
      distributions, free and open source under the Apache 2.0 licence. Docker had launched the product earlier in 2025.
    sources: [docker-dhi]
  - date: '2025-12-17'
    text: >-
      Businesses that need customization, compliance for regulated industries or faster fixes than the open-source
      projects provide can buy DHI Enterprise, which Docker said fixes critical vulnerabilities in under seven days, backed
      by a service-level agreement. A paid add-on, Extended Lifecycle Support, gives five more years of security cover after
      upstream support ends.
    sources: [docker-dhi]
  - date: '2025-12-17'
    text: >-
      Docker said its hardened images reduce vulnerabilities by up to 95% compared with community images, and that Docker
      Hub handles more than 20 billion image downloads, which it calls pulls, each month.
    sources: [docker-dhi]
  - date: '2025-12-17'
    text: >-
      Docker said companies including Adobe, Attentive and Crypto.com had standardized on its hardened images across
      their organizations, and published supporting statements from partners including the Cloud Native Computing
      Foundation, Google and MongoDB.
    sources: [docker-dhi]
  - date: '2025-12-17'
    text: >-
      Docker also began offering hardened versions of more than ten servers that AI assistants use to connect to outside
      tools and data, known as MCP servers, and said it would harden its full catalogue of them.
    sources: [docker-dhi]

matters: |-
  Free is a price, and a deliberate one. Docker took a product it launched earlier in the year and made its core free to everyone, while keeping a paid tier for the customers who need more: guaranteed fixes, compliance and long support. The logic is familiar from the [marketing mix](/topics/the-seven-ps-of-the-marketing-mix/). A very low price builds adoption quickly, as penetration pricing does, and the free product can work like a loss leader that brings customers to the paid one. The open-source licence adds something a price cut cannot: anyone may use, change and share the images, which removes the fear of being locked in to one supplier.

  The risks are the ones the course asks students to weigh. Customers who would have paid may now use the free version, so revenue falls unless enough of them upgrade. Competitors can match a free offer. And the case for paying rests on service quality that customers can judge only over time. Docker's announcement, with its endorsements from partners, is also a piece of promotion, and should be read as one.


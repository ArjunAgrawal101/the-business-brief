choices:
  - option: Keep charging for every image
    analysis: >-
      Protects revenue from each customer, but limits adoption in a market where free alternatives exist and where trust
      takes time to build.
  - option: Offer a limited free version
    analysis: >-
      Lets customers try the product while keeping the best features paid, but a restricted product is a weaker way to
      become the standard that others build on.
  - option: Make the core free and open, and sell enterprise services
    taken: true
    analysis: >-
      Builds adoption and trust fastest and keeps revenue from the customers with the greatest needs, but gives up revenue
      from those who would have paid and depends on enough customers upgrading.
  - option: Lower the price instead of removing it
    analysis: >-
      Keeps some revenue from every user, but even a small price deters many developers, and it does not bring the
      openness of a free licence.

lessons:
  - Pricing is strategy. A price of zero can be the start of a revenue model, not the end of one.
  - When the core product is free, the paid version must be clearly worth more, through service, guarantees or support.
  - Claims and endorsements in a company's own announcement are evidence of its strategy, not proof of its results.
  - For managers, before giving a product away, estimate how many customers will stop paying and how many new ones will upgrade.

question:
  command: analyse
  prompt: Analyse how making a product free can increase a business's revenue in the long term. Refer to Docker.

limits:
  - The release gives no revenue or customer numbers, so the financial effect of the decision cannot be judged from it.
  - The vulnerability and download figures are Docker's own claims and are not independently tested here.
  - Only Docker's announcement was read for this item; competitors' responses are not covered.


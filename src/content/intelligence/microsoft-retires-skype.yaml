choices:
  - option: Keep Skype running beside Teams
    analysis: >-
      Keeps users who are loyal to Skype and its well-known brand, but pays for two overlapping products and splits
      users, investment and attention between them.
  - option: Invest to revive Skype
    analysis: >-
      An extension strategy of new features and promotion might win users back, but it is costly, uncertain, and sets
      Microsoft competing against its own product.
  - option: Retire Skype and move its users to Teams
    taken: true
    analysis: >-
      Puts investment and users behind one product and carries contacts and chats across, but risks losing users who
      take the moment to move to a rival, and gives up a famous brand.
  - option: Sell Skype to another company
    analysis: >-
      Might recover some value and keep the service alive, but a buyer would compete with Teams for the same users.
      Nothing in the source says Microsoft considered it.

implications: |-
  Microsoft does not call Skype a failure, and its announcement does not show Skype's decline: it gives no figures for Skype's users or revenue. What it shows is the last stage of a [product life cycle](/topics/the-seven-ps-of-the-marketing-mix/): a product withdrawn while a newer product in the same portfolio grows. Whether that counts as failure depends on the measure. As a brand, Skype is retired; as a service, its users were invited to bring their contacts and chats to Teams, so Microsoft may keep much of what Skype built under another name.

  For users the implications differ. Free users could move with their contacts or export their data; paying customers could keep their credit and subscriptions only until their next renewal, and new customers could no longer buy. For Microsoft, the risk is that some users do not move but choose a rival, because changing apps is also a moment to change provider. For other businesses, the case shows that retiring a famous product can be a deliberate choice of focus, and that how the retirement is managed, from the migration to the treatment of paying customers and the timetable, decides how much of the product's value survives.

lessons:
  - Products have lives. A business must decide not only when to launch a product, but when and on what terms to withdraw it.
  - A product can fail inside a strategy that works; the test is whether its users, data and know-how move to what replaces it.
  - When a service is valuable because its users reach each other, a migration has to carry the network across, or users scatter to rivals.
  - For managers, plan a product's retirement as carefully as its launch, including paying customers, their data and the brand.

question:
  command: to-what-extent
  prompt: To what extent was Microsoft's decision to retire Skype a business failure rather than a strategic choice?

limits:
  - The only source is Microsoft's announcement. It gives no figures for Skype's users or revenue, so the extent of any decline cannot be measured from it.
  - No page confirming the closure itself on 5 May 2025, or how many Skype users moved to Teams, could be read for this item.
  - The Teams figures are Microsoft's own and are not independently verified here.


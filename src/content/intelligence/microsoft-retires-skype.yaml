happened:
  - date: '2025-02-28'
    text: >-
      Microsoft announced that it would retire Skype in May 2025 to focus on Microsoft Teams (free), which it described
      as its modern communications and collaboration hub, and that Skype would remain available until 5 May 2025. It
      described Skype as an integral part of shaping modern communications.
    sources: [ms-skype]
  - date: '2025-02-28'
    text: >-
      Skype users could sign in to Teams with their Skype account, starting that day with members of both the Teams and
      Skype Insider programmes, and their chats and contacts would appear in Teams automatically. During the transition,
      Teams users and Skype users could call and chat with each other.
    sources: [ms-skype]
  - date: '2025-02-28'
    text: >-
      Users who did not want to move to Teams could export their data, including chats, contacts and call history.
    sources: [ms-skype]
  - date: '2025-02-28'
    text: >-
      Microsoft stopped offering paid Skype features, including Skype Credit and calling subscriptions, to new customers.
      Existing subscribers could keep using their credit and subscriptions until the end of their next renewal period,
      and after 5 May 2025 the Skype Dial Pad would remain available to the remaining paid users.
    sources: [ms-skype]
  - date: '2025-02-28'
    text: >-
      Microsoft said Teams offers many of the features Skype users know, such as one-to-one and group calls, messaging
      and file sharing, and adds hosting meetings, managing calendars and building communities, for free. It said
      hundreds of millions of people already use Teams, and that in the past two years the minutes spent in meetings by
      consumer users of Teams had grown fourfold.
    sources: [ms-skype]

context: |-
  Skype and Teams are both Microsoft services for calling, messaging and meeting online, so by 2025 Microsoft was running two products that overlapped for consumers. Its announcement shows which one it was backing. By Microsoft's account, hundreds of millions of people already use Teams, and consumer use of Teams meetings had grown fourfold in two years; the announcement gives no figure at all for Skype's users. Microsoft described Skype as an integral part of shaping modern communications, and chose to close it rather than keep both.

  Two features of the context matter. First, a calling service is worth more to each user the more of the people they want to reach are on it, which is why the transition let Teams and Skype users call each other and carried contacts and chats across: a network that people start to leave can lose its value quickly. Second, Skype had paying customers, for credit and calling subscriptions, as well as free users, so retiring it meant deciding what would happen to revenue and to people who had paid in advance.


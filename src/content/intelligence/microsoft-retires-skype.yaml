title: Microsoft retires Skype and moves its users to Teams
dek: >-
  In February 2025 Microsoft announced that it would retire Skype in May to focus on the free version of Teams,
  invited Skype's users to sign in to Teams with their existing accounts, and stopped selling Skype's paid features to
  new customers.
organizations: [Microsoft]
categories: [business-failure, corporate-strategy, marketing]
regions: [global]
industry: Communications software
keyConcepts: [change]
date: '2025-02-28'

title: Novo Nordisk cuts the US list price of Wegovy by about half as a new pill widens its market
dek: >-
  In February 2026 Novo Nordisk said that from January 2027 it would cut the US list price of Wegovy by about 50% and of
  Ozempic by about 35%. The move followed a pricing agreement with the US government and the launch of the first pill of
  its kind for weight loss, in a year Novo first expected its sales to fall.
organizations: [Novo Nordisk, The White House]
categories: [marketing, financial-results, innovation]
regions: [north-america, europe]
industry: 'Pharmaceuticals'
keyConcepts: [ethics, change]
date: '2026-02-24'
written: '2026-11-20'
checked: '2026-11-20'
figures:
  - value: $675 a month
    label: The US list price of Wegovy, Ozempic and Rybelsus from 1 January 2027, for every dose
    source: novo-list-price
  - value: −5% to −13%
    label: Novo Nordisk's first outlook for adjusted sales growth in 2026, at constant exchange rates
    source: novo-outlook-2026
  - value: −2% to +2%
    label: The same outlook, raised twice, by 4 November 2026
    source: novo-q3-2026

background:
  - date: '2025-11-06'
    text: >-
      Novo Nordisk agreed with the US Administration to lower the prices of its semaglutide medicines, including Wegovy
      and Ozempic, from 2026 in Medicare Part D, Medicaid and the direct-to-patient cash channel, with Medicare coverage of
      obesity medicines through a pilot programme. It expected a negative low single-digit impact on its global sales
      growth in 2026, and said it was expected to receive a three-year tariff exemption.
    sources: [novo-us-agreement]
  - date: '2025-11-06'
    text: >-
      The White House said the prices of Ozempic and Wegovy bought through its TrumpRx website would fall from $1,000 and
      $1,350 a month respectively to $350, that their Medicare price would be $245 with a co-payment of $50 a month for
      beneficiaries, and that Novo Nordisk had committed an additional $10 billion of investment in the United States.
    sources: [white-house-mfn]
  - date: '2025-12-22'
    text: >-
      The US Food and Drug Administration approved the Wegovy pill, a once-daily oral form of semaglutide, which Novo
      Nordisk described as the first oral GLP-1 treatment approved for weight management. In the OASIS 4 trial it showed
      a mean weight loss of 16.6% when treatment was adhered to.
    sources: [novo-pill-approval]
  - date: '2026-01-05'
    text: >-
      The Wegovy pill went on sale in the United States, with the starting dose at $149 a month through a self-pay offer,
      through more than 70,000 pharmacies, telehealth providers and Novo Nordisk's own NovoCare Pharmacy.
    sources: [novo-pill-launch]
  - date: '2026-02-03'
    text: >-
      Novo Nordisk reported sales growth of 10% and operating profit growth of 6% at constant exchange rates for 2025,
      and forecast adjusted sales growth of -5% to -13% for 2026. It expected sales to fall in the United States and
      cited lower realised prices, including the agreement with the US Administration, the loss of exclusivity for
      semaglutide in some international markets and intensifying competition.
    sources: [novo-outlook-2026]

happened:
  - date: '2026-02-24'
    text: >-
      Novo Nordisk announced that from 1 January 2027 it would lower the list price, or wholesale acquisition cost, of
      Wegovy, Ozempic and Rybelsus to $675 a month for all doses: a reduction of about 50% for Wegovy and about 35% for
      Ozempic.
    sources: [novo-list-price]
  - date: '2026-02-24'
    text: >-
      Jamey Millar, executive vice president for US operations, said private and public payers and patients had been
      calling for lower list prices, and that the cut was aimed at people whose out-of-pocket costs are linked to list
      price, such as those with high-deductible health plans or co-insurance.
    sources: [novo-list-price]
  - date: '2026-02-24'
    text: >-
      The company said the change would not affect its direct-to-patient self-pay prices, and described it as the latest
      in a series of efforts to widen access, including savings offers, self-pay through NovoCare Pharmacy and telehealth
      relationships.
    sources: [novo-list-price]

since:
  - date: '2026-08-04'
    text: >-
      Novo Nordisk reported adjusted sales growth of 7% at constant exchange rates in the second quarter and raised its
      2026 outlook to adjusted sales growth of 0% to -6%, driven by higher expectations for sales of its GLP-1 products.
      It also recorded impairment charges of DKK 6.3 billion on pipeline assets.
    sources: [novo-q2-2026]
  - date: '2026-11-04'
    text: >-
      With its third-quarter results, Novo Nordisk raised its 2026 outlook again, to adjusted sales growth of -2% to +2%.
      Its investor presentation reported more than 7 million prescriptions for the Wegovy pill in the year to date,
      about 90% of them self-pay, with about 80% of users new to GLP-1 obesity medicines, and said the pill had been
      launched in 8 markets.
    sources: [novo-q3-2026]

context: |-
  Novo Nordisk, a Danish company, makes semaglutide, the active ingredient of Ozempic for diabetes and Wegovy for obesity. In the United States the price of a medicine works on several levels: the list price, set by the maker; the net price insurers pay after rebates; and, increasingly, a self-pay price for patients who buy directly. Patients whose costs are tied to the list price, such as those on high-deductible plans, can pay far more than others for the same medicine.

  By early 2026 Novo was under pressure from several directions at once. The US government had negotiated lower prices for Medicare and Medicaid; the patent on semaglutide had expired in some international markets; competition was intensifying; and Novo itself forecast that its adjusted sales would fall in 2026. Against that, the market for GLP-1 medicines was still growing, and Novo had a new product, a pill, priced to attract self-paying patients. The context is a market leader resetting its prices while trying to grow the market faster than prices fall.

concepts:
  subtopics:
    - code: '4.5'
      note: Price elasticity of demand decides whether a lower price raises revenue; here a list price cut, alongside self-pay and government prices.
      level: HL
    - code: '4.1'
      note: Market growth and market share. The GLP-1 market kept expanding while competition for it intensified.
    - code: '5.8'
      note: A new form of an existing medicine, the pill, as innovation that reaches new patients as patents expire.
      level: HL
    - code: '1.4'
      note: Patients, insurers, the US government and Novo's shareholders want different things from the price of the same medicine.
  terms: [price-elasticity-of-demand, competitive-pricing, market-growth, market-share, product-innovation, incremental-innovation, patent, intellectual-property, research-and-development, distribution-channel, stakeholder-conflict, ethical-objectives]
  tools:
    - id: ansoff-matrix
      note: 'Place each move on the matrix: new patients through Medicare coverage and self-pay channels, and a new product, the pill, in an existing market.'
  frameworks:
    - id: product-life-cycle
      note: 'As semaglutide''s patents expire in some markets, a pill, a higher dose and new markets act as extension strategies.'
  apply:
    - href: /market-studio/marketing-mix/
      label: 'Marketing mix'
      note: 'Rework price, place and promotion for a medicine sold through insurers, government programmes and direct to patients.'

choices:
  - option: Keep list prices high and compete through confidential rebates to insurers
    analysis: >-
      Protects the headline price and revenue per unit, but leaves patients whose costs follow the list price paying the
      most, at a time when payers, patients and the US government were pressing for lower prices.
  - option: Cut prices only in particular channels, such as government programmes and self-pay
    taken: true
    analysis: >-
      Novo did this through its agreement with the US Administration and its self-pay offers. It targets the cuts, but
      does nothing for insured patients whose costs are linked to the list price.
  - option: Cut the list price for every dose
    taken: true
    analysis: >-
      Widens access for patients on high-deductible plans and answers payers' calls, but lowers revenue per unit, so it
      pays only if volume grows enough. It takes effect from 1 January 2027.
  - option: Launch a new form of the medicine at a low self-pay price
    taken: true
    analysis: >-
      The Wegovy pill, at $149 a month to start, reached patients who had not used GLP-1 medicines before, by Novo's own
      figures, but cheaper products risk taking sales from more expensive ones.

implications: |-
  Revenue is price multiplied by volume, and Novo's decisions in 2026 test that arithmetic. Lower prices in government programmes and a list price cut reduce what Novo earns on each prescription; the question is whether volume grows fast enough to compensate. Novo's own outlook moved from a fall in adjusted sales of 5% to 13% in February to between a fall of 2% and a rise of 2% by November, driven by higher expectations for GLP-1 sales, which suggests that volume, helped by the pill, did more than Novo first expected.

  The stakeholders gain and lose in different ways. Patients whose costs are tied to the list price should pay less from 2027; Medicare beneficiaries were promised coverage for obesity medicines through a pilot programme; shareholders face lower prices and, in some countries, competition after patent expiry. The pricing of medicines is also an ethical question: the price that maximizes revenue is not necessarily the price that serves patients, and governments increasingly set the terms. The [marketing mix](/topics/the-seven-ps-of-the-marketing-mix/) brief covers pricing strategies; this case shows several prices for one product, each set for a different customer.

lessons:
  - A price cut is a bet on price elasticity. Revenue rises only if volume grows by more than the price falls.
  - One product can have several prices, a list price, a net price and a self-pay price, so always ask which price a customer actually pays.
  - When patents expire and governments press on prices, innovation such as a new form or dose extends a product's life.
  - For managers in regulated markets, prices are negotiated with powerful stakeholders, not set alone.

question:
  command: analyse
  prompt: Analyse how price elasticity of demand affects the likely impact of Novo Nordisk's US list price cut on its revenue.
  level: HL

limits:
  - The list price cut takes effect on 1 January 2027, after this item was checked, so its effect cannot yet be seen.
  - Every figure is Novo Nordisk's or the White House's own. The net prices insurers pay after rebates are not disclosed in the sources read.
  - Novo's outlook ranges are forecasts of adjusted measures, which exclude some items, and they were changed twice during 2026.


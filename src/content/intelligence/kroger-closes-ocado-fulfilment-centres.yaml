title: Kroger closes three automated warehouses built with Ocado and expects about $2.6 billion of charges
dek: >-
  In November 2025 the US grocer Kroger said its automated fulfilment network had not met financial expectations, closed
  three centres run with Ocado's technology and turned to Instacart, DoorDash and Uber Eats for more deliveries. Ocado,
  the British technology supplier, agreed a one-off payment of $350 million for the lost fees.
organizations: [Kroger, Ocado Group]
categories: [corporate-strategy, innovation, industry-developments]

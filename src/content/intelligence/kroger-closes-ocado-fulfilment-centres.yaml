choices:
  - option: Keep every centre open and wait for online demand to grow into the capacity
    analysis: >-
      Avoids an immediate write-down and keeps the option of future growth, but continues losses where demand is thin,
      and the money already spent should not by itself decide what happens next.
  - option: Close the weakest centres, keep those in denser markets, and use stores and delivery platforms elsewhere
    taken: true
    analysis: >-
      Cuts losses and uses cheaper, more flexible capacity, but brings large charges now, ends planned growth with Ocado
      and makes Kroger more reliant on platforms that also serve its competitors.
  - option: Abandon automated fulfilment altogether
    analysis: >-
      Simplest, but throws away capacity that Kroger says works where demand is dense, and centres such as Detroit, where
      it ordered more capacity, were improving.
  - option: For Ocado, negotiate compensation for the fees it would lose
    taken: true
    analysis: >-
      The $350 million payment replaces future capacity fees with cash now, which helps Ocado's aim of positive cash
      flow, but its long-term revenue in North America shrinks.

implications: |-
  Kroger's decision shows investment appraisal from the other end: when an investment does not earn what was expected, the asset is written down, here by about $2.6 billion, and the company looks for cheaper ways to meet the same need. Kroger expects the change to improve eCommerce operating profit by about $400 million in 2026, which suggests the centres it closed were costing more than they earned. For Ocado, the payment softens the blow in the short term, but its business depends on partners using its capacity, and two North American partners cut back within weeks.

  The wider lesson is about matching an operations method to demand. Automation brings low costs per order only at high volume; where demand is thinner, store picking and delivery platforms are more flexible. Ocado's own response, offering store-based automation and other new products, is an attempt to sell to retailers in exactly those markets.

lessons:
  - An investment is only as good as the demand forecast behind it. Capacity that is not used still has to be paid for.
  - Money already spent should not decide whether to keep an asset; what it will earn from now on should.
  - A contract can protect a supplier when its customer changes strategy, but not its long-term growth.
  - For managers, match the operations method to the density of demand, not to what is technically possible.

question:
  command: evaluate
  prompt: Evaluate Kroger's decision to close three automated fulfilment centres and rely more on its stores and on delivery platforms.

limits:
  - The sources do not give the original cost of the centres, how fully they were used, or how many jobs were lost when they closed.
  - Kroger's results for 2026 were not read, so whether the expected $400 million improvement was achieved is not known here.
  - Each company's statements are its own; neither gives the other's view of why the centres fell short.


happened:
  - date: '2025-11-18'
    text: >-
      Kroger announced that, after a comprehensive review, it would close automated fulfilment centres in Pleasant
      Prairie, Wisconsin, Frederick, Maryland, and Groveland, Florida, in January, while continuing to use automation
      where demand is denser.
    sources: [kroger-ecommerce]
  - date: '2025-11-18'
    text: >-
      It expected impairment and related charges of about $2.6 billion in its third fiscal quarter of 2025, as a result of
      the closures and of the automated fulfilment network not meeting financial expectations, and an improvement of
      about $400 million in eCommerce operating profit in 2026, to be used for lower prices, better stores and higher
      margins.
    sources: [kroger-ecommerce]
  - date: '2025-11-18'
    text: >-
      Kroger made Instacart its primary delivery fulfilment provider, widened its relationship with DoorDash and planned
      to sell groceries through Uber Eats from early 2026. It said it would pilot store-based automation that needs
      less capital in high-volume areas.
    sources: [kroger-ecommerce]
  - date: '2025-11-18'
    text: >-
      Ocado, which supplies the technology for Kroger's centres, said it expected compensation of more than $250 million
      for the early closures, that its fee revenue in its 2026 financial year would fall by about $50 million, and that
      five centres would keep operating, in Monroe, Dallas, Atlanta, Denver and Detroit.
    sources: [ocado-nov-2025]

since:
  - date: '2025-12-05'
    text: >-
      Ocado and Kroger agreed a one-off cash payment of $350 million to Ocado, due in January 2026, mainly in place of
      future capacity fees. It covered the three closures and Kroger's decision not to go ahead with a planned centre in
      Charlotte, North Carolina. Ocado said Kroger had ordered more capacity in Detroit, and repeated that its priority
      was to become cash flow positive in its 2026 financial year.
    sources: [ocado-dec-2025]
  - date: '2026-01-29'
    text: >-
      Ocado announced that Sobeys, its Canadian partner, would close its centre in Calgary because the Alberta online
      grocery market was smaller and growing more slowly than expected, while development of a Vancouver site stayed
      paused. Ocado's chief executive, Tim Steiner, described the changes with Sobeys and Kroger as a reset of Ocado's
      North American business.
    sources: [ocado-sobeys]

context: |-
  Kroger, a US grocer listed in New York, built a network of large automated warehouses, called customer fulfilment centres, using technology from Ocado, a British company whose systems run the centres and which earns fees for the capacity its partners use. A centre like this is a very large fixed investment, and it pays only if enough orders flow through it; Kroger's own explanation is that automation works where demand is dense.

  By 2025 Kroger had other ways to serve online shoppers: picking orders in its stores, and delivery through platforms such as Instacart, DoorDash and Uber Eats. The context is a retailer comparing an expensive, specialized operations method with cheaper and more flexible alternatives, and a technology supplier whose income depends on its customer's choice.

concepts:
  subtopics:
    - code: '3.8'
      note: Investment appraisal. The centres were judged on the returns they were expected to earn, and the network did not meet financial expectations.
    - code: '3.4'
      note: An impairment writes down assets that will not earn what was expected, reducing profit in the year it is recognized.
    - code: '5.6'
      note: Capacity utilization. Automated capacity pays only where demand is dense enough to keep it busy.
      level: HL
    - code: '4.3'
      note: The limitations of sales forecasting. Large fixed investments rest on demand forecasts, and Sobeys found Alberta's market growing more slowly than expected.
      level: HL
    - code: '1.5'
      note: A long-term partnership between a retailer and its technology supplier, and what happens to it when the retailer changes course.
    - code: '4.5'
      note: 'Place: delivery through third-party platforms as a distribution channel alongside the retailer''s own stores and websites.'
  terms: [investment-appraisal, capital-expenditure, payback-period, capacity-utilization-rate, fixed-cost, strategic-alliance, outsourcing, distribution-channel, e-commerce, economies-of-scale, sunk-cost]

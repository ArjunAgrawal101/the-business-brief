title: The FCA closes its investigation into Drax's biomass statements without taking action
dek: >-
  The UK's financial regulator examined whether Drax's annual reports for 2021 to 2023 misled investors about the
  sustainability of the wood pellets it burns. It closed the case in June 2026, two years after the energy regulator's
  inquiry ended with Drax paying £25 million into a redress fund.
organizations: [Drax Group, Financial Conduct Authority]
categories: [sustainability, corporate-governance]
regions: [europe, north-america]
industry: 'Electricity generation and biomass'
keyConcepts: [sustainability, ethics]
date: '2026-06-18'
written: '2026-11-20'
checked: '2026-11-20'
figures:
  - value: £25 million
    label: Paid by Drax into Ofgem's voluntary redress fund after the energy regulator's findings in 2024
    source: drax-ofgem
  - value: About 6%
    label: Share of the UK's electricity generated by Drax Power Station between April 2025 and March 2026
    source: drax-h1-2026

background:
  - date: '2024-08-29'
    text: >-
      Drax announced that Ofgem, the energy regulator, had closed its investigation into Drax's biomass profiling data.
      According to Drax, Ofgem found no evidence that its biomass was not sustainable or that it had received Renewable
      Obligation Certificates incorrectly, but found process gaps in two aspects of its profiling data for Canada between
      April 2021 and March 2022.
    sources: [drax-ofgem]
  - date: '2024-08-29'
    text: >-
      Drax said it would pay £25 million into Ofgem's voluntary redress fund, resubmit its Canadian profiling data for
      that period and commission an independent audit of its biomass profiling data for April 2023 to March 2024. It
      noted that it had acquired Pinnacle Renewable Energy in April 2021, which accounted for most of its activity in
      Canada and about 14% of the biomass delivered to Drax Power Station in the period Ofgem examined.
    sources: [drax-ofgem]
  - date: '2025-08-28'
    text: >-
      Drax announced that it had been notified on 26 August 2025 that the Financial Conduct Authority (FCA) had opened
      an investigation, covering January 2022 to March 2024, into certain historical statements about its biomass
      sourcing and whether its 2021, 2022 and 2023 annual reports complied with the Listing Rules and the Disclosure
      Guidance and Transparency Rules.
    sources: [drax-notification]

happened:
  - date: '2026-06-18'
    text: >-
      The FCA closed its investigation. It said it had acted on concerns raised about Drax's disclosures to the market on
      the sustainability of its Canadian biomass, and that it had not found evidence that justified any further action.
    sources: [fca-drax]
  - date: '2026-06-18'
    text: >-
      The FCA said it had reviewed thousands of pages of material and interviewed people from the company, and that its
      focus was whether the annual reports for 2021 to 2023 contained misleading statements or left out information
      investors needed. It noted that Drax is not a regulated financial services firm, but that as a listed company it
      has continuing disclosure obligations.
    sources: [fca-drax]
  - date: '2026-06-18'
    text: >-
      Drax confirmed that no action would be taken and that the FCA had no concerns warranting further investigation.
      Its chief executive, Will Gardiner, said the company had worked constructively with the regulator throughout.
    sources: [drax-closure]

since:
  - date: '2026-07-30'
    text: >-
      In its half-year results, Drax reported that Drax Power Station generated about 6% of the UK's electricity and
      around 10% of its renewable power between April 2025 and March 2026, and that a new low-carbon dispatchable
      Contract for Difference would cover the station from April 2027.
    sources: [drax-h1-2026]
  - date: '2026-07-30'
    text: >-
      Drax said it had launched a Biomass Tracker tool to make its biomass more transparent, that its targets for 2040
      had been validated by the Science Based Targets initiative, and that MSCI had upgraded its rating from A to AA in
      March, citing better environmental disclosures. It also said a strategic review of its Canadian business was
      under way.
    sources: [drax-h1-2026]

context: |-
  Drax Power Station burns wood pellets, including pellets made in Drax's own plants in North America, and its power counts as renewable under the UK's subsidy scheme when the biomass meets that scheme's sustainability criteria. That makes the source of the wood central to the business. Whether the biomass meets the criteria decides whether Drax earns subsidy certificates; how well Drax can show it shapes how investors judge its environmental risk, and whether the public accepts its claim to be a renewable generator.

  Two regulators looked at different questions. Ofgem, which runs the renewables subsidy scheme, examined Drax's reporting of data about its Canadian biomass; the FCA, which oversees what listed companies tell investors, examined whether its annual reports were misleading. The Canadian business came largely from the Pinnacle acquisition of 2021, so part of the story is how a company takes on another business's practices when it buys it. The context is a company whose licence to operate, in both the legal and the public sense, rests on claims about a supply chain that crosses an ocean.

concepts:
  subtopics:
    - code: '1.3'
      note: Corporate social responsibility and ethical objectives, when a company's environmental claims are central to what it sells.
    - code: '3.4'
      note: The purpose of accounts to different stakeholders. Investors rely on the annual report, which is why the FCA examined what it said.
    - code: '1.4'
      note: Investors, regulators, environmental critics and electricity customers judge the same claims for different reasons.
    - code: '5.6'
      note: A global supply chain, from pellet plants in North America to a power station in England, and the traceability it requires.
      level: HL
  terms: [corporate-social-responsibility, ethical-objectives, stakeholder, final-accounts, supply-chain, transfer-pricing, acquisition, greenwashing, sustainability-reporting, esg]
  tools:
    - id: steeple-analysis
      note: The environmental, ethical and legal factors around biomass power, and the political support its subsidy depends on.
  frameworks:
    - id: value-chain
      note: 'Drax both makes pellets and burns them. Trace where in its value chain the sustainability evidence is created, and where it could be lost.'

choices:
  - option: Defend the existing disclosures and say no more
    analysis: >-
      Cheapest in the short run and avoids admitting fault, but leaves doubts unanswered for investors and critics, and a
      company whose product is its environmental claim cannot afford lasting doubt.
  - option: Cooperate with the regulators, pay into the redress fund and commission independent audits
    taken: true
    analysis: >-
      Drax did this with Ofgem in 2024 and worked with the FCA until it closed its case. It costs money and management
      time and concedes that processes had gaps, but it gives outsiders evidence they can check.
  - option: Publish far more about where the biomass comes from
    taken: true
    analysis: >-
      The Biomass Tracker and the improved disclosures cited by MSCI make claims easier to test. Transparency works only
      if the data are reliable, and every new disclosure is another statement the company can be held to.
  - option: Sell or close the business at the centre of the concerns
    analysis: >-
      Would remove the Canadian sourcing from the debate, but those plants supply the station, and selling them changes
      the supply chain the subsidy depends on. Drax's review of the Canadian business was still under way when the item
      was checked.

implications: |-
  The FCA's wording repays close reading. It did not find that Drax's statements were accurate; it found no evidence that justified further action, and its remit covered only whether investors were misled. Ofgem's earlier finding, as Drax reported it, was similar in shape: no evidence the biomass was unsustainable, but gaps in how data were handled, and a £25 million payment. For a student, the lesson is that a closed case and a clean bill of health are different things.

  For Drax, the closure removes a legal risk while its strategy is changing: it is investing in batteries and solar, and the power station moves to a new Contract for Difference from April 2027. For investors, the case shows that sustainability statements in an annual report are disclosures like any other, and can be investigated as such. For the industry, it shows how far the case for [sustainability](/topics/business-objectives/) depends on evidence that can be traced along a [supply chain](/glossary/supply-chain/) crossing an ocean.

lessons:
  - Sustainability claims in an annual report are disclosures to investors, and regulators can test them like financial figures.
  - A regulator closing a case for lack of evidence is not the same as finding the company was right. Read the exact words.
  - When a business buys another, it buys its reporting practices and their risks as well as its assets.
  - For managers, traceability across a long supply chain is an operations task before it is a reporting one.

question:
  command: to-what-extent
  prompt: To what extent should a company's sustainability claims be checked as carefully as its financial figures? Refer to Drax.

limits:
  - Ofgem's own findings were not read; they are given here as Drax reported them in its announcement of 29 August 2024.
  - Neither regulator was asked to settle whether burning biomass is good for the climate, and this item does not try to.
  - The sources do not say who raised the concerns that led to the FCA's investigation, or what the FCA's evidence contained.
  - Drax's sustainability figures and ratings are reported by Drax and were not independently checked here.


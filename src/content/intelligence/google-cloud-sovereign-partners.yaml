choices:
  - option: Sell one global service everywhere
    analysis: >-
      The cheapest to run and the fullest use of economies of scale, but it leaves out customers whose rules require
      local control of data, and a government can exclude a provider it does not trust.
  - option: Build and run sovereign regions itself in each country
    analysis: >-
      Keeps full control and all the revenue, but the service is still run by a foreign company, which may not satisfy
      rules about who controls the data, and it is costly to repeat country by country.
  - option: Offer a range of controls, and work through independent local partners where customers need them
    taken: true
    analysis: >-
      Reaches regulated customers and borrows the local partners' standing with them and with regulators, but shares
      revenue and control, depends on partners' quality, and may turn a partner into a future rival.
  - option: Stay out of the most regulated segments
    analysis: >-
      Avoids the cost and risk of special services, but leaves governments, defence and regulated industries, all major
      buyers of computing, to competitors and to local providers.

implications: |-
  For Google, working through partners trades some control for access. A service such as PREMI3NS, offered by S3NS and built on Google Cloud Dedicated, lets Google's technology reach customers who might not buy directly from a US company, while the partner holds the relationship and the local credentials, including, by 2026, the SecNumCloud qualification. The design claims Google makes, such as Dedicated being able to keep running for up to a year without Google, show how far the offer goes to answer the fear of dependence on a foreign supplier.

  For the partners, from Thales and T-Systems to KDDI and CNTXT, the arrangement brings technology they did not have to build, and a share of the market for sovereign services; for customers it brings choice, at the price of more complex contracts and a need to understand who controls what. For the industry, sovereignty is becoming a basis of competition among cloud providers, and local firms are partnering with a foreign provider rather than only competing with it. In the course's terms, this is the balance between global standardization and local adaptation that runs through international business.

lessons:
  - Selling across borders means adapting to each host country's rules and politics, not only to its customers' tastes.
  - A local partner can supply what a multinational cannot buy outright, such as trust, local control and standing with regulators.
  - Partnerships trade control for access, and their terms decide who keeps the customer relationship.
  - For managers, find out which customers need control over their data and why, and design and price for each of those segments.

question:
  command: discuss
  prompt: Discuss the advantages and disadvantages for a multinational cloud provider of serving regulated customers in other countries through independent local partners. Refer to Google Cloud.

limits:
  - Every source is Google's own. The accounts of its partners, including Thales and S3NS, were not read for this item, so the partners' view of the arrangements is not represented.
  - The posts do not say how S3NS is owned, how revenue is shared with partners, or how many customers use these services.
  - Claims about control and resilience, such as Dedicated running for up to a year without Google, describe how Google says the services are designed; no independent test was read for this item.
  - The May 2025 post said Dedicated would launch next in Germany; no source read for this item says whether or when that happened.


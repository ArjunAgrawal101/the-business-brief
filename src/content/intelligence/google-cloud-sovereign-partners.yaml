title: Google Cloud sells sovereign clouds through local partners, from France to Japan
dek: >-
  In May 2025 Google Cloud set out services designed to keep customers' data and operations under local control,
  some run by independent partners in Europe, the Middle East, Asia and the United States. By 2026 its French
  partner's service, built on Google's technology, held what Google calls France's highest security certification for
  cloud providers.
organizations: [Google, S3NS, Thales]
categories: [global-business, industry-developments, corporate-strategy]
regions: [europe, north-america, middle-east, asia]
industry: Cloud computing
keyConcepts: [change, ethics]

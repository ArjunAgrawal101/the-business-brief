    label: Google Cloud regions worldwide in May 2025, as Google reports
    source: gc-sovereignty-2025
  - value: '13'
    label: Google Cloud regions in Europe in February 2026, as Google reports
    source: gc-sovereignty-europe-2026
  - value: Up to a year
    label: How long Google says Google Cloud Dedicated is designed to keep running without Google
    source: gc-forrester-2026

happened:
  - date: '2025-05-21'
    text: >-
      Google Cloud set out its sovereign cloud offerings. Google Cloud Data Boundary lets customers set a boundary for
      where their content is stored and processed and keep their encryption keys outside Google's infrastructure, and
      its external key management lets them control access to their data and deny it for any reason.
    sources: [gc-sovereignty-2025]
  - date: '2025-05-21'
    text: >-
      Google described Google Cloud Dedicated as designed to meet local sovereignty requirements and enabled by
      independent local and regional partners, and said it was expanding it globally, launching next in Germany. It
      described Google Cloud Air-Gapped as a fully standalone service that needs no connection to an outside network,
      aimed at intelligence, defence and other sectors with strict requirements, and said it had received
      authorization in 2024 to host US government Top Secret and Secret data.
    sources: [gc-sovereignty-2025]
  - date: '2025-05-21'
    text: >-
      Google named the partners that help it deliver these services: Schwarz Group and T-Systems in Germany, S3NS in
      France, Minsait in Spain, Telecom Italia in Italy, Clarence in Belgium and Luxembourg, CNTXT in Saudi Arabia,
      KDDI in Japan and World Wide Technology in the United States.
    sources: [gc-sovereignty-2025]
  - date: '2025-05-21'
    text: >-
      Google said it had worked with Thales since 2021 to build a Trusted Cloud by S3NS for Europe, operated by S3NS,
      a standalone French entity. The service, then in preview, was designed to meet the security and resilience
      requirements of France's SecNumCloud standards.
    sources: [gc-sovereignty-2025]
  - date: '2025-05-21'
    text: >-
      Google gave as reasons its customers' differing business needs, regulatory requirements and risk profiles, their
      wish not to be locked in to a single option, and the greater confidence in their security that local control of
      data and operations can give. It said its own network had more than 42 cloud regions, 127 zones and 202 network
      edge locations.
    sources: [gc-sovereignty-2025]

since:
  - date: '2026-02-20'
    text: >-
      Google Cloud said that S3NS had achieved SecNumCloud 3.2, which it called the highest security certification for
      cloud service providers in France, named Thales, TIM, Schwarz and Proximus among the European partners it works
      with, and said it had 13 cloud regions in Europe.
    sources: [gc-sovereignty-europe-2026]
  - date: '2026-04-09'
    text: >-
      In a post announcing that the research firm Forrester had named it a leader among sovereign cloud platforms,
      Google Cloud said that S3NS, a standalone entity, offers a service called PREMI3NS built on Google Cloud
      Dedicated, that PREMI3NS had achieved the SecNumCloud 3.2 qualification from the French National Agency for the
      Security of Information Systems (ANSSI), and that Google Cloud Dedicated is designed to keep running for up to a
      year even without Google.
    sources: [gc-forrester-2026]

context: |-
  Cloud computing is sold across borders: a company or a public body in one country rents computing power and storage from a provider based in another. That is efficient, but for governments, defence and regulated industries such as banking and healthcare it raises hard questions about where their data is kept, who can reach it, under which country's laws, and whether the service would keep running if something went wrong between them and the provider. Google Cloud is a US provider selling worldwide, with more than 42 regions by its own count in May 2025, and 13 in Europe by February 2026.

  Google's own account of the demand is that customers differ in their business needs, regulatory requirements and risk profiles, and do not want to be locked in to a single option. Its answer is a range of services with increasing degrees of local control: a boundary around where data is stored and processed, services run by independent local partners, and a fully standalone system cut off from outside networks. The partners it named in May 2025 are in Europe, the Middle East, Asia and the United States. This is the setting of [multinational companies (MNCs)](/topics/multinational-companies-mncs/) in the course: a multinational adapting to the rules and expectations of each host country.


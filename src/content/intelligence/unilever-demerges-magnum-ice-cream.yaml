title: Unilever demerges its ice cream business as The Magnum Ice Cream Company
dek: >-
  Unilever completed the demerger of its ice cream business on 6 December 2025, creating The Magnum Ice Cream Company,
  listed in Amsterdam, London and New York, and kept a stake of about 19.9% to sell over time. In its first half-year as
  an independent company, Magnum grew organic sales by 4.7% and took over the ice cream businesses in India and
  Portugal.
organizations: [Unilever, The Magnum Ice Cream Company]
categories: [corporate-strategy, restructuring]
regions: [europe, asia]
industry: 'Consumer goods: ice cream'
keyConcepts: [change]
date: '2025-12-06'
written: '2026-11-20'
checked: '2026-11-20'

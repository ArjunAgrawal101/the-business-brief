happened:
  - date: '2025-12-05'
    text: >-
      Unilever announced that the demerger of its ice cream business, The Magnum Ice Cream Company N.V. (TMICC), would
      complete on 6 December 2025, after TMICC had published its prospectus and its US registration had become
      effective.
    sources: [unilever-demerger-update]
  - date: '2025-12-06'
    text: >-
      Unilever completed the demerger. TMICC's shares began trading on 8 December 2025 on Euronext Amsterdam, the
      London Stock Exchange and the New York Stock Exchange, under the ticker MICC.
    sources: [unilever-completion]
  - date: '2025-12-08'
    text: >-
      Unilever said it would consolidate its own shares immediately afterwards, as approved by its shareholders on 21
      October 2025, so that its share price, earnings per share and dividends per share stayed comparable before and
      after the demerger.
    sources: [unilever-completion]

since:
  - date: '2026-02-12'
    text: >-
      Reporting its 2025 results, Unilever said it had kept a minority stake of about 19.9% in TMICC, to be sold down in an
      orderly way to pay demerger costs and keep capital flexible, and that the share consolidation had been made on an 8
      for 9 basis. It described itself as simpler, sharper and faster, with more exposure to Beauty & Wellbeing and
      Personal Care, including the acquisition of Minimalist in India.
    sources: [unilever-fy25]
  - date: '2026-02-12'
    text: >-
      Unilever's free cash flow of €5.9 billion was €0.4 billion lower than in 2024, mainly because of tax on disposals
      related to the demerger, and its productivity programme was also removing overheads left behind by the ice cream
      business.
    sources: [unilever-fy25]
  - date: '2026-03-30'
    text: >-
      TMICC completed the acquisition of the ice cream business in India, and that of Portugal on 1 April. Both had
      previously paid royalties to use TMICC's brands.
    sources: [tmicc-h1-2026]
  - date: '2026-03-31'
    text: >-
      Unilever agreed to combine its Foods business, including Knorr and Hellmann's, with McCormick, in a transaction
      valuing Unilever Foods at an enterprise value of $44.8 billion. Unilever and its shareholders would receive 65.0% of
      the combined company's equity and Unilever $15.7 billion in cash. Unilever said that after completion, expected by
      mid-2027, it would operate in Beauty, Wellbeing, Personal Care and Home Care.
    sources: [unilever-mccormick]
  - date: '2026-07-30'
    text: >-
      In its first half-year results, TMICC reported revenue of €4.7 billion and organic sales growth of 4.7%, split
      between volume and price, with growth for each of its four leading brands, Magnum, Ben & Jerry's, Cornetto and the
      Heartbrand. Transitional service agreements with Unilever reduced its Adjusted EBITDA margin by 0.7 percentage
      points, and interest payments rose with its standalone financing.
    sources: [tmicc-h1-2026]

context: |-
  Unilever's businesses include Beauty & Wellbeing, Personal Care, Home Care and Foods, and until December 2025 it was also in ice cream, through brands such as Magnum, Ben & Jerry's and Cornetto. The Magnum Ice Cream Company now describes itself as the world's leading ice cream business, with four of the world's five largest ice cream brands, 19,000 employees and sales in 80 markets.

  A demerger is a way of separating a business without selling it: shareholders of the parent receive shares in the new company, so they own both businesses directly. Unilever's account of the result is that it is now simpler and more focused on beauty, wellbeing and personal care. The context is a large group narrowing its portfolio, and a new company that must now pay for functions, finance and services it used to share.

concepts:
  subtopics:
    - code: '1.5'
      note: Growth and evolution in reverse. A large group separates a business to focus on the categories it wants to grow.
    - code: '1.2'
      note: A new publicly held company, listed in three markets, created by giving shares to the parent's shareholders.
    - code: '4.5'
      note: 'Product: the product portfolio, and why a set of strong brands can still be a poor fit for the rest of a portfolio.'
    - code: '3.2'
      note: Selling down a retained shareholding is a sale of assets, an internal source of finance, here used to pay demerger costs.
  terms: [product-portfolio, bcg-matrix, publicly-held-company, share-capital, sale-of-assets, internal-sources-of-finance, brand, brand-value, diseconomies-of-scale, core-competence, economies-of-scope]
  tools:
    - id: bcg-matrix
      note: Place Unilever's categories, including ice cream before the demerger, on the matrix and ask where the group chose to focus.
  apply:
    - href: /strategy-studio/bcg-matrix/
      label: 'BCG matrix'
      note: 'Plot a portfolio of brands, then test what removing one category does to the balance of the rest.'

choices:
  - option: Keep ice cream inside Unilever and improve it there
    analysis: >-
      Keeps its profits and any shared scale in buying, distribution and marketing, but leaves a business Unilever chose
      not to focus on competing for attention and capital with categories it wants to grow.
  - option: Sell the ice cream business to another company
    analysis: >-
      Brings in cash at once, but a sale may be taxed and depends on a buyer's price, and shareholders lose any
      future gains from the business.
  - option: Demerge it as a separately listed company and keep a minority stake to sell over time
    taken: true
    analysis: >-
      Shareholders keep both businesses and each can be managed and valued on its own terms. The costs include tax on
      the separation, overheads left behind at Unilever and the new company's standalone costs.

implications: |-
  For Unilever, the demerger is about focus: it presents itself as simpler, sharper and faster, with more weight in beauty, wellbeing and personal care. Ice cream was the first of two separations: in March 2026 Unilever agreed to combine its Foods business with McCormick, which would leave it, once complete, a business of beauty, wellbeing, personal care and home care. The separation was not free. Tax on disposals related to the demerger reduced free cash flow, and the productivity programme had to remove overheads the ice cream business left behind. Selling down the retained 19.9% stake turns part of the old business into cash to pay those costs.

  For The Magnum Ice Cream Company, independence brings its own costs, from services still bought from Unilever under transitional agreements to interest on its own borrowing, but also its own decisions: in its first half-year it grew organic sales by 4.7%, bought the ice cream businesses in India and Portugal that had previously paid it royalties, and set its own productivity programme. For students, the case shows that [growth and evolution](/topics/growth-and-evolution/) can run both ways: a business can create value by becoming smaller and more focused.

lessons:
  - A demerger separates a business without selling it, so shareholders keep both and can judge each on its own results.
  - "Separation has real costs: tax, overheads left behind, and the new company's standalone services and finance."
  - Focus is a strategy. A large group may grow faster by owning less.
  - For managers, whether a business fits a portfolio depends on what it shares with the rest, not only on how strong its brands are.

question:
  command: compare-and-contrast
  prompt: Compare and contrast demerging the ice cream business with selling it to another company, from the point of view of Unilever's shareholders.

limits:
  - Unilever's full case for choosing a demerger rather than a sale was set out before the period covered here and was not read for this item.
  - The terms of TMICC's acquisitions in India and Portugal are not given in the sources read.
  - Every figure is the companies' own, and TMICC's comparisons with 2025 are on its own basis of preparation.


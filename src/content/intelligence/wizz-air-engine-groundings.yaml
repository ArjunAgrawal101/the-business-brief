background:
  - date: '2024-12-31'
    text: >-
      Wizz Air agreed commercial support with Pratt & Whitney for aircraft grounded because of powder metal issues in its
      PW1100G-JM geared turbofan (GTF) engines. It expected around 40 Airbus A320neo family aircraft to stay grounded
      through its 2026 financial year for inspections. The support, running to the end of 2026, included operational
      help and compensation for the direct costs of grounded aircraft.
    sources: [wizz-pw]
  - date: '2024-12-31'
    text: >-
      Wizz Air said it still expected to return to growth in that year, taking 50 new Airbus A321neo aircraft and growing
      seat capacity by about 20%.
    sources: [wizz-pw]

happened:
  - date: '2026-06-11'
    text: >-
      For the year to 31 March 2026 Wizz Air reported a record 69.7 million passengers, up from 63.4 million, and revenue
      up 8.0% to €5,691.4 million, but a net profit of €1.3 million, against €213.9 million a year earlier. Operating
      profit fell to €139.7 million, mainly because of higher maintenance and depreciation costs as older aircraft left the
      fleet.
    sources: [wizz-fy26]
  - date: '2026-06-11'
    text: >-
      It said one-off setbacks during the year included the forced cancellation of Tel Aviv and other Middle East routes
      in the peak summer of 2025, and the cancellation of Middle East and Cyprus routes in March 2026. It had closed its
      Abu Dhabi base and wound down its Vienna base, moving capacity to its core markets in Central and Eastern Europe.
    sources: [wizz-fy26]
  - date: '2026-06-11'
    text: >-
      Wizz Air reported 30 aircraft grounded for GTF engine inspections at 31 March 2026, down from 42 a year earlier,
      and 24 by 5 June 2026. It expected 15 to 20 at the end of its 2027 financial year and none by the end of 2027, and
      said it had continued to receive compensation from Pratt & Whitney.
    sources: [wizz-fy26]

since:
  - date: '2026-11-12'
    text: >-
      In its half-year results, Wizz Air reported 22 aircraft grounded for engine inspections at 30 September 2026,
      against 35 a year earlier. Second-quarter net profit rose 7.4% to €306.3 million despite fuel costs 28.7% higher,
      and the airline said it had cancelled fewer flights and raised on-time performance above 70%.
    sources: [wizz-h1-f27]
  - date: '2026-11-12'
    text: >-
      In assessing whether it could keep operating, its directors used a base case adjusted for the aircraft availability
      constraints caused by GTF engine supply chain issues.
    sources: [wizz-h1-f27]

context: |-
  Wizz Air is a low-cost airline and, by its own account, the largest operator by seats in Central and Eastern Europe, and its fleet is made up of Airbus A320 and A321 family aircraft. Its newer A320neo family aircraft use Pratt & Whitney's geared turbofan engine, and when powder metal issues in that engine required inspections, Wizz Air had dozens of new aircraft it could not fly. A low-cost airline makes money by flying each aircraft as many hours as possible; an aircraft on the ground still costs money.

  The groundings came on top of other shocks: cancelled Middle East routes in two successive years and higher maintenance and depreciation as older aircraft left the fleet. Wizz Air kept growing, carrying a record number of passengers, but its profit almost vanished. The context is a business model built on high utilisation, hit by a supplier's problem it could not fix itself.

concepts:
  subtopics:
    - code: '5.6'
      note: The supply chain process, and the risk of relying on one supplier for a critical component; capacity that cannot be used.
      level: HL
    - code: '5.7'
      note: Crisis management when routes close suddenly, and contingency planning for a fleet that will not be fully available until 2027.
      level: HL
    - code: '3.5'
      note: Profitability ratios. Revenue rose 8.0% while net profit fell to €1.3 million, so the profit margin almost disappeared.
    - code: '3.3'
      note: Costs that continue whether or not an aircraft flies, set against revenue that depends on flying it.
    - code: '1.4'
      note: Passengers, shareholders, lenders and the engine maker each bear part of the cost of the groundings.
  terms: [supply-chain, capacity-utilization-rate, productive-capacity, contingency-planning, crisis-management, fixed-cost, depreciation, profit-margin, operating-leverage, stakeholder]
  tools:
    - id: steeple-analysis
      note: 'The technological and political shocks of these years: an engine fault outside the airline''s control, and conflicts that closed routes.'
  apply:
    - href: /operations-floor/capacity-and-productivity/
      label: 'Capacity utilization and productivity calculator'
      note: 'Work out how grounding part of a fleet changes capacity utilization and productivity, with figures of your own.'

choices:
  - option: Slow growth until the whole fleet is available again
    analysis: >-
      Protects reliability and avoids stretching the remaining aircraft, but gives up market share in growing markets and
      leaves the costs of new aircraft and staff to be covered by fewer flights.
  - option: Keep growing, and agree compensation and support from the engine maker for the grounded aircraft
    taken: true
    analysis: >-
      Wizz Air did this from 2024. Compensation covers direct costs, but not lost growth or the disruption of plans, and it
      depends on the supplier's continued support.
  - option: Pull out of riskier markets and move aircraft to core markets
    taken: true
    analysis: >-
      Closing Abu Dhabi and Vienna and moving capacity to Central and Eastern Europe concentrates scarce aircraft where
      the airline is strongest, at the cost of giving up growth elsewhere.

implications: |-
  The case shows how a supplier's problem becomes a customer's financial problem. Even with compensation from Pratt & Whitney, aircraft on the ground do not earn revenue, and an airline's costs for leases, depreciation and staff continue. With revenue up 8.0% and net profit down to €1.3 million, almost none of the revenue was left as profit; this is [operating leverage](/glossary/operating-leverage/) working in reverse.

  The recovery is gradual: 42 aircraft grounded in March 2025, 30 in March 2026, 22 in September 2026, and none expected by the end of 2027. In the meantime the directors built the engine shortage into their going-concern forecasts, a sign that the problem is managed as a long-term constraint, not a one-off event. For the industry, the case is a reminder that standardizing on one aircraft and engine type lowers costs in normal times and concentrates risk when that type has a fault.

lessons:
  - Relying on one supplier for a critical component concentrates risk. Resilience, such as spare capacity, has a cost.
  - Compensation from a supplier can cover direct costs, but rarely the lost growth and disrupted plans.
  - Record sales do not guarantee profit. When costs rise faster than revenue, the margin can disappear.
  - For managers, contingency planning means building a constraint like this into forecasts until it has gone.

question:
  command: to-what-extent
  prompt: To what extent were problems in its supply chain responsible for the fall in Wizz Air's profit in the year to March 2026?

limits:
  - Pratt & Whitney's own account was not read, and the sources do not say how much compensation Wizz Air received.
  - Every figure is Wizz Air's own. The sources list several causes of the fall in profit without saying how much each contributed.
  - This item does not describe the Middle East conflicts beyond their effect on Wizz Air's routes as the company reported it.


title: Engine inspections keep Wizz Air jets on the ground as its annual profit falls to €1.3 million
dek: >-
  Inspections of Pratt & Whitney engines kept about 40 of Wizz Air's Airbus jets out of service through 2025, with the
  engine maker paying compensation. In the year to March 2026 the airline carried a record 69.7 million passengers but
  made a net profit of just €1.3 million; by September 2026, 22 aircraft were still grounded.
organizations: [Wizz Air, Pratt & Whitney]
categories: [industry-developments, financial-results]
regions: [europe, middle-east]
industry: 'Airlines'
keyConcepts: [change]

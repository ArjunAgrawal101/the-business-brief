figures:
  - value: 100,000
    label: Vehicles built at BYD's Brazilian factory, a milestone it celebrated in 2026
    source: byd-fortune-2026
  - value: 9.7%
    label: BYD's share of Brazil's car registrations in October 2026, up from 4.2% a year earlier, by its own data
    source: byd-one-year
  - value: R$5.5 billion
    label: BYD's investment in the Camaçari industrial complex
    source: byd-100k

background:
  - date: '2025-07-01'
    text: >-
      The first BYD Dolphin Mini made in Brazil came off the line at the new factory in Camaçari, Bahia, along with the
      first Brazilian-built Song Pro hybrid. Stella Li, BYD's chief executive for the Americas and Europe, said it had
      taken 15 months from breaking ground to the first car, and that BYD chose Bahia for its people and skilled
      workforce.
    sources: [byd-first-car]
  - date: '2026-01-08'
    text: >-
      BYD's Brazilian business said the factory, inaugurated on 9 October 2025, had produced close to 18,000 vehicles and
      employed more than 2,000 people, expecting about 5,000 by the end of 2026. Its plans for 2026 included expanding
      production, bringing in local suppliers and opening welding, stamping and painting plants. Its head of sales and
      marketing, Alexandre Baldy, said local production would be decisive for staying competitive on price once tariff
      incentives for imported cars had ended.
    sources: [byd-restart]
  - date: '2026-03'
    text: >-
      BYD unveiled its second-generation Blade Battery and its FLASH Charging technology, with plans for 20,000 FLASH
      Charging stations in China by the end of 2026 and 6,000 in international markets.
    sources: [byd-fortune-2026]

happened:
  - date: '2026-07-28'
    text: >-
      BYD said that its overseas sales had passed 1 million vehicles for the first time in 2025, up 145% on the year
      before, and had exceeded 780,000 in the first half of 2026. It listed among the year's developments the
      celebration of the 100,000th vehicle made at its Brazilian factory and the opening of its first overseas SkyRail,
      in Brazil.
    sources: [byd-fortune-2026]
  - date: '2026-07-28'
    text: >-
      It reported 2025 revenue of RMB 804 billion, net profit of RMB 32.6 billion and sales of 4.6 million new energy
      vehicles, and research and development spending of RMB 63.4 billion, up 17%.
    sources: [byd-fortune-2026]
  - date: '2026-07-28'
    text: >-
      BYD also cited its first model developed specifically for the Japanese market, the BYD RACCO, as part of its
      international expansion.
    sources: [byd-fortune-2026]

since:
  - date: '2026-11-20'
    asAt: true
    text: >-
      BYD's Brazilian newsroom reported that, nine months after the factory's official opening, it had produced 100,000
      vehicles and employed 5,500 people directly, 86% of them from Bahia and 52% from Camaçari. It described the
      R$5.5 billion complex as BYD's largest outside Asia, said new stamping, welding and painting facilities would open
      in the second half of 2026 to increase local content, and expected the complex at full capacity to help create
      20,000 direct and indirect jobs.
    sources: [byd-100k]
  - date: '2026-11-20'
    asAt: true
    text: >-
      A later page from the same newsroom reported 24,114 BYD registrations in Brazil in October 2026, up 137.6% on a
      year earlier, a market share of 9.7% against 4.2%, and 193,227 registrations from January to October. It said
      Camaçari had lost thousands of industrial jobs in earlier years, and that BYD's ambition was to lead the Brazilian
      car market.
    sources: [byd-one-year]

context: |-
  BYD is a Chinese maker of electric and hybrid cars and, by its own account, the world's top-selling maker of new energy vehicles. Its growth abroad has been rapid: overseas sales passed a million for the first time in 2025. In Brazil it chose to build cars locally rather than only ship them from China, in Camaçari, a city that had once been an important centre of car production and, BYD says, had lost thousands of jobs before it arrived.

  BYD links the factory to two aims of its own: competing on price once tariff incentives for imported cars ended, and building a local supply chain. Behind both sits its scale and its spending on research and development, RMB 63.4 billion in 2025. The context is a multinational making a large foreign direct investment to defend and grow a market, in a host country with a history in the car industry.

concepts:
  subtopics:
    - code: '1.6'
      note: The impact of a multinational on a host country, from 5,500 direct jobs, mostly local, to competition for established carmakers.
    - code: '5.4'
      note: Reasons for locating production in Brazil, including tariffs on imported cars, a skilled workforce and a former car-making centre.
    - code: '4.6'
      note: The opportunities and threats of operating in international markets, and models adapted to particular markets.
      level: HL
    - code: '5.8'
      note: Research and development on a very large scale, behind new battery and charging technology.
      level: HL
    - code: '4.1'
      note: Market share in Brazil, which BYD's own data show more than doubling in a year.
  terms: [multinational-company, host-country, foreign-direct-investment, greenfield-investment, location-factors, trade-barriers, market-share, economies-of-scale, research-and-development, international-marketing, glocalization]
  tools:
    - id: porters-generic-strategies
      note: 'Ask whether local production supports a cost leadership strategy, and where BYD''s technology adds differentiation.'
  apply:
    - href: /operations-floor/location-assessment/

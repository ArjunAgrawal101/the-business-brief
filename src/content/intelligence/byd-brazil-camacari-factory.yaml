title: BYD's first Brazilian factory reaches 100,000 cars as the Chinese carmaker's overseas sales pass a million
dek: >-
  BYD began building cars at Camaçari in Bahia in 2025 and had produced 100,000 there by July 2026, with 5,500 direct
  employees, most of them from Bahia. It says local production helps it compete on price in Brazil, where its share of
  car registrations rose from 4.2% to 9.7% in a year.
organizations: [BYD]
categories: [global-business, innovation, sustainability]
regions: [latin-america, asia]
industry: 'Automotive (electric and hybrid cars)'
keyConcepts: [change, sustainability]
date: '2026-07-28'

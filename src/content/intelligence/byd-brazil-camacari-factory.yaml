choices:
  - option: Keep exporting cars from China to Brazil
    analysis: >-
      Needs no factory investment and uses existing plants, but leaves BYD exposed to import tariffs, shipping costs and
      long supply lines, and makes it a foreign brand rather than a local employer.
  - option: Partner with an established Brazilian manufacturer
    analysis: >-
      Shares the cost and draws on local knowledge, but gives up control of production and technology, and the profits
      are shared.
  - option: Build its own large factory in Brazil, in phases
    taken: true
    analysis: >-
      BYD began with final assembly in 2025 and planned stamping, welding and painting for the second half of 2026. It
      gives control, local jobs and lower tariff exposure, at the cost of R$5.5 billion of capital at risk in one
      country.

implications: |-
  For Brazil, the factory brings jobs to a region that, by BYD's account, had lost them: 5,500 direct employees nine months after the opening, mostly from Bahia, and an expected 20,000 direct and indirect jobs at full capacity. It also brings competition. BYD's market share rose from 4.2% to 9.7% in a year by its own data, and its stated ambition is to lead the market, which puts pressure on carmakers long established there.

  For BYD, producing locally turns a tariff threat into a cost advantage over importers and gives it a stronger claim to be part of the Brazilian economy. The risks move with it: capital tied up in one country, exposure to local politics and labour markets, and the challenge of building a local supply chain. The [multinational companies](/topics/multinational-companies-mncs/) brief sets out the impact of MNCs on host countries; this case shows a recent example in Latin America.

lessons:
  - Producing inside a market can be the price of competing there when tariffs on imports rise.
  - Foreign direct investment brings jobs and skills to a host country, and new competition for its existing firms.
  - Building in phases, from assembly to fuller production, lets a company learn and spread its investment.
  - For managers, scale and spending on research and development can underpin both lower costs and new products.

question:
  command: discuss
  prompt: Discuss the benefits and costs for Brazil of BYD's factory in Camaçari.

limits:
  - Every figure is BYD's own, from its global and Brazilian newsrooms, and its market share figures come from its own data team.
  - Two of the Brazilian pages carry no date; their facts are given as they stood when read on 20 November 2026.
  - The views of Brazil's governments, other carmakers, unions and workers were not read for this item.


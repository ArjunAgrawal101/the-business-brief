title: Google completes its purchase of Wiz, the deal it called its largest ever
dek: >-
  Agreed in March 2025 and completed in March 2026, Google's acquisition of the cloud security start-up Wiz kept the
  Wiz brand, and Google promised that Wiz would go on protecting customers who use rival clouds.
organizations: [Google, Wiz]
categories: [mergers-and-acquisitions, entrepreneurship]
keyConcepts: [change, creativity]
date: '2026-03-11'
written: '2026-11-03'
checked: '2026-11-03'

happened:
  - date: '2025-03-18'
    text: >-
      Google Cloud announced that it had signed a definitive agreement to acquire Wiz. It described Wiz as a cloud
      security platform that connects to all major clouds and code environments, maps the connections between code,
      cloud resources, services and applications, and identifies the paths an attacker could use, so that incidents can
      be prevented rather than only answered.
    sources: [wiz-agreement]
  - date: '2025-03-18'
    text: >-
      Google said Wiz was already an important Google Cloud partner, that its products would continue to work and be
      available on all major clouds, including Amazon Web Services, Microsoft Azure and Oracle Cloud, and that the
      acquisition was subject to closing conditions including regulatory approvals.
    sources: [wiz-agreement]
  - date: '2025-12-20'
    text: >-
      Looking back on 2025, Google Cloud wrote that when it was announced, the agreement to buy the cybersecurity
      start-up Wiz was Google's largest deal ever and the biggest technology deal of the year.
    sources: [gc-2025-review]
  - date: '2026-03-11'
    text: >-
      Google completed the acquisition. The Wiz team joined Google Cloud, Google kept the Wiz brand, and it repeated that
      Wiz products would continue to work and be available across major clouds.
    sources: [wiz-completed]
  - date: '2026-03-11'
    text: >-
      Google said it would offer a single security platform combining its own threat intelligence and security
      operations products with Wiz's cloud and AI security platform.
    sources: [wiz-completed]

since:
  - date: '2026-04-22'
    text: >-
      At its Next '26 conference, Google Cloud presented that combined offering and said Wiz now also supports tools
      for building AI agents from other providers, including AWS, Microsoft and Salesforce.
    sources: [next26]

matters: |-
  Growth by acquisition buys capability that would take years to build. Google already sold security products and services; Wiz, in Google's own description, worked differently, preventing attacks across every cloud a customer uses rather than responding once they happen. For the people who start a company like Wiz, a sale to a large business is one of the main ways to turn the value they have created into money, and Google Cloud's own description of Wiz as a start-up underlines how young the business it bought at this scale was.

  Two decisions after the purchase stand out. Google kept the Wiz brand, which protects the reputation and customer loyalty it paid for. And it kept Wiz working on the clouds of Amazon, Microsoft and Oracle, its direct competitors. That is a bet that a neutral security product sold to everyone is worth more than one used to pull customers onto Google's own cloud. The gap between agreement in March 2025 and completion in March 2026 is a reminder that large acquisitions wait on regulators, which shapes their timing and their risks. The [growth and evolution](/topics/growth-and-evolution/) brief sets out the wider choice between growing internally and buying growth.

concepts:
  subtopics:
    - code: '1.5'
      note: Acquisition as a method of external growth, and why a business buys rather than builds.
    - code: '1.1'
      note: Entrepreneurship and start-ups; a sale to a larger company as one way founders realize the value they built.
    - code: '4.5'
      note: Branding; keeping an acquired brand to keep its value and the loyalty of its customers.
    - code: '5.9'
      note: Cybersecurity and cybercrime as business risks, and cloud computing spread across several providers.
      level: HL
    - code: '2.5'
      note: Cultural clashes when organizations come together, such as a start-up team joining a very large company.
      level: HL
  terms: [acquisition, external-growth, synergy, start-up, entrepreneurship, brand, brand-value, brand-loyalty, cybersecurity, cybercrime, cloud-computing, culture-clash]
  tools:
    - id: ansoff-matrix
      note: Place the move on the matrix; a new kind of product for the markets Google Cloud already serves.

choices:
  - option: Build the capability in-house
    analysis: >-
      Full control and no acquisition premium, but slow, and in a fast-moving market a late product may never catch
      up with one customers already trust.
  - option: Stay partners
    analysis: >-
      Wiz was already a Google Cloud partner. A partnership is cheap and flexible, but Google would own neither the
      technology nor the team nor the profits, and a competitor could have bought Wiz instead.
  - option: Acquire Wiz and fold it into Google's own brand and cloud
    analysis: >-
      Gives the most control and the strongest pull towards Google's cloud, but risks losing customers on other clouds
      and the value of a known brand.
  - option: Acquire Wiz, keep its brand and keep it on every major cloud
    taken: true
    analysis: >-
      Protects the brand and customer base Google paid for, and earns revenue from customers on rival clouds, but limits
      how far the acquisition can be used to win cloud customers from competitors.

lessons:
  - Build, partner or buy is a real decision with costs and risks on every side, not a default to acquisition.
  - What happens after an acquisition, to the brand, the team and the customers, decides whether the price was worth paying.
  - For entrepreneurs, building something a large company cannot easily copy creates the option of a sale.
  - For managers, regulatory approval is part of the plan for a large deal, not an afterthought.

question:
  command: evaluate
  prompt: Evaluate Google's decision to keep the Wiz brand and to keep supporting rival cloud platforms after the acquisition.

limits:
  - The Google Cloud pages read for this item do not state the price, the terms of the deal or which regulators reviewed it.
  - Wiz's own announcements were not read, so the start-up's account of the deal is not represented.
  - Whether the acquisition succeeds depends on integration and results that the pages do not yet report.


  subtopics:
    - code: '1.4'
      note: Customers, dealers, lenders, their shareholders, claims firms and the regulator want different outcomes from the same scheme.
    - code: '1.3'
      note: Ethical objectives and corporate social responsibility, and the cost of practices that were legal in form but unfair in effect.
    - code: '4.5'
      note: 'Place: a dealer arranging finance is an intermediary in the distribution channel, and commission shapes how it behaves.'
    - code: '3.4'
      note: A provision for compensation is an expense in the profit and loss account and a liability in the balance sheet, set at management's best estimate.
    - code: '5.7'
      note: Contingency planning for a legal outcome that is not yet known, here a world with no scheme at all.
      level: HL

title: Car finance lenders face a £9.1 billion bill from the FCA's compensation scheme, now partly suspended
dek: >-
  In March 2026 the UK's financial regulator confirmed that lenders must compensate car buyers who were not told about
  the commission their dealer earned. Three lenders and a consumer group challenged the scheme, and the Upper Tribunal
  suspended parts of it until a hearing in 2027.
organizations: [Financial Conduct Authority, Lloyds Banking Group]
categories: [corporate-governance, industry-developments]
regions: [europe]
industry: 'Banking and consumer finance'
keyConcepts: [ethics, change]
date: '2026-03-30'
written: '2026-11-20'
checked: '2026-11-20'
figures:
  - value: £9.1 billion
    label: The FCA's estimate of the total cost of the scheme to firms, including £1.6 billion of costs other than compensation
    source: fca-statement
  - value: 12.1 million
    label: Motor finance agreements eligible for compensation, down from 14.2 million in the consultation
    source: fca-statement
  - value: £1,950 million
    label: Lloyds Banking Group's total provision for motor finance commission at 30 June 2026
    source: lloyds-h1-2026

happened:
  - date: '2026-03-30'
    text: >-
      The Financial Conduct Authority (FCA) confirmed that it would go ahead with a scheme to compensate motor finance
      customers who were treated unfairly. It said courts had found that firms broke the law by failing to disclose
      important information to customers, and that an industry-wide scheme was the quickest and most cost-effective way
      to deliver fair compensation.
    sources: [fca-statement, fca-press]
  - date: '2026-03-30'
    text: >-
      The scheme covers agreements taken out between 6 April 2007 and 1 November 2024 where the lender paid commission
      to the broker, usually the car dealer. Customers qualify only if they were not told about at least one of three
      arrangements: a discretionary commission arrangement, which let the broker raise the interest rate to earn more
      commission; high commission, of at least 39% of the total cost of credit and 10% of the loan; or a contractual tie
      that gave one lender exclusivity or the right of first refusal.
    sources: [fca-statement, fca-press]
  - date: '2026-03-30'
    text: >-
      After more than 1,000 consultation responses, the FCA tightened eligibility, so that 12.1 million agreements
      qualified, down from 14.2 million in its proposals. Assuming that 75% of eligible customers take part, it estimated
      compensation of £7.5 billion, down from £8.2 billion at consultation, and costs of £1.6 billion for running the
      scheme, a total bill to firms of £9.1 billion, down from £11 billion. It put the average payment at around £830 per
      agreement.
    sources: [fca-statement, fca-press]
  - date: '2026-03-30'
    text: >-
      For most customers, compensation is the average of the commission paid and an estimate of the loss, plus interest
      at the Bank of England base rate plus 1%, with a minimum of 3% a year, and it is capped in around 1 in 3 cases.
      About 90,000 customers whose cases closely match the Johnson case considered by the Supreme Court receive all the
      commission back, plus interest.
    sources: [fca-statement, fca-press]
  - date: '2026-03-30'
    text: >-
      The FCA estimated that handling the same complaints through the Financial Ombudsman Service or the courts would
      cost lenders over £6 billion more. It also reported that a record £41 billion was lent on motor finance in 2025,
      6% more than in 2024, and concluded that the scheme would have limited impact on the new car finance market.
    sources: [fca-statement, fca-press]
  - date: '2026-03-31'
    text: >-
      Lloyds Banking Group told the market that the final scheme differed from the one set out in October 2025, that it
      required careful analysis, and that the group was assessing its implications.
    sources: [lloyds-update]

since:
  - date: '2026-07-02'
    text: >-
      The FCA announced that the Upper Tribunal had suspended parts of the scheme, on terms agreed with the four parties
      challenging it: Volkswagen Financial Services, Mercedes Benz Financial Services, Crédit Agricole Auto Finance and
      Consumer Voice, represented by Courmacs Legal. Until the legal process concludes, firms do not have to calculate or
      pay compensation under the scheme, but must keep preparing for it and comply with the rules that are not
      suspended.
    sources: [fca-suspended]
  - date: '2026-07-02'
    text: >-
      The FCA told lenders to plan for the possibility that the scheme is quashed and there is no scheme at all, to make
      the necessary provisions and engage with their auditors, and to keep appropriate capital and liquidity in a UK
      regulated entity. It said that if the scheme is upheld and the judgment is not appealed, it expects payments to
      begin in 2027.
    sources: [fca-suspended]
  - date: '2026-07-30'
    text: >-
      Lloyds Banking Group reported no further charges for motor finance commission in the first half of 2026. Its total
      provision stood at £1,950 million, which it described as its current best estimate, while warning that the
      ultimate cost could differ materially.
    sources: [lloyds-h1-2026]
  - date: '2026-10-26'
    text: >-
      The FCA said the Upper Tribunal had extended the hearing of the challenges to run from 16 February to 3 March 2027.
    sources: [fca-hearing]

context: |-
  When a car dealer arranges a loan for a customer, it acts as a broker between the customer and a lender, and the lender pays it commission. Under a discretionary commission arrangement the broker could raise the interest rate to earn more commission, so the customer's interest and the broker's pulled in opposite directions. The FCA's case is that customers were not told enough to see this, and so were denied the chance to seek a better deal.

  The market is large and still growing: the FCA reports a record £41 billion lent on motor finance in 2025. The liability stretches back to 2007, across 12.1 million agreements, and falls on banks such as Lloyds, whose retail bank offers motor finance, and on other lenders, three of which went to court over the scheme. The context, then, is a regulator trying to settle a very large, long-running problem quickly, and lenders that must account for a cost whose size depends on rules still being argued in court.


choices:
  - option: Leave complaints to the Financial Ombudsman and the courts, case by case
    analysis: >-
      Each case is judged on its own facts, but the FCA estimated this route would cost lenders over £6 billion more, and
      customers would wait years for answers while uncertainty hung over the market.
  - option: Refund all the commission, plus interest, to every customer who was not told
    analysis: >-
      Simple to explain and generous to customers, but it would pay many people more than they lost, raise the bill
      sharply and invite challenge from lenders. The FCA kept the full refund only for about 90,000 cases closest to the
      Johnson case.
  - option: An industry-wide scheme with tight eligibility, a blended remedy and a cap
    taken: true
    analysis: >-
      Faster and cheaper to run than case-by-case complaints, and designed so no one ends up better off than if they had
      been treated fairly. The price of a single scheme is a single point of failure: one legal challenge has delayed
      payments for everyone.

implications: |-
  For customers, the immediate effect of the challenge is delay. The FCA had said millions would be paid in 2026; after the partial suspension it said payments would begin in 2027 if the scheme is upheld. For lenders, the scheme was meant to turn an open-ended legal risk into a calculable one; three lenders nonetheless chose to challenge its details. Lloyds' £1,950 million provision shows the accounting problem in plain view: the figure is management's best estimate, it depends on the outcome of the challenge, on how many customers respond and on operating costs, and Lloyds itself says the final cost could differ materially.

  For the industry, the case is a reminder that the design of a sales channel carries ethical risk. Paying intermediaries more when the customer pays more creates a [conflict of interest](/glossary/conflict-of-interest/); disclosure is the weakest possible safeguard, and here the regulator found it was not even given clearly. The FCA's instruction to plan for a world with no scheme, and to hold capital and liquidity for it, turns [contingency planning](/topics/crisis-management-and-contingency-planning/) from a textbook idea into a regulatory requirement.

lessons:
  - Paying an intermediary more when the customer pays more creates a conflict of interest that disclosure alone may not resolve.
  - A provision is an estimate, not a fact. When the outcome depends on courts and customers, the number in the accounts can move a long way.
  - Regulation is a stakeholder force. Rules made years after a sale can reshape an industry's costs, so ethical risk is also financial risk.
  - For managers, planning for several legal outcomes at once, including the worst, is part of running a regulated business.

question:
  command: discuss
  prompt: Discuss whether an industry-wide compensation scheme is a better way than individual complaints to put right an unfair practice across an industry. Refer to the FCA's motor finance scheme.

limits:
  - Every estimate of the scheme's size, cost and take-up is the FCA's own modelling, based on its assumption that 75% of eligible customers take part.
  - Only one lender's announcements, Lloyds Banking Group's, were read. Other lenders' provisions and the four challengers' arguments are not represented here.
  - The Supreme Court judgment and the Upper Tribunal's orders that the FCA refers to were not read for this item.
  - When the item was checked, the challenge had not been heard, so whether the scheme survives in its current form is unknown.


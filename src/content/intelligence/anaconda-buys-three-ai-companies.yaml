title: Anaconda buys three AI companies in a year of rapid expansion
dek: >-
  Anaconda, whose software more than 1.2 million organizations use by its own count, named a new chief executive in
  October 2025, then bought Outerbounds, Kilo Code and Enkrypt AI between April and August 2026 and hired a finance
  chief for what it called the most significant expansion in its history.
organizations: [Anaconda, Outerbounds, Kilo Code, Enkrypt AI]
categories: [entrepreneurship, mergers-and-acquisitions, leadership]
regions: [north-america]
industry: Data science and AI software
keyConcepts: [change, creativity]
date: '2026-08-04'
written: '2026-11-16'
checked: '2026-11-16'
figures:
  - value: '3'
    label: Acquisitions closed in six months, as Anaconda reports
    source: anaconda-cfo
  - value: 1.2 million+
    label: Organizations using Anaconda, including 95% of the Fortune 500, by its own count
    source: anaconda-ceo
  - value: 3 million+
    label: Developers Kilo Code reached in sixteen months, as Anaconda reports
    source: anaconda-kilo

background:
  - date: '2025-10-16'
    text: >-
      Anaconda's board named David DeSanto chief executive officer and a director. He had been Chief Product Officer at
      GitLab, where he led the global product organization for six years. The announcement said more than 1.2 million
      organizations use Anaconda, including 95% of the Fortune 500, and that the company had recently announced a $150
      million Series C funding round; it quoted George Mathew, a managing director at Insight Partners, as an Anaconda
      board director.
    sources: [anaconda-ceo]

happened:
  - date: '2026-04-29'
    text: >-
      Anaconda announced that it had acquired Outerbounds, the company behind Metaflow, an open-source framework for
      orchestrating AI and machine-learning work that began at Netflix. It did not disclose the terms, and said it was
      committed to continuing to develop and support Metaflow as an open-source project.
    sources: [anaconda-outerbounds]
  - date: '2026-04-29'
    text: >-
      Anaconda said enterprises need a governed path from experimenting with AI to running it in production, and that
      teams struggle with tools that were not built to work together. It described itself as having more than 50 million
      users and 21 billion downloads.
    sources: [anaconda-outerbounds]
  - date: '2026-07-15'
    text: >-
      Anaconda acquired Kilo Code, which it described as an open-source agentic engineering platform that works with
      many AI models, reached more than 3 million developers in sixteen months and processes trillions of tokens a month.
      It did not disclose the terms, said Kilo would stay available with no changes to existing products, plans or
      support, and said that connecting Kilo to Anaconda's own products was a direction it was building towards, not a
      capability available yet.
    sources: [anaconda-kilo]
  - date: '2026-08-04'
    text: >-
      Anaconda acquired Enkrypt AI, which it described as a security and compliance service that finds and reduces risks
      in enterprise AI and turns frameworks such as the NIST AI Risk Management Framework and the EU AI Act into
      controls enforced automatically. It did not disclose the terms, and said Enkrypt AI would stay available with no
      changes to existing products, plans or support.
    sources: [anaconda-enkrypt]

since:
  - date: '2026-08-26'
    text: >-
      Anaconda named Stewart Grierson chief financial officer, reporting to DeSanto. His earlier roles included chief
      financial officer of ArcSight through its 2008 initial public offering and its later acquisition by Hewlett
      Packard, and of Sumo Logic through its 2023 acquisition by Francisco Partners. Anaconda linked the appointment to
      the most significant expansion in its history, which included closing three acquisitions in six months.
    sources: [anaconda-cfo]

context: |-
  Anaconda describes more than a decade of work in open-source software, and its products are used by more than 1.2 million organizations by its own count, including 95% of the Fortune 500. It raises money from investors in funding rounds: the announcement of its new chief executive referred to a $150 million Series C round and to a board director from Insight Partners. In the language of entrepreneurship it is a scale-up, past the start-up stage, with a large base of users and investors who expect growth.

  By 2025 the market Anaconda serves was moving towards artificial intelligence, and its own releases describe the problems its customers face: AI projects that stall before they reach production, tools that were not built to work together, and the risks and costs of running AI agents. Anaconda chose a new chief executive from outside, the former product chief of GitLab, and then, in its own words, made the most significant expansion in its history. The companies it bought included Outerbounds, the business behind an open-source framework that began at Netflix, and Kilo Code, which had reached more than 3 million developers in sixteen months.

concepts:
  subtopics:
    - code: '1.1'
      note: Entrepreneurship, and the problems and opportunities of a business growing from start-up to scale-up.
    - code: '1.5'
      note: External growth through acquisitions, and why a growing firm buys capabilities instead of building them.
    - code: '3.2'
      note: External finance for a growing company, such as the share capital raised in a funding round.
    - code: '2.3'
      note: Leadership as a business grows, including professional managers brought in from outside.
    - code: '5.8'
      note: Buying innovation rather than developing it, and the role of open-source products in a firm's research and development.
      level: HL
  terms: [entrepreneurship, start-up, external-growth, acquisition, share-capital, leadership, innovation, venture-capital, funding-round, economies-of-scope, exit-strategy]
  tools:
    - id: ansoff-matrix
      note: Product development; new AI products, bought rather than built, for the organizations Anaconda already serves.
  frameworks:
    - id: business-model-canvas
      note: Map how each acquisition adds to Anaconda's value propositions, key resources and revenue streams.
  apply:
    - href: /entrepreneurship-lab/
      label: Entrepreneurship and Innovation Lab
      note: Follow a founder's route from opportunity to scaling, with the tools for costs, revenue, unit economics and the business plan.

choices:
  - option: Build the AI tools in-house
    analysis: >-
      Keeps full control and avoids paying for other companies, but is slow in a fast-moving market, and the users that
      a product like Kilo Code had already won would not come with it.
  - option: Partner with the companies instead of buying them
    analysis: >-
      Cheaper and easier to reverse, but Anaconda would own neither the products nor the teams, and a rival could buy
      the partners.
  - option: Acquire the companies, keeping their products running unchanged at first
    taken: true
    analysis: >-
      Brings products, teams and users in quickly and reassures existing customers, but three integrations in a few
      months stretch management, and the benefits of combining the products come only later.
  - option: Stay focused on the core business
    analysis: >-
      The least risky course in the short run, but it risks leaving Anaconda behind as its customers' work moves to AI.

implications: |-
  For Anaconda, buying rather than building turns cash or shares into products and users quickly, and the releases show the trade-off. Kilo Code and Enkrypt AI were to stay available with no changes to products, plans or support, which protects their customers and the value Anaconda paid for, but means that the combined platform the acquisitions are meant to create is, by Anaconda's own account, still being built. Three acquisitions in six months also test management, and Anaconda linked the appointment of its new finance chief, whose experience includes a company's stock market listing and two sales of companies, to that expansion.

  For the founders and investors of the acquired companies, a sale to a larger firm turned what they built into value, one of the main outcomes start-ups and their investors aim for. For Anaconda's own investors, the terms of the deals were not disclosed, so outsiders cannot judge whether the price was right. For the industry, the acquisitions show tools for AI being assembled into platforms, with open-source projects, such as Metaflow, kept open to hold on to the communities that made them valuable.

lessons:
  - Growing by acquisition buys time and users, but each deal adds integration work that the business must be organized to absorb.
  - Promising existing customers that nothing changes protects what was bought, and postpones the benefits of combining it.
  - As a firm grows, it often adds experienced professional managers, such as a new chief executive or finance chief, to its founders' and investors' team.
  - For managers, when a deal's price is not disclosed, judge it by its strategic fit and by what must happen afterwards for it to pay off.

question:
  command: evaluate
  prompt: Evaluate Anaconda's decision to grow by acquiring three companies in 2026 rather than developing their products itself.

limits:
  - Every source is an Anaconda press release. The acquired companies' own announcements were not read for this item.
  - None of the releases discloses the price or terms of the acquisitions, and the release that mentions the Series C round does not say when it was raised or who invested.
  - The releases give no revenue or profit figures, so the financial effect of the acquisitions cannot be judged from them.
  - The user figures are Anaconda's own and are described differently in different releases, as users and as active users.


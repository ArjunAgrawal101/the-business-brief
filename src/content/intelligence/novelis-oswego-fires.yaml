title: Two fires at Novelis's Oswego plant cost it $925 million and cut a year's profit by 98%
dek: >-
  Fires in September and November 2025 shut the hot mill at Novelis's aluminium plant in Oswego, New York, for most of a
  year. The Hindalco subsidiary supplied customers from its other plants, kept building a new plant in Alabama, and
  restarted Oswego in June 2026, but its free cash flow for the year was an outflow of $2.4 billion.
organizations: [Novelis, Hindalco Industries]
categories: [industry-developments, financial-results, global-business]
regions: [north-america]
industry: 'Aluminium rolling and recycling'
keyConcepts: [change]
date: '2026-05-19'
written: '2026-11-20'
checked: '2026-11-20'
figures:
  - value: $925 million
    label: Pre-tax losses related to the fires in the year to March 2026, net of insurance recoveries
    source: novelis-fy26
  - value: 98%
    label: The fall in net income attributable to Novelis's shareholder in the same year, to $15 million
    source: novelis-fy26
  - value: 145 kilotonnes
    label: Shipments Novelis estimates it lost to the Oswego interruptions that year
    source: novelis-fy26

background:
  - date: '2025-09-16'
    text: >-
      A fire broke out at Novelis's plant in Oswego, New York. No one was injured, and the damage was mainly in the hot
      mill area.
    sources: [novelis-q2-fy26]
  - date: '2025-11-04'
    text: >-
      Novelis said teams were working around the clock to restore operations while using alternative resources to limit
      disruption to customers, and that it expected to restart the hot mill in December 2025.
    sources: [novelis-q2-fy26]
  - date: '2025-11-20'
    text: >-
      A second significant fire broke out at the plant, in the area where repair work from the September fire was taking
      place. Everyone was evacuated safely, and both fires were contained to the hot mill area.
    sources: [novelis-fy26]

happened:
  - date: '2026-05-19'
    text: >-
      Novelis reported net income attributable to its shareholder of $15 million for the year to 31 March 2026, down 98%,
      mainly because of the Oswego fires, restructuring charges and unrealized derivative losses. Pre-tax losses related
      to the fires came to $925 million, net of insurance recoveries.
    sources: [novelis-fy26]
  - date: '2026-05-19'
    text: >-
      It estimated that the interruptions at Oswego reduced its shipments by 145 kilotonnes below expectations and its
      Adjusted EBITDA by $104 million. Net sales rose 7% to $18.4 billion, mainly because of higher aluminium prices,
      while rolled product shipments fell 5% to 3,557 kilotonnes.
    sources: [novelis-fy26]
  - date: '2026-05-19'
    text: >-
      Adjusted free cash flow was an outflow of $2.4 billion, against $737 million the year before, driven mainly by the
      fires and a 39% rise in capital expenditure to $2.3 billion, mostly for its new plant in Bay Minette, Alabama, where
      it began commissioning the cold mill in March. Its chief financial officer said Novelis expected to return to
      positive free cash flow by the end of the 2027 financial year.
    sources: [novelis-fy26]

since:
  - date: '2026-06-10'
    text: >-
      Novelis announced that the Oswego hot mill was back online. It said that during the outage it had used its global
      network of hot mills and finishing operations to keep supplying customers, and that it was speeding up the
      introduction of a standardized operating system across the company.
    sources: [novelis-restart]

context: |-
  Novelis describes itself as the world's largest recycler of aluminium and a leader in aluminium rolling, supplying the automotive, beverage packaging, aerospace and specialty industries. It is a subsidiary of Hindalco Industries, the metals flagship of India's Aditya Birla Group. When Oswego's hot mill stopped, the rest of the plant was undamaged, but Novelis's shipments fell, by its own estimate 145 kilotonnes below expectations over the year.

  The fires came while Novelis was investing heavily in new capacity in the United States, at Bay Minette in Alabama. The company therefore faced three demands at once: rebuilding Oswego, keeping customers supplied from elsewhere, and paying for a new plant. The context is a capital-intensive manufacturer hit by an operational crisis in the middle of an investment programme.

concepts:
  subtopics:
    - code: '5.7'
      note: Crisis management after the fires, from speed and communication to restart dates that moved, and contingency plans for supplying customers.
      level: HL
    - code: '5.4'
      note: Reorganizing production across a global network of plants to keep supplying customers while one site was out of action.
    - code: '3.7'
      note: Profit and cash flow diverge. A year with a small profit produced a large cash outflow, driven by the fires and capital expenditure.
    - code: '5.3'
      note: Quality assurance. A standardized operating system across plants, introduced to make supply dependable and quality consistent.
      level: HL
    - code: '1.6'
      note: An Indian multinational's subsidiary investing in a large new plant in the United States, its host country.
  terms: [crisis-management, contingency-planning, supply-chain, productive-capacity, cash-flow, capital-expenditure, investment, multinational-company, host-country, greenfield-investment, free-cash-flow]
  tools:
    - id: critical-path-analysis
      note: 'Plan the rebuilding of a hot mill as a project, and see why a delay on the critical path, such as a second fire, moves the restart date.'
  apply:
    - href: /finance-desk/lab/cash-flow-forecast/
      label: 'Cash flow forecast'
      note: 'Put a sudden loss of output and heavy spending on a new plant into a monthly forecast and watch the closing balance.'

choices:
  - option: Ask customers to wait for Oswego to restart
    analysis: >-
      Cheapest in the short run, but customers in automotive and packaging cannot stop their own production, and they
      might turn to other suppliers for good.
  - option: Supply customers from other plants and alternative sources while Oswego is rebuilt
    taken: true
    analysis: >-
      Novelis did this through its global network. It protects customer relationships but adds cost and complexity, and
      other plants have limited spare capacity.
  - option: Pause the new plant in Alabama to protect cash
    analysis: >-
      Would reduce the cash outflow, but delays capacity Novelis was building for future demand and wastes momentum in a
      project already being commissioned.
  - option: Keep building the new plant while rebuilding Oswego
    taken: true
    analysis: >-
      Keeps the long-term plan on track, but stretches finances: free cash flow was an outflow of $2.4 billion, and Novelis
      had to point investors to a return to positive free cash flow by the end of the 2027 financial year.

implications: |-
  The fires show how an operational disaster becomes a financial one. Net income fell 98%, and the gap between profit and cash was wider still: free cash flow was an outflow of $2.4 billion, because Novelis had to rebuild Oswego and pay for Bay Minette at the same time. This is [cash flow](/topics/cash-flow/) at its most practical: a business can report a profit and still need to borrow, and its lenders watch the cash. The restart date moved, from December 2025 to June 2026, after a second fire in the area being repaired, a reminder that recovery plans carry their own risks.

  For customers, the episode tested supply relationships; Novelis says it kept supplying them through its global network and thanks them for their flexibility. For Hindalco, the parent, a subsidiary's crisis in the United States became a group concern. For the industry, the case shows the risk of concentrating a critical stage of production in one large site.

lessons:
  - An operational crisis quickly becomes a financial one, through lost sales, repair costs and cash tied up in recovery.
  - Profit and cash flow can tell very different stories, especially when heavy investment coincides with a crisis.
  - A network of plants is a form of contingency planning. Spare capacity elsewhere helps protect customers when one site fails.
  - For managers, recovery plans need their own risk management, since restart work can create new hazards.

question:
  command: examine
  prompt: Examine how Novelis responded to the fires at its Oswego plant, using the factors of effective crisis management.
  level: HL

limits:
  - The causes of the fires are not stated in the sources read.
  - The sources do not name Novelis's customers or say how far their own production was affected.
  - Every figure is Novelis's own; the losses related to the fires are given net of insurance recoveries, and the full split was not examined here.


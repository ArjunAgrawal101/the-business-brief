  tools:
    - id: contribution
      note: Make or buy analysis compares the cost of making an input with the price of buying it in.

choices:
  - option: Buy all its chips from specialist suppliers
    analysis: >-
      No design costs and access to the market leader's products, but dependence on suppliers' prices, plans and
      capacity, and no hardware advantage over rivals who buy the same chips.
  - option: Design its own chips and offer nothing else
    analysis: >-
      The most control and the largest potential cost advantage, but every gap in its own range becomes a gap in its
      offer, and customers who want other chips go elsewhere.
  - option: Design its own chips and keep offering others
    taken: true
    analysis: >-
      Gains the benefit of its own designs where they are strongest while keeping customer choice and a fallback, at the
      cost of running two hardware strategies at once.
  - option: Partner with a chip designer instead of designing in-house
    analysis: >-
      Shares the cost and the risk, but shares the advantage too, and the partner may sell the same design to rivals.

lessons:
  - Research and development is a long game. Google's first TPU came a decade before the generation described here.
  - Make or buy turns on cost and on control. At enough scale, making an input can be both cheaper and a source of differentiation.
  - Treat a company's performance figures as claims. Independent tests are needed before products can be compared.
  - For managers, vertical integration is not all or nothing; a business can make some of an input and buy the rest.

question:
  command: discuss
  level: HL
  prompt: Using the concepts of cost to make and cost to buy, discuss why a cloud computing provider might design its own chips while continuing to offer chips made by other suppliers.

limits:
  - Every performance figure here is Google's own claim; no independent test was read for this item.
  - The pages give no figures for what Google spends on designing chips, or for how much of its computing runs on its own chips.
  - The November 2025 post said Ironwood would be generally available within weeks; the pages read do not give the exact date it became available.


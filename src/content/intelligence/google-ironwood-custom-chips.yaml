title: Google's own AI chips reach a seventh generation, then an eighth
dek: >-
  Google Cloud announced general availability for Ironwood, its seventh-generation TPU, in November 2025 and an
  eighth generation in April 2026, making the case for designing its own chips while still offering customers
  Nvidia's.
organizations: [Google]
categories: [innovation]
keyConcepts: [creativity, change]
date: '2025-11-06'
written: '2026-11-03'
checked: '2026-11-03'
figures:
  - value: 9,216
    label: Ironwood chips linked in one superpod
    source: ironwood
  - value: 10x
    label: Peak performance of Ironwood against TPU v5p, as Google claims
    source: ironwood
  - value: 80%
    label: Better inference performance per dollar for TPU 8i than the previous generation, as Google claims
    source: next26

happened:
  - date: '2025-11-06'
    text: >-
      Google Cloud announced that Ironwood, its seventh-generation Tensor Processing Unit (TPU), would be generally
      available in the coming weeks. Google said Ironwood offers ten times the peak performance of TPU v5p and more than
      four times the performance per chip of TPU v6e for both training and inference.
    sources: [ironwood]
  - date: '2025-11-06'
    text: >-
      Ironwood chips can be linked in a superpod of 9,216 chips sharing 1.77 petabytes of high-bandwidth memory, and
      superpods can be joined into clusters of hundreds of thousands of TPUs.
    sources: [ironwood]
  - date: '2025-11-06'
    text: >-
      Google said it built its first TPU ten years earlier, and that it designs its processors with model research,
      software and hardware development under one roof. It also announced virtual machines on its own Arm-based Axion
      processors, which it said offer up to twice the price-performance of comparable x86 machines.
    sources: [ironwood]
  - date: '2025-11-06'
    text: >-
      The announcement described a shift in demand from training AI models to running them for users, which Google
      called the age of inference, and said this creates new opportunities for custom chips.
    sources: [ironwood]

since:
  - date: '2026-04-22'
    text: >-
      At Next '26, Google Cloud said Ironwood and Axion were generally available and introduced eighth-generation TPUs:
      TPU 8t for training, which it said has three times the processing power of Ironwood, and TPU 8i for inference,
      which it said delivers 80% better performance per dollar than the previous generation.
    sources: [next26]
  - date: '2026-04-22'
    text: >-
      Google described its range of computing hardware as running from its own TPUs and Axion processors to the latest
      Nvidia GPUs, so that customers can choose the right architecture for each job.
    sources: [next26]

matters: |-
  Most businesses that need computing power buy their chips from specialist suppliers. Google has spent a decade designing its own: a long-term commitment to research and development, and a form of backward vertical integration, making an input it could buy. The case Google makes is that designing the chip together with the software and the models gives performance and cost that a part bought off the shelf cannot match. In the language of [production planning](/topics/production-planning/), Google is judging that, at its scale and counting performance, the cost to make these chips is below the cost to buy them.

  Each generation improves on the last, which is incremental innovation. The cumulative effect could be more disruptive if the cost of running AI models becomes the main basis of competition, as the shift to inference that Google describes suggests. Yet Google still offers Nvidia's chips beside its own. The decision is not all or nothing: it makes some of its chips, buys others, and lets customers choose.


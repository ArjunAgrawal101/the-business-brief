title: Saks Global files for Chapter 11 and emerges five months later as Exemplar Luxury Group
dek: >-
  The owner of Saks Fifth Avenue, Neiman Marcus and Bergdorf Goodman filed for Chapter 11 in January 2026 with $1.75
  billion of committed financing and a new chief executive. It closed most of its off-price stores and some full-price
  ones, won back its suppliers, and emerged in June under new ownership with its debt cut by nearly 75%.
organizations: [Saks Global, Exemplar Luxury Group]
categories: [business-failure, restructuring, corporate-strategy]
regions: [north-america]
industry: 'Luxury retail'
keyConcepts: [change]

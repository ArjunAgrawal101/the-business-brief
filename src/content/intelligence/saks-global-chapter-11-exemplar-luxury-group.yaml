written: '2026-11-20'
checked: '2026-11-20'
figures:
  - value: $1.75 billion
    label: Financing committed when Saks Global filed for Chapter 11
    source: saks-filing
  - value: Nearly 75%
    label: The reduction in the company's debt on leaving Chapter 11, under the plan the court approved
    source: saks-plan
  - value: More than 650
    label: Brands that had resumed shipping to Saks Global by April 2026
    source: saks-rsa

happened:
  - date: '2026-01-14'
    text: >-
      Saks Global, a luxury retailer whose businesses include Saks Fifth Avenue, Neiman Marcus, Bergdorf Goodman, Saks OFF
      5TH and Last Call, began voluntary Chapter 11 cases in the US Bankruptcy Court for the Southern District of Texas.
      It said its stores and websites remained open.
    sources: [saks-filing]
  - date: '2026-01-14'
    text: >-
      It had secured a financing commitment of about $1.75 billion: $1.5 billion from an ad hoc group of its senior
      secured bondholders, including $1 billion of debtor-in-possession financing and $500 million available when it left
      Chapter 11, and about $240 million of extra liquidity from its asset-based lenders.
    sources: [saks-filing]
  - date: '2026-01-14'
    text: >-
      Geoffroy van Raemdonck, chief executive of Neiman Marcus Group before Saks Global bought it in 2024, succeeded
      Richard Baker as chief executive. Saks Global asked the court for permission to honour customer programmes, pay
      vendors for future deliveries, and keep paying employees and their benefits.
    sources: [saks-filing]

since:
  - date: '2026-01-29'
    text: >-
      Saks Global said it would close most of its Saks OFF 5TH stores and all remaining Last Call stores, keep a few OFF
      5TH stores mainly to sell surplus stock from its full-price stores, stop buying merchandise for OFF 5TH, and wind
      down the separate OFF 5TH website.
    sources: [saks-focus]
  - date: '2026-02-10'
    text: >-
      In a first phase of store closures it named eight Saks Fifth Avenue stores and one Neiman Marcus store, chosen on
      performance and lease costs, closed most of its standalone Fifth Avenue Club styling suites and moved Horchow onto
      the Neiman Marcus website. Bergdorf Goodman's stores were unchanged.
    sources: [saks-actions]
  - date: '2026-04-02'
    text: >-
      Saks Global agreed a restructuring support agreement under which the bondholder group committed $500 million of
      financing for its exit from Chapter 11. It said more than 650 brands had resumed shipping, releasing $1.5 billion of
      merchandise, and that March inventory receipts were up 18% on a year earlier.
    sources: [saks-rsa]
  - date: '2026-06-05'
    text: >-
      The court approved Saks Global's plan of reorganization. The company said its debt would be cut by nearly 75% when it
      left Chapter 11, that it had reduced its corporate team, and that it aimed for $9 billion of gross merchandise value
      and a double-digit adjusted EBITDA margin by the 2030 financial year.
    sources: [saks-plan]
  - date: '2026-06-26'
    text: >-
      The company emerged from Chapter 11 under new ownership as Exemplar Luxury Group. Two investment firms that had
      backed it through the restructuring, Pentwater Capital Management and Bracebridge Capital, each took two seats on a
      seven-person board, alongside the chief executive and two independent directors.
    sources: [saks-emerge]

context: |-
  Saks Global brought together three of the best-known names in American luxury retailing, Saks Fifth Avenue, Neiman Marcus and Bergdorf Goodman, after buying Neiman Marcus Group in 2024. It also ran off-price stores, Saks OFF 5TH and Last Call, which sell luxury goods at a discount. A department store of this kind depends on the brands that supply it: if they stop shipping, the shelves empty and sales fall further.

  The company's releases describe the Chapter 11 filing as a way to support its transformation, and they do not explain what led to it. What they show is the shape of the rescue: new money from bondholders, a new chief executive from Neiman Marcus, an early retreat from discount selling, closure of weaker stores, and a deal that cut debt by nearly 75% and handed the business to new owners. The context is a business that was still trading and had valuable brands, but could not carry its debts as they stood.

concepts:
  subtopics:
    - code: '3.6'
      note: Insolvency versus bankruptcy. Chapter 11 lets an insolvent business keep trading while its debts are restructured, instead of being wound up.
      level: HL
    - code: '3.2'
      note: Loan capital at the centre of a rescue, from debtor-in-possession financing to exit financing from bondholders.
    - code: '4.5'
      note: 'Place and price: closing the off-price channel to concentrate on full-price selling, in stores and online.'
    - code: '1.4'
      note: Bondholders, brand partners, employees in closing stores and customers each had a different stake in the outcome.
    - code: '1.5'
      note: External growth by acquisition in 2024, followed within two years by a restructuring of the combined business.
  terms: [insolvency, bankruptcy, liquidation, loan-capital, creditors, liquidity, rationalization, distribution-channel, retailer, stakeholder-conflict, acquisition, workplace-closure]
  tools:
    - id: swot-analysis
      note: Set the strengths of three famous names and a large customer base against the weaknesses that brought the company to court.
  apply:
    - href: /finance-desk/lab/current-ratio/
      label: 'Current ratio'
      note: 'See how a business can be short of cash to pay what it owes in the short term, even with valuable assets, with figures of your own.'

choices:
  - option: Keep trading outside court and negotiate privately with lenders and suppliers
    analysis: >-
      Avoids the cost and publicity of bankruptcy, but without court protection creditors can act on their own, and if
      suppliers stop shipping the business can run out of stock and cash.
  - option: File for Chapter 11 with financing already committed by bondholders
    taken: true
    analysis: >-
      Gives court protection, new money and time to restructure, and the committed financing signalled to suppliers and
      customers that the business would keep trading. The price is control: the business ended up under new owners.
  - option: Sell one of the famous names to raise cash
    analysis: >-
      Could raise money quickly, but would break up the combination the company had just built. The sources show no such
      sale; Bergdorf Goodman's stores were left unchanged.
  - option: Shrink to the strongest part of the business by closing off-price and weaker full-price stores
    taken: true
    analysis: >-
      Concentrates money and management on full-price luxury selling, but means store closures and job losses, and
      gives up the revenue of the discount channel.

implications: |-
  Chapter 11 here worked as the course's distinction between [insolvency and bankruptcy](/topics/efficiency-ratio-analysis/) would suggest. A business unable to meet its debts was not wound up; it kept trading while a court supervised a deal with its creditors. The cost fell largely on creditors, whose claims had to shrink for debt to fall by nearly 75%, on the previous owners, who lost the business, and on the employees and communities of the stores that closed.

  For brand partners, the episode showed their power. The company's recovery depended on more than 650 brands agreeing to ship again; without stock, a department store has nothing to sell. For the luxury industry, the case raises a strategic question the company answers with confidence: whether multi-brand stores remain, in its words, the gateway to the US luxury consumer, or whether brands will sell more through their own stores and websites.

lessons:
  - Insolvency need not mean closure. A restructuring can keep a business with valuable brands trading while its debts are cut.
  - Liquidity, not only profit, decides survival. A business must be able to pay suppliers to keep receiving stock.
  - In a crisis, focus is a strategy. Saks Global closed its discount stores to concentrate on full-price luxury selling.
  - For managers, suppliers' confidence is an asset. Committed financing helped persuade brands to keep shipping.

question:
  command: explain
  prompt: Explain why a business might choose to restructure under Chapter 11 rather than close. Refer to Saks Global.
  level: HL

limits:
  - The company's releases do not explain what caused its financial difficulties, and the court filings were not read, so this item makes no claim about the causes.
  - All figures, from brand shipments to the reduction in debt, are the company's own and were not independently checked.
  - The sources do not say how many employees lost their jobs in the store closures and the reduction of the corporate team.


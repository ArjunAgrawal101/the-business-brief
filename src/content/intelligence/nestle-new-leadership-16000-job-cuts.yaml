title: Nestlé replaces its chief executive and its chair, then plans to cut about 16,000 jobs
dek: >-
  In September 2025 Nestlé's board dismissed its chief executive over an undisclosed relationship with a direct
  subordinate, and a new chair took over on 1 October. In October the new chief executive announced about 16,000 job
  cuts over two years, most of them white-collar roles, as Nestlé moves work into shared services and automates
  processes.
organizations: [Nestlé]
categories: [leadership, corporate-governance, restructuring]
regions: [europe, global]
industry: 'Food and drink'
keyConcepts: [change, ethics]
date: '2025-10-16'
written: '2026-11-20'
checked: '2026-11-20'
figures:
  - value: About 16,000
    label: Jobs Nestlé planned to cut worldwide over two years, announced in October 2025
    source: nestle-9m-2025
  - value: CHF 3.0 billion
    label: The cost savings target for the end of 2027, raised from CHF 2.5 billion
    source: nestle-9m-2025
  - value: 31.4%
    label: The fall in Nestlé's net profit in the first half of 2026, driven by restructuring costs and write-downs
    source: nestle-h1-2026

background:
  - date: '2025-09-01'
    text: >-
      Nestlé's board dismissed its chief executive, Laurent Freixe, with immediate effect, after an investigation into an
      undisclosed romantic relationship with a direct subordinate that breached Nestlé's Code of Business Conduct. The
      investigation was overseen by the chairman, Paul Bulcke, and the lead independent director, Pablo Isla, with
      independent outside counsel.
    sources: [nestle-ceo-change]
  - date: '2025-09-01'
    text: >-
      The board appointed Philipp Navratil, head of Nespresso since July 2024, as chief executive. He had joined Nestlé
      in 2001 as an internal auditor. The chairman said the board was not changing course on strategy, and Navratil
      referred to Pablo Isla as chairman-designate.
    sources: [nestle-ceo-change]
  - date: '2025-10-01'
    text: >-
      Pablo Isla succeeded Paul Bulcke as chair of Nestlé.
    sources: [nestle-governance-2025]

happened:
  - date: '2025-10-16'
    text: >-
      Nestlé announced a planned global reduction of about 16,000 jobs over the next two years, subject to consultation
      where applicable: about 12,000 white-collar professionals across functions and countries, and about 4,000 more in
      manufacturing and supply chain as part of productivity programmes.
    sources: [nestle-9m-2025]
  - date: '2025-10-16'
    text: >-
      It said the white-collar cuts, through greater use of shared services and automated processes, would bring annual
      savings of CHF 1.0 billion by the end of 2027, double the original plan of CHF 0.5 billion, with one-off
      restructuring costs expected at twice the annual savings. It raised the target for its Fuel for Growth savings
      programme to CHF 3.0 billion by the end of 2027, from CHF 2.5 billion.
    sources: [nestle-9m-2025]
  - date: '2025-10-16'
    text: >-
      Navratil said Nestlé needed to change faster, that this would include hard but necessary decisions to reduce
      headcount, and that it would act with respect and transparency. He described a culture that does not accept losing
      market share and rewards winning. For the first nine months of 2025 Nestlé reported organic sales growth of 3.3%,
      with real internal growth of 0.6% and pricing of 2.8%.
    sources: [nestle-9m-2025]

since:
  - date: '2026-02-19'
    text: >-
      Nestlé said it would focus its portfolio on four businesses, Coffee, Petcare, Nutrition and Food and Snacks, and
      merge its nutrition business with Nestlé Health Science. It reported that 20% of the targeted CHF 1 billion of
      white-collar savings had been achieved, ahead of plan, that it was simplifying its organizational structure, and
      that it had begun seeking partners for its waters business.
    sources: [nestle-fy-2025]
  - date: '2026-07-23'
    text: >-
      For the first half of 2026 Nestlé reported net profit down 31.4% to CHF 3.5 billion, driven by higher
      restructuring costs and a write-down of assets held for sale, and cumulative programme savings of CHF 1.7 billion.
      It announced a 50:50 joint venture for its waters and premium beverages business.
    sources: [nestle-h1-2026]
  - date: '2026-10-22'
    text: >-
      Nestlé reported organic growth of 3.7% for the first nine months of 2026, with real internal growth of 1.9%, rising
      to 2.8% in the third quarter.
    sources: [nestle-9m-2026]

context: |-
  Nestlé, whose brands include Nescafé, Nespresso and Purina, entered the autumn of 2025 with weak volume growth: real internal growth, the growth in what it sells rather than the prices it charges, was 0.6% in the first nine months of the year. In September the board removed the chief executive for breaching the company's own code of conduct, and the chairman handed over to his successor the next month.

  The new chief executive chose speed. Within weeks he raised the savings target and announced about 16,000 job cuts, most of them white-collar roles across functions and countries, alongside more investment in marketing and innovation. The context is a company changing leaders, governance and cost structure at the same time, while trying to grow volumes again.

concepts:
  subtopics:
    - code: '2.1'
      note: Human resource planning on a large scale, and the reasons employees resist change on this scale.
    - code: '2.3'
      note: A change of leader in a crisis of conduct, and a new leader who chooses speed and a performance focus.
    - code: '2.2'
      note: Shared services and a simplified structure concentrate work that each country or function once did for itself.
    - code: '2.5'
      note: A new chief executive setting out to change the culture, towards one that does not accept losing market share.
      level: HL
    - code: '3.3'
      note: White-collar roles are largely indirect costs. One-off restructuring costs come first; the savings recur later.
    - code: '1.4'
      note: Employees, shareholders and consumers are affected differently by cost cuts made to restore growth.
  terms: [redundancy, human-resource-planning, resistance-to-change, change-management, centralization, organizational-culture, leadership, indirect-cost, business-ethics, stakeholder-conflict, corporate-governance, succession-planning]
  tools:
    - id: force-field-analysis
      note: Weigh the forces driving the job cuts, from weak volume growth to the savings target, against those resisting them.
  frameworks:
    - id: lewin-change-model
      note: 'Read the plan as unfreezing, changing and refreezing, and ask what Nestlé must do so the new structure and culture last.'
  apply:
    - href: /people-and-culture/change-planner/
      label: 'Change management planner'
      note: 'Plan how a large company could consult, communicate and support staff through a restructuring of this size.'

choices:
  - option: Keep the chief executive and deal with the breach privately
    analysis: >-
      Avoids disruption at the top, but a code of conduct that does not apply to the chief executive loses its force for
      everyone else, and the risk to reputation grows if the matter emerges later.
  - option: Dismiss the chief executive and appoint an insider at once
    taken: true
    analysis: >-
      Shows that the rules apply at the top and gives continuity, since Navratil had run Nespresso and sat on the
      executive board. It loses time on strategy and asks a new leader to prove himself quickly.
  - option: Reduce costs gradually, through natural wastage and slower hiring
    analysis: >-
      Gentler on employees and less damaging to morale, but slow, and it would not deliver the savings Nestlé said it
      needed to invest in growth.
  - option: Cut about 16,000 roles over two years, mainly in white-collar functions, through shared services and automation
    taken: true
    analysis: >-
      Delivers large recurring savings and simplifies the organization, but the one-off costs come first, consultation
      takes time, and those who stay may lose trust in the company.

implications: |-
  The financial pattern is the one the course predicts for restructuring: costs first, savings later. Nestlé's net profit fell 31.4% in the first half of 2026, driven by restructuring costs and write-downs, while cumulative savings reached CHF 1.7 billion. Whether the plan works will show in volume growth, and real internal growth did improve, to 2.8% in the third quarter of 2026, though the sources do not say how much of that came from the cuts.

  For employees the implications are direct: about 16,000 jobs, subject to consultation, and a declared change of culture towards performance. Job cuts on this scale test [change management](/topics/introduction-to-human-resource-management/): how they are communicated, how fairly they are made, and how the people who stay are treated. For governance, the dismissal shows a board acting on its own code of conduct at the highest level. For strategy, the cuts sit alongside a narrower portfolio, with the waters business moving into a joint venture and other businesses held for sale.

lessons:
  - A code of conduct is credible only if it applies to the most senior people in the company.
  - Restructuring costs come before restructuring savings, so profit can fall before it recovers.
  - Large job cuts are a test of change management, for the people who stay as much as for those who leave.
  - For managers, a new leader's first decisions signal priorities. What is protected, such as investment in brands, matters as much as what is cut.

question:
  command: discuss
  prompt: Discuss the likely effects on Nestlé's employees and shareholders of its plan to cut about 16,000 jobs over two years.

limits:
  - Every figure is Nestlé's own. The views of its employees and their representatives are not represented in the sources read.
  - The sources do not say in which countries the jobs will go, or how many had gone by the time this item was checked.
  - The investigation into the former chief executive was not published; its findings are given as Nestlé stated them.


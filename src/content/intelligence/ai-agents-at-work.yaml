title: 'Microsoft''s research on AI agents at work: workers move faster than their organizations'
dek: >-
  Microsoft's Work Trend Index surveyed 31,000 knowledge workers in 2025 and 20,000 AI users in 2026. It reports a
  shift from AI assistants to AI agents, and links the benefits people report more closely to culture, manager support
  and talent practices than to individual mindset and behaviour.
organizations: [Microsoft]
categories: [global-trend]
keyConcepts: [change, ethics]
date: '2026-05-05'
written: '2026-11-03'
checked: '2026-11-03'
figures:
  - value: 31,000
    label: Knowledge workers surveyed in 31 markets for the 2025 report
    source: wti-2025
  - value: 67% and 32%
    label: Shares of reported AI impact linked to organizational and to individual factors, 2026
    source: wti-2026
  - value: 15x
    label: Growth in active agents in Microsoft 365 over a year, as Microsoft reports
    source: wti-2026

happened:
  - date: '2025-04-23'
    text: >-
      Microsoft's 2025 Work Trend Index drew on a survey of 31,000 workers in 31 countries, labour market data from
      LinkedIn and Microsoft 365 usage signals. It described a new kind of organization, which it called the Frontier
      Firm, built around teams of people and AI agents.
    sources: [wti-2025]
  - date: '2025-04-23'
    text: >-
      In that survey, 82% of leaders said it was a pivotal year to rethink strategy and operations, and 81% expected AI
      agents to be moderately or extensively part of their company's AI strategy within 12 to 18 months. 24% said their
      companies had deployed AI across the whole organization, and 12% were still at the pilot stage.
    sources: [wti-2025]
  - date: '2025-04-23'
    text: >-
      45% of leaders named expanding capacity with digital labour as a top priority, second only to upskilling existing
      staff at 47%, and 33% were considering reducing headcount. The report suggested that the traditional organization
      chart might give way to teams formed around goals rather than functions.
    sources: [wti-2025]
  - date: '2025-04-23'
    text: >-
      The 2025 survey was conducted online by Edelman Data x Intelligence between 6 February and 24 March 2025, with
      1,000 workers in each of the 31 markets.
    sources: [wti-2025]
  - date: '2026-05-05'
    text: >-
      The 2026 Work Trend Index surveyed 20,000 knowledge workers who use AI, in 10 countries, again through Edelman Data
      x Intelligence. It reported that organizational factors (culture, manager support and talent practices) accounted
      for more than twice the reported AI impact of individual factors, 67% against 32%, and stated that the relationship
      is a statistical association, not a causal effect.
    sources: [wti-2026]
  - date: '2026-05-05'
    text: >-
      Only 26% of the AI users surveyed said their leadership was clearly and consistently aligned on AI, and 13% said
      they were rewarded for redesigning work with AI even when the results fell short. Microsoft reported that the
      number of active agents in Microsoft 365 had grown fifteenfold in a year.
    sources: [wti-2026]

since:
  - date: '2026-10-14'
    text: >-
      In its annual report, Microsoft said it had introduced new ways of operating designed to follow the work rather
      than the organization chart, including cross-functional cohorts and squads.
    sources: [ms-ar26]

matters: |-
  A global trend matters to a business when it changes how work is organized, and Microsoft's research describes exactly that: AI moving from a tool that people use to agents that carry out tasks, with people directing and checking them. For human resource planning this raises the questions in [introduction to human resource management](/topics/introduction-to-human-resource-management/): which jobs change, which skills to train, whether to cut headcount, and how to handle resistance to change. For structure, it points towards flatter teams formed around projects and goals, which Microsoft says it has begun to use itself.

  The 2026 finding is the most useful for managers. The benefits people report are linked more to culture, manager support and talent practices than to individual mindset and behaviour; if that holds, adopting AI is a problem of change management, not a purchase. But the evidence needs evaluating as well as reading. Microsoft sells AI agents, so it has an interest in the trend. The 2026 survey asked only people who already use AI. The answers are self-reported. And Microsoft itself says its main result is an association, not proof of cause. That is a model of honest reporting, and also a reason for care.

concepts:
  subtopics:
    - code: '2.1'
      note: Human resource planning, reasons for resistance to change, and strategies to reduce its impact.
    - code: '2.2'
      note: Project-based organization and teams formed around goals rather than functions.
      level: HL
    - code: '2.5'
      note: Organizational culture as the factor most closely linked to the benefits people report.
      level: HL
    - code: '4.4'
      note: Evaluating secondary research; who ran the survey, who was asked, and who paid for it.
    - code: '5.9'
      note: Artificial intelligence and big data, and the ethics of using data about how employees work.
      level: HL
  terms: [human-resource-planning, resistance-to-change, change-management, project-based-organization, flat-structure, organizational-culture, secondary-research, sampling, research-bias, artificial-intelligence, employee-monitoring, redundancy]
  tools:
    - id: force-field-analysis
      note: Weigh the forces driving and restraining a move to AI agents in one organization.
    - id: steeple-analysis
      note: Technological and social change in the external environment, and the ethical questions it brings.

choices:
  - option: Wait until the technology matures
    analysis: >-
      Avoids early mistakes and costs, but the 2026 report argues that firms which learn early pull ahead, and staff may
      adopt tools anyway without rules to guide them.
  - option: Run small pilots in a few teams
    analysis: >-
      Low risk and good evidence, but pilots alone can leave culture, management and talent practices unchanged, and
      those are what the 2026 report links most closely to results.
  - option: Redesign work across the whole organization
    analysis: >-
      Captures the largest gains if it works, but is the hardest change to manage and the most exposed to resistance and
      to fears about jobs.
  - option: Invest first in managers, training and incentives
    analysis: >-
      Follows the 2026 finding that organizational factors matter most, but takes time and money before results show.

lessons:
  - Technology changes outcomes only when the organization changes with it, in its culture, its managers and the way it develops and rewards people.
  - Read research for who produced it and who was asked. A supplier's survey of its users can be useful evidence without being neutral evidence.
  - An association is not a cause. The report says so itself, and so should anyone who uses its figures.
  - For managers, decide what people will stop doing, not only what AI will start doing.

question:
  command: examine
  prompt: With reference to the Work Trend Index findings, examine the human resource challenges a business faces when it introduces AI agents into its workforce.

limits:
  - Both reports are published by Microsoft, which sells the AI products they discuss.
  - The 2026 survey included only workers who already use AI, so it cannot show the views of those who do not.
  - The answers are self-reported, and the 2026 report gives two different end dates for its fieldwork, 7 April 2026 in its methodology and 20 April 2026 beside its charts.


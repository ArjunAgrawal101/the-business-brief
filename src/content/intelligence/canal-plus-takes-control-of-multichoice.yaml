title: Canal+ completes its takeover of MultiChoice and starts turning around the African pay-TV group
dek: >-
  France's Canal+ took control of South Africa's MultiChoice in September 2025, the largest deal in its history, after
  agreeing that MultiChoice's broadcasting licence would stay under South African control. By March 2026 it was closing
  the Showmax streaming service, offering voluntary severance in support functions and hiring more than 1,000
  salespeople.
organizations: [Canal+, MultiChoice Group]
categories: [mergers-and-acquisitions, global-business]
regions: [africa, europe]
industry: 'Pay television and streaming'
keyConcepts: [change, ethics]
date: '2025-09-22'
written: '2026-11-20'
checked: '2026-11-20'
figures:
  - value: ZAR125.00
    label: Canal+'s cash offer for each MultiChoice share it did not already own
    source: canal-implementation
  - value: 94.39%
    label: Canal+'s holding of MultiChoice's shares once the offer closed, before it bought out the rest
    source: canal-offer-results
  - value: More than €250 million
    label: Cost savings from combining the two businesses that Canal+ expects in 2026
    source: canal-fy25

background:
  - date: '2024-06-04'
    text: >-
      Canal+ and MultiChoice published a combined circular setting out a mandatory offer by Canal+ of ZAR125.00 a share
      in cash for the MultiChoice shares it did not already own.
    sources: [canal-implementation]

happened:
  - date: '2025-09-22'
    text: >-
      The offer became unconditional. Canal+ directly owned 46.0% of MultiChoice's shares, and acceptances for a further
      2.2% had already been tendered, which the two companies said gave Canal+ effective control. They described it as
      the largest transaction Canal+ had ever undertaken.
    sources: [canal-implementation]
  - date: '2025-09-22'
    text: >-
      To meet an order of the South African Competition Tribunal and the limits on foreign ownership and control of
      broadcasters in South Africa's Electronic Communications Act, MultiChoice had been reorganized so that MultiChoice
      Proprietary Limited, which holds the broadcasting licence, had its own shareholders, governance and South African
      control structure.
    sources: [canal-implementation]
  - date: '2025-09-22'
    text: >-
      The companies said Canal+ had committed to public interest measures in South Africa, including support for firms
      controlled by historically disadvantaged persons and for small, micro and medium enterprises in the audio-visual
      sector, and continued funding for local entertainment and sports content.
    sources: [canal-implementation]
  - date: '2025-09-22'
    text: >-
      They said the combined group would serve more than 40 million subscribers in close to 70 countries in Africa,
      Europe and Asia. MultiChoice's board was reconstituted with Canal+'s chief executive, Maxime Saada, as chair and a
      majority of independent directors, and MultiChoice's outgoing chief executive, Calvo Mawela, was to chair Canal+'s
      African operations.
    sources: [canal-implementation]
  - date: '2025-10-13'
    text: >-
      The offer closed on 10 October 2025, accepted for about 92.54% of the shares it covered, which took Canal+'s
      holding to about 94.39%. Canal+ said it would compulsorily acquire the remaining shares and, as it had committed to
      the South African competition authorities, seek a secondary listing of its own shares in Johannesburg.
    sources: [canal-offer-results, multichoice-offer-results]

since:
  - date: '2025-12-08'
    text: >-
      Canal+ said it had completed the compulsory acquisition of the remaining MultiChoice shares on 5 December 2025, and
      that MultiChoice's shares would be removed from the Johannesburg Stock Exchange and A2X from 10 December 2025.
    sources: [canal-delisting]
  - date: '2026-03-11'
    text: >-
      In its 2025 results, Canal+ said MultiChoice had faced difficulties since 2023 from currency devaluation in
      Nigeria, power cuts, a difficult move to streaming with the expensive failure of Showmax, and strong cost
      inflation, and that cutting subscriber subsidies and raising prices had shrunk its subscriber base.
    sources: [canal-fy25]
  - date: '2026-03-11'
    text: >-
      Canal+ set out a turnaround: discontinuing Showmax, a €100 million boost plan, recruiting more than 1,000
      salespeople across MultiChoice's markets, a voluntary severance plan in MultiChoice's support functions and a
      restructuring of Irdeto, its technology and cyber-security company. It expected more than €250 million of cost
      savings from combining the businesses in 2026, and Adjusted EBIT of around €170 million at MultiChoice, against
      €159 million in 2025.
    sources: [canal-fy25]
  - date: '2026-05-12'
    text: >-
      The Johannesburg Stock Exchange approved a secondary listing of Canal+, to start trading on 3 June 2026, while
      Canal+ kept its listing in London.
    sources: [canal-jse]

context: |-
  MultiChoice, which owns DStv, GOtv and SuperSport, is described by Canal+ as the leading pay-TV operator in English- and Portuguese-speaking Africa. Canal+, founded as a French subscription channel, already operated in French-speaking Africa. The deal joined the two and gave Canal+ what it calls critical scale, more than 40 million subscribers, at a time when, by Canal+'s account, MultiChoice's profits were being squeezed by weak currencies, power cuts, rising content costs and an expensive streaming venture.

  Buying a South African broadcaster brought conditions with it. South African law limits foreign ownership and control of broadcasting licensees, so the licence-holding company was given its own South African control structure. The deal came with public interest commitments, and the competition authorities' approval with a promise that Canal+ would list in Johannesburg, so that South African investors could still own a share of the business. The context is a multinational buying a struggling business in a host country that set the terms of entry.

concepts:
  subtopics:
    - code: '1.5'
      note: External growth by takeover, from a mandatory offer to a compulsory purchase of the last shares, in pursuit of scale and cost savings.
    - code: '1.6'
      note: The impact of a multinational on a host country, and the conditions a host country can attach to foreign ownership.
    - code: '1.2'
      note: A publicly held company leaves the stock exchange and becomes a wholly owned subsidiary, while its new owner lists in the same country.
    - code: '2.1'
      note: Human resource planning in a turnaround, cutting support roles while recruiting more than 1,000 salespeople.
    - code: '4.5'
      note: 'Price and product: price rises and lower equipment subsidies cost MultiChoice subscribers, and its streaming product was closed.'
  terms: [takeover, acquisition, synergy, economies-of-scale, multinational-company, host-country, publicly-held-company, wholly-owned-subsidiary, human-resource-planning, rationalization, exchange-rate, churn-rate]
  tools:
    - id: steeple-analysis
      note: The political and legal limits on foreign ownership, and the economic shocks, from currency devaluation to power cuts, that hurt MultiChoice.
  apply:
    - href: /people-and-culture/workforce-planning/
      label: 'Workforce planning tool'
      note: 'Plan a workforce that shrinks in support functions while it grows in sales, and see what the change asks of recruitment and training.'

choices:
  - option: Run MultiChoice at arm's length, much as before
    analysis: >-
      Lowest integration risk and least disruption for staff and partners, but it captures few savings and leaves
      MultiChoice's decline in subscribers and profits unaddressed.
  - option: Cut costs across the whole business as fast as possible
    analysis: >-
      Delivers savings quickly, but a business losing subscribers cannot cut its way back to growth, and deep cuts in a
      host country that set public interest conditions carry reputational and regulatory risk.
  - option: Close loss-making activities and cut support costs, while investing in sales and subscriber growth
    taken: true
    analysis: >-
      Closing Showmax and offering voluntary severance in support functions pays for a €100 million boost plan and
      more than 1,000 salespeople. It is harder to manage than either extreme, and depends on cheaper entry offers
      bringing subscribers back.

implications: |-
  The acquisition's value now rests on the turnaround. Canal+ expects MultiChoice's Adjusted EBIT to rise from €159 million in 2025 to around €170 million in 2026, helped by more than €250 million of savings across the group, and it warns that the turnaround will take time. For MultiChoice's employees the plan cuts both ways: voluntary severance in support functions and the restructuring of Irdeto, alongside recruitment of more than 1,000 salespeople. For customers, Canal+ promised no change to subscriptions and billing at completion, and its plan is to win subscribers back with cheaper entry.

  For South Africa, the deal shows how a host country can shape a foreign takeover rather than simply allow or block it: local control of the licence, public interest commitments and a Johannesburg listing that keeps the business within reach of local investors. The [multinational companies](/topics/multinational-companies-mncs/) brief sets out the benefits and costs MNCs bring to host countries; this case adds the bargaining that decides which of them a country gets.

lessons:
  - A host country can set conditions on a foreign takeover, from who controls a licence to where the buyer's shares are listed.
  - Buying a business in decline means buying its problems. The price of control includes the cost and risk of the turnaround.
  - Raising prices protects revenue per customer in the short run but can lose customers, as MultiChoice found.
  - For managers, human resource planning can mean cutting some roles and recruiting for others at the same time.

question:
  command: examine
  prompt: Examine the conditions attached to Canal+'s acquisition of MultiChoice, and how they affect Canal+'s ability to turn the business around.

limits:
  - Every figure and forecast is the companies' own. Canal+'s expectations for 2026 are forecasts, not results.
  - The South African Competition Tribunal's order and the full conditions were not read; they are described here as the companies reported them.
  - The views of MultiChoice's employees, their representatives and its customers are not represented in the sources read.


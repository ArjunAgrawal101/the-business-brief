title: Microsoft and OpenAI rewrite their partnership as OpenAI restructures
dek: >-
  In October 2025 OpenAI formed a public benefit corporation and recapitalized, and Microsoft signed a new agreement
  with it. Microsoft's annual report shows a stake of about a quarter, $24.1 billion of revenue from OpenAI in a year,
  and a strategy in which, it says, models become interchangeable.
organizations: [Microsoft, OpenAI]
categories: [restructuring, corporate-strategy]
keyConcepts: [change, ethics]
date: '2025-10'
written: '2026-11-03'
checked: '2026-11-03'
figures:
  - value: About 25%
    label: Microsoft's interest in OpenAI, on an as-converted basis
    source: ms-ar26
  - value: $24.1 billion
    label: Microsoft's revenue from commercial arrangements with OpenAI in fiscal 2026
    source: ms-ar26
  - value: $6.5 billion
    label: Net gains from investments in OpenAI in Microsoft's other income, fiscal 2026
    source: ms-ar26

happened:
  - date: '2025-10'
    text: >-
      Microsoft signed a new definitive agreement with OpenAI that extends the strategic partnership the two companies
      first established in 2019.
    sources: [ms-ar26]
  - date: '2025-10'
    text: In the same month, OpenAI formed a public benefit corporation and completed a recapitalization.
    sources: [ms-ar26]
  - date: '2026-06-30'
    text: >-
      In its annual report for the year to 30 June 2026, Microsoft said it accounts for its investment in OpenAI by the
      equity method, and that the investment represents an interest of about 25% on an as-converted basis.
    sources: [ms-ar26]
  - date: '2026-06-30'
    text: >-
      Microsoft recorded $24.1 billion of revenue from commercial arrangements with OpenAI in fiscal 2026, including
      revenue-sharing payments. It had made funding commitments of $13.0 billion to its investment, of which $11.9
      billion had been funded by 30 June 2026.
    sources: [ms-ar26]
  - date: '2026-06-30'
    text: >-
      Microsoft's share of OpenAI fell during the year because of the recapitalization and other funding, and it recorded
      dilution gains. Its other income included $6.5 billion of net gains from investments in OpenAI in fiscal 2026,
      after $4.8 billion of net losses in fiscal 2025.
    sources: [ms-ar26]
  - date: '2026-06-30'
    text: >-
      Microsoft says it will continue to receive revenue-sharing payments and holds rights to OpenAI's intellectual
      property, including models and infrastructure, for use in its own products. It extended the partnership again in
      April 2026.
    sources: [ms-ar26]

since:
  - date: '2026-10-14'
    text: >-
      In his shareholder letter, Satya Nadella reported fiscal 2026 revenue of $331.8 billion, up 18%, and operating
      income of $155.2 billion, up 21%.
    sources: [ms-ar26]
  - date: '2026-10-14'
    text: >-
      The letter described a system in which the model is kept separate from the rest of the product, so that models
      become interchangeable. Microsoft offers more than 11,000 models from several developers, including OpenAI,
      alongside its own MAI family, to which it added more than a dozen new models in the year.
    sources: [ms-ar26]

matters: |-
  Two developments sit together here. The first is a restructuring. OpenAI, Microsoft's partner since 2019, formed a public benefit corporation and recapitalized, changing its structure and its ownership. In US company law a public benefit corporation is a for-profit company whose directors must weigh a stated public benefit alongside the interests of shareholders, which makes it a relative of the for-profit social enterprises in [types of business entities](/topics/types-of-business-entities/). A change of legal form changes whose interests the directors must consider, and so changes what partners and investors can expect.

  The second is a strategic alliance changing shape. Microsoft holds a large minority stake, earns a large revenue stream from OpenAI and has rights to its technology, but it does not control it, and its share fell as new money came in. Its own report describes a strategy of making models interchangeable inside its products and building its own, so that no single supplier becomes indispensable. Holding a stake in a vital partner while preparing to work without it is a hedge, and a measure of how much the relationship matters to both sides.

concepts:
  subtopics:
    - code: '1.2'
      note: For-profit companies with a social purpose; a public benefit corporation must weigh a stated public benefit alongside profit.
    - code: '1.5'
      note: Strategic alliances and minority stakes as a form of external growth without control.
    - code: '1.4'
      note: Shareholders, partners and the public benefit a company commits to can pull in different directions.
    - code: '3.2'
      note: New share capital dilutes existing owners, as Microsoft's falling share of OpenAI shows.
    - code: '5.8'
      note: Rights to a partner's intellectual property as a substitute for, and a complement to, research done in-house.
      level: HL
  terms: [strategic-alliance, joint-venture, for-profit-social-enterprise, social-enterprise, shareholder, stakeholder-conflict, intellectual-property, share-capital, revenue-stream, synergy]
  tools:
    - id: swot-analysis
      note: Set out what the partnership gives Microsoft and what it exposes Microsoft to.

choices:
  - option: Keep the original arrangement unchanged
    analysis: >-
      Avoids renegotiation, but a partner that is changing its structure and raising new money will want new terms, and
      resisting them can sour the relationship that gives the alliance its value.
  - option: Agree new terms and keep a large minority stake
    taken: true
    analysis: >-
      Keeps access to the technology, a revenue stream and a share of the value created, at the cost of less control
      and a shrinking share whenever the partner raises more money.
  - option: Seek full control of the partner
    analysis: >-
      Would end the dependence on terms set by others, but at very great cost, with the partner's stated purpose to
      respect, approvals to obtain and the people who make the partnership valuable at risk of leaving.
  - option: Build its own models and offer many developers' models
    taken: true
    analysis: >-
      Reduces dependence on a single supplier and gives customers choice, but costs heavily in research and computing,
      and puts Microsoft partly in competition with its partner.

lessons:
  - Alliances are agreements between organizations whose interests change. Terms set in 2019 were rewritten when one side restructured.
  - A minority stake gives influence and a share of the value, not control. Watch what happens to the share when new investors arrive.
  - Legal form matters. A company's structure tells its stakeholders whose interests its directors must weigh.
  - For managers, when one supplier provides something critical, plan for the day its terms change.

question:
  command: discuss
  prompt: Discuss whether a minority stake and a commercial agreement give a large company enough influence over a partner that supplies a critical technology.

limits:
  - Microsoft's annual report does not set out the full terms of the October 2025 agreement or say what changed in April 2026.
  - OpenAI's own documents were not read for this item, so its new structure is described only as far as Microsoft reports it, as the formation of a public benefit corporation and a recapitalization.
  - The report does not say who controls OpenAI, what public benefit it has stated, or what Microsoft's stake is worth.


title: Oracle replaces one chief executive with two
dek: >-
  Oracle promoted the presidents of its cloud infrastructure and industry applications businesses to share the role
  of chief executive, while Safra Catz, chief executive since 2014, became Executive Vice Chair of the board.
organizations: [Oracle]
categories: [leadership]
keyConcepts: [change]
date: '2025-09-22'
written: '2026-11-03'
checked: '2026-11-03'

happened:
  - date: '2025-09-22'
    text: >-
      Oracle announced the promotion of Clay Magouyrk and Mike Sicilia to the role of chief executive officer, naming two
      chief executives at once.
    sources: [oracle-ceos]
  - date: '2025-09-22'
    text: >-
      Magouyrk had been President of Oracle Cloud Infrastructure, having joined Oracle from Amazon Web Services in 2014.
      Sicilia had been President of Oracle Industries, and had joined Oracle through its acquisition of Primavera
      Systems.
    sources: [oracle-ceos]
  - date: '2025-09-22'
    text: >-
      Safra Catz, chief executive since 2014, was appointed Executive Vice Chair of the board. Larry Ellison was described
      in the announcement as Chairman of the Board and Chief Technology Officer.
    sources: [oracle-ceos]
  - date: '2025-09-22'
    text: >-
      Oracle said the two chief executives would continue to work together on building complete suites of AI
      applications for particular industries on its database and cloud infrastructure. In the announcement, Catz
      described the company as at a point of strength and said it was the right moment to hand the role to the next
      generation.
    sources: [oracle-ceos]
  - date: '2025-09-22'
    text: >-
      Oracle also promoted Mark Hura to President, Global Field Operations, and Doug Kehring to Principal Financial
      Officer, and reaffirmed the financial guidance it had given on 9 September 2025.
    sources: [oracle-ceos]

since:
  - date: '2026-11-03'
    asAt: true
    text: >-
      Oracle's executive leadership page listed Magouyrk and Sicilia each as Chief Executive Officer, Ellison as Chairman
      of the Board and Chief Technology Officer, Hilary Maxson as Chief Financial Officer, and Kehring as Executive Vice
      President and Head of Operations.
    sources: [oracle-executives]
  - date: '2026-11-03'
    asAt: true
    text: >-
      Oracle's board page listed Catz and Jeffrey O. Henley as Executive Vice Chairs of the board, and both chief
      executives as directors.
    sources: [oracle-board]

matters: |-
  A change of chief executive is the most visible decision a board makes about leadership, and Oracle's version is unusual: two people in one role, each drawn from one of the company's growth businesses. The choice reads as a statement of strategy. Magouyrk ran the cloud infrastructure and Sicilia the industry applications, and Oracle's stated plan is to build applications on that infrastructure; putting both at the top ties leadership to the two halves of the plan, and keeps both leaders in the company.

  Shared leadership also raises the questions the course asks about [organizational structure](/topics/organizational-structure/): who holds final authority, how decisions are divided, and how disagreement is settled. With the chairman also serving as chief technology officer, and the former chief executive still an executive vice chair, authority at the top is spread more widely than a single title suggests. For employees, investors and customers, the test is whether the two leaders send one clear message.

concepts:
  subtopics:
    - code: '2.3'
      note: Management and leadership at the top of the business, and leaders chosen for the businesses they built.
    - code: '2.2'
      note: The chain of command, and the division of authority when one role is shared.
    - code: '2.5'
      note: Cultural change when leadership changes, and the risk that two leaders send different signals.
      level: HL
    - code: '1.4'
      note: How shareholders, employees and customers read a change at the top.
  terms: [leadership, management, chain-of-command, organizational-structure, delegation, culture-clash, stakeholder, publicly-held-company]
  tools:
    - id: force-field-analysis
      note: Weigh the forces driving the change to shared leadership against those restraining it.

choices:
  - option: Promote a single chief executive from inside
    analysis: >-
      Gives clear accountability and a leader who knows the business, but one business's head rises above the other's,
      and the one passed over may leave.
  - option: Recruit a chief executive from outside
    analysis: >-
      Brings a fresh view and signals change, but a newcomer needs time to learn the business and its culture at a moment
      of very rapid growth.
  - option: Appoint two chief executives with divided responsibilities
    taken: true
    analysis: >-
      Keeps both leaders and matches the top of the company to its two growth businesses, but depends on the two agreeing,
      and on clear rules for when they do not.
  - option: Keep the outgoing chief executive and name a successor for later
    analysis: >-
      Offers continuity and a longer handover, but delays the change and can leave the successor waiting without real
      authority.

lessons:
  - A leadership change is a strategic decision. Who is chosen tells employees and investors what the board thinks matters next.
  - Shared roles need explicit rules about which decisions each person owns and how disagreements are resolved.
  - Promoting from inside rewards the people who built the businesses a company is betting on, and works best when they have been prepared for the role.
  - For managers, titles can mislead. With a chairman, two executive vice chairs and two chief executives, the real distribution of authority needs careful reading.

question:
  command: to-what-extent
  prompt: To what extent is appointing two chief executives an effective way to lead a large business through rapid change?

limits:
  - The announcement does not say how responsibilities are divided between the two chief executives, how disagreements are to be resolved, or how they are paid.
  - The leadership pages read on 3 November 2026 do not say when Hilary Maxson was appointed Chief Financial Officer.
  - The account is Oracle's own; no independent report was read for this item.


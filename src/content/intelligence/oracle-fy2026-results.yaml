title: Oracle's record year leaves free cash flow at minus $23.7 billion
dek: >-
  Oracle's results for fiscal 2026 combined record revenue, earnings per share and operating cash flow with heavily
  negative free cash flow, as the company borrowed and sold new shares to build data centres for its AI customers.
organizations: [Oracle]
categories: [financial-results, corporate-strategy]
keyConcepts: [change]
date: '2026-06-10'
written: '2026-11-03'
checked: '2026-11-03'
lead: true
figures:
  - value: $32.0 billion
    label: Operating cash flow in fiscal 2026, a record
    source: oracle-fy26
  - value: −$23.7 billion
    label: Free cash flow in fiscal 2026
    source: oracle-fy26
  - value: $638 billion
    label: Remaining performance obligations at the end of the year
    source: oracle-fy26

happened:
  - date: '2026-06-10'
    text: >-
      Oracle reported total revenues of $67.4 billion for its fiscal year 2026, up 17%. Cloud revenues rose 39% to
      $34.0 billion, within which cloud infrastructure revenue rose 77% to $18.1 billion, while software revenues fell 1%
      to $24.5 billion.
    sources: [oracle-fy26]
  - date: '2026-06-10'
    text: >-
      GAAP operating income for the year was $20.6 billion, up 17%, and GAAP net income available to common shareholders
      was $17.0 billion, up 36%.
    sources: [oracle-fy26]
  - date: '2026-06-10'
    text: >-
      Operating cash flow was a record $32.0 billion, up 54%. Free cash flow was negative $23.7 billion, which Oracle put
      down to its continuing investment in the growth of its cloud infrastructure business.
    sources: [oracle-fy26]
  - date: '2026-06-10'
    text: >-
      Remaining performance obligations stood at $638 billion at the end of the year, up 363% on a year earlier. Oracle
      said most of the increase in its third and fourth quarters came from large AI contracts in which the customer
      prepaid for the graphics processors or supplied them itself, that these portions now totalled $75 billion, and that
      this substantially reduced the capital it had to raise.
    sources: [oracle-fy26]
  - date: '2026-06-10'
    text: >-
      In fiscal 2026 Oracle raised $43 billion in debt financing and $5 billion in equity financing. For fiscal 2027 it
      expected to raise about $40 billion through debt and equity, including a previously announced $20 billion
      at-the-market share issue, and said it did not expect to issue more debt in calendar year 2026.
    sources: [oracle-fy26]
  - date: '2026-06-10'
    text: >-
      The board declared a quarterly dividend of $0.50 a share, and Oracle confirmed its guidance of $90 billion of total
      revenue for fiscal 2027.
    sources: [oracle-fy26]

since:
  - date: '2026-09-10'
    text: >-
      For the first quarter of fiscal 2027, Oracle reported revenues up 30% to $19.3 billion, a record first-quarter
      operating cash flow of $23 billion, up 184%, and free cash flow of negative $5 billion.
    sources: [oracle-q1fy27]
  - date: '2026-09-10'
    text: >-
      Remaining performance obligations reached $664 billion. Oracle said it had completed the sale of $20 billion of
      common stock through an at-the-market programme during the quarter, and that it had delivered 850 MW of additional
      data centre capacity.
    sources: [oracle-q1fy27]

matters: |-
  Oracle's year is a clear case of a point the course makes in [cash flow](/topics/cash-flow/): profit and cash are different things, and investment sits between them. The statement of profit or loss spreads the cost of a building or a server over its useful life through depreciation, so profit can rise in a year when the cash spent on new data centres is far larger than the cash the business brings in. Free cash flow, usually defined as operating cash flow minus capital expenditure, shows that gap; Oracle's figure says the gap was wide.

  The results also show a business choosing its mix of finance in public. Borrowing keeps ownership with existing shareholders but adds interest and raises gearing; selling new shares avoids interest but gives each existing shareholder a smaller slice of future profits. Oracle used both, and some of its customers prepaid for processors or supplied their own, which moves part of the financing onto the customer. The very large order book, reported as remaining performance obligations, is the context for all of this. It is a promise of future revenue, not revenue earned and not cash in the bank.

concepts:
  subtopics:
    - code: '3.7'
      note: The difference between profit and cash flow, and the relationship between investment, profit and cash flow.
    - code: '3.2'
      note: Loan capital and share capital, used side by side, and when each suits a long-term investment.
    - code: '3.4'
      note: Depreciation spreads the cost of an asset over its life, which is why profit and cash diverge.
      level: HL
    - code: '3.6'
      note: The gearing ratio, which heavy borrowing for investment pushes up.
      level: HL
    - code: '1.5'
      note: Internal growth on a very large scale, paid for with external finance.
  terms: [cash-flow, profit, capital-expenditure, investment, depreciation, loan-capital, share-capital, gearing-ratio, dividend, revenue-stream]
  tools: []

choices:
  - option: Grow only as fast as the business's own cash allows
    analysis: >-
      Keeps borrowing, dilution and risk low and protects liquidity, but contracted demand that cannot be served is
      revenue forgone, and customers may turn to competitors who can build faster.
  - option: Finance the build-out mainly by borrowing
    analysis: >-
      Existing shareholders keep their share of future profits, but interest payments and repayments become fixed
      commitments, and gearing rises just as the business takes on more risk.
  - option: Finance it mainly by selling new shares
    analysis: >-
      No interest and no repayment date, but existing shareholders own a smaller part of the business, and a large issue
      can weigh on the share price.
  - option: Use a mix of debt and new shares
    taken: true
    analysis: >-
      Spreads the burden between lenders and shareholders and keeps either measure from becoming extreme, at the cost of
      both interest and dilution.
  - option: Ask customers to carry part of the cost
    taken: true
    analysis: >-
      Prepayments and customer-supplied processors reduce the capital needed, as Oracle reports, but they depend on
      customers with the cash and the bargaining power to agree, and those customers may expect better terms in return.

lessons:
  - Profit, operating cash flow and free cash flow answer different questions. A business can be strong on the first two and still need outside finance because of the third.
  - A choice of finance is a choice about risk and about who carries it, whether lenders, existing shareholders or customers.
  - An order book is not revenue. Contracted work becomes revenue when it is delivered, and cash only when the customer pays.
  - For managers, when growth requires investment ahead of revenue, the timing of cash, not the size of profit, sets the limit on how fast the business can go.

question:
  command: evaluate
  prompt: Evaluate Oracle's decision to finance its data centre investment through a combination of borrowing, new shares and customer prepayments.

limits:
  - The release text read for this item gives operating cash flow and free cash flow, but not the cash flow statement or a figure for capital expenditure, so the size of Oracle's spending is not stated here.
  - Neither release read for this item says when the remaining performance obligations will become revenue, or how much of them comes from a few large customers.
  - Every figure is Oracle's own, from its press releases; its filings with the regulator were not read for this item.


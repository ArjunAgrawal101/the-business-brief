title: Diageo's Indian subsidiary agrees to sell Royal Challengers Bengaluru for INR 166.6 billion as Diageo cuts its debt
dek: >-
  United Spirits agreed in March 2026 to sell the company that owns the Royal Challengers Bengaluru cricket franchises to
  a consortium led by Indian and American investors. Its parent, Diageo, is also selling its East African brewing
  business to Japan's Asahi, as it tries to bring its borrowing back within its target range.
organizations: [Diageo, United Spirits]
categories: [corporate-strategy, financial-results]
regions: [asia, africa, europe]
industry: 'Alcoholic drinks and professional sport'
keyConcepts: [change]
date: '2026-03-24'
written: '2026-11-20'
checked: '2026-11-20'
figures:
  - value: INR 166.6 billion
    label: The total price agreed for Royal Challengers Sports, owner of the Royal Challengers Bengaluru franchises
    source: diageo-rcb
  - value: $2.3 billion
    label: Diageo's estimate of its net proceeds from selling its East African Breweries shareholding
    source: diageo-eabl
  - value: 3.1x
    label: Diageo's net debt to adjusted EBITDA at 30 June 2026
    source: diageo-fy26

background:
  - date: '2025-11-05'
    text: >-
      United Spirits Limited (USL), Diageo's subsidiary in India, began a strategic review of Royal Challengers Sports
      Private Limited, the company that owns the Royal Challengers Bengaluru (RCB) cricket franchises.
    sources: [diageo-rcb]
  - date: '2025-12-17'
    text: >-
      Diageo agreed to sell its 65% shareholding in East African Breweries plc (EABL) to Asahi Group Holdings of Japan,
      for estimated net proceeds of $2.3 billion after tax and costs. It said the sale would reduce its leverage by about
      0.25x, and that EABL would continue to produce and distribute Guinness and other Diageo brands under long-term
      licensing agreements. Completion was expected in the second half of 2026. EABL had reported net sales of $996
      million in the year to 30 June 2025.
    sources: [diageo-eabl]
  - date: '2025-12-17'
    text: >-
      Diageo's interim chief executive, Nik Jhangiani, said the company was committed to returning well within its target
      leverage range of 2.5 to 3.0 times through disposals of non-core assets, tighter capital discipline and operating
      leverage, and described the EABL sale and the RCB review as material steps towards that.
    sources: [diageo-eabl]

happened:
  - date: '2026-03-24'
    text: >-
      USL agreed to sell all of Royal Challengers Sports to a consortium of Aditya Birla Group, The Times of India Group,
      Bolt Ventures and Blackstone's perpetual private equity strategy, BXPE, for a total of INR 166.6 billion.
    sources: [diageo-rcb, diageo-q3]
  - date: '2026-03-25'
    text: >-
      Diageo said Royal Challengers Sports owns and operates the RCB franchises in the Indian Premier League and the
      Women's Premier League, so the consortium would acquire the rights to run both teams. The agreement concluded the
      strategic review begun in November 2025.
    sources: [diageo-rcb]
  - date: '2026-03-25'
    text: >-
      The sale was subject to customary conditions and to approvals, including from the Board of Control for Cricket in
      India and the Competition Commission of India.
    sources: [diageo-rcb]

since:
  - date: '2026-05-06'
    text: >-
      In its third-quarter trading statement, issued under its new chief executive, Sir Dave Lewis, Diageo said the RCB
      and EABL transactions would support reducing leverage and increasing financial flexibility.
    sources: [diageo-q3]
  - date: '2026-08-06'
    text: >-
      Diageo reported net debt of $20.5 billion at 30 June 2026, or 3.1 times adjusted EBITDA. It said the sale of RCB
      was progressing as planned, and that a new operating framework would deliver about $850 million of savings over two
      years from the 2027 financial year, after restructuring charges of $0.9 billion in the 2026 financial year.
    sources: [diageo-fy26]
  - date: '2026-11-05'
    text: >-
      Diageo said it expected to end the 2027 financial year around the middle of its target leverage range of 2.5 to 3.0
      times, assuming both the EABL and RCB transactions are completed, and that the sale of EABL to Asahi remained on
      track to complete in the second half of calendar 2026.
    sources: [diageo-q1fy27]

context: |-
  Diageo describes itself as a global leader in beverage alcohol, with brands such as Johnnie Walker, Smirnoff and Guinness sold in nearly 180 countries. Through United Spirits in India it also owned a professional cricket business, and through EABL a majority of the largest beer business in East Africa. Diageo presented both disposals as steps in selling non-core assets, and both could be sold for large sums.

  The pressure to sell came from the balance sheet. Diageo measures its borrowing as net debt against adjusted EBITDA, a rough measure of the cash its operations generate, and its target range is 2.5 to 3.0 times. At 30 June 2026 the ratio was 3.1 times, with net debt of $20.5 billion. The context is a company with weak sales in North America, a new chief executive and a costly restructuring, choosing to sell good businesses outside its core to bring its debt back under control.

concepts:
  subtopics:
    - code: '3.2'
      note: The sale of assets as an internal source of finance, used here to repay debt rather than to borrow more or issue shares.
    - code: '1.3'
      note: A strategic objective, to bring leverage within a target range, driving tactical decisions about which businesses to sell.
    - code: '1.5'
      note: Growth in reverse. A drinks group that had spread into professional sport narrows its portfolio to its core.
    - code: '1.6'
      note: A multinational leaving a host country's brewing business, but keeping its brands there through licensing agreements.
    - code: '3.6'
      note: Leverage measured against earnings is close in spirit to the gearing ratio, which measures debt against capital employed.
      level: HL
  terms: [sale-of-assets, internal-sources-of-finance, gearing-ratio, strategic-objective, tactical-objective, licensing, multinational-company, conglomerate-integration, diversification, ebitda, core-competence]
  tools:
    - id: bcg-matrix
      note: Place Diageo's spirits brands, its East African beer business and a cricket franchise on the matrix, and ask which belong in the portfolio.
  apply:
    - href: /finance-desk/lab/gearing-ratio/
      label: 'Gearing ratio'
      note: 'See how using sale proceeds to repay loans changes the share of a business financed by long-term debt, with figures of your own.'

choices:
  - option: Keep both businesses and reduce debt from operating cash flow alone
    analysis: >-
      Keeps their earnings and avoids selling at the wrong price, but with leverage above the target range the debt would
      fall slowly, and lenders and shareholders would wait longer for the balance sheet to recover.
  - option: Sell the cricket franchise, the asset furthest from the drinks business, and keep the brewer
    analysis: >-
      Raises a large sum from a business with little to do with selling spirits, while keeping a growing beer business,
      but on its own it does less to reduce leverage.
  - option: Sell both, and license Diageo brands back to the brewer
    taken: true
    analysis: >-
      Raises the most cash and keeps Guinness and other brands on sale in East Africa through licensing, but gives up the
      earnings of both businesses, and both sales depend on regulators and other approvals before they complete.

implications: |-
  For Diageo the sales are a financing decision as much as a strategic one. Selling assets brings in cash without new borrowing or new shares, and Diageo's own forecast of reaching the middle of its leverage range by the end of the 2027 financial year assumes both sales complete. The cost is the profit the businesses would have earned: EABL alone reported net sales of $996 million in the year to June 2025. The licensing agreements show a way to leave a market as an owner while staying in it as a brand.

  For the buyers, an Indian Premier League franchise may be worth more as part of a portfolio of sport, media and investment than as a sideline of a drinks company, which is the logic of the consortium Diageo describes, combining strengths in sport, media, technology and brand-building. For students, the case shows [sources of finance](/topics/sources-of-finance/) from the other side: a company with a strong brand portfolio and too much debt chooses which assets to turn into cash, and a ratio, leverage against earnings, sets the pace.

lessons:
  - Selling assets is a source of finance. It reduces debt without new borrowing or diluting shareholders, but the earnings go with the asset.
  - A financial target, such as a leverage range, can drive strategic decisions about what a business owns.
  - Licensing lets a company keep its brands in a market after selling the business that makes them.
  - For managers, a business can be worth more to another owner whose strategy it fits better.

question:
  command: evaluate
  prompt: Evaluate Diageo's decision to reduce its debt by selling Royal Challengers Bengaluru and its shareholding in East African Breweries.

limits:
  - Every figure is Diageo's own. The buyers' reasons, and the views of the cricket board and the competition regulator, come from no source read for this item.
  - When the item was checked, neither sale had been reported as completed in the sources read.
  - The sources do not say what profit, if any, Royal Challengers Sports made, so the price cannot be compared with its earnings here.


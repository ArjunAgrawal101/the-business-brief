title: Couche-Tard withdraws its offer for Seven & i, the owner of 7-Eleven, and the two companies dispute why
dek: >-
  Canada's Alimentation Couche-Tard offered ¥2,600 a share for Japan's Seven & i Holdings, a 47.6% premium, then
  withdrew in July 2025, saying it had been given almost nothing to examine. Seven & i rejected that account and pressed
  on with its own plan, including a stock market listing for 7-Eleven in North America.
organizations: [Alimentation Couche-Tard, Seven & i Holdings]
categories: [mergers-and-acquisitions, corporate-governance, global-business]
regions: [asia, north-america]
industry: 'Convenience store retailing'
keyConcepts: [change, ethics]
date: '2025-07-16'
written: '2026-11-20'
checked: '2026-11-20'
figures:
  - value: ¥2,600
    label: Couche-Tard's cash proposal for each Seven & i share, a 47.6% premium to the unaffected price
    source: act-withdraw
  - value: '14'
    label: Files on the US business that Couche-Tard said it received in 10 weeks of due diligence
    source: act-withdraw
  - value: About ¥2 trillion
    label: What Seven & i plans to return to shareholders through share buybacks by the 2030 financial year
    source: seven-i-plan

background:
  - date: '2024-08-19'
    text: >-
      Alimentation Couche-Tard confirmed that it had sent a friendly, non-binding proposal to Seven & i Holdings, and said
      it wanted a transaction that would benefit both companies' customers, employees, franchisees and shareholders.
    sources: [act-proposal]
  - date: '2024-09-05'
    text: >-
      Seven & i's board rejected the proposal, to buy all its shares for US$14.86 each in cash, on the unanimous
      recommendation of a special committee of independent outside directors. It said the proposal greatly undervalued
      the company and did not deal with the challenges a deal would face from US competition authorities.
    sources: [seven-i-response]
  - date: '2025-02-28'
    text: >-
      A separate buyout proposal from a group led by Junro Ito and Ito-Kogyo, which the special committee had also been
      asked to evaluate, was withdrawn.
    sources: [seven-i-plan]
  - date: '2025-03-06'
    text: >-
      Seven & i announced its own plan: Stephen Dacus, its chairman, would become chief executive after the annual
      general meeting in May 2025; it would seek a stock market listing for 7-Eleven, Inc., its North American business,
      by the second half of 2026 while keeping a majority stake; and it had agreed to sell its superstore business to a
      company owned by Bain Capital for ¥814.7 billion. It planned to return about ¥2 trillion to shareholders through
      share buybacks by the 2030 financial year.
    sources: [seven-i-plan]
  - date: '2025-04-30'
    text: >-
      Couche-Tard signed a non-disclosure agreement with Seven & i to move discussions forward, allow due diligence and
      plan how to approach regulators.
    sources: [act-nda]

happened:
  - date: '2025-07-16'
    text: >-
      Couche-Tard withdrew its proposal, blaming a lack of constructive engagement. In a letter to Seven & i's board it
      said it had offered ¥2,600 a share in cash, a 47.6% premium to the unaffected share price, that the offer was fully
      financed, and that it had repeatedly sought a friendly dialogue with the Ito family without success.
    sources: [act-withdraw]
  - date: '2025-07-16'
    text: >-
      Couche-Tard said that in 10 weeks of due diligence it had received just 14 files on the US business and no answers
      to its critical questions. To take on the competition risk, it said, it had offered a reverse termination fee of
      about $1.2 billion, rising to over $1.4 billion if more stores had to be sold, and had explored buying all of the
      business outside Japan and 40% of the Japanese business instead. It rejected Seven & i's own suggestion, to put
      7-Eleven, Inc. into Couche-Tard in return for shares, because it would not deliver the premium on offer.
    sources: [act-withdraw]
  - date: '2025-07-17'
    text: >-
      Seven & i said Couche-Tard had decided on its own to end the talks, that it disagreed with many of Couche-Tard's
      characterizations, and that the global economy, exchange rates and financing markets had changed since the first
      proposal. It said it had always been honest about the very large competition hurdles a deal would face, and that
      it remained committed to its own plan.
    sources: [seven-i-reply]

since:
  - date: '2026-07-23'
    text: >-
      Seven & i appointed Mauricio Leyva, a former group president of Keurig Dr Pepper, as chief executive of 7-Eleven,
      Inc. from 1 August 2026, to lead the business's transformation programme.
    sources: [seven-i-leyva]

context: |-
  Seven & i Holdings runs 7-Eleven, the convenience store chain, in Japan, and through 7-Eleven, Inc. it is, in its own words, the largest convenience store chain in North America. Alimentation Couche-Tard, based in Quebec, describes itself as a global leader in convenience and mobility. Combining the two would have created a very large convenience retailer, which is why both sides discussed selling stores to satisfy US competition authorities before any deal could close.

  The approach also tested corporate governance in Japan. Seven & i's board handed the review to a special committee of independent outside directors, a structure meant to protect shareholders when insiders and bidders may want different things, and a separate buyout group, led by Junro Ito and Ito-Kogyo, made and withdrew a rival proposal. The context is a target board weighing a large premium against the risk that the deal would never close, and a bidder that needed information it said it never got.

concepts:
  subtopics:
    - code: '1.5'
      note: External growth by acquisition, the case for buying a rival, and why a target may prefer to stay independent.
    - code: '1.4'
      note: Shareholders, the founding family, franchisees, employees and competition regulators each had different interests in the bid.
    - code: '1.6'
      note: A cross-border bid for a company that, as its own board put it, plays a crucial role in everyday life in Japan.
    - code: '3.2'
      note: 'Seven & i''s alternative was financed internally and externally: selling assets (the superstores) and selling shares (a listing for 7-Eleven, Inc.).'
  terms: [takeover, acquisition, external-growth, horizontal-integration, shareholder-value, publicly-held-company, sale-of-assets, share-capital, stakeholder-conflict, multinational-company, board-of-directors, non-executive-director]
  tools:
    - id: decision-trees
      note: Set the offer, with the chance that regulators block it, against the expected value of Seven & i's own plan.
  apply:
    - href: /strategy-studio/option-appraisal/
      label: 'Option appraisal'
      note: 'Score the bid, a partial deal and the standalone plan against criteria a board would use, from value to certainty of completion.'

choices:
  - option: Agree a sale of the whole company at the price offered
    analysis: >-
      Gives shareholders a large premium in cash, but only if regulators approve, and the store sales they might demand
      could be large. A deal that fails after years of review leaves the business in limbo.
  - option: Negotiate a different structure, such as Couche-Tard's offer to buy the business outside Japan and part of the Japanese business
    analysis: >-
      Could keep most of the Japanese business under existing shareholders and reduce resistance, but it is complex,
      and the two sides put forward different partial structures without agreeing on either.
  - option: Stay independent and release value itself, by selling the superstores, listing 7-Eleven, Inc. and buying back shares
    taken: true
    analysis: >-
      Keeps control and avoids the competition risk, but shareholders give up a certain premium for a plan whose value
      depends on management carrying it out and on market conditions for a listing.

implications: |-
  For Seven & i's shareholders the outcome swaps a cash premium for a promise: the superstore sale, a listing for 7-Eleven, Inc. and about ¥2 trillion of buybacks by the 2030 financial year. Whether that was the better path depends on the plan delivering, which puts pressure on management to show results; in 2026 Seven & i appointed a new chief executive to lead 7-Eleven, Inc.'s transformation. For Couche-Tard, walking away avoided paying for a business it said it could not examine properly, and a regulatory process that Seven & i warned would be protracted.

  The episode is a case study in what a friendly approach needs: information. Couche-Tard's complaint was not about price but about access, 14 files in 10 weeks, and Seven & i's was about certainty of closing. Each account was written for shareholders and the public, so the two letters read as competing pieces of persuasion. The [growth and evolution](/topics/growth-and-evolution/) brief explains why acquisitions are attractive; this case shows how the target's board, its owners and competition law can stop one.

lessons:
  - A premium is only part of an offer. Certainty that the deal will close, including regulatory approval, matters to the target's board.
  - Friendly deals depend on information. Due diligence is where trust between buyer and seller is built or lost.
  - An approach can change a company even when it fails. Seven & i announced its own plan while the bid was on the table.
  - For managers, independent committees exist for situations where the interests of owners, managers and bidders may differ.

question:
  command: evaluate
  prompt: Evaluate the decision of Seven & i's board to pursue its own plan rather than agree a sale to Alimentation Couche-Tard.

limits:
  - The two companies' accounts contradict each other on how constructive the talks were. Each is written for its own shareholders, and this item cannot settle which is accurate.
  - The views of the US competition authorities were not read; the competition argument is given as each company described it.
  - The sources read do not say whether the planned listing of 7-Eleven, Inc. had taken place by the time the item was checked.


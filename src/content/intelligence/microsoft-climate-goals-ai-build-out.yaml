  - value: 100%
    label: Annual electricity use matched with renewable energy in fiscal 2025
    source: ms-sustainability-2026
  - value: $115.9 billion
    label: Additions to property and equipment in fiscal 2026, up from $64.6 billion
    source: ms-ar26
  - value: '88'
    label: New data centres added in fiscal 2026
    source: ms-ar26

happened:
  - date: '2026-06-30'
    text: >-
      In fiscal 2026 Microsoft's additions to property and equipment were $115,948 million, against $64,551 million in
      fiscal 2025, and the shareholder letter reported 88 new data centres added during the year.
    sources: [ms-ar26]
  - date: '2026-10-14'
    text: >-
      In its annual report, Microsoft restated the goals it announced in 2020: to become carbon negative, water positive
      and zero waste by 2030. It said that since then it had seen major changes in the technology sector and in its own
      understanding of what meeting the goals will take.
    sources: [ms-ar26]
  - date: '2026-10-14'
    text: >-
      The annual report said Microsoft's investment in cloud and AI infrastructure and devices will continue to increase
      its operating costs and may reduce its operating margins, and that its data centres depend on permitted land that can
      be built on, predictable energy, networking supplies and servers.
    sources: [ms-ar26]
  - date: '2026-10-14'
    text: >-
      The shareholder letter described community-first commitments for its data centres covering affordable electricity,
      water stewardship, job creation, local tax contributions, skills and investment in nonprofits.
    sources: [ms-ar26]
  - date: '2026-11-03'
    asAt: true
    text: >-
      Microsoft's 2026 Environmental Sustainability Report page said that in fiscal 2025 the company matched 100% of its
      annual electricity consumption with renewable energy, and replenished more than 14.2 million cubic metres of water,
      more than it withdrew.
    sources: [ms-sustainability-2026]
  - date: '2026-11-03'
    asAt: true
    text: >-
      The same page reported an agreement with Rubicon Carbon to buy up to 18 million tonnes of credits from
      afforestation, reforestation and revegetation, and an expanded agreement with Stockholm Exergi to buy 5.08 million
      tonnes of permanent carbon removal.
    sources: [ms-sustainability-2026]

matters: |-
  Sustainability objectives are tested when growth accelerates. Microsoft set its 2030 goals in 2020, before the present build-out of AI infrastructure. In fiscal 2026 alone its additions to property and equipment rose from $64.6 billion to $115.9 billion, and it added 88 data centres, each of which needs land, electricity and water. Its annual report now says that its understanding of what the goals require has changed. That is a carefully chosen sentence, and worth reading as one: it neither abandons the goals nor says they are on track.

  The measures Microsoft puts first also repay close reading. Matching a year's electricity use with renewable energy means buying renewable power equal to the annual total, often through long-term contracts; it does not mean that every hour of use was powered by renewable sources. Buying credits for forest restoration or permanent carbon removal is different from cutting emissions at source. Each can be a sensible part of a plan, and each can also be used to present growth in a favourable light. This is the debate about [corporate social responsibility](/topics/business-objectives/) in its most current form: how a business balances growth, shareholders' expectations and its commitments to the communities where it builds.

concepts:
  subtopics:
    - code: '1.3'
      note: Ethical objectives and corporate social responsibility under pressure from rapid growth.
    - code: '1.4'
      note: Communities near data centres, customers and shareholders want different things from the same expansion.
    - code: '3.1'
      note: Capital expenditure on a very large scale, and its effect on future operating costs.
    - code: '5.4'
      note: Location factors for data centres, including land, energy and water.
  terms: [corporate-social-responsibility, ethical-objectives, triple-bottom-line, stakeholder-conflict, capital-expenditure, location-factors, data-centre]
  tools:
    - id: steeple-analysis
      note: The environmental and ethical factors, and the community and political response to new data centres.

choices:
  - option: Slow the build-out to protect the 2030 goals
    analysis: >-
      Keeps the commitments credible, but risks losing customers and revenue to competitors who keep building.
  - option: Keep building, while buying renewable power and carbon removal
    taken: true
    analysis: >-
      Protects growth and supports markets Microsoft is helping to create, but depends on the quality of the credits and
      removal projects, and invites accusations of greenwashing if emissions rise.
  - option: Revise the goals or their dates openly
    analysis: >-
      Honest, and may protect trust in the long run, but a public retreat damages reputation and can disappoint
      employees and customers who value the commitments.
  - option: Invest in efficiency and in the communities near data centres
    taken: true
    analysis: >-
      Reduces the impact of each unit of computing and builds local support, but efficiency gains can be overtaken by the
      growth in demand they make possible.

lessons:
  - Objectives set in one strategic situation need to be reviewed when the situation changes, and the review is more credible when it is public.
  - Read sustainability measures precisely, asking what is counted, over what period and against what baseline.
  - Sustainability is a stakeholder question. The people who live near a data centre feel its costs directly.
  - For managers, growth targets and environmental targets work best when they are planned together, not in separate departments.

question:
  command: to-what-extent
  prompt: To what extent can a business that is rapidly expanding its physical infrastructure still meet ambitious environmental objectives? Refer to Microsoft.

limits:
  - The pages read for this item do not give Microsoft's total greenhouse gas emissions or how they have changed since 2020. The full 2026 Environmental Sustainability Report, which the page links to, could not be opened when this item was written, so the item draws no conclusion about emissions.
  - All the figures are Microsoft's own and are not independently verified here.
  - The sustainability report page carries no publication date, so its facts are given as they stood when the page was read on 3 November 2026.


title: Microsoft's 2030 climate goals meet the AI build-out
dek: >-
  Microsoft says it matched all its electricity use with renewable energy and replenished more water than it withdrew
  in fiscal 2025. In fiscal 2026 it raised its spending on property and equipment from $64.6 billion to $115.9 billion,
  and it now says its understanding of what its 2030 goals will take has changed.
organizations: [Microsoft]
categories: [sustainability]
keyConcepts: [sustainability, ethics]
date: '2026-10-14'
written: '2026-11-03'
checked: '2026-11-03'

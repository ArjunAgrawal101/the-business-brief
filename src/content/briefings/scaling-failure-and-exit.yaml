# Briefing 6 of the Entrepreneurship and Innovation Lab. Written in the
# platform's own words. IB status checked against the guide: starting up
# (1.1, p. 23), types of business entity (1.2, p. 23), growth and evolution
# (1.5, p. 24), insolvency versus bankruptcy (3.6, HL, p. 29) and cash flow
# (3.7, pp. 29 to 30). Scaling in the start-up sense, the analysis of failure
# and exit strategies are enrichment. No start-up failure rate is quoted,
# because none is available from a source the platform can show. Refill Round
# is fictional.
title: Scaling, failure and exit
order: 6
step: Plan to grow, survive and exit
dek: What changes when a start-up grows, the patterns behind start-up failure, and the ways founders eventually leave the businesses they built.
question: If it works, how big should it get, and how does the story end?
introduction: |
  A start-up is a temporary organization: it is searching for a business model that works. Once it finds one, three questions follow. Can it grow without breaking what made it work? What could still make it fail? And what is the founders' long-term plan: to run it for life, to hand it on, or to sell it?

  This briefing covers scaling, the patterns behind start-up failure and exit strategies. It leans on the IB's growth and evolution (1.5), cash flow (3.7) and, at HL, insolvency and bankruptcy (3.6).
ibSummary: >
  Economies and diseconomies of scale, internal and external growth, the reasons to grow or stay small and the
  external growth methods are IB content (1.5), as are the challenges of starting up (1.1), cash flow (3.7) and, at
  HL, insolvency versus bankruptcy (3.6). Scaling in the start-up sense, the analysis of failure and exit strategies
  are enrichment; mergers, acquisitions and takeovers (1.5) and publicly held companies (1.2) are the IB ideas behind
  the main exits.
sections:
  - id: scaling
    title: 'Scaling: growing without breaking'
    ib: ['1.5']
    enrichment: true
    body: |
      In start-up language, a business scales when its revenue can grow much faster than its costs. Growth alone is not scaling: a business that needs a new shop, a new team and a new manager for every extra hundred customers is growing, but its costs grow in step. Scaling needs a way of winning customers that works again and again at a known cost, operations that cope with volume, people and structures that do not depend on the founders doing everything, and the money to pay for growth before it pays back.

      The IB course gives the economics behind it (1.5). Economies of scale, from buying in bulk, better equipment, specialist managers, cheaper finance and spreading marketing over more sales, lower the cost of each unit as the business grows. Diseconomies of scale, from slower communication, weaker coordination and less motivated staff, push it back up. The guide also asks why a business might choose to stay small (1.5, AO3), and many good businesses do: to serve a niche well, keep personal service, keep control, or simply avoid the risk.

      The commonest scaling mistake is premature scaling: spending heavily to grow before the business model has been shown to work. If the unit economics are weak, growth multiplies the losses; if the operations are fragile, growth breaks them in front of more customers. Growing quickly can also mean overtrading, when sales expand faster than the working capital to fund them.
    points:
      - term: Repeatable sales
        text: A way of winning customers that works again and again at a known cost per customer.
      - term: Operations at volume
        text: Processes, suppliers and quality checks that hold up at ten times today's volume.
      - term: From founders to managers
        text: The founders delegate, hire managers and build a structure, which the guide's leadership and organizational structure topics (unit 2) describe.
      - term: Funding growth
        text: Growth costs cash before it brings any in. Overtrading is growing faster than working capital allows.
    example:
      title: Two ways for Refill Round to grow
      text: |
        If the pilot works, Refill Round can grow internally (1.5), adding postcodes, bikes and riders in its own city from its own revenue and borrowing. Or it can grow externally by franchising (1.5), letting operators in other cities run Refill Round under its name with their own money, in exchange for a fee and a share of sales. Franchising would spread the brand far faster and with far less capital, at the cost of control over the quality that the brand depends on, which matters a great deal for a service that handles customers' bottles and homes.
  - id: why-start-ups-fail
    title: Why start-ups fail
    ib: ['1.1', '3.7']
    enrichment: true
    body: |
      Figures for how many start-ups fail vary widely with the country, the definition of failure and the period measured, so this briefing quotes none: the platform cites figures only from sources it can show you. The patterns behind failure are more useful than any single rate, and they map closely onto the challenges of starting up that the guide asks you to analyse (1.1).

      It helps to separate the immediate cause from the underlying one, as the platform's problem and cause chain does. Running out of cash is how most failing start-ups end, but it is usually a symptom. The cause is earlier: customers who never really needed the product, unit economics that never worked, growth funded before the model was proven, or founders who could not agree. A founder who reads the warning signs early has time to change course; one who reads only the bank balance does not.
    table:
      caption: Patterns behind start-up failure, and their early warnings
      corner: Pattern
      columns: [What it looks like, The early warning, Where it meets the IB course]
      rows:
        - label: No real need
          cells: ['Interest at launch, then few customers who return', 'Customers praise the product but do not pay or come back', 'Market research (4.4)']
        - label: Unit economics that never work
          cells: ['Each customer or sale costs more than it brings in', 'Lifetime value below acquisition cost; contribution near zero', 'Contribution (5.5)']
        - label: Cash runs out
          cells: ['Bills cannot be paid even while sales grow', 'A runway shorter than the time to the next milestone', 'Cash flow (3.7)']
        - label: Overtrading
          cells: ['Sales grow faster than the working capital to fund them', 'Rising sales and a falling bank balance', 'Cash flow (3.7)']
        - label: Outcompeted
          cells: ['A rival with deeper pockets matches or undercuts the offer', 'Prices falling across the market', 'Differentiation (4.2)']
        - label: The team breaks
          cells: ['Founders disagree, leave or burn out', 'Unclear roles and no written agreement between founders', 'Leadership and management (2.3)']
        - label: Wrong timing
          cells: ['Customers or the technology are not ready, or the moment has passed', 'Long delays before customers commit', 'STEEPLE analysis (toolkit)']
  - id: failing-well
    title: 'Failing well: stopping, pivoting and what is left'
    ib: ['3.6']
    enrichment: true
    connects: ['1.2']
    body: |
      Founders who fail well decide in advance what would make them stop. Kill criteria, set before money is committed, such as fewer than 30 of 40 pilot households still paying after three months, turn a painful judgement into a planned decision, and protect against the most expensive mistake in start-ups: carrying on with a model the evidence has already rejected. Hitting a kill criterion does not have to mean closing; it can mean a pivot to a different segment, channel or revenue model.

      If the business must close, how it closes matters. An orderly wind-down pays suppliers and staff what they are owed as far as possible, refunds customers who paid in advance, and keeps the founders' reputation intact, which matters if they ever start again. At HL the guide distinguishes insolvency from bankruptcy (3.6, AO2): a business is insolvent when it cannot pay its debts as they fall due; bankruptcy is the legal status a court declares, after which the assets are sold to repay creditors as far as possible. A company that closes is wound up through liquidation.

      Who pays for failure depends on the legal form (1.2). The owners of a company have limited liability and lose only what they invested, unless they gave personal guarantees; a sole trader or partner has unlimited liability, so the business's debts can take their house and savings.
    points:
      - term: Kill criteria
        text: Results, set in advance, that would make the founders stop or change direction.
      - term: An orderly wind-down
        text: Closing in a way that pays creditors and staff as far as possible and treats customers fairly.
      - term: Liability decides who pays
        text: Limited liability caps an owner's loss at what they invested; unlimited liability does not.
  - id: exit-strategies
    title: Exit strategies
    ib: ['1.5', '1.2']
    enrichment: true
    body: |
      An exit is how founders and investors turn the value they have built into money, or hand the business on. Investors need one: an angel or a fund gets its money back only when it can sell its shares. Founders need to think about one too, because the exit they want shapes the business they build. A business built to be sold needs systems that work without its founders; one built to hand to the family needs successors; one built to run for income needs no exit at all.

      The main routes draw on IB ideas. A trade sale is an acquisition (1.5), in which another company buys the business, often a competitor, supplier or larger firm that values its customers, technology or brand. A merger (1.5) combines it with another business. A flotation, or initial public offering, sells shares to the public on a stock exchange, turning a privately held company into a publicly held one (1.2), with the cost and scrutiny that brings. A management buy-out sells the business to its own managers, usually financed by loans; employee ownership sells it to the staff, sometimes as a cooperative (1.2).

      Whatever the route, a buyer pays for future profits and cash. A business that depends on its founder, whose customers, skills or contacts would leave with them, is worth less than one that runs without them: buyers call this key-person risk.
    table:
      caption: Ways founders and investors leave a business
      corner: Exit
      columns: [What happens, What it suits]
      rows:
        - label: Trade sale
          cells: ['Another company buys the business: an acquisition (1.5)', 'Businesses whose customers, technology or brand a larger firm values']
        - label: Merger
          cells: ['The business combines with another to form one organization (1.5)', 'Two businesses that are stronger together, and founders willing to share control']
        - label: Flotation
          cells: ['Shares are sold to the public on a stock exchange, and the business becomes a publicly held company (1.2)', 'Large businesses with a record of growth; costly, and ownership becomes separate from control']
        - label: Management buy-out
          cells: ['The managers buy the business, usually with borrowed money', 'Steady, cash-generating businesses that the managers know well']
        - label: Sale to an investor
          cells: ['A private investor or fund buys the founders'' shares', 'Profitable businesses with room to grow']
        - label: Succession
          cells: ['Family members or chosen successors take over', 'Family businesses and founders who want the business to continue']
        - label: Employee ownership
          cells: ['The staff buy the business, sometimes as a cooperative (1.2)', 'Businesses whose people are the value, and founders who care about what happens next']
        - label: No exit
          cells: ['The founders keep running it for its income', 'Businesses that need no outside investors, and founders who enjoy running them']
    example:
      title: "Refill Round's angel wants a way out"
      text: |
        Refill Round's business angel owns 15% and will see a return only when those shares can be sold. A flotation is unrealistic for a regional business. The plausible routes are a trade sale to a larger maker or seller of cleaning products that wants a refill service, a sale of the angel's stake to a later investor, or the founders buying the stake back from profits after a few years. Each suits different stakeholders (1.4): a trade sale might reward the founders and the angel but change the business that customers and staff signed up for.

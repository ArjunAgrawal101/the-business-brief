questions:
  - q: What makes growth scaling rather than simply getting bigger?
    a: Revenue grows much faster than costs, because winning customers, delivering to them and running the organization all work at a larger volume without costs rising in step.
  - q: Distinguish the immediate cause of a start-up's failure from its underlying cause, with an example.
    a: Running out of cash is often the immediate cause. The underlying cause may be unit economics that never worked, so that each new customer deepened the losses until the money ran out.
  - q: 'HL: distinguish insolvency from bankruptcy.'
    a: Insolvency is a financial state in which a person or business cannot pay its debts as they fall due. Bankruptcy is the legal status a court declares when it finds them unable to pay, after which their assets are usually sold to repay creditors.
  - q: Why might Refill Round's business angel press for an exit plan, and which exits could suit a regional business?
    a: The angel's return comes only when the shares can be sold. A trade sale to a larger company, a sale of the stake to a later investor, or a buy-back by the founders from profits are realistic; a flotation is not.
  - q: Why does a business that depends on its founder usually sell for less?
    a: A buyer pays for future profits and cash. If the customers, skills or contacts would leave with the founder, those future profits are less certain.

misconceptions:
  - claim: Every successful start-up should grow as fast as it can.
    correction: Growth costs cash, strains people and processes, and multiplies whatever is wrong with the unit economics. Many businesses are better off growing slowly, or staying small (1.5).
  - claim: Start-ups fail because they run out of cash.
    correction: Running out of cash is usually how a start-up ends, not why. The causes come earlier, such as no real need, unit economics that never worked, or growth paid for before the model was proven.
  - claim: An exit means the business failed or was sold off.
    correction: An exit is how founders and investors realize the value they built. It can be a sale, a flotation, a hand-over to managers or staff, or a decision to keep running the business for its income.
terms:
  - { term: Scaling, definition: 'Growth in which revenue rises much faster than costs, because sales, operations and the organization work at a larger volume.' }
  - { term: Premature scaling, definition: 'Spending heavily to grow before the business model has been shown to work.' }
  - { term: Kill criteria, definition: 'Results, set in advance, that would make founders stop or change direction.' }
  - { term: Exit strategy, definition: 'How the founders and investors plan to realize the value of the business or hand it on.' }
  - { term: Trade sale, definition: 'The sale of a business to another company.' }
  - { term: Flotation, definition: 'Selling a company''s shares to the public on a stock exchange for the first time; also called an initial public offering.' }
  - { term: Management buy-out, definition: 'The purchase of a business by its own managers, usually with borrowed money.' }
  - { term: Key-person risk, definition: 'The loss of value if the business depends on one person who might leave.' }

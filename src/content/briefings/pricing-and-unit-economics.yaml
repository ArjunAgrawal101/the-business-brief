# Briefing 3 of the Entrepreneurship and Innovation Lab. Written in the
# platform's own words. IB status checked against the guide: the pricing
# methods (4.5, p. 32; dynamic, competitive and contribution pricing and price
# elasticity of demand are HL only), contribution and break-even (5.5, p. 34)
# and the payback period (3.8, p. 30). Value-based pricing, price testing and
# unit economics are enrichment; none of the unit economics measures is on the
# guide's formula list (pp. 64 to 65). Refill Round is fictional; its figures
# are simulated and match the unit economics calculator. Worked: CAC 1,800 ÷
# 45 = $40; contribution 24 − 9.10 = $14.90; lifetime 1 ÷ 0.08 = 12.5 months;
# LTV $186.25; ratio 4.66; payback 2.68 months. At $28: contribution $18.90,
# 26.8% more than $14.90; 14.90 ÷ 18.90 = 0.788, so up to 21% fewer sign-ups.
title: Pricing a start-up and its unit economics
order: 3
step: Price it, one customer at a time
dek: How a new business sets a price before it has a track record, and how to check, one customer at a time, that growth will make it richer rather than poorer.
question: At this price, does each customer leave the business better off?
introduction: |
  Price is the one part of the marketing mix that brings money in; every other part costs money. For a start-up it is also one of the hardest decisions to get right. There is no sales history to learn from, costs per unit are high while volumes are small, and the first price sets what customers expect for years.

  This briefing covers how to set a price a new business can live with, using the guide's pricing methods and the ways start-ups test prices, and then unit economics: the arithmetic of a single customer, which shows whether spending to grow will pay.
ibSummary: >
  The pricing methods are IB content (4.5, AO3): cost-plus, penetration, loss leader, predatory and premium pricing,
  and at HL dynamic, competitive and contribution pricing and price elasticity of demand. Contribution per unit and
  break-even are IB content (5.5). Value-based pricing, price testing and unit economics (customer acquisition
  cost, lifetime value and their ratio) are enrichment.
sections:
  - id: pricing-methods
    title: "The guide's pricing methods, seen by a start-up"
    ib: ['4.5']
    body: |
      Every price sits between a floor and a ceiling. The floor is the variable cost of each unit: below it, every sale makes the business poorer. The ceiling is what the product is worth to the customer, judged against the alternatives. Competitors' prices sit somewhere in between and pull the price towards them. The guide's pricing methods (4.5, AO3) are different ways of choosing a point in that range, and each suits some situations better than others.

      A start-up sees them differently from an established business in two ways. Its cost per unit is inflated, because fixed costs are spread over few units, so a price built up from cost can be too high to win customers; and it has no brand yet, so a price that relies on reputation is hard to justify. On the other hand, it can choose its first price freely, without existing customers to upset.

      The methods marked HL are taught at HL only. Contribution pricing in particular matters to a start-up with spare capacity, because an order priced above its variable cost adds to contribution even when it is priced below full cost.
    table:
      caption: The guide's pricing methods for a start-up
      corner: Method
      columns: [When it suits a start-up, The risk]
      rows:
        - label: Cost-plus (mark-up)
          cells: ['Costs are known and customers expect prices to follow costs, as in much selling to other businesses', 'At start-up volumes the full cost per unit is inflated by fixed costs, so the price may be too high to win customers']
        - label: Penetration
          cells: ['Winning customers quickly matters, for example where customers stay once they have switched', 'Customers anchor on the low price, so raising it later may drive them away']
        - label: Premium
          cells: ['The product is clearly different and buyers judge quality partly by price', 'It needs a brand and evidence of quality that a new business may not have yet']
        - label: Loss leader
          cells: ['One product draws customers who then buy others at a profit', 'It works only if those customers really do buy the profitable products']
        - label: Predatory
          cells: ['Not a start-up strategy', 'Pricing below cost to drive rivals out is banned by competition law in many countries when a dominant firm does it; a start-up is more often its target']
        - label: Dynamic (HL)
          cells: ['Demand varies by time or occasion and capacity is fixed', 'Customers who pay more than others may feel cheated']
        - label: Competitive (HL)
          cells: ['The product is hard to tell apart from rivals', 'It leaves no room for the higher price a start-up''s costs may need']
        - label: Contribution (HL)
          cells: ['A one-off order fills capacity that would otherwise stand idle', 'Prices below full cost cannot pay the fixed costs if used for all sales']
  - id: value-and-testing
    title: Value-based pricing and testing a price
    enrichment: true
    connects: ['4.4', '4.5']
    body: |
      Value-based pricing starts from the other end: what is the product worth to the customer? That depends on what it saves them, what it earns them and what the alternatives cost, including the cost in time or effort of doing without. The price is then set below that value, so the customer gains, and checked against cost, so the business gains too. It is not one of the guide's methods, but it is the question behind premium pricing and behind price elasticity of demand, which the guide teaches at HL.

      A start-up learns what customers will pay by watching them decide, not by asking them to guess. Interviews can reveal what customers spend on the problem now. Landing pages can test two prices with similar visitors and compare how many pay. Tiers, such as a basic, standard and full version, show which features customers value enough to pay more for. And a pilot at the intended price is worth more than any survey.

      Three principles help. A price is far easier to lower than to raise, so start higher and reward early customers with a discount rather than a low list price. Do not compete on price with rivals who have lower costs. And look at what a price change does to contribution, not just to sales.
    points:
      - term: Reference price
        text: The price customers compare yours with, usually the alternative they use now. A refill box is judged against supermarket bottles, not against other refill services.
      - term: Anchoring
        text: The first price customers see shapes what they think is fair. A low launch price makes every later rise feel like a loss.
      - term: Tiers
        text: Several versions at different prices. They let customers sort themselves by what they value and show the founder what they value most.
    example:
      title: Testing $24 against $28
      text: |
        Refill Round's founders find from interviews that a typical household spends about $20 a month on the products the box replaces, and price the box at $24: a premium for delivery and no plastic. Before launch they test a second landing page at $28.

        The arithmetic shows why the test matters. The box costs $9.10 to fill and deliver whatever its price, so at $24 each subscriber contributes $14.90 a month and at $28 they contribute $18.90. A price 17% higher raises contribution per subscriber by 27%, so the higher price earns more contribution even if it loses up to about a fifth of the sign-ups, because $14.90 is 79% of $18.90. All figures are simulated.
  - id: unit-economics
    title: 'Unit economics: the arithmetic of one customer'
    enrichment: true
    connects: ['5.5', '3.8']
    body: |
      Unit economics asks whether the business makes money on each unit it sells, before fixed costs. For a business that sells one-off products the unit is a product, and the IB's contribution per unit (5.5) is the measure. For a business that wins customers and keeps them, such as a subscription, the unit is a customer, and the question has a time dimension: a customer costs money to win at the start, then contributes a little every month for as long as they stay.

      Four figures answer it. The customer acquisition cost (CAC) is what it costs to win one customer. The contribution per customer per month is what they pay minus the variable cost of serving them. The expected lifetime is how long they stay, which depends on the churn rate. Lifetime value (LTV) is the contribution over that lifetime. Comparing LTV with CAC says whether winning customers pays; the CAC payback period says how long it takes.

      The reason it matters so much to start-ups is that growth multiplies it. If each customer is worth more than they cost to win, spending to grow makes the business richer. If each customer is worth less, every new customer deepens the loss, and growing faster only makes it fail faster.
    formulas:
      - { name: Customer acquisition cost, expression: 'CAC = marketing and sales spending ÷ new customers won', note: 'Not on the IB formula list.' }
      - { name: Contribution per customer, expression: 'Contribution per customer per month = revenue per customer − variable cost per customer', note: 'The contribution per unit of 5.5, with one customer for one month as the unit.' }
      - { name: Expected lifetime, expression: 'Expected lifetime (months) = 1 ÷ monthly churn rate', note: 'Assumes the same share of customers leaves every month. Not on the IB formula list.' }
      - { name: Lifetime value, expression: 'LTV = contribution per customer per month × expected lifetime', note: 'Not on the IB formula list.' }
      - { name: LTV to CAC ratio, expression: 'LTV to CAC ratio = LTV ÷ CAC', note: 'Not on the IB formula list.' }
      - { name: CAC payback period, expression: 'CAC payback period (months) = CAC ÷ contribution per customer per month', note: 'The payback idea of 3.8, applied to one customer. Not on the IB formula list.' }
    example:
      title: One Refill Round subscriber
      text: |
        Last month Refill Round spent $1,800 on advertising and referral credits and won 45 subscribers, so its CAC is $1,800 ÷ 45 = $40. A subscriber pays $24 a month and costs $9.10 to serve, a contribution of $14.90 a month. If 8% of subscribers leave each month, a subscriber stays 1 ÷ 0.08 = 12.5 months on average, so their lifetime value is $14.90 × 12.5 = $186.25.

        LTV to CAC is $186.25 ÷ $40 = 4.7 to 1, and the CAC is earned back in $40 ÷ $14.90 = 2.7 months. On these figures, winning subscribers pays well. But the 8% churn comes from a small pilot: at 16%, the lifetime halves to 6.25 months, lifetime value halves to $93.13 and the ratio falls to 2.3 to 1. All figures are simulated; try them in the [unit economics calculator](/entrepreneurship-lab/unit-economics/).
  - id: reading-unit-economics
    title: Reading unit economics with care
    enrichment: true
    connects: ['5.5', '3.8']
    body: |
      Unit economics are only as good as their inputs, and a new business's inputs are mostly estimates. Churn is the weakest: a business that has been trading for four months cannot know how many customers will still be there in two years. Acquisition cost flatters when it is blended, dividing all marketing spending by all new customers, including those who came through friends or search and would have come anyway; the cost of a customer won through paid advertising is usually higher, and that is the cost of growing faster. And the founders' own hours spent selling are a real cost that rarely appears in the spending figure.

      Averages also hide differences. The first customers, who sought the product out, tend to stay longer than those won later by advertising, so it helps to follow each month's new customers as a group, a cohort, and compare their churn. Lifetime value here is undiscounted; money that arrives in two years is worth less than money today, which at HL is the idea behind net present value (3.8).

      Finally, unit economics leave out fixed costs. Total contribution from all customers must still cover the rent, the pay and the rest each month, which is the break-even question of 5.5. Refill Round's fixed costs of about $4,590 a month need 4,590 ÷ 14.90 = 308.05, so 309 subscribers, rounded up, if the box were its only stream.
    points:
      - term: Blended and paid CAC
        text: Blended CAC divides all spending by all new customers; paid CAC counts only customers won by paid advertising, and is usually higher.
      - term: Cohort
        text: The customers who joined in the same month, followed over time to see how long they stay.
      - term: Rules of thumb
        text: Many investors look for an LTV to CAC ratio of at least 3 to 1 and a CAC payback of under 12 months in a subscription business. They are conventions, not laws, and they are not IB content.
    callout:
      tone: caution
      title: Good unit economics, no cash
      text: |
        A start-up can have excellent unit economics and still run out of money, because the acquisition cost is paid now and the contribution arrives month by month. Refill Round earns back each subscriber's acquisition cost in under three months, yet on its plan the cash runs out in month 6. The [start-up cost calculator](/entrepreneurship-lab/start-up-costs/) shows why.

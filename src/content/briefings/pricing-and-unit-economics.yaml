questions:
  - q: Why can cost-plus pricing give a start-up too high a price?
    a: At low volumes, fixed costs are spread over few units, so the full cost per unit is high, and a mark-up on top of it can take the price above what customers will pay. As volume grows, the cost per unit falls.
  - q: Refill Round's CAC is $40 and each subscriber contributes $14.90 a month. What is the CAC payback period?
    a: $40 ÷ $14.90 = 2.7 months, to one decimal place.
  - q: What happens to lifetime value if monthly churn rises from 8% to 16%, other things being equal?
    a: The expected lifetime halves, from 12.5 to 6.25 months, so lifetime value halves too, from $186.25 to $93.13, because churn is the divisor in the lifetime.
  - q: A price 17% higher raises Refill Round's contribution per subscriber by 27%. Why are the two percentages different?
    a: The variable cost is the same at either price, so the whole price rise is added to contribution, and contribution is a smaller number than the price.
  - q: Which HL pricing methods suit a start-up with spare capacity in quiet months?
    a: Contribution pricing, for one-off orders priced above their variable cost, and dynamic pricing to fill quiet periods, as long as regular customers do not feel cheated.

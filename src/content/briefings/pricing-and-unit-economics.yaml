misconceptions:
  - claim: A start-up should set a low price to win customers.
    correction: A low price is a choice with costs. It lowers the contribution from every customer, anchors expectations and invites a price war with rivals whose costs are lower. It suits a business with the funding to wait and customers who stay once they have switched.
  - claim: Lifetime value is what a customer pays over the years they stay.
    correction: That is lifetime revenue. Lifetime value to the business counts contribution, what the customer pays minus the cost of serving them, which is often much smaller.
  - claim: If lifetime value is three times the acquisition cost, the business is safe.
    correction: The ratio says that spending to win customers pays back eventually. It says nothing about fixed costs or about cash, and it rests on a churn rate a new business has barely measured.
terms:
  - { term: Value-based pricing, definition: 'Setting a price from what the product is worth to the customer, then checking it against cost.' }
  - { term: Willingness to pay, definition: 'The most a customer would pay for a product, given the alternatives.' }
  - { term: Customer acquisition cost (CAC), definition: 'The marketing and sales spending in a period divided by the new customers won in that period.' }
  - { term: Churn rate, definition: 'The share of customers who leave in a period, usually a month.' }
  - { term: Lifetime value (LTV), definition: 'The total contribution a customer is expected to bring over the time they stay.' }
  - { term: LTV to CAC ratio, definition: 'Lifetime value divided by customer acquisition cost: how many times over a customer repays what it cost to win them.' }
  - { term: CAC payback period, definition: 'The months of contribution needed to earn back the cost of winning a customer.' }
  - { term: Cohort, definition: 'A group of customers who joined in the same period, followed over time.' }

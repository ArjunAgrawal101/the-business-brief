questions:
  - q: Why is equity sometimes called the most expensive form of finance?
    a: If the business succeeds, the investors own a share of every future profit and of its value when sold, which can far exceed the interest on a loan of the same size.
  - q: Refill Round's angel invested $10,000 for 15%. What valuation does that imply?
    a: A post-money valuation of $10,000 ÷ 0.15 = $66,667, and a pre-money valuation of $66,667 − $10,000 = $56,667.
  - q: If Refill Round later sells 25% of the enlarged company, what share do the founders keep, starting from 85%?
    a: 85% × (1 − 0.25) = 63.75%.
  - q: Which source suits a cash gap of a few weeks, and which suits buying a cargo bike? Explain.
    a: An overdraft or trade credit for the short gap, because it is flexible and quickly repaid. A loan or a lease for the bike, a long-lived asset, so that the payments are spread over its useful life.
  - q: Why can a sole trader not raise share capital, and what would the founder have to change?
    a: A sole trader has no shares to sell, because the owner and the business are legally the same. The founder would have to form a company (1.2), which can issue shares and gives its owners limited liability.

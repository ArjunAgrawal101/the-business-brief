misconceptions:
  - claim: Equity is free money, because it never has to be repaid.
    correction: If the business succeeds, equity is often the most expensive money of all. Investors own a share of every future profit and of the price if the business is sold, and usually have a say in decisions.
  - claim: Venture capital is the normal way to fund a start-up.
    correction: Most new businesses are funded by their founders, families, customers and banks. Venture capital funds a small number of businesses that could grow very large, and it expects a sale or a flotation.
  - claim: A loan is always less risky for the founders than selling shares.
    correction: A loan keeps control, but it must be repaid whatever happens to sales, often with a personal guarantee. If the business struggles the debt remains, whereas an equity investor shares the loss.
terms:
  - { term: Bootstrapping, definition: 'Building a business on the founders'' own money and the money the business earns, with no outside investors.' }
  - { term: Equity, definition: 'Money paid for a share of the ownership of a business, which is never repaid but gives the investor a claim on its profits and value.' }
  - { term: Venture capital, definition: 'Investment by specialist funds in young businesses that could grow very large, in exchange for a substantial share and rights over decisions.' }
  - { term: Valuation, definition: 'What a business is judged to be worth. A funding round sets one: the amount invested divided by the share it buys.' }
  - { term: Dilution, definition: 'The fall in existing owners'' percentage share when new shares are sold.' }
  - { term: Personal guarantee, definition: 'A founder''s promise to repay a business loan from their own assets if the business cannot.' }
  - { term: Rewards crowdfunding, definition: 'Crowdfunding in which backers pay in advance for a product or a reward: a form of pre-sale.' }

# Briefing 5 of the Entrepreneurship and Innovation Lab. Written in the
# platform's own words. IB status checked against the guide: the sources of
# finance (3.2, p. 28) and the types of business entity (1.2, p. 23).
# Bootstrapping, friends and family as a category, venture capital, the types
# of crowdfunding, grants, funding rounds, valuation and dilution are
# enrichment. Refill Round is fictional; its figures are simulated and match
# the start-up cost calculator. Worked: $10,000 for 15% gives a post-money
# valuation of 10,000 ÷ 0.15 = $66,667 and a pre-money valuation of $56,667;
# selling 25% in a later round leaves the founders 85% × 0.75 = 63.75%.
title: 'Funding a start-up: control, risk and the right money'
order: 5
step: Fund the start
dek: Bootstrapping, friends and family, business angels, venture capital, crowdfunding and loans, what each costs the founders in control, risk and obligation, and how to choose between them.
question: Whose money, on what terms, and what do the founders give up for it?
introduction: |
  Money is never free. A loan must be repaid whatever happens to sales. Shares sold to an investor are a permanent claim on the profits and usually come with a say in decisions. Money from customers in advance is a promise to deliver. Even a founder's own savings have a cost: what else that money, and that founder's time, could have done. Choosing how to fund a start-up is choosing which of these costs to bear.

  This briefing sets out the main sources of start-up finance, the trade-offs of control and risk that separate them, and how the right mix changes as a business grows.
ibSummary: >
  The guide's sources of finance are IB content (3.2): personal funds, share capital, loan capital, overdrafts, trade
  credit, crowdfunding, leasing, microfinance providers and business angels (AO2), and which short- or long-term
  source suits a situation (AO3). The legal form, which decides who can sell shares and who is liable for the debts,
  is 1.2. Bootstrapping, friends and family as a category, venture capital, grants, the types of crowdfunding and
  the arithmetic of funding rounds are enrichment.
sections:
  - id: control-risk-obligation
    title: 'Three costs of money: control, risk and obligation'
    ib: ['3.2']
    enrichment: true
    body: |
      Every source of finance can be judged by three questions. Who controls the business afterwards: do the founders keep every decision, or do investors gain votes and rights? Who carries the risk if it fails: the founders, the lender, the investor or the customers who paid in advance? And what obligations come with the money: repayments on a fixed schedule, interest, products owed, conditions on how it is spent?

      Debt and equity answer them in opposite ways. A loan leaves the founders in control and lets them keep all the profit, but the repayments are due whatever happens, and lenders to a new business usually want security: collateral, or a personal guarantee that puts the founders' own assets at risk. Equity, money paid for shares, never has to be repaid and shares the risk of failure with the investor, but the investor owns part of the business for good, with a claim on every future profit and on the price if it is sold.

      The legal form matters here (1.2). A sole trader or the partners in an ordinary partnership have unlimited liability, so the business's debts are their personal debts. Only a company can sell shares, and its shareholders have limited liability. That is one reason founders who need outside investment form a company early.

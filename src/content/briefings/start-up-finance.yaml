  - id: bootstrapping-friends-family
    title: Bootstrapping, friends and family
    ib: ['3.2']
    enrichment: true
    body: |
      Bootstrapping means building a business on the founders' own money and the money the business earns, with no outside investors. In IB terms it uses personal funds and, once there are profits, retained profit (3.2). It keeps the founders in full control and forces discipline: every expense has to be justified by revenue. Its costs are slower growth, a founder's savings at risk, and the danger that a better-funded rival takes the market first.

      Bootstrappers have well-worn ways of making a little money go a long way. Customers can fund the business by paying in advance. Equipment can be leased rather than bought, which spreads its cost. Suppliers can be asked for trade credit. Founders can delay paying themselves, and the business can start small, in one area or with one product, and grow from its own revenue.

      Friends and family are often the first outside money, because they invest in the founder rather than the idea. That makes the money easier to get and harder to handle. Write the terms down, whether it is a loan with a repayment date or shares with a stated percentage; say plainly what happens if the business fails; and take only what each person could afford to lose.
    points:
      - term: Customer funding
        text: Subscriptions paid at the start of the month, deposits and pre-orders bring cash in before the costs are paid.
      - term: Lease, do not buy
        text: Leasing (3.2) turns a large one-off cost into monthly payments, keeping cash for the months before sales arrive.
      - term: Revenue-funded growth
        text: Growing only as fast as the business's own earnings allow. Slower, but nothing is owed and nothing is given away.
  - id: angels-and-venture-capital
    title: Business angels and venture capital
    ib: ['3.2']
    enrichment: true
    body: |
      Business angels (3.2) are wealthy individuals who invest their own money in small or new businesses, usually in exchange for a share. Many have built businesses themselves and bring experience and contacts as well as money, and they often invest earlier and in smaller amounts than any fund would. The price is a share of the business and, usually, a say in how it is run.

      Venture capital is not in the guide. Venture capital funds invest other people's money, from pension funds, insurers and wealthy families, in young businesses that could grow very large. Because most such businesses fail or stay small, a fund needs its few successes to be big enough to pay for all the rest, so it looks only for businesses that could become very large, and it expects to sell its shares within a number of years through a sale of the business or a flotation. In exchange for its money it takes a substantial share, seats on the board and rights over future decisions.

      Each investment sells part of the business at a price, which sets its valuation. The founders own a smaller share after each round: their stake is diluted. Dilution is not a loss if the money makes the business worth more than the share given up, but founders who raise several rounds can end up owning a minority of the company they started.
    formulas:
      - { name: Post-money valuation, expression: 'Post-money valuation = amount invested ÷ share of the business sold', note: 'A standard investment calculation, not IB content.' }
      - { name: Pre-money valuation, expression: 'Pre-money valuation = post-money valuation − amount invested', note: 'Not IB content.' }
      - { name: Dilution, expression: 'Founders'' share after a round = share before × (1 − share sold in the round)', note: 'Not IB content.' }
    example:
      title: What Refill Round's angel paid for
      text: |
        A business angel invests $10,000 in Refill Round for 15% of the company. That values the whole company, after the investment, at 10,000 ÷ 0.15 = $66,667, and before it at $66,667 − $10,000 = $56,667. The founders keep 85%.

        If Refill Round later sells 25% of the enlarged company to new investors to open in a second city, everyone's share shrinks by a quarter: the founders' to 85% × 0.75 = 63.75%, the angel's to 15% × 0.75 = 11.25%. The founders gain from the deal only if the new money raises the value of the company by more than a third, because 85 ÷ 63.75 = 1.33. All figures are simulated.
    callout:
      tone: caution
      title: Venture capital suits few businesses
      text: |
        A refill service that could become a profitable regional business is a good business and a poor fit for a venture capital fund, which needs a chance of a very large return. Most new businesses are funded by their founders, their families, their customers and banks.
  - id: crowdfunding-and-loans
    title: Crowdfunding and loans
    ib: ['3.2']
    enrichment: true
    body: |
      Crowdfunding (3.2) raises money from many people, each putting in a modest sum, usually through a website set up for the purpose. The guide lists it without dividing it up, but founders meet four kinds. In rewards crowdfunding, backers pay in advance for a product or a reward, which makes it a form of pre-sale and a test of demand. In equity crowdfunding, they buy small shares. In debt crowdfunding, or peer-to-peer lending, they lend money for interest. In donation crowdfunding, they give, usually to a social cause. A campaign is public, which is marketing if it succeeds and a public failure if it does not.

      Loan capital (3.2) is borrowed for a fixed period, with interest, and repaid on a schedule. For a start-up its drawbacks are the security a lender asks for and the repayments, which begin at once, before sales have built up. Microfinance providers (3.2) lend small sums to people who cannot borrow from ordinary banks, often because they have no credit record or collateral. An overdraft covers short gaps between money going out and coming in, at a high rate of interest, and the bank can withdraw it.

      The guide also asks which short- or long-term source suits a situation (3.2, AO3). The rule of thumb is to match the finance to the need: a long-lived asset such as a vehicle or a machine is funded by a loan or a lease spread over its life; a temporary gap, such as waiting for a large customer to pay, by an overdraft or trade credit. Funding long-term spending with short-term money is a common way for a growing business to run out of cash.
    example:
      title: "Refill Round's mix, and its gap"
      text: |
        Refill Round raises $45,000: $10,000 of the founders' savings, a $6,000 family loan repaid after two years, a $15,000 bank loan repaid at $460 a month, $10,000 from a business angel for 15%, and $4,000 of rewards crowdfunding as pre-paid boxes. So 47% of the money is borrowed, 22% is the founders' own, 22% was paid for in shares and 9% is owed back to customers as boxes.

        The start-up cost calculator shows a funding gap of about $4,275 at its lowest point. An overdraft would suit it if the forecast is right, because the gap is temporary; a second investment from the angel would avoid interest but dilute the founders again; the founders could instead delay their own pay. Each choice moves the risk somewhere else. All figures are simulated.
  - id: choosing-the-mix
    title: 'Choosing the mix: match the money to the stage and the need'
    ib: ['3.2', '1.2']
    enrichment: true
    body: |
      The right source changes as a business grows. At the idea stage almost nobody outside will invest, so the money comes from the founders, their families and sometimes grants or competitions. Once there is evidence that customers will pay, business angels, crowdfunding and small loans become possible. A business with steady sales and assets can borrow from banks on better terms; one with the potential for very fast growth may attract venture capital. A mature business funds itself from retained profit, larger loans and, if it becomes a publicly held company (1.2), shares sold to the public.

      Five questions help a founder choose. How much is needed, including a margin for things going wrong? For how long, and for what, so that the finance can be matched to the need? What will it cost, in interest, in shares or in obligations? How much control are the founders willing to share, and with whom? And what happens to each funder, and to the founders, if the business fails?
    points:
      - term: Idea stage
        text: Personal funds, friends and family, grants. Little evidence, so little outside money.
      - term: Early customers
        text: Business angels, crowdfunding, microfinance and small loans, often secured on the founders' own assets.
      - term: Growth
        text: Bank loans for businesses with steady sales and assets; venture capital for the few aiming to become very large.
      - term: Maturity
        text: Retained profit, larger loans and, for a publicly held company (1.2), shares sold to the public.

questions:
  - q: What three things does a business model explain?
    a: How the business creates value for customers, how it delivers that value, and how it captures some of it as revenue.
  - q: Which blocks of the canvas describe value for the customer, and which describe the efficiency of the business?
    a: The right-hand blocks (customer segments, value propositions, channels, customer relationships and revenue streams) describe value for the customer. The left-hand blocks (key resources, key activities, key partners and the cost structure) describe how the business delivers it.
  - q: Refill Round's riskiest assumption is that subscribers stay about a year. Design an MVP to test it.
    a: A paid pilot of a few months with a small group of households, served by hand, with a success criterion set in advance, such as at least 30 of 40 households still paying after three months.
  - q: Give two limitations of the Business Model Canvas.
    a: It leaves out the competition and the founders; it says nothing about when cash comes in and goes out or how the start is funded; and it ignores the costs a business imposes on others unless they are added.
  - q: Why does a landing-page test raise an ethical question, and how can a founder handle it?
    a: Customers may believe they are buying a product that does not yet exist. Saying clearly that it is not yet available, and refunding any money taken, keeps the test honest.

# Briefing 2 of the Entrepreneurship and Innovation Lab. Written in the
# platform's own words. Business models, the Business Model Canvas (Alexander
# Osterwalder with Yves Pigneur) and the lean start-up (associated with Eric
# Ries, building on Steve Blank's customer development) are not in the IB
# guide: enrichment. IB connections checked against the guide: the toolkit's
# circular business models (p. 14), costs and revenue streams (3.3, pp. 28 to
# 29), marketing planning (4.2, p. 31), the marketing mix (4.5, pp. 31 to 32)
# and lean production (5.3, HL, p. 34). Refill Round is fictional; its
# figures are simulated.
title: Business models, the canvas and the lean start-up
order: 2
dek: How a business creates, delivers and captures value; the Business Model Canvas as a one-page map of that logic; and the lean start-up's way of testing it with a minimum viable product.
question: Which part of the model would sink the business if it were wrong, and how can you find out cheaply?
introduction: |
  Two businesses can sell the same product and be entirely different businesses. One sells power drills; another rents them by the day; a third sells the holes, as a fitting service. Each has different customers, costs, cash flows and risks. The difference is the business model: the logic by which a business creates value for customers, delivers it, and captures some of it as revenue.

  This briefing gives three tools for working on a business model before it is built: a vocabulary of common models, the Business Model Canvas for setting a model out on one page, and the lean start-up method for testing the riskiest parts of the model with a minimum viable product.
ibSummary: >
  Business models, the Business Model Canvas and the lean start-up are not in the guide, so this briefing is
  enrichment. It connects to IB content throughout: revenue streams and costs (3.3), segmentation, targeting and the
  USP (4.2), the marketing mix (4.5), the toolkit's circular business models, and market research (4.4), which the
  lean start-up uses to test its assumptions.
sections:
  - id: what-a-business-model-is
    title: What a business model is
    enrichment: true
    connects: ['1.1', '3.3']
    body: |
      A business model answers three questions. How does the business create value: what does it do that someone values? How does it deliver that value: through which activities, resources and channels? And how does it capture value: who pays, for what, and how much, so that the business earns more than it costs to run?

      Most businesses use one of a handful of patterns, or a mix of them. Each pattern rests on a different set of conditions that must hold for it to work, and that is where its risks lie. A subscription business lives or dies by how long customers stay; a marketplace needs enough buyers and sellers at the same time; a freemium product needs enough free users to become paying ones. Choosing a model is choosing which of those conditions to bet on.

      Circular business models, which are part of the IB toolkit, are business models in exactly this sense. A product service system, in which the customer pays to use a product that the business keeps owning, captures value through use rather than sale, and turns long-lasting products from a threat to repeat sales into a source of profit.
    table:
      caption: Common business models and what each depends on
      corner: Model
      columns: [How it earns revenue, What has to be true]
      rows:
        - label: Product sale
          cells: ['Customers pay once for each item', 'Enough margin on each sale to cover the fixed costs, and a steady flow of new or returning customers']
        - label: Subscription
          cells: ['Customers pay regularly until they cancel', 'Customers stay long enough to repay what it cost to win them']
        - label: Marketplace
          cells: ['A commission on sales between buyers and sellers', 'Enough buyers and sellers at the same time, each attracting the other']
        - label: Freemium
          cells: ['A free basic version, with some users paying for more', 'Enough free users become paying ones to cover the cost of serving everyone']
        - label: Consumables
          cells: ['A durable item sold cheaply, with the profit on refills or parts', 'Customers keep buying the consumable from you rather than a rival']
        - label: Product as a service
          cells: ['Customers pay to use a product the business still owns', 'Products last and come back, and the business can fund the stock up front']
        - label: Advertising
          cells: ['Advertisers pay to reach the users', 'A large, engaged audience that advertisers value']
    callout:
      tone: framework
      title: Every model is a list of things that must be true
      text: |
        Write the model as statements that have to hold: customers will pay $24 a month; 8% of them leave each month; a box costs $9.10 to fill and deliver. The founder's job is to find out, as cheaply as possible, which of those statements are true. The canvas makes the list; the lean start-up tests it.
  - id: business-model-canvas
    title: The Business Model Canvas
    enrichment: true
    connects: ['3.3', '4.2', '4.5']
    body: |
      The Business Model Canvas, devised by Alexander Osterwalder with Yves Pigneur, sets a business model out on one page in nine blocks. The blocks on the right describe value for the customer: who the customers are, what the business offers them, how it reaches them, how it keeps them and what they pay. The blocks on the left describe how the business delivers that value efficiently: what it must have, what it must do, who it depends on and what it all costs.

      Its strength is that it shows the model as a system. Change the customer segment and the channels, the relationships and the price may all have to change; add a delivery service and the key activities, resources and costs move with it. Because it fits on one page, it is quick to redraw, so a founder can sketch three alternative models in an afternoon and compare them.

      It is best filled from the customer outwards, in short statements, each of which could be tested. Many teams write each entry on a sticky note so it can move, and mark which entries are assumptions and which are backed by evidence: that is what turns the canvas from a description into a plan of what to test.
    points:
      - term: Customer segments
        text: The groups the business serves. This is where the guide's segmentation and targeting (4.2) come in.
      - term: Value propositions
        text: What the business does for each segment that it values. The USP and differentiation (4.2) belong here.
      - term: Channels
        text: How customers find out, buy and receive. Promotion and place in the marketing mix (4.5).
      - term: Customer relationships
        text: How customers are won, kept and grown. For a service, the people and processes of the extended marketing mix (4.5).
      - term: Revenue streams
        text: 'What customers pay for, how and how much: the revenue streams of 3.3.'
      - term: Key resources, activities and partners
        text: What the business must have, what it must do well and who it depends on. Operations (unit 5) lives here.
      - term: Cost structure
        text: The costs the model creates, fixed and variable (3.3), and what drives each.
    example:
      title: What Refill Round's canvas shows
      text: |
        Refill Round's canvas has 18 entries, and only six are backed by evidence: the segment (from a survey), the main value proposition (from interviews), quotes for the bottles, the bikes and the unit, the signed supply of concentrate, and the fixed costs. Its two riskiest assumptions are the ones its unit economics rest on: that subscribers stay about a year, and that they will pay $24 a month. Both are rated critical, and neither can be checked without real customers paying real money. All figures are simulated; the whole canvas is in the [canvas builder](/entrepreneurship-lab/business-model-canvas/).
    callout:
      tone: caution
      title: What the canvas leaves out
      text: |
        Nine blocks leave out the competition, the founders, the money needed to start and when cash comes in and goes out. They also leave out the costs a business imposes on others, such as waste and emissions, unless you add them. Use the canvas beside a competitor analysis, the start-up cost calculator and a business plan, not instead of them.
  - id: lean-start-up
    title: 'The lean start-up: build, measure, learn'
    enrichment: true
    connects: ['4.4', '5.3']
    body: |
      The lean start-up is a method for building a new business under extreme uncertainty, associated with Eric Ries and building on Steve Blank's work on customer development. It takes its name from lean production, the approach to cutting waste that the IB course teaches at HL (5.3): the waste it cuts is time and money spent building something customers do not want.

      Its core is a loop. Turn the riskiest assumption into a hypothesis that could be shown false; build the smallest thing that will test it; measure what real customers do; learn whether the hypothesis held; and decide whether to persevere with the model or pivot, changing one part of it while keeping what has been learned. The faster a team goes round the loop, the less it spends finding out what does not work.

      What counts as learning is evidence about behaviour, measured against a success criterion set in advance. Sign-ups that turn into paying customers, customers who return, and customers who recommend the product are learning; total visitors, downloads and likes, which rise whether or not the model works, are what start-up writers call vanity metrics.
    points:
      - term: Hypothesis
        text: An assumption written so that it could be shown false, such as "at least 30 of 40 pilot households will still be paying after three months".
      - term: Experiment
        text: The cheapest test that could prove the hypothesis wrong, with the measure and the pass mark chosen before it starts.
      - term: Pivot
        text: A change to one part of the model, such as the customer segment, the channel or the revenue model, based on what the experiments showed.
      - term: Persevere
        text: Keep the model and test the next riskiest assumption.
    callout:
      tone: caution
      title: Where lean has limits
      text: |
        Not every business can test cheaply. A new medicine, an aircraft part or a food product must meet safety rules before any customer sees it, and some products only make sense when complete. Testing also has an ethical side: an experiment must not mislead customers about what they are buying, how their data is used or whether the product exists yet.
  - id: minimum-viable-product
    title: The minimum viable product
    enrichment: true
    connects: ['4.4']
    body: |
      A minimum viable product, or MVP, is the smallest thing a team can put in front of real customers to test its riskiest assumption with real behaviour. It is an experiment, not a cheap first version of the final product. Sometimes it is not a product at all: a landing page that takes pre-orders, a service delivered by hand to ten customers, or a pilot run from borrowed equipment.

      The right MVP depends on the assumption. To test whether people want the offer, a landing page may be enough. To test whether they keep paying, nothing short of a pilot over several months will do. To test whether the service can be delivered at the planned cost, the founders must actually deliver it, at some volume, and count the costs. Choose the MVP that tests the assumption at the top of the risk list, not the one that is most fun to build.
    table:
      caption: Kinds of minimum viable product
      corner: MVP
      columns: [What it tests, What to watch]
      rows:
        - label: Landing page
          cells: ['Whether people sign up or pay for an offer as described', 'Interest is not use. Say clearly if the product is not yet available, and refund anything taken.']
        - label: Concierge
          cells: ['Whether the service solves the problem, delivered by hand to a few customers', 'It shows nothing about whether the service can be delivered at scale or at the planned cost.']
        - label: Behind-the-scenes manual
          cells: ['Whether customers use a service that looks automated but is run by people', 'Customers must not be misled about how their information is handled.']
        - label: Pre-sales
          cells: ['Whether customers will pay before the product exists', 'It creates an obligation to deliver, and a failed campaign is public.']
        - label: Pilot
          cells: ['Whether a small group keeps using and paying over time', 'Samples are small, and early customers are keener than the mass market.']
    example:
      title: Refill Round's pilot
      text: |
        Refill Round's riskiest assumption is that subscribers stay about a year. A landing page cannot test that, so the founders design a three-month paid pilot: 40 households in two postcodes, bottles washed in a commercial kitchen hired by the hour, deliveries by the founders on borrowed bikes. It costs a fraction of the bikes and the unit, and it also tests the $24 price.

        The success criterion is set before the pilot starts: at least 30 of the 40 households still paying after three months, which would mean fewer than about 9% leaving each month. Fewer than 30, and the founders change the offer before they spend the $27,200 the full launch needs. All figures are simulated.

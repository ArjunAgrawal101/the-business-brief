misconceptions:
  - claim: A business model is the same as a business plan.
    correction: A business model is the logic of how the business creates and captures value. A business plan is a document that sets out the model together with the market, operations, people and finances, usually to persuade someone to fund it. A canvas takes an hour; a plan takes weeks.
  - claim: A minimum viable product is the first version of the product, built cheaply.
    correction: It is an experiment to test the riskiest assumption with real customer behaviour. Sometimes it is not a product at all, but a landing page, a pre-order or a service delivered by hand.
  - claim: A pivot means the founders failed.
    correction: A pivot keeps what has been learned and changes one part of the model. Persevering with a model the evidence contradicts is the real failure.
terms:
  - { term: Business model, definition: 'The logic by which a business creates value for customers, delivers it and captures some of it as revenue.' }
  - { term: Business Model Canvas, definition: 'A one-page template, devised by Alexander Osterwalder with Yves Pigneur, that sets out a business model in nine blocks.' }
  - { term: Lean start-up, definition: 'A method for building a new business by testing its riskiest assumptions in quick, cheap experiments with real customers.' }
  - { term: Minimum viable product (MVP), definition: 'The smallest thing that can be put in front of real customers to test an assumption with their behaviour.' }
  - { term: Pivot, definition: 'A change to one part of a business model, based on evidence, that keeps what has been learned.' }
  - { term: Vanity metric, definition: 'A number that rises whether or not the business model works, such as total visitors or downloads.' }
  - { term: Freemium, definition: 'A model in which a basic version is free and customers pay for more features or capacity.' }

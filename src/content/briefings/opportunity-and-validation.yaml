# Briefing 1 of the Entrepreneurship and Innovation Lab. Written in the
# platform's own words. IB status checked against the guide: entrepreneurship
# and starting up (1.1, p. 23), market orientation (4.1, p. 31), market
# research (4.4, p. 31), the USP and
# differentiation (4.2, p. 31), SWOT and STEEPLE in the toolkit (p. 14).
# Customer discovery, market validation and the value proposition are
# enrichment. Refill Round and its city are fictional; every figure is
# simulated and agrees with the Lab's tools.
title: Finding and testing an opportunity
order: 1
step: Spot and test the opportunity
dek: Where start-up ideas come from, how to find out whether customers really have the problem, and how to say what you offer them in words they would recognize.
question: Is this a problem people will pay to have solved?
introduction: |
  Most new businesses begin with a solution: an app, a product, a shop the founder would like to run. The ones that last more often begin with a problem: something people struggle with often enough, and care about enough, to pay for a better answer. This briefing covers the work between an idea and a business: spotting opportunities, testing them with the people who would pay, and putting what you offer into words.

  None of that work needs much money. It needs conversations, observation and honesty about what you hear. The aim is to find out, cheaply and early, whether the opportunity is real, before the founder's savings are spent finding out the expensive way.
ibSummary: >
  Entrepreneurship and the challenges and opportunities of starting up a business are IB content (1.1, AO2), and so
  are the market research methods that customer discovery relies on (4.4) and the USP that a value proposition
  builds on (4.2). Customer discovery, market validation and the value proposition as a design tool are enrichment.
sections:
  - id: where-opportunities-come-from
    title: Where opportunities come from
    ib: ['1.1']
    enrichment: true
    body: |
      An opportunity is not the same as an idea. An idea is a possible product; an opportunity is a situation in which a particular group of people has a need, cares enough to pay or switch to have it met, and can be reached at a cost below what they would pay. Many good ideas are poor opportunities, because too few people have the problem, or they have it but will not pay, or the only way to reach them costs more than they spend.

      Opportunities usually come from change. A new law creates a need for compliance; a technology makes something cheap that used to be expensive; a price rise makes people look for substitutes; a shift in attitudes creates demand that existing businesses are slow to serve. That is why the toolkit's [STEEPLE analysis](/toolkit/steeple-analysis/) is a good place to look for them, and why a founder's own frustration is often the start: someone close to a problem notices change before the market does.

      The guide asks you to analyse the opportunities and challenges of starting up a business (1.1, AO2). The opportunities below are the common sources; the challenges, from raising finance to winning the first customers, are what the rest of the Lab helps you test.
    points:
      - term: A change in the environment
        text: New laws, technologies, prices and attitudes create needs that did not exist before. A STEEPLE analysis is a systematic way to look for them.
      - term: A problem you have yourself
        text: It gives a founder insight and commitment. But one person's problem is not a market until other people are shown to share it.
      - term: A gap in the market
        text: A need that existing businesses ignore or meet badly. The test is whether the gap is empty because nobody has noticed it, or because there is no money in it.
      - term: An underserved niche
        text: A small, well-defined group whose needs mass-market products do not fit. A [niche market](/glossary/niche-market/) (4.2) can suit a small business that serves it well.
      - term: A cheaper or better way
        text: Technology or a new process can make something affordable that used to be expensive, or let a small business do what only large ones could.
    callout:
      tone: framework
      title: Idea or opportunity?
      text: |
        An idea becomes an opportunity when four things are true: a defined group of people has the problem; it matters enough that they would pay or switch; there is a way to reach them that costs less than they would pay; and the timing is right. Customer discovery tests the first two, market validation tests the money, and the unit economics calculator tests the third.
  - id: customer-discovery
    title: 'Customer discovery: test the problem before the product'
    ib: ['4.1', '4.4']
    enrichment: true
    body: |
      Customer discovery means talking to and watching potential customers to understand their problem before building anything. The idea, which comes from start-up practice rather than the IB course, is simple: the founder's beliefs about customers are hypotheses, and the people who would pay are the only ones who can confirm them. In the guide's terms (4.1), starting from the product is product orientation and starting from the customer is market orientation; customer discovery is market orientation practised before the business exists.

      Its tools are the guide's methods of primary research (4.4): interviews, observations, surveys and focus groups. What makes customer discovery different is what it asks. People are poor at predicting what they will do and kind enough to tell founders what they want to hear, so good questions ask about past behaviour, current spending and real decisions, never about hypothetical futures. The best evidence that a problem is real is that people have already tried to solve it: they have paid for a workaround, built a spreadsheet, or put up with something annoying every week.

      The sampling method matters too (4.4). Interviewing people at a market, or friends of friends, is convenience sampling: quick and cheap, but the people you meet may not be typical of the customers you need. Say who you spoke to, and treat the results as clues rather than measurements.
    table:
      caption: Questions that mislead, and questions that reveal
      corner: Instead of asking
      columns: [Ask, Why]
      rows:
        - label: Would you use a refill delivery service?
          cells: ['When did you last buy cleaning products, and where?', 'People predict their own behaviour badly. Past behaviour is evidence.']
        - label: Do you care about plastic waste?
          cells: ['What have you done about it in the past month?', 'Almost everyone agrees with a value when asked. Actions show how much it matters.']
        - label: How much would you pay?
          cells: ['What do you spend on this now?', 'A stated price is a guess. Current spending is a fact.']
        - label: Is this a good idea?
          cells: ['What would stop you using something like this?', 'Inviting praise teaches nothing. Objections reveal the real barriers.']
    example:
      title: Refill Round goes to market
      text: |
        Before spending anything, the founders of Refill Round, a fictional start-up, spent two weekends at local markets. They asked 120 shoppers four short questions, a convenience sample that leans towards people who already shop at markets, and held longer interviews with 25 people who said they had tried refilling their cleaning products.

        The interviews changed the idea. The founders had assumed price was the barrier. Eighteen of the 25 said the real problem was the trip to the city's one refill shop, which closes at five; price came up twice. Refill Round became a delivery service rather than a cheaper refill shop. All figures are simulated.
  - id: market-validation
    title: 'Market validation: evidence that people will pay'
    ib: ['4.4']
    enrichment: true
    body: |
      Customer discovery shows that people have a problem. Market validation asks the harder question: will enough of them pay you, at a price that can sustain the business, to solve it? The answer comes from experiments that ask customers to commit something real, and from an honest estimate of how many such customers you can reach.

      Evidence varies in strength. What people say is the weakest kind; what they do is stronger; what they commit, such as time, a deposit or a signed letter, is stronger still; and what they pay is the strongest of all. A validation experiment should aim as high up that ladder as it can, and should set its success criterion before it starts: decide in advance what result would mean the idea is wrong, because founders, like everyone, tend to notice the evidence that supports what they already believe.

      For the size of the opportunity, secondary research (4.4), such as government publications and market analyses, gives the number of potential customers. Build the estimate up from the customers you can actually reach and serve, rather than taking a share of the whole market: a forecast that says "if we win just 1% of the national market" is not evidence of anything.
    points:
      - term: What people say
        text: Survey answers, compliments, likes. Useful for finding questions to test, weak as proof.
      - term: What people do
        text: Sign-ups, return visits, time spent, the workarounds they already use.
      - term: What people commit
        text: A deposit, a letter of intent from a business customer, a place on a pilot, an introduction to a colleague.
      - term: What people pay
        text: Pre-orders, a paid pilot, repeat purchases. The strongest evidence there is.
    example:
      title: Sizing Refill Round's market from the bottom up
      text: |
        The city's housing survey, a fictional source for this example, lists about 38,000 households in flats within 5 km of the centre, the area two cargo bikes can cover. If the market survey's 62 in 120 holds for them, about 19,600 households might consider a refill delivery. The founders assume only one in ten of those would actually subscribe in the first year, about 1,960 households, and set their first-year target at 530 subscribers, roughly a quarter of that.

        Then they test the assumption that matters most. A landing page offers the first month at $24, paid in advance, and the founders decide beforehand that fewer than 40 pre-orders in a month means the price or the offer is wrong. All figures are simulated.
    callout:
      tone: caution
      title: Confirmation bias
      text: |
        Founders hear what they hope to hear. Write down before each test what result would count as failure, ask someone sceptical to read the questions, and report the results that disappointed you alongside the ones that did not.
  - id: value-propositions
    title: 'Value propositions: what you do for customers, in their words'
    ib: ['4.2']
    enrichment: true
    body: |
      A value proposition states, for a particular group of customers, the problem you solve or the job you do for them, what changes when they use you, and why that is better than the alternatives, including doing nothing. It is written in the customer's language, not the founder's: customers do not buy "an app-based last-mile refill logistics platform"; they buy not having to think about running out of washing-up liquid.

      It is related to, but wider than, the [unique selling point](/glossary/unique-selling-point/) of the IB course (4.2). The USP is the feature or benefit that sets a product apart from competitors; the value proposition is the whole promise to a segment, of which the USP is usually one part. Writing it well also forces a choice of segment, which the guide's segmentation and targeting (4.2) make explicit: a proposition that tries to speak to everyone usually persuades no one.

      A useful form is: for a named segment who has a named problem, the offer gives a named benefit, unlike the main alternative, which has a named weakness. Each blank is an assumption, and each can be tested in customer interviews before a product exists.
    points:
      - term: Features and benefits
        text: A feature is what the product has; a benefit is what changes for the customer. Lead with the benefit and use the feature as the proof.
      - term: The alternatives
        text: Customers always have one, even if it is putting up with the problem. A proposition that ignores the alternatives cannot say why anyone would switch.
      - term: Specific enough to test
        text: '"Saves time" cannot be tested; "no trip to a refill shop, ever" can.'
    example:
      title: Refill Round's value proposition
      text: |
        For households in city flats who want to stop buying plastic bottles but cannot get to a refill shop, Refill Round delivers refills in reusable bottles to the door every month, so going plastic-free takes no trip and no planning. Unlike a refill shop, it comes to you; unlike supermarket eco ranges, nothing is thrown away.

        Each part is testable: the segment (households in flats), the problem (the trip, which the interviews found), the benefit (no trip, no planning) and the comparison. The claim the founders cannot yet support, that it is cheaper per wash over a year, is left out until they can.

questions:
  - q: What turns an idea into an opportunity?
    a: Evidence that a defined group of people has the problem, cares enough to pay or switch, and can be reached at a cost below what they would pay, at a time when the market is ready.
  - q: Why is "Would you use this?" a weak interview question, and what would you ask instead?
    a: It asks people to predict their own future behaviour, which they do badly and politely. Ask about the past instead, such as the last time they had the problem, what they did and what it cost.
  - q: 'Put these in order of strength as evidence: a pre-order, a survey answer, a sign-up to a waiting list.'
    a: The survey answer is weakest (what people say), then the sign-up (what people do), then the pre-order (what people pay).
  - q: How does a value proposition differ from a USP?
    a: The USP (4.2) is the feature or benefit that sets a product apart from competitors. A value proposition is the whole promise to a particular segment, covering the problem, the benefit and why it beats the alternatives; the USP is usually one part of it.
  - q: Refill Round's survey found that 62 of 120 shoppers would consider a refill delivery. Why would it be a mistake to plan on half the city subscribing?
    a: Saying they would consider it is weak evidence, and a convenience sample at markets over-represents people who already shop that way. The founders assume only one in ten of the interested households would subscribe, and test even that with paid pre-orders.

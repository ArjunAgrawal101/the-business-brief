misconceptions:
  - claim: If people say they like the idea, the market is validated.
    correction: Opinions are the weakest evidence. People are polite and poor at predicting what they will do. Look for behaviour, commitments and, best of all, payment.
  - claim: A big market means a big opportunity.
    correction: What matters is the part of the market you can reach, win and serve at a profit. A small, well-defined niche you can reach cheaply is often a better start than a huge market full of established rivals.
  - claim: A value proposition is a list of features.
    correction: Features describe the product. A value proposition describes what changes for a particular customer, and why that beats the alternatives, including doing nothing.
terms:
  - { term: Customer discovery, definition: 'Interviewing and observing potential customers to understand their problem, and how they deal with it now, before building a solution.' }
  - { term: Market validation, definition: 'Gathering evidence, ideally commitments and payments, that enough customers will buy at a price that can sustain the business.' }
  - { term: Value proposition, definition: 'A statement of what a business does for a particular customer segment, and why that is better than the alternatives.' }
  - { term: Confirmation bias, definition: 'The tendency to notice, remember and believe evidence that supports what we already think.' }

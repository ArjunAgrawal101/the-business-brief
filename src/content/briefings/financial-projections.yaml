# Briefing 4 of the Entrepreneurship and Innovation Lab. Written in the
# platform's own words. IB status checked against the guide: total revenue
# and revenue streams (3.3, p. 29), cash flow (3.7, pp. 29 to 30), break-even
# (5.5, p. 34) and, at HL, sales forecasting (4.3, p. 31). Bottom-up
# forecasting, scenarios, burn rate and runway are enrichment. Refill Round is
# fictional; its figures are simulated and match the revenue planner and the
# start-up cost calculator. Worked: subscribers 45, then 45 − 4 + 48 = 89,
# then 89 − 7 + 51 = 133, then 133 − 11 + 54 = 176; cash at launch
# 45,000 − 27,200 = 17,800; 17,800 ÷ 5,050 = 3.52 months with no sales.
title: 'Financial projections: forecasting a business that does not exist yet'
order: 4
step: Forecast the numbers
dek: How to forecast sales, costs, cash and break-even for a business with no history, and how to make the forecast honest about its own uncertainty.
question: What has to be true for these numbers to happen, and what happens if it is not?
introduction: |
  Every start-up's financial projections turn out wrong. What matters is how wrong, in which direction, and whether the founders knew which assumptions mattered most. Projections are not predictions. They are a model that links the decisions a founder controls, such as price, spending and hiring, to the results they hope for, such as sales, profit and cash, so that each assumption can be seen, questioned and tested.

  This briefing covers the three projections a start-up needs, of sales, of profit and of cash, built from the bottom up, and how to read them with the scepticism a lender or investor will bring.
ibSummary: >
  Total revenue and revenue streams (3.3), the difference between profit and cash flow and cash flow forecasts
  (3.7), and break-even analysis (5.5) are IB content, and at HL so are the benefits and limitations of sales
  forecasting (4.3). Bottom-up forecasting, scenario ranges, burn rate and runway are enrichment.
sections:
  - id: forecasting-sales
    title: Forecasting sales from the bottom up
    ib: ['3.3', '4.3']
    enrichment: true
    body: |
      There are two ways to forecast a new business's sales. Top-down starts with the size of the market and assumes a share of it. Bottom-up starts with what the business will actually do: how many people it can reach, how many of them will buy, how often and at what price. Bottom-up is more useful to a start-up, because every number in it is tied to something the founders control and can measure, so each one can be tested and updated as evidence comes in.

      Forecast each revenue stream separately (3.3). A stream sold by the unit is units times price. A subscription builds up: each month's subscribers are last month's, minus those who cancelled, plus those who joined, and revenue is subscribers times the monthly price. Small differences in churn compound, which is why a subscription forecast is so sensitive to it.

      At HL, the guide asks for the benefits and limitations of sales forecasting (4.3, AO3). For a start-up both are sharp. A forecast lets the founders plan stock, staff and cash, and shows a lender how a loan will be repaid. But with no sales history there is no trend to extend, so the forecast rests on assumptions, and the people making them are usually the most optimistic people in the room.
    points:
      - term: Top-down
        text: Market size times an assumed share. Quick, and useful as a ceiling, but hard to test and easy to inflate.
      - term: Bottom-up
        text: Reach times conversion times price, stream by stream. Slower to build, but every assumption can be checked.
      - term: Conversion rate
        text: The share of people who take the next step, such as visitors who sign up or sign-ups who pay. Usually the most uncertain number in a bottom-up forecast.
      - term: Seasonality
        text: Regular rises and falls within the year. A start-up that launches in its busiest month will mistake the season for growth.
    example:
      title: How Refill Round's subscribers build up
      text: |
        Refill Round forecasts 45 new subscribers in month 1, rising 6% a month, with 8% of existing subscribers cancelling each month. Customers come in whole numbers, so each figure is rounded.

        Month 1: 45 join, so 45 subscribers. Month 2: 8% of 45 is 3.6, so 4 cancel; 48 join; 45 − 4 + 48 = 89. Month 3: 8% of 89 is 7.12, so 7 cancel; 51 join; 89 − 7 + 51 = 133, paying $24 each, $3,192. By month 12 the forecast has 529 subscribers, and it has lost 232 along the way: every cancellation had to be replaced before the total could grow. All figures are simulated; the [revenue planner](/entrepreneurship-lab/revenue-planner/) works the whole year.
  - id: costs-and-break-even
    title: Costs, profit and break-even
    ib: ['3.3', '5.5']
    body: |
      A cost forecast sorts costs by how they behave (3.3). Fixed costs, such as rent, insurance and salaries, stay the same whatever the sales in the period; variable costs, such as materials, packaging and delivery, rise with each unit sold. A start-up's fixed costs arrive before its sales do, which is why the first months show losses even when every sale is made at a profit.

      Break-even analysis (5.5) joins the two. The break-even quantity is the fixed costs divided by the contribution per unit, rounded up, because one unit fewer would leave a loss; the margin of safety is how far forecast sales are above it. For a subscription business the same logic applies per month, with a subscriber as the unit.

      The guide also asks for the limitations of break-even (5.5, AO3), and a start-up meets most of them at once. It sells several products at different contributions, so there is no single contribution per unit; its prices and costs change as it learns; and its fixed costs step up as it grows, when it needs a second bike, a larger unit or its first employee.
    formulas:
      - { name: Break-even quantity, expression: 'Break-even quantity = fixed costs ÷ contribution per unit', note: 'Required by 5.5 (AO2, AO4). The guide''s formula list does not print it.' }
      - { name: Margin of safety, expression: 'Margin of safety = forecast output − break-even output', note: 'Required by 5.5 (AO2, AO4).' }
    example:
      title: When does the box break even?
      text: |
        Refill Round's fixed costs are about $4,590 a month: its monthly outgoings of $5,050 less the loan repayment, which mostly repays the loan rather than being a cost. Each subscriber contributes $14.90 a month. If the box were the only stream, it would break even at 4,590 ÷ 14.90 = 308.05, so 309 subscribers. The forecast passes that between months 7 (304) and 8 (348); the website and app orders bring the real break-even forward. All figures are simulated.
  - id: cash-is-not-profit
    title: 'Cash is not profit: the projection that keeps a start-up alive'
    ib: ['3.7']
    enrichment: true
    body: |
      Profit and cash flow are different things (3.7), and for a start-up the difference can be fatal. Equipment is paid for before it earns anything; stock is bought before it is sold; marketing spending to win a customer comes months before that customer's contribution; and business customers may pay 30 or 60 days after delivery. A start-up can be profitable on paper and still unable to pay its bills.

      The cash flow forecast (3.7) is the projection that catches this. Start-up founders describe the same position with two words of their own, which are not IB terms. The burn rate is how fast the business spends its cash: gross burn is the monthly outgoings, net burn is outgoings minus the money coming in. The runway is how many months the cash lasts at that rate. The decision they support is simple: raise more money, or cut the burn, well before the runway runs out, because raising money takes months.

      The guide's strategies for dealing with cash flow problems (3.7, AO3) apply directly. Lease rather than buy (3.2), negotiate trade credit with suppliers, ask customers to pay in advance, which a subscription does, delay spending that does not bring in revenue, and arrange finance before it is needed, not when it is.
    example:
      title: "Refill Round's runway"
      text: |
        Refill Round raises $45,000 and spends $27,200 on bikes, bottles, the washing unit and the launch, leaving $17,800. Its monthly outgoings are $5,050. With no sales at all, the cash would last 17,800 ÷ 5,050 = 3.5 months.

        With the expected contribution, starting at $1,400 in month 1 and growing 15% a month, the cash lasts longer but still runs out in month 6. Contribution first covers the monthly outgoings in month 11, and the lowest balance, at the end of month 10, is about $4,275 below zero. The founders need roughly that much more, and in practice more than that as a margin for error, before they launch. All figures are simulated; the [start-up cost calculator](/entrepreneurship-lab/start-up-costs/) draws the chart.
  - id: honest-forecasts
    title: Scenarios, sensitivity and honest forecasts
    ib: ['4.3']
    enrichment: true
    body: |
      An honest forecast says how uncertain it is. The simplest way is three cases: cautious, expected and optimistic, each with its own assumptions written down. A lender reads the cautious case first, because it shows whether the loan can be repaid if things go badly; an investor reads the optimistic case to see what the business could become, and then checks whether the path to it is believable.

      Sensitivity analysis goes further: change one assumption at a time and see how much the result moves. The assumptions that move it most are the critical ones, and they deserve the most testing before money is committed. For most start-ups they are the conversion rate, the growth rate, the churn rate and the time it takes to win the first customers.

      Some errors recur so often that lenders look for them: growth that starts slowly and then turns sharply upwards with no reason given; sales counted before customers have paid; payment terms forgotten; taxes left out; capacity assumed to be used in full from the first month; and costs that never rise even as the business grows.
    points:
      - term: Scenario
        text: A consistent set of assumptions describing one possible future, such as a cautious case.
      - term: Sensitivity analysis
        text: Changing one assumption at a time to see which ones the result depends on most.
      - term: Milestone
        text: A dated point at which evidence will update the forecast, such as the end of a pilot.
    callout:
      tone: exam
      title: In an IB answer
      text: |
        This is the platform's guidance, not an official markscheme. When you evaluate a forecast or a cash flow forecast in an answer, name the assumption that matters most, say why it is uncertain for this particular business, and show what happens to the conclusion if it is wrong. That earns more than a general list of the limitations of forecasting.

  - { term: Top-down forecast, definition: 'A sales forecast made by assuming a share of the whole market.' }
  - { term: Bottom-up forecast, definition: 'A sales forecast built from the business''s own activities: reach, conversion, price and frequency.' }
  - { term: Conversion rate, definition: 'The share of people at one stage who take the next step, such as visitors who buy.' }
  - { term: Burn rate, definition: 'How fast a start-up spends its cash. Gross burn is monthly outgoings; net burn is outgoings minus money coming in.' }
  - { term: Runway, definition: 'The number of months the cash will last at the expected burn rate.' }
  - { term: Sensitivity analysis, definition: 'Changing one assumption at a time to see how far the result moves.' }

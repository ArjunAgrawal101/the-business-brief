misconceptions:
  - claim: A profitable start-up cannot run out of cash.
    correction: Profit and cash differ (3.7). A start-up pays for equipment, stock and customer acquisition before the revenue arrives, and customers may pay late, so it can be profitable on paper and still unable to pay its bills.
  - claim: The optimistic case is the plan and the cautious case is a formality.
    correction: Lenders read the cautious case first, because it shows whether the loan can be repaid if things go badly. A plan that only survives the optimistic case is a bet.
  - claim: More detail makes a forecast more accurate.
    correction: A forecast is no better than its few key assumptions. Hundreds of lines can hide them; a good forecast makes them easy to find and test.

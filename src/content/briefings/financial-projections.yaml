questions:
  - q: Why is a bottom-up forecast usually more useful to a start-up than a top-down one?
    a: It is built from activities the founders control and can measure, such as marketing spending and conversion rates, so each assumption can be tested and updated. A share of a large market is hard to check.
  - q: Refill Round had 133 subscribers in month 3. With 8% churn and 54 new subscribers in month 4, how many does it have in month 4?
    a: 8% of 133 is 10.64, so 11 cancel; 133 − 11 + 54 = 176 subscribers.
  - q: With fixed costs of $4,590 a month and a contribution of $14.90 per subscriber, how many subscribers does the box need to break even on its own?
    a: 4,590 ÷ 14.90 = 308.05, so 309 subscribers. Break-even output is rounded up, because 308 would leave a small loss.
  - q: Give two reasons why a profitable start-up can run out of cash.
    a: Equipment and stock are paid for before the sales they make; the cost of winning a customer is paid before their contribution arrives; customers given credit pay later; and loan repayments take cash although only the interest is a cost.
  - q: 'HL: give one benefit and one limitation of sales forecasting for a start-up.'
    a: It lets the founders plan cash, stock and staff, and shows a lender how a loan will be repaid. But with no sales history there is no trend to extend, so the forecast rests on assumptions that are often optimistic.

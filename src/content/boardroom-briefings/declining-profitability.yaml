frameworks:
  - id: porters-generic-strategies
    use: Ask whether Kittiwake is a cost leader, a differentiator or focused on its region, and which response fits the answer.
  - id: contribution
    use: Judge each route by the contribution it makes towards the costs no single route causes.
  - id: force-field-analysis
    use: Weigh the forces for and against the cost programme, the unions' agreement above all.
  - id: balanced-scorecard
    use: Track the recovery on more than profit, including the load factor, relations with the workforce and the communities served.

tools:
  - { kind: calculator, id: profit-margin, use: Rework the profit margin for each year in Exhibit 1. }
  - { kind: calculator, id: roce, use: Rework the return on capital employed. }
  - { kind: calculator, id: contribution, use: Work a route's contribution from its revenue and direct costs (HL). }
  - { kind: studio, id: generic-strategies, use: Place Kittiwake against the low-cost airline and the national carrier. }
  - { kind: toolkit, id: porters-generic-strategies, use: The toolkit guide to the generic strategies (HL). }

beyond:
  - idea: Stuck in the middle
    body: >-
      Porter's argument that a firm must choose between lower cost and a valued difference, or risk earning less than
      rivals that choose, gives the board a test for each response: does it make Kittiwake cheaper than its rivals, or more
      valued by its passengers? The cost programme does the first; the region's routes may do the second.
    terms: [competitive-advantage, strategic-drift]
    sources: [bbr-porter-1980]

sources: [bbr-method, bbr-porter-1980]
method: >-
  Kittiwake Air, its people and its competitors are fictional, and every figure is simulated for teaching, though the
  cities it flies to are real. The profits, margins and ROCE in Exhibit 1, the load factors in Exhibit 2, the changes in
  Exhibit 3 and the contributions in Exhibit 4 are worked from the figures beside them; the effects in Exhibit 5 are built
  from Exhibit 4 and the finance team's stated estimates. The integrity check reworks every figure on every build.

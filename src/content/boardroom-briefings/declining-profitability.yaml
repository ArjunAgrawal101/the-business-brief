stakeholders:
  - name: The pension fund and the founders' families
    side: internal
    interest: high
    power: high
    wants: An airline that earns a fair return again and keeps its reputation in the region.
    implications: >-
      Every option needs their approval. Option C costs C$3.5m before it saves anything, which the owners must be willing
      to wait for.
  - name: Pilots and cabin crew, and their unions
    side: internal
    interest: high
    power: high
    wants: Secure jobs, fair pay and rosters they can live with.
    implications: >-
      Option C saves C$3.9m only if the unions agree new rosters, so it gives them great influence over the result.
      Options A and D could cut flying, and with it jobs.
  - name: Communities along the Labrador coast
    side: external
    interest: high
    power: low
    wants: A reliable service at fares they can pay; for some, the airline is the only way in or out.
    implications: >-
      Option A would end their service unless another airline takes it on; option B would make it dearer. They have little
      power on their own, but they are heard through the provincial government.
  - name: The provincial government
    side: external
    interest: medium
    power: high
    wants: The Labrador service kept running under the contract, at a fair cost to taxpayers.
    implications: >-
      Leaving the contract early costs C$1.5m and goodwill. The government might pay more to keep the route, which would
      change the case for option A.
  - name: Passengers on the busiest routes
    side: external
    interest: medium
    power: medium
    wants: Low fares and convenient times; on Toronto they now have a cheaper choice.
    implications: >-
      Option D would leave Toronto passengers to the low-cost airline and the national carrier. Raising fares on the routes
      with no competitor (option B) does not touch them.
  - name: Aircraft lessors and the maintenance contractor
    side: external
    interest: medium
    power: medium
    wants: Long contracts and payment on time.
    implications: >-
      Option C asks the maintenance contractor for a cheaper contract and the lessors to swap three old aircraft for two
      newer ones. Both will want something in return, such as longer terms.

options:
  - id: A
    label: Cut the two loss-making routes
    summary: >-
      Stop flying to Sydney and along the Labrador coast, which lost C$1.4m and C$2.6m in 2025, and use the aircraft and
      crews elsewhere or return them.
    requires: Leaving the Labrador contract early, at a cost of C$1.5m, and agreement with the government on what replaces the service.
    upside: An estimated C$2.9m a year added to profit, after the C$1.1m that these passengers contribute on their connecting flights.
    risks: Communities left without an air service, a damaged relationship with the government, and aircraft that cost money if they cannot be redeployed.
    evidence: [ex-4, ex-5]
  - id: B
    label: Raise fares where Kittiwake has no competitor
    summary: >-
      Raise fares by 8% on the four routes where no other airline flies: St. John's, Charlottetown, Sydney and the Labrador
      coast. With demand estimated to be inelastic there, revenue would rise even though fewer people would fly.
    requires: Nothing but a pricing decision, and the government's agreement on Labrador fares.
    upside: An estimated C$3.2m a year, at once and at no cost.
    risks: >-
      Passengers and the government may see it as exploiting a captive market; the elasticity is an estimate; and higher
      fares invite a competitor onto the best of these routes.
    evidence: [ex-2, ex-4, ex-5]
  - id: C
    label: Cut costs with the workforce, suppliers and a newer fleet
    summary: >-
      A two-year cost programme: a new maintenance contract, three of the oldest aircraft replaced by two newer, more
      efficient ones, and new crew rosters that fly the same schedule with fewer hours of standby.
    requires: Agreement with the pilots' and cabin crew unions on rosters, a deal with the lessors, and C$3.5m of one-off costs in 2026.
    upside: An estimated C$9.0m a year from 2027, the largest of any option, without cutting a route or raising a fare.
    risks: The unions may refuse or demand pay in return; the savings take two years to arrive; and new aircraft bring new problems at first.
    evidence: [ex-3, ex-5]
  - id: D
    label: Leave the Toronto route to the low-cost airline
    summary: >-
      Stop competing on the route where the low-cost airline has cut fares, and move three aircraft to two new routes between
      regional cities that no airline serves directly.
    requires: Demand on the new routes, which is untested, and a C$0.6m cost to start them.
    upside: An end to the fare war on Toronto, and aircraft used where Kittiwake has no rival.
    risks: >-
      Toronto is the busiest route and feeds others; the new routes may not fill; and leaving the route tells competitors
      that Kittiwake will retreat when challenged.
    evidence: [ex-4, ex-5]

criteria:
  - id: profit
    criterion: Profit recovery
    weight: 30
    measure: How much the response adds to operating profit, and how soon.
  - id: risk
    criterion: Risk of delivery
    weight: 20
    measure: How likely the estimate is to be achieved, and what happens if it is not.
  - id: people
    criterion: Employees and their unions
    weight: 20
    measure: The effect on jobs, pay and the airline's relations with its workforce.
  - id: communities
    criterion: Communities and passengers
    weight: 15
    measure: Whether the communities and passengers who depend on the airline are treated fairly.
  - id: position
    criterion: Strategic position
    weight: 15
    measure: Whether the airline ends up with a clearer and stronger position against its competitors.

questions:
  course:
    - id: ratios
      command: calculate
      marks: 4
      subtopics: ['3.5']
      prompt: Using Exhibit 1, calculate Kittiwake Air's profit margin and its return on capital employed (ROCE) for 2025.
      notes: >-
        Profit margin = profit before interest and tax ÷ revenue × 100 = 1.9 ÷ 186.0 × 100 = 1.0%. ROCE = profit before
        interest and tax ÷ capital employed × 100 = 1.9 ÷ 64.0 × 100 = 3.0%. Two marks for each, with the working.
    - id: load-factor
      command: calculate
      marks: 4
      level: HL
      subtopics: ['5.6']
      prompt: Using Exhibit 2, calculate the airline's capacity utilization rate (its load factor) in 2023 and in 2025.
      notes: >-
        Capacity utilization rate = actual output ÷ productive capacity × 100, here passengers ÷ seats flown. 2023: 1,040 ÷
        1,520 × 100 = 68.4%. 2025: 1,090 ÷ 1,640 × 100 = 66.5%. The airline flew more seats but filled a smaller share of
        them, so its unit costs rose.
    - id: fixed-costs
      command: explain
      marks: 4
      subtopics: ['3.3']
      prompt: Explain why a fall in passenger numbers has a larger effect on Kittiwake Air's profit than on its revenue.
      notes: >-
        Most costs (aircraft leases, crews, maintenance, head office) are fixed in the short run and do not fall with
        passengers, so lost revenue comes almost straight off profit. Applied to the case: an operating profit of C$1.9m on
        revenue of C$186.0m leaves very little room.
    - id: fares
      command: discuss
      marks: 10
      level: HL
      subtopics: ['4.5']
      prompt: Discuss the proposal to raise fares by 8% on the four routes where Kittiwake Air has no competitor.
      notes: >-
        Strong answers use the price elasticity of demand: at −0.6, passengers fall by 4.8% and revenue on those routes rises
        by 2.816%, about C$2.65m, plus C$0.57m of costs saved. They then weigh the estimate's reliability, the ethics of
        raising prices on a captive market, the government's view of the Labrador service and the risk of attracting a
        competitor, and reach a judgement.
    - id: recovery
      command: evaluate
      marks: 10
      subtopics: ['3.5']
      prompt: Evaluate the cost programme (option C) as a strategy to improve Kittiwake Air's profitability ratios.
      notes: >-
        Good answers note that C adds the most to profit, C$9.0m a year, turning the forecast loss of C$4.2m into a profit of
        C$4.8m and a profit margin of about 2.5%, still well below 2023's 8.0%. They weigh the union agreement it depends on,
        the C$3.5m of one-off costs and the two-year delay, and compare it with cheaper but more damaging options.
  seminar:
    - id: middle
      prompt: Is a regional airline that competes with both a low-cost airline and a national carrier stuck in the middle? If so, what is its way out?
      notes: >-
        Arguments for: it has neither the lowest costs nor the network of the national carrier. Against: it may have a focus
        strategy, serving the region's smaller cities better than either. Good answers use the route contributions to say
        where its advantage lies, which is not on Toronto.
    - id: essential
      prompt: Should a business keep a loss-making service that a remote community depends on? Who should pay for it?
      notes: >-
        This turns on the business's objectives, its obligations under the contract, and whether the community's need is
        better met by a subsidy than by a cross-subsidy from other passengers. Good answers distinguish what the airline owes
        from what the government should buy.
    - id: order
      prompt: Most of an airline's costs are fixed in the short run. What does that imply for the order in which Kittiwake should try the four responses?
      notes: >-
        Fixed costs make volume precious: cutting routes or giving one up shrinks the base that carries them, while cost and
        price changes act on the same base. Many answers will argue for costs first, prices second and routes last.

analysis:
  verdict: >-
    Restore profitability through costs, not through routes or captive passengers (option C). The airline's problem is that
    its costs rose by 16.4% in two years while its revenue rose by 8.1%; the cost programme answers that directly, and is
    worth an estimated C$9.0m a year, enough to turn a forecast loss of C$4.2m in 2027 into a profit of C$4.8m. It depends
    on an agreement with the unions, so the board should negotiate it openly, share the gains, and set a date by which,
    without agreement, it will reconsider the routes.
  evidence:
    - >-
      The fall in profit is a cost problem more than a revenue problem. Revenue grew by 8.1% between 2023 and 2025, but
      maintenance rose by 34.3% and staff costs by 20.2% (Exhibit 3), and the load factor fell from 68.4% to 66.5% (Exhibit 2),
      so each passenger carried more cost.
    - >-
      The losing routes are a small part of the problem. Sydney and Labrador lost C$4.0m between them, but cutting them saves
      only C$2.9m once lost connections are counted, and costs C$1.5m to leave the Labrador contract (Exhibit 5).
    - >-
      Only option C closes the gap. Against a forecast loss of C$4.2m in 2027, the options would leave operating profit at
      −C$1.3m (A), −C$1.0m (B), C$4.8m (C) and −C$3.4m (D) (Exhibit A1).
    - >-
      The fare rise works on paper because demand on those routes is estimated to be inelastic: at −0.6, an 8% rise loses
      4.8% of passengers but raises revenue by 2.816%. That estimate is the weakest number in the paper, and the routes are
      the ones whose passengers have nowhere else to go.
  assumptions:
    - assumption: The unions will agree new rosters that save C$3.9m a year.
      test: Open talks before the board commits, and share the numbers. If a deal includes a pay rise, rework the saving net of it.
    - assumption: The newer aircraft will save C$2.7m a year net of their higher lease cost.
      test: Ask the lessors for firm terms and check the fuel and maintenance savings against other airlines flying the same type.
    - assumption: Demand on the routes with no competitor has a price elasticity of −0.6.
      test: It is an estimate. Test a smaller rise on one route first and measure what happens to bookings.
    - assumption: Without action, the airline would lose C$4.2m in 2027.
      test: The forecast assumes costs keep rising at recent rates. Check it against the fuel price and the pay settlements already agreed.
  tradeoffs:
    - title: Speed, or depth
      body: >-
        A fare rise adds money at once; the cost programme takes two years and costs C$3.5m first. The faster fix leaves the
        cause, rising costs, untouched.
    - title: Profit, or the region's trust
      body: >-
        Cutting the Labrador service or charging its passengers more improves the accounts by exploiting the weakest
        stakeholders. An airline whose brand is the region may lose more in goodwill than it gains.
    - title: Savings, or relations with the workforce
      body: >-
        The largest saving needs the unions' agreement. Imposing new rosters could save money on paper and cost it in
        disputes and departures; negotiating them shares some of the gain with the crews.
  alternatives:
    - option: A
      fit: weak
      body: >-
        Weakly supported. It fixes the smallest part of the problem at the greatest cost to the most dependent passengers,
        breaks a contract with the government, and still leaves the airline in loss in 2027.
    - option: B
      fit: conditional
      body: >-
        Defensible only as a small, tested change on the routes where service is improving, not as the plan. It rests on an
        estimated elasticity and on charging captive passengers more, and it leaves the costs untouched.
    - option: C
      fit: strong
      body: >-
        The best supported. It is the only response that returns the airline to profit, it acts on the cause of the decline,
        and it keeps every route. Its risk is the union agreement, which the board can manage by negotiating early and
        sharing the gains.
    - option: D
      fit: weak
      body: >-
        Weakly supported. It gives up the busiest route, which feeds the rest of the network, for new routes whose demand
        is untested, and it adds only C$0.8m a year.
  scores:
    - { option: A, scores: { profit: 3, risk: 3, people: 3, communities: 1, position: 2 }, total: 2.55 }
    - { option: B, scores: { profit: 3, risk: 4, people: 4, communities: 2, position: 2 }, total: 3.1 }
    - { option: C, scores: { profit: 5, risk: 3, people: 2, communities: 4, position: 4 }, total: 3.7 }
    - { option: D, scores: { profit: 1, risk: 2, people: 3, communities: 4, position: 3 }, total: 2.35 }
  recommendation:
    option: C
    decision: >-
      Adopt the cost programme: a new maintenance contract, three of the oldest aircraft replaced by two newer ones, and new
      crew rosters negotiated with the unions, with part of the saving shared with the crews through a profit-related bonus.
      Keep every route, hold fares, and ask the government to review the Labrador contract on the evidence of its cost.
    reasons:
      - It acts on the cause of the decline, costs rising twice as fast as revenue.
      - It is the only response that returns the airline to profit in 2027.
      - It keeps the routes and fares that the airline's reputation in the region rests on.
      - Sharing the gain gives the unions a reason to agree, which is the plan's main risk.
    conditions: >-
      If no roster agreement is reached by the end of 2026, the saving falls to C$5.1m a year, which still returns the
      airline to a small profit of C$0.9m in 2027; the board should then reconsider the Sydney route, not the Labrador
      service.
  implementation:
    - when: Months 1 to 2
      action: Share the route and cost figures with the unions and open talks on rosters, with a profit-related bonus on the table.
      owner: Chief executive and the head of people
    - when: Months 1 to 4
      action: Tender the maintenance contract and agree terms with the lessors for two newer aircraft.
      owner: Finance director and head of engineering
    - when: Months 4 to 12
      action: Retire the three oldest aircraft as the newer ones arrive, and train crews on the new type.
      owner: Head of operations
    - when: Month 6
      action: Present the Labrador route's costs to the provincial government and agree how the contract will be reviewed.
      owner: Chief executive
    - when: Month 12
      action: Review progress against the measures below; if rosters are not agreed, reopen the case for the Sydney route.
      owner: The board
  measures:
    - measure: Operating profit
      target: A return to profit in 2027, C$4.8m on the finance team's estimates, against a loss of C$4.2m with no action.
      review: Every quarter
    - measure: Costs by type
      target: Maintenance and staff costs growing no faster than revenue from 2027.
      review: Every quarter
    - measure: Load factor
      target: Back above the 68.4% of 2023 as the smaller, newer fleet flies fuller aircraft.
      review: Every month
    - measure: Relations with the workforce
      target: A roster agreement signed by both unions, with no industrial action.
      review: Every month during talks
  limitations:
    - Every saving is an estimate by the finance team, and the largest depends on negotiations whose outcome nobody can know.
    - The route contributions depend on how shared costs are divided between routes; a different method would move the numbers.
    - The forecast loss for 2027 assumes that recent cost increases continue; a fall in the fuel price would ease the pressure on every option.
  changeMind:
    - If the unions refuse new rosters outright, the case for cutting the Sydney route grows.
    - If the government offered to pay the full cost of the Labrador service, option A would no longer need to touch it, and the comparison would change.
    - If the low-cost airline left the Toronto route, fares there would recover and the urgency of every option would fall.
  exhibits:
    - id: ex-A1
      title: Operating profit in 2027 under each response (C$m)
      kind: table
      provenance: simulated-data
      columns:
        - { label: Response }
        - { label: Added each year, numeric: true, format: d1 }
        - { label: Operating profit in 2027, numeric: true, format: d1 }
      rows:
        - ['No change', 0.0, -4.2]
        - ['A. Cut the Sydney and Labrador routes', 2.9, -1.3]
        - ['B. Raise fares by 8% on the four routes with no competitor', 3.2, -1.0]
        - ['C. Cut costs with the workforce, suppliers and a newer fleet', 9.0, 4.8]
        - ['D. Leave the Toronto route to the low-cost airline', 0.8, -3.4]
      checks:
        - { column: Added each year, rows: ['A. Cut the Sydney and Labrador routes', 'B. Raise fares by 8% on the four routes with no competitor', 'C. Cut costs with the workforce, suppliers and a newer fleet', 'D. Leave the Toronto route to the low-cost airline'], is: '{ex-5|*|Added to operating profit each year from 2027}' }
        - { column: Operating profit in 2027, is: '{@base-2027} + {Added each year}' }
      note: Without a roster agreement, option C would add C$5.1m, leaving a profit of C$0.9m in 2027.
      source: The Business Brief's analysis of Exhibit 5 and the finance team's forecast (simulated data).

course:
  subtopics:
    - { code: '3.5', note: 'The profit margin and ROCE, and strategies to improve the profitability ratios.' }
    - { code: '3.3', note: 'Fixed and variable costs, and why fixed costs make profit swing more than revenue.' }
    - { code: '4.5', note: 'Pricing on routes with and without competition; at HL, price elasticity of demand.' }
    - { code: '5.6', note: 'The capacity utilization rate, which an airline calls its load factor.', level: HL }
    - { code: '2.7', note: 'Collective bargaining with the pilots'' and cabin crew unions over rosters.', level: HL }
    - { code: '1.4', note: 'Conflict between owners, employees, communities and the government over the response.' }

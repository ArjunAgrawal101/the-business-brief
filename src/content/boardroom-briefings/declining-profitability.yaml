# The Boardroom Briefings, No. 3. Kittiwake Air is fictional; every figure is
# simulated. Exhibit 1's profits, margins and ROCE, Exhibit 2's load factors
# and revenue per passenger, Exhibit 3's changes and Exhibit 4's contributions
# and totals are worked by their checks. The options' effects in Exhibit 5 are
# built from Exhibit 4 and the figures below; Exhibit A1 adds them to the
# forecast for 2027.

number: 3
question: How should a company respond to declining profitability?
title: Kittiwake Air's margins fall for a third year
dek: A regional airline in Atlantic Canada is carrying more passengers than ever and making almost no money. Its board has four ways to restore its profits, and each would hurt someone.
decisionType: profit-recovery
industry: aviation
functions: [finance, operations, marketing, human-resources]
keyConcepts: [change, ethics]
updated: 2026-11-16

company:
  name: Kittiwake Air
  fictional: true
  sector: Regional airline
  location: Halifax, Nova Scotia, Canada
  size: 14 turboprop aircraft, 1,150 employees and revenue of C$186.0m in 2025
  ownership: Privately held company, 60% owned by a regional pension fund and 40% by the founders' families
currency: { code: CAD, symbol: 'C$', unit: million }

summary:
  situation: >-
    Kittiwake Air flies from Halifax to cities and smaller communities across Atlantic Canada and to Toronto and Montréal.
    It carried 1,090,000 passengers in 2025, more than ever, but its operating profit fell from C$13.8m in 2023 to C$1.9m,
    and the finance team forecasts a loss in 2027 if nothing changes.
  decision: >-
    How to restore the airline's profitability: by cutting its two loss-making routes, raising fares where it has no
    competitor, cutting its costs with its workforce and suppliers, or giving up its Toronto route to a low-cost rival.
  stakes: >-
    The airline's profit margin has fallen from 8.0% to 1.0% in two years. Each response affects someone the airline
    depends on: its staff and their unions, passengers in remote communities with no other airline, or the routes that
    feed its network.

background:
  - >
    Kittiwake Air was founded in 1998 by a group of pilots who saw that the smaller cities of Atlantic Canada were poorly
    served. It now flies 14 turboprop aircraft from its base in Halifax, to Toronto, Montréal, St. John's, Charlottetown and
    Sydney, and along the Labrador coast under a contract with the provincial government. It employs 1,150 people, most of
    them members of a pilots' union or a cabin crew union.
  - >
    For most of its history the airline made steady profits. Then its costs rose faster than its fares: between 2023 and
    2025 its operating costs grew by 16.4% while its revenue grew by 8.1%, and its profit margin fell from 8.0% to 1.0%
    (Exhibits 1 and 3). In 2024 a low-cost airline began flying between Halifax and Toronto, Kittiwake's busiest route, and
    Kittiwake cut its fares there to keep its passengers.
  - >
    The airline is owned 60% by a regional pension fund and 40% by the founders' families. Both want it back in good
    health. The chief executive, Marie Thibodeau, has asked her team to cost four responses (Exhibit 5), and will put one of
    them to the board next month.

context:
  - >
    An airline's costs are mostly fixed in the short run. The aircraft, the leases, the crews and the maintenance teams have
    to be paid for whether a flight leaves full or half empty, so the share of seats filled, the load factor, decides
    whether a route makes money. A small fall in passengers or fares can wipe out a thin profit, and a small rise can
    restore it.
  - >
    Regional airlines sit between two kinds of competitor. National airlines connect the regions to the rest of the world
    and can offer frequent flyers more; low-cost airlines take the busiest routes with fewer frills and lower fares. A
    regional airline that tries to match both can end up with the costs of one and the fares of the other.
  - >
    Some regional routes are essential services. Remote communities may have no road or no reliable one, and depend on
    the airline for travel, health care and supplies. Governments often pay airlines to keep such routes running, and
    expect a say in their fares and schedules.

evidence:
  - kind: company
    title: More passengers, thinner margins
    body: >-
      Revenue rose from C$172.0m to C$186.0m between 2023 and 2025, but operating profit fell from C$13.8m to C$1.9m, and
      the return on capital employed from 23.0% to 3.0% (Exhibit 1). Revenue per passenger rose only slowly, from C$165.38
      to C$170.64, while the load factor slipped from 68.4% to 66.5% (Exhibit 2).
    exhibits: [ex-1, ex-2]
  - kind: company
    title: Where the costs rose
    body: >-
      Maintenance costs rose by 34.3% and staff costs by 20.2% between 2023 and 2025, both faster than revenue (Exhibit 3).
      The three oldest aircraft, all over 25 years old, account for much of the maintenance bill.
    exhibits: [ex-3]
  - kind: company
    title: Which routes pay
    body: >-
      In 2025 the routes earned a total contribution of C$12.4m towards the C$10.5m of costs no single route can be
      charged with (Exhibit 4). St. John's earned the most, C$5.9m. Two routes lost money: Sydney, at −C$1.4m, and the
      Labrador coast, at −C$2.6m. Toronto, the busiest route, earned C$2.6m, at an average of C$200.00 a passenger against
      C$214 before the low-cost airline arrived.
    exhibits: [ex-4]
  - kind: research
    title: The danger of being stuck in the middle
    body: >-
      Porter argued that a firm earns above-average returns by competing either on cost or on difference, across a whole
      market or in a focused part of it, and that a firm which tries to do both without achieving either risks being stuck
      in the middle, with neither the lowest costs nor a premium.
    sources: [bbr-porter-1980]
  - kind: market
    title: Why airline profits swing
    body: >-
      Because most of an airline's costs are fixed in the short run, its profit changes much more than its revenue when
      passenger numbers or fares change. The same leverage that turns a small fall in revenue into a large fall in profit
      works in the other direction once costs are brought back under control.

financials:
  summary: >-
    Exhibit 1 gives the airline's results and returns for three years, and Exhibit 3 its operating costs by type. Exhibit 4
    shows the contribution each route made in 2025, before the costs that cannot be charged to a route. Exhibit 5 gives the
    finance team's estimates of what each response would add to operating profit each year from 2027, and what it would
    cost once in 2026. If nothing changes, the team forecasts an operating loss of C$4.2m in 2027.
  exhibits: [ex-1, ex-3, ex-4, ex-5]


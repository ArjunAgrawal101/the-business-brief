# The Boardroom Briefings, No. 7. Scholarline Learning Centres and Tutora are
# fictional; every figure is simulated. Exhibit 3's totals, revenue per
# student and margins, Exhibit 2's totals and Exhibit 4's effects are worked
# by their checks; Exhibit A1 adds each effect to the forecast for 2027.

number: 7
question: How should a company respond to a disruptive competitor?
title: Scholarline's tutors meet a tutor that never sleeps
dek: A Singapore tuition chain is losing secondary students to an AI tutoring app at less than a tenth of its price. The most profitable response in the short run may be the one that loses the market in the long run.
decisionType: competitive-response
industry: education
functions: [strategy, marketing, operations]
keyConcepts: [creativity, change]
updated: 2026-11-16

company:
  name: Scholarline Learning Centres
  fictional: true
  sector: Tuition centres for primary and secondary students
  location: Singapore
  size: 24 centres, 420 tutors, 7,800 students and revenue of S$28.6m in 2025
  ownership: Privately held company, owned by its founder and a family investment company
currency: { code: SGD, symbol: 'S$', unit: thousand }

summary:
  situation: >-
    Scholarline runs 24 tuition centres in Singapore, teaching maths, science and English in small groups. Since an AI
    tutoring app, Tutora, arrived in 2024 at S$29 a month, Scholarline's secondary enrolments have fallen by almost a
    quarter, and its operating margin from 18.0% to 12.0%.
  decision: >-
    How to respond: launch a cheap online tier of its own, move upmarket into premium exam coaching, set up a separate
    digital business free to compete with its own centres, or rebuild its centres around a hybrid of AI practice and human
    tutors.
  stakes: >-
    The response decides whether Scholarline shrinks into a smaller premium business, fights the app on price, or
    changes what it does. Its 420 tutors, and the families who rely on them, will feel the answer either way.

background:
  - >
    Scholarline was founded in 2008 by a former schoolteacher, who opened a single centre above a shopping mall and grew it
    into a chain of 24. Its model is simple: groups of up to eight students, a tutor who knows each of them, and weekly
    practice set and marked by hand. Parents pay S$380 a month for each subject. Most of the 420 tutors work part-time on
    contracts.
  - >
    The business was steadily profitable until 2024. That year Tutora, a start-up, launched an app that sets each student
    practice questions, explains mistakes step by step and adapts to what the student gets wrong, for S$29 a month. It was
    weak at first on essays and exam technique, but it has improved quickly, and it is popular with secondary students.
  - >
    Scholarline's secondary enrolments fell from 5,400 in 2023 to 4,100 in 2025, while primary enrolments held up (Exhibit
    1). Revenue fell from S$33.3m to S$28.6m, and operating profit from S$6.0m to S$3.4m (Exhibit 3). In 2025 three centres
    tried a hybrid model, in which students practised on an AI platform between classes and tutors used its data to plan
    their lessons.

context:
  - >
    Tuition is a large and personal market. Parents choose on results, trust and convenience, and many keep a child with the
    same centre for years. For decades the competition was other centres and private tutors, who offered much the same
    service at different prices.
  - >
    Software that adapts to each learner has changed what can be done without a tutor. It is tireless and cheap, and good
    at practice and explanation; it is less good at motivating a reluctant student, teaching a subject's deeper skills or
    noticing when a child is struggling for reasons that have nothing to do with the work.
  - >
    New technologies often enter a market at the bottom, serving customers who want only part of what the leaders offer, at
    a much lower price. Leaders tend to respond by moving to their most demanding customers, where margins are highest,
    until the newcomer has improved enough to follow them.

evidence:
  - kind: company
    title: The decline is in secondary tuition
    body: >-
      Between 2023 and 2025 secondary enrolments fell by 24.1% while primary enrolments rose by 2.8% (Exhibit 1). The
      operating profit margin fell from 18.0% to 12.0% as fixed costs were spread over fewer students (Exhibit 3).
    exhibits: [ex-3, ex-1]
  - kind: company
    title: Why families left
    body: >-
      Of 640 parents who left in 2025, 34% gave price as the main reason and 29% said their child had switched to an app;
      only 18% moved to another tuition centre (Exhibit 2). Among 1,200 current parents, 46% already use an app alongside
      Scholarline, and 38% would pay more for exam-focused coaching in smaller groups.
    exhibits: [ex-2]
  - kind: company
    title: The hybrid pilot
    body: >-
      In the three pilot centres, 91% of students stayed into the next term, against 82% elsewhere, and tutors spent 20% less
      time marking (Exhibit 2). Parents said they valued the tutors more, not less, once the practice moved to the app.
    exhibits: [ex-2]
  - kind: research
    title: Disruption starts at the bottom of a market
    body: >-
      The theory of disruptive innovation holds that an entrant can begin with a simpler, cheaper product that the leaders'
      best customers do not want, improve it steadily, and eventually serve the mainstream. Leaders that listen closely to
      their most profitable customers tend to ignore the entrant until it is too late, and the theory suggests they respond
      through a separate unit with its own cost structure.
    sources: [bbr-christensen-1997]
  - kind: research
    title: Substitutes cap what an industry can charge
    body: >-
      In Porter's analysis of competitive forces, a substitute that meets the same need in a different way limits the price
      an industry can charge, and the closer its performance comes, the tighter the limit.
    sources: [bbr-porter-1980]

financials:
  summary: >-
    Exhibit 3 gives three years of enrolments, revenue and operating profit. Exhibit 4 gives the management team's estimates
    of how each response would change revenue and costs in 2027. If nothing changes, the team forecasts an operating profit
    of S$1,200k in 2027, as secondary enrolments keep falling.
  exhibits: [ex-3, ex-4]


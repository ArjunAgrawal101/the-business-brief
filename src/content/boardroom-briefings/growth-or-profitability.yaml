# The Boardroom Briefings, No. 6. Mãozinha is fictional; every figure is
# simulated. Exhibit 2's revenue, contribution and results follow from the
# booking value, the 18% commission and the 50% contribution margin; Exhibit
# 2's acquisition costs from marketing and new customers; the plans' results
# in Exhibit 3 from the stated assumptions below; Exhibit A1 works each city's
# lifetime value.

number: 6
question: Should a start-up prioritize growth or profitability?
title: Mãozinha's founders choose between more cities and a profit
dek: A São Paulo marketplace for home repairs has nearly doubled its bookings every year and lost money every year. Investors will pay for more growth; the numbers ask whether more of the same is worth buying.
decisionType: growth-and-funding
industry: e-commerce
functions: [strategy, finance, marketing]
keyConcepts: [change, creativity]
updated: 2026-11-16

company:
  name: Mãozinha
  fictional: true
  sector: Online marketplace for home services
  location: São Paulo, Brazil
  size: 85 employees, 6,200 professionals using the platform and bookings worth R$96.0m in 2025
  ownership: Privately held company, 52% owned by its two founders and 48% by early investors
currency: { code: BRL, symbol: 'R$', unit: thousand }

summary:
  situation: >-
    Mãozinha connects households with electricians, plumbers, cleaners and painters, and keeps 18% of each booking. The
    value of bookings rose from R$22.0m in 2023 to R$96.0m in 2025 across four cities, but the company lost R$15.4m last
    year and has R$31.0m in the bank.
  decision: >-
    Whether to take R$60m from a growth fund and open in six more cities; to stop spending on growth and reach a profit
    with the money it has; to raise a smaller sum and fix the business before growing again; or to sell to a larger
    platform.
  stakes: >-
    At its present rate of loss the company has about two years of cash. The choice decides how fast it can grow, how much
    of it the founders keep, and whether the business it scales is one that makes money.

background:
  - >
    Beatriz Lima and Rafael Souza, two engineers who had both waited weeks for a reliable plumber, founded Mãozinha in São
    Paulo in 2022. Households book a vetted professional through the app, pay through it, and can rate the work; the
    professionals, who are self-employed, get a steady flow of jobs and payment within days. Mãozinha keeps 18% of each
    booking. The company opened in Campinas in 2023, Rio de Janeiro in 2024 and Belo Horizonte in 2025, and now has 85
    employees and 6,200 professionals using the platform.
  - >
    Growth has been fast and expensive. Bookings grew by 131.8% in 2024 and by 88.2% in 2025, but marketing, mostly
    online advertising to win new customers, cost R$14.4m last year, and the company's operating loss widened from
    R$7.0m in 2023 to R$15.4m (Exhibit 2). It ended 2025 with R$31.0m in cash from its last funding round.
  - >
    Three proposals are on the table. A growth fund has offered R$60m for 35.1% of the company, on the condition that it
    opens in six more cities in 2026. The early investors would put in R$20m if the company first proved its numbers. And a
    large delivery app, which has added home services in two cities, has offered R$140m for the whole business.

context:
  - >
    Marketplaces grow by bringing together two sides, here households and professionals, and each side is more useful the
    more of the other it finds. That rewards being first and biggest in a city, and many marketplaces spend heavily on
    growth in the belief that the leader in each city will eventually earn the profits.
  - >
    The belief holds only if customers keep coming back. A household that books once, after an advertisement, and never
    returns costs more to win than it pays back; one that books again and again is worth winning even at a high cost. The
    economics of each customer, and of each city, decide whether growth creates value or destroys it.
  - >
    Investors' appetite for growth at any cost rises and falls. When money is easy to raise, start-ups are rewarded for
    growing fast; when it is scarce, they are asked to show a path to profit, and those that cannot may not survive to
    the next round.

evidence:
  - kind: company
    title: Faster growth, larger losses
    body: >-
      The value of bookings rose from R$22,000k in 2023 to R$96,000k in 2025, and the operating loss from R$7,020k to
      R$15,360k (Exhibit 2). Each year the company spent more on marketing than it earned in contribution: R$14,400k against
      R$8,640k in 2025.
    exhibits: [ex-2]
  - kind: company
    title: Two cities pay back, two do not
    body: >-
      Winning a customer cost R$90.00 in São Paulo but R$210.00 in Belo Horizonte, and 65% of São Paulo's customers booked
      again the next year against 45% in Belo Horizonte (Exhibit 1). A customer contributes about R$72 a year, so the cities
      differ greatly in how much each new customer is worth.
    exhibits: [ex-1]
  - kind: company
    title: Three plans for 2026 and 2027
    body: >-
      The finance team has forecast three plans (Exhibit 3). Growth with the fund's money would still lose R$21,000k in
      2027. Focusing on São Paulo and Campinas would break even in 2027. Fixing the economics first, with R$20m from the
      early investors, would cut the loss to R$3,500k in 2027.
    exhibits: [ex-3]
  - kind: research
    title: Firms can grow only as fast as their managers can learn
    body: >-
      Penrose argued that a firm's rate of growth is limited by its managers' capacity to plan and absorb expansion: new
      managers take time to learn how the firm works, so a firm that tries to grow faster than its management can adapt
      runs into rising costs and mistakes.
    sources: [bbr-penrose-1959]
  - kind: market
    title: What investors look for in a marketplace
    body: >-
      Investors in marketplaces watch how much it costs to win a customer, how many customers come back, and how long a
      customer takes to repay the cost of winning them. Growth that improves those measures is valued highly; growth that
      worsens them is not.

financials:
  summary: >-
    Exhibit 2 gives three years of results, from the value of bookings to the operating result. Exhibit 1 shows, for each
    city, how many new customers were won in 2025, at what marketing cost, and how many customers book again. Exhibit 3 gives
    the finance team's forecasts for the three plans that involve keeping the company, with the cash each would leave at the
    end of 2027. A customer contributes about R$72 a year: 3.2 bookings of R$250, at 18% commission and a 50% contribution
    margin.
  exhibits: [ex-2, ex-3]


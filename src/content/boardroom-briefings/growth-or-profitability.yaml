stakeholders:
  - name: Beatriz Lima and Rafael Souza, the founders
    side: internal
    interest: high
    power: high
    wants: A business that lasts and leads its market, and enough of it to keep control of its direction.
    implications: >-
      The fund's money would cut their 52% to 33.8%; the sale would pay them R$72.8m and end their control; the other two
      plans keep more of the company but grow it more slowly.
  - name: The early investors
    side: internal
    interest: high
    power: high
    wants: A return on their 48%, sooner rather than later.
    implications: >-
      They would be diluted by the fund but paid out by the sale; their R$20m offer under plan C shows they believe in the
      business if it proves its numbers.
  - name: The professionals on the platform
    side: external
    interest: high
    power: medium
    wants: A steady flow of jobs, fair commission and prompt payment; most depend on the platform for much of their income.
    implications: >-
      Expansion brings more jobs only where demand grows; plan C's higher commission takes more of each job, though with a
      guarantee that protects them in disputes.
  - name: Households
    side: external
    interest: medium
    power: medium
    wants: A reliable professional, quickly, at a fair price.
    implications: >-
      They notice service quality more than the number of cities. A company stretched across ten cities may serve each one
      less well.
  - name: Employees
    side: internal
    interest: high
    power: low
    wants: Secure jobs and shares that might one day be worth something.
    implications: >-
      Plan A would mean rapid hiring; plan B a 10% cut in fixed costs, some of it in jobs; a sale an uncertain future inside
      a larger company.
  - name: The growth fund and the delivery app
    side: external
    interest: high
    power: medium
    wants: The fund wants fast growth to justify its valuation; the app wants a business it can fold into its own.
    implications: >-
      Each offer comes with conditions that would shape the company for years: six cities in a year, or the end of its
      independence.

options:
  - id: A
    label: Take the R$60m and open six more cities
    summary: >-
      Accept the growth fund's offer of R$60m for 35.1% of the company, open in six more cities in 2026, and more than
      double the value of bookings in two years.
    requires: Hiring and launching at speed, and the fund's money on its terms.
    upside: The leading position in more cities before rivals arrive, and a much larger business.
    risks: >-
      Losses of R$22,200k and then R$21,000k a year; new cities that may look like Belo Horizonte, not São Paulo; founders
      diluted to 33.8%; and a management team stretched across ten cities.
    evidence: [ex-1, ex-3]
  - id: B
    label: Focus on São Paulo and Campinas until profitable
    summary: >-
      Stop advertising for new customers in Rio and Belo Horizonte, keep serving the customers already there, cut fixed
      costs by 10% and spend R$3.6m a year on keeping customers in the two cities where they pay back.
    requires: Cuts to marketing and to some jobs, and patience from investors.
    upside: Operating break-even in 2027 with the money the company has, and no dilution.
    risks: Growth slows to 20% a year; rivals take the cities Mãozinha leaves; the best staff may leave a company that has stopped growing.
    evidence: [ex-2, ex-3]
  - id: C
    label: Raise R$20m and fix the economics before growing
    summary: >-
      Take R$20m from the early investors, raise the commission to 20% with a guarantee on every job, stop marketing in Belo
      Horizonte, and work on repeat bookings; open a new city only when the existing ones show a customer is worth at least
      twice what it costs to win.
    requires: The early investors' money, and the discipline to hold back growth for a year.
    upside: A business whose growth adds value, a loss cut to R$3,500k by 2027, and R$41,900k in cash at the end of 2027.
    risks: Professionals may resent the higher commission; rivals keep growing meanwhile; the improvements may take longer than a year.
    evidence: [ex-1, ex-3]
  - id: D
    label: Sell to the delivery app
    summary: >-
      Accept the offer of R$140m for the whole company and become the home services arm of a large delivery app.
    requires: The founders' and investors' agreement, and terms for the staff and the professionals.
    upside: Certainty, with R$72.8m for the founders and a return for the investors, and the app's customers behind the business.
    risks: The end of independence; a price that may undervalue a business that could be fixed; and the professionals' terms set by a new owner.
    evidence: [ex-2]

criteria:
  - id: value
    criterion: Value creation
    weight: 25
    measure: Whether the plan builds a business whose customers are worth more than they cost to win, with a path to profit.
  - id: survival
    criterion: Survival
    weight: 25
    measure: The cash left at the end of 2027 and how far the plan depends on raising more.
  - id: position
    criterion: Market position
    weight: 20
    measure: How strong the company would be against rivals in the cities that matter.
  - id: control
    criterion: Control
    weight: 15
    measure: How much of the company, and of its direction, the founders keep.
  - id: people
    criterion: Professionals and employees
    weight: 15
    measure: The effect on the professionals' work and income, and on the company's staff.

questions:
  course:
    - id: runway
      command: calculate
      marks: 3
      subtopics: ['3.7']
      prompt: Using Exhibit 2 and the cash figure in the background, calculate how many months Mãozinha's cash would last at its 2025 rate of loss.
      notes: >-
        Monthly loss = 15,360 ÷ 12 = R$1,280k. Cash ÷ monthly loss = 31,000 ÷ 1,280 = 24.2 months. The answer assumes the loss
        stays at 2025's rate; under plan A it would grow.
    - id: growth
      command: calculate
      marks: 2
      subtopics: ['4.1']
      prompt: Using Exhibit 2, calculate the growth in the value of bookings in 2025.
      notes: >-
        Growth = (96,000 − 51,000) ÷ 51,000 × 100 = 88.2%. One mark for the method, one for the answer.
    - id: finance
      command: explain
      marks: 4
      subtopics: ['3.2']
      prompt: Explain one advantage and one disadvantage to the founders of raising share capital from the growth fund.
      notes: >-
        Advantage: R$60m that never has to be repaid, with no interest, to fund growth. Disadvantage: the founders' share
        falls from 52% to 33.8%, so they give up control and part of any future profit. Each point applied to the case.
    - id: gig
      command: discuss
      marks: 10
      subtopics: ['2.1']
      prompt: Discuss the advantages and disadvantages, for the professionals and for Mãozinha, of a business model built on self-employed workers.
      notes: >-
        Strong answers weigh flexibility and low fixed costs for the company, and independence and a flow of jobs for the
        professionals, against insecurity, the lack of benefits and dependence on one platform's commission, which plan C
        would raise. They reach a judgement on whether the model is fair and sustainable.
    - id: strategy
      command: recommend
      marks: 10
      subtopics: ['1.3', '1.5']
      prompt: Recommend whether Mãozinha should pursue growth or profitability over the next two years.
      notes: >-
        The best answers use the city figures to show that the answer differs by city, test each plan's results and cash
        against the objective of survival, weigh the founders' control, and make a clear recommendation with its conditions.
        Answers that simply prefer growth or profit without the unit economics miss the case's central evidence.
  seminar:
    - id: penrose
      prompt: Penrose argued that growth is limited by managers' capacity to absorb it. What would that limit look like at Mãozinha if it opened six cities in a year?
      notes: >-
        Ten cities at once means hiring city managers who do not yet know how the business works, while the founders cannot
        attend to each launch. Good answers predict where the strain would show first: vetting professionals, service
        quality and the cost of winning customers.
    - id: blitz
      prompt: When does it make sense for a start-up to grow faster than its unit economics justify?
      notes: >-
        When being first in a market gives a lasting advantage, as network effects can, and when the economics are likely to
        improve with scale. Neither is shown by Belo Horizonte's figures. Good answers name the evidence that would change
        the conclusion.
    - id: sale
      prompt: Is R$140m a good price for Mãozinha? What would you need to know to decide?
      notes: >-
        The price is about 8.1 times 2025 revenue, a figure that means little on its own. Good answers ask what the business
        would be worth if plan C succeeded, how certain that is, and what the founders and investors want beyond money.

analysis:
  verdict: >-
    Neither growth at any cost nor profit at any cost: fix the economics, then grow (option C). The city figures show that
    Mãozinha's growth creates value where customers come back, in São Paulo and Campinas, and destroys it where they do not:
    in Belo Horizonte a customer is worth R$130.9 over their time with the company and costs R$210.00 to win. Taking R$60m
    to open six more cities would scale the losses before the model works; stopping growth altogether would hand the market
    to rivals. With R$20m from its early investors, Mãozinha can prove the economics in a year and then grow where they work.
  evidence:
    - >-
      Unit economics vary by city. A customer is worth R$205.7 over their time with Mãozinha in São Paulo, 2.29 times the
      R$90.00 it costs to win them; in Belo Horizonte, R$130.9, only 0.62 times the R$210.00 it costs (Exhibit A1).
    - >-
      Each year's growth has cost more than it earned: R$14,400k of marketing against R$8,640k of contribution in 2025 (Exhibit
      2). At the 2025 rate of loss the company has 24.2 months of cash.
    - >-
      Plan A still loses R$21,000k in 2027 and depends on raising again; plan B breaks even in 2027 but grows only 20% a year;
      plan C loses R$3,500k in 2027 but leaves R$41,900k in cash, enough to grow from (Exhibit 3).
    - >-
      Raising the commission to 20% lifts a customer's yearly contribution from R$72 to R$80, which, with better repeat
      bookings, is what turns Rio from a borderline city into a profitable one.
  assumptions:
    - assumption: New cities would behave like the newest existing ones, not like São Paulo.
      test: Belo Horizonte and Rio are the best evidence of what a new city costs. If the fund believes otherwise, ask why, and test it in one city before six.
    - assumption: A customer's value can be estimated from one year's repeat rate.
      test: Repeat rates for new cities are early figures. Track each city's customers month by month for a year before relying on them.
    - assumption: Professionals will accept a 20% commission in return for a guarantee on every job.
      test: Pilot the new terms in one city and watch how many professionals stay active.
    - assumption: Rivals will not take an unassailable lead during the year Mãozinha spends fixing its economics.
      test: Watch rivals' activity city by city. A marketplace's lead is hardest to overturn where customers rebook through habit.
  tradeoffs:
    - title: Speed, or soundness
      body: >-
        The fund offers speed, and asks for six cities in a year. The figures say the model is sound in two cities and
        unsound in one. Speed now multiplies whichever is true of the new cities.
    - title: Control, or capital
      body: >-
        Each round of money buys growth with a share of the company. The fund's R$60m costs the founders more than a third of
        their stake; the early investors' R$20m costs less and comes with patience.
    - title: The professionals' income, or the company's margin
      body: >-
        A higher commission improves the company's economics at the professionals' expense. The guarantee on every job is
        what makes the trade fair, and it must be real.
  alternatives:
    - option: A
      fit: weak
      body: >-
        Weakly supported. It scales a model that loses money in its newest cities, leaves losses of R$21,000k a year in 2027,
        and dilutes the founders to 33.8%, all before the company knows whether its economics can work outside São Paulo.
    - option: B
      fit: conditional
      body: >-
        Defensible if no new money can be raised: it reaches break-even with the cash the company has. But it gives up two
        cities and slows growth to 20% a year, and a stalled marketplace can lose its best people and its lead.
    - option: C
      fit: strong
      body: >-
        The best supported. It acts on what the city figures show, keeps growth where it creates value, protects survival with
        R$41,900k of cash at the end of 2027, and keeps the founders in control.
    - option: D
      fit: conditional
      body: >-
        Defensible for founders and investors who value certainty, but the price is set before the company has shown what
        its economics could be. It is better held in reserve than accepted now.
  scores:
    - { option: A, scores: { value: 2, survival: 3, position: 5, control: 2, people: 3 }, total: 3.0 }
    - { option: B, scores: { value: 4, survival: 5, position: 2, control: 5, people: 2 }, total: 3.7 }
    - { option: C, scores: { value: 5, survival: 4, position: 4, control: 4, people: 4 }, total: 4.25 }
    - { option: D, scores: { value: 3, survival: 5, position: 3, control: 1, people: 2 }, total: 3.05 }
  recommendation:
    option: C
    decision: >-
      Take R$20m from the early investors and spend 2026 fixing the economics: raise the commission to 20% with a real
      guarantee on every job, stop paid marketing in Belo Horizonte while serving its existing customers, work on repeat
      bookings, and keep Rio under review. Open a new city only when the existing ones show that a customer is worth at least
      twice what it costs to win.
    reasons:
      - Growth creates value only where customers come back, and the city figures show where that is.
      - It cuts the loss to R$3,500k by 2027 and leaves R$41,900k of cash, so the company can grow again from strength.
      - It keeps the founders in control and the early investors on side.
      - It keeps the option to raise from the fund, or to sell, on better terms once the economics are proven.
    conditions: >-
      The recommendation depends on the professionals accepting the new commission. If many leave, the company should hold
      the commission at 18% and find the improvement in repeat bookings and lower marketing costs instead.
  implementation:
    - when: Months 1 to 2
      action: Agree the R$20m round with the early investors, with milestones for repeat bookings and the cost of winning customers.
      owner: The founders and the finance director
    - when: Months 1 to 3
      action: Pilot the 20% commission with the job guarantee in Campinas; stop paid marketing in Belo Horizonte.
      owner: Head of marketplace
    - when: Months 3 to 9
      action: Build repeat-booking features (saved professionals, reminders for regular jobs) and roll out the new terms if the pilot holds.
      owner: Head of product
    - when: Month 12
      action: Review each city against the rule of a customer worth at least twice what it costs to win; choose the next city, or reopen talks with the fund.
      owner: The board
  measures:
    - measure: Lifetime value against the cost to win a customer
      target: At least two times in every city where Mãozinha advertises, from 2.29 in São Paulo and 0.62 in Belo Horizonte today.
      review: Every quarter, city by city
    - measure: Repeat bookings
      target: The share of customers booking again rising in every city, towards São Paulo's 65%.
      review: Every month
    - measure: Professionals
      target: Active professionals holding at about 6,200 or more after the commission change.
      review: Every month
    - measure: Cash
      target: At or above the plan's path to R$41,900k at the end of 2027.
      review: Every month
  limitations:
    - Repeat rates in the newer cities are early figures, and lifetime values built on them are rough.
    - The forecasts for each plan are the finance team's, and growth rates two years out are guesses.
    - The analysis treats a customer's value as contribution over an expected lifetime and does not discount it; a stricter measure would lower every city's figure.
  changeMind:
    - If a rival began to dominate São Paulo, the company's strongest city, holding back would be riskier than growing.
    - If new evidence showed that customers in the newer cities come back more as the service matures, the case for growth would strengthen.
    - If the early investors would not put in R$20m, plan B becomes the safer route to survival.
  exhibits:
    - id: ex-A1
      title: What a customer is worth in each city, 2025 (R$)
      kind: table
      provenance: simulated-data
      columns:
        - { label: City }
        - { label: Cost to win a customer, numeric: true, format: d2 }
        - { label: Lifetime value of a customer, numeric: true, format: d1 }
        - { label: Lifetime value ÷ cost to win, numeric: true, format: d2 }
        - { label: Months to repay the cost to win, numeric: true, format: d1 }
      rows:
        - ['São Paulo (since 2022)', 90.00, 205.7, 2.29, 15.0]
        - ['Campinas (since 2023)', 110.00, 180.0, 1.64, 18.3]
        - ['Rio de Janeiro (since 2024)', 150.00, 144.0, 0.96, 25.0]
        - ['Belo Horizonte (since 2025)', 210.00, 130.9, 0.62, 35.0]
      checks:
        - { column: Cost to win a customer, is: '{ex-1|*|Cost to win a customer (R$)}' }
        - { column: Lifetime value of a customer, is: '{@customer-contribution} / (1 - {ex-1|*|Customers who book again the next year (%)} / 100)' }
        - { column: Lifetime value ÷ cost to win, is: '{Lifetime value of a customer} / {Cost to win a customer}' }
        - { column: Months to repay the cost to win, is: '{Cost to win a customer} / ({@customer-contribution} / 12)' }
      note: Lifetime value is the yearly contribution of R$72 times the expected number of years a customer stays, 1 ÷ (1 − the share who book again). It is not discounted. These are measures beyond the IB course, used by investors in start-ups.
      source: The Business Brief's analysis of Exhibit 1 (simulated data).


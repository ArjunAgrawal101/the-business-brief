frameworks:
  - id: business-model-canvas
    use: Map how Mãozinha creates value for two customer groups, households and professionals, and where its costs and revenue come from.
  - id: smart-objectives
    use: Turn "fix the economics" into measurable targets for repeat bookings and the cost of winning customers.
  - id: ansoff-matrix
    use: Opening in new cities is market development; better repeat bookings in existing cities is market penetration.
  - id: balanced-scorecard
    use: Judge progress on customers and professionals as well as on the finances.

tools:
  - { kind: lab, id: unit-economics, use: Work a customer's lifetime value and the cost of winning them for each city. }
  - { kind: lab, id: start-up-costs, use: Test how long the cash lasts under different rates of loss. }
  - { kind: lab, id: scaling-failure-and-exit, use: 'The Lab''s briefing on when to scale, when to stop and when to sell.' }
  - { kind: calculator, id: cash-flow-forecast, use: Build a month-by-month forecast for plan C. }
  - { kind: toolkit, id: ansoff-matrix, use: The toolkit guide to the directions of growth. }

beyond:
  - idea: Unit economics and the limits to growth
    body: >-
      Investors in start-ups judge growth by the economics of each customer: what it costs to win one, what they contribute
      and how long they stay. Penrose's older argument adds that a firm also cannot grow faster than its managers can learn
      to run it. Together they explain why the fastest growth is not always the most valuable.
    terms: [unit-economics, customer-acquisition-cost, customer-lifetime-value, churn-rate, burn-rate, runway, network-effects, dilution, venture-capital]
    sources: [bbr-penrose-1959]

sources: [bbr-method, bbr-penrose-1959]
method: >-
  Mãozinha, its founders, its investors and the delivery app are fictional, and every figure is simulated for teaching,
  though the cities are real. Revenue, contribution and results in Exhibit 2 follow from the value of bookings, the 18%
  commission and the 50% contribution margin; the costs of winning customers in Exhibit 1 from marketing and new
  customers; the plans in Exhibit 3 from the stated assumptions; and the lifetime values in Exhibit A1 from the yearly
  contribution and the repeat rates. The integrity check reworks every figure on every build.

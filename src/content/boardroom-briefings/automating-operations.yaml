stakeholders:
  - name: Anna Whitmore and the family board
    side: internal
    interest: high
    power: high
    wants: A bakery that stays competitive for the next generation, and keeps its name as a good employer.
    implications: >-
      Buying the line commits NZ$4,200k of the family's capital for seven years; leasing commits a fee that can be ended
      after three. Either way, the family's reputation rides on how the change is made.
  - name: The packing hall staff
    side: internal
    interest: high
    power: low
    wants: Secure jobs and safer work; some would welcome an end to the heaviest tasks.
    implications: >-
      Full automation leaves 12 roles where there are 38. Ten could move to the new sourdough line; the rest of the change
      would have to come from people leaving.
  - name: The food workers' union
    side: external
    interest: high
    power: medium
    wants: No compulsory redundancies, retraining for those who stay, and limits on how the cameras' data is used.
    implications: >-
      A dispute could delay the project and damage trust across the plant; an agreement could make the change a model
      for the industry.
  - name: Supermarket customers
    side: external
    interest: medium
    power: high
    wants: Lower prices, consistent quality and reliable deliveries.
    implications: >-
      Fewer crushed or badly sealed loaves (rejects falling from 2.4% to 0.8%) would please them; a difficult installation
      that disrupts deliveries would not.
  - name: Other employees
    side: internal
    interest: medium
    power: low
    wants: To know whether their own work is next.
    implications: >-
      How the bakery treats the packing hall will shape how the rest of the workforce responds to every change after it.
  - name: The engineering firm
    side: external
    interest: high
    power: medium
    wants: A sale or a long lease, and a reference customer.
    implications: >-
      Under a lease it keeps the risk of the equipment underperforming; under a sale, the bakery does.

options:
  - id: A
    label: Buy the full robotic line
    summary: >-
      Buy robotic packing and palletising with camera inspection for NZ$4,200k, install it in one stage, and redeploy or
      release the staff whose roles disappear.
    requires: NZ$4,200k of capital, 12 operators and technicians, and agreement with the union on the people plan.
    upside: The largest saving, NZ$1,540k a year, fewer rejects, and the bakery owns the asset.
    risks: >-
      Higher fixed costs whatever happens to sales; a single installation that could disrupt deliveries; 26 roles removed
      at once; and the risk that the equipment underperforms falls on the bakery.
    evidence: [ex-3, ex-4]
  - id: B
    label: Automate palletising only
    summary: >-
      Automate the heaviest, most dangerous task for NZ$1,300k and keep packing by hand for now.
    requires: NZ$1,300k and two technicians.
    upside: Most of the injuries removed, eight roles affected rather than 26, and a smaller bet.
    risks: A saving of only NZ$494k a year, no camera inspection, and the packing roles' turnover and costs unchanged.
    evidence: [ex-2, ex-4]
  - id: C
    label: Lease the full robotic line
    summary: >-
      Take the same line on a lease of NZ$1,020k a year, including maintenance, which the bakery can end after three
      years; install it in two stages over 18 months.
    requires: The lease contract, the 12 operators and technicians, and the same people plan as A, phased with natural wastage.
    upside: >-
      Almost the same value over seven years as buying, with no capital, maintenance risk carried by the engineering firm,
      and a way out if a supermarket contract is lost.
    risks: A smaller saving each year because of the fee; a long-term relationship with one supplier; the same 26 roles removed in the end.
    evidence: [ex-3, ex-4]
  - id: D
    label: Improve the manual line
    summary: >-
      Keep people at the end of the line, add lifting aids, and train the hall in lean methods to cut waste and injuries,
      for NZ$150k.
    requires: Training and the staff's ideas; no new technology.
    upside: Jobs kept, a better working environment, and the cheapest option.
    risks: A saving of only NZ$220k a year; turnover and repetitive work remain; rivals that automate gain a cost advantage.
    evidence: [ex-2, ex-4]

criteria:
  - id: return
    criterion: Financial return
    weight: 25
    measure: Net present value at 8% over the line's seven-year life, payback and the average rate of return.
  - id: people
    criterion: People
    weight: 25
    measure: Jobs, safety, and the bakery's relations with its workforce and the union.
  - id: risk
    criterion: Risk
    weight: 20
    measure: The capital at stake, the fixed costs the bakery must carry, and the risk of a difficult installation.
  - id: quality
    criterion: Quality and capacity
    weight: 15
    measure: Fewer rejected loaves, and the line's ability to meet the supermarkets' standards.
  - id: flexibility
    criterion: Flexibility
    weight: 15
    measure: How easily the bakery could change course if a large contract were lost or a better technology appeared.

questions:
  course:
    - id: break-even
      command: calculate
      marks: 4
      subtopics: ['5.5']
      prompt: Using Exhibit 3, calculate the break-even quantity of loaves for the manual line and for the automated line if it is bought.
      notes: >-
        Break-even quantity = fixed costs ÷ contribution per loaf. Manual: 8,960 ÷ (2.10 − 1.46) = 8,960 ÷ 0.64 = 14,000
        thousand loaves, 14.0 million. Bought: 10,706 ÷ (2.10 − 1.33) = 10,706 ÷ 0.77 = 13,903.9 thousand, about 13.9
        million. The higher fixed costs are more than offset by the larger contribution per loaf (Exhibit A2).
    - id: turnover
      command: calculate
      marks: 2
      level: HL
      subtopics: ['2.4']
      prompt: Using Exhibit 2, calculate the labour turnover in the packing hall in 2025.
      notes: >-
        Labour turnover = staff who left ÷ average number employed × 100 = 9 ÷ 38 × 100 = 23.7%. At that rate about 13.5 people
        would leave over 18 months, which is why a phased installation could avoid most compulsory redundancies.
    - id: resistance
      command: explain
      marks: 4
      subtopics: ['2.1']
      prompt: Explain two reasons why the packing hall staff might resist the automation.
      notes: >-
        Fear of losing their jobs (26 roles removed under A or C); fear that the remaining work will be watched and paced by
        the machines; loss of the skills and team they know; distrust of management's promises. Each reason explained in
        the context of the case.
    - id: monitoring
      command: discuss
      marks: 10
      level: HL
      subtopics: ['5.9']
      prompt: Discuss the ethical implications of using the camera system's data to monitor the performance of the operators.
      notes: >-
        Strong answers distinguish monitoring the line (to find faults and improve quality) from monitoring people (digital
        Taylorism), weigh efficiency and safety gains against privacy, trust and stress, consider the union's demand for
        limits, and reach a judgement, such as using the data for the process but not to rank individuals.
    - id: buy-or-lease
      command: evaluate
      marks: 10
      subtopics: ['3.8', '3.2']
      prompt: Evaluate whether Tasman Loaf Company should buy or lease the robotic line.
      notes: >-
        Good answers compare the appraisal (buying: NPV NZ$3,336.2k, payback 3.1 years, ARR 20.6%; leasing: NZ$3,319.1k
        with no capital), notice that the costs over seven years are almost the same (NZ$5,293.3k to buy and maintain
        against NZ$5,310.4k of lease fees), and decide on flexibility, risk and the use of capital. A judgement either way can
        earn full marks if it is supported.
  seminar:
    - id: tasks
      prompt: Which tasks in the packing hall would the machines take, and which would they make more valuable? What does your answer mean for training?
      notes: >-
        Placing and stacking go to the robots; fixing jams, changing products, checking quality and maintaining the line
        grow in value. The answer points to training the people who stay as operators and technicians, not just to
        reducing headcount.
    - id: promise
      prompt: Is a promise of no compulsory redundancies a cost to the bakery or an investment by it?
      notes: >-
        It costs time, since the change must follow natural wastage, and money, in retraining. It may buy cooperation, a
        smoother installation and the trust of the rest of the workforce. Good answers estimate both sides from the case.
    - id: own-or-lease
      prompt: If buying and leasing cost about the same over an asset's life, what should decide between them?
      notes: >-
        Who carries the risk of the asset failing or becoming obsolete, the value of being able to stop, the use of the
        capital elsewhere, and the strength of the relationship with the supplier.

analysis:
  verdict: >-
    Automate the packing hall, but lease the line and install it in two stages over 18 months (option C). Over seven years
    leasing is worth almost exactly what buying is worth (NZ$3,319.1k against NZ$3,336.2k at 8%), but it needs no capital,
    leaves the risk of the equipment with its maker, and lets the bakery stop after three years if it loses a large
    contract. Installing in stages, palletising first, lets the change follow the hall's high labour turnover, so that with
    10 people moved to the new sourdough line it should need few compulsory redundancies, and perhaps none.
  evidence:
    - >-
      Automation pays on every measure. Buying the full line has an NPV of NZ$3,336.2k, a payback of 3.1 years and an ARR of
      20.6%; leasing it has a present value of NZ$3,319.1k with no capital at all (Exhibit A1). Palletising alone (NZ$1,160.8k)
      and the lean improvements (NZ$995.4k) are worth much less.
    - >-
      Buying and leasing cost almost the same over the line's life: NZ$5,293.3k to buy and maintain against NZ$5,310.4k of
      lease fees, in present values at 8%. The choice between them is about risk and flexibility, not price.
    - >-
      Automation does not make the bakery riskier on its present volumes. Because each loaf contributes more, NZ$0.77 against
      NZ$0.64, the break-even quantity barely changes: 14,000 thousand loaves for the manual line, 13,903.9 thousand if the
      line is bought and 14,176.6 thousand if it is leased (Exhibit A2).
    - >-
      The people case is easier than it looks. Labour turnover in the hall was 23.7% in 2025, so over 18 months about 13.5
      people would leave in the normal course of things. With 10 staff moving to the sourdough line, the 16 other roles that
      go could largely be met from people who would have left anyway.
  assumptions:
    - assumption: The line will save NZ$1,540k a year if bought, or NZ$730k if leased, from the second year.
      test: The figures come from the seller and the finance team. Ask for references from bakeries running the same line, and agree performance terms in the lease.
    - assumption: Rejected loaves will fall from 2.4% to 0.8% of output.
      test: Run a trial of the camera inspection on one product before committing, and measure the rejection rate.
    - assumption: Labour turnover in the hall will stay near its 2025 rate of 23.7%.
      test: Turnover may fall once staff know their jobs are at risk, since fewer will leave by choice. Plan the stages so that the bakery is not relying on departures that may not come.
    - assumption: Volumes will stay near 18.2 million loaves a year.
      test: Exhibit A2 shows the margin of safety under each option. Check when each supermarket contract ends.
  tradeoffs:
    - title: Owning, or the right to stop
      body: >-
        Buying the line saves a little money over seven years and gives the bakery an asset; leasing costs a little more
        and gives it the right to stop after three. For a family business with large customers on fixed-term contracts,
        the right to stop is worth paying for.
    - title: Speed, or the people plan
      body: >-
        Installing everything at once brings the savings forward and cuts 26 roles in one step. Installing in stages delays
        some savings, but lets the change follow natural wastage and earns the cooperation of the staff who remain.
    - title: Better data, or more surveillance
      body: >-
        The cameras that catch a badly sealed loaf can also time every operator. Using the data to improve the process
        builds trust; using it to rank people is digital Taylorism, and the union will resist it.
  alternatives:
    - option: A
      fit: conditional
      body: >-
        Defensible if the bakery wants the asset and is confident in its volumes. It is worth almost exactly what C is worth,
        but puts NZ$4,200k of the family's capital and the risk of the equipment on the bakery.
    - option: B
      fit: conditional
      body: >-
        Defensible as a cautious first step that removes most of the injuries with little disruption, but it captures only a
        third of the value and leaves the packing hall's turnover and rejects untouched.
    - option: C
      fit: strong
      body: >-
        The best supported. It captures almost all of the value of automation, keeps capital free, moves the equipment risk
        to its maker and leaves a way out, and its staged installation fits the people plan.
    - option: D
      fit: weak
      body: >-
        Weakly supported as the whole answer. Lean methods and lifting aids help, but they leave the bakery behind rivals
        that automate, and the work in the hall would stay repetitive and heavy.
  scores:
    - { option: A, scores: { return: 5, people: 2, risk: 2, quality: 5, flexibility: 2 }, total: 3.2 }
    - { option: B, scores: { return: 3, people: 4, risk: 4, quality: 3, flexibility: 4 }, total: 3.6 }
    - { option: C, scores: { return: 5, people: 2, risk: 4, quality: 5, flexibility: 5 }, total: 4.05 }
    - { option: D, scores: { return: 2, people: 5, risk: 5, quality: 2, flexibility: 4 }, total: 3.65 }
  recommendation:
    option: C
    decision: >-
      Lease the full robotic line, with performance terms in the contract, and install it in two stages: palletising in the
      first six months, packing and camera inspection by month 18. Agree a people plan with the union before signing: no
      compulsory redundancies if natural wastage and redeployment allow, retraining for the 12 operator and technician
      roles, and a written limit on using the cameras' data to monitor individuals.
    reasons:
      - Leasing is worth almost the same as buying over seven years, with no capital at risk.
      - The engineering firm carries the risk of the equipment underperforming, and the bakery can stop after three years.
      - Starting with palletising removes the injuries first, where the case for change is clearest to everyone.
      - Phasing the change over 18 months lets it follow the hall's turnover, which protects the people and the bakery's name.
    conditions: >-
      The recommendation depends on the lease terms. If the engineering firm will not accept performance guarantees or an
      exit after three years, buying (option A) offers the same value with more control.
  implementation:
    - when: Months 1 to 2
      action: Meet the union and the hall staff; share the figures; agree the people plan and the limits on the cameras' data.
      owner: Anna Whitmore and the operations director
    - when: Months 2 to 3
      action: Negotiate the lease with performance terms and the option to end it after three years; run a trial of the camera inspection.
      owner: Finance director
    - when: Months 3 to 6
      action: Install robotic palletising; begin training the first operators and technicians from the hall's own staff.
      owner: Operations director
    - when: Months 6 to 18
      action: Install robotic packing and camera inspection; move 10 staff to the sourdough line as it opens; fill no vacancies in the hall.
      owner: Operations director with the head of people
    - when: Month 24
      action: Review the line against the measures below, and decide whether to keep leasing or to buy at the lease's end.
      owner: The board
  measures:
    - measure: Net saving
      target: At least NZ$730k a year once both stages are running, as estimated in Exhibit 4.
      review: Every quarter
    - measure: Rejected loaves
      target: Down from 2.4% of output to 0.8%.
      review: Every month
    - measure: Injuries
      target: No lost-time injuries in palletising, down from seven in 2025.
      review: Every month
    - measure: People
      target: No compulsory redundancies; every operator and technician role filled from the hall's own staff.
      review: At each stage
  limitations:
    - The savings are estimates by the seller and the finance team, and an automated line often runs below its design speed in its first months.
    - The appraisal values cash; it cannot put a figure on the trust the bakery gains or loses with its workforce.
    - Natural wastage is uncertain, and may fall once staff know their roles are changing.
  changeMind:
    - If the lease will not include performance terms or an exit, buying (A) becomes the better route to the same line.
    - If a large supermarket contract were lost, the lower fixed costs of B or D would matter more than the savings of C.
    - If the union and the staff would rather take a larger change at once with generous redundancy terms, a one-stage installation would bring the savings forward.
  exhibits:
    - id: ex-A1
      title: The proposals appraised at 8% over seven years (NZ$000)
      kind: table
      provenance: simulated-data
      columns:
        - { label: Proposal }
        - { label: Payback (years), numeric: true, format: d1 }
        - { label: ARR (%), numeric: true, format: d1 }
        - { label: NPV at 8%, numeric: true, format: d1 }
      rows:
        - ['A. Buy the full robotic line', 3.1, 20.6, 3336.2]
        - ['B. Automate palletising only', 2.9, 22.4, 1160.8]
        - ['C. Lease the full robotic line', 'No capital', 'No capital', 3319.1]
        - ['D. Improve the manual line', 0.7, 132.4, 995.4]
      checks:
        - { column: Payback (years), rows: ['A. Buy the full robotic line', 'B. Automate palletising only', 'D. Improve the manual line'], is: 'payback(-{ex-4|*|Capital cost (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)} - {ex-4|*|One-off cost in year 1 (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)})' }
        - { column: ARR (%), rows: ['A. Buy the full robotic line', 'B. Automate palletising only', 'D. Improve the manual line'], is: 'arr(-{ex-4|*|Capital cost (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)} - {ex-4|*|One-off cost in year 1 (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)})' }
        - { column: NPV at 8%, rows: ['A. Buy the full robotic line', 'B. Automate palletising only', 'D. Improve the manual line'], is: 'npv(8, -{ex-4|*|Capital cost (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)} - {ex-4|*|One-off cost in year 1 (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)}, {ex-4|*|Net saving a year (NZ$000)})' }
        - { column: NPV at 8%, rows: ['C. Lease the full robotic line'], is: '({ex-4|*|Net saving a year (NZ$000)} - {ex-4|*|One-off cost in year 1 (NZ$000)}) * df(8, 1) + {ex-4|*|Net saving a year (NZ$000)} * (df(8, 2) + df(8, 3) + df(8, 4) + df(8, 5) + df(8, 6) + df(8, 7))' }
      note: Each year's saving is assumed to arrive evenly through the year; year 1 bears the one-off cost. Leasing needs no capital, so it has no payback or ARR; its figure is the present value of its savings. D's payback and ARR are high because it costs so little, but its saving is small.
      source: The Business Brief's analysis of Exhibit 4, with the guide's discount factors (simulated data).
    - id: ex-A2
      title: Break-even under each way of running the line
      kind: table
      provenance: simulated-data
      columns:
        - { label: Line }
        - { label: Contribution (NZ$ a loaf), numeric: true, format: d2 }
        - { label: Break-even quantity (000 loaves), numeric: true, format: d1 }
        - { label: Margin of safety at 18.2 million loaves (000), numeric: true, format: d1 }
        - { label: Profit at 18.2 million loaves (NZ$000), numeric: true, format: money }
      rows:
        - ['Manual, as now', 0.64, 14000.0, 4200.0, 2688]
        - ['Automated, bought', 0.77, 13903.9, 4296.1, 3308]
        - ['Automated, leased', 0.77, 14176.6, 4023.4, 3098]
      checks:
        - { column: Contribution (NZ$ a loaf), is: '{ex-3|*|Price (NZ$ a loaf)} - {ex-3|*|Variable cost (NZ$ a loaf)}' }
        - { column: Break-even quantity (000 loaves), is: '{ex-3|*|Fixed costs (NZ$000 a year)} / {Contribution (NZ$ a loaf)}' }
        - { column: Margin of safety at 18.2 million loaves (000), is: '{ex-1|Loaves sold (000)|2025} - {Break-even quantity (000 loaves)}' }
        - { column: Profit at 18.2 million loaves (NZ$000), is: '{ex-1|Loaves sold (000)|2025} * {Contribution (NZ$ a loaf)} - {ex-3|*|Fixed costs (NZ$000 a year)}' }
      note: Profit here leaves out the saving from fewer rejected loaves, NZ$320k a year under either automated line.
      source: The Business Brief's analysis of Exhibits 1 and 3 (simulated data).

course:
  subtopics:
    - { code: '5.2', note: 'Mass production and the move from labour-intensive to capital-intensive methods at the end of the line.' }
    - { code: '5.5', note: 'Break-even when automation turns variable costs into fixed costs, and the margin of safety.' }
    - { code: '5.6', note: 'Labour productivity, the defect rate and operating leverage.', level: HL }
    - { code: '5.9', note: 'Artificial intelligence in inspection, and digital Taylorism when its data is used to monitor employees.', level: HL }
    - { code: '2.1', note: 'Resistance to change, and human resource strategies that reduce it, such as natural wastage and redeployment.' }
    - { code: '2.4', note: 'Labour turnover in the packing hall (HL), and non-financial rewards such as job enrichment for the new roles.' }
    - { code: '3.8', note: 'Payback and the average rate of return for each proposal; at HL, net present value.' }
    - { code: '3.2', note: 'Leasing as a source of finance, against paying for the line from capital.' }
  terms: [capital-intensive-production, labour-intensive-production, mass-production, break-even-quantity, margin-of-safety, labour-productivity, defect-rate, operating-leverage, artificial-intelligence, digital-taylorism, employee-monitoring, resistance-to-change, natural-wastage, redundancy, labour-turnover, leasing, trade-union]

frameworks:
  - id: force-field-analysis
    use: Weigh the forces for automation (cost, safety, quality) against those against it (jobs, trust, capital) before planning the change.
  - id: scientific-management
    use: The robots complete a long move towards measured, standardized work; the cameras could extend it into digital Taylorism.
  - id: herzbergs-motivation-hygiene-theory
    use: Safer work removes a cause of dissatisfaction; operator and technician roles can add the motivators of responsibility and growth.
  - id: lewin-change-model
    use: Plan the change in stages, unfreezing with the facts, changing in two steps and refreezing around the new roles.

tools:
  - { kind: studio, id: force-field, use: Score the forces for and against automation. }
  - { kind: calculator, id: break-even-quantity, use: Rework break-even for the manual and automated lines. }
  - { kind: calculator, id: payback-period, use: Rework each proposal's payback. }
  - { kind: calculator, id: net-present-value, use: Rework the NPVs at 8% (HL). }
  - { kind: toolkit, id: force-field-analysis, use: The toolkit guide to force field analysis (HL). }

beyond:
  - idea: Tasks, not jobs
    body: >-
      The research argument that automation takes tasks rather than whole jobs changes the question the board asks. Instead
      of how many roles the robots replace, it asks which tasks they take, which become more valuable, and whether the
      bakery's people can move to those. Here, the operators and technicians who keep the line running are the jobs that
      grow.
    terms: [total-cost-of-ownership, overall-equipment-effectiveness]
    sources: [bbr-autor-2015]

sources: [bbr-method, bbr-autor-2015]
method: >-
  Tasman Loaf Company, its people and the engineering firm are fictional, and every figure is simulated for teaching.
  Revenue and profit in Exhibit 1 follow from the loaves sold, the price and the costs; the fixed costs in Exhibit 3 and the
  savings in Exhibit 4 are built from the stated costs of the roles, the technicians, maintenance, the lease and fewer
  rejects; the appraisal uses the guide's discount factors at 8% over seven years. The integrity check reworks every
  figure on every build.

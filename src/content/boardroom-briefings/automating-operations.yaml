# The Boardroom Briefings, No. 4. Tasman Loaf Company is fictional; every
# figure is simulated. Exhibit 1's revenue and profit, Exhibit 3's fixed costs
# and Exhibit 4's savings are worked by their checks from the figures below;
# the appraisal in Exhibit A1 uses the guide's discount factors at 8% over the
# line's seven-year life, and Exhibit A2 works break-even for each way of
# running the line.

number: 4
question: Should a business automate its operations?
title: Tasman Loaf Company weighs robots for its packing hall
dek: An Auckland bakery can automate the hardest, most repetitive work on its line. The numbers favour it; the question is how, and what happens to the 38 people who do that work now.
decisionType: automation
industry: manufacturing
functions: [operations, human-resources, finance]
keyConcepts: [change, ethics]
updated: 2026-11-16

company:
  name: Tasman Loaf Company
  fictional: true
  sector: Industrial bakery
  location: Auckland, New Zealand
  size: 260 employees; 18.2 million loaves and revenue of NZ$38.2m in 2025
  ownership: Privately held company, owned by the Whitmore family for three generations
currency: { code: NZD, symbol: 'NZ$', unit: thousand }

summary:
  situation: >-
    Tasman Loaf Company bakes bread for supermarkets' own labels and under its own name. At the end of its line, 38 people
    pack loaves into crates and stack the crates onto pallets by hand. The work is repetitive and heavy: there were seven
    injuries in the palletising area last year, and nearly a quarter of the hall's staff left.
  decision: >-
    Whether to automate the packing hall, and how: buy a robotic line with camera inspection, automate only the
    palletising, lease the robotic line instead of buying it, or keep the manual line and improve it.
  stakes: >-
    Full automation would save about NZ$1.5m a year and cut rejected loaves, but it would replace 38 roles with 12. How the
    bakery makes the change will decide whether its workforce, its union and its customers trust it afterwards.

background:
  - >
    The Whitmore family opened its first bakery in Auckland in 1962. Today Tasman Loaf Company runs one large plant in
    South Auckland with 260 employees on two shifts. It baked 18.2 million loaves in 2025 and sold them for an average of
    NZ$2.10 each, earning revenue of NZ$38.2m and a profit of NZ$2.7m (Exhibit 1). Anna Whitmore, the third generation of
    the family, has been managing director since 2021.
  - >
    The bakery's ovens are modern, but the end of the line is not. Loaves leave the slicers and baggers on a conveyor,
    and 28 packers place them in crates while 10 palletisers stack the crates, each up to a tonne an hour, onto pallets for
    the delivery trucks. The 38 roles cost NZ$2,366k a year. In 2025, nine of the hall's staff left, and seven lost time
    to injuries (Exhibit 2). Rejected and returned loaves, mostly crushed or badly sealed, came to 2.4% of output.
  - >
    An engineering firm has proposed a robotic packing and palletising line with camera inspection, for NZ$4,200k or for a
    yearly fee under a lease that the bakery could end after three years. The food workers' union, which represents most
    of the hall's staff, has asked for a meeting. The board meets in a month.

context:
  - >
    Food manufacturing has automated steadily: mixing and baking first, then slicing and wrapping, and now the handling at
    the end of the line, where robots have become cheaper, faster to install and better at handling soft products. The work
    that remains manual tends to be the most repetitive and the most physically demanding.
  - >
    Supermarkets buy own-label bread on price, quality and reliability, and can move a contract to another bakery at the
    end of its term. A bakery that cannot match its rivals' costs or deliver consistently risks its largest customers, but
    one that automates takes on higher fixed costs, which have to be paid even if a contract is lost.
  - >
    Camera inspection using machine learning can check every loaf for shape, colour and seal at line speed. The same
    systems record how the line runs and who intervenes, which raises questions about how far the data should be used to
    monitor the people who work beside the machines.

evidence:
  - kind: company
    title: A profitable bakery with thin margins
    body: >-
      The bakery made NZ$2,688k of profit on NZ$38,220k of revenue in 2025 (Exhibit 1). Each loaf sold for NZ$2.10 and cost
      NZ$1.46 in materials and direct labour, a contribution of NZ$0.64 towards fixed costs of NZ$8,960k.
    exhibits: [ex-1]
  - kind: company
    title: A hard place to work
    body: >-
      Nine of the 38 packing hall staff left in 2025, and there were seven lost-time injuries in palletising (Exhibit 2).
      High labour turnover means constant recruitment and training, and the injuries carry costs beyond the bakery's
      accounts.
    exhibits: [ex-2]
  - kind: company
    title: The cost of each way forward
    body: >-
      The engineering firm and the finance team estimate a net saving of NZ$1,540k a year from buying the full line, after
      the 12 operators and technicians it needs and its maintenance, and including NZ$320k a year of fewer rejected loaves.
      Leasing saves less each year, NZ$730k, because of the lease fee, but needs no capital (Exhibit 4).
    exhibits: [ex-3, ex-4]
  - kind: research
    title: Automation takes tasks, not whole jobs
    body: >-
      Research on workplace automation argues that machines take over particular tasks, usually the routine ones, rather
      than whole jobs, and that they can make the tasks people keep, such as solving problems and handling exceptions, more
      valuable. Whether workers gain or lose depends on whether they move to those tasks.
    sources: [bbr-autor-2015]
  - kind: market
    title: How bakeries automate
    body: >-
      Bakeries can buy automated lines outright, lease them, or pay a supplier by the hour or the unit for equipment it owns
      and maintains. Leasing and paying for use cost more over an asset's life, as a rule, but keep capital free and let the
      bakery change course if a contract is lost.

financials:
  summary: >-
    Exhibit 1 gives the bakery's results for 2025. Exhibit 3 gives the price, variable cost per loaf and fixed costs under
    each way of running the line, for break-even analysis; buying the line adds depreciation over its seven-year life, the
    new technicians and a maintenance contract, while leasing adds the fee and the technicians. Exhibit 4 gives each
    proposal's capital cost, its net saving each year and its one-off cost in the first year. The bakery appraises
    investments at 8% over seven years.
  exhibits: [ex-1, ex-3, ex-4]


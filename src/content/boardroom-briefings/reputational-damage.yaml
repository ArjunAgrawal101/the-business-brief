# The Boardroom Briefings, No. 10. Rowan & Rill and the campaign group are
# fictional; every figure is simulated. Exhibit 3's margins, Exhibit 2's
# weighted average and Exhibit 4's forecast profits are worked by their
# checks; Exhibit A1 extends the forecasts to 2029 on the stated assumptions.

number: 10
question: How should a company respond to reputational damage?
title: Rowan & Rill's recycled range turns out to be partly recycled
dek: A Bristol clothing brand built on sustainability has been found to have overstated its green claims. Sales and trust have fallen; the board must decide what kind of company it will be when they recover.
decisionType: reputation-recovery
industry: fashion
functions: [marketing, operations, strategy]
keyConcepts: [ethics, sustainability]
updated: 2026-11-16

company:
  name: Rowan & Rill
  fictional: true
  sector: Outdoor and casual clothing
  location: Bristol, England
  size: 380 employees, nine shops and revenue of £72.4m in 2025, most of it online
  ownership: Privately held company, 55% owned by its founder and 45% by private investors
currency: { code: GBP, symbol: '£', unit: thousand }

summary:
  situation: >-
    Rowan & Rill sold its Recloth range as made from 100% recycled materials and carbon neutral. In May 2026 the advertising
    regulator ruled both claims misleading: tests found the range was on average 61.6% recycled, and the carbon-neutral claim
    rested on offsets whose benefits could not be verified. Recloth sales fell by 38.0% over the summer, and trust in the
    brand fell with them.
  decision: >-
    How to respond: contest the ruling and defend the brand's record, correct the claims and apologize, rebuild the range
    so that every claim can be independently verified, or retire the Recloth name and start again.
  stakes: >-
    The brand's promise of sustainability is the reason many customers buy from it. The response decides whether that
    promise can be trusted again, and what it will cost the company to make it true.

background:
  - >
    Holly Mercer founded Rowan & Rill in Bristol in 2010, selling jackets and fleeces for walking and everyday wear. It grew
    online and now has nine shops, 380 employees and revenue of £72.4m, about 70% of it from its website (Exhibit 3). Its
    customers are loyal and, by its own surveys, chose the brand above all for its values. Holly owns 55% of the company;
    private investors own the rest.
  - >
    In 2023 the company launched Recloth, a range it described as made from 100% recycled materials and carbon neutral. It
    became the brand's best-known line. In 2025 a campaign group, which tests clothing claims, sent Recloth garments to an
    independent laboratory and complained to the advertising regulator. The tests found recycled content averaging 61.6%
    across the range, and as little as 48% in jackets (Exhibit 2).
  - >
    The regulator's ruling, in May 2026, was reported by the national press and shared widely online. Recloth sales from
    June to September fell from £6,000k a year earlier to £3,720k; the brand's trust score fell from 71 to 48 out of 100
    (Exhibit 1); three retailers that stock the brand paused their orders. The company had not checked its suppliers'
    claims for itself. The board meets next month to agree its response.

context:
  - >
    Claims about sustainability have become central to how many clothing brands compete. Customers who care about them
    are often willing to pay more and stay loyal, but they rarely have the means to check what they are told, so the claims
    rest on trust, and on the rules and regulators that police them.
  - >
    Clothing supply chains are long and spread across many countries: fibre makers, spinners, mills, garment factories and
    agents. A brand that buys finished garments may know little of what happens in its suppliers' suppliers, unless it pays
    for audits, certification and tracing.
  - >
    Damage to a reputation tends to be quick and recovery slow. Customers forgive a mistake more readily than an attempt to
    hide or excuse it, and they judge a company less by its first statement than by whether its later actions match its
    words.

evidence:
  - kind: company
    title: A sharp fall in a strong business
    body: >-
      Revenue rose from £64,200k in 2024 to £72,400k in 2025 at a steady operating margin of 9.0%. The forecast for 2026 is
      £63,900k, down 11.7%, with the margin falling to 4.0% (Exhibit 3).
    exhibits: [ex-3]
  - kind: company
    title: Trust fell faster than sales
    body: >-
      Between January and September 2026 the brand's trust score fell from 71 to 48, the share of shoppers who would consider
      buying from it from 44% to 29%, and its net promoter score from +42 to −6 (Exhibit 1).
    exhibits: [ex-1]
  - kind: company
    title: What was actually in the range
    body: >-
      Weighted by the units sold in 2025, Recloth's recycled content was 61.6%, from 81% in fleeces to 48% in jackets
      (Exhibit 2). The suppliers' certificates the company relied on covered the fibre, not the finished garments.
    exhibits: [ex-2]
  - kind: research
    title: The response should match the responsibility
    body: >-
      Situational crisis communication theory holds that the more responsibility the public attributes to an organization
      for a crisis, the more its response must accept that responsibility, apologize and put things right. For a crisis the
      organization could have prevented, denial and excuses tend to make the damage worse.
    sources: [adv-strat-coombs-2007]
  - kind: research
    title: Reputation is an asset
    body: >-
      Corporate reputation can be treated as an intangible asset: the judgements that customers, employees, investors and
      others form of a company over time, which shape what they are willing to pay it, work for it and invest in it.
    sources: [bbr-fombrun-1996]

financials:
  summary: >-
    Exhibit 3 gives the company's results for 2024 and 2025 and its forecast for 2026. Exhibit 4 gives the management team's
    estimates for each response: its one-off cost, any cost that would recur each year, and the revenue and operating profit
    it would produce in 2027. The forecasts assume the operating margin before those recurring costs returns to 9.0%.
  exhibits: [ex-3, ex-4]


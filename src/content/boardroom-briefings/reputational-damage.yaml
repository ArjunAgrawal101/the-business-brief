    totals: ['The whole range, weighted by units sold']
    checks:
      - { row: 'The whole range, weighted by units sold', columns: [Units sold in 2025 (000)], is: '{Fleeces} + {Jackets} + {T-shirts and tops} + {Trousers}' }
      - { row: 'The whole range, weighted by units sold', columns: [Recycled content (%)], is: '({ex-2|Fleeces|Units sold in 2025 (000)} * {Fleeces} + {ex-2|Jackets|Units sold in 2025 (000)} * {Jackets} + {ex-2|T-shirts and tops|Units sold in 2025 (000)} * {T-shirts and tops} + {ex-2|Trousers|Units sold in 2025 (000)} * {Trousers}) / {ex-2|The whole range, weighted by units sold|Units sold in 2025 (000)}' }
    note: Recycled content is the share of each garment's fibre by weight that came from recycled sources, from laboratory tests of samples from each family.
    source: Independent laboratory tests commissioned by the campaign group and confirmed by Rowan & Rill (simulated).

  - id: ex-4

      - ['B. Correct the claims and apologize', 2150, 0, 70000, 6300]
      - ['C. Rebuild the range so every claim is verified', 2500, 1500, 74500, 5205]
      - ['D. Retire Recloth and relaunch under a new name', 3900, 0, 66000, 5940]
    checks:
      - { column: Operating profit in 2027, is: '{Revenue in 2027} * {@base-margin} / 100 - {Extra cost each year}' }
      - { column: One-off cost, rows: ['C. Rebuild the range so every claim is verified'], is: '{ex-4|B. Correct the claims and apologize|One-off cost} + {@tracing-platform}' }

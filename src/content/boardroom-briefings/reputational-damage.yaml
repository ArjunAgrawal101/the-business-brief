      apology campaign. C adds a platform that traces every garment to its fibre (£350k), and each year independent
      certification and audits (£900k) and a premium for verified recycled fibre (£2,400k), partly recovered by a 6% price
      rise on the range (£1,800k). D writes off stock with the old labels and pays for a new brand.
    source: Management team's estimates for the board (simulated).


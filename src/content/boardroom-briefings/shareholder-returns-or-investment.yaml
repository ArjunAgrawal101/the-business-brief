    - id: ex-A2
      title: Each option's effect on earnings per share and gearing
      kind: table
      provenance: simulated-data
      columns:
        - { label: Option }
        - { label: Shares bought back (millions), numeric: true, format: d2 }
        - { label: Shares left (millions), numeric: true, format: d2 }
        - { label: Earnings per share (€), numeric: true, format: d2 }
        - { label: Gearing ratio (%), numeric: true, format: d1 }
      rows:
        - ['As in 2025', 0.00, 50.00, 4.62, 12.3]
        - ['A. Buy back €400m', 6.45, 43.55, 5.11, 14.7]
        - ['C. Buy back €100m', 1.61, 48.39, 4.73, 12.8]
        - ['D. Borrow €400m for the buyback', 6.45, 43.55, 4.98, 28.7]
      checks:
        - { column: Shares left (millions), is: '{ex-2|Shares in issue (millions)|2025} - {Shares bought back (millions)}' }
        - { column: Shares bought back (millions), rows: ['A. Buy back €400m', 'D. Borrow €400m for the buyback'], is: '{@buyback} / {ex-2|Share price (€)|2025}' }
        - { column: Shares bought back (millions), rows: ['C. Buy back €100m'], is: '{@c-buyback} / {ex-2|Share price (€)|2025}' }
        - { column: Earnings per share (€), rows: ['A. Buy back €400m'], is: '({ex-1|2025|Net profit} - {@lost-interest}) / ({ex-2|Shares in issue (millions)|2025} - {@buyback} / {ex-2|Share price (€)|2025})' }
        - { column: Earnings per share (€), rows: ['C. Buy back €100m'], is: '({ex-1|2025|Net profit} - {@c-buyback} * {@cash-yield} / 100 * (1 - {@tax-rate} / 100)) / ({ex-2|Shares in issue (millions)|2025} - {@c-buyback} / {ex-2|Share price (€)|2025})' }
        - { column: Earnings per share (€), rows: ['D. Borrow €400m for the buyback'], is: '({ex-1|2025|Net profit} - {@bond-interest} * (1 - {@tax-rate} / 100)) / ({ex-2|Shares in issue (millions)|2025} - {@buyback} / {ex-2|Share price (€)|2025})' }
        - { column: Gearing ratio (%), rows: ['A. Buy back €400m'], is: '{ex-2|Borrowings, due after more than a year (€m)|2025} / ({ex-2|Borrowings, due after more than a year (€m)|2025} + {ex-2|Equity (€m)|2025} - {@buyback}) * 100' }
        - { column: Gearing ratio (%), rows: ['C. Buy back €100m'], is: '{ex-2|Borrowings, due after more than a year (€m)|2025} / ({ex-2|Borrowings, due after more than a year (€m)|2025} + {ex-2|Equity (€m)|2025} - {@c-buyback}) * 100' }
        - { column: Gearing ratio (%), rows: ['D. Borrow €400m for the buyback'], is: '({ex-2|Borrowings, due after more than a year (€m)|2025} + {@bond}) / ({ex-2|Borrowings, due after more than a year (€m)|2025} + {@bond} + {ex-2|Equity (€m)|2025} - {@buyback}) * 100' }
      note: >-
        Each buyback is at €62.00 a share and reduces equity by its cost. Spending cash loses the 3% it earns, and borrowing
        costs 5%, both after 30% tax; the figures use 2025's net profit and leave out the plant's own effects. Earnings per
        share is a measure beyond the IB course.
      source: The Business Brief's analysis of Exhibits 1 and 2 (simulated data).

course:
  subtopics:
    - { code: '1.3', note: 'Protecting shareholder value as an objective, and the conflict between short-term and long-term objectives.' }
    - { code: '1.4', note: 'Conflict between an activist shareholder, long-term shareholders, employees and customers.' }
    - { code: '1.2', note: 'A publicly held company, owned by shareholders who can buy and sell its shares.' }
    - { code: '3.2', note: 'Retained profit as an internal source of finance, and loan capital (bonds) under option D.' }
    - { code: '3.4', note: 'Dividends and retained profit in the statement of profit or loss.' }
    - { code: '3.6', note: 'The gearing ratio, and how borrowing to fund a buyback raises it.', level: HL }
    - { code: '3.8', note: 'Net present value at 8% in two cases, and the expected value across them (HL).' }
    - { code: '5.8', note: 'Investment in research and development for the products that will replace the old ones.', level: HL }
  terms: [shareholder-value, shareholder, publicly-held-company, dividend, retained-profit, loan-capital, gearing-ratio, net-present-value, product-portfolio, product-life-cycle, research-and-development, stakeholder-conflict]

frameworks:
  - id: bcg-matrix
    use: Combustion products are cash cows in a declining market; battery cooling systems are a question mark that the cash cows can fund.
  - id: decision-trees
    use: Weigh building all at once against building in stages, with the 60% chance of the contract on the branches.
  - id: mendelow-matrix
    use: Map the activist, the institutions, the employees and the car makers by their power and interest.
  - id: balanced-scorecard
    use: Hold the board to more than earnings per share, measuring the plant, the customers and the people as well.

tools:
  - { kind: calculator, id: net-present-value, use: Rework the plant's NPVs at 8% and at other rates (HL). }
  - { kind: calculator, id: gearing-ratio, use: Rework the gearing ratio under each option (HL). }
  - { kind: studio, id: bcg-matrix, use: Place Velmar's product lines in a portfolio. }
  - { kind: studio, id: decision-tree, use: Build the tree for building all at once against building in stages. }

beyond:
  - idea: Payout policy
    body: >-
      Finance research offers two ideas that frame the board's choice. Dividends tend to be smoothed, so a raised dividend is
      a promise managers are reluctant to break; and in a world without frictions the split between paying out and retaining
      would not matter, only the investment would. Real markets have frictions, so the payout signals what the board
      believes about the future.
    terms: [dividend-yield, earnings-per-share, free-cash-flow, cost-of-capital]
    sources: [bbr-lintner-1956, bbr-miller-modigliani-1961]
  - idea: Free cash flow and the discipline of debt
    body: >-
      Jensen argued that managers of firms with cash beyond their good investments may spend it on growth that does not pay,
      and that paying cash out, or committing to debt, disciplines them. The activist's case rests on this argument; the
      plant's positive expected NPV is the answer to it.
    terms: [agency-problem, shareholder-activism, corporate-governance]
    sources: [bbr-jensen-1986]

sources: [bbr-method, bbr-lintner-1956, bbr-miller-modigliani-1961, bbr-jensen-1986]
method: >-
  Velmar Components AG, Granite Lake Capital and their people are fictional, and every figure is simulated for teaching.
  The margins, dividends and retained profit in Exhibit 1, the per-share figures and gearing in Exhibit 2 and the shares of
  revenue in Exhibit 3 are worked from the figures beside them; the plant's NPVs in Exhibit A1 use the guide's discount
  factors at 8% over ten years; Exhibit A2 works each option's earnings per share and gearing from the stated assumptions.
  The integrity check reworks every figure on every build.

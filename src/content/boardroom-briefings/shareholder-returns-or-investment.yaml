stakeholders:
  - name: Granite Lake Capital
    side: internal
    interest: high
    power: medium
    wants: €400m back through a buyback, a 60% payout and no new plant, so that the share price rises within a few years.
    implications: >-
      Option A gives it what it wants; option C gives it part. With 6.0% of the shares it cannot decide alone, but it can
      persuade other investors and make the board's life difficult.
  - name: Long-term institutional shareholders
    side: internal
    interest: high
    power: high
    wants: A company still earning profits in twenty years, and a steady dividend meanwhile.
    implications: >-
      They hold most of the shares and will decide whether the activist wins support. A clear plan with stages they can
      judge is more likely to keep them than either extreme.
  - name: Employees and their representatives
    side: internal
    interest: high
    power: high
    wants: Jobs that survive the end of petrol and diesel engines.
    implications: >-
      Half of the supervisory board represents them. Option A protects today's returns with no plan for the jobs that
      depend on combustion products; options B and C build the work that could replace them.
  - name: Katrin Albers and the management board
    side: internal
    interest: high
    power: high
    wants: The plant, and the credibility to deliver it after an earlier project ran over budget.
    implications: >-
      Option B is their proposal. Building in stages asks them to win the contract before spending most of the money, which
      tests their forecasts in the open.
  - name: Car makers
    side: external
    interest: medium
    power: high
    wants: Suppliers that can deliver the parts for their next electric platforms on time.
    implications: >-
      A supplier that pays out its cash and builds nothing will not win the next generation of contracts.
  - name: Lenders
    side: external
    interest: medium
    power: medium
    wants: A borrower whose debt stays easily covered by its profits.
    implications: >-
      Option D would take borrowing from €300m to €700m just as the company starts its largest investment.

options:
  - id: A
    label: Return the cash
    summary: >-
      Buy back €400m of shares in 2026, raise the dividend to 60% of profit, and keep investment in electric vehicle parts to
      what the existing plants need.
    requires: The supervisory board's agreement, and a decision not to build the new plant.
    upside: The activist satisfied, earnings per share up from €4.62 to €5.11, and no risk of an overrun.
    risks: A company that shrinks with its combustion products; the next generation of contracts lost; employees left without a future plan.
    evidence: [ex-2, ex-3]
  - id: B
    label: Invest it all in the plant
    summary: >-
      Commit the full €650m to the new plant now, keep the dividend at 40% of profit, and make no buyback.
    requires: €650m over three years from cash and profits, and confidence in winning the contract.
    upside: The largest plant, ready soonest, worth €291.9m if the contract is won.
    risks: A loss of €120.3m if it is not; an angry activist; and €650m committed before the main uncertainty is resolved.
    evidence: [ex-4]
  - id: C
    label: Build in stages, and return a little
    summary: >-
      Commit €300m to a first phase now and the other €350m only if the contract is signed by the end of 2027. Keep the
      dividend at 40% of profit and buy back €100m of shares.
    requires: A plant designed to be built in two phases, and the discipline to stop after the first if the contract is lost.
    upside: Most of the plant's value if the contract comes, a much smaller loss if it does not, and some cash returned now.
    risks: A slower start than option B, which a rival could exploit; a smaller buyback than the activist wants.
    evidence: [ex-4]
  - id: D
    label: Borrow to do both
    summary: >-
      Issue €400m of bonds to fund the buyback the activist wants, and build the whole plant from cash and profits.
    requires: Lenders willing to lend at about 5%, and a board comfortable with more debt.
    upside: Shareholders and management both get what they asked for.
    risks: >-
      Borrowing rises from €300m to €700m and gearing from 12.3% to 28.7%, while the plant's success is uncertain; €20m a year of
      interest; little room left if the business turns down.
    evidence: [ex-2, ex-4]

criteria:
  - id: value
    criterion: Long-term value
    weight: 30
    measure: The expected net present value of the investment, and the company's position for the next generation of contracts.
  - id: shareholders
    criterion: Returns to shareholders now
    weight: 20
    measure: Cash returned through dividends and buybacks, and the effect on earnings per share.
  - id: risk
    criterion: Financial risk
    weight: 20
    measure: The money at risk if the contract is lost, and the company's borrowing.
  - id: employees
    criterion: Employees and strategy
    weight: 15
    measure: Whether the option builds work to replace the jobs that depend on combustion products.
  - id: flexibility
    criterion: Flexibility
    weight: 15
    measure: How much the option lets the board decide later, when it knows more.

questions:
  course:
    - id: retained
      command: calculate
      marks: 4
      subtopics: ['3.4']
      prompt: Using Exhibit 1, calculate Velmar's retained profit in 2025, and the dividends it would pay if it raised the payout to 60% of net profit.
      notes: >-
        Retained profit = net profit − dividends = 231.0 − 92.4 = €138.6m. At a 60% payout, dividends would be 231.0 × 60 ÷ 100 =
        €138.6m, leaving €92.4m retained: the two figures swap. Two marks for each.
    - id: gearing
      command: calculate
      marks: 4
      level: HL
      subtopics: ['3.6']
      prompt: Using Exhibit 2, calculate Velmar's gearing ratio at the end of 2025, and what it would be under option D.
      notes: >-
        Now: 300 ÷ (300 + 2,140) × 100 = 12.3%. Under D, borrowing rises to €700m and the buyback cuts equity by €400m to
        €1,740m: 700 ÷ (700 + 1,740) × 100 = 28.7%. Two marks for each.
    - id: objectives
      command: explain
      marks: 4
      subtopics: ['1.3']
      prompt: Explain why protecting shareholder value and investing for the long term may conflict at Velmar.
      notes: >-
        Cash spent on the plant cannot be returned now, and the plant pays only years later and only if the contract comes;
        but a company that does not invest loses the products its future profits, and so its shareholders' value, depend on.
        Strong answers show that the conflict is between shareholders with different time horizons.
    - id: stakeholders
      command: discuss
      marks: 10
      subtopics: ['1.4']
      prompt: Discuss how the board should balance the demands of Granite Lake Capital with those of Velmar's other stakeholders.
      notes: >-
        Good answers set out each group's interest and power (the activist's 6.0%, the institutions' majority, the employees'
        seats on the supervisory board, the car makers' contracts), consider how far their aims really conflict, and reach a
        judgement on how to weigh them.
    - id: allocate
      command: recommend
      marks: 10
      level: HL
      subtopics: ['3.8', '1.3']
      prompt: Recommend how Velmar should use its cash, with reference to the net present value of the plant.
      notes: >-
        Strong answers compare the expected NPVs (B €127.0m, C €208.0m) and the outcomes without the contract (B −€120.3m, C
        €50.5m), weigh the returns the activist wants and the company's future, and make a recommendation with conditions.
  seminar:
    - id: buyback
      prompt: Does a share buyback create value? When is it the best use of a company's cash?
      notes: >-
        A buyback raises earnings per share by reducing the shares, but creates value only if the shares are cheap or the
        company has no better use for the money. Good answers apply this to a company with €480m of net cash and a positive
        NPV investment available.
    - id: activists
      prompt: Are activist investors a discipline on managers or a source of short-termism? What does this case suggest?
      notes: >-
        Activists can force managers to justify holding cash, as Jensen's argument about free cash flow suggests; they can
        also push for returns that hollow out a company in transition. The overrun on Velmar's last project gives the
        activist a fair point; the plant's positive expected NPV gives management one.
    - id: stages
      prompt: Why is building in stages worth more than building all at once, even though the plant is the same?
      notes: >-
        Staging keeps the right to stop after the first phase if the contract is lost, which cuts the loss in the bad case
        from −€120.3m to a gain of €50.5m. The ability to wait for information has a value, which managers call a real option.

analysis:
  verdict: >-
    Build the plant in stages and return a little cash now (option C). Staging the €650m keeps most of the plant's value if
    the contract is won, €313.0m, and turns the loss if it is not into a small gain, €50.5m, for an expected NPV of €208.0m
    against €127.0m for building it all at once. It answers the activist's fair point, that an earlier project overran,
    by making management win the contract before spending most of the money, and it returns €100m without starving the
    business that will have to pay future dividends.
  evidence:
    - >-
      Velmar's profits come from products with a shrinking future: combustion products are 82.0% of revenue, and revenue from
      them fell by 0.9% between 2023 and 2025 while battery cooling systems grew by 59.7% (Exhibit 3).
    - >-
      The plant has a positive expected value either way it is built, but staging is worth more: an expected NPV of €208.0m
      against €127.0m, and €50.5m rather than −€120.3m if the contract is lost (Exhibit A1).
    - >-
      The buyback flatters a measure rather than the business: earnings per share would rise from €4.62 to €5.11 under option
      A, but net profit would fall by €8.4m of lost interest, and nothing would replace the combustion business (Exhibit A2).
    - >-
      The company can afford to stage the plant and keep paying dividends. Net cash is €480m and free cash flow was €210m in
      2025 (Exhibits 1 and 2).
  assumptions:
    - assumption: The chance of winning the contract is 60%.
      test: It is the finance team's judgement. At what chance would building it all at once (B) be better than staging? Ask the car maker for its timetable and its shortlist.
    - assumption: The plant can be built in two phases at the same total cost.
      test: Ask the engineers what a two-phase design costs extra, and include it in the staged forecast.
    - assumption: A rival will not win the contract because Velmar waited.
      test: The first phase must be large enough to show the car maker that Velmar can deliver.
    - assumption: Combustion revenue will decline slowly.
      test: If customers move faster, the case for investing grows and the cash available to invest shrinks; model a faster decline.
  tradeoffs:
    - title: Cash now, or a business later
      body: >-
        Every euro returned now is a euro not invested in the products Velmar's future depends on. The question is not whether
        to reward shareholders, but which shareholders, and over what time.
    - title: Commitment, or the option to wait
      body: >-
        Building it all at once wins the race to be ready; building in stages buys the right to stop. Here the contract
        decision is close enough, by the end of 2027, that waiting costs little.
    - title: Debt, or discipline
      body: >-
        Borrowing to do both avoids choosing, at the cost of more than doubling the company's debt as it starts its largest
        project. A board that cannot choose between its stakeholders should not hide the choice in its balance sheet.
  alternatives:
    - option: A
      fit: weak
      body: >-
        Weakly supported. It lifts earnings per share for a few years by giving up the investment the company needs to survive
        the decline of its main products, and it ignores a positive expected NPV.
    - option: B
      fit: conditional
      body: >-
        Defensible if the contract were close to certain. At a 60% chance it commits €650m before the main uncertainty is
        resolved, and loses €120.3m if the contract goes elsewhere.
    - option: C
      fit: strong
      body: >-
        The best supported. It has the highest expected NPV, the smallest loss in the bad case, returns some cash, and gives
        the supervisory board a clear point, the contract decision, at which to commit the rest.
    - option: D
      fit: weak
      body: >-
        Weakly supported. It gives everyone what they asked for by raising gearing from 12.3% to 28.7% just as the company takes
        its largest risk.
  scores:
    - { option: A, scores: { value: 1, shareholders: 5, risk: 4, employees: 1, flexibility: 3 }, total: 2.7 }
    - { option: B, scores: { value: 3, shareholders: 2, risk: 3, employees: 5, flexibility: 2 }, total: 2.95 }
    - { option: C, scores: { value: 5, shareholders: 3, risk: 4, employees: 4, flexibility: 5 }, total: 4.25 }
    - { option: D, scores: { value: 3, shareholders: 4, risk: 1, employees: 4, flexibility: 1 }, total: 2.65 }
  recommendation:
    option: C
    decision: >-
      Approve the first phase of the plant, €300m, now, with the second phase, €350m, to be committed only when the car
      maker's contract is signed, and a firm decision by the end of 2027. Keep the dividend at 40% of profit, buy back €100m
      of shares, and publish the plan's stages and measures so that every shareholder can hold the board to them.
    reasons:
      - Staging has the highest expected NPV, €208.0m, and avoids a loss if the contract goes elsewhere.
      - It answers the activist's concern about overruns by tying most of the spending to a contract won.
      - It keeps the dividend steady, which shareholders value and managers are rightly reluctant to cut.
      - It builds the products that will replace the combustion business, which protects employees and the company's future alike.
    conditions: >-
      If the contract is lost, the second phase should not be built, and the board should return more of the cash it
      would have spent. If the car maker wants a supplier ready sooner than staging allows, the case for building it all at
      once (option B) returns.
  implementation:
    - when: Months 1 to 3
      action: Approve the first phase and the €100m buyback; publish the plan, its stages and its measures; meet the main institutional shareholders and Granite Lake Capital.
      owner: Management board and supervisory board
    - when: Months 3 to 18
      action: Build the first phase on a design that allows the second; bid for the car maker's contract.
      owner: Chief executive and head of operations
    - when: By the end of 2027
      action: If the contract is won, commit the second phase; if not, run the first phase as a smaller plant and review the payout.
      owner: Supervisory board
    - when: Every year
      action: Report the plant's progress against its budget and the measures below alongside the dividend decision.
      owner: Chief financial officer
  measures:
    - measure: The plant's budget
      target: The first phase built within its €300m, with no overrun.
      review: Every quarter
    - measure: The contract
      target: A decision by the end of 2027, with the second phase committed only if it is won.
      review: At the decision
    - measure: Battery cooling revenue
      target: Rising from 18.0% of revenue towards a third within five years.
      review: Every year
    - measure: Shareholder returns
      target: A dividend of 40% of net profit each year, plus the €100m buyback.
      review: Every year
  limitations:
    - The plant's cash flows are forecasts ten years ahead, and the 60% chance of the contract is a judgement.
    - The analysis treats the 8% discount rate as given; a higher rate, reflecting the plant's risk, would lower every NPV.
    - Earnings per share after a buyback depends on the share price paid, which is assumed to stay at €62.00.
  changeMind:
    - If the car maker offered the contract only to a supplier able to build at full scale at once, option B would be the better choice.
    - If the contract were lost, much of the cash should go back to shareholders, as the activist asks.
    - If the shares fell far below the value of the business, a larger buyback would become a better use of cash than it now is.
  exhibits:
    - id: ex-A1
      title: The plant's net present value at 8% over ten years (€m)
      kind: table
      provenance: simulated-data
      columns:
        - { label: How it is built }
        - { label: Contract won, numeric: true, format: d1 }
        - { label: Contract not won, numeric: true, format: d1 }
        - { label: Expected, numeric: true, format: d1 }
      rows:
        - ['B. All at once', 291.9, -120.3, 127.0]
        - ['C. In stages', 313.0, 50.5, 208.0]
      checks:
        - { column: Contract won, rows: ['B. All at once'], is: 'npv(8, {ex-4|B. Build it all now: the contract is won|Year 0}, {ex-4|B. Build it all now: the contract is won|Year 1}, {ex-4|B. Build it all now: the contract is won|Year 2}, {ex-4|B. Build it all now: the contract is won|Year 3}, {ex-4|B. Build it all now: the contract is won|Year 4}, {ex-4|B. Build it all now: the contract is won|Each year, years 5 to 10}, {ex-4|B. Build it all now: the contract is won|Each year, years 5 to 10}, {ex-4|B. Build it all now: the contract is won|Each year, years 5 to 10}, {ex-4|B. Build it all now: the contract is won|Each year, years 5 to 10}, {ex-4|B. Build it all now: the contract is won|Each year, years 5 to 10}, {ex-4|B. Build it all now: the contract is won|Each year, years 5 to 10})' }
        - { column: Contract not won, rows: ['B. All at once'], is: 'npv(8, {ex-4|B. Build it all now: the contract is not won|Year 0}, {ex-4|B. Build it all now: the contract is not won|Year 1}, {ex-4|B. Build it all now: the contract is not won|Year 2}, {ex-4|B. Build it all now: the contract is not won|Year 3}, {ex-4|B. Build it all now: the contract is not won|Year 4}, {ex-4|B. Build it all now: the contract is not won|Each year, years 5 to 10}, {ex-4|B. Build it all now: the contract is not won|Each year, years 5 to 10}, {ex-4|B. Build it all now: the contract is not won|Each year, years 5 to 10}, {ex-4|B. Build it all now: the contract is not won|Each year, years 5 to 10}, {ex-4|B. Build it all now: the contract is not won|Each year, years 5 to 10}, {ex-4|B. Build it all now: the contract is not won|Each year, years 5 to 10})' }
        - { column: Contract won, rows: ['C. In stages'], is: 'npv(8, {ex-4|C. Build in stages: the contract is won|Year 0}, {ex-4|C. Build in stages: the contract is won|Year 1}, {ex-4|C. Build in stages: the contract is won|Year 2}, {ex-4|C. Build in stages: the contract is won|Year 3}, {ex-4|C. Build in stages: the contract is won|Year 4}, {ex-4|C. Build in stages: the contract is won|Each year, years 5 to 10}, {ex-4|C. Build in stages: the contract is won|Each year, years 5 to 10}, {ex-4|C. Build in stages: the contract is won|Each year, years 5 to 10}, {ex-4|C. Build in stages: the contract is won|Each year, years 5 to 10}, {ex-4|C. Build in stages: the contract is won|Each year, years 5 to 10}, {ex-4|C. Build in stages: the contract is won|Each year, years 5 to 10})' }
        - { column: Contract not won, rows: ['C. In stages'], is: 'npv(8, {ex-4|C. Build in stages: the contract is not won|Year 0}, {ex-4|C. Build in stages: the contract is not won|Year 1}, {ex-4|C. Build in stages: the contract is not won|Year 2}, {ex-4|C. Build in stages: the contract is not won|Year 3}, {ex-4|C. Build in stages: the contract is not won|Year 4}, {ex-4|C. Build in stages: the contract is not won|Each year, years 5 to 10}, {ex-4|C. Build in stages: the contract is not won|Each year, years 5 to 10}, {ex-4|C. Build in stages: the contract is not won|Each year, years 5 to 10}, {ex-4|C. Build in stages: the contract is not won|Each year, years 5 to 10}, {ex-4|C. Build in stages: the contract is not won|Each year, years 5 to 10}, {ex-4|C. Build in stages: the contract is not won|Each year, years 5 to 10})' }

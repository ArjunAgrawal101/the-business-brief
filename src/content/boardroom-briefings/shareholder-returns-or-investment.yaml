# The Boardroom Briefings, No. 9. Velmar Components AG and Granite Lake Capital
# are fictional; every figure is simulated. Exhibit 1's margins, dividends and
# retained profit, Exhibit 2's per-share figures and Exhibit 3's shares are
# worked by their checks; Exhibit A1 gives the plant's NPV at 8% over ten
# years in each case, with the guide's discount factors, and Exhibit A2 the
# effect of each option on earnings per share and gearing.

number: 9
question: How should a company balance shareholder returns with long-term investment?
title: Velmar Components weighs a buyback against a factory for electric cars
dek: A German maker of car parts has €480m of net cash and an investor demanding it back. Its future depends on electric vehicles; its profits still depend on petrol and diesel.
decisionType: capital-allocation
industry: automobile
functions: [finance, strategy]
keyConcepts: [change, sustainability]
updated: 2026-11-16

company:
  name: Velmar Components AG
  fictional: true
  sector: Car parts for vehicle makers
  location: Stuttgart, Germany
  size: 9,400 employees and revenue of €3,850m in 2025
  ownership: Publicly held company listed on the stock exchange; Granite Lake Capital, an activist investor, owns 6.0% of the shares
currency: { code: EUR, symbol: '€', unit: million }

summary:
  situation: >-
    Velmar makes exhaust systems and fuel pumps for petrol and diesel cars, and a growing line of cooling systems for the
    batteries of electric cars. It earned a net profit of €231.0m in 2025 and holds €480m more in cash than it owes. An
    activist investor wants €400m returned to shareholders; management wants to build a €650m plant for electric vehicle
    parts.
  decision: >-
    How to divide the company's cash between its owners and its future: return it through a buyback and higher dividends,
    invest it all in the new plant, build the plant in stages while returning a little, or borrow to do both.
  stakes: >-
    Most of Velmar's revenue comes from products that its largest customers plan to stop needing. The decision tests whether
    the board can serve today's shareholders without starving the business that will have to pay tomorrow's dividends.

background:
  - >
    Velmar Components was founded in Stuttgart in 1952 and listed on the stock exchange in 1998. It supplies five car makers
    in Europe, employs 9,400 people in four countries and earned revenue of €3,850m in 2025, with an EBIT margin of 9.0%
    (Exhibit 1). It has paid 40% of its net profit as dividends for a decade, and ended 2025 with €780m of cash and €300m of
    borrowing (Exhibit 2).
  - >
    Its products are changing under it. Exhaust systems and fuel pumps, which electric cars do not need, still brought 82.0% of
    revenue in 2025, but that revenue fell slightly between 2023 and 2025, while revenue from battery cooling systems rose by
    59.7% (Exhibit 3). Three of Velmar's five largest customers have said they will stop developing new petrol and diesel
    engines within the decade.
  - >
    In 2026 Granite Lake Capital, an activist fund, bought 6.0% of the shares and wrote to the board. It wants €400m returned
    through a share buyback, the dividend raised to 60% of profit, and no new plant, arguing that Velmar's last electric
    vehicle project ran over budget. The chief executive, Katrin Albers, has proposed a €650m plant for battery cooling
    systems. The supervisory board, half of whose members represent employees, must decide.

context:
  - >
    A company that makes more cash than it can invest well can return it to its owners, through dividends or by buying back
    its own shares. A buyback reduces the number of shares, so each remaining share has a larger claim on profits, and
    earnings per share rise even if profit does not. Neither form of return creates value by itself: value comes from the
    profits the business goes on to earn.
  - >
    Car parts suppliers face the shift to electric vehicles from two sides. Their old products will be needed less, though
    for years yet, while new products need large investment before the orders that will use them are certain. Suppliers
    that invest too early can be left with plants their customers do not fill; those that invest too late can lose the next
    generation of contracts to rivals.
  - >
    Shareholders differ. Some hold shares for income and want dividends; some want the price to rise; activist investors
    buy stakes to press for changes they believe will lift the price, often within a few years. Employees, customers and
    the communities around the plants have a long-term stake that a short-term shareholder may not share.

evidence:
  - kind: company
    title: Profits that rise, a market that shrinks
    body: >-
      Revenue rose from €3,620m in 2023 to €3,850m in 2025 and the EBIT margin from 8.0% to 9.0% (Exhibit 1). But revenue
      from combustion products fell by 0.9% over the same years, and their share of revenue fell from 88.0% to 82.0% (Exhibit
      3). Today's profits come from the products with the least future.
    exhibits: [ex-1, ex-3]
  - kind: company
    title: Cash the company has not needed
    body: >-
      Free cash flow reached €210m in 2025, and net cash stands at €480m (Exhibits 1 and 2). At a share price of €62.00 the
      company is valued at €3,100m, 13.4 times its earnings per share of €4.62.
    exhibits: [ex-1, ex-2]
  - kind: company
    title: A plant that pays only if the contract comes
    body: >-
      The finance team's forecasts for the new plant depend on a contract to supply cooling systems for a major car maker's
      next electric platform, which the team puts at a 60% chance (Exhibit 4). With the contract the plant is worth €291.9m at
      8%; without it, it loses €120.3m (Exhibit A1).
    exhibits: [ex-4]
  - kind: research
    title: Managers tend to smooth dividends
    body: >-
      A classic study of dividend decisions found that managers aim at a long-run share of profit to pay out, raise
      dividends only when they expect to sustain the increase, and are very reluctant to cut them.
    sources: [bbr-lintner-1956]
  - kind: research
    title: In theory, the form of the payout does not matter; the investment does
    body: >-
      Under idealized conditions, with no taxes or costs of trading and with investors fully informed, how a firm divides
      its earnings between dividends and retained profit does not change its value: what matters is the investment it makes.
      Real markets depart from those conditions, which is why payout decisions still send signals.
    sources: [bbr-miller-modigliani-1961]


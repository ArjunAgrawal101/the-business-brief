# The Boardroom Briefings, No. 2. Quarrystone Climbing and Brackenhold
# Bouldering are fictional; every figure is simulated. Exhibit 2's profits and
# margins, Exhibit 1's totals and Exhibit 3's goodwill, multiple and financing
# are worked by their checks; the forecasts in Exhibit 5 follow from Exhibit 2
# and Exhibit 3; the NPVs in Exhibit A1 use the guide's factors at 8%.

number: 2
question: Should a business acquire a competitor?
title: Quarrystone Climbing is offered its closest rival
dek: The founders of Dublin's second-largest climbing business want to sell. Buying it would make Quarrystone the city's dominant operator, if the price, the regulator and the climbers allow.
decisionType: acquisition
industry: sports
functions: [strategy, finance, human-resources]
keyConcepts: [change, ethics]
updated: 2026-11-16

company:
  name: Quarrystone Climbing
  fictional: true
  sector: Indoor climbing centres
  location: Dublin, Ireland
  size: Five centres, 140 employees and revenue of €9.6m in 2025
  ownership: Privately held company, 80% owned by its founder, Niamh Doyle, and 20% by its staff through an employee share ownership scheme
currency: { code: EUR, symbol: '€', unit: thousand }

summary:
  situation: >-
    Quarrystone Climbing runs four climbing centres in Dublin and one in Cork. Its closest rival, Brackenhold Bouldering,
    has three centres in Dublin, and its founders want to sell. They have asked €3.6m, and they have told Quarrystone that a
    British climbing chain is also interested.
  decision: >-
    Whether to buy Brackenhold, and at what price; or to grow another way, by building a new centre or by forming an
    alliance with Brackenhold that leaves its ownership as it is.
  stakes: >-
    Together the two businesses would have most of the climbing visits in Dublin. The deal would more than double
    Quarrystone's borrowing, bring in staff with their own way of doing things, and could draw the attention of the
    competition authority. Losing Brackenhold to a stronger rival carries risks too.

background:
  - >
    Niamh Doyle opened Quarrystone's first climbing wall in a former warehouse in 2009. There are now five centres, four in
    Dublin and one in Cork, with 6,900 members and 140 employees. Revenue reached €9.6m in 2025, with an operating profit of
    €1,248k, a margin of 13% (Exhibit 2). Niamh owns 80% of the company; the other 20% belongs to the staff, through an
    employee share ownership scheme set up in 2019.
  - >
    Brackenhold Bouldering was founded in 2014 by a brother and sister, Ciarán and Orla Brennan. Its three bouldering
    centres in Docklands, Rathmines and Swords have a younger, more social crowd and a reputation for the best route
    setting in the city. It is smaller and less profitable than Quarrystone: revenue of €4.2m and an operating profit of
    €378k, a margin of 9%, from 3,100 members and 60 staff.
  - >
    The Brennans want to step back. Their adviser has sent Quarrystone a sale memorandum with an asking price of €3.6m for
    the whole company (Exhibit 3), and mentioned that a British climbing chain has also asked to see it. Quarrystone's bank
    has offered a loan of €3.0m towards the purchase. Niamh must put a recommendation to her board, which includes a
    director elected by the staff shareholders.

context:
  - >
    Indoor climbing has grown from a niche sport into a mainstream way to keep fit and meet people. A centre is expensive to
    open, with a large building, high walls and constant route setting, and most of its costs are fixed, so profit depends
    on keeping it busy. Members choose a centre for its location, the quality of its routes and its atmosphere, and many
    are loyal to the community they climb with.
  - >
    When two rivals in the same market combine, they can share costs, buy equipment more cheaply and plan where to open
    without undercutting each other. But they also face fewer competitors, and customers may end up paying more or getting
    less choice. Competition authorities can examine a merger that would reduce competition in a local market, and can
    block it or allow it only on conditions.
  - >
    Acquisitions often look better on paper than in practice. The savings that justify the price take longer to arrive
    than planned, staff who chose a small business may not stay in a larger one, and the buyer who wants a deal most is the
    one most likely to pay too much for it.

evidence:
  - kind: company
    title: Two profitable businesses of different sizes
    body: >-
      Quarrystone earns a 13% operating margin on €9.6m of revenue; Brackenhold earns 9% on €4.2m (Exhibit 2). At the asking
      price, Quarrystone would pay 9.5 times Brackenhold's operating profit, and €2,100k more than the value of its net
      assets: goodwill, for its members, its staff and its name (Exhibit 3).
    exhibits: [ex-2, ex-3]
  - kind: company
    title: Most of Dublin's climbing in two hands
    body: >-
      Climbing visits in Dublin grew from 560,000 in 2024 to 600,000 in 2025 (Exhibit 1). Quarrystone's centres had 228,000
      of them in 2025 and Brackenhold's 162,000; the rest were shared by independent walls, a university wall and leisure
      centres.
    exhibits: [ex-1]
  - kind: company
    title: The savings, and what they depend on
    body: >-
      Quarrystone's finance team expects €300k a year of savings from the second year, from one booking system, one head
      office and buying equipment for eight centres instead of five, after a one-off cost of €400k to combine the
      businesses (Exhibit 3). Half the savings would come in the first year.
    exhibits: [ex-3, ex-5]
  - kind: research
    title: Bidders tend to overpay
    body: >-
      The hubris hypothesis holds that bidders often pay more than a target is worth because their managers are too
      confident in their own valuations: the more a buyer wants the deal, the less it questions its own estimate of what the
      target will earn under its ownership.
    sources: [adv-fin-roll-1986]
  - kind: research
    title: Build, borrow or buy
    body: >-
      A firm that needs new resources can build them itself, borrow them through an alliance or contract, or buy them by
      acquiring another firm. Buying is fastest, but it is the hardest to integrate and to reverse, so it suits the cases
      where the other two routes cannot work.
    sources: [capron-mitchell-2012]

financials:
  summary: >-
    Exhibit 2 compares the two businesses in 2025. Exhibit 3 sets out the asking price, the savings and how the purchase
    would be paid for, and Exhibit 4 shows Quarrystone's long-term borrowing and equity before and after. Exhibit 5 gives
    the forecast net cash flows of buying Brackenhold at the asking price and of building a new centre instead, over ten
    years. Quarrystone appraises investments at a discount rate of 8%.
  exhibits: [ex-2, ex-3, ex-4, ex-5]


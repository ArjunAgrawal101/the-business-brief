frameworks:
  - id: ansoff-matrix
    use: Buying a rival in the same city is market penetration by acquisition; a new centre in north Dublin is market penetration by internal growth.
  - id: five-forces
    use: The purchase would reduce rivalry in Dublin, but the threat of a new entrant (the British chain) is what makes it urgent.
  - id: mendelow-matrix
    use: Map the stakeholders by power and interest; the competition authority has high power but, until notified, low interest.
  - id: mckinsey-7s
    use: Plan the integration by comparing the two businesses' shared values, style and staff, not only their systems.

tools:
  - { kind: studio, id: five-forces, use: Analyse the Dublin climbing market before and after the purchase. }
  - { kind: studio, id: stakeholder-map, use: Map the stakeholders and how to manage each through the deal. }
  - { kind: calculator, id: gearing-ratio, use: Work the gearing ratio at each price (HL). }
  - { kind: calculator, id: net-present-value, use: Rework the NPVs in Exhibit A1 at 8% and at other rates (HL). }
  - { kind: toolkit, id: ansoff-matrix, use: The toolkit guide to the growth directions the options represent. }

beyond:
  - idea: The winner's curse
    body: >-
      In an auction for something of uncertain value, the winner is often the bidder who overestimated it most. The hubris
      hypothesis applies the idea to takeovers. The usual defences are a walk-away price set before negotiations begin,
      prices tied to the target's later results, and a board that asks to see the case against the deal.
    terms: [agency-problem]
    sources: [adv-fin-roll-1986, adv-fin-jensen-1986]
  - idea: Build, borrow or buy
    body: >-
      Capron and Mitchell's framework asks whether a firm should develop a resource itself, obtain it through a contract or
      alliance, or acquire another firm. Here the three are options C, D and A or B: the framework's question is which route
      gives Quarrystone what it needs with the least difficulty of integration.
    terms: [core-competence, resource-based-view]
    sources: [capron-mitchell-2012]

sources: [bbr-method, adv-fin-roll-1986, adv-fin-jensen-1986, capron-mitchell-2012]
method: >-
  Quarrystone Climbing, Brackenhold Bouldering, their people and the British chain are fictional, and every figure is
  simulated for teaching. The profits in Exhibit 2 follow from revenue and costs; the shares of visits are worked from
  Exhibit 1; the forecasts in Exhibit 5 are Brackenhold's operating profit plus the planned savings, less the one-off cost
  in the first year; and the NPVs use the guide's discount factors at 8%. The integrity check reworks every figure on
  every build.

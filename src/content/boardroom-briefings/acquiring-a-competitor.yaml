stakeholders:
  - name: Niamh Doyle and the board
    side: internal
    interest: high
    power: high
    wants: A stronger business that the British chain cannot outflank, without risking the company she built.
    implications: >-
      The purchase would more than double the company's long-term borrowing, from €2,400k to €5,400k at the asking price, and
      tie up management for a year of integration.
  - name: Staff shareholders
    side: internal
    interest: high
    power: medium
    wants: Secure jobs and a rising value for the shares they hold through the scheme.
    implications: >-
      A good purchase raises the value of their 20%; an expensive one, with €180k a year of new interest, lowers it. Their
      elected director will ask what the deal means for their workload.
  - name: Ciarán and Orla Brennan
    side: external
    interest: high
    power: medium
    wants: A fair price, and a buyer who will look after their staff and their centres' character.
    implications: >-
      A low bid or an alliance gives them less money now; they may prefer the British chain if it pays more, or Quarrystone
      if it promises to keep the Brackenhold name and team.
  - name: Brackenhold's staff
    side: external
    interest: high
    power: low
    wants: Their jobs, and the culture of a smaller, more social business.
    implications: >-
      Their route setters are much of what Quarrystone would be paying for. If they leave after the purchase, the goodwill
      leaves with them.
  - name: Climbers in Dublin
    side: external
    interest: medium
    power: medium
    wants: Good routes, fair prices and a choice of walls.
    implications: >-
      Shared memberships across eight centres would be convenient, but with most of the city's climbing under one owner,
      prices could rise and choice could narrow.
  - name: The competition authority
    side: external
    interest: low
    power: high
    wants: Mergers that do not harm competition and customers.
    implications: >-
      With two-thirds of the city's climbing visits in one business, the deal could be examined, delayed or allowed only on
      conditions.
  - name: The bank
    side: external
    interest: medium
    power: medium
    wants: Repayment, from a business that can carry its debts.
    implications: >-
      Lends €3,000k at the asking price, and will watch how much of Quarrystone's capital is borrowed.

options:
  - id: A
    label: Buy Brackenhold at the asking price
    summary: >-
      Agree the €3.6m asking price, paid with the bank's €3,000k loan and €600k of cash, before the British chain bids.
      Keep the Brackenhold name, combine the booking systems and head offices, and offer members access to all eight
      centres.
    requires: Due diligence completed quickly; the bank's loan; a plan to keep Brackenhold's route setters.
    upside: The deal is certain to happen, the rival is kept out, and the savings and the shared membership begin at once.
    risks: >-
      The highest price for the same business; returns that depend on the full savings arriving; the highest borrowing; and
      a large share of the market that may draw the competition authority.
    evidence: [ex-3, ex-4, ex-5]
  - id: B
    label: Bid, but walk away above €3,000k
    summary: >-
      Offer up to €3,000k, 7.9 times Brackenhold's operating profit, and walk away if the Brennans hold out for more. Fund it
      with a €2,400k loan and €600k of cash, and offer the competition authority a promise to hold membership prices for two
      years.
    requires: The discipline to walk away; a credible case to the Brennans that Quarrystone is the better home for their business.
    upside: A price at which the deal still pays if only half the savings arrive, and less borrowing.
    risks: The Brennans may sell to the British chain, which would then compete with Quarrystone from three Dublin centres.
    evidence: [ex-2, ex-3]
  - id: C
    label: Build a new centre in north Dublin
    summary: >-
      Leave Brackenhold to others and open a large new centre in north Dublin for €2,800k, Quarrystone's sixth.
    requires: A building, planning permission, and a year to fill it.
    upside: Growth on Quarrystone's own terms, with no integration, no goodwill and no regulator.
    risks: >-
      A loss in the first year; members drawn from Quarrystone's own centres; and a rival, possibly a stronger one,
      running Brackenhold.
    evidence: [ex-5]
  - id: D
    label: Form an alliance with Brackenhold
    summary: >-
      Propose a strategic alliance instead of a purchase: members of either business may climb at all eight centres, and the
      two buy equipment together. The Brennans keep ownership.
    requires: Agreement on sharing membership income, and trust between two competitors.
    upside: Some of the benefits for climbers, about €60k a year of purchasing savings for Quarrystone, and no capital at risk.
    risks: The Brennans still want to sell, so the alliance may end when they do, possibly with the British chain inheriting it.
    evidence: [ex-1]

criteria:
  - id: value
    criterion: Value for money
    weight: 30
    measure: Net present value at 8% over ten years, and whether it stays positive if the savings fall short.
  - id: position
    criterion: Strategic position
    weight: 25
    measure: How strong Quarrystone would be in Dublin, and how well the option keeps a stronger rival out.
  - id: risk
    criterion: Financial and regulatory risk
    weight: 20
    measure: The borrowing it adds, and the chance that the competition authority delays, blocks or conditions it.
  - id: people
    criterion: People and culture
    weight: 15
    measure: Whether the staff of both businesses, and Brackenhold's route setters above all, would stay and work well together.
  - id: climbers
    criterion: Climbers
    weight: 10
    measure: Prices, choice and the quality of climbing for Dublin's climbers.

questions:
  course:
    - id: market-share
      command: calculate
      marks: 4
      subtopics: ['4.1']
      prompt: Using Exhibit 1, calculate the market share of Quarrystone and of Brackenhold in 2025, and the share the combined business would have.
      notes: >-
        Market share = the firm's visits ÷ all visits × 100. Quarrystone: 228 ÷ 600 × 100 = 38.0%. Brackenhold: 162 ÷ 600 ×
        100 = 27.0%. Combined: 65.0%. One mark for the method, one for each share, one for the combined figure.
    - id: gearing
      command: calculate
      marks: 4
      level: HL
      subtopics: ['3.6']
      prompt: Using Exhibit 4, calculate Quarrystone's gearing ratio at the end of 2025 and after buying Brackenhold at the asking price.
      notes: >-
        Gearing = non-current liabilities ÷ capital employed × 100, where capital employed is non-current liabilities plus
        equity. Now: 2,400 ÷ 8,400 × 100 = 28.6%. After: 5,400 ÷ 11,400 × 100 = 47.4%. Two marks for each, with the working.
    - id: scale
      command: explain
      marks: 4
      subtopics: ['1.5']
      prompt: Explain two economies of scale the combined business could gain.
      notes: >-
        Purchasing economies (buying holds, mats and equipment for eight centres), managerial economies (one head office and
        one booking system), marketing economies (one membership offer across the city). Each explained with its effect on
        cost, in the context of climbing centres.
    - id: culture
      command: discuss
      marks: 10
      level: HL
      subtopics: ['2.5']
      prompt: Discuss the risk of a culture clash if Quarrystone buys Brackenhold Bouldering.
      notes: >-
        Strong answers contrast a larger, more formal business with a smaller, social one whose route setters are central to
        its value, explain how a clash could cost the goodwill Quarrystone pays for (€2,100k at the asking price), weigh ways
        to reduce the risk such as keeping the brand and the team, and reach a judgement.
    - id: acquire
      command: evaluate
      marks: 10
      subtopics: ['1.5', '3.8']
      prompt: Evaluate whether Quarrystone should buy Brackenhold Bouldering.
      notes: >-
        Good answers weigh the appraisal (an NPV of €440.1k at the asking price only if the full savings arrive), the
        combined share of 65.0%, the higher borrowing and the integration risk against the threat of a stronger rival, and
        consider the price at which the deal still makes sense. A conclusion that depends on the price is a strong
        conclusion.
  seminar:
    - id: hubris
      prompt: If bidders tend to be overconfident, what should Quarrystone's board do, before it bids, to protect itself from its own optimism?
      notes: >-
        Ideas: set a walk-away price before talking to the sellers; test the deal with half the savings; ask someone outside
        the deal team to argue against it; tie part of the price to Brackenhold's later profits. The best answers recognize
        that the British chain's interest is exactly the pressure that makes buyers overpay.
    - id: remedies
      prompt: If the competition authority would approve the deal only with a promise to hold prices for two years, should Quarrystone accept?
      notes: >-
        A price promise limits one benefit of market power, but leaves the savings and the shared membership. Good answers
        ask whether the deal still pays without price rises, and what happens to climbers when the promise ends.
    - id: free-cash
      prompt: Jensen argued that managers with spare cash may spend it on growth that does not create value, and that debt can discipline them. Does his argument help or hinder the case for this deal?
      notes: >-
        The deal is mostly paid for with borrowing, which commits Quarrystone to paying interest and so disciplines it, but a
        founder-led business with a desire to grow may still overpay. Answers should separate the discipline of debt from
        the quality of the decision.

analysis:
  verdict: >-
    Bid for Brackenhold, but set a walk-away price of €3,000k and keep to it (option B). The business is worth buying: it
    keeps a stronger rival out of Dublin, its savings are real and its members and route setters are an asset Quarrystone
    could not build quickly. But at the asking price of €3.6m the purchase pays only if every euro of the planned savings
    arrives: with half of them, the NPV at 8% falls to −€496.9k. At €3,000k it stays positive with half the savings. If the
    Brennans will not sell at that price, Quarrystone should let the deal go and turn to an alliance or a new centre.
  evidence:
    - >-
      At the asking price the deal is marginal. Ten years of forecast cash flows give an NPV of €440.1k at 8%, and the
      payback is over six years (Exhibits 5 and A1). Almost all of the value depends on the €300k a year of savings.
    - >-
      The price matters more than the forecasts. At €3,000k the NPV is €1,040.1k with full savings, €103.1k with half and
      −€834.0k with none; at €3,600k the same three cases give €440.1k, −€496.9k and −€1,434.0k (Exhibit A1).
    - >-
      Building is worse on the numbers: a new centre has an NPV of −€199.1k at 8%, before counting the members it would take
      from Quarrystone's own centres (Exhibit 5).
    - >-
      The combined business would have 65.0% of climbing visits in Dublin, against 38.0% for Quarrystone now (Exhibit 1), in
      a market that grew by 7.1% last year. That is strength against the British chain, and a reason for the competition
      authority to look closely.
    - >-
      Gearing would rise from 28.6% to 47.4% at the asking price, or to 44.4% at €3,000k (Exhibit A2). Either is a large step
      for a business that has never carried that much debt.
  assumptions:
    - assumption: The savings of €300k a year will arrive in full from the second year.
      test: Ask which savings are contracted and which are hoped for. Exhibit A1 shows the deal at the asking price fails if only half arrive.
    - assumption: Brackenhold's members and route setters will stay after the purchase.
      test: Talk to the setters before bidding; offer them retention terms; plan to keep the Brackenhold name and centres as they are.
    - assumption: The British chain is a real bidder.
      test: The sellers' adviser has every reason to mention a rival. Quarrystone cannot verify the claim, so it should bid at its own valuation, not at its fear.
    - assumption: The competition authority will allow the deal.
      test: Take advice early, and decide in advance which conditions, such as a hold on prices, Quarrystone could accept.
  tradeoffs:
    - title: Winning the deal, or winning on the deal
      body: >-
        Paying the asking price makes the purchase certain; holding to €3,000k makes it worth having. The board must decide
        how much certainty is worth, and the answer from Exhibit A1 is: less than €600k.
    - title: Market strength, or customers' trust
      body: >-
        Owning most of the city's climbing protects Quarrystone from a new rival, but climbers and the authority will judge
        it by what happens to prices and choice. The strength is worth having only if it is not used against them.
    - title: Speed, or integration
      body: >-
        Buying is the fastest way to grow, but it imports a culture and a team. Combining back offices quickly brings the
        savings sooner, and risks the people who make Brackenhold worth buying.
  alternatives:
    - option: A
      fit: weak
      body: >-
        Weakly supported. The business is worth having, but not at a price whose return disappears if the savings fall
        short, paid for with the most borrowing of any option.
    - option: B
      fit: strong
      body: >-
        The best supported. It keeps the strategic case for buying while protecting Quarrystone from paying for savings that
        may not come, and its offer to hold prices answers the competition authority's likely concern.
    - option: C
      fit: weak
      body: >-
        Weakly supported as a first choice: a negative NPV, members taken from its own centres, and a rival that might own
        Brackenhold. It becomes the right move if the purchase fails.
    - option: D
      fit: conditional
      body: >-
        Defensible if the Brennans would rather keep ownership for some years. It brings climbers some of the benefits with
        no capital at risk, but it does not survive their sale of the business.
  scores:
    - { option: A, scores: { value: 2, position: 5, risk: 2, people: 3, climbers: 2 }, total: 2.9 }
    - { option: B, scores: { value: 4, position: 4, risk: 3, people: 3, climbers: 3 }, total: 3.55 }
    - { option: C, scores: { value: 1, position: 3, risk: 3, people: 4, climbers: 4 }, total: 2.65 }
    - { option: D, scores: { value: 2, position: 2, risk: 5, people: 4, climbers: 5 }, total: 3.2 }
  recommendation:
    option: B
    decision: >-
      Bid up to €3,000k for the whole of Brackenhold, and walk away above it. Finance the purchase with a €2,400k loan and
      €600k of cash. Promise to keep the Brackenhold name, its three centres and its route-setting team, and offer the
      competition authority a commitment to hold membership prices for two years.
    reasons:
      - At €3,000k the deal still pays if only half the savings arrive; at €3.6m it does not.
      - It keeps the strategic prize, a strong position in Dublin against a new rival, without betting the company on it.
      - Borrowing rises less, to a gearing ratio of 44.4% rather than 47.4%.
      - Keeping the name and the team protects the goodwill that most of the price pays for.
    conditions: >-
      The recommendation assumes due diligence confirms Brackenhold's profits and that its route setters agree to stay. If
      the Brennans sell to the British chain instead, Quarrystone should not chase them with a higher bid, but compete:
      first through better routes and memberships, then with a new centre if a site is found.
  implementation:
    - when: Weeks 1 to 4
      action: Agree the walk-away price with the board before meeting the Brennans; take advice on the competition authority; meet Brackenhold's route setters.
      owner: Niamh Doyle and the finance director
    - when: Weeks 4 to 12
      action: Bid, complete due diligence on Brackenhold's accounts, leases and memberships, and agree retention terms for the route setters.
      owner: Finance director with advisers
    - when: Months 3 to 6
      action: Notify the competition authority, with the offer to hold membership prices, and secure the loan.
      owner: Niamh Doyle
    - when: Months 6 to 18
      action: Combine booking systems and head offices; open all eight centres to members of either business; keep Brackenhold's name, centres and setters.
      owner: Integration lead, reporting to the board
  measures:
    - measure: Savings achieved
      target: €150k in the first year and €300k a year from the second, tracked against Exhibit 3.
      review: Every quarter
    - measure: Members kept
      target: At least the 3,100 members Brackenhold had at the purchase, a year later.
      review: Every month for the first year
    - measure: Route setters kept
      target: Every Brackenhold route setter still in post after a year.
      review: Every six months
    - measure: Borrowing
      target: Gearing back below the 28.6% of 2025 within five years, as the loan is repaid.
      review: Every year
  limitations:
    - The savings and Brackenhold's future profits are estimates by people who want the deal to happen, on one side or the other.
    - The analysis cannot know what the British chain would pay, or whether it exists as a bidder at all.
    - The ten-year horizon and the 8% discount rate are Quarrystone's choices; a higher rate would make every option look worse.
  changeMind:
    - If due diligence shows Brackenhold's profits are lower than the memorandum says, the walk-away price should fall with them.
    - If the competition authority would demand the sale of a centre, the deal may no longer be worth doing.
    - If a suitable building for a new centre came up cheaply, option C would look better than its NPV suggests.
  exhibits:
    - id: ex-A1
      title: 'The purchase at two prices: NPV at 8% over ten years (€000)'
      kind: table
      provenance: simulated-data
      columns:
        - { label: Price paid }
        - { label: Full savings, numeric: true, format: d1 }
        - { label: Half the savings, numeric: true, format: d1 }
        - { label: No savings, numeric: true, format: d1 }
      rows:
        - ['A. The asking price, €3,600k', 440.1, -496.9, -1434.0]
        - ['B. The walk-away price, €3,000k', 1040.1, 103.1, -834.0]
      checks:
        - { column: Full savings, rows: ['A. The asking price, €3,600k'], is: 'npv(8, -{ex-3|Asking price (€000)|Figure}, {@brackenhold-profit} + {@savings} / 2 - {@integration}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings})' }
        - { column: Half the savings, rows: ['A. The asking price, €3,600k'], is: 'npv(8, -{ex-3|Asking price (€000)|Figure}, {@brackenhold-profit} + {@savings} / 4 - {@integration}, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2)' }
        - { column: No savings, rows: ['A. The asking price, €3,600k'], is: 'npv(8, -{ex-3|Asking price (€000)|Figure}, {@brackenhold-profit} - {@integration}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit})' }
        - { column: Full savings, rows: ['B. The walk-away price, €3,000k'], is: 'npv(8, -{@walk-away}, {@brackenhold-profit} + {@savings} / 2 - {@integration}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings}, {@brackenhold-profit} + {@savings})' }
        - { column: Half the savings, rows: ['B. The walk-away price, €3,000k'], is: 'npv(8, -{@walk-away}, {@brackenhold-profit} + {@savings} / 4 - {@integration}, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2, {@brackenhold-profit} + {@savings} / 2)' }
        - { column: No savings, rows: ['B. The walk-away price, €3,000k'], is: 'npv(8, -{@walk-away}, {@brackenhold-profit} - {@integration}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit}, {@brackenhold-profit})' }
      note: In every case year 1 bears the €400k cost of combining the businesses and half a year of savings. The NPVs use the guide's discount factors at 8%.
      source: The Business Brief's analysis of Exhibits 2, 3 and 5 (simulated data).
    - id: ex-A2
      title: Quarrystone's gearing before and after (%)

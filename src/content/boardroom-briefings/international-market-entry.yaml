# The Boardroom Briefings, No. 1. Hartwell & Rye, Kasumi Trading and Hinata
# Drugstores are fictional; every figure is simulated. Exhibit 1's margins and
# Exhibit 2's average orders are worked by their checks; the routes' payback,
# ARR and NPV (Exhibit A1) are worked from Exhibit 4's cash flows with the
# guide's discount factors at 10%. The integrity check reworks every figure.

number: 1
question: Should a company enter a new international market?
title: Hartwell & Rye weighs its first step into Japan
dek: Japanese customers found a British skincare brand before it went looking for them. Now the board must decide whether to follow them home, and by which door.
decisionType: market-entry
industry: fmcg
functions: [strategy, marketing, finance]
keyConcepts: [change, creativity]
updated: 2026-11-16

company:
  name: Hartwell & Rye
  fictional: true
  sector: Natural skincare
  location: Bath, England
  size: 180 employees; revenue of £38.6m in 2025
  ownership: Privately held company, 70% owned by its founders and 30% by Larchfield Capital, a growth investor
currency: { code: GBP, symbol: '£', unit: thousand }

summary:
  situation: >-
    Hartwell & Rye, a natural skincare company from Bath, has customers in Japan it never set out to win. Orders shipped
    to Japan from its British website more than doubled in 2025, and a six-week counter in a Tokyo department store sold
    out of its two best serums. A Japanese distributor and a Japanese drugstore chain have both made offers.
  decision: >-
    Whether to enter the Japanese market in 2026, and if so by which route: through a distributor, through a joint
    venture with a drugstore chain, or through a subsidiary of its own. Or whether to stay out and keep serving Japan
    from Britain.
  stakes: >-
    The routes ask for very different commitments. The smallest puts £0.6m at risk; the largest, £3.6m, more than half
    of the cash the company holds. The choice also decides who controls the brand in Japan, and how much the company
    learns there.

background:
  - >
    Hartwell & Rye was founded in Bath in 2011 by two pharmacists, Clare Hartwell and Tom Rye, who wanted to make
    skincare from plant extracts with a pharmacy's discipline behind it. It sells 34 products, from cleansers to a
    mineral sunscreen, through British pharmacies, department stores and its own website, and employs 180 people, most
    of them at its own production site outside the city.
  - >
    The company has grown steadily and profitably. Revenue rose from £29.4m in 2023 to £38.6m in 2025, with a gross
    profit margin of 61% and an operating profit margin of 10% last year, and the year ended with £6.2m in cash and no
    borrowing (Exhibit 1). The founders own 70% of the shares. Larchfield Capital, a growth investor, bought the other
    30% in 2021 and expects to sell its stake within four years.
  - >
    Japan arrived uninvited. A Japanese beauty writer praised the company's serum in 2023, and orders began to arrive
    through the British website, sent by post. In 2025 the company tested demand with a six-week pop-up counter in a
    Tokyo department store. Two offers followed: Kasumi Trading, a Tokyo distributor of imported beauty brands, offered
    to take the brand into drugstores across Japan, and Hinata Drugstores, a chain of 280 stores, proposed a joint
    venture.

context:
  - >
    Skincare is a crowded, brand-led business. A product costs little to make compared with its price, so most of the
    margin pays for whatever persuades a shopper to choose it: packaging, advertising, samples, displays and advice at
    the counter. A brand new to a country has to pay for all of that before it sells much, which is why entering a
    market abroad tends to cost money before it makes any.
  - >
    A foreign brand can reach shoppers in several ways. It can sell to a distributor, which buys the stock, registers
    and relabels the products, deals with the retail chains and keeps a large share of the shelf price for doing so. It
    can share a venture with a local company that already has customers and shelves. It can set up its own company in
    the country, which keeps all the margin, all the decisions and all the risk. Or it can sell across the border from
    its own website, which needs no local presence but leaves delivery, returns and service at a distance.
  - >
    Every market abroad adds risks the home market does not have: a currency that can move against the business, rules
    on ingredients and labels that differ from country to country, partners whose interests are not quite the brand's,
    and local competitors who know the customers better.

evidence:
  - kind: company
    title: Customers in Japan found the brand first
    body: >-
      Orders shipped to Japan from the British website rose from £520k in 2024 to £1,140k in 2025, a rise of 119.2%,
      with no marketing aimed at Japan (Exhibit 1). They are still small: 3.0% of the company's revenue. Online customers
      in Japan are loyal, though: 38% bought again within the year (Exhibit 2).
    exhibits: [ex-1, ex-2]
  - kind: company
    title: The Tokyo pop-up
    body: >-
      The six-week counter took 2,950 orders worth £186k (Exhibit 2), and two serums sold out in the fourth week. Pop-up
      customers spent less per order than online customers, £63.05 against £85.07, and fewer bought again within the six
      weeks: 22%. Many were trying the brand for the first time.
    exhibits: [ex-2]
  - kind: company
    title: What 800 skincare buyers said
    body: >-
      The company's survey of 800 skincare buyers aged 20 to 49 (Exhibit 3) found that 6% had heard of Hartwell & Rye.
      After trying a sample, 41% said they would consider buying, but only 33% would pay the planned price for the
      serum. More than half prefer to buy skincare in a drugstore (52%), against 21% for department stores and 27%
      online.
    exhibits: [ex-3]
  - kind: research
    title: Firms tend to enter foreign markets in stages
    body: >-
      A long-standing model of internationalization holds that firms commit to a foreign market step by step. They
      begin with routes that need little commitment, such as selling through an agent, learn about the market, and
      commit more, with a sales company and then production, as that knowledge reduces the uncertainty they face. The
      model describes a common pattern. It does not say that caution is always right.
    sources: [bbr-johanson-vahlne-1977]
  - kind: research
    title: Distance between countries has more than one dimension
    body: >-
      The CAGE framework treats the distance between two countries as cultural, administrative, geographic and
      economic, and argues that companies tend to judge foreign markets by their size and pay too little attention to
      how far away they are on each of the four.
    sources: [bbr-ghemawat-2001]


      note: The cost is recovered during year 4, when the cumulative figure turns positive. The present values of years 1 to 5 add up to £2,327.1k; less the capital cost of £1,800k, the NPV is £527.1k.
      source: The Business Brief's working, from Exhibit 4 and the guide's discount factors (simulated data).

course:
  subtopics:
    - { code: '1.5', note: 'External growth methods: a joint venture (route B) against exporting through a partner and growing alone.' }
    - { code: '1.6', note: 'What a subsidiary would mean for Japan as the host country: jobs, taxes, competition and profits sent home.' }
    - { code: '3.8', note: 'Payback and the average rate of return compare the routes; net present value, used here at 10%, is HL only.' }
    - { code: '4.4', note: 'A survey of skincare buyers, quota sampling and the gap between what people say and what they do.' }
    - { code: '4.5', note: 'Place: the distribution channel each route uses to reach drugstores, department stores and online buyers.' }
    - { code: '4.6', note: 'The opportunities and threats of entering an international market, including the exchange rate.', level: HL }
  terms: [joint-venture, strategic-alliance, multinational-company, host-country, exporting, international-marketing, exchange-rate, payback-period, average-rate-of-return, net-present-value, distribution-channel, survey, quota-sampling]

frameworks:
  - id: steeple-analysis
    use: Scan Japan as a market before choosing a route, with the economic factor (the yen) and the legal factor (product rules) to the fore.
  - id: hofstedes-cultural-dimensions
    use: Consider how differences in culture might change what customers expect from a skincare brand and how a partnership is run.
  - id: ansoff-matrix
    use: Entering Japan with the existing range is market development; reformulating products for Japan would move it towards diversification.
  - id: swot-analysis
    use: Set the brand's strengths (loyal online customers, a proven serum) against its weaknesses in Japan (low awareness, no local team).

tools:
  - { kind: studio, id: option-appraisal, use: Score the four routes against the board's criteria with your own weights. }
  - { kind: toolkit, id: steeple-analysis, use: The toolkit guide to scanning a market's external factors. }
  - { kind: calculator, id: payback-period, use: Work route A's or route C's payback from Exhibit 4. }
  - { kind: calculator, id: average-rate-of-return, use: Work each route's ARR. }
  - { kind: calculator, id: net-present-value, use: "Rework the NPVs at 10%, and at other rates in the guide's table (HL)." }

beyond:
  - idea: The commitment ladder
    body: >-
      Studies of internationalization describe a ladder of entry modes, from exporting through an agent or distributor to
      licensing, joint ventures and wholly owned subsidiaries, each step adding control, commitment and risk. The stages
      model explains why firms often climb it gradually; the case shows how the contract on the first rung decides how
      easily a firm can climb to the next.
    terms: [market-entry-mode, wholly-owned-subsidiary, greenfield-investment]
    sources: [bbr-johanson-vahlne-1977]
  - idea: Four kinds of distance
    body: >-
      The CAGE framework asks how far a market is from home culturally, administratively, geographically and
      economically. For a consumer brand, cultural distance shapes what customers want and how they buy, and the
      country of origin can itself be part of the appeal: Hartwell & Rye sells partly because it is British.
    terms: [country-of-origin-effect, exchange-rate-risk]
    sources: [bbr-ghemawat-2001]

sources: [bbr-method, bbr-johanson-vahlne-1977, bbr-ghemawat-2001]
method: >-
  Hartwell & Rye, Kasumi Trading, Hinata Drugstores and Larchfield Capital are fictional, and every figure is simulated
  for teaching. The results in Exhibit 1 follow from stated margins; the cash flows in Exhibit 4 are the board's
  forecasts; the payback periods, ARRs and NPVs in the Analysis edition are worked from them, with the guide's discount
  factors at 10%. The integrity check reworks every figure on every build.

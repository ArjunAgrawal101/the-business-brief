stakeholders:
  - name: Clare Hartwell and the board
    side: internal
    interest: high
    power: high
    wants: Growth abroad that keeps the brand's standards, without betting the company on one market.
    implications: >-
      Route C would take more than half of the company's cash and much of its managers' time. Route A asks for little
      of either, but hands the brand's future in Japan to a partner.
  - name: Larchfield Capital
    side: internal
    interest: high
    power: high
    wants: A larger, faster-growing business to sell its 30% stake into within four years; an international brand is worth more to a buyer.
    implications: >-
      Likely to favour the larger routes, whose returns come later. A slow start in Japan, or a contract that ties the
      brand to one distributor, could lower the value of its stake when it sells.
  - name: Employees in Bath
    side: internal
    interest: medium
    power: low
    wants: More work at the production site, and secure jobs.
    implications: >-
      Every route adds output in Bath. A subsidiary would also take a few managers to Tokyo and stretch the rest.
  - name: Kasumi Trading
    side: external
    interest: high
    power: medium
    wants: An exclusive, long contract for a brand with proven demand.
    implications: >-
      Under route A it would set prices, choose retailers and run promotion in Japan. Its effort, more than the
      brand's, would decide how well the launch goes.
  - name: Hinata Drugstores
    side: external
    interest: high
    power: medium
    wants: A distinctive British brand its competitors do not stock.
    implications: >-
      Route B gives it half the venture and the brand's first placing in its 280 stores. Rival chains might then
      refuse a brand half-owned by a competitor.
  - name: Customers in Japan
    side: external
    interest: medium
    power: medium
    wants: The products at a fair price, in shops they already use.
    implications: >-
      Routes A, B and C put the brand on shelves; route D keeps it online, with slow delivery from Britain, out of reach
      of the many who prefer to buy in a drugstore.

options:
  - id: A
    label: Export through a distributor (Kasumi Trading)
    summary: >-
      Kasumi buys the products in pounds, registers and relabels them, sells them to drugstores and department stores,
      and runs the promotion. Hartwell & Rye spends £600k on changes to the products and support for the launch.
    requires: A contract with Kasumi, which wants five years of exclusive rights; product registration; a narrower launch range.
    upside: Fast access to retailers, little capital at risk, no exposure to the yen and a partner who knows the trade.
    risks: >-
      Little control over price and presentation; dependence on one partner; Kasumi's margin leaves less for the brand;
      a weak launch is hard to put right while an exclusive contract runs.
    evidence: [ex-4]
  - id: B
    label: Joint venture with Hinata Drugstores
    summary: >-
      A Japanese company owned half by each partner sells the brand through Hinata's 280 stores, and later to other
      retailers. Hartwell & Rye invests £1,800k for its half.
    requires: Agreement on control, pricing and how the venture would end; a manager sent to Tokyo; accounts kept in yen.
    upside: Shelf space in a large chain from the first day, local knowledge, shared costs and half the profits.
    risks: Disputes between partners; rival chains may shun the brand; the returns are in yen, so they rise and fall with the currency.
    evidence: [ex-3, ex-4]
  - id: C
    label: A subsidiary of its own
    summary: >-
      Hartwell & Rye sets up its own Japanese company with a team in Tokyo, sells to retailers directly and runs its own
      marketing, for an investment of £3,600k.
    requires: A local team recruited from nothing; registrations and retail relationships built from scratch; a great deal of senior time.
    upside: Full control and all the profits; the deepest knowledge of the market; the strongest position if Japan succeeds.
    risks: >-
      The largest sum at risk; a loss in the first year; the slowest payback; all of the exposure to the yen; managers
      drawn away from the British business.
    evidence: [ex-4]
  - id: D
    label: 'Stay out: serve Japan from Britain'
    summary: >-
      Keep sending online orders from Bath, perhaps with a Japanese website and faster delivery, and invest in Britain
      instead.
    requires: Very little beyond a translated website and a delivery partner.
    upside: No capital at risk, full control of the brand, and managers who stay focused on the home market.
    risks: Leaves out of reach the shoppers who buy in stores, and leaves room for a competitor to take the place the brand has found.
    evidence: [ex-1, ex-2]

criteria:
  - id: return
    criterion: Financial return
    weight: 30
    measure: Net present value at 10% over five years, the payback period and the average rate of return, from the forecasts in Exhibit 4.
  - id: risk
    criterion: Risk to the company
    weight: 25
    measure: The capital at stake, the exposure to the yen, and how far a poor launch would hurt the rest of the business.
  - id: control
    criterion: Control of the brand
    weight: 20
    measure: Who would set prices, choose retailers and decide how the brand is presented in Japan.
  - id: learning
    criterion: Learning and long-term position
    weight: 15
    measure: How much the company would learn about Japanese customers, and how strong its position would be in ten years.
  - id: capacity
    criterion: Demands on management
    weight: 10
    measure: The senior time each route needs from a small team that also runs the British business.

questions:
  course:
    - id: payback-arr
      command: calculate
      marks: 4
      subtopics: ['3.8']
      prompt: Using Exhibit 4, calculate for route B, the joint venture, (a) the payback period and (b) the average rate of return (ARR).
      notes: >-
        (a) The cumulative net cash flow is −£1,800k at the start, then −£1,700k, −£1,250k and −£500k at the end of year
        3, so £500k of year 4's £950k is needed: 3 + 500 ÷ 950 = 3.5 years, or 3 years and 6.3 months (Exhibit A2). (b)
        The returns total £3,300k; less the capital cost of £1,800k, that leaves £1,500k over five years, or £300k a
        year. ARR = 300 ÷ 1,800 × 100 = 16.7%. Two marks for each, with the working shown.
    - id: jv
      command: explain
      marks: 4
      subtopics: ['1.5']
      prompt: Explain one advantage and one disadvantage to Hartwell & Rye of entering Japan through a joint venture with Hinata Drugstores.
      notes: >-
        An advantage applied to the case: shelf space in 280 stores from the first day, and a partner that knows Japanese
        shoppers, which matters when only 6% have heard of the brand. A disadvantage: shared control and the risk of
        disputes, or rival chains refusing a brand half-owned by a competitor. Each point explained in context earns two
        marks.
    - id: threats
      command: explain
      marks: 4
      level: HL
      subtopics: ['4.6']
      prompt: Explain two threats Hartwell & Rye would face in operating in the Japanese market.
      notes: >-
        Strong answers choose threats the case supports: the exchange rate (a 10% weaker yen cuts route B's NPV from £527.1k
        to £294.4k and turns route C's negative, Exhibit A1); local competitors who know customers better; product rules
        that require registration and relabelling; dependence on a partner. Each threat is explained with its effect on
        the business.
    - id: host-country
      command: discuss
      marks: 10
      subtopics: ['1.6']
      prompt: Discuss the impact on Japan, as the host country, of Hartwell & Rye setting up a subsidiary of its own there.
      notes: >-
        A balanced answer weighs jobs in sales and marketing, taxes on profits and more choice for shoppers against the
        pressure on Japanese skincare brands and the profits sent back to Britain. It notes that a subsidiary that sells
        imported products creates fewer local jobs than one that makes them, and reaches a judgement on the balance.
    - id: route
      command: recommend
      marks: 10
      subtopics: ['1.5', '3.8']
      prompt: Using the information in this briefing, recommend which route into Japan Hartwell & Rye should take.
      notes: >-
        The strongest answers use the appraisal (route A: payback 2.4 years, ARR 35.7%, NPV £613.3k) but do not stop at it:
        they weigh control, the evidence of demand and the yen, consider whether a cautious route can be made to keep the
        bigger options open, and give a clear recommendation with its conditions. Any route can earn full marks if it is
        justified against the evidence.
  seminar:
    - id: stages
      prompt: The stages model says a firm should commit more as it learns. When is entering cautiously the riskier choice?
      notes: >-
        When the market rewards the first mover, when a distributor's weak effort could fix a poor image of the brand, or
        when a cautious contract locks the firm out of the deeper routes it would later want. Good answers apply this to
        the length and exclusivity of Kasumi's contract.
    - id: contract
      prompt: Draft the three clauses you would most want in the contract with Kasumi Trading, and say what behaviour each is meant to produce.
      notes: >-
        Typical choices: sales targets that end exclusivity if missed (effort); approval rights over prices and displays
        (brand protection); a right to buy back distribution at a set price (a path to a deeper commitment). Each clause
        has a cost: Kasumi will ask for something in return.
    - id: distance
      prompt: Use the four kinds of distance to compare Japan with another market Hartwell & Rye could enter. Which distance matters most to a skincare brand?
      notes: >-
        Cultural distance shapes what customers want from a product and how it is sold; administrative distance includes
        the rules on ingredients and labels; geographic distance raises the cost of shipping and service; economic
        distance affects prices. Good answers argue for one and test it against the case.

analysis:
  verdict: >-
    Enter Japan now, through Kasumi Trading (route A), on a contract that keeps the way open to a deeper commitment: a
    shorter first term, sales targets that end exclusivity if they are missed, and the right to buy back distribution.
    Route A has the best financial case on every measure, with a net present value of £613.3k at 10%, a payback of 2.4
    years and an ARR of 35.7%. It puts only £0.6m at risk, and Kasumi pays in pounds. Its cost is control, and the
    contract and a brand manager of the company's own in Tokyo are how the board buys that control back.
  evidence:
    - >-
      The demand is real but early. Online orders from Japan grew by 119.2% in 2025 without any marketing, and 38% of
      online customers bought again (Exhibits 1 and 2). But Japan is 3.0% of revenue, and the survey suggests the wider
      market barely knows the brand: 6% awareness (Exhibit 3).
    - >-
      The survey shrinks as it goes: 41% would consider the serum after a sample, but 33% would pay the planned price,
      and people say they will buy more often than they do. Most prefer drugstores (52%), so the routes that reach
      drugstores, A and B, match how people shop.
    - >-
      On the board's five-year forecasts, route A beats B and C on every measure: payback of 2.4 years against 3.5 and 4.1,
      ARR of 35.7% against 16.7% and 11.1%, and NPV of £613.3k against £527.1k and £152.0k (Exhibit A1).
    - >-
      The currency changes the risk ranking. A yen 10% weaker than the planning rate leaves route A untouched, because
      Kasumi pays in pounds, but cuts route B's NPV to £294.4k and turns route C's negative, at −£223.2k (Exhibit A1).
  assumptions:
    - assumption: The forecasts in Exhibit 4 are equally reliable for every route.
      test: They are not. Route A's depend on Kasumi's effort, and route C's on a sales team that does not yet exist. Ask for a cautious and a hopeful case for each, and see whether the ranking survives.
    - assumption: Five years is the right horizon for the appraisal.
      test: Most of route C's value would come after year five. Extend the forecasts to ten years, with a cautious value for the business after that, and see whether C overtakes A.
    - assumption: The yen will hold at the board's planning rate.
      test: Exhibit A1 shows the effect of a 10% fall. Ask how much the company could protect by buying yen forward, and at what cost.
    - assumption: A distributor that pays in pounds removes the currency risk.
      test: It moves the risk to Kasumi, which will price for it. If the yen weakens, Kasumi will want to raise shelf prices or spend less on promotion, so the risk returns as lower sales.
  tradeoffs:
    - title: Return now, or control later
      body: >-
        Route A earns the most, soonest, by letting someone else run the brand in Japan. Every point of control the
        company keeps (over prices, displays, retailers) it must buy, either with capital (routes B and C) or with
        concessions in the contract.
    - title: Learning, or commitment
      body: >-
        The company knows little about Japanese shoppers beyond one website and one counter. A small first step lets it
        learn before it commits, but the knowledge that matters most (how drugstores sell, what shoppers pay) is learned
        best by those doing the selling, and under route A that is Kasumi.
    - title: Speed, or flexibility
      body: >-
        Kasumi can put the brand in shops within a year, but asks for five exclusive years. A long exclusive contract is
        the main way route A could turn from the safest choice into a trap.
  alternatives:
    - option: A
      fit: strong
      body: >-
        The best supported, provided the contract is right. It has the strongest appraisal, the least capital at risk
        and no exposure to the yen, and it reaches the drugstores most buyers prefer. Its weakness, control, is one the
        board can reduce through the contract and a brand manager of its own.
    - option: B
      fit: conditional
      body: >-
        Defensible if Hinata commits shelf space and marketing in writing and agrees how the venture would end. It gives
        more control and learning than A, but at three times the capital, with yen exposure and the risk that rival chains
        shut the brand out.
    - option: C
      fit: weak
      body: >-
        The deepest commitment on the thinnest knowledge. Its five-year NPV is the lowest, it turns negative if the yen
        weakens by a tenth, and it would take more than half of the company's cash. It may be the right step later, once
        the company knows the market.
    - option: D
      fit: conditional
      body: >-
        Defensible only if the board cannot get acceptable terms from Kasumi or Hinata. It risks nothing, but it leaves
        out of reach the shoppers who buy in shops, and the evidence of demand is the reason to act now.
  scores:
    - { option: A, scores: { return: 5, risk: 5, control: 2, learning: 3, capacity: 5 }, total: 4.1 }
    - { option: B, scores: { return: 4, risk: 3, control: 3, learning: 4, capacity: 3 }, total: 3.45 }
    - { option: C, scores: { return: 2, risk: 1, control: 5, learning: 5, capacity: 1 }, total: 2.7 }
    - { option: D, scores: { return: 2, risk: 4, control: 5, learning: 1, capacity: 4 }, total: 3.15 }
  recommendation:
    option: A
    decision: >-
      Enter Japan through Kasumi Trading, but negotiate the contract as the real decision: a three-year first term rather
      than five, annual sales targets that end exclusivity if they are missed, approval of prices and displays, and the
      right to buy back distribution at a price agreed now. Appoint a Hartwell & Rye brand manager in Tokyo to work
      alongside Kasumi.
    reasons:
      - Route A has the strongest appraisal on every measure, and the smallest sum at risk.
      - It reaches drugstores, where most Japanese skincare buyers prefer to shop, within a year.
      - It carries no direct exposure to the yen, the risk that most damages routes B and C.
      - With the right contract, it is a first step towards B or C rather than an alternative to them.
    conditions: >-
      The recommendation holds only if Kasumi accepts targets and a buy-back right. If it insists on five exclusive years
      on its own terms, route B, with written commitments from Hinata, becomes the better choice.
  implementation:
    - when: Months 1 to 3
      action: Negotiate the Kasumi contract, with a three-year first term, annual sales targets, exclusivity that lapses if targets are missed, approval rights over prices and displays, and a right to buy back distribution at a set price.
      owner: Chief executive and finance director
    - when: Months 1 to 6
      action: Choose a narrow launch range led by the two serums that sold out in Tokyo, and complete registration and Japanese labelling.
      owner: Head of product
    - when: Month 4
      action: Appoint a brand manager in Tokyo, employed by Hartwell & Rye, to agree launch plans, prices and displays with Kasumi and to report on the market.
      owner: Chief executive
    - when: Months 6 to 12
      action: Launch in drugstores chosen with Kasumi, and keep the Japanese website running so that loyal online customers are not lost.
      owner: Kasumi Trading with the brand manager
    - when: Month 30
      action: Review the launch against the measures below, and decide whether to renew the contract, renegotiate it or buy back distribution and move to a joint venture or a subsidiary.
      owner: The board
  measures:
    - measure: Net cash flow from Kasumi
      target: At or above the forecast in Exhibit 4, £150k in year 1 and £280k in year 2.
      review: Every quarter
    - measure: Brand awareness
      target: From 6% to 15% of skincare buyers within two years, measured by repeating the survey.
      review: Every year
    - measure: Shelf presence
      target: Stocked in 400 stores within two years.
      review: Every six months
    - measure: Repeat purchase
      target: At least the pop-up's 22% of customers buying again, rising towards the 38% seen online.
      review: Every six months
  limitations:
    - The forecasts come from the parties who would gain from each route, and none of them has been tested against a cautious case.
    - The appraisal stops at year five, which favours the routes that pay back fastest over those whose value comes later.
    - The survey measures what people say they would do, and the pop-up drew curious first-time buyers in a single store in one city.
  changeMind:
    - If Kasumi will not accept sales targets and a buy-back right, route B becomes the better route.
    - If ten-year forecasts with a cautious value after year ten show route C clearly ahead, and the yen can be hedged at a fair cost, a subsidiary deserves another look.
    - If online orders from Japan keep doubling without any local presence, the case for waiting (route D) grows stronger.
  exhibits:
    - id: ex-A1
      title: The routes appraised, at 10% (£000)
      kind: table
      provenance: simulated-data
      columns:
        - { label: Route }
        - { label: Payback (years), numeric: true, format: d1 }
        - { label: ARR (%), numeric: true, format: d1 }
        - { label: NPV at 10%, numeric: true, format: d1 }
        - { label: NPV if the yen is 10% weaker, numeric: true, format: d1 }
      rows:
        - ['A. Distributor (Kasumi Trading)', 2.4, 35.7, 613.3, 613.3]
        - ['B. Joint venture (Hinata Drugstores)', 3.5, 16.7, 527.1, 294.4]
        - ['C. Subsidiary of its own', 4.1, 11.1, 152.0, -223.2]
      checks:
        - { column: Payback (years), is: 'payback({ex-4|*|Year 0}, {ex-4|*|Year 1}, {ex-4|*|Year 2}, {ex-4|*|Year 3}, {ex-4|*|Year 4}, {ex-4|*|Year 5})' }
        - { column: ARR (%), is: 'arr({ex-4|*|Year 0}, {ex-4|*|Year 1}, {ex-4|*|Year 2}, {ex-4|*|Year 3}, {ex-4|*|Year 4}, {ex-4|*|Year 5})' }
        - { column: NPV at 10%, is: 'npv(10, {ex-4|*|Year 0}, {ex-4|*|Year 1}, {ex-4|*|Year 2}, {ex-4|*|Year 3}, {ex-4|*|Year 4}, {ex-4|*|Year 5})' }
        - { column: NPV if the yen is 10% weaker, rows: ['A. Distributor (Kasumi Trading)'], is: 'npv(10, {ex-4|*|Year 0}, {ex-4|*|Year 1}, {ex-4|*|Year 2}, {ex-4|*|Year 3}, {ex-4|*|Year 4}, {ex-4|*|Year 5})' }
        - { column: NPV if the yen is 10% weaker, rows: ['B. Joint venture (Hinata Drugstores)', 'C. Subsidiary of its own'], is: 'npv(10, {ex-4|*|Year 0}, 0.9 * {ex-4|*|Year 1}, 0.9 * {ex-4|*|Year 2}, 0.9 * {ex-4|*|Year 3}, 0.9 * {ex-4|*|Year 4}, 0.9 * {ex-4|*|Year 5})' }
      note: Payback assumes each year's cash arrives evenly through the year. The NPVs use the guide's discount factors at 10%. Kasumi pays in pounds, so a weaker yen leaves route A unchanged; under routes B and C every yen-earned flow is worth a tenth less.
      source: The Business Brief's analysis of Exhibit 4 (simulated data).
    - id: ex-A2
      title: 'Route B worked: payback and net present value (£000)'
      kind: table
      provenance: simulated-data
      columns:
        - { label: Measure }
        - { label: Year 0, numeric: true }
        - { label: Year 1, numeric: true }
        - { label: Year 2, numeric: true }
        - { label: Year 3, numeric: true }
        - { label: Year 4, numeric: true }
        - { label: Year 5, numeric: true }
      rows:
        - ['Net cash flow', -1800, 100, 450, 750, 950, 1050]
        - ['Cumulative net cash flow', -1800, -1700, -1250, -500, 450, 1500]
        - ['Discount factor at 10%', 1, 0.9091, 0.8264, 0.7513, 0.683, 0.6209]
        - ['Present value at 10%', -1800, 90.91, 371.88, 563.48, 648.85, 651.95]
      checks:
        - { row: Net cash flow, is: '{ex-4|B. Joint venture (Hinata Drugstores)|*}' }
        - { row: Cumulative net cash flow, columns: [Year 1], is: '{ex-A2|Cumulative net cash flow|Year 0} + {Net cash flow}' }
        - { row: Cumulative net cash flow, columns: [Year 2], is: '{ex-A2|Cumulative net cash flow|Year 1} + {Net cash flow}' }
        - { row: Cumulative net cash flow, columns: [Year 3], is: '{ex-A2|Cumulative net cash flow|Year 2} + {Net cash flow}' }
        - { row: Cumulative net cash flow, columns: [Year 4], is: '{ex-A2|Cumulative net cash flow|Year 3} + {Net cash flow}' }
        - { row: Cumulative net cash flow, columns: [Year 5], is: '{ex-A2|Cumulative net cash flow|Year 4} + {Net cash flow}' }
        - { row: Discount factor at 10%, columns: [Year 1], is: 'df(10, 1)' }
        - { row: Discount factor at 10%, columns: [Year 2], is: 'df(10, 2)' }
        - { row: Discount factor at 10%, columns: [Year 3], is: 'df(10, 3)' }
        - { row: Discount factor at 10%, columns: [Year 4], is: 'df(10, 4)' }
        - { row: Discount factor at 10%, columns: [Year 5], is: 'df(10, 5)' }

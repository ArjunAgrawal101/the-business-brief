# The Boardroom Briefings, No. 5. Velantra Cold Chain is fictional; every
# figure is simulated. Exhibit 3's revenue by customer and margin, and Exhibit
# 4's branch totals, are worked by their checks; the expected costs in
# Exhibit A1 are each response's branches weighted by their probabilities.

number: 5
question: How should a CEO manage a major organizational crisis?
title: Velantra Cold Chain's systems go dark at three in the morning
dek: Criminals have locked a cold-chain distributor out of its own warehouses, with hospitals, pharmacies and supermarkets waiting for deliveries. The chief executive has hours, not weeks, to decide how to lead.
decisionType: crisis-leadership
industry: logistics
functions: [strategy, operations, human-resources, marketing, finance]
keyConcepts: [ethics, change]
updated: 2026-11-16

company:
  name: Velantra Cold Chain
  fictional: true
  sector: Temperature-controlled distribution of food and medicines
  location: Columbus, Ohio, United States
  size: Three warehouses, 140 refrigerated trucks, 1,100 employees and revenue of US$214.0m in 2025
  ownership: Privately held company, 70% owned by a private equity firm and 30% by its managers
currency: { code: USD, symbol: 'US$', unit: thousand }

summary:
  situation: >-
    At three in the morning on a Monday, ransomware encrypted the systems that run Velantra Cold Chain's three warehouses
    and its delivery routes. The cold stores are still cold, but nobody can see what is in them or plan a delivery. Forty-six
    hospital deliveries, mostly temperature-sensitive medicines, are due in the next 72 hours.
  decision: >-
    How the chief executive should lead the company through the crisis: rebuild the systems safely from offline backups
    while running a manual service for the most urgent customers, restore quickly from the latest backup and accept the
    risk of reinfection, pay the criminals for a key, or hand the deliveries to competitors until the systems are rebuilt.
  stakes: >-
    Patients waiting for medicines, supermarket shelves, the jobs of 1,100 people and the trust of every customer are at
    stake. What the chief executive does and says in the first hours will shape how all of them judge the company long
    after the systems are back.

background:
  - >
    Velantra Cold Chain stores and delivers food and medicines that must be kept cold: chilled and frozen food for two
    supermarket chains, medicines for independent pharmacies, and vaccines and other temperature-sensitive medicines for
    four hospital systems in Ohio. It runs three warehouses and 140 refrigerated trucks and employs 1,100 people. In 2025 it
    earned revenue of US$214.0m and an operating profit of US$12.8m (Exhibit 3).
  - >
    Dana Okafor became chief executive in 2023, after the company was bought by a private equity firm, which owns 70%; the
    managers own the rest. Under her the company tested its contingency plan every quarter: offline backups of its systems
    were kept apart from the network and restored in practice, and a crisis team was named. The plan did not say how to
    deliver without the warehouse system.
  - >
    The attack came in the early hours of a Monday (Exhibit 1). By the time Dana convened the crisis team, the IT director
    had cut the network off from the internet, the temperature loggers in the cold stores, which run on their own, showed
    every store at the right temperature, and the attackers had demanded US$4.5m for a key to unlock the systems.

context:
  - >
    Cold-chain distribution sits between producers and the shops, pharmacies and hospitals that depend on it. Its customers
    plan on deliveries arriving on time and at the right temperature, and many hold only a few days of stock. When a
    distributor stops, the effects spread quickly, and for medicines they can reach patients.
  - >
    Ransomware attacks encrypt an organization's systems and demand payment for the key. Attackers increasingly copy data
    before they encrypt it, and threaten to publish it. Paying does not guarantee that the key works, that the data is
    destroyed or that the attackers will not return, and the authorities in many countries advise organizations not to pay.
  - >
    In a crisis, the first hours matter most. Customers, employees, regulators and the media all want to know what has
    happened and what the organization is doing about it. Silence is filled by rumour, and a statement that later proves
    wrong is hard to take back.

evidence:
  - kind: company
    title: A business that can afford any response
    body: >-
      Velantra ended 2025 with US$9,600k in cash and an undrawn credit facility of US$15,000k (Exhibit 3). Even the costliest
      outcome in the incident team's estimates, US$9,280k if a fast restore is reinfected, would not exhaust that. The choice
      is not about whether the company can pay, but about what it should do.
    exhibits: [ex-3, ex-4]
  - kind: company
    title: Who is waiting
    body: >-
      In the next 72 hours Velantra is due to make 46 deliveries to hospitals, 1,280 to pharmacies and 410 to supermarket
      stores (Exhibit 2). Hospitals bring 18% of revenue and supermarkets 58%, but the hospitals' medicines are the
      deliveries that cannot wait.
    exhibits: [ex-2]
  - kind: company
    title: Four responses, costed
    body: >-
      The incident team has estimated the cost of each response, with probabilities where the outcome is uncertain (Exhibit
      4). Rebuilding from offline backups takes seven days and costs about US$3,920k. Restoring from last night's backup
      takes two days if it works, but the team puts the chance of reinfection at 35%.
    exhibits: [ex-4]
  - kind: research
    title: The response should match the responsibility
    body: >-
      Situational crisis communication theory holds that an organization's response should fit how much responsibility
      the public attributes to it. When it is seen as a victim, information and support for those affected come first;
      when it is seen as at fault, it needs to accept responsibility and make amends.
    sources: [bbr-coombs-2007]
  - kind: market
    title: What customers need to hear
    body: >-
      In any supply crisis, customers need to know three things quickly: whether their orders will arrive, when they will
      hear more, and whom to call. Telling them early, even with incomplete information, usually does less damage than
      telling them late.

financials:
  summary: >-
    Exhibit 3 gives Velantra's results and liquidity at the end of 2025, with its revenue by kind of customer. Exhibit 4 sets
    out the incident team's estimates for each response: the days of reduced service, the loss for each of those days, the
    cost of the incident response, stock that would spoil, and the ransom or a lost contract where they apply. Where an
    outcome is uncertain, the response has two branches, each with its probability.
  exhibits: [ex-3, ex-4]


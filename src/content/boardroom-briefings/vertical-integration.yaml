# The Boardroom Briefings, No. 8. Tallowood Cafés and Kiln & Copper Roasters are
# fictional; every figure is simulated. Exhibit 2's coffee cost and margins,
# Exhibit 3's roaster accounts and Exhibit 4's costs to buy and to make are
# worked by their checks; Exhibit A1 appraises each option at 8% over eight
# years, and Exhibit A2 tests the purchase against the loss of the roaster's
# other customers.

number: 8
question: Should a business vertically integrate its supply chain?
title: Tallowood Cafés is offered the roaster behind its coffee
dek: A Melbourne café chain can buy the roastery that supplies it, build one of its own, or stay a customer on better terms. Owning the supply chain looks like control; the evidence asks what control is worth.
decisionType: vertical-integration
industry: hospitality
functions: [operations, finance, strategy]
keyConcepts: [change, sustainability]
updated: 2026-11-16

company:
  name: Tallowood Cafés
  fictional: true
  sector: Café chain
  location: Melbourne, Australia
  size: 42 cafés, 610 employees and revenue of A$61.2m in 2025
  ownership: Privately held company, 65% owned by its founders and 35% by a hospitality investment group
currency: { code: AUD, symbol: 'A$', unit: thousand }

summary:
  situation: >-
    Tallowood Cafés buys all its coffee, 210 tonnes a year, from one roaster, Kiln & Copper. The roaster's owner is retiring
    and has offered to sell the business to Tallowood for A$9.0m. Tallowood has had growing problems with the roaster's
    late deliveries and uneven batches.
  decision: >-
    Whether to integrate backwards into roasting, by buying Kiln & Copper or by building a roastery of its own; or to stay
    a customer, either on a long-term contract with Kiln & Copper or by buying from several roasters.
  stakes: >-
    Coffee is Tallowood's signature and 13.0% of its revenue. The choice decides who controls its quality and cost, how
    much capital it ties up in a business it has never run, and whether it ends up supplying its own competitors.

background:
  - >
    Priya Nair opened the first Tallowood café in Fitzroy in 2012, built a following for its house blend, and grew the chain
    to 42 cafés across Melbourne. In 2025 Tallowood earned revenue of A$61.2m and an operating profit of A$4.3m, a margin of
    7.0% (Exhibit 2). The founders own 65% of the company; a hospitality investment group owns 35%.
  - >
    From the start, Tallowood's coffee has been roasted by Kiln & Copper, an independent roastery in Brunswick, to a blend
    the two developed together. Tallowood bought 210 tonnes in 2025 at A$38.00 a kilogram, A$7,980k in all. Kiln & Copper
    also roasts for other cafés, some of them Tallowood's competitors, and for two grocery chains (Exhibit 3).
  - >
    The relationship has frayed. Kiln & Copper is near the end of its owner's working life and has invested little: nine of
    its 104 deliveries to Tallowood in 2025 were late, and six of 52 batches failed Tallowood's taste test (Exhibit 1). Its
    owner has now offered the business to Tallowood for A$9.0m. An engineer has also quoted Tallowood A$3.4m to fit out a
    roastery of its own, sized for its needs.

context:
  - >
    Specialty coffee roasting is a competitive trade. There are many roasters, the equipment can be bought and the skills can
    be hired, so a café chain is rarely short of suppliers. What is harder to replace is a particular blend roasted the same
    way every week, which customers notice when it changes.
  - >
    Owning a stage of the supply chain brings control over quality, supply and cost, and keeps the supplier's profit in the
    group. It also brings capital tied up, a business to run that may be unlike the core one, and the loss of the freedom
    to switch suppliers. A supplier owned by one customer may lose its other customers, especially those who compete with
    the owner.
  - >
    Contracts are the alternative to ownership. A long contract with standards for quality and delivery, and penalties if
    they are missed, can give much of the control of ownership, but it can never foresee every problem, and it depends on
    a supplier able to keep its promises.

evidence:
  - kind: company
    title: Coffee is a large and visible cost
    body: >-
      Tallowood spent A$7,980k on roasted coffee in 2025, 13.0% of its revenue, against an operating profit of A$4,284k (Exhibit
      2). A saving of a few dollars a kilogram matters to the chain's margin.
    exhibits: [ex-2]
  - kind: company
    title: A supplier with spare capacity and slipping standards
    body: >-
      Kiln & Copper roasted 520 tonnes in 2025 in a roastery that can handle 700, a capacity utilization rate of 74.3%, and
      earned a profit of A$3,300k (Exhibit 3). Late deliveries reached 8.7% and failed batches 11.5% (Exhibit 1).
    exhibits: [ex-3, ex-1]
  - kind: company
    title: The cost to buy against the cost to make
    body: >-
      Buying 210 tonnes at A$38.00 a kilogram costs A$7,980k a year. A roastery of Tallowood's own would cost A$1,450k a year to
      run plus A$24.50 a kilogram in beans, energy and packaging: A$6,595k for the same coffee (Exhibit 4). Kiln & Copper has
      offered a five-year contract at A$36.50 a kilogram instead.
    exhibits: [ex-4]
  - kind: research
    title: Why firms make rather than buy
    body: >-
      Transaction cost economics explains the boundary of the firm: using the market has costs, of finding suppliers,
      agreeing terms and enforcing them, and when those costs are high, as when few suppliers can do the work and contracts
      cannot cover every problem, firms do better to organize the activity themselves. When many suppliers compete, buying is
      usually cheaper.
    sources: [bbr-coase-1937, bbr-williamson-1975]
  - kind: research
    title: The value chain
    body: >-
      Porter's value chain describes a firm as a set of activities, from bringing in materials to serving customers, each of
      which adds cost and can add value. A firm gains an advantage by performing some activities better or more cheaply than
      rivals, which is the test any decision to take on a new activity must pass.
    sources: [bbr-porter-1985]

financials:
  summary: >-
    Exhibit 2 gives Tallowood's results and what it pays for coffee. Exhibit 3 gives Kiln & Copper's accounts for 2025 and its
    asking price. Exhibit 4 compares the cost of Tallowood's 210 tonnes under each option: buying as now, buying on the
    offered contract or by tender, and roasting it in a roastery of its own. Tallowood appraises investments at 8% over
    eight years.
  exhibits: [ex-2, ex-3, ex-4]


stakeholders:
  - name: Priya Nair and the founders
    side: internal
    interest: high
    power: high
    wants: Coffee they are proud of in every cup, and a chain that keeps growing.
    implications: >-
      Buying Kiln & Copper or building a roastery puts roasting under their control, and makes them responsible for running
      a manufacturing business alongside 42 cafés.
  - name: The hospitality investment group
    side: internal
    interest: medium
    power: high
    wants: A good return on its 35%, and capital used where it earns most.
    implications: >-
      It will ask why A$9.0m should go into a roastery rather than new cafés, and what happens to the roaster's profit if its
      other customers leave.
  - name: Kiln & Copper's owner and staff
    side: external
    interest: high
    power: medium
    wants: A buyer who keeps the business and its people; the owner wants a fair price to retire on.
    implications: >-
      A sale to Tallowood keeps the roastery going; if Tallowood builds its own, Kiln & Copper loses its largest customer
      and may not find another buyer.
  - name: Kiln & Copper's other customers
    side: external
    interest: high
    power: medium
    wants: Reliable coffee from a roaster that does not belong to a competitor.
    implications: >-
      Those buying 124 of the 310 tonnes say they would leave if Tallowood owned the roastery, which would cut the profit
      Tallowood is paying for.
  - name: Café managers and baristas
    side: internal
    interest: medium
    power: low
    wants: Coffee that arrives on time and tastes the same every week.
    implications: >-
      They bear the late deliveries and failed batches today, and would bear the teething problems of a new roastery.
  - name: Coffee growers
    side: external
    interest: medium
    power: low
    wants: Steady buyers who pay fairly for good beans.
    implications: >-
      A roastery of Tallowood's own could buy directly from farms it chooses, which would let it set and check standards for
      how the beans are grown and paid for.

options:
  - id: A
    label: Buy Kiln & Copper
    summary: >-
      Pay the asking price of A$9.0m, keep the roastery's staff and its other customers where possible, and run it as a
      subsidiary that supplies Tallowood first.
    requires: A$9.0m, managers who can run a roastery, and a plan to keep the other customers.
    upside: Control of the blend, supply and quality at once, and the roaster's profit kept in the group.
    risks: >-
      Customers buying 124 tonnes say they would leave; the price pays for a profit that would shrink; and Tallowood would be
      selling coffee to its own competitors.
    evidence: [ex-3, ex-1]
  - id: B
    label: Sign a five-year contract with Kiln & Copper
    summary: >-
      Stay a customer, on a five-year contract at A$36.50 a kilogram, with standards for delivery and taste and penalties if
      they are missed.
    requires: A supplier able to keep its promises, which depends on who buys Kiln & Copper when the owner retires.
    upside: A$315k a year saved, no capital tied up, and management attention kept on the cafés.
    risks: The contract cannot guarantee quality from a roaster that is not investing; a new owner may not honour its spirit.
    evidence: [ex-1, ex-4]
  - id: C
    label: Build a roastery of its own
    summary: >-
      Fit out a roastery sized for Tallowood's 210 tonnes for A$3,400k, hire two experienced roasters, and keep buying from
      Kiln & Copper for the 12 months it takes to commission.
    requires: A$3,400k, roasting skills hired in, and a year of overlap with the present supplier.
    upside: The lowest cost of coffee, A$6,595k a year against A$7,980k, control of the blend, and no competitors as customers.
    risks: >-
      A new business to learn; teething problems with quality in the first months; the costs are an engineer's estimate; and a
      roastery sized for today leaves little room for growth.
    evidence: [ex-4]
  - id: D
    label: Buy from several roasters by tender
    summary: >-
      Put the coffee out to tender, split the volume between two or three roasters, and switch supply when one falls short.
    requires: A blend that more than one roaster can reproduce, and a head of coffee to manage several suppliers.
    upside: A$210k a year saved, competition between suppliers, and no dependence on one.
    risks: The signature blend may vary between roasters, and customers notice; no supplier has much reason to invest for Tallowood.
    evidence: [ex-4]

criteria:
  - id: cost
    criterion: Cost of coffee
    weight: 25
    measure: The saving each year against buying as now, and the net present value at 8% over eight years.
  - id: quality
    criterion: Quality and security of supply
    weight: 25
    measure: Control of the blend, the reliability of deliveries and the risk of running short.
  - id: risk
    criterion: Capital and execution risk
    weight: 20
    measure: The capital tied up, and what could go wrong in carrying the option out.
  - id: focus
    criterion: Management focus
    weight: 15
    measure: How far the option draws managers away from running and growing the cafés.
  - id: flexibility
    criterion: Flexibility
    weight: 15
    measure: How easily Tallowood could change course if the market or its needs change.

questions:
  course:
    - id: ctb-ctm
      command: calculate
      marks: 4
      level: HL
      subtopics: ['5.6']
      prompt: Using Exhibit 4, calculate the cost to buy (CTB) and the cost to make (CTM) for Tallowood's 210 tonnes of coffee a year.
      notes: >-
        CTB = price × quantity = 38.00 × 210,000 kg = A$7,980k. CTM = fixed costs + variable cost × quantity = 1,450 + 24.50 ×
        210 = A$6,595k. Making saves A$1,385k a year, before the A$3,400k fit-out. Two marks for each.
    - id: utilization
      command: calculate
      marks: 2
      level: HL
      subtopics: ['5.6']
      prompt: Using Exhibit 3, calculate Kiln & Copper's capacity utilization rate in 2025.
      notes: >-
        Capacity utilization = actual output ÷ productive capacity × 100 = 520 ÷ 700 × 100 = 74.3%. The roastery has 180
        tonnes of spare capacity, which a buyer might fill.
    - id: integration
      command: explain
      marks: 4
      subtopics: ['1.5']
      prompt: Explain one advantage and one disadvantage of backward vertical integration for Tallowood Cafés.
      notes: >-
        Advantage: control over the quality and supply of its signature coffee, and the supplier's margin kept in the group.
        Disadvantage: capital tied up in a business unlike its own, and, if it buys Kiln & Copper, the loss of customers who
        compete with Tallowood. Each applied to the case.
    - id: insourcing
      command: discuss
      marks: 10
      subtopics: ['5.4']
      prompt: Discuss whether Tallowood should insource the roasting of its coffee.
      notes: >-
        Good answers weigh the lower cost (A$6,595k against A$7,980k), control and quality against the fit-out, the skills it
        lacks and the loss of flexibility, compare insourcing with a long contract, and reach a judgement.
    - id: recommend
      command: recommend
      marks: 10
      subtopics: ['1.5', '3.8']
      prompt: Recommend which of the four options Tallowood should choose.
      notes: >-
        The best answers compare the appraisals in Exhibit A1, test the purchase against the loss of the roaster's other
        customers (Exhibit A2), consider quality and management focus, and make a clear recommendation with conditions.
  seminar:
    - id: transaction-costs
      prompt: Transaction cost economics says firms should make what is costly to buy through the market. Is roasting coffee such an activity for Tallowood?
      notes: >-
        Many roasters compete, which argues for buying; but a particular blend, roasted consistently, is harder to buy, and
        Tallowood's experience with Kiln & Copper shows the cost of a supplier that falls short. Good answers decide which
        matters more here.
    - id: competitors
      prompt: Why might a supplier lose customers when one of them buys it? How should Tallowood value a business whose customers may leave?
      notes: >-
        Competitors fear that their orders, prices and blends will be seen by a rival, and that they will be served second.
        Value the business on the customers likely to stay, as Exhibit A2 does.
    - id: growers
      prompt: Would owning a roastery let Tallowood do more for the farmers who grow its coffee? Is that a reason to integrate?
      notes: >-
        A roaster can buy directly and set standards for how beans are grown and paid for, which a café buying roasted coffee
        cannot. Good answers ask whether this is a benefit of ownership or something a contract could also require.

analysis:
  verdict: >-
    Integrate, but by building rather than buying (option C). A roastery of Tallowood's own would roast its 210 tonnes for
    A$6,595k a year against A$7,980k now, an NPV of A$4,559.0k at 8% over eight years, and would put the blend under its
    control without making it a supplier to its own competitors. Buying Kiln & Copper looks better only if its other
    customers stay, and those buying 124 of their 310 tonnes say they would not. The contract on offer is the right
    fallback, and the right arrangement for the year it takes to build.
  evidence:
    - >-
      Making is cheaper than buying: A$6,595k against A$7,980k a year for the same coffee, a saving of A$1,385k (Exhibit 4).
      The contract saves A$315k and a tender A$210k.
    - >-
      On the appraisal, building has the highest NPV, A$4,559.0k, and the fastest payback, 2.5 years; buying Kiln & Copper
      has an NPV of A$1,769.1k and a payback of 4.8 years if 40% of the other customers' volume leaves (Exhibit A1).
    - >-
      The purchase depends on customers Tallowood cannot keep. If none left, buying would be worth A$9,963.8k; if 80% left,
      it would lose A$6,425.5k (Exhibit A2). The asking price, 2.7 times this year's profit, pays for customers who say
      they will go.
    - >-
      The supplier's problems are real: 8.7% of deliveries late and 11.5% of batches failed in 2025 (Exhibit 1). A contract
      with the same roaster, under an owner about to leave, would not fix them by itself.
  assumptions:
    - assumption: The roastery's costs will be as the engineer quoted, A$1,450k a year plus A$24.50 a kilogram.
      test: Ask other café groups that roast their own what their costs turned out to be, and add a margin for the first year's waste.
    - assumption: Tallowood can hire roasters who can reproduce its blend.
      test: Recruit them before committing to the fit-out, and have them roast trial batches on rented equipment.
    - assumption: Customers buying 124 tonnes would leave Kiln & Copper if Tallowood bought it.
      test: It is what they say; some might stay for a price cut. Exhibit A2 shows how far the purchase depends on them.
    - assumption: Tallowood's needs will stay near 210 tonnes.
      test: If the chain grows, a roastery sized for today will need expanding; plan the site with room to add a second roaster.
  tradeoffs:
    - title: Control, or freedom
      body: >-
        Owning roasting gives Tallowood control of its signature product, but ends the freedom to switch suppliers. A
        contract keeps that freedom and gives up some control.
    - title: Buying a business, or building a capability
      body: >-
        Buying Kiln & Copper gets a working roastery and experienced staff at once, with customers attached that Tallowood
        may lose. Building takes a year and has teething problems, but carries nothing Tallowood does not want.
    - title: Saving money, or adding a business
      body: >-
        A roastery saves A$1,385k a year, but it is a manufacturing business that managers must learn to run. The saving is
        worth having only if it does not distract from the 42 cafés that earn the profit.
  alternatives:
    - option: A
      fit: weak
      body: >-
        Weakly supported. Its value rests on customers who say they will leave, it makes Tallowood a supplier to its
        competitors, and its NPV swings from strongly positive to strongly negative on that one assumption.
    - option: B
      fit: conditional
      body: >-
        Defensible, and the right arrangement for the year it takes to build. As the long-term answer it depends on a roaster
        that is not investing and is about to change hands.
    - option: C
      fit: strong
      body: >-
        The best supported. It has the lowest cost and the highest NPV, it gives Tallowood control of its blend, and it avoids
        the competitor problem. Its risks, skills and teething problems, can be managed by hiring first and keeping supply
        from Kiln & Copper until the new roastery is proven.
    - option: D
      fit: weak
      body: >-
        Weakly supported for a chain whose coffee is its signature. It saves least, and splitting a blend between roasters
        risks the consistency customers notice.
  scores:
    - { option: A, scores: { cost: 3, quality: 5, risk: 1, focus: 2, flexibility: 1 }, total: 2.65 }
    - { option: B, scores: { cost: 2, quality: 4, risk: 5, focus: 5, flexibility: 3 }, total: 3.7 }
    - { option: C, scores: { cost: 5, quality: 4, risk: 3, focus: 3, flexibility: 3 }, total: 3.75 }
    - { option: D, scores: { cost: 1, quality: 2, risk: 5, focus: 4, flexibility: 5 }, total: 3.1 }
  recommendation:
    option: C
    decision: >-
      Build a roastery of Tallowood's own. First hire two experienced roasters and have them reproduce the blend on rented
      equipment; then fit out a leased site for A$3,400k, with room for a second roaster. Meanwhile, sign Kiln & Copper's
      contract for a short term, with the delivery and taste standards, to cover the year it takes to commission. Decline
      the offer to buy Kiln & Copper.
    reasons:
      - Making is A$1,385k a year cheaper than buying, with the highest NPV of any option.
      - It puts the signature blend under Tallowood's control.
      - It avoids paying for customers who say they would leave, and selling coffee to competitors.
      - A short contract with Kiln & Copper protects supply while the roastery is built and proven.
    conditions: >-
      If the roasters Tallowood hires cannot reproduce the blend in trials, it should not build; it should sign the five-year
      contract (option B) and look for a second roaster to keep Kiln & Copper honest.
  implementation:
    - when: Months 1 to 3
      action: Recruit two experienced roasters; reproduce the blend on rented equipment; sign a short contract with Kiln & Copper with delivery and taste standards.
      owner: Head of coffee
    - when: Months 3 to 12
      action: Lease and fit out the roastery, with space for a second roaster; set up quality checks and buying of green beans.
      owner: Operations director
    - when: Months 12 to 15
      action: Commission the roastery, running it alongside Kiln & Copper's supply and moving cafés across in stages.
      owner: Head of coffee
    - when: Month 24
      action: Review costs, quality and supply against the measures below, and decide whether to buy directly from growers.
      owner: The board
  measures:
    - measure: Cost of coffee
      target: At or below A$6,595k a year for 210 tonnes, the engineer's estimate, from the second year.
      review: Every quarter
    - measure: Quality
      target: Fewer failed batches than Kiln & Copper's 11.5% in 2025, falling towards none.
      review: Every week at first, then every month
    - measure: Supply
      target: Late deliveries to cafés below Kiln & Copper's 8.7%.
      review: Every month
    - measure: Return
      target: The A$3,400k fit-out paid back within the 2.5 years of the appraisal.
      review: Every year
  limitations:
    - The roastery's costs are an engineer's estimate for a business Tallowood has never run.
    - Customers' statements about leaving Kiln & Copper may not match what they would do.
    - The eight-year appraisal assumes Tallowood's needs stay near 210 tonnes and coffee prices move alike under every option.
  changeMind:
    - If trial roasting showed the blend could not be reproduced, the contract (option B) would be the better choice.
    - If Kiln & Copper's other customers committed in writing to stay, buying it (option A) would be worth much more than it now appears.
    - If Tallowood planned to grow fast, a larger roastery, or the purchase of one with spare capacity, would deserve another look.
  exhibits:
    - id: ex-A1
      title: The options appraised at 8% over eight years (A$000)
      kind: table
      provenance: simulated-data
      columns:
        - { label: Option }
        - { label: Capital cost, numeric: true, format: money }
        - { label: Saving a year, numeric: true, format: money }
        - { label: Payback (years), numeric: true, format: d1 }
        - { label: NPV at 8%, numeric: true, format: d1 }
      rows:
        - ['A. Buy Kiln & Copper (40% of the other volume leaves)', 9000, 1874, 4.8, 1769.1]
        - ['B. Sign a five-year contract with Kiln & Copper', 0, 315, 'No capital', 1810.2]
        - ['C. Build a roastery of its own', 3400, 1385, 2.5, 4559.0]
        - ['D. Buy from several roasters by tender', 0, 210, 'No capital', 1206.8]
      checks:
        - { column: Saving a year, rows: ['A. Buy Kiln & Copper (40% of the other volume leaves)'], is: '{ex-3|Revenue from Tallowood (A$000)|2025} + ({ex-3|Sold to other cafés and grocers (tonnes)|2025} - {@leaving-tonnes}) * {ex-3|Price to other customers (A$ a kilogram)|2025} - ({ex-3|Sold to Tallowood (tonnes)|2025} + {ex-3|Sold to other cafés and grocers (tonnes)|2025} - {@leaving-tonnes}) * {@variable-cost} - {ex-3|Fixed costs (A$000)|2025}' }
        - { column: Saving a year, rows: ['B. Sign a five-year contract with Kiln & Copper'], is: '{@contract-saving}' }
        - { column: Saving a year, rows: ['C. Build a roastery of its own'], is: '{@make-saving}' }
        - { column: Saving a year, rows: ['D. Buy from several roasters by tender'], is: '{@tender-saving}' }
        - { column: Payback (years), rows: ['A. Buy Kiln & Copper (40% of the other volume leaves)', 'C. Build a roastery of its own'], is: '{Capital cost} / {Saving a year}' }
        - { column: NPV at 8%, rows: ['A. Buy Kiln & Copper (40% of the other volume leaves)', 'C. Build a roastery of its own'], is: 'npv(8, -{Capital cost}, {Saving a year}, {Saving a year}, {Saving a year}, {Saving a year}, {Saving a year}, {Saving a year}, {Saving a year}, {Saving a year})' }
        - { column: NPV at 8%, rows: ['B. Sign a five-year contract with Kiln & Copper', 'D. Buy from several roasters by tender'], is: '{Saving a year} * (df(8, 1) + df(8, 2) + df(8, 3) + df(8, 4) + df(8, 5) + df(8, 6) + df(8, 7) + df(8, 8))' }
      note: For A, the saving is the coffee Tallowood no longer buys plus the profit on the other customers who stay, less the roastery's costs. B and D need no capital, so their figure is the present value of the savings, assuming the contract is renewed on the same terms after five years.
      source: The Business Brief's analysis of Exhibits 3 and 4 (simulated data).
    - id: ex-A2
      title: Buying Kiln & Copper if its other customers leave (A$000)
      kind: table
      provenance: simulated-data
      columns:
        - { label: Share of the other customers' volume that leaves }
        - { label: Saving a year, numeric: true, format: money }
        - { label: NPV at 8% over eight years, numeric: true, format: d1 }
      rows:
        - ['None', 3300, 9963.8]
        - ['40%, as the customers say', 1874, 1769.1]
        - ['80%', 448, -6425.5]
      checks:
        - { column: Saving a year, rows: ['None'], is: '{ex-3|Profit (A$000)|2025}' }
        - { column: Saving a year, rows: ['40%, as the customers say'], is: '{ex-A1|A. Buy Kiln & Copper (40% of the other volume leaves)|Saving a year}' }
        - { column: Saving a year, rows: ['80%'], is: '{ex-3|Revenue from Tallowood (A$000)|2025} + {ex-3|Sold to other cafés and grocers (tonnes)|2025} * (1 - {@severe-leaving} / 100) * {ex-3|Price to other customers (A$ a kilogram)|2025} - ({ex-3|Sold to Tallowood (tonnes)|2025} + {ex-3|Sold to other cafés and grocers (tonnes)|2025} * (1 - {@severe-leaving} / 100)) * {@variable-cost} - {ex-3|Fixed costs (A$000)|2025}' }
        - { column: NPV at 8% over eight years, is: '{Saving a year} * (df(8, 1) + df(8, 2) + df(8, 3) + df(8, 4) + df(8, 5) + df(8, 6) + df(8, 7) + df(8, 8)) - {ex-3|Asking price for the business (A$000)|2025}' }
      note: If no customer left, Tallowood would keep the whole of Kiln & Copper's profit; each customer who leaves takes its contribution with it while the roastery's fixed costs stay.
      source: The Business Brief's analysis of Exhibit 3 (simulated data).


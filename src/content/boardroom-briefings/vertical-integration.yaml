    - { code: '5.4', note: 'Insourcing against outsourcing: whether to bring roasting into the business.' }
    - { code: '5.6', note: 'The cost to buy against the cost to make, the capacity utilization rate and the supply chain.', level: HL }
    - { code: '5.3', note: 'Quality control and quality assurance, from failed batches to standards in a contract.', level: HL }
    - { code: '3.8', note: 'Payback for each option; at HL, net present value over eight years.' }
    - { code: '3.3', note: 'Fixed and variable costs in roasting, and how they change the cost of each kilogram.' }
  terms: [vertical-integration, supply-chain, insourcing, outsourcing, cost-to-buy, cost-to-make, capacity-utilization-rate, quality-assurance, quality-control, fixed-cost, variable-cost, payback-period, net-present-value]

frameworks:
  - id: value-chain
    use: Roasting is an upstream activity; the question is whether Tallowood can perform it better or more cheaply than the market.
  - id: five-forces
    use: The power of suppliers is low in a market of many roasters, which argues for buying; the power of one failing supplier is the exception.
  - id: swot-analysis
    use: Set Tallowood's strength in its blend and its cafés against its weakness in manufacturing.
  - id: circular-business-models
    use: A roastery of its own could recover chaff and grounds and buy beans on terms it sets, if sustainability is part of the case.

tools:
  - { kind: studio, id: option-appraisal, use: Score the four options against the board's criteria with your own weights. }
  - { kind: calculator, id: payback-period, use: Rework the payback of building and of buying. }
  - { kind: calculator, id: net-present-value, use: Rework the NPVs at 8% (HL). }
  - { kind: toolkit, id: swot-analysis, use: The toolkit guide to SWOT analysis. }

beyond:
  - idea: Make or buy, and the boundary of the firm
    body: >-
      Transaction cost economics asks when an activity is better organized inside the firm than bought in a market. Where
      many suppliers compete and the product can be specified, the market usually wins; where the product is specific to the
      buyer and hard to contract for, the firm does. A café chain's signature blend sits between the two, which is why the
      case turns on evidence rather than principle.
    terms: [total-cost-of-ownership, core-competence]
    sources: [bbr-coase-1937, bbr-williamson-1975]
  - idea: The value chain
    body: >-
      Porter's value chain gives the test for taking on a new activity: whether the firm can perform it in a way that adds
      more value, or costs less, than rivals and suppliers can. Owning roasting adds value for Tallowood only if its roastery
      makes better coffee or cheaper coffee than the market does.
    terms: [value-chain, competitive-advantage]
    sources: [bbr-porter-1985]

sources: [bbr-method, bbr-coase-1937, bbr-williamson-1975, bbr-porter-1985]
method: >-
  Tallowood Cafés, Kiln & Copper Roasters and their people are fictional, and every figure is simulated for teaching. The
  coffee costs and margins in Exhibit 2, the roaster's accounts in Exhibit 3, the service measures in Exhibit 1 and the costs
  to buy and to make in Exhibit 4 are worked from the figures beside them; the appraisals in Exhibits A1 and A2 use the
  guide's discount factors at 8% over eight years. The integrity check reworks every figure on every build.

component: ansoff-placer
title: Place Marigold's options on the Ansoff matrix
purpose: >
  The learner places each option in one of the four directions of growth, then sees the placement with its reason
  and any placement that can also be argued. It separates the direction of growth (Ansoff) from the method of growth
  (franchising, a joint venture, an acquisition), which students often confuse.
provenance: subject-knowledge
syllabus: ['1.5']
page: /topics/growth-and-evolution/
items:
  - id: mumbai-own
    label: Open company-owned restaurants in Mumbai
    detail: The same menu in a new city.
    answer: market-development
    explanation: An existing product taken to a new market (a new city). Organic growth is the method; market development is the direction.
  - id: franchise
    label: Franchise Marigold in Mumbai and Bengaluru
    detail: The same menu, run by franchisees in new cities.
    answer: market-development
    explanation: >
      Franchising is a method of growth, not a direction. The direction is still an existing product in new markets.
      Placing "franchising" in the matrix as if it were a strategy is a common error.
  - id: malls
    label: Open in malls through a joint venture
    detail: The same menu, for mall shoppers in three cities.
    answer: market-development
    explanation: New cities and a new kind of customer, the mall shopper, for the existing product. The joint venture is the method.
  - id: tiffin
    label: Buy Tiffin Lane and convert its restaurants
    detail: Rival restaurants in Pune and Mumbai, converted to Marigold.
    answer: market-penetration
    arguable: [market-development]
    explanation: >
      In Pune, buying a rival raises Marigold's share of a market it already serves: market penetration. The Mumbai
      restaurants add market development, so the acquisition does both. Say which part your argument is about.
  - id: offices
    label: A weekday lunch service for offices
    detail: Lunches from the existing kitchens, delivered on subscription.
    answer: product-development
    arguable: [market-development, diversification]
    explanation: >
      It depends on what you treat as new. If the delivered subscription is a new product for Marigold's existing
      customers, it is product development. If offices are a new market for food Marigold already sells, it is market
      development. If both are new, it is related diversification. Any of the three can be argued; the argument has to
      say which.
  - id: spices
    label: Packaged spice blends in supermarkets
    detail: Marigold's spice mixes sold in shops.
    answer: diversification
    arguable: [product-development]
    explanation: A new product (a packaged good) in a new market (supermarket shoppers), so diversification, though related to what Marigold knows. Some would argue product development if the buyers are mainly existing customers.
  - id: loyalty
    label: A loyalty card for Pune customers
    detail: A free dessert after ten visits.
    answer: market-penetration
    explanation: More sales of the existing product to the existing market. This is the lowest-risk direction in the matrix.
  - id: dubai
    label: A restaurant in Dubai
    detail: The same menu for a new country.
    answer: market-development
    explanation: An existing product in a new, international market. The risk is higher than a new Indian city because the market is less familiar.

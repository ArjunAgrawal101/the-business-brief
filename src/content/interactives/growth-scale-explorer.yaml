component: scale-explorer
title: Average cost and the size of the chain
purpose: >
  The learner changes the number of restaurants in a company-owned chain and sees the average cost of a meal broken
  into its parts. It shows purchasing economies and the spreading of central costs lowering average cost, and
  coordination costs raising it once the chain outgrows its management, so that the U shape is explained rather than
  memorized.
provenance: simulated-data
mealsPerOutlet: 60000
foodPerMealAt4: 128
purchasingSavingPerDoubling: 0.03
outletFixedPerOutlet: 12
centralBase: 3
centralPerOutlet: 0.375
coordinationThreshold: 8
coordinationFactor: 0.12
maxOutlets: 24
currency: '₹'
marks:
  - { outlets: 4, label: Marigold today }
  - { outlets: 8, label: After organic growth }
  - { outlets: 10, label: After the acquisition }

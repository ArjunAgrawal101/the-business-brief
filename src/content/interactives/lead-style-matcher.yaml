component: style-matcher
title: Match the style to the situation
purpose: >
  For each workplace situation the learner chooses the leadership style that fits best and sees whether it is a
  strong fit, a defensible one or a weak one, with the reason. Choosing a different style for each situation is
  itself situational leadership. It diagnoses the belief that one style is best everywhere.
provenance: subject-knowledge
syllabus: ['2.3']
page: /topics/leadership-and-management/
scenarios:
  - id: fire
    situation: A fire alarm sounds during the night shift, and some pickers are unsure which exit to use.
    strong: [autocratic]
    explanation: In an emergency there is no time to consult. Clear, immediate direction keeps people safe, which is why even democratic leaders are directive in a crisis.
  - id: experts
    situation: Six pickers with an average of nine years' service want to redesign the layout of their own zone.
    strong: [laissez-faire, democratic]
    explanation: Experienced, motivated people who know the work best can be given the decision (laissez-faire) or consulted on it (democratic). Directing them would waste their knowledge and their goodwill.
  - id: newstarters
    situation: Twenty seasonal staff start on Monday with no warehouse experience, two weeks before peak.
    strong: [autocratic]
    defensible: [paternalistic]
    explanation: People new to a task need clear instructions and close supervision. A protective, welcoming manner can help them settle, as long as the instructions are clear.
  - id: family
    situation: In a family-owned bakery, long-serving staff expect the owner to make the decisions and to look after them in hard times.
    strong: [paternalistic]
    defensible: [democratic]
    explanation: The culture and the staff's expectations fit a paternalistic style, which is how the founder of Halden led. It works while decisions stay simple and the owner is trusted; it does not build independence.
  - id: designers
    situation: A design team must choose one of three packaging concepts, and each designer will have to defend the choice to clients.
    strong: [democratic]
    defensible: [laissez-faire]
    explanation: Each member has expertise and will have to defend the result, so involving them improves the decision and their commitment to it.
  - id: newsystem
    situation: Shop staff must start using a new till system next month. Several are anxious and none has used it.
    strong: [democratic]
    defensible: [autocratic]
    explanation: Involving staff in how the change is introduced reduces resistance and finds problems early. The training itself still needs clear direction.
  - id: integrity
    situation: A manager discovers that a supplier has been paying a member of staff to place extra orders.
    strong: [autocratic]
    explanation: A breach of integrity calls for decisive action by the leader, following the organization's policy. It is not a matter for consultation or for the team to settle.
  - id: researchers
    situation: Senior engineers, each the expert in their own field, are working on a product with a deadline eighteen months away.
    strong: [laissez-faire]
    defensible: [democratic]
    explanation: Experts with a long horizon do their best work with autonomy. The leader's role is to secure resources and remove obstacles, not to direct.

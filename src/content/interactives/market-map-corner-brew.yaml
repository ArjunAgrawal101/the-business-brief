# Market Studio: the competitor positioning map. The six fictional coffee
# brands and their positions are those of the position-map diagram in the 4.2
# notes (src/lib/figures/unit4.ts), on a scale of 0 to 10.
component: competitor-map
title: Competitor positioning map
purpose: >
  The learner chooses the two attributes on the axes, names the ends of each, enters their own business and its
  rivals with customers' average ratings, and sees the map redrawn with the open spaces outlined, the empty parts
  of the map named, rivals that compete head to head and the nearest rival. A four-question gap test turns an open
  space into a judgement. It diagnoses treating every gap as an opportunity and a position map as facts about
  products rather than perceptions of them.
provenance: simulated-data
syllabus: ['4.2']
page: /market-studio/positioning-map/
guide:
  lead: >
    Plot your business and its rivals as customers see them, on the two attributes that matter in your market. The
    map outlines the open spaces, names the rivals you compete with head to head, and asks the four questions that
    decide whether a gap is a market or empty for a good reason.
  use:
    - Name the attribute across and the attribute up, and say what a low and a high score mean on each.
    - Add your business and its rivals with the average rating customers give each, from research, on the chosen scale.
    - Read the open spaces and the empty parts of the map, and the rivals closest to you.
    - Answer the four questions of the gap test for the space you are considering, and note the evidence you would need.
  limits:
    - The map shows how one sample of customers sees the sellers, not facts about them. Another sample, or other attributes, would give another map.
    - Two attributes cannot show everything customers weigh.
    - The open spaces are found by geometry. The largest circle that fits between the points is not the largest market.
  status: syllabus
  serves:
    - { code: '4.2', statement: 'Segmentation, targeting and positioning, including position maps' }
    - { code: '4.2', statement: How organizations differentiate themselves and their products from competitors }
  beyond:
    - Finding open spaces by the largest circles that fit between the sellers is the platform's method for drawing attention to gaps; the guide asks you to construct and read the map, not to compute gaps.
  related:
    - { label: 'Positioning and position maps in the 4.2 notes', href: /topics/marketing-planning/#positioning-and-position-maps }
    - { label: Gap in the market, href: /glossary/gap-in-the-market/ }
    - { label: The position map diagram, href: /diagrams/#diagram-position-map }
  terms: [position-map, positioning, gap-in-the-market, differentiation, unique-selling-point]
  example: >
    The six fictional coffee brands of the 4.2 notes' position-map diagram, placed by a simulated survey of customers
    on price and perceived quality. Corner Brew sits below the average price with quality rated a little above
    average, the nearest brand to a possible gap: good quality at a modest price.
  exampleTitle: "Six coffee brands, as customers see them"
state:
  market: Coffee within a ten-minute walk of Corner Brew
  scale: '0-10'
  x: { label: Price, low: Low price, high: High price }
  y: { label: Perceived quality, low: Low perceived quality, high: High perceived quality }
  focus: cornerbrew
  brands:
    - { id: kettle, name: Kettle Lane, x: 8, y: 8.4, note: Speciality roaster with a café in the high street }
    - { id: daybreak, name: Daybreak, x: 3, y: 3.2, note: Chain café on the same street }
    - { id: harbour, name: Harbour Roast, x: 6.4, y: 6.8 }
    - { id: quickcup, name: Quickcup, x: 1.6, y: 1.8, note: National chain of drive-through kiosks }
    - { id: saltmarsh, name: Saltmarsh, x: 7.6, y: 3.4, note: High prices for quality customers rate low }
    - { id: cornerbrew, name: Corner Brew, x: 4, y: 5.9, note: Roasts its own beans on the premises every morning }
  test:
    demand: unsure
    deliver: yes
    fit: yes
    rivals: unsure
    note: >-
      The space Corner Brew is considering is good quality at a modest price. Question 6 of the afternoon study
      survey tests what students would pay. Roasting on site keeps the coffee fresh, but a chain could cut its prices
      quickly.

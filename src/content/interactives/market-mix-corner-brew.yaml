# Market Studio: the marketing mix builder. Corner Brew's study-hours offer
# from the 4.2 notes, built as a service with all seven Ps. The one check it
# raises (a distinctive product priced below rivals) is the risk the notes'
# plan names: students come in but revenue does not.
component: mix-builder
title: Marketing mix builder
purpose: >
  The learner builds a marketing mix for a target segment and a position: the four Ps for a good, or the seven Ps
  for a service, each with structured choices and a description. Rules check every element against the target, the
  position and the other Ps, and a table shows where the mix holds together and where it does not. It diagnoses
  treating the Ps as a list rather than a mix, such as a premium price with discount distribution, or a service
  planned without its people, processes and physical evidence.
provenance: simulated-data
syllabus: ['4.5']
page: /market-studio/marketing-mix/
guide:
  lead: >
    A marketing mix works when every P fits the customers it is for, the position the business wants, and every
    other P. Build the mix for a good or a service, and the checks show which choices support each other and which
    pull against each other.
  use:
    - Say what the offer is, whether it is a good or a service, who it is for and how sensitive they are to price, and the position you want.
    - For each P, make the structured choices and describe the decision in your own words.
    - Read the consistency table, then the checks. A problem means two choices contradict each other; a check means a choice needs a reason.
    - Change one choice at a time and watch which links break or hold. Export the mix when it is coherent.
  limits:
    - The rules check consistency between choices, not whether the mix will sell. A coherent mix can still be the wrong one.
    - Each P is reduced to a few choices so the rules can read them. The description is where the real decision lives.
    - Rules cannot see the business's costs, rivals or brand history, which decide many real choices.
  status: syllabus
  serves:
    - { code: '4.5', statement: Appropriate marketing mixes for particular products or businesses }
    - { code: '4.5', statement: 'Price: cost-plus (mark-up), penetration, loss leader, predatory and premium pricing' }
    - { code: '4.5', statement: 'Price: dynamic, competitive and contribution pricing, and price elasticity of demand' }
    - { code: '4.5', statement: 'Promotion: above, below and through the line' }
    - { code: '4.5', statement: 'Place: the importance of different types of distribution channel' }
    - { code: '4.5', statement: 'People: employee and customer relationships in marketing a service, and how they vary between cultures' }
    - { code: '4.5', statement: 'Processes: delivery processes in marketing a service, and changes in them' }
    - { code: '4.5', statement: 'Physical evidence: tangible evidence in marketing a service' }
  beyond:
    - The consistency rules are the platform's teaching method, built on the four tests in the 4.5 notes; they are not a list from the guide.
    - Dynamic, competitive and contribution pricing are HL only in the guide, and are marked HL where you choose them.
  related:
    - { label: 'Choosing an appropriate marketing mix (4.5 notes)', href: /topics/the-seven-ps-of-the-marketing-mix/#appropriate-marketing-mix }
    - { label: Pricing methods, href: /topics/the-seven-ps-of-the-marketing-mix/#pricing-methods }
    - { label: 'People, processes and physical evidence', href: /topics/the-seven-ps-of-the-marketing-mix/#service-ps }
    - { label: The seven Ps diagram, href: /diagrams/#diagram-seven-ps }
  terms: [marketing-mix, penetration-pricing, premium-pricing, below-the-line-promotion, distribution-channel, people-marketing-mix, processes-marketing-mix, physical-evidence]
  example: >
    Corner Brew's study-hours offer from the 4.2 notes: refillable filter coffee from 2 to 5 p.m. on weekdays for
    students from the college nearby. A café is a service, so all seven Ps apply. The prices are fictional.
  exampleTitle: "Corner Brew's study-hours offer"
state:
  business: Corner Brew
  offer: Study hours, weekday afternoons from 2 to 5 p.m.
  kind: service
  target: { name: College students who study after classes, sensitivity: high, size: niche }
  position: mid
  product:
    quality: distinctive
    range: wide
    text: Refillable filter coffee from 2 to 5 p.m. on weekdays, made from beans roasted on the premises that morning, with quiet study tables.
  price:
    method: penetration
    level: below
    text: One fixed price of $3.50 for refills all afternoon, less than two drinks at the chain on the same street. Reviewed after three months if it brings students in but not revenue.
  promotion:
    line: below
    text: Posts on the college's student pages, posters on campus noticeboards, a sampling stall at the college gate and a loyalty stamp card.
  place:
    channel: direct
    coverage: exclusive
    text: One café, a ten-minute walk from the college.
  people:
    service: personal
    text: Baristas who know regulars by name and can explain each coffee, briefed that study-hours guests are welcome to stay.
  processes:
    style: assisted
    text: Order once at the counter; refills brought to the table on request; the wi-fi code printed on the receipt.
  physical:
    standard: functional
    text: A power socket at every study table, quiet tables at the back, and the roasting date printed on every cup.

component: functions-sorter
title: Sort the manager's week into the functions of management
purpose: >
  The learner assigns each of a manager's activities to one of the classic functions of management, then sees the
  answer and its reason. It makes an abstract list concrete, and shows that most management work combines more than
  one function.
provenance: source-derived
items:
  - id: target
    activity: "Setting next year's target of 97% on-time dispatch and deciding how to reach it"
    answer: planning
    explanation: Deciding objectives, and how to achieve them, in advance is planning.
  - id: zones
    activity: Deciding which team leader is responsible for which zone, and who reports to whom
    answer: organizing
    explanation: Arranging people and resources into a structure is organizing.
  - id: instructions
    activity: Giving the night shift clear instructions for the peak season
    answer: commanding
    explanation: Directing people in their work is what the classic list calls commanding. Today it is usually called directing, or leading.
  - id: handover
    activity: Making sure the day and night shifts hand over orders and equipment without gaps
    answer: coordinating
    explanation: Making the parts of the organization work together is coordinating.
  - id: review
    activity: "Comparing each week's dispatch rate with the target and acting on the gap"
    answer: controlling
    explanation: Measuring performance against the plan and correcting it is controlling.
  - id: budget
    activity: Drawing up the budget for training on the new system
    answer: planning
    explanation: A budget is a plan expressed in money.
  - id: trainer
    activity: Creating a new role of system trainer and appointing someone to it
    answer: organizing
    explanation: Creating roles and filling them is part of organizing.
  - id: trucks
    activity: Agreeing with the transport company that trucks arrive when the orders are ready
    answer: coordinating
    explanation: Aligning the warehouse's work with a partner outside it is coordinating.
  - id: errors
    activity: Checking error rates by zone and retraining the zone with the most errors
    answer: controlling
    explanation: Measuring results and correcting the cause of a problem is controlling.
  - id: scanner
    activity: Showing a picker exactly how to use the scanner on a difficult order
    answer: commanding
    explanation: Instructing an employee directly in the work is commanding, now usually called directing.

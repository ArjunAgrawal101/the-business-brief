component: force-field-builder
title: Forces for and against the new system on the night shift
purpose: >
  The learner weighs the forces for and against the night shift using the new warehouse system as designed, then
  decides which restraining force a leader could weaken. It connects force field analysis to leading change: most of
  the restraining forces here are leadership problems, not technical ones.
provenance: simulated-data
change: The night shift uses the new warehouse system as designed
driving:
  - { label: "The client's deadline of 97% on-time dispatch", strength: 5 }
  - { label: Accurate pick lists when the system works, strength: 3 }
  - { label: "The day shift's success with the system", strength: 3 }
  - { label: Training available from the supplier at no extra cost, strength: 3 }
restraining:
  - { label: Two hours of training per person, strength: 4 }
  - { label: Scanners going flat by 3 a.m. under the charging rota, strength: 4 }
  - { label: Staff not consulted when the system was introduced, strength: 4 }
  - { label: New team leaders with no experience of the system, strength: 3 }
caution: >
  The totals summarize your judgement; they do not measure the forces. Notice which restraining forces a leader can
  weaken quickly (training, the charging rota, consultation) and which need time (team leaders' experience).

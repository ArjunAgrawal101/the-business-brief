component: force-field-builder
title: Forces for and against franchising
purpose: >
  The learner weighs the forces driving and restraining a change from 1 to 5, sees the totals, and is asked which
  restraining force could be weakened. It diagnoses treating the totals as a measurement, rather than a summary of
  the learner's own judgement.
provenance: simulated-data
change: Marigold Kitchens franchises twelve restaurants in two years
driving:
  - { label: Forty-one people have asked for a franchise, strength: 3 }
  - { label: Fast reach into new cities, strength: 4 }
  - { label: Little capital needed from Marigold, strength: 4 }
  - { label: Royalties without running the restaurants, strength: 3 }
restraining:
  - { label: "The founder's insistence on the quality of the food", strength: 5 }
  - { label: Only four inquirers can fund a restaurant, strength: 4 }
  - { label: Less control over the kitchens, strength: 4 }
  - { label: One bad franchise damages the brand everywhere, strength: 3 }
caution: >
  The totals add up your own judgements; they do not measure anything. The useful output of a force field analysis is
  the question it leaves you with: which restraining force could be weakened, how, and at what cost?

    - { id: stall, name: Sampling stall at the college gate, line: below, role: conversion, cost: 600, start: 3, end: 4 }
    - { id: leaflets, name: Leaflets to flats near the college, line: below, role: awareness, cost: 250, start: 3, end: 3 }
    - { id: stamps, name: 'Loyalty stamp card: every sixth refill free', line: below, role: loyalty, cost: 150, start: 3, end: 26 }
  tasks:
    - { id: sockets, name: Fit a power socket at every study table, cost: 1050, start: 1, end: 2 }
    - { id: brief, name: Brief staff on the study-hours welcome, cost: 0, start: 2, end: 2 }
    - { id: price, name: Review the refill price, cost: 0, start: 13, end: 13 }
  kpis:

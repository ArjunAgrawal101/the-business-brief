# Market Studio: the customer persona creator. Lena is a fictional student,
# a typical member of the segment Corner Brew targets in the STP planner. The
# interviews behind her are simulated.
component: persona-creator
title: Customer persona creator
purpose: >
  The learner builds a structured portrait of one typical customer in a target segment: profile, needs, pains,
  buying behaviour, channels, objections and what would win them, with the evidence behind it. Checks flag a
  persona with no segment, too few needs or pains, no channel the customer uses a lot, or no research behind it. It
  diagnoses mistaking a persona built on assumptions for evidence about customers.
provenance: enrichment
syllabus: ['4.2', '4.4']
page: /market-studio/customer-persona/
guide:
  lead: >
    A segment is a set of numbers; a persona is one person the team can picture. Build a portrait of a typical
    customer in your target segment, with what they need, what frustrates them and where they can be reached, and
    keep the evidence beside it, so the portrait stays honest.
  use:
    - Name the segment the persona belongs to, ideally one you chose as a target in the STP planner.
    - Write the profile and a short quote in the customer's own voice.
    - List needs, pains and buying habits one per line, then the channels they use and how much.
    - Record what might stop them buying and what would win them, and say what research the persona rests on. Print the card or download it as text.
  limits:
    - A persona describes a typical customer, not every customer. Check decisions against the segment's data as well.
    - Built from assumptions, a persona is a stereotype with a name. It needs interviews or survey data behind it.
    - Customers change. Review the persona when new research comes in.
  status: enrichment
  serves:
    - { code: '4.2', statement: 'Segmentation, targeting and positioning, including position maps' }
    - { code: '4.4', statement: 'Primary research: surveys, interviews, focus groups and observations' }
  beyond:
    - Customer personas are a practitioners' tool, not named in the IB guide. They are enrichment that helps apply targeting (4.2) and research (4.4).
  related:
    - { label: 'Targeting in the 4.2 notes', href: /topics/marketing-planning/#targeting-niche-and-mass }
    - { label: '4.4 Market research', href: /topics/market-research/ }
    - { label: Target market, href: /glossary/target-market/ }
  terms: [target-market, market-segmentation, primary-research, interview, qualitative-research]
  example: >
    Lena is fictional: a typical member of the college students Corner Brew targets in the STP planner. The twelve
    interviews behind her are simulated, and her figures match the campaign planner's funnel, where a regular spends
    about $3.50 a visit.
  exampleTitle: "Lena, a student Corner Brew wants to win"
state:
  business: Corner Brew
  name: Lena
  age: '19'
  occupation: First-year nursing student at the college
  location: Shares a flat a fifteen-minute walk from the college
  segment: College students who study after classes
  quote: I need somewhere I can sit for three hours without feeling I have to keep buying things.
  background: >-
    Lena has lectures most mornings and a long gap before her evening placement shifts. She studies alone, often
    with video lectures, and moves on when a place gets noisy. She budgets carefully: rent and travel come first.
  needs:
    - A quiet seat with a power socket for two to three hours between lectures
    - Coffee she can afford to keep drinking all afternoon
    - Reliable wi-fi for coursework and video lectures
  pains:
    - The college library is full by 2 p.m.
    - Chain cafés feel rushed and play loud music
    - Buying a drink every hour adds up on a student budget
  behaviour:
    - Studies off campus three afternoons a week
    - Spends about $3 to $4 a visit
    - Trusts classmates' recommendations more than adverts
  channels:
    - { name: The college's student pages, use: high, note: checks them most days }
    - { name: Short-video social media, use: high, note: in breaks between lectures }
    - { name: Classmates' recommendations, use: high }
    - { name: Campus noticeboards, use: medium, note: passes them on the way to lectures }
    - { name: Email newsletters, use: low }
    - { name: Local radio, use: low }
  objections:
    - Worries she will be asked to leave if she stays for hours
    - Not sure the coffee is worth more than the canteen's
  winners:
    - A clear welcome for students who stay from 2 to 5 p.m.
    - One fixed price for refills
    - A socket at every table
  basis: research
  evidence: >-
    Twelve short interviews with students in the café and at the college gate in October (simulated). The
    questionnaire builder's survey would test the picture with a larger sample.

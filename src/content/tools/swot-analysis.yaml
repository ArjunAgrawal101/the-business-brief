name: SWOT analysis
status: complete
classes: [situational]
classSource: tsm
units: [1, 2, 3, 4, 5]
ibStatus: ib-toolkit
level: SL/HL
verification: primary
order: 1
summary: A structured summary of an organization's internal strengths and weaknesses and the external opportunities and threats it faces.
purpose: >
  To summarize the position a decision starts from, so that options can be judged against what the organization does
  well, where it is exposed, and what is changing around it.
whenToUse:
  - At the start of a strategic decision, to organize the evidence before comparing options.
  - To test whether an option builds on strengths or exposes weaknesses.
  - To check that a recommendation deals with the most serious threat.
construct:
  - State the organization and the decision the analysis is for. A SWOT without a decision has no way of judging what matters.
  - List strengths and weaknesses. These are internal, within the organization's control.
  - List opportunities and threats. These are external, outside its control. A STEEPLE analysis can supply them.
  - Support each point with evidence from the case, not with general statements.
  - Rank the points by their importance to the decision, and cut the ones that do not matter.
  - Draw the implication. Which strengths match which opportunities, and where does a threat meet a weakness?
evidence:
  - Internal evidence such as financial results, capabilities, staff, reputation and resources.
  - External evidence such as market trends, competitors, regulation and the economy.
reveals:
  - The position the organization starts from, in one view.
  - Matches between strengths and opportunities, and dangerous combinations of weaknesses and threats.
doesNotReveal:
  - Which option to choose. A SWOT describes a position; it does not decide anything.
  - How important each point is, unless the analyst ranks them.
  - How the position will change. It is a snapshot.
limitations:
  - Lists are often long, vague and unranked, so the one point that matters can be lost among ten that do not.
  - The same factor can be a strength and a weakness at once, such as a founder's close control, and the four boxes hide that.
  - It is subjective. It depends on who writes it and on the evidence they have.
application:
  case: marigold-kitchens
  title: Marigold Kitchens before its growth decision
  body: >
    Strengths: food that customers return for (a rating of 4.6 out of 5, 62% returning visits), four profitable
    restaurants and ₹20m of cash. Weaknesses: quality depends on one head chef's training, and the business has never
    traded outside Pune. Opportunities: forty-one franchise inquiries, a mall operator, a rival for sale, offices that
    want lunches. Threats: rivals in the same cities, Mumbai's costs, and brand damage if growth outruns training.
  result: >
    The analysis shows that Marigold's main strength, its food and its cooks, is the thing most at risk in the
    fastest growth routes. That is the tension the decision has to resolve.
examRelevance: >
  A SWOT helps to organize a case before an extended response, and its quadrants can give an evaluation its structure.
  Credit comes from applying it to the organization and drawing an implication, not from the four headings.
commonErrors:
  - Putting external factors under strengths or weaknesses, such as listing a growing market as a strength.
  - Listing points without evidence from the case.
  - Ending with four lists and no implication for the decision.
topics: [growth-and-evolution]

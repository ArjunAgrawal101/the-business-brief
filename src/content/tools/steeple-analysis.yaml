name: STEEPLE analysis
status: complete
family: strategic
ibStatus: ib-toolkit
level: SL/HL
verification: corroborated
order: 2
summary: An analysis of the external environment under seven headings, social, technological, economic, environmental, political, legal and ethical.
purpose: To scan the external environment systematically, so that the opportunities and threats an organization faces are not missed.
whenToUse:
  - Before entering a new market, city or country.
  - When a change outside the organization may affect a decision.
  - To supply the opportunities and threats of a SWOT analysis.
construct:
  - State the organization, the market and the time horizon.
  - Under each of the seven headings, list the external factors that could affect the organization.
  - Support each factor with evidence.
  - Judge each factor's likely impact, and whether it is an opportunity or a threat for this organization.
  - Select the few factors that matter most for the decision, and develop those.
evidence:
  - Market and economic data, demographic and social trends, and technology developments.
  - Environmental pressures, government policy, laws, and the ethical expectations of customers and society.
reveals:
  - The external factors the organization cannot control but must respond to.
  - How the same environment differs between markets, for example between two cities.
doesNotReveal:
  - Whether the organization can respond. That needs an internal analysis.
  - Which factors matter most, unless the analyst judges it.
limitations:
  - It can become a long list with no priorities.
  - The headings overlap. A new law on packaging is legal, environmental and political at once.
  - The environment changes quickly, so the analysis dates.
application:
  case: marigold-kitchens
  title: The external environment for a Marigold restaurant in Mumbai
  body: >
    This illustration is the platform's own, written for the fictional case. Social: busy office workers eat out at
    lunch, and demand for home-style food is strong. Technological: delivery apps widen reach but take a commission.
    Economic: rents and wages are higher than in Pune. Environmental: pressure to reduce single-use packaging. Political
    and legal: licences and inspections for every new site, and the contract terms of any franchise or joint venture.
    Ethical: fair treatment of franchisees and staff, and sourcing from local farms.
  result: >
    For the organic route, two factors matter most: Mumbai's costs, which delay profit, and delivery apps, which could
    raise sales without a new restaurant.
examRelevance: >
  Useful when a case involves a new market or an external change. Choose the factors that matter: two developed
  points earn more than seven thin ones.
commonErrors:
  - Including internal factors, such as the founder's ambition.
  - Covering all seven headings thinly instead of the two or three that matter.
  - Listing factors without saying whether each is an opportunity or a threat for this organization.
topics: [growth-and-evolution]

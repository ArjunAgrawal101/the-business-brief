name: Ansoff matrix
status: complete
family: strategic
ibStatus: ib-toolkit
level: SL/HL
verification: corroborated
order: 3
summary: A two-by-two matrix of growth directions, existing or new products in existing or new markets, with the risk each direction usually carries.
purpose: To classify the direction of a growth option and the level of risk that usually comes with it.
whenToUse:
  - When comparing growth options.
  - To show how far an option takes the business from the products and customers it knows.
construct:
  - Draw a two-by-two grid, with products (existing, new) across the top and markets (existing, new) down the side.
  - Label the cells. Market penetration is existing products in existing markets; product development is new products in existing markets; market development is existing products in new markets; diversification is new products in new markets.
  - Place each option in a cell, with a reason that says what counts as new.
  - Note the usual risk, which rises from market penetration to diversification.
  - Use the placement to discuss what the business would need in order to succeed.
evidence:
  - What the business sells now, and to whom.
  - What each option would sell, and to whom.
reveals:
  - How far an option takes the business from its existing knowledge of products and customers.
  - The level of risk usually associated with that distance.
doesNotReveal:
  - How to grow. Franchising, a joint venture and an acquisition are methods, and any of them can serve any direction.
  - Whether the option is profitable or affordable.
limitations:
  - Real options rarely fit one cell neatly, so the placement needs an argument.
  - Risk depends on the business's capabilities, not only on the cell.
  - It ignores how competitors will respond.
application:
  case: marigold-kitchens
  title: Marigold's routes on the matrix
  body: >
    Most of Marigold's options are market development: the same food in new places. Buying Tiffin Lane is partly
    market penetration, because it raises Marigold's share in Pune. The office lunch service can be argued as product
    development, market development or related diversification, depending on what you treat as new.
  result: >
    Because four of the five routes are market development, the choice between them is really about method and
    control, not about direction.
examRelevance: >
  A common tool in questions on growth. Credit comes from a placement with a reason, and from using the matrix's logic
  of risk in the evaluation.
commonErrors:
  - Placing a method, such as franchising, in the matrix as if it were a direction.
  - Treating the risk ranking as a rule rather than a tendency.
  - Placing an option without explaining why the product or the market counts as new.

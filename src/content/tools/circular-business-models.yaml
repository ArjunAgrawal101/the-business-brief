name: "Circular business models"
status: complete
classes: [planning, decision-making]
classSource: platform
units: [1, 5]
includes:
  - Circular supply models
  - Resource recovery models
  - Product life extension models
  - Sharing models
  - Product service system models
ibStatus: ib-toolkit
level: SL/HL
verification: primary
order: 8
summary: "Ways of designing a business so that products and materials are kept in use for longer, through reuse, repair, sharing and recycling."
purpose: >
  To find ways for a business to create and capture value while keeping products and materials in use, and to
  judge which circular model suits it, putting the key concept of sustainability into practice.
whenToUse:
  - "When a business wants to cut waste, material costs or its environmental impact without losing profit."
  - "When designing a new business or product, to build circularity in from the start."
  - "When evaluating a social enterprise, or any strategy, against the triple bottom line."
construct:
  - "Map the flow of the business's products and materials, from its inputs to what happens after use."
  - "Check each of the guide's five models in turn: circular supply, resource recovery, product life extension, sharing, and product service systems."
  - "For each model that could apply, describe how it would earn money, not only how it would save resources."
  - "Estimate its effect on costs, revenues and customers, and the capabilities and partners it would need."
  - "Evaluate the options against people, planet and profit, and the risks of each."
evidence:
  - "Data on the materials used, the products sold and what happens to them after use."
  - "Costs and prices for recovered, repaired or shared products, and customers' willingness to pay."
  - "The views of stakeholders such as customers, suppliers and funders."
reveals:
  - "Where value is lost as waste, and which models could capture it."
  - "How a circular model changes the source of revenue and the capabilities a business needs."
doesNotReveal:
  - "Whether customers will accept a new model, such as paying for use instead of ownership."
  - "The full environmental effect, which needs a life cycle assessment."
limitations:
  - "Changing a business model takes investment, time and new capabilities."
  - "Some circular models depend on a steady supply of used products, which the business does not control."
  - "Environmental gains can be offset if cheaper reused goods raise total consumption."
application:
  case: patchwork-digital
  title: Patchwork Digital, circular by design
  body: >
    Patchwork collects laptops that companies, councils and universities no longer need. In 2025 it collected
    6,000 devices, and donors paid £12 for each to have its data destroyed (Exhibit 2). It refurbished 2,400 for
    schools at £60 and 900 for sale online at £180, a product life extension model, and stripped 2,700 for parts
    and recycling at £10 each, a resource recovery model. These four streams brought in £405k of its £525k income;
    the rest was grants (Exhibit 1).
  result: >
    The circular models are not a side line but the whole business: every stream of earned income comes from
    keeping devices or their materials in use. The analysis also shows where growth must come from, more donated
    devices, which the bank contract would supply, and the trade the model faces: selling more laptops online
    earns more but sends fewer to pupils, which works against the enterprise's social purpose.
examRelevance: >
  Circular business models are a toolkit tool for units 1 and 5 and connect directly with the key concept of
  sustainability. Questions may ask which model a business uses, or whether adopting one is a good strategy. Name
  the model precisely, explain how it earns money, and evaluate it against all three parts of the triple bottom
  line.
commonErrors:
  - "Calling any recycling a circular business model without explaining how the business earns from it."
  - "Confusing the models, such as product life extension (repairing and reselling) with resource recovery (recovering materials from waste)."
  - "Evaluating only the environmental benefits and ignoring costs, customers and capabilities."

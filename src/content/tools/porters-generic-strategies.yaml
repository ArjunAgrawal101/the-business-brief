name: "Porter's generic strategies"
status: complete
classes: [decision-making]
classSource: platform
units: [1, 4]
ibStatus: ib-toolkit
level: HL
verification: primary
order: 12
summary: "Three broad ways to compete: cost leadership, differentiation, and focus on a narrow segment."
purpose: >
  To choose, or test, the basis on which a business competes, lower cost or differentiation, and how broadly,
  across the market or in a niche, so that its decisions on price, product and operations support one clear
  advantage.
whenToUse:
  - "When setting or reviewing the competitive strategy of a business or a product."
  - "When a business seems to have no clear advantage over its rivals."
  - "When judging whether a marketing mix fits the strategy it claims to follow."
construct:
  - "Identify the market and the main competitors of the product or business."
  - "Decide the scope: the whole market, or a segment with distinct needs."
  - "Decide the source of advantage: lower costs than rivals, or a difference customers will pay for."
  - "Place the business in one of the four positions: cost leadership, differentiation, cost focus or differentiation focus."
  - "Check that its prices, products, operations and promotion support that position, and look for signs of being stuck in the middle."
evidence:
  - "Prices and costs compared with competitors', and market shares."
  - "What customers value and will pay more for, from market research."
  - "The business's capabilities, such as its scale, technology, brand and people."
reveals:
  - "Whether the business has a clear basis for competing, or is stuck in the middle."
  - "How its decisions on price, product and operations should fit together."
doesNotReveal:
  - "How profitable the chosen strategy will be, or how rivals will respond to it."
  - "How to build the advantage, only what it should be."
limitations:
  - "Some businesses combine low cost and differentiation successfully, which the framework treats as risky."
  - "An advantage can be copied, so the chosen strategy has to be defended."
  - "Placing a business is a judgement, especially for one with many products."
application:
  case: tausi-beverages
  title: Tausi Beverages and its cola
  body: >
    Tausi Cola was launched in 2015 to compete on price with the global brands, at KSh 60 for a 500 ml bottle
    (Exhibit 4). Competing on price is a cost strategy, but cost leadership needs the lowest costs, and in 2025
    Tausi Cola's sales in the audited shops were KSh 206m against KSh 3,700m for the largest rival, a relative
    share of 0.06, in a segment that shrank by 2.0% (Exhibit 3). It earned KSh 33m of contribution after marketing
    (Exhibit 1). Mango Nectar and Uji Power compete differently, on real fruit and a family brand, and on fortified
    nutrition for parents: both are forms of differentiation.
  result: >
    The framework suggests that Tausi Cola is stuck in the middle: it competes on price without the scale that
    would give it the lowest costs, against a rival that sells about eighteen times as much. Tausi's advantages lie
    in its differentiated products, which supports putting the reserve, and perhaps the cola's bottling line, behind
    them. The BCG matrix of the same portfolio reaches the same judgement by another route.
examRelevance: >
  At HL, the generic strategies are a toolkit tool for units 1 and 4. Questions may ask which strategy a business
  follows, or whether a change of strategy is wise. Identify both the scope and the source of advantage with
  evidence from the case, distinguish a low price from low costs, and evaluate the risks of the strategy.
commonErrors:
  - "Equating cost leadership with charging the lowest price."
  - "Naming a strategy without evidence of the business's costs or of what its customers value."
  - "Ignoring the risk of being stuck in the middle, or treating it as certain failure."

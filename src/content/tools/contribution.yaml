name: Contribution
status: complete
family: quantitative
ibStatus: ib-toolkit
level: HL
verification: corroborated
verificationNote: Listed as HL only by secondary sources (claims register, toolkit-hl-tools). Check against the Guide.
order: 13
summary: The use of contribution per unit and total contribution to make decisions, such as whether to accept a special order.
purpose: To judge a decision by what it adds to profit, comparing the revenue it brings with the costs it causes.
whenToUse:
  - Deciding whether to accept an order at a lower price than usual.
  - Comparing products, to decide which to promote or drop.
  - Deciding whether to make a component or buy it in.
construct:
  - Identify the variable cost per unit of what the decision involves.
  - Calculate contribution per unit, the price minus the variable cost per unit.
  - Multiply by the quantity to find the total contribution.
  - Subtract any fixed costs caused only by the decision.
  - Check the conditions. Is there spare capacity? Will regular sales or prices be affected? Is there a better use for the capacity?
evidence:
  - Variable cost per unit, from the cost ledger.
  - The price and quantity of the order or product.
  - Capacity and regular sales in the period concerned.
reveals:
  - Whether a decision adds to profit in the short run.
  - Why an order priced below average cost can still be worth taking.
doesNotReveal:
  - The long-run effects on the price position and on regular customers.
  - The opportunity cost of the capacity used, unless it is included.
limitations:
  - It is a short-run tool. In the long run every cost has to be covered.
  - It depends on separating fixed and variable costs correctly.
  - It assumes the decision does not change what regular customers pay or buy.
application:
  case: atelier-barro
  title: The hotel's order for 300 mugs at €11
  body: >
    Each hotel mug has a variable cost of €5.85, so it contributes €5.15. Three hundred contribute €1,545, and after the
    €150 stamp the order adds (€11.00 − €5.85) × 300 − €150 = €1,395 to November's profit.
  result: On contribution, accept. The owner's judgement about the brand decides whether she should.
examRelevance: >
  At HL, contribution questions ask for the calculation and for a recommendation that weighs the non-financial
  factors alongside it.
commonErrors:
  - Rejecting an order because its price is below the average total cost of a unit.
  - Forgetting costs caused only by the order, such as the custom stamp.
  - Ignoring capacity. In a full month the order would displace sales at the full price.

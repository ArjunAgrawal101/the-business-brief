name: "Critical path analysis"
status: complete
classes: [planning]
classSource: tsm
units: [4, 5]
includes:
  - Completing and analysing a critical path diagram (drawing one is not expected)
  - Identifying the critical path
  - Calculating free and total float
ibStatus: ib-toolkit
level: HL
verification: primary
order: 14
summary: "A network of a project's tasks and their dependencies, used to find the shortest possible duration and the tasks that cannot be delayed."
purpose: >
  To plan a project so that its shortest possible duration is known, the activities that cannot slip are
  identified, and the flexibility in the others, their float, is used well.
whenToUse:
  - "When a project has many activities, some of which cannot start until others finish."
  - "When a deadline is fixed and the business must know whether it can be met, and what would put it at risk."
  - "When deciding where to move people and equipment, or what to do if an activity runs late."
construct:
  - "List the activities, their durations and the activities each one depends on."
  - "Complete the forward pass: the earliest start time at each node is the largest total of the durations on the paths that lead to it."
  - "Complete the backward pass from the final node: the latest finish time at each node is the smallest result of subtracting the durations that follow it."
  - "Find the critical path: the chain of activities with no total float, whose durations add up to the length of the project."
  - "Calculate the total float of each other activity (latest finish − duration − earliest start) and its free float (the earliest start of the next activity − duration − earliest start)."
  - "Interpret the result: which activities to watch, where resources can move, and what a delay would do."
evidence:
  - "A list of the activities, with realistic estimates of their durations."
  - "The dependencies between them, ideally from the people who will do the work."
  - "The deadline, and any limits on people or equipment."
reveals:
  - "The minimum time the project can take, and whether a deadline can be met."
  - "The critical activities, where any delay delays the whole project."
  - "The float on the other activities, where there is room to move resources or absorb a delay."
doesNotReveal:
  - "How reliable the estimates of duration are; the critical path changes if they are wrong."
  - "The cost of each activity or the people it needs, unless these are added."
limitations:
  - "Estimates of duration are uncertain, especially for new kinds of work."
  - "Large networks are complex and need software to manage."
  - "It assumes an activity can start as soon as its predecessors finish, which may not hold when people or equipment are shared."
application:
  case: halden-distribution
  title: Halden Distribution's recovery plan
  body: >
    In the [Halden case lab](/case-room/halden-diagnosis/), the new site manager plans eight activities, in weeks,
    before the client's deadline in week 14: listen to the night shift (1); coach the night team leaders (6, from
    the start); redesign the night pick routes (3, after listening); retrain the night shift (3, after the
    redesign); day-shift buddies (4, after retraining); a pilot in two zones (2, after retraining); roll out and
    review weekly (3, after the pilot and the coaching); and a peak readiness check (1, after the roll-out and the
    buddies). The forward pass gives a project of 13 weeks. The critical path is listening, the redesign,
    retraining, the pilot, the roll-out and the readiness check: 1 + 3 + 3 + 2 + 3 + 1 = 13 weeks. The coaching has
    a total float and a free float of 3 weeks; the buddies have 1 week of each.
  result: >
    The plan meets the deadline with one week to spare, and the analysis shows how fragile that week is:
    retraining is on the critical path, so if it took 5 weeks instead of 3 the plan would take 15 weeks and miss
    the deadline. The coaching could start up to three weeks late without delaying anything, which gives the
    manager room in her first weeks for listening.
examRelevance: >
  At HL, paper 2 can ask for a critical path network to be completed, though not drawn, for the critical path to
  be identified and for total and free float to be calculated, and then for the results to be interpreted. Show
  every earliest start and latest finish time, state the critical path and its length, and explain what the float
  means for the project.
commonErrors:
  - "Taking the smallest rather than the largest total at a node where two paths meet in the forward pass."
  - "Confusing total float with free float."
  - "Calling the activities with the longest durations the critical path, instead of the longest chain of dependent activities."

name: "Business plan"
status: complete
classes: [planning]
classSource: tsm
units: [1, 2, 3, 4, 5]
ibStatus: ib-toolkit
level: SL/HL
verification: primary
order: 5
summary: "A document that sets out a business idea, its market, its operations and its finances, used to plan and to raise finance."
purpose: >
  To test whether a new business or project can work before money is committed, and to persuade the people whose
  support it needs, such as lenders, investors, partners or a board.
whenToUse:
  - "Before starting a business or launching a major project, to check the idea from every side."
  - "When asking for finance from a bank, investors, a crowd or a grant-giver."
  - "As a reference for monitoring progress once the business or project is under way."
construct:
  - "Describe the business: its aims and objectives, its legal form, its owners and the people who will run it."
  - "Set out the market: the customers, the evidence of demand from research, and the competition."
  - "Explain the marketing and operations plans that will deliver the offer."
  - "Build the financial plan: start-up costs, sources of finance, a sales forecast, a cash flow forecast, break-even and a profit forecast, with every assumption stated."
  - "Identify the main risks and the contingency plan for each."
  - "Write the executive summary last: the opportunity, the plan and what is being asked for, on one page."
evidence:
  - "Market research on customers, demand and competitors."
  - "Quotes and estimates for the costs, and evidence for each assumption in the forecasts."
  - "The skills and track record of the people involved."
reveals:
  - "Whether the idea is viable on realistic assumptions, and what it needs to succeed."
  - "How much finance is needed, when, and how it could be repaid or rewarded."
  - "The risks that could sink the plan, and whether there is a response to each."
doesNotReveal:
  - "Whether the forecasts will come true: they are estimates."
  - "How competitors and customers will respond once the business starts."
limitations:
  - "It is only as good as its assumptions, which for a new venture are uncertain."
  - "Writing a full plan takes time, and it dates as conditions change."
  - "A polished plan can give false confidence, especially one written to win finance."
application:
  case: patchwork-digital
  title: Patchwork Digital's case for the bank contract
  body: >
    Patchwork's board must decide whether to accept Clydeport Bank's contract to destroy the data on 9,000
    laptops a year, 4,000 of which it could refurbish. A plan for the decision brings the case's evidence together:
    the opportunity, 3,600 more laptops a year for schools; the operations, a secure room costing £40k to build and
    four technicians who pass the bank's checks; the finances, £473k of extra income and £283k of extra costs, a
    rise of £190k in the yearly surplus (Exhibit 4), against a deficit of £12k in 2025 and reserves of £45k; and the
    risks, a single customer and work its trainees could not do.
  result: >
    Set out this way, the plan shows that the contract would turn a deficit into a surplus and meet the first part
    of Patchwork's mission, laptops for pupils, but adds no traineeships. A plan that commits part of the surplus
    to new traineeships, and says how Patchwork would cope if the contract ended, answers the questions the
    foundation and the board are bound to ask.
examRelevance: >
  The business plan is a toolkit tool for all five units. Questions may ask what a plan should contain, why a
  lender would want one, or how far a plan reduces risk. Link the parts of the plan to the evidence in the case,
  and evaluate its limits, especially how reliable its forecasts are.
commonErrors:
  - "Listing the sections of a plan without applying them to the business in the case."
  - "Treating forecasts as facts rather than estimates resting on stated assumptions."
  - "Forgetting cash flow: a plan that shows a profit but not when the cash arrives can fail its first test."

name: Force field analysis
status: complete
classes: [decision-making]
classSource: platform
units: [2, 5]
ibStatus: ib-toolkit
level: HL
verification: primary
order: 9
summary: A weighing of the forces that drive a change against the forces that restrain it, used to plan how to make the change succeed.
purpose: To judge whether a change is likely to succeed, and to find the restraining forces a manager could weaken.
whenToUse:
  - Before introducing a change in an organization.
  - To plan how to reduce resistance to a change that has stalled.
construct:
  - State the change in the centre.
  - List the driving forces on one side and the restraining forces on the other.
  - Score each force, for example from 1 (weak) to 5 (strong), and support each score with evidence.
  - Total each side.
  - Decide how to strengthen driving forces or, usually more effective, weaken restraining ones.
evidence:
  - Evidence about the people affected, such as their skills, views and interests.
  - Evidence about resources, costs and external pressures.
reveals:
  - Where resistance to a change comes from.
  - Which forces a manager can act on, and which are beyond reach.
doesNotReveal:
  - An objective measurement. The scores are judgements.
  - How long the change will take, or what it will cost.
limitations:
  - The scores are subjective, and the totals give a false impression of precision.
  - Forces interact, so weakening one can strengthen another.
  - It turns a changing situation into a fixed list.
application:
  case: halden-distribution
  title: The new system on Halden's night shift
  body: >
    Driving forces include the client's deadline and the system's accurate pick lists. Restraining forces include two
    hours of training per person, scanners that go flat before the end of the shift, staff who were never consulted, and
    team leaders new to the role.
  result: >
    Three of the four restraining forces (training, the charging rota and consultation) can be weakened within weeks.
    The fourth, the team leaders' inexperience, needs coaching over months.
examRelevance: >
  Useful in questions about change, culture and leadership at HL. Credit comes from evidence for each force and from
  the action the analysis points to.
commonErrors:
  - Treating the totals as the decision.
  - Scoring forces without evidence from the case.
  - Listing forces without saying how the manager could act on them.

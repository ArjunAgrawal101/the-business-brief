# Glossary: unit 3, finance and accounts (subtopics 3.1 to 3.9). Definitions,
# context and examples are the platform's own wording. Scope, HL status, the
# names of the statements and their lines, and every formula were checked
# against the Business management guide (syllabus pp. 28 to 30, statement
# layouts pp. 59 to 63, formulae pp. 64 to 65, discount table p. 66). Where the
# guide gives no formula (depreciation, payback, variances), the standard
# textbook form is used, matching the platform's calculators.
# The 3.3 cost and revenue terms (fixed, variable, semi-variable, direct and
# indirect costs, total cost, total revenue, revenue stream, average cost) are
# in costs.yaml and are reused here, not repeated.

# ---------- 3.1 Introduction to finance ----------
- id: finance-function
  term: Finance function
  aliases: [Finance department, Business finance]
  definition: The part of a business that obtains the money it needs, plans and controls how that money is spent, and records and reports the results in its accounts.
  context: Finance supports every other function, since operations needs money for equipment and materials, marketing for promotion, and human resources for wages and training. The spending it manages falls into two kinds, capital expenditure on assets that last and revenue expenditure on day-to-day running, and each is usually paid for from a different kind of source. A business with strong products can still fail if its finances are poorly controlled.
  example: Before a fictional furniture maker, Oakline, opens a second workshop, its finance team estimates the cost, chooses a mix of a bank loan and retained profit, and checks that cash will not run out while the work is done.
  topics: []
  subtopics: ['3.1']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [capital-expenditure, revenue-expenditure, final-accounts, cash-flow-forecast]

- id: capital-expenditure
  term: Capital expenditure
  aliases: [Capex]
  definition: Money spent on buying or improving assets that will be used in the business for more than a year, such as premises, machinery, vehicles or IT systems.
  context: Capital expenditure is not charged as a cost all at once. The asset is recorded in the statement of financial position, and its cost is spread over the years it is used. It is often confused with revenue expenditure. Because the sums are large and the benefits come over several years, capital spending is usually paid for with long-term finance and judged with investment appraisal first.
  example: A bakery that buys a new oven for $40,000 makes a capital expenditure; the flour it buys each week to use in the oven is revenue expenditure.
  topics: []
  subtopics: ['3.1']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [revenue-expenditure, non-current-assets, investment-appraisal, long-term-finance, investment]

- id: revenue-expenditure
  term: Revenue expenditure
  definition: Spending on the day-to-day running of a business, on items that are used up within the year, such as wages, rent, materials, fuel and repairs.
  context: Revenue expenditure is charged in full as a cost in the statement of profit or loss for the period, so it reduces that period's profit straight away. It keeps the business running at its present level rather than adding to its long-term assets. Repairing a delivery van is revenue expenditure; buying a second van is capital expenditure.
  example: A hair salon's monthly rent, its stylists' wages and its shampoo supplies are revenue expenditure, usually paid for out of sales revenue.
  topics: []
  subtopics: ['3.1']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [capital-expenditure, expenses, statement-of-profit-or-loss, short-term-finance]

- id: investment
  term: Investment
  definition: Spending money now on capital assets or projects, such as machinery, buildings, technology or research, in order to earn returns in the future.
  context: Investment links the three ideas in the 3.7 content statement. It takes cash out at the start, it may lower profit in the early years through set-up costs and depreciation, and it is meant to raise profit and cash inflows later. Because the outlay comes before the returns, even a good investment can cause a cash flow problem if it is not financed properly, which is why investment appraisal and the choice of finance matter.
  example: A fictional cinema chain, Reelhouse, spends $2 million converting its screens to a new projection system, expecting higher ticket sales over the next eight years.
  usage:
    general: In everyday use, investment often means buying shares, property or savings products in the hope of a financial return.
    syllabus: In the course, investment usually means a business spending on capital assets or projects that are expected to bring returns over several years.
  topics: []
  subtopics: ['3.1', '3.7', '3.8']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [capital-expenditure, investment-appraisal, cash-flow, profit]

# ---------- 3.2 Sources of finance ----------
- id: internal-sources-of-finance
  term: Internal sources of finance
  aliases: [Internal finance]
  definition: Money a business raises from within, from the owner's own savings (for a sole trader), from retained profit or from selling assets it no longer needs, rather than from outside lenders or investors.
  context: Internal finance has no interest to pay and gives away no ownership or control, which is why many owners turn to it first. Its limits are size and availability, since a new business has no retained profit, an asset can only be sold once, and personal savings are often small. The guide names three internal sources; every other source in 3.2 is external.
  example: A fictional cycle shop, Spokewise, pays for a repair workshop out of the profit it kept back last year instead of taking a bank loan.
  topics: []
  subtopics: ['3.2']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [external-sources-of-finance, personal-funds, retained-profit, sale-of-assets]

- id: external-sources-of-finance
  term: External sources of finance
  aliases: [External finance]
  definition: Money a business raises from people or organizations outside it, such as shareholders, banks, suppliers, leasing firms, crowdfunders, microfinance providers and business angels.
  context: External finance can supply far larger sums than a business could raise internally, which makes growth and big capital projects possible. It always has a price, whether interest on loans and overdrafts, dividends and a share of ownership for investors, or regular payments for a lease. The right choice depends on how much is needed, for how long, what it costs and how much control the owners are willing to give up.
  example: To open a factory, a fictional snack maker, Crunchwell, combines a five-year bank loan with new shares sold to investors.
  topics: []
  subtopics: ['3.2']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [internal-sources-of-finance, share-capital, loan-capital, overdraft, trade-credit, crowdfunding]

- id: personal-funds
  term: Personal funds
  aliases: [Personal savings, Owner's funds]
  definition: The owner's own savings or other personal money put into the business, usually the first source of finance for a sole trader.
  context: Personal funds cost no interest and keep the owner fully in control, and putting their own money in shows lenders and investors that the owner is committed. The amount is usually limited, and because a sole trader has unlimited liability, the owner risks losing far more than the savings put in. They count as an internal source for a sole trader because the owner and the business are not legally separate.
  example: A fictional dog groomer, Pawfect, starts trading from a van bought with $15,000 of the owner's savings.
  topics: []
  subtopics: ['3.2']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [internal-sources-of-finance, retained-profit, business-angel]

- id: retained-profit
  term: Retained profit
  aliases: [Ploughed-back profit]
  definition: The part of a period's profit that is kept in the business to reinvest rather than paid out to shareholders; in the statement of profit or loss it is the profit for period minus dividends.
  context: Retained profit is the main internal source of finance for an established business, with no interest to pay and no loss of control. It exists only once the business is profitable, and keeping more profit back means paying lower dividends, which shareholders may resist. Each year's retained profit is added to retained earnings, the running total shown under equity in the statement of financial position.
  example: A fictional bookshop chain, Folio, makes a profit for the year of $90,000, pays $30,000 in dividends and keeps $60,000 to refit two shops.
  formula: Retained profit = profit for period − dividends
  topics: []
  subtopics: ['3.2', '3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [internal-sources-of-finance, profit-for-period, dividend, retained-earnings]

- id: sale-of-assets
  term: Sale of assets
  definition: Raising money by selling things the business owns, usually ones it no longer needs, such as surplus land, old equipment or a closed branch.
  context: Selling an unused asset turns it into cash without borrowing or giving away ownership, and it can save the cost of keeping the asset. It is a one-off source, since the asset is gone once sold, and selling in a hurry can mean accepting a low price. A variation is sale and leaseback, in which the business sells an asset it still needs and then rents it back.
  example: A fictional printing firm, Inkwell, sells a warehouse it stopped using after moving to digital printing and uses the cash to buy new presses.
  topics: []
  subtopics: ['3.2']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [internal-sources-of-finance, sale-and-leaseback, non-current-assets]

- id: share-capital
  term: Share capital
  aliases: [Share issue]
  definition: Money a company raises by selling shares, each share being a small part of the ownership of the company; it is shown under equity in the statement of financial position.
  context: Share capital never has to be repaid and carries no interest, so it suits large, long-term and risky projects. The price is ownership, since new shareholders expect dividends and a say in decisions, which dilutes the control of existing owners. Only companies can raise it; a publicly held company can sell shares to the public on a stock exchange, while a privately held company can offer them only to investors it chooses.
  example: A fictional electric scooter maker, Voltra, sells new shares to pay for a second factory, and its founders' stake in the company falls from 80% to 60%.
  topics: []
  subtopics: ['3.2', '3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [external-sources-of-finance, equity, dividend, loan-capital, long-term-finance]

- id: loan-capital
  term: Loan capital
  aliases: [Bank loan]
  definition: Money borrowed for a fixed period, usually from a bank, and repaid in instalments with interest; loans due after more than a year are non-current liabilities.
  context: A loan provides a known sum for a known term without giving away ownership, and the repayments can be planned. Interest must be paid whatever happens to profit, lenders often ask for collateral, and heavy borrowing makes the business riskier (HL students measure this with the gearing ratio). Mortgages, which are secured on property, and debentures, which are long-term borrowing from investors at a set rate, are forms of loan capital.
  example: A fictional dental practice, Brightsmile, borrows $120,000 over seven years to buy new equipment and repays it in monthly instalments with interest.
  topics: []
  subtopics: ['3.2']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [interest, collateral, external-sources-of-finance, non-current-liabilities, gearing-ratio]

- id: overdraft
  term: Overdraft
  aliases: [Bank overdraft]
  definition: An arrangement with a bank that lets a business take more money out of its current account than it has in it, up to an agreed limit.
  context: An overdraft is a flexible short-term source, because interest is charged only on the amount overdrawn and only for as long as it is overdrawn, so it suits gaps between paying suppliers and being paid by customers. Interest rates are usually higher than on loans, and the bank can cut the limit or demand repayment at short notice, so it is risky to rely on one for long-term needs. A bank overdraft is a current liability.
  example: A fictional garden centre, Greenhaven, uses its overdraft in early spring, when it buys plants ahead of the busy season, and clears it by the end of May.
  topics: []
  subtopics: ['3.2', '3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [short-term-finance, current-liabilities, cash-flow-forecast, interest]

- id: trade-credit
  term: Trade credit
  definition: An arrangement in which a supplier lets a business receive goods or services now and pay for them later, often 30 to 90 days after delivery.
  context: Trade credit works like a short-term loan from suppliers, usually with no interest, and it helps cash flow because the goods may be sold before they have to be paid for. Paying late can damage the relationship with the supplier and lose discounts for prompt payment. The amount owed is shown as trade creditors, a current liability; HL students measure how long the business takes to pay with creditor days.
  example: A fictional café, Bean There, receives coffee beans on 30-day credit, so the beans are often sold as coffee before the supplier's invoice is due.
  topics: []
  subtopics: ['3.2', '3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [creditors, short-term-finance, creditor-days, cash-flow]

- id: crowdfunding
  term: Crowdfunding
  definition: Raising money for a business or project from many people, each putting in a modest sum, usually through a website set up for the purpose.
  context: Backers may receive a reward such as an early product, a share of the business (equity crowdfunding) or interest on a loan, or they may simply donate. A campaign can test demand and build a following before launch, and it suits ideas that banks see as too risky. It is uncertain, the platform takes a fee, a failed campaign is public, and the idea is exposed to copycats before it reaches the market.
  example: A fictional board game studio, Meeple Forge, raises $60,000 from 1,500 backers, each of whom will receive a copy of the game when it is made.
  topics: []
  subtopics: ['3.2']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [external-sources-of-finance, business-angel, microfinance-provider]

- id: leasing
  term: Leasing
  aliases: [Lease]
  definition: Paying regular amounts to use an asset, such as a vehicle, machine or building, that is owned by another firm, instead of buying it.
  context: Leasing avoids a large payment at the start, so cash is kept for other needs, and repairs and upgrades are often included. Over the life of the asset it usually costs more than buying outright, and the business does not own the asset at the end unless the agreement gives it the option to buy. It suits assets that wear out or go out of date quickly, such as vehicles and computers.
  example: A fictional courier company, Swiftbox, leases its vans for four years, paying a fixed monthly fee that includes servicing.
  topics: []
  subtopics: ['3.2', '3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [external-sources-of-finance, sale-and-leaseback, capital-expenditure, cash-outflow]

- id: microfinance-provider
  term: Microfinance provider
  aliases: [Microfinance, Microcredit]
  definition: An organization that offers small loans and other financial services to people on low incomes who cannot borrow from ordinary banks, often because they have no credit record or collateral.
  context: Microfinance lets people on low incomes start or grow very small businesses, and it is widely used to reduce poverty in developing economies, often alongside training and support. The loans are small, and interest rates can be high because lending tiny sums is costly to run. It suits sole traders and micro-enterprises, not established companies.
  example: A fictional microfinance provider lends $300 to a tailor in a rural town to buy a sewing machine, and the tailor repays it in small weekly amounts.
  topics: []
  subtopics: ['3.2']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [external-sources-of-finance, crowdfunding, business-angel, collateral]

- id: business-angel
  term: Business angel
  aliases: [Angel investor]
  definition: A wealthy individual who invests their own money in a small or new business, usually in return for a share of the ownership.
  context: Business angels often bring experience, advice and contacts as well as money, and they may invest when banks will not. In return they take part of the ownership, may want a say in decisions and expect a high return, because many start-ups fail. They differ from venture capital firms, which invest larger sums from funds raised from other investors.
  example: A fictional app developer, Tidy, receives $200,000 from a business angel with retail experience in exchange for 20% of the company and a seat on its board.
  topics: []
  subtopics: ['3.2']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [external-sources-of-finance, share-capital, crowdfunding, personal-funds]

- id: short-term-finance
  term: Short-term finance
  aliases: [Short-term sources of finance]
  definition: Finance that is needed for, and usually repaid within, one year, used for day-to-day needs such as buying stock or paying wages before customers pay.
  context: Overdrafts and trade credit are the typical short-term sources, and debt factoring is another. Matching the source to the need matters, since using short-term finance to buy a long-life asset means repaying it before the asset has earned its cost. Short-term borrowing is shown under current liabilities.
  example: A fictional toy shop, Kitekin, uses its overdraft and 60 days of trade credit to stock up for the holiday season, and repays both from December's sales.
  topics: []
  subtopics: ['3.2']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [long-term-finance, overdraft, trade-credit, working-capital, current-liabilities]

- id: long-term-finance
  term: Long-term finance
  aliases: [Long-term sources of finance]
  definition: Finance that is available to the business for more than a year, often for many years, used to pay for capital expenditure and growth.
  context: Share capital, loan capital, retained profit and leasing are the usual long-term sources. Long-term finance matches the long life of non-current assets, so an asset can earn its cost before the money has to be repaid. Choosing among the sources is a trade-off between cost, risk and control, since loans keep ownership but add interest and repayments, while shares need no repayment but dilute control.
  example: A fictional hotel group, Larkspur, pays for a new hotel with a 20-year mortgage and new share capital, because the building will earn revenue for decades.
  usage:
    general: Some textbooks also separate medium-term finance, roughly one to five years, from long-term finance of more than five years.
    syllabus: The guide asks only whether a source is short-term or long-term, and whether it suits the situation.
  topics: []
  subtopics: ['3.2']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [short-term-finance, share-capital, loan-capital, capital-expenditure, retained-profit]

- id: collateral
  term: Collateral
  definition: An asset that a borrower pledges to a lender, which the lender can take and sell if the loan is not repaid.
  context: Collateral lowers the lender's risk, so a secured loan is easier to obtain and usually carries a lower interest rate. Businesses with few assets, such as new service firms, may struggle to borrow for lack of it, which is one reason microfinance providers and business angels matter. Property, vehicles and equipment are common forms of collateral.
  example: A bank lends a fictional bakery, Crumbs, $80,000 secured on the bakery's building, which the bank could sell if the repayments stopped.
  topics: []
  subtopics: ['3.2']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [loan-capital, microfinance-provider, interest]

- id: interest
  term: Interest
  definition: The price of borrowing money, paid by the borrower to the lender, usually stated as a percentage of the amount borrowed for each year.
  context: Interest is charged on loans and overdrafts and has its own line in the statement of profit or loss, below profit before interest and tax. Because it must be paid whether or not the business makes a profit, heavy borrowing and rising interest rates increase financial risk. Share capital carries no interest; shareholders are rewarded with dividends, which the directors can choose not to pay.
  example: A fictional sports shop, Topspin, has a $50,000 loan at 8% a year, so it pays $4,000 in interest in the first year.
  topics: []
  subtopics: ['3.2', '3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [loan-capital, overdraft, profit-before-interest-and-tax, dividend]

# ---------- 3.3 Costs and revenues (the cost and revenue terms are in costs.yaml) ----------
- id: profit
  term: Profit
  definition: What is left when total cost is taken away from total revenue over a period; when costs are greater than revenue the result is negative and is called a loss.
  context: Profit rewards the owners for the risk they take, and the part that is kept becomes retained profit, a source of finance. It is not the same as cash, since a business can make a profit while running out of cash, and it is not the same as profitability, which compares profit with sales or capital. The statement of profit or loss shows profit at several stages, from gross profit down to the profit for period.
  example: A fictional candle maker, Wickworks, sells 2,000 candles at $12 each ($24,000) in a month in which its total costs are $19,500, so its profit is $4,500.
  formula: Profit = total revenue − total cost
  topics: [costs-and-revenues]
  subtopics: ['3.3', '3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [total-revenue, total-cost, gross-profit, profitability, cash-flow]

# ---------- 3.4 Final accounts ----------
- id: final-accounts
  term: Final accounts
  aliases: [Financial statements, Annual accounts]
  definition: The financial statements a business prepares at the end of its financial year, chiefly the statement of profit or loss and the statement of financial position.
  context: Final accounts summarize how the business performed over the year and what it owned and owed at the end of it. Stakeholders read them for different reasons, such as shareholders judging returns, lenders and suppliers judging whether they will be repaid, managers planning, employees judging job security and governments assessing tax. Companies are usually required by law to prepare them, and larger ones to have them independently audited.
  example: Before raising a fictional pottery company's overdraft limit, its bank asks to see the last two years of final accounts.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [statement-of-profit-or-loss, statement-of-financial-position, ratio-analysis, window-dressing]

- id: statement-of-profit-or-loss
  term: Statement of profit or loss
  aliases: [Profit and loss account, Income statement, P&L]
  definition: The final account that shows a business's revenue, costs and profit over a period, usually a year, working down from sales revenue to the profit for period and the retained profit.
  context: "In the guide's layout the lines run: sales revenue, cost of sales, gross profit, expenses, profit before interest and tax, interest, profit before tax, tax, profit for period, dividends and retained profit. A non-profit entity uses the same layout but calls each profit line a surplus and pays no dividends. It records revenue and costs when they are earned and incurred, not when cash changes hands, so its profit is not the same as the business's cash flow."
  example: A fictional sandwich chain's statement of profit or loss shows sales revenue of $900,000 and cost of sales of $360,000, so its gross profit for the year is $540,000.
  usage:
    general: Also called the profit and loss account (P&L) or the income statement.
    syllabus: The syllabus names it the profit and loss account, but assessment presents it as the statement of profit or loss, the name the guide asks students to use.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [statement-of-financial-position, cost-of-sales, gross-profit, profit-before-interest-and-tax, profit-for-period, final-accounts]

- id: statement-of-financial-position
  term: Statement of financial position
  aliases: [Balance sheet]
  definition: The final account that lists what a business owns (its assets), what it owes (its liabilities) and the owners' stake (its equity) at one moment, usually the last day of the financial year.
  context: It is a snapshot of one date, not a record of a period. In the guide's layout, non-current and current assets add up to total assets, current and non-current liabilities add up to total liabilities, and net assets (total assets minus total liabilities) always equal total equity, which is why the statement balances. It supplies the figures for the liquidity ratios, capital employed and, for HL, gearing.
  example: A fictional bike maker's statement of financial position at 31 December shows total assets of $2.4 million and total liabilities of $0.9 million, so its net assets and its total equity are both $1.5 million.
  usage:
    general: Widely called the balance sheet.
    syllabus: The syllabus names it the balance sheet, but assessment presents it as the statement of financial position, the name the guide asks students to use.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [statement-of-profit-or-loss, asset, liability, equity, net-assets, final-accounts]

- id: cost-of-sales
  term: Cost of sales
  aliases: [Cost of goods sold, COGS]
  definition: The direct cost of the goods or services a business has sold in a period, such as the stock and materials used up, which is taken from sales revenue to find gross profit.
  context: Cost of sales counts only the stock actually sold in the period, not everything bought, so for a trading business it is opening stock plus purchases minus closing stock. It is different from expenses, the running costs such as rent, salaries and advertising, which are deducted after gross profit. HL students also use it in stock turnover and creditor days.
  example: A fictional shoe shop starts the year with $20,000 of stock, buys $150,000 more and ends the year with $30,000, so its cost of sales is $140,000.
  formula: Cost of sales = opening stock + purchases − closing stock
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [gross-profit, expenses, stock, direct-cost, statement-of-profit-or-loss]

- id: gross-profit
  term: Gross profit
  definition: Sales revenue minus cost of sales, the profit a business makes on its trading before the expenses of running it are paid.
  context: Gross profit shows how much the business earns on what it sells over the direct cost of providing it, so it reflects pricing and the cost of buying or making. It is not the final profit, since expenses such as rent, salaries and marketing, and then interest and tax, are still to come off. A non-profit entity calls the same line gross surplus, and the gross profit margin expresses it as a percentage of sales revenue.
  example: A fictional phone-case seller has sales revenue of $250,000 and cost of sales of $100,000, so its gross profit is $150,000.
  formula: Gross profit = sales revenue − cost of sales
  topics: []
  subtopics: ['3.4', '3.5']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [cost-of-sales, gross-profit-margin, expenses, statement-of-profit-or-loss, profit]

- id: expenses
  term: Expenses
  aliases: [Operating expenses]
  definition: The costs of running a business that are not part of cost of sales, such as rent, salaries, marketing, insurance and utilities, deducted from gross profit in the statement of profit or loss.
  context: Expenses are mostly indirect costs (overheads), which are hard to link to any one product. Gross profit minus expenses gives profit before interest and tax, so controlling expenses is one way to raise the profit margin without changing prices. Interest and tax are shown on their own lines further down, not as expenses.
  example: A fictional design agency's expenses for the year include $60,000 of office rent, $40,000 of advertising and $5,000 of insurance.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [cost-of-sales, gross-profit, profit-before-interest-and-tax, indirect-cost, revenue-expenditure]

- id: profit-before-interest-and-tax
  term: Profit before interest and tax
  aliases: [PBIT, Operating profit, EBIT]
  definition: Gross profit minus expenses, the profit from the business's operations before the cost of borrowing (interest) and tax are taken off.
  context: It is the profit figure the guide uses in both the profit margin and ROCE, because it measures how well the business operates, regardless of how it is financed or taxed. Below it, the statement of profit or loss deducts interest to give profit before tax, and then tax to give the profit for period. Using the wrong profit line is a common slip in ratio questions.
  example: A fictional gym chain has gross profit of $700,000 and expenses of $450,000, so its profit before interest and tax is $250,000.
  formula: Profit before interest and tax = gross profit − expenses
  usage:
    general: Accountants often call it operating profit or EBIT (earnings before interest and tax), and some textbooks call it net profit before interest and tax.
    syllabus: The guide calls it profit before interest and tax, and uses it for the profit margin and ROCE.
  topics: []
  subtopics: ['3.4', '3.5']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [gross-profit, expenses, interest, profit-margin, return-on-capital-employed]

- id: profit-for-period
  term: Profit for period
  aliases: [Profit for the year, Profit after tax]
  definition: The profit left after interest and tax have been taken off, which belongs to the owners and is either paid out as dividends or kept as retained profit.
  context: In the guide's layout, profit before interest and tax minus interest gives profit before tax, and profit before tax minus tax gives the profit for period. It is the bottom line that shareholders watch, but it is affected by how the business is financed and taxed, which is why the profitability ratios use profit before interest and tax instead. A non-profit entity calls it the surplus for period.
  example: A fictional software firm has profit before interest and tax of $500,000, pays $50,000 in interest and $90,000 in tax, and so has a profit for period of $360,000.
  formula: Profit for period = profit before tax − tax, where profit before tax = profit before interest and tax − interest
  usage:
    general: Often called net profit, net income or the bottom line, although textbooks do not all mean the same line by net profit.
    syllabus: The guide's statement of profit or loss calls it profit for period, which avoids the unclear term net profit.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [profit-before-interest-and-tax, interest, dividend, retained-profit, statement-of-profit-or-loss]

- id: dividend
  term: Dividend
  definition: A share of a company's profit paid to its shareholders, usually as a fixed amount for each share they own.
  context: The directors decide how much profit to pay out as dividends and how much to keep as retained profit, so dividends are a trade-off between rewarding owners now and financing growth. Unlike interest, a dividend is not a legal obligation, so a company can cut or skip it in a poor year. In the guide's layout, dividends are deducted from the profit for period to give retained profit.
  example: A fictional brewery with 1 million shares pays a dividend of $0.12 a share, a total of $120,000 out of its profit for the year.
  topics: []
  subtopics: ['3.4', '3.2']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [profit-for-period, retained-profit, share-capital, interest]

- id: surplus
  term: Surplus
  definition: The name a non-profit entity uses for its profit, the amount by which its income exceeds its costs in a period, which is kept and used for its purpose rather than paid to owners.
  context: The guide's layouts for a non-profit entity use the same lines as for a business but call them gross surplus, surplus before interest, surplus before tax, surplus for period and retained surplus. There is no dividend line, because a non-profit has no shareholders to pay, so the whole surplus is retained and its equity is made up of retained earnings. Non-profits often pay no tax on their surplus.
  example: A fictional community theatre trust has income of $300,000 and costs of $270,000, a surplus of $30,000 that it spends on repairing its building.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [profit, statement-of-profit-or-loss, retained-earnings]

- id: asset
  term: Asset
  definition: Something a business owns or controls that has a money value and will bring it future benefit, such as cash, stock, money owed by customers, equipment, property or a brand.
  context: The statement of financial position lists assets in two groups, non-current assets kept for more than a year and current assets that turn into cash within a year. An asset can be tangible, with a physical form, or intangible, such as goodwill. All assets are financed either by liabilities or by the owners' equity, which is why total assets minus total liabilities equals equity.
  example: A fictional taxi firm's assets include its cars, its booking app, the cash in its bank account and the fares that business customers still owe it.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [non-current-assets, current-assets, intangible-asset, liability, statement-of-financial-position]

- id: liability
  term: Liability
  definition: A debt a business owes to someone outside it, such as a bank, a supplier or the tax authority, which it will have to pay in the future.
  context: Liabilities are split into current liabilities, due within a year (such as a bank overdraft and trade creditors), and non-current liabilities, due after more than a year (such as long-term borrowing). Total liabilities are taken from total assets to give net assets. The owners' equity is shown separately in the guide's layout and is not counted as a liability.
  example: A fictional printing company's liabilities include a $40,000 overdraft, $25,000 owed to paper suppliers and a $200,000 bank loan due in six years.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [current-liabilities, non-current-liabilities, asset, equity, statement-of-financial-position]

- id: non-current-assets
  term: Non-current assets
  aliases: [Fixed assets]
  definition: Assets a business expects to keep and use for more than a year to run its operations, such as property, plant and equipment, vehicles and intangible assets.
  context: Non-current assets are bought through capital expenditure and are not meant for resale. In the guide's layout, property, plant and equipment is shown at its original cost with accumulated depreciation taken off, giving the value of non-current assets. They are usually paid for with long-term finance, and selling surplus ones is an internal source of finance.
  example: A fictional laundry's non-current assets are its premises, its washing machines and dryers, and its delivery van.
  usage:
    general: Older textbooks and many small businesses call them fixed assets.
    syllabus: The guide's layout uses non-current assets.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [asset, current-assets, capital-expenditure, accumulated-depreciation, intangible-asset]

- id: current-assets
  term: Current assets
  definition: Cash and the other assets a business expects to turn into cash or use up within a year; in the guide's layout these are cash, debtors and stock.
  context: Current assets are what the business has available to pay its short-term debts, so the current ratio divides them by current liabilities, and the acid test ratio does the same with stock taken out. Cash is the most liquid, debtors depend on customers paying, and stock has first to be sold, often on credit. Current assets minus current liabilities gives working capital.
  example: At its year end a fictional sports retailer holds $30,000 in cash, is owed $12,000 by schools that bought kit on credit and has $45,000 of stock, so its current assets are $87,000.
  topics: []
  subtopics: ['3.4', '3.5']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [current-liabilities, working-capital, current-ratio, stock, debtors, liquidity]

- id: current-liabilities
  term: Current liabilities
  definition: Debts a business must pay within a year; in the guide's layout these are the bank overdraft, trade creditors and other short-term loans.
  context: The current ratio and the acid test ratio both divide by current liabilities, so a rise in them, other things equal, weakens liquidity. Trade creditors come from trade credit and are no problem as long as suppliers are paid on time. Current assets minus current liabilities gives working capital.
  example: A fictional builders' merchant owes its suppliers $70,000 due within 60 days and has a $15,000 overdraft, so its current liabilities are $85,000.
  topics: []
  subtopics: ['3.4', '3.5']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [current-assets, non-current-liabilities, working-capital, current-ratio, creditors, overdraft]

- id: non-current-liabilities
  term: Non-current liabilities
  aliases: [Long-term liabilities]
  definition: Debts a business does not have to repay within the next year, such as long-term bank loans, mortgages and debentures; the guide's layout shows them as long-term borrowings.
  context: Together with equity, non-current liabilities make up capital employed, the long-term finance used by the business, and HL students divide them by capital employed to find the gearing ratio. They pay for non-current assets without diluting ownership, but they commit the business to interest and repayments for years. Leaving them out of capital employed is a common slip in ROCE questions.
  example: A fictional hotel's statement of financial position shows a $2 million mortgage, repayable over 20 years, as a non-current liability.
  topics: []
  subtopics: ['3.4', '3.5', '3.6']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [liability, current-liabilities, capital-employed, gearing-ratio, loan-capital]

- id: net-assets
  term: Net assets
  definition: Total assets minus total liabilities, the value of what a business owns once all its debts are counted, which always equals its total equity.
  context: Net assets show the book value of the owners' stake. If they fall below zero, the business owes more than it owns, which is one meaning of insolvency (HL). Because they are based on recorded values, net assets can differ widely from what the business would sell for.
  example: A fictional garden-tools maker has total assets of $5 million and total liabilities of $3.2 million, so its net assets and its total equity are $1.8 million.
  formula: Net assets = total assets − total liabilities
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [equity, asset, liability, statement-of-financial-position, insolvency]

- id: equity
  term: Equity
  aliases: [Total equity, Shareholders' equity]
  definition: The owners' stake in the business, which in the guide's layout is share capital plus retained earnings and always equals net assets.
  context: Equity is finance provided by the owners, either paid in directly by buying shares or left in the business as retained profit over the years. Together with non-current liabilities it makes up capital employed, and the larger its share, the lower the gearing. A non-profit entity has no share capital, so its equity is made up of retained earnings alone.
  example: A fictional toy company has share capital of $400,000 and retained earnings of $900,000, so its total equity is $1.3 million.
  formula: Total equity = share capital + retained earnings
  topics: []
  subtopics: ['3.4', '3.5', '3.6']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [share-capital, retained-earnings, net-assets, capital-employed, gearing-ratio]

- id: retained-earnings
  term: Retained earnings
  definition: The total of all the profit a business has kept, rather than paid out as dividends, since it began, shown as part of equity in the statement of financial position.
  context: Each year's retained profit from the statement of profit or loss is added to retained earnings, and a loss reduces them. Retained earnings are not a store of cash, since the money has usually been spent on assets such as equipment or stock, so a business with large retained earnings can still be short of cash. They differ from retained profit, which is the amount kept in a single year.
  example: A fictional bakery begins the year with retained earnings of $300,000 and keeps $45,000 of this year's profit, so it ends the year with $345,000.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [retained-profit, equity, share-capital, statement-of-financial-position]

- id: debtors
  term: Debtors
  aliases: [Trade receivables, Accounts receivable]
  definition: Customers who have bought goods or services on credit and not yet paid, and the total they owe the business, which is a current asset.
  context: Debtors arise from credit sales, which count as revenue and profit before any cash arrives, one of the main reasons profit and cash flow differ. Debtors are less liquid than cash, and some may never pay, which is a bad debt. HL students measure how long customers take to pay with debtor days.
  example: A fictional catering firm invoices a school $8,000 for lunches with 30 days to pay, and until the school pays, the $8,000 is part of its debtors.
  topics: []
  subtopics: ['3.4', '3.6', '3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [current-assets, debtor-days, credit-sales, creditors, debt-factoring]

- id: creditors
  term: Creditors
  aliases: [Trade creditors, Trade payables, Accounts payable]
  definition: The amounts a business owes to suppliers for goods and services bought on credit, and the suppliers themselves; shown as trade creditors, a current liability.
  context: Creditors come from trade credit, which helps cash flow because the business has the goods before it pays for them. Delaying payment for too long can harm relationships with suppliers and cost the business its credit terms or discounts. HL students measure how long the business takes to pay with creditor days.
  example: A fictional restaurant receives $5,000 of fish from a supplier on 14-day terms, and until it pays, the $5,000 is part of its trade creditors.
  topics: []
  subtopics: ['3.4', '3.6']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [current-liabilities, trade-credit, creditor-days, debtors]

- id: stock
  term: Stock
  aliases: [Inventory, Inventories]
  definition: The goods a business holds, including raw materials and components waiting to be used, work in progress and finished goods waiting to be sold; a current asset.
  context: Stock is the least liquid current asset, because it has to be sold, often on credit, before it becomes cash, which is why the acid test ratio leaves it out. Holding too much ties up cash and risks waste or going out of date, while holding too little risks lost sales. HL students measure how quickly it is used or sold with stock turnover.
  example: A fictional bicycle shop holds $60,000 of stock, made up of frames and parts in its workshop and finished bicycles on the shop floor.
  usage:
    general: International accounting standards and North American usage call it inventory.
    syllabus: The guide's layouts and formulas use stock.
  topics: []
  subtopics: ['3.4', '3.5', '3.6']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [current-assets, acid-test-ratio, stock-turnover, cost-of-sales, working-capital]

- id: intangible-asset
  term: Intangible asset
  definition: An asset that cannot be seen or touched but still has value to a business, such as goodwill, a brand, a patent, a copyright, a trademark or a licence.
  context: Intangible assets can be among a business's most valuable resources, but they are hard to value because their worth depends on what they will earn in future. For that reason the accounts usually record them only when they are bought, so a brand built up over many years may not appear in the statement of financial position at all. Patents, copyrights and trademarks are forms of intellectual property, the legal rights covered in 5.8 (HL).
  example: When a fictional drinks company buys a rival juice brand, it pays more than the rival's factory and stock are worth, and the extra is recorded as intangible assets, the brand name and goodwill.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [goodwill, non-current-assets, asset]

- id: goodwill
  term: Goodwill
  definition: The amount by which the price paid for a business is greater than the value of its separate net assets, paying for things such as its reputation, loyal customers, location and skilled staff.
  context: Goodwill is an intangible asset that normally appears in the accounts only after one business buys another, because only then has a price been paid for it. It can lose its value quickly, for example after a scandal or the loss of key customers. It is often a large part of the price in a takeover.
  example: A fictional chain buys an independent café for $500,000 when its equipment, stock and other net assets are worth $350,000, and the $150,000 difference is recorded as goodwill.
  usage:
    general: In everyday speech, goodwill means friendly feeling and trust towards a business.
    syllabus: In the accounts it is the extra paid for a business above the value of its net assets, recorded as an intangible asset.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [intangible-asset, acquisition, net-assets]

- id: window-dressing
  term: Window dressing
  aliases: [Creative accounting]
  definition: Presenting the final accounts so that a business looks stronger than it really is, for example by choosing flattering accounting methods or by timing transactions around the year end.
  context: Examples include selling assets just before the year end to raise the cash balance, delaying payments to suppliers, recording sales early or choosing estimates that raise profit. It may stay within the law, but it misleads stakeholders such as investors and lenders, which raises ethical questions. It is one reason to read final accounts over several years and alongside other evidence.
  example: A fictional retailer persuades customers to take early delivery in the last week of its financial year so that the sales fall into this year's accounts.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [final-accounts, statement-of-profit-or-loss, ratio-analysis]

- id: accumulated-depreciation
  term: Accumulated depreciation
  definition: The total amount by which the recorded value of a business's non-current assets has been reduced since they were bought, to reflect wear, use and age; it is deducted from their original cost in the statement of financial position.
  context: In the guide's layout, property, plant and equipment is shown at cost, accumulated depreciation is taken off, and the result is the value of non-current assets. It grows every year as more depreciation is charged, so the recorded value of the assets falls. Calculating depreciation by the straight line and units of production methods is HL only.
  example: A fictional printing firm bought equipment for $500,000 and has charged $50,000 of depreciation in each of the four years since, so its accumulated depreciation is $200,000.
  topics: []
  subtopics: ['3.4']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [depreciation, net-book-value, non-current-assets, statement-of-financial-position]

- id: depreciation
  term: Depreciation
  definition: The loss in value of a non-current asset as it is used and ages, recorded in the accounts by spreading its cost, less any residual value, across the years of its useful life.
  context: Each year's depreciation is charged as an expense in the statement of profit or loss, which lowers profit, and the total so far is deducted from the asset's cost in the statement of financial position. No cash leaves the business when depreciation is charged, because the cash went out when the asset was bought, which is one reason profit and cash flow differ. The guide names two methods, the straight line method and the units of production method.
  example: A fictional bakery's $30,000 delivery van is expected to last five years and then sell for $5,000, so $25,000 of its cost is spread over those five years as depreciation.
  topics: []
  subtopics: ['3.4']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [straight-line-method, units-of-production-method, residual-value, net-book-value, accumulated-depreciation]

- id: straight-line-method
  term: Straight line method
  aliases: [Straight line depreciation]
  definition: A method of depreciation that charges the same amount in every year of an asset's useful life, so its recorded value falls in a straight line.
  context: The straight line method is simple to calculate and to explain, and it suits assets that wear out evenly over time, such as buildings, furniture and fittings. It ignores how hard the asset is actually used in each year, and the fact that many assets, such as vehicles and computers, lose most of their value early. The net book value at the end of each year is the cost minus the depreciation charged so far.
  example: A fictional café buys a coffee machine for $12,000, expects it to last four years and then be worth $2,000, so it charges $2,500 of depreciation a year.
  formula: Annual depreciation = (cost of the asset − residual value) ÷ useful life in years
  topics: []
  subtopics: ['3.4']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [depreciation, units-of-production-method, residual-value, net-book-value]

- id: units-of-production-method
  term: Units of production method
  aliases: [Units of production depreciation, Units of use method]
  definition: A method of depreciation that charges each period according to how much the asset is used, such as the units it makes or the hours it runs, as a share of the total use expected over its life.
  context: The charge rises in busy years and falls in quiet ones, so it matches depreciation to the wear on assets such as machinery and vehicles. It needs a reliable estimate of the asset's total lifetime output and a record of its use each period, which makes it more work than the straight line method. It charges little when the asset stands idle, even though the asset may still be losing value with age.
  example: A fictional bottling firm buys a machine for $90,000, expects it to fill 1,000,000 bottles before being sold for $10,000, and fills 150,000 bottles this year, so this year's depreciation is $12,000.
  formula: Depreciation for a period = ((cost of the asset − residual value) ÷ expected total units over the asset's life) × units produced in the period
  topics: []
  subtopics: ['3.4']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [depreciation, straight-line-method, residual-value, net-book-value]

- id: residual-value
  term: Residual value
  aliases: [Scrap value, Salvage value]
  definition: The amount a business expects to receive for an asset when it stops using it, by selling it second-hand or for scrap.
  context: The residual value is taken off the asset's cost before depreciation is spread, because that part of the cost is expected to come back. It is an estimate, so setting it too high understates depreciation and overstates profit. At the end of the asset's useful life, its net book value should equal its residual value.
  example: A fictional taxi firm expects to sell each $25,000 car for $4,000 after five years, so only $21,000 of each car's cost is depreciated.
  topics: []
  subtopics: ['3.4']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [depreciation, straight-line-method, units-of-production-method, net-book-value]

- id: net-book-value
  term: Net book value
  aliases: [NBV, Carrying amount, Book value]
  definition: The value at which an asset is recorded in the accounts at a given date, its original cost minus the depreciation charged on it so far.
  context: Net book value falls each year as depreciation is charged and should reach the residual value at the end of the asset's useful life. It is an accounting figure, not a market price, so the asset might sell for more or less. A year-by-year table of net book values is a clear way to compare the straight line and units of production methods.
  example: After three years of straight line depreciation at $2,500 a year, a café's $12,000 coffee machine has a net book value of $4,500.
  formula: Net book value = original cost − accumulated depreciation
  topics: []
  subtopics: ['3.4']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [accumulated-depreciation, depreciation, residual-value, straight-line-method]

# ---------- 3.5 Profitability and liquidity ratio analysis ----------
- id: ratio-analysis
  term: Ratio analysis
  definition: Comparing one figure from the final accounts with another, as a percentage, a ratio, a number of times or a number of days, to judge a business's performance and financial health.
  context: The guide groups the ratios as profitability ratios (gross profit margin, profit margin and ROCE), liquidity ratios (current ratio and acid test ratio) and, for HL only, efficiency ratios (stock turnover, debtor days, creditor days and gearing). A single ratio means little on its own, so it is compared with earlier years, with competitors and with targets. Ratios are only as reliable as the accounts behind them, and they show what has changed but not why.
  example: An investor compares a fictional clothing chain's profit margin over three years with those of two rival chains before deciding whether to buy its shares.
  topics: []
  subtopics: ['3.5', '3.6']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [profitability, liquidity, efficiency-ratios, final-accounts, gross-profit-margin, current-ratio]

- id: profitability
  term: Profitability
  definition: How well a business turns its sales, or the capital invested in it, into profit, measured with ratios rather than by the amount of profit alone.
  context: Profit is an amount, while profitability compares that amount with something else, which makes businesses of different sizes comparable. A large firm may make more profit than a small one and still be less profitable if it needs far more sales or capital to earn it. The guide's profitability ratios are the gross profit margin, the profit margin and return on capital employed.
  example: Firm A makes $1 million of profit on capital employed of $20 million, and Firm B makes $300,000 on $2 million, so Firm B makes less profit but is more profitable (a ROCE of 15% against 5%).
  topics: []
  subtopics: ['3.5']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [profit, gross-profit-margin, profit-margin, return-on-capital-employed, ratio-analysis]

- id: gross-profit-margin
  term: Gross profit margin
  aliases: [GPM]
  definition: Gross profit as a percentage of sales revenue, which shows how much of each dollar of sales is left after paying for the goods or services sold.
  context: A higher gross profit margin leaves more of each sale to pay the expenses and make a profit. It can be raised by putting prices up, if customers will accept it, by cutting the cost of sales through cheaper suppliers, bulk buying or less waste, or by selling more of the higher-margin products. It ignores expenses, so a business can have a healthy gross profit margin and still make a loss.
  example: A fictional bakery with sales revenue of $400,000 and gross profit of $160,000 has a gross profit margin of 40%.
  formula: Gross profit margin = (gross profit ÷ sales revenue) × 100
  topics: []
  subtopics: ['3.5']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [gross-profit, profit-margin, cost-of-sales, profitability]

- id: profit-margin
  term: Profit margin
  aliases: [Net profit margin]
  definition: Profit before interest and tax as a percentage of sales revenue, which shows how much of each dollar of sales is left after all the costs of running the business, before interest and tax.
  context: Comparing the profit margin with the gross profit margin shows how much of the gross profit the expenses take, so a steady gross margin with a falling profit margin points to rising overheads. The profit margin can be improved by raising prices, cutting the cost of sales or controlling expenses such as rent, salaries and marketing. Because it uses profit before interest and tax, it is not affected by how the business is financed.
  example: A fictional bakery with sales revenue of $400,000 and profit before interest and tax of $48,000 has a profit margin of 12%.
  formula: Profit margin = (profit before interest and tax ÷ sales revenue) × 100
  usage:
    general: Many sources quote a net profit margin based on profit before tax or on profit after tax, so figures from different sources may not be comparable.
    syllabus: The guide's profit margin always uses profit before interest and tax.
  topics: []
  subtopics: ['3.5']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [gross-profit-margin, profit-before-interest-and-tax, expenses, profitability, return-on-capital-employed]

- id: return-on-capital-employed
  term: Return on capital employed (ROCE)
  aliases: [ROCE]
  definition: Profit before interest and tax as a percentage of capital employed, which shows how much profit a business earns on the long-term finance invested in it.
  context: ROCE is often seen as the key profitability ratio, because it shows whether the money tied up in the business earns enough. It can be compared with the interest rate the owners could earn by saving the money instead, and with other businesses. It rises if profit before interest and tax rises or if less capital is needed to earn it, for example when unused assets are sold and the money is used to repay long-term debt.
  example: A fictional furniture maker with profit before interest and tax of $300,000, non-current liabilities of $500,000 and equity of $1.5 million has a ROCE of 15%.
  formula: Return on capital employed (ROCE) = (profit before interest and tax ÷ capital employed) × 100, where capital employed = non-current liabilities + equity
  topics: []
  subtopics: ['3.5']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [capital-employed, profit-before-interest-and-tax, profitability, profit-margin]

- id: capital-employed
  term: Capital employed
  definition: The long-term finance used by a business, made up of its non-current liabilities and its equity.
  context: ROCE and, for HL, the gearing ratio both divide by capital employed. Because the statement of financial position balances, it also equals total assets minus current liabilities, which is a useful check on the arithmetic. Leaving out the non-current liabilities, or adding in current liabilities, are common slips.
  example: A fictional hotel with a $2 million long-term loan and equity of $3 million has capital employed of $5 million.
  formula: Capital employed = non-current liabilities + equity
  usage:
    general: Some textbooks and analysts measure capital employed in other ways, such as total assets, or equity plus all borrowing.
    syllabus: The guide defines capital employed as non-current liabilities plus equity.
  topics: []
  subtopics: ['3.5', '3.6']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [return-on-capital-employed, gearing-ratio, non-current-liabilities, equity]

- id: liquidity
  term: Liquidity
  aliases: [Liquidity position]
  definition: A business's ability to pay its short-term debts as they fall due from its cash and the assets it can quickly turn into cash; for a single asset, how quickly it can become cash at close to its full value.
  context: A business's liquidity position is judged from its cash balance, its working capital and its current and acid test ratios. Liquidity is not the same as profitability, since a profitable business can still fail if it cannot pay its bills on time, while too much liquidity means cash sitting idle instead of earning a return. Cash is the most liquid asset, followed by debtors and then stock.
  example: A fictional construction firm with healthy profits struggles to pay its workers because its clients take four months to pay, a sign of poor liquidity.
  topics: []
  subtopics: ['3.5', '3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [current-ratio, acid-test-ratio, working-capital, cash-flow, profitability]

- id: current-ratio
  term: Current ratio
  definition: Current assets divided by current liabilities, which shows how many times the assets that will become cash within a year cover the debts due within a year.
  context: A figure of about 1.5 to 2 is often described as comfortable, but what is normal depends on the industry, and a supermarket that sells for cash and pays its suppliers later can work safely below 1. Below 1, the business may struggle to pay its short-term debts, while a very high figure can mean too much cash, stock or debtors tied up and earning nothing. It can be improved by adding to current assets, for example with retained profit or a long-term loan, or by reducing current liabilities, for example by turning an overdraft into a long-term loan.
  example: A fictional pharmacy with current assets of $90,000 and current liabilities of $60,000 has a current ratio of 1.5.
  formula: Current ratio = current assets ÷ current liabilities
  topics: []
  subtopics: ['3.5']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [acid-test-ratio, current-assets, current-liabilities, liquidity, working-capital]

- id: acid-test-ratio
  term: Acid test (quick) ratio
  aliases: [Acid test ratio, Quick ratio]
  definition: Current assets minus stock, divided by current liabilities; a stricter test of liquidity that leaves out stock because it is the slowest current asset to turn into cash.
  context: A figure of about 1 or more suggests the business could pay its short-term debts without having to sell any stock, although businesses with fast-selling stock, such as food retailers, often run safely below 1. A wide gap between the current ratio and the acid test ratio shows that much of the business's liquidity is tied up in stock. Selling surplus stock for cash raises the acid test ratio.
  example: A fictional pharmacy with current assets of $90,000, of which $40,000 is stock, and current liabilities of $60,000 has an acid test ratio of about 0.83.
  formula: Acid test (quick) ratio = (current assets − stock) ÷ current liabilities
  topics: []
  subtopics: ['3.5']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [current-ratio, stock, current-assets, current-liabilities, liquidity]

# ---------- 3.6 Efficiency ratio analysis (HL only) ----------
- id: efficiency-ratios
  term: Efficiency ratios
  definition: Ratios that show how well a business manages its stock, collects money from customers, pays its suppliers and finances itself; in the guide these are stock turnover, debtor days, creditor days and the gearing ratio.
  context: Efficiency ratios help to explain changes in liquidity and profitability, since slow-moving stock and late-paying customers tie up cash, while high gearing adds interest costs and risk. Like the other ratios, they mean most when compared over time or with similar businesses. For the ratios measured in days a fall is usually an improvement, except for creditor days, where a rise helps cash flow but may strain relations with suppliers.
  example: A fictional electronics retailer finds that its stock turnover has slowed from 12 times a year to 8, a warning that stock is building up in its warehouses.
  usage:
    general: Gearing is usually classed as a solvency or financial structure ratio rather than as an efficiency ratio.
    syllabus: The guide places the gearing ratio among the efficiency ratios, all of which are HL only.
  topics: []
  subtopics: ['3.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [stock-turnover, debtor-days, creditor-days, gearing-ratio, ratio-analysis]

- id: stock-turnover
  term: Stock turnover
  aliases: [Inventory turnover, Stock turnover ratio]
  definition: How quickly a business uses or sells its stock, measured either as the number of times its average stock is used up and replaced in a year or as the average number of days stock is held.
  context: More times a year, or fewer days, means stock sells quickly, which saves storage costs, frees cash and lowers the risk of waste or stock going out of date. What is good depends on the product, since a florist must turn its stock over every few days and a jeweller far less often. Stock turnover can be improved by holding less stock, for example with just-in-time methods, by clearing slow-selling lines or by forecasting sales more accurately.
  example: A fictional bookshop with cost of sales of $240,000, opening stock of $35,000 and closing stock of $45,000 has average stock of $40,000, so its stock turns over 6 times a year, about every 61 days.
  formula: Stock turnover (number of times) = cost of sales ÷ average stock; or stock turnover (number of days) = (average stock ÷ cost of sales) × 365, where average stock = (opening stock + closing stock) ÷ 2
  topics: []
  subtopics: ['3.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [stock, cost-of-sales, efficiency-ratios, acid-test-ratio]

- id: debtor-days
  term: Debtor days
  aliases: [Debtor days ratio, Debt collection period]
  definition: The average number of days a business takes to collect the money its customers owe it.
  context: Fewer debtor days means cash arrives sooner, which helps liquidity, and the figure is often compared with the credit terms the business offers. It can be reduced by tighter credit control, such as checking customers before giving credit, chasing late payers and offering discounts for paying early, or by debt factoring, but cutting credit terms too far may send customers to rivals. The guide divides by total sales revenue, so for a business that also sells for cash the figure understates how long its credit customers take.
  example: A fictional printing firm with debtors of $50,000 and total sales revenue of $365,000 has debtor days of 50.
  formula: Debtor days ratio (number of days) = (debtors ÷ total sales revenue) × 365
  topics: []
  subtopics: ['3.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [debtors, creditor-days, debt-factoring, efficiency-ratios, credit-sales]

- id: creditor-days
  term: Creditor days
  aliases: [Creditor days ratio, Creditor payment period]
  definition: The average number of days a business takes to pay the suppliers it buys from on credit.
  context: More creditor days means the business keeps its cash for longer, which helps liquidity, but paying late can damage relationships with suppliers, lose discounts for prompt payment and put credit terms at risk. Comparing creditor days with debtor days shows whether customers pay the business before it has to pay its suppliers. Negotiating longer credit terms is a safer way to raise creditor days than simply paying late.
  example: A fictional restaurant with trade creditors of $12,000 and cost of sales of $146,000 has creditor days of 30.
  formula: Creditor days ratio (number of days) = (creditors ÷ cost of sales) × 365
  topics: []
  subtopics: ['3.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [creditors, trade-credit, debtor-days, efficiency-ratios]

- id: gearing-ratio
  term: Gearing ratio
  aliases: [Gearing]
  definition: Non-current liabilities as a percentage of capital employed, which shows how much of a business's long-term finance is borrowed rather than provided by its owners.
  context: A highly geared business, often taken to mean one above 50%, relies heavily on loans, so it must pay interest whatever its profits, is exposed to rises in interest rates and may find it harder to borrow more. Low gearing is safer, but it may mean the business is missing chances to grow with borrowed money. Gearing can be reduced by issuing shares, retaining more profit or repaying long-term loans.
  example: A fictional hotel with non-current liabilities of $2 million and equity of $3 million has a gearing ratio of 40%.
  formula: Gearing ratio = (non-current liabilities ÷ capital employed) × 100, where capital employed = non-current liabilities + equity
  usage:
    general: Many analysts measure gearing as debt divided by equity (the debt to equity ratio), which gives a different figure.
    syllabus: The guide's gearing ratio divides non-current liabilities by capital employed, which is non-current liabilities plus equity.
  topics: []
  subtopics: ['3.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [capital-employed, non-current-liabilities, equity, loan-capital, efficiency-ratios]

- id: insolvency
  term: Insolvency
  definition: A financial state in which a person or business cannot pay its debts as they become due, or in which its liabilities are greater than its assets.
  context: Insolvency describes a financial position, not a legal process, and an insolvent business may still recover by raising new finance, selling assets or agreeing new terms with its creditors. If it cannot, creditors may take legal action, which can end in bankruptcy or, for a company, liquidation. Even a profitable business can become insolvent if its cash flow is badly managed.
  example: A fictional building firm has a full order book but cannot pay the $90,000 it owes suppliers this month, because its clients pay only when projects finish, so it is insolvent although it is profitable.
  topics: []
  subtopics: ['3.6']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [bankruptcy, liquidation, liquidity, cash-flow, net-assets]

- id: bankruptcy
  term: Bankruptcy
  definition: The legal status of a person or business that a court has formally declared unable to pay its debts, after which its assets are usually taken and sold to repay its creditors as far as possible.
  context: Insolvency comes first and bankruptcy is one possible legal outcome of it, so a business that recovers from insolvency never becomes bankrupt. Bankruptcy has serious consequences, such as the loss of assets and limits on borrowing or running a business in future. A sole trader, who has unlimited liability, can lose personal possessions such as a car or savings.
  example: A fictional sole trader who runs a gift shop cannot repay her bank loan or her suppliers, so a court declares her bankrupt and her stock and her car are sold to pay part of the debts.
  usage:
    general: Laws and terms differ between countries; in the UK bankruptcy applies to individuals, including sole traders and partners, and an insolvent company goes into liquidation or administration instead, while in the United States companies can file for bankruptcy and keep trading while they restructure.
    syllabus: The guide's content statement is insolvency versus bankruptcy, the difference between being unable to pay debts and the legal process that may follow.
  topics: []
  subtopics: ['3.6']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [insolvency, liquidation, liability]

- id: liquidation
  term: Liquidation
  aliases: [Winding up]
  definition: The formal closure of a company, in which its assets are sold and the money raised is used to pay its creditors, after which the company ceases to exist.
  context: Liquidation usually follows insolvency and may be forced by creditors through a court or chosen by the owners. Creditors are paid in a set order and shareholders receive whatever is left, which is often nothing, although limited liability means they cannot lose more than they invested. Liquidation should not be confused with liquidity, a business's ability to pay its short-term debts.
  example: A fictional furniture retailer that cannot pay its debts is placed into liquidation, and the stock and fittings of its shops are sold to repay its bank and suppliers.
  topics: []
  subtopics: ['3.6']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [insolvency, bankruptcy, liquidity]

# ---------- 3.7 Cash flow ----------
- id: cash-flow
  term: Cash flow
  definition: The movement of cash into a business (cash inflows) and out of it (cash outflows) over a period of time.
  context: Cash flow and profit differ mainly because of timing, since credit sales count as revenue before the cash arrives, stock is paid for before it is sold, and a new machine takes cash out at once but reaches the statement of profit or loss only gradually. Loans and share capital bring cash in without being revenue, and loan repayments take cash out without being costs. A business can therefore be profitable but short of cash, or loss-making but holding plenty of cash for a while.
  example: A fictional events company makes a profit on a wedding in June but is paid only in August, so its June cash flow from the event is negative while the profit is positive.
  topics: []
  subtopics: ['3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [cash-inflow, cash-outflow, net-cash-flow, cash-flow-forecast, profit, liquidity]

- id: cash-inflow
  term: Cash inflow
  aliases: [Cash inflows, Cash receipts]
  definition: Cash coming into a business, such as from cash sales, customers paying for earlier credit sales, loans received, new share capital or the sale of an asset.
  context: Not every cash inflow is revenue, since a bank loan brings cash in but has to be repaid and never appears as revenue in the statement of profit or loss. In a cash flow forecast an inflow is entered in the month the cash actually arrives, not the month of the sale. In the guide's layout the inflows are listed and added to give total cash inflows.
  example: In March a fictional landscaping firm receives $6,000 from February's credit customers, $4,000 from cash jobs and a $10,000 bank loan, so its total cash inflows are $20,000.
  topics: []
  subtopics: ['3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [cash-outflow, net-cash-flow, cash-flow-forecast, credit-sales]

- id: cash-outflow
  term: Cash outflow
  aliases: [Cash outflows, Cash payments]
  definition: Cash leaving a business, such as payments for stock and materials, wages, rent, utilities, interest, tax, loan repayments, dividends and new assets.
  context: An outflow is entered in the month the cash is paid, which may be well after the goods arrived if they were bought on trade credit. Some outflows, such as loan repayments and the purchase of a machine, are not costs in that period's statement of profit or loss, while depreciation is a cost but never a cash outflow. In the guide's layout the outflows are listed and added to give total cash outflows.
  example: A fictional bakery's cash outflows in May are $8,000 for wages, $3,000 for flour that arrived in April on 30-day credit, $2,000 for rent and $1,000 for electricity.
  topics: []
  subtopics: ['3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [cash-inflow, net-cash-flow, cash-flow-forecast, trade-credit]

- id: net-cash-flow
  term: Net cash flow
  definition: Total cash inflows minus total cash outflows for a period, which is negative when more cash leaves than comes in.
  context: A negative net cash flow is shown in brackets in a cash flow forecast and lowers the cash balance, and several negative months in a row can use up the business's cash or its overdraft. Net cash flow is not profit, because it includes loans received and assets bought and leaves out credit sales that have not yet been paid for. Adding it to the opening balance gives the closing balance.
  example: A fictional surf school receives $18,000 in July and pays out $11,000, a net cash flow of $7,000, but in January it receives $2,000 and pays out $5,000, a net cash flow of ($3,000).
  formula: Net cash flow = total cash inflows − total cash outflows
  topics: []
  subtopics: ['3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [cash-inflow, cash-outflow, closing-balance, cash-flow-forecast]

- id: opening-balance
  term: Opening balance
  definition: The cash a business holds at the start of a period, such as a month, which is the same as the closing balance of the period before.
  context: The opening balance is the first line of each month in the guide's cash flow forecast layout. A negative opening balance, shown in brackets, means the business starts the month overdrawn. Carrying the wrong figure forward from the previous month's closing balance is a common slip in forecast questions.
  example: A fictional pet shop ends April with $3,200 in the bank, so its opening balance for May is $3,200.
  topics: []
  subtopics: ['3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [closing-balance, net-cash-flow, cash-flow-forecast]

- id: closing-balance
  term: Closing balance
  definition: The cash a business holds at the end of a period, found by adding the period's net cash flow to its opening balance.
  context: The closing balance of one month becomes the opening balance of the next. A negative closing balance shows that the business would need an overdraft or other finance to cover the gap, and comparing it with the agreed overdraft limit shows whether the plan is workable. The lowest closing balance in a forecast shows how much extra finance might be needed.
  example: A fictional surf school starts January with $4,000 in the bank and has a net cash flow of ($3,000), so its closing balance is $1,000, which is also its opening balance for February.
  formula: Closing balance = opening balance + net cash flow
  topics: []
  subtopics: ['3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [opening-balance, net-cash-flow, cash-flow-forecast, overdraft]

- id: cash-flow-forecast
  term: Cash flow forecast
  definition: A plan that estimates a business's cash inflows and outflows month by month for a future period, to show the cash it expects to hold at the end of each month.
  context: In the guide's layout each month runs from the opening balance through the inflows and outflows to the net cash flow and the closing balance. The forecast warns when cash may run short, so the business can arrange an overdraft or change its plans in time, and lenders often ask to see one. It is only as reliable as its estimates, since sales, the timing of customer payments and costs can all turn out differently, especially for a new business.
  example: A fictional ice-cream van owner's forecast shows her cash running out in March, before the summer season, so she arranges an overdraft in January.
  topics: []
  subtopics: ['3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [cash-inflow, cash-outflow, net-cash-flow, opening-balance, closing-balance, budget]

- id: working-capital
  term: Working capital
  aliases: [Net current assets]
  definition: Current assets minus current liabilities, the resources a business has for its day-to-day running once its short-term debts are allowed for.
  context: Enough working capital lets a business pay its suppliers and staff on time and cope with unexpected costs or a slow month. Too little leads to liquidity problems, while too much, especially in stock or debtors, ties up money that could earn a return elsewhere. Working capital and the current ratio use the same two figures, one as a difference and the other as a ratio.
  example: A fictional stationery wholesaler has current assets of $210,000 and current liabilities of $130,000, so its working capital is $80,000.
  formula: Working capital = current assets − current liabilities
  topics: []
  subtopics: ['3.7', '3.5']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [current-assets, current-liabilities, working-capital-cycle, liquidity, current-ratio]

- id: working-capital-cycle
  term: Working capital cycle
  aliases: [Cash conversion cycle]
  definition: The time between a business paying out cash for materials, stock and labour and receiving cash back from customers for the goods or services they produce.
  context: The longer the cycle, the more working capital a business needs to keep going, which is why a business that holds stock for months or gives long credit can be short of cash even when its sales are strong. The cycle can be shortened by holding less stock, collecting from customers sooner and paying suppliers later. HL students can measure its stages with stock turnover in days, debtor days and creditor days.
  example: A fictional furniture maker pays for timber in January, builds and stores the tables until April, sells them on 60-day credit and is paid in June, so the cash for each batch is tied up for five months.
  topics: []
  subtopics: ['3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [working-capital, stock-turnover, debtor-days, creditor-days, cash-flow]

- id: credit-sales
  term: Credit sales
  aliases: [Sales on credit]
  definition: Sales in which the customer receives the goods or service now and pays by an agreed later date; until then, the amount is owed to the business as debtors.
  context: Credit sales count as revenue, and so towards profit, in the period they are made, but the cash comes later, which is a main reason profit and cash flow differ. Offering credit can win customers, especially other businesses, but it delays cash inflows and carries the risk that some customers never pay. In a cash flow forecast a credit sale is entered in the month the customer pays, not the month of the sale.
  example: A fictional uniform supplier sells $20,000 of uniforms to a school in August on 60 days' credit, so the cash inflow appears in October in its forecast.
  topics: []
  subtopics: ['3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [debtors, cash-inflow, debtor-days, cash-flow]

- id: overtrading
  term: Overtrading
  definition: Expanding sales or output faster than the business's working capital can support, so that it runs short of cash to pay for stock, wages and suppliers even though demand is strong.
  context: Overtrading often hits successful, growing businesses, which buy stock and take on staff to meet orders before their customers pay, so the cash gap widens with every new order. It can lead to insolvency even while sales and profits rise. The remedies are to raise long-term finance before expanding, to grow at a pace the cash allows, or to shorten the working capital cycle.
  example: After winning a contract with a national retailer, a fictional juice maker, Squeeze, triples its production but is paid 90 days after delivery, and soon cannot pay its fruit suppliers.
  topics: []
  subtopics: ['3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [working-capital, working-capital-cycle, cash-flow, liquidity]

- id: debt-factoring
  term: Debt factoring
  aliases: [Factoring, Invoice factoring]
  definition: Selling the money owed by customers to a specialist firm, the factor, which pays most of it to the business straight away and then collects the debts itself, keeping a fee.
  context: Factoring turns debtors into cash quickly, so it eases cash flow problems and lowers debtor days (HL), and the factor may also take on the work and risk of collecting. The business receives less than the full value of its sales, and some customers may read the use of a factor as a sign of financial trouble. It is a form of short-term finance, best used to bridge timing gaps.
  example: A fictional recruitment agency factors $100,000 of unpaid invoices, receives $80,000 at once and gets most of the rest, less the factor's fee, once its clients pay.
  topics: []
  subtopics: ['3.7', '3.6']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [debtors, debtor-days, short-term-finance, cash-flow]

- id: sale-and-leaseback
  term: Sale and leaseback
  definition: Selling an asset the business still needs, usually property, to another firm and then leasing it back so that the business can go on using it.
  context: Sale and leaseback releases a large sum tied up in an asset without disrupting operations, so it can pay for growth or ease a cash flow problem. In return the business takes on lease payments for years, loses any future rise in the asset's value and gives up an asset it could have offered as collateral. It combines two of the guide's sources of finance, the sale of assets and leasing.
  example: A fictional supermarket sells its warehouse to a property investor for $3 million and rents it back on a 15-year lease, using the cash to open new stores.
  topics: []
  subtopics: ['3.2', '3.7']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [sale-of-assets, leasing, collateral, liquidity]

# ---------- 3.8 Investment appraisal ----------
- id: investment-appraisal
  term: Investment appraisal
  definition: Using quantitative methods (the payback period, the average rate of return and, for HL, net present value) to judge whether an investment project is worthwhile or which of several projects to choose.
  context: Investment appraisal compares a project's capital cost with the net cash flows, or returns, it is expected to bring in over its life. The answers are only as good as the forecasts behind them, which become less reliable further into the future. Qualitative factors, such as the effect on employees, the environment, the brand and the business's objectives, also have to be weighed before a decision is made.
  example: A fictional logistics firm compares two warehouse robots by their payback periods and average rates of return before choosing which one to buy.
  topics: []
  subtopics: ['3.8']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [payback-period, average-rate-of-return, net-present-value, investment, capital-expenditure]

- id: payback-period
  term: Payback period
  aliases: [Payback]
  definition: The time it takes for the net cash flows from an investment to add up to its capital cost, usually stated in years and months.
  context: A shorter payback period means the money comes back sooner, which lowers risk and helps cash flow, so it matters most to businesses short of cash or in fast-changing markets. The usual method assumes that each year's cash arrives evenly through the year. Payback ignores everything that happens after the cost is recovered and treats later cash as worth the same as cash today, so it says little about overall profitability.
  example: A fictional printing firm spends $50,000 on a machine that brings in $20,000 a year, so after two years $10,000 is still to recover and the payback period is 2 years and 6 months.
  formula: Payback period = years before the cost is recovered + (amount still to recover ÷ net cash flow in the payback year) × 12 months
  topics: []
  subtopics: ['3.8']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [investment-appraisal, average-rate-of-return, net-present-value, time-value-of-money]

- id: average-rate-of-return
  term: Average rate of return (ARR)
  aliases: [ARR, Accounting rate of return]
  definition: The average yearly net return from an investment, after its capital cost has been covered, as a percentage of that capital cost.
  context: ARR takes in the returns over the whole life of a project, so unlike payback it measures profitability, and the percentage can be compared with the interest rate on a loan or with other projects. It ignores when the returns arrive, so a project whose returns come late scores the same as one whose returns come early. It depends on forecasts that stretch many years ahead.
  example: A fictional gym spends $100,000 on equipment that brings in total returns of $160,000 over five years, so its ARR is ((160,000 − 100,000) ÷ 5) ÷ 100,000 × 100 = 12%.
  formula: Average rate of return (ARR) = ((total returns − capital cost) ÷ years of use) ÷ capital cost × 100
  usage:
    general: Many sources use ARR for the accounting rate of return, which is based on average accounting profit after depreciation and may divide by the average investment rather than the initial cost.
    syllabus: The guide's ARR divides the average yearly net return (total returns minus capital cost, divided by years of use) by the capital cost.
  topics: []
  subtopics: ['3.8']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [investment-appraisal, payback-period, net-present-value, return-on-capital-employed]

- id: time-value-of-money
  term: Time value of money
  definition: The idea that a sum of money received today is worth more than the same sum received in the future, because money held now can be invested to earn interest, and future money is less certain and can lose value to inflation.
  context: The payback period and the average rate of return ignore it, counting a dollar received in year five the same as a dollar received today. Net present value (HL only) allows for it by discounting future returns, so that later returns count for less. The higher the interest rate, the less a future sum is worth today.
  example: Offered $1,000 now or $1,000 in three years, a business should take the money now, because at 6% a year it would grow to about $1,191 in three years.
  topics: []
  subtopics: ['3.8']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [net-present-value, present-value, discount-factor, payback-period]

- id: net-present-value
  term: Net present value (NPV)
  aliases: [NPV]
  definition: The total present value of an investment's future returns, once each has been discounted, minus the project's original cost, which shows whether the project adds value in today's money.
  context: A positive NPV means the discounted returns are worth more than the cost, so the project is worth considering, while a negative NPV means it would not earn the rate used for discounting. Unlike payback and ARR, NPV allows for the time value of money, but its result depends heavily on the discount rate chosen and it is harder to calculate and to explain. A discount table is provided in the examination when it is needed.
  example: A fictional bakery considers a $20,000 oven that will return $8,000 a year for three years; at 10% the present values are $7,272.80, $6,611.20 and $6,010.40, so the NPV is −$105.60 and the oven does not pay at that rate.
  formula: Net present value (NPV) = ∑ present values of return − original cost
  topics: []
  subtopics: ['3.8']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [present-value, discount-factor, time-value-of-money, investment-appraisal, average-rate-of-return]

- id: present-value
  term: Present value
  aliases: [Discounting]
  definition: What a sum of money to be received in the future is worth today, found by multiplying it by the discount factor for its year and the chosen rate.
  context: Discounting works like compound interest in reverse, asking how much would have to be invested today, at the chosen rate, to grow into the future sum. The further away the return and the higher the rate, the smaller its present value. Adding the present values of all the returns and taking away the original cost gives the net present value.
  example: With the 8% discount factor for year 3, 0.7938, a return of $10,000 expected in three years has a present value of $7,938.
  formula: Present value = future return × discount factor
  topics: []
  subtopics: ['3.8']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [discount-factor, net-present-value, time-value-of-money]

- id: discount-factor
  term: Discount factor
  aliases: [Discount table]
  definition: The number by which a future sum is multiplied to find its present value, which depends on the discount rate and on how many years away the sum is.
  context: The guide's discount table gives factors to four decimal places for rates of 4%, 6%, 8%, 10% and 20% over years 1 to 10, and a table is supplied in the examination when needed, so the factors are read from it rather than calculated. The higher the rate and the later the year, the smaller the factor. The rate chosen often reflects the interest rate the business pays on borrowing or the return it requires.
  example: At a 10% discount rate the factor for year 2 is 0.8264, so $5,000 received in two years is worth $4,132 today.
  formula: Discount factor = 1 ÷ (1 + r)ⁿ, where r is the discount rate as a decimal and n is the number of years
  topics: []
  subtopics: ['3.8']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [present-value, net-present-value, time-value-of-money]

# ---------- 3.9 Budgets (HL only) ----------
- id: budget
  term: Budget
  definition: A financial plan, agreed in advance, that sets out the revenue a business or one of its departments expects to earn and the costs it expects to incur over a future period.
  context: Budgets turn objectives into targets, share out resources between departments, help coordinate their plans and give a benchmark for control, since comparing actual results with the budget produces variances. Constructing a budget usually starts from the organization's objectives and its sales forecast, then sets expected revenues and costs line by line, often based on the previous year's figures adjusted for expected changes. A budget that is unrealistic, or imposed without consulting the people who must meet it, can demotivate staff.
  example: A fictional hotel's restaurant is given a budget of $500,000 in sales revenue and $380,000 in costs for the coming year, broken down month by month.
  topics: []
  subtopics: ['3.9']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [variance, budget-holder, cost-centre, profit-centre, cash-flow-forecast]

- id: budget-holder
  term: Budget holder
  definition: The manager responsible for a particular budget, who is accountable for keeping spending within it and for meeting any revenue targets in it.
  context: Making a named manager responsible for each budget, often for a cost centre or profit centre, delegates authority and makes it clear who must explain each variance. Budget holders who help set their own budgets are usually more committed to meeting them. Holding people to account for costs they cannot control, such as charges set by head office, can cause frustration.
  example: The head of a fictional college's science department is the budget holder for its $40,000 annual budget for equipment and materials.
  topics: []
  subtopics: ['3.9']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [budget, cost-centre, profit-centre, variance]

- id: cost-centre
  term: Cost centre
  definition: A part of an organization, such as a department, a site, a machine or a service team, to which costs can be charged but which does not earn revenue of its own.
  context: Treating departments such as human resources, IT, maintenance or administration as cost centres lets managers see what each one costs and control its spending against a budget. Because a cost centre earns no revenue, it is judged on how well it controls costs, not on profit. Sharing indirect costs between cost centres can be arbitrary, which may cause disputes between departments.
  example: A fictional hospital treats its laundry service as a cost centre, recording the wages, detergent and energy the laundry uses and comparing them each month with its budget.
  topics: []
  subtopics: ['3.9']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [profit-centre, budget, budget-holder, indirect-cost]

- id: profit-centre
  term: Profit centre
  definition: A part of an organization, such as a branch, a division or a product range, that is responsible for both its own revenue and its own costs, so that the profit it makes can be measured separately.
  context: Profit centres show which parts of a business make money, which helps decisions about where to invest and what to close, and giving their managers responsibility for profit can motivate them. They may compete with one another at the expense of the whole business, and their profit depends partly on how shared overheads are divided between them. The difference from a cost centre is revenue, since a cost centre only incurs costs.
  example: A fictional bookshop chain treats each of its six shops as a profit centre and compares their profits every quarter.
  topics: []
  subtopics: ['3.9']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [cost-centre, budget, budget-holder, profit]

- id: variance
  term: Variance
  aliases: [Variance analysis]
  definition: The difference between a budgeted figure and the actual figure for the same item and period.
  context: In the guide's budget layout each line shows the budgeted figure, the actual figure and the variance, marked [F] for favourable or [A] for adverse, so a variance is judged by its effect on profit rather than by its sign. Variance analysis asks why each difference arose, such as a price change, wasted materials or higher demand, so that managers can act on it. Small variances may not be worth investigating, while large or repeated ones may show that the budget itself was unrealistic.
  example: A fictional café budgeted $2,000 for milk in June but spent $2,300, a variance of $300 [A].
  formula: Variance = actual figure − budgeted figure, recorded as an amount labelled favourable [F] or adverse [A]
  topics: []
  subtopics: ['3.9']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [favourable-variance, adverse-variance, budget, budget-holder]

- id: favourable-variance
  term: Favourable variance
  definition: A variance that makes profit higher than budgeted, because revenue is above budget or costs are below it.
  context: A favourable variance is usually good news, but not always, since costs below budget may mean cheaper, lower-quality materials or maintenance put off, and sales above budget may only show that the budget was set too low. Managers should ask why it happened before rewarding it. It is marked [F] in the guide's layout.
  example: A fictional cinema budgeted $50,000 of ticket sales for a month and took $56,000, a favourable variance of $6,000.
  topics: []
  subtopics: ['3.9']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [variance, adverse-variance, budget]

- id: adverse-variance
  term: Adverse variance
  aliases: [Unfavourable variance]
  definition: A variance that makes profit lower than budgeted, because revenue is below budget or costs are above it.
  context: An adverse variance signals a problem to investigate, such as falling sales, rising input prices or waste, but its cause may lie outside the budget holder's control, such as a rise in energy prices. Repeated adverse variances may show that the budget was unrealistic rather than that managers performed badly. It is marked [A] in the guide's layout.
  example: A fictional cinema budgeted $8,000 for staff wages in a month but paid $9,500 because of extra overtime, an adverse variance of $1,500.
  topics: []
  subtopics: ['3.9']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [variance, favourable-variance, budget, budget-holder]

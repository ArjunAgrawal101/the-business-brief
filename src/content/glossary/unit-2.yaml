# Glossary: unit 2, human resource management (subtopics 2.1 to 2.7).
# Definitions are the platform's own wording, checked against the IB guide (pp. 25 to 27).
# Terms already defined in leadership.yaml are reused, not repeated: management,
# leadership, functions-of-management, the five leadership styles,
# scientific-decision-making, intuitive-decision-making, labour-turnover and
# force-field-analysis.

# ---------- 2.1 Introduction to human resource management ----------

- id: human-resource-management
  term: Human resource management
  aliases: [HRM, HR]
  level: SL/HL
  definition: "Managing the people an organization employs so that they help it reach its objectives: planning the workforce, recruiting and training staff, rewarding and looking after them, and managing their departure."
  context: HRM is a role for the whole organization, not only for an HR department, since line managers carry out much of it every day. Because people are both a major cost and the source of most ideas and service quality, HR decisions shape a business's costs, productivity and culture. Every plan for marketing, finance or operations depends on having the right people to carry it out.
  example: When a delivery firm plans to open a new depot, its HR team works out how many drivers and warehouse staff it will need, where to find them, how to train them and what to pay them.
  usage:
    general: In everyday speech, HR usually means the department that handles hiring, contracts and payroll.
    syllabus: In the course, HRM is the management of people as a whole, much of which is done by managers in every department.
  topics: []
  subtopics: ['2.1']
  category: people
  provenance: subject-knowledge
  related: [human-resource-planning, recruitment, change-management, management]

- id: human-resource-planning
  term: Human resource planning
  aliases: [Workforce planning, HR planning]
  level: SL/HL
  definition: Forecasting how many employees, with which skills, an organization will need, comparing this with the workforce it has, and planning how to close the gap by recruiting, training, redeploying or reducing staff.
  context: Planning starts from the organization's objectives, since a plan to expand, automate or relocate changes the workforce it needs. It is shaped by internal factors, such as the labour budget, working patterns like flexi-time and new technology, and by external factors, such as demographic change, labour mobility, immigration, the gig economy and employment law. A plan that ignores these risks shortages of key skills, or paying for staff who are no longer needed.
  example: A hospital that expects more elderly patients over the next five years starts training more nurses in elderly care now, because qualified staff take years to develop.
  topics: []
  subtopics: ['2.1']
  category: people
  provenance: subject-knowledge
  related: [human-resource-management, demographic-change, labour-mobility, gig-economy, recruitment]

- id: recruitment
  term: Recruitment
  aliases: [Recruitment and selection]
  level: SL/HL
  definition: The process of filling a vacancy, from deciding what the job needs and attracting suitable applicants to choosing the best of them (selection) and making an offer.
  context: Recruitment is part of the role of HRM for every student. The choice between internal and external recruitment, and the methods used to find and choose applicants, are HL-only content in 2.4. Recruitment mistakes are costly, since the wrong appointment brings poor performance, extra training and often another round of recruiting.
  example: A café chain that needs a new manager writes a job description and person specification, advertises the post, shortlists five applicants and interviews them before choosing one.
  topics: []
  subtopics: ['2.1', '2.4']
  category: people
  provenance: subject-knowledge
  related: [human-resource-planning, internal-recruitment, external-recruitment, job-description, induction]

- id: demographic-change
  term: Demographic change
  level: SL/HL
  definition: A change in the size or make-up of a population, such as its age structure, birth rate, life expectancy or the number of people moving in and out, which alters the supply of workers and the demand for products.
  context: For HR planning, the main effect is on the supply of labour. An ageing population brings more retirements and fewer young people entering work, so a business may need to keep and retrain older staff or recruit from further afield, while a young, growing population offers a large pool of entry-level workers. Demographic change is an external factor, so a business cannot control it, only plan for it.
  example: A construction firm whose skilled bricklayers are mostly over fifty starts an apprenticeship scheme, because too few young people are entering the trade to replace them.
  topics: []
  subtopics: ['2.1']
  category: people
  provenance: subject-knowledge
  related: [human-resource-planning, immigration, labour-mobility]

- id: labour-mobility
  term: Labour mobility
  aliases: [Mobility of labour]
  level: SL/HL
  definition: How easily workers can move between jobs, either into a different occupation (occupational mobility) or to a different place (geographical mobility).
  context: High mobility makes it easier for a business to fill vacancies, but also easier for its staff to leave for rivals. Occupational mobility depends on transferable skills and the chance to retrain, while geographical mobility is limited by housing costs, family ties, language and immigration rules. Remote working has changed geographical mobility, since some jobs no longer require anyone to move.
  example: A software company that cannot find enough testers in its home city, where rents are high, recruits people who work remotely from other regions.
  topics: []
  subtopics: ['2.1']
  category: people
  provenance: subject-knowledge
  related: [human-resource-planning, immigration, demographic-change, flexible-working]

- id: immigration
  term: Immigration
  level: SL/HL
  definition: People moving into a country to live and work, which adds to its supply of labour and can bring skills that are in short supply.
  context: Immigration helps businesses fill vacancies, especially in sectors with skills shortages or seasonal peaks, and adds to the diversity of the workforce. It can bring costs, such as work permits, language training and checking foreign qualifications, and a change in immigration law can cut off a source of labour quickly. Emigration, people leaving a country, has the opposite effect and can drain away skilled workers.
  example: A fruit farm that relies on seasonal pickers from abroad has to raise wages and invest in picking machinery when a change in visa rules cuts the number who can come.
  topics: []
  subtopics: ['2.1']
  category: people
  provenance: subject-knowledge
  related: [demographic-change, labour-mobility, human-resource-planning]

- id: flexible-working
  term: Flexible working
  aliases: [Flexible working practices]
  level: SL/HL
  definition: Working arrangements that vary when, where or how much people work, such as flexi-time, part-time work, job sharing, compressed hours, remote or hybrid working and temporary contracts.
  context: Flexible working helps a business match staffing to demand, save on office space and attract people who cannot work fixed full-time hours, such as parents, carers or older workers, and employees gain a better balance between work and home. The costs fall on coordination and communication, since teams may rarely be together and managers must judge output rather than presence. Rising expectations of flexibility are themselves a factor in HR planning.
  example: An accountancy firm lets staff work from home three days a week and choose their hours outside a core meeting time, and finds it can recruit from a much wider area.
  topics: []
  subtopics: ['2.1']
  category: people
  provenance: subject-knowledge
  related: [flexi-time, gig-economy, labour-mobility, flexible-labour-force]

- id: flexi-time
  term: Flexi-time
  aliases: [Flexitime, Flextime]
  level: SL/HL
  definition: An arrangement in which employees choose when to start and finish work, within limits, provided they are present during agreed core hours and work the total hours required.
  context: Flexi-time is one form of flexible working. It can raise motivation and cut absence and lateness, because staff can fit work around the rest of their lives, and it can extend the hours a business is staffed. It suits office and knowledge work better than jobs tied to a production line or fixed opening hours, and it needs a fair way of recording hours.
  example: At a fictional insurer, Northgate Mutual, staff must be at work between 10:00 and 15:00 but can start from 07:00 and leave once they have worked seven and a half hours.
  topics: []
  subtopics: ['2.1']
  category: people
  provenance: subject-knowledge
  related: [flexible-working, human-resource-planning, motivation]

- id: gig-economy
  term: Gig economy
  level: SL/HL
  definition: A labour market in which many people do short-term, task-by-task work, often found and paid through digital platforms, usually as self-employed contractors rather than as employees.
  context: For a business, gig workers turn a fixed labour cost into a variable one and make it easy to scale up and down with demand. For workers, gig work offers freedom over when to work but usually no guaranteed hours, sick pay, holiday pay or pension. HR planning must weigh these savings against weaker loyalty, less control over quality, and the risk of disputes or new laws about workers' employment status.
  example: A food delivery app relies on self-employed riders who log on when they choose and are paid for each delivery, instead of employing riders on fixed shifts.
  topics: []
  subtopics: ['2.1']
  category: people
  provenance: subject-knowledge
  related: [flexible-working, contractual-fringe, flexible-labour-force, human-resource-planning]

- id: resistance-to-change
  term: Resistance to change
  level: SL/HL
  definition: Employees' reluctance to accept, or active opposition to, a change in how they work, such as new technology, a restructuring or a move to a new site.
  context: Common reasons are fear of the unknown, worry about job security or pay, the loss of status, skills or familiar routines, distrust of management, poor communication and not being consulted. Resistance is not always irrational, since staff may see real flaws in a plan. It matters because it can delay change, lower morale and productivity and lead people to leave, so HR strategies aim to reduce it.
  example: Warehouse staff resist a new scanning system because they fear it will be used to monitor them and cut jobs, and because nobody has explained why it is needed.
  topics: []
  subtopics: ['2.1']
  category: people
  provenance: subject-knowledge
  related: [change-management, force-field-analysis, redundancy]

- id: change-management
  term: Change management
  aliases: [Managing change]
  level: SL/HL
  definition: Planning and leading a change so that people accept it and its harmful effects on them are kept small, mainly through communication, involvement, training and support.
  context: HR strategies to reduce resistance include explaining the reasons for change early, consulting and involving staff, training them in new skills, offering support such as counselling, retraining or redeployment, negotiating incentives or guarantees, and introducing change in stages or as a pilot. A widely taught list of approaches, from Kotter and Schlesinger, runs from education and participation to coercion, which is quick but breeds resentment. At HL, force field analysis helps to weigh the forces for and against a change.
  example: Before moving to an open-plan office, a publisher asks each team to help design its own area, arranges visits to the new site and keeps some home working, and few staff object to the move.
  topics: []
  subtopics: ['2.1']
  category: people
  provenance: subject-knowledge
  related: [resistance-to-change, force-field-analysis, human-resource-management, redundancy]

- id: natural-wastage
  term: Natural wastage
  aliases: [Attrition]
  level: SL/HL
  definition: The fall in the number of employees as people leave of their own accord, through resignation or retirement, and are not replaced.
  context: Natural wastage lets an organization reduce its workforce without redundancies, often combined with a freeze on recruitment, which makes it a gentler way to manage a surplus of staff in a workforce plan. It is slow and hard to predict, and the organization cannot choose who leaves, so its most skilled people may go first while the remaining staff carry a heavier load. At HL, the rate at which people leave is measured as labour turnover.
  example: A bank that needs 40 fewer branch staff over three years stops recruiting and lets resignations and retirements reduce its numbers, retraining some cashiers for its call centre instead of making anyone redundant.
  topics: []
  subtopics: ['2.1']
  category: people
  provenance: subject-knowledge
  related: [human-resource-planning, redundancy, labour-turnover, change-management]

- id: redundancy
  term: Redundancy
  level: SL/HL
  definition: Dismissal because an employee's job is no longer needed, for example after falling demand, automation, relocation or restructuring, rather than because of anything the employee has done.
  context: Redundancy differs from dismissal for misconduct or poor performance, and redundant employees often have a legal right to redundancy pay. HR can soften its impact through voluntary redundancy, early retirement, redeployment, retraining and help in finding new work. In industrial relations (2.7, HL), threatening redundancies is one approach an employer may use to put pressure on employees in a dispute.
  example: After moving most of its services online, a bank closes three branches, makes twelve cashiers redundant and retrains others to work in its customer contact centre.
  topics: []
  subtopics: ['2.1', '2.7']
  category: people
  provenance: subject-knowledge
  related: [human-resource-planning, change-management, resistance-to-change, industrial-relations]

# ---------- 2.2 Organizational structure ----------

- id: organizational-structure
  term: Organizational structure
  level: SL/HL
  definition: The way an organization arranges its jobs, departments and lines of authority, which sets who reports to whom, who makes which decisions and how information flows.
  context: A structure is described with terms such as levels of hierarchy, span of control and chain of command, and shown on an organization chart. Structures can be tall or flat, centralized or decentralized, and grouped by function, product or region. The right structure depends on the organization's size, strategy, culture and how fast its environment is changing.
  example: A start-up of six people needs little formal structure, but as it grows to sixty it creates departments, appoints managers and decides which decisions stay with the founders.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [organization-chart, levels-of-hierarchy, span-of-control, chain-of-command, centralization]

- id: organization-chart
  term: Organization chart
  aliases: [Organizational chart, Organigram]
  level: SL/HL
  definition: A diagram of an organization's formal structure, showing its positions or departments, the lines of authority between them and the levels of the hierarchy.
  context: A chart shows each manager's span of control, the chain of command and whether the structure is tall or flat, or grouped by function, product or region. It shows formal relationships only, so informal networks and the way work really gets done may look quite different. The guide sets organization charts at AO4 as well as AO2, so students may be asked to construct one, not only to interpret it.
  example: A hotel's chart shows the general manager at the top, four department heads below, and the supervisors and staff of each department beneath them.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [organizational-structure, flat-structure, tall-structure, functional-structure]

- id: delegation
  term: Delegation
  level: SL/HL
  definition: Passing the authority to carry out a task or make a decision to someone lower in the hierarchy, while the manager who delegates remains accountable for the result.
  context: Delegation frees managers' time, develops subordinates and can motivate them. It needs trust, clear instructions and staff with the right skills, and delegating without support can overload people. It is often confused with decentralization, which spreads decision-making power across a whole organization, and with empowerment, which gives employees lasting authority over their own work.
  example: A store manager delegates the weekly staff rota to a senior sales assistant but checks it before it is posted.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [span-of-control, decentralization, empowerment, chain-of-command]

- id: span-of-control
  term: Span of control
  level: SL/HL
  definition: The number of subordinates who report directly to one manager.
  context: A wide span suits routine work and skilled, self-motivated staff and goes with a flatter structure. A narrow span allows close supervision and support, suits complex or high-risk work and goes with a taller structure. Spans that are too wide overload managers, while spans that are too narrow add cost and slow decisions.
  example: A call-centre supervisor manages twenty advisers doing similar work, while a research director manages four senior scientists on complex projects.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [levels-of-hierarchy, flat-structure, tall-structure, delegation]

- id: levels-of-hierarchy
  term: Levels of hierarchy
  aliases: [Levels of the hierarchy, Layers of management]
  level: SL/HL
  definition: The number of layers of authority in an organization, from the most senior managers down to the employees with no one reporting to them.
  context: More levels mean a taller structure, with narrower spans of control, longer chains of command and more steps for promotion. Fewer levels mean a flatter structure with faster communication but heavier workloads for each manager. Removing levels is called delayering.
  example: A small software firm has three levels (founders, team leads and developers), while a national bank has eight levels between its chief executive and its branch cashiers.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [span-of-control, chain-of-command, tall-structure, delayering]

- id: chain-of-command
  term: Chain of command
  level: SL/HL
  definition: The formal line of authority through which instructions pass down an organization and accountability passes up, from the top of the hierarchy to the bottom.
  context: A clear chain of command shows each person whom they report to and who can give them instructions. Long chains, typical of tall structures, slow decisions and distort messages as they pass through many people, while short chains speed communication. In a matrix structure an employee has two lines of report, which breaks the traditional single chain.
  example: A sales assistant's request to give a refund above the usual limit goes to the supervisor, then the store manager, then the regional manager before it is approved.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [levels-of-hierarchy, span-of-control, delegation, formal-communication]

- id: bureaucracy
  term: Bureaucracy
  level: SL/HL
  definition: A way of organizing based on formal rules, written procedures, clearly defined roles and a hierarchy of authority, in which decisions follow set approval processes.
  context: Bureaucracy brings consistency, fairness, clear accountability and control, which suits large organizations and work where mistakes are costly. Its drawbacks are slow decisions, inflexibility and a culture that discourages initiative. It tends to grow with an organization's size and its number of levels of hierarchy.
  example: A government licensing office follows the same written procedure for every application, which is fair and predictable but means even simple cases take weeks.
  usage:
    general: In everyday speech, bureaucracy is a criticism, meaning red tape and pointless paperwork.
    syllabus: In the course it is a neutral description of a rule-based, hierarchical way of organizing, with real strengths as well as weaknesses.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [centralization, levels-of-hierarchy, chain-of-command, role-culture]

- id: centralization
  term: Centralization
  level: SL/HL
  definition: Keeping decision-making authority with a small group of senior managers, usually at head office, rather than passing it down to lower levels or local units.
  context: Centralization gives consistent decisions and a uniform brand, tight control of costs and quick action in a crisis, since few people decide. Its drawbacks are slow responses to local conditions, overloaded senior managers and less motivated staff lower down. Most organizations centralize some decisions, such as finance and branding, and decentralize others.
  example: A fast-food chain decides its menu, prices and restaurant design at head office, so every outlet looks and tastes the same.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [decentralization, bureaucracy, chain-of-command, organizational-structure]

- id: decentralization
  term: Decentralization
  level: SL/HL
  definition: Passing decision-making authority from the centre to lower levels of the hierarchy, or to regional and branch managers.
  context: Decentralization lets decisions be made close to customers and problems, speeds up responses, develops managers and can motivate staff. It risks inconsistent decisions, duplicated effort and weaker central control. It differs from delegation, which passes particular tasks to individuals, because decentralization is a feature of the whole structure.
  example: A hotel group lets each hotel manager set room prices and local promotions, because managers know their own market and competitors best.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [centralization, delegation, regional-structure, empowerment]

- id: delayering
  term: Delayering
  level: SL/HL
  definition: Removing one or more levels of hierarchy, usually layers of middle management, to make a structure flatter.
  context: Delayering cuts salary costs, shortens the chain of command and can speed up decisions and empower the staff who remain. It can also overload the managers left behind, remove steps on the promotion ladder and lower morale, especially when it brings redundancies. It is often a response to cost pressure, or to technology that lets fewer managers coordinate more people.
  example: A retailer removes its area manager layer, so store managers report straight to regional directors, and saves the cost of forty salaries.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [levels-of-hierarchy, flat-structure, span-of-control, redundancy]

- id: matrix-structure
  term: Matrix structure
  aliases: [Matrix organization]
  level: SL/HL
  definition: A structure in which employees report to two managers at once, usually the manager of their function, such as marketing or engineering, and the manager of the project or product they are working on.
  context: A matrix brings people with different skills together around projects while keeping their functional expertise, which helps innovation and makes flexible use of staff. Its drawbacks are confusion and conflict over priorities, divided loyalty and slower decisions when the two managers disagree. It is closely linked to project-based organization and to Handy's task culture.
  example: An engineer at a car maker answers to the head of engineering on technical standards and to the manager of a new electric model project on deadlines and budget.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [project-based-organization, functional-structure, chain-of-command, task-culture]

- id: flat-structure
  term: Flat structure
  aliases: [Horizontal structure, Flat organization]
  level: SL/HL
  definition: An organizational structure with few levels of hierarchy and wide spans of control.
  context: Flat structures give fast communication, lower management costs and more responsibility for each employee, which can motivate. Managers may be overloaded, supervision is lighter and there are fewer chances of promotion. They suit smaller organizations and work that needs speed and initiative, and delayering moves an organization towards one.
  example: A design agency of forty people has just two levels, the partners and the designers, who organize much of their own work.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [tall-structure, span-of-control, delayering, levels-of-hierarchy]

- id: tall-structure
  term: Tall structure
  aliases: [Vertical structure, Tall organization]
  level: SL/HL
  definition: An organizational structure with many levels of hierarchy and narrow spans of control.
  context: Tall structures allow close supervision, clear roles and a ladder of promotion. Communication is slower and messages can be distorted along the long chain of command, management costs are higher and staff at the bottom may feel far from decisions. They are common in large, traditional organizations such as armed forces, banks and government departments.
  example: A national railway operator has seven management levels between its chief executive and its station staff, so an idea from a station can take months to be approved.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [flat-structure, span-of-control, chain-of-command, bureaucracy]

- id: functional-structure
  term: Functional structure
  aliases: [Organization by function, Structure by function]
  level: SL/HL
  definition: A structure that groups employees into departments by the work they do, such as marketing, finance, operations and human resources.
  context: Grouping specialists together builds expertise, avoids duplication and gives clear career paths within each function. Departments can become inward-looking, communicate poorly with each other and put their own goals before the organization's. It suits a business with one main product or market.
  example: A small furniture maker has a production department, a sales department and an office that handles finance and HR, each led by a manager who reports to the owner.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [product-structure, regional-structure, matrix-structure, organization-chart]

- id: product-structure
  term: Product-based structure
  aliases: [Organization by product, Structure by product, Product structure]
  level: SL/HL
  definition: A structure that divides an organization into units by product or product range, each usually with its own functional staff.
  context: Each division can focus on its own customers, competitors and results, which makes it easier to see which products perform well. Functions are duplicated across divisions, which adds cost, and divisions may compete with each other for resources. It suits a business with distinct product ranges.
  example: An electronics group has separate divisions for televisions, phones and home appliances, each with its own marketing and production teams.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [functional-structure, regional-structure, decentralization, organization-chart]

- id: regional-structure
  term: Regional structure
  aliases: [Organization by region, Structure by region, Geographical structure]
  level: SL/HL
  definition: A structure that divides an organization into units by geographical area, such as countries or regions, each responsible for its own market.
  context: Regional units can adapt products, prices and marketing to local tastes, laws and cultures, and managers on the spot can respond quickly. Functions are duplicated in each region, and head office may lose control and consistency. It suits businesses that sell in many countries, such as multinational companies.
  example: A cosmetics company runs separate European, Asian and Latin American divisions, each adapting the range to local skin types and regulations.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [product-structure, functional-structure, decentralization, organization-chart]

- id: project-based-organization
  term: Project-based organization
  aliases: [Project-based structure]
  level: HL
  definition: A way of organizing in which work is built around projects, each carried out by a temporary team drawn from different functions that disbands when the project is finished.
  context: Each project team has a clear goal, budget and deadline, and people move from project to project instead of staying in one department. This makes the organization flexible and focused on results and can encourage creativity. People may lack a permanent base or a clear career path, and projects may compete for the same staff and resources. It is close to a matrix structure and to Handy's task culture.
  example: A consultancy forms a new team of analysts, designers and engineers for each client contract, and reassigns them when the contract ends.
  topics: []
  subtopics: ['2.2']
  category: people
  provenance: subject-knowledge
  related: [matrix-structure, task-culture, shamrock-organization, functional-structure]

- id: shamrock-organization
  term: Shamrock Organization
  aliases: [Handy's Shamrock Organization, Shamrock model]
  level: HL
  definition: "Charles Handy's model of an organization made of three groups of workers, like the three leaves of a shamrock: a professional core of permanent key staff, a contractual fringe of outside contractors and a flexible labour force of temporary and part-time workers."
  context: Handy argued that organizations would keep only a small core of essential people on permanent contracts and buy in the rest of their work as needed. This lowers fixed labour costs, makes it easier to respond to changes in demand and lets the business focus on what it does best. The risks are weaker loyalty and commitment outside the core, harder communication and quality control, and job insecurity for many workers.
  example: A fictional airline, Skylark Air, employs its pilots and senior managers directly, contracts out catering and aircraft cleaning, and hires temporary cabin crew for the summer peak.
  topics: []
  subtopics: ['2.2']
  category: theory
  provenance: subject-knowledge
  related: [professional-core, contractual-fringe, flexible-labour-force, project-based-organization, gig-economy]

- id: professional-core
  term: Professional core
  aliases: [Core workers, Core workforce]
  level: HL
  definition: In Handy's Shamrock Organization, the permanent, highly skilled staff, such as managers, professionals and technicians, whose knowledge and skills are essential to the organization.
  context: The core is kept small but is well paid and well treated, because its members would be hard to replace. They are expected to be highly committed, to work long hours when needed and to take on wide responsibilities. Motivating and keeping them is a priority, since losing them means losing the organization's knowledge.
  example: At a games studio, the creative directors and lead programmers are permanent core staff, while artwork and testing are bought in from outside.
  topics: []
  subtopics: ['2.2']
  category: theory
  provenance: subject-knowledge
  related: [shamrock-organization, contractual-fringe, flexible-labour-force]

- id: contractual-fringe
  term: Contractual fringe
  level: HL
  definition: In Handy's Shamrock Organization, the outside individuals and firms contracted to do work that is not central to the organization, paid for results rather than for the time they spend.
  context: Contracting out work such as cleaning, IT support, catering or payroll lets a business buy specialist skills when it needs them and turns fixed costs into variable ones. The business has less control over quality and timing, and contractors owe it little loyalty. The idea is closely linked to outsourcing (5.4) and to the gig economy.
  example: A university pays one outside firm a fee to run its cafeterias and another to maintain its computer network.
  topics: []
  subtopics: ['2.2']
  category: theory
  provenance: subject-knowledge
  related: [shamrock-organization, professional-core, flexible-labour-force, gig-economy]

- id: flexible-labour-force
  term: Flexible labour force
  aliases: [Flexible workforce]
  level: HL
  definition: In Handy's Shamrock Organization, the part-time, temporary and seasonal workers that an organization takes on when demand requires and lets go when it falls.
  context: A flexible labour force keeps labour costs in line with demand. These workers usually have lower pay, fewer benefits and less security than the core, so their commitment may be lower, and frequent changes of staff add to recruitment and training costs. Training them well still matters, since they often deal directly with customers.
  example: A toy shop doubles its staff with temporary sales assistants in the weeks before the holiday season.
  topics: []
  subtopics: ['2.2']
  category: theory
  provenance: subject-knowledge
  related: [shamrock-organization, flexible-working, professional-core, contractual-fringe]

# ---------- 2.4 Motivation and demotivation ----------

- id: motivation
  term: Motivation
  level: SL/HL
  definition: The drive that makes a person put effort into reaching a goal. It may come from the work itself (intrinsic motivation) or from rewards and pressures outside it (extrinsic motivation).
  context: Motivated employees tend to work harder and more carefully, stay longer and take fewer days off, which raises productivity and lowers costs. Motivation theories try to explain what drives people, and businesses act on them through financial and non-financial rewards. Motivation is often confused with job satisfaction, but a satisfied employee is content, not necessarily driven to work harder.
  example: Two shop assistants earn the same, but one stays late to help a customer because she enjoys solving problems and hopes to be promoted.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [demotivation, intrinsic-motivation, extrinsic-motivation, maslows-hierarchy-of-needs, herzbergs-motivation-hygiene-theory]

- id: demotivation
  term: Demotivation
  level: SL/HL
  definition: A fall in an employee's drive to work well, shown in less effort, poorer quality, more absence and lateness, and a greater wish to leave.
  context: Common causes are pay that seems unfair, poor management, boring or repetitive work, lack of recognition, job insecurity and changes imposed without consultation. Demotivation is costly because it lowers productivity and quality and raises absence and the number of staff who leave. Herzberg's theory helps to explain it, since poor hygiene factors cause dissatisfaction even when the work itself is interesting.
  example: After a new manager cancels team meetings and starts timing every break, a call centre sees more sick days and several experienced advisers resign.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [motivation, hygiene-factors, labour-turnover, equity-theory]

- id: intrinsic-motivation
  term: Intrinsic motivation
  level: SL/HL
  definition: Motivation that comes from the work itself, because it is interesting, enjoyable, challenging or meaningful, rather than from a reward attached to it.
  context: Intrinsic motivation tends to last and to support creativity and quality. Herzberg's motivators, job enrichment, empowerment and purpose all aim to build it, and at HL Deci and Ryan's self-determination theory explains how meeting the needs for autonomy, competence and relatedness strengthens it. Rewards that feel controlling can weaken it.
  example: A volunteer football coach spends her evenings planning sessions, unpaid, because she enjoys seeing her team improve.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [extrinsic-motivation, motivators, self-determination-theory, job-enrichment]

- id: extrinsic-motivation
  term: Extrinsic motivation
  level: SL/HL
  definition: Motivation that comes from outside the work, from rewards such as pay, bonuses, praise and promotion, or from the wish to avoid a penalty.
  context: Financial rewards work mainly through extrinsic motivation and can change behaviour quickly, especially for routine tasks with measurable output. Their effect may fade once a reward is received or taken for granted, and they can lead people to chase the measure rather than the purpose behind it. Taylor's scientific management assumed that workers are motivated mainly in this way.
  example: A delivery driver takes on extra shifts in December because they are paid at double the normal rate.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [intrinsic-motivation, financial-rewards, scientific-management, performance-related-pay]

- id: scientific-management
  term: Scientific management
  aliases: [Taylorism, Taylor's scientific management]
  level: SL/HL
  definition: Frederick Taylor's theory that every job has one most efficient method, found by observing, timing and measuring the work. It assumes that workers are motivated mainly by money, so pay should be tied to output.
  context: Taylor broke jobs into small, simple tasks, chose and trained workers for each, set output targets from time-and-motion studies and paid by piece rate, with managers planning the work and workers carrying it out. The approach raised productivity in factories but treated workers like parts of a machine, ignoring their social and psychological needs, and led to dull, deskilled work and conflict. It should not be confused with scientific decision-making in 2.3 (HL), which means making decisions from data and logic.
  example: A sandwich factory times each step of assembly, sets an hourly target and pays workers extra for every sandwich they make above it.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [piece-rate, extrinsic-motivation, maslows-hierarchy-of-needs, scientific-decision-making]

- id: maslows-hierarchy-of-needs
  term: Maslow's hierarchy of needs
  aliases: [Hierarchy of needs]
  level: SL/HL
  definition: Abraham Maslow's theory that people are motivated by five levels of need, rising from physiological needs through safety, social (love and belonging) and esteem needs to self-actualization, and that a higher need motivates only once the lower ones are largely met.
  context: At work, pay meets physiological needs, job security and safe conditions meet safety needs, teamwork meets social needs, recognition and promotion meet esteem needs, and challenging, creative work allows self-actualization, reaching one's full potential. A need that is met no longer motivates, so managers must judge which level each employee has reached. Critics note that people do not always move up the levels in order, that needs are hard to observe or measure, and that the order may differ between cultures.
  example: A graduate on a secure, well-paid contract is no longer driven by extra pay alone but responds strongly to being given her own client and a new job title.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [herzbergs-motivation-hygiene-theory, mcclellands-acquired-needs-theory, scientific-management, motivation]

- id: herzbergs-motivation-hygiene-theory
  term: Herzberg's motivation-hygiene theory
  aliases: [Two-factor theory, Motivation-hygiene theory]
  level: SL/HL
  definition: Frederick Herzberg's theory that the factors that cause job dissatisfaction (hygiene factors) are different from those that cause satisfaction and motivation (motivators), so removing dissatisfaction does not on its own motivate people.
  context: Hygiene factors, such as pay, working conditions, supervision and company policy, must be good enough to prevent dissatisfaction. Motivators, such as achievement, recognition, responsibility, the work itself and advancement, come from the content of the job and are what actually motivate. The theory supports job enrichment; critics point to the narrow sample in the original study, of engineers and accountants, and argue that pay does motivate some people.
  example: A software firm raises salaries and complaints about pay stop, but productivity rises only when developers are given ownership of whole features and credit for launching them.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [hygiene-factors, motivators, job-enrichment, maslows-hierarchy-of-needs]

- id: hygiene-factors
  term: Hygiene factors
  aliases: [Maintenance factors]
  level: SL/HL
  definition: In Herzberg's theory, the factors surrounding a job, such as pay, working conditions, job security, supervision, relationships at work and company policy, that cause dissatisfaction when they are poor but do not motivate when they are good.
  context: Getting hygiene factors right prevents dissatisfaction, and the absence, complaints and resignations that follow it. Herzberg classed pay as a hygiene factor, which is why a pay rise may end complaints without making people work harder for long. Improving hygiene factors removes a source of dissatisfaction; it does not create motivation.
  example: Staff in a hot, noisy warehouse complain constantly until air conditioning and better ear protection arrive, after which the complaints stop but output stays the same.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [herzbergs-motivation-hygiene-theory, motivators, demotivation, financial-rewards]

- id: motivators
  term: Motivators
  aliases: [Motivating factors]
  level: SL/HL
  definition: In Herzberg's theory, the factors in the content of a job, namely achievement, recognition, the work itself, responsibility, advancement and personal growth, that create satisfaction and motivation.
  context: Motivators are intrinsic to the job, so managers build them through job enrichment, empowerment and recognition rather than through pay. They only work once hygiene factors are adequate. They match the higher levels of Maslow's hierarchy, esteem and self-actualization.
  example: A nurse who is given responsibility for training new staff, and thanked publicly for it, feels more committed even though her pay has not changed.
  usage:
    general: In everyday use, a motivator is anything that motivates someone, including money.
    syllabus: In Herzberg's theory, motivators are a particular set of job-content factors, and pay is not one of them.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [hygiene-factors, herzbergs-motivation-hygiene-theory, job-enrichment, intrinsic-motivation]

- id: mcclellands-acquired-needs-theory
  term: McClelland's acquired needs theory
  aliases: [Acquired needs theory, Three needs theory]
  level: HL
  definition: David McClelland's theory that motivation is shaped by three needs, for achievement, affiliation and power, which people acquire through their experience of life, so that one of them is usually dominant in each person.
  context: Because the needs are learned rather than inborn, their strength varies between people and cultures. Managers can motivate better by recognizing each employee's dominant need and matching tasks and rewards to it, for example challenging targets for achievers, team roles for those seeking affiliation and leadership responsibilities for those seeking power. Unlike Maslow, McClelland does not arrange the needs in a hierarchy.
  example: A manager gives an achievement-driven salesperson a stretching target with weekly feedback, and asks a colleague with a strong need for affiliation to welcome and mentor new starters.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [need-for-achievement, need-for-affiliation, need-for-power, maslows-hierarchy-of-needs]

- id: need-for-achievement
  term: Need for achievement
  aliases: [nAch, Achievement need]
  level: HL
  definition: In McClelland's theory, the drive to succeed at challenging tasks through one's own effort and to do things better than before.
  context: People with a high need for achievement prefer goals that are difficult but realistic, want personal responsibility for results and look for frequent feedback on how they are doing. They often make good entrepreneurs and specialists but may find it hard to delegate or to manage others, because they would rather do the work themselves.
  example: An engineer volunteers for a tricky redesign, sets her own deadline and asks for weekly data on whether the new part is reducing faults.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [mcclellands-acquired-needs-theory, need-for-affiliation, need-for-power]

- id: need-for-affiliation
  term: Need for affiliation
  aliases: [nAff, Affiliation need]
  level: HL
  definition: In McClelland's theory, the desire to be liked and accepted by others and to have close, friendly relationships at work.
  context: People with a high need for affiliation work well in teams, value cooperation and harmony, and are motivated by belonging to a group. They may avoid conflict and find tough decisions, such as criticizing a colleague's work, uncomfortable, which can be a weakness in a manager.
  example: A receptionist who thrives on helping colleagues and organizing team lunches becomes unhappy when moved to a job working alone.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [mcclellands-acquired-needs-theory, need-for-achievement, need-for-power, teamwork]

- id: need-for-power
  term: Need for power
  aliases: [nPow, Power need]
  level: HL
  definition: In McClelland's theory, the desire to influence, direct or control other people and to make an impact.
  context: McClelland distinguished personal power, sought for one's own ends, from institutional power, used to achieve the organization's goals, and found that people driven by institutional power often make effective managers. People with a strong need for power are motivated by responsibility, status and the chance to lead.
  example: A team member who enjoys persuading others and chairing meetings is motivated by being asked to lead a project group.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [mcclellands-acquired-needs-theory, need-for-achievement, need-for-affiliation, power-culture]

- id: self-determination-theory
  term: Self-determination theory
  aliases: [SDT, Deci and Ryan's self-determination theory]
  level: HL
  definition: Edward Deci and Richard Ryan's theory that people have three basic psychological needs, for autonomy, competence and relatedness, and that meeting them builds intrinsic motivation and well-being.
  context: The theory separates autonomous motivation, when people act because they value or enjoy the work, from controlled motivation, when they act because of pressure, rewards or threats. Workplaces that offer choice, explain the reasons for tasks, develop skills and build supportive teams tend to get more lasting, better-quality effort. Rewards and close monitoring that feel controlling can weaken intrinsic motivation.
  example: A software firm lets each team decide how to meet its goals, offers regular coaching and holds friendly weekly reviews, and finds that staff put in extra effort without being asked.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [autonomy, competence, relatedness, intrinsic-motivation, extrinsic-motivation]

- id: autonomy
  term: Autonomy
  level: HL
  definition: In self-determination theory, the need to feel in control of one's own actions and to act by choice rather than under pressure.
  context: Autonomy at work comes from having a say in how, when or in what order tasks are done, and from understanding why they matter. It does not mean working alone or without guidance. Empowerment, flexi-time and job enrichment can all support it.
  example: Designers who may choose which of three briefs to tackle first, within the same deadline, say they feel more motivated.
  usage:
    general: In general use, autonomy means independence, such as a subsidiary that runs its own affairs.
    syllabus: In self-determination theory, it is a psychological need to act by one's own choice, which can be met inside a team and under a manager.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [self-determination-theory, competence, relatedness, empowerment]

- id: competence
  term: Competence
  level: HL
  definition: In self-determination theory, the need to feel capable and effective in what one does and to master challenges.
  context: Employees feel competent when tasks are challenging but achievable, when they have been trained well and when they receive useful feedback. Work that is far too hard, or far too easy, undermines this need.
  example: A new sales adviser gains confidence after a week of training and short daily feedback sessions, and starts asking to take harder calls.
  usage:
    general: In general use, competence means having the skills to do a job.
    syllabus: In self-determination theory, it is the need to feel effective, which training, feedback and the right level of challenge help to meet.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [self-determination-theory, autonomy, relatedness, on-the-job-training]

- id: relatedness
  term: Relatedness
  level: HL
  definition: In self-determination theory, the need to feel connected to other people, to care for them and to be cared for.
  context: At work, relatedness comes from supportive colleagues and managers, a sense of belonging and teamwork. It is similar to the social needs in Maslow's hierarchy and the need for affiliation in McClelland's theory, although self-determination theory treats it as a need everyone shares rather than one that is learned.
  example: A remote worker who joins a weekly video call with her team and a monthly team day feels less isolated and more committed.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [self-determination-theory, autonomy, competence, teamwork]

- id: equity-theory
  term: Equity theory
  aliases: [Adams's equity theory]
  level: HL
  definition: J. S. Adams's theory that employees compare what they put into a job (inputs such as effort, skill and time) and what they get from it (outcomes such as pay, recognition and promotion) with the same balance for other people, and are motivated when they see the exchange as fair.
  context: Employees who feel under-rewarded compared with others may cut their effort, demand more, change whom they compare themselves with or leave; feeling over-rewarded can cause guilt, though people accept it more easily. What matters is perceived fairness, not actual fairness, so transparent and consistent decisions on pay and promotion are important. The theory explains why a pay rise can still demotivate if a colleague received a bigger one.
  example: A designer who discovers that a newer colleague with less experience is paid more for the same work starts doing the minimum and looking for another job.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [expectancy-theory, demotivation, financial-rewards, performance-related-pay]

- id: expectancy-theory
  term: Expectancy theory
  aliases: [Vroom's expectancy theory, VIE theory]
  level: HL
  definition: "Victor Vroom's theory that motivation depends on three beliefs: that effort will lead to good performance (expectancy), that good performance will be rewarded (instrumentality) and that the reward is worth having (valence)."
  context: Because the three beliefs are multiplied, motivation is weak if any one of them is close to zero, whether the target seems impossible, the link between performance and reward is unreliable or the reward is not wanted. Managers can strengthen each belief with realistic targets, training and resources, a clear and trusted reward system, and rewards that suit the individual. The theory stresses that motivation depends on each person's perceptions.
  example: Sales staff ignore a large bonus for doubling sales because they believe the target cannot be reached, so their expectancy is too low for the bonus to matter.
  formula: Motivational force = expectancy × instrumentality × valence
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [expectancy, instrumentality, valence, equity-theory]

- id: expectancy
  term: Expectancy
  level: HL
  definition: In Vroom's expectancy theory, a person's belief that putting in effort will lead to the required level of performance.
  context: Expectancy is low when targets seem out of reach or when the employee lacks the skills, time or equipment to meet them. Training, resources, support and realistic targets raise it.
  example: A new recruit who has been properly trained believes she can meet the monthly target, so she is willing to try.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [expectancy-theory, instrumentality, valence]

- id: instrumentality
  term: Instrumentality
  level: HL
  definition: In Vroom's expectancy theory, a person's belief that good performance will actually be rewarded.
  context: Instrumentality falls when rewards seem to go to favourites, when promised bonuses are not paid or when the link between performance and reward is unclear. Clear, consistent and trusted reward systems raise it.
  example: Staff stop chasing targets after the business twice withdraws a promised bonus at the last minute.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [expectancy-theory, expectancy, valence, performance-related-pay]

- id: valence
  term: Valence
  level: HL
  definition: In Vroom's expectancy theory, the value a person places on the reward that good performance will bring.
  context: Valence differs between people, since one employee values extra pay, another time off and another promotion or public recognition. A reward that the employee does not want produces little motivation, however generous it seems to the manager.
  example: A parent of young children works hard for the reward of extra days off but shows no interest in a bonus paid as a weekend trip.
  topics: []
  subtopics: ['2.4']
  category: theory
  provenance: subject-knowledge
  related: [expectancy-theory, expectancy, instrumentality, fringe-payments]

- id: appraisal
  term: Appraisal
  aliases: [Performance appraisal, Performance review]
  level: HL
  definition: A structured review of how well an employee is performing against agreed objectives, used to give feedback, identify training needs, set new targets and inform decisions on pay and promotion.
  context: The four types in the course are formative appraisal, summative appraisal, 360-degree feedback and self-appraisal. Appraisal can motivate by recognizing good work and planning development, but it can demotivate if it feels like a judgement, is rushed or is tied too closely to pay. It also supplies the evidence for performance-related pay.
  example: Each spring, a bank's branch staff meet their managers to review last year's targets, agree new ones and plan the training they need.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [formative-appraisal, summative-appraisal, 360-degree-feedback, self-appraisal, performance-related-pay]

- id: formative-appraisal
  term: Formative appraisal
  level: HL
  definition: Ongoing appraisal during a period of work that gives regular feedback to help the employee improve, rather than to judge final results.
  context: Formative appraisal is developmental and often informal, like a coach's feedback during a season. It helps employees put problems right early and builds their sense of competence, but it takes managers' time and may not produce the formal records needed for decisions on pay.
  example: A trainee chef gets short feedback from the head chef after each service and agrees one thing to improve the next day.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [appraisal, summative-appraisal, self-appraisal]

- id: summative-appraisal
  term: Summative appraisal
  level: HL
  definition: A formal appraisal at the end of a period, such as a year, that judges and records an employee's performance against targets, often to decide pay, promotion or further action.
  context: Summative appraisal gives a clear record and links performance to rewards. Because it judges past results it can feel threatening, and feedback that arrives only once a year comes too late to help the employee improve during that year.
  example: At the end of the year, a sales manager rates each representative against annual sales targets, and the ratings decide this year's bonuses.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [appraisal, formative-appraisal, performance-related-pay]

- id: 360-degree-feedback
  term: 360-degree feedback
  aliases: [360-degree appraisal, Multi-source feedback]
  level: HL
  definition: Appraisal that gathers feedback on an employee from people all around them at work, such as their manager, colleagues, subordinates and sometimes customers, often alongside their own self-assessment.
  context: It gives a fuller and more balanced picture than one manager's view, and is often used to develop managers' leadership skills. It takes time to collect, and it only works if feedback is honest, anonymous where needed and given in a culture of trust; otherwise it can cause resentment.
  example: Before a team leader's review, eight colleagues, three of the people she manages and two regular clients complete an anonymous questionnaire about her work.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [appraisal, self-appraisal, formative-appraisal]

- id: self-appraisal
  term: Self-appraisal
  level: HL
  definition: Appraisal in which employees assess their own performance against their objectives, usually before discussing it with their manager.
  context: Self-appraisal encourages reflection and ownership of development, and fits a culture of empowerment. Employees may rate themselves too generously or too harshly, so it is normally combined with another form of appraisal.
  example: Before her annual review, a teacher completes a form rating her progress on three targets and listing the training she would like.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [appraisal, 360-degree-feedback, empowerment]

- id: internal-recruitment
  term: Internal recruitment
  level: HL
  definition: Filling a vacancy with someone who already works for the organization, by promotion, transfer or redeployment.
  context: It is usually quicker and cheaper than recruiting from outside, the candidate's abilities are already known, little induction is needed and the chance of promotion motivates staff. But it limits the pool of applicants, brings in no new ideas, can cause resentment among those passed over and leaves another vacancy to fill.
  example: A supermarket advertises an assistant manager post on its staff intranet and promotes one of its own supervisors.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [external-recruitment, recruitment, job-description, motivation]

- id: external-recruitment
  term: External recruitment
  level: HL
  definition: Filling a vacancy with someone from outside the organization, found through methods such as job advertisements, online job sites and social media, recruitment agencies, headhunting, job fairs and referrals.
  context: It gives a wider choice of applicants and brings in new skills, ideas and experience. It costs more and takes longer, the new employee needs a full induction, there is more risk of choosing someone who does not fit, and internal candidates may be demotivated. Headhunting means approaching a person who already works elsewhere, usually for senior or specialist posts.
  example: A growing technology firm uses an agency to headhunt a finance director from a rival, because no one inside has the experience needed.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [internal-recruitment, recruitment, person-specification, induction]

- id: job-description
  term: Job description
  level: HL
  definition: A document setting out a job's title, purpose, main duties and responsibilities, whom the job holder reports to and the working conditions.
  context: It is written after analysing the job and is used to advertise the post, to show applicants what is expected and later to set targets and judge performance. It describes the job, while the person specification describes the ideal person to do it.
  example: The job description for a warehouse team leader lists supervising eight pickers, planning shifts and reporting to the operations manager.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [person-specification, recruitment, internal-recruitment, appraisal]

- id: person-specification
  term: Person specification
  level: HL
  definition: A document setting out the qualifications, skills, experience and personal qualities needed in the person who will do a job, often divided into essential and desirable criteria.
  context: It is used to shortlist applicants fairly and to design interview questions and tests. Its criteria should relate to the job itself; otherwise the business may exclude good candidates or break the law on discrimination.
  example: The person specification for a junior accountant lists a relevant degree as essential and experience of a particular accounting software package as desirable.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [job-description, recruitment, external-recruitment]

- id: financial-rewards
  term: Financial rewards
  aliases: [Financial incentives]
  level: SL/HL
  definition: Payments made to employees in money, or with a clear money value, including salary, wages, commission, performance-related pay, profit-related pay, employee share ownership schemes and fringe payments.
  context: Financial rewards meet basic and safety needs and work mainly through extrinsic motivation. They can drive effort on measurable tasks, but Herzberg classed pay as a hygiene factor, and badly designed schemes can lead people to chase targets at the expense of quality or teamwork. Most businesses combine them with non-financial rewards.
  example: A car dealership pays its sales staff a basic salary plus commission on each car sold and gives them a company car.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [non-financial-rewards, salary, wages, commission, extrinsic-motivation]

- id: salary
  term: Salary
  level: SL/HL
  definition: A fixed annual amount of pay, usually paid monthly, that does not change with the exact number of hours worked or the amount produced.
  context: A salary gives employees a secure, predictable income and is usual for managerial, professional and office jobs where output is hard to measure. It gives no direct incentive to work harder, so it is often combined with bonuses or performance-related pay.
  example: A marketing executive earns a salary paid in twelve equal monthly instalments, whether or not she works late in a busy week.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [wages, financial-rewards, performance-related-pay]

- id: wages
  term: Wages
  level: SL/HL
  definition: Pay calculated either by the hour or other period worked (a time rate) or by the amount produced (a piece rate), and usually paid weekly.
  context: Time-rate wages are simple and suit work where output is hard to count, but give no reward for extra effort, so overtime is often paid at a higher rate. Piece-rate wages link pay directly to output. Students often confuse wages with a salary, which is a fixed annual amount.
  example: A café pays its waiting staff an hourly rate, with time and a half for hours worked on public holidays.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [piece-rate, salary, financial-rewards, scientific-management]

- id: piece-rate
  term: Piece rate
  aliases: [Piecework, Piece-rate pay]
  level: SL/HL
  definition: A way of paying wages in which employees receive a fixed amount for each unit they produce, so that pay rises with output.
  context: Piece rates reward effort directly and were central to Taylor's scientific management. They can lead workers to rush, cutting quality and safety, and they do not suit work where output cannot be counted or depends on others. Many schemes add a guaranteed minimum so that pay does not fall below a basic level.
  example: A clothing workshop pays machinists for each jacket they finish, and a supervisor checks each jacket before it is counted.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [wages, scientific-management, performance-related-pay, extrinsic-motivation]

- id: commission
  term: Commission
  level: SL/HL
  definition: Pay calculated as a percentage of the value of the sales an employee makes, often on top of a basic salary.
  context: Commission motivates sales staff to sell more and links pay costs to revenue. It can lead to pushy selling, mis-selling or rivalry between colleagues, and it makes income unpredictable when sales fall for reasons outside the employee's control.
  example: An estate agent earns a basic salary plus 1% of the price of every house she sells.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [financial-rewards, performance-related-pay, salary]

- id: performance-related-pay
  term: Performance-related pay
  aliases: [PRP]
  level: SL/HL
  definition: Extra pay, such as a bonus or a higher pay rise, given to employees whose performance meets or beats agreed targets, usually judged at appraisal.
  context: PRP rewards the best performers and links pay to the organization's goals. Performance in many jobs is hard to measure fairly, targets can encourage a narrow focus and gaming, and staff who miss out may feel the system is unfair, which can harm teamwork. It is different from profit-related pay, which depends on the whole organization's profit.
  example: Account managers at a fictional software firm, Cobalt Systems, receive a bonus at their annual review if their clients renew their contracts.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [appraisal, profit-related-pay, commission, financial-rewards, expectancy-theory]

- id: profit-related-pay
  term: Profit-related pay
  aliases: [Profit sharing]
  level: SL/HL
  definition: A bonus paid to employees out of the organization's profit, so that their pay rises and falls with how well the business does.
  context: It gives everyone an interest in the business's success and can encourage cooperation and cost saving. The link between one person's effort and the company's profit is weak, so it may do little for individual motivation, and in a bad year it disappears even if staff worked hard.
  example: A fictional retailer, Linden Stores, shares a fixed part of its annual profit among all staff in proportion to their salaries.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [performance-related-pay, employee-share-ownership-scheme, financial-rewards]

- id: employee-share-ownership-scheme
  term: Employee share ownership scheme
  aliases: [ESOP, Employee share ownership plan, Share ownership scheme]
  level: SL/HL
  definition: A scheme that gives employees shares in the company they work for, either free or at a reduced price, often on condition that they keep them for a period.
  context: As part-owners, employees gain from dividends and a rising share price, which can build loyalty, encourage long-term thinking and reduce the number of staff who leave. The link between individual effort and the share price is weak, employees' savings become tied to their employer, and schemes are only possible in companies with shares.
  example: A listed engineering company offers staff the chance to buy its shares at a discount each year, provided they hold them for three years.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [profit-related-pay, financial-rewards, motivation]

- id: fringe-payments
  term: Fringe payments
  aliases: [Fringe benefits, Perks]
  level: SL/HL
  definition: Rewards given to employees in addition to their pay, such as a company car, health insurance, pension contributions, staff discounts, subsidized meals or gym membership.
  context: Fringe payments help to recruit and keep staff and can meet safety and esteem needs. Some are valued more highly than a pay rise of the same cost, although employees may soon take them for granted. They are often called fringe benefits or perks.
  example: A consultancy offers private health insurance, a generous pension and free lunches to attract graduates.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [financial-rewards, salary, hygiene-factors]

- id: non-financial-rewards
  term: Non-financial rewards
  aliases: [Non-financial incentives]
  level: SL/HL
  definition: Ways of motivating employees that do not involve money, such as job enrichment, job rotation, job enlargement, empowerment, purpose (the opportunity to make a difference) and teamwork.
  context: They act mainly on intrinsic motivation and on the higher needs in Maslow's and Herzberg's theories, and their effects can last longer than those of a pay rise. They usually cost less in money but need management time, training and trust, and they do not motivate people whose basic needs, including fair pay, are not met.
  example: Unable to raise pay, a charity motivates its staff by letting them choose projects, rotate between teams and meet the people their work helps.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [financial-rewards, job-enrichment, empowerment, teamwork, purpose-at-work]

- id: job-enrichment
  term: Job enrichment
  level: SL/HL
  definition: Redesigning a job to give the employee more responsibility, more challenging tasks and a complete piece of work, so that they use more of their abilities.
  context: Job enrichment comes from Herzberg's theory and acts on motivators such as responsibility, achievement and recognition. It differs from job enlargement, which adds more tasks at the same level. It can require training, and not every employee wants more responsibility.
  example: A team of warehouse staff who only packed orders is made responsible for checking stock, sorting out supplier problems and improving its own process.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [job-enlargement, job-rotation, motivators, empowerment]

- id: job-rotation
  term: Job rotation
  level: SL/HL
  definition: Moving employees between different tasks or jobs at a similar level at regular intervals.
  context: Rotation reduces boredom, builds a multi-skilled workforce that can cover absences and helps people understand the wider process. If the jobs are all simple, it may only swap one dull task for another, and some productivity is lost while people learn each task.
  example: Workers in a bottling plant move between filling, labelling and packing every two hours.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [job-enlargement, job-enrichment, on-the-job-training]

- id: job-enlargement
  term: Job enlargement
  level: SL/HL
  definition: Adding more tasks of a similar level of difficulty to a job, so that it has more variety but no more responsibility.
  context: Job enlargement can make work less monotonous and is sometimes used after delayering or redundancies to spread work among fewer people. Employees may see it simply as more work for the same pay, especially when no new skills or responsibility are involved. It is often contrasted with job enrichment.
  example: A receptionist who answered calls is also asked to sort the post and book meeting rooms.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [job-enrichment, job-rotation, delayering]

- id: empowerment
  term: Empowerment
  level: SL/HL
  definition: Giving employees the authority, resources and confidence to make decisions about their own work without having to ask a manager first.
  context: Empowerment can raise motivation, speed up service and draw on staff knowledge, and it supports the need for autonomy. It needs training, trust and a culture that accepts some mistakes. It goes further than delegation, which passes particular tasks down, by giving employees lasting control over how they work.
  example: Hotel receptionists are allowed to offer a free upgrade or a refund up to a set amount to solve a guest's complaint on the spot.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [delegation, autonomy, job-enrichment, decentralization, non-financial-rewards]

- id: purpose-at-work
  term: Purpose at work
  aliases: [Opportunity to make a difference]
  level: SL/HL
  definition: The sense that one's work makes a positive difference to customers, colleagues, society or the environment, which can motivate in itself.
  context: Purpose is a non-financial reward, since employees who see the value of what they do tend to be more committed, which links to intrinsic motivation and self-actualization. Businesses build it through a clear mission, by showing staff the impact of their work and through ethical and sustainable practices. Claims of purpose that do not match how the business behaves can cause cynicism.
  example: A maker of medical devices invites patients to tell production staff how its products changed their lives, and staff say they take more care over quality afterwards.
  usage:
    general: In general use, a business's purpose often means its mission or its reason for existing.
    syllabus: In 2.4, purpose is a non-financial reward, the opportunity an employee has to make a difference through their work.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [non-financial-rewards, intrinsic-motivation, maslows-hierarchy-of-needs, teamwork]

- id: teamwork
  term: Teamwork
  aliases: [Team working]
  level: SL/HL
  definition: Organizing work so that employees cooperate in groups, sharing responsibility for a common goal.
  context: As a non-financial reward, teamwork meets social needs and the need for relatedness, spreads knowledge and can raise commitment and quality. Teams can also produce conflict, pressure to conform and members who rely on others' effort, and they need good leadership.
  example: A car plant replaces individual assembly line jobs with teams of eight who share the work on one section of each car and solve quality problems together.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [non-financial-rewards, relatedness, need-for-affiliation, job-rotation]

- id: induction
  term: Induction
  aliases: [Induction training, Onboarding]
  level: SL/HL
  definition: Training that introduces new employees to the organization, its people, procedures, facilities, culture and health and safety rules, and to their own job.
  context: A good induction helps new starters become productive sooner, feel welcome and avoid early mistakes, and it reduces the number who leave in their first months. It takes time, and too much information at once is soon forgotten. Internal recruits usually need a shorter induction than external ones.
  example: New staff at a theme park spend two days on safety rules, the park's values and a tour, then shadow an experienced colleague for a week.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [on-the-job-training, off-the-job-training, recruitment, organizational-culture]

- id: on-the-job-training
  term: On-the-job training
  level: SL/HL
  definition: Training given while the employee does the job in the normal workplace, for example by watching and copying an experienced colleague, coaching, mentoring or job rotation.
  context: It is usually cheap, relevant to the real job and lets the trainee keep producing while learning. Its quality depends on the trainer, who may pass on bad habits, it can slow down experienced staff and it may not develop wider or theoretical knowledge.
  example: A trainee barista learns to make drinks by working alongside a supervisor during quieter hours.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [off-the-job-training, induction, job-rotation]

- id: off-the-job-training
  term: Off-the-job training
  level: SL/HL
  definition: Training that takes place away from the employee's normal work, such as courses, college programmes, conferences, workshops or online learning.
  context: It can give specialist knowledge, qualifications and new ideas without the distractions of the workplace. It costs more, the employee produces nothing while training, what is learned may not transfer easily to the job, and newly qualified staff may become more attractive to rival employers.
  example: A logistics company sends its supervisors on a three-day external course in leadership and health and safety law.
  topics: []
  subtopics: ['2.4']
  category: people
  provenance: subject-knowledge
  related: [on-the-job-training, induction, competence]

# ---------- 2.5 Organizational (corporate) culture (HL only) ----------

- id: organizational-culture
  term: Organizational culture
  aliases: [Corporate culture]
  level: HL
  definition: The shared values, beliefs, norms and habits that shape how people in an organization think, behave and make decisions, often summed up as the way we do things around here.
  context: Culture shows in dress, language, office layout, stories, rituals, attitudes to risk and customers, and how decisions are made. It is shaped by founders and leaders, the organization's history, its industry and the national culture around it. A culture that fits the strategy can guide and motivate staff without rules; one that does not can block change.
  example: At a fictional start-up, Brightloop, staff call senior managers by their first names, share ideas openly at weekly meetings and are praised for trying new things even when they fail.
  topics: []
  subtopics: ['2.5']
  category: people
  provenance: subject-knowledge
  related: [handys-gods-of-management, culture-clash, power-culture, role-culture]

- id: handys-gods-of-management
  term: Handy's Gods of management
  aliases: [Gods of management]
  level: HL
  definition: "Charles Handy's model of four types of organizational culture, each named after a Greek god: power (Zeus), role (Apollo), task (Athena) and person (Dionysus)."
  context: Handy argued that each culture suits different circumstances and that most organizations mix them, with different cultures in different departments or at different stages of growth. The model helps explain why people thrive in some organizations and not in others, and why a change in size, structure or leadership can lead to a culture clash.
  example: A small family business run by its founder has a power culture, while the large bank that buys it has a role culture, so the two clash after the takeover.
  topics: []
  subtopics: ['2.5']
  category: theory
  provenance: subject-knowledge
  related: [power-culture, role-culture, task-culture, person-culture, organizational-culture]

- id: power-culture
  term: Power culture
  aliases: [Zeus culture, Club culture]
  level: HL
  definition: In Handy's model, a culture in which power sits with one central person or small group, who make decisions quickly and rely on personal trust rather than rules.
  context: Handy pictured it as a spider's web with the leader at the centre. It can respond fast and suits small, entrepreneurial firms and crises, but it depends heavily on the central figure, can leave others feeling powerless and may struggle as the organization grows or when the leader leaves.
  example: In a fictional fashion label, Vesna, the founder approves every design and hires every manager personally.
  topics: []
  subtopics: ['2.5']
  category: theory
  provenance: subject-knowledge
  related: [handys-gods-of-management, role-culture, autocratic-leadership, centralization]

- id: role-culture
  term: Role culture
  aliases: [Apollo culture]
  level: HL
  definition: In Handy's model, a culture in which power comes from a person's position, and work is governed by clear roles, rules and procedures.
  context: Handy pictured it as a Greek temple, with the functions as pillars supporting the senior managers above. It is stable, predictable and efficient in a steady environment and suits large organizations, but it is slow to change and can frustrate people who want to use their initiative. It matches a bureaucratic structure.
  example: In a tax office, every case passes through the same stages, each handled by staff with a defined role and limits to their authority.
  topics: []
  subtopics: ['2.5']
  category: theory
  provenance: subject-knowledge
  related: [handys-gods-of-management, bureaucracy, power-culture, task-culture]

- id: task-culture
  term: Task culture
  aliases: [Athena culture]
  level: HL
  definition: In Handy's model, a culture focused on getting particular jobs or projects done, in which teams form around tasks and influence comes from expertise rather than position.
  context: Handy pictured it as a net, with teams at the knots. It is flexible, creative and good at solving problems, and suits matrix and project-based organizations. It can be expensive and hard to control, teams may compete for resources, and under pressure it may slide towards a power or role culture.
  example: An advertising agency puts together a new team of writers, designers and data analysts for each campaign.
  topics: []
  subtopics: ['2.5']
  category: theory
  provenance: subject-knowledge
  related: [handys-gods-of-management, matrix-structure, project-based-organization, person-culture]

- id: person-culture
  term: Person culture
  aliases: [Dionysus culture, Existential culture]
  level: HL
  definition: In Handy's model, a culture in which the organization exists mainly to serve the individuals in it, who are highly skilled, independent and loyal to their profession more than to the organization.
  context: Handy pictured it as a loose cluster of individuals. It suits partnerships of professionals such as lawyers, doctors, architects and consultants, and university departments. Individuals have great freedom, but the organization is hard to manage or direct, since its members accept little authority.
  example: In a barristers' chambers, each barrister finds and handles their own cases and shares the cost of offices and clerks with the others.
  topics: []
  subtopics: ['2.5']
  category: theory
  provenance: subject-knowledge
  related: [handys-gods-of-management, task-culture, power-culture, laissez-faire-leadership]

- id: culture-clash
  term: Culture clash
  aliases: [Cultural clash, Clash of cultures]
  level: HL
  definition: Conflict and misunderstanding that arise when people or organizations with different cultures have to work together, for example after a merger or acquisition, during rapid growth or when a new leader changes the style of management.
  context: A clash can lower morale and productivity, raise absence and the number of staff who leave, and stop a merger delivering the benefits expected. It can be reduced by assessing both cultures before a deal, communicating openly, involving staff from both sides, training and keeping valued traditions. Differences in national culture, which Hofstede's cultural dimensions (a toolkit tool, HL) describe, can add to a clash in international business.
  example: When a formal, rule-bound bank buys a relaxed financial technology start-up, the start-up's developers resent new dress codes and approval forms, and several leave within months.
  topics: []
  subtopics: ['2.5']
  category: people
  provenance: subject-knowledge
  related: [organizational-culture, handys-gods-of-management, merger, acquisition]

# ---------- 2.6 Communication ----------

- id: communication
  term: Communication
  level: SL/HL
  definition: The transfer of information, ideas or instructions from a sender to a receiver through a channel, so that the receiver understands them as the sender intended.
  context: The process runs from a sender, who turns an idea into a message, through a channel such as a meeting, an email or a notice, to a receiver, who interprets it; feedback from the receiver shows whether it was understood. Communication inside an organization can be formal or informal and one-way or two-way, and barriers can distort it at any stage. Choosing a method that suits the message, the audience and the situation is a matter of judgement.
  example: A factory manager explains a new safety check at the start of a shift, demonstrates it, and asks each operator to show it back before signing them off, so she knows the message has been understood.
  topics: []
  subtopics: ['2.6']
  category: people
  provenance: subject-knowledge
  related: [formal-communication, informal-communication, barriers-to-communication]

- id: formal-communication
  term: Formal communication
  level: SL/HL
  definition: Communication through the official channels set by an organization's structure, following the chain of command, such as reports, memos, official emails, meetings, notices and the staff intranet.
  context: Formal communication is accurate, can be recorded and gives authority to messages, which matters for policies, legal matters and decisions. It can be slow, especially in tall structures, and messages may be filtered as they pass up or down. It may flow down (instructions), up (reports and feedback) or across between departments.
  example: A company announces a change to its holiday policy in an email from the HR director, followed by an updated staff handbook.
  topics: []
  subtopics: ['2.6']
  category: people
  provenance: subject-knowledge
  related: [informal-communication, chain-of-command, barriers-to-communication]

- id: informal-communication
  term: Informal communication
  aliases: [Grapevine]
  level: SL/HL
  definition: Unofficial communication between people outside the organization's formal channels, such as conversations, messaging groups and gossip, often called the grapevine.
  context: Informal communication is fast, builds relationships and can tell managers what staff really think. It can also spread rumours and inaccurate information, especially when formal communication is poor or slow. Managers cannot stop it, but they can limit rumours by communicating formally, early and honestly.
  example: Staff hear about a planned office move through a colleague's messaging group a week before managers announce it, and rumours of job cuts spread.
  topics: []
  subtopics: ['2.6']
  category: people
  provenance: subject-knowledge
  related: [formal-communication, barriers-to-communication, organizational-culture]

- id: barriers-to-communication
  term: Barriers to communication
  aliases: [Communication barriers]
  level: SL/HL
  definition: Anything that stops a message being sent, received or understood as the sender intended.
  context: Common barriers are jargon, language and cultural differences, information overload, a poor choice of method, physical distance and time zones, noise and interruptions, technical failures, a long chain of command, and the emotions, attitudes or mistrust of the sender and receiver. Barriers lead to mistakes, wasted time, lower morale and poor decisions. Choosing the right method for the audience, keeping messages clear and asking for feedback all help.
  example: Head office emails a long technical update in English to factory staff, many of whom read little English, so a new safety rule is widely ignored.
  topics: []
  subtopics: ['2.6']
  category: people
  provenance: subject-knowledge
  related: [jargon, information-overload, formal-communication, informal-communication]

- id: jargon
  term: Jargon
  level: SL/HL
  definition: Specialist words, abbreviations or technical terms used within a profession or group that people outside it may not understand.
  context: Jargon can make communication quicker between specialists, but it becomes a barrier when it is used with customers, new staff or other departments, who may misunderstand or feel shut out. Plain language suits mixed audiences.
  example: An IT manager tells sales staff that the CRM will migrate to a new SaaS platform during the next sprint, and nobody in the meeting knows what this means for them.
  topics: []
  subtopics: ['2.6']
  category: people
  provenance: subject-knowledge
  related: [barriers-to-communication, information-overload]

- id: information-overload
  term: Information overload
  level: SL/HL
  definition: Receiving more information than a person can take in and act on, so that important messages are missed, decisions are delayed and stress rises.
  context: Email, messaging tools and constant updates make overload common. It is a barrier to communication because the receiver cannot tell what matters. Fewer, shorter and better targeted messages, and clear priorities, reduce it.
  example: A manager receives over two hundred emails a day and misses a supplier's warning about a delayed delivery.
  topics: []
  subtopics: ['2.6']
  category: people
  provenance: subject-knowledge
  related: [barriers-to-communication, jargon, formal-communication]

# ---------- 2.7 Industrial/employee relations (HL only) ----------

- id: industrial-relations
  term: Industrial relations
  aliases: [Employee relations, Employer-employee relations]
  level: HL
  definition: The relationship between an organization's management and its employees and their representatives, such as trade unions, including how pay and conditions are agreed and how disputes are handled.
  context: Good relations bring cooperation, smoother change and fewer costly disputes; poor relations bring industrial action, lost output and damage to reputation. Each side has approaches it can use in a conflict, and there are established ways to resolve disputes, such as conciliation and arbitration. The balance of power depends on factors such as union membership, the law and the level of unemployment.
  example: A hospital and the nurses' union meet every year to agree pay and working hours, and follow an agreed procedure for handling disagreements.
  usage:
    general: The word industrial suggests factories and manual work.
    syllabus: The course uses industrial and employee relations to mean relations between employers and employees in any sector, including services and the public sector.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [trade-union, collective-bargaining, industrial-action, conciliation]

- id: trade-union
  term: Trade union
  aliases: [Labour union]
  level: HL
  definition: An organization of employees that represents its members' interests, such as pay, working conditions and job security, in dealings with employers.
  context: Unions give individual workers more bargaining power by negotiating collectively, and they also advise and represent members in disputes and grievances. For employers, a union provides one channel for consultation and agreement, but strong unions can resist change and organize industrial action. Single-union and no-strike agreements are ways in which employers and unions try to make relations more predictable.
  example: Bus drivers in a city belong to a union that negotiates their pay and shift patterns with the bus company each year.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [collective-bargaining, industrial-action, single-union-agreement, industrial-relations]

- id: industrial-action
  term: Industrial action
  level: HL
  definition: Action taken by employees, usually organized by a trade union, to put pressure on their employer during a dispute, such as a work-to-rule, an overtime ban, a go-slow or a strike.
  context: Industrial action is costly for both sides, since employers lose output, customers and reputation, and employees may lose pay and put their jobs at risk. It is usually a last resort after collective bargaining has failed. Its strength depends on how much the employer relies on the workers involved, and on the law on industrial action.
  example: Airport baggage handlers refuse all overtime during the summer peak, causing delays, to press for a pay rise.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [strike-action, work-to-rule, collective-bargaining, trade-union]

- id: collective-bargaining
  term: Collective bargaining
  level: HL
  definition: Negotiation between an employer, or a group of employers, and representatives of employees, usually a trade union, to agree pay and working conditions for a whole group of workers.
  context: The guide lists collective bargaining as an approach to conflict for both employees and employers, because each side can use negotiation to pursue its aims. It is quicker than negotiating with each worker separately and gives employees more power than they would have alone. When bargaining breaks down, either side may turn to other approaches, such as industrial action or lockouts, or to conciliation and arbitration.
  example: A car maker and the union representing its production workers agree a two-year deal on pay, hours and the introduction of new robots.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [trade-union, industrial-relations, conciliation, arbitration]

- id: work-to-rule
  term: Work-to-rule
  level: HL
  definition: Industrial action in which employees follow every rule and procedure exactly and do nothing beyond what their contracts require, such as overtime or tasks that rely on goodwill.
  context: Because employees are still doing their jobs, they usually keep their pay and stay within their contracts, while output falls and delays build up. It shows how much an organization depends on its staff's goodwill. It is less costly for workers than a strike but can damage relationships for a long time.
  example: Train drivers carry out every optional safety check in full before each departure, and services across the network run late.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [industrial-action, strike-action, collective-bargaining]

- id: strike-action
  term: Strike action
  aliases: [Strike]
  level: HL
  definition: Industrial action in which employees collectively stop working, for a set period or until further notice, to put pressure on their employer.
  context: A strike is the most powerful form of industrial action and the most costly, since the employer loses output and customers while strikers usually lose pay and may risk their jobs and public sympathy. Strikes can be short token stoppages that show strength, or open-ended. Many countries regulate when a strike is lawful, for example by requiring a vote of union members.
  example: Cleaners at a shopping centre walk out for two days after their employer cuts their hours.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [industrial-action, work-to-rule, no-strike-agreement, lockout]

- id: changes-of-contract
  term: Changes of contract
  level: HL
  definition: An employer altering employees' terms and conditions, such as hours, pay, duties, shift patterns or place of work, or threatening to, as a way of cutting costs or putting pressure on employees in a dispute.
  context: Contracts can usually be changed only with employees' agreement or after proper notice and consultation, depending on the law. Imposing changes may save money or end a stalemate, but it often damages trust, can provoke industrial action and may lead to legal challenges.
  example: A logistics firm tells its drivers that, unless they accept longer shifts, it will end their contracts and offer new ones on the changed terms.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [collective-bargaining, redundancy, lockout, industrial-relations]

- id: workplace-closure
  term: Closure (of a workplace)
  aliases: [Threat of closure, Plant closure]
  level: HL
  definition: An employer shutting a factory, office or the whole business, or threatening to do so, during a dispute or when costs become too high, so that employees face losing their jobs.
  context: Closure is the most extreme approach an employer can take, since both sides lose, the employees their jobs and the employer its output and capacity. A believable threat of closure, for example to move production elsewhere, can push employees to accept changes, but a threat that turns out to be a bluff damages trust.
  example: A manufacturer tells its workforce that the plant will close and production will move abroad unless staff accept a pay freeze.
  usage:
    general: In general use, closure is any shutting down of a business, for reasons such as losses or the owner's retirement.
    syllabus: In 2.7, closure is named as one of the approaches an employer can use in a conflict with employees.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [lockout, redundancy, changes-of-contract, industrial-relations]

- id: lockout
  term: Lockout
  level: HL
  definition: An employer preventing employees from entering the workplace, and so from working and being paid, until they accept the employer's terms in a dispute.
  context: A lockout is the employer's counterpart to a strike. It puts financial pressure on employees, but the business loses output while the workplace is shut, and it can harm its reputation and its relations with staff for years.
  example: A port operator locks dockworkers out of the terminal for a week after they reject a new shift system.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [strike-action, workplace-closure, collective-bargaining]

- id: conciliation
  term: Conciliation
  level: HL
  definition: A way of resolving a dispute in which an independent third party helps the two sides talk and find their own agreement, without deciding the outcome for them.
  context: A conciliator keeps communication going, clarifies each side's position and suggests possible compromises, but either side can reject the result. Conciliation is often tried before arbitration. It is cheaper and less hostile than industrial action, but it only works if both sides are willing to move.
  example: When talks over pay break down, a university and its lecturers' union agree to meet an independent conciliator, who helps them reach a deal.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [arbitration, collective-bargaining, industrial-relations]

- id: arbitration
  term: Arbitration
  level: HL
  definition: A way of resolving a dispute in which an independent third party hears both sides and then decides the outcome, which the two sides may agree in advance to accept as binding.
  context: Arbitration ends a dispute without industrial action, but each side gives up control of the outcome. In pendulum arbitration, the arbitrator must choose one side's final offer in full, which pushes both sides to make reasonable offers. It is often the next step when conciliation fails, and some no-strike agreements commit both sides to it.
  example: A bus company and the drivers' union agree that an arbitrator will settle their pay dispute, and both accept her award of a 3% rise.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [conciliation, no-strike-agreement, collective-bargaining]

- id: employee-participation
  term: Employee participation
  level: HL
  definition: Involving employees in decisions that affect their work, through methods such as consultation, works councils, quality circles, suggestion schemes and team briefings.
  context: Participation can improve decisions by drawing on staff knowledge, raise motivation and reduce conflict, because employees understand and help to shape changes. It takes time, and if managers ignore what staff say it can breed cynicism. Industrial democracy is a stronger form, in which employees share real decision-making power.
  example: A food factory sets up a works council of elected staff representatives, which managers must consult before changing shift patterns.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [industrial-democracy, conciliation, empowerment, trade-union]

- id: industrial-democracy
  term: Industrial democracy
  level: HL
  definition: Giving employees a real share of power over an organization's decisions, for example through elected worker representatives on the board of directors or through employee ownership.
  context: In its narrower sense it means co-determination, with workers sitting on the board; more broadly, it means any arrangement that gives workers a genuine say. It can build trust and long-term thinking and reduce conflict, but it can slow decisions, and worker directors may feel torn between their colleagues and the board.
  example: A fictional engineering cooperative, Ironbridge Works, is owned by its employees, who elect its board and vote on major investments.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [employee-participation, trade-union, industrial-relations]

- id: no-strike-agreement
  term: No-strike agreement
  level: HL
  definition: An agreement in which a trade union promises not to call strikes, usually in return for benefits such as better pay or conditions, or an agreed procedure, such as arbitration, for settling disputes.
  context: It gives the employer stable production and gives employees a guaranteed route for resolving disagreements. Critics argue that it weakens the union's main source of power, and the agreement depends on both sides trusting the procedure for settling disputes.
  example: A car maker opening a new plant agrees a single-union, no-strike deal under which any dispute that talks cannot settle goes to binding arbitration.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [single-union-agreement, arbitration, strike-action, trade-union]

- id: single-union-agreement
  term: Single-union agreement
  level: HL
  definition: An agreement in which an employer recognizes and negotiates with only one trade union, which represents all of the employees or all of a particular group.
  context: Dealing with one union simplifies collective bargaining, avoids disputes between rival unions and can speed up agreement. Employees lose the choice of union, and the single union may represent some groups of workers better than others.
  example: A new distribution centre recognizes one union for all its warehouse, office and driving staff, instead of the three unions found at its older sites.
  topics: []
  subtopics: ['2.7']
  category: people
  provenance: subject-knowledge
  related: [no-strike-agreement, trade-union, collective-bargaining]

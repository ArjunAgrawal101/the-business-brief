# Glossary: sustainability terms beyond the IB course.
# Every entry is enrichment (provenance: enrichment): it names no IB subtopic, never carries
# the ib qualification, and links to the IB terms it builds on through related. Definitions,
# explanations and examples are the platform's own words; every business named is fictional.
# Entries are in alphabetical order of term.

- id: carbon-footprint
  term: "Carbon footprint"
  definition: "The total greenhouse gas emissions caused by an organization, a product, an event or a person, expressed in tonnes of carbon dioxide equivalent."
  simple: "The total amount of greenhouse gases a business or a product is responsible for, added up and expressed as tonnes of carbon dioxide."
  technical: "An organization's footprint adds up its scope 1, 2 and 3 emissions; a product's footprint uses life cycle assessment from raw materials to disposal. Results depend on the boundaries drawn, the emission factors used and the quality of the data, so different firms' footprints are hard to compare. Measuring the footprint is the first step to setting targets for reducing it."
  example: "A fictional coffee chain calculates that the milk in its drinks accounts for the largest share of its products' carbon footprint, and starts to promote plant-based milk."
  misconceptions:
    - claim: "A carbon footprint only counts carbon dioxide."
      correction: "It includes other greenhouse gases, such as methane, converted to carbon dioxide equivalent by their warming effect."
  category: operations
  qualifications: [secondary, undergraduate, mba, professional]
  provenance: enrichment
  related: [scope-1-emissions, scope-3-emissions, life-cycle-assessment, net-zero]

- id: carbon-offsetting
  term: "Carbon offsetting"
  aliases: ["Carbon offset", "Carbon credit"]
  definition: "Paying for a reduction or removal of greenhouse gas emissions somewhere else, such as planting trees or capturing methane, to compensate for emissions a business cannot yet cut."
  simple: "Making up for your own pollution by paying for a project that cuts or soaks up the same amount of pollution elsewhere."
  technical: "An offset is credible only if the reduction is additional, meaning it would not have happened anyway, lasting, measured accurately and not counted twice. Many offsets have failed these tests, so good practice treats them as a supplement to cutting emissions, prefers removals for the emissions that remain, and discloses what is bought."
  example: "A fictional events company cuts its emissions by moving its conferences to venues powered by renewable energy, then buys verified removal credits for the flights its speakers still need, and reports the two separately."
  misconceptions:
    - claim: "Offsetting cancels out pollution exactly."
      correction: "Many projects are hard to verify, may not be additional and may not last; offsets are uncertain, which is why cutting emissions comes first."
  category: operations
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [net-zero, carbon-footprint, greenwashing, esg]

- id: circular-economy
  term: "Circular economy"
  definition: "An economic system that aims to keep products, components and materials in use at their highest value for as long as possible, designing out waste and pollution, instead of the linear pattern of take, make and throw away."
  simple: "An economy that wastes as little as possible: products are built to last, repaired, shared, reused and recycled, so materials go round in circles instead of ending up in the bin."
  technical: "The circular economy describes a whole system, while the IB toolkit's circular business models are the ways an individual business earns money within it. Its principles include designing for durability and disassembly, keeping products in technical cycles of repair, refurbishment, remanufacturing and recycling, and returning biological materials safely to nature, as in cradle-to-cradle design. Rebound effects, such as cheaper reused goods raising total consumption, can limit the environmental gains."
  example: "A fictional office furniture maker leases desks, takes them back at the end of each contract, refurbishes them for a second lease and remanufactures worn parts, so most of its steel stays in use for decades."
  misconceptions:
    - claim: "The circular economy is the same as recycling."
      correction: "Recycling is one of the last loops; keeping products in use through durability, repair, sharing and reuse keeps more value and saves more resources."
  category: concept
  qualifications: [secondary, undergraduate, mba, professional]
  frameworks: [circular-business-models]
  provenance: enrichment
  related: [circular-business-models, cradle-to-cradle-design, triple-bottom-line, reverse-logistics, life-cycle-assessment]

- id: esg
  term: "Environmental, social and governance (ESG)"
  aliases: ["ESG", "ESG criteria"]
  definition: "A set of criteria for judging a business's performance and risks on environmental, social and governance matters, used by investors, lenders and the business itself alongside its financial results."
  simple: "A way of judging a company not only by its profits but also by how it treats the environment, how it treats people, and how honestly and well it is run."
  technical: "Environmental criteria cover emissions, energy, water, waste and biodiversity; social criteria cover labour practices, health and safety, human rights, communities and customers; governance covers the board, pay, ethics and transparency. ESG ratings from different providers often disagree because they weigh the issues differently, and the term is used both for managing financial risk and for pursuing social goals, which causes confusion and accusations of greenwashing."
  example: "A fictional clothing company reports its ESG performance each year: its greenhouse gas emissions, the share of its factories audited for labour standards, and the independence of its board."
  misconceptions:
    - claim: "A high ESG rating means a company is good for the planet."
      correction: "Ratings measure selected risks and practices, weighted differently by each provider; a company can rate well while its products still cause harm."
    - claim: "ESG and CSR are the same thing."
      correction: "CSR describes a business's voluntary responsibilities; ESG is a set of criteria used, often by investors, to measure and compare performance and risk."
  category: stakeholder
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [corporate-social-responsibility, triple-bottom-line, corporate-governance, sustainability-reporting, greenwashing]

- id: greenwashing
  term: "Greenwashing"
  definition: "Making misleading or unsupported claims about the environmental benefits of a product, a service or a business, so that it appears more sustainable than it is."
  simple: "When a business pretends to be greener than it really is, for example by calling a product eco-friendly with no evidence, or advertising one small green product while the rest of its business pollutes."
  technical: "Forms include vague claims, selective disclosure, irrelevant claims, hidden trade-offs, invented labels and targets without plans. Regulators in many countries treat misleading green claims as unfair commercial practice, and the damage to reputation when greenwashing is exposed can far outweigh any benefit. Specific, verified and comparable claims are the remedy."
  example: "A fictional bottled water brand labels its bottles planet-friendly because the caps contain recycled plastic, although the bottles do not and its carbon footprint has grown."
  misconceptions:
    - claim: "Greenwashing requires an outright lie."
      correction: "It is often a true but misleading claim, such as highlighting one green feature while hiding larger harms."
  category: marketing
  qualifications: [secondary, undergraduate, mba, professional]
  provenance: enrichment
  related: [ethical-marketing, corporate-social-responsibility, esg, sustainability-reporting]

- id: life-cycle-assessment
  term: "Life cycle assessment (LCA)"
  aliases: ["LCA", "Life cycle analysis"]
  definition: "A method of measuring the environmental impacts of a product across its whole life, from extracting the raw materials, through manufacture, transport and use, to disposal or recycling."
  simple: "Adding up all the harm a product does to the environment over its whole life, from the materials it is made of to what happens when it is thrown away."
  technical: "An LCA defines its goal, scope and the unit it measures, builds an inventory of inputs and emissions at each stage, assesses impacts such as climate change, water use and toxicity, and interprets the results. It shows where impacts are concentrated, often in surprising stages such as use, but the results depend heavily on the boundaries and the data. It should not be confused with the product life cycle in marketing."
  example: "A fictional backpack maker's LCA shows that most of its bag's impact comes from producing the fabric, so it switches to recycled fabric before spending anything on lighter packaging."
  misconceptions:
    - claim: "Life cycle assessment is the same as the product life cycle."
      correction: "The product life cycle tracks sales over time; life cycle assessment measures environmental impact from raw materials to disposal."
  category: tool
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [carbon-footprint, scope-3-emissions, circular-economy, cradle-to-cradle-design]

- id: materiality-assessment
  term: "Materiality assessment"
  definition: "The process by which an organization identifies and ranks the environmental, social and governance issues that matter most to its business and its stakeholders, to decide what to manage and report."
  simple: "Working out which environmental and social issues matter most to a particular business, so that it concentrates on them instead of trying to report on everything."
  technical: "An assessment combines consultation with stakeholders with analysis of the effect on the business, often plotted on a grid of importance to stakeholders against importance to the business. Financial materiality asks how an issue affects the company's value; double materiality also asks how the company affects people and the planet. Issues change over time, so the assessment is repeated."
  example: "A fictional software company's assessment ranks data privacy and staff wellbeing as its most material issues and water use as a minor one, so its report concentrates on the first two."
  misconceptions:
    - claim: "Material issues are the same for every business."
      correction: "They depend on the industry and the business: water matters most to a brewery, data privacy to a software firm."
  category: tool
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [sustainability-reporting, esg, stakeholder-mapping, stakeholder]

- id: net-zero
  term: "Net zero"
  aliases: ["Net-zero emissions"]
  definition: "A state in which the greenhouse gases a business, a country or another body adds to the atmosphere are balanced by the amount it removes, after cutting its emissions as far as possible."
  simple: "Cutting pollution as much as possible and then balancing the small amount left by removing the same amount from the air, so the total added is zero."
  technical: "A credible net zero target covers all three scopes, cuts most emissions in absolute terms on a pathway consistent with climate science, sets interim milestones, and uses only lasting removals, not cheap offsets, for what is left. A target date far in the future without action in the near term is a common criticism. Net zero differs from carbon neutral, which often relies more heavily on offsets."
  example: "A fictional logistics firm sets a target of net zero by 2045, with an interim goal of halving its own emissions within ten years by moving its fleet to electric vans."
  misconceptions:
    - claim: "A business reaches net zero by buying enough carbon offsets."
      correction: "Credible net zero means deep cuts in its own emissions first, with removals only for the small remainder that cannot be cut."
  category: concept
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [carbon-footprint, carbon-offsetting, scope-1-emissions, scope-3-emissions, esg]

- id: scope-1-emissions
  term: "Scope 1 emissions"
  aliases: ["Direct emissions"]
  definition: "Greenhouse gas emissions that come directly from sources a business owns or controls, such as the fuel burned in its boilers, vehicles and equipment and the gases released by its processes."
  simple: "The pollution that comes straight out of a business's own chimneys, vans and machines."
  technical: "Under the widely used Greenhouse Gas Protocol, scope 1 covers direct emissions from owned or controlled sources, measured in tonnes of carbon dioxide equivalent, with other gases converted by their warming effect. They are the easiest emissions to measure and control, through switching fuels, electrification and efficiency."
  example: "A fictional bakery's scope 1 emissions come from the gas its ovens burn and the diesel its delivery vans use."
  misconceptions:
    - claim: "Scope 1 covers all of a business's emissions."
      correction: "It covers only direct emissions from the sources it owns or controls; bought energy is scope 2, and the rest of the value chain is scope 3."
  category: operations
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [scope-2-emissions, scope-3-emissions, carbon-footprint, net-zero]

- id: scope-2-emissions
  term: "Scope 2 emissions"
  aliases: ["Indirect energy emissions"]
  definition: "Indirect greenhouse gas emissions from generating the electricity, steam, heating and cooling that a business buys and uses."
  simple: "The pollution caused, somewhere else, by making the electricity and heat a business buys."
  technical: "Scope 2 emissions occur at the power station but are counted by the user, because its demand causes them. They can be reported on a location basis, using the average emissions of the local grid, or on a market basis, reflecting the contracts the business has chosen, such as renewable energy tariffs. Cutting them means using less energy or buying lower-carbon energy."
  example: "A fictional office firm's scope 2 emissions fall when it moves to a building heated by a low-carbon heat network and switches its electricity contract to renewable supply."
  misconceptions:
    - claim: "Scope 2 emissions are the energy supplier's problem, not the business's."
      correction: "They are counted by the business because its demand causes them, and its choices about how much energy it uses and where it buys it can reduce them."
  category: operations
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [scope-1-emissions, scope-3-emissions, carbon-footprint, net-zero]

- id: scope-3-emissions
  term: "Scope 3 emissions"
  aliases: ["Value chain emissions"]
  definition: "All the other indirect greenhouse gas emissions in a business's value chain, upstream in what it buys and downstream in how its products are transported, used and thrown away."
  simple: "The pollution caused by a business's suppliers, by delivering its goods, and by customers using and throwing away its products."
  technical: "The Greenhouse Gas Protocol divides scope 3 into fifteen categories, from purchased goods and business travel to the use and end of life of the products sold. For many businesses it is by far the largest part of total emissions, but it is the hardest to measure, relies on estimates and suppliers' data, and can be reduced only by working with suppliers, redesigning products and influencing customers."
  example: "For a fictional car maker, the fuel its cars burn after they are sold, and the steel it buys, cause far more emissions than its own factories."
  misconceptions:
    - claim: "A business has little responsibility for scope 3 emissions because it does not control them."
      correction: "They are part of its footprint and often the largest part; it can influence them through what it buys, how it designs its products and what it sells."
  category: operations
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [scope-1-emissions, scope-2-emissions, supply-chain, life-cycle-assessment, circular-business-models]

- id: stakeholder-capitalism
  term: "Stakeholder capitalism"
  definition: "The view that companies should be run to create long-term value for all their stakeholders, including employees, customers, suppliers, communities and the environment, not only for their shareholders."
  simple: "The idea that businesses should look after everyone they affect, not just the people who own them."
  technical: "It contrasts with shareholder primacy, the view that a company's main duty is to maximize the value of its shares within the law, leaving wider aims to governments and individuals. Supporters argue that long-term shareholder value depends on the trust of stakeholders; critics argue that managers who answer to everyone answer to no one. The IB course's stakeholder concept and social enterprises sit within this debate."
  example: "The board of a fictional supermarket chain decides to pay its small suppliers within 14 days, at some cost to its own cash flow, arguing that reliable suppliers protect the business in the long run."
  misconceptions:
    - claim: "Stakeholder capitalism means ignoring profit."
      correction: "It argues that long-term profit and value depend on treating all stakeholders well; profit remains essential."
  category: theory
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [stakeholder-concept, shareholder-value, corporate-social-responsibility, esg, fiduciary-duty]

- id: sustainability-reporting
  term: "Sustainability reporting"
  aliases: ["ESG reporting", "Non-financial reporting"]
  definition: "The disclosure by an organization of its environmental, social and governance performance, risks and targets, alongside or within its financial reporting."
  simple: "When a business publishes information about its effect on the environment and on society, such as its emissions and how it treats its workers, not only about its profits."
  technical: "Reports draw on frameworks and standards that set what to disclose and how, and in many places some disclosures are becoming compulsory. Debates centre on materiality, meaning what to report, on comparability, on assurance by auditors, and on the risk of selective, promotional reporting. Integrated reporting aims to show how financial and non-financial performance affect each other."
  example: "A fictional paper mill's annual sustainability report publishes its water use per tonne of paper, its scope 1 to 3 emissions, its safety record and an independent assurance statement on the figures."
  misconceptions:
    - claim: "Sustainability reports are just marketing."
      correction: "Some are, which is why independent assurance, standard measures and compulsory rules matter; a good report gives investors and other stakeholders information they can use."
  category: stakeholder
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [esg, materiality-assessment, triple-bottom-line, external-audit]

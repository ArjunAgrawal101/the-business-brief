# Glossary: corporate governance terms beyond the IB course.
# Every entry is enrichment (provenance: enrichment): it names no IB subtopic, never carries
# the ib qualification, and links to the IB terms it builds on through related. Definitions,
# explanations and examples are the platform's own words; every business named is fictional.
# Entries are in alphabetical order of term.

- id: agency-problem
  term: "Agency problem"
  aliases: ["Principal-agent problem", "Agency costs"]
  definition: "The conflict of interest that arises when one party, the agent, acts on behalf of another, the principal, but has different goals and better information, such as managers running a company for its shareholders."
  simple: "When the people running a business for its owners are tempted to act in their own interest instead, for example by paying themselves too much or avoiding risky decisions that could cost them their jobs."
  technical: "Because managers (the agents) know more than shareholders (the principals) and their interests differ, they may pursue size, perks or safety at the owners' expense. Agency costs include the cost of monitoring, such as audits and boards, and the loss when interests still diverge. Remedies include performance-related pay, share ownership for managers, independent boards and the threat of takeover. The IB course's divorce of ownership and control is the setting in which the problem arises."
  example: "The fictional chief executive of a listed hotel group pushes for an expensive acquisition that will make the company larger and her pay higher, although analysts expect it to reduce the value of the shares."
  misconceptions:
    - claim: "The agency problem only means managers being dishonest."
      correction: "It arises from different interests and information even among honest managers, for example a manager who avoids worthwhile risks to protect their own job."
  category: theory
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [divorce-of-ownership-and-control, corporate-governance, executive-remuneration, shareholder-value, fiduciary-duty]

- id: annual-general-meeting
  term: "Annual general meeting (AGM)"
  aliases: ["AGM"]
  definition: "A yearly meeting of a company's shareholders at which the directors present the accounts and the shareholders vote on matters such as electing directors, appointing auditors and approving dividends."
  simple: "The once-a-year meeting where a company's owners hear how it has done, question the directors and vote on important matters."
  technical: "AGMs are a legal requirement for many companies, though the rules differ between countries and types of company. Most votes are cast in advance by proxy, so the meeting's main value is accountability: directors answer questions in public. Shareholders use AGM votes to signal opposition, for example to executive pay."
  example: "At a fictional chemicals company's AGM, 38% of the votes cast are against the pay report, and the board promises to consult shareholders before the next one."
  misconceptions:
    - claim: "Shareholders run the company through the AGM."
      correction: "The AGM lets them hold the directors to account and vote on certain matters; the board and the managers still run the company."
  category: organization
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [shareholder, board-of-directors, executive-remuneration, shareholder-activism]

- id: board-of-directors
  term: "Board of directors"
  aliases: ["Board", "Directors"]
  definition: "The group of people elected by a company's shareholders to oversee its management, set its strategic direction and protect the interests of the company and its owners."
  simple: "The group at the top of a company, chosen by the shareholders, who make the biggest decisions, appoint the chief executive and check that the company is well run."
  technical: "Boards combine executive directors, who manage the business, with non-executive directors, who provide independent oversight; some countries separate a management board from a supervisory board. The board approves strategy, major investments and dividends, appoints and removes the chief executive, oversees risk and reports to shareholders. How well it works depends on its independence, skills, diversity and the information it receives."
  example: "The fictional board of a family-owned brewery that has just listed its shares adds three independent non-executive directors with finance, retail and legal experience to balance the family's four seats."
  misconceptions:
    - claim: "The board runs the company day to day."
      correction: "The executives run it day to day; the board sets direction, appoints and oversees the executives and takes the biggest decisions."
  category: organization
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [corporate-governance, non-executive-director, shareholder, fiduciary-duty, annual-general-meeting]

- id: conflict-of-interest
  term: "Conflict of interest"
  definition: "A situation in which a person's private interests could influence, or appear to influence, the way they carry out their duty to an organization or to others."
  simple: "When someone could gain personally from a decision they are supposed to make fairly, such as a manager choosing a supplier owned by their brother."
  technical: "Conflicts are managed through disclosure, registers of interests, stepping out of the decisions concerned and independent oversight, and directors' fiduciary duties require them to avoid unmanaged conflicts. The appearance of a conflict can damage trust even when no harm is done."
  example: "A fictional hospital's purchasing manager declares that her partner works for one of the bidders for a contract, and leaves the panel that chooses the winner."
  misconceptions:
    - claim: "A conflict of interest only matters if someone actually gains."
      correction: "The risk and the appearance of bias both damage trust, so conflicts must be declared and managed before decisions are made."
  category: stakeholder
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [fiduciary-duty, business-ethics, corporate-governance, agency-problem]

- id: corporate-governance
  term: "Corporate governance"
  definition: "The system of rules, practices and processes by which a company is directed and controlled, setting out the responsibilities of the board, the managers and the shareholders and how each is held to account."
  simple: "The rules and checks that make sure a company is run properly and honestly, and that the people running it act for its owners and do not abuse their power."
  technical: "Governance responds to the agency problem created by the divorce of ownership and control. Its mechanisms include a board with independent non-executive directors, board committees for audit, pay and appointments, the external audit, disclosure, shareholder votes and codes of practice, which in many countries apply on a comply-or-explain basis. Stakeholder views extend governance to employees, communities and the environment."
  example: "A fictional listed engineering group separates the roles of chair and chief executive, appoints a majority of independent directors and puts executive pay to a shareholder vote each year."
  misconceptions:
    - claim: "Corporate governance is only about obeying the law."
      correction: "Much of it is voluntary codes and good practice that go beyond the law, such as independent directors and regular reviews of how the board works."
  category: organization
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [board-of-directors, agency-problem, divorce-of-ownership-and-control, shareholder, external-audit]

- id: executive-remuneration
  term: "Executive remuneration"
  aliases: ["Executive pay"]
  definition: "The pay and benefits of a company's senior executives, usually a salary plus short-term bonuses, long-term share-based incentives, a pension and other benefits."
  simple: "How much the bosses of a company are paid, including their salary, bonuses and shares."
  technical: "A committee of independent directors sets executive pay, which is designed to attract talent and to align executives' interests with shareholders', a response to the agency problem. Badly designed schemes reward luck, encourage short-term thinking or the manipulation of the measures, and the gap between executive and average pay is a question of fairness and reputation. Many countries require disclosure of executive pay and a shareholder vote on it."
  example: "A fictional transport group ties half of its chief executive's bonus to punctuality and safety targets, not only to profit, after shareholders complained that the old scheme rewarded cost cuts that harmed the service."
  misconceptions:
    - claim: "Paying executives in shares always aligns them with shareholders."
      correction: "Share awards can encourage short-term moves to lift the price before the shares are released; their design and time horizon matter."
  category: people
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [agency-problem, performance-related-pay, corporate-governance, employee-share-ownership-scheme]

- id: external-audit
  term: "External audit"
  aliases: ["Statutory audit", "Audit"]
  definition: "An independent examination of a company's financial statements by qualified auditors, who give an opinion on whether the statements give a true and fair view under the accounting rules."
  simple: "Outside accountants checking a company's accounts and saying whether they can be trusted."
  technical: "Auditors test transactions, balances and controls on a sample basis and report to the shareholders, not the managers, which supports trust in published accounts. An audit gives reasonable, not absolute, assurance and is not designed mainly to find fraud. Independence can be threatened by long relationships and by selling other services to the same client, which is why many countries rotate auditors."
  example: "The fictional auditors of a furniture importer find stock valued above what it could be sold for, and will not sign off the accounts until it is written down."
  misconceptions:
    - claim: "An audit guarantees the accounts are correct."
      correction: "It gives reasonable assurance based on samples and judgement; errors and fraud can still go undetected."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [final-accounts, corporate-governance, window-dressing, non-executive-director]

- id: fiduciary-duty
  term: "Fiduciary duty"
  aliases: ["Fiduciary"]
  definition: "A legal and ethical obligation to act in the best interests of another person or organization, with loyalty and care, as directors owe to their company and trustees to the people they act for."
  simple: "The duty of someone trusted with another's affairs, like a company director, to put that person's or that company's interests ahead of their own."
  technical: "Directors' fiduciary duties generally include acting in good faith in the company's interests, avoiding conflicts of interest, not profiting secretly from their position, and using reasonable care and skill. To whom the duty is owed, the company, its shareholders or its wider stakeholders, varies between legal systems, which shapes the debates about stakeholder capitalism and ESG."
  example: "A fictional director of a construction company who owns a supplier must declare that interest and stay out of the decision when the board chooses between that supplier and its rivals."
  misconceptions:
    - claim: "A fiduciary duty means always maximizing short-term profit."
      correction: "It means acting loyally and carefully in the company's interests, which in most systems allows, and sometimes requires, attention to long-term success and to other stakeholders."
  category: organization
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [board-of-directors, conflict-of-interest, corporate-governance, agency-problem]

- id: non-executive-director
  term: "Non-executive director"
  aliases: ["NED", "Independent director"]
  definition: "A member of a company's board who is not an employee and does not manage the business, appointed to provide independent judgement, challenge and oversight."
  simple: "A board member from outside the company who does not work there day to day, there to question the managers and protect the shareholders' interests."
  technical: "Independent non-executives chair or sit on the audit, pay and appointments committees, challenge strategy and monitor the executives, and bring outside experience. Their independence can be weakened by long service, personal ties or their fees, and they depend on management for information, which limits how much they can see."
  example: "A fictional retailer appoints a former auditor as a non-executive director to chair its audit committee after a stock-counting error overstated its profit."
  misconceptions:
    - claim: "Non-executive directors have no responsibility because they do not manage the company."
      correction: "They share the board's legal duties and can be held responsible for its decisions."
  category: organization
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [board-of-directors, corporate-governance, external-audit, agency-problem]

- id: shareholder-activism
  term: "Shareholder activism"
  aliases: ["Activist investor"]
  definition: "The use of shareholders' rights, such as votes, public campaigns and meetings with the board, to press a company to change its strategy, governance or behaviour."
  simple: "When some of a company's owners campaign to make it change, for example by voting against the directors or demanding that it sell part of the business."
  technical: "Activists range from funds seeking higher returns through restructuring, share buybacks or a sale, to pension funds and campaign groups pressing on climate, pay or governance. Their tactics include private meetings, resolutions at the AGM, seeking seats on the board and public letters. Supporters see a check on complacent managers; critics argue that some activists push short-term gains at a long-term cost."
  example: "A fictional pension fund that owns 3% of a mining company files a resolution at its AGM asking it to publish a plan to cut its emissions, and 30% of the votes cast support it."
  misconceptions:
    - claim: "Activist shareholders always want short-term profit."
      correction: "Some do, but others campaign for long-term changes on governance, pay or environmental risk."
  category: stakeholder
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [shareholder, annual-general-meeting, corporate-governance, esg, pressure-group]

- id: whistleblowing
  term: "Whistleblowing"
  aliases: ["Whistleblower"]
  definition: "Reporting wrongdoing within an organization, such as fraud, danger to health or breaking the law, to people inside or outside it who can act on it."
  simple: "When an employee speaks up about something seriously wrong at work, like fraud or a safety danger, to managers, regulators or sometimes the media."
  technical: "Whistleblowing is part of governance because insiders often see problems that boards and auditors miss. Many countries protect whistleblowers from dismissal for disclosures made in the public interest, and good practice provides confidential internal channels. Retaliation and a culture of silence are the main barriers, which links whistleblowing to organizational culture and ethics."
  example: "A fictional food factory worker reports that safety checks are being signed off without being done; the company's confidential hotline passes the report to the audit committee, which investigates."
  misconceptions:
    - claim: "A whistleblower is disloyal to their employer."
      correction: "Reporting serious wrongdoing can protect the organization, its customers and the public, which is why many laws protect it."
  category: stakeholder
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [business-ethics, corporate-governance, organizational-culture, conflict-of-interest]

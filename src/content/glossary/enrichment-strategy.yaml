# Glossary: strategy terms beyond the IB course.
# Every entry is enrichment (provenance: enrichment): it names no IB subtopic, never carries
# the ib qualification, and links to the IB terms it builds on through related. Definitions,
# explanations and examples are the platform's own words; every business named is fictional.
# Entries are in alphabetical order of term.

- id: balanced-scorecard
  term: "Balanced scorecard"
  definition: "A performance management framework that measures an organization against its strategy from four perspectives: financial, customer, internal business processes, and learning and growth."
  simple: "A way of keeping score in a business that looks at more than money: how customers see it, how well its processes work and whether its people are learning, as well as its finances."
  technical: "Associated with Robert Kaplan and David Norton, the scorecard sets objectives, measures, targets and initiatives in each perspective and links them in a chain of cause and effect, often drawn as a strategy map: learning and growth improve processes, which improve customer outcomes, which drive financial results. Its value depends on choosing a few meaningful measures; it can turn into a bureaucratic list of indicators."
  example: "A fictional hospital tracks cost per patient (financial), patient satisfaction (customer), waiting times (processes) and staff training hours (learning and growth) on one scorecard."
  misconceptions:
    - claim: "Balanced means giving every measure equal weight."
      correction: "It refers to covering four perspectives, not to equal weights; the measures should reflect the strategy."
  category: tool
  qualifications: [undergraduate, mba, professional]
  frameworks: [balanced-scorecard]
  provenance: enrichment
  related: [key-performance-indicator, strategic-objective, smart-objectives, benchmarking]

- id: barriers-to-entry
  term: "Barriers to entry"
  aliases: ["Entry barriers"]
  definition: "Obstacles that make it difficult or costly for a new business to enter a market and compete with the firms already in it."
  simple: "Things that make it hard for a new business to start competing in a market, such as the huge cost of setting up, strong brands customers already trust, or rules that require a licence."
  technical: "Barriers include economies of scale, the capital required, brand loyalty, access to distribution channels, patents and other intellectual property, regulation and licences, switching costs and network effects. High barriers protect the profits of the firms already in the market, which is one of Porter's five forces, but they can draw the attention of regulators, and they erode when technology changes the cost of entry."
  example: "A fictional spring water bottler faces little threat from start-ups, because a new entrant would need a licensed spring, a bottling plant and supermarket shelf space already filled by established brands."
  misconceptions:
    - claim: "Barriers to entry are always created by governments."
      correction: "Many come from the firms themselves or from the economics of the industry, such as scale, brands and network effects."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  frameworks: [five-forces]
  provenance: enrichment
  related: [porters-five-forces, economies-of-scale, patent, switching-costs, network-effects]

- id: blue-ocean-strategy
  term: "Blue ocean strategy"
  aliases: ["Blue ocean thinking"]
  definition: "A strategy of creating new market space in which there is little competition, by offering a new combination of value, rather than fighting rivals for share of an existing, crowded market."
  simple: "Instead of fighting rivals in a crowded market, a red ocean, finding or creating a new space with few competitors, a blue ocean, by offering something different that new customers want."
  technical: "The approach, from W. Chan Kim and Renée Mauborgne, aims at value innovation: raising value for buyers while lowering cost, by asking which of an industry's usual factors to eliminate, reduce, raise and create. It challenges the idea that a firm must choose between low cost and differentiation. Blue oceans attract imitators once they prove profitable, so the advantage still has to be defended."
  example: "A fictional fitness business drops the costly features of traditional gyms, such as pools, contracts and large floors, adds short guided sessions bookable by the hour in office districts, and attracts busy workers who had never joined a gym."
  misconceptions:
    - claim: "A blue ocean is a market with no competitors at all."
      correction: "It is a market space where competition is not yet relevant; once it proves profitable, rivals usually follow."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [porters-generic-strategies, differentiation, gap-in-the-market, innovation, disruptive-innovation]

- id: business-model
  term: "Business model"
  definition: "How a business creates value for customers, delivers it, and captures part of that value as revenue and profit."
  simple: "The basic plan for how a business makes money: what it offers, to whom, how it reaches them, what it costs to run, and how customers pay."
  technical: "A business model links the value proposition, customer segments, channels and relationships with the resources, activities and partners needed to deliver them, and with the revenue streams and cost structure that result, which is the structure of the business model canvas. The same product can be sold through different models, such as outright sale, subscription, leasing or free use paid for by advertising, with very different economics."
  example: "A fictional power tool maker changes its business model from selling drills to renting them by the day from lockers in hardware stores, earning more from each tool over its life."
  misconceptions:
    - claim: "A business model is the same as a business plan."
      correction: "The model is how the business creates and captures value; the plan is a document that sets out how the business will be launched or run, including its model."
  category: strategy
  qualifications: [secondary, undergraduate, mba, professional]
  frameworks: [business-model-canvas]
  provenance: enrichment
  related: [value-proposition, revenue-stream, circular-business-models, business-plan, platform-business-model]

- id: business-model-canvas
  term: "Business model canvas"
  definition: "A one-page template for describing, designing and testing a business model in nine blocks: customer segments, value propositions, channels, customer relationships, revenue streams, key resources, key activities, key partners and cost structure."
  simple: "A single page with nine boxes that, once filled in, shows how a business will make money: who its customers are, what it offers them, how it reaches them, and what it needs and spends to do it."
  technical: "Developed by Alexander Osterwalder with Yves Pigneur, the canvas is used to map a current model, compare alternatives and list the assumptions to test, which links it to lean start-up methods. Its strength is a shared, visual language; its limits are that it is a snapshot, says little about competitors and can make an untested idea look finished."
  example: "A fictional student start-up fills in a canvas for a textbook rental service and realizes that its key partner, the campus bookshop, is also its main competitor."
  misconceptions:
    - claim: "A completed canvas proves a business idea works."
      correction: "It sets out assumptions; each still needs testing with real customers."
  category: tool
  qualifications: [secondary, undergraduate, mba, professional]
  frameworks: [business-model-canvas]
  provenance: enrichment
  related: [business-model, value-proposition, revenue-stream, business-plan, lean-start-up]

- id: competitive-advantage
  term: "Competitive advantage"
  aliases: ["Sustainable competitive advantage"]
  definition: "Something that allows a business to outperform its rivals over time, by offering customers better value or by producing at lower cost."
  simple: "The reason a business does better than its competitors, such as lower costs, a better product or a brand people trust."
  technical: "Porter traces competitive advantage to lower cost or to differentiation; the resource-based view traces it to resources and capabilities that are valuable, rare, hard to imitate and organized to be used. An advantage is sustainable if rivals cannot quickly copy or cancel it, which is why advantages built on a single feature or a price cut are often short-lived."
  example: "A fictional regional bus operator's advantage is its network of depots near every town, which lets it run more frequent services at lower cost than any newcomer could."
  misconceptions:
    - claim: "A unique selling point is the same as a competitive advantage."
      correction: "A USP is a feature or claim; an advantage is a lasting superiority in value or cost that a business can defend."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [porters-generic-strategies, core-competence, value-chain, resource-based-view, unique-selling-point]

- id: core-competence
  term: "Core competence"
  aliases: ["Core competency", "Core competences"]
  definition: "A combination of skills, knowledge and technology that a business has distinctively, that customers value, that rivals find hard to copy, and that can be used across several products or markets."
  simple: "Something a business is unusually good at, deep down, that gives it an edge in many products, such as one firm's skill at making small, precise motors that it uses in cameras, drills and toys."
  technical: "The idea, from Gary Hamel and C. K. Prahalad, is that a firm should be seen as a portfolio of competences, not only of products. A core competence gives access to many markets, adds to the benefits customers perceive and is difficult to imitate. It guides decisions on diversification and outsourcing: keep the core in house, and consider outsourcing what is not."
  example: "A fictional optics company builds on its core competence in precision lens grinding to make products for cameras, microscopes and car sensors, entering each market faster than rivals that start from scratch."
  misconceptions:
    - claim: "Anything a business is good at is a core competence."
      correction: "It must be distinctive, valued by customers, hard to copy and usable across several markets; being competent is not enough."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [competitive-advantage, value-chain, resource-based-view, outsourcing, diversification]

- id: economies-of-scope
  term: "Economies of scope"
  definition: "Cost savings that arise when a business produces a range of products together more cheaply than separate businesses could produce each one."
  simple: "Savings from making several different things with the same resources, such as a bakery using its ovens and staff to make bread, cakes and sandwiches."
  technical: "Economies of scope come from shared inputs: facilities, distribution networks, brands, technology or know-how that serve several products at little extra cost. They are the reason for related diversification and for many platforms. Unlike economies of scale, which come from more of one product, they come from variety, and they can be offset by the complexity and lost focus of managing many products."
  example: "A fictional courier company uses the same vans, depots and tracking software for parcels, food deliveries and urgent documents, so each service costs less than it would for a single-service rival."
  misconceptions:
    - claim: "Economies of scope and economies of scale are the same."
      correction: "Scale comes from producing more of one thing; scope comes from producing several things with shared resources."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [economies-of-scale, diversification, synergy, product-portfolio]

- id: first-mover-advantage
  term: "First-mover advantage"
  definition: "The benefit a business can gain by being first to enter a market with a new product, such as brand recognition, loyal customers, control of scarce resources or a head start in learning."
  simple: "The edge a business can get by being first with something new: people remember the name, and it can win the best customers, places and suppliers before anyone else arrives."
  technical: "First movers can build switching costs, network effects and economies of scale before rivals arrive. Being first also carries the cost of educating the market and the risk of getting the product wrong, while followers learn from the pioneer's mistakes and enter with better versions, which is why many markets are won by fast followers."
  example: "A fictional e-scooter firm is first in a city and wins the council's only licence, but a later rival that studied its problems with battery life wins the licence when it comes up for renewal."
  misconceptions:
    - claim: "Being first to market guarantees success."
      correction: "Pioneers bear the cost and risk of creating the market; followers who learn from their mistakes often overtake them."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [network-effects, barriers-to-entry, innovation, price-skimming]

- id: mckinsey-7s-model
  term: "McKinsey 7S model"
  aliases: ["7S framework", "Seven S model"]
  definition: "A framework of seven interdependent elements of an organization, strategy, structure, systems, shared values, style, staff and skills, used to analyse its effectiveness or to plan a change."
  simple: "A checklist of seven things inside an organization that all have to fit together. If you change one, like the structure, you need to check that the other six still match."
  technical: "Strategy, structure and systems are the hard elements, easier to define and change; style, staff and skills are the soft elements, harder to see and change, with shared values at the centre. The model's point is alignment: a misfit between elements explains why a change stalls. It is descriptive and does not say how to fix a misfit, and it pays little attention to the outside environment."
  example: "A fictional bank reorganizes into product teams (structure) but keeps bonuses tied to branch sales (systems), so staff keep working as before; a 7S review shows the misfit."
  misconceptions:
    - claim: "The 7S model tells managers what to change."
      correction: "It shows how the elements fit and where they clash; deciding what to change still needs judgement."
  category: theory
  qualifications: [undergraduate, mba, professional]
  frameworks: [mckinsey-7s]
  provenance: enrichment
  related: [organizational-structure, organizational-culture, change-management, strategy]

- id: network-effects
  term: "Network effects"
  aliases: ["Network externalities"]
  definition: "The effect by which a product or service becomes more valuable to each user as more people use it."
  simple: "When something gets better the more people use it, like a messaging app that is more useful when all your friends are on it."
  technical: "Direct network effects arise among users of the same kind, as in a messaging network; indirect or cross-side effects arise between groups on a platform, such as buyers and sellers on a marketplace. They create barriers to entry and markets in which the leader takes most of the rewards, which encourages firms to subsidize early users. They can also work in reverse: as users leave, the value falls for those who remain."
  example: "A fictional tutoring marketplace attracts more students as more tutors join, and more tutors as more students join, so a newcomer with better software struggles to compete."
  misconceptions:
    - claim: "Network effects guarantee that the largest firm wins for ever."
      correction: "Users can leave together if a better or cheaper network appears, and in some markets the effects are local or weak."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [platform-business-model, barriers-to-entry, first-mover-advantage, penetration-pricing]

- id: platform-business-model
  term: "Platform business model"
  aliases: ["Platform", "Two-sided market"]
  definition: "A business model in which a firm creates value by connecting two or more groups of users, such as buyers and sellers, and makes money from the interactions between them."
  simple: "A business that does not make the product itself but brings people together, like an app that connects drivers with passengers or a website that connects sellers with buyers, and takes a share."
  technical: "Platforms depend on network effects between their sides, so they often subsidize one side to attract the other, and they face a chicken-and-egg problem at launch. Revenue comes from commissions, fees, subscriptions or advertising. Their power over users raises questions about competition, data and the treatment of the people who work through them."
  example: "A fictional platform that connects home cooks with neighbours who want meals charges cooks 15% of each order and lets diners join free, to build both sides quickly."
  misconceptions:
    - claim: "Platforms have no costs because they own no products."
      correction: "They spend heavily on technology, trust and safety, marketing and subsidies to attract users on each side."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [network-effects, business-model, gig-economy, e-commerce]

- id: porters-five-forces
  term: "Porter's five forces"
  aliases: ["Five forces", "Five forces model"]
  definition: "A framework that explains how profitable an industry is likely to be through five competitive forces: rivalry among existing firms, the threat of new entrants, the bargaining power of suppliers and of buyers, and the threat of substitutes."
  simple: "A way of checking how hard it is to make money in an industry, by looking at five kinds of pressure: rivals, newcomers, suppliers, customers and other products that could replace yours."
  technical: "The model, from Michael Porter, analyses the structure of an industry rather than a single firm. Strong forces compete profit away; weak forces leave room for high returns. It informs decisions to enter or leave an industry and points to defences, such as raising switching costs or building barriers to entry. It is static and treats every relationship as rivalry, so it fits less well with fast-changing markets and with ecosystems in which firms cooperate."
  example: "A fictional analysis of food delivery apps in one city finds rivalry high, buyer power high because customers switch apps freely, supplier power medium because restaurants can join several apps, the threat of entry medium and substitutes high because customers can cook or collect, which suggests low profits for the average app."
  misconceptions:
    - claim: "Five forces analyses a single company."
      correction: "It analyses an industry; a company's own strengths and position need other tools, such as a SWOT or the value chain."
    - claim: "A business can do nothing about the five forces."
      correction: "Strategy can change the forces a business faces, for example by raising switching costs or securing its supplies."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  frameworks: [five-forces]
  provenance: enrichment
  related: [barriers-to-entry, substitute-product, switching-costs, competitive-advantage, porters-generic-strategies]

- id: resource-based-view
  term: "Resource-based view (RBV)"
  aliases: ["RBV", "VRIO framework"]
  definition: "The view that a business's competitive advantage comes mainly from its internal resources and capabilities, particularly those that are valuable, rare, hard to imitate and well organized."
  simple: "The idea that a business wins mainly because of what it has and does inside, such as special skills, knowledge or a brand, rather than only because of the market it is in."
  technical: "The VRIO test asks whether a resource is valuable (it lets the firm use opportunities or counter threats), rare, costly to imitate, and whether the firm is organized to capture its value. Resources that pass every test support a lasting advantage. The view complements industry analysis such as the five forces, which looks outwards; critics note that it can be hard to tell in advance which resources will matter."
  example: "A fictional fashion retailer's data on customers' sizes and returns passes the VRIO test: it is valuable, no rival has it, it would take years to build, and the firm has a team that uses it to design better-fitting ranges."
  misconceptions:
    - claim: "Any expensive resource is a source of advantage."
      correction: "A resource gives an advantage only if it is valuable, rare and hard to copy, and the firm is organized to use it."
  category: theory
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [core-competence, competitive-advantage, value-chain, porters-five-forces]

- id: scenario-planning
  term: "Scenario planning"
  definition: "A way of preparing for an uncertain future by developing several plausible, contrasting stories of how the business environment might develop, and testing strategies against each."
  simple: "Imagining a few different futures, such as fast growth, a slump or a new technology taking over, and checking whether the business's plans would work in each one."
  technical: "Scenarios are built from the driving forces and key uncertainties found in an environmental scan such as PESTLE, often by crossing two uncertainties to give four scenarios. They are not forecasts: the aim is strategies that hold up in several futures, and early warning signs of which future is arriving, not predicting the right one."
  example: "A fictional airline builds four scenarios from two uncertainties, the price of fuel and the demand for business travel, and finds that its plan to buy large aircraft works in only one of them."
  misconceptions:
    - claim: "Scenario planning tries to predict the future."
      correction: "It prepares for several possible futures, so that strategy does not depend on one forecast being right."
  category: tool
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [steeple-analysis, contingency-planning, sensitivity-analysis, strategy]

- id: strategic-drift
  term: "Strategic drift"
  definition: "The gradual divergence of an organization's strategy from changes in its environment, as it keeps doing what worked in the past while customers, technology or competitors move on."
  simple: "When a business keeps doing what used to work while the world around it slowly changes, until it suddenly finds itself out of step and in trouble."
  technical: "Drift happens because change is gradual, past success breeds confidence, and culture and routines filter out uncomfortable signals. It often ends in a crisis that forces a sudden transformation or ends in failure. Environmental scanning, scenario planning and leaders who challenge assumptions help to prevent it."
  example: "A fictional chain of camera shops keeps opening stores and refining its film-processing service while customers move to phone cameras, and by the time sales collapse it has little cash left to change."
  misconceptions:
    - claim: "Strategic drift only happens to badly run businesses."
      correction: "It often follows success, because what worked before shapes how managers see the world."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [strategy, organizational-culture, resistance-to-change, scenario-planning]

- id: substitute-product
  term: "Substitute product"
  aliases: ["Substitutes", "Threat of substitutes"]
  definition: "A different product or service that meets the same customer need, so that customers can switch to it if an industry's prices rise or its quality falls."
  simple: "Something different that does the same job for the customer. A video call can be a substitute for a business flight; a bicycle can be a substitute for a bus pass."
  technical: "In Porter's five forces, substitutes come from outside the industry and cap the price it can charge. The threat depends on the substitute's price and performance compared with the product, and on switching costs. Substitutes are easy to overlook because they are not direct competitors, which is how industries are disrupted."
  example: "A fictional chain of print shops sees demand for printed brochures fall as customers move to digital brochures, a substitute that meets the same need to inform customers at a lower cost."
  misconceptions:
    - claim: "A substitute is the same as a competitor's product."
      correction: "A rival's version of the same product is direct competition; a substitute is a different product that meets the same need."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  frameworks: [five-forces]
  provenance: enrichment
  related: [porters-five-forces, price-elasticity-of-demand, disruptive-innovation, competitive-pricing]

- id: switching-costs
  term: "Switching costs"
  definition: "The costs, in money, time, effort or risk, that a customer bears when changing from one supplier or product to another."
  simple: "The hassle or cost of changing to a different supplier, such as learning a new system, losing saved data or paying a fee to leave a contract."
  technical: "Switching costs can be financial (exit fees, new equipment), procedural (learning, setting up) or relational (losing a relationship or loyalty rewards). High switching costs reduce buyer power and churn, and so support pricing power; businesses build them deliberately through integration, loyalty schemes and data. Regulators sometimes lower them, for example by requiring that customers can take their phone number or their data with them."
  example: "A fictional accounting software firm keeps its customers because moving years of records to a rival's system would take a small business weeks of work, even if the rival were cheaper."
  misconceptions:
    - claim: "Switching costs are only money."
      correction: "Time, effort, risk and the loss of data or relationships often matter more than fees."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [porters-five-forces, customer-loyalty-programme, churn-rate, barriers-to-entry, brand-loyalty]

- id: value-chain
  term: "Value chain"
  aliases: ["Value chain analysis"]
  definition: "The sequence of activities a business carries out to create a product or service, split into primary activities and support activities, used to find where it adds value and where it could gain an advantage."
  simple: "A picture of all the steps a business goes through to make and sell something, from bringing in materials to after-sales service, plus the support that helps every step. It shows where value, and cost, are created."
  technical: "In Porter's version, the primary activities are inbound logistics, operations, outbound logistics, marketing and sales, and service; the support activities are firm infrastructure, human resource management, technology development and procurement. The margin is the difference between the value created and the cost of the activities. Analysis looks for activities that can be done more cheaply or more distinctively, and for the links between them, and a firm's chain sits within the wider system of its suppliers' and buyers' chains."
  example: "A fictional coffee roaster finds its advantage lies in inbound logistics, buying directly from farms, and in service, training the cafés it supplies, while its packaging operation adds cost without making it distinctive and could be outsourced."
  misconceptions:
    - claim: "The value chain is the same as the supply chain."
      correction: "The supply chain links many businesses from raw materials to the customer; the value chain analyses the activities inside one business."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  frameworks: [value-chain]
  provenance: enrichment
  related: [competitive-advantage, core-competence, outsourcing, supply-chain, added-value]

- id: value-proposition
  term: "Value proposition"
  definition: "The promise of value a business makes to a particular group of customers: the benefits they will receive and why they should choose it over the alternatives."
  simple: "The reason a customer should buy from you: what problem you solve for them, or what you make better, compared with their other options."
  technical: "A strong value proposition is specific to a segment, built around the customer's tasks, frustrations and hoped-for gains, and different from the alternatives, including doing nothing. It sits at the centre of the business model canvas and must be consistent with the marketing mix and the positioning."
  example: "A fictional laundry service's value proposition to busy parents is collection and return within 24 hours, booked in under a minute, at a price close to a launderette's."
  misconceptions:
    - claim: "A value proposition is a slogan."
      correction: "A slogan may express it, but the proposition is the substance: the benefits a segment receives, which the product and service must deliver."
  category: marketing
  qualifications: [secondary, undergraduate, mba, professional]
  frameworks: [business-model-canvas]
  provenance: enrichment
  related: [business-model, unique-selling-point, positioning, target-market]

- id: data-privacy
  term: Data privacy
  aliases: [data protection]
  definition: >-
    People's right to control how information about them is collected, used, stored and shared, and the duty of
    businesses to handle personal data lawfully, securely and fairly.
  context: >-
    Many countries have data protection laws that require businesses to collect only the data they need, explain
    why they need it, keep it secure and delete it when it is no longer needed. Respecting privacy builds trust,
    while breaches bring fines and lost customers. It is central to the ethics of management information
    systems, from loyalty programmes to employee monitoring.
  example: >-
    A fitness app asks users for clear permission before sharing their workout data with insurers, and lets them
    delete their account and data at any time.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: stakeholder
  provenance: subject-knowledge
  related: [cybersecurity, employee-monitoring, customer-loyalty-programme, database]

- id: algorithmic-bias
  term: Algorithmic bias
  aliases: [AI bias]
  definition: >-
    Systematic unfairness in the results of a computer system, such as an AI model, that favours or
    disadvantages particular groups of people, often because it learned from biased or incomplete data.
  context: >-
    A system trained on past decisions can repeat past prejudice, for example in recruitment, lending or which
    customers receive the best offers. Because the results look objective and the workings are hard to see, bias
    can go unnoticed. Businesses reduce it by testing results across groups, improving their data and keeping
    people accountable for decisions.
  example: >-
    A recruitment tool trained on a firm's past hires keeps ranking applicants from one kind of university
    highest, because those are the people the firm hired before.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: stakeholder
  provenance: subject-knowledge

# Glossary: Unit 5, Operations management (subtopics 5.1 to 5.9). Definitions,
# context and examples are the platform's own wording, checked for scope against
# the IB guide (pp. 33 to 36 and the formulae on p. 65). Terms for 5.5 that
# already exist in costs.yaml (contribution, break-even-quantity,
# margin-of-safety, target-profit-output) are reused, not repeated here.

# ---------- 5.1 Introduction to operations management ----------
- id: operations-management
  term: Operations management
  aliases: [production management]
  definition: >-
    The business function that designs, runs and improves the processes that turn inputs, such as materials,
    labour, equipment and information, into the goods and services a business sells.
  context: >-
    It is one of the four business functions, alongside human resources, finance and marketing, and its
    decisions feed into all of them: a new production method changes staffing, costs and what marketing can
    promise customers. In a service business the process often happens in front of the customer, so operations
    and the customer's experience overlap. Most of a business's costs arise in operations, so small gains in
    efficiency or quality can have a large effect on profit.
  example: >-
    A café's operations cover ordering beans and milk, planning the baristas' shifts, the layout of the counter,
    and the speed and consistency of every drink served.
  topics: []
  subtopics: ['5.1']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [efficiency, quality, productivity-rate, supply-chain, lean-production]

- id: efficiency
  term: Efficiency
  aliases: [operational efficiency]
  definition: >-
    Producing a given output with as few resources as possible, or getting as much output as possible from the
    resources used.
  context: >-
    Efficiency is about how well inputs are used, so it shows up as lower cost per unit, less waste and higher
    productivity. It is often confused with effectiveness, which asks whether the right output is produced at
    all: a factory can make an unpopular product very efficiently. Lean production (HL) names greater efficiency
    and less waste as its two features.
  example: >-
    A bakery rearranges its kitchen so that bakers walk less between the oven and the bench, and makes the same
    number of loaves in fewer labour hours.
  topics: []
  subtopics: ['5.1', '5.3']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [productivity-rate, waste, lean-production, average-cost]

- id: quality
  term: Quality
  definition: >-
    How well a good or service meets the needs and expectations of its customers, consistently, every time it is
    supplied.
  context: >-
    Quality is judged by the customer, so it covers more than an absence of faults: design, reliability,
    durability, service and value for money all count, and a cheap product can be good quality if it does what
    its buyers expect at that price. Poor quality creates waste, rework, refunds and damage to the brand, while a
    reputation for quality can support a higher price. At HL, 5.3 covers how businesses control, assure and
    manage it.
  example: >-
    Passengers may rate a budget airline's quality highly if its flights leave on time and its fares match what
    was advertised, even though it offers no free meals.
  topics: []
  subtopics: ['5.1', '5.3']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [quality-control, quality-assurance, total-quality-management, defect-rate]

# ---------- 5.2 Operations methods ----------
- id: job-production
  term: Job production
  aliases: [one-off production]
  definition: >-
    A method of making one-off products, each to the specification of a particular customer, such as a
    made-to-measure suit or a new bridge.
  context: >-
    Because every job is different, job production needs skilled, flexible workers and general-purpose
    equipment, and it is usually labour-intensive. Customers get exactly what they want and often pay a premium,
    but unit costs are high, work is slow and there are few economies of scale. It suits low volumes, high value
    and products that cannot be standardized.
  example: >-
    A boat builder makes each yacht to its buyer's own design, with its own hull shape, fittings and interior.
  topics: []
  subtopics: ['5.2']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [batch-production, mass-production, mass-customization, labour-intensive-production]

- id: batch-production
  term: Batch production
  definition: >-
    Making products in groups of identical items and then switching the same equipment to a different group, so
    that a business can offer variety without making each item individually.
  context: >-
    Batch production sits between job and mass production: it allows some variety and some economies of scale.
    Each changeover between batches takes time and leaves machines idle, and finished batches may wait as stock
    before the next stage. Cutting changeover times makes smaller batches affordable, which is one aim of lean
    production (HL).
  example: >-
    A bakery mixes and bakes 200 white loaves, cleans the mixer, then makes 120 rye loaves on the same equipment.
  topics: []
  subtopics: ['5.2']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [job-production, mass-production, economies-of-scale, lean-production]

- id: mass-production
  term: Mass production
  aliases: [flow production, mass/flow production]
  definition: >-
    Continuous, high-volume production of a standardized product, in which work moves along a line of
    specialized stages, often automated.
  context: >-
    Mass production gives the lowest cost per unit, because fixed costs are spread over a very large output and
    specialized machines and workers are fast. It needs heavy investment, steady high demand and a standard
    product, so it is inflexible: changing the design can mean stopping the whole line. Repetitive tasks can
    also demotivate workers, which links to motivation (2.4).
  example: >-
    A soft-drinks plant fills and caps thousands of identical cans an hour on a line that runs day and night.
  topics: []
  subtopics: ['5.2']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [batch-production, mass-customization, economies-of-scale, capital-intensive-production]

- id: mass-customization
  term: Mass customization
  definition: >-
    Combining the low unit costs of mass production with features that each customer chooses, usually by
    mass-producing standard parts and adding the personal options late in the process.
  context: >-
    Flexible machinery, computer-aided design and online ordering make it possible to offer many variations
    without the high costs of job production. It lets a business charge more and learn about its customers, but
    it makes planning, stock control and delivery more complex. It differs from batch production because each
    variation is set by a customer's order rather than by the business's production plan.
  example: >-
    A trainer brand lets buyers choose the colour of every panel and add their initials online; each pair is
    assembled from standard parts and finished to order.
  topics: []
  subtopics: ['5.2']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [mass-production, job-production, batch-production, just-in-time]

- id: labour-intensive-production
  term: Labour-intensive production
  aliases: [labour-intensive]
  definition: >-
    Production that relies more on people than on machinery, so that labour is the largest share of its costs.
  context: >-
    Labour-intensive methods suit job production, personal services and places where wages are low. They are
    flexible, because people can switch tasks, but unit costs rise with wages and quality depends on skill and
    motivation. When pay is linked to hours or output, more of the costs are variable, so operating leverage
    (HL) tends to be lower than in capital-intensive production.
  example: >-
    In a hand-made furniture workshop, most of the cost of each table is the time of the joiners who make it.
  topics: []
  subtopics: ['5.2', '5.6']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [capital-intensive-production, job-production, operating-leverage, labour-productivity]

- id: capital-intensive-production
  term: Capital-intensive production
  aliases: [capital-intensive]
  definition: >-
    Production that relies more on machinery, equipment and technology than on people, so that capital is the
    largest share of its costs.
  context: >-
    Capital-intensive methods suit mass production: machines work quickly, consistently and around the clock,
    so unit costs are low at high output. They need large investment and are hard to change, and most of their
    costs are fixed, which raises operating leverage (HL): profit rises fast when sales grow and falls fast when
    sales drop. Automation can also cut jobs and meet resistance to change.
  example: >-
    In a bottling plant, robots fill, cap and pack the bottles while a handful of technicians supervise the line.
  topics: []
  subtopics: ['5.2', '5.6']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [labour-intensive-production, mass-production, operating-leverage, capital-productivity]

# ---------- 5.3 Lean production and quality management (HL) ----------
- id: lean-production
  term: Lean production
  aliases: [lean manufacturing]
  definition: >-
    A way of organizing operations that removes anything which does not add value for the customer, such as
    excess stock, waiting time, defects and unnecessary movement.
  context: >-
    The guide names two features of lean production, less waste and greater efficiency, and two methods, kaizen
    (continuous improvement) and just-in-time. It depends on a skilled, involved workforce and reliable
    suppliers, so it is as much a culture as a set of techniques. It is often combined with TQM, because a
    defect is a form of waste.
  example: >-
    A furniture maker cuts the time each table waits between workstations from two days to two hours, freeing
    floor space and the cash tied up in half-finished stock.
  topics: []
  subtopics: ['5.3']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [waste, kaizen, just-in-time, total-quality-management, efficiency]

- id: waste
  term: Waste (in lean production)
  aliases: [muda]
  definition: >-
    In lean thinking, any activity or use of resources that adds cost or time but adds nothing the customer
    values.
  context: >-
    Lean practitioners commonly group waste into types such as overproduction, waiting, unnecessary transport,
    over-processing, excess stock, unnecessary movement and defects. Removing them cuts costs and lead times and
    frees space and cash. The idea is wider than rubbish: a perfectly good product made too early is waste,
    because it ties up money and space until it is sold.
  example: >-
    A print shop that prints leaflets before orders arrive, then stores and later scraps the unsold ones, wastes
    materials, space and time.
  topics: []
  subtopics: ['5.3']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [lean-production, kaizen, just-in-time, efficiency]

- id: kaizen
  term: Kaizen
  aliases: [continuous improvement]
  definition: >-
    Continuous improvement: a lean method that relies on many small, low-cost changes suggested by the people
    who do the work, rather than on occasional large projects.
  context: >-
    The word is Japanese for change for the better. Kaizen works only if employees are trained, trusted and
    listened to, so it links to empowerment and teamwork (2.4) and to quality circles. Its strengths are that
    improvements are cheap and owned by staff; its weakness is that small steps may not be enough when a market
    changes suddenly and a radical change is needed.
  example: >-
    Packers in a warehouse suggest moving a tape dispenser to every bench, which saves a few seconds a parcel and
    many hours a month.
  topics: []
  subtopics: ['5.3']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [lean-production, quality-circle, total-quality-management, waste]

- id: just-in-time
  term: Just-in-time (JIT)
  aliases: [JIT, just in time]
  definition: >-
    A lean method of production and stock control in which materials arrive just as they are needed and goods
    are made to meet actual orders, so that little or no stock is held.
  context: >-
    JIT cuts the cost of storing stock, the cash tied up in it and the risk of it spoiling or going out of date,
    and it exposes problems that stock would otherwise hide. It depends on reliable suppliers, short lead times,
    flexible staff and consistent quality, because there is no buffer when something goes wrong. In 5.6 it is
    contrasted with just-in-case, which holds stock as insurance.
  example: >-
    A sandwich bar has bread delivered twice a day, before each rush, instead of keeping a week's supply in a
    freezer.
  topics: []
  subtopics: ['5.3', '5.6']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [just-in-case, lean-production, buffer-stock, supply-chain, lead-time]

- id: cradle-to-cradle-design
  term: Cradle-to-cradle design
  aliases: [cradle-to-cradle manufacturing, C2C]
  definition: >-
    Designing products and the way they are made so that, at the end of their use, every material can safely
    return to nature or be recovered as an input for new products, leaving no waste.
  context: >-
    It is contrasted with cradle to grave, where products are made, used and thrown away. Designers choose safe
    materials, plan for repair and easy disassembly, and keep biological materials, which can break down
    safely, apart from technical materials, which are recovered and reused. It is one route to a circular
    business model (toolkit) and can cut material costs and strengthen a brand, but redesign is costly and it
    depends on getting used products back.
  example: >-
    A maker of carpet tiles designs tiles whose backing and fibres separate easily, collects old tiles from
    offices and turns them into new ones.
  topics: []
  subtopics: ['5.3']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [lean-production, waste, quality-standard, research-and-development]

- id: quality-control
  term: Quality control
  definition: >-
    Checking products, usually at the end of a stage or of production, to find and remove items that do not meet
    the required standard.
  context: >-
    Quality control detects faults after they have happened, typically by inspecting or testing samples, often
    through specialist inspectors. It stops many faulty items reaching customers but does not stop them being
    made, so the materials and time spent on them are still lost. It is often contrasted with quality
    assurance, which aims to prevent faults in the first place.
  example: >-
    A juice bottler tests one bottle in every 500 for taste and sugar content and holds back the whole batch if a
    sample fails.
  topics: []
  subtopics: ['5.3']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [quality-assurance, defect-rate, total-quality-management, quality]

- id: quality-assurance
  term: Quality assurance
  definition: >-
    An approach that builds quality into every stage of a process, by setting standards and procedures that
    prevent faults rather than finding them at the end.
  context: >-
    Responsibility for quality moves from inspectors to everyone involved, including suppliers. Because errors
    are prevented, waste and rework fall, and the business can show customers that its processes meet agreed
    standards, sometimes by certification to a national or international quality standard. It costs more to set
    up than end-of-line checking and relies on training and commitment.
  example: >-
    A food manufacturer agrees ingredient specifications with its suppliers, trains staff in hygiene procedures
    and records oven temperatures every hour.
  topics: []
  subtopics: ['5.3']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [quality-control, quality-standard, total-quality-management, quality-circle]

- id: quality-circle
  term: Quality circle
  definition: >-
    A volunteer group of staff from the same area of work who meet at set times to tackle the quality problems
    they see every day and to recommend improvements to managers.
  context: >-
    Quality circles draw on the knowledge of the people closest to the work and can raise motivation through
    involvement. They take time away from production, and managers must act on the ideas or staff quickly lose
    interest. They support kaizen and TQM.
  example: >-
    Machine operators at a printing works meet every fortnight to find out why one press smudges more often, and
    propose a new cleaning routine.
  topics: []
  subtopics: ['5.3']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [kaizen, total-quality-management, quality-assurance, benchmarking]

- id: benchmarking
  term: Benchmarking
  definition: >-
    Measuring how well a business does something against the best performer, in its own industry or another,
    and adopting the better practices it finds.
  context: >-
    Benchmarking can be internal, comparing branches or departments, or external, comparing with rivals or with
    leaders in a similar process in another industry. It gives realistic targets based on what others already
    achieve. Data from rivals can be hard to get, and a practice that works elsewhere may not suit a different
    culture or customer base.
  example: >-
    A regional bus company compares its punctuality and cleaning times with the best-run operator in another
    country and adopts its depot routine.
  topics: []
  subtopics: ['5.3']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [total-quality-management, quality-circle, kaizen, quality-standard]

- id: total-quality-management
  term: Total quality management (TQM)
  aliases: [TQM]
  definition: >-
    A whole-organization approach in which every employee, in every department, takes responsibility for
    quality, with the aim of meeting customer needs and getting things right first time.
  context: >-
    TQM turns quality assurance into a culture: departments treat each other as internal customers, problems
    are tackled at their source and improvement never stops. When it works it cuts waste, complaints and costs
    and builds a reputation for reliability. It takes years, needs commitment from senior managers and training
    at every level, and can fail if staff see it as one more initiative imposed from above.
  example: >-
    A hotel group trains every member of staff, from cleaners to managers, to solve a guest's problem on the spot
    and to record it so that its cause can be fixed.
  topics: []
  subtopics: ['5.3']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [quality-assurance, kaizen, quality-circle, lean-production, benchmarking]

- id: quality-standard
  term: Quality standard
  aliases: [quality standards]
  definition: >-
    A published set of requirements for a product, service or management process, set by a national or
    international body; a business that meets it can usually display a certificate or mark.
  context: >-
    National standards are set by a country's standards body; international standards apply across borders,
    such as the ISO 9000 family of quality management standards. Certification reassures customers, opens
    export markets and contracts that require it, and gives staff clear procedures. It costs time and money to
    achieve and to keep through audits, and it shows that a process is followed consistently, not that the
    product is the best available.
  example: >-
    A small engineering firm gains certification to an international quality management standard so that it can
    supply parts to a car maker that buys only from certified suppliers.
  topics: []
  subtopics: ['5.3']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [quality-assurance, total-quality-management, benchmarking, quality]

# ---------- 5.4 Location ----------
- id: location-factors
  term: Location factors
  aliases: [factors of location, reasons for location]
  definition: >-
    The influences on where a business decides to produce: quantitative ones that can be measured in money, and
    qualitative ones that cannot.
  context: >-
    Quantitative factors include the cost of land and labour, transport costs to customers and from suppliers,
    and government grants, taxes and tariffs. Qualitative factors include infrastructure, the skills available,
    political stability, local culture, quality of life and ethical concerns. The weight given to each depends
    on the business: heavy industry is pulled towards its raw materials, while shops and most services must be
    where their customers are.
  example: >-
    A steel maker builds its plant beside a deep-water port to cut the cost of shipping iron ore, while a café
    chooses a busy street that its customers already walk along.
  topics: []
  subtopics: ['5.4']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [industrial-inertia, clustering, offshoring, outsourcing]

- id: clustering
  term: Clustering
  aliases: [agglomeration]
  definition: >-
    The tendency of businesses in the same industry to locate close to one another, so that they share access
    to skilled workers, specialist suppliers, customers and ideas.
  context: >-
    Clustering is one reason for a specific location: a business that joins a cluster can gain external
    economies of scale (1.5), such as a trained local workforce and nearby suppliers and services. Crowding can
    also push up rents and wages and make it harder to keep staff. It helps to explain industrial inertia,
    because leaving a cluster means giving up its benefits.
  example: >-
    A new video-games studio opens in a city that already has dozens of studios, so that it can hire experienced
    programmers and artists quickly.
  topics: []
  subtopics: ['5.4']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [location-factors, external-economies-of-scale, industrial-inertia]

- id: industrial-inertia
  term: Industrial inertia
  definition: >-
    The tendency of a business or an industry to stay in a location after the original reasons for choosing it
    have weakened or disappeared.
  context: >-
    Moving is expensive and disruptive: new buildings, lost staff, broken links with suppliers and a damaged
    local reputation. A business may also stay because of its skilled workforce, a brand image tied to the place
    or loyalty to the community. Inertia can leave a business with higher costs than rivals that locate
    elsewhere.
  example: >-
    A pottery stays in the town where it began a century ago, long after the local clay ran out, because its
    skilled workers and its made-in-the-town reputation are there.
  topics: []
  subtopics: ['5.4']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [location-factors, clustering, reshoring]

- id: outsourcing
  term: Outsourcing
  aliases: [subcontracting]
  definition: >-
    Paying another business to carry out an activity, or to make a product or part, that the business used to
    do, or could do, itself.
  context: >-
    Businesses outsource to cut costs, gain specialist skills, add capacity quickly or concentrate on their core
    activities. The risks are less control over quality and delivery, dependence on the supplier, confidential
    knowledge leaving the business, and job losses that can hurt morale and reputation. Outsourcing is about who
    does the work and can happen at home or abroad; offshoring is about where it is done.
  example: >-
    A software firm hires a specialist company to run its payroll and a contractor to clean its offices.
  usage:
    general: >-
      Subcontracting often means passing part of one contract or project to another firm, as in construction,
      while outsourcing usually means handing over an ongoing function, such as payroll or customer service.
    syllabus: >-
      The guide treats the two as one item, outsourcing/subcontracting, among the ways of reorganizing
      production.
  topics: []
  subtopics: ['5.4', '5.6']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [insourcing, offshoring, cost-to-buy, supply-chain]

- id: offshoring
  term: Offshoring
  definition: >-
    Carrying out an activity in another country instead of the home country, either at the business's own
    overseas site or through a foreign supplier.
  context: >-
    Offshoring is about where work is done; outsourcing is about who does it. A business can offshore to its own
    factory abroad or to an overseas supplier, which is offshore outsourcing. The usual motives are lower labour
    costs, access to new markets and skills, and avoiding trade barriers; the drawbacks include long supply
    chains, communication and cultural differences, quality and ethical risks, and a poor image at home.
  example: >-
    A clothing company closes its home workshop and moves sewing to a factory it owns abroad, where wages are
    lower and its fabric suppliers are closer.
  topics: []
  subtopics: ['5.4']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [outsourcing, reshoring, location-factors, supply-chain]

- id: insourcing
  term: Insourcing
  definition: >-
    Taking back work that an outside firm had been doing, so that the business's own staff and facilities carry
    it out.
  context: >-
    It is the reverse of outsourcing. Businesses insource to regain control of quality, protect confidential
    knowledge, respond faster to customers or because a supplier's prices have risen. It needs investment in
    staff, equipment and management time, and the business loses the flexibility of simply changing supplier.
  example: >-
    After repeated late deliveries, a bicycle maker stops buying wheels from a contractor and sets up its own
    wheel-building workshop.
  topics: []
  subtopics: ['5.4']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [outsourcing, reshoring, cost-to-make, vertical-integration]

- id: reshoring
  term: Reshoring
  aliases: [backshoring]
  definition: >-
    Bringing work that had been moved abroad back to the business's home country.
  context: >-
    Reshoring reverses offshoring and may or may not reverse outsourcing: the work can return to the business's
    own site or to a supplier at home. Reasons include rising wages abroad, high transport costs, long and
    fragile supply chains, quality problems, the need to respond faster to customers, automation that narrows
    the labour cost gap, and pressure to support local jobs. Costs at home may still be higher.
  example: >-
    A furniture retailer brings sofa production back from overseas to a factory near its warehouses, so that it
    can deliver in days rather than weeks.
  topics: []
  subtopics: ['5.4']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [offshoring, insourcing, outsourcing, supply-chain]

# ---------- 5.5 Break-even analysis ----------
- id: break-even-analysis
  term: Break-even analysis
  definition: >-
    A planning tool that compares a business's costs and revenues at different levels of output, to find the
    output at which it makes neither a profit nor a loss and to see how profit changes with sales.
  context: >-
    It can be done by calculation, using contribution per unit, or by drawing a break-even chart. It answers
    questions such as how many units must be sold, how far sales can fall before a loss, and what output or
    price would deliver a target profit. It rests on simplifying assumptions, such as a constant price and
    variable cost per unit and every unit being sold, so its answers are estimates for planning rather than
    forecasts.
  example: >-
    Before opening, the owner of a food truck works out that she must sell 1,250 meals a month to cover her
    costs, then checks whether her pitch can realistically deliver that.
  topics: [costs-and-revenues]
  subtopics: ['5.5']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [break-even-quantity, break-even-chart, contribution-per-unit, margin-of-safety, target-profit-output]

- id: contribution-per-unit
  term: Contribution per unit
  aliases: [unit contribution]
  definition: >-
    The amount each unit sold adds towards paying the fixed costs and then towards profit: its selling price
    minus its variable cost.
  context: >-
    It is the key figure in break-even calculations, because fixed costs are covered one unit at a time. It is
    not profit per unit: until fixed costs are covered, each unit's contribution is paying them off. A higher
    price or a lower variable cost per unit raises contribution per unit and lowers the break-even quantity. The
    guide's formula list does not include it, so learn it.
  example: >-
    A candle maker sells candles at $12 each and spends $4.50 on the wax, wick, jar and packaging for each one,
    so every candle contributes $7.50.
  formula: 'Contribution per unit = selling price per unit − variable cost per unit'
  topics: [costs-and-revenues]
  subtopics: ['5.5']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [contribution, total-contribution, break-even-quantity, variable-cost]

- id: total-contribution
  term: Total contribution
  definition: >-
    The contribution earned from all the units sold in a period: what is left of sales revenue after paying the
    variable costs, available to cover fixed costs and then provide profit.
  context: >-
    Profit equals total contribution minus fixed costs, so a business breaks even when total contribution
    exactly equals its fixed costs. Total contribution answers how much all the selling has covered; contribution
    per unit answers how much one more sale adds. Comparing products by their total contribution, not their
    contribution per unit, shows which earn the most overall.
  example: >-
    If the candle maker sells 900 candles a month at a contribution of $7.50 each, total contribution is $6,750;
    with fixed costs of $5,000, its profit is $1,750.
  formula: 'Total contribution = contribution per unit × quantity sold (or total revenue − total variable costs)'
  topics: [costs-and-revenues]
  subtopics: ['5.5']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [contribution-per-unit, contribution, fixed-cost, break-even-quantity]

- id: break-even-chart
  term: Break-even chart
  aliases: [break-even graph]
  definition: >-
    A graph of total revenue and total costs, with fixed costs shown, against output; the break-even point is
    where the total revenue and total cost lines cross.
  context: >-
    Output goes on the horizontal axis and money on the vertical axis. In the course the lines are straight:
    fixed costs are horizontal, total costs start at the level of fixed costs and rise, and total revenue starts
    at zero. The vertical gap between revenue and costs shows profit to the right of break-even and loss to the
    left, and the margin of safety, target profit output and the effect of a change in price or cost can all be
    read from or drawn on the chart.
  example: >-
    A chart for a bike-repair stand shows fixed costs of $2,000 a month, total costs rising from that level, and
    total revenue crossing total costs at 160 repairs, the break-even quantity.
  topics: [costs-and-revenues]
  subtopics: ['5.5']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [break-even-quantity, margin-of-safety, break-even-analysis, total-revenue, total-cost]

- id: break-even-revenue
  term: Break-even revenue
  definition: >-
    The sales revenue a business needs in a period to cover all its costs exactly, so that it makes neither a
    profit nor a loss.
  context: >-
    It states break-even in money rather than in units, which is easier to track day to day in a shop or a
    service business. The guide names the break-even quantity but not break-even revenue, which follows from
    it. Multiply using the exact break-even quantity, and give the answer in currency, not units.
  example: >-
    A bakery with a break-even quantity of 2,400 loaves a month, selling at $3 a loaf, needs $7,200 of bread
    sales a month to break even.
  formula: 'Break-even revenue = break-even quantity × selling price per unit'
  topics: [costs-and-revenues]
  subtopics: ['5.5']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [break-even-quantity, break-even-chart, total-revenue, contribution-per-unit]

- id: target-profit
  term: Target profit
  definition: >-
    The profit a business sets out to make in a period, which break-even analysis uses to work out the output or
    the price needed to reach it.
  context: >-
    With a target profit set, a business can find the target profit output (how many units it must sell at its
    current price) or the target price (what it must charge at its expected level of sales). On a break-even
    chart it appears as a vertical gap of that size between the total revenue and total cost lines. A target is
    only useful if the output it needs is within capacity and the price it needs is one customers will pay.
  example: >-
    The owner of a yoga studio wants $3,000 profit a month and uses that figure to work out how many class passes
    she must sell.
  topics: [costs-and-revenues]
  subtopics: ['5.5']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [target-profit-output, target-price, break-even-chart, margin-of-safety]

- id: target-price
  term: Target price
  definition: >-
    The selling price per unit a business needs to charge to reach a target profit, given its costs and the
    quantity it expects to sell.
  context: >-
    It works backwards from the profit wanted: fixed costs and the target profit are shared over the expected
    sales, and the variable cost of each unit is added. The answer assumes sales stay at the expected level at
    the new price, which is unlikely after a large rise, so it should be checked against what customers and
    competitors will accept. On a break-even chart a higher price makes the total revenue line steeper. The
    guide's formula list does not include it.
  example: >-
    A poster printer with fixed costs of $9,000 a month, a variable cost of $2 a poster and expected sales of
    3,000 posters must charge $6 a poster to make $3,000 profit.
  formula: 'Target price = ((total fixed costs + target profit) ÷ expected sales) + variable cost per unit'
  usage:
    general: >-
      In marketing and costing, a target price is often the price the market will bear, set first, with costs
      then planned to fit it.
    syllabus: >-
      In break-even analysis it is the price that delivers a target profit at the expected level of sales; on a
      break-even chart, a different price pivots the total revenue line.
  topics: [costs-and-revenues]
  subtopics: ['5.5']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [target-profit, target-profit-output, contribution-per-unit, break-even-chart]

# ---------- 5.6 Production planning (HL) ----------
- id: supply-chain
  term: Supply chain
  aliases: [supply chain process]
  definition: >-
    The linked sequence of organizations and activities that takes a product from raw materials, through
    production and distribution, to the final customer.
  context: >-
    A local supply chain uses suppliers close to the business, which shortens lead times and makes control and
    ethical checks easier; a global supply chain sources from around the world, often at lower cost but with
    longer, more fragile links and more exposure to transport, political and currency risks. Managing the chain
    means choosing and monitoring suppliers, agreeing terms, coordinating deliveries and checking how suppliers
    treat their workers and the environment. A weak link anywhere can stop production or damage the brand.
  example: >-
    A chocolate maker's supply chain runs from cocoa farmers and a shipping line, through its own factory, to
    wholesalers, supermarkets and finally shoppers.
  topics: []
  subtopics: ['5.6']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [just-in-time, lead-time, outsourcing, offshoring, vertical-integration]

- id: just-in-case
  term: Just-in-case (JIC)
  aliases: [JIC, just in case]
  definition: >-
    An approach to stock control that holds large stocks of materials and finished goods as insurance against
    late deliveries, faults or sudden rises in demand.
  context: >-
    JIC keeps production and sales going when something goes wrong and allows bulk-buying discounts, but it
    ties up cash and space and raises the costs of storage, insurance, damage and stock going out of date. It
    suits businesses with unreliable supply, long lead times or unpredictable demand, while JIT suits steady
    demand and dependable suppliers. Many businesses mix the two, keeping buffer stock only of critical items.
  example: >-
    A hospital keeps several weeks' supply of surgical gloves in its store room, so that a delayed delivery never
    stops an operation.
  topics: []
  subtopics: ['5.6']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [just-in-time, buffer-stock, stock-control-chart, reorder-level]

- id: stock-control-chart
  term: Stock control chart
  aliases: [inventory control chart]
  definition: >-
    A graph of the level of stock over time, used to plan when to reorder and how much, showing usage, the
    reorder level, the lead time, the buffer stock and the reorder quantity.
  context: >-
    Stock falls as it is used and jumps when a delivery arrives, so the line has a saw-tooth shape. An order is
    placed when stock reaches the reorder level and arrives after the lead time, ideally just as stock reaches
    the buffer level; the delivery then lifts stock by the reorder quantity to the maximum stock level. The chart
    assumes steady usage and reliable lead times, so a business reviews it when demand or suppliers change.
  example: >-
    A café uses 40 kg of coffee a week, keeps 20 kg as buffer stock and waits one week for delivery, so it
    reorders when its stock falls to 60 kg.
  topics: []
  subtopics: ['5.6']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [reorder-level, reorder-quantity, lead-time, buffer-stock, maximum-stock-level]

- id: lead-time
  term: Lead time
  definition: >-
    The time between placing an order with a supplier and receiving the goods, ready to use.
  context: >-
    The longer the lead time, the earlier a business must reorder and the more stock it must hold to keep going
    while it waits, so its reorder level is higher. Short, reliable lead times are essential for just-in-time.
    Lead time depends partly on how far away the supplier is, which links it to the choice between a local and a
    global supply chain.
  example: >-
    A furniture shop that orders sofas from an overseas factory faces a lead time of eight weeks, against one
    week from a local workshop.
  usage:
    general: >-
      Lead time is also used for the time from a customer's order to delivery, or from a product idea to its
      launch.
    syllabus: >-
      On a stock control chart (5.6) it is the time between placing an order with a supplier and its delivery.
  topics: []
  subtopics: ['5.6']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [reorder-level, stock-control-chart, buffer-stock, supply-chain]

- id: buffer-stock
  term: Buffer stock
  aliases: [safety stock]
  definition: >-
    The minimum level of stock a business plans to keep in reserve, so that it can keep producing or selling if a
    delivery is late or demand is higher than expected.
  context: >-
    On a stock control chart it is the level that stock should not fall below; in normal conditions each
    delivery arrives as stock reaches it. Its size depends on the reliability of suppliers, the lead time, how
    fast stock is used, storage space and how perishable the stock is. More buffer stock lowers the risk of a
    stock-out but raises holding costs, so businesses using JIT keep very little.
  example: >-
    A garage always keeps at least ten of each common tyre size in reserve, in case a delivery is held up.
  topics: []
  subtopics: ['5.6']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [reorder-level, stock-control-chart, just-in-case, stock-out]

- id: reorder-level
  term: Reorder level
  aliases: [re-order level]
  definition: >-
    The level of stock at which a new order is placed, set so that the delivery arrives before stock falls below
    the buffer level.
  context: >-
    It depends on the buffer stock, the rate at which stock is used and the lead time: a longer lead time or
    faster usage means a higher reorder level. It is easily confused with the reorder quantity, which is how much
    is ordered, not when. The guide's formula list does not include it; software often places the order
    automatically when stock reaches this level.
  example: >-
    A pharmacy sells 30 boxes of a cold remedy a week, keeps 15 as buffer stock and waits two weeks for delivery,
    so it reorders when stock falls to 75 boxes.
  formula: 'Reorder level = buffer stock + (usage per period × lead time in periods)'
  topics: []
  subtopics: ['5.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [reorder-quantity, buffer-stock, lead-time, stock-control-chart]

- id: reorder-quantity
  term: Reorder quantity
  aliases: [re-order quantity]
  definition: >-
    The amount of stock ordered each time a new order is placed.
  context: >-
    On a stock control chart it is the size of the jump when a delivery arrives: the distance from the buffer
    level to the maximum stock level. Larger, less frequent orders can earn bulk discounts and cut ordering
    costs but raise holding costs and the cash tied up; smaller, more frequent orders do the reverse. It must at
    least cover the stock used during the lead time, or stock will run down with every order.
  example: >-
    A school canteen orders 600 cartons of milk each time, enough for two weeks, to fit the space in its fridge.
  topics: []
  subtopics: ['5.6']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [reorder-level, maximum-stock-level, stock-control-chart, buffer-stock]

- id: maximum-stock-level
  term: Maximum stock level
  aliases: [maximum stock]
  definition: >-
    The highest level that stock is planned to reach, just after a delivery arrives.
  context: >-
    It is limited by storage space, the shelf life of the stock and the cash a business is willing to tie up. On
    a stock control chart it is the top of each tooth. The formula, which is not in the guide's formula list,
    holds when each delivery arrives exactly as stock reaches the buffer level.
  example: >-
    A florist keeps a buffer of 50 roses and orders 300 at a time, so its stock should peak at 350 roses.
  formula: 'Maximum stock level = buffer stock + reorder quantity'
  topics: []
  subtopics: ['5.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [reorder-quantity, buffer-stock, stock-control-chart]

- id: stock-out
  term: Stock-out
  aliases: [stockout]
  definition: >-
    A situation in which a business runs out of an item of stock, so that it cannot produce or cannot meet its
    customers' orders.
  context: >-
    Stock-outs happen when a delivery is late, stock is used faster than planned or nobody reorders in time. The
    costs are lost sales, idle workers and machines, charges for rush deliveries and unhappy customers who may
    switch to rivals. Buffer stock and a well-set reorder level reduce the risk, at the cost of holding more
    stock.
  example: >-
    A toy shop sells out of a popular game three weeks before a holiday and loses those sales to an online rival
    that still has it.
  topics: []
  subtopics: ['5.6']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [buffer-stock, reorder-level, just-in-time, just-in-case]

- id: productive-capacity
  term: Productive capacity
  aliases: [capacity]
  definition: >-
    The maximum output a business can produce in a period with the resources it has now, such as its buildings,
    equipment and staff.
  context: >-
    Capacity is measured in units that suit the business: cars a week for a factory, seats for a theatre, meals a
    night for a restaurant. It can be raised by investment, extra shifts or outsourcing, and reduced by selling
    assets or cutting staff. It is the denominator of the capacity utilization rate.
  example: >-
    A bakery with two ovens, each baking 60 loaves an hour for eight hours a day, has a productive capacity of
    960 loaves a day.
  topics: []
  subtopics: ['5.6']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [capacity-utilization-rate, spare-capacity, rationalization, outsourcing]

- id: capacity-utilization-rate
  term: Capacity utilization rate
  aliases: [capacity utilization]
  definition: >-
    A business's actual output in a period as a percentage of its productive capacity, the most it could produce
    with its existing resources.
  context: >-
    A high rate spreads fixed costs over more units and lowers cost per unit, but close to 100% there is no room
    for maintenance, breakdowns or a rush order, and staff may be overstretched. A low rate means idle resources
    and a high fixed cost per unit; the business can try to raise demand, take on work for others or cut
    capacity. This formula is in the guide's formula list.
  example: >-
    A bottling plant that can fill 50,000 bottles a week but fills 40,000 is running at a capacity utilization
    rate of 80%.
  formula: 'Capacity utilization rate = (actual output ÷ productive capacity) × 100'
  topics: []
  subtopics: ['5.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [productive-capacity, spare-capacity, fixed-cost, productivity-rate]

- id: spare-capacity
  term: Spare capacity
  aliases: [excess capacity, capacity under-utilization]
  definition: >-
    The extra output a business could produce with its existing resources, because it is producing less than its
    productive capacity.
  context: >-
    Spare capacity raises the fixed cost carried by each unit, but it also gives the flexibility to accept extra
    work, such as a special order judged on contribution (an HL toolkit use), without new investment. If it
    persists, a business may cut prices, promote more, rent out space or rationalize. The opposite problem,
    demand above capacity, leads to waiting lists, outsourcing, higher prices or expansion.
  example: >-
    A conference centre that is busy on only three days a week rents its empty halls for weekend weddings at a
    lower rate.
  topics: []
  subtopics: ['5.6']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [productive-capacity, capacity-utilization-rate, special-order, rationalization]

- id: rationalization
  term: Rationalization
  definition: >-
    Reorganizing a business to cut costs and raise efficiency, often by reducing its capacity through closing
    sites, selling equipment or cutting staff.
  context: >-
    It is one response to persistent spare capacity: removing unused capacity lowers fixed costs and raises the
    capacity utilization rate of what remains. It can save money and refocus the business, but redundancy
    payments are costly, the morale of remaining staff can suffer, and there is less room to grow if demand
    recovers.
  example: >-
    A cinema chain with half-empty screens closes its two smallest sites and moves their staff to its busiest
    ones.
  topics: []
  subtopics: ['5.6']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [spare-capacity, capacity-utilization-rate, productive-capacity, fixed-cost]

- id: defect-rate
  term: Defect rate
  definition: >-
    The percentage of units produced that fail to meet the required quality standard.
  context: >-
    Defective units must be scrapped, reworked or replaced, so a high defect rate wastes materials and time and
    raises costs, and faults that reach customers bring returns, complaints and damage to the brand. Lowering it
    is a main aim of quality assurance, TQM and lean production. The guide's formula list does not include it;
    this is the standard form, a percentage of the units made.
  example: >-
    A phone-case maker produces 8,000 cases and rejects 120 at inspection, a defect rate of 1.5%.
  formula: 'Defect rate = (units that fail to meet the quality standard ÷ units made) × 100'
  topics: []
  subtopics: ['5.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [quality-control, quality-assurance, total-quality-management, productivity-rate]

- id: productivity-rate
  term: Productivity rate
  aliases: [productivity]
  definition: >-
    A measure of how much output a business gets from the inputs it uses, expressed as total output as a
    percentage of total input.
  context: >-
    Productivity rises when more is produced from the same inputs, or the same output from fewer, which lowers
    cost per unit. Output and input must be measured so that the comparison makes sense, often both in money, and
    the figure is most useful compared over time or with rivals. Labour productivity and capital productivity
    each look at one input. This formula is in the guide's formula list.
  example: >-
    A print shop that turns $40,000 of inputs into $52,000 of output in a month has a productivity rate of 130%.
  formula: 'Productivity rate = (total output ÷ total input) × 100'
  usage:
    general: >-
      Productivity usually means output per unit of one input, such as output per worker or per hour, and is
      rarely given as a percentage.
    syllabus: >-
      The guide's productivity rate compares total output with total input and multiplies by 100, so the
      answer is a percentage.
  topics: []
  subtopics: ['5.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [labour-productivity, capital-productivity, efficiency, capacity-utilization-rate]

- id: labour-productivity
  term: Labour productivity
  aliases: [labour productivity rate, output per worker]
  definition: >-
    The output produced per worker, or per hour of labour, in a period.
  context: >-
    Higher labour productivity lowers the labour cost of each unit and can pay for higher wages without higher
    prices. It can be raised by training, better equipment, better methods and motivation, but pushing too hard
    can raise the defect rate, stress and labour turnover. It also depends on things workers do not control,
    such as the age of the machinery, so it is a poor measure of effort alone. The guide's formula list does not
    include it.
  example: >-
    A call centre handles 36,000 calls a month with 60 staff, so labour productivity is 600 calls per employee a
    month.
  formula: 'Labour productivity = total output ÷ number of workers (or labour hours)'
  topics: []
  subtopics: ['5.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [productivity-rate, capital-productivity, labour-intensive-production, labour-turnover]

- id: capital-productivity
  term: Capital productivity
  definition: >-
    The output produced per unit of capital used, such as per machine, per machine hour or per dollar of
    equipment.
  context: >-
    It shows how well a business uses its machinery, buildings and technology: more output from the same
    equipment means higher capital productivity and a lower capital cost per unit. It rises with better
    maintenance, less downtime, extra shifts and newer technology. The guide gives no formula; dividing output by
    a measure of capital input is the standard form.
  example: >-
    A bakery's new oven bakes 1,200 loaves in a ten-hour day, 120 loaves per oven hour, against 80 for the old
    oven.
  formula: 'Capital productivity = total output ÷ capital input (such as machine hours)'
  topics: []
  subtopics: ['5.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [productivity-rate, labour-productivity, capital-intensive-production, capacity-utilization-rate]

- id: operating-leverage
  term: Operating leverage
  definition: >-
    The extent to which a business's costs are fixed rather than variable, which decides how sharply its
    operating profit changes when its sales change.
  context: >-
    With high operating leverage (mostly fixed costs, as in capital-intensive production), each extra sale adds a
    lot to profit once fixed costs are covered, but a fall in sales cuts profit just as sharply, so risk is
    higher. With low operating leverage (mostly variable costs, as in labour-intensive production), profit is
    steadier. The guide names operating leverage in 5.6 but its formula list gives no formula; it is commonly
    measured by dividing total contribution by operating profit (total contribution − fixed costs), so a result
    of 3 means that a 1% change in sales changes operating profit by 3%.
  example: >-
    A gym earns a total contribution of $60,000 a month and an operating profit of $20,000, so its degree of
    operating leverage is 3: a 10% fall in sales would cut its profit by 30%.
  formula: 'Degree of operating leverage = total contribution ÷ operating profit (a common measure; the guide gives no formula)'
  usage:
    general: >-
      In finance, the degree of operating leverage is the percentage change in operating profit divided by the
      percentage change in sales, which works out as total contribution ÷ operating profit.
    syllabus: >-
      The guide lists operating leverage with the productivity measures in 5.6 (AO2, AO4) but gives no formula
      for it, so state the measure you use and show your working.
  topics: [costs-and-revenues]
  subtopics: ['5.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [fixed-cost, variable-cost, capital-intensive-production, labour-intensive-production, contribution, margin-of-safety]

- id: cost-to-buy
  term: Cost to buy (CTB)
  aliases: [CTB]
  definition: >-
    The total cost of buying a product or component from an outside supplier, instead of making it, for the
    quantity needed.
  context: >-
    It is compared with the cost to make (CTM): on cost alone, the business should buy if CTB is lower. The
    decision also depends on quality, the supplier's reliability, any spare capacity, keeping skills and secrets
    in the business, and ethical concerns about how the supplier works. Add delivery charges or import duties to
    the supplier's price if the buyer pays them; the guide's formula list does not include CTB.
  example: >-
    A cycle maker can buy 2,000 saddles at $18 each, a cost to buy of $36,000.
  formula: 'Cost to buy = supplier price per unit × quantity'
  topics: []
  subtopics: ['5.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [cost-to-make, outsourcing, insourcing, spare-capacity]

- id: cost-to-make
  term: Cost to make (CTM)
  aliases: [CTM]
  definition: >-
    The total cost of producing a product or component in-house for the quantity needed, made up of the fixed
    costs and the variable costs of production.
  context: >-
    If CTM is lower than the cost to buy (CTB), making is the cheaper option on financial grounds. The decision is
    not only financial: control of quality and supply, the use of spare capacity, keeping skills in the business
    and the risks of each option all count. A decision tree (toolkit) can set out the two options and their
    possible outcomes.
  example: >-
    Making the same 2,000 saddles would need $12,000 of new tooling and $11 of materials and labour per saddle, a
    cost to make of $34,000, so making is $2,000 cheaper than buying.
  formula: 'Cost to make = total fixed costs + (variable cost per unit × quantity)'
  usage:
    general: >-
      Management accountants count only the costs that change because of the decision, so fixed costs that would
      be paid anyway are left out.
    syllabus: >-
      The guide gives no formula; the usual course method adds the fixed costs of making to the total variable
      cost, using the figures the question provides.
  topics: []
  subtopics: ['5.6']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [cost-to-buy, insourcing, fixed-cost, variable-cost, expected-value]

# ---------- 5.7 Crisis management and contingency planning (HL) ----------
- id: crisis
  term: Crisis
  definition: >-
    A sudden, unexpected event that seriously threatens a business's people, operations, finances or reputation
    and needs an urgent response.
  context: >-
    Crises can start inside the business, such as a product fault, a fraud or an IT failure, or outside it, such
    as a fire, a flood, a pandemic, a cyberattack or a supplier's collapse. They leave little time to decide,
    attract media and public attention and usually involve incomplete information. How a business responds can
    matter more than the event itself.
  example: >-
    A frozen-food firm learns that one batch of its pizzas may contain fragments of plastic, just as the batch
    reaches supermarket freezers.
  topics: []
  subtopics: ['5.7']
  level: HL
  category: concept
  provenance: subject-knowledge
  related: [crisis-management, contingency-planning, cybercrime]

- id: crisis-management
  term: Crisis management
  definition: >-
    The actions a business takes once a crisis has happened, to protect people, limit the damage and return to
    normal operations as quickly as possible.
  context: >-
    The guide names four factors in effective crisis management: transparency (being open and honest about what
    has happened), communication (keeping stakeholders informed promptly and consistently), speed (acting before
    the damage grows, without rushing into mistakes) and control (someone clearly in charge, with a plan and the
    resources to carry it out). It is often confused with contingency planning: crisis management is the
    response during the event, while contingency planning is the preparation before it.
  example: >-
    Within hours of a fire at its warehouse, a retailer tells customers which orders are delayed, moves
    deliveries to a second site and gives the media a named spokesperson.
  topics: []
  subtopics: ['5.7']
  level: HL
  category: strategy
  provenance: subject-knowledge
  related: [crisis, contingency-planning, cybercrime]

- id: contingency-planning
  term: Contingency planning
  aliases: [contingency plan, business continuity planning]
  definition: >-
    Preparing in advance for events that might happen, by identifying the most serious risks and deciding
    beforehand how the business will respond if they occur.
  context: >-
    A contingency plan might name a second supplier, keep backup data and equipment off site, train staff to
    cover each other's roles and set out who speaks to the media. Its impact can be judged on cost (planning,
    training and backups cost money, but can save far more), time (it takes time to prepare, but allows a faster
    response), risks (it lowers risk, but may prepare for the wrong events) and safety (people come first). No
    business can plan for everything, so it concentrates on the events that are most likely and most damaging.
  example: >-
    A ferry operator rehearses evacuating passengers twice a year and keeps an agreement with a second port in
    case its usual berth is damaged.
  topics: []
  subtopics: ['5.7']
  level: HL
  category: strategy
  provenance: subject-knowledge
  related: [crisis-management, crisis, buffer-stock, cybersecurity]

# ---------- 5.8 Research and development (HL) ----------
- id: research-and-development
  term: Research and development (R&D)
  aliases: ['R&D']
  definition: >-
    Systematic investigation and testing that a business carries out to create new products or processes, or to
    improve existing ones.
  context: >-
    R&D can give a business new products to replace those in decline, lower costs through better processes, a
    competitive edge, and intellectual property it can protect and license. It is expensive and uncertain: most
    ideas never reach the market and returns can take years, so it competes with short-term profit for funds.
    How well the money is spent matters more than how much is spent.
  example: >-
    A paint company spends two years testing a coating that dries in half the usual time, then patents the
    formula before launching it.
  topics: []
  subtopics: ['5.8']
  level: HL
  category: strategy
  provenance: subject-knowledge
  related: [innovation, patent, intellectual-property, unmet-need, product-innovation]

- id: unmet-need
  term: Unmet need
  aliases: [unmet customer need]
  definition: >-
    A need or want that existing goods and services do not satisfy, or do not satisfy well, which gives a
    business the chance to develop something new.
  context: >-
    Some unmet needs are known to customers, who can describe the problem in market research; others are latent,
    and customers only realize they wanted the product once they see it. Meeting a known need lowers the risk of
    a launch, while meeting a latent need can create a whole new market but relies more on R&D and vision than
    on asking customers.
  example: >-
    Commuting cyclists' complaints about punctures were an unmet need that a firm met with a self-sealing tyre.
  topics: []
  subtopics: ['5.8']
  level: HL
  category: marketing
  provenance: subject-knowledge
  related: [latent-need, research-and-development, innovation, disruptive-innovation]

- id: latent-need
  term: Latent need
  aliases: [hidden need]
  definition: >-
    A need that customers have but are not aware of, or cannot put into words, until a product appears that meets
    it.
  context: >-
    Latent needs are hard to find through surveys, because people cannot ask for what they cannot imagine, so
    businesses look for them by observing how people behave and through R&D. A product that meets a latent need
    can be very successful, but the risk is high because demand is uncertain until the launch.
  example: >-
    Before portable music players existed, few people asked to carry their record collection in a pocket, yet
    many bought one as soon as it appeared.
  topics: []
  subtopics: ['5.8']
  level: HL
  category: marketing
  provenance: subject-knowledge
  related: [unmet-need, research-and-development, disruptive-innovation, innovation]

- id: intellectual-property
  term: Intellectual property (IP)
  aliases: [IP, intellectual property rights]
  definition: >-
    Creations of the mind, such as inventions, brand names, designs and creative works, that the law allows
    their owner to control, protect and sell.
  context: >-
    The forms of protection named in 5.8 are patents (inventions), trademarks (brand names and logos) and
    copyright (creative works). Protection rewards the cost of R&D by stopping rivals copying for a period, IP
    can be sold or licensed for royalties, and it can appear as an intangible asset (3.4). Rights apply country
    by country and must be defended, which can be costly.
  example: >-
    A games studio owns the copyright in its code and artwork, a trademark on the game's name and a patent on a
    new controller.
  topics: []
  subtopics: ['5.8', '3.4']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [patent, trademark, copyright, research-and-development, royalty]

- id: patent
  term: Patent
  definition: >-
    A legal right, granted by a government for a limited period, that lets the owner of a new invention stop
    others making, using or selling it without permission.
  context: >-
    To be patented, an invention usually has to be new, involve an inventive step and be capable of being made
    or used, and its details are published in return for protection. A patent gives a temporary monopoly in
    which to recover R&D costs or earn licence income, but applying for it and defending it are expensive, and
    once it expires rivals can copy freely.
  example: >-
    A start-up patents a hinge for folding electric scooters, then licenses it to a larger manufacturer for a
    royalty on every scooter sold.
  topics: []
  subtopics: ['5.8', '3.4']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [intellectual-property, trademark, copyright, research-and-development, royalty]

- id: trademark
  term: Trademark
  definition: >-
    A registered sign, such as a name, logo, slogan or sound, that identifies a business's goods or services and
    that others may not use without permission.
  context: >-
    Registration gives the owner the right to act against copycats and counterfeiters, and it can usually be
    renewed again and again, so protection can last indefinitely. A trademark protects brand identity rather than the product itself: a rival
    may sell a similar product, but not under the same name or logo. Trademarks can be licensed, for example to
    franchisees.
  example: >-
    A bakery chain registers its name and its blue windmill logo, then stops a rival opening a shop with a
    near-identical sign.
  topics: []
  subtopics: ['5.8', '3.4']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [intellectual-property, patent, copyright, franchising]

- id: copyright
  term: Copyright
  definition: >-
    The legal right of the creator of an original work, such as writing, music, film, artwork or software, to
    control how it is copied, shared and adapted.
  context: >-
    In many countries copyright arises automatically when a work is created, without registration, and lasts for
    many years. It protects the expression of an idea, not the idea itself. Businesses earn from it through
    licences, for example by letting another firm use a song in an advertisement for a fee.
  example: >-
    A music publisher charges a car company a fee for using one of its songs in a television advertisement.
  topics: []
  subtopics: ['5.8', '3.4']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [intellectual-property, patent, trademark, royalty]

- id: innovation
  term: Innovation
  definition: >-
    Turning a new idea into a product, service or process that people actually use, so that it adds value for
    customers or for the business.
  context: >-
    Innovation is wider than invention: an invention is a new idea or device, while innovation brings an idea
    successfully into use. It can concern what is offered (product innovation) or how it is made or delivered
    (process innovation), and it ranges from small incremental steps to disruptive change that reshapes a
    market. R&D is one source of innovation; staff, customers and suppliers are others.
  example: >-
    A laundry introduces app ordering with collection and delivery, a new service built from existing
    technology.
  topics: []
  subtopics: ['5.8']
  level: HL
  category: strategy
  provenance: subject-knowledge
  related: [incremental-innovation, disruptive-innovation, product-innovation, process-innovation, research-and-development]

- id: incremental-innovation
  term: Incremental innovation
  definition: >-
    A series of small improvements to an existing product, service or process, each building on the last.
  context: >-
    Most innovation is incremental, such as a new model with a longer battery life or a slightly faster
    production line. It costs less and carries less risk than radical change and keeps products competitive,
    which links it to kaizen and to extension strategies in the product life cycle (4.5). Relying only on small
    steps can leave a business exposed if a rival introduces a disruptive innovation.
  example: >-
    A razor maker adds a lubricating strip one year and a pivoting head the next, improving the same basic
    product each time.
  topics: []
  subtopics: ['5.8']
  level: HL
  category: strategy
  provenance: subject-knowledge
  related: [innovation, disruptive-innovation, kaizen, product-innovation]

- id: disruptive-innovation
  term: Disruptive innovation
  definition: >-
    An innovation that creates a new market or transforms an existing one, often starting with a simpler or
    cheaper offer for customers that established businesses overlook, and in time displaces the market leaders.
  context: >-
    Established firms tend to ignore it at first, because its early customers seem few or unprofitable and their
    own customers are satisfied; by the time it threatens their core market, it is hard to respond. It is the
    opposite of incremental innovation, which improves existing products for existing customers. Disruptive
    innovations can make whole products, skills and business models obsolete.
  example: >-
    Digital cameras began as low-quality novelties, then improved until film cameras and film processing all but
    disappeared.
  usage:
    general: >-
      In everyday use, any dramatic new technology or business idea is called disruptive.
    syllabus: >-
      The guide pairs it with incremental innovation: an innovation that creates a new market or reshapes an
      existing one, displacing established businesses.
  topics: []
  subtopics: ['5.8']
  level: HL
  category: strategy
  provenance: subject-knowledge
  related: [innovation, incremental-innovation, latent-need, research-and-development]

- id: product-innovation
  term: Product innovation
  definition: >-
    Developing a new or improved good or service to sell.
  context: >-
    It can create a competitive edge, a premium price or a new market, and it renews a product portfolio as older
    products decline. It is costly and risky, because many new products fail. It is often confused with process
    innovation, which changes how a product is made or delivered rather than what is sold.
  example: >-
    A cereal maker launches a high-protein breakfast bar after testing dozens of recipes.
  topics: []
  subtopics: ['5.8']
  level: HL
  category: strategy
  provenance: subject-knowledge
  related: [process-innovation, innovation, research-and-development, incremental-innovation]

- id: process-innovation
  term: Process innovation
  definition: >-
    Developing a new or improved way of producing or delivering a good or service.
  context: >-
    Process innovation usually aims to cut costs, raise quality or speed up delivery, for example through
    automation, new software or a new layout. Customers may never see it, but they feel its effects in lower
    prices or faster service. It can mean retraining or job losses, so it often meets resistance to change.
  example: >-
    A bank replaces paper loan applications with an online form that gives a decision within minutes.
  topics: []
  subtopics: ['5.8']
  level: HL
  category: strategy
  provenance: subject-knowledge
  related: [product-innovation, innovation, lean-production, efficiency]

# ---------- 5.9 Management information systems (HL) ----------
- id: management-information-system
  term: Management information system (MIS)
  aliases: [MIS, management information systems]
  definition: >-
    A computer-based system that gathers data on a business's operations, customers and environment and
    presents it as information that managers can use to plan, monitor and decide.
  context: >-
    An MIS can speed up decisions, cut costs and reveal patterns that would otherwise be missed. It is also
    costly, can be hacked, can bury managers in data and raises ethical questions about privacy, surveillance and
    bias. Good decisions still depend on asking the right questions and using reliable data.
  example: >-
    A clothing retailer's MIS shows managers every store's sales by size and colour each hour, so they can move
    stock to where it is selling.
  usage:
    general: >-
      An MIS is usually one system that reports information to managers, such as a sales or stock reporting
      system.
    syllabus: >-
      The guide uses management information systems for the advanced computer technologies of 5.9 taken
      together, from databases and data analytics to AI and big data.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [database, data-analytics, big-data, cybersecurity, data-privacy]

- id: data-analytics
  term: Data analytics
  definition: >-
    Examining data with statistical and computer tools to find patterns, trends and relationships that help a
    business understand what is happening and decide what to do.
  context: >-
    Analytics can describe what happened, such as sales by region last month, explain why, predict what is
    likely to happen next and suggest what to do. Its techniques range from averages and charts to regression
    (toolkit) and machine learning. The results are only as good as the data and the questions asked, so
    analytics supports scientific decision-making but does not replace judgement.
  example: >-
    A gym analyses its entry data, finds that members who miss two weeks are likely to cancel, and contacts them
    with an offer of a free session.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [data-mining, big-data, database, scientific-decision-making]

- id: database
  term: Database
  definition: >-
    An organized store of related data, held electronically so that it can be searched, sorted, updated and
    combined quickly.
  context: >-
    A business database is usually made up of tables, for example of customers, products and orders, each with
    fields such as name, postcode and date of purchase. It lets managers find and analyse information, target
    marketing and keep records accurate. Its value depends on the data being accurate, up to date, secure and
    collected lawfully.
  example: >-
    An online bookshop's database links each customer to their past orders, so the shop can email them when a
    favourite author publishes a new book.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [data-analytics, data-mining, data-privacy, cybersecurity]

- id: cybersecurity
  term: Cybersecurity
  aliases: [cyber security]
  definition: >-
    The technologies, processes and practices a business uses to protect its computers, networks and data from
    attack, damage and unauthorized access.
  context: >-
    It includes firewalls, encryption, strong passwords and two-step logins, software updates, backups, staff
    training and plans for responding to an attack. Spending on it produces nothing visible, but a breach can
    halt operations, expose customers' data, bring fines and destroy trust. Cybersecurity is the defence;
    cybercrime is the threat.
  example: >-
    After a rival suffers a data breach, an accounting firm introduces two-step logins, encrypts its laptops and
    trains staff to spot fake emails.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [cybercrime, data-privacy, contingency-planning, management-information-system]

- id: cybercrime
  term: Cybercrime
  definition: >-
    Illegal activity carried out using computers or the internet, such as hacking into systems, stealing data or
    money, spreading malicious software or blocking a website.
  context: >-
    Common forms include hacking, phishing emails that trick staff into giving away passwords, ransomware that
    locks files until a ransom is paid, and denial-of-service attacks that flood a website with traffic. For a
    business the costs include lost sales while systems are down, repair and investigation costs, fines for
    failing to protect data and lasting damage to its reputation. Handling an attack is a test of crisis
    management (5.7).
  example: >-
    Ransomware locks a hotel's booking system on a busy weekend, so staff take bookings on paper and the hotel
    loses its online sales.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [cybersecurity, crisis-management, data-privacy, contingency-planning]

- id: critical-infrastructure
  term: Critical infrastructure
  aliases: [critical infrastructures]
  definition: >-
    The underlying systems, such as networks, data centres and cloud services, on which a business's information
    technology depends, so that their failure would disrupt the whole business.
  context: >-
    Where data is held, how securely and how quickly it can be reached all depend on this infrastructure.
    Investing in it allows faster, better-informed decisions and less downtime; depending on it means that an
    outage, a cyberattack or a supplier's failure can stop operations, so it needs backups and contingency
    plans.
  example: >-
    When a card-payment network fails for an afternoon, a chain of shops can take only cash, which shows how much
    its sales depend on infrastructure it does not own.
  usage:
    general: >-
      Governments use critical infrastructure for the assets a country cannot do without, such as power, water,
      transport and telecommunications networks.
    syllabus: >-
      In 5.9 the guide uses it for the computing foundations a business relies on, naming artificial neural
      networks, data centres and cloud computing.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [data-centre, cloud-computing, artificial-neural-network, cybersecurity, contingency-planning]

- id: artificial-neural-network
  term: Artificial neural network (ANN)
  aliases: [ANN, neural network]
  definition: >-
    A computing system made of layers of connected processing units, loosely modelled on the brain, that learns
    to recognize patterns by being trained on large amounts of example data.
  context: >-
    Neural networks underpin much modern artificial intelligence, including image and speech recognition, fraud
    detection and recommendations. They can find patterns too complex for people or simple statistics, but they
    need large amounts of good data and computing power, and it can be hard to explain why they reached an
    answer, which raises questions of accountability and bias.
  example: >-
    A card company trains a neural network on millions of past transactions so that it can flag a payment that
    looks fraudulent within a second.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [artificial-intelligence, big-data, critical-infrastructure, algorithmic-bias]

- id: data-centre
  term: Data centre
  definition: >-
    A building or secure room full of servers, storage and networking equipment that stores and processes an
    organization's data and runs its applications.
  context: >-
    A business can run its own data centre, rent space in a shared one or rely on a cloud provider's. Data
    centres need reliable power, cooling and security, and they use a great deal of energy, which raises
    sustainability questions. If one fails and there is no backup elsewhere, everything that depends on it
    stops.
  example: >-
    A bank keeps two data centres in different cities, so that if one floods the other takes over within
    minutes.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [cloud-computing, critical-infrastructure, cybersecurity, contingency-planning]

- id: cloud-computing
  term: Cloud computing
  aliases: [the cloud]
  definition: >-
    Using storage, software and computing power that another business provides over the internet, paying for
    what is used, instead of owning the equipment.
  context: >-
    Cloud services let staff reach files and applications from anywhere, make it easy to scale capacity up or
    down, and turn a large capital cost into a running cost. The drawbacks are dependence on the provider and on
    an internet connection, ongoing fees, and questions about where data is stored and who can see it.
  example: >-
    A small design agency keeps all its files and software in the cloud, so its staff can work from home or from
    a client's office.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [data-centre, critical-infrastructure, cybersecurity, data-privacy]

- id: virtual-reality
  term: Virtual reality (VR)
  aliases: [VR]
  definition: >-
    Technology that creates a computer-generated, three-dimensional environment that a user can look around and
    interact with, usually through a headset.
  context: >-
    Businesses use VR to train staff safely, to let customers try a product or tour a property before buying,
    and to test designs before anything is built. It can cut costs and travel and make marketing memorable, but
    equipment and content are expensive and some users find it uncomfortable. It differs from augmented reality,
    which adds digital images to a view of the real world.
  example: >-
    An airline trains cabin crew to handle an emergency evacuation in VR before they practise on a real
    aircraft.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [artificial-intelligence, internet-of-things, research-and-development]

- id: internet-of-things
  term: Internet of things (IoT)
  aliases: [IoT]
  definition: >-
    The network of everyday physical objects, such as machines, vehicles, meters and appliances, fitted with
    sensors and connections so that they collect data and share it over the internet, often without anyone
    having to act.
  context: >-
    Connected devices let a business monitor equipment and stock in real time, predict breakdowns, track
    deliveries and learn how customers use its products, and they generate much of the data behind big data and
    analytics. Each connected device is also a possible way in for a cyberattack, and the data collected raises
    privacy concerns.
  example: >-
    Sensors on a fleet of delivery vans report location, fuel use and engine faults, so the depot can reroute
    vans and book repairs before a breakdown.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [big-data, data-analytics, cybersecurity, data-privacy]

- id: artificial-intelligence
  term: Artificial intelligence (AI)
  aliases: [AI]
  definition: >-
    Computer systems that carry out tasks normally needing human intelligence, such as understanding language,
    recognizing images, making predictions or recommending choices, often improving as they learn from data.
  context: >-
    Businesses use AI for chatbots, product recommendations, fraud detection, demand forecasting and automating
    routine work. It can decide faster and more consistently than people and spread expertise cheaply, but it can
    also replace jobs, repeat the biases in its training data, make confident mistakes and be hard to hold to
    account. Much modern AI is built on artificial neural networks trained on big data.
  example: >-
    An insurer uses AI to assess photographs of damaged cars and settle simple claims within an hour.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [artificial-neural-network, big-data, algorithmic-bias, data-analytics]

- id: big-data
  term: Big data
  definition: >-
    Data sets so large, fast-changing and varied, from text and images to sensor readings and transactions, that
    ordinary software and databases cannot easily store or analyse them.
  context: >-
    Big data is often described by its volume (how much), velocity (how fast it arrives) and variety (how many
    forms it takes). Analysed through data mining and AI, it can reveal patterns about customers and operations
    that smaller samples miss. It needs specialist skills and infrastructure; a pattern in big data shows a
    correlation, not necessarily a cause; and the data may have been collected in ways customers did not fully
    agree to.
  example: >-
    A supermarket chain combines loyalty-card purchases, weather forecasts and local events to predict how much
    ice cream each store will sell next week.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [data-mining, data-analytics, artificial-intelligence, internet-of-things, data-privacy]

- id: customer-loyalty-programme
  term: Customer loyalty programme
  aliases: [loyalty programme, loyalty scheme, customer loyalty programmes]
  definition: >-
    A scheme that rewards customers for repeat purchases with points, discounts or perks, while recording what
    they buy.
  context: >-
    The rewards aim to bring customers back, raise their spending and build brand loyalty (4.5), making demand
    less sensitive to price; the data collected shows who buys what, when and where. That data lets a business
    personalize offers and plan stock, which links loyalty programmes to big data and data mining. Rewards and
    systems can be costly, many customers join several rival schemes, and the use of personal data raises
    questions of privacy and fairness.
  example: >-
    A coffee chain's app gives a free drink after every ten and uses each member's history to send offers on the
    drinks they buy most.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: marketing
  provenance: subject-knowledge
  related: [data-mining, big-data, database, data-privacy]

- id: employee-monitoring
  term: Employee monitoring
  aliases: [workplace surveillance]
  definition: >-
    Using technology to collect data on what employees do at work, such as their output, speed, location,
    computer use or communications, in order to manage their performance.
  context: >-
    Data can help managers spot training needs, share out work fairly, improve safety and reward good
    performance. Used to watch every movement and push people to fixed targets, it can damage trust, raise
    stress and labour turnover and intrude on privacy, and many countries limit what can be monitored and require
    staff to be told. Its most controlling form is called digital Taylorism.
  example: >-
    A warehouse's handheld scanners record how long each picker takes per order, and supervisors use the data to
    set daily targets.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: people
  provenance: subject-knowledge
  related: [digital-taylorism, data-privacy, labour-productivity, labour-turnover]

- id: digital-taylorism
  term: Digital Taylorism
  definition: >-
    Applying the ideas of F. W. Taylor's scientific management through digital technology: breaking work into
    small measured tasks, setting standard times and tracking each worker's performance with data in real time.
  context: >-
    Taylor, whose motivation theory is part of 2.4, held that workers are motivated mainly by pay and work best
    on closely specified, closely supervised tasks; scanners, tracking software and algorithms now make that
    supervision continuous. Supporters point to higher productivity and consistency. Critics argue that it
    removes autonomy and skill, raises stress and treats people like machines, which conflicts with theories
    that stress purpose and empowerment.
  example: >-
    Delivery drivers whose app sets the order of their drops, times each stop and ranks them against each other
    on speed are working under digital Taylorism.
  topics: []
  subtopics: ['5.9']
  level: HL
  category: people
  provenance: subject-knowledge
  related: [employee-monitoring, labour-productivity, data-analytics, labour-turnover]

- id: data-mining
  term: Data mining
  definition: >-
    Using software to search large data sets for patterns, links and trends that are not obvious, so that they
    can be used to predict behaviour and inform decisions.
  context: >-
    Data mining can show which products are bought together, which customers are likely to leave or which
    conditions come before a machine fault, and it feeds sales forecasts, targeted marketing and plans for
    stock and staffing. It needs good-quality data, skilled staff and the right questions; it can also turn up
    chance patterns that mean nothing, and using personal data in this way raises ethical and legal issues.
  example: >-
    An online grocer mines its order data, finds that shoppers who buy nappies often add ready meals, and starts
    offering the two together.

# Glossary: growth and evolution. Definitions are the platform's own wording.
- id: economies-of-scale
  term: Economies of scale
  definition: The fall in average cost per unit that results from an increase in the scale of a business's operations.
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: strategy
  simple: "The savings a business gets as it grows: when it makes more, each item costs less to make."
  technical: "Economies of scale are falls in long-run average cost as the scale of output increases. Internal economies arise inside the firm (technical, purchasing, financial, managerial, marketing, risk-bearing); external economies arise from the growth of the industry or area. They are a reason to grow and a barrier to entry, because a new rival producing little faces higher unit costs. They are limited by diseconomies of scale beyond some size."
  misconceptions:
    - claim: "Producing more always lowers the cost per unit."
      correction: "In the short run, spreading fixed costs helps until capacity is reached; in the long run, growth eventually brings diseconomies of scale that raise unit costs."
    - claim: "Economies of scale lower total costs."
      correction: "Total costs usually rise as a business grows; it is the average cost of each unit that falls."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [economies-of-scale]
  provenance: subject-knowledge
  related: [diseconomies-of-scale, external-economies-of-scale, average-cost]
- id: diseconomies-of-scale
  term: Diseconomies of scale
  definition: The rise in average cost per unit when a business grows beyond the scale it can manage efficiently, for example through poorer communication, coordination or motivation.
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: strategy
  simple: "The problems that come with being very big, which make each item more expensive to produce, such as poor communication and slow decisions."
  technical: "Diseconomies of scale are rises in long-run average cost beyond some scale, caused mainly by the difficulty of coordinating and motivating a large organization: longer chains of command, slower communication, alienated staff and duplicated effort. Decentralization, flatter structures and better information systems can delay them."
  misconceptions:
    - claim: "Diseconomies of scale mean a business has grown too big to make a profit."
      correction: "They raise unit costs above their lowest point; a large business can still be very profitable if prices and volumes allow."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [economies-of-scale]
  provenance: subject-knowledge
  related: [economies-of-scale]
- id: external-economies-of-scale
  term: External economies of scale
  definition: Cost savings that come from the growth of the industry or the area a business operates in, such as a pool of skilled labour or specialist suppliers, rather than from the business's own growth.
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: strategy
  simple: "Cost savings a business gets because the whole industry or area around it has grown, such as skilled workers nearby or specialist suppliers."
  technical: "External economies come from outside the firm: a pool of trained labour, specialist suppliers and services, shared infrastructure and the spread of knowledge in a cluster. They lower costs for every firm in the area and help explain why industries cluster. Congestion and rising local wages and rents are the matching external diseconomies."
  misconceptions:
    - claim: "External economies of scale come from a business growing bigger."
      correction: "They come from the growth of the industry or location around it, so a small firm can enjoy them too."
  qualifications: [ib, undergraduate, mba]
  frameworks: [economies-of-scale]
  provenance: subject-knowledge
  related: [economies-of-scale]
- id: internal-growth
  term: Internal (organic) growth
  definition: Growth from within a business, by selling more, opening new sites or launching new products, financed by its own resources or by borrowing.
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: strategy
  simple: "When a business grows by itself, for example by selling more, opening new branches or launching new products, instead of buying other businesses."
  technical: "Internal or organic growth uses the firm's own resources, often financed by retained profit. It is slower and lower-risk than external growth, keeps control and culture intact and avoids the cost of acquisitions, but it can be too slow to seize an opportunity or to reach the scale that rivals achieve through mergers."
  misconceptions:
    - claim: "Internal growth is always the safer choice."
      correction: "It avoids the risks of a merger, but growing too slowly can leave a business behind rivals who reach scale faster."
  qualifications: [ib, secondary, undergraduate, professional]
  frameworks: [growth-methods, ansoff-matrix]
  provenance: subject-knowledge
  related: [external-growth]
- id: external-growth
  term: External (inorganic) growth
  definition: Growth by joining with, buying or cooperating with other businesses, through mergers, acquisitions, takeovers, joint ventures, strategic alliances or franchising.
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: strategy
  simple: "When a business grows by joining with or buying other businesses, or by working with them, rather than only growing its own sales."
  technical: "The guide's external growth methods are mergers and acquisitions, takeovers, joint ventures, strategic alliances and franchising. They offer speed, market share, new capabilities and synergies, but cost more, carry integration risk and can clash cultures, and integration problems often leave a combination delivering less value than was expected."
  misconceptions:
    - claim: "External growth always means buying another company."
      correction: "Joint ventures, strategic alliances and franchising are external growth too, and none of them requires an outright purchase."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [growth-methods, integration-types]
  provenance: subject-knowledge
  related: [internal-growth, merger, acquisition, joint-venture, strategic-alliance, franchising]
- id: merger
  term: Merger
  definition: The agreed combination of two businesses into one.
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: strategy
  simple: "When two businesses agree to join together and become one."
  technical: "A merger combines two firms by agreement, often with shareholders of both receiving shares in the new company. It can create scale, synergies and market power, but integrating systems, people and cultures is hard and often takes longer and costs more than planned. Large mergers may be investigated by competition authorities."
  misconceptions:
    - claim: "A merger and a takeover are the same thing."
      correction: "A merger is agreed by both sides; a takeover is one firm gaining control of another, which may be against the target's wishes."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [growth-methods, integration-types]
  provenance: subject-knowledge
  related: [acquisition, takeover]
- id: acquisition
  term: Acquisition
  definition: The purchase by one business of a controlling interest in another, usually with the agreement of its management.
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: strategy
  simple: "When one business buys another, or buys enough of its shares to control it."
  technical: "In an acquisition the buyer gains control by purchasing a controlling stake, usually at a premium to the market value. The premium is justified only if expected synergies exceed it, which is where many acquisitions disappoint. Goodwill arises in the accounts when the price paid exceeds the fair value of the net assets bought."
  misconceptions:
    - claim: "Buying a profitable company guarantees profits for the buyer."
      correction: "The buyer often pays a premium; unless the combined business earns more than the price paid, shareholders lose value."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [growth-methods]
  provenance: subject-knowledge
  related: [merger, takeover]
- id: takeover
  term: Takeover
  definition: An acquisition, often one made against the wishes of the target business's management, when it is called a hostile takeover.
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: strategy
  simple: "When one company gains control of another by buying most of its shares, sometimes even when the other company's managers do not want it."
  technical: "A takeover may be friendly or hostile, the latter made directly to shareholders over the board's objections. Only companies whose shares can be bought, mostly publicly held ones, can be taken over this way. Defences, regulation and the premium required all shape whether a hostile bid succeeds."
  misconceptions:
    - claim: "Any business can be taken over."
      correction: "A hostile takeover needs shares that can be bought; a sole trader, a partnership or a privately held company whose owners will not sell cannot be taken over this way."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [growth-methods]
  provenance: subject-knowledge
  related: [acquisition, merger]
- id: joint-venture
  term: Joint venture
  definition: A new business created and owned jointly by two or more businesses, which share its costs, risks, control and profits.
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: strategy
  simple: "When two or more businesses set up a new business together and share its costs, profits and control."
  technical: "A joint venture creates a separate entity jointly owned by its parents, usually for a specific market or project. It shares risk and combines complementary strengths, such as one partner's technology and the other's local knowledge, and is a common way to enter foreign markets. Disagreements over control, profit-sharing and strategy are its main weakness."
  misconceptions:
    - claim: "A joint venture is the same as a merger."
      correction: "In a joint venture the parent firms remain separate and create a new business together; in a merger they become one."
  qualifications: [ib, undergraduate, mba, professional]
  frameworks: [growth-methods]
  provenance: subject-knowledge
  related: [strategic-alliance]
- id: strategic-alliance
  term: Strategic alliance
  definition: An agreement between businesses to cooperate, sharing resources, knowledge or customers, without creating a new jointly owned business.
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: strategy
  simple: "An agreement between businesses to work together on something, such as sharing research or selling each other's products, while staying separate."
  technical: "Strategic alliances cooperate without creating a new company or changing ownership. They are flexible and cheaper than joint ventures or acquisitions, but depend on trust, and partners may leak knowledge or pursue their own interests. Many alliances are between firms that compete in other markets."
  misconceptions:
    - claim: "A strategic alliance is a type of joint venture."
      correction: "An alliance creates no new jointly owned business; the partners simply cooperate under an agreement."
  qualifications: [ib, undergraduate, mba, professional]
  frameworks: [growth-methods]
  provenance: subject-knowledge
  related: [joint-venture]
- id: franchising
  term: Franchising
  definition: An arrangement in which a franchisor allows franchisees to use its brand and business model in return for fees and royalties.
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: strategy
  simple: "When a business lets other people run their own branch under its brand and methods, in return for a fee and a share of the sales."
  technical: "The franchisor grants franchisees the right to use its brand, format and support in return for an initial fee and royalties. It allows rapid growth with the franchisees' capital and motivation, at lower risk to the franchisor, but control over quality is indirect and one poor franchisee can damage the whole brand."
  misconceptions:
    - claim: "A franchisee is an employee of the franchisor."
      correction: "The franchisee owns and runs an independent business, bearing its risks and keeping its profits after fees and royalties."
  qualifications: [ib, secondary, undergraduate, professional]
  frameworks: [growth-methods]
  provenance: subject-knowledge
  related: [royalty]
- id: royalty
  term: Royalty
  definition: A continuing payment for the right to use a brand, design or business model, often calculated as a share of sales.
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: finance
  provenance: subject-knowledge
  related: [franchising]
- id: horizontal-integration
  term: Horizontal integration
  definition: A combination of businesses at the same stage of the same industry, such as two restaurant chains.
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: strategy
  simple: "When a business joins with another business that does the same kind of work at the same stage, such as two bakeries combining."
  technical: "Horizontal integration combines firms at the same stage of the same industry. It raises market share, removes a competitor and can bring economies of scale, which is why it attracts the most attention from competition authorities."
  misconceptions:
    - claim: "Horizontal integration means joining with a supplier."
      correction: "That is backward vertical integration; horizontal integration joins businesses at the same stage, usually competitors."
  qualifications: [ib, undergraduate, mba]
  frameworks: [integration-types]
  provenance: subject-knowledge
  related: [vertical-integration, merger]
- id: vertical-integration
  term: Vertical integration
  definition: A combination with a supplier (backward vertical integration) or with a customer or distributor (forward vertical integration).
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  category: strategy
  simple: "When a business joins with a supplier, or with a business closer to the customer, such as a farm buying a dairy or a dairy buying shops."
  technical: "Backward vertical integration moves towards suppliers; forward vertical integration moves towards customers. It secures supplies or outlets, captures the margins of other stages and improves coordination, but adds capital, complexity and dependence on one industry, and can make the firm less flexible than buying from the market."
  misconceptions:
    - claim: "Vertical integration always lowers costs."
      correction: "It removes other firms' margins but adds the cost of running unfamiliar stages, which a specialist may do more cheaply."
  qualifications: [ib, undergraduate, mba]
  frameworks: [integration-types, value-chain]
  provenance: subject-knowledge
  related: [horizontal-integration]
- id: ansoff-matrix
  term: Ansoff matrix
  definition: A two-by-two matrix of growth directions (market penetration, product development, market development and diversification) according to whether the products and markets are existing or new.
  topics: [growth-and-evolution]
  subtopics: ['toolkit', '1.5']
  category: tool
  simple: "A grid of four ways to grow a business, depending on whether it sells new or existing products in new or existing markets."
  technical: "The four strategies are market penetration, product development, market development and diversification, with risk generally rising the further the business moves from what it knows. It frames growth options but says nothing about which is best for a particular firm, which depends on its resources, the market and the evidence."
  misconceptions:
    - claim: "Diversification is always too risky to choose."
      correction: "It carries the most risk, but it can spread risk across markets and may be the right choice when existing markets are in decline."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [ansoff-matrix]
  provenance: subject-knowledge
  related: [market-development, diversification]
- id: market-development
  term: Market development
  definition: Selling existing products in new markets, such as a new city, country or customer group.
  topics: [growth-and-evolution]
  subtopics: ['toolkit', '1.5']
  category: strategy
  provenance: subject-knowledge
  related: [ansoff-matrix]
- id: diversification
  term: Diversification
  definition: Selling new products in new markets, the riskiest direction in the Ansoff matrix.
  topics: [growth-and-evolution]
  subtopics: ['toolkit', '1.5']
  category: strategy
  provenance: subject-knowledge
  related: [ansoff-matrix]
- id: expected-value
  term: Expected value
  definition: The average outcome of an option over many repetitions, found by multiplying each outcome's payoff by its probability and adding the results, then subtracting the option's cost.
  topics: [growth-and-evolution]
  subtopics: ['toolkit']
  category: tool
  simple: "The average result you would expect from a choice if you could repeat it many times, using the chances of each outcome."
  technical: "EV = Σ (probability × payoff) across the outcomes of a chance node. In decision trees the cost of an option is then subtracted to give its net expected value. EV suits repeated decisions where averages play out; for one-off, high-stakes decisions, the spread of outcomes and the worst case may matter more."
  misconceptions:
    - claim: "The expected value must be one of the possible outcomes."
      correction: "It is a weighted average, so it is often a figure that cannot actually happen."
  qualifications: [ib, undergraduate, mba, professional]
  frameworks: [decision-trees]
  provenance: subject-knowledge
  related: []

# Glossary: growth and evolution. Definitions are the platform's own wording.
- id: economies-of-scale
  term: Economies of scale
  definition: The fall in average cost per unit that results from an increase in the scale of a business's operations.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [diseconomies-of-scale, external-economies-of-scale, average-cost]
- id: diseconomies-of-scale
  term: Diseconomies of scale
  definition: The rise in average cost per unit when a business grows beyond the scale it can manage efficiently, for example through poorer communication, coordination or motivation.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [economies-of-scale]
- id: external-economies-of-scale
  term: External economies of scale
  definition: Cost savings that come from the growth of the industry or the area a business operates in, such as a pool of skilled labour or specialist suppliers, rather than from the business's own growth.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [economies-of-scale]
- id: internal-growth
  term: Internal (organic) growth
  definition: Growth from within a business, by selling more, opening new sites or launching new products, financed by its own resources or by borrowing.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [external-growth]
- id: external-growth
  term: External (inorganic) growth
  definition: Growth by joining with, buying or cooperating with other businesses, through mergers, acquisitions, takeovers, joint ventures, strategic alliances or franchising.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [internal-growth, merger, acquisition, joint-venture, strategic-alliance, franchising]
- id: merger
  term: Merger
  definition: The agreed combination of two businesses into one.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [acquisition, takeover]
- id: acquisition
  term: Acquisition
  definition: The purchase by one business of a controlling interest in another, usually with the agreement of its management.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [merger, takeover]
- id: takeover
  term: Takeover
  definition: An acquisition, often one made against the wishes of the target business's management, when it is called a hostile takeover.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [acquisition, merger]
- id: joint-venture
  term: Joint venture
  definition: A new business created and owned jointly by two or more businesses, which share its costs, risks, control and profits.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [strategic-alliance]
- id: strategic-alliance
  term: Strategic alliance
  definition: An agreement between businesses to cooperate, sharing resources, knowledge or customers, without creating a new jointly owned business.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [joint-venture]
- id: franchising
  term: Franchising
  definition: An arrangement in which a franchisor allows franchisees to use its brand and business model in return for fees and royalties.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [royalty]
- id: royalty
  term: Royalty
  definition: A continuing payment for the right to use a brand, design or business model, often calculated as a share of sales.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [franchising]
- id: horizontal-integration
  term: Horizontal integration
  definition: A combination of businesses at the same stage of the same industry, such as two restaurant chains.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [vertical-integration, merger]
- id: vertical-integration
  term: Vertical integration
  definition: A combination with a supplier (backward vertical integration) or with a customer or distributor (forward vertical integration).
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [horizontal-integration]
- id: ansoff-matrix
  term: Ansoff matrix
  definition: A two-by-two matrix of growth directions (market penetration, product development, market development and diversification) according to whether the products and markets are existing or new.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [market-development, diversification]
- id: market-development
  term: Market development
  definition: Selling existing products in new markets, such as a new city, country or customer group.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [ansoff-matrix]
- id: diversification
  term: Diversification
  definition: Selling new products in new markets, the riskiest direction in the Ansoff matrix.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: [ansoff-matrix]
- id: expected-value
  term: Expected value
  definition: The average outcome of an option over many repetitions, found by multiplying each outcome's payoff by its probability and adding the results, then subtracting the option's cost.
  topics: [growth-and-evolution]
  provenance: subject-knowledge
  related: []

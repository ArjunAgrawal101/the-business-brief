# Glossary: unit 4, Marketing (subtopics 4.1 to 4.6). Definitions, context and
# examples are the platform's own wording, checked for scope against the guide
# (pp. 30 to 32, toolkit p. 14). Named businesses are fictional. Market share
# and market growth are written exactly as the Market Studio calculates them
# (src/lib/market.ts); the guide's formula list does not include them, or
# price elasticity of demand, so the standard forms are used.

# ---------- 4.1 Introduction to marketing ----------
- id: marketing
  term: Marketing
  definition: Finding out what customers want and meeting those wants through the product, its price, its promotion and the way it reaches them, so that the organization achieves its objectives.
  context: Marketing is one of the four business functions, alongside human resources, finance and operations, and it shapes what the others are asked to deliver. It is far wider than advertising, since research, planning, segmentation, pricing and distribution are all marketing decisions. Non-profit organizations market too, for example to attract donors, volunteers or users.
  example: Before opening, a fictional juice bar, Squeeze Street, surveys office workers nearby, designs a quick lunchtime menu at a price they said they would pay, and promotes a loyalty card to the people it surveyed.
  usage:
    general: In everyday speech marketing often means advertising or selling.
    syllabus: In the course it is the whole process, from researching the market and planning to every element of the marketing mix.
  topics: []
  subtopics: ['4.1']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [market, market-orientation, marketing-mix, marketing-plan, market-research]
- id: market
  term: Market
  definition: All the buyers and sellers of a particular kind of good or service, whether they meet in a physical place or online.
  context: A market can be defined narrowly, such as hand-made mugs in one city, or broadly, such as all kitchenware worldwide, and the definition chosen changes every measure that depends on it, including market size and market share. Markets are often split into consumer markets, where households buy, and business-to-business markets, where organizations buy from each other.
  example: The market for electric bicycles in a city includes every shop and website selling them there and every resident or business that might buy one.
  topics: []
  subtopics: ['4.1']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [market-size, market-share, market-segmentation, marketing]
- id: market-orientation
  term: Market orientation
  aliases: [Market-led]
  definition: An approach in which a business starts from research into what customers want and then designs, prices and sells products to meet those wants.
  context: It is contrasted with product orientation, which starts from what the business can make. A market-oriented business can respond quickly to changing tastes and rarely launches products nobody wants, but research costs time and money, and customers cannot always say what they would want from something they have never seen. Most businesses sit somewhere between the two approaches.
  example: A fictional snack maker, Crunchwell, finds from its research that buyers want less sugar, and reformulates its range before its rivals do.
  topics: []
  subtopics: ['4.1']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [product-orientation, market-research, marketing]
- id: product-orientation
  term: Product orientation
  aliases: [Product-led]
  definition: An approach in which a business concentrates on making the best product it can, or the product it is best at making, and then looks for customers to buy it.
  context: It suits markets where quality, invention or technical excellence is what customers value most, such as specialist engineering, and it can produce breakthrough products that customers would never have thought to ask for. The risk is a product that is excellent but unwanted, or priced beyond what buyers will pay. Do not confuse it with product development, a direction for growth in the Ansoff matrix.
  example: A small fictional workshop, Lumen Optics, builds an extremely precise telescope and only then starts looking for astronomers willing to pay its high price.
  topics: []
  subtopics: ['4.1']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [market-orientation, marketing, ansoff-matrix]
- id: market-share
  term: Market share
  definition: One business's or one product's sales as a percentage of the total sales in its market over the same period.
  formula: Market share = the firm's sales ÷ total market sales × 100
  context: Share can be measured by value (revenue) or by volume (units), and the two can tell different stories, since a premium seller's share by value is larger than its share by volume. Rising sales do not always mean a rising share, because the market may be growing faster than the business. Share shows a firm's position against its rivals; it does not show whether the firm is profitable.
  example: In the fictional Porto mug market of the Market Studio, Atelier Barro sells 7,680 of the 44,000 mugs sold in a year, a share by volume of 7,680 ÷ 44,000 × 100 = 17.5%.
  topics: []
  subtopics: ['4.1']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [market-growth, market-size, market-leader, product-portfolio]
- id: market-growth
  term: Market growth
  definition: The percentage change in the total sales of a market from one period to the next, measured by value or by volume.
  formula: Market growth = (sales this period − sales last period) ÷ sales last period × 100
  context: Compare each business's own sales growth with the market's, because a firm growing more slowly than its market is losing share even though its sales are rising. A fast-growing market attracts new entrants and rewards investment, while in a slow-growing or shrinking one a firm can usually grow only by taking customers from rivals. Market growth is one axis of the BCG matrix.
  example: In the fictional Porto mug market of the Market Studio, total sales rise from 40,000 to 44,000 mugs, so market growth is (44,000 − 40,000) ÷ 40,000 × 100 = 10%.
  topics: []
  subtopics: ['4.1']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [market-share, market-size, product-portfolio, product-life-cycle]
- id: market-size
  term: Market size
  definition: The total sales of all the businesses in a market over a period, measured by value (revenue) or by volume (units sold).
  context: Market size is the total in the market share calculation and the base for market growth, so a business must define its market carefully before calculating either. A large market offers more potential sales but usually more competition, while a small one may suit a niche business. Size by value and size by volume can move in different directions when prices change.
  example: If the sellers of hand-made mugs in a city sell 44,000 mugs a year between them, the market size by volume is 44,000 mugs.
  topics: []
  subtopics: ['4.1']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [market, market-share, market-growth]
- id: market-leader
  term: Market leader
  aliases: [Market leadership]
  definition: The business or brand with the largest market share in a particular market.
  context: "The guide asks HL students to weigh why share and leadership matter: a leader may enjoy economies of scale, strong brand recognition, power over retailers and suppliers, and the ability to set prices that others follow. Leadership is not the same as profitability, and defending it can be costly, for example through heavy promotion or price cuts. A group of many small sellers is not a market leader, however large its combined share."
  example: In a city's coffee market, a fictional chain, Bean Republic, sells more cups than any rival, so it is the market leader, and other cafés watch its prices before setting their own.
  topics: []
  subtopics: ['4.1']
  level: HL
  category: marketing
  provenance: subject-knowledge
  related: [market-share, economies-of-scale, brand-loyalty, competitive-pricing]
- id: ethical-marketing
  term: Ethical marketing
  definition: Marketing that is honest, fair and responsible towards customers, society and the environment, for example by making truthful claims and not exploiting vulnerable groups.
  context: Unethical practices include misleading advertising, hidden charges, pressure on children to persuade their parents, and exaggerated environmental claims, sometimes called greenwashing. Ethical marketing can strengthen brand image and loyalty, but it can raise costs or mean turning down profitable opportunities, so it often involves a trade-off. Ethics and sustainability, two of the course's key concepts, run through the whole of unit 4.
  example: A fictional cereal brand, Morning Field, stops using cartoon characters in adverts aimed at young children and prints its sugar content clearly on the front of every pack.
  topics: []
  subtopics: ['4.1', '4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [marketing, brand-image, social-media-marketing, influencer-marketing]

# ---------- 4.2 Marketing planning ----------
- id: marketing-plan
  term: Marketing plan
  aliases: [Marketing planning]
  definition: A document that sets out a business's marketing objectives and the strategy for reaching them, including the target market, the marketing mix, the budget, the timescale and how results will be measured.
  context: Marketing planning makes a business analyse its market and competitors before it spends, coordinate marketing with finance and operations, and check progress against targets. Plans often draw on a SWOT or STEEPLE analysis from the toolkit. A plan can date quickly when the market changes, so it needs regular review, and it is only as good as the research behind it.
  example: A fictional bike shop, Two Wheels, plans to sell more children's bikes next spring through school visits and a trade-in offer, with a budget it reviews every month.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [marketing-objectives, target-market, marketing-mix, market-research]
- id: marketing-objectives
  term: Marketing objectives
  definition: The targets the marketing function sets to support the organization's overall objectives, such as raising market share, launching a product or increasing brand awareness.
  context: Good marketing objectives are specific and measurable, with a deadline, so that the success of a campaign can be judged. They should follow from the business objectives in 1.3, so a business aiming for growth might set a market share target, while one aiming for profit might aim to raise prices without losing customers. They guide every later choice in the marketing plan.
  example: A fictional gym, Pulse, sets the objective of signing 300 new members in the city centre within six months of opening.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [marketing-plan, market-share, brand-awareness]
- id: market-segmentation
  term: Market segmentation
  aliases: [Segmentation]
  definition: Dividing a market into groups of customers, called segments, who share characteristics or needs and respond to marketing in similar ways.
  context: Segmentation is the first of three linked steps, segmentation, targeting and positioning, in which a business divides the market, chooses the segments to aim at and decides how to position its product for them. Common bases are demographic, geographic, psychographic and behavioural. Segments are useful only if they are large enough to be profitable, can be reached, and really do respond differently.
  example: A fictional travel company, Wayfarer, divides its market into students on a budget, families with young children and retired couples, and designs different holidays for each.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [target-market, positioning, demographic-segmentation, geographic-segmentation, psychographic-segmentation, behavioural-segmentation]
- id: demographic-segmentation
  term: Demographic segmentation
  definition: Grouping customers by measurable characteristics of the population, such as age, gender, income, occupation, family size or education.
  context: It is the most common basis because the data are easy to find, for example in government publications, and easy to act on. Its weakness is that people with the same profile can want very different things, so it is often combined with psychographic or behavioural segmentation. Segmenting by sensitive characteristics can raise ethical questions.
  example: A fictional bank, Northgate, offers a current account without fees for customers aged 18 to 25 and a separate savings product for new parents.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [market-segmentation, geographic-segmentation, psychographic-segmentation, behavioural-segmentation]
- id: geographic-segmentation
  term: Geographic segmentation
  definition: Grouping customers by where they live or work, such as country, region, city, urban or rural area, or climate.
  context: It matters most when tastes, needs, laws or costs vary from place to place, and it underlies many international marketing decisions. It is simple to apply but can hide large differences between people who live in the same place.
  example: A fictional clothing brand, Fjell, stocks heavier coats in its northern stores and lighter rainwear in its southern ones.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [market-segmentation, demographic-segmentation, international-marketing]
- id: psychographic-segmentation
  term: Psychographic segmentation
  definition: Grouping customers by their lifestyles, values, attitudes, interests and personalities.
  context: It explains why two people of the same age and income buy differently, one choosing sustainable products and another the cheapest option. The data are harder and more expensive to collect, often through qualitative research, but they help a business write messages that match what its customers care about.
  example: A fictional outdoor brand, Ridgeline, targets people who see themselves as adventurous and environmentally aware, whatever their age.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [market-segmentation, behavioural-segmentation, qualitative-research]
- id: behavioural-segmentation
  term: Behavioural segmentation
  definition: Grouping customers by how they buy and use a product, such as how often they buy, how loyal they are, the occasion of the purchase and the benefit they look for.
  context: Past behaviour is often the best guide to future buying, and loyalty schemes and online data make it easier to observe. A business might reward heavy users, win back customers who have lapsed, or design offers for people buying gifts. It depends on good data about customers, which raises questions of privacy.
  example: A fictional cinema, Reel House, offers a cheap weekday membership to frequent viewers and promotes gift vouchers to people buying for a birthday.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [market-segmentation, brand-loyalty, psychographic-segmentation, direct-marketing]
- id: target-market
  term: Target market
  aliases: [Targeting]
  definition: The segment or segments of a market that a business chooses to aim its products and marketing at. Choosing them is called targeting.
  context: A business can aim one offer at most of the market (mass marketing), a different mix at each of several segments, or concentrate on one small segment (niche marketing). A clear target market lets the business build the right marketing mix and avoid wasting promotion on people who will never buy. The target is often described as a customer profile, setting out the typical buyer's age, income, lifestyle and habits.
  example: A fictional meal-kit company, Plate Up, targets busy working couples without children who live in cities, like cooking and have little time to shop.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [market-segmentation, positioning, niche-market, mass-market]
- id: positioning
  term: Positioning
  aliases: [Brand positioning]
  definition: The place a brand or product holds in customers' minds compared with its rivals, and the marketing decisions a business takes to win that place.
  context: Positioning is the last step of segmentation, targeting and positioning, when the business decides how it wants its target customers to see it, for example as the cheapest, the most luxurious or the most reliable choice. Every element of the marketing mix must support the chosen position. Repositioning means deliberately changing customers' perceptions, which is slow and costly; a position map shows positions visually.
  example: A fictional supermarket, Fresh and Fair, positions itself as the place for good food at fair prices, between the discount stores and the luxury food halls.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [position-map, target-market, differentiation, unique-selling-point, brand-image]
- id: position-map
  term: Position map
  aliases: [Perceptual map, Perception map, Market map]
  definition: A diagram with two axes, each showing an attribute customers care about, such as price and quality, on which brands are plotted according to how customers see them.
  context: Position maps help a business see where it stands against its rivals, spot crowded areas and look for gaps in the market. They show the perceptions of one sample of customers, not facts about the products, so another sample or other axes can give a different map. An empty space is a question, not an answer, because it may be empty for a good reason.
  example: A fictional ice-cream maker plots local brands on axes of price and how natural the ingredients seem, finds no brand that is both low-priced and seen as natural, and then tests that idea with customers.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [positioning, gap-in-the-market, differentiation, target-market]
- id: gap-in-the-market
  term: Gap in the market
  aliases: [Market gap]
  definition: A need, or a combination of features, that customers want but that no business currently provides well.
  context: Gaps are often spotted on a position map or through market research. Not every gap is an opportunity, since some are empty because too few customers want that combination or because it cannot be supplied at a profit. Before filling a gap, a business needs evidence of demand, the ability to deliver and a reason to think rivals will not copy it straight away.
  example: A fictional entrepreneur notices that nobody delivers healthy food late at night near a university campus and tests demand with a two-week trial before investing.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [position-map, niche-market, market-research, unique-selling-point]
- id: niche-market
  term: Niche market
  aliases: [Niche marketing]
  definition: A small, clearly defined segment of a larger market whose customers have specific needs, served with a specialized product.
  context: Niche marketing lets a small business avoid head-on competition with large firms, build loyalty and often charge a premium price. The risks are a small and possibly shrinking customer base, dependence on a single segment, and larger rivals moving in if the niche proves profitable. Compare it with a mass market, where one product is aimed at most of the market.
  example: A fictional bakery, Crumb, sells only gluten-free cakes and delivers across the city to customers who cannot find them in ordinary shops.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [mass-market, target-market, premium-pricing, market-segmentation]
- id: mass-market
  term: Mass market
  aliases: [Mass marketing]
  definition: A large market in which a business sells a standardized product to most customers with one broad marketing mix, rather than different offers for different segments.
  context: Mass marketing can bring high sales volumes and economies of scale, which allow lower prices, but it needs large budgets for production, distribution and promotion and faces intense competition. Because the product is designed for everyone, it may not fully satisfy anyone in particular, which leaves room for niche competitors.
  example: A fictional detergent maker, Brightwash, sells the same washing powder in supermarkets across the country and advertises it on national television.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [niche-market, economies-of-scale, above-the-line-promotion, target-market]
- id: unique-selling-point
  term: Unique selling point (USP)
  aliases: [USP, Unique selling proposition]
  definition: A feature or benefit that makes a product different from its competitors' products and gives customers a reason to choose it.
  context: A USP can come from the product itself, its price, its service, its brand or the way it is made, and it is often the centre of a business's promotion and positioning. It helps a business stand out, build loyalty and charge more, but it is valuable only if customers care about it and rivals cannot easily copy it. Many USPs fade as competitors catch up.
  example: A fictional laundry, Fold, promises to collect, wash and return clothes within three hours, which no other laundry in the town offers.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [differentiation, positioning, brand, premium-pricing]
- id: differentiation
  term: Differentiation
  aliases: [Product differentiation]
  definition: Making a business or its products different from rivals' in ways that customers value, so that customers are less likely to choose on price alone.
  context: Businesses differentiate through product features, quality, design, branding, customer service, distribution, or ethical and sustainable practices. Successful differentiation reduces direct competition and makes demand less sensitive to price, but it usually costs money and must be renewed as rivals imitate. In the HL toolkit, Porter's generic strategies treat differentiation as one route to competitive advantage.
  example: Two fictional cafés on one street sell similar coffee; Corner Cup sets itself apart by roasting its own beans and running weekly tasting evenings.
  topics: []
  subtopics: ['4.2']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [unique-selling-point, positioning, brand, premium-pricing]

# ---------- 4.3 Sales forecasting (HL only) ----------
- id: sales-forecast
  term: Sales forecast
  aliases: [Sales forecasting]
  definition: An estimate of a business's future sales, in units or in value, over a stated period, based on past data, research or judgement.
  context: Forecasts feed almost every plan, including production and stock levels, staffing, cash flow forecasts, budgets and marketing. Their benefits are better planning, a stronger case when seeking finance, and targets against which performance can be measured. Their main limitation is that the future may not follow the past, since changes in tastes, competitors' actions, the economy or a crisis can make any forecast wrong, and forecasts based on judgement can be biased.
  example: A fictional ice-cream maker forecasts strong summer sales from three years of monthly figures and hires seasonal staff in April, but a cold, wet June leaves it with surplus stock.
  topics: []
  subtopics: ['4.3']
  level: HL
  category: marketing
  provenance: subject-knowledge
  related: [trend, seasonal-variation, qualitative-sales-forecasting, market-research]
- id: trend
  term: Trend
  definition: The underlying long-term direction of a set of figures over time, such as sales rising or falling, once short-term ups and downs are set aside.
  context: Finding the trend is the starting point of most quantitative sales forecasts, because extending it into the future, called extrapolation, gives the forecast, which may then be adjusted for seasonal variation. A trend can be shown by a line of best fit, part of simple linear regression in the HL toolkit. Trends can change direction without warning, which is a key limitation of forecasting.
  example: A fictional bookshop's sales have fallen a little every year for five years, a downward trend that persuades the owner to add a café.
  topics: []
  subtopics: ['4.3']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [seasonal-variation, sales-forecast, qualitative-sales-forecasting]
- id: seasonal-variation
  term: Seasonal variation
  definition: A regular, repeated rise and fall in sales at particular times of the year, week or day, around the trend.
  context: Seasonal patterns come from weather, holidays, school terms and customs, and a good forecast allows for them so that stock, staff and cash are ready in time. They differ from cyclical variation, which follows the economy over several years, and from random variation, which cannot be predicted. Dynamic pricing is one way businesses respond to predictable peaks in demand.
  example: A fictional toy shop sells far more in the weeks before a major gift-giving holiday than in the rest of the year, so it orders stock and hires temporary staff months in advance.
  topics: []
  subtopics: ['4.3']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [trend, sales-forecast, dynamic-pricing]
- id: qualitative-sales-forecasting
  term: Qualitative sales forecasting
  definition: Forecasting sales from opinions and judgement rather than from past figures, for example from experts, the sales team or surveys of customers' buying intentions.
  context: It is the main option when there are no past data, as with a new product, or when the future is expected to differ from the past. Methods include asking experienced managers or outside experts, collecting estimates from sales staff, and surveying customers about what they plan to buy. It can capture changes that past figures miss, but it is open to bias and optimism, so it is often used alongside quantitative methods.
  example: Before launching an electric scooter, a fictional maker asks its dealers and a panel of industry experts how many they expect it to sell in the first year.
  topics: []
  subtopics: ['4.3']
  level: HL
  category: marketing
  provenance: subject-knowledge
  related: [sales-forecast, trend, qualitative-research, research-bias, quantitative-sales-forecasting]
- id: quantitative-sales-forecasting
  term: Quantitative sales forecasting
  definition: Forecasting sales from numerical data, usually the business's own past sales or figures for something its sales depend on, such as advertising spending or the weather, by finding a pattern and projecting it forward.
  context: Methods include extending the trend of past sales (extrapolation), adjusting for seasonal variation, and simple linear regression, the HL toolkit tool that fits a line of best fit to data on two variables. It is objective and quick when good data exist, but it assumes that the past pattern will continue, so it can miss changes in tastes, competition or the economy, and it cannot be used for a new product with no sales history. It is often combined with qualitative methods.
  example: A fictional bakery chain extends the rising trend in three years of monthly sales, adjusts each month for its usual seasonal pattern, and uses the result to plan its flour orders and staff rotas.
  topics: []
  subtopics: ['4.3']
  level: HL
  category: marketing
  provenance: subject-knowledge
  related: [sales-forecast, qualitative-sales-forecasting, trend, extrapolation, simple-linear-regression]

# ---------- 4.4 Market research ----------
- id: market-research
  term: Market research
  aliases: [Marketing research]
  definition: Gathering and analysing information about customers, competitors and the market to help a business make better marketing decisions.
  context: Organizations research the market to identify needs and gaps, test ideas before a launch, understand competitors, measure satisfaction and reduce the risk of costly mistakes. They use primary research, collected first-hand, and secondary research, which already exists. Research costs time and money, and results are only as good as the sample and the questions, so findings support judgement rather than replace it.
  example: Before opening a second branch, a fictional dental practice, Bright Smile, studies population data for three suburbs and surveys residents about how far they would travel for a check-up.
  usage:
    general: Some writers separate marketing research, into any marketing decision, from market research, into a market and its customers.
    syllabus: The guide uses market research for both, covering why and how organizations gather data about customers, competitors and markets.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [primary-research, secondary-research, sampling, qualitative-research, quantitative-research]
- id: primary-research
  term: Primary research
  aliases: [Primary market research, Field research]
  definition: Research that collects new data first-hand for a specific purpose, through surveys, interviews, focus groups or observation.
  context: Its strengths are that it answers the business's own questions, is up to date and is not available to competitors. It is usually slower and more expensive than secondary research and needs careful design, because a poor sample or leading questions can produce misleading results. Businesses often begin with secondary research and use primary research to fill the gaps.
  example: A fictional pet-food start-up, Wag, gives free samples to dog owners in a park and interviews them a week later about how their dogs reacted.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [secondary-research, survey, interview, focus-group, observation]
- id: secondary-research
  term: Secondary research
  aliases: [Secondary market research, Desk research]
  definition: Research that uses data already collected by someone else for another purpose, such as market analyses, academic journals, government publications, media articles and online content.
  context: It is usually quicker and cheaper than primary research and gives a broad picture of a market, its size and its trends. The data may be out of date, collected for a different purpose, too general for the business's question or available to every competitor, and their accuracy depends on the source. Checking who produced the data and why is part of using them well.
  example: A fictional entrepreneur planning a vegan restaurant reads government figures on the local population, a published report on the plant-based food market and recent news articles about local eating habits.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [primary-research, market-analysis, academic-journal, government-publication, media-article, online-content]
- id: survey
  term: Survey
  aliases: [Questionnaire]
  definition: A primary research method that asks a sample of people the same set of questions, on paper, online, by phone or face to face.
  context: Surveys can reach many people cheaply, especially online, and closed questions produce quantitative data that are easy to analyse, while open questions add qualitative detail. Results suffer if the sample is unrepresentative, few people respond, or questions are leading or unclear, so questionnaires are usually tested on a few people first.
  example: A fictional cinema chain emails a ten-question survey to its members asking which films, times and ticket prices they prefer.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [primary-research, sampling, quantitative-research, research-bias]
- id: interview
  term: Interview (market research)
  aliases: [In-depth interview]
  definition: A primary research method in which a researcher asks one person questions, face to face, by phone or online, and can follow up on the answers.
  context: Interviews give rich qualitative insight into why people think and buy as they do, and the interviewer can explain questions and probe further. They are slow and expensive per person, so samples are small, and the interviewer's manner or wording can sway the answers, which is a form of bias.
  example: A fictional software firm interviews eight small-business owners for an hour each to learn what frustrates them about accounting apps.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [primary-research, focus-group, qualitative-research, research-bias]
- id: focus-group
  term: Focus group
  definition: A primary research method in which a small group of people, often six to ten, discuss a product, idea or advertisement, guided by a moderator.
  context: Focus groups produce qualitative data on feelings, reactions and the reasons behind them, and the discussion can spark ideas that a survey would miss. They are costly to run, the small group may not represent the market, and dominant members or the moderator can steer the discussion, so findings are a starting point for further research.
  example: Before relaunching its packaging, a fictional juice brand shows three designs to a focus group of eight parents and records which one they would pick up first, and why.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [primary-research, qualitative-research, interview, research-bias]
- id: observation
  term: Observation (market research)
  definition: A primary research method that watches and records what people actually do, such as how shoppers move around a store or use a product, rather than asking them.
  context: Observation shows real behaviour, which can differ from what people say in surveys, and it can be done in person, with cameras or through website data. It does not explain why people behave as they do, and people who know they are being watched may act differently, which is sometimes called the Hawthorne effect. Observing people without their consent raises ethical issues.
  example: A fictional supermarket times how long shoppers take at its new self-service tills and counts how many need help from staff.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [primary-research, quantitative-research, qualitative-research]
- id: market-analysis
  term: Market analysis
  aliases: [Market report]
  definition: A published study of a market, usually produced by a specialist research firm and sold to businesses, covering its size, growth, trends, main competitors and customers.
  context: Market analyses are a valuable secondary source because they bring together data that a single business could not collect alone. They can be expensive, are written for every buyer rather than for one business's question, and may be out of date in a fast-moving market.
  example: A fictional coffee chain planning to enter a new country buys a report on that country's coffee shop market before deciding which city to start in.
  usage:
    general: Market analysis can also mean the process of studying a market, which a business may carry out itself.
    syllabus: In the guide's list of secondary research methods, market analyses are published reports on a market.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [secondary-research, market-size, market-growth]
- id: academic-journal
  term: Academic journal
  definition: A publication of research articles written by university researchers and other experts and checked by independent experts before they are published.
  context: As a secondary source, journals offer careful, evidence-based studies of consumer behaviour, markets and management. They are generally reliable but can be technical, slow to appear, expensive to access and focused on general findings rather than one business's market.
  example: A fictional toy company reads journal research on how children respond to packaging colours before it redesigns its boxes.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [secondary-research, government-publication, market-analysis]
- id: government-publication
  term: Government publication
  aliases: [Official statistics]
  definition: Data and reports published by government departments and agencies, such as population censuses, surveys of household income and spending, and trade figures.
  context: Government publications are a secondary source that is often free, broad in coverage and based on large samples. They may appear some time after the data were collected, be too general for a particular market, and in some countries be less reliable or less independent.
  example: A fictional nursery chain uses census data on the number of young children in each district to decide where to open its next site.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [secondary-research, demographic-segmentation, academic-journal]
- id: media-article
  term: Media article
  definition: A report or feature in a newspaper, magazine, broadcast or news website, used as a secondary source of information about markets, competitors and consumer trends.
  context: Media articles are cheap, up to date and easy to find, and they can alert a business to new trends or a competitor's plans. They may be selective, simplified or biased, and journalists do not always name their sources, so key facts should be checked elsewhere.
  example: A fictional bicycle shop reads local news reports about a planned network of cycle lanes and expects demand for commuter bikes to rise.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [secondary-research, online-content, research-bias]
- id: online-content
  term: Online content
  definition: Information published on the internet, such as competitors' websites, customer reviews, social media posts, forums and blogs, used as a secondary source.
  context: Online content is fast and often free to gather, and reviews and social media show what customers really say about products. Its quality varies enormously, since much of it is unverified, anonymous or written to sell something, and the people who post online may not represent the whole market.
  example: A fictional hotel reads every online review of its three nearest rivals to find out what guests praise and what they complain about.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [secondary-research, media-article, social-media-marketing]
- id: qualitative-research
  term: Qualitative research
  definition: Research that collects non-numerical information about people's opinions, feelings and motives, answering questions such as why and how.
  context: Interviews, focus groups and open survey questions produce qualitative data. It gives depth and can reveal reasons a business had not considered, but it usually comes from small samples, is harder to analyse and compare, and depends on the researcher's interpretation. It is often used to explore an issue before quantitative research measures it.
  example: A fictional skincare brand runs focus groups to understand why some customers feel uneasy about buying make-up online.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [quantitative-research, focus-group, interview, psychographic-segmentation]
- id: quantitative-research
  term: Quantitative research
  definition: Research that collects numerical data, such as how many people buy, how often and at what price, which can be analysed statistically.
  context: Surveys with closed questions, sales records and website data produce quantitative data. They allow comparisons, charts and descriptive statistics, and results from a large, well-chosen sample can be generalized to the whole market. Quantitative data show what is happening but rarely why, which is why they are often combined with qualitative research.
  example: A fictional bakery asks 400 customers to rate three new loaves from 1 to 10 and compares the average scores.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [qualitative-research, survey, sampling, observation]
- id: sampling
  term: Sampling
  aliases: [Sample]
  definition: Choosing a smaller group of people, the sample, from the whole group a business wants to learn about, the population, so that research is affordable.
  context: A sample is useful only if it represents the population, and a larger, well-chosen sample usually gives more reliable results but costs more. The guide names three sampling methods, which are quota, random and convenience sampling. Results from any sample carry some sampling error, and a badly chosen sample adds bias.
  example: A fictional gym with 3,000 members asks 200 of them about new opening hours instead of surveying all 3,000.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [quota-sampling, random-sampling, convenience-sampling, sampling-error, research-bias]
- id: quota-sampling
  term: Quota sampling
  definition: A sampling method in which the population is divided into groups, such as age bands or genders, and the researcher questions a set number of people from each group, often in proportion to the group's size.
  context: Quota sampling makes sure every important group is represented, is quicker and cheaper than random sampling, and needs no full list of the population. Because researchers choose who fills each quota, it is not random, and their choices can bias the results.
  example: A fictional radio station whose listeners are 40% under 30 makes sure that 40 of the 100 people it interviews are under 30.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [sampling, random-sampling, convenience-sampling, research-bias]
- id: random-sampling
  term: Random sampling
  definition: A sampling method in which every member of the population has an equal chance of being chosen, for example by picking names at random from a full list.
  context: Random sampling removes the researcher's own choice of who to ask, so results are more likely to represent the population, especially with a large sample. It needs a complete list of the population, which may not exist, and a small random sample can still miss important groups by chance. It can be slow and costly if the people chosen are hard to reach.
  example: A fictional broadband provider uses software to pick 500 accounts at random from its full customer list and sends each a satisfaction survey.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [sampling, quota-sampling, convenience-sampling, sampling-error]
- id: convenience-sampling
  term: Convenience sampling
  definition: A sampling method that uses the people who are easiest to reach, such as passers-by, friends or customers already in a shop.
  context: It is the quickest and cheapest method and can be useful for a first test of an idea. Because the sample is chosen for convenience, it is unlikely to represent the population, so results can be badly biased and should not be generalized to the whole market.
  example: A student planning a smoothie stall asks classmates in the school canteen what they would pay for a smoothie.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [sampling, quota-sampling, random-sampling, research-bias]
- id: sampling-error
  term: Sampling error
  definition: The difference between a result from a sample and the true figure for the whole population, which arises because only some people were asked.
  context: Some sampling error is unavoidable, but it shrinks as the sample becomes larger and better chosen. It is different from bias, a systematic distortion caused by how the research is designed or carried out, which does not shrink with a larger sample.
  example: A survey of 50 customers suggests that 60% like a new flavour, but if every customer were asked the true figure might be 52%; the gap is sampling error.
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [sampling, research-bias, random-sampling]
- id: research-bias
  term: Research bias
  aliases: [Bias]
  definition: A systematic distortion in research results caused by how the sample is chosen, how questions are worded or asked, or how answers are interpreted.
  context: Common forms are sample bias, when the sample does not represent the population; question bias, from leading or loaded questions; interviewer bias; and respondents giving the answers they think are expected. Unlike sampling error, bias does not disappear with a bigger sample. It can lead a business to launch, price or promote a product on false evidence.
  example: "A fictional restaurant asks diners 'How much did you enjoy our delicious new menu?', a leading question that pushes its scores up."
  topics: []
  subtopics: ['4.4']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [sampling-error, sampling, survey, interview]

# ---------- 4.5 The seven Ps of the marketing mix ----------
- id: marketing-mix
  term: Marketing mix
  aliases: [Seven Ps, 7Ps]
  definition: The combination of decisions a business makes to market a product. The seven Ps are product, price, promotion, place, people, processes and physical evidence.
  context: The elements must fit each other and the target market and positioning, so a premium price needs a quality product, careful promotion and the right places to sell. The mix changes over the product life cycle and differs between goods and services. The guide asks students to judge which mix is appropriate for a particular product or business.
  example: A fictional yoga studio, Still Point, offers small classes (product) for a monthly fee (price), promoted on local social media (promotion), in a quiet city-centre room (place), led by trained teachers (people), booked through an app (processes), in a calm, clean space (physical evidence).
  usage:
    general: Many writers use four Ps (product, price, promotion, place) for goods and add people, processes and physical evidence only for services.
    syllabus: The guide calls all seven the marketing mix and asks about the last three in the context of marketing a service.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [product-life-cycle, positioning, target-market, promotional-mix, distribution-channel, physical-evidence]
- id: product-life-cycle
  term: Product life cycle
  aliases: [PLC]
  definition: A model of the stages a product's sales pass through over time, usually shown as development, introduction, growth, maturity and decline.
  context: Sales are low at launch, rise quickly in growth, level off in maturity (some models add a saturation stage when the market is full) and fall in decline. The model links to investment, profit and cash flow, since heavy investment in development and launch usually means losses and negative cash flow at first, while profit and cash flow turn positive during growth, peak in maturity and fall in decline. Real products follow no fixed timetable, and businesses can extend a life cycle, so the model guides decisions rather than predicting them.
  example: A fictional phone case sells slowly at launch, grows quickly as the phone it fits becomes popular, levels off once most owners have one, and declines when that phone is replaced.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: theory
  provenance: subject-knowledge
  related: [extension-strategy, product-portfolio, marketing-mix, market-growth]
- id: extension-strategy
  term: Extension strategy
  aliases: [Extension strategies]
  definition: An action taken to lengthen a product's life cycle by renewing its sales in maturity and delaying its decline.
  context: Common extension strategies are finding new markets or new uses, adding features or new versions, changing the packaging or design, adjusting the price and running fresh promotion. They cost less than developing a new product and protect a successful brand, but they only delay decline, may fail if the product is genuinely outdated, and use resources that could fund new products. The decision is when to extend and when to withdraw.
  example: When sales of its classic biscuit level off, a fictional baker, Oatfield, launches a snack pack for lunchboxes and starts selling the biscuit in a neighbouring country.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [product-life-cycle, market-development, product-portfolio, brand-development]
- id: product-portfolio
  term: Product portfolio
  definition: The full set of products a business sells, which may be at different stages of the product life cycle and in markets growing at different rates.
  context: Managing the portfolio means keeping it in balance, so that mature products generate the cash to support new ones and new products are ready to replace those that will decline. The usual tool is the BCG matrix from the toolkit, which sorts products by market growth and relative market share into stars, cash cows, question marks and dogs, so that cash cows can fund the most promising products. A narrow portfolio is risky because a fall in one product's sales hits the whole business, while a very wide one can stretch management and marketing budgets.
  example: A fictional drinks company, Brookline, relies on its long-established cola for most of its cash and uses that cash to launch a sparkling water and build up a young sports drink.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [product-life-cycle, extension-strategy, brand, market-share]
- id: brand
  term: Brand
  aliases: [Branding]
  definition: A name, symbol, design or other feature that identifies a business's products and sets them apart from rivals', together with the ideas customers associate with it.
  context: Branding matters because a strong brand is recognized quickly, reassures customers about quality, builds loyalty, and lets a business charge more and launch new products more easily. Building a brand takes years of consistent marketing and money, and a scandal or a poor product can damage it fast. The guide names four aspects of branding, which are awareness, development, loyalty and value.
  example: A fictional water bottle maker, Tidewell, puts the same wave logo, colours and message about refilling on every product, so customers recognize it instantly on a crowded shelf.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [brand-awareness, brand-development, brand-loyalty, brand-value, brand-image]
- id: brand-image
  term: Brand image
  definition: The overall impression customers have of a brand, built up from its products, promotion, prices, service and reputation.
  context: Brand image is how customers actually see a brand, which may differ from the identity the business tries to project. A positive image supports premium prices and loyalty, while a damaged one, for example after a product recall or an ethical scandal, can take years to repair. Ethical and sustainable practices can improve it.
  example: After news reports link a fictional fashion retailer, Loom, to unsafe factories, its brand image suffers and many younger customers switch to rivals.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [brand, positioning, ethical-marketing, brand-value]
- id: brand-awareness
  term: Brand awareness
  definition: How far customers in the target market recognize a brand, can recall it and know what it offers.
  context: Awareness is the first step towards a sale, because customers rarely buy a brand they have never heard of. It is built through promotion, distribution and word of mouth, and measured by asking customers which brands they recognize or can name. High awareness does not guarantee sales if the brand image is poor.
  example: A fictional new energy drink hands out free cans at sports events for three months to build awareness before its national launch.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [brand, brand-loyalty, above-the-line-promotion, social-media-marketing]
- id: brand-development
  term: Brand development
  definition: Building and strengthening a brand over time by shaping its identity, values and reputation, and sometimes by extending it to new products or markets.
  context: It includes consistent design and messages, delivering on the brand's promises, and brand extension, which uses an established name for a new product. Development turns awareness into a clear, valued identity, but stretching a brand too far can confuse customers and weaken it.
  example: A fictional coffee roaster, Ember, known for its beans, develops its brand by opening cafés with the same look and values and later selling coffee machines under its name.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [brand, brand-awareness, brand-value, extension-strategy]
- id: brand-loyalty
  term: Brand loyalty
  definition: Customers' tendency to keep buying the same brand rather than switching to rivals, even when alternatives are cheaper or easier to find.
  context: Loyal customers bring repeat sales, recommend the brand and are less sensitive to price, which makes demand more predictable and marketing cheaper per sale. Businesses build loyalty through quality, service, reward schemes and an emotional connection with the brand. Loyalty can break quickly if the brand lets customers down.
  example: Regular customers of a fictional bike repair shop, Spoke, keep coming back after a cheaper rival opens, because the mechanics know their bikes and explain every repair.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [brand, brand-value, behavioural-segmentation, price-elasticity-of-demand]
- id: brand-value
  term: Brand value
  definition: What a brand is worth to its owner, from the extra sales and higher prices it brings compared with an unbranded product, sometimes estimated as a sum of money.
  context: Strong awareness, a positive image and loyal customers all add to brand value, which is why businesses invest in brands and sometimes buy other businesses largely for theirs. A brand a business builds itself does not usually appear on its balance sheet, but part of the price paid for another business can appear among its intangible assets (3.4). Value can fall quickly after bad publicity; a closely related idea is brand equity.
  example: A fictional ice-cream brand, Polar Bay, can charge more than an identical supermarket own-label product because customers trust it, and that premium is part of its brand value.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [brand, brand-loyalty, brand-image, premium-pricing]
- id: cost-plus-pricing
  term: Cost-plus pricing
  aliases: [Mark-up pricing, Cost-plus (mark-up) pricing]
  definition: Setting a price by adding a mark-up, a percentage or fixed amount, to the cost of making or buying each unit.
  formula: Price = unit cost + (unit cost × mark-up % ÷ 100)
  context: It is simple, makes sure each sale covers its cost and is easy to explain to customers, which is why many retailers and builders use it. It ignores demand and competitors' prices, so the result may be too high to sell or lower than customers would happily pay. It also depends on an accurate unit cost, which changes with output when there are fixed costs.
  example: A fictional furniture maker's chair costs €80 to make; with a 50% mark-up it sells for €80 + (€80 × 50 ÷ 100) = €120.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [average-cost, total-cost, competitive-pricing, contribution-pricing]
- id: penetration-pricing
  term: Penetration pricing
  definition: Setting a low price when a product enters a market, to attract customers quickly and win market share, usually intending to raise the price later.
  context: It suits mass markets where customers are sensitive to price and where high volumes bring economies of scale. The risks are thin or negative profit margins at first, customers who resent later price rises, and rivals who respond with price cuts of their own. Do not confuse it with market penetration in the Ansoff matrix, which means selling more of existing products in existing markets by any means.
  example: A fictional streaming service, Reelbox, charges half its planned price for the first year to sign up subscribers in a market dominated by two rivals.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [price-skimming, market-share, economies-of-scale, predatory-pricing]
- id: price-skimming
  term: Price skimming
  aliases: [Skimming]
  definition: Launching a new or innovative product at a high price to earn high profits from customers keen to have it first, then lowering the price in stages to reach more buyers.
  context: Skimming helps recover development costs quickly and suits products with a clear novelty or technical lead, such as new technology. It works only while the product stays distinctive, since high early profits attract competitors, and early buyers may feel cheated when the price falls. It differs from premium pricing, where the high price is kept to signal lasting quality.
  example: A fictional games console, Nova, launches at a high price for enthusiasts and is cut twice in its first two years as rivals release their own machines.
  usage:
    general: Skimming is a widely taught pricing strategy, often set against penetration pricing.
    syllabus: The guide does not list skimming among its pricing methods; premium pricing is the closest method it names.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [penetration-pricing, premium-pricing, product-life-cycle]
- id: loss-leader
  term: Loss leader
  aliases: [Loss leader pricing]
  definition: A product sold below its cost to attract customers, in the hope that they will also buy other, profitable products.
  context: Retailers use loss leaders on popular, frequently bought items so that shoppers notice the price and come in. The strategy works only if customers buy enough else, or later buy profitable extras such as ink for a cheap printer. It can cheapen a brand's image, upset suppliers, and in some countries selling below cost is restricted by law.
  example: A fictional supermarket, Daily Basket, sells bread at a loss every weekend, knowing that most shoppers who come in for it fill a whole basket.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [predatory-pricing, penetration-pricing, contribution-pricing, total-revenue]
- id: predatory-pricing
  term: Predatory pricing
  definition: Deliberately setting prices so low, often below cost, that rivals cannot compete and leave the market, so that the business can raise its prices once they have gone.
  context: Predatory pricing needs deep financial reserves and is illegal in many countries because it reduces competition and harms customers in the long run. It differs from penetration pricing, which aims to win customers rather than to destroy rivals, and from a loss leader, which aims to sell other products. Even where it is legal, it is widely seen as unethical.
  example: A fictional bus company with a large cash reserve cuts its fares far below cost on the one route where a small new rival operates, until the rival closes.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [penetration-pricing, loss-leader, competitive-pricing, market-leader]
- id: premium-pricing
  term: Premium pricing
  aliases: [Prestige pricing]
  definition: Setting a price deliberately higher than competitors' prices to signal quality, exclusivity or status.
  context: It suits strong brands with a clear USP, luxury goods and niche markets, and it brings high profit margins per unit. It needs consistent quality, service and promotion to justify the price, and sales volumes are lower. If customers stop believing the product is special, demand can fall sharply.
  example: A fictional watchmaker, Aurelian, prices its hand-assembled watches far above mass-produced rivals and sells them in only a few selected stores.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [brand-value, unique-selling-point, niche-market, price-skimming]
- id: dynamic-pricing
  term: Dynamic pricing
  aliases: [Surge pricing]
  definition: Changing prices frequently, often automatically, in response to demand, the time, the stock available or competitors' prices.
  context: Airlines, hotels, ride-hailing apps and online retailers use software to raise prices when demand is high and cut them when it is low, which helps fill capacity and raise revenue. Customers can see it as unfair, especially when prices jump during an emergency, and it needs good data and systems. Like the other HL pricing methods, it is judged by how appropriate it is in a given situation.
  example: A fictional ride-hailing app, Hop, raises fares automatically when it rains on a Friday night and lowers them on quiet weekday afternoons.
  topics: []
  subtopics: ['4.5']
  level: HL
  category: marketing
  provenance: subject-knowledge
  related: [seasonal-variation, price-elasticity-of-demand, competitive-pricing, e-commerce]
- id: competitive-pricing
  term: Competitive pricing
  aliases: [Competition-based pricing]
  definition: Setting prices mainly by reference to competitors' prices for similar products, whether at, slightly below or slightly above them.
  context: It suits markets where products are similar and customers compare prices easily, so a business cannot stray far from the going rate. It is simple to apply and reduces the risk of a price war, but it ignores the business's own costs, so the price may not be profitable, and it can leave the business simply following the market leader.
  example: A fictional petrol station checks the prices at the two other stations on its road each morning and sets its own within a cent of theirs.
  usage:
    general: In everyday speech a competitive price usually means a low one.
    syllabus: Competitive pricing is a method in which the price is set in relation to rivals' prices, which may mean matching them or pricing just above or below.
  topics: []
  subtopics: ['4.5']
  level: HL
  category: marketing
  provenance: subject-knowledge
  related: [cost-plus-pricing, market-leader, predatory-pricing, price-elasticity-of-demand]
- id: contribution-pricing
  term: Contribution pricing
  definition: Setting a price above the variable cost per unit, so that each sale makes a contribution towards fixed costs and then profit.
  formula: Price = variable cost per unit + contribution per unit
  context: It is useful when a business has spare capacity, sells several products that share fixed costs, or is deciding whether to accept a special order at a lower price than usual. Any price above variable cost adds to profit in the short run, but in the long run total contribution must cover all fixed costs. Low prices for some customers can also upset regular customers who pay more.
  example: A fictional printing firm with idle machines accepts a school's order at €2 a brochure, because each brochure costs €1.20 in paper and ink and so contributes €0.80 towards fixed costs.
  topics: []
  subtopics: ['4.5']
  level: HL
  category: marketing
  provenance: subject-knowledge
  related: [contribution, variable-cost, fixed-cost, special-order]
- id: price-elasticity-of-demand
  term: Price elasticity of demand (PED)
  aliases: [PED]
  definition: A measure of how much the quantity demanded of a product responds to a change in its price.
  formula: PED = percentage change in quantity demanded ÷ percentage change in price
  context: PED is usually negative, so it is often quoted without the minus sign. Demand is price elastic when the value, ignoring the sign, is greater than 1, so a price cut raises total revenue; it is price inelastic when the value is less than 1, so a price rise raises total revenue. Demand tends to be inelastic for necessities, products with few substitutes and strong brands, and elastic where there are many close substitutes.
  example: When a fictional cinema raises its ticket price by 10% and attendance falls by 5%, PED is −5% ÷ 10% = −0.5, so demand is inelastic and revenue rises.
  usage:
    general: In economics PED is a precise coefficient measured along a demand curve.
    syllabus: The guide lists PED with the HL pricing methods, as a way to judge how a price change would affect sales and revenue. Its formula list does not include PED, so the standard formula is given here.
  topics: []
  subtopics: ['4.5']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [total-revenue, brand-loyalty, differentiation, dynamic-pricing]
- id: promotional-mix
  term: Promotional mix
  aliases: [Promotion mix]
  definition: The combination of methods a business uses to communicate with customers, such as advertising, sales promotion, public relations, personal selling, direct marketing, sponsorship and social media.
  context: Promotion, one of the seven Ps, aims to inform, persuade and remind customers, and the guide groups it into above the line, below the line and through the line. The best mix depends on the target market, the product and its life cycle stage, the budget and what competitors do. Its success should be measured against the marketing objectives.
  example: A fictional new gym combines local radio adverts, a free first week for anyone who signs up online and a stand at the city's half-marathon.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [above-the-line-promotion, below-the-line-promotion, through-the-line-promotion, social-media-marketing, marketing-mix]
- id: above-the-line-promotion
  term: Above the line promotion
  aliases: [ATL promotion]
  definition: Promotion through paid mass media that reach a large, broad audience, such as television, radio, cinema, newspapers, magazines and billboards.
  context: Above the line promotion builds brand awareness quickly across a whole market and suits mass-market products and big launches. It is expensive, hard to aim at a particular segment, and its effect on sales is difficult to measure. Online adverts shown to everyone who visits a site work in a similar way, but targeted digital adverts blur the line.
  example: A fictional national bank launches a new current account with a television advert and posters at railway stations across the country.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [below-the-line-promotion, through-the-line-promotion, mass-market, brand-awareness]
- id: below-the-line-promotion
  term: Below the line promotion
  aliases: [BTL promotion]
  definition: Promotion aimed directly at a chosen segment or at individual customers without using mass media, such as sales promotions, direct mail and email, public relations, sponsorship, personal selling and in-store displays.
  context: Below the line methods are usually cheaper per customer, easier to target and easier to measure than mass media, and they suit niche markets and small businesses. They reach fewer people, and some methods, such as discounts, can cut margins or cheapen a brand if overused.
  example: A fictional bookshop emails its loyalty card holders a voucher in their birthday month and holds author signings in the shop.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [above-the-line-promotion, through-the-line-promotion, sales-promotion, public-relations, direct-marketing, personal-selling]
- id: through-the-line-promotion
  term: Through the line promotion
  aliases: [TTL promotion]
  definition: An integrated campaign that combines above the line and below the line methods, so that mass-media messages and targeted activity support each other.
  context: A through the line campaign might use television to build awareness and then social media, email and in-store offers to turn that awareness into sales, all with one consistent message. It reaches both a wide audience and specific segments and gets the most from each method, but it needs careful coordination and a larger budget.
  example: A fictional sportswear brand, Paceline, runs a cinema advert for a new running shoe, shows a code in the advert that unlocks a discount online, and holds free trial runs at its stores.
  usage:
    general: Many marketers now talk of integrated campaigns, and digital channels that can be both mass and targeted make the line hard to draw.
    syllabus: The guide keeps the three categories, so classify a method by whether it reaches a mass or a targeted audience, and treat a campaign that deliberately combines both as through the line.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [above-the-line-promotion, below-the-line-promotion, social-media-marketing, promotional-mix]
- id: social-media-marketing
  term: Social media marketing
  definition: Using social media platforms to promote a business and its products, through its own posts, paid adverts aimed at chosen audiences, influencers and conversations with customers.
  context: As a promotional strategy it is relatively cheap, can target segments precisely, allows two-way communication and gives detailed data on who responds, and good content can spread widely through shares. On the other hand, criticism and mistakes spread just as fast, it needs constant attention and fresh content, results depend on each platform's changing rules, and it raises concerns about privacy and about marketing to young people.
  example: A fictional cake shop, Sugar Loaf, posts short videos of cakes being decorated, replies to every comment and pays to show its adverts to people nearby who follow baking accounts.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [influencer-marketing, below-the-line-promotion, through-the-line-promotion, online-content, ethical-marketing]
- id: sales-promotion
  term: Sales promotion
  definition: A short-term incentive to persuade customers to buy now, such as a discount, a buy-one-get-one-free offer, a free sample, a competition or a loyalty reward.
  context: Sales promotions are a below the line method that can lift sales quickly, encourage people to try a new product and clear old stock. The boost is often temporary, customers may learn to wait for the next offer, and frequent discounts can cheapen a premium brand and squeeze margins.
  example: A fictional coffee shop gives a free pastry with any large coffee bought before 9 a.m. during its first month.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [below-the-line-promotion, promotional-mix, brand-loyalty]
- id: public-relations
  term: Public relations (PR)
  aliases: [PR]
  definition: Activities that build and protect an organization's reputation and win favourable publicity, such as press releases, events, sponsorship, community projects and dealing with the media in a crisis.
  context: PR is a below the line method whose coverage is usually free and more trusted than advertising, because it comes from a third party. The business cannot control what journalists or the public say, so results are uncertain, and handling bad news poorly can quickly damage its brand image.
  example: A fictional brewery sponsors a local youth football league and invites the local newspaper to the opening match, which earns it a front-page photograph.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [below-the-line-promotion, brand-image, promotional-mix]
- id: direct-marketing
  term: Direct marketing
  aliases: [Direct mail]
  definition: Sending promotional messages straight to individual customers or potential customers, for example by post, email, text message or phone.
  context: Direct marketing is a below the line method that can be personalized and targeted using customer data, and its results, such as how many people click or buy, are easy to measure. Unwanted messages annoy people and are often ignored, and businesses must follow data protection laws on how they collect and use customer data.
  example: A fictional garden centre emails customers who bought tomato plants last spring with an offer on this year's seedlings.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [below-the-line-promotion, behavioural-segmentation, promotional-mix]
- id: personal-selling
  term: Personal selling
  definition: Promotion in which a salesperson deals with a customer one to one, in person, by phone or by video call, to explain a product and win a sale.
  context: Personal selling is a below the line method that suits expensive, complex or customized products and business customers, because the salesperson can answer questions and build a relationship. It is expensive per customer, depends on the skill and honesty of staff, and pressure selling can drive customers away.
  example: A fictional maker of industrial ovens sends a sales engineer to visit bakeries, demonstrate an oven and tailor a quote to each site.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [below-the-line-promotion, people-marketing-mix, promotional-mix]
- id: influencer-marketing
  term: Influencer marketing
  definition: Paying or partnering with people who have a large or loyal online following, so that they show or recommend a product to their followers.
  context: Influencer marketing is part of many social media strategies because followers often trust an influencer more than an advert, and a well-chosen influencer reaches exactly the right segment. Results are hard to predict, an influencer's behaviour can damage the brand, and sponsored posts should be clearly labelled so that followers are not misled.
  example: A fictional climbing-shoe brand sends its new model to five well-known climbers, who post videos of themselves wearing it on difficult routes.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [social-media-marketing, ethical-marketing, brand-awareness]
- id: distribution-channel
  term: Distribution channel
  aliases: [Channel of distribution]
  definition: The route a product takes from the producer to the final customer, including any intermediaries such as agents, wholesalers or retailers.
  context: Channels are often described by the number of intermediaries, so a direct (zero-level) channel sells straight to customers, a one-level channel uses a retailer, and a two-level channel adds a wholesaler. Shorter channels give the producer more control and a larger share of the final price, while longer ones reach more customers with less effort. The right channel depends on the product, the market, costs and what customers expect, and many businesses use several at once.
  example: A fictional olive-oil producer sells direct from its website, supplies delicatessens itself and uses a wholesaler to reach supermarkets.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [intermediary, wholesaler, retailer, e-commerce, marketing-mix]
- id: intermediary
  term: Intermediary
  definition: A business that stands between the producer and the final customer in a distribution channel, such as an agent, a wholesaler or a retailer.
  context: Intermediaries add value by holding stock, breaking bulk into smaller quantities, reaching customers the producer cannot, and giving advice and after-sales service. Each takes a share of the final price, so the producer earns less per unit and has less control over how its product is sold and displayed. Agents arrange sales for a commission without owning the goods, which is common when entering foreign markets.
  example: A fictional furniture maker that wants to sell abroad appoints a local agent in each country, paid a commission on every order.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [distribution-channel, wholesaler, retailer, exporting]
- id: wholesaler
  term: Wholesaler
  definition: An intermediary that buys large quantities from producers and sells smaller quantities to retailers or other businesses.
  context: Wholesalers save producers the cost of dealing with many small retailers and give retailers a wide range of goods in convenient quantities, often on credit. They add a stage to the channel, which raises the final price or cuts the producer's margin, and large retail chains often bypass them and buy direct.
  example: A fictional snack producer sells pallets of crisps to a wholesaler, which supplies hundreds of small corner shops every week.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [intermediary, retailer, distribution-channel]
- id: retailer
  term: Retailer
  definition: An intermediary that sells goods to final consumers, in shops, online or both, usually in small quantities.
  context: Retailers give products visibility, convenience, advice and after-sales service close to the customer. Where a product is sold also shapes its image, so a premium brand chooses its retailers carefully. Large retailers have strong bargaining power over producers.
  example: A fictional kitchenware brand sells through department stores for visibility and through its own online shop for higher margins.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [intermediary, wholesaler, distribution-channel, e-commerce]
- id: e-commerce
  term: E-commerce
  aliases: [Electronic commerce, Online selling]
  definition: Buying and selling goods and services over the internet, through a business's own website or app or through online marketplaces.
  context: E-commerce lets even a small business reach customers nationally or abroad at low cost, sell around the clock and gather data on its buyers, and it shortens distribution channels by selling direct. It brings fierce price competition, delivery and returns costs, cybersecurity risks and the loss of face-to-face service. In international marketing it is often the cheapest first step into a foreign market.
  example: A fictional ceramics studio in a small town sells most of its plates through its own website to customers in other countries.
  topics: []
  subtopics: ['4.5', '4.6']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [distribution-channel, retailer, dynamic-pricing, international-marketing]
- id: people-marketing-mix
  term: People (marketing mix)
  definition: The employees who deal with customers when a service is delivered, and the relationships they build with those customers, as an element of the marketing mix.
  context: In a service, staff are part of the product, so their skills, attitude and appearance shape the customer's experience and recruitment, training and motivation become marketing issues. What customers expect from these relationships varies between cultures, for example how formal staff should be and whether service should feel personal or simply efficient, so businesses working across countries may adapt their approach. Hofstede's cultural dimensions, an HL toolkit tool, help to explain these differences.
  example: A fictional hotel chain, Lantern Hotels, trains reception staff to greet guests by name and solve problems without calling a manager, and adjusts how formal they are in each country.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [processes-marketing-mix, physical-evidence, marketing-mix, personal-selling]
- id: processes-marketing-mix
  term: Processes (marketing mix)
  aliases: [Delivery processes]
  definition: The procedures and systems through which a service reaches customers, from booking and payment to the service itself and any follow-up, as an element of the marketing mix.
  context: Fast, reliable and convenient processes raise customer satisfaction and can become a USP, while delays and errors drive customers away. Processes keep changing, for example through online booking, apps, self-service, contactless payment and automation, which can cut costs and waiting times but may lose the personal contact some customers value.
  example: A fictional dental practice lets patients book and pay through an app and sends a reminder the day before, which cuts the number of missed appointments.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [people-marketing-mix, physical-evidence, marketing-mix, e-commerce]
- id: physical-evidence
  term: Physical evidence
  definition: The tangible things customers can see or touch that show what a service is like and how good it is, such as the premises, decor, staff uniforms, website, brochures, receipts and packaging.
  context: Because a service is intangible and cannot be inspected before it is bought, customers judge it from these cues, which also help justify the price and support the brand's position. Clean, well-designed surroundings reassure customers, while a shabby waiting room or a confusing website can lose a sale before the service has even begun.
  example: A fictional law firm, Carver and Lane, keeps a bright, quiet reception area and gives clients a clear written summary after each meeting.
  topics: []
  subtopics: ['4.5']
  level: SL/HL
  category: marketing
  provenance: subject-knowledge
  related: [people-marketing-mix, processes-marketing-mix, marketing-mix, brand-image]

# ---------- 4.6 International marketing (HL only) ----------
- id: international-marketing
  term: International marketing
  definition: Marketing products in more than one country, which means choosing which foreign markets to enter, how to enter them and how far to adapt the marketing mix for each.
  context: Opportunities include new customers and growth when the home market is saturated, economies of scale, spreading risk across markets, a longer product life cycle and access to cheaper resources. Threats include cultural, language and legal differences, trade barriers, exchange rate changes, political instability, unfamiliar competitors and the cost of managing at a distance. Businesses can enter by exporting, licensing, franchising, joint ventures, strategic alliances, acquisitions or setting up their own operations abroad.
  example: A fictional skincare brand, Vela, first sells abroad through its online store and then forms a joint venture with a local retailer once demand in one country is proven.
  topics: []
  subtopics: ['4.6']
  level: HL
  category: marketing
  provenance: subject-knowledge
  related: [exporting, trade-barriers, exchange-rate, glocalization, joint-venture, franchising]
- id: exporting
  term: Exporting
  definition: Selling goods or services produced in one country to customers in another, either directly or through agents and distributors.
  context: Exporting is the lowest-risk way into a foreign market because the business needs no factory or shops abroad and can test demand cheaply. It still faces transport costs, trade barriers such as tariffs and swings in exchange rates, and it gives the business less control and local knowledge than a presence in the market. Selling online to customers abroad is a form of exporting.
  example: A fictional maker of hand-woven rugs ships orders to buyers in three countries and uses a distributor in the largest of them.
  topics: []
  subtopics: ['4.6']
  level: HL
  category: marketing
  provenance: subject-knowledge
  related: [international-marketing, trade-barriers, exchange-rate, intermediary]
- id: licensing
  term: Licensing
  definition: Allowing a business in another market to use a brand, design, patent or production method in return for a fee or a royalty.
  context: Licensing lets a business enter foreign markets quickly with little investment or risk, using the licensee's local knowledge and resources. The licensor gives up control over quality and marketing, earns only a royalty rather than the full profit, and may create a future competitor if the licensee learns too much. It differs from franchising, which licenses a complete way of running a business.
  example: A fictional animation studio licenses its cartoon characters to a toy manufacturer abroad, which pays a royalty on every toy it sells.
  topics: []
  subtopics: ['4.6']
  level: HL
  category: strategy
  provenance: subject-knowledge
  related: [franchising, royalty, international-marketing, brand-value]
- id: trade-barriers
  term: Trade barriers
  aliases: [Protectionism]
  definition: Government measures that restrict imports to protect domestic producers, such as tariffs (taxes on imports), quotas (limits on quantities), embargoes (bans) and strict product rules.
  context: Trade barriers raise the cost of selling abroad or block it altogether, so they are a major threat in international marketing. Businesses respond by producing inside the protected market, forming joint ventures with local firms or choosing markets inside a trading bloc. Barriers can change quickly with politics, which adds to the risk of operating internationally.
  example: When a country puts a high tariff on imported cars, a fictional car maker builds an assembly plant there so that its cars count as locally made.
  topics: []
  subtopics: ['4.6']
  level: HL
  category: concept
  provenance: subject-knowledge
  related: [trading-bloc, exporting, international-marketing, exchange-rate]
- id: trading-bloc
  term: Trading bloc
  definition: A group of countries that agree to reduce or remove trade barriers between themselves, and sometimes to share rules and a common tariff on imports from outside.
  context: A trading bloc creates opportunities for businesses inside it, which can sell across a larger market with lower costs and fewer rules, and it can make a member country an attractive base for businesses from outside. For businesses outside the bloc, its common barriers can be a threat.
  example: A fictional sauce maker in a member country sells in every other member country without paying tariffs, while a rival outside the bloc pays a tariff on each shipment.
  topics: []
  subtopics: ['4.6']
  level: HL
  category: concept
  provenance: subject-knowledge
  related: [trade-barriers, international-marketing, exporting]
- id: exchange-rate
  term: Exchange rate
  definition: The price of one country's currency in terms of another's, which determines how much exports and imports cost in each country.
  context: If an exporter's currency rises in value, its goods become more expensive abroad and harder to sell, or it must accept lower profit; if its currency falls, its exports become cheaper and more competitive, but imported materials cost more. Unpredictable exchange rate movements make international prices and profits uncertain, which is one of the main threats of operating internationally.
  example: A fictional wine exporter prices a case at €100; when the euro rises against the dollar, its American customers must pay more dollars for the same case, and some switch to local wine.
  topics: []
  subtopics: ['4.6']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [exporting, international-marketing, trade-barriers]
- id: standardized-marketing
  term: Standardized marketing
  aliases: [Global standardization]
  definition: Using the same product, brand and marketing mix in every country, with few or no changes for local markets.
  context: Standardization brings economies of scale in production and promotion, a consistent global brand image and simpler management. It risks ignoring differences in culture, language, tastes, incomes and laws, so a product or message that works at home may fail, or offend, abroad. Most businesses balance standardization with some adaptation.
  example: A fictional smartphone maker sells the same handset, packaging and advertising worldwide, changing only the language of the instructions and the type of plug.
  topics: []
  subtopics: ['4.6']
  level: HL
  category: strategy
  provenance: subject-knowledge
  related: [glocalization, international-marketing, economies-of-scale, brand-image]
- id: glocalization
  term: Glocalization
  definition: Combining a global brand and strategy with changes to the product or marketing mix to suit the tastes, culture and laws of each local market.
  context: The word joins global and local, since the business keeps the recognition and economies of scale of a global brand while adapting where customers really differ, for example in ingredients, sizes, prices, advertising or opening hours. Adapting costs money and adds complexity, so the decision is how much to adapt and where. Cultural differences, which Hofstede's cultural dimensions help to analyse, often drive the choice.
  example: A fictional burger chain, Brasa Burgers, keeps its logo and restaurant design everywhere but builds its menu around vegetarian dishes in countries where many people do not eat meat.
  topics: []
  subtopics: ['4.6']
  level: HL
  category: strategy
  provenance: subject-knowledge
  related: [standardized-marketing, international-marketing, people-marketing-mix, market-segmentation]

# Glossary: people, leadership and change terms beyond the IB course.
# Every entry is enrichment (provenance: enrichment): it names no IB subtopic, never carries
# the ib qualification, and links to the IB terms it builds on through related. Definitions,
# explanations and examples are the platform's own words; every business named is fictional.
# Entries are in alphabetical order of term.

- id: absence-rate
  term: "Absence rate"
  aliases: ["Absenteeism rate", "Absenteeism"]
  definition: "The percentage of working time lost because employees are absent, other than for planned holidays, often used as an indicator of health, morale and engagement."
  simple: "The share of working days lost because staff are off sick or away without it being planned."
  technical: "Absence rate = days lost to absence ÷ working days available × 100. Short, frequent absences are more often linked to morale and management than long-term illness is, so the pattern matters as much as the rate. Presenteeism, working while unwell, can lower productivity even when absence is low."
  example: "A fictional warehouse with 50 staff, each due to work 230 days a year, loses 575 days to absence, an absence rate of 5%."
  formula: "Absence rate = days lost to absence ÷ working days available × 100"
  misconceptions:
    - claim: "A low absence rate shows a healthy workforce."
      correction: "People may work while ill, or be afraid to take time off, which hides problems that appear later in mistakes and turnover."
  category: measure
  qualifications: [undergraduate, professional]
  provenance: enrichment
  related: [labour-turnover, motivation, employee-engagement, people-analytics]

- id: competency-framework
  term: "Competency framework"
  definition: "A structured description of the skills, knowledge and behaviours an organization expects in different roles and at different levels, used for recruitment, appraisal, training and promotion."
  simple: "A list of the abilities and behaviours a business wants from people in each kind of job, used to hire, train and judge them fairly."
  technical: "Each competency is defined with behaviours that can be observed at each level, which makes judgements more consistent and links the HR processes together. Frameworks can become generic and bureaucratic, fall behind roles that are changing, and reward conformity if they describe behaviours too narrowly."
  example: "A fictional retail bank's framework defines customer focus at three levels, from solving a customer's problem at the first contact, for new staff, to redesigning a service around customer feedback, for managers."
  misconceptions:
    - claim: "A competency framework is the same as a job description."
      correction: "A job description lists the tasks of one role; a competency framework describes the behaviours and skills expected across many roles."
  category: people
  qualifications: [undergraduate, professional]
  provenance: enrichment
  related: [job-description, person-specification, appraisal, recruitment, talent-management]

- id: diversity-equity-and-inclusion
  term: "Diversity, equity and inclusion (DEI)"
  aliases: ["DEI", "Diversity and inclusion"]
  definition: "Policies and practices that aim to build a workforce of people from different backgrounds (diversity), to give them fair access to opportunities (equity), and to make them feel valued and able to contribute (inclusion)."
  simple: "Making sure a business hires people from many different backgrounds, treats them all fairly, and makes everyone feel they belong and can speak up."
  technical: "Practices include fair recruitment and promotion processes, pay audits, flexible working and inclusive leadership. The case for DEI combines fairness with business arguments, such as a wider pool of talent and better decisions, though the effect on performance is debated and depends on inclusion, not on numbers alone. Equality law sets minimum standards that vary between countries."
  example: "A fictional engineering firm removes names and schools from application forms at the first stage of shortlisting, and the share of women invited to interview rises."
  misconceptions:
    - claim: "Diversity on its own improves performance."
      correction: "Without inclusion, a diverse team can be held back by poor communication and conflict; the benefits depend on how people are managed."
  category: people
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [recruitment, organizational-culture, business-ethics, human-resource-management]

- id: emotional-intelligence
  term: "Emotional intelligence (EI)"
  aliases: ["EI", "Emotional quotient", "EQ"]
  definition: "The ability to recognize, understand and manage one's own emotions, and to recognize and influence the emotions of others."
  simple: "Being good at understanding your own feelings and other people's, and using that understanding to handle relationships well."
  technical: "Models usually include self-awareness, self-regulation, motivation, empathy and social skill. It is linked with leadership, teamwork and customer service. Researchers debate whether it is a distinct ability or overlaps with personality and general intelligence, and how well it can be measured."
  example: "A fictional head nurse notices a colleague's frustration after a difficult shift and listens before discussing the mistake that was made, and the conversation leads to a change in the rota rather than a complaint."
  misconceptions:
    - claim: "Emotional intelligence means being nice to everyone."
      correction: "It means understanding and managing emotions, which can include giving difficult feedback calmly and firmly."
  category: people
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [leadership, situational-leadership, teamwork, transformational-leadership]

- id: employee-engagement
  term: "Employee engagement"
  aliases: ["Staff engagement"]
  definition: "The degree to which employees are committed to their organization and its goals, feel involved in their work, and give effort beyond the minimum required."
  simple: "How much people care about their work and their organization, and how much extra effort they are willing to give without being asked."
  technical: "Engagement draws on theories of motivation, especially self-determination theory and Herzberg's motivators, and is usually measured by surveys of commitment, involvement and willingness to recommend the employer. Organizations track it because they expect it to support productivity, retention and customer satisfaction, though such links are hard to prove and can run both ways. It is raised by meaningful work, recognition, development, good line managers and a voice in decisions, not by surveys alone."
  example: "A fictional call centre with high labour turnover lets its teams design their own rotas and acts on their survey comments; over the following year its engagement scores rise and its turnover falls."
  misconceptions:
    - claim: "Engaged employees are simply happy employees."
      correction: "Happiness is part of it, but engagement means commitment and extra effort; a contented employee can still be disengaged from the organization's goals."
  category: people
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [motivation, empowerment, labour-turnover, psychological-contract, people-analytics]

- id: kotters-eight-step-model
  term: "Kotter's eight-step change model"
  aliases: ["Kotter's eight steps", "Eight steps for leading change"]
  definition: "A model for leading organizational change through eight steps in sequence, from creating a sense of urgency to anchoring the change in the culture."
  simple: "A step-by-step plan for leading a big change at work: make people see why it is urgent, build a team to lead it, share a clear vision, clear the obstacles, win early successes, keep going and make it stick."
  technical: "Associated with John Kotter, the steps fall into three phases: creating a climate for change (urgency, a guiding coalition, a vision and a strategy), engaging and enabling the organization (communicating the vision, removing obstacles, short-term wins) and implementing and sustaining it (building on the gains and anchoring the change in the culture). It is practical and widely used, but it is linear and led from the top, which fits poorly with continuous or emergent change."
  example: "A fictional hospital introducing electronic patient records starts by sharing data on errors caused by paper notes (urgency), forms a group of respected doctors and nurses to lead the change (coalition), and pilots the system in one ward to show early results (short-term wins)."
  misconceptions:
    - claim: "The eight steps can be taken in any order."
      correction: "Each step builds on the ones before; skipping the urgency or the coalition is a common reason for change to fail."
  category: theory
  qualifications: [undergraduate, mba, professional]
  frameworks: [kotter-eight-steps]
  provenance: enrichment
  related: [change-management, resistance-to-change, lewins-change-model, leadership, transformational-leadership]

- id: learning-organization
  term: "Learning organization"
  definition: "An organization that continually builds its capacity to learn, adapt and change, by encouraging its members to question assumptions, share knowledge and learn from experience."
  simple: "A business that keeps learning and improving, where people are encouraged to share what they know, try new ideas and learn from mistakes."
  technical: "Associated with Peter Senge, the idea rests on five disciplines: personal mastery, mental models, shared vision, team learning and systems thinking. It connects with kaizen, with double-loop learning (questioning goals and assumptions, not only methods) and with knowledge management. It is easier to describe than to build, because it depends on culture, trust and time to reflect."
  example: "After every project, a fictional architecture practice holds a short review of what to keep and what to change, records the lessons in a shared library, and starts each new project by reading the relevant ones."
  misconceptions:
    - claim: "A learning organization is one that spends a lot on training courses."
      correction: "Training helps, but the idea is about how the organization learns from its own experience and changes its assumptions."
  category: theory
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [organizational-culture, kaizen, change-management, research-and-development]

- id: lewins-change-model
  term: "Lewin's change model"
  aliases: ["Unfreeze, change, refreeze", "Lewin's three-stage model"]
  definition: "A model of organizational change in three stages: unfreezing the current state, moving to a new one, and refreezing so that the new way becomes stable."
  simple: "A simple way to think about change: first get people ready to let go of the old way (unfreeze), then make the change, then make the new way normal so that it sticks (refreeze)."
  technical: "Kurt Lewin linked the model to force field analysis: unfreezing works by strengthening the driving forces or, often more effectively, weakening the restraining forces. Refreezing aligns systems, rewards and culture with the new behaviour. Critics say it treats organizations as still between changes, which suits fast-moving environments poorly; supporters reply that it describes any single change well."
  example: "A fictional bakery chain moving to digital ordering explains the waste caused by paper orders (unfreeze), trains staff branch by branch (change), then removes the paper forms and puts the new system into every new starter's induction (refreeze)."
  misconceptions:
    - claim: "Refreezing means the organization never changes again."
      correction: "It means making the new way stable enough to last, until the next change is needed."
  category: theory
  qualifications: [undergraduate, mba, professional]
  frameworks: [lewin-change-model]
  provenance: enrichment
  related: [change-management, force-field-analysis, resistance-to-change, kotters-eight-step-model]

- id: people-analytics
  term: "People analytics"
  aliases: ["HR analytics", "Workforce analytics"]
  definition: "The use of data about employees and the workforce, analysed statistically, to inform decisions about recruitment, retention, performance, pay and organization."
  simple: "Using data about staff, such as who leaves, who performs well and why, to make better decisions about people."
  technical: "People analytics ranges from describing the workforce, such as turnover by team, to predicting it, such as which employees are likely to leave. It can improve decisions and expose bias, but it raises questions of privacy, consent, data quality and algorithmic bias, which links it to the guide's discussion of employee monitoring and digital Taylorism."
  example: "A fictional supermarket's analysis shows that store staff who receive no feedback in their first month leave within six months far more often than others, so it introduces a structured check-in for new starters."
  misconceptions:
    - claim: "People analytics replaces managers' judgement."
      correction: "It informs judgement; models can be wrong or biased, and decisions about people still need human accountability."
  category: people
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [data-analytics, labour-turnover, employee-monitoring, algorithmic-bias, digital-taylorism]

- id: psychological-contract
  term: "Psychological contract"
  definition: "The unwritten expectations and beliefs that an employee and an employer hold about what each owes the other, beyond the formal contract of employment."
  simple: "The unspoken deal between workers and their employer: what each side expects of the other, such as loyalty and effort in return for fair treatment, development and security."
  technical: "The concept distinguishes transactional contracts, based on pay for work over the short term, from relational ones, based on loyalty and development over the long term. When employees believe the employer has broken its side, for example by not keeping promises of promotion, commitment, effort and trust fall and turnover rises, even though the written contract is honoured."
  example: "Staff at a fictional design studio expect the flexible hours they have always had; when a new manager imposes fixed hours without discussion, several senior designers leave, although their contracts never mentioned flexibility."
  misconceptions:
    - claim: "If the written contract is kept, the employer has done its part."
      correction: "Employees also hold unwritten expectations, and breaking them damages trust and effort even when the formal contract is honoured."
  category: people
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [motivation, employee-engagement, industrial-relations, resistance-to-change, equity-theory]

- id: raci-matrix
  term: "RACI matrix"
  aliases: ["RACI chart", "Responsibility assignment matrix"]
  definition: "A table that sets out, for each task or decision in a project, who is responsible for doing it, who is accountable for it, who must be consulted and who must be informed."
  simple: "A grid that makes clear who does each job, who has the final say, who should be asked first and who just needs to be told."
  technical: "The usual rules are exactly one A for each task and at least one R; too many Cs slow decisions, and too few Is leave people surprised. It clarifies roles in matrix structures, projects and change programmes, where unclear responsibility causes delay and conflict. Some versions add further roles, such as one for those who support the work."
  example: "For a fictional café's new branch, the owner is accountable for choosing the site, the operations manager is responsible for the search, the finance officer and the marketing lead are consulted, and the head barista is informed."
  misconceptions:
    - claim: "Responsible and accountable mean the same."
      correction: "The responsible person does the work; the accountable person owns the result and signs it off, and there is only one for each task."
  category: tool
  qualifications: [undergraduate, mba, professional]
  frameworks: [raci-matrix]
  provenance: enrichment
  related: [delegation, matrix-structure, project-based-organization, chain-of-command]

- id: servant-leadership
  term: "Servant leadership"
  definition: "A leadership approach in which the leader's first priority is to serve the needs of followers, helping them grow and perform, so that the organization succeeds through them."
  simple: "Leading by putting your team first: making sure they have what they need, removing obstacles and helping them develop."
  technical: "The idea, associated with Robert Greenleaf, stresses listening, empathy, stewardship and the growth of people and community. It fits knowledge work and service organizations, and links to self-determination theory, but critics say it can be slow, can look weak in a crisis, and needs followers and a culture that respond to it."
  example: "The fictional manager of a software team spends most of her day clearing the problems that block her developers, such as unclear requirements, and lets the team decide how to do the work."
  misconceptions:
    - claim: "Servant leaders do whatever their team wants."
      correction: "They serve the team's needs and growth towards the organization's goals, which can mean making unpopular decisions."
  category: people
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [leadership, democratic-leadership, laissez-faire-leadership, transformational-leadership, empowerment]

- id: succession-planning
  term: "Succession planning"
  definition: "Identifying and developing people who could take over key roles, so that an organization can fill them smoothly when the people holding them leave, retire or are promoted."
  simple: "Making sure someone is ready to step in when an important person leaves, by spotting and training possible replacements in advance."
  technical: "Succession planning covers the board and the chief executive as well as other critical roles. It reduces the risk of disruption and of expensive outside hiring, helps to keep staff by showing them a career path, and is a responsibility of good governance. It fails when plans name successors without developing them, or simply reproduce the backgrounds of the current leaders."
  example: "A fictional family-owned hotel group begins five years before the founder's planned retirement to move two internal candidates through operations, finance and sales."
  misconceptions:
    - claim: "Succession planning is only needed for the chief executive."
      correction: "Any role whose sudden loss would disrupt the business, such as a key engineer or buyer, needs a plan."
  category: people
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [talent-management, human-resource-planning, board-of-directors, exit-strategy]

- id: talent-management
  term: "Talent management"
  definition: "The connected set of HR activities through which an organization attracts, develops, deploys and keeps the people it needs, especially for critical and leadership roles."
  simple: "How an organization finds good people, helps them grow and keeps them, especially for the most important jobs."
  technical: "Talent management links workforce planning, recruitment, performance management, development, succession planning and reward. Approaches differ between an exclusive focus on employees judged to have high potential and an inclusive view that develops everyone. Critics warn that labelling a small group as the talent can demotivate the rest and can reflect bias."
  example: "A fictional engineering consultancy identifies the twelve roles it could least afford to lose, gives each a development plan for two internal successors, and reviews their progress twice a year."
  misconceptions:
    - claim: "Talent management is the same as recruitment."
      correction: "Recruitment is one part; talent management also covers developing, deploying and keeping people."
  category: people
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [human-resource-planning, recruitment, succession-planning, appraisal, people-analytics]

- id: transactional-leadership
  term: "Transactional leadership"
  definition: "A leadership approach based on exchanges between the leader and followers: clear goals, rewards for meeting them, and corrective action when they are missed."
  simple: "Leading by making a clear deal: do this and you will get that. People know what is expected, and are rewarded or corrected according to their results."
  technical: "Transactional leadership relies on rewards that depend on results and on stepping in when performance falls short. It gives clarity and works well for stable, measurable tasks, which links it to extrinsic motivation and scientific management, but it seldom inspires effort beyond the deal or adapts well to change. Most effective leaders use both transactional and transformational behaviours."
  example: "A fictional sales manager sets each sales representative a monthly target with a bonus for meeting it, and reviews anyone who falls short two months running."
  misconceptions:
    - claim: "Transactional leadership is always inferior to transformational leadership."
      correction: "For routine, measurable work, clear goals and rewards can be exactly what a team needs."
  category: people
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [transformational-leadership, autocratic-leadership, extrinsic-motivation, performance-related-pay]

- id: transformational-leadership
  term: "Transformational leadership"
  definition: "A leadership approach in which leaders inspire followers to go beyond their own interests for the sake of the group, through a compelling vision, personal example, intellectual challenge and attention to each person's development."
  simple: "Leading by inspiring people with a big idea of what could be achieved, setting an example and helping each person grow, so that they do more than they thought they could."
  technical: "Its components are often given as idealized influence, inspirational motivation, intellectual stimulation and individualized consideration. It contrasts with transactional leadership, which exchanges rewards for performance. It suits change and uncertainty, but it depends on the leader's integrity, can create dependence on one person, and the charisma it relies on can be misused."
  example: "The fictional new head of a struggling school sets out a vision of every student leaving with a skill they are proud of, teaches lessons herself, and gives each teacher a project to lead."
  misconceptions:
    - claim: "Transformational leaders do not need management skills."
      correction: "Inspiration without planning and control leaves change unfinished; effective leaders combine vision with management."
  category: people
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [leadership, transactional-leadership, democratic-leadership, change-management, servant-leadership]

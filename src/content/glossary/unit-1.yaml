# Glossary: unit 1, Introduction to business management (subtopics 1.1 to 1.6).
# Definitions, context and examples are the platform's own wording. Scope and
# terminology were checked against the guide (pp. 23 to 24) and the TSM's
# glossary and social enterprise guidance; the supplied coursebook chapters
# 1.1 to 1.5 were used only to check coverage. Terms for 1.5 that already
# exist in growth.yaml are reused, not repeated. Toolkit terms are in
# toolkit.yaml.

# ---------- 1.1 What is a business? ----------

- id: business
  term: Business
  definition: "An organization that brings together resources such as people, materials and equipment to provide goods or services for customers, usually in return for payment."
  context: "The term covers organizations of every size and purpose, from a one-person food stall to a multinational, and includes social enterprises as well as profit-seeking firms. What they share is the process: resources go in, and something customers value comes out. In the course, a business is analysed through its four functions and judged by how well it meets its objectives and its stakeholders' needs."
  example: "A neighbourhood bakery buys flour, pays two bakers and rents an oven to sell bread to local cafés: it organizes resources to supply a product that customers pay for."
  topics: []
  subtopics: ['1.1']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [goods-and-services, factors-of-production, transformation-process, business-functions, needs-and-wants]

- id: goods-and-services
  term: Goods and services
  aliases: [Goods, Services]
  definition: "The two kinds of output a business provides. Goods are physical products that can be stored and owned, such as shoes; services are intangible activities carried out for a customer, such as a haircut."
  context: "Most businesses sell a mix: a restaurant sells food (a good) and table service (a service). The difference matters for operations and marketing, because services usually cannot be stored, are produced and consumed at the same moment and depend heavily on the people who deliver them. The tertiary sector is the part of the economy that provides services."
  example: "A bicycle maker sells bicycles (goods) and also offers repairs and servicing plans (services), which bring in revenue long after the original sale."
  topics: []
  subtopics: ['1.1', '5.1']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [business, tertiary-sector, secondary-sector, needs-and-wants]

- id: needs-and-wants
  term: Needs and wants
  definition: "Needs are what people must have to survive and live safely, such as food, water, shelter and health care; wants are what people would like to have beyond those, such as a holiday or the latest phone."
  context: "Businesses exist to meet both, and the line between them shifts with income, culture and time: internet access was once a luxury and is now close to a need for work and study. Wants are unlimited while resources are scarce, which is why every choice has an opportunity cost. At HL, paper 3 begins with the human need that a social enterprise sets out to meet."
  example: "A clinic in a remote area meets a need for health care; a spa resort in the same region meets a want for relaxation and luxury."
  topics: []
  subtopics: ['1.1']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [business, opportunity-cost, social-enterprise, goods-and-services]

- id: factors-of-production
  term: Factors of production
  definition: "The resources a business uses to produce goods and services: land (natural resources), labour (human effort), capital (man-made aids to production such as machinery and buildings) and enterprise (the initiative and risk-taking that combines the other three)."
  context: "They are the inputs of the transformation process, and each earns a reward: rent for land, wages for labour, interest for capital and profit for enterprise. The mix varies by sector: a farm relies heavily on land, a software firm on skilled labour and ideas. Each factor is limited in supply, so using it for one purpose has an opportunity cost."
  example: "A furniture workshop uses timber and a site (land), carpenters (labour), saws and a van (capital), and the owner's decision to start making garden chairs (enterprise)."
  usage:
    general: "In everyday business talk, capital usually means the money invested in a business, and an enterprise often means a business itself."
    syllabus: "As a factor of production, capital means man-made resources used to produce other goods, such as tools and machines, and enterprise means the entrepreneur's skill and willingness to take risks."
  topics: []
  subtopics: ['1.1']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [transformation-process, entrepreneurship, business, opportunity-cost]

- id: transformation-process
  term: Transformation process
  definition: "The sequence of activities through which a business changes its inputs, the factors of production, into outputs of goods and services that customers value more highly than the inputs themselves."
  context: "Seeing every business as inputs, process and outputs makes very different organizations comparable: a mine, a factory and a bank all transform resources. The process is where value is added, and also where waste, by-products and pollution arise, which links it to sustainability. Operations management (unit 5) is the study of running this process well."
  example: "A juice bar turns fruit, staff time and blenders into fresh drinks served in minutes, and its peel is collected by a nearby farm for compost."
  topics: []
  subtopics: ['1.1', '5.1']
  level: SL/HL
  category: operations
  provenance: subject-knowledge
  related: [factors-of-production, added-value, goods-and-services, business]

- id: added-value
  term: Added value
  aliases: [Value added, Adding value]
  definition: "The difference between the price a business receives for its output and the cost of the materials and services it bought in to make it."
  context: "Added value is not the same as profit: wages, rent and other costs still have to be paid out of it. A business can add value through design, branding, convenience, quality or service, which let it charge more than the cost of its bought-in inputs. Comparing added value at each stage of a supply chain shows where value is created."
  example: "A café buys beans, milk and a cup for $1.20 per drink and sells each latte for $4.00, so it adds $2.80 of value per drink, out of which staff, rent and other costs must be paid."
  formula: "Added value = selling price − cost of bought-in materials and services"
  topics: []
  subtopics: ['1.1', '5.1']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [transformation-process, business, goods-and-services]

- id: business-functions
  term: Business functions
  aliases: [Functional areas]
  definition: "The four main areas of activity inside a business: human resource management, finance and accounts, marketing, and operations management."
  context: "Each function makes its own decisions, from hiring to pricing to production methods, but they depend on one another: a marketing plan needs finance, staff and the capacity to produce. Units 2 to 5 of the course follow these functions, and a strong answer shows how a decision in one function affects the others. In a small business one person may carry out all four."
  example: "When a toy maker launches a new product, marketing researches demand, operations plans production, finance budgets the launch and human resources recruits extra staff for the busy season."
  topics: []
  subtopics: ['1.1']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [business, transformation-process, management]

- id: primary-sector
  term: Primary sector
  definition: "The part of the economy that takes raw materials directly from nature, through activities such as farming, fishing, forestry, mining and drilling for oil and gas."
  context: "Primary sector output is usually sold as raw material to the secondary sector. It employs a large share of workers in many less developed economies and a small share in developed ones. It is exposed to the weather, to the running down of resources and to swings in commodity prices, and its environmental impact is under growing scrutiny."
  example: "A coffee plantation that grows and picks beans, and a quarry that digs stone, both operate in the primary sector."
  topics: []
  subtopics: ['1.1']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [secondary-sector, tertiary-sector, quaternary-sector, sectoral-change]

- id: secondary-sector
  term: Secondary sector
  definition: "The part of the economy that manufactures, processes or builds, turning raw materials and components into finished goods and structures."
  context: "It includes factories, food processing, energy generation and construction. As economies develop, the secondary sector often grows first and later shrinks as a share of jobs, partly because automation raises output per worker and partly because production moves to lower-cost countries. Many businesses span sectors, such as a chocolate maker that also runs its own shops."
  example: "A car plant assembling vehicles from steel, glass and electronic parts, and a building firm putting up houses, are in the secondary sector."
  topics: []
  subtopics: ['1.1']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [primary-sector, tertiary-sector, quaternary-sector, sectoral-change]

- id: tertiary-sector
  term: Tertiary sector
  definition: "The part of the economy that provides services to consumers and to other businesses, such as shops, transport, insurance, tourism and hairdressing."
  context: "In most developed economies it employs the largest share of the workforce and produces most of the output. Because services are intangible, success often depends on staff, convenience and the customer's experience. The quaternary sector is sometimes treated as part of the tertiary sector."
  example: "A hotel, a bus company and a bank branch all belong to the tertiary sector."
  topics: []
  subtopics: ['1.1']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [quaternary-sector, secondary-sector, goods-and-services, sectoral-change]

- id: quaternary-sector
  term: Quaternary sector
  definition: "The part of the economy in which businesses create, process and sell knowledge and information, for example in research, software, data analysis and consultancy."
  context: "It is often treated as a subdivision of the tertiary sector, separated out because knowledge-based work has grown so quickly. Its main inputs are skilled people and ideas rather than land or machinery, so education and innovation drive it. Its firms often depend on intellectual property and can serve customers anywhere online."
  example: "A consultancy that analyses shopping data for retailers, and a laboratory developing new medicines, are in the quaternary sector."
  topics: []
  subtopics: ['1.1']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [tertiary-sector, sectoral-change, primary-sector, secondary-sector]

- id: sectoral-change
  term: Sectoral change
  aliases: [Structural change]
  definition: "A shift over time in the share of an economy's output and employment that each sector accounts for."
  context: "The usual pattern as an economy develops is a move from the primary sector to the secondary sector, then towards the tertiary and quaternary sectors; the decline of manufacturing in this process is called deindustrialization. Sectoral change creates opportunities for new businesses, threatens others and changes the skills employers need. Rising incomes, technology and globalization drive it."
  example: "As a farming region attracts factories and later call centres and software firms, many workers move from agriculture into manufacturing and then into services, and local businesses must retrain staff or change what they sell."
  topics: []
  subtopics: ['1.1']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [primary-sector, secondary-sector, tertiary-sector, quaternary-sector, globalization]

- id: entrepreneurship
  term: Entrepreneurship
  aliases: [Entrepreneur]
  definition: "Spotting a business opportunity and organizing the resources to pursue it, while accepting the risk that it may fail; the person who does this is an entrepreneur."
  context: "Entrepreneurship is the factor of production that brings land, labour and capital together. Entrepreneurs are often driven by profit, independence, a passion or an unmet need, and typically show initiative, creativity, resilience and a willingness to take calculated risks. They matter to the economy because new ventures create jobs, competition and innovation."
  example: "After struggling to find affordable school uniforms, a parent opens a stall selling good-quality second-hand uniforms, investing her savings and taking the risk that families will buy."
  topics: []
  subtopics: ['1.1']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [intrapreneurship, social-entrepreneur, start-up, factors-of-production]

- id: intrapreneurship
  term: Intrapreneurship
  aliases: [Intrapreneur]
  definition: "Entrepreneurial behaviour by an employee inside an existing organization, such as developing a new product or process with the organization's resources and backing."
  context: "The intrapreneur supplies the initiative and creative risk, while the organization usually carries the financial risk and owns the result. Businesses encourage intrapreneurship to stay innovative and to keep talented staff who might otherwise leave to start their own ventures. It needs a culture that tolerates failure and gives employees time and freedom."
  example: "An engineer at a kitchen-appliance maker proposes, and then leads, a project to design a quieter blender, using company funds and a small team."
  topics: []
  subtopics: ['1.1']
  level: SL/HL
  category: people
  provenance: subject-knowledge
  related: [entrepreneurship, start-up, business]

- id: social-entrepreneur
  term: Social entrepreneur
  aliases: [Social entrepreneurship]
  definition: "An entrepreneur whose main aim is to solve a social or environmental problem, using business methods and trading income rather than relying only on donations."
  context: "Like any entrepreneur, a social entrepreneur spots an opportunity and takes risks, but success is judged mainly by the impact on people or the planet, with profit treated as a means rather than the goal. Social entrepreneurs usually set up social enterprises, and the HL paper 3 asks students to explain the challenges a social entrepreneur faces and to recommend a way forward."
  example: "A former nurse starts a business that trains unemployed young people as home-care assistants and sells care services to families, putting most of the profit into more training places."
  topics: []
  subtopics: ['1.1', '1.2']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [entrepreneurship, social-enterprise, for-profit-social-enterprise, needs-and-wants]

- id: start-up
  term: Start-up
  aliases: [Startup, New venture]
  definition: "A newly established business in its early stage, usually small, built on a new idea or a new way of serving a market, with an uncertain future."
  context: "Start-ups face typical challenges: raising finance, winning customers from established rivals, managing cash flow while sales are low, meeting legal requirements and running every function with limited experience. They also have opportunities, such as low-cost digital tools, gaps in the market and the freedom to change direction quickly. A business plan helps the founder test the idea and persuade lenders and investors."
  example: "Two graduates launch an app that matches local tutors with students; in the first year they work from home, fund the business from savings and a small loan, and change their pricing twice."
  topics: []
  subtopics: ['1.1']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [entrepreneurship, business-plan, sole-trader, small-and-medium-sized-enterprises]

- id: opportunity-cost
  term: Opportunity cost
  definition: "What is given up when a choice is made, measured by the value of the best alternative that was not chosen."
  context: "Because resources such as money, time and land are limited, every decision has an opportunity cost, even when no money changes hands. It is the single best option forgone, not the total of all the options rejected. Weighing it helps managers judge whether a use of resources is really worthwhile."
  example: "A business with $50,000 to invest buys a delivery van instead of a new website; if the website was its next best option, the sales the website would have brought are the opportunity cost of the van."
  topics: []
  subtopics: ['1.1']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [factors-of-production, needs-and-wants, business]

# ---------- 1.2 Types of business entities ----------

- id: private-sector
  term: Private sector
  definition: "All the organizations in an economy that are owned by individuals, families, investors or members rather than by the state."
  context: "It includes sole traders, partnerships, companies and cooperatives, and also non-profit organizations such as charities and NGOs. Most private sector businesses aim to make a profit, but social enterprises in the sector put a social purpose first. The balance between the private and public sectors differs between countries and shifts with privatization and nationalization."
  example: "A family-owned hotel, a publicly held car maker and a cooperative village shop are all in the private sector, even though their aims differ."
  usage:
    general: "Some writers treat charities, NGOs and other non-profit groups as a separate 'third sector' or voluntary sector."
    syllabus: "The course divides the economy by ownership into the private and public sectors, so an organization not owned or controlled by the government is in the private sector."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [public-sector, privatization, sole-trader, privately-held-company, private-sector-company]

- id: public-sector
  term: Public sector
  definition: "Organizations that are owned, funded or run by central or local government, such as state schools, public hospitals, the armed forces and state-owned companies."
  context: "Public sector organizations usually aim to provide essential services for everyone, support social goals and protect strategic national interests, rather than to maximize profit, and many are funded through taxation. Some trade like businesses and aim to cover their costs or make a surplus, which in the course makes them public sector companies. Critics argue that weak competition can make them less efficient; supporters stress fair access to essential services."
  example: "A government-run postal service that must deliver to remote villages at the same price as to cities is in the public sector."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [private-sector, public-sector-company, privatization]

- id: privatization
  term: Privatization
  definition: "Moving an organization or activity out of government ownership or control and into private hands, for example by selling a state-owned company to investors or contracting out a public service."
  context: "Governments privatize to raise money, to improve efficiency through competition and the profit motive, and to ease the burden on public finances. Opponents worry about job losses, higher prices and poorer service in areas that are unprofitable to serve. The opposite process, in which a government takes a private business into public ownership, is nationalization."
  example: "A government sells its national airline to private investors, who then cut unprofitable routes and invest in new aircraft."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [public-sector, private-sector, public-sector-company, publicly-held-company]

- id: sole-trader
  term: Sole trader
  aliases: [Sole proprietor, Sole proprietorship]
  definition: "A business owned by one person, who takes all the decisions, keeps all the profit and has unlimited liability for its debts."
  context: "It is the simplest form of business: quick and cheap to set up, with few legal formalities and the owner's affairs kept largely private. The owner may employ staff but carries all the risk. Its limits are finance (usually personal savings and small loans), long hours, nobody to share decisions with and no continuity, because the business has no legal existence separate from its owner."
  example: "A self-employed plumber who works alone, owns her tools and van and is personally responsible for any unpaid bills is a sole trader."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [partnership, unlimited-liability, privately-held-company, start-up]

- id: partnership
  term: Partnership
  definition: "A business owned by two or more people who share its capital, decisions, workload and profits, usually with unlimited liability."
  context: "Partners bring more finance, skills and ideas than a sole trader can, and share the pressure of running the business, which is why the form is common in professions such as law, accountancy and medicine. The drawbacks are possible disagreements, slower decisions, profits split several ways and, usually, unlimited liability, so a partner can be liable for debts that another partner ran up. A deed of partnership sets out the terms, and some countries offer forms of partnership with limited liability."
  example: "Two architects form a partnership: one brings design skills and the other brings client contacts and savings, and they agree to split profits equally."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [sole-trader, deed-of-partnership, unlimited-liability, limited-liability]

- id: deed-of-partnership
  term: Deed of partnership
  aliases: [Partnership agreement]
  definition: "A legal agreement between partners that sets out how their partnership will run, including each partner's capital, share of profits, role and say in decisions, and what happens if a partner leaves or dies."
  context: "Without one, partners may fall out over money or control, and the law of the country decides by default, often splitting profits equally whatever each partner contributed. A clear deed reduces conflict and makes it easier to bring in new partners or wind the partnership up. It does not remove the partners' unlimited liability to outside creditors."
  example: "Three partners in a dental practice agree in their deed that profits will be shared in proportion to the capital each invested, and that a partner who wants to leave must give six months' notice."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [partnership, unlimited-liability]

- id: unlimited-liability
  term: Unlimited liability
  definition: "A legal position in which the owners of a business are personally responsible for all its debts, so they may have to use their own savings or sell personal possessions to pay them."
  context: "It applies to sole traders and most partnerships, because these businesses have no legal identity separate from their owners. It makes owners cautious, can deter people from starting or expanding a business, and lenders may ask for personal guarantees. It is the key difference from companies, whose shareholders have limited liability."
  example: "When a sole trader's shop fails owing suppliers $40,000 more than the business is worth, the owner may have to sell his car to pay them."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [limited-liability, sole-trader, partnership, company]

- id: limited-liability
  term: Limited liability
  definition: "A legal protection under which the owners of a company can lose only the money they put into it, and cannot be made to pay its debts out of their own pockets."
  context: "Limited liability exists because a company is a legal person separate from its shareholders. It encourages people to invest and take risks, which makes it possible to raise large amounts of capital. In return, companies face more regulation and must disclose information, and lenders to small companies may still ask the owners for personal guarantees."
  example: "An investor who bought $5,000 of shares in a company that later collapses loses the $5,000, but the company's creditors cannot claim her house or savings."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [unlimited-liability, company, shareholder, privately-held-company, publicly-held-company]

- id: company
  term: Company
  aliases: [Corporation, Incorporated business]
  definition: "A business that has been incorporated, that is, registered as a legal person separate from its owners, so it can own property, make contracts, borrow, sue and be sued in its own name."
  context: "A company is owned by shareholders and run by directors and managers whom the shareholders appoint. Because it is a separate legal entity, its owners have limited liability and the company carries on if they die or sell their shares. In the course, companies are either privately held or publicly held, depending on whether their shares can be offered to the public."
  example: "When a sole trader's catering business becomes a company, contracts are signed in the company's name and the former owner becomes a shareholder and director."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [privately-held-company, publicly-held-company, shareholder, limited-liability]

- id: privately-held-company
  term: Privately held company
  aliases: [Private limited company, Private company]
  definition: "A company whose shares are owned privately, often by a family, its founders or a small group of investors, and cannot be offered to the general public or traded on a stock exchange."
  context: "It gives owners limited liability and continuity while letting them decide who may become an owner, since shares usually cannot be sold without the agreement of the other shareholders. It can raise more capital than a sole trader or partnership, but less than a publicly held company. It must be registered and usually has to file accounts, so it has less privacy than an unincorporated business."
  example: "A family furniture maker is a privately held company: four relatives hold all the shares and have agreed that none may sell to an outsider without the others' consent."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [publicly-held-company, company, limited-liability, shareholder]

- id: publicly-held-company
  term: Publicly held company
  aliases: [Public limited company]
  definition: "A company whose shares can be offered to the general public and are bought and sold on a stock exchange."
  context: "Selling shares to the public can raise very large sums for growth, and shareholders have limited liability and can sell their shares easily. In return, the company must publish detailed audited accounts and follow stock exchange rules, and it may face pressure for short-term results and the risk of a takeover, because anyone can buy its shares. Publicly held does not mean owned by the government: these companies are in the private sector."
  example: "A growing chain of gyms lists its shares on a stock exchange to fund new sites; from then on anyone can buy its shares, and it must publish its results."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [privately-held-company, divorce-of-ownership-and-control, shareholder, limited-liability, takeover]

- id: shareholder
  term: Shareholder
  aliases: [Stockholder]
  definition: "An owner of a company, holding one or more of the shares into which its ownership is divided."
  context: "Shareholders may receive dividends from profits, gain if the share price rises and usually vote on major decisions such as electing directors; their liability is limited to what they invested. A shareholder is one type of stakeholder, and confusing the two words is a common error, because most stakeholders own nothing. Owners, including shareholders, are usually counted as internal stakeholders."
  example: "A pension fund that holds shares in a publicly held telecoms company receives dividends and votes at the company's annual general meeting."
  topics: []
  subtopics: ['1.2', '1.4']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [company, stakeholder, shareholder-value, limited-liability, internal-stakeholder]

- id: divorce-of-ownership-and-control
  term: Divorce of ownership and control
  aliases: [Separation of ownership and control]
  definition: "The situation in a large company where the shareholders own the business but professional directors and managers decide how it is run."
  context: "It arises when ownership is spread across many shareholders, none of whom runs the business. Managers may then pursue their own goals, such as higher pay, status or a bigger empire, rather than the owners' interests, which is a source of stakeholder conflict. Companies try to align the two through performance-related pay, share schemes for managers and shareholder votes."
  example: "In a publicly held retailer owned by thousands of small investors, the chief executive pushes for a costly acquisition that would raise her profile, while many shareholders would prefer higher dividends."
  topics: []
  subtopics: ['1.2', '1.4']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [publicly-held-company, shareholder, stakeholder-conflict, shareholder-value]

- id: social-enterprise
  term: Social enterprise
  definition: "An organization that trades in order to pursue a social or environmental purpose, earning most of its income from selling goods or services and using most of any surplus to further that purpose."
  context: "Social enterprises sit between traditional businesses and charities: unlike a charity, they rely mainly on trading income rather than donations, and unlike a traditional business, their purpose comes before returns to owners, often judged by the triple bottom line. The guide divides them into for-profit social enterprises (private sector companies, public sector companies and cooperatives) and non-profit social enterprises, of which it names NGOs. A business is not a social enterprise just because it practises CSR."
  example: "A café that trains and employs young people leaving care, funded by its food and drink sales, is a social enterprise: its main measure of success is how many trainees go on to steady jobs."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [for-profit-social-enterprise, non-profit-social-enterprise, charity, triple-bottom-line, social-entrepreneur, corporate-social-responsibility]

- id: for-profit-social-enterprise
  term: For-profit social enterprise
  definition: "A social enterprise that aims to make a profit from trading, but uses that profit mainly to serve its social or environmental purpose rather than to reward its owners."
  context: "Making a profit keeps the enterprise financially independent and lets it widen its impact; owners may receive some return, but most of the surplus is put back into the mission. The guide lists three forms: private sector companies, public sector companies and cooperatives. A typical challenge is earning enough to survive and grow without drifting away from the mission."
  example: "A company that makes affordable solar lamps for homes without electricity sells them at a modest profit and reinvests most of it in reaching more villages."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [social-enterprise, private-sector-company, public-sector-company, cooperative, non-profit-social-enterprise]

- id: private-sector-company
  term: Private sector company
  definition: "In the guide's classification, a company owned by private individuals or organizations that operates as a for-profit social enterprise: it trades for a profit, but its main purpose is social or environmental and most of its profit goes back into that purpose."
  context: "It has the legal features of any company, such as limited liability and a separate legal identity, but its objectives put the mission first, and some countries offer special company forms that tie a company's assets or profits to its purpose. Do not confuse it with a privately held company, which describes who may own the shares, not what the company is for. Its challenge is to stay profitable without losing sight of its mission."
  example: "A privately owned recycling company that employs people with past convictions and reinvests most of its profit in training them is a private sector company in the guide's sense."
  usage:
    general: "Any company owned privately rather than by the state, whatever its aims."
    syllabus: "The guide lists private sector companies as a type of for-profit social enterprise, so the term means a privately owned company run mainly for a social or environmental purpose."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [for-profit-social-enterprise, social-enterprise, privately-held-company, public-sector-company, company]

- id: public-sector-company
  term: Public sector company
  aliases: [State-owned enterprise, Government-owned company]
  definition: "A company owned wholly or mainly by the government that sells goods or services commercially and aims to make a profit or surplus, while serving a public purpose."
  context: "Their profits can be reinvested in better services or paid to the government, and they often carry social objectives, such as serving remote areas at the same price as cities, that a purely profit-seeking firm might drop. The guide classes them as for-profit social enterprises. Common criticisms are political interference, weak competition and the risk of becoming a drain on public money."
  example: "A government-owned water company charges for water, aims for a surplus each year and spends it on repairing pipes, while keeping prices affordable for low-income households."
  usage:
    general: "Any business owned by the state, whatever its aims; some state-owned firms are run mainly for profit or for strategic reasons."
    syllabus: "The guide lists public sector companies as a type of for-profit social enterprise: state-owned companies that trade and aim for a surplus while serving a public purpose."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [public-sector, for-profit-social-enterprise, privatization, private-sector-company, social-enterprise]

- id: cooperative
  term: Cooperative
  aliases: [Co-operative, Co-op]
  definition: "A business owned and controlled by its members, who may be its customers, its workers or the producers who supply it; they share the benefits it creates and run it democratically, normally on the basis of one member, one vote."
  context: "Members combine to gain what they could not achieve alone, such as better prices, fair pay or bargaining power, and any surplus is shared among them, often in proportion to what each buys, sells or works, or is reinvested. The main types are worker, consumer (retail) and producer cooperatives, and the guide lists the cooperative as a for-profit social enterprise. Democratic control can motivate members but slow decisions, and raising finance is harder because shares cannot be sold to outside investors."
  example: "Forty small dairy farmers form a producer cooperative that collects, processes and markets their milk, so they earn a better price than selling separately; each farmer has one vote at the annual meeting."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [for-profit-social-enterprise, social-enterprise, limited-liability, purchasing-economies-of-scale]

- id: non-profit-social-enterprise
  term: Non-profit social enterprise
  aliases: [Not-for-profit social enterprise]
  definition: "A social enterprise that never distributes a surplus to owners or members: everything left over after costs is used for its social or environmental purpose."
  context: "It can and should still aim for a surplus, since money left over funds more of its work; the difference from a for-profit social enterprise is where the surplus goes, not whether one is made. The guide gives non-governmental organizations (NGOs) as the type to know. It may find donations, grants and volunteers easier to attract, but large amounts of finance harder to raise."
  example: "A community transport organization runs minibuses for elderly and disabled passengers, charges low fares and puts every surplus into more vehicles and drivers."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [social-enterprise, non-governmental-organization, charity, for-profit-social-enterprise]

- id: non-governmental-organization
  term: Non-governmental organization (NGO)
  aliases: [NGO]
  definition: "An organization that is set up and run independently of any government, works for a cause such as human rights, the environment, health or relief from poverty, and does not distribute profits to owners."
  context: "NGOs range from small local groups to large international bodies, funded by donations, grants (sometimes from governments), membership fees and trading. Many both deliver services, such as disaster relief or education, and campaign to change the behaviour of businesses and governments, acting as pressure groups. The guide classes the NGO as a non-profit social enterprise; its independence and reputation are its most valuable assets."
  example: "An NGO that protects rivers runs clean-up projects with volunteers, sells educational workshops to schools and campaigns for a factory to stop discharging waste."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [non-profit-social-enterprise, pressure-group, charity, social-enterprise, external-stakeholder]

- id: charity
  term: Charity
  definition: "A non-profit organization set up for purposes that benefit the public, such as relieving poverty, advancing education or protecting animals, and funded mainly by donations, grants and fundraising."
  context: "In many countries charities are registered and receive tax advantages in return for strict rules on how they use their money. The main difference from a social enterprise is the source of income: a charity relies mostly on giving, whereas a social enterprise earns most of its income by trading, although many charities also trade, for example through shops. Like other non-profits, a charity puts any surplus back into its purpose."
  example: "A children's hospice is run as a charity, funded by public donations, gifts left in wills and a chain of second-hand shops."
  topics: []
  subtopics: ['1.2']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [social-enterprise, non-profit-social-enterprise, non-governmental-organization]

# ---------- 1.3 Business objectives ----------

- id: vision-statement
  term: Vision statement
  definition: "A short, aspirational statement of the long-term future an organization hopes to create or the position it hopes to reach."
  context: "A vision is about the future and is inspirational rather than measurable. It is often confused with a mission statement, which describes the organization's purpose now. A vision can unite staff and guide strategic objectives, but if it is vague or ignored in practice it becomes a mere slogan."
  example: "A small electric-scooter maker states its vision as 'cities where every short journey is clean and quiet'."
  topics: []
  subtopics: ['1.3']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [mission-statement, strategic-objective, business-objective]

- id: mission-statement
  term: Mission statement
  definition: "A statement of an organization's core purpose: what it does, for whom, and the values that guide how it does it."
  context: "The mission describes why the organization exists today, while the vision describes where it wants to be. A good mission statement helps managers make consistent decisions, tells stakeholders what to expect and can motivate staff. It is hard to measure, and critics argue that many mission statements are generic public relations that change little in practice."
  example: "A neighbourhood bookshop's mission is 'to help local children discover a love of reading through friendly advice, events and affordable books'."
  topics: []
  subtopics: ['1.3']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [vision-statement, business-objective, strategy]

- id: business-objective
  term: Business objective
  aliases: [Objective]
  definition: "A specific result an organization commits to achieving, stated precisely enough to plan for and to check, usually by a set date."
  context: "Objectives turn a mission into results that can be planned, delegated and measured; they give a basis for strategy and can motivate staff. Common objectives include growth, profit, protecting shareholder value and ethical objectives, alongside survival, market share and cash flow. Objectives change over time with the business's stage of development, its competition and the state of the economy."
  example: "A new restaurant's objectives for its first year are to break even by month nine and to serve 400 meals a week by the end of the year."
  topics: []
  subtopics: ['1.3']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [smart-objectives, strategic-objective, tactical-objective, mission-statement, strategy]

- id: smart-objectives
  term: SMART objectives
  aliases: [SMART]
  definition: "Objectives that are specific, measurable, achievable, realistic and time-bound, so that everyone knows exactly what is to be achieved and by when."
  context: "The test helps managers write objectives that can be monitored and that people will commit to: 'grow the business' fails it, while 'raise sales revenue by 10% within two years' passes. Versions differ, with some replacing achievable with agreed or realistic with relevant. A SMART objective can still be the wrong objective, so the test checks how a target is written, not whether it is wise."
  example: "A gym sets the objective of signing up 300 new members in the next six months, which staff judge achievable because it signed up 250 in the same period last year."
  topics: []
  subtopics: ['1.3']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [business-objective, strategic-objective, tactical-objective]

- id: strategic-objective
  term: Strategic objective
  definition: "A long-term objective for the organization as a whole, set by senior management, that shapes its overall direction."
  context: "Strategic objectives usually look several years ahead and commit major resources, such as entering a new market, becoming market leader or halving carbon emissions. They are broken down into tactical objectives for departments or shorter periods. General management writing often calls them corporate objectives."
  example: "A regional supermarket chain sets the strategic objective of trading in every major city in the country within eight years."
  topics: []
  subtopics: ['1.3']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [tactical-objective, strategy, business-objective, vision-statement]

- id: tactical-objective
  term: Tactical objective
  definition: "A short- to medium-term objective, usually for a department, team or period, that helps the organization reach a strategic objective."
  context: "Tactical objectives are typically set by middle managers and cover months to a year or two, for example raising sales in one region or cutting delivery times. They should support the strategic objective rather than undermine it: a push for quick sales through heavy discounting can damage a strategy built on quality. Tactics are the actions taken to meet them."
  example: "To support a strategic objective of national expansion, a supermarket's property team is set the tactical objective of securing three new store sites this year."
  usage:
    general: "Many textbooks describe three levels of objective: strategic (or corporate), tactical, and operational, the last covering day-to-day targets."
    syllabus: "The guide names two levels, strategic and tactical objectives, so answers should use those terms."
  topics: []
  subtopics: ['1.3']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [strategic-objective, tactics, business-objective, smart-objectives]

- id: strategy
  term: Strategy
  definition: "The broad, long-term approach an organization chooses to reach its objectives, setting out where it will compete and how it will use its resources."
  context: "The objective is what the business wants to achieve and the strategy is how it intends to get there; mixing the two up is a common error. Strategies involve major choices, such as which markets to enter, how to compete and whether to grow internally or externally, and they are hard to reverse. Tools such as SWOT analysis, the Ansoff matrix and Porter's generic strategies help managers choose one."
  example: "To meet its objective of doubling revenue in five years, a games studio adopts a strategy of translating its games and launching them in new countries."
  topics: []
  subtopics: ['1.3']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [tactics, strategic-objective, business-objective, ansoff-matrix, porters-generic-strategies]

- id: tactics
  term: Tactics
  aliases: [Tactic]
  definition: "Short-term actions or plans used to carry out a strategy and meet tactical objectives."
  context: "Tactics are more specific than a strategy and cheaper and quicker to change: a price promotion, a new advertisement or longer opening hours. They should fit the strategy they serve. A business that keeps changing tactics without a clear strategy ends up reacting to events rather than shaping them."
  example: "As part of its strategy to attract younger customers, a clothing retailer runs a two-week student discount and a social media competition."
  topics: []
  subtopics: ['1.3']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [strategy, tactical-objective]

- id: profit-maximization
  term: Profit maximization
  definition: "The objective of making the largest possible profit, that is, the greatest possible gap between total revenue and total costs."
  context: "It is often assumed to be the main objective of private sector businesses, but in practice many aim for a satisfactory profit (satisficing), because information is uncertain, other stakeholders' interests matter and owners may value control or a manageable workload. A firm may also give up short-term profit for growth or market share. Whatever the stated objective, profit is needed to survive, reward owners and fund investment."
  example: "A concert-ticket website raises its prices for the most popular shows to earn as much profit as possible from each event."
  topics: []
  subtopics: ['1.3']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [business-objective, shareholder-value, business-growth, total-revenue, total-cost]

- id: business-growth
  term: Business growth
  aliases: [Growth]
  definition: "An increase in the size of a business, measured for example by sales revenue, output, market share, number of employees, number of outlets or the value of the business."
  context: "Growth is a common objective because it can bring economies of scale, market power, a stronger brand and greater security, but it also brings risks such as diseconomies of scale and loss of control. Different measures can tell different stories: revenue can grow while market share falls. Growth can be internal (organic) or external, through mergers, acquisitions, takeovers, joint ventures, strategic alliances or franchising."
  example: "A bubble-tea chain sets the objective of growing from five to twelve outlets in three years, and tracks both the number of outlets and total revenue."
  topics: [growth-and-evolution]
  subtopics: ['1.3', '1.5']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [internal-growth, external-growth, economies-of-scale, business-objective, small-and-medium-sized-enterprises]

- id: shareholder-value
  term: Shareholder value
  aliases: [Protecting shareholder value]
  definition: "The value a company creates for its owners, mainly through a rising share price and the dividends it pays."
  context: "Protecting shareholder value means running the company so that the owners' investment grows over time and is not damaged by poor decisions, scandals or reckless risks. Critics argue that a narrow focus on it encourages short-termism, such as cutting investment or staff to lift profits quickly, at the expense of other stakeholders. Many now argue that lasting shareholder value depends on treating stakeholders well."
  example: "The board of a publicly held drinks company turns down a risky acquisition that investors fear would hit its share price, and keeps its regular dividend."
  topics: []
  subtopics: ['1.3']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [shareholder, business-objective, profit-maximization, stakeholder-concept, publicly-held-company]

- id: ethical-objectives
  term: Ethical objectives
  definition: "Targets that commit an organization to doing what it believes is morally right, such as treating workers, suppliers and the environment fairly, even where the law does not require it."
  context: "Examples include paying a living wage, buying from suppliers that treat their workers fairly, cutting emissions or refusing to test products on animals. They can improve reputation, customer loyalty and staff motivation, but they often raise costs and may reduce short-term profit. Setting them is easier than meeting them, and stakeholders increasingly check whether claims are matched by actions."
  example: "A chocolate maker sets the ethical objective of buying all its cocoa from farmers paid a guaranteed minimum price within three years."
  topics: []
  subtopics: ['1.3']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [business-ethics, corporate-social-responsibility, business-objective, triple-bottom-line]

- id: business-ethics
  term: Business ethics
  definition: "The application of ideas of right and wrong to business decisions and conduct, including how a business treats people, the environment and the truth."
  context: "Ethics is one of the course's four key concepts, and almost every business decision has an ethical side, from how staff are treated to how products are advertised. What is legal is not always ethical, and what counts as ethical differs between cultures and changes over time. Many businesses set out their principles in a code of ethics and back them with ethical objectives."
  example: "A marketing agency turns down a campaign that would target children with unhealthy snacks, even though the campaign would be legal and profitable."
  topics: []
  subtopics: ['1.3']
  level: SL/HL
  category: stakeholder
  provenance: subject-knowledge
  related: [ethical-objectives, corporate-social-responsibility, stakeholder]

- id: corporate-social-responsibility
  term: Corporate social responsibility (CSR)
  aliases: [CSR]
  definition: "A business's acceptance that it is responsible for the effects of its activities on society and the environment, and its commitment to act in the interests of stakeholders beyond what the law requires."
  context: "CSR can include fair treatment of workers and suppliers, community projects, cutting pollution and honest marketing. Views differ: some see it as simply the right thing to do, some as good strategy that builds reputation and lowers risk, and others argue that a business's duty is to make a profit within the law and leave social goals to governments. Expectations of CSR change over time and between cultures, and claims without real action damage trust."
  example: "A clothing retailer inspects the factories that make its clothes, publishes the findings and pays for training for workers in its supply chain."
  topics: []
  subtopics: ['1.3']
  level: SL/HL
  category: stakeholder
  provenance: subject-knowledge
  related: [triple-bottom-line, ethical-objectives, business-ethics, stakeholder-concept, circular-business-models]

- id: triple-bottom-line
  term: Triple bottom line
  aliases: [TBL, 'People, planet, profit']
  definition: "A way of judging an organization's performance by three measures rather than by profit alone: its social impact (people), its environmental impact (planet) and its financial results (profit)."
  context: "The phrase was introduced by the writer John Elkington in the 1990s and is used by socially responsible businesses and social enterprises to report on their impact. It links directly to the course's key concept of sustainability. Its weakness is measurement: profit has an agreed unit, but social and environmental impacts are much harder to quantify and compare."
  example: "A furniture maker reports each year on its profit, on the number of local apprentices it trains and on the share of its timber that comes from certified sustainable forests."
  topics: []
  subtopics: ['1.2', '1.3']
  level: SL/HL
  category: stakeholder
  provenance: subject-knowledge
  related: [corporate-social-responsibility, social-enterprise, ethical-objectives, circular-business-models]

# ---------- 1.4 Stakeholders ----------

- id: stakeholder
  term: Stakeholder
  definition: "Any individual or group with an interest in what an organization does, because its decisions have an impact on them or because they can influence those decisions."
  context: "Stakeholders are usually divided into internal ones, such as employees, managers and owners, and external ones, such as customers, suppliers, the government, lenders, the local community and pressure groups. Each group has its own objectives, so their interests often conflict. Do not confuse stakeholders with shareholders: shareholders are only one stakeholder group."
  example: "When a city airport plans a new runway, its stakeholders include its shareholders and staff, the airlines, passengers, nearby residents, environmental groups and the local council."
  topics: []
  subtopics: ['1.4']
  level: SL/HL
  category: stakeholder
  provenance: subject-knowledge
  related: [internal-stakeholder, external-stakeholder, stakeholder-conflict, stakeholder-mapping, shareholder]

- id: internal-stakeholder
  term: Internal stakeholder
  definition: "A stakeholder that is part of the organization: its employees, its managers and directors, and its owners."
  context: "Employees want fair pay, security and good conditions; managers want rewards, status and success; owners want profit, dividends and a rising value for their investment. These interests overlap, since all gain if the business succeeds, but they also clash, for example over pay versus dividends. Owners, including shareholders, are usually counted as internal stakeholders, although some textbooks treat the shareholders of large publicly held companies as external because they play no part in running the business."
  example: "In a family-owned bakery chain, the bakers, the shop managers and the family shareholders are all internal stakeholders."
  topics: []
  subtopics: ['1.4']
  level: SL/HL
  category: stakeholder
  provenance: subject-knowledge
  related: [stakeholder, external-stakeholder, shareholder, stakeholder-conflict]

- id: external-stakeholder
  term: External stakeholder
  definition: "A stakeholder outside the organization that is affected by its activities or can influence them, such as customers, suppliers, lenders, the government, the local community and pressure groups."
  context: "Customers want quality, value and good service; suppliers want regular orders and prompt payment; lenders want repayment with interest; the government wants taxes paid, laws obeyed and jobs created; the community wants jobs and little disruption; pressure groups want change on their issue. Their power varies with the situation: customers, for example, have more power when they have plenty of alternatives."
  example: "Residents near a proposed quarry, the council that must approve it and an environmental group campaigning against it are all external stakeholders of the quarrying company."
  topics: []
  subtopics: ['1.4']
  level: SL/HL
  category: stakeholder
  provenance: subject-knowledge
  related: [stakeholder, internal-stakeholder, pressure-group, stakeholder-mapping]

- id: stakeholder-conflict
  term: Stakeholder conflict
  aliases: [Conflict between stakeholders]
  definition: "A situation in which the interests or objectives of different stakeholder groups clash, so a decision that benefits one group harms or disappoints another."
  context: "Typical conflicts include shareholders wanting higher dividends while employees want higher pay, a business wanting to expand while residents fear noise and traffic, and customers wanting lower prices while suppliers want better terms. Managers handle conflict by prioritizing (for example with stakeholder mapping), negotiating, compromising and communicating openly. Stakeholders also share interests, such as the survival of the business, which can be the basis of a compromise."
  example: "The owners of a shoe factory want to move production abroad to cut costs, while its employees and the local council oppose a move that would cost hundreds of local jobs."
  topics: []
  subtopics: ['1.4']
  level: SL/HL
  category: stakeholder
  provenance: subject-knowledge
  related: [stakeholder, stakeholder-mapping, divorce-of-ownership-and-control, internal-stakeholder, external-stakeholder]

- id: stakeholder-mapping
  term: Stakeholder mapping
  aliases: [Power-interest matrix, "Mendelow's matrix"]
  definition: "A way of prioritizing stakeholders by plotting each group on a grid according to its power over the organization and its interest in a particular decision."
  context: "In the common power-interest version, associated with Aubrey Mendelow, groups with high power and high interest are managed closely as key players, high power and low interest are kept satisfied, low power and high interest are kept informed, and low power and low interest are monitored with little effort. Positions change with the issue and over time, so a map is a snapshot. It is not one of the guide's toolkit tools, but it is widely used to analyse stakeholder conflict."
  example: "Planning a new factory, a manufacturer treats the local council (high power, high interest) as a key player to consult early, and nearby schools (low power, high interest) as a group to keep informed."
  topics: []
  subtopics: ['1.4']
  level: SL/HL
  category: stakeholder
  provenance: subject-knowledge
  related: [stakeholder, stakeholder-conflict, external-stakeholder, internal-stakeholder]

- id: stakeholder-concept
  term: Stakeholder concept
  aliases: [Stakeholder approach]
  definition: "The view that a business should take account of the interests of all its stakeholders when making decisions, not only those of its owners."
  context: "It contrasts with the shareholder concept, the view that a business's main duty is to maximize returns for its shareholders within the law. Supporters argue that treating employees, suppliers, customers and communities well builds loyalty and long-term success; critics say it blurs accountability, since managers answerable to everyone may end up answerable to no one. The stakeholder concept underpins CSR and the triple bottom line."
  example: "A supermarket chain pays its suppliers within 14 days rather than the 60 days its contracts allow, arguing that reliable, healthy suppliers help it in the long run."
  topics: []
  subtopics: ['1.3', '1.4']
  level: SL/HL
  category: stakeholder
  provenance: subject-knowledge
  related: [stakeholder, shareholder-value, corporate-social-responsibility, triple-bottom-line]

- id: pressure-group
  term: Pressure group
  definition: "An organized group that tries to influence the decisions of businesses or governments on a particular issue, without seeking political office itself."
  context: "Pressure groups use campaigns, petitions, lobbying, protests, social media and boycotts. Their power depends on public support, media attention, expertise and how far their cause can affect a business's reputation or sales. Many are NGOs, and as external stakeholders they can force change or create conflict with other groups such as shareholders or employees."
  example: "A consumer group publishes tests showing that a breakfast cereal contains more sugar than its packaging suggests, and an online campaign persuades the maker to change the recipe."
  topics: []
  subtopics: ['1.4']
  level: SL/HL
  category: stakeholder
  provenance: subject-knowledge
  related: [external-stakeholder, non-governmental-organization, stakeholder-mapping, stakeholder]

# ---------- 1.5 Growth and evolution (terms not already in growth.yaml) ----------

- id: technical-economies-of-scale
  term: Technical economies of scale
  definition: "Lower average costs that come from using larger, more advanced equipment and production methods that only pay for themselves at high output."
  context: "Expensive machinery, automated production lines and larger plants spread their fixed costs over more units, and greater scale allows tasks to be divided among specialist workers. They matter most in capital-intensive industries such as car making and energy, and least in labour-intensive services such as hairdressing. They are one type of internal economy of scale."
  example: "A drinks maker that grows large enough to install a high-speed bottling line fills each bottle at a fraction of the cost of its old manual line."
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [economies-of-scale, purchasing-economies-of-scale, managerial-economies-of-scale, average-cost]

- id: purchasing-economies-of-scale
  term: Purchasing economies of scale
  aliases: [Bulk-buying economies]
  definition: "Lower average costs that come from buying inputs in large quantities, which wins discounts and better terms from suppliers."
  context: "A large buyer has bargaining power because suppliers want to keep its orders, and it may also gain longer credit periods and lower delivery costs per unit. Small firms can win some of the same benefit by buying together, for example through a cooperative. Pushing suppliers too hard can cause conflict and damage quality."
  example: "A chain of forty restaurants pays less per kilogram of rice than a single restaurant could, because it buys by the truckload."
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [economies-of-scale, technical-economies-of-scale, cooperative]

- id: financial-economies-of-scale
  term: Financial economies of scale
  definition: "Lower costs of finance for larger businesses, which can usually borrow at lower interest rates and raise money from more sources than small firms."
  context: "Lenders see large, established businesses as less risky, because they have more assets to offer as security and a longer track record. Large companies can also sell shares to the public, while small firms often depend on personal savings and costly short-term loans. They are one type of internal economy of scale."
  example: "A national hotel group borrows at a lower interest rate than a single guest house, because the bank can secure the loan against many properties."
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [economies-of-scale, publicly-held-company, risk-bearing-economies-of-scale]

- id: managerial-economies-of-scale
  term: Managerial economies of scale
  definition: "Lower average costs that come from employing specialist managers, whose expertise improves decisions and whose cost is spread over a larger output."
  context: "In a small firm the owner may handle finance, marketing and hiring alone; a large firm can afford an expert for each, such as a qualified accountant or a purchasing manager. Because a manager's salary does not rise in line with output, management cost per unit falls as the firm grows. Beyond a point, however, extra layers of management can cause diseconomies of scale."
  example: "A growing online retailer hires a full-time logistics manager, whose new delivery routes cut the transport cost of each parcel."
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [economies-of-scale, diseconomies-of-scale, technical-economies-of-scale]

- id: marketing-economies-of-scale
  term: Marketing economies of scale
  definition: "Lower marketing costs per unit for larger businesses, because the cost of advertising and promotion is spread over more sales."
  context: "A national advertising campaign costs the same however many units it helps to sell, so a firm with high sales pays less per unit. Large firms may also negotiate better rates from media owners and promote several products under one brand. They are one type of internal economy of scale."
  example: "A snack maker with products in every supermarket spreads the cost of one television campaign across millions of packets, while a small rival cannot afford a campaign at all."
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [economies-of-scale, purchasing-economies-of-scale, average-cost]

- id: risk-bearing-economies-of-scale
  term: Risk-bearing economies of scale
  definition: "The ability of a larger business to spread its risks across several products, markets or locations, so that a problem in one is offset by the others."
  context: "A business that sells many products in many places is less exposed to a fall in demand, a supply shortage or a local disaster than one that relies on a single product or market. This stability can also make finance easier to obtain. It is closely linked to diversification, which spreads risk deliberately."
  example: "A tour operator offering holidays in twenty countries copes with a slump in bookings to one destination far better than a firm that sells trips to only one."
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [economies-of-scale, diversification, financial-economies-of-scale]

- id: external-diseconomies-of-scale
  term: External diseconomies of scale
  definition: "Rises in the average costs of businesses that come from the growth of their industry or area, rather than from their own growth."
  context: "When many firms crowd into one place or an industry expands quickly, rents rise, roads become congested, competition for skilled workers pushes up wages and suppliers struggle to keep up. Every firm in the area or industry faces the higher costs, whatever its own size. They are the opposite of external economies of scale, which the same growing cluster can also bring."
  example: "As more technology firms move into one city district, office rents and engineers' salaries rise for every firm there, including small ones that have not grown at all."
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [external-economies-of-scale, diseconomies-of-scale, economies-of-scale]

- id: conglomerate-integration
  term: Conglomerate integration
  aliases: [Conglomerate merger]
  definition: "A merger, acquisition or takeover between businesses in unrelated industries."
  context: "The main motive is to spread risk across different markets, and sometimes to put spare cash or management skills to use in new areas. Because the businesses have little in common, there are few economies of scale and the combined group can be hard to manage. A group made up of many unrelated businesses is called a conglomerate."
  example: "A cement maker buys a chain of dental clinics, so that a downturn in construction is partly offset by steady demand for dental care."
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [horizontal-integration, vertical-integration, diversification, merger, risk-bearing-economies-of-scale]

- id: synergy
  term: Synergy
  definition: "The extra value created when two businesses combine, so that together they perform better than the two would separately."
  context: "Synergy is the main justification for most mergers and acquisitions, often summed up as two plus two making five. It can come from cost savings, such as shared offices and greater buying power, from combining skills or technology, or from selling more products to each other's customers. Expected synergies are frequently overestimated, while culture clashes and integration costs are underestimated."
  example: "When two regional bus companies merge, they close one of their two depots and combine their timetables, cutting the cost per passenger."
  topics: []
  subtopics: ['1.5']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [merger, acquisition, takeover, economies-of-scale]

- id: franchisor
  term: Franchisor
  definition: "The business that owns a brand and business model and sells franchises, giving other businesses the right to use them in return for fees and royalties."
  context: "Franchising lets the franchisor grow quickly with little of its own capital, since franchisees pay for their outlets, and franchisees are often more motivated than salaried managers. In return, the franchisor provides training, supplies and marketing, and sets the standards every outlet must follow. Its main risk is that one badly run outlet damages the whole brand."
  example: "A smoothie brand acting as franchisor charges each new franchisee an initial fee plus a royalty on sales, and inspects outlets to check recipes and hygiene."
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [franchisee, franchising, royalty, external-growth]

- id: franchisee
  term: Franchisee
  definition: "A business or person that buys a franchise, gaining the right to trade under the franchisor's brand and to use its business model."
  context: "The franchisee invests its own capital and runs the outlet, paying an initial fee and continuing royalties. It gains a proven product, a known brand, training and support, so its risk is usually lower than starting from scratch. In exchange it has little freedom over what it sells or how, and its success depends partly on the franchisor and on other franchisees protecting the brand."
  example: "A former bank clerk becomes a franchisee of a tutoring brand, renting premises in her town and using the brand's teaching materials and booking system."
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [franchisor, franchising, royalty]

- id: small-and-medium-sized-enterprises
  term: Small and medium-sized enterprises (SMEs)
  aliases: [SME, Small business]
  definition: "Businesses below a certain size, measured by number of employees, revenue or assets; the thresholds differ from country to country."
  context: "Many businesses stay small by choice or by necessity: the owner may value control and independence, the market may be local or niche, customers may pay for personal service and flexibility, and staying small avoids diseconomies of scale and the risks and finance that growth demands. Governments often support SMEs with grants, advice or lower taxes because they create jobs and competition. Their weaknesses include higher average costs and less bargaining power than large rivals."
  example: "An independent bicycle-repair shop with four staff stays small deliberately: the owner knows every customer by name and wants to keep repairing bikes himself."
  topics: [growth-and-evolution]
  subtopics: ['1.5']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [business-growth, economies-of-scale, diseconomies-of-scale, sole-trader, start-up]

# ---------- 1.6 Multinational companies (MNCs) ----------

- id: multinational-company
  term: Multinational company (MNC)
  aliases: [MNC, Multinational corporation]
  definition: "A business that owns and controls operations, such as factories, offices or stores, in more than one country, while being directed from a head office in its home country."
  context: "Selling abroad by exporting does not make a business an MNC; it must operate in other countries, usually through foreign direct investment in subsidiaries, plants, offices or shops. Businesses become MNCs to reach new markets, cut costs, secure resources and get round trade barriers. Their impact on the host countries where they operate can be positive or negative, and weighing that impact is the focus of this subtopic."
  example: "A smartphone maker designs its products in its home country, assembles them in factories in two other countries and runs sales offices across a third continent: it is a multinational company."
  topics: []
  subtopics: ['1.6']
  level: SL/HL
  category: organization
  provenance: subject-knowledge
  related: [host-country, foreign-direct-investment, globalization, repatriation-of-profits, technology-transfer]

- id: host-country
  term: Host country
  definition: "A country in which a multinational company operates, other than the home country where it has its head office."
  context: "Host countries can gain jobs, investment, tax revenue, skills, technology and wider consumer choice from MNCs, but may also suffer from local firms being forced out, profits sent abroad, tax avoidance, environmental damage and the risk that the MNC leaves when conditions change. Host governments often offer incentives, such as tax breaks or grants, to attract MNCs, and regulate them to protect workers and the environment. How much a host country gains depends on its laws, its bargaining power and the MNC's behaviour."
  example: "When a foreign carmaker builds a factory in a host country, local parts suppliers win new orders, but the country's own carmaker loses sales to the newcomer."
  topics: []
  subtopics: ['1.6']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [multinational-company, foreign-direct-investment, technology-transfer, repatriation-of-profits, transfer-pricing]

- id: foreign-direct-investment
  term: Foreign direct investment (FDI)
  aliases: [FDI]
  definition: "Investment by a business from one country in productive assets in another country, such as building a factory or buying a large stake in a foreign company, giving it a lasting interest and a say in how those assets are run."
  context: "FDI is how most MNCs expand: by building new facilities from scratch (greenfield investment), buying existing businesses or forming joint ventures. It differs from buying a few shares in a foreign company purely as a financial investment, which brings no say in management. Host countries compete to attract FDI because of the jobs, capital and technology it can bring."
  example: "A food processor builds a canning plant in a neighbouring country close to its tomato growers; the money spent on the plant is foreign direct investment."
  topics: []
  subtopics: ['1.6']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [multinational-company, host-country, joint-venture, acquisition, globalization]

- id: globalization
  term: Globalization
  definition: "The growing integration of economies around the world through increased trade, investment, movement of people, technology and ideas."
  context: "Cheaper transport and communication, the removal of many trade barriers and the internet have made it easier for businesses to buy, sell and operate across borders. Globalization helps MNCs grow and gives consumers more choice, but it also exposes businesses to foreign competition and raises concerns about jobs, inequality, cultural change and the environment. Some recent trends, such as reshoring, partly reverse it."
  example: "A small textile designer sells online to customers on three continents and has her fabric printed by a supplier in another country."
  topics: []
  subtopics: ['1.6']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [multinational-company, foreign-direct-investment, host-country, sectoral-change]

- id: technology-transfer
  term: Technology transfer
  aliases: [Knowledge transfer]
  definition: "The spread of technology, skills and know-how from one organization or country to another, for example when an MNC brings new production methods to a host country and trains local workers."
  context: "It is one of the main potential benefits of MNCs for host countries, raising productivity and helping local suppliers and employees develop skills they can use elsewhere. It is not automatic: MNCs may keep their most valuable research and senior roles at home and guard their intellectual property. Some host governments require local partners or training programmes to encourage it."
  example: "A wind-turbine maker opens a factory in a host country and trains local engineers, some of whom later start their own firms supplying components."
  topics: []
  subtopics: ['1.6']
  level: SL/HL
  category: concept
  provenance: subject-knowledge
  related: [multinational-company, host-country, foreign-direct-investment]

- id: repatriation-of-profits
  term: Repatriation of profits
  definition: "The transfer of profits earned by an MNC's operations in a host country back to its head office or shareholders in its home country."
  context: "Repatriated profits leave the host economy instead of being reinvested there, which is a common criticism of MNCs. How much is repatriated depends on the MNC's plans, the returns available locally and the host country's tax and currency rules. It has to be weighed against the jobs, wages and taxes the MNC provides in the host country."
  example: "A mining company earns large profits from a mine in a host country and sends most of them home to pay dividends to its shareholders, leaving little for local investment."
  topics: []
  subtopics: ['1.6']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [multinational-company, host-country, transfer-pricing]

- id: transfer-pricing
  term: Transfer pricing
  definition: "The prices that one part of an MNC charges another part, in a different country, for goods, services or the use of brands and patents."
  context: "Transfer prices are needed whenever parts of a group trade with each other, but they can be set so that profits appear in low-tax countries and costs in high-tax ones, reducing the tax paid in host countries. Tax authorities expect such prices to match what independent businesses would charge each other, though this is hard to enforce. It is a key reason for concern about how much tax MNCs contribute."
  example: "A coffee chain's subsidiary in a high-tax host country pays a large fee to a sister company in a low-tax country for the use of the brand name, so the subsidiary reports little profit and pays little tax."
  topics: []
  subtopics: ['1.6']
  level: SL/HL
  category: finance
  provenance: subject-knowledge
  related: [multinational-company, host-country, repatriation-of-profits]

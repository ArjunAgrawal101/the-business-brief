# Glossary: finance and accounting terms beyond the IB course.
# Every entry is enrichment (provenance: enrichment): it names no IB subtopic, never carries
# the ib qualification, and links to the IB terms it builds on through related. Definitions,
# explanations and examples are the platform's own words; every business named is fictional.
# Entries are in alphabetical order of term.

- id: accruals-accounting
  term: "Accruals accounting"
  aliases: ["Accrual basis", "Accruals concept"]
  definition: "Recording revenue when it is earned and costs when they are incurred, rather than when cash is received or paid."
  simple: "Counting a sale when it is made and a cost when it is used up, even if the money arrives or leaves later. It is why a business's profit and its cash can be very different."
  technical: "Under the accruals or matching concept, revenue is recognized when goods or services are delivered, and expenses are matched to the revenue they help to earn. It explains debtors and creditors, prepayments, accrued expenses and depreciation. Cash accounting, used by some very small businesses, records only cash movements."
  example: "A fictional design agency finishes a $12,000 project in March but is paid in May: under accruals accounting the revenue belongs to March, while the cash flow forecast shows the receipt in May."
  misconceptions:
    - claim: "Accounts record income when the money arrives."
      correction: "Under accruals accounting, revenue is recorded when it is earned, which is why profit and cash flow differ."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [profit, cash-flow, credit-sales, depreciation, debtors]

- id: activity-based-costing
  term: "Activity-based costing (ABC)"
  aliases: ["ABC"]
  definition: "A way of assigning overheads to products according to the activities they use, such as machine set-ups, orders or inspections, rather than by a single measure such as labour hours."
  simple: "A fairer way of sharing out a business's overheads: each product is charged for the activities it actually causes, so a complicated product that needs lots of set-ups pays more of their cost."
  technical: "ABC groups overheads into cost pools for activities, finds the cost driver of each (the number of set-ups, orders or inspections) and charges products by their use of the drivers. It often reveals that complex, low-volume products are under-costed by traditional absorption costing and high-volume ones over-costed. It is more accurate, but costly to set up and maintain."
  example: "A fictional furniture maker finds that its made-to-order tables need 40 machine set-ups a month against 5 for its standard chairs, so under ABC the tables carry most of the set-up cost that labour-hour costing had spread evenly."
  misconceptions:
    - claim: "ABC removes the need for judgement in costing."
      correction: "Choosing the activities and cost drivers takes judgement, and some overheads, such as head office costs, have no clear driver."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [absorption-costing, indirect-cost, contribution-costing, cost-centre]

- id: amortization
  term: "Amortization"
  definition: "Spreading the cost of an intangible asset, such as a patent, a software licence or a brand that was bought, over the years it is expected to bring benefits."
  simple: "The same idea as depreciation, but for things you cannot touch, like a patent or a software licence: their cost is spread over the years they are used."
  technical: "Amortization charges a share of an intangible asset's cost to the statement of profit or loss each year, usually on a straight line basis over its useful life, reducing its carrying amount. Some intangibles with indefinite lives, such as goodwill under some accounting standards, are not amortized but tested for impairment instead. The word also describes repaying a loan in regular instalments."
  example: "A fictional medical devices firm buys a patent for $900,000 with nine years left to run and amortizes it at $100,000 a year."
  formula: "Annual amortization (straight line) = (cost − residual value) ÷ useful life"
  misconceptions:
    - claim: "Amortization is a cash payment."
      correction: "Like depreciation, it is an accounting charge that spreads a cost already paid; no cash leaves the business when it is recorded."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [depreciation, intangible-asset, patent, goodwill, ebitda]

- id: asset-turnover
  term: "Asset turnover"
  definition: "Sales revenue divided by total assets, showing how much revenue a business generates from each dollar of assets it uses."
  simple: "How hard a business makes its assets work: the sales it gets from every dollar of buildings, machines and stock it owns."
  technical: "Asset turnover = sales revenue ÷ total assets; some analysts use net assets or capital employed instead. It is one of the drivers of returns: ROCE equals the profit margin multiplied by the turnover of capital employed, so a business can earn the same return with thin margins and high turnover, like a discount supermarket, or wide margins and low turnover, like a jeweller."
  example: "A fictional warehouse store makes sales of $90 million with total assets of $30 million, an asset turnover of 3 times."
  formula: "Asset turnover = sales revenue ÷ total assets"
  misconceptions:
    - claim: "A low asset turnover means the business is inefficient."
      correction: "Capital-heavy industries such as power generation naturally have low turnover; comparisons are fair only within an industry."
  category: measure
  qualifications: [undergraduate, mba, professional]
  frameworks: [ratio-families]
  provenance: enrichment
  related: [return-on-capital-employed, efficiency-ratios, return-on-equity, non-current-assets]

- id: cost-of-capital
  term: "Cost of capital"
  definition: "The return a business must earn on an investment to satisfy the people who provide its finance, lenders and shareholders, given the risk they bear."
  simple: "The price a business pays for using other people's money. If an investment earns less than this, the investors would have done better putting their money elsewhere."
  technical: "The cost of debt is the interest rate, reduced by tax relief on interest where it applies; the cost of equity is the return shareholders expect for their risk, which is higher because they are paid last. The weighted average of the two (WACC) is used as the discount rate in DCF and as the hurdle for investments of average risk, with a higher rate for riskier projects. An investment adds value only if its return exceeds the cost of capital."
  example: "If lenders charge 6% and shareholders expect 12%, a fictional manufacturer financed half by each has a cost of capital of about 9% before tax effects, so a project returning 8% would destroy value."
  misconceptions:
    - claim: "Equity is free because shareholders do not have to be paid interest."
      correction: "Shareholders expect a return through dividends and a rising share price, and because they bear more risk, equity usually costs more than debt."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [weighted-average-cost-of-capital, discounted-cash-flow, return-on-capital-employed, loan-capital, share-capital]

- id: discounted-cash-flow
  term: "Discounted cash flow (DCF)"
  aliases: ["DCF", "DCF analysis"]
  definition: "A method of valuing a project, asset or business by forecasting its future cash flows and converting each one to a value today with a discount rate that reflects the time value of money and risk."
  simple: "A way of working out what future money is worth today. Money received in five years is worth less than money now, so each future amount is shrunk back to today's value and the results are added up."
  technical: "Present value = cash flow ÷ (1 + r)^n for a cash flow in year n at discount rate r. Summing the present values of all the forecast cash flows, often with a terminal value for the years beyond the forecast, gives the value; subtracting the initial cost gives the net present value. The result is very sensitive to the discount rate and the terminal value, so analysts test a range of assumptions. The IB course uses the same idea for NPV, with the guide's printed discount factors."
  example: "At a discount rate of 10%, $1,000 received in two years' time is worth $1,000 ÷ 1.1², about $826, today."
  formula: "Present value = future cash flow ÷ (1 + r)^n"
  misconceptions:
    - claim: "A DCF valuation is precise because it uses a formula."
      correction: "The answer depends on forecasts and a chosen discount rate; small changes in either can change the value a great deal."
  category: finance
  qualifications: [undergraduate, mba, professional]
  frameworks: [npv-discounting]
  provenance: enrichment
  related: [net-present-value, present-value, discount-factor, cost-of-capital, time-value-of-money]

- id: dividend-yield
  term: "Dividend yield"
  definition: "The annual dividend per share as a percentage of the share price, showing the income return an investor receives at the current price."
  simple: "How much a share pays out in dividends each year, compared with what it costs to buy, as a percentage. It works like an interest rate on owning the share."
  technical: "Dividend yield = dividend per share ÷ market price per share × 100. The yield rises when the share price falls, so a very high yield can warn that the market expects the dividend to be cut. Mature, cash-generating firms tend to have higher yields; growth firms often retain their profit and pay little or nothing."
  example: "A fictional water utility pays a dividend of 24 cents a share and its shares trade at $4.00, a dividend yield of 6%."
  formula: "Dividend yield = dividend per share ÷ market price per share × 100"
  misconceptions:
    - claim: "A high dividend yield is always attractive."
      correction: "A yield can be high because the share price has fallen on fears that the company is in trouble, and the dividend may then be cut."
  category: measure
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [dividend, shareholder, earnings-per-share, retained-profit]

- id: earnings-per-share
  term: "Earnings per share (EPS)"
  aliases: ["EPS"]
  definition: "The profit for the period that belongs to ordinary shareholders, divided by the number of ordinary shares, showing how much profit each share has earned."
  simple: "How much profit the company made for each share. If you own one share, it is your slice of the year's profit, whether or not it is paid out to you."
  technical: "Basic EPS = (profit for the period − preference dividends) ÷ weighted average number of ordinary shares in issue. Diluted EPS also counts the shares that could be created from options and convertible securities. Investors watch growth in EPS, but it can be raised by buying back shares rather than by earning more, so it should be read beside the profit figure itself."
  example: "A fictional cycle maker, Gearhaus, earns a profit for the year of $4.5 million and has 15 million ordinary shares, so its EPS is 30 cents."
  formula: "EPS = (profit for the period − preference dividends) ÷ number of ordinary shares"
  misconceptions:
    - claim: "EPS is the dividend each shareholder receives."
      correction: "EPS is the profit earned per share; the board decides how much of it to pay out as dividends and how much to retain."
    - claim: "Rising EPS always means the business is doing better."
      correction: "EPS also rises when a company buys back its own shares, because the number of shares falls even if profit does not grow."
  category: measure
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [profit-for-period, shareholder, dividend, price-earnings-ratio, dilution]

- id: ebitda
  term: "EBITDA"
  aliases: ["Earnings before interest, tax, depreciation and amortization"]
  definition: "A measure of operating profit before interest, tax, depreciation and amortization are deducted, often used as a rough guide to the cash a business's operations generate."
  simple: "The profit a business makes from its everyday trading before it pays interest and tax, and before the cost of wearing out its equipment is counted. People use it to compare how much cash different businesses' operations produce."
  technical: "EBITDA = PBIT + depreciation + amortization. Adding back depreciation and amortization removes the effect of different accounting policies and asset ages, which helps compare firms, and it is the basis of valuation multiples such as enterprise value ÷ EBITDA and of the borrowing limits lenders set. It is not cash flow: it ignores the cash needed to replace assets, changes in working capital, interest and tax, and because accounting standards do not define it, businesses can adjust it to flatter their results."
  example: "A fictional chain of bowling alleys, Strikeline, reports PBIT of $1.2 million after charging $0.5 million of depreciation on its lanes and $0.1 million of amortization on software licences, so its EBITDA is $1.8 million."
  formula: "EBITDA = profit before interest and tax + depreciation + amortization"
  misconceptions:
    - claim: "EBITDA is the same as the cash a business generates."
      correction: "It leaves out the cash spent replacing assets, changes in stock and debtors, interest and tax, so a business can report a healthy EBITDA and still run short of cash."
    - claim: "A business with a higher EBITDA is always more profitable."
      correction: "EBITDA ignores depreciation, so a business with heavy, ageing assets can look strong on EBITDA while the true cost of keeping its assets running is high."
  category: finance
  qualifications: [undergraduate, mba, professional]
  frameworks: [profit-or-loss-waterfall]
  provenance: enrichment
  related: [profit-before-interest-and-tax, depreciation, amortization, free-cash-flow, enterprise-value]

- id: enterprise-value
  term: "Enterprise value (EV)"
  aliases: ["EV"]
  definition: "The value of a whole business to all its investors: the market value of its shares plus its debt, minus its cash."
  simple: "Roughly what it would cost to buy a whole company: you would pay for its shares and take on its debts, but you would also get its cash."
  technical: "EV = market value of the shares + debt and similar claims − cash. Because it does not depend on how the business is financed, it is compared with measures of operating performance such as EBITDA (the EV ÷ EBITDA multiple) to compare companies with different gearing."
  example: "A fictional listed retailer has shares worth $500 million in total, debt of $150 million and cash of $50 million, so its enterprise value is $600 million."
  formula: "Enterprise value = market value of shares + debt − cash"
  misconceptions:
    - claim: "Enterprise value is the share price times the number of shares."
      correction: "That is the market value of the shares; enterprise value adds debt and subtracts cash, because a buyer takes on both."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [ebitda, publicly-held-company, gearing-ratio, price-earnings-ratio]

- id: free-cash-flow
  term: "Free cash flow (FCF)"
  aliases: ["FCF"]
  definition: "The cash a business's operations generate after paying for the investment needed to maintain and grow its assets, which is available to repay lenders or reward owners."
  simple: "The cash left over after a business has paid its running costs and invested in the equipment it needs. It is the money it is free to use for paying back loans, paying dividends or saving."
  technical: "A common form is free cash flow = cash from operations − capital expenditure, where cash from operations already reflects interest, tax and changes in working capital; definitions vary between analysts. It is harder to flatter than profit and is the basis of discounted cash flow valuation. A young, fast-growing business can have negative free cash flow and be healthy, because it is investing ahead of growth."
  example: "A fictional printing business generates $650,000 of cash from operations in a year and spends $250,000 on new presses, leaving free cash flow of $400,000."
  formula: "Free cash flow = cash from operations − capital expenditure"
  misconceptions:
    - claim: "Free cash flow is the same as profit."
      correction: "Profit is measured on the accruals basis; free cash flow counts cash actually received and spent, including investment in assets."
    - claim: "Negative free cash flow means a business is failing."
      correction: "A growing business investing heavily can have negative free cash flow for years before the investment pays off."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [cash-flow, capital-expenditure, ebitda, discounted-cash-flow]

- id: hurdle-rate
  term: "Hurdle rate"
  aliases: ["Required rate of return"]
  definition: "The minimum rate of return a business requires before it will accept an investment, usually its cost of capital plus an allowance for the project's risk."
  simple: "The lowest return a business will accept from an investment. A project has to clear this bar, like a hurdle in a race, or it is turned down."
  technical: "The hurdle rate is applied as the discount rate in NPV or as the cut-off for IRR. Setting it above the cost of capital builds in a margin for forecasting error and risk; setting it too high rejects worthwhile projects and can starve a business of growth."
  example: "A fictional chain of garden centres sets a hurdle rate of 12% for new stores, so a site forecast to return 10% is rejected even though it would be profitable."
  misconceptions:
    - claim: "Any project that makes a profit should be accepted."
      correction: "A project that returns less than the cost of the money tied up in it reduces value, even if it shows an accounting profit."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [cost-of-capital, internal-rate-of-return, net-present-value, investment-appraisal]

- id: interest-cover
  term: "Interest cover"
  aliases: ["Times interest earned"]
  definition: "Profit before interest and tax divided by the interest payable, showing how many times over a business could pay the interest on its debts out of its operating profit."
  simple: "A test of whether a business can easily afford the interest on its loans. If its profit is ten times its interest bill it is very safe; if profit only just covers the interest, it is at risk."
  technical: "Interest cover = PBIT ÷ interest payable. It complements the gearing ratio: gearing shows how much is borrowed, interest cover shows whether profit can carry it. Lenders often set a minimum interest cover in loan agreements, and a fall below it can trigger penalties or limits on further borrowing."
  example: "A fictional hotel group with PBIT of $8 million and interest payable of $2 million has interest cover of 4 times."
  formula: "Interest cover = profit before interest and tax ÷ interest payable"
  misconceptions:
    - claim: "Interest cover above 1 means the business is safe."
      correction: "Just above 1, a small fall in profit leaves it unable to pay its interest; lenders look for a comfortable margin."
  category: measure
  qualifications: [undergraduate, mba, professional]
  frameworks: [ratio-families]
  provenance: enrichment
  related: [gearing-ratio, profit-before-interest-and-tax, interest, loan-capital]

- id: internal-rate-of-return
  term: "Internal rate of return (IRR)"
  aliases: ["IRR"]
  definition: "The discount rate at which the net present value of an investment's cash flows is zero, read as the investment's own annual rate of return."
  simple: "The yearly percentage return an investment is expected to earn over its life. If it is higher than what the money costs, the investment looks worthwhile."
  technical: "IRR is the rate r at which the present values of the returns, each CF ÷ (1 + r)^t, add up to the initial cost; it is found by trial and error or with software. A project is acceptable if its IRR exceeds the hurdle rate. IRR is intuitive but can mislead: unusual cash flow patterns can give more than one IRR, and when projects differ in size or timing, NPV gives the more reliable ranking."
  example: "A fictional bakery's $10,000 oven that returns $6,000 a year for two years has an IRR of about 13%: at 13%, the present values of the two returns add up to about $10,000."
  formula: "IRR is the rate r at which the sum of CF ÷ (1 + r)^t equals the initial cost"
  misconceptions:
    - claim: "The project with the highest IRR is always the best."
      correction: "A small project can have a high IRR but add less value than a larger project with a lower IRR; NPV shows the value added."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [net-present-value, discounted-cash-flow, hurdle-rate, average-rate-of-return]

- id: marginal-cost
  term: "Marginal cost"
  definition: "The extra cost of producing one more unit of output."
  simple: "How much more it costs to make one more item. If a bakery already bakes 100 loaves, the marginal cost is what the 101st loaf adds."
  technical: "Marginal cost = change in total cost ÷ change in output. In the linear model of the IB course it equals variable cost per unit; in economics it varies with output, usually falling and then rising. Profit is greatest where marginal revenue equals marginal cost, and with spare capacity any price above marginal cost adds to contribution, which is the logic of a special order."
  example: "A fictional printer's total cost rises from $5,000 to $5,180 when it prints 120 more brochures, a marginal cost of $1.50 a brochure."
  formula: "Marginal cost = change in total cost ÷ change in output"
  misconceptions:
    - claim: "Marginal cost is the same as average cost."
      correction: "Average cost spreads all costs, fixed and variable, over every unit; marginal cost is the extra cost of the next one, which is often much lower."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [variable-cost, average-cost, contribution, special-order]

- id: price-earnings-ratio
  term: "Price-earnings ratio (P/E)"
  aliases: ["P/E ratio", "Price to earnings ratio"]
  definition: "A company's share price divided by its earnings per share, showing how many years of current earnings investors are paying for when they buy a share."
  simple: "It compares the price of a share with the profit each share earns. A high number means investors are paying a lot for each dollar of profit, usually because they expect profits to grow."
  technical: "P/E = market price per share ÷ EPS. A high ratio signals expected growth or low perceived risk; a low one may signal low growth, high risk or a share the market undervalues. It is meaningful only for profitable companies and comparable only within an industry, and because it uses one year's earnings, a temporary dip in profit can make it misleadingly high."
  example: "If Gearhaus's shares trade at $6.00 and its EPS is 30 cents, its P/E ratio is 20: investors are paying 20 times its current annual earnings."
  formula: "P/E ratio = market price per share ÷ earnings per share"
  misconceptions:
    - claim: "A low P/E ratio means a share is a bargain."
      correction: "It may reflect low expected growth or high risk; a low P/E is a question to investigate, not a conclusion."
    - claim: "P/E ratios can be compared across all companies."
      correction: "Typical ratios differ greatly between industries, so comparisons are fair only between similar businesses."
  category: measure
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [earnings-per-share, shareholder, enterprise-value, publicly-held-company]

- id: return-on-equity
  term: "Return on equity (ROE)"
  aliases: ["ROE"]
  definition: "Profit for the period as a percentage of shareholders' equity, measuring the return a company earns on the money its owners have invested and left in the business."
  simple: "How much profit the business makes for every dollar its owners have put in or left in it. It is the shareholders' version of return on capital employed."
  technical: "ROE = profit for the period ÷ equity × 100. Unlike ROCE, which uses PBIT and all long-term capital, ROE measures the return to shareholders after interest and tax. Borrowing raises ROE when the business earns more on the borrowed money than the interest it pays, so a high ROE can reflect high gearing and high risk rather than better operations. DuPont analysis splits ROE into the profit margin, asset turnover and financial leverage."
  example: "A fictional software firm earns a profit for the year of $3 million on equity of $20 million, an ROE of 15%."
  formula: "ROE = profit for the period ÷ equity × 100"
  misconceptions:
    - claim: "ROE and ROCE measure the same thing."
      correction: "ROCE uses profit before interest and tax against all long-term capital; ROE uses profit after interest and tax against equity only."
    - claim: "A higher ROE always means better management."
      correction: "Heavy borrowing raises ROE as well as risk, so a high ROE can be a sign of high gearing."
  category: measure
  qualifications: [undergraduate, mba, professional]
  frameworks: [ratio-families]
  provenance: enrichment
  related: [return-on-capital-employed, equity, profit-for-period, gearing-ratio, asset-turnover]

- id: sensitivity-analysis
  term: "Sensitivity analysis"
  aliases: ["What-if analysis"]
  definition: "Testing how much a forecast or decision changes when one assumption is changed at a time, to find the assumptions that matter most."
  simple: "Asking \"what if?\" about a plan: what happens to the profit if sales are 10% lower, or costs 5% higher? It shows which guesses the plan depends on most."
  technical: "Each input, such as price, volume or a cost, is varied while the others are held constant, and the effect on the output (profit, NPV, break-even) is recorded. The value of an input at which the decision would change is especially useful. Scenario analysis varies several inputs together; Monte Carlo simulation assigns probabilities to many at once."
  example: "A fictional food truck forecasts sales of $160,000 a year, variable costs of a quarter of sales and fixed costs of $96,000, a profit of $24,000. Testing one assumption at a time shows that 20% fewer customers would cut contribution by $24,000 and wipe the profit out, so the owner checks how busy the pitch really is before signing a lease."
  misconceptions:
    - claim: "Sensitivity analysis predicts what will happen."
      correction: "It shows how outcomes respond to changes in assumptions; it does not say which assumptions are likely."
  category: tool
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [break-even-analysis, net-present-value, decision-tree, scenario-planning]

- id: sunk-cost
  term: "Sunk cost"
  aliases: ["Sunk costs"]
  definition: "A cost that has already been paid and cannot be recovered, whatever decision is made next."
  simple: "Money already spent that you cannot get back. Good decisions look forward, so a sunk cost should not change what you decide next."
  technical: "Because sunk costs are the same under every option, they are irrelevant to a decision; only future costs and revenues that differ between the options matter. The sunk cost fallacy is the bias of continuing a failing project because of what has been spent, often reinforced by pride and the wish to justify past choices. Sunk costs still matter for the accounts and for learning lessons."
  example: "A fictional games studio has spent $2 million on a game that testing shows players dislike; finishing it will cost $1 million more and is expected to earn $600,000, so the rational choice is to stop, whatever has already been spent."
  misconceptions:
    - claim: "Having spent a lot on a project is a good reason to finish it."
      correction: "The money already spent is gone either way; the decision should compare only the future costs and benefits of each option."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [opportunity-cost, investment-appraisal, scientific-decision-making, marginal-cost]

- id: weighted-average-cost-of-capital
  term: "Weighted average cost of capital (WACC)"
  aliases: ["WACC"]
  definition: "The average cost of a business's sources of finance, each weighted by its share of the total, used as the discount rate for investments of average risk."
  simple: "The average rate a business pays for its money, taking into account how much comes from loans and how much from shareholders."
  technical: "WACC = (E ÷ V) × cost of equity + (D ÷ V) × cost of debt × (1 − tax rate), where E is the market value of equity, D the market value of debt and V = E + D. Because debt is cheaper, adding some can lower WACC, but more borrowing raises the risk and so the cost of both debt and equity. Using one WACC for every project overvalues risky projects and undervalues safe ones."
  example: "A fictional logistics company has $60 million of equity costing 11% and $40 million of debt costing 6%, with a 25% tax rate, so its WACC = 0.6 × 11% + 0.4 × 6% × 0.75 = 8.4%."
  formula: "WACC = (E ÷ V) × cost of equity + (D ÷ V) × cost of debt × (1 − tax rate)"
  misconceptions:
    - claim: "Borrowing more always lowers WACC because debt is cheaper."
      correction: "Beyond a point, more debt raises the risk to lenders and shareholders, pushing up the cost of both."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [cost-of-capital, gearing-ratio, discounted-cash-flow, hurdle-rate]

- id: zero-based-budgeting
  term: "Zero-based budgeting"
  aliases: ["ZBB"]
  definition: "A method of budgeting in which every item of spending must be justified from zero for each new period, rather than starting from last period's budget."
  simple: "Building each year's budget from nothing, so that every manager has to explain why each cost is needed, instead of just adding a little to last year's figure."
  technical: "Incremental budgeting adjusts last period's figures, which can lock in waste. Zero-based budgeting forces a review of each activity's purpose and cost, which can find savings and move resources to priorities. It is time-consuming, can favour activities whose benefits are easy to measure, and is often applied to selected areas or every few years."
  example: "A fictional council-funded museum moves to zero-based budgeting and finds that a printed catalogue costing $30,000 a year is rarely used, so it funds a digital guide instead."
  misconceptions:
    - claim: "Zero-based budgeting means cutting every budget to zero."
      correction: "It means justifying each item from zero; well-justified spending is kept, and sometimes increased."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [budget, budget-holder, variance, cost-centre]

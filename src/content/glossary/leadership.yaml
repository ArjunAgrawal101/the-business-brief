# Glossary: leadership and management. Definitions are the platform's own wording.
- id: management
  term: Management
  definition: Getting work done through other people by planning, organizing, directing and controlling resources towards an organization's objectives.
  topics: [leadership-and-management]
  provenance: subject-knowledge
  related: [leadership, functions-of-management]
- id: leadership
  term: Leadership
  definition: Influencing and motivating people to work towards a shared goal, often through vision, example and trust rather than through position alone.
  topics: [leadership-and-management]
  provenance: subject-knowledge
  related: [management]
- id: functions-of-management
  term: Functions of management
  definition: The classic list of what managers do, from Henri Fayol, planning, organizing, commanding (directing), coordinating and controlling.
  topics: [leadership-and-management]
  provenance: source-derived
  related: [management]
- id: autocratic-leadership
  term: Autocratic leadership
  definition: A style in which the leader makes decisions alone and tells others what to do.
  topics: [leadership-and-management]
  provenance: subject-knowledge
  related: [democratic-leadership, paternalistic-leadership]
- id: paternalistic-leadership
  term: Paternalistic leadership
  definition: A style in which the leader makes decisions alone, in what they see as the employees' interest, and takes care of their welfare.
  topics: [leadership-and-management]
  provenance: subject-knowledge
  related: [autocratic-leadership, democratic-leadership]
- id: democratic-leadership
  term: Democratic leadership
  definition: A style in which the leader involves employees in decisions, consulting them and taking account of their views.
  topics: [leadership-and-management]
  provenance: subject-knowledge
  related: [autocratic-leadership]
- id: laissez-faire-leadership
  term: Laissez-faire leadership
  definition: A style in which the leader sets few rules and leaves most decisions to the team.
  topics: [leadership-and-management]
  provenance: subject-knowledge
  related: [democratic-leadership]
- id: situational-leadership
  term: Situational leadership
  definition: Adapting the leadership style to the task and to the readiness of the people being led.
  topics: [leadership-and-management]
  provenance: subject-knowledge
  related: [autocratic-leadership, laissez-faire-leadership]
- id: labour-turnover
  term: Labour turnover
  definition: The share of a workforce that leaves in a period, calculated as the number of employees leaving divided by the average number employed, multiplied by 100.
  topics: [leadership-and-management]
  provenance: subject-knowledge
  related: []
- id: scientific-decision-making
  term: Scientific decision-making
  definition: Making a decision through a logical process of gathering and analysing data, setting out the options and choosing on the evidence.
  topics: [leadership-and-management]
  level: HL
  provenance: subject-knowledge
  related: [intuitive-decision-making]
- id: intuitive-decision-making
  term: Intuitive decision-making
  definition: Making a decision on judgement, experience and instinct, without a formal process of gathering and analysing data.
  topics: [leadership-and-management]
  level: HL
  provenance: subject-knowledge
  related: [scientific-decision-making]
- id: force-field-analysis
  term: Force field analysis
  definition: A tool that weighs the forces driving a change against the forces restraining it, to plan how to make the change succeed.
  topics: [leadership-and-management, growth-and-evolution]
  level: HL
  provenance: subject-knowledge
  related: []

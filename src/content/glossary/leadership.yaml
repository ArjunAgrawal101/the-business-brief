# Glossary: leadership and management. Definitions are the platform's own wording.
- id: management
  term: Management
  definition: Getting work done through other people by planning, organizing, directing and controlling resources towards an organization's objectives.
  topics: [leadership-and-management]
  subtopics: ['2.3']
  category: people
  simple: "Organizing people, money and other resources so that work gets done and the organization reaches its goals."
  technical: "Management is usually described through its functions, planning, organizing, directing and controlling, a line of thought that goes back to Henri Fayol. It is tied to formal authority over resources. Modern views add decision-making under uncertainty and the coordination of work across functions, and they stress that the same person often manages and leads."
  misconceptions:
    - claim: "Managers and leaders are different people."
      correction: "They are different roles that one person often holds at once; a good manager usually needs to lead, and a leader needs some management."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [leadership-styles]
  provenance: subject-knowledge
  related: [leadership, functions-of-management]
- id: leadership
  term: Leadership
  definition: Influencing and motivating people to work towards a shared goal, often through vision, example and trust rather than through position alone.
  topics: [leadership-and-management]
  subtopics: ['2.3']
  category: people
  simple: "Getting people to want to work towards a shared goal, by giving them direction, setting an example and earning their trust."
  technical: "Leadership is influence that does not depend only on formal authority, which is why people without a title can lead. Theories have moved from traits, to styles, to situational and contingency models, and on to transformational leadership, which works through vision and individual development. Leadership is judged by its effect on followers and results in a given context."
  misconceptions:
    - claim: "Leaders are born, not made."
      correction: "Some traits help, but leadership behaviours can be learned and practised, and the right behaviour depends on the situation."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [leadership-styles]
  provenance: subject-knowledge
  related: [management]
- id: functions-of-management
  term: Functions of management
  definition: The classic list of what managers do, from Henri Fayol, planning, organizing, commanding (directing), coordinating and controlling.
  topics: [leadership-and-management]
  subtopics: ['2.3']
  category: people
  simple: "The main jobs every manager does, such as planning what needs to happen, organizing people and resources, and checking that the work is going to plan."
  technical: "The classic list, from Henri Fayol, is planning (forecasting), organizing, commanding, coordinating and controlling. Later writers condensed it to planning, organizing, leading and controlling. The functions describe what managers are responsible for, not how their days are spent, which observational research shows is fragmented and reactive."
  misconceptions:
    - claim: "Managers do the functions one after another, in order."
      correction: "In practice they overlap and repeat; controlling feeds back into planning all the time."
  qualifications: [ib, undergraduate, mba]
  provenance: source-derived
  related: [management]
- id: autocratic-leadership
  term: Autocratic leadership
  definition: A style in which the leader makes decisions alone and tells others what to do.
  topics: [leadership-and-management]
  subtopics: ['2.3']
  category: people
  simple: "A leader who makes all the decisions alone and tells everyone else what to do."
  technical: "Autocratic leadership centralizes decisions and relies on formal authority and close control. It can be effective in a crisis, with an inexperienced team or where errors are costly, because it is fast and clear. Over time it tends to reduce initiative, motivation and the flow of ideas, especially among skilled staff, and it makes the organization depend on one person's judgement."
  misconceptions:
    - claim: "Autocratic leadership is always bad."
      correction: "In an emergency or with a team that lacks experience, quick, clear direction can be exactly what is needed."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [leadership-styles]
  provenance: subject-knowledge
  related: [democratic-leadership, paternalistic-leadership]
- id: paternalistic-leadership
  term: Paternalistic leadership
  definition: A style in which the leader makes decisions alone, in what they see as the employees' interest, and takes care of their welfare.
  topics: [leadership-and-management]
  subtopics: ['2.3']
  category: people
  simple: "A leader who makes the decisions but genuinely cares about the staff's welfare and explains why, like a parent with a family."
  technical: "Paternalistic leaders keep control but take responsibility for employees' wellbeing, offering security, benefits and consultation without real delegation. It can build loyalty and suit cultures with high power distance, but it can also breed dependence and resentment among staff who want autonomy."
  misconceptions:
    - claim: "Paternalistic leadership is the same as democratic leadership because the leader listens."
      correction: "The paternalistic leader may consult and explain, but still decides alone; in democratic leadership staff share in the decision."
  qualifications: [ib, secondary, undergraduate, professional]
  frameworks: [leadership-styles, hofstedes-cultural-dimensions]
  provenance: subject-knowledge
  related: [autocratic-leadership, democratic-leadership]
- id: democratic-leadership
  term: Democratic leadership
  definition: A style in which the leader involves employees in decisions, consulting them and taking account of their views.
  topics: [leadership-and-management]
  subtopics: ['2.3']
  category: people
  simple: "A leader who involves the team in decisions and listens to their ideas before deciding."
  technical: "Democratic or participative leadership shares decision-making through consultation or voting. It tends to raise commitment, creativity and the quality of decisions where staff hold useful knowledge, which links it to Herzberg's motivators and self-determination theory. It is slower and can blur accountability, so it suits decisions where buy-in matters more than speed."
  misconceptions:
    - claim: "Democratic leadership means the majority always gets its way."
      correction: "Many democratic leaders consult widely and then decide; the defining feature is genuine participation, not a vote on everything."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [leadership-styles]
  provenance: subject-knowledge
  related: [autocratic-leadership]
- id: laissez-faire-leadership
  term: Laissez-faire leadership
  definition: A style in which the leader sets few rules and leaves most decisions to the team.
  topics: [leadership-and-management]
  subtopics: ['2.3']
  category: people
  simple: "A leader who gives the team a goal and then leaves them to decide how to reach it, offering help only if asked."
  technical: "Laissez-faire leadership delegates almost all decisions. With expert, motivated teams, such as researchers or designers, it can unlock creativity and ownership. Without clear goals and capable people it becomes an absence of leadership, with drift, conflict and poor coordination."
  misconceptions:
    - claim: "Laissez-faire leaders do nothing."
      correction: "They set the goal, provide resources and stay available; what they give up is control over how the work is done."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [leadership-styles]
  provenance: subject-knowledge
  related: [democratic-leadership]
- id: situational-leadership
  term: Situational leadership
  definition: Adapting the leadership style to the task and to the readiness of the people being led.
  topics: [leadership-and-management]
  subtopics: ['2.3']
  category: people
  simple: "Changing your leadership style to suit the situation and the people, rather than always leading the same way."
  technical: "Situational and contingency theories hold that no style is best everywhere; the right one depends on the task, the urgency, the team's competence and commitment, and the culture. A leader may be directive with a new employee and delegate to an experienced one on the same day. The difficulty lies in reading the situation correctly and switching styles credibly."
  misconceptions:
    - claim: "Situational leadership is not a style, just inconsistency."
      correction: "It is a deliberate choice of style for each situation, based on a reading of the task and the people, and it can be applied consistently."
  qualifications: [ib, undergraduate, mba, professional]
  frameworks: [leadership-styles]
  provenance: subject-knowledge
  related: [autocratic-leadership, laissez-faire-leadership]
- id: labour-turnover
  term: Labour turnover
  level: HL
  definition: The share of a workforce that leaves in a period, calculated as the number of employees leaving divided by the average number employed, multiplied by 100.
  topics: [leadership-and-management]
  subtopics: ['2.4']
  category: measure
  simple: "The share of a business's workers who leave over a period, usually a year, and have to be replaced."
  technical: "Labour turnover = number of employees leaving ÷ average number of employees × 100, for a stated period, usually a year. High turnover raises recruitment and training costs and loses experience, but some turnover brings in new ideas. It should be compared with the industry and read with its causes: pay, management, workload or the labour market."
  misconceptions:
    - claim: "Zero labour turnover is the ideal."
      correction: "Some turnover brings in new skills and ideas, and lets a business adjust its size; the right rate depends on the industry."
  qualifications: [ib, undergraduate, professional]
  provenance: subject-knowledge
  related: []
- id: scientific-decision-making
  term: Scientific decision-making
  definition: Making a decision through a logical process of gathering and analysing data, setting out the options and choosing on the evidence.
  topics: [leadership-and-management]
  subtopics: ['2.3']
  category: theory
  level: HL
  simple: "Making decisions by collecting facts and data, weighing the options carefully and choosing logically."
  technical: "The scientific approach follows a sequence: set objectives, gather data, generate options, evaluate them with tools such as decision trees or investment appraisal, decide, implement and review. It reduces bias and gives a record that can be defended, but it is slow, depends on the quality of the data and can create false confidence in uncertain situations."
  misconceptions:
    - claim: "Scientific decisions are always right because they use data."
      correction: "Data can be incomplete, out of date or biased, and a careful method applied to poor data still gives a poor decision."
  qualifications: [ib, undergraduate, mba, professional]
  frameworks: [decision-trees]
  provenance: subject-knowledge
  related: [intuitive-decision-making]
- id: intuitive-decision-making
  term: Intuitive decision-making
  definition: Making a decision on judgement, experience and instinct, without a formal process of gathering and analysing data.
  topics: [leadership-and-management]
  subtopics: ['2.3']
  category: theory
  level: HL
  simple: "Making decisions by gut feeling and experience rather than by detailed analysis."
  technical: "Intuition draws on pattern recognition from experience, so it can be fast and good in familiar, fast-moving situations where data are scarce. It is prone to biases, such as overconfidence and anchoring, and is hard to explain or audit. In practice managers combine intuition with analysis, using one to check the other."
  misconceptions:
    - claim: "Intuition is just guessing."
      correction: "Expert intuition is fast pattern recognition built from experience, which is why it can work well in familiar situations and badly in new ones."
  qualifications: [ib, undergraduate, mba, professional]
  provenance: subject-knowledge
  related: [scientific-decision-making]
- id: force-field-analysis
  term: Force field analysis
  definition: A tool that weighs the forces driving a change against the forces restraining it, to plan how to make the change succeed.
  topics: [leadership-and-management, growth-and-evolution]
  subtopics: ['toolkit']
  category: tool
  level: HL
  simple: "A way of weighing up the forces pushing for a change against the forces holding it back, to see if the change will succeed and how to help it."
  technical: "Associated with Kurt Lewin, it lists driving and restraining forces, scores each (often from 1 to 5) and compares the totals. Its practical value is in planning: strengthening driving forces or, often more effective, weakening restraining forces, which is the unfreezing stage of Lewin's change model. Scores are subjective, so the discussion matters more than the totals."
  misconceptions:
    - claim: "If the driving forces score more than the restraining forces, the change will succeed."
      correction: "The scores are judgements, and a single strong restraining force, such as a union veto, can stop a change whatever the totals say."
  qualifications: [ib, undergraduate, mba, professional]
  frameworks: [force-field-analysis, lewin-change-model]
  provenance: subject-knowledge
  related: []

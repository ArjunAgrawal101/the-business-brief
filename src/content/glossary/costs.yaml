# Glossary: costs, revenues and break-even. Definitions are the platform's own wording.
- id: fixed-cost
  term: Fixed cost
  definition: A cost that does not change with the level of output, within a range of output and over a given period, such as rent.
  topics: [costs-and-revenues]
  subtopics: ['3.3']
  category: finance
  simple: "A cost the business pays whether it sells a lot or nothing at all this month, like the rent on a shop."
  technical: "Fixed costs are fixed only within a relevant range of output and a time period. Beyond capacity they rise in steps (a second oven, a second shift, a larger warehouse), and in the long run every cost can be changed, which is why economists say all costs are variable in the long run. Because they do not change with output, fixed costs per unit fall as output rises, which is the arithmetic behind spreading overheads and part of the reason for economies of scale."
  misconceptions:
    - claim: "A fixed cost never changes."
      correction: "It does not change with output, within a range and over a period. Rent can still rise at the next review, and growing beyond capacity adds a new block of fixed cost."
    - claim: "Fixed costs and indirect costs are the same thing."
      correction: "Fixed and variable describe how a cost behaves as output changes; direct and indirect describe whether it can be traced to one product. A machine operator's salary can be fixed but direct; electricity for a whole factory can be variable but indirect."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [costs-and-revenue-lines, break-even-chart]
  provenance: subject-knowledge
  related: [variable-cost, semi-variable-cost]
- id: variable-cost
  term: Variable cost
  definition: A cost that changes in direct proportion to output, such as raw materials or a piece rate.
  topics: [costs-and-revenues]
  subtopics: ['3.3']
  category: finance
  simple: "A cost that goes up when the business makes or sells more, and down when it makes less, like the flour a bakery uses."
  technical: "The course treats variable costs as linear, a constant cost per unit, so total variable cost is the cost per unit multiplied by output. In practice the cost per unit can fall with bulk discounts or rise with overtime and scarce materials, so the straight line is an approximation that holds over a limited range. Variable cost per unit is what contribution is measured against, which makes it the cost that matters most for pricing a special order or deciding whether to make or buy."
  misconceptions:
    - claim: "A variable cost changes all the time, so it is unpredictable."
      correction: "Variable means it changes with output, not that it is unreliable. If output is known, total variable cost can be forecast closely."
    - claim: "Wages are always a variable cost."
      correction: "Salaried staff are usually a fixed cost. Only pay that rises with output, such as piece rates or commission, behaves as a variable cost."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [costs-and-revenue-lines, contribution]
  provenance: subject-knowledge
  related: [fixed-cost]
- id: semi-variable-cost
  term: Semi-variable cost
  definition: A cost with a fixed part and a part that varies with output, such as an electricity bill with a standing charge and a charge for each unit used.
  topics: [costs-and-revenues]
  subtopics: ['3.3']
  category: finance
  simple: "A cost with two parts, a fixed amount you always pay and an extra amount that grows the more you use, like a phone contract with a monthly charge plus a charge for extra data."
  technical: "Also called a mixed cost. For break-even analysis it must be split into its fixed and variable parts; accountants do this by inspecting the tariff or, where only past totals are known, with methods such as the high-low method or regression of total cost on output. Once split, the fixed part joins total fixed costs and the variable part is added to variable cost per unit."
  misconceptions:
    - claim: "A semi-variable cost can be left out of break-even analysis because it is neither fixed nor variable."
      correction: "It has to be split, with its fixed part counted in fixed costs and its variable part in variable cost per unit; leaving it out understates total cost and the break-even quantity."
  qualifications: [ib, secondary, undergraduate, professional]
  frameworks: [costs-and-revenue-lines]
  provenance: subject-knowledge
  related: [fixed-cost, variable-cost]
- id: direct-cost
  term: Direct cost
  definition: A cost that can be traced to a particular cost object, such as a product.
  topics: [costs-and-revenues]
  subtopics: ['3.3']
  category: finance
  simple: "A cost you can clearly link to one particular product, like the leather that goes into one handbag."
  technical: "Whether a cost is direct depends on the cost object chosen: a product, a department, a customer or a project. A store manager's salary is indirect to each product but direct to the store. Direct costs are often variable, but not always, which is why direct and indirect costs answer a different question from fixed and variable ones. Absorption costing adds a share of indirect costs to direct costs to find a full cost per unit."
  misconceptions:
    - claim: "Direct costs are the same as variable costs."
      correction: "The two classifications answer different questions. Many direct costs are variable, but a machine bought for one product only is a direct cost that is fixed."
  qualifications: [ib, secondary, undergraduate, professional]
  frameworks: [contribution]
  provenance: subject-knowledge
  related: [indirect-cost]
- id: indirect-cost
  term: Indirect cost (overhead)
  definition: A cost that cannot be traced to a particular product because it is shared across the business, such as rent or a manager's salary.
  topics: [costs-and-revenues]
  subtopics: ['3.3']
  category: finance
  simple: "A cost that the whole business shares and that cannot be pinned on one product, like the electricity for the office or the accountant's salary."
  technical: "Indirect costs, or overheads, are allocated or apportioned to products in absorption costing, using a basis such as labour hours, machine hours or floor space. The choice of basis changes each product's apparent cost and profit, which is why contribution costing leaves overheads unallocated and judges products by what they contribute to them instead. Activity-based costing, beyond the course, allocates overheads by the activities that drive them."
  misconceptions:
    - claim: "A product that does not cover its share of overheads should be dropped."
      correction: "If the overheads would stay anyway, dropping a product with a positive contribution leaves the same overheads spread over fewer products and lowers total profit."
  qualifications: [ib, secondary, undergraduate, professional]
  frameworks: [contribution]
  provenance: subject-knowledge
  related: [direct-cost]
- id: total-cost
  term: Total cost
  definition: Total fixed costs plus total variable costs for a given level of output.
  topics: [costs-and-revenues]
  subtopics: ['3.3']
  category: finance
  simple: "Everything it costs to produce a given amount: the costs that stay the same, plus the costs that grow with output."
  technical: "TC = TFC + TVC, where TVC = AVC × Q. In the course the total cost line is straight, starting at fixed costs on the vertical axis and rising with a slope equal to the variable cost per unit. In economics the total cost curve bends because variable cost per unit changes with output, but the accounting model keeps the line straight within the relevant range."
  misconceptions:
    - claim: "If output is zero, total cost is zero."
      correction: "At zero output total cost equals total fixed costs, which is why the total cost line starts above the origin on a break-even chart."
  qualifications: [ib, secondary, undergraduate, professional]
  frameworks: [costs-and-revenue-lines, break-even-chart]
  provenance: subject-knowledge
  related: [fixed-cost, variable-cost]
- id: total-revenue
  term: Total revenue
  definition: The value of sales in a period, the price multiplied by the quantity sold.
  topics: [costs-and-revenues]
  subtopics: ['3.3']
  category: finance
  simple: "All the money that comes in from selling things in a period, before any costs are taken off."
  technical: "TR = P × Q, a straight line through the origin when price is constant. In reality a business often has to lower its price to sell more, so revenue rises less than in proportion to quantity, and price elasticity of demand decides whether a price cut raises or lowers total revenue. Revenue is recognized when a sale is made, not when cash is received, so it can differ from cash inflows in the same period."
  misconceptions:
    - claim: "Revenue and profit mean the same thing."
      correction: "Revenue is the value of sales; profit is what remains after costs. A business can grow its revenue and still make a loss."
    - claim: "Revenue is the cash a business receives in the period."
      correction: "Credit sales count as revenue when they are made, even though the cash arrives later, which is why revenue and cash inflow can differ."
  qualifications: [ib, secondary, undergraduate, professional]
  frameworks: [costs-and-revenue-lines, break-even-chart]
  provenance: subject-knowledge
  related: [revenue-stream]
- id: revenue-stream
  term: Revenue stream
  definition: A distinct source of revenue, such as sales of a product, service fees, subscriptions, commission or licences.
  topics: [costs-and-revenues]
  subtopics: ['3.3']
  category: finance
  simple: "One separate way a business earns money. A gym might earn from memberships, personal training and its café: three revenue streams."
  technical: "Revenue streams differ in how predictable, profitable and scalable they are. Recurring streams such as subscriptions are valued for their stability; one-off sales are less predictable. The business model canvas makes revenue streams one of its nine blocks, and analysts compare a business's dependence on each stream as a measure of risk."
  misconceptions:
    - claim: "More revenue streams always make a business safer."
      correction: "Extra streams spread risk only if they are not exposed to the same causes, and each adds costs and management effort; a weak new stream can drain resources from a strong one."
  qualifications: [ib, secondary, undergraduate, professional]
  frameworks: [business-model-canvas]
  provenance: subject-knowledge
  related: [total-revenue]
- id: contribution
  term: Contribution
  definition: What a unit, or a decision, adds towards fixed costs and then profit. Contribution per unit is the selling price minus the variable cost per unit.
  topics: [costs-and-revenues]
  subtopics: ['5.5']
  category: measure
  simple: "The money each sale adds towards paying the fixed bills, and then towards profit. It is what is left of the price after paying for the materials that went into the item."
  technical: "Contribution is the core of cost-volume-profit analysis. Profit = total contribution − fixed costs, so every decision that changes contribution changes profit by the same amount when fixed costs are unchanged. It underlies break-even analysis, special orders at prices below full cost, make or buy decisions and the choice of which product to drop. The contribution margin ratio, contribution as a share of the price, is used to find break-even revenue directly."
  misconceptions:
    - claim: "Contribution is the same as profit."
      correction: "Contribution only becomes profit once all the fixed costs are covered. Below break-even, every unit's contribution is still paying off fixed costs."
    - claim: "A product with a positive contribution is always worth keeping."
      correction: "It helps cover fixed costs, but the capacity it uses might earn more contribution elsewhere, and qualitative factors such as brand fit also matter."
  qualifications: [ib, undergraduate, mba, professional]
  frameworks: [contribution, break-even-chart]
  provenance: subject-knowledge
  related: [break-even-quantity, special-order]
- id: break-even-quantity
  term: Break-even quantity
  definition: The level of output at which total revenue equals total cost, found by dividing fixed costs by contribution per unit and rounding up to a whole unit.
  topics: [costs-and-revenues]
  subtopics: ['5.5']
  category: measure
  simple: "The number of items you need to sell so that the money coming in exactly covers all your costs, with nothing left over and nothing lost."
  technical: "BEQ = TFC ÷ (P − AVC), rounded up to a whole unit, because selling one unit fewer leaves a loss. It is sensitive to every input: a small rise in price or fall in variable cost per unit can cut it sharply when contribution per unit is thin. It assumes a single product (or a constant sales mix), a constant price and variable cost per unit, and that everything made is sold."
  misconceptions:
    - claim: "The break-even quantity should be rounded to the nearest whole number."
      correction: "It is rounded up, because at the unit below the answer the business still makes a small loss."
    - claim: "Once a business sells the break-even quantity, it is safe."
      correction: "At break-even it makes no profit at all, and the result rests on assumptions about price, costs and sales that may not hold. The margin of safety shows how far above it the business is."
  qualifications: [ib, secondary, undergraduate, mba, professional]
  frameworks: [break-even-chart, break-even-price-change]
  provenance: subject-knowledge
  related: [contribution, margin-of-safety]
- id: margin-of-safety
  term: Margin of safety
  definition: The amount by which actual or forecast output exceeds the break-even quantity, measured in units or as a share of sales.
  topics: [costs-and-revenues]
  subtopics: ['5.5']
  category: measure
  simple: "How far sales can fall before the business starts making a loss. The bigger the gap above break-even, the safer the business."
  technical: "Margin of safety = actual or forecast output − break-even quantity, which can also be expressed as a percentage of actual or forecast output. It is a simple measure of operating risk, closely related to operating leverage: a business with high fixed costs tends to have a thinner margin of safety and a sharper swing in profit when sales change. A negative margin of safety means the business is operating below break-even."
  misconceptions:
    - claim: "A large margin of safety means the business is very profitable."
      correction: "It measures how far sales can fall before a loss, not the size of the profit; a business can have a wide margin of safety and a small profit if its contribution per unit is low."
  qualifications: [ib, undergraduate, mba, professional]
  frameworks: [break-even-chart]
  provenance: subject-knowledge
  related: [break-even-quantity]
- id: target-profit-output
  term: Target profit output
  definition: The level of output needed to earn a chosen profit, found by dividing fixed costs plus the target profit by contribution per unit.
  topics: [costs-and-revenues]
  subtopics: ['5.5']
  category: measure
  simple: "The number of items you need to sell to make the profit you are aiming for, not just to break even."
  technical: "Target profit output = (TFC + target profit) ÷ (P − AVC), rounded up. The target profit acts as an extra fixed amount that contribution must cover. The result is useful only if it lies within productive capacity and the market can absorb it at the assumed price."
  misconceptions:
    - claim: "To find target profit output, add the target profit to the break-even quantity."
      correction: "The target profit is money, not units. It is added to fixed costs, and the total is then divided by contribution per unit."
  qualifications: [ib, undergraduate, professional]
  frameworks: [break-even-chart]
  provenance: subject-knowledge
  related: [break-even-quantity]
- id: average-cost
  term: Average cost
  aliases: [Unit cost]
  definition: Total cost divided by the number of units produced.
  topics: [costs-and-revenues, growth-and-evolution]
  subtopics: ['3.3', '1.5', '5.1']
  category: measure
  simple: "The cost of making one unit on average: the total cost divided by the number of units made."
  technical: "Average cost, or unit cost, is ATC = TC ÷ Q = AFC + AVC. Average fixed cost falls continuously as output rises, because the same fixed costs are spread over more units. The long-run average cost curve traces the lowest unit cost at each scale, falling through economies of scale and rising through diseconomies, and its lowest point is the minimum efficient scale."
  misconceptions:
    - claim: "Average cost and marginal cost are the same."
      correction: "Average cost is total cost divided by all units; marginal cost, beyond the course, is the extra cost of one more unit. When fixed costs are large they differ greatly."
  qualifications: [ib, secondary, undergraduate, professional]
  frameworks: [economies-of-scale]
  provenance: subject-knowledge
  related: [total-cost, economies-of-scale]
- id: special-order
  term: Special order
  definition: A one-off order, usually at a lower price than normal, judged by its contribution when the business has spare capacity.
  topics: [costs-and-revenues]
  subtopics: ['toolkit']
  category: tool
  level: HL
  provenance: subject-knowledge
  related: [contribution]

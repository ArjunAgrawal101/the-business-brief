# Glossary: the business management toolkit (guide pp. 13 to 15). One entry
# for each tool and its key sub-terms, in the platform's own words. HL status
# follows the guide exactly: Gantt charts, Hofstede's cultural dimensions,
# Porter's generic strategies, contribution, critical path analysis and simple
# linear regression are HL only, and so are their sub-terms. Toolkit entries
# that already exist elsewhere (ansoff-matrix, market-development,
# diversification, expected-value, force-field-analysis, special-order) are
# not repeated. Formulas follow the standard textbook forms; the guide gives
# none for the toolkit.

# ---------- SWOT analysis (SL/HL) ----------

- id: swot-analysis
  term: SWOT analysis
  aliases: [SWOT]
  definition: "A planning tool that summarizes an organization's internal strengths and weaknesses and the external opportunities and threats it faces, usually in a four-box grid."
  context: "SWOT is a starting point for strategy: it organizes what is known so that managers can build on strengths, fix or avoid weaknesses, pursue opportunities and prepare for threats. The commonest errors are mixing up internal and external factors and listing actions (what the business should do) as opportunities. A SWOT is only as good as the evidence behind it, and it describes a position rather than making the decision."
  example: "A family-run hotel lists its strengths (loyal guests, a lakeside site), weaknesses (dated rooms), opportunities (a new airport nearby) and threats (a large chain opening in the town), then decides to refurbish before the chain opens."
  topics: [growth-and-evolution]
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [swot-strengths, swot-weaknesses, swot-opportunities, swot-threats, steeple-analysis]

- id: swot-strengths
  term: Strengths (SWOT)
  definition: "In a SWOT analysis, the internal features of an organization that give it an advantage, such as a strong brand, skilled staff, patents, a good location or healthy finances."
  context: "Strengths are internal and exist now, so they are within the organization's control. They matter most when customers value them and rivals find them hard to copy. Each strength should rest on evidence, such as rising market share, rather than on a claim to be 'the best'."
  example: "A bakery's strengths include a recipe customers cannot find elsewhere, a loyal local following and no debts."
  topics: [growth-and-evolution]
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [swot-analysis, swot-weaknesses, swot-opportunities]

- id: swot-weaknesses
  term: Weaknesses (SWOT)
  definition: "In a SWOT analysis, the internal features of an organization that put it at a disadvantage, such as high costs, outdated equipment, a narrow product range, poor cash flow or missing skills."
  context: "Weaknesses are internal, so the organization can act on them, either by fixing them or by choosing strategies that do not depend on them. Managers often underestimate their own weaknesses, which is why honest evidence and outside views help. A weakness becomes urgent when it meets a threat, such as high costs when a low-price rival arrives."
  example: "A clothing boutique's weaknesses include having no online shop and relying on one supplier for most of its stock."
  topics: [growth-and-evolution]
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [swot-analysis, swot-strengths, swot-threats]

- id: swot-opportunities
  term: Opportunities (SWOT)
  definition: "In a SWOT analysis, external developments that an organization could take advantage of, such as a growing market, a change in tastes, new technology or the difficulties of a rival."
  context: "Opportunities arise outside the organization and are not under its control; a STEEPLE analysis is a common way to find them. A frequent error is to list actions, such as 'open a new store', as opportunities, when the opportunity is the external change, such as rising demand in a new area, that might justify the action. An opportunity is only worth pursuing if the organization has the strengths to exploit it."
  example: "For a bicycle shop, a new network of city cycle lanes and rising fuel prices are opportunities."
  topics: [growth-and-evolution]
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [swot-analysis, swot-threats, steeple-analysis, swot-strengths]

- id: swot-threats
  term: Threats (SWOT)
  definition: "In a SWOT analysis, external developments that could harm an organization, such as a new competitor, a recession, a change in the law or a shift in consumer tastes."
  context: "Threats come from outside and cannot be controlled, only anticipated and managed, for example through contingency plans or diversification. STEEPLE analysis helps to identify them. The same external change can be a threat to one business and an opportunity for another, so the classification depends on the organization."
  example: "For a taxi firm, the arrival of a ride-hailing app and a new tax on diesel vehicles are threats."
  topics: [growth-and-evolution]
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [swot-analysis, swot-opportunities, swot-weaknesses, steeple-analysis]

# ---------- STEEPLE analysis (SL/HL) ----------

- id: steeple-analysis
  term: STEEPLE analysis
  aliases: [PESTLE analysis, PEST analysis]
  definition: "A tool for analysing an organization's external environment under seven headings: social, technological, economic, environmental, political, legal and ethical factors."
  context: "Managers use it to spot changes that create opportunities or threats, often as the input to the external half of a SWOT analysis. Good use goes beyond listing factors: it judges how likely and how significant each change is for this organization, and what it should do in response. Because the external environment keeps changing, a STEEPLE analysis dates quickly and needs regular review."
  example: "A firm planning to rent out electric scooters in a new city considers attitudes to cycling, battery improvements, local incomes, air-quality targets, city politics, road-safety laws and concerns about how its delivery riders are treated."
  usage:
    general: "Often taught in shorter forms, such as PEST or PESTLE, which leave out the ethical and sometimes the environmental factors."
    syllabus: "The guide uses STEEPLE, with all seven factors."
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [steeple-factors, swot-analysis, swot-opportunities, swot-threats]

- id: steeple-factors
  term: STEEPLE factors
  definition: "The seven kinds of external influence examined in a STEEPLE analysis: social (population, lifestyles, attitudes), technological (new products and processes), economic (growth, inflation, interest and exchange rates, unemployment), environmental (climate, pollution, resources), political (government policy and stability), legal (laws and regulation) and ethical (society's moral expectations of business)."
  context: "The factors overlap: a new pollution law is both legal and environmental, and the impact matters more than the label. Political and legal factors are often confused; political factors concern government decisions and stability, while legal factors are the laws that result. Ethical factors cover changing views of what is acceptable, such as attitudes to animal testing."
  example: "For a fast-food chain, an ageing population (social), self-order screens (technological), rising interest rates (economic), rules on packaging waste (environmental and legal) and public concern about children's diets (ethical) are all STEEPLE factors."
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [steeple-analysis, swot-opportunities, swot-threats]

# ---------- Boston Consulting Group matrix (SL/HL) ----------

- id: bcg-matrix
  term: Boston Consulting Group (BCG) matrix
  aliases: [BCG matrix, Boston matrix, Product portfolio analysis]
  definition: "A tool for analysing a business's range of products by placing each on a grid according to its market share and the growth rate of its market, which sorts them into stars, cash cows, question marks and dogs."
  context: "The matrix helps managers decide how to share resources across products, typically using the cash from cash cows to support stars and selected question marks, and withdrawing or running down dogs. It encourages a balanced portfolio and is often used alongside the product life cycle. Its limits are that it uses only two measures, a high market share does not guarantee profit, markets are hard to define and it shows a snapshot rather than a forecast."
  example: "A snack company finds that its classic crisps are a cash cow, its new protein bars a question mark and its rice cakes a dog, and moves marketing money from the rice cakes to the protein bars."
  topics: []
  subtopics: ['toolkit', '4.5']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [bcg-star, bcg-cash-cow, bcg-question-mark, bcg-dog]

- id: bcg-star
  term: Star (BCG matrix)
  definition: "In the BCG matrix, a product with a high market share in a fast-growing market."
  context: "Stars earn high revenue but usually need heavy spending on promotion and capacity to keep pace with the market and defend their share, so they may produce little spare cash. If they hold their share as market growth slows, they become cash cows. Managers usually invest to protect them."
  example: "A smartwatch that leads a market growing quickly every year is a star for its maker."
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [bcg-matrix, bcg-cash-cow, bcg-question-mark]

- id: bcg-cash-cow
  term: Cash cow (BCG matrix)
  definition: "In the BCG matrix, a product with a high market share in a slow-growing or mature market."
  context: "Cash cows generate more cash than they need, because their market is stable and little promotion is needed to defend their position. The surplus funds stars and question marks. The danger is neglect: a cash cow drained of cash without any investment can decline quickly if the market changes."
  example: "A long-established washing powder that leads a mature market is a cash cow, funding its maker's new refillable cleaning products."
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [bcg-matrix, bcg-star, bcg-dog]

- id: bcg-question-mark
  term: Question mark (BCG matrix)
  aliases: [Problem child, Wildcat]
  definition: "In the BCG matrix, a product with a low market share in a fast-growing market."
  context: "Question marks need cash to build market share, and their future is uncertain: with investment they may become stars, and without it they are likely to become dogs. Managers must decide which question marks to back, since few businesses can afford to support them all."
  example: "A new plant-based ice cream with a small share of a quickly growing market is a question mark for a dairy company."
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [bcg-matrix, bcg-star, bcg-dog]

- id: bcg-dog
  term: Dog (BCG matrix)
  definition: "In the BCG matrix, a product with a low market share in a slow-growing or declining market."
  context: "Dogs usually earn little and have poor prospects, so managers often consider withdrawing or selling them. They are not always dropped: a dog may still make a positive contribution, complete a product range or keep loyal customers buying other products."
  example: "A DVD player that still sells in small numbers in a shrinking market is a dog for an electronics firm."
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [bcg-matrix, bcg-cash-cow, bcg-question-mark]

# ---------- Business plan (SL/HL) ----------

- id: business-plan
  term: Business plan
  definition: "A document in which an entrepreneur or manager explains what a new business or project will do, who its customers will be, how it will operate and what it is expected to cost and earn."
  context: "Entrepreneurs use a business plan to test whether an idea is viable and to persuade banks, investors or grant-givers to provide finance; established businesses use plans for new projects. Typical contents are objectives, market research findings, marketing and operations plans, staffing, and cash flow and profit forecasts. A plan is only as reliable as its assumptions and must be revised as conditions change."
  example: "Before asking a bank for a loan, the founder of a mobile coffee van writes a business plan showing her target customers, chosen pitches, prices, start-up costs and a twelve-month cash flow forecast."
  topics: []
  subtopics: ['toolkit', '1.1']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [start-up, entrepreneurship, swot-analysis, steeple-analysis]

# ---------- Decision trees (SL/HL) ----------

- id: decision-tree
  term: Decision tree
  aliases: [Decision-tree analysis]
  definition: "A diagram that sets out the options in a decision and the possible outcomes of each, with their probabilities and financial results, so that the expected value of each option can be calculated and compared."
  context: "A decision is drawn as a square (decision node) and each uncertain event as a circle (chance node), and the probabilities on the branches from each circle add up to 1. Working from right to left, the expected value at each chance node is calculated, each option's cost is subtracted, and the option with the highest net expected value is preferred on financial grounds. Its weaknesses are that probabilities and pay-offs are estimates, qualitative factors are left out, and an expected value is an average that will not occur in any single decision."
  example: "A publisher choosing between launching a magazine, launching a website or doing neither estimates the chance of high and low demand for each, and the pay-off in each case, and compares the net expected values."
  topics: [growth-and-evolution]
  subtopics: ['toolkit', '1.5']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [expected-value, decision-node, chance-node]

- id: decision-node
  term: Decision node
  definition: "A square on a decision tree marking a point where the manager must choose between options; each line leaving it is one option."
  context: "Decision nodes are under the decision-maker's control, unlike chance nodes, whose outcomes are uncertain. The cost of each option is written on its branch and subtracted from that option's expected value. When the tree is worked back, the option with the best net expected value is chosen at the decision node and the others are crossed out."
  example: "A decision node at the start of a tree shows a farmer's three options: plant wheat, plant maize or leave the field unplanted for a season."
  topics: [growth-and-evolution]
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [decision-tree, chance-node, expected-value]

- id: chance-node
  term: Chance node
  definition: "A circle on a decision tree marking a point where the outcome is uncertain; each line leaving it is a possible outcome, labelled with its probability."
  context: "The probabilities on the branches from a chance node must add up to 1 (or 100%). The expected value at a chance node is found by multiplying each outcome's financial result by its probability and adding the results. The business cannot control which outcome occurs; it can only estimate the chances."
  example: "After the option 'open in a new city', a chance node splits into high demand with a probability of 0.6 and low demand with a probability of 0.4."
  topics: [growth-and-evolution]
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [decision-tree, decision-node, expected-value]

# ---------- Descriptive statistics (SL/HL) ----------

- id: descriptive-statistics
  term: Descriptive statistics
  definition: "Measures and charts that summarize and present a set of data: in the guide, the mean, mode, median, quartiles and standard deviation, and bar charts, pie charts and infographics."
  context: "Managers use them to describe performance, spot patterns and make comparisons, such as sales by store or pay across a workforce. The mean, median and mode show what is typical, while quartiles and standard deviation show how spread out the data are; bar charts compare separate items, pie charts show how a whole is divided, and infographics combine images and numbers to make a point quickly. The right choice depends on the data: one extreme value can distort the mean, and a striking chart can mislead if its scale or selection is chosen to persuade."
  example: "An HR manager summarizes staff absence with the mean and median days absent per employee, the spread using quartiles, and a bar chart of absence by department."
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [mean, median, mode, quartiles, standard-deviation]

- id: mean
  term: Mean
  aliases: [Arithmetic mean]
  definition: "A measure of the centre of a data set, found by sharing the total of all the values equally among them."
  context: "The mean uses every value, which makes it useful for totals and planning, but extreme values (outliers) pull it up or down, so it can misrepresent what is typical. When data are skewed, such as pay in a firm with a few very high earners, the median is often a better guide."
  example: "Five sales staff sell $20,000, $22,000, $24,000, $25,000 and $59,000 in a month: the mean is $150,000 ÷ 5 = $30,000, higher than four of the five figures because of one high seller."
  formula: "Mean = sum of all values ÷ number of values"
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [median, mode, descriptive-statistics, standard-deviation]

- id: median
  term: Median
  definition: "The value that splits an ordered data set into two halves, with as many values above it as below; for an even number of values, it lies halfway between the two middle ones."
  context: "Extreme values do not affect the median, so it often describes the typical value better than the mean when data are skewed. It is also the second quartile. It ignores how far the other values lie from it, so it says nothing about spread."
  example: "For monthly sales of $20,000, $22,000, $24,000, $25,000 and $59,000, the median is the third value, $24,000, which describes the typical salesperson better than the mean of $30,000."
  formula: "Position of the median = (n + 1) ÷ 2, where n is the number of values arranged in order"
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [mean, mode, quartiles, descriptive-statistics]

- id: mode
  term: Mode
  definition: "The value or category that occurs more often than any other in a set of data, such as the best-selling shoe size."
  context: "The mode is the only average that works for categories, such as the most popular colour, which makes it useful for stock decisions. A data set may have no mode or several, and the mode may lie far from the centre of the data."
  example: "A shoe shop sells sizes 38, 39, 39, 40, 41 and 39 in an hour; the mode is size 39, so it reorders more of that size."
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [mean, median, descriptive-statistics]

- id: quartiles
  term: Quartiles
  aliases: [Quartile, Interquartile range]
  definition: "The three values that divide an ordered set of data into four equal parts: the lower quartile (Q1), the median (Q2) and the upper quartile (Q3)."
  context: "A quarter of the values lie below Q1 and a quarter above Q3, so the middle half of the data lies between them. The interquartile range measures the spread of that middle half and, unlike the full range, is not distorted by extreme values. Businesses use quartiles to compare performance, for example rewarding staff in the top quartile or reviewing stores in the bottom one."
  example: "If a chain's weekly store sales have a lower quartile of $18,000 and an upper quartile of $30,000, the middle half of its stores sell between those amounts and the interquartile range is $12,000."
  formula: "Interquartile range = upper quartile (Q3) − lower quartile (Q1)"
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [median, standard-deviation, descriptive-statistics]

- id: standard-deviation
  term: Standard deviation
  definition: "A measure of how widely the values in a data set are spread around their mean: the larger the standard deviation, the more the values vary."
  context: "It is calculated from how far each value lies from the mean, so it uses all the data, and extreme values increase it. Two products can have the same mean weekly sales but very different standard deviations, and the one with the larger figure is harder to plan production and stock for. It is expressed in the same units as the data."
  example: "Two cafés both average 200 customers a day; one varies between 190 and 210 and the other between 100 and 300, so the second has a much larger standard deviation and needs more flexible staffing."
  formula: "Standard deviation = √(Σ(x − mean)² ÷ n), where x is each value and n is the number of values"
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: measure
  provenance: subject-knowledge
  related: [mean, quartiles, descriptive-statistics]

# ---------- Circular business models (SL/HL) ----------

- id: circular-business-models
  term: Circular business models
  definition: "Ways of organizing a business so that products and materials stay in use for as long as possible and waste is designed out, instead of following a take, make, use and throw away pattern."
  context: "The guide lists five: circular supply models, resource recovery models, product life extension models, sharing models and product service system models. They put the key concept of sustainability into practice, and can cut material costs, attract customers, staff and investors and prepare a business for tighter environmental rules. Changing a business model takes investment and time, and not every customer will pay more, or accept owning less, for environmental reasons."
  example: "A furniture company leases desks to offices, collects them at the end of each contract, refurbishes and leases them again, and recycles the parts it cannot reuse."
  topics: []
  subtopics: ['toolkit', '1.3']
  level: SL/HL
  category: tool
  provenance: subject-knowledge
  related: [circular-supply-model, resource-recovery-model, product-life-extension-model, sharing-model, product-service-system-model, corporate-social-responsibility]

- id: circular-supply-model
  term: Circular supply model
  definition: "A circular business model built on inputs that can be regrown, composted or recycled, such as plant-based materials or recycled metal, in place of new raw materials taken from the earth."
  context: "It changes what goes into a product rather than what happens to it after use. It reduces dependence on finite resources and their price swings, although the alternative materials can cost more or perform differently at first."
  example: "A packaging firm switches from plastic trays to trays grown from mushroom-based material that customers can compost."
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [circular-business-models, resource-recovery-model, product-life-extension-model]

- id: resource-recovery-model
  term: Resource recovery model
  definition: "A circular business model that captures value from waste: used products, scraps and by-products are collected and processed into materials or energy that can be used again."
  context: "It turns a cost, waste disposal, into an input or a source of revenue, and can be applied to a business's own waste or to used products collected from customers. Success depends on collecting enough waste of the right quality at a reasonable cost."
  example: "A carpet maker buys old fishing nets from coastal communities and recycles them into yarn for new carpet tiles."
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [circular-business-models, circular-supply-model, product-life-extension-model]

- id: product-life-extension-model
  term: Product life extension model
  definition: "A circular business model that keeps products in use for longer through durable design, repair, maintenance, upgrading, refurbishment and resale."
  context: "It slows the rate at which new products and materials are needed, and can create new revenue from repairs, spare parts and second-hand sales. It can reduce sales of new products, so it suits businesses that can earn from services or from a reputation for durability."
  example: "A phone maker designs handsets with replaceable batteries and screens, sells repair kits and buys back old phones to refurbish and resell."
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [circular-business-models, product-service-system-model, sharing-model]

- id: sharing-model
  term: Sharing model
  definition: "A circular business model in which people pay to use, borrow or rent items owned by others, often arranged through an app or website, so that each item serves many users rather than one."
  context: "It raises how intensively each product is used, which cuts the resources needed per use, and the platform usually earns a fee or commission for each match. Trust, insurance, maintenance and regulation are its main challenges."
  example: "A neighbourhood app lets residents rent drills, ladders and camping gear to each other for a small fee, of which the app keeps a share."
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [circular-business-models, product-service-system-model, product-life-extension-model]

- id: product-service-system-model
  term: Product service system model
  aliases: [Product as a service]
  definition: "A circular business model in which customers pay for the use or performance of a product, through leasing, renting or paying per use, while the business keeps ownership of the product."
  context: "Because the business still owns the product, it earns more the longer the product lasts, so it has a reason to make it durable, efficient and easy to repair and recycle. Customers avoid large up-front costs and maintenance, and the business gains regular revenue and long customer relationships. Some customers prefer to own outright, and the business must finance the products it keeps."
  example: "A lighting company sells 'light as a service' to offices: it installs and maintains the lamps, charges a monthly fee and takes the lamps back for recycling."
  topics: []
  subtopics: ['toolkit']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [circular-business-models, sharing-model, product-life-extension-model]

# ---------- Ansoff matrix (SL/HL): the two directions not yet defined ----------

- id: market-penetration
  term: Market penetration
  definition: "Growth by selling more of existing products in existing markets, the lowest-risk direction in the Ansoff matrix."
  context: "It is achieved by winning customers from rivals, attracting new users or persuading current customers to buy more, often through pricing, promotion, loyalty schemes or wider distribution. The risk is low because the business knows its products and customers, but growth is limited once the market is saturated, and aggressive tactics can provoke a price war."
  example: "A local gym offers cheaper off-peak memberships and a reward for referring a friend, to sign up more people in its own town."
  topics: [growth-and-evolution]
  subtopics: ['toolkit', '1.5']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [ansoff-matrix, product-development, market-development, diversification]

- id: product-development
  term: Product development
  definition: "Growth by selling new or improved products in existing markets, one of the four directions in the Ansoff matrix."
  context: "It builds on what the business knows about its customers, but carries the cost and risk of developing products that may not succeed. It suits markets where tastes and technology change quickly. It is riskier than market penetration but usually less risky than diversification."
  example: "A yoghurt maker launches a high-protein range for the supermarkets that already stock its products."
  usage:
    general: "Also used for the whole process of designing and launching a new product, from first idea to sale."
    syllabus: "In the Ansoff matrix it names a direction of growth: new products for existing markets."
  topics: [growth-and-evolution]
  subtopics: ['toolkit', '1.5']
  level: SL/HL
  category: strategy
  provenance: subject-knowledge
  related: [ansoff-matrix, market-penetration, market-development, diversification]

# ---------- Gantt chart (HL only) ----------

- id: gantt-chart
  term: Gantt chart
  definition: "A bar chart that shows the tasks of a project against a time scale, with each bar showing when a task starts and how long it lasts."
  context: "Gantt charts make it easy to see which tasks overlap, which must wait for others and whether a project is on schedule, and progress can be shaded in as work is done. They are simple to read and share, but show dependencies less clearly than critical path analysis and do not on their own identify the critical path. The guide lists the Gantt chart as an HL-only tool."
  example: "A school's events team plans a concert with bars for booking the hall, selling tickets, rehearsals and building the stage, and checks each week whether any task has fallen behind."
  topics: []
  subtopics: ['toolkit']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [critical-path-analysis, critical-path, business-plan]

# ---------- Porter's generic strategies (HL only) ----------

- id: porters-generic-strategies
  term: "Porter's generic strategies"
  definition: "Michael Porter's framework of three broad ways a business can gain a competitive advantage: cost leadership (being the lowest-cost producer in the market), differentiation (offering something customers value as distinctive) and focus (applying either approach to a narrow segment, as cost focus or differentiation focus)."
  context: "The choice rests on two questions: does the business compete on low cost or on being different, and does it target the whole market or a niche? Porter argued that a business trying to do everything risks being 'stuck in the middle', with neither the lowest costs nor a clear difference. Critics point out that some successful businesses combine low cost with differentiation, and that any advantage can be copied in time."
  example: "In one city, a hotel competes on the lowest room prices (cost leadership), another on luxury and service (differentiation) and a third only on rooms designed for business travellers (differentiation focus)."
  topics: []
  subtopics: ['toolkit']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [strategy, ansoff-matrix, bcg-matrix, swot-analysis]

# ---------- Hofstede's cultural dimensions (HL only) ----------

- id: hofstedes-cultural-dimensions
  term: "Hofstede's cultural dimensions"
  definition: "Geert Hofstede's framework for comparing national cultures on six dimensions: power distance, individualism versus collectivism, masculinity versus femininity, uncertainty avoidance, long-term versus short-term orientation, and indulgence versus restraint."
  context: "Each dimension describes a tendency in a society: high power distance means people accept large differences in status and authority, for example, and high uncertainty avoidance means a preference for rules and clear instructions. Businesses use the framework to anticipate differences in management style, motivation, communication and marketing when they work across countries, merge with foreign firms or lead diverse teams. It describes national averages, not individuals, and critics argue that it oversimplifies cultures that change over time."
  example: "A company opening an office in a country with high power distance expects staff to look to senior managers for decisions, so it introduces team-based decision-making gradually."
  topics: []
  subtopics: ['toolkit']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [multinational-company, globalization, host-country]

# ---------- Contribution (HL only) ----------

- id: contribution-analysis
  term: Contribution analysis
  definition: "Using contribution, the amount each unit, product or order adds towards fixed or indirect costs and then profit, to support decisions such as whether to make or buy, which products to keep and whether to accept a special order."
  context: "The guide's contribution tool covers make-or-buy analysis, contribution costing and absorption costing. Its central idea is that a product or order which covers its variable costs makes a positive contribution, which may justify keeping or accepting it in the short run even when a full-cost calculation shows a loss. In the long run, total contribution must cover all fixed costs for the business to make a profit, and qualitative factors such as quality, reputation and capacity also count."
  example: "A furniture maker finds that each stool contributes $8 towards fixed costs, so it keeps making stools even though a share of factory overheads makes them look unprofitable."
  formula: "Contribution per unit = selling price − variable cost per unit; total contribution = contribution per unit × units sold; profit = total contribution − fixed costs"
  topics: [costs-and-revenues]
  subtopics: ['toolkit']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [contribution, special-order, make-or-buy-analysis, contribution-costing, absorption-costing]

- id: make-or-buy-analysis
  term: Make-or-buy analysis
  definition: "A comparison of the cost of producing a good or component within the business with the cost of buying it from an outside supplier, used to choose between the two."
  context: "On cost alone, the business makes the item if the cost to make is lower than the cost to buy, but only costs that change with the decision should count: fixed costs that will be paid anyway are not saved by buying in. Qualitative factors often decide the matter, such as quality control, reliability of supply, spare capacity, protecting know-how and the effect on employees. It connects to cost to make and cost to buy in subtopic 5.6 and to outsourcing in 5.4."
  example: "A bakery needs 10,000 boxes a month: buying them costs $0.30 each ($3,000), while making them needs a $1,200 machine lease plus $0.20 of materials a box ($3,200), so on cost alone it should buy them."
  formula: "Cost to buy = price per unit × quantity; cost to make = fixed costs + (variable cost per unit × quantity)"
  topics: []
  subtopics: ['toolkit']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [contribution-analysis, contribution, fixed-cost, variable-cost]

- id: contribution-costing
  term: Contribution costing
  definition: "A costing method that charges each product, department or order only with the costs it causes (its variable or direct costs) and treats fixed or indirect costs as costs of the business as a whole, so that each part is judged by the contribution it makes towards them."
  context: "Because it avoids sharing out overheads on an arbitrary basis, it suits short-term decisions such as keeping a product, accepting a special order or closing a department: dropping a product with a positive contribution reduces total profit, since the fixed costs it helped to cover still have to be paid. Its limitation is that, in the long run, prices must cover all costs, and contribution costing alone does not show whether they do."
  example: "A shop's clothing department takes $200,000 in revenue against $150,000 of costs it causes directly, contributing $50,000 towards the shop's shared costs, so closing it would cut profit even if it looks loss-making once the rent is shared out."
  usage:
    general: "In management accounting it is usually called marginal or variable costing, and it separates variable from fixed costs."
    syllabus: "The guide names it contribution costing, under the HL contribution tool; course materials often apply it to direct and indirect costs as well as to variable and fixed costs."
  topics: [costs-and-revenues]
  subtopics: ['toolkit']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [absorption-costing, contribution-analysis, contribution, indirect-cost, special-order]

- id: absorption-costing
  term: Absorption costing
  definition: "A costing method that shares out all of a business's costs, including its indirect costs (overheads), among its products, departments or cost centres, so that each carries a full cost and shows its own profit or loss."
  context: "Indirect costs are allocated on a chosen basis, such as each product's share of sales, floor space or labour hours. It helps in setting prices that cover all costs and in reporting the profit of each part of the business, but the result depends on the basis chosen, so a product can look loss-making on one basis and profitable on another. For decisions such as dropping a product, contribution costing is usually more reliable."
  example: "A shop shares its $60,000 rent among three departments according to floor space, so the clothing department, which uses half the floor, is charged $30,000."
  topics: []
  subtopics: ['toolkit']
  level: HL
  category: finance
  provenance: subject-knowledge
  related: [contribution-costing, contribution-analysis, indirect-cost, direct-cost]

# ---------- Critical path analysis (HL only) ----------

- id: critical-path-analysis
  term: Critical path analysis (CPA)
  aliases: [CPA, Network analysis]
  definition: "A project-planning tool that shows a project's activities as a network, in the order they must happen, to find the shortest time in which the project can be completed and the activities that cannot be delayed without delaying it."
  context: "Each node records its number, the earliest start time (EST) of the activities that leave it and the latest finish time (LFT) of the activities that lead into it. From these the critical path and the float of every activity can be found, so managers know where to concentrate resources and which activities can wait. The guide expects HL students to complete and analyse a diagram they are given, identify the critical path and calculate free and total float, but not to draw the network themselves."
  example: "A firm opening a new shop maps activities such as signing the lease, refitting, hiring staff and stocking shelves, and finds that the refit is on the critical path, so any delay to it delays the opening."
  topics: []
  subtopics: ['toolkit']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [critical-path, total-float, free-float, gantt-chart]

- id: critical-path
  term: Critical path
  definition: "The sequence of activities in a project that takes longest from start to finish, and so sets the shortest possible duration of the whole project."
  context: "Activities on the critical path have zero total float: if any of them is delayed, the whole project is delayed. Managers watch critical activities closely and may move resources to them from activities that have float. A project can have more than one critical path, and the critical path can change if another activity overruns by more than its float."
  example: "If activities A, C and F, taking 4, 6 and 5 days, must follow one another and every other route through the network is shorter, then A, C and F form the critical path and the project takes at least 15 days."
  topics: []
  subtopics: ['toolkit']
  level: HL
  category: operations
  provenance: subject-knowledge
  related: [critical-path-analysis, total-float, free-float]

- id: total-float
  term: Total float
  definition: "The amount of time an activity can be delayed, or can overrun, without delaying the completion of the whole project."
  context: "It is calculated from the activity's duration, the earliest start time at its start node and the latest finish time at its end node. Activities with zero total float are critical. Total float can be shared along a chain of activities, so using it up on one activity can leave less for those after it."
  example: "An activity that can start on day 6 at the earliest, lasts 3 days and must finish by day 12 has a total float of 12 − 3 − 6 = 3 days."
  formula: "Total float = latest finish time − duration − earliest start time"
  topics: []
  subtopics: ['toolkit']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [free-float, critical-path, critical-path-analysis]

- id: free-float
  term: Free float
  definition: "The amount of time an activity can be delayed without delaying the earliest start of the activity that follows it."
  context: "Free float can never be larger than total float. It matters when the next activity uses people or equipment booked for a particular day: using up free float disturbs no one else's schedule, while using up the rest of the total float pushes later activities back. Critical activities have zero free float as well as zero total float."
  example: "An activity that can start on day 6 and lasts 3 days, followed by an activity that cannot start before day 10, has a free float of 10 − 3 − 6 = 1 day."
  formula: "Free float = earliest start time of the next activity − duration − earliest start time of this activity"
  topics: []
  subtopics: ['toolkit']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [total-float, critical-path, critical-path-analysis]

# ---------- Simple linear regression (HL only) ----------

- id: simple-linear-regression
  term: Simple linear regression
  aliases: [Linear regression]
  definition: "A statistical method that fits a straight line to data on two variables, an independent variable (x) and a dependent variable (y), to describe how y tends to change as x changes and to make forecasts."
  context: "The data are first plotted on a scatter diagram; the line of best fit then summarizes the relationship, and correlation describes how strong it is. Businesses use it to estimate, for example, how sales respond to advertising or temperature, and to extrapolate trends. Its limits are that a relationship does not prove cause, it assumes the relationship is a straight line, and forecasts far beyond the range of the data are unreliable."
  example: "A café plots daily iced-drink sales against the day's temperature over a summer, fits a line of best fit and uses it to estimate sales, and staffing, for a day forecast to be very hot."
  formula: "y = a + bx, where a is the intercept and b is the gradient, the change in y for each one-unit change in x"
  topics: []
  subtopics: ['toolkit']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [scatter-diagram, line-of-best-fit, correlation, extrapolation]

- id: scatter-diagram
  term: Scatter diagram
  aliases: [Scatter graph, Scatter plot]
  definition: "A graph that plots pairs of values for two variables as points, with the independent variable on the horizontal (x) axis and the dependent variable on the vertical (y) axis, to show whether they are related."
  context: "The pattern of the points shows the direction and strength of any correlation, and reveals outliers that a single summary number would hide. It is the first step in simple linear regression. Points that follow a pattern suggest a relationship but do not prove that one variable causes the other."
  example: "A sales manager plots each salesperson's number of client visits against the sales they made, to see whether more visits go with more sales."
  topics: []
  subtopics: ['toolkit']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [simple-linear-regression, correlation, line-of-best-fit]

- id: line-of-best-fit
  term: Line of best fit
  definition: "The straight line that most closely follows the pattern of points on a scatter diagram, with the points balanced as evenly as possible above and below it."
  context: "It can be drawn by eye or calculated by regression, and a well-placed line passes through the point given by the mean of x and the mean of y. Reading values from the line within the range of the data gives estimates; extending the line beyond that range is extrapolation. The closer the points lie to the line, the stronger the correlation and the more reliable the estimates."
  example: "On a scatter diagram of monthly advertising spending against sales, a line of best fit rising from left to right summarizes the positive relationship."
  topics: []
  subtopics: ['toolkit']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [scatter-diagram, simple-linear-regression, extrapolation, correlation]

- id: correlation
  term: Correlation
  definition: "The extent to which two variables are linearly related: with positive correlation they tend to rise together, with negative correlation one tends to fall as the other rises, and with no correlation there is no straight-line pattern."
  context: "Correlation is described by its direction (positive or negative) and its strength (strong when the points lie close to a line, weak when they are widely scattered), and can be measured by a correlation coefficient between −1 and +1. Correlation does not prove causation: two variables may move together by coincidence or because a third factor drives both. A strong correlation makes forecasts from a line of best fit more reliable, but never certain."
  example: "Sales of umbrellas show a strong positive correlation with rainfall, while sales of ice cream show a negative correlation with it."
  topics: []
  subtopics: ['toolkit']
  level: HL
  category: measure
  provenance: subject-knowledge
  related: [scatter-diagram, line-of-best-fit, simple-linear-regression, extrapolation]

- id: extrapolation
  term: Extrapolation
  definition: "Projecting a trend or a line of best fit beyond the data already collected, for example into future periods, to produce a forecast."
  context: "It is quick and uses only data the business already holds, which makes it a common basis for sales forecasts. Its weakness is the assumption that the past pattern will continue: changes in the market, the economy or competition can break the trend, and the further ahead the forecast, the less reliable it becomes. It works best combined with judgement about what might change."
  example: "A bike-hire firm whose rentals rose steadily for four years extends the trend to forecast next year's rentals, then lowers the figure because a rival is opening nearby."
  topics: []
  subtopics: ['toolkit', '4.3']
  level: HL
  category: tool
  provenance: subject-knowledge
  related: [line-of-best-fit, simple-linear-regression, correlation]

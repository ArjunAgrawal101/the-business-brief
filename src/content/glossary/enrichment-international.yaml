# Glossary: international business terms beyond the IB course.
# Every entry is enrichment (provenance: enrichment): it names no IB subtopic, never carries
# the ib qualification, and links to the IB terms it builds on through related. Definitions,
# explanations and examples are the platform's own words; every business named is fictional.
# Entries are in alphabetical order of term.

- id: comparative-advantage
  term: "Comparative advantage"
  definition: "The ability of a country, region or business to produce a good or service at a lower opportunity cost than others, which makes specialization and trade worthwhile for both sides."
  simple: "Being relatively better at making something, not necessarily the best, so that it pays to specialize in it and trade for other things."
  technical: "The principle, associated with David Ricardo, shows that trade can benefit both partners even when one is more efficient at everything, as long as their opportunity costs differ. It underlies the case for free trade and the international division of production; critics point to the costs of adjustment for workers and industries, and to advantages that are created by policy and investment rather than given by nature."
  example: "With the same resources, one fictional region can make a machine or 50 shirts, and another a machine or 20 shirts. The first gives up 50 shirts for each machine and the second only 20, so the second has the comparative advantage in machines and the first in shirts."
  misconceptions:
    - claim: "A country should only make what it makes most efficiently in absolute terms."
      correction: "The gains from trade come from differences in opportunity cost, so a country can gain by specializing even where it is not the most efficient producer."
  category: concept
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [opportunity-cost, globalization, trade-barriers, trading-bloc]

- id: country-of-origin-effect
  term: "Country of origin effect"
  definition: "The influence that the country where a product is made, designed or branded has on how consumers judge its quality and value."
  simple: "When people think a product is better or worse because of the country it comes from."
  technical: "A positive image for a product category, such as a country known for engineering or for fashion, supports premium pricing; a negative one can be a barrier to entry. The effect differs by product and by market, changes over time, and is complicated by global supply chains, in which the design, the parts and the assembly may come from different countries."
  example: "A fictional cheese maker puts the name of its mountain region prominently on its packaging in export markets, where buyers associate the region with traditional cheese making."
  misconceptions:
    - claim: "A strong country of origin image helps every product from that country."
      correction: "It applies to particular categories of product; a country famous for one product may have no advantage in others."
  category: marketing
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [international-marketing, brand-image, premium-pricing, glocalization]

- id: exchange-rate-risk
  term: "Exchange rate risk"
  aliases: ["Currency risk", "Foreign exchange exposure"]
  definition: "The risk that changes in exchange rates will reduce a business's profit, cash flow or the value of its assets, when it buys, sells, borrows or invests in other currencies."
  simple: "The danger that a change in the value of one currency against another will cost a business money, for example when it has agreed to pay a foreign supplier and its own currency then falls."
  technical: "Transaction exposure affects particular deals agreed in a foreign currency; translation exposure affects the value of overseas assets and profits when the accounts are converted; economic exposure affects long-run competitiveness, even for firms that trade only at home. It is managed by invoicing in the home currency, matching costs and revenues in the same currency, and hedging with forward contracts or options."
  example: "A fictional importer agrees to pay a supplier 100,000 euros in three months; if its own currency weakens so that each euro costs 10% more, its bill in its own currency rises by 10%."
  misconceptions:
    - claim: "Only businesses that export or import face exchange rate risk."
      correction: "A firm that trades only at home can lose sales to foreign rivals when exchange rates make their goods cheaper."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [exchange-rate, hedging, international-marketing, multinational-company]

- id: greenfield-investment
  term: "Greenfield investment"
  aliases: ["Greenfield FDI"]
  definition: "A form of foreign direct investment in which a business builds new facilities from scratch in another country, rather than buying an existing business there, which is called a brownfield investment."
  simple: "When a company goes to another country and builds its own new factory or offices there from the ground up."
  technical: "Greenfield investment gives full control over the location, technology, design and culture, and creates new capacity and jobs, which host governments often encourage with incentives. It is slow and risky, because the firm must build local knowledge, networks and a workforce; buying an existing business is faster and brings these with it, along with the target's problems."
  example: "A fictional battery maker builds a new plant on an empty site abroad, a greenfield investment, choosing the location for its access to a port and a technical college."
  misconceptions:
    - claim: "Greenfield investment means building on an unused field."
      correction: "The term describes building new operations from scratch rather than buying existing ones, wherever the site is."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [foreign-direct-investment, market-entry-mode, wholly-owned-subsidiary, location-factors]

- id: hedging
  term: "Hedging"
  definition: "Taking a position, often through a financial contract, that offsets the risk of a loss from a change in prices, interest rates or exchange rates."
  simple: "Protecting a business against a price or a currency moving the wrong way, a bit like insurance, for example by fixing today the exchange rate it will pay in three months."
  technical: "Common instruments are forward contracts, which fix a future rate or price; futures, which are standard forward contracts traded on exchanges; options, which give the right but not the obligation to deal at a set rate, for a fee; and swaps. Natural hedges match costs and revenues in the same currency. Hedging reduces uncertainty, but it costs money and gives up gains if prices move favourably; it is the opposite of speculation."
  example: "The fictional importer buys a forward contract to purchase 100,000 euros in three months at a fixed rate, so it knows today what its bill will be in its own currency, whatever happens to the exchange rate."
  misconceptions:
    - claim: "Hedging is a way of making money from price changes."
      correction: "Hedging reduces risk by offsetting a loss with a gain; it gives up the chance of profiting from a favourable move."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [exchange-rate-risk, exchange-rate, contingency-planning, sensitivity-analysis]

- id: integration-responsiveness
  term: "Integration-responsiveness framework"
  aliases: ["Global, multidomestic and transnational strategies"]
  definition: "A framework for international strategy that weighs two pressures, for global integration (efficiency through standardization and scale) and for local responsiveness (adapting to each country), to choose between global, multidomestic, transnational and international strategies."
  simple: "A way of deciding how far a multinational should do things the same way everywhere, to save money, and how far it should adapt to each country, to suit local customers."
  technical: "Strong pressure for integration and little for responsiveness suggests a global strategy, with standard products and centralized production; the reverse suggests a multidomestic strategy, with independent country units; strong pressure for both suggests a transnational strategy, which tries to combine efficiency, local adaptation and learning between units; weak pressure for both suggests an international strategy, using home-country strengths abroad. It extends the course's standardized marketing and glocalization to the whole organization."
  example: "A fictional paint maker standardizes its chemistry and its factories worldwide but lets country managers choose the colours, packaging and retailers, a transnational approach."
  misconceptions:
    - claim: "Global firms should always standardize to cut costs."
      correction: "Where tastes, rules or channels differ strongly between countries, adapting can be worth more than the savings from standardizing."
  category: theory
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [standardized-marketing, glocalization, multinational-company, centralization, decentralization]

- id: market-entry-mode
  term: "Market entry mode"
  aliases: ["Entry mode", "Foreign market entry"]
  definition: "The way a business chooses to enter a foreign market, from exporting and licensing to franchising, a joint venture, an acquisition or a subsidiary of its own."
  simple: "How a business gets into a new country's market: by selling to it from home, by letting a local firm use its brand or technology, by partnering with a local firm, or by setting up its own operation there."
  technical: "The modes range along a spectrum of control, commitment and risk: exporting needs little investment but gives little control; licensing and franchising earn fees with limited control; joint ventures share risk and control; and wholly owned subsidiaries, built from scratch or bought, give full control at the highest cost and risk. The choice depends on the market's size and risk, the cultural distance, the firm's resources and the need to protect its know-how."
  example: "A fictional snack maker first exports to a neighbouring country through a distributor, then, once sales are proven, forms a joint venture with a local firm to build a factory there."
  misconceptions:
    - claim: "There is one best way to enter a foreign market."
      correction: "The right mode depends on how much control, investment and risk the business can accept in that market."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [exporting, licensing, franchising, joint-venture, wholly-owned-subsidiary, foreign-direct-investment]

- id: political-risk
  term: "Political risk"
  aliases: ["Country risk"]
  definition: "The risk that political decisions or events in a country, such as a change of government, new regulation or taxes, trade policy, seizure of assets or unrest, will harm a business's operations or investments there."
  simple: "The danger that a government's decisions, or political trouble in a country, will hurt a business, for example by changing the rules, raising taxes or seizing its property."
  technical: "Political risk ranges from broad risks that affect every firm, such as instability, conflict or controls on moving money, to narrow ones aimed at an industry or a firm, such as new licences or rules on local ownership. Businesses assess it through country analysis and STEEPLE, and manage it through local partners, spreading operations across countries, insurance and good relations with governments and communities."
  example: "A fictional telecoms company delays building a network abroad when the host government proposes that foreign firms must sell half of any local business to domestic investors."
  misconceptions:
    - claim: "Political risk only exists in unstable countries."
      correction: "Stable democracies also change taxes, trade rules and regulations in ways that can hurt foreign businesses."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [steeple-analysis, foreign-direct-investment, multinational-company, market-entry-mode]

- id: wholly-owned-subsidiary
  term: "Wholly owned subsidiary"
  aliases: ["Subsidiary"]
  definition: "A company that is entirely owned by another company, its parent, for example to run the parent's operations in a foreign country."
  simple: "A company owned 100% by another company, often set up to run its business in another country."
  technical: "Full ownership gives the parent complete control of strategy, quality and know-how, and all the profit, but the parent bears all the investment and risk, and local knowledge has to be built or bought. A subsidiary is legally separate from its parent, which limits the parent's liability, and its trade with the rest of the group raises the question of transfer pricing."
  example: "A fictional engineering firm sets up a wholly owned subsidiary abroad to build and service its machines there, keeping its designs within the group."
  misconceptions:
    - claim: "A subsidiary is the same as a branch."
      correction: "A subsidiary is a separate company with its own legal identity; a branch is part of the parent company itself."
  category: organization
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [multinational-company, foreign-direct-investment, market-entry-mode, transfer-pricing, limited-liability]

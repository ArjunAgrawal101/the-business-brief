# Glossary: entrepreneurship and start-up terms beyond the IB course.
# Every entry is enrichment (provenance: enrichment): it names no IB subtopic, never carries
# the ib qualification, and links to the IB terms it builds on through related. Definitions,
# explanations and examples are the platform's own words; every business named is fictional.
# Entries are in alphabetical order of term.

- id: bootstrapping
  term: "Bootstrapping"
  aliases: ["Self-funding"]
  definition: "Starting and growing a business with the founders' own money and the revenue the business earns, without outside investors."
  simple: "Building a business with your own savings and the money from your first customers, instead of bringing in investors."
  technical: "Bootstrapped firms keep full ownership and control and must find paying customers early, which enforces discipline. Their growth is limited by their cash, so they may lose a race against funded rivals in markets with strong network effects or economies of scale. Common techniques include pre-orders, customer deposits, low fixed costs and careful management of working capital."
  example: "The fictional founder of a bakery wholesaler starts by baking at night in a rented kitchen and uses each month's profit to buy the next piece of equipment."
  misconceptions:
    - claim: "Bootstrapped businesses stay small."
      correction: "Many grow large; they simply grow at the pace their own cash allows."
  category: finance
  qualifications: [secondary, undergraduate, mba, professional]
  provenance: enrichment
  related: [personal-funds, retained-profit, start-up, venture-capital, cash-flow]

- id: burn-rate
  term: "Burn rate"
  aliases: ["Cash burn"]
  definition: "The rate at which a business, usually a start-up that is not yet profitable, spends its cash reserves, measured per month."
  simple: "How much more money a start-up spends than it takes in each month. If it has $300,000 and burns $25,000 a month, its money lasts a year."
  technical: "Gross burn is the total monthly cash outflow; net burn is outflow minus inflow, the measure used to work out the runway. Investors watch it beside growth: a high burn can be justified if it buys fast, efficient growth, but a burn that rises faster than revenue signals trouble."
  example: "A fictional robotics start-up spends $80,000 a month and receives $30,000 from early customers, a net burn rate of $50,000 a month."
  formula: "Net burn rate = monthly cash outflows − monthly cash inflows"
  misconceptions:
    - claim: "A high burn rate is always bad."
      correction: "If the spending buys rapid, efficient growth towards profit, investors may accept it; what matters is what the cash buys and how long it lasts."
  category: finance
  qualifications: [undergraduate, mba, professional]
  frameworks: [cash-flow-forecast]
  provenance: enrichment
  related: [runway, cash-flow, cash-flow-forecast, venture-capital, start-up]

- id: cap-table
  term: "Capitalization table"
  aliases: ["Cap table"]
  definition: "A table showing who owns a company's shares, options and other securities, and what percentage each owner holds, including how ownership would change after new funding."
  simple: "A list of everyone who owns part of a company and how big their slice is. It changes every time the company sells new shares to investors."
  technical: "A cap table records the founders, employees with share options and the investors in each funding round, and models the dilution from new issues and option pools. Investors examine it to see whether the founders keep enough of a stake to stay motivated, and whether terms such as liquidation preferences change who is paid what when the company is sold."
  example: "The two fictional founders of a cycling app each own 500,000 of its 1,000,000 shares; after an investor buys 250,000 new shares, the cap table shows each founder at 40% and the investor at 20%."
  misconceptions:
    - claim: "Issuing new shares takes shares away from the founders."
      correction: "The founders keep their shares; their percentage falls because the total number of shares rises."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [share-capital, dilution, venture-capital, funding-round, shareholder]

- id: customer-acquisition-cost
  term: "Customer acquisition cost (CAC)"
  aliases: ["CAC", "Cost per acquisition"]
  definition: "The average cost of winning one new customer, found by dividing the marketing and sales spending in a period by the number of new customers gained."
  simple: "How much a business spends on advertising and selling, on average, to win each new customer."
  technical: "CAC = sales and marketing costs in a period ÷ new customers gained. It is judged against customer lifetime value: subscription businesses often look for a lifetime value of at least three times CAC, a rule of thumb rather than a law. An average across all channels hides the differences between them, so firms also measure it channel by channel."
  example: "A fictional online tutoring firm spends $45,000 on marketing in a quarter and gains 600 new customers, a CAC of $75."
  formula: "Customer acquisition cost = sales and marketing costs ÷ number of new customers"
  misconceptions:
    - claim: "A low CAC is always good."
      correction: "Cheap customers who leave quickly can be worth less than expensive ones who stay for years; CAC must be judged against lifetime value."
  category: measure
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [customer-lifetime-value, conversion-rate, unit-economics, promotional-mix]

- id: customer-lifetime-value
  term: "Customer lifetime value (CLV)"
  aliases: ["CLV", "Lifetime value", "LTV"]
  definition: "An estimate of the total contribution a business expects to earn from one customer over the whole of their relationship with it."
  simple: "How much a customer is worth to a business over all the years they keep buying, not just from one purchase."
  technical: "A simple form is CLV = average contribution per period × expected number of periods the customer stays; more careful versions discount future contributions and model churn. It justifies spending to acquire and keep customers, guides which segments to target, and is compared with the cost of acquiring them. It rests on forecasts of retention that can prove optimistic."
  example: "A fictional gym member pays $40 a month, of which $25 is contribution, and stays 24 months on average, a lifetime value of $600 before discounting."
  formula: "Customer lifetime value = average contribution per period × expected number of periods"
  misconceptions:
    - claim: "Lifetime value is the customer's total spending."
      correction: "It should count the contribution from that spending, after the costs of serving the customer, not the revenue alone."
  category: measure
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [customer-acquisition-cost, retention-rate, churn-rate, brand-loyalty, customer-loyalty-programme]

- id: dilution
  term: "Dilution"
  aliases: ["Equity dilution", "Share dilution"]
  definition: "The fall in existing shareholders' percentage ownership when a company issues new shares."
  simple: "When a company sells new shares, everyone who already owns shares ends up with a smaller percentage of the company, even though they still have the same number of shares."
  technical: "Dilution reduces each existing holder's share of the votes and of future profits, but not necessarily the value of their holding: if the new money makes the company worth more, a smaller slice can be worth more than before. Shareholders may have pre-emption rights to buy new shares first, and earnings per share are also reported on a diluted basis to show the effect of options and convertible securities."
  example: "A fictional founder who owns 600,000 of 1,000,000 shares holds 60%; after 500,000 new shares are issued to investors, she holds 40% of 1,500,000."
  misconceptions:
    - claim: "Dilution always makes existing shareholders poorer."
      correction: "Their percentage falls, but if the new money raises the company's value enough, their smaller slice can be worth more."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [share-capital, cap-table, earnings-per-share, shareholder, funding-round]

- id: exit-strategy
  term: "Exit strategy"
  aliases: ["Exit"]
  definition: "The planned way in which the owners or investors of a business will eventually turn their stake into cash, such as a sale to another company, a stock market listing or a sale to the managers."
  simple: "The plan for how the founders and investors will one day sell their share of the business and take their money out."
  technical: "Exit routes include a trade sale to a competitor or a larger firm, an initial public offering on a stock exchange, a sale to a private equity firm, a management or employee buyout, or passing the business on within a family. Venture investors need an exit to return money to their own funds, which shapes the growth they expect. A small business run for its owners' income may have no planned exit."
  example: "The fictional founders of a regional craft brewery plan to sell to their managers in five years, financed partly by a bank loan, to keep the business local."
  misconceptions:
    - claim: "Planning an exit means the founder does not care about the business."
      correction: "An exit plan tells investors how they will be repaid and can protect the business's future, for example through a sale to its managers."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [venture-capital, publicly-held-company, acquisition, succession-planning]

- id: funding-round
  term: "Funding round"
  aliases: ["Seed round", "Series A"]
  definition: "A distinct stage in which a start-up raises money from investors in exchange for shares, usually named seed, Series A, Series B and so on as the business grows."
  simple: "Each time a start-up asks investors for a large sum of money is called a round, starting with a small seed round and moving to larger rounds as the business proves itself."
  technical: "Each round sets a valuation and terms, dilutes the existing owners, and should fund the business to the milestones it needs for the next one. Early rounds often come from the founders, friends, business angels and crowdfunding; later ones from venture capital. A down round, at a lower valuation than the last, signals trouble and can hurt morale and the value of employees' options."
  example: "A fictional health app raises $500,000 in a seed round to build its product, then $5 million in a Series A once it has 20,000 paying users."
  misconceptions:
    - claim: "Raising a bigger round is always better."
      correction: "More money dilutes the founders more and raises expectations for the next valuation, so founders aim to raise what they need to reach the next milestone."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [venture-capital, business-angel, crowdfunding, dilution, pre-money-valuation]

- id: lean-start-up
  term: "Lean start-up"
  aliases: ["Lean startup"]
  definition: "An approach to building new businesses that treats a business idea as a set of assumptions to test quickly with real customers, through a cycle of building, measuring and learning."
  simple: "Starting a business by testing ideas cheaply and quickly with real customers, learning from what happens and changing the plan, instead of spending years on a perfect plan first."
  technical: "Popularized by Eric Ries, the approach builds minimum viable products to test the riskiest assumptions, measures what customers do rather than what they say, and decides whether to persevere or pivot. It borrows from lean production the idea of removing waste, here the waste of building what no one wants. It suits uncertain markets and fits less well where a product needs heavy upfront investment or regulatory approval."
  example: "A fictional team planning a pet-sitting service runs a week of advertisements pointing to a simple web page and takes 40 bookings before writing any software."
  misconceptions:
    - claim: "Lean start-up means spending as little as possible."
      correction: "It means not wasting effort on untested assumptions; once evidence supports an idea, a lean start-up may invest heavily."
  category: strategy
  qualifications: [secondary, undergraduate, mba, professional]
  frameworks: [business-model-canvas]
  provenance: enrichment
  related: [minimum-viable-product, pivot, product-market-fit, lean-production, business-plan]

- id: minimum-viable-product
  term: "Minimum viable product (MVP)"
  aliases: ["MVP"]
  definition: "The simplest version of a new product that can be released to real customers to test whether its main idea meets a need, with the least effort and cost."
  simple: "A first, basic version of a product, made quickly and cheaply, to find out whether people actually want it before spending a lot on making it perfect."
  technical: "In lean start-up thinking, an MVP is built to learn, not to impress: it tests the riskiest assumption, often whether customers will pay, and its results decide whether to persevere, change course or stop. It can be a working prototype, a simple website taking pre-orders, or a service delivered by hand behind the scenes. A product that is too minimal can give a false negative, so viable matters as much as minimum."
  example: "Before building an app, the fictional founders of a meal-planning service send 50 customers weekly plans by email for a month at a small charge; 32 renew, enough evidence to build the app."
  misconceptions:
    - claim: "An MVP is a low-quality product."
      correction: "It is limited in features, not in care; it must be good enough to test whether customers value the core idea."
  category: strategy
  qualifications: [secondary, undergraduate, mba, professional]
  provenance: enrichment
  related: [lean-start-up, product-market-fit, pivot, start-up, market-research]

- id: pivot
  term: "Pivot"
  definition: "A deliberate change in a start-up's strategy, such as its target customer, product, channel or revenue model, made in response to evidence that the original plan is not working."
  simple: "Changing direction when you learn that your first idea is not working, while keeping what you have learned and built, like a basketball player turning on one foot."
  technical: "In lean start-up language, a pivot is a structured change of course that tests a new fundamental assumption: a new customer segment, one feature turned into the whole product, a new channel or a new revenue model. Pivots are healthy when they are driven by evidence; repeated pivots without learning are a sign of a team without a clear direction."
  example: "A fictional start-up that built booking software for gyms finds that physiotherapy clinics use it more heavily and pay more, so it pivots to serve clinics."
  misconceptions:
    - claim: "A pivot means the start-up has failed."
      correction: "It means the team learned something important and changed course; many successful businesses pivoted early."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [lean-start-up, minimum-viable-product, product-market-fit, start-up]

- id: pre-money-valuation
  term: "Pre-money and post-money valuation"
  aliases: ["Pre-money valuation", "Post-money valuation"]
  definition: "The value placed on a company just before a new investment (pre-money) and just after it (post-money), which together set the share of ownership the investor receives."
  simple: "What a start-up is said to be worth before investors put their money in, and after. The difference is the new money."
  technical: "Post-money valuation = pre-money valuation + new investment, and the investor's share = investment ÷ post-money valuation. Valuations of young firms are negotiated rather than calculated, and a headline figure can be inflated by terms, such as liquidation preferences, that protect the investor."
  example: "An investor puts $1 million into a fictional robotics start-up at a pre-money valuation of $4 million: the post-money valuation is $5 million and the investor owns 20%."
  formula: "Post-money valuation = pre-money valuation + investment; investor's share = investment ÷ post-money valuation"
  misconceptions:
    - claim: "The investor's share is the investment divided by the pre-money valuation."
      correction: "It is the investment divided by the post-money valuation, which includes the new money."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [funding-round, dilution, cap-table, venture-capital]

- id: product-market-fit
  term: "Product-market fit"
  definition: "The point at which a product meets a real need in a market strongly enough that customers buy it, use it repeatedly and recommend it, so that growth comes from demand rather than pushing."
  simple: "When you have made something a group of people really want: they keep buying it, keep using it and tell their friends about it."
  technical: "Signs of product-market fit include high retention in cohort analysis, growth through recommendations, customers who would be very disappointed to lose the product, and a falling cost of acquiring customers. Start-ups are advised to find fit before they scale, because spending to grow a product without it burns cash on customers who leave."
  example: "A fictional language-learning app sees that 60% of the users who join in January are still active in April, and that most new users arrive through friends' invitations: strong signs of product-market fit."
  misconceptions:
    - claim: "Product-market fit is reached when the first customers buy."
      correction: "Early sales can come from novelty or friends; fit shows in repeat use, retention and recommendations over time."
  category: strategy
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [minimum-viable-product, retention-rate, cohort-analysis, lean-start-up, market-orientation]

- id: runway
  term: "Runway"
  aliases: ["Cash runway"]
  definition: "The number of months a business can keep operating before its cash runs out, at its current net burn rate and without new funding."
  simple: "How long a start-up can survive on the money it has left if nothing changes."
  technical: "Runway = cash available ÷ net monthly burn rate. Founders usually aim to raise new funding well before the runway ends, because fundraising takes months, and they extend it by cutting costs or raising revenue. The simple formula assumes a constant burn, so a cash flow forecast that models changing costs and revenue is more reliable."
  example: "The fictional robotics start-up holds $600,000 of cash and has a net burn of $50,000 a month, a runway of 12 months."
  formula: "Runway (months) = cash available ÷ net monthly burn rate"
  misconceptions:
    - claim: "A business with twelve months of runway can wait eleven months before raising money."
      correction: "Raising funds can take many months, so founders start well before the cash is nearly gone."
  category: finance
  qualifications: [undergraduate, mba, professional]
  frameworks: [cash-flow-forecast]
  provenance: enrichment
  related: [burn-rate, cash-flow-forecast, venture-capital, funding-round, closing-balance]

- id: total-addressable-market
  term: "Total addressable market (TAM)"
  aliases: ["TAM", "Serviceable addressable market"]
  definition: "The total revenue available for a product if it won every possible customer in its market, used to judge how large a business could become."
  simple: "How much money could be made if absolutely everyone who might want the product bought it from you. It shows the biggest the business could ever get."
  technical: "TAM is often narrowed to the serviceable addressable market, the part a business can reach with its model and geography, and the serviceable obtainable market, the share it can realistically win. It can be estimated top-down from market reports or bottom-up from customer numbers and prices; bottom-up estimates are usually more credible. Inflated TAM figures are a common weakness of start-up pitches."
  example: "Working bottom-up, a fictional app for driving instructors estimates 40,000 instructors in its country, each paying $120 a year: a total addressable market of $4.8 million a year."
  formula: "Total addressable market (bottom-up) = number of potential customers × annual revenue per customer"
  misconceptions:
    - claim: "A large addressable market means the business will be large."
      correction: "It shows the ceiling, not the result; the share actually won depends on competition, the product and how well the business is run."
  category: measure
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [market-size, market-share, target-market, market-research]

- id: unit-economics
  term: "Unit economics"
  definition: "The revenue and costs of a business measured per unit, such as per customer, per order or per product, to test whether each unit is profitable before the business grows."
  simple: "Checking whether a business makes or loses money on each single customer or sale. If every sale loses money, selling more makes things worse."
  technical: "Common measures are the contribution per order and, for subscription businesses, customer lifetime value compared with the cost of acquiring a customer. Healthy unit economics mean that growth adds profit; poor ones mean growth adds losses, however impressive revenue looks. They are contribution analysis, from the IB course, applied to customers and orders."
  example: "A fictional meal-kit company earns $60 a box, with variable costs of $48 and delivery of $9, a contribution of $3 a box: too thin to repay the $90 it spends to win each customer unless customers stay for at least 30 boxes."
  misconceptions:
    - claim: "Growing revenue fixes poor unit economics."
      correction: "If each sale loses money, growth increases the losses; the price or the costs per unit must change first."
  category: measure
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [contribution-per-unit, customer-acquisition-cost, customer-lifetime-value, break-even-analysis]

- id: venture-capital
  term: "Venture capital"
  aliases: ["VC", "Venture capitalist"]
  definition: "Finance invested in young, high-growth businesses by specialist funds in return for a share of ownership, with the aim of selling the stake later for a large gain."
  simple: "Money from professional investors who buy part of a promising young company, hoping it will grow so much that their share becomes worth many times what they paid."
  technical: "Venture capital funds raise money from institutions and invest in portfolios of start-ups, expecting many to fail and a few to return many times their cost, which is why they seek businesses that could grow very large. They take equity, often a seat on the board and protective rights, and exit through a sale or a stock market listing. It suits few businesses: steady, moderate-growth firms are better financed in other ways."
  example: "A fictional battery start-up gives up 25% of its shares to a venture capital fund in return for $4 million, and a partner from the fund joins its board."
  misconceptions:
    - claim: "Venture capital is a loan."
      correction: "It is equity: the investors buy part of the company and get their money back only if it is sold or listed for more."
  category: finance
  qualifications: [undergraduate, mba, professional]
  provenance: enrichment
  related: [business-angel, share-capital, funding-round, cap-table, exit-strategy]

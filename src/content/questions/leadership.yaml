# Original practice questions for 2.3 Leadership and management. Written for
# this platform; not IB examination questions. Marks are each question's own
# allocation. Level descriptors are not the IB's markbands.

- id: q-lead-p1-define
  title: Define laissez-faire leadership
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: leadership-and-management
  syllabus: ['2.3']
  commandTerm: Define
  ao: AO1
  marks: 2
  case: halden-distribution
  prompt: Define the term *laissez-faire leadership*.
  skills: [Precise definition]
  markscheme:
    kind: points
    points:
      - marks: 1
        text: A style in which the leader sets few rules and gives little direction.
      - marks: 1
        text: Decisions are left largely to the employees or the team.
  errors:
    - Describing laissez-faire leadership as having no leader at all.
  provenance: original-practice
  order: 201

- id: q-lead-p1-distinguish
  title: Management and leadership
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: leadership-and-management
  syllabus: ['2.3']
  commandTerm: Distinguish
  ao: AO2
  marks: 4
  case: halden-distribution
  prompt: Distinguish between management and leadership.
  skills: [Precise distinction]
  markscheme:
    kind: points
    points:
      - marks: 1
        text: Management is planning, organizing, directing and controlling resources so that work is done reliably towards objectives.
      - marks: 1
        text: Leadership is setting a direction and influencing and motivating people towards it.
      - marks: 2
        text: An explicit difference, for example that management copes with complexity in the present while leadership copes with change, or that a manager's influence comes mainly from position while a leader's comes from vision and trust.
  errors:
    - Two separate definitions with no stated difference.
    - Claiming that managers and leaders are always different people.
  provenance: original-practice
  order: 202

- id: q-lead-p1-explain
  title: Why the founder's style worked
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: leadership-and-management
  syllabus: ['2.3']
  commandTerm: Explain
  ao: AO2
  marks: 4
  case: halden-distribution
  exhibits: [ex-6]
  prompt: Explain why a paternalistic style may have suited Halden Distribution under its founder.
  skills: [Application of a leadership style, Causal explanation]
  markscheme:
    kind: points
    guidance: Award [1] for each relevant reason and [1] for its explanation in the context of Halden, up to [4].
    points:
      - marks: 2
        text: >
          A reason with its explanation in context. For example, the founder knew every employee and was trusted, so
          staff accepted decisions made for them and felt looked after, which built loyalty and low turnover.
      - marks: 2
        text: >
          A second reason with its explanation in context. For example, the work was stable and familiar before the new
          system, so there was little need for consultation or new skills, and centralized decisions were quick.
  errors:
    - Confusing paternalistic with democratic leadership.
    - Explaining the style in general without reference to Halden.
  provenance: original-practice
  order: 203

- id: q-lead-p2-turnover
  title: Labour turnover on the night shift
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-2
  topic: leadership-and-management
  syllabus: ['2.1', '2.3']
  commandTerm: Calculate
  ao: AO4
  marks: 2
  case: halden-distribution
  exhibits: [ex-2]
  prompt: Using Exhibit 2, calculate labour turnover for the night shift over the last twelve months.
  skills: [Labour turnover calculation]
  requiresCalculation: true
  markscheme:
    kind: calculation
    points:
      - marks: 1
        text: (28 ÷ 54) × 100
      - marks: 1
        text: = 51.9%
    answer: 51.9%.
  errors:
    - Dividing by the 58 employees on the night shift now instead of the average of 54.
  provenance: original-practice
  order: 204

- id: q-lead-p2-comment
  title: Two shifts, two turnover rates
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-2
  topic: leadership-and-management
  syllabus: ['2.1', '2.3']
  commandTerm: Comment
  ao: AO2
  marks: 4
  case: halden-distribution
  exhibits: [ex-2, ex-3, ex-5]
  prompt: Comment on the difference between day-shift and night-shift labour turnover at Halden Distribution.
  skills: [Interpretation of data, Judgement]
  markscheme:
    kind: points
    points:
      - marks: 1
        text: States the difference. Night-shift turnover of 51.9% is more than twice the day shift's 22.2%.
      - marks: 1
        text: Links it to evidence of a cause on the night shift, such as two hours of training against six, new team leaders, or low consultation.
      - marks: 1
        text: Notes a consequence, such as slower, less trained replacements, recruitment costs, or the effect on dispatch.
      - marks: 1
        text: Makes a judgement, for example that the site figure of 34.1% hides a problem concentrated on one shift, which needs a shift-specific response.
  errors:
    - Restating the two figures without judging what they mean.
  provenance: original-practice
  order: 205

- id: q-lead-p1-recommend
  title: How should Amara lead?
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: leadership-and-management
  syllabus: ['2.3']
  commandTerm: Recommend
  ao: AO3
  marks: 10
  case: halden-distribution
  exhibits: [ex-2, ex-3, ex-4, ex-5]
  prompt: Recommend a leadership approach for Amara Osei's first ninety days at Halden Distribution.
  skills: [Choice of style, Use of case evidence, Supported recommendation]
  requiresEvaluation: true
  markscheme:
    kind: levels
    guidance: Practice level descriptors written for this question, not the IB's markbands.
    levels:
      - marks: '0'
        descriptor: Nothing that addresses the question.
      - marks: 1-2
        descriptor: A style is named with little justification, or with justification that ignores the case.
      - marks: 3-4
        descriptor: A style is recommended with some reference to the case, but alternatives are not considered.
      - marks: 5-6
        descriptor: At least two approaches are compared using case evidence, and a recommendation is made with some support.
      - marks: 7-8
        descriptor: Approaches are weighed against the evidence by shift and against the deadline, with a well-supported recommendation.
      - marks: 9-10
        descriptor: As for 7 to 8, with a recommendation that states its conditions (for example, that the problem is skill rather than pay) and how the approach would change as the night shift develops.
    exemplar: >
      The evidence shows a problem concentrated on the night shift: turnover of 51.9% against 22.2%, two hours of
      training, new team leaders and only 21% feeling consulted. An autocratic approach would raise effort quickly but
      treat a skills gap as a discipline problem. A situational approach fits better: direction and training for the
      night shift, delegation to the experienced day-shift team leaders, and consultation on how the system is used. It
      depends on the problem being skill rather than pay, which the exit interviews support (four of twenty-four cited pay).
  errors:
    - Recommending one style for the whole site without considering the difference between the shifts.
    - Naming situational leadership without saying what Amara would do differently on each shift.
  provenance: original-practice
  order: 206

- id: q-lead-hl-decisions
  title: Scientific or intuitive decision-making? (HL)
  qualification: ib-dp-bm
  level: HL
  paperStyle: paper-1
  topic: leadership-and-management
  syllabus: ['2.3']
  commandTerm: Examine
  ao: AO3
  marks: 6
  case: halden-distribution
  stimulus: >
    Two weeks before peak season, a failed update takes Halden's scanners down on a night shift. 3,200 orders are
    queued, 2,000 of them Lumen Home's next-day orders, and the trucks leave at 6 a.m.
  prompt: Examine the case for scientific rather than intuitive decision-making on the night the scanners failed.
  skills: [Decision-making approaches, Assumptions, Judgement]
  requiresEvaluation: true
  markscheme:
    kind: levels
    guidance: Practice level descriptors written for this question, not the IB's markbands. Secondary sources place this content in 2.3 as HL only; that is unverified.
    levels:
      - marks: '0'
        descriptor: Nothing that addresses the question.
      - marks: 1-2
        descriptor: Some knowledge of scientific or intuitive decision-making, not applied to the night in question.
      - marks: 3-4
        descriptor: Both approaches applied to the night, with some reference to time pressure and to the client's priorities.
      - marks: 5-6
        descriptor: The case examined in depth, uncovering its assumptions (for example, that twenty minutes of analysis is affordable, or that Lumen Home's orders matter more than other clients'), with a supported judgement.
  errors:
    - Assuming that scientific decision-making is always better because it uses data.
    - Ignoring the time available, which is the main argument for intuition in a crisis.
  provenance: original-practice
  order: 207

# Original practice questions for 1.5 Growth and evolution. Written for this
# platform; not IB examination questions. Marks are each question's own
# allocation, set to the size of the task. Level descriptors are written for
# these questions and are not the IB's markbands.

- id: q-growth-p1-define
  title: Define franchising
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: growth-and-evolution
  syllabus: ['1.5']
  commandTerm: Define
  ao: AO1
  marks: 2
  case: marigold-kitchens
  prompt: Define the term *franchising*.
  skills: [Precise definition]
  markscheme:
    kind: points
    points:
      - marks: 1
        text: A business (the franchisor) allows another (the franchisee) to use its brand, products and business model.
      - marks: 1
        text: In return for payments, usually an initial fee and a continuing royalty.
    exemplar: Franchising is when a franchisor sells another business the right to trade under its brand and use its business model, in return for an initial fee and continuing royalties.
  errors:
    - Giving an example, such as McDonald's, instead of a definition.
    - Leaving out what the franchisee pays, which is what distinguishes franchising from a licence to sell a product.
  provenance: original-practice
  order: 101

- id: q-growth-p1-explain
  title: Diseconomies of scale after an acquisition
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: growth-and-evolution
  syllabus: ['1.5']
  commandTerm: Explain
  ao: AO2
  marks: 4
  case: marigold-kitchens
  exhibits: [ex-4, ex-5]
  prompt: With reference to Marigold Kitchens, explain **two** diseconomies of scale it could face if it acquired Tiffin Lane.
  skills: [Application to the case, Causal explanation]
  markscheme:
    kind: points
    guidance: >
      For each diseconomy, award [1] for identifying a relevant diseconomy and [1] for explaining how it would raise
      Marigold's average cost after the acquisition. Award at most [2] in total for an answer with no reference to
      Marigold or Tiffin Lane.
    points:
      - marks: 2
        text: >
          A first diseconomy, identified and explained in context. For example, communication: with ten restaurants in two
          cities and an investor, instructions pass through more layers, so recipe and standard changes take longer to
          reach every kitchen, raising waste and rework.
      - marks: 2
        text: >
          A second diseconomy, identified and explained in context. For example, motivation and culture: Tiffin Lane's
          staff, with turnover already at 46%, may resist new rules, so turnover and training costs rise; or coordination
          and control: standards are harder to hold across converted and original restaurants.
  errors:
    - Explaining economies of scale instead of diseconomies.
    - Describing a diseconomy without saying how it raises average cost.
    - Writing about any large business, with no reference to Marigold or Tiffin Lane.
  provenance: original-practice
  order: 102

- id: q-growth-p1-distinguish
  title: Joint venture or strategic alliance?
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: growth-and-evolution
  syllabus: ['1.5']
  commandTerm: Distinguish
  ao: AO2
  marks: 4
  case: marigold-kitchens
  prompt: Distinguish between a joint venture and a strategic alliance, using Marigold Kitchens' proposal from Sterling Malls.
  skills: [Precise distinction, Application to the case]
  markscheme:
    kind: points
    guidance: The difference must be stated as a difference. Two separate definitions with no stated difference earn at most [2].
    points:
      - marks: 1
        text: A joint venture creates a new business that the partners own together.
      - marks: 1
        text: A strategic alliance is an agreement to cooperate that creates no new jointly owned business.
      - marks: 1
        text: The defining difference is stated explicitly, for example joint ownership of a separate business, or the degree of commitment and shared control.
      - marks: 1
        text: The difference is applied to Marigold. Sterling's proposal is a joint venture because it creates a company owned 50:50; an alliance might be an agreement to promote each other's businesses without forming one.
  errors:
    - Defining the two terms separately and leaving the reader to find the difference.
    - Calling the Sterling proposal a strategic alliance.
  provenance: original-practice
  order: 103

- id: q-growth-p1-ansoff
  title: The Ansoff matrix and Marigold's options
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: growth-and-evolution
  syllabus: ['1.5']
  commandTerm: Apply
  ao: AO2
  marks: 4
  case: marigold-kitchens
  exhibits: [ex-3]
  prompt: Apply the Ansoff matrix to **two** of Marigold Kitchens' growth options.
  skills: [Use of a toolkit tool, Justification]
  markscheme:
    kind: points
    guidance: For each option, award [1] for a correct placement and [1] for a reason that says what is existing and what is new.
    points:
      - marks: 2
        text: >
          A first option placed and justified. For example, organic growth in Mumbai is market development, because the
          menu is the existing product and Mumbai is a new market.
      - marks: 2
        text: >
          A second option placed and justified. For example, buying Tiffin Lane is partly market penetration, because it
          increases Marigold's share of the Pune market it already serves.
  errors:
    - Placing franchising or the acquisition in a quadrant as if the method were the direction, without saying what is new.
    - A correct placement with no reason.
  provenance: original-practice
  order: 104

- id: q-growth-p2-tree
  title: Expected values for two routes
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-2
  topic: growth-and-evolution
  syllabus: ['1.5']
  commandTerm: Calculate
  ao: AO4
  marks: 4
  case: marigold-kitchens
  exhibits: [ex-8]
  prompt: Using Exhibit 8, calculate the expected value of organic growth and of franchising.
  skills: [Decision tree calculation, Clear working]
  requiresCalculation: true
  markscheme:
    kind: calculation
    points:
      - marks: 1
        text: 'Organic growth: (0.6 × ₹150m) + (0.4 × ₹60m) = ₹114m'
      - marks: 1
        text: Minus the ₹72m invested, an expected value of ₹42m
      - marks: 1
        text: 'Franchising: (0.6 × ₹95m) + (0.4 × ₹30m) = ₹69m'
      - marks: 1
        text: Minus the ₹10m invested, an expected value of ₹59m
    answer: Organic growth ₹42m; franchising ₹59m.
  errors:
    - Forgetting to subtract the money invested.
    - Adding the payoffs without weighting them by their probabilities.
  provenance: original-practice
  order: 105

- id: q-growth-p1-discuss
  title: Should Marigold franchise?
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: growth-and-evolution
  syllabus: ['1.5']
  commandTerm: Discuss
  ao: AO3
  marks: 10
  case: marigold-kitchens
  exhibits: [ex-3, ex-5, ex-6, ex-7]
  prompt: Discuss whether Marigold Kitchens should franchise.
  skills: [Balanced argument, Use of case evidence, Supported judgement]
  requiresEvaluation: true
  markscheme:
    kind: levels
    guidance: >
      Practice level descriptors written for this question, not the IB's markbands (which are in the Guide). Place the
      answer in the level that best describes it, then choose the mark within the level.
    levels:
      - marks: '0'
        descriptor: Nothing that addresses the question.
      - marks: 1-2
        descriptor: Some knowledge of franchising, with little or no reference to Marigold.
      - marks: 3-4
        descriptor: Knowledge of franchising applied to Marigold in places. The answer is one-sided, or lists advantages and disadvantages without weighing them.
      - marks: 5-6
        descriptor: Relevant arguments for and against, applied to the case evidence, with some weighing. The conclusion is weakly supported.
      - marks: 7-8
        descriptor: Balanced, well-applied arguments that use the evidence, such as the four inquirers able to fund a restaurant and the founder's aims, and a supported conclusion.
      - marks: 9-10
        descriptor: As for 7 to 8, with a judgement that weighs the arguments against Marigold's objectives, states what the conclusion depends on, and considers an alternative such as a pilot franchise or a stricter franchise system.
    exemplar: >
      For: franchising reaches Mumbai and Bengaluru fast with little of Marigold's capital (₹10m), and royalties add
      about ₹13.7m a year by year two. Against: quality would depend on twelve owners Meera did not train, which conflicts
      with her first aim; only four of forty-one inquirers could fund a restaurant, so the plan may need weaker or
      heavily indebted franchisees. Judgement: not as planned. A pilot of two franchises in one city, with a strict
      system, would test whether quality can be franchised before Marigold commits its brand to twelve.
  errors:
    - A list of advantages and a list of disadvantages, followed by a conclusion that could have been written first.
    - Counting franchisees' sales as Marigold's revenue.
    - A conclusion with no condition, such as "Marigold should franchise because it is cheap".
  provenance: original-practice
  order: 106

- id: q-growth-p3-mission
  title: Growing a social enterprise
  qualification: ib-dp-bm
  level: HL
  paperStyle: paper-3
  topic: growth-and-evolution
  syllabus: ['1.5', '1.2']
  commandTerm: Recommend
  ao: AO3
  marks: 10
  stimulus: >
    Annapurna Kitchens Trust (a fictional organization) is a social enterprise in Pune. It trains women from low-income
    households as professional cooks in a nine-month programme, funded by the canteen it runs for a hospital. Demand for
    its trainees is strong, and two more hospitals have asked for canteens. The board is choosing between two routes.
    It could open and run the two canteens itself, which would need a loan and new managers. Or it could license its
    model to the hospitals, which would run the canteens and pay the trust a fee, while the trust trains and places the
    cooks.
  prompt: Recommend which route Annapurna Kitchens Trust should take.
  skills: [Social and financial objectives, Supported recommendation, Conditions]
  requiresEvaluation: true
  markscheme:
    kind: levels
    guidance: >
      Written in the spirit of the HL social enterprise paper; it is not modelled on the structure of the real paper,
      which is described on the Exam Desk. Practice level descriptors written for this question, not the IB's markbands.
    levels:
      - marks: '0'
        descriptor: Nothing that addresses the question.
      - marks: 1-2
        descriptor: A route is chosen with little reasoning, or reasoning that ignores the trust's social purpose.
      - marks: 3-4
        descriptor: Some relevant reasoning about one route, with limited reference to the trust's mission or its finances.
      - marks: 5-6
        descriptor: Both routes considered, with reference to the mission and to finance, and a recommendation that is partly supported.
      - marks: 7-8
        descriptor: Both routes weighed against the trust's twin objectives, social and financial, with a clearly supported recommendation.
      - marks: 9-10
        descriptor: As for 7 to 8, with a recommendation that states its conditions and risks, for example how the trust would protect training quality and its income under a licence.
  errors:
    - Treating the trust as an ordinary business whose only aim is profit.
    - Recommending growth because it brings more revenue, without asking whether it serves the mission.
  provenance: original-practice
  order: 107

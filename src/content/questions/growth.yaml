# Original practice questions for 1.5 Growth and evolution. Written for this
# platform; not IB examination questions. Marks are each question's own
# allocation, set to the size of the task. Level descriptors are written for
# these questions and are not the IB's markbands.

- id: q-growth-p1-define
  title: Define franchising
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: growth-and-evolution
  syllabus: ['1.5']
  commandTerm: Define
  ao: AO1
  marks: 2
  case: marigold-kitchens
  prompt: Define the term *franchising*.
  skills: [Precise definition]
  markscheme:
    kind: points
    points:
      - marks: 1
        text: A business (the franchisor) allows another (the franchisee) to use its brand, products and business model.
      - marks: 1
        text: In return for payments, usually an initial fee and a continuing royalty.
    exemplar: Franchising is when a franchisor sells another business the right to trade under its brand and use its business model, in return for an initial fee and continuing royalties.
  errors:
    - Giving an example, such as McDonald's, instead of a definition.
    - Leaving out what the franchisee pays, which is what distinguishes franchising from a licence to sell a product.
  provenance: original-practice
  order: 101

- id: q-growth-p1-explain
  title: Diseconomies of scale after an acquisition
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: growth-and-evolution
  syllabus: ['1.5']
  commandTerm: Explain
  ao: AO2
  marks: 4
  case: marigold-kitchens
  exhibits: [ex-4, ex-5]
  prompt: With reference to Marigold Kitchens, explain **two** diseconomies of scale it could face if it acquired Tiffin Lane.
  skills: [Application to the case, Causal explanation]
  markscheme:
    kind: points
    guidance: >
      For each diseconomy, award [1] for identifying a relevant diseconomy and [1] for explaining how it would raise
      Marigold's average cost after the acquisition. Award at most [2] in total for an answer with no reference to
      Marigold or Tiffin Lane.
    points:
      - marks: 2
        text: >
          A first diseconomy, identified and explained in context. For example, communication: with ten restaurants in two
          cities and an investor, instructions pass through more layers, so recipe and standard changes take longer to
          reach every kitchen, raising waste and rework.
      - marks: 2
        text: >
          A second diseconomy, identified and explained in context. For example, motivation and culture: Tiffin Lane's
          staff, with turnover already at 46%, may resist new rules, so turnover and training costs rise; or coordination
          and control: standards are harder to hold across converted and original restaurants.
  errors:
    - Explaining economies of scale instead of diseconomies.
    - Describing a diseconomy without saying how it raises average cost.
    - Writing about any large business, with no reference to Marigold or Tiffin Lane.
  provenance: original-practice
  order: 102

- id: q-growth-p1-distinguish
  title: Joint venture or strategic alliance?
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: growth-and-evolution
  syllabus: ['1.5']
  commandTerm: Distinguish
  ao: AO2
  marks: 4
  case: marigold-kitchens
  prompt: Distinguish between a joint venture and a strategic alliance, using Marigold Kitchens' proposal from Sterling Malls.
  skills: [Precise distinction, Application to the case]
  markscheme:
    kind: points
    guidance: The difference must be stated as a difference. Two separate definitions with no stated difference earn at most [2].
    points:
      - marks: 1
        text: A joint venture creates a new business that the partners own together.
      - marks: 1
        text: A strategic alliance is an agreement to cooperate that creates no new jointly owned business.
      - marks: 1
        text: The defining difference is stated explicitly, for example joint ownership of a separate business, or the degree of commitment and shared control.
      - marks: 1
        text: The difference is applied to Marigold. Sterling's proposal is a joint venture because it creates a company owned 50:50; an alliance might be an agreement to promote each other's businesses without forming one.
  errors:
    - Defining the two terms separately and leaving the reader to find the difference.
    - Calling the Sterling proposal a strategic alliance.
  provenance: original-practice
  order: 103

- id: q-growth-p1-ansoff
  title: The Ansoff matrix and Marigold's options
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: growth-and-evolution
  syllabus: ['1.5']
  commandTerm: Apply
  ao: AO2
  marks: 4
  case: marigold-kitchens
  exhibits: [ex-3]
  prompt: Apply the Ansoff matrix to **two** of Marigold Kitchens' growth options.
  skills: [Use of a toolkit tool, Justification]
  markscheme:
    kind: points
    guidance: For each option, award [1] for a correct placement and [1] for a reason that says what is existing and what is new.
    points:
      - marks: 2
        text: >
          A first option placed and justified. For example, organic growth in Mumbai is market development, because the
          menu is the existing product and Mumbai is a new market.
      - marks: 2
        text: >
          A second option placed and justified. For example, buying Tiffin Lane is partly market penetration, because it
          increases Marigold's share of the Pune market it already serves.
  errors:
    - Placing franchising or the acquisition in a quadrant as if the method were the direction, without saying what is new.
    - A correct placement with no reason.
  provenance: original-practice
  order: 104

- id: q-growth-p2-tree
  title: Expected values for two routes
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-2
  topic: growth-and-evolution
  syllabus: ['1.5']
  commandTerm: Calculate
  ao: AO4
  marks: 4
  case: marigold-kitchens
  exhibits: [ex-8]
  prompt: Using Exhibit 8, calculate the expected value of organic growth and of franchising.
  skills: [Decision tree calculation, Clear working]
  requiresCalculation: true
  markscheme:
    kind: calculation
    points:
      - marks: 1
        text: 'Organic growth: (0.6 × ₹150m) + (0.4 × ₹60m) = ₹114m'
      - marks: 1
        text: Minus the ₹72m invested, an expected value of ₹42m
      - marks: 1
        text: 'Franchising: (0.6 × ₹95m) + (0.4 × ₹30m) = ₹69m'
      - marks: 1
        text: Minus the ₹10m invested, an expected value of ₹59m
    answer: Organic growth ₹42m; franchising ₹59m.
  errors:
    - Forgetting to subtract the money invested.
    - Adding the payoffs without weighting them by their probabilities.
  provenance: original-practice
  order: 105

- id: q-growth-p1-discuss
  title: Should Marigold franchise?
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  topic: growth-and-evolution
  syllabus: ['1.5']
  commandTerm: Discuss
  ao: AO3
  marks: 10
  case: marigold-kitchens
  exhibits: [ex-3, ex-5, ex-6, ex-7]
  prompt: Discuss whether Marigold Kitchens should franchise.
  skills: [Balanced argument, Use of case evidence, Supported judgement]
  requiresEvaluation: true
  markscheme:
    kind: levels
    guidance: >
      Practice level descriptors written for this question, not the IB's markbands (which are in the Guide). Place the
      answer in the level that best describes it, then choose the mark within the level.
    levels:
      - marks: '0'
        descriptor: Nothing that addresses the question.
      - marks: 1-2
        descriptor: Some knowledge of franchising, with little or no reference to Marigold.
      - marks: 3-4
        descriptor: Knowledge of franchising applied to Marigold in places. The answer is one-sided, or lists advantages and disadvantages without weighing them.
      - marks: 5-6
        descriptor: Relevant arguments for and against, applied to the case evidence, with some weighing. The conclusion is weakly supported.
      - marks: 7-8
        descriptor: Balanced, well-applied arguments that use the evidence, such as the four inquirers able to fund a restaurant and the founder's aims, and a supported conclusion.
      - marks: 9-10
        descriptor: As for 7 to 8, with a judgement that weighs the arguments against Marigold's objectives, states what the conclusion depends on, and considers an alternative such as a pilot franchise or a stricter franchise system.
    exemplar: >
      For: franchising reaches Mumbai and Bengaluru fast with little of Marigold's capital (₹10m), and royalties add
      about ₹13.7m a year by year two. Against: quality would depend on twelve owners Meera did not train, which conflicts
      with her first aim; only four of forty-one inquirers could fund a restaurant, so the plan may need weaker or
      heavily indebted franchisees. Judgement: not as planned. A pilot of two franchises in one city, with a strict
      system, would test whether quality can be franchised before Marigold commits its brand to twelve.
  errors:
    - A list of advantages and a list of disadvantages, followed by a conclusion that could have been written first.
    - Counting franchisees' sales as Marigold's revenue.
    - A conclusion with no condition, such as "Marigold should franchise because it is cheap".
  provenance: original-practice
  order: 106

- id: q-growth-p3-need
  title: "Paper 3 practice, question 1: the human need"
  qualification: ib-dp-bm
  level: HL
  paperStyle: paper-3
  topic: growth-and-evolution
  syllabus: ['1.2']
  commandTerm: Describe
  ao: AO1
  marks: 2
  stimulus: >
    **Annapurna Kitchens Trust** (a fictional social enterprise; every detail below is simulated for this practice
    set). In the examination the stimulus also includes a picture of a product; here the product is described in
    words.


    **Introduction.** Annapurna Kitchens Trust, in Pune, India, trains women from low-income households as
    professional cooks. Its nine-month programme is paid for by the surplus from the canteen it runs at a city
    hospital, where the trainees cook alongside its staff. The canteen's thali, a plate of rice, dal, two vegetables
    and a chapati, sells to patients' families for ₹90.


    **Excerpt 1. Email from the head of training.** "We have 140 women on the waiting list and 30 places a year. Of
    the women who finish, 27 in 30 are working as cooks within three months, most of them in their first salaried job.
    The ones we turn away go back to day labour, if they find it."


    **Excerpt 2. Article in a local newspaper.** "Two private hospitals in Pune have asked the trust to run their
    canteens. Hospital managers say the trust's food is cheaper than contract caterers' and that families trust it."


    **Excerpt 3. A graduate's social media post.** "A year ago I cleaned houses for cash, one day at a time. Now I
    cook at a hotel and my daughter's school fees are paid on time. The training gave me a trade, and the canteen gave
    me the nerve to use it."


    **Excerpt 4. Summary of the trust's finances (year to March).** Canteen surplus ₹1.8m; cost of the training
    programme ₹1.6m. Opening and running two more canteens would need a loan of about ₹6m and two new canteen
    managers. Licensing the model to the hospitals instead would bring a fee of about ₹0.9m a year, with the
    hospitals running the canteens and the trust training and placing the cooks.


    **Excerpt 5. From the minutes of a board meeting.** "Two trustees worry that under a licence the hospitals will
    cut corners on training to save money, and that the trust's name would suffer. A third points out that the trust
    has never borrowed."
  prompt: Describe the human need that Annapurna Kitchens Trust meets.
  skills: [Identify a human need, Use the stimulus]
  requiresEvaluation: false
  markscheme:
    kind: points
    guidance: >
      An original practice mark scheme, written for this question in the structure of paper 3, question 1 (guide,
      pp. 42 and 47): a short description, assessed at AO1.
    points:
      - marks: 1
        text: 'Identifies the need: secure, paid work for women from low-income households who lack a trade, or the skills to get it.'
      - marks: 1
        text: 'Develops it from the stimulus: for example, 140 women waiting for 30 places, the alternative of day labour, or the graduate whose salary now pays school fees.'
  errors:
    - Describing what the trust does (training, a canteen) instead of the need it meets.
    - Naming the need without any detail from the stimulus.
  provenance: original-practice
  order: 107

- id: q-growth-p3-challenges
  title: "Paper 3 practice, question 2: the challenges"
  qualification: ib-dp-bm
  level: HL
  paperStyle: paper-3
  topic: growth-and-evolution
  syllabus: ['1.2', '1.5']
  commandTerm: Explain
  ao: AO2
  marks: 6
  stimulus: Use the stimulus material on Annapurna Kitchens Trust in question 1.
  prompt: Explain two challenges Annapurna Kitchens Trust faces in meeting this need for more women.
  skills: [Apply to the stimulus, Social and financial objectives]
  requiresEvaluation: false
  markscheme:
    kind: points
    guidance: >
      An original practice mark scheme in the structure of paper 3, question 2 (guide, pp. 42 and 47): for each of two
      challenges, up to 3 marks for identifying it, explaining it and applying it to the trust.
    points:
      - marks: 1
        text: 'A first challenge identified, such as funding: the canteen surplus (₹1.8m) only just covers the training (₹1.6m), so more places need new income or borrowing.'
      - marks: 1
        text: The first challenge explained, for example why a social enterprise has to cover its costs from trading to keep its mission going.
      - marks: 1
        text: The first challenge applied, using a figure or detail from the stimulus, such as the ₹6m loan for a trust that has never borrowed.
      - marks: 1
        text: 'A second challenge identified, such as quality and control if the model is licensed, or finding two new canteen managers.'
      - marks: 1
        text: 'The second challenge explained, for example how a partner with a profit motive may cut training to save money.'
      - marks: 1
        text: The second challenge applied, using the stimulus, such as the trustees' worry about the trust's name.
  errors:
    - Two challenges that are really one, such as "money" and "the loan".
    - Explaining challenges any business faces without using the stimulus.
  provenance: original-practice
  order: 108

- id: q-growth-p3-plan
  title: "Paper 3 practice, question 3: a plan of action"
  qualification: ib-dp-bm
  level: HL
  paperStyle: paper-3
  topic: growth-and-evolution
  syllabus: ['1.2', '1.5']
  commandTerm: Recommend
  ao: AO3
  marks: 17
  stimulus: Use all the stimulus material on Annapurna Kitchens Trust in question 1.
  prompt: >
    Using all the resource material, recommend a plan of action for Annapurna Kitchens Trust to meet the need
    of more women, choosing between running the two new canteens itself and licensing its model to the hospitals.
  skills: [Use every excerpt, Tools such as Ansoff and SWOT, Evaluate both routes, Sequence a plan]
  requiresEvaluation: true
  markscheme:
    kind: criteria
    guidance: >
      Paper 3 question 3 is marked against four criteria (guide, pp. 47 to 50). Plan before you write: a quick SWOT
      of the stimulus helps, though the plan itself is not marked (teacher support material, p. 66). There is no single
      right plan; what matters is that it uses the evidence, weighs both routes and could be carried out.
    criteria:
      - id: A
        name: Use of resource materials
        marks: 4
        prompt: Does the plan use every excerpt, and use them to support the recommendation rather than retell them?
      - id: B
        name: Business management tools and theories
        marks: 4
        prompt: 'Are tools and theories chosen for a reason and applied to the trust: for example SWOT on the stimulus, the Ansoff matrix (both routes are market development, so the choice is one of method), or the triple bottom line for a social enterprise?'
      - id: C
        name: Evaluation
        marks: 6
        prompt: 'Are both routes weighed against the trust''s two objectives, social and financial, with their risks, and does the judgement say what it depends on?'
      - id: D
        name: Sequencing of ideas and plan of action
        marks: 3
        prompt: Do the ideas build in a logical order to a plan someone could follow, with the steps in the order they would happen?
    exemplar: >
      One defensible plan: license the model to one hospital first, on a contract that fixes the training standard,
      gives the trust the right to inspect, and pays the fee per cook trained; use the ₹0.9m fee to fund about 16
      more training places a year (at ₹1.6m for 30 places, each costs about ₹53,000); keep the trust's own canteen as the place where every trainee starts. After a year, decide
      on the second hospital, and on borrowing, from evidence of placement rates and food quality. The plan depends on
      the contract holding the hospital to the standard; if it cannot, the trust should run one canteen itself before it
      licenses any.
  errors:
    - Ignoring one or more excerpts, especially the board's worry about quality and the trust's lack of borrowing.
    - Choosing the route with the most revenue without asking which better serves the mission.
    - A list of ideas with no order, or a plan that leaves out who does what first.
  provenance: original-practice
  order: 109

# Original practice questions on the command terms the bank had not yet used:
# list, state, demonstrate, suggest, compare, compare and contrast, contrast,
# examine, justify, annotate, complete, determine, draw, label and plot. Each
# uses its term at the assessment objective the guide gives it, on a subtopic
# whose content is taught to that depth or beyond (guide, p. 42), and most are
# on the subtopics the bank had fewest questions for. Written for this
# platform; not IB examination questions. Every organization is invented and
# every figure simulated. Level descriptors are written for these questions
# and are not the IB's markbands.

- id: q-ct-list-startup
  title: Challenges of starting up a repair workshop
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: general
  syllabus: ['1.1']
  commandTerm: List
  ao: AO1
  marks: 3
  stimulus: >
    Amara Osei plans to open Spoke and Chain (a fictional business), a bicycle repair workshop in a market town. She has
    $6,000 of savings and five years' experience as an employed mechanic, but has never run a business. Two established
    cycle shops in the town already offer repairs.
  prompt: List **three** challenges Amara could face in starting up Spoke and Chain.
  skills: [Recall, Application to the context]
  markscheme:
    kind: points
    guidance: >
      List asks for short answers, one after another, without explanation: one mark for each distinct challenge of
      starting up, up to three. Credit any relevant challenge, such as raising finance, competition, a lack of business
      experience, finding premises, building a customer base, managing cash flow or meeting legal requirements. Two
      answers that are the same challenge in different words earn one mark.
    points:
      - marks: 1
        text: A first challenge, such as raising enough finance, since $6,000 of savings may not cover tools, premises and stock.
      - marks: 1
        text: A second, different challenge, such as competing with the two established cycle shops that already offer repairs.
      - marks: 1
        text: A third, different challenge, such as her lack of experience in running a business, finding suitable premises, or building a base of customers.
  errors:
    - Explaining each challenge at length. A list needs no explanation, and the time is better spent on later questions.
    - Giving the same challenge twice in different words, such as "lack of money" and "not enough capital".
    - Listing opportunities, such as being her own boss, instead of challenges.
  provenance: original-practice
  order: 601

- id: q-ct-state-capex
  title: Capital or revenue expenditure?
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-2
  syllabus: ['3.1']
  commandTerm: State
  ao: AO1
  marks: 2
  stimulus: |
    In its first month, Crumb and Co (a fictional bakery) spent money on:

    - a new deck oven, $12,000
    - flour and butter, $1,800
    - wages, $4,200
    - a delivery van, $9,500
    - electricity, $600
  prompt: State **two** items of capital expenditure in Crumb and Co's spending.
  skills: [Recall, Classification]
  markscheme:
    kind: points
    guidance: >
      One mark for each item of capital expenditure: spending on non-current assets the bakery will use for more than a
      year. The flour and butter, the wages and the electricity are revenue expenditure. State needs only the items, with
      no explanation.
    points:
      - marks: 1
        text: The deck oven ($12,000).
      - marks: 1
        text: The delivery van ($9,500).
    answer: The deck oven and the delivery van.
  errors:
    - Naming the wages or the electricity, which are used up within the year and so are revenue expenditure.
    - Explaining what capital expenditure is instead of naming the items the question asks for.
  provenance: original-practice
  order: 602

- id: q-ct-demonstrate-operations
  title: Operations management at a juice bar
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: general
  syllabus: ['5.1']
  commandTerm: Demonstrate
  ao: AO2
  marks: 4
  stimulus: >
    Pulp Station (a fictional business) makes fresh juices to order at two counters in a city railway station. At the
    morning peak, queues of 15 or more customers form, and about one customer in six leaves the queue before being served.
    The manager has moved the fruit closer to the blenders and added a second till.
  prompt: Using Pulp Station as an example, demonstrate the role of operations management.
  skills: [Application to the context, Causal explanation]
  markscheme:
    kind: points
    guidance: >
      Demonstrate asks you to show that something is so, by reasoning with a practical example. Award at most [2] for an
      account of operations management with no reference to Pulp Station.
    points:
      - marks: 1
        text: The role stated. Operations management turns inputs (fruit, staff, blenders) into outputs (juices) efficiently, at the quality customers expect.
      - marks: 1
        text: A problem in Pulp Station's process identified. At the morning peak about one customer in six leaves the queue, so output and sales are lost.
      - marks: 2
        text: >
          The manager's changes used to show the role at work. Moving the fruit closer to the blenders and adding a second
          till cut the time each order takes, so more customers are served at the peak with no fall in quality. Award [1]
          for one change linked to efficiency, [2] for showing how the changes raise output or service.
  errors:
    - Defining operations management without showing it at work at Pulp Station.
    - Describing the queue without saying what operations management does about it.
  provenance: original-practice
  order: 603

- id: q-ct-suggest-communication
  title: Reaching drivers who are never in the office
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: general
  syllabus: ['2.6']
  commandTerm: Suggest
  ao: AO2
  marks: 4
  stimulus: >
    Northline Couriers (a fictional business) employs 140 drivers who start their shifts from three depots. Head office
    sends instructions by email, but most drivers read email only on their phones, and some not at all. Last month a change
    to the delivery routes reached a third of the drivers a day late, and customers complained about missed deliveries.
    About a quarter of the drivers speak English as a second language.
  prompt: Suggest **two** ways Northline Couriers could reduce the barriers to communication with its drivers.
  skills: [Application to the context, Problem solving]
  markscheme:
    kind: points
    guidance: >
      Suggest asks for a possible solution, not a full evaluation. For each way, award [1] for a sensible method of
      communication and [1] for linking it to a barrier in the case: the channel (email read late or not at all), the
      timing (a day late) or language.
    points:
      - marks: 2
        text: >
          A first way, linked to a barrier in the case. For example, a short briefing at each depot at the start of every
          shift, so that drivers who do not read email hear changes before they set off.
      - marks: 2
        text: >
          A second, different way, linked to a barrier. For example, route changes sent as short messages or maps in the
          drivers' app, in the drivers' own languages, which reduces both the delay of email and the language barrier.
  errors:
    - Suggesting "better communication" without saying how.
    - Two ways that are really one method, such as an email and a newsletter sent by email.
    - Ignoring the barriers the case gives, such as language.
  provenance: original-practice
  order: 604

- id: q-ct-suggest-patent
  title: Protecting a new design
  qualification: ib-dp-bm
  level: HL
  paperStyle: general
  syllabus: ['5.8']
  commandTerm: Suggest
  ao: AO2
  marks: 2
  stimulus: >
    Fernhill Audio (a fictional business) has spent two years developing a new kind of hinge that lets headphones fold flat
    without wearing out. A rival has already copied the look of Fernhill's last model.
  prompt: Suggest how Fernhill Audio could protect its new hinge from being copied.
  skills: [Application to the context]
  markscheme:
    kind: points
    guidance: One mark for a suitable form of protection, one for how it would protect Fernhill.
    points:
      - marks: 1
        text: A form of intellectual property protection that fits an invention, such as a patent on the hinge.
      - marks: 1
        text: >
          How it protects Fernhill. A patent gives it the sole right to make and sell the hinge for a period, so a rival
          could not legally copy it as it copied the last model; a trademark could protect the product's name as well.
  errors:
    - Suggesting copyright for the hinge. Copyright protects creative works; an invention is protected by a patent.
    - Naming a patent without saying what it stops the rival doing.
  provenance: original-practice
  order: 605

- id: q-ct-compare-production
  title: Batch and mass production at a bakery
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: general
  syllabus: ['5.2']
  commandTerm: Compare
  ao: AO3
  marks: 4
  stimulus: >
    Crumb and Co (a fictional bakery) bakes bread in batches of 200 loaves, changing the recipe between batches. A
    supermarket has asked it to bake 20,000 identical loaves a day, which would need a continuous production line.
  prompt: Compare batch production and mass production for Crumb and Co.
  skills: [Comparison, Application to the context]
  requiresEvaluation: true
  markscheme:
    kind: points
    guidance: >
      Compare asks for the similarities, referring to both methods throughout. Differences earn no marks here. For each
      similarity, award [1] for the similarity and [1] for applying it to both methods at Crumb and Co.
    points:
      - marks: 2
        text: >
          A first similarity. For example, both make standardized loaves in larger numbers than job production, so both
          spread the bakery's fixed costs over more units and lower the cost of each loaf.
      - marks: 2
        text: >
          A second similarity. For example, both need stock and capacity planned in advance (flour, oven time, staff), and
          both depend on a consistent recipe and quality control so that every loaf is the same.
  errors:
    - Writing about differences, which is what contrast asks for.
    - Describing each method in turn without saying what they have in common.
  provenance: original-practice
  order: 606

- id: q-ct-compare-contrast-arbitration
  title: Conciliation or arbitration?
  qualification: ib-dp-bm
  level: HL
  paperStyle: general
  syllabus: ['2.7']
  commandTerm: Compare and contrast
  ao: AO3
  marks: 10
  stimulus: >
    Talbridge Buses (a fictional business) and the drivers' union disagree over pay: the union wants a 7% rise, and
    Talbridge offers 3%. After two weeks of a work-to-rule, both sides agree to bring in a third party. The union prefers
    conciliation; the managing director wants binding arbitration, so that the dispute ends by a fixed date.
  prompt: Compare and contrast conciliation and arbitration as ways for Talbridge Buses to resolve its dispute with the drivers' union.
  skills: [Comparison, Application to the context, Judgement]
  requiresEvaluation: true
  markscheme:
    kind: levels
    guidance: >
      Similarities could include that both bring in an independent third party, both aim to end the dispute without
      further industrial action, and both take time and may cost fees. Differences could include that a conciliator helps
      the two sides reach their own agreement, which neither has to accept, while an arbitrator hears both sides and
      decides, and under binding arbitration both must accept the decision; conciliation leaves control with Talbridge and
      the union and may keep relations workable, while arbitration gives the certain end date the managing director wants
      but may leave one side feeling it has lost.
    levels:
      - marks: '0'
        descriptor: Nothing that addresses the question.
      - marks: 1-2
        descriptor: Describes conciliation or arbitration, with little reference to Talbridge and no comparison.
      - marks: 3-4
        descriptor: Gives a similarity or a difference, mostly in general terms, with some reference to the dispute.
      - marks: 5-6
        descriptor: Sets out at least one similarity and one difference applied to the dispute, but unevenly, or with one approach treated far more fully than the other.
      - marks: 7-8
        descriptor: Sets out similarities and differences, each applied to Talbridge (the 7% and 3% positions, the work-to-rule, the date the managing director wants).
      - marks: 9-10
        descriptor: As for 7 to 8, referring to both approaches throughout, and ends with a supported view of which suits this dispute, such as conciliation first to keep relations workable, with arbitration if it fails.
  errors:
    - Describing conciliation and then arbitration, without comparing them.
    - Giving only differences, or only similarities. The command term asks for both.
    - Confusing the two, for example saying a conciliator imposes a decision.
  provenance: original-practice
  order: 607

- id: q-ct-contrast-jit
  title: Just in time or just in case at a florist
  qualification: ib-dp-bm
  level: HL
  paperStyle: general
  syllabus: ['5.6']
  commandTerm: Contrast
  ao: AO3
  marks: 4
  stimulus: >
    Petal Row (a fictional business) sells cut flowers, which last about a week, and potted plants, which last for months.
    Its supplier delivers daily, but deliveries were missed on 9 days last year. Demand doubles in the week before
    Mother's Day.
  prompt: Contrast just-in-time (JIT) and just-in-case (JIC) stock management for Petal Row.
  skills: [Comparison, Application to the context]
  requiresEvaluation: true
  markscheme:
    kind: points
    guidance: >
      Contrast asks for the differences, referring to both approaches throughout. A description of each approach in turn,
      with no difference drawn, earns at most [1]. For each difference, award [1] for the difference and [1] for applying
      it to Petal Row.
    points:
      - marks: 2
        text: >
          A first difference. For example, under JIT cut flowers arrive daily as they are needed, so few wilt and waste is
          low, while under JIC Petal Row holds buffer stock, so more flowers may wilt before they are sold.
      - marks: 2
        text: >
          A second difference. For example, JIC protects Petal Row against missed deliveries (9 last year) and the doubling
          of demand before Mother's Day, while JIT leaves it with nothing to sell when a delivery fails; or JIC needs cool
          storage space that JIT does not.
  errors:
    - Describing JIT and then JIC separately, without drawing the differences.
    - Ignoring that cut flowers and potted plants last for very different times.
  provenance: original-practice
  order: 608

- id: q-ct-examine-mnc
  title: A battery factory in Valcora
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-1
  syllabus: ['1.6']
  commandTerm: Examine
  ao: AO3
  marks: 10
  stimulus: >
    Voltaro Energy (a fictional multinational company) plans to build a battery factory in Valcora, a fictional country.
    The government will let Voltaro pay no corporate tax for ten years. The factory will employ 1,800 people, most of them
    from the region, and buy lithium from local mines. Local farmers worry about the factory's water use, and two Valcoran
    battery makers fear they cannot match Voltaro's prices.
  prompt: Examine the impact on Valcora of Voltaro Energy's new battery factory.
  skills: [Application to the stimulus, Balanced argument, Judgement]
  requiresEvaluation: true
  markscheme:
    kind: levels
    guidance: >
      Positive effects could include 1,800 jobs, mostly for local people; orders for local lithium mines and the spending
      of new wages in the region; skills and technology brought into the country; and exports. Negative effects could
      include the tax the government gives up for ten years; the factory's water use, which affects farmers; local battery
      makers squeezed out by a larger rival; and profits sent back to Voltaro's home country. Examine also asks for the
      assumptions behind the effects to be brought out, such as whether the jobs go to local people.
    levels:
      - marks: '0'
        descriptor: Nothing that addresses the question.
      - marks: 1-2
        descriptor: Lists possible effects of multinationals in general, with little or no reference to Valcora.
      - marks: 3-4
        descriptor: Explains one or two effects, partly applied to Valcora, from one side only.
      - marks: 5-6
        descriptor: Examines positive and negative effects for Valcora with some use of the stimulus, but unevenly, or without showing how the effects relate.
      - marks: 7-8
        descriptor: Examines a range of effects on Valcora (jobs, local suppliers, tax, local rivals, water), using the stimulus, and shows how some depend on others.
      - marks: 9-10
        descriptor: As for 7 to 8, bringing out the assumptions behind the effects, noting what the stimulus does not say (such as how much water the factory will use), and reaching a balanced view of the overall impact.
  errors:
    - Writing about multinationals in general, without Valcora.
    - Giving only the benefits, or only the costs.
    - Ignoring the tax holiday, which reduces what the government gains.
  provenance: original-practice
  order: 609

- id: q-ct-justify-forecast
  title: Trusting the sales forecast
  qualification: ib-dp-bm
  level: HL
  paperStyle: general
  syllabus: ['4.3']
  commandTerm: Justify
  ao: AO3
  marks: 6
  stimulus: >
    Lumen Lamps (a fictional business) forecasts next year's sales from a line of best fit through five years of
    quarterly sales, which have grown steadily. The forecast is 18% above this year's sales. A new competitor opened in the
    region three months ago, and the managing director wants to order next year's stock now to secure a 10% bulk discount.
  prompt: Justify whether Lumen Lamps should order next year's stock on the basis of its sales forecast.
  skills: [Judgement, Use of evidence]
  requiresEvaluation: true
  markscheme:
    kind: levels
    guidance: >
      Either decision can earn full marks if it is supported by sound reasons from the stimulus. For: five years of steady
      data, and the 10% discount. Against: the forecast extrapolates the past, so it cannot allow for the new competitor,
      and stock bought for sales that do not come ties up cash. A middle course, such as ordering part of the stock now,
      is a decision too.
    levels:
      - marks: '0'
        descriptor: Nothing that addresses the question.
      - marks: 1-2
        descriptor: States a decision with little or no support, or with reasons that ignore Lumen.
      - marks: 3-4
        descriptor: Gives a decision supported by reasons from the stimulus, such as the steady past growth or the new competitor, but considers one side only.
      - marks: 5-6
        descriptor: Reaches a clear decision, supported by reasons on both sides (the strength of five years of data and the discount, against a forecast that cannot allow for the competitor).
  errors:
    - Explaining what a sales forecast is instead of judging this one.
    - A decision with no reasons, or reasons that ignore the new competitor.
  provenance: original-practice
  order: 610

- id: q-ct-justify-contingency
  title: A contingency plan for floods
  qualification: ib-dp-bm
  level: HL
  paperStyle: general
  syllabus: ['5.7']
  commandTerm: Justify
  ao: AO3
  marks: 4
  stimulus: >
    Riverside Print (a fictional business) has its only printing press in a building beside a river that has flooded
    twice in the last ten years. A contingency plan would cost $18,000 to prepare and $6,000 a year to keep up: a backup
    agreement with another printer, and paper stored off-site. After the last flood the press was out of action for six
    weeks, and Riverside lost two of its largest clients.
  prompt: Justify whether Riverside Print should prepare a contingency plan for flooding.
  skills: [Judgement, Use of evidence]
  requiresEvaluation: true
  markscheme:
    kind: points
    guidance: Either decision can earn full marks if it is supported by reasons from the stimulus. A decision with no reasons earns no marks.
    points:
      - marks: 2
        text: >
          Reasons from the stimulus, such as the plan's cost ($18,000, then $6,000 a year) set against what the last flood
          cost: six weeks without the press and two of the largest clients. Award [1] for a reason and [1] for using the
          figures.
      - marks: 2
        text: >
          A clear decision that follows from the reasons, with its main condition. For example, prepare the plan, since two
          floods in ten years make another likely and losing large clients costs more than the plan, provided the backup
          printer can meet Riverside's quality and deadlines.
  errors:
    - Describing contingency planning without reaching a decision.
    - Ignoring the cost of the plan, or the cost of the last flood.
  provenance: original-practice
  order: 611

- id: q-ct-suggest-culture
  title: Two cultures in one company
  qualification: ib-dp-bm
  level: HL
  paperStyle: general
  syllabus: ['2.5']
  commandTerm: Suggest
  ao: AO2
  marks: 4
  stimulus: >
    Hollis Engineering (a fictional business), a family firm whose founder makes every decision, has merged with
    Brightwork Design, a start-up whose small teams chose their own projects. Six months on, Brightwork's designers
    complain that every idea needs a signature from the top, and two of them have left.
  prompt: Suggest **two** ways Hollis Engineering could reduce the clash between the two organizational cultures.
  skills: [Application to the context, Problem solving]
  markscheme:
    kind: points
    guidance: >
      For each way, award [1] for a sensible action and [1] for linking it to the clash: decisions taken at the top at
      Hollis, against teams choosing their own work at Brightwork.
    points:
      - marks: 2
        text: >
          A first way, linked to the clash. For example, letting the design teams approve projects below a set budget, so
          Brightwork's designers keep some of the freedom they had while the founder keeps control of large decisions.
      - marks: 2
        text: >
          A second, different way, linked to the clash. For example, mixed teams of Hollis and Brightwork staff on joint
          projects, or values agreed by both sides, so that each side comes to understand the other's way of working.
  errors:
    - Describing the two cultures without suggesting what to do.
    - Suggesting that one culture simply replaces the other, without considering the effect on the people who leave.
  provenance: original-practice
  order: 612

- id: q-ct-state-lean
  title: Features of lean production
  qualification: ib-dp-bm
  level: HL
  paperStyle: general
  syllabus: ['5.3']
  commandTerm: State
  ao: AO1
  marks: 2
  prompt: State **two** features of lean production.
  skills: [Recall]
  markscheme:
    kind: points
    guidance: >
      One mark for each feature. Methods of lean production, such as kaizen or just-in-time, are not features, but an
      answer that states the less waste or greater efficiency they bring earns the mark.
    points:
      - marks: 1
        text: Less waste, of materials, time, space or effort.
      - marks: 1
        text: Greater efficiency, with more output from the same inputs.
  errors:
    - Naming methods, such as kaizen or just-in-time, instead of features.
    - Stating "it is cheaper" without saying the saving comes from less waste or greater efficiency.
  provenance: original-practice
  order: 613

- id: q-ct-plot-position
  title: Plotting a position map of the city's gyms
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: general
  syllabus: ['4.2']
  commandTerm: Plot
  ao: AO4
  marks: 3
  stimulus: |
    Five gyms (all fictional) compete in Port Mallory. A survey rated each out of 10 for price (10 is the most expensive) and for its range of classes (10 is the widest range):

    - Apex Fitness: price 8, classes 9
    - BudgetBody: price 2, classes 3
    - CoreWorks: price 7, classes 4
    - FlexHall: price 4, classes 2
    - IronYard: price 9, classes 6
  prompt: Plot the five gyms on a position map, with price on the vertical axis and the range of classes on the horizontal axis.
  skills: [Diagram construction]
  markscheme:
    kind: points
    guidance: Plot asks for each point marked in its correct position. A gym in the wrong quadrant is not credited.
    points:
      - marks: 1
        text: Both axes drawn and labelled (price on the vertical axis, range of classes on the horizontal), each running from low to high, with the midpoint of each scale at 5.
      - marks: 2
        text: All five gyms plotted in the correct positions and named. Award [1] if three or four are correct.
    answer: >
      Apex Fitness and IronYard are in the top right (expensive, with a wide range of classes); CoreWorks is in the top
      left (expensive, with a narrow range); BudgetBody and FlexHall are in the bottom left (cheap, with a narrow range).
      No gym is in the bottom right.
  errors:
    - Swapping the axes.
    - Plotting the points without naming each gym.
    - Leaving the axes unlabelled.
  provenance: original-practice
  order: 614

- id: q-ct-annotate-gap
  title: Finding the gap on a position map
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: general
  syllabus: ['4.2']
  commandTerm: Annotate
  ao: AO4
  marks: 2
  stimulus: |
    A survey rated five gyms in Port Mallory (all fictional) out of 10 for price (10 is the most expensive) and for their range of classes (10 is the widest range):

    - Apex Fitness: price 8, classes 9
    - BudgetBody: price 2, classes 3
    - CoreWorks: price 7, classes 4
    - FlexHall: price 4, classes 2
    - IronYard: price 9, classes 6
  prompt: Sketch the position map of the five gyms and annotate it to show a gap in the market that a new gym could target.
  skills: [Diagram construction, Application to the context]
  markscheme:
    kind: points
    guidance: Annotate asks for short notes added to the diagram. Award the second mark for a note on the map, not for a paragraph beside it.
    points:
      - marks: 1
        text: The gap marked in the right place, the bottom right of the map, a low price with a wide range of classes, where none of the five gyms is.
      - marks: 1
        text: A brief note on the map that explains it, such as "no gym offers many classes at a low price", or a caution such as "a gap is not proof of demand".
  errors:
    - Marking a gap where a gym already sits.
    - Writing a paragraph about gaps in the market instead of annotating the map.
  provenance: original-practice
  order: 615

- id: q-ct-complete-accounts
  title: Completing a statement of profit or loss
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: paper-2
  syllabus: ['3.4']
  commandTerm: Complete
  ao: AO4
  marks: 4
  stimulus: |
    Extract from the statement of profit or loss of Tidewater Kayaks (a fictional business) for the year to 31 March 2026, in $000:

    - Sales revenue: 840
    - Cost of sales: 504
    - Gross profit: **(a)**
    - Expenses: 216
    - Profit before interest and tax: **(b)**
    - Interest: 20
    - Profit before tax: **(c)**
    - Tax at 25% of profit before tax: **(d)**
    - Profit for the period: 75
  prompt: Complete the statement by calculating the missing figures (a) to (d).
  skills: [Calculation, Final accounts]
  requiresCalculation: true
  markscheme:
    kind: calculation
    guidance: >
      One mark for each figure. A later figure that is right on the candidate's own earlier, wrong figure still earns its
      mark.
    points:
      - marks: 1
        text: (a) Gross profit = 840 − 504 = $336,000.
      - marks: 1
        text: (b) Profit before interest and tax = 336 − 216 = $120,000.
      - marks: 1
        text: (c) Profit before tax = 120 − 20 = $100,000.
      - marks: 1
        text: (d) Tax = 25% × 100 = $25,000, which leaves the profit for the period of $75,000 shown.
    answer: (a) $336,000; (b) $120,000; (c) $100,000; (d) $25,000.
  errors:
    - Taking off the interest before the expenses.
    - Working the tax on profit before interest and tax ($30,000) instead of on profit before tax.
    - Leaving out the units. The figures are in thousands of dollars.
  provenance: original-practice
  order: 616

- id: q-ct-determine-variance
  title: The quarter's variance in profit
  qualification: ib-dp-bm
  level: HL
  paperStyle: paper-2
  syllabus: ['3.9']
  commandTerm: Determine
  ao: AO4
  marks: 3
  stimulus: |
    Budgeted and actual figures for Gallery Nine Café (a fictional business) in its third quarter:

    - Sales revenue: budget $96,000; actual $91,500
    - Food costs: budget $28,800; actual $27,900
    - Staff costs: budget $34,000; actual $36,100
    - Other costs: budget $12,500; actual $12,200
  prompt: Determine the variance in profit for the quarter, and state whether it is favourable or adverse.
  skills: [Calculation, Variance analysis]
  requiresCalculation: true
  markscheme:
    kind: calculation
    guidance: >
      The variance can be found from the budgeted and actual profit, or by adding the line variances with their signs.
      A lower cost than budgeted is a favourable variance.
    points:
      - marks: 1
        text: >
          Budgeted profit = 96,000 − 28,800 − 34,000 − 12,500 = $20,700, and actual profit = 91,500 − 27,900 − 36,100 −
          12,200 = $15,300; or the line variances, sales $4,500 adverse, food $900 favourable, staff $2,100 adverse and
          other costs $300 favourable.
      - marks: 1
        text: Variance in profit = $15,300 − $20,700 = −$5,400, that is $5,400.
      - marks: 1
        text: Adverse, because actual profit is below the budget.
    answer: $5,400 adverse (budgeted profit $20,700, actual profit $15,300).
  errors:
    - Calling the food and other cost variances adverse because the figures fell. A cost below budget is favourable.
    - Adding the line variances without their signs, which gives $7,800.
    - Giving the figure without saying whether it is favourable or adverse.
  provenance: original-practice
  order: 617

- id: q-ct-draw-chart
  title: Drawing the organization chart of a small hotel
  qualification: ib-dp-bm
  level: SL/HL
  paperStyle: general
  syllabus: ['2.2']
  commandTerm: Draw
  ao: AO4
  marks: 4
  stimulus: >
    The Harbour Light Hotel (a fictional business) is run by a general manager. Reporting to her are the front office
    manager, the head chef and the housekeeping supervisor. Four receptionists report to the front office manager, three
    cooks to the head chef, and six room attendants to the housekeeping supervisor.
  prompt: Draw an organization chart for the Harbour Light Hotel.
  skills: [Diagram construction]
  markscheme:
    kind: points
    guidance: Draw asks for an accurate, labelled diagram. The chart is organized by function. Award the last mark only if every post is labelled.
    points:
      - marks: 1
        text: The general manager alone at the top, on the first level of the hierarchy.
      - marks: 1
        text: The front office manager, the head chef and the housekeeping supervisor on the second level, each linked to the general manager.
      - marks: 1
        text: The receptionists, cooks and room attendants on the third level, each group linked to its own manager, so the chain of command is clear.
      - marks: 1
        text: Every post labelled, with the numbers shown (4 receptionists, 3 cooks, 6 room attendants), so the spans of control can be read (3 for the general manager; 4, 3 and 6 below).
  errors:
    - Linking the receptionists directly to the general manager, which breaks the chain of command.
    - Leaving out the numbers in each team, so the spans of control cannot be read.
    - Putting the three managers on different levels.
  provenance: original-practice
  order: 618

- id: q-ct-label-stock
  title: Labelling a stock control chart
  qualification: ib-dp-bm
  level: HL
  paperStyle: general
  syllabus: ['5.6']
  commandTerm: Label
  ao: AO4
  marks: 4
  stimulus: >
    Kiln and Co (a fictional pottery supplier) holds 700 bags of clay at the start of the period, and stock falls by 100
    bags a week. An order is placed when stock falls to 500 bags, and the delivery of 600 bags arrives 4 weeks later, when
    stock has fallen to 100 bags, the least Kiln and Co ever holds.
  prompt: Sketch the stock control chart for Kiln and Co and label the reorder level, the buffer stock, the lead time and the reorder quantity.
  skills: [Diagram construction, Stock control]
  markscheme:
    kind: points
    guidance: >
      Label asks for the parts of the diagram to be named. The sketch is the base: stock in bags on the vertical axis,
      weeks on the horizontal, stock falling from 700 to 100 bags over 6 weeks and rising back to 700. Each mark is for
      one part labelled correctly.
    points:
      - marks: 1
        text: The reorder level labelled at 500 bags.
      - marks: 1
        text: The buffer stock labelled at 100 bags.
      - marks: 1
        text: The lead time labelled along the time axis, the 4 weeks from the order at 500 bags (week 2) to the delivery (week 6).
      - marks: 1
        text: The reorder quantity labelled as the rise of 600 bags when the delivery arrives, from 100 to 700 bags.
  errors:
    - Labelling the lead time on the stock axis instead of the time axis.
    - Confusing the reorder level, when the order is placed, with the buffer stock, the least that is held.
    - Showing the delivery arriving the moment the order is placed, with no lead time.
  provenance: original-practice
  order: 619

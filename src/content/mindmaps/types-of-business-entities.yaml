# Mindmap: 1.2 Types of business entities. The platform's own summary of the
# subtopic's four content statements (guide p. 23), following the guide's
# classification exactly: four types of organization; private sector
# companies, public sector companies and cooperatives as for-profit social
# enterprises; NGOs as a non-profit social enterprise. Checked against the
# guide and the TSM's social enterprise guidance (TSM pp. 62 to 64); the
# supplied coursebook chapter 1.2 was used only to confirm coverage, and
# nothing in it is reproduced.
title: Types of business entities
code: '1.2'
scope: subtopic
unit: 1
level: SL/HL
summary: How organizations differ in who owns them, who carries the risk and what they are for, from sole traders to publicly held companies, and from for-profit social enterprises to NGOs.
centre: Types of business entities
order: 12
branches:
  - label: Private and public sectors
    kind: concept
    children:
      - label: 'Private sector: owned by individuals and firms'
        kind: definition
        term: private-sector
        core: true
      - label: 'Public sector: owned or run by government'
        kind: definition
        term: public-sector
        core: true
      - label: Profit or purpose versus public service
        core: true
        note: Public sector bodies put access to essential services before profit.
      - label: Privatization moves activity into private hands
        term: privatization
        note: Nationalization moves it the other way.
  - label: Types of organizations
    kind: types
    children:
      - label: 'Sole trader: one owner, full control'
        kind: type
        term: sole-trader
        core: true
        children:
          - label: Unlimited liability, limited finance
            kind: limitation
      - label: 'Partnership: two or more owners'
        kind: type
        term: partnership
        core: true
        children:
          - label: A deed of partnership sets the terms
            term: deed-of-partnership
      - label: 'Privately held company: shares sold privately'
        kind: type
        term: privately-held-company
        core: true
        children:
          - label: Owners control who can buy shares
      - label: 'Publicly held company: shares traded publicly'
        kind: type
        term: publicly-held-company
        core: true
        children:
          - label: Raises large sums, but must publish accounts
  - label: Ownership and liability
    kind: concept
    children:
      - label: 'Unlimited liability: personal assets at risk'
        kind: definition
        term: unlimited-liability
        core: true
      - label: 'Limited liability: lose only what you invested'
        kind: definition
        term: limited-liability
        core: true
      - label: A company is a legal person in its own right
        term: company
        core: true
        note: It owns assets, signs contracts and continues when its owners change.
      - label: Shareholders own a company; directors run it
        term: shareholder
      - label: Divorce of ownership and control
        term: divorce-of-ownership-and-control
        note: In large companies, managers may pursue their own goals.
  - label: For-profit social enterprises
    kind: types
    children:
      - label: 'Social enterprise: trades for a social purpose'
        kind: definition
        term: social-enterprise
        core: true
        note: Most income comes from trading; most surplus goes back into the mission.
      - label: Private sector companies with a social mission
        kind: type
        term: private-sector-company
        core: true
      - label: 'Public sector companies: state-owned, trading'
        kind: type
        term: public-sector-company
        core: true
      - label: 'Cooperatives: owned and run by members'
        kind: type
        term: cooperative
        core: true
        note: One member, one vote; any surplus is shared among the members or reinvested.
  - label: 'Non-profit social enterprise: NGOs'
    kind: types
    children:
      - label: 'NGO: non-profit, independent of government'
        kind: definition
        term: non-governmental-organization
        core: true
      - label: Every surplus goes to the cause
        term: non-profit-social-enterprise
        core: true
      - label: Funded by donations, grants and trading
      - label: Campaigns, lobbies or delivers services
        note: Many NGOs act as pressure groups.
      - label: Charities depend more on donations
        term: charity
  - label: Choosing a legal form
    kind: evaluation
    children:
      - label: Control versus access to finance
        core: true
        note: Selling shares raises capital but spreads ownership and control.
      - label: Risk carried by the owners
        core: true
        note: Limited liability encourages investment; unlimited liability deters it.
      - label: Privacy versus public disclosure
      - label: Cost and paperwork of setting up
      - label: Continuity when owners leave or die
      - label: Mission versus returns to owners
        core: true
      - label: Which form suits this business now?
        kind: question
connections:
  - code: '1.1'
    label: A new business has to choose its legal form
  - code: '1.3'
    label: Objectives differ between types of entity
  - code: '1.4'
    label: Owners are one stakeholder group among many
  - code: '3.2'
    label: The legal form limits the sources of finance
basis:
  - source: ib-bm-guide-2024
    pages: '23'
  - source: ib-bm-tsm-2022
    pages: '62-64'
  - source: hodder-bm-2022
    pages: '71-83'

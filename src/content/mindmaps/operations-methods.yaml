# Mindmap: 5.2 Operations methods. The platform's own summary of the subtopic's
# content statement: job, batch and mass (flow) production, and mass
# customization, at AO3 (guide p. 33). Checked against the guide; no coursebook
# chapter for 5.2 was supplied, and nothing from any source is reproduced.
title: Operations methods
code: '5.2'
scope: subtopic
unit: 5
level: SL/HL
summary: The four operations methods in the guide, what each is good and bad at, and how a business chooses between them.
centre: Operations methods
order: 52
branches:
  - label: Job production
    kind: types
    children:
      - label: One-off product to a customer's design
        kind: definition
        term: job-production
        core: true
      - label: Skilled staff, general tools
        note: General-purpose equipment; usually labour-intensive.
      - label: Exactly what the buyer wants
        kind: advantage
        core: true
        note: Often commands a premium price, and the work can be motivating.
      - label: High unit cost, slow, few economies of scale
        kind: limitation
        core: true
      - label: Made-to-measure suit, bridge, yacht
        kind: example
  - label: Batch production
    kind: types
    children:
      - label: Groups of identical items, then switch
        kind: definition
        term: batch-production
        core: true
      - label: Some variety and some economies of scale
        kind: advantage
        core: true
      - label: Idle time at each changeover
        kind: limitation
        core: true
      - label: Stock waits between stages
        kind: limitation
      - label: Bread, clothing, paint
        kind: example
  - label: Mass/flow production
    kind: types
    children:
      - label: Continuous output of a standard product
        kind: definition
        term: mass-production
        core: true
      - label: Lowest unit cost at volume
        kind: advantage
        core: true
        note: Fixed costs are spread over a very large output.
      - label: Heavy investment, rigid line
        kind: limitation
        core: true
      - label: Repetitive work can demotivate
        kind: limitation
        note: Links to Taylor and motivation in 2.4.
      - label: Soft drinks, cars, smartphones
        kind: example
  - label: Mass customization
    kind: types
    children:
      - label: Standard base, custom finish
        kind: definition
        term: mass-customization
        core: true
      - label: Technology keeps costs down
        note: Flexible machines, computer-aided design and online ordering make variety affordable.
      - label: Higher prices, customer data
        kind: advantage
        core: true
      - label: Complex to plan and deliver
        kind: limitation
      - label: Trainers designed online
        kind: example
  - label: Choosing a method
    kind: evaluation
    children:
      - label: Volume and pattern of demand
        core: true
        note: Low volume suits job production; steady high volume suits flow.
      - label: How standard the product is
        core: true
      - label: Finance for equipment
        core: true
        note: Flow and mass customization need large investment.
      - label: Labour or capital intensity
        children:
          - label: 'Labour-intensive: people'
            term: labour-intensive-production
          - label: 'Capital-intensive: machines'
            term: capital-intensive-production
      - label: Methods can be combined
        note: A car maker mass-produces parts and lets buyers choose the finish.
  - label: The trade-off
    kind: evaluation
    children:
      - label: Economies of scale
        term: economies-of-scale
        core: true
        note: Unit cost falls from job to batch to flow as volume rises.
      - label: Less flexibility at volume
        core: true
        note: Flow lines are the hardest to change.
      - label: 'Mass customization: both'
        note: It aims for low unit cost and flexibility together.
connections:
  - code: '1.5'
    label: Economies of scale at high volume
  - code: '2.4'
    label: Repetitive tasks and motivation
  - code: '4.2'
    label: Mass and niche markets suit different methods
  - code: '5.3'
    label: 'HL: lean methods cut changeover time and waste'
basis:
  - source: ib-bm-guide-2024
    pages: '33'

# Mindmap: 1.1 What is a business? The platform's own summary of the subtopic's
# four content statements (guide p. 23). Checked against the guide; the supplied
# coursebook chapter 1.1 was used only to confirm coverage, and nothing in it is
# reproduced.
title: What is a business?
code: '1.1'
scope: subtopic
unit: 1
level: SL/HL
summary: What a business is and does, the four sectors it can work in, the entrepreneur who starts it, and what helps or hinders a start-up.
centre: What is a business?
order: 11
branches:
  - label: The nature of business
    kind: concept
    children:
      - label: An organization that turns inputs into goods and services
        kind: definition
        term: business
        core: true
        note: Inputs are the factors of production; outputs are sold to customers to meet their needs and wants.
        children:
          - label: 'Inputs: land, labour, capital, enterprise'
            term: factors-of-production
            core: true
          - label: 'Outputs: goods (tangible) and services (intangible)'
            term: goods-and-services
            core: true
      - label: Meets needs and wants
        term: needs-and-wants
        note: A need is essential to survival; a want is a desire beyond it.
      - label: Adds value
        kind: definition
        term: added-value
        note: The difference between the selling price and the cost of bought-in materials.
        core: true
      - label: 'Four functions work together: HR, finance, marketing, operations'
        term: business-functions
        core: true
        note: Each function is a unit of this course.
  - label: Sectors of the economy
    kind: types
    children:
      - label: 'Primary: extracting natural resources'
        kind: type
        term: primary-sector
        core: true
        children:
          - label: Farming, fishing, forestry, mining
            kind: example
      - label: 'Secondary: manufacturing and construction'
        kind: type
        term: secondary-sector
        core: true
        children:
          - label: Turning raw materials into products
      - label: 'Tertiary: providing services'
        kind: type
        term: tertiary-sector
        core: true
        children:
          - label: Retail, banking, transport, tourism
            kind: example
      - label: 'Quaternary: knowledge and information services'
        kind: type
        term: quaternary-sector
        core: true
        children:
          - label: Research, IT, consultancy, education
            kind: example
      - label: Sectoral change as economies develop
        term: sectoral-change
        note: Employment and output shift from the primary sector towards the tertiary and quaternary sectors.
  - label: Entrepreneurship
    kind: concept
    children:
      - label: 'Entrepreneur: organizes resources and takes the risk of a new venture'
        kind: definition
        term: entrepreneurship
        core: true
      - label: 'Intrapreneur: acts entrepreneurially inside an existing organization'
        kind: definition
        term: intrapreneurship
      - label: 'Motives: profit, independence, an unmet need, a social purpose'
        core: true
      - label: 'Qualities: initiative, resilience, willingness to take risk'
  - label: 'Starting up: challenges'
    kind: evaluation
    children:
      - label: Raising enough finance
        kind: limitation
        core: true
      - label: Winning customers from established rivals
        kind: limitation
        core: true
      - label: Cash flow in the first months
        kind: limitation
        core: true
      - label: Legal requirements and administration
        kind: limitation
      - label: Limited experience and skills
        kind: limitation
  - label: 'Starting up: opportunities'
    kind: application
    children:
      - label: Independence and control
        kind: advantage
        core: true
      - label: Profit and personal reward
        kind: advantage
        core: true
      - label: Filling a gap in the market
        kind: advantage
        core: true
      - label: Low-cost digital tools and online selling
        kind: advantage
  - label: Connections
    kind: connection
    children:
      - label: 'A business plan sets out the idea (toolkit)'
        term: business-plan
        core: true
      - label: 'Legal form follows: 1.2 types of business entities'
      - label: 'Finance to start: 3.2 sources of finance'
      - label: 'Knowing the market: 4.4 market research'
connections:
  - code: '1.2'
    label: The legal form a new business takes
  - code: '1.3'
    label: What the business sets out to achieve
  - code: '3.2'
    label: Where start-up finance comes from
  - code: '4.4'
    label: Researching the market before starting
basis:
  - source: ib-bm-guide-2024
    pages: '23'

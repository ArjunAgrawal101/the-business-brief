# Mindmap: 4.1 Introduction to marketing. The platform's own summary of the
# subtopic's four content statements (guide p. 31); the last, on the importance
# of market share and market leadership, is HL only. Market share and market
# growth are written exactly as the Market Studio calculates them
# (src/lib/market.ts), and the worked example uses its fictional Porto market.
title: Introduction to marketing
code: '4.1'
scope: subtopic
unit: 4
level: SL/HL with HL-only content
summary: What marketing is, the choice between a market and a product orientation, how market share and market growth are measured and read, and, at HL, why market share and market leadership matter.
centre: Introduction to marketing
order: 41
branches:
  - label: What marketing is
    kind: concept
    children:
      - label: Identifying and meeting customer wants
        kind: definition
        term: marketing
        core: true
        note: Far more than advertising; research, planning, pricing and distribution are all marketing decisions.
      - label: One of four functions, with HR, finance and operations
        core: true
        note: Marketing can promise only what the other functions can deliver.
      - label: 'Market: all the buyers and sellers of a product'
        kind: definition
        term: market
        core: true
        children:
          - label: Consumer and business-to-business markets
            kind: type
          - label: Definition sets size and share
            note: A narrowly or a broadly defined market gives different figures for every measure.
      - label: 'Ethical marketing: honest, fair, responsible'
        kind: definition
        term: ethical-marketing
        note: Truthful claims, no exploiting vulnerable groups, no greenwashing.
      - label: Non-profits market too
        kind: example
        note: Charities market themselves to donors, volunteers and the people they serve.
  - label: Market or product orientation
    kind: types
    children:
      - label: 'Market orientation: research first, then the product'
        kind: type
        term: market-orientation
        core: true
        children:
          - label: Follows changing tastes
            kind: advantage
          - label: Research costs time and money
            kind: limitation
      - label: 'Product orientation: best product first, then buyers'
        kind: type
        term: product-orientation
        core: true
        children:
          - label: Can lead to breakthroughs
            kind: advantage
          - label: Risk of an excellent product nobody wants
            kind: limitation
      - label: Most firms blend the two
        core: true
        note: Fast-changing consumer markets lean towards research; specialist engineering leans towards the product.
  - label: Measuring the market
    kind: calculation
    children:
      - label: 'Market size: total sales of all sellers'
        kind: definition
        term: market-size
        core: true
        note: Measured by value (revenue) or by volume (units sold).
      - label: Market share
        kind: formula
        term: market-share
        core: true
        formula: Market share = the firm's sales ÷ total market sales × 100
      - label: Market growth
        kind: formula
        term: market-growth
        core: true
        formula: Market growth = (sales this period − sales last period) ÷ sales last period × 100
      - label: Value and volume can tell different stories
        note: A premium seller's share by value is larger than its share by volume.
      - label: 7,680 of 44,000 mugs = 17.5%
        kind: example
        note: In the Market Studio's fictional Porto market, total sales grew from 40,000 to 44,000 mugs, so market growth was 10%.
  - label: Reading share and growth
    kind: application
    children:
      - label: Rising sales can hide a falling share
        core: true
        note: If the market grows faster than the firm, the firm's share falls.
      - label: Falling sales can still mean a rising share
        core: true
        note: If the market shrinks faster than the firm, the firm's share rises.
      - label: Share shows rank, not profit
        note: Share bought with price cuts can cost more than it earns.
      - label: Fast growth draws in rivals
        note: In a slow-growing market, a firm grows mainly by taking rivals' customers.
  - label: Why share and leadership matter
    kind: evaluation
    level: HL
    children:
      - label: 'Market leader: biggest share'
        kind: definition
        term: market-leader
        level: HL
        core: true
      - label: Economies of scale lower unit costs
        kind: advantage
        term: economies-of-scale
        level: HL
        core: true
      - label: Brand recognition and bargaining power
        kind: advantage
        level: HL
        core: true
        note: Retailers want to stock the leader, and suppliers want its orders.
      - label: Sets the price others follow
        kind: advantage
        level: HL
      - label: Defending a lead is costly
        kind: limitation
        level: HL
        core: true
        note: Heavy promotion and price cuts to stay ahead can eat into profit.
      - label: Premium and niche firms may not chase share
        kind: limitation
        level: HL
        note: Profit, reputation or survival can matter more than size.
  - label: Connections
    kind: connection
    children:
      - label: '4.4: research tells a firm what customers want'
        core: true
      - label: '4.2: plans set targets for share and growth'
      - label: '4.5: share and growth place products on the BCG matrix'
      - label: '1.3: marketing objectives serve business objectives'
connections:
  - code: '4.2'
    label: Planning a target market and a position from what the market shows
  - code: '4.4'
    label: Research, the starting point of a market orientation
  - code: '4.5'
    label: Market share and market growth are the axes of the BCG matrix
  - code: '1.5'
    label: A larger share can bring economies of scale
  - code: '1.3'
    label: Marketing objectives serve the business's objectives
basis:
  - source: ib-bm-guide-2024
    pages: '31'

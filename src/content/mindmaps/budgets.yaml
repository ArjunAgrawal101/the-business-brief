# Mindmap: 3.9 Budgets (HL only). The platform's own summary of the
# subtopic's five content statements (guide p. 30), with the budget layout and
# its [F] and [A] labels taken from the guide (p. 63). Checked against the
# guide; no coursebook chapter was supplied for this unit.
title: Budgets
code: '3.9'
scope: subtopic
unit: 3
level: HL
summary: Cost and profit centres and what they are for, how a budget is built, how variances are calculated and labelled, and why budgets and variances matter for decisions.
centre: Budgets
order: 39
branches:
  - label: Cost and profit centres
    kind: concept
    level: HL
    children:
      - label: 'Cost centre: costs but no revenue of its own'
        kind: definition
        term: cost-centre
        level: HL
        core: true
        children:
          - label: IT, HR, maintenance, a hospital laundry
            kind: example
            level: HL
      - label: 'Profit centre: its own revenue and costs'
        kind: definition
        term: profit-centre
        level: HL
        core: true
        children:
          - label: A branch, a division, a product range
            kind: example
            level: HL
      - label: The difference is revenue
        level: HL
        core: true
        note: Only a profit centre's profit can be measured.
  - label: Roles of the centres
    kind: evaluation
    level: HL
    children:
      - label: Show where costs arise and profit is made
        kind: advantage
        level: HL
        core: true
      - label: Hold budget holders to account
        kind: advantage
        term: budget-holder
        level: HL
        core: true
      - label: Motivate through delegated responsibility
        kind: advantage
        level: HL
      - label: Guide decisions on what to grow or close
        kind: advantage
        level: HL
      - label: Sharing overheads can be arbitrary
        kind: limitation
        level: HL
        core: true
      - label: Centres may compete instead of cooperating
        kind: limitation
        level: HL
  - label: Constructing a budget
    kind: tool
    level: HL
    children:
      - label: A financial plan agreed in advance
        kind: definition
        term: budget
        level: HL
        core: true
      - label: Start from objectives and the sales forecast
        level: HL
        core: true
      - label: Set expected revenues and costs line by line
        level: HL
        core: true
      - label: Agree it with the budget holder
        term: budget-holder
        level: HL
      - label: Monitor actual figures through the period
        level: HL
      - label: 'Layout: budgeted, actual, variance'
        level: HL
        core: true
        note: As in the guide's budget layout, with each variance marked [F] or [A].
  - label: Variances
    kind: calculation
    level: HL
    children:
      - label: Variance
        kind: formula
        term: variance
        level: HL
        core: true
        formula: Variance = actual figure − budgeted figure
        note: Each variance is shown as an amount labelled [F] favourable or [A] adverse.
      - label: 'Favourable [F]: profit higher than planned'
        kind: definition
        term: favourable-variance
        level: HL
        core: true
        children:
          - label: Revenue above budget, or costs below it
            kind: example
            level: HL
      - label: 'Adverse [A]: profit lower than planned'
        kind: definition
        term: adverse-variance
        level: HL
        core: true
        children:
          - label: Revenue below budget, or costs above it
            kind: example
            level: HL
      - label: 'Milk budget $2,000, spent $2,300: $300 [A]'
        kind: example
        level: HL
  - label: Budgets in decision-making
    kind: evaluation
    level: HL
    children:
      - label: Plan and coordinate the departments
        kind: advantage
        level: HL
        core: true
      - label: Control spending through variances
        kind: advantage
        level: HL
        core: true
      - label: Set targets that can motivate
        kind: advantage
        level: HL
      - label: Ask why a variance arose before acting
        level: HL
        core: true
      - label: Rigid budgets slow the response to change
        kind: limitation
        level: HL
        core: true
      - label: Imposed or unrealistic budgets demotivate
        kind: limitation
        level: HL
      - label: Budgets may be padded, or spent to use them up
        kind: limitation
        level: HL
connections:
  - code: '2.2'
    label: Cost and profit centres follow the organizational structure
  - code: '2.4'
    label: Budget targets and responsibility as motivation
  - code: '3.3'
    label: The costs and revenues that budgets plan
  - code: '3.7'
    label: The cash flow forecast as a cash budget
  - code: '4.3'
    label: The sales forecast a budget starts from (HL)
basis:
  - source: ib-bm-guide-2024
    pages: '30, 63'

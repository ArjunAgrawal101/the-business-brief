# Mindmap: 5.9 Management information systems (HL only). The platform's own
# summary of the subtopic's content statements, following the guide's list
# (pp. 35 to 36). The supplied coursebook chapter (pp. 549 to 559) was used only
# to check coverage, and nothing from it is reproduced.
title: Management information systems
code: '5.9'
scope: subtopic
unit: 5
level: HL
summary: The data tools, security threats, infrastructure and technologies the guide names, how businesses use data on customers and employees, and the benefits, risks and ethics of it all.
centre: Management information systems
order: 59
branches:
  - label: Data and its tools
    kind: tool
    level: HL
    children:
      - label: 'MIS: data for decisions'
        kind: definition
        term: management-information-system
        core: true
        note: The guide uses the term for all the technologies in 5.9 together.
      - label: 'Database: organized, searchable records'
        kind: definition
        term: database
        core: true
      - label: 'Data analytics: patterns'
        kind: definition
        term: data-analytics
        core: true
        note: Describes what happened, explains why and predicts what is next.
  - label: Security
    kind: concept
    level: HL
    children:
      - label: 'Cybercrime: illegal attacks'
        kind: definition
        term: cybercrime
        core: true
        children:
          - label: Hacking and data theft
            kind: example
          - label: Ransomware and other malware
            kind: example
          - label: Phishing; denial of service
            kind: example
      - label: 'Cybersecurity: the defences'
        kind: definition
        term: cybersecurity
        core: true
        children:
          - label: Encryption, backups, training
            kind: example
      - label: A breach halts work and loses trust
        core: true
        note: Plus fines, repair costs and lost sales.
  - label: Critical infrastructure
    kind: concept
    level: HL
    children:
      - label: Systems everything runs on
        kind: definition
        term: critical-infrastructure
        core: true
      - label: Data centres
        term: data-centre
        core: true
        note: Buildings full of servers that store and process data.
      - label: Cloud computing
        term: cloud-computing
        core: true
        note: Storage and software over the internet, paid for as used.
      - label: Artificial neural networks
        term: artificial-neural-network
        core: true
        note: Systems that learn patterns from data; the basis of much AI.
  - label: New technologies
    kind: types
    level: HL
    children:
      - label: Artificial intelligence (AI)
        kind: type
        term: artificial-intelligence
        core: true
        note: Chatbots, recommendations, forecasting, fraud checks.
      - label: 'Big data: the three Vs'
        kind: type
        term: big-data
        core: true
        note: Volume, velocity and variety.
      - label: Internet of things (IoT)
        kind: type
        term: internet-of-things
        core: true
        note: Connected sensors share data without anyone acting.
      - label: Virtual reality (VR)
        kind: type
        term: virtual-reality
        core: true
        note: Training, product trials and virtual tours.
  - label: Using customer data
    kind: application
    level: HL
    children:
      - label: Customer loyalty programmes
        term: customer-loyalty-programme
        core: true
        children:
          - label: Reward repeat buying
            kind: advantage
          - label: Data on who buys what, when
            kind: advantage
          - label: Costly; rivals copy; privacy
            kind: limitation
      - label: Data mining for decisions
        term: data-mining
        core: true
        children:
          - label: Forecasts, targeting, stock
            kind: advantage
          - label: Needs good data and questions
            kind: limitation
  - label: Monitoring employees
    kind: evaluation
    level: HL
    children:
      - label: Employee monitoring
        kind: definition
        term: employee-monitoring
        core: true
        note: Tracking output, speed, location and computer use.
      - label: Digital Taylorism
        kind: definition
        term: digital-taylorism
        core: true
        note: Taylor's scientific management (2.4), enforced by data.
      - label: Can raise productivity and consistency
        kind: advantage
      - label: Stress and loss of trust
        kind: limitation
        core: true
        note: Workers lose autonomy and may feel treated like machines.
      - label: Supportive use spots training needs
  - label: Benefits, risks, ethics
    kind: evaluation
    level: HL
    children:
      - label: Faster, better decisions
        kind: advantage
        core: true
      - label: Lower costs, new models
        kind: advantage
      - label: Cost, data overload, dependence
        kind: limitation
        core: true
      - label: Privacy and consent
        kind: limitation
        term: data-privacy
        core: true
      - label: Bias coded into algorithms
        kind: limitation
        term: algorithmic-bias
      - label: Jobs replaced by automation
        kind: limitation
      - label: Stakeholders gain and lose differently
        note: Customers get convenience; employees may lose jobs or privacy.
connections:
  - code: '2.4'
    label: Taylor's scientific management
  - code: '4.4'
    label: Data as a source of market research
  - code: '4.5'
    label: Brand loyalty and promotion
  - code: '5.7'
    label: Cybercrime can trigger a crisis
basis:
  - source: ib-bm-guide-2024
    pages: '35-36'
  - source: hodder-bm-2022
    pages: '549-559'

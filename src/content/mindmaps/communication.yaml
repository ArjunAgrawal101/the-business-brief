# Mindmap: 2.6 Communication. The platform's own summary of the subtopic's two
# content statements (guide p. 27). Checked against the guide only.
title: Communication
code: '2.6'
scope: subtopic
unit: 2
level: SL/HL
summary: How organizations communicate through formal and informal channels, how to choose the right method for a given situation, and the barriers that stop messages getting through.
centre: Communication
order: 26
branches:
  - label: Formal communication
    kind: types
    children:
      - label: Official channels, following the chain of command
        kind: definition
        term: formal-communication
        core: true
      - label: Reports, memos, emails, meetings, intranet
        kind: example
        core: true
      - label: Flows down, up and across
        note: Instructions go down, reports and feedback go up, coordination goes across.
      - label: Accurate, recorded, carries authority
        kind: advantage
        core: true
      - label: Slow, and filtered in tall structures
        kind: limitation
  - label: Informal communication
    kind: types
    children:
      - label: Unofficial messages outside formal channels
        kind: definition
        term: informal-communication
        core: true
      - label: Conversations, chat groups, the grapevine
        kind: example
        core: true
      - label: Fast; builds relationships and trust
        kind: advantage
        core: true
      - label: Shows managers what staff really think
        kind: advantage
      - label: Spreads rumours and inaccurate news
        kind: limitation
        core: true
  - label: Methods and media
    kind: types
    children:
      - label: 'Written: letters, reports, email'
        kind: type
        core: true
      - label: 'Oral: meetings, calls, presentations'
        kind: type
        core: true
      - label: 'Visual: charts, diagrams, video'
        kind: type
      - label: 'Non-verbal: body language, tone'
        kind: type
      - label: 'Digital: intranet, messaging, video calls'
        kind: type
        core: true
  - label: Choosing a method for the situation
    kind: evaluation
    children:
      - label: 'Sensitive news: face to face'
        core: true
        note: For example, redundancies or a performance problem.
      - label: 'Needs a record: written and formal'
        core: true
        note: For example, contracts, policies and warnings.
      - label: 'Urgent: a call, message or meeting'
        core: true
      - label: 'Complex: two-way, with time for questions'
      - label: 'Large or scattered audience: digital'
      - label: Weigh cost, speed, culture and the receiver
        core: true
  - label: Barriers to communication
    kind: concept
    children:
      - label: Anything that stops a message being understood
        kind: definition
        term: barriers-to-communication
        core: true
      - label: Jargon and technical language
        term: jargon
        core: true
      - label: Language and cultural differences
        core: true
      - label: Information overload
        term: information-overload
        core: true
      - label: Distance, time zones, technical failures
      - label: Long chains of command distort messages
      - label: Emotions, attitudes and lack of trust
  - label: Overcoming barriers
    kind: application
    children:
      - label: Know the audience; use plain language

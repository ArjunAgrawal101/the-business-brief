# Mindmap: 3.1 Introduction to finance. The platform's own summary of the
# subtopic's content statement (guide p. 28): the role of finance, capital
# expenditure and revenue expenditure. Checked against the guide; no coursebook
# chapter was supplied for this unit.
title: Introduction to finance
code: '3.1'
scope: subtopic
unit: 3
level: SL/HL
summary: Why every business needs a finance function, and the two kinds of spending it manages, capital expenditure on assets that last and revenue expenditure on day-to-day running.
centre: Introduction to finance
order: 31
branches:
  - label: The role of finance
    kind: concept
    children:
      - label: Obtains, plans, controls and records money
        kind: definition
        term: finance-function
        core: true
        note: The finance function serves every other function of the business.
      - label: Raises funds to start, run and grow
        core: true
        note: Choosing sources that fit the amount, the time and the risk (3.2).
      - label: Keeps enough cash to pay bills on time
        core: true
        note: Liquidity and cash flow forecasting (3.7).
      - label: Records results and reports to stakeholders
        note: The final accounts (3.4).
      - label: Plans and controls spending
        note: Forecasts, and for HL students, budgets (3.9).
      - label: Supports HR, marketing and operations
        note: Wages and training, promotion, equipment and materials all need finance.
      - label: Informs decisions with financial data
        note: Costs, revenues and expected returns guide pricing, investment and growth.
  - label: Capital expenditure
    kind: concept
    children:
      - label: Spending on assets used for more than a year
        kind: definition
        term: capital-expenditure
        core: true
      - label: Premises, machinery, vehicles, IT systems
        kind: example
        core: true
      - label: Recorded as a non-current asset
        term: non-current-assets
        core: true
        note: Its cost is spread over the years the asset is used, not charged all at once.
      - label: Large, infrequent and hard to reverse
        note: Usually judged with investment appraisal first (3.8).
      - label: Matched with long-term finance
        term: long-term-finance
  - label: Revenue expenditure
    kind: concept
    children:
      - label: Day-to-day spending used up within the year
        kind: definition
        term: revenue-expenditure
        core: true
      - label: Wages, rent, materials, fuel, repairs
        kind: example
        core: true
      - label: Charged in full as a cost this year
        core: true
        note: It lowers this year's profit through expenses or cost of sales.
      - label: Keeps the business running at its current level
      - label: Paid from revenue or short-term finance
        term: short-term-finance
  - label: Telling them apart
    kind: application
    children:
      - label: 'Test: does the benefit last beyond a year?'
        kind: question
        core: true
      - label: 'Buying a delivery van: capital'
        kind: example
        core: true
      - label: 'Fuel, insurance and servicing for it: revenue'
        kind: example
        core: true
      - label: 'Repairing a roof: revenue; an extension: capital'
        kind: example
      - label: 'Software subscription: revenue; new system: capital'
        kind: example
      - label: Misclassifying spending distorts profit
        kind: limitation
        note: Charging capital spending as a cost understates this year's profit and overstates later years'.
  - label: Connections
    kind: connection
    children:
      - label: 'Paying for spending: 3.2 sources of finance'
        core: true
      - label: 'Where spending appears: 3.4 final accounts'
        core: true
      - label: 'Cash timing: 3.7 cash flow'
      - label: 'Choosing projects: 3.8 investment appraisal'
connections:
  - code: '1.1'
    label: Finance as one of the four business functions
  - code: '3.2'
    label: The sources that pay for capital and revenue spending
  - code: '3.4'
    label: Where each kind of spending appears in the final accounts
  - code: '3.7'
    label: Spending drains cash before it brings returns
  - code: '3.8'
    label: Judging capital expenditure before it is made
basis:
  - source: ib-bm-guide-2024
    pages: '28'

title: Industrial/employee relations
code: '2.7'
scope: subtopic
unit: 2
level: HL
summary: Why conflict arises between employers and employees, the approaches each side can take in a dispute, and the ways conflict is resolved, from conciliation and arbitration to no-strike and single-union agreements.
centre: Industrial/employee relations
order: 27
branches:
  - label: Employee relations
    kind: concept
    level: HL
    children:
      - label: Relations between managers and employees
        kind: definition
        term: industrial-relations
        core: true
      - label: Trade unions represent employees
        term: trade-union
        core: true
        note: They negotiate pay and conditions and support members in disputes.
      - label: 'Good relations: cooperation, smoother change'
        kind: advantage
      - label: Power depends on unions, law, unemployment
  - label: Sources of conflict
    kind: concept
    level: HL
    children:
      - label: Pay and benefits
        core: true
      - label: Working hours and conditions
        core: true
      - label: Job security and redundancies
        term: redundancy
        core: true
      - label: 'Change: new technology, restructuring'
        core: true
      - label: Management style and fair treatment
      - label: Owners want lower costs; staff want more
        note: The objectives of the two groups often pull in different directions.
  - label: Approaches by employees
    kind: types
    level: HL
    children:
      - label: Collective bargaining
        kind: type
        term: collective-bargaining
        core: true
        note: Employees negotiate together, usually through a trade union.
      - label: Industrial action
        term: industrial-action
        core: true
        children:
          - label: 'Work-to-rule: follow every rule exactly'
            kind: type
            term: work-to-rule
            core: true
          - label: 'Strike action: stop working'
            kind: type
            term: strike-action
            core: true
  - label: Approaches by employers
    kind: types
    level: HL
    children:
      - label: Collective bargaining
        kind: type
        term: collective-bargaining
        core: true
      - label: Threats of redundancies
        kind: type
        term: redundancy
        core: true
      - label: Changes of contract
        kind: type
        term: changes-of-contract
        core: true
        note: New hours, pay or duties, imposed or threatened.
      - label: 'Closure: shut, or threaten to'
        kind: type
        term: workplace-closure
        core: true
      - label: 'Lockout: bar staff from work'
        kind: type
        term: lockout
        core: true
  - label: Resolving conflict
    kind: application
    level: HL
    children:
      - label: 'Conciliation: a third party helps both sides agree'
        kind: type
        term: conciliation
        core: true
      - label: 'Arbitration: a third party decides'
        kind: type
        term: arbitration
        core: true
      - label: 'Employee participation: a say in decisions'
        kind: type
        term: employee-participation
        core: true
      - label: 'Industrial democracy: a share of real power'
        kind: type
        term: industrial-democracy
        core: true
      - label: No-strike agreement
        kind: type
        term: no-strike-agreement
        core: true
        note: The union gives up strikes, usually in return for arbitration or better terms.
      - label: Single-union agreement
        kind: type
        term: single-union-agreement
        core: true
        note: The employer negotiates with one union for all of its staff.
  - label: Weighing up conflict
    kind: evaluation
    level: HL
    children:
      - label: Lost output, sales and reputation
        kind: limitation
        core: true
      - label: Strikers lose pay and may risk their jobs
        kind: limitation
      - label: Imposed solutions damage long-term trust
        kind: limitation
      - label: Some conflict exposes real problems
        kind: advantage
      - label: Consulting early prevents many disputes
        core: true
  - label: Connections
    kind: connection
    level: HL
    children:
      - label: '1.4: employees and unions as stakeholders'
        core: true
      - label: '2.1: change and resistance to change'
      - label: '2.4: pay and rewards'
connections:
  - code: '1.4'
    label: Employees and unions are stakeholders whose aims can conflict with owners'
  - code: '2.1'
    label: Change and resistance to change are common sources of conflict
  - code: '2.3'
    label: Leadership style affects how disputes start and how they end
  - code: '2.4'
    label: Pay and rewards are frequent causes of disputes

# Mindmap: 4.6 International marketing (HL only). The platform's own summary of
# the subtopic's one content statement, the opportunities and threats of
# entering and operating internationally (guide p. 32), with the ways in and
# the choice of how far to adapt the mix. Every branch and node is HL.
title: International marketing
code: '4.6'
scope: subtopic
unit: 4
level: HL
summary: An HL subtopic on the opportunities and threats of entering and operating in international markets, the main ways in, and whether to standardize the marketing mix or adapt it for each market.
centre: International marketing
order: 46
branches:
  - label: Going international
    kind: concept
    level: HL
    children:
      - label: Marketing across countries
        kind: definition
        term: international-marketing
        level: HL
        core: true
      - label: Which markets, how to enter, how far to adapt
        level: HL
        core: true
      - label: E-commerce lowers the cost of a first step
        term: e-commerce
        level: HL
  - label: Ways to enter
    kind: types
    level: HL
    children:
      - label: 'Exporting: lowest risk'
        kind: type
        term: exporting
        level: HL
        core: true
        note: Little investment, but less control and local knowledge.
      - label: 'Licensing: fees for a brand or patent'
        kind: type
        term: licensing
        level: HL
        core: true
      - label: 'Franchising: a whole business model'
        kind: type
        term: franchising
        level: HL
      - label: Joint ventures and alliances
        kind: type
        term: joint-venture
        level: HL
        core: true
      - label: Acquisitions or own operations abroad
        kind: type
        term: acquisition
        level: HL
      - label: Risk rises with control
        level: HL
        core: true
        note: Exporting risks and controls least; owning operations abroad risks and controls most.
  - label: Opportunities
    kind: application
    level: HL
    children:
      - label: New customers, faster growth
        kind: advantage
        level: HL
        core: true
        note: Especially when the home market is saturated.
      - label: Economies of scale
        kind: advantage
        term: economies-of-scale
        level: HL
        core: true
      - label: Risk spread across markets
        kind: advantage
        level: HL
        core: true
      - label: A longer product life cycle
        kind: advantage
        term: product-life-cycle
        level: HL
      - label: Free trade inside a bloc
        kind: advantage
        term: trading-bloc
        level: HL
      - label: Access to cheaper resources
        kind: advantage
        level: HL
  - label: Threats
    kind: evaluation
    level: HL
    children:
      - label: Cultural and language differences
        kind: limitation
        level: HL
        core: true
        note: Tastes, customs, values and meanings differ from market to market.
      - label: 'Trade barriers: tariffs, quotas, rules'
        kind: limitation
        term: trade-barriers
        level: HL
        core: true
      - label: Exchange rate swings
        kind: limitation
        term: exchange-rate
        level: HL
        core: true
      - label: Legal and political risk
        kind: limitation
        level: HL
      - label: Unfamiliar rivals and customers
        kind: limitation
        level: HL
      - label: Hard to manage from afar
        kind: limitation
        level: HL
  - label: Standardize or adapt
    kind: application
    level: HL
    children:
      - label: 'Standardized: one mix everywhere'
        kind: type
        term: standardized-marketing
        level: HL
        core: true
        children:
          - label: Scale economies, one image
            kind: advantage
            level: HL
          - label: Ignores local differences
            kind: limitation
            level: HL
      - label: 'Glocalization: global brand, local changes'
        kind: type
        term: glocalization
        level: HL
        core: true
        children:
          - label: Fits local tastes and laws
            kind: advantage
            level: HL
          - label: Costlier and more complex
            kind: limitation
            level: HL
      - label: Culture guides adaptation
        level: HL
        note: Hofstede's cultural dimensions, an HL toolkit tool, help judge how far to adapt.

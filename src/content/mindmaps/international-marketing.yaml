        level: HL
        core: true
      - label: '1.5: growth by venture, alliance or franchise'
        level: HL
      - label: '4.5: the people P varies between cultures'
        level: HL
        core: true
      - label: 'Toolkit: STEEPLE for each new market'
        level: HL

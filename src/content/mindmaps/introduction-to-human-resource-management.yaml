# Mindmap: 2.1 Introduction to human resource management. The platform's own
# summary of the subtopic's four content statements (guide p. 25). No coursebook
# chapter was supplied for unit 2, so the map was checked against the guide only.
title: Introduction to human resource management
code: '2.1'
scope: subtopic
unit: 2
level: SL/HL
summary: What human resource management does, the internal and external factors that shape workforce planning, why people resist change at work and how HR strategies can reduce that resistance.
centre: Introduction to human resource management
order: 21
branches:
  - label: The role of HRM
    kind: concept
    children:
      - label: 'HRM: managing people to meet objectives'
        kind: definition
        term: human-resource-management
        core: true
        note: People are planned for, recruited, developed, rewarded and supported like any other key resource.
      - label: 'Plan the workforce: numbers, skills, timing'
        term: human-resource-planning
        core: true
        note: Forecast the staff needed, compare with the staff in post, then recruit, train, redeploy or reduce.
      - label: Recruit and select new staff
        term: recruitment
        core: true
      - label: Train, appraise and develop people
        core: true
        note: The types of training are in 2.4; the types of appraisal are HL content in 2.4.
      - label: Reward staff and look after their welfare
        note: Pay and benefits, health and safety, and relations with employees and their unions.
      - label: 'Manage exits: retirement, dismissal, redundancy'
        term: redundancy
        note: Redundancy means the job is no longer needed; dismissal follows misconduct or poor performance.
  - label: Internal factors in HR planning
    kind: concept
    children:
      - label: Objectives and growth plans
        core: true
        note: Expansion needs more or different staff; cutting back needs fewer.
      - label: The budget for labour costs
        core: true
      - label: 'Working patterns: flexi-time, remote work'
        term: flexi-time
        core: true
        note: The business sets its own patterns, though the demand for flexibility also comes from outside.
        children:
          - label: Part-time, job sharing, hybrid working
            term: flexible-working
      - label: New technology and automation
        core: true
        note: Changes how many people are needed and which skills they must have.
      - label: Staff leaving, retiring or being promoted
        note: Each creates a gap to fill; at HL the rate of leaving is measured as labour turnover.
      - label: Structure and culture
        note: A flatter structure needs fewer managers; the culture shapes whom the business hires.
  - label: External factors in HR planning
    kind: concept
    children:
      - label: Demographic change
        term: demographic-change
        core: true
        children:
          - label: 'Ageing population: more retirements'
            kind: example
            note: Fewer young people join the workforce as more older staff retire.
      - label: Labour mobility
        term: labour-mobility
        core: true
        children:
          - label: 'Occupational: ease of changing job or skills'
          - label: 'Geographical: ease of moving to the work'
      - label: Immigration
        term: immigration
        core: true
        note: Adds workers and scarce skills, subject to visa and work-permit rules.
      - label: The gig economy
        term: gig-economy
        core: true
        note: Short-term, task-based work, often through apps; flexible for firms but insecure for workers.
      - label: Employment law and the economy
        note: Minimum wages, employment rights, the level of unemployment and rivals' pay offers.
  - label: Why people resist change
    kind: concept
    children:
      - label: Reluctance or opposition to new ways of working
        kind: definition
        term: resistance-to-change
        core: true
      - label: Fear of the unknown
        core: true
      - label: Threat to jobs, pay or status
        core: true
      - label: Comfort with familiar routines
      - label: Poor communication, no consultation
        core: true
      - label: Low trust in management
  - label: Reducing resistance to change
    kind: application
    children:
      - label: Manage the people side of change
        kind: definition
        term: change-management
        core: true
      - label: 'Communicate early: why, what and when'
        core: true
      - label: Consult and involve staff
        core: true
        note: People resist less the changes they have helped to shape.
      - label: Train and support, including retraining
        core: true
        note: Also counselling, redeployment and help for anyone who is made redundant.
      - label: Negotiate incentives or guarantees
        note: For example, a bonus for adopting the change or a promise of no compulsory redundancies.
      - label: Introduce in stages, or pilot first
      - label: 'Coercion: quick, but breeds resentment'
        kind: limitation
      - label: Force field analysis (toolkit)
        term: force-field-analysis
        level: HL
        note: Weighs the forces driving a change against those restraining it, to plan how to manage it.
  - label: Connections
    kind: connection
    children:
      - label: '2.4: recruitment, training and rewards'
        core: true
      - label: '2.2: flexible work reshapes structures'
      - label: '2.7: change as a source of conflict'
        level: HL
      - label: '1.3: the HR plan follows the objectives'
connections:
  - code: '1.3'
    label: The objectives set the workforce the business will need
  - code: '2.2'
    label: Flexible working and the gig economy reshape structures
  - code: '2.4'
    label: Recruitment, training and rewards put the plan into action
  - code: '2.7'
    label: Change imposed without consultation is a source of conflict (HL)
basis:
  - source: ib-bm-guide-2024
    pages: '25'

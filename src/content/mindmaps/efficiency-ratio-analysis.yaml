# Mindmap: 3.6 Efficiency ratio analysis (HL only). The platform's own summary
# of the subtopic's three content statements (guide p. 29). Every formula is
# the one on the guide's formula sheet (p. 64) and matches the platform's ratio
# calculators. Checked against the guide; no coursebook chapter was supplied
# for this unit.
title: Efficiency ratio analysis
code: '3.6'
scope: subtopic
unit: 3
level: HL
summary: The four HL efficiency ratios, stock turnover, debtor days, creditor days and gearing, how to improve each and at what cost, and the difference between insolvency and bankruptcy.
centre: Efficiency ratio analysis
order: 36
branches:
  - label: Efficiency ratios
    kind: concept
    level: HL
    children:
      - label: How well stock, credit and finance are managed
        kind: definition
        term: efficiency-ratios
        level: HL
        core: true
      - label: Explain changes in liquidity and profit
        level: HL
        note: Slow stock and late payers tie up cash; high gearing adds interest.
      - label: Judge against past years and similar firms
        level: HL
        core: true
      - label: The guide puts gearing in this group
        level: HL
        note: Elsewhere it is usually called a solvency or financial structure ratio.
  - label: Stock turnover
    kind: calculation
    level: HL
    children:
      - label: Number of times a year
        kind: formula
        term: stock-turnover
        level: HL
        core: true
        formula: Stock turnover (number of times) = cost of sales ÷ average stock
      - label: Number of days
        kind: formula
        term: stock-turnover
        level: HL
        core: true
        formula: Stock turnover (number of days) = (average stock ÷ cost of sales) × 365
      - label: Average stock
        kind: formula
        level: HL
        core: true
        formula: Average stock = (opening stock + closing stock) ÷ 2
      - label: More times, or fewer days, means faster sales
        level: HL
      - label: Fresh food turns over fast, furniture slowly
        kind: example
        level: HL
  - label: Debtor days and creditor days
    kind: calculation
    level: HL
    children:
      - label: Debtor days
        kind: formula
        term: debtor-days
        level: HL
        core: true
        formula: Debtor days ratio (number of days) = (debtors ÷ total sales revenue) × 365
        note: Fewer days means customers pay sooner.
      - label: Creditor days
        kind: formula
        term: creditor-days
        level: HL
        core: true
        formula: Creditor days ratio (number of days) = (creditors ÷ cost of sales) × 365
        note: More days keeps cash longer but can strain suppliers.
      - label: Paid by customers before paying suppliers?
        kind: question
        level: HL
        note: Debtor days below creditor days help cash flow.
      - label: 'Debtors $50,000, sales $365,000: 50 days'
        kind: example
        level: HL
  - label: Gearing ratio
    kind: calculation
    level: HL
    children:
      - label: Gearing ratio
        kind: formula
        term: gearing-ratio
        level: HL
        core: true
        formula: Gearing ratio = (non-current liabilities ÷ capital employed) × 100
        children:
          - label: Capital employed
            kind: formula
            term: capital-employed
            level: HL
            formula: Capital employed = non-current liabilities + equity
      - label: Above about 50% is highly geared
        level: HL
        core: true
        note: More interest to pay and more exposed to rising interest rates.
      - label: Low gearing is safer but may slow growth
        level: HL
  - label: Improving the ratios
    kind: evaluation
    level: HL
    children:
      - label: 'Stock: hold less, clear slow lines, use JIT'
        level: HL
        core: true
        children:
          - label: Risk of running out and losing sales
            kind: limitation
            level: HL
      - label: 'Debtors: credit checks, chasing, factoring'
        term: debt-factoring
        level: HL
        core: true
        children:
          - label: Customers may move to rivals offering credit
            kind: limitation
            level: HL
      - label: 'Creditors: negotiate longer credit terms'
        level: HL
        core: true
        children:
          - label: Suppliers may refuse credit or discounts
            kind: limitation
            level: HL
      - label: 'Gearing: issue shares, retain profit, repay loans'
        level: HL
        core: true
        children:
          - label: New shares dilute the owners' control
            kind: limitation
            level: HL
  - label: Insolvency versus bankruptcy
    kind: concept
    level: HL
    children:
      - label: 'Insolvency: cannot pay debts when due'
        kind: definition
        term: insolvency
        level: HL
        core: true
        note: A financial state, which may be temporary.
      - label: 'Bankruptcy: the legal process that may follow'
        kind: definition
        term: bankruptcy
        level: HL
        core: true
        note: A court deals with the debts, usually by selling assets.
      - label: 'Liquidation: a company closed, assets sold'
        kind: definition
        term: liquidation
        level: HL
      - label: Profitable firms can still become insolvent
        level: HL
        core: true
        note: Profit is not cash (3.7).
      - label: Laws and terms differ between countries
        level: HL
connections:
  - code: '3.5'
    label: The profitability and liquidity ratios
  - code: '3.7'
    label: Working capital and the cash cycle
  - code: '3.2'
    label: The choice of finance drives gearing
  - code: '5.3'
    label: Just-in-time and stock levels
  - code: '5.6'
    label: Stock control and stock turnover
basis:

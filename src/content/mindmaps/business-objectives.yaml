# Mindmap: 1.3 Business objectives. The platform's own summary of the
# subtopic's four content statements (guide pp. 23 to 24). Checked against the
# guide; the supplied coursebook chapter 1.3 was used only to confirm
# coverage, and nothing in it is reproduced.
title: Business objectives
code: '1.3'
scope: subtopic
unit: 1
level: SL/HL
summary: How a vision and a mission become strategic and tactical objectives, the objectives businesses commonly set, and what corporate social responsibility asks of them.
centre: Business objectives
order: 13
branches:
  - label: Vision and mission
    kind: concept
    children:
      - label: 'Vision: the future it hopes to create'
        kind: definition
        term: vision-statement
        core: true
      - label: 'Mission: its purpose, for whom, with what values'
        kind: definition
        term: mission-statement
        core: true
      - label: Vision looks ahead; mission states the purpose now
        core: true
      - label: Unite staff and guide decisions
        kind: advantage
      - label: Vague, hard to measure, can be mere PR
        kind: limitation
  - label: Strategic and tactical objectives
    kind: types
    children:
      - label: 'Objective: a specific, measurable target'
        kind: definition
        term: business-objective
        core: true
      - label: Best written as SMART objectives
        term: smart-objectives
        note: Specific, measurable, achievable, realistic and time-bound.
      - label: 'Strategic: long-term, for the whole organization'
        kind: type
        term: strategic-objective
        core: true
      - label: 'Tactical: shorter-term, supports the strategy'
        kind: type
        term: tactical-objective
        core: true
      - label: 'Strategy: the long-term plan to get there'
        term: strategy
        core: true
      - label: 'Tactics: short-term actions within it'
        term: tactics
  - label: Common objectives
    kind: types
    children:
      - label: 'Growth: more sales, outlets or market share'
        kind: type
        term: business-growth
        core: true
      - label: 'Profit: maximize it, or make enough'
        kind: type
        term: profit-maximization
        core: true
        note: Many firms settle for a satisfactory profit (satisficing).
      - label: Protecting shareholder value
        kind: type
        term: shareholder-value
        core: true
        note: A rising share price and reliable dividends.
      - label: 'Ethical: doing what is morally right'
        kind: type
        term: ethical-objectives
        core: true
      - label: Also survival, market share and cash flow
      - label: Objectives change as conditions change
        note: New rivals, a recession, new owners or a new stage of growth.
  - label: Corporate social responsibility
    kind: concept
    children:
      - label: 'CSR: responsibility for impact on society'
        kind: definition
        term: corporate-social-responsibility
        core: true
      - label: Goes beyond what the law requires
        core: true
      - label: 'Triple bottom line: profit, people, planet'
        term: triple-bottom-line
        core: true
      - label: Rooted in business ethics
        term: business-ethics
      - label: Expectations of CSR keep changing
        note: Laws, stakeholder pressure and media scrutiny all move over time.
  - label: Evaluating objectives and CSR
    kind: evaluation
    children:
      - label: Objectives focus effort and measure success
        kind: advantage
        core: true
      - label: Imposed or rigid targets can backfire
        kind: limitation
      - label: CSR builds reputation, loyalty and trust
        kind: advantage
        core: true
      - label: CSR raises costs; the payback is uncertain
        kind: limitation
        core: true
      - label: Claims without action destroy trust
        kind: limitation
      - label: Whose interests come first?
        kind: question
        note: Shareholders, other stakeholders or society as a whole.
  - label: Connections
    kind: connection
    children:
      - label: 'Objectives differ by type of entity: 1.2'
        core: true
      - label: 'Stakeholders shape and contest objectives: 1.4'
      - label: Circular business models put CSR into practice
        term: circular-business-models
      - label: 'Growth as an objective: 1.5'
connections:
  - code: '1.2'
    label: Objectives differ between types of business entity
  - code: '1.4'
    label: Stakeholders' interests shape objectives and CSR
  - code: '1.5'
    label: Growth as an objective, and how to achieve it
  - code: '3.5'
    label: Ratios that measure progress towards profit objectives
basis:
  - source: ib-bm-guide-2024
    pages: '23-24'
  - source: hodder-bm-2022
    pages: '84-96'

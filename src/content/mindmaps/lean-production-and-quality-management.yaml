# Mindmap: 5.3 Lean production and quality management (HL only). The platform's
# own summary of the subtopic's seven content statements (guide p. 34). Checked
# against the guide; no coursebook chapter for 5.3 was supplied, and nothing from
# any source is reproduced.
title: Lean production and quality management
code: '5.3'
scope: subtopic
unit: 5
level: HL
summary: How lean production cuts waste, how kaizen, just-in-time and cradle to cradle design work, and how businesses control, assure and manage quality.
centre: Lean production and quality management
order: 53
branches:
  - label: Lean production
    kind: concept
    level: HL
    children:
      - label: Cut whatever adds no value
        kind: definition
        term: lean-production
        core: true
        note: Value is judged from the customer's point of view.
      - label: 'Feature: less waste'
        term: waste
        core: true
        children:
          - label: Overproduction, excess stock
          - label: Waiting and needless movement
          - label: Defects and over-processing
      - label: 'Feature: greater efficiency'
        term: efficiency
        core: true
        note: More output from fewer resources.
  - label: Lean methods
    kind: tool
    level: HL
    children:
      - label: 'Kaizen: continuous improvement'
        kind: definition
        term: kaizen
        core: true
        note: Many small changes suggested by the people who do the work.
      - label: Just-in-time (JIT)
        kind: definition
        term: just-in-time
        core: true
        note: Materials arrive as needed; goods are made to order.
        children:
          - label: Frees cash and space
            kind: advantage
          - label: Needs reliable suppliers
            kind: limitation
  - label: Cradle to cradle
    kind: concept
    level: HL
    children:
      - label: Every material reused or safely returned
        kind: definition
        term: cradle-to-cradle-design
        core: true
      - label: Designed for repair and disassembly
        core: true
      - label: Two material cycles
        note: Biological materials break down safely; technical materials are recovered and reused.
      - label: Not make, use, throw away
        note: A route to a circular business model (toolkit).
  - label: Controlling quality
    kind: types
    level: HL
    children:
      - label: 'Quality control: inspect'
        kind: definition
        term: quality-control
        core: true
        note: Finds and removes faulty items after they are made.
      - label: 'Quality assurance: prevent'
        kind: definition
        term: quality-assurance
        core: true
        note: Builds quality into every stage, with everyone responsible.
      - label: Defect rate shows the result
        term: defect-rate
        note: Measured in 5.6.
  - label: Managing quality
    kind: tool
    level: HL
    children:
      - label: Quality circles
        term: quality-circle
        core: true
        note: Staff groups solve quality problems in their own area.
      - label: Benchmarking
        term: benchmarking
        core: true
        note: Compare with the best performer and adopt better practice.
      - label: Total quality management
        term: total-quality-management
        core: true
        note: TQM makes everyone responsible for quality, right first time.
  - label: Quality standards
    kind: concept
    level: HL
    children:
      - label: Set requirements, certified
        kind: definition
        term: quality-standard
        core: true
      - label: 'National: set by a country'
        kind: type
        core: true
      - label: 'International: e.g. ISO 9000'
        kind: type
        core: true
        note: Recognized across borders, which helps exporters.
      - label: Why they matter
        core: true
        children:
          - label: Trust and access to contracts
            kind: advantage
            core: true
          - label: Costly; proves process only
            kind: limitation
  - label: Impact on the organization
    kind: evaluation
    level: HL
    children:
      - label: Lower costs and less waste
        kind: advantage
        core: true
      - label: Better quality and reputation
        kind: advantage
        core: true
      - label: Involved, motivated staff
        kind: advantage
        note: Kaizen and quality circles use employees' ideas.
      - label: Training and culture costs
        kind: limitation
        core: true
      - label: JIT exposed to supply shocks
        kind: limitation
        core: true
      - label: Benefits can take years
        kind: limitation
connections:
  - code: '5.6'
    label: JIT versus just-in-case, and the defect rate
  - code: '5.2'
    label: Lean ideas applied to batch and flow production
  - code: '2.4'
    label: Empowerment and teamwork behind kaizen
  - code: '1.3'
    label: Sustainability and corporate social responsibility
basis:
  - source: ib-bm-guide-2024
    pages: '34'

# Mindmap: 3.7 Cash flow. The platform's own summary of the subtopic's six
# content statements (guide pp. 29 to 30), with the forecast's line names taken
# from the guide's layout (p. 63). Formulas match the platform's cash flow
# calculators. Checked against the guide; no coursebook chapter was supplied
# for this unit.
title: Cash flow
code: '3.7'
scope: subtopic
unit: 3
level: SL/HL
summary: Why profit and cash are different, how working capital and liquidity keep a business alive, how a cash flow forecast is built and used, and what a business can do when cash runs short.
centre: Cash flow
order: 37
branches:
  - label: Profit and cash flow
    kind: concept
    children:
      - label: 'Cash flow: cash moving in and out'
        kind: definition
        term: cash-flow
        core: true
      - label: 'Profit: revenue minus costs when earned'
        kind: definition
        term: profit
        core: true
      - label: 'Credit sales: revenue now, cash later'
        term: credit-sales
        core: true
      - label: 'Assets bought: cash out now, cost spread'
        core: true
        note: Depreciation is a cost but never a cash outflow.
      - label: 'Loans and new shares: cash in, not revenue'
      - label: Stock is paid for before it is sold
      - label: Profitable but short of cash, or the reverse
        core: true
  - label: Working capital and liquidity
    kind: concept
    children:
      - label: Working capital
        kind: formula
        term: working-capital
        core: true
        formula: Working capital = current assets − current liabilities
      - label: 'Working capital cycle: cash out to cash back'
        term: working-capital-cycle
        core: true
      - label: 'Liquidity position: can it pay its bills?'
        kind: definition
        term: liquidity
        core: true
        note: Judged from cash, working capital and the liquidity ratios (3.5).
      - label: 'Too little: missed payments, lost supplies'
        kind: limitation
      - label: 'Too much: cash idle instead of earning'
        kind: limitation
      - label: 'Overtrading: growing faster than cash allows'
        term: overtrading
  - label: Cash flow forecast
    kind: calculation
    children:
      - label: Month-by-month cash plan
        kind: definition
        term: cash-flow-forecast
        core: true
      - label: Opening balance
        term: opening-balance
        note: The previous month's closing balance.
      - label: 'Inflows: cash sales, debtors paying, loans'
        term: cash-inflow
      - label: 'Outflows: stock, wages, rent, repayments'
        term: cash-outflow
      - label: Net cash flow
        kind: formula
        term: net-cash-flow
        core: true
        formula: Net cash flow = total cash inflows − total cash outflows
      - label: Closing balance
        kind: formula
        term: closing-balance
        core: true
        formula: Closing balance = opening balance + net cash flow
      - label: Record cash when it moves, not when earned
        core: true
  - label: Forecasts in use
    kind: evaluation
    children:
      - label: Warns of a shortfall in time to act
        kind: advantage
        core: true
      - label: Supports a loan or overdraft request
        kind: advantage
        core: true
      - label: Helps plan the timing of spending
        kind: advantage
      - label: Only as good as the sales estimate
        kind: limitation
        core: true
      - label: Customers pay late; costs change
        kind: limitation
      - label: Hard for a new business with no history
        kind: limitation
  - label: Investment, profit and cash flow
    kind: concept
    children:
      - label: Investment takes cash out before it earns
        term: investment
        core: true
      - label: Profit may dip at first
        note: Set-up costs and depreciation come before the returns.
      - label: Returns later lift profit and cash inflows
        core: true
      - label: Finance it so that cash does not run out
        note: Long-term sources for long-term assets (3.2).
  - label: Dealing with cash flow problems
    kind: evaluation
    children:
      - label: Reduce or delay cash outflows
        core: true
        children:
          - label: Longer credit from suppliers
            term: trade-credit
            core: true
          - label: Lease rather than buy
            term: leasing
          - label: Cut or postpone spending that can wait
      - label: Bring cash inflows forward
        core: true
        children:
          - label: Chase debtors; shorten credit terms
            core: true
          - label: Debt factoring
            term: debt-factoring
            core: true
          - label: Sell surplus stock, or sale and leaseback
            term: sale-and-leaseback
      - label: Find extra finance
        core: true
        children:
          - label: Overdraft or short-term loan
            term: overdraft
            core: true
          - label: Owner's funds or new share capital
      - label: Each fix has a cost
        kind: limitation
        core: true
        note: Lower profit from fees and discounts, strained relationships or less control.
connections:
  - code: '3.2'
    label: Sources of finance that close a cash gap
  - code: '3.5'
    label: Liquidity ratios measure the cash position
  - code: '3.6'
    label: Stock, debtor and creditor days shape the cycle (HL)
  - code: '3.8'
    label: When an investment's returns arrive
  - code: '4.5'
    label: The product life cycle, investment, profit and cash flow
basis:
  - source: ib-bm-guide-2024
    pages: '29-30, 63'

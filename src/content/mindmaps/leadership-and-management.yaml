# Mindmap: 2.3 Leadership and management. The platform's own summary of the
# subtopic's three content statements (guide p. 26); scientific and intuitive
# thinking and management is HL only. It reuses the glossary terms in
# leadership.yaml. Checked against the guide only.
title: Leadership and management
code: '2.3'
scope: subtopic
unit: 2
level: SL/HL with HL-only content
summary: What managers do, how leadership differs from management, the five leadership styles and when each fits and, at HL, scientific and intuitive approaches to thinking and decision-making.
centre: Leadership and management
order: 23
branches:
  - label: Managing versus leading
    kind: concept
    children:
      - label: 'Management: getting things done through others'
        kind: definition
        term: management
        core: true
        note: Planning, organizing and controlling resources to meet objectives.
      - label: 'Leadership: influencing people towards a goal'
        kind: definition
        term: leadership
        core: true
        note: Influence that comes from vision, example and trust, not from position alone.
      - label: Managers run systems; leaders drive change
        core: true
        note: Management keeps the organization working; leadership sets direction and wins commitment.
      - label: Authority from position, influence from trust
      - label: The best managers also lead
  - label: Functions of management
    kind: theory
    children:
      - label: "Fayol: five things every manager does"
        term: functions-of-management
        core: true
        note: A standard description of managers' work, used here as a way in; the guide does not list the functions.
      - label: 'Planning: objectives and how to reach them'
        core: true
      - label: 'Organizing: people and resources'
        core: true
      - label: 'Commanding: directing and instructing staff'
        core: true
      - label: 'Coordinating: making the parts work together'
        core: true
      - label: 'Controlling: checking results against plans'
        core: true
  - label: Leadership styles
    kind: types
    children:
      - label: 'Autocratic: the leader decides alone'
        kind: type
        term: autocratic-leadership
        core: true
        note: Fast and clear; suits crises and inexperienced teams, but can demotivate.
      - label: "Paternalistic: decides in staff's interests"
        kind: type
        term: paternalistic-leadership
        core: true
        note: Cares for staff welfare, but gives them little say.
      - label: 'Democratic: involves staff in decisions'
        kind: type
        term: democratic-leadership
        core: true
        note: Builds commitment and draws on ideas, but takes longer.
      - label: 'Laissez-faire: the team decides'
        kind: type
        term: laissez-faire-leadership
        core: true
        note: Suits skilled, motivated experts; without them it drifts.
      - label: 'Situational: style adapts to task and team'
        kind: type
        term: situational-leadership
        core: true
        note: Matches the style to the situation and to people's readiness.
  - label: Choosing a style
    kind: evaluation
    children:
      - label: No style is best in every situation
        core: true
        note: Judge how well a style fits the context rather than praising one style.
      - label: Urgency and risk of the decision
        core: true
        note: A crisis can justify quick, autocratic decisions.
      - label: Skills and motivation of the team
        core: true
        note: Experts need freedom; new or unskilled staff need direction.
      - label: Culture and staff expectations
        note: Staff used to being consulted may resist an autocratic leader.
      - label: Size of the team and nature of the task
      - label: "The leader's own personality and skills"
  - label: Scientific and intuitive thinking
    kind: concept
    level: HL
    children:
      - label: 'Scientific: data, logic, a step-by-step process'
        kind: definition
        term: scientific-decision-making
        core: true
      - label: 'Intuitive: judgement, experience, gut feeling'
        kind: definition
        term: intuitive-decision-making
        core: true
      - label: Scientific suits data-rich, high-stakes choices
        kind: advantage
      - label: Intuition suits urgent or unfamiliar situations
        kind: advantage
      - label: Data can be incomplete, costly or out of date
        kind: limitation
      - label: Intuition is open to bias and hard to justify
        kind: limitation
      - label: Strong decisions often combine both
        core: true
  - label: Connections
    kind: connection
    children:
      - label: '2.4: leadership style shapes motivation'
        core: true
      - label: '2.5: leaders shape the culture'
        level: HL
      - label: '2.2: delegation and spans of control'
connections:
  - code: '2.4'
    label: Leadership style affects motivation and how many staff leave
  - code: '2.5'
    label: Leaders shape culture, and a new style can cause a clash (HL)
  - code: '2.2'
    label: Styles depend on spans of control and how much is delegated
  - code: '5.7'
    label: A crisis may call for quick, directive leadership (HL)
basis:
  - source: ib-bm-guide-2024
    pages: '26'

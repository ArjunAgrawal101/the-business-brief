# Mindmap: 4.3 Sales forecasting (HL only). The platform's own summary of the
# subtopic's one content statement, the benefits and limitations of sales
# forecasting (guide p. 31), with the forecasting methods that the statement
# rests on. Simple linear regression is the HL toolkit's forecasting tool
# (guide p. 15). Every branch and node is HL.
title: Sales forecasting
code: '4.3'
scope: subtopic
unit: 4
level: HL
summary: An HL subtopic on why businesses forecast sales, the quantitative and qualitative ways of doing it, and the benefits and limitations of the forecasts they produce.
centre: Sales forecasting
order: 43
branches:
  - label: What a forecast is
    kind: concept
    level: HL
    children:
      - label: An estimate of future sales over a set period
        kind: definition
        term: sales-forecast
        level: HL
        core: true
        note: In units or in value; short term for operations, long term for strategy.
      - label: Feeds production, staffing, cash flow and budgets
        level: HL
        core: true
      - label: Built from past data, research or judgement
        level: HL
  - label: Quantitative methods
    kind: tool
    level: HL
    children:
      - label: 'Trend: the long-run direction of sales'
        kind: definition
        term: trend
        level: HL
        core: true
      - label: 'Extrapolation: extend the past trend'
        kind: definition
        level: HL
        core: true
      - label: Allow for seasonal variation
        term: seasonal-variation
        level: HL
        core: true
        children:
          - label: Also cyclical and random
            level: HL
            note: Cyclical variation follows the economy over several years; random variation cannot be predicted.
      - label: Simple linear regression (toolkit)
        level: HL
        note: A line of best fit through past data; correlation shows how closely sales follow another variable, such as advertising.
      - label: Scaling up test-market sales
        level: HL
        note: Sales in a small trial area are grossed up to estimate sales in the whole market.
  - label: Qualitative methods
    kind: tool
    level: HL
    children:
      - label: Judgement when there is no useful past data
        kind: definition
        term: qualitative-sales-forecasting
        level: HL
        core: true
        note: New products, or a future expected to differ from the past.
      - label: Expert opinion
        kind: type
        level: HL
        note: Experienced managers or outside specialists.
      - label: Sales team estimates
        kind: type
        level: HL
      - label: Surveys of buying intentions
        kind: type
        level: HL
        core: true
  - label: Benefits
    kind: evaluation
    level: HL
    children:
      - label: Plan production and stock
        kind: advantage
        level: HL
        core: true
      - label: Plan staffing
        kind: advantage
        level: HL
      - label: Build cash flow forecasts and budgets
        kind: advantage
        level: HL
        core: true
      - label: Support a case for finance
        kind: advantage
        level: HL
      - label: Targets to judge results
        kind: advantage
        level: HL
        core: true
  - label: Limitations
    kind: evaluation
    level: HL
    children:
      - label: The future may not follow the past
        kind: limitation
        level: HL
        core: true
      - label: Shocks to tastes, rivals and the economy
        kind: limitation
        level: HL
        core: true
        note: STEEPLE factors and crises can change demand suddenly.
      - label: Judgement can be biased or optimistic
        kind: limitation
        term: research-bias
        level: HL
        core: true
      - label: Weaker the further ahead
        kind: limitation
        level: HL
      - label: Needs time, money, good data
        kind: limitation
        level: HL
  - label: Connections
    kind: connection
    level: HL
    children:
      - label: '3.7: cash flow forecasts start from sales'
        level: HL
        core: true
      - label: '3.9: budgets rest on forecast sales'
        level: HL
      - label: '5.6: production planning'
        level: HL
      - label: '4.4: research gives the data'
        level: HL
        core: true
connections:
  - code: '3.7'
    label: Cash flow forecasts begin with forecast sales
  - code: '3.9'
    label: Budgets are built on the sales forecast
  - code: '5.6'
    label: Stock, capacity and production plans follow forecast demand
  - code: '4.4'
    label: Market research supplies the data for forecasts
  - code: '2.1'
    label: Workforce planning depends on expected sales
basis:
  - source: ib-bm-guide-2024
    pages: '15, 31'

# Mindmap: 5.8 Research and development (HL only). The platform's own summary of
# the subtopic's four content statements (guide p. 35). The supplied coursebook
# chapter (pp. 540 to 548) was used only to check coverage, and nothing from it
# is reproduced.
title: Research and development
code: '5.8'
scope: subtopic
unit: 5
level: HL
summary: Why businesses invest in R&D, how they find needs customers know about and needs they do not, how they protect their ideas, and the difference between incremental and disruptive innovation.
centre: Research and development
order: 58
branches:
  - label: What R&D is
    kind: concept
    level: HL
    children:
      - label: Investigating to create products and processes
        kind: definition
        term: research-and-development
        core: true
      - label: 'Research: new knowledge'
        note: Finding out what is possible.
      - label: 'Development: usable products'
        note: Turning that knowledge into something that can be made and sold.
      - label: From idea to launch
        note: Idea, prototype, testing and launch; Gantt charts or critical path analysis can plan the stages (HL toolkit).
  - label: Why R&D matters
    kind: evaluation
    level: HL
    children:
      - label: New products replace declining ones
        kind: advantage
        core: true
      - label: Better processes cut costs
        kind: advantage
        core: true
      - label: Competitive edge
        kind: advantage
        core: true
        note: Often with premium prices.
      - label: Ideas to patent and license
        kind: advantage
      - label: Costly and uncertain
        kind: limitation
        core: true
        note: Most projects never reach the market.
      - label: Returns can take years
        kind: limitation
        note: R&D competes with short-term profit for funds.
      - label: Spend well, not just more
  - label: Meeting unmet needs
    kind: application
    level: HL
    children:
      - label: 'Unmet need: not yet met'
        kind: definition
        term: unmet-need
        core: true
      - label: 'Known needs: ask customers'
        core: true
        note: Market research can find them; lower risk, because demand is already known.
      - label: 'Latent: customers unaware'
        term: latent-need
        core: true
        note: Found by watching how people behave, and by R&D vision.
      - label: Market-led or R&D-led
        note: Product orientation (4.1) can succeed, but is riskier.
  - label: Protecting ideas
    kind: concept
    level: HL
    children:
      - label: Intellectual property (IP)
        kind: definition
        term: intellectual-property
        core: true
        note: Creations of the mind that the law lets the owner control.
      - label: 'Patent: inventions'
        kind: type
        term: patent
        core: true
        note: A time-limited right; the invention must be new and inventive.
      - label: 'Trademark: names and logos'
        kind: type
        term: trademark
        core: true
        note: Protects brand identity and can be renewed.
      - label: 'Copyright: creative works'
        kind: type
        term: copyright
        core: true
        note: Usually automatic, with no need to register.
      - label: Licensing earns a royalty
        term: royalty
        note: Rights must be defended, which costs money.
  - label: Innovation
    kind: types
    level: HL
    children:
      - label: New ideas put into use
        kind: definition
        term: innovation
        core: true
      - label: 'Incremental: small steps'
        kind: type
        term: incremental-innovation
        core: true
      - label: 'Disruptive: creates or reshapes a market'
        kind: type
        term: disruptive-innovation
        core: true
        note: Can unseat the established leaders.
      - label: Product innovation
        kind: type
        term: product-innovation
        note: Changes what is sold.
      - label: Process innovation
        kind: type
        term: process-innovation
        note: Changes how it is made or delivered.
      - label: Leaders often miss disruption
        note: Its early customers look too few to matter.
  - label: Connections
    kind: connection
    level: HL
    children:
      - label: 'Ansoff matrix: product development'
        term: ansoff-matrix
        core: true
      - label: New products in the life cycle (4.5)
      - label: Financing R&D (3.2)
connections:
  - code: '4.1'
    label: Market orientation versus product orientation
  - code: '4.4'
    label: Market research to find needs customers know about
  - code: '4.5'
    label: New products and the product life cycle
  - code: '3.4'
    label: Patents, trademarks and copyright as intangible assets
basis:
  - source: ib-bm-guide-2024
    pages: '35'
  - source: hodder-bm-2022
    pages: '540-548'

# Mindmap: 2.5 Organizational (corporate) culture. HL only. The platform's own
# summary of the subtopic's three content statements (guide p. 27). Every
# branch is marked HL. Checked against the guide only.
title: Organizational (corporate) culture
code: '2.5'
scope: subtopic
unit: 2
level: HL
summary: What organizational culture is and where it shows, Charles Handy's four "Gods of management" cultures, and why cultures clash when organizations grow, merge or change their style of leadership.
centre: Organizational (corporate) culture
order: 25
branches:
  - label: What culture is
    kind: concept
    level: HL
    children:
      - label: Shared values, beliefs and norms
        kind: definition
        term: organizational-culture
        core: true
        note: Often summed up as the way we do things around here.
      - label: Seen in dress, language, rituals and stories
        core: true
        note: Also in office layout, how decisions are made and attitudes to risk and customers.
      - label: Shaped by founders, leaders and history
        core: true
      - label: Influenced by the industry and national culture
      - label: A strong culture guides staff without rules
        kind: advantage
      - label: A strong culture can resist change
        kind: limitation
  - label: "Handy's Gods of management"
    kind: theory
    level: HL
    children:
      - label: Four cultures, each named after a Greek god
        term: handys-gods-of-management
        core: true
      - label: 'Zeus: power culture'
        kind: type
        term: power-culture
        core: true
        children:
          - label: "One central figure, like a spider's web"
      - label: 'Apollo: role culture'
        kind: type
        term: role-culture
        core: true
        children:
          - label: Roles and rules, like a Greek temple
      - label: 'Athena: task culture'
        kind: type
        term: task-culture
        core: true
        children:
          - label: Expert teams on projects, like a net
      - label: 'Dionysus: person culture'
        kind: type
        term: person-culture
        core: true
        children:
          - label: Independent professionals, a loose cluster
  - label: When cultures clash
    kind: concept
    level: HL
    children:
      - label: Conflict between different ways of working
        kind: definition
        term: culture-clash
        core: true
      - label: Mergers and acquisitions
        term: merger
        core: true
        note: Two ways of working must suddenly become one.
      - label: "Growth: the founder's culture meets new rules"
        core: true
        note: A power culture strains as layers, procedures and new managers arrive.
      - label: A new leader with a different style
        core: true
        note: For example, an autocratic leader replacing a democratic one.
      - label: Expanding into other countries
        note: National cultures differ; Hofstede's cultural dimensions (a toolkit tool) help compare them.
  - label: Effects of a clash
    kind: evaluation
    level: HL
    children:
      - label: Falling morale and motivation
        kind: limitation
        core: true
      - label: Conflict, absence and staff leaving
        kind: limitation
        core: true
      - label: Expected merger benefits not delivered
        kind: limitation
        core: true
      - label: Can bring fresh ideas and renewal
        kind: advantage
  - label: Managing culture through change
    kind: application
    level: HL
    children:
      - label: Assess both cultures before a deal
        core: true
      - label: Communicate openly and early
        core: true
      - label: Involve staff from both sides
        core: true
      - label: Train managers and lead by example
      - label: Keep the traditions people value
  - label: Connections
    kind: connection
    level: HL
    children:
      - label: '1.5: mergers and takeovers'
        core: true
      - label: '2.3: leadership style shapes culture'
        core: true
      - label: '2.2: role culture suits tall structures'
connections:
  - code: '1.5'
    label: Mergers, acquisitions and takeovers often bring culture clashes
  - code: '2.3'
    label: A change in leadership style can unsettle the culture
  - code: '1.6'
    label: Multinationals work across different national cultures
  - code: '2.2'
    label: Role cultures suit tall, bureaucratic structures; task cultures suit matrices
basis:
  - source: ib-bm-guide-2024
    pages: '27'

# Mindmap: 3.2 Sources of finance. The platform's own summary of the
# subtopic's three content statements (guide p. 28): the three internal
# sources, the eight external sources and the choice between short- and
# long-term finance. Checked against the guide; no coursebook chapter was
# supplied for this unit.
title: Sources of finance
code: '3.2'
scope: subtopic
unit: 3
level: SL/HL
summary: Where a business can find money, from its own resources or from outsiders, and how to choose a source whose cost, risk, control and time span suit the need.
centre: Sources of finance
order: 32
branches:
  - label: Internal sources
    kind: types
    children:
      - label: Money from within the business
        kind: definition
        term: internal-sources-of-finance
        core: true
        note: No interest and no loss of control, but limited in size.
      - label: Personal funds (sole traders)
        kind: type
        term: personal-funds
        core: true
        note: The owner's savings; full control, but small and at risk.
      - label: Retained profit
        kind: type
        term: retained-profit
        core: true
        note: Profit kept after dividends; only once the business is profitable.
      - label: Sale of assets
        kind: type
        term: sale-of-assets
        core: true
        note: One-off cash from assets the business no longer needs.
        children:
          - label: Sale and leaseback keeps the asset in use
            term: sale-and-leaseback
  - label: 'External: shares and borrowing'
    kind: types
    children:
      - label: Money from outside the business
        kind: definition
        term: external-sources-of-finance
        core: true
      - label: Share capital
        kind: type
        term: share-capital
        core: true
        note: Companies only; never repaid, but dilutes control and dividends are expected.
      - label: Loan capital
        kind: type
        term: loan-capital
        core: true
        note: Fixed sum and term, repaid with interest; includes mortgages and debentures.
        children:
          - label: Lenders often ask for collateral
            term: collateral
      - label: Overdrafts
        kind: type
        term: overdraft
        core: true
        note: Flexible and short-term; high interest, and the bank can withdraw it.
      - label: Trade credit
        kind: type
        term: trade-credit
        core: true
        note: Buy now, pay suppliers in 30 to 90 days, usually without interest.
  - label: 'External: other providers'
    kind: types
    children:
      - label: Crowdfunding
        kind: type
        term: crowdfunding
        core: true
        note: Many small sums raised online; tests demand, but uncertain and public.
        children:
          - label: Reward, equity, loan or donation models
      - label: Leasing
        kind: type
        term: leasing
        core: true
        note: Pay regularly to use an asset; no large outlay, but no ownership.
      - label: Microfinance providers
        kind: type
        term: microfinance-provider
        core: true
        note: Small loans for people on low incomes who cannot borrow from banks.
      - label: Business angels
        kind: type
        term: business-angel
        core: true
        note: Wealthy individuals invest for a share of ownership.
        children:
          - label: Often bring advice and contacts too
  - label: Short or long term?
    kind: concept
    children:
      - label: 'Short-term: under a year'
        kind: definition
        term: short-term-finance
        core: true
        children:
          - label: Overdrafts, trade credit, debt factoring
            kind: example
            core: true
          - label: Pays for stock, wages and other running costs
      - label: 'Long-term: more than a year'
        kind: definition
        term: long-term-finance
        core: true
        children:
          - label: Shares, loans, retained profit, leasing
            kind: example
            core: true
          - label: Pays for non-current assets and growth
      - label: Match the source to how long it is needed
        core: true
        note: An asset bought with an overdraft must be paid for before it has earned its cost.
  - label: Choosing a source
    kind: evaluation
    children:
      - label: Purpose and how long the money is needed
        core: true
      - label: Amount needed
        core: true
      - label: 'Cost: interest, fees, dividends'
        core: true
      - label: 'Control: new shares dilute ownership'
        core: true
      - label: 'Risk: borrowing commits the business to repay'
        note: HL students measure this with the gearing ratio (3.6).
      - label: 'Legal form: sole traders cannot sell shares'
        note: Types of business entities (1.2).
      - label: Existing debts and the state of the accounts
        note: Lenders and investors look at the final accounts first.
connections:
  - code: '1.2'
    label: The legal form decides which sources are open
  - code: '1.5'
    label: Financing internal and external growth
  - code: '3.1'
    label: Capital and revenue spending need different sources
  - code: '3.6'
    label: Borrowing raises the gearing ratio (HL)
  - code: '3.7'
    label: Overdrafts and trade credit ease cash flow problems
basis:
  - source: ib-bm-guide-2024
    pages: '28'

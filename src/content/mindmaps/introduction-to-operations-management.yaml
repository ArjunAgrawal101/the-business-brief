# Mindmap: 5.1 Introduction to operations management. The platform's own summary
# of the subtopic's one content statement, the role of operations management
# (guide p. 33). Checked against the guide; no coursebook chapter for 5.1 was
# supplied, and nothing from any source is reproduced.
title: Introduction to operations management
code: '5.1'
scope: subtopic
unit: 5
level: SL/HL
summary: What operations management does, what it aims for, how it works with marketing, finance and HR, and the trade-offs behind its decisions.
centre: Introduction to operations management
order: 51
branches:
  - label: What operations does
    kind: concept
    children:
      - label: Turning inputs into outputs
        kind: definition
        term: operations-management
        core: true
        note: Operations management plans, runs and improves the process that turns inputs into goods and services.
        children:
          - label: 'Inputs: materials, labour, equipment, data'
            core: true
          - label: 'Process: make, assemble, serve'
          - label: 'Outputs: goods and services for customers'
            core: true
      - label: Adds value at every stage
        core: true
        note: Customers pay more for the output than the inputs cost.
      - label: Services, not just factories
        note: In a service, production and consumption often happen together, in front of the customer.
      - label: Where most costs arise
        note: Small gains in efficiency or quality can have a large effect on profit.
  - label: Goods and services
    kind: types
    children:
      - label: 'Goods: tangible, storable'
        kind: type
        core: true
      - label: 'Services: intangible, made as consumed'
        kind: type
        core: true
      - label: Most products mix the two
        kind: example
        note: A restaurant sells food, a good, together with table service.
  - label: Goals of operations
    kind: concept
    children:
      - label: 'Efficiency: low unit cost'
        term: efficiency
        core: true
      - label: 'Quality: meets expectations'
        term: quality
        core: true
        note: Judged by what customers expect, not only by an absence of faults.
      - label: Speed and dependability
        note: Delivering quickly, and when promised.
      - label: Flexibility to change output
        note: Changing volumes or products without large extra costs.
      - label: 'Sustainability: less waste and pollution'
        core: true
        note: Using resources efficiently supports environmental sustainability.
  - label: Links to functions
    kind: connection
    children:
      - label: 'Marketing: what and how much'
        core: true
        note: Forecasts and the marketing mix set volumes, features and delivery promises.
      - label: 'Finance: budgets, investment'
        core: true
        note: Equipment needs capital; production costs shape prices and profit.
      - label: 'HR: skills, numbers, shifts'
        core: true
        note: The production method decides how many workers are needed, with what training.
      - label: Operations sets cost, quality and capacity
  - label: Key decisions
    kind: application
    children:
      - label: Production method (5.2)
        core: true
      - label: Location of production (5.4)
        core: true
      - label: In-house or outsourced (5.4)
        term: outsourcing
        note: Outsourcing, offshoring, insourcing and reshoring are all in 5.4.
      - label: Break-even output (5.5)
        core: true
  - label: Evaluating operations
    kind: evaluation
    children:
      - label: Trade-offs between goals
        core: true
        note: Improving one goal, such as speed, often costs another, such as unit cost.
      - label: Good operations is a competitive edge
        kind: advantage
        core: true
        note: Reliable, low-cost delivery is hard for rivals to copy.
      - label: Technology raises productivity
        kind: advantage
        note: More output from the same inputs lowers the cost of each unit.
      - label: Efficiency can cost jobs
        kind: limitation
        note: Automation lowers cost but may meet resistance to change.
      - label: 'Ethics: suppliers, staff, environment'
        note: Operational choices affect a business's ethical stance.
connections:
  - code: '1.1'
    label: Inputs, outputs and adding value
  - code: '3.3'
    label: Operations decisions create most costs
  - code: '4.5'
    label: Processes and physical evidence in services
  - code: '5.2'
    label: The methods used to make the product
basis:
  - source: ib-bm-guide-2024
    pages: '33'

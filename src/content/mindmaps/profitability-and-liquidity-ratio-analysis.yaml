# Mindmap: 3.5 Profitability and liquidity ratio analysis. The platform's own
# summary of the subtopic's four content statements (guide p. 29). Every
# formula is the one on the guide's formula sheet (p. 64) and matches the
# platform's ratio calculators. Checked against the guide; no coursebook chapter
# was supplied for this unit.
title: Profitability and liquidity ratio analysis
code: '3.5'
scope: subtopic
unit: 3
level: SL/HL
summary: The five ratios that show how profitable a business is and whether it can pay its short-term debts, how to improve each, and what ratios cannot tell you.
centre: Profitability and liquidity ratios
order: 35
branches:
  - label: Ratio analysis
    kind: concept
    children:
      - label: Comparing figures from the final accounts
        kind: definition
        term: ratio-analysis
        core: true
      - label: 'Profitability: profit relative to sales or capital'
        kind: definition
        term: profitability
        core: true
      - label: 'Liquidity: ability to pay short-term debts'
        kind: definition
        term: liquidity
        core: true
      - label: Compare with past years, rivals and targets
        core: true
        note: A single ratio means little on its own.
  - label: Profitability ratios
    kind: calculation
    children:
      - label: Gross profit margin
        kind: formula
        term: gross-profit-margin
        core: true
        formula: Gross profit margin = (gross profit ÷ sales revenue) × 100
      - label: Profit margin
        kind: formula
        term: profit-margin
        core: true
        formula: Profit margin = (profit before interest and tax ÷ sales revenue) × 100
      - label: Return on capital employed (ROCE)
        kind: formula
        term: return-on-capital-employed
        core: true
        formula: ROCE = (profit before interest and tax ÷ capital employed) × 100
        children:
          - label: Capital employed
            kind: formula
            term: capital-employed
            core: true
            formula: Capital employed = non-current liabilities + equity
      - label: The gap between the margins is the expenses
        note: A steady gross margin with a falling profit margin points to rising overheads.
  - label: Improving profitability
    kind: evaluation
    children:
      - label: Raise prices
        core: true
        children:
          - label: Customers may buy less or switch to rivals
            kind: limitation
      - label: Cut the cost of sales
        core: true
        children:
          - label: Cheaper suppliers, bulk buying, less waste
            kind: example
          - label: Cheaper inputs can lower quality
            kind: limitation
      - label: Control expenses
        core: true
        children:
          - label: Cheaper premises, energy saving, efficient staffing
            kind: example
      - label: Use less capital for the same profit
        note: Selling idle assets to repay long-term debt lowers capital employed and lifts ROCE.
  - label: Liquidity ratios
    kind: calculation
    children:
      - label: Current ratio
        kind: formula
        term: current-ratio
        core: true
        formula: Current ratio = current assets ÷ current liabilities
        note: About 1.5 to 2 is often called comfortable; norms vary by industry.
      - label: Acid test (quick) ratio
        kind: formula
        term: acid-test-ratio
        core: true
        formula: Acid test (quick) ratio = (current assets − stock) ÷ current liabilities
        note: About 1 or more; stock is left out because it is the least liquid.
      - label: 'Too low: bills may go unpaid'
        kind: limitation
        core: true
      - label: 'Too high: idle cash, stock or debtors'
        kind: limitation
  - label: Improving liquidity
    kind: evaluation
    children:
      - label: Sell surplus stock or assets for cash
        core: true
      - label: Sale and leaseback
        term: sale-and-leaseback
      - label: Collect debts sooner, or use debt factoring
        term: debt-factoring
        core: true
      - label: Turn an overdraft into a long-term loan
        core: true
        note: The debt moves out of current liabilities.
      - label: Raise long-term finance or retain more profit
      - label: Liquidity and profitability can pull apart
        kind: limitation
        note: Cash held for safety earns little; selling assets cheaply hurts profit.
  - label: Limits of ratio analysis
    kind: evaluation
    children:
      - label: Based on past figures and a single date
        kind: limitation
        core: true
      - label: Means little without a benchmark
        kind: limitation
        core: true
      - label: Window dressing can distort the figures
        kind: limitation
        term: window-dressing
      - label: Shows what changed, not why
        kind: limitation
      - label: Leaves out qualitative factors
        kind: limitation
        note: Brand strength, staff morale and market trends do not appear in the ratios.
connections:
  - code: '3.4'
    label: The statements the ratios are calculated from
  - code: '3.6'
    label: The efficiency ratios that complete the analysis (HL)
  - code: '3.7'
    label: Liquidity, working capital and cash flow
  - code: '4.5'
    label: Pricing decisions change the margins
basis:

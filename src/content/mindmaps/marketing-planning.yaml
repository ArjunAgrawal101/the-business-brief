# Mindmap: 4.2 Marketing planning. The platform's own summary of the subtopic's
# five content statements (guide p. 31). Consistent with the Market Studio's
# position map, which treats a map as perceptions and a gap as a question.
title: Marketing planning
code: '4.2'
scope: subtopic
unit: 4
level: SL/HL
summary: How a marketing plan turns objectives into action; segmenting a market, choosing a target and positioning a product, with position maps; niche and mass markets; and how a USP and differentiation set a business apart.
centre: Marketing planning
order: 42
branches:
  - label: The marketing plan
    kind: concept
    children:
      - label: Objectives, target, mix, budget, timing
        kind: definition
        term: marketing-plan
        core: true
        note: What marketing will achieve, for whom, how, at what cost and by when.
      - label: Objectives that are specific and measurable
        term: marketing-objectives
        core: true
        note: They follow from the business's objectives in 1.3.
      - label: Uses research, SWOT, STEEPLE
        note: Toolkit tools give the plan its evidence.
      - label: Coordinates marketing with other functions
        kind: advantage
        core: true
      - label: Needs regular review
        kind: limitation
        note: A plan dates quickly when the market or rivals change.
  - label: Segmentation
    kind: types
    children:
      - label: Splitting a market into groups that respond alike
        kind: definition
        term: market-segmentation
        core: true
      - label: 'Demographic: age, income, gender, family'
        kind: type
        term: demographic-segmentation
        core: true
      - label: 'Geographic: country, region, city, climate'
        kind: type
        term: geographic-segmentation
        core: true
      - label: 'Psychographic: lifestyle, values, interests'
        kind: type
        term: psychographic-segmentation
        core: true
      - label: 'Behavioural: usage, loyalty, occasion, benefit'
        kind: type
        term: behavioural-segmentation
        core: true
      - label: Useful segments are big, reachable, distinct
        note: Each must be worth serving and respond differently to marketing.
  - label: Targeting
    kind: application
    children:
      - label: Choosing segments to aim at
        kind: definition
        term: target-market
        core: true
        note: Often described as a customer profile of the typical buyer.
      - label: 'Mass market: one mix for most buyers'
        kind: type
        term: mass-market
        core: true
        children:
          - label: Volume and economies of scale
            kind: advantage
          - label: Costly and fiercely contested
            kind: limitation
      - label: 'Niche market: a small, specialized segment'
        kind: type
        term: niche-market
        core: true
        children:
          - label: Fewer rivals, premium prices
            kind: advantage
          - label: Small base; rivals may enter
            kind: limitation
  - label: Positioning and position maps
    kind: tool
    children:
      - label: "Positioning: where a brand sits in buyers' minds"
        kind: definition
        term: positioning
        core: true
        note: Every element of the mix must support the chosen position.
      - label: 'Position map: brands plotted on two attributes'
        kind: definition
        term: position-map
        core: true
        note: Choose attributes customers really use, such as price and quality.
      - label: Reveals clusters and gaps
        kind: advantage
        core: true
        children:
          - label: A gap is a question
            term: gap-in-the-market
            note: Not an answer; some gaps are empty because nobody wants that combination.
      - label: One sample's perceptions, not facts
        kind: limitation
        core: true
      - label: 'Repositioning: slow, costly'
        note: Changing how buyers see a brand means changing every P.
  - label: USP and differentiation
    kind: concept
    children:
      - label: 'USP: a reason to choose it'
        kind: definition
        term: unique-selling-point
        core: true
      - label: 'Differentiation: different in ways buyers value'
        kind: definition
        term: differentiation
        core: true
      - label: 'Routes: features, quality, design, brand, service'
        core: true
        note: Also distribution, and ethical or sustainable practices.
      - label: "Porter's generic strategies (toolkit)"
        level: HL
        note: Differentiation is one of the routes to competitive advantage.
  - label: Weighing the choices
    kind: evaluation
    children:
      - label: A USP must matter and be hard to copy
        core: true
      - label: Buyers care less about price
        kind: advantage
        core: true
        note: Differentiation and a USP build loyalty and weaken price competition.
      - label: Costly; rivals imitate
        kind: limitation
        core: true
      - label: Niche or mass depends on resources
        note: And on the size of the market and the strength of rivals.
  - label: Connections
    kind: connection
    children:
      - label: '4.4: research finds segments and gaps'
        core: true
      - label: '4.5: the mix delivers positioning'
        core: true
      - label: '4.1: market share measures the result'
connections:
  - code: '4.4'
    label: Research identifies segments, customer needs and gaps
  - code: '4.5'
    label: The marketing mix delivers the chosen position
  - code: '4.1'
    label: Market share and market growth show whether the plan worked
  - code: '1.3'
    label: Marketing objectives support the business's objectives
  - code: '4.6'
    label: Segmenting and positioning in foreign markets (HL)
basis:
  - source: ib-bm-guide-2024
    pages: '31'

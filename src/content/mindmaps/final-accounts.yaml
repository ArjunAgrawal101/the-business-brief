# Mindmap: 3.4 Final accounts. The platform's own summary of the subtopic's
# five content statements (guide p. 29), with the statements' line names taken
# from the guide's layouts (pp. 59 to 62). Depreciation and the choice of
# method are HL only. Checked against the guide; no coursebook chapter was
# supplied for this unit.
title: Final accounts
code: '3.4'
scope: subtopic
unit: 3
level: SL/HL with HL-only content
summary: What the statement of profit or loss and the statement of financial position show, who uses them and why, the intangible assets a business can own and, for HL, how depreciation is calculated.
centre: Final accounts
order: 34
branches:
  - label: Statement of profit or loss
    kind: concept
    children:
      - label: Revenue, costs and profit over a period
        kind: definition
        term: statement-of-profit-or-loss
        core: true
        note: The syllabus calls it the profit and loss account; assessment uses this name.
      - label: Gross profit
        kind: formula
        term: gross-profit
        core: true
        formula: Gross profit = sales revenue − cost of sales
      - label: PBIT (profit before interest and tax)
        kind: formula
        term: profit-before-interest-and-tax
        core: true
        formula: Profit before interest and tax = gross profit − expenses
      - label: Profit for period
        kind: formula
        term: profit-for-period
        core: true
        formula: Profit for period = profit before tax − tax
        note: Profit before tax is profit before interest and tax minus interest.
      - label: Retained profit
        kind: formula
        term: retained-profit
        formula: Retained profit = profit for period − dividends
      - label: A non-profit entity reports a surplus
        term: surplus
        note: Gross surplus, surplus before interest and so on, with no dividends.
  - label: Statement of financial position
    kind: concept
    children:
      - label: Assets, liabilities and equity on one date
        kind: definition
        term: statement-of-financial-position
        core: true
        note: The syllabus calls it the balance sheet; assessment uses this name.
      - label: Non-current assets
        term: non-current-assets
        core: true
        children:
          - label: Property, plant and equipment at cost
          - label: Less accumulated depreciation
            term: accumulated-depreciation
      - label: 'Current assets: cash, debtors, stock'
        term: current-assets
        core: true
      - label: 'Current liabilities: overdraft, trade creditors'
        term: current-liabilities
        core: true
        note: Also other short-term loans.
      - label: 'Non-current liabilities: long-term borrowing'
        term: non-current-liabilities
        core: true
      - label: Net assets
        kind: formula
        term: net-assets
        core: true
        formula: Net assets = total assets − total liabilities
      - label: Equity
        kind: formula
        term: equity
        core: true
        formula: Total equity = share capital + retained earnings
        note: Net assets always equal total equity.
  - label: Intangible assets
    kind: types
    children:
      - label: No physical form, but real value
        kind: definition
        term: intangible-asset
        core: true
      - label: Goodwill
        kind: type
        term: goodwill
        core: true
        note: The price paid for a business above the value of its net assets.
      - label: Brands
        kind: type
        core: true
        note: Usually recorded only when bought, not when built up.
      - label: Patents, copyrights, trademarks
        kind: type
        core: true
        note: Intellectual property, the legal rights covered in 5.8 (HL).
      - label: Licences and franchise rights
        kind: type
      - label: Hard to value; can lose value fast
        kind: limitation
  - label: Who uses the accounts
    kind: application
    children:
      - label: Year-end statements of performance and position
        kind: definition
        term: final-accounts
        core: true
      - label: 'Shareholders: returns and dividends'
        core: true
      - label: 'Managers: performance, planning, control'
        core: true
      - label: 'Lenders and suppliers: will they be paid?'
        core: true
      - label: 'Employees: jobs and pay'
      - label: 'Government: tax and legal compliance'
      - label: 'Competitors and investors: comparison'
      - label: Window dressing can mislead users
        kind: limitation
        term: window-dressing
        note: Flattering methods or timing make results look stronger than they are.
  - label: Depreciation
    kind: calculation
    level: HL
    children:
      - label: Spreading an asset's cost over its useful life
        kind: definition
        term: depreciation
        level: HL
        core: true
        note: An expense that lowers profit, but no cash leaves the business.
      - label: Straight line method
        kind: formula
        term: straight-line-method
        level: HL
        core: true
        formula: Annual depreciation = (cost − residual value) ÷ useful life in years
      - label: Units of production method
        kind: formula
        term: units-of-production-method
        level: HL
        core: true
        formula: Depreciation = (cost − residual value) ÷ expected total units × units produced
      - label: Net book value
        kind: formula
        term: net-book-value
        level: HL
        formula: Net book value = original cost − accumulated depreciation
      - label: 'Residual value: what it will fetch at the end'
        term: residual-value
        level: HL
  - label: Which method suits?
    kind: evaluation
    level: HL
    children:
      - label: 'Straight line: simple, same charge every year'
        kind: advantage
        level: HL
        core: true
        children:
          - label: Suits assets that wear evenly, such as buildings
            kind: example
            level: HL
      - label: 'Units of production: charge follows use'
        kind: advantage
        level: HL
        core: true
        children:
          - label: Suits machines and vehicles used unevenly
            kind: example
            level: HL
      - label: Units of production needs records of output
        kind: limitation
        level: HL
      - label: Both rest on estimates of life and residual value
        kind: limitation
        level: HL
        core: true
connections:
  - code: '1.4'
    label: The stakeholders who read the accounts
  - code: '3.1'
    label: Capital spending becomes non-current assets
  - code: '3.5'
    label: The ratios are worked from these statements
  - code: '3.7'
    label: Profit in the accounts is not the same as cash
  - code: '5.8'
    label: Intellectual property as intangible assets (HL)
basis:
  - source: ib-bm-guide-2024
    pages: '29, 59-62'

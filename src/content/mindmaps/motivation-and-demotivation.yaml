# Mindmap: 2.4 Motivation and demotivation. The platform's own summary of the
# subtopic's nine content statements (guide pp. 26 to 27). HL only: the theories
# of McClelland, Deci and Ryan, equity and expectancy; labour turnover; the
# types of appraisal; methods of recruitment; internal and external recruitment.
# Checked against the guide only.
title: Motivation and demotivation
code: '2.4'
scope: subtopic
unit: 2
level: SL/HL with HL-only content
summary: Why people work hard or stop trying, the motivation theories of Taylor, Maslow and Herzberg, financial and non-financial rewards and the types of training and, at HL, four further theories, labour turnover, appraisal and recruitment.
centre: Motivation and demotivation
order: 24
branches:
  - label: Why motivation matters
    kind: concept
    children:
      - label: 'Motivation: the drive to work towards a goal'
        kind: definition
        term: motivation
        core: true
        note: Motivated staff work harder, make fewer mistakes, take less time off and stay longer.
      - label: 'Intrinsic: from the work itself'
        term: intrinsic-motivation
        core: true
        note: Interest, challenge and meaning; tends to last.
      - label: 'Extrinsic: from rewards or pressure'
        term: extrinsic-motivation
        core: true
        note: Pay, bonuses, praise or the wish to avoid a penalty; can fade once received.
      - label: 'Demotivation: less effort, more absence and quits'
        term: demotivation
        core: true
        note: Caused by unfair pay, poor management, dull work, no recognition or insecurity.
  - label: Taylor, Maslow and Herzberg
    kind: theory
    children:
      - label: 'Taylor: scientific management'
        term: scientific-management
        core: true
        note: One best way to do each task, found by timing the work; managers plan, workers carry out.
        children:
          - label: 'Money motivates: pay by piece rate'
            term: piece-rate
            core: true
      - label: 'Maslow: hierarchy of needs'
        term: maslows-hierarchy-of-needs
        core: true
        note: A higher need motivates once lower ones are largely met; a need that is met no longer motivates.
        children:
          - label: Physiological, safety, social, esteem, self-actualization
            core: true
      - label: 'Herzberg: motivation-hygiene theory'
        term: herzbergs-motivation-hygiene-theory
        core: true
        children:
          - label: 'Hygiene factors: prevent dissatisfaction'
            term: hygiene-factors
            core: true
            note: Pay, conditions, job security, supervision and company policy.
          - label: 'Motivators: create satisfaction'
            term: motivators
            core: true
            note: Achievement, recognition, responsibility, the work itself and advancement.
  - label: Further theories
    kind: theory
    level: HL
    children:
      - label: 'McClelland: achievement, affiliation, power'
        term: mcclellands-acquired-needs-theory
        core: true
        note: Acquired needs theory; the needs are learned and one usually dominates, so match tasks and rewards to it.
        children:
          - label: 'Achievement: success at challenging goals'
            term: need-for-achievement
          - label: 'Affiliation: being liked and accepted'
            term: need-for-affiliation
          - label: 'Power: influencing and leading others'
            term: need-for-power
      - label: 'Deci and Ryan: autonomy, competence, relatedness'
        term: self-determination-theory
        core: true
        note: Self-determination theory; meeting these three basic psychological needs builds intrinsic motivation.
        children:
          - label: 'Autonomy: acting by choice'
            term: autonomy
          - label: 'Competence: feeling capable'
            term: competence
          - label: 'Relatedness: feeling connected'
            term: relatedness
      - label: 'Adams: equity, fair rewards compared with others'
        term: equity-theory
        core: true
        note: Staff compare their inputs and outcomes with others'; those who feel under-rewarded cut effort, demand more or leave.
      - label: 'Vroom: expectancy × instrumentality × valence'
        term: expectancy-theory
        core: true
        note: Expectancy theory; if any of the three beliefs is near zero, motivation is weak.
        children:
          - label: 'Expectancy: effort leads to performance'
            term: expectancy
          - label: 'Instrumentality: performance is rewarded'
            term: instrumentality
          - label: 'Valence: the reward is valued'
            term: valence
  - label: Financial rewards
    kind: types
    children:
      - label: 'Salary: fixed annual pay'
        kind: type
        term: salary
        core: true
      - label: 'Wages: time rate or piece rate'
        kind: type
        term: wages
        core: true
      - label: 'Commission: a share of sales value'
        kind: type
        term: commission
        core: true
      - label: 'Performance-related pay: bonus for targets'
        kind: type
        term: performance-related-pay
        core: true
      - label: 'Profit-related pay: a share of profit'
        kind: type
        term: profit-related-pay
        core: true
      - label: Employee share ownership schemes
        kind: type
        term: employee-share-ownership-scheme
        core: true
      - label: 'Fringe payments: car, insurance, pension'
        kind: type
        term: fringe-payments
        core: true
  - label: Non-financial rewards
    kind: types
    children:
      - label: 'Job enrichment: more responsibility'
        kind: type
        term: job-enrichment
        core: true
      - label: 'Job rotation: moving between tasks'
        kind: type
        term: job-rotation
        core: true
      - label: 'Job enlargement: more tasks, same level'
        kind: type
        term: job-enlargement
        core: true
      - label: 'Empowerment: authority to decide'
        kind: type
        term: empowerment
        core: true
      - label: 'Purpose: a chance to make a difference'
        kind: type
        term: purpose-at-work
        core: true
      - label: 'Teamwork: shared goals and support'
        kind: type
        term: teamwork
        core: true
  - label: Training, recruitment, appraisal
    kind: types
    children:
      - label: 'Induction training: welcoming new starters'
        kind: type
        term: induction
        core: true
      - label: 'On-the-job training: learning while working'
        kind: type
        term: on-the-job-training
        core: true
      - label: 'Off-the-job training: courses away from work'
        kind: type
        term: off-the-job-training
        core: true
      - label: 'Recruitment: methods, internal or external'
        term: recruitment
        level: HL
        core: true
        note: Methods include a job description and person specification, adverts, agencies, interviews and tests.
        children:
          - label: 'Internal: promotion or transfer'
            kind: type
            term: internal-recruitment
          - label: 'External: adverts, agencies, headhunting'
            kind: type
            term: external-recruitment
      - label: 'Appraisal: formative, summative, 360-degree, self'
        term: appraisal
        level: HL
        core: true
        children:
          - label: 'Formative: ongoing feedback to improve'
            kind: type
            term: formative-appraisal
          - label: 'Summative: end-of-period judgement'
            kind: type
            term: summative-appraisal
          - label: '360-degree: feedback from all around'
            kind: type
            term: 360-degree-feedback
          - label: 'Self-appraisal: judging your own work'
            kind: type
            term: self-appraisal
  - label: Labour turnover
    kind: calculation
    level: HL
    children:
      - label: Labour turnover rate
        kind: formula
        term: labour-turnover
        core: true
        formula: Labour turnover = (number of employees leaving ÷ average number of employees) × 100
        note: The share of the workforce that leaves in a period; compare it with past years and with rivals.
      - label: 'High: hiring costs, lost skills, low morale'
        kind: limitation
        note: Some turnover is healthy, since new staff bring fresh ideas and skills.
connections:
  - code: '2.3'
    label: Leadership style is a major cause of motivation or demotivation
  - code: '2.1'
    label: Recruitment and training carry out the workforce plan
  - code: '3.3'
    label: Pay and rewards are a major cost for most businesses
  - code: '5.9'
    label: Using data to monitor staff revives Taylor's ideas as digital Taylorism (HL)
basis:
  - source: ib-bm-guide-2024
    pages: '26-27'

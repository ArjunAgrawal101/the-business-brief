# Mindmap: 1.5 Growth and evolution. The platform's own summary of the
# subtopic's five content statements (guide p. 24), with the toolkit tools the
# course suggests for growth decisions. Checked against the guide; the
# supplied coursebook chapter 1.5 was used only to confirm coverage, and
# nothing in it is reproduced. Force field analysis is an HL-only tool and is
# marked as such.
title: Growth and evolution
code: '1.5'
scope: subtopic
unit: 1
level: SL/HL
summary: Why average costs fall and then rise as a business grows, the difference between internal and external growth, the external growth methods, and the reasons to grow or to stay small.
centre: Growth and evolution
order: 15
branches:
  - label: Economies of scale
    kind: concept
    children:
      - label: Average cost falls as scale increases
        kind: definition
        term: economies-of-scale
        core: true
      - label: "Internal: from the firm's own growth"
        kind: type
        core: true
        children:
          - label: Technical
            term: technical-economies-of-scale
            note: Larger, more efficient equipment and methods.
          - label: Purchasing (bulk buying)
            term: purchasing-economies-of-scale
          - label: Financial
            term: financial-economies-of-scale
            note: Cheaper borrowing and more sources of finance.
          - label: Managerial
            term: managerial-economies-of-scale
          - label: Marketing
            term: marketing-economies-of-scale
          - label: Risk-bearing
            term: risk-bearing-economies-of-scale
      - label: 'External: from the growth of the industry or area'
        kind: type
        term: external-economies-of-scale
        core: true
        note: For example, a pool of skilled labour and specialist suppliers nearby.
  - label: Diseconomies of scale
    kind: concept
    children:
      - label: Average cost rises beyond the efficient size
        kind: definition
        term: diseconomies-of-scale
        core: true
      - label: 'Internal: harder to manage as it grows'
        kind: type
        core: true
        children:
          - label: Communication slows and distorts
            kind: limitation
          - label: Coordination and control weaken
            kind: limitation
          - label: Motivation falls as staff feel distant
            kind: limitation
      - label: 'External: rents, wages and congestion rise'
        kind: type
        term: external-diseconomies-of-scale
        core: true
  - label: Internal and external growth
    kind: types
    children:
      - label: 'Internal (organic): growing from within'
        kind: type
        term: internal-growth
        core: true
        note: Slower and lower risk, and the owners keep control.
      - label: 'External (inorganic): joining other firms'
        kind: type
        term: external-growth
        core: true
        note: Faster, but costly and harder to integrate.
        children:
          - label: 'Horizontal: same stage, same industry'
            term: horizontal-integration
          - label: 'Vertical: a supplier or a customer'
            term: vertical-integration
          - label: 'Conglomerate: an unrelated industry'
            term: conglomerate-integration
      - label: Synergy is the hoped-for gain
        term: synergy
        note: Together worth more than apart; often overestimated.
  - label: External growth methods
    kind: types
    children:
      - label: 'Merger: two firms agree to combine'
        kind: type
        term: merger
        core: true
      - label: 'Acquisition: one buys control of another'
        kind: type
        term: acquisition
        core: true
      - label: 'Takeover: an acquisition, often hostile'
        kind: type
        term: takeover
        core: true
      - label: 'Joint venture: a new jointly owned business'
        kind: type
        term: joint-venture
        core: true
      - label: 'Strategic alliance: cooperation, no new firm'
        kind: type
        term: strategic-alliance
        core: true
      - label: 'Franchising: the brand licensed to others'
        kind: type
        term: franchising
        core: true
        children:
          - label: Franchisor sets standards, earns royalties
            term: franchisor
          - label: Franchisee invests and runs the outlet
            term: franchisee
  - label: Grow or stay small?
    kind: evaluation
    children:
      - label: Reasons to grow
        core: true
        children:
          - label: Economies of scale lower average cost
            kind: advantage
            term: economies-of-scale
            core: true
          - label: Market power and a stronger brand
            kind: advantage
            core: true
          - label: Risk spread across products and markets
            kind: advantage
          - label: "Owners' ambition and higher profit"
            kind: advantage
      - label: Why many SMEs stay small
        term: small-and-medium-sized-enterprises
        core: true
        children:
          - label: The owner keeps control and independence
            kind: advantage
            core: true
          - label: Personal service and flexibility
            kind: advantage
            core: true
          - label: Avoids diseconomies and the risks of growth
            kind: advantage
          - label: A small or niche market, or limited finance
  - label: Tools for growth decisions
    kind: tool
    children:
      - label: 'Ansoff matrix: the direction of growth'
        term: ansoff-matrix
        core: true
        children:
          - label: Market penetration
            term: market-penetration
            note: Existing products in existing markets; the lowest risk.
          - label: Product development
            term: product-development
            note: New products for existing markets.
          - label: Market development
            term: market-development
            note: Existing products in new markets.
          - label: Diversification
            term: diversification
            note: New products in new markets; the highest risk.
      - label: 'Decision tree: compare expected values'
        term: decision-tree
        core: true
      - label: 'SWOT: the position growth starts from'
        term: swot-analysis
      - label: 'Force field: forces for and against'
        term: force-field-analysis
        level: HL
connections:
  - code: '1.3'
    label: Growth as a business objective
  - code: '1.6'
    label: Growing across borders as a multinational
  - code: '2.5'
    label: Cultures can clash when organizations merge (HL)
  - code: '3.2'
    label: Where the finance for growth comes from
  - code: '3.3'
    label: Average cost and how it changes with scale
basis:
  - source: ib-bm-guide-2024
    pages: '24'
  - source: hodder-bm-2022
    pages: '107-120'

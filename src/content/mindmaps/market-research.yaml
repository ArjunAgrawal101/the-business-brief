# Mindmap: 4.4 Market research. The platform's own summary of the subtopic's
# five content statements (guide p. 31), including every primary and secondary
# method and the three sampling methods that the guide names.
title: Market research
code: '4.4'
scope: subtopic
unit: 4
level: SL/HL
summary: Why and how organizations research their markets, the primary and secondary methods the guide names, the difference between qualitative and quantitative research, and quota, random and convenience sampling.
centre: Market research
order: 44
branches:
  - label: Why research the market
    kind: concept
    children:
      - label: Data to make better marketing decisions
        kind: definition
        term: market-research
        core: true
      - label: Find needs, gaps, segments
        core: true
      - label: Test ideas before launch
        core: true
      - label: Track competitors and satisfaction
      - label: Reduces risk but never removes it
        kind: limitation
  - label: Primary research
    kind: types
    children:
      - label: New, first-hand data
        kind: definition
        term: primary-research
        core: true
      - label: 'Surveys: many people, same questions'
        kind: type
        term: survey
        core: true
      - label: 'Interviews: in-depth, one-to-one'
        kind: type
        term: interview
        core: true
      - label: 'Focus groups: a guided discussion'
        kind: type
        term: focus-group
        core: true
      - label: 'Observation: watching what people do'
        kind: type
        term: observation
        core: true
      - label: Specific and private, but slow and costly
        note: It answers the business's own questions, and competitors do not see the results.
  - label: Secondary research
    kind: types
    children:
      - label: Existing data, gathered for another purpose
        kind: definition
        term: secondary-research
        core: true
      - label: 'Market analyses: published market reports'
        kind: type
        term: market-analysis
        core: true
      - label: 'Academic journals: expert-checked studies'
        kind: type
        term: academic-journal
      - label: 'Government publications: census, trade data'
        kind: type
        term: government-publication
        core: true
      - label: 'Media articles: news reports'
        kind: type
        term: media-article
      - label: 'Online content: sites, reviews, posts'
        kind: type
        term: online-content
        core: true
      - label: Quick and cheap, but may be dated or general
        note: Check who produced the data, when and why.
  - label: Qualitative or quantitative
    kind: concept
    children:
      - label: 'Qualitative: opinions and reasons, why and how'
        kind: definition
        term: qualitative-research
        core: true
        children:
          - label: Interviews, focus groups, open questions
            kind: example
      - label: 'Quantitative: numbers, how many and how often'
        kind: definition
        term: quantitative-research
        core: true
        children:
          - label: Closed questions, sales data
            kind: example
      - label: Depth against scale; most research uses both
        core: true
  - label: Sampling
    kind: types
    children:
      - label: A sample stands in for the population
        kind: definition
        term: sampling
        core: true
      - label: 'Quota: set numbers per group'
        kind: type
        term: quota-sampling
        core: true
        children:
          - label: Covers key groups; not random
      - label: 'Random: everyone has an equal chance'
        kind: type
        term: random-sampling
        core: true
        children:
          - label: Avoids chooser bias; needs a full list
      - label: 'Convenience: whoever is easiest to reach'
        kind: type
        term: convenience-sampling
        core: true
        children:
          - label: Quick and cheap; rarely representative
  - label: How far to trust the findings
    kind: evaluation
    children:
      - label: Sampling error shrinks as samples grow
        term: sampling-error
        core: true
      - label: 'Bias: leading questions, skewed samples'
        kind: limitation
        term: research-bias
        core: true
      - label: Accuracy has to be weighed against cost
        core: true
      - label: Say one thing, do another
        kind: limitation
        note: What people report in surveys can differ from what they buy.
      - label: 'Ethics: consent and privacy'
        note: Research must respect participants and data protection law.
  - label: Connections
    kind: connection
    children:
      - label: '4.2: research finds segments and gaps'
        core: true
      - label: '4.3: surveys feed sales forecasts'
        level: HL
      - label: 'Toolkit: descriptive statistics'
        note: Means, medians, charts and other summaries of research data.
      - label: '5.9: data mining, big data'
        level: HL
connections:
  - code: '4.2'
    label: Research identifies segments, gaps and positions
  - code: '4.3'
    label: Surveys and research data feed sales forecasts (HL)
  - code: '4.5'
    label: Testing products, prices and promotions before launch
  - code: '5.9'
    label: Data analytics and data mining as sources of insight (HL)
  - code: '1.1'
    label: Researching the market before starting a business
basis:
  - source: ib-bm-guide-2024
    pages: '31'

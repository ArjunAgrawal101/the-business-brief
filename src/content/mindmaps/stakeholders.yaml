# Mindmap: 1.4 Stakeholders. The platform's own summary of the subtopic's two
# content statements (guide p. 24). Checked against the guide; the supplied
# coursebook chapter 1.4 was used only to confirm coverage, and nothing in it
# is reproduced. Stakeholder mapping is not a toolkit tool, but it is the
# usual way to analyse the conflict the second statement names.
title: Stakeholders
code: '1.4'
scope: subtopic
unit: 1
level: SL/HL
summary: Who has a stake in a business, inside and outside it, why their interests clash, and how managers decide whose needs to put first.
centre: Stakeholders
order: 14
branches:
  - label: What a stakeholder is
    kind: concept
    children:
      - label: Anyone affected by or able to affect the business
        kind: definition
        term: stakeholder
        core: true
      - label: Each group has its own objectives
        core: true
      - label: Shareholders are only one stakeholder group
        term: shareholder
        note: Stakeholder and shareholder are different words with different meanings.
  - label: Internal stakeholders
    kind: types
    children:
      - label: Part of the organization
        kind: definition
        term: internal-stakeholder
        core: true
      - label: 'Employees: pay, security, conditions'
        kind: type
        core: true
      - label: 'Managers and directors: rewards, success'
        kind: type
      - label: 'Owners and shareholders: profit, dividends'
        kind: type
        core: true
  - label: External stakeholders
    kind: types
    children:
      - label: Outside the organization
        kind: definition
        term: external-stakeholder
        core: true
      - label: 'Customers: quality, value, service'
        kind: type
        core: true
      - label: 'Suppliers: steady orders, prompt payment'
        kind: type
        core: true
      - label: 'Government: taxes, jobs, legal compliance'
        kind: type
      - label: 'Local community: jobs, little disruption'
        kind: type
      - label: 'Lenders: repayment with interest'
        kind: type
      - label: 'Pressure groups: change on their issue'
        kind: type
        term: pressure-group
  - label: Conflict between stakeholders
    kind: application
    children:
      - label: One group's gain can be another's cost
        kind: definition
        term: stakeholder-conflict
        core: true
      - label: Dividends for owners versus pay for staff
        kind: example
        core: true
      - label: Expansion brings jobs, but noise and traffic
        kind: example
        core: true
      - label: Lower prices for customers squeeze suppliers
        kind: example
      - label: "Managers' goals versus owners' interests"
        kind: example
        term: divorce-of-ownership-and-control
      - label: A shared interest in the business surviving
        note: Common ground is the basis for a compromise.
  - label: Managing stakeholders
    kind: tool
    children:
      - label: 'Stakeholder mapping: power against interest'
        term: stakeholder-mapping
        core: true
        children:
          - label: 'High power, high interest: manage closely'
            core: true
          - label: 'High power, low interest: keep satisfied'
            core: true
          - label: 'Low power, high interest: keep informed'
            core: true
          - label: 'Low power, low interest: monitor'
            core: true
      - label: Consult, negotiate and compromise
        core: true
      - label: Stakeholder concept versus shareholder concept
        term: stakeholder-concept
        note: Serve every stakeholder, or put the owners' returns first?
      - label: Power shifts with the issue and over time
        note: A map is a snapshot, not a permanent ranking.
  - label: Connections
    kind: connection
    children:
      - label: 'Objectives and CSR: 1.3'
        core: true
      - label: 'Growth changes every group''s position: 1.5'
      - label: 'Employee relations: 2.7'
        level: HL
connections:
  - code: '1.2'
    label: Ownership decides who the owners and shareholders are
  - code: '1.3'
    label: Objectives and CSR respond to stakeholders
  - code: '1.5'
    label: Growth and mergers affect every stakeholder group
  - code: '2.7'
    label: Conflict between employers and employees (HL)
basis:
  - source: ib-bm-guide-2024
    pages: '24'
  - source: hodder-bm-2022
    pages: '97-106'

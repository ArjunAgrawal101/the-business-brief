      - label: 'Promotion: above, below, through the line'
        term: promotional-mix
        core: true
      - label: 'Place: distribution channels'
        term: distribution-channel
      - label: 'Service Ps: people, processes, physical evidence'
        core: true
        note: The three Ps for marketing a service.

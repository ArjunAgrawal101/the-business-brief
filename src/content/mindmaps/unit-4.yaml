        term: market-leader
        level: HL
  - label: 4.2 Marketing planning
    kind: application
    children:
      - label: The marketing plan and its objectives
        term: marketing-plan
        core: true
      - label: Segment, target, position
        term: market-segmentation
        core: true
      - label: Position maps reveal gaps
        term: position-map
      - label: Niche or mass market
        term: niche-market
      - label: USP and differentiation
        term: unique-selling-point
        core: true
  - label: 4.3 Sales forecasting
    kind: tool
    level: HL
    children:
      - label: Trends, extrapolation and judgement
        term: trend
        level: HL
        core: true
      - label: Benefits and limitations
        term: sales-forecast
        level: HL
        core: true

title: Marketing
code: unit-4
scope: unit
unit: 4
level: SL/HL with HL-only content
summary: Unit 4 in one view, from what marketing is and how markets are measured, through planning a target and a position, forecasting sales (HL) and researching the market, to the seven Ps of the marketing mix and marketing across borders (HL).
centre: Marketing
order: 40

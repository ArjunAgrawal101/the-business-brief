# Mindmap: 5.4 Location. The platform's own summary of the subtopic's two content
# statements: the reasons for a specific location of production, and the ways of
# reorganizing production nationally and internationally (guide p. 34). Checked
# against the guide; no coursebook chapter for 5.4 was supplied, and nothing from
# any source is reproduced.
title: Location
code: '5.4'
scope: subtopic
unit: 5
level: SL/HL
summary: Why a business produces where it does, and the four ways of reorganizing production at home and abroad, with their benefits and risks.
centre: Location
order: 54
branches:
  - label: Reasons for location
    kind: concept
    children:
      - label: Location factors
        kind: definition
        term: location-factors
        core: true
        note: Quantitative factors can be measured in money; qualitative ones cannot.
      - label: Quantitative factors
        kind: type
        core: true
        children:
          - label: Land, rent and wages
            core: true
          - label: Transport to customers and from suppliers
            core: true
          - label: Grants, taxes and tariffs
      - label: Qualitative factors
        kind: type
        core: true
        children:
          - label: Infrastructure, skilled labour
            core: true
          - label: Political stability and regulation
          - label: Culture and quality of life
  - label: Patterns of location
    kind: application
    children:
      - label: 'Bulky inputs: near materials'
        kind: example
        note: Heavy materials that lose weight in production, such as iron ore for steel.
      - label: 'Perishable: near customers'
        kind: example
        note: Fresh bread or bottled drinks are costly to move far.
      - label: 'Services: near customers'
        kind: example
        core: true
        note: Cafés, banks and gyms need passing trade.
      - label: 'Clustering: similar firms'
        term: clustering
        core: true
        note: Shared skills and suppliers bring external economies of scale.
      - label: Industrial inertia
        term: industrial-inertia
        core: true
        note: Staying put after the original reasons have faded.
  - label: Reorganizing production
    kind: types
    children:
      - label: Outsourcing (subcontracting)
        kind: definition
        term: outsourcing
        core: true
        note: Another business does the work.
      - label: Offshoring
        kind: definition
        term: offshoring
        core: true
        note: The work moves to another country.
      - label: Insourcing
        kind: definition
        term: insourcing
        core: true
        note: Outsourced work comes back in-house.
      - label: Reshoring
        kind: definition
        term: reshoring
        core: true
        note: Offshored work returns to the home country.
      - label: Who does it, or where
        core: true
        note: Outsourcing and insourcing change who; offshoring and reshoring change where.
  - label: Outsourcing and offshoring
    kind: evaluation
    children:
      - label: Lower costs, such as wages
        kind: advantage
        core: true
      - label: Specialists; focus on core
        kind: advantage
        core: true
      - label: Access to new markets
        kind: advantage
      - label: Less control of quality
        kind: limitation
        core: true
        note: And of delivery times and working conditions.
      - label: Long supply chains; ethics
        kind: limitation
        core: true
      - label: Job losses and image at home
        kind: limitation
  - label: Insourcing and reshoring
    kind: evaluation
    children:
      - label: Control of quality, know-how
        kind: advantage
        core: true
      - label: Faster response, shorter supply chains
        kind: advantage
        core: true
      - label: Rising costs abroad, automation
        note: Reasons the cost gap with the home country narrows.
      - label: Higher costs at home
        kind: limitation
        core: true
      - label: Investment in staff and facilities
        kind: limitation
connections:
  - code: '1.5'
    label: External economies of scale from clustering
  - code: '1.6'
    label: Where multinationals choose to operate
  - code: '2.1'
    label: Labour mobility and the supply of skills
  - code: '5.6'
    label: 'HL: supply chains, and cost to buy versus cost to make'
basis:
  - source: ib-bm-guide-2024
    pages: '34'

# Mindmap: Unit 5, Operations management, on one map. The platform's own summary
# of the nine subtopics (guide pp. 33 to 36). The map schema allows at most eight
# branches, so 5.1 and 5.2, each a single content statement, share one branch.
# The supplied coursebook chapters for 5.5 to 5.9 were used only to check
# coverage, and nothing from them is reproduced.
title: Operations management

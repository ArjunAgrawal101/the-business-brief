# Mindmap: 4.5 The seven Ps of the marketing mix. The platform's own summary of
# the subtopic's content statements (guide pp. 31 to 32): one branch per P and
# one for choosing an appropriate mix. Dynamic, competitive and contribution
# pricing and price elasticity of demand are HL only. The BCG matrix and
# Hofstede's cultural dimensions are toolkit tools (guide p. 14), the second HL.
title: The seven Ps of the marketing mix
code: '4.5'
scope: subtopic
unit: 4
level: SL/HL with HL-only content
summary: Product (the life cycle, extension strategies, the portfolio and branding), price (five methods for all, three more and price elasticity of demand at HL), promotion above, below and through the line and on social media, place, the three service Ps, and how to choose an appropriate mix.
centre: Seven Ps of the marketing mix
order: 45
branches:
  - label: Product
    kind: concept
    children:
      - label: 'Product life cycle: launch to decline'
        kind: definition
        term: product-life-cycle
        core: true
        children:
          - label: 'Introduction: slow sales'
            core: true
            note: Launch and promotion costs usually mean a loss.
          - label: 'Growth: sales and profit rise'
            core: true
          - label: 'Maturity: sales peak'
            core: true
            note: Most profit and cash; rivals crowd in and the market saturates.
          - label: 'Decline: sales and profit fall'
            core: true
      - label: 'Cash flow: negative at launch, best in maturity'
        core: true
        note: Heavy investment comes first; profit and cash follow in growth and maturity if the product succeeds.
      - label: Extension strategies
        term: extension-strategy
        core: true
        note: Renew sales in maturity and delay decline.
        children:
          - label: New uses, markets, packaging
            kind: example
            note: Also new versions, price changes and fresh promotion.
      - label: 'Portfolio: the whole range'
        term: product-portfolio
        core: true
        note: Balance products at different stages of the life cycle.
        children:
          - label: 'BCG: stars, cash cows, question marks, dogs'
            core: true
            note: Cash cows fund stars and question marks; dogs may be withdrawn.
      - label: 'Branding: awareness, development, loyalty, value'
        term: brand
        core: true
        note: A strong brand brings recognition, trust, loyalty and the power to charge more.
        children:
          - label: 'Awareness: buyers recognize it'
            term: brand-awareness
          - label: 'Development: building identity'
            term: brand-development
          - label: 'Loyalty: repeat buying'
            term: brand-loyalty
          - label: 'Value: what the brand is worth'
            term: brand-value
  - label: Price
    kind: types
    children:
      - label: 'Cost-plus: a mark-up added to unit cost'
        kind: type
        term: cost-plus-pricing
        core: true
        note: Simple and covers cost, but ignores demand and rivals' prices.
      - label: 'Penetration: low price to win share'
        kind: type
        term: penetration-pricing
        core: true
        note: Thin early margins, and raising the price later is hard.
      - label: 'Loss leader: below cost to draw buyers'
        kind: type
        term: loss-leader
        core: true
        note: Works only if customers also buy other, profitable items.
      - label: 'Predatory: undercut to drive out rivals'
        kind: type
        term: predatory-pricing
        core: true
        note: Illegal in many countries and widely seen as unethical.
      - label: 'Premium: a high price signals quality'
        kind: type
        term: premium-pricing
        core: true
        note: Needs a strong brand or USP to justify it.
      - label: 'Dynamic: varies with demand'
        kind: type
        term: dynamic-pricing
        level: HL
        core: true
        note: Fills capacity and raises revenue, but can look unfair.
      - label: 'Competitive: follows rivals'
        kind: type
        term: competitive-pricing
        level: HL
        core: true
        note: Suits similar products, but ignores the firm's own costs.
      - label: 'Contribution: priced above variable cost'
        kind: type
        term: contribution-pricing
        level: HL
        core: true
        note: Each sale contributes towards fixed costs and profit; useful with spare capacity.
      - label: Price elasticity of demand
        kind: formula
        term: price-elasticity-of-demand
        level: HL
        core: true
        formula: PED = % change in quantity demanded ÷ % change in price
        children:
          - label: 'Elastic (above 1): cut price to raise revenue'
            level: HL
          - label: 'Inelastic (below 1): raise price to raise revenue'
            level: HL
  - label: Promotion
    kind: types
    children:
      - label: 'Above the line: mass media'
        kind: type
        term: above-the-line-promotion
        core: true
        note: Television, radio, print, cinema and billboards; wide reach, high cost, hard to target.
      - label: 'Below the line: targeted'
        kind: type
        term: below-the-line-promotion
        core: true
        children:
          - label: Sales promotion, PR, direct mail, selling
            kind: example
            note: Also sponsorship and in-store displays; cheaper per customer and easier to measure.
      - label: 'Through the line: both, integrated'
        kind: type
        term: through-the-line-promotion
        core: true
        note: One message carried across mass and targeted media.
      - label: Social media marketing
        term: social-media-marketing
        core: true
        children:
          - label: Cheap, targeted, two-way, measurable
            kind: advantage
          - label: Criticism spreads fast; needs constant work
            kind: limitation
          - label: Influencers reach trusting followers
            term: influencer-marketing
  - label: Place
    kind: types
    children:
      - label: 'Distribution channel: maker to customer'
        kind: definition
        term: distribution-channel
        core: true
      - label: 'Direct: online or own shops'
        kind: type
        term: e-commerce
        core: true
        note: A zero-level channel; more control and margin, but the producer does all the work.
      - label: 'One-level: via a retailer'
        kind: type
        term: retailer
        core: true
      - label: 'Two-level: adds a wholesaler'
        kind: type
        term: wholesaler
        core: true
      - label: Agents for distant or foreign markets
        kind: type
        term: intermediary
      - label: Choose by product, market, cost, control
        core: true
        note: Short channels give control and margin; long ones give reach.
  - label: People
    kind: concept
    children:
      - label: Staff are part of a service
        kind: definition
        term: people-marketing-mix
        core: true
      - label: Training, attitude, relationships
        core: true
        note: Good relationships between employees and customers win repeat business.
      - label: Expectations vary between national cultures
        core: true
        note: Formality, speed, directness and personal attention all differ.
      - label: "Hofstede's dimensions (toolkit)"
        level: HL
        note: An HL tool for comparing national cultures.
  - label: Processes
    kind: concept
    children:
      - label: How a service is delivered
        kind: definition
        term: processes-marketing-mix
        core: true
      - label: Speed and reliability drive satisfaction
        core: true
      - label: 'Changes: apps, self-service, automation'
        core: true
        note: Lower costs and waiting times, but less personal contact.
  - label: Physical evidence
    kind: concept
    children:
      - label: Tangible cues to an intangible service
        kind: definition
        term: physical-evidence
        core: true
      - label: Premises, uniforms, website, receipts, brochures
        kind: example
        core: true
      - label: Reassures buyers, supports the price
        kind: advantage
  - label: Choosing the right mix
    kind: evaluation
    children:
      - label: The Ps must fit each other
        term: marketing-mix
        core: true
      - label: Fit the target market and the position
        core: true
      - label: Mix changes with PLC stage
        note: Informative promotion at launch, wider distribution in growth, competitive prices in maturity.
      - label: Services need all seven Ps
        note: Goods rely most on the first four.
      - label: Limited by budget, rivals and ethics
        kind: limitation
        core: true
connections:
  - code: '3.7'
    label: The product life cycle shapes investment, profit and cash flow
  - code: '3.3'
    label: Costs set the floor for cost-plus and contribution pricing
  - code: '5.5'
    label: A change in price moves the break-even quantity
  - code: '4.2'
    label: The mix delivers the chosen position and USP
  - code: '4.6'
    label: Adapting the mix for foreign markets (HL)
basis:
  - source: ib-bm-guide-2024
    pages: '14, 31 to 32'

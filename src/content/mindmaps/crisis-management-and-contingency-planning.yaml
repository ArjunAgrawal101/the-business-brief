# Mindmap: 5.7 Crisis management and contingency planning (HL only). The
# platform's own summary of the subtopic's three content statements (guide
# p. 35). The supplied coursebook chapter (pp. 534 to 539) was used only to check
# coverage, and nothing from it is reproduced.
title: Crisis management and contingency planning
code: '5.7'
scope: subtopic
unit: 5
level: HL
summary: What a crisis is, how preparing for one differs from managing one, the four factors in effective crisis management, and what contingency planning costs and gains.
centre: Crisis management and contingency planning
order: 57
branches:
  - label: What is a crisis?
    kind: concept
    level: HL
    children:
      - label: Sudden threat, urgent action
        kind: definition
        term: crisis
        core: true
      - label: Internal causes
        kind: type
        children:
          - label: Product fault or recall
            kind: example
          - label: IT failure or fraud
            kind: example
      - label: External causes
        kind: type
        children:
          - label: Fire, flood, pandemic
            kind: example
          - label: Cyberattack, supplier collapse
            kind: example
            term: cybercrime
      - label: Little time, incomplete information
        core: true
        note: Often under intense media attention.
  - label: Planning or managing
    kind: concept
    level: HL
    children:
      - label: 'Contingency planning: before'
        kind: definition
        term: contingency-planning
        core: true
        note: Preparing responses to events that might happen.
      - label: 'Crisis management: during'
        kind: definition
        term: crisis-management
        core: true
        note: Responding once the crisis has happened.
      - label: Proactive versus reactive
        note: Planning anticipates; crisis management reacts.
      - label: A plan speeds the response
        core: true
        note: But no plan covers every event.
  - label: Effective crisis management
    kind: concept
    level: HL
    children:
      - label: 'Transparency: openness'
        core: true
        note: Admitting what is known, and what is not, builds trust.
      - label: 'Communication: prompt, clear'
        core: true
        note: Tell staff, customers, investors and the media before rumours do.
      - label: 'Speed: act before it spreads'
        core: true
        note: But avoid rushed statements that later prove false.
      - label: 'Control: clear leadership'
        core: true
        note: Someone in charge, with the resources to act and to monitor progress.
      - label: The response is judged
        note: Stakeholders judge the response; handled well, a crisis can even strengthen a reputation.
  - label: Contingency plans
    kind: application
    level: HL
    children:
      - label: Rank risks by likelihood
        core: true
        note: And by the damage each would do.
      - label: Second suppliers, backups
        core: true
        note: Backup data and sites; buffer stock and a second supplier protect production.
      - label: Trained staff, clear roles
      - label: A plan for the media and stakeholders
      - label: Insurance against losses
      - label: Rehearse and review it
        core: true
  - label: Impact of planning
    kind: evaluation
    level: HL
    children:
      - label: 'Cost: spend now, save later'
        core: true
        note: Planning, training and backups cost money; an unplanned crisis usually costs more.
      - label: 'Time: slow to prepare, faster to act'
        core: true
      - label: 'Risks: lower but not zero'
        core: true
        note: A plan may prepare for events that never happen, and miss the one that does.
      - label: 'Safety: people first'
        core: true
        note: Then assets, operations and reputation.
      - label: Depends on the business
        note: A food maker plans for recalls; an airline plans for accidents.
connections:
  - code: '2.6'
    label: Communication methods and barriers in a crisis
  - code: '1.4'
    label: The stakeholders a crisis affects
  - code: '5.9'
    label: Cybercrime as a cause of crisis
  - code: '5.6'
    label: Buffer stock and second suppliers as contingency
basis:
  - source: ib-bm-guide-2024
    pages: '35'
  - source: hodder-bm-2022
    pages: '534-539'

# Mindmap: 2.2 Organizational structure. The platform's own summary of the
# subtopic's four content statements (guide p. 25); the last, changes in
# structure such as project-based organization and Handy's Shamrock
# Organization, is HL only. Checked against the guide only.
title: Organizational structure
code: '2.2'
scope: subtopic
unit: 2
level: SL/HL with HL-only content
summary: How organizations arrange authority, decisions and communication, the main types of organization chart, how to choose a structure when external factors change and, at HL, flexible forms such as project-based organization and Handy's Shamrock Organization.
centre: Organizational structure
order: 22
branches:
  - label: Authority and control
    kind: concept
    children:
      - label: 'Structure: how jobs and authority are arranged'
        kind: definition
        term: organizational-structure
        core: true
        note: It sets who reports to whom, who decides what and how information flows.
      - label: 'Delegation: passing authority down'
        kind: definition
        term: delegation
        core: true
        note: The manager who delegates stays accountable for the result.
      - label: 'Span of control: direct reports per manager'
        kind: definition
        term: span-of-control
        core: true
        children:
          - label: 'Wide: lighter supervision, flatter'
          - label: 'Narrow: close control, taller'
      - label: 'Levels of hierarchy: layers of authority'
        kind: definition
        term: levels-of-hierarchy
        core: true
      - label: 'Chain of command: the line of authority'
        kind: definition
        term: chain-of-command
        core: true
        note: Instructions pass down it; accountability passes up.
  - label: Decisions and layers
    kind: concept
    children:
      - label: 'Centralization: decisions kept at the top'
        kind: definition
        term: centralization
        core: true
      - label: 'Decentralization: decisions passed down'
        kind: definition
        term: decentralization
        core: true
      - label: 'Bureaucracy: rules, procedures, approvals'
        kind: definition
        term: bureaucracy
        core: true
        note: Consistent and controlled, but slow and rigid.
      - label: 'Delayering: removing levels of hierarchy'
        kind: definition
        term: delayering
        core: true
        note: Usually cuts middle managers to flatten the structure and save costs.
      - label: Most firms centralize only some decisions
        note: Finance and brand are often decided centrally; local service decisions are passed down.
  - label: Types of organization chart
    kind: types
    children:
      - label: 'Chart: roles, reporting lines, levels'
        kind: definition
        term: organization-chart
      - label: 'Flat or horizontal: few levels, wide spans'
        kind: type
        term: flat-structure
        core: true
      - label: 'Tall or vertical: many levels, narrow spans'
        kind: type
        term: tall-structure
        core: true
      - label: 'By function: marketing, finance, HR, operations'
        kind: type
        term: functional-structure
        core: true
      - label: 'By product: a division for each range'
        kind: type
        term: product-structure
        core: true
      - label: 'By region: a division for each area'
        kind: type
        term: regional-structure
        core: true
      - label: 'Matrix: two bosses, function and project'
        kind: type
        term: matrix-structure
        core: true
  - label: Choosing a structure
    kind: evaluation
    children:
      - label: 'Flat: fast decisions, lower costs'
        kind: advantage
        core: true
      - label: 'Flat: overloaded managers, few promotions'
        kind: limitation
        core: true
      - label: 'Tall: close control, clear career ladder'
        kind: advantage
        core: true
      - label: 'Tall: slow, costly, distorted messages'
        kind: limitation
        core: true
      - label: 'Decentralized: responsive but less consistent'
      - label: Fit with size, strategy, culture and staff
        core: true
  - label: Structure and external change
    kind: application
    children:
      - label: 'Fast-changing markets: flatter, more flexible'
        core: true
        note: Fewer layers and more decentralization let the business respond faster.
      - label: 'Selling abroad: organize by region'
        core: true
        note: Local managers can adapt to local tastes, laws and cultures.
      - label: 'New technology: fewer middle managers'
        core: true
        note: Digital tools let one manager coordinate more people, often working remotely.
      - label: 'Cost pressure or recession: delayering'
      - label: 'Wider product range: product divisions'
      - label: Does the structure still fit the strategy?
        kind: question
  - label: Changing structures
    kind: theory
    level: HL
    children:
      - label: Project-based organization
        kind: definition
        term: project-based-organization
        core: true
        note: Temporary teams from different functions form around each project, then disband.
      - label: "Handy's Shamrock Organization"
        term: shamrock-organization
        core: true
        note: Three groups of workers, like the three leaves of a shamrock.
        children:
          - label: 'Professional core: permanent key staff'
            term: professional-core
            core: true
          - label: 'Contractual fringe: outside contractors'
            term: contractual-fringe
            core: true
          - label: 'Flexible labour force: temporary, part-time'
            term: flexible-labour-force
            core: true
      - label: Flexible, with lower fixed labour costs
        kind: advantage
      - label: Weaker loyalty; harder to coordinate
        kind: limitation
  - label: Connections
    kind: connection
    children:
      - label: '2.3: delegating needs trust and skills'
        core: true
      - label: '2.6: long chains slow communication'
      - label: '5.4: outsourcing and the contractual fringe'
        level: HL
connections:
  - code: '2.3'
    label: How much leaders delegate shapes spans of control and decentralization
  - code: '2.5'
    label: Role cultures suit tall structures; task cultures suit matrices (HL)
  - code: '2.6'
    label: The chain of command sets the formal channels of communication
  - code: '5.4'
    label: Outsourcing creates the Shamrock's contractual fringe (HL)
basis:
  - source: ib-bm-guide-2024
    pages: '25'

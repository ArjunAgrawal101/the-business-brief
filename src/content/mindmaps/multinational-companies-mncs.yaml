# Mindmap: 1.6 Multinational companies (MNCs). The platform's own summary of
# the subtopic's one content statement, the impact of MNCs on host countries
# (guide p. 24, AO3), written from the guide and subject knowledge: no
# coursebook chapter for 1.6 was supplied. The links to 4.6 and to Hofstede's
# cultural dimensions are marked HL because both are HL only.
title: Multinational companies (MNCs)
code: '1.6'
scope: subtopic
unit: 1
level: SL/HL
summary: What makes a business multinational, why businesses expand abroad, and how to weigh the benefits and costs of MNCs for the host countries they operate in.
centre: Multinational companies (MNCs)
order: 16
branches:
  - label: What an MNC is
    kind: concept
    children:
      - label: Operates in more than one country
        kind: definition
        term: multinational-company
        core: true
        note: Exporting alone does not make a business an MNC.
      - label: Directed from a head office in its home country
      - label: 'Host country: where it operates abroad'
        kind: definition
        term: host-country
        core: true
      - label: Expands through foreign direct investment
        term: foreign-direct-investment
        core: true
  - label: Why businesses go multinational
    kind: concept
    children:
      - label: New markets and customers
        core: true
      - label: Lower costs of labour, materials or tax
        core: true
      - label: Producing inside trade barriers
        note: A local factory avoids tariffs and quotas on imports.
      - label: Globalization makes it easier
        term: globalization
        note: Cheaper transport and communication, and fewer trade barriers.
  - label: Benefits for host countries
    kind: evaluation
    children:
      - label: Jobs and higher incomes
        kind: advantage
        core: true
      - label: Technology transfer and new skills
        kind: advantage
        term: technology-transfer
        core: true
      - label: Tax revenue for the government
        kind: advantage
        core: true
      - label: Orders for local suppliers
        kind: advantage
      - label: Investment in infrastructure
        kind: advantage
      - label: More choice and competition for consumers
        kind: advantage
  - label: Costs for host countries
    kind: evaluation
    children:
      - label: Local firms forced out by competition
        kind: limitation
        core: true
      - label: Profits sent back to the home country
        kind: limitation
        term: repatriation-of-profits
        core: true
      - label: Less tax paid through transfer pricing
        kind: limitation
        term: transfer-pricing
      - label: Low pay or poor conditions in some cases
        kind: limitation
      - label: Pollution and the using up of resources
        kind: limitation
        core: true
      - label: May leave when incentives or costs change
        kind: limitation
      - label: Pressure on local culture and traditions
        kind: limitation
  - label: Judging the impact
    kind: application
    children:
      - label: Depends on the type of investment
        core: true
        note: A factory buying from local suppliers differs from a sales office.
      - label: "Depends on the host's laws and bargaining power"
        core: true
      - label: Short-term gains versus long-term dependence
      - label: Does the MNC act responsibly?
        term: corporate-social-responsibility
      - label: Who gains and who loses in the host country?
        kind: question
        core: true
  - label: Connections
    kind: connection
    children:
      - label: 'Growth by FDI, joint ventures, alliances: 1.5'
        core: true
      - label: 'Stakeholders in the host country: 1.4'
      - label: 'Entering markets abroad: 4.6'
        level: HL
      - label: "Cultural differences: Hofstede's dimensions"
        term: hofstedes-cultural-dimensions
        level: HL
connections:
  - code: '1.5'
    label: External growth methods used to expand abroad
  - code: '1.4'
    label: Host-country stakeholders gain and lose
  - code: '4.6'
    label: How businesses enter international markets (HL)
  - code: '5.4'
    label: Where to locate production, including offshoring
basis:
  - source: ib-bm-guide-2024
    pages: '24'

# Mindmap: 3.3 Costs and revenues. The platform's own summary of the
# subtopic's two content statements (guide pp. 28 to 29): types of cost, and
# total revenue and revenue streams. Formulas match the platform's calculators.
# Checked against the guide; no coursebook chapter was supplied for this unit.
title: Costs and revenues
code: '3.3'
scope: subtopic
unit: 3
level: SL/HL
summary: How costs are classified, by how they behave as output changes and by whether they can be traced to a product, and where a business's revenue comes from.
centre: Costs and revenues
order: 33
branches:
  - label: Types of cost
    kind: types
    children:
      - label: 'Fixed: do not change with output'
        kind: type
        term: fixed-cost
        core: true
        children:
          - label: Rent, salaries, insurance
            kind: example
      - label: 'Variable: change in proportion to output'
        kind: type
        term: variable-cost
        core: true
        children:
          - label: Raw materials, packaging, piece rates
            kind: example
      - label: 'Semi-variable: a fixed and a variable part'
        kind: type
        term: semi-variable-cost
        children:
          - label: A basic salary plus sales commission
            kind: example
      - label: 'Direct: traced to one product'
        kind: type
        term: direct-cost
        core: true
        children:
          - label: The materials and labour for that product
            kind: example
      - label: 'Indirect (overhead): shared across products'
        kind: type
        term: indirect-cost
        core: true
        children:
          - label: Rent of head office, administration, marketing
            kind: example
  - label: Two ways to classify
    kind: concept
    children:
      - label: 'By behaviour: fixed or variable'
        core: true
        note: Does the cost change when output changes?
      - label: 'By traceability: direct or indirect'
        core: true
        note: Can the cost be linked to one product?
      - label: A cost can be both fixed and direct
        note: A machine leased for one product only is fixed and direct to that product.
      - label: Fixed only within a range of output
        kind: limitation
        note: A second shift or a bigger site makes fixed costs rise in a step.
  - label: Totals and profit
    kind: calculation
    children:
      - label: Total cost
        kind: formula
        term: total-cost
        core: true
        formula: Total cost = total fixed costs + (variable cost per unit × output)
      - label: Average cost
        kind: formula
        term: average-cost
        formula: Average cost = total cost ÷ output
      - label: Total revenue
        kind: formula
        term: total-revenue
        core: true
        formula: Total revenue = selling price per unit × quantity sold
      - label: Profit
        kind: formula
        term: profit
        core: true
        formula: Profit = total revenue − total cost
        note: A negative result is a loss.
  - label: Revenue streams
    kind: types
    children:
      - label: A distinct source of revenue
        kind: definition
        term: revenue-stream
        core: true
      - label: Sales of goods
        kind: type
        core: true
      - label: Fees for services, subscriptions
        kind: type
        core: true
      - label: Commission, advertising, licences, sponsorship
        kind: type
      - label: Interest earned on savings
        kind: type
      - label: More streams spread the risk
        kind: advantage
        core: true
        note: If one stream falls, others keep revenue coming in.
  - label: Using cost and revenue data
    kind: evaluation
    children:
      - label: Setting prices that cover costs
        core: true
        note: Pricing methods are in 4.5.
      - label: Finding contribution and break-even
        term: contribution
        core: true
        note: Break-even analysis is in 5.5.
      - label: Controlling costs to protect profit
      - label: More revenue is not always more profit
        kind: limitation
        core: true
        note: A price cut can raise revenue and still lower profit.
      - label: Overheads are hard to share out fairly
        kind: limitation
        note: Splitting indirect costs between products is often arbitrary.
  - label: Connections
    kind: connection
    children:
      - label: 'Break-even analysis: 5.5'
        core: true
      - label: 'Costs in the accounts: 3.4'
      - label: 'Average cost falls with scale: 1.5'
        term: economies-of-scale
      - label: 'Budgeting costs: 3.9'
        level: HL
connections:
  - code: '5.5'
    label: Contribution and the break-even point
  - code: '4.5'
    label: Prices that cover costs
  - code: '3.4'
    label: Costs and revenues in the statement of profit or loss
  - code: '1.5'
    label: Economies of scale and average cost
  - code: '3.9'
    label: Budgeting costs and revenues (HL)
basis:
  - source: ib-bm-guide-2024
    pages: '28-29'

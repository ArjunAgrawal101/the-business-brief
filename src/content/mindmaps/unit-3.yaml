# Mindmap: unit 3, finance and accounts. One branch per subtopic, except that
# 3.5 and 3.6 (both ratio analysis) share a branch, because a map may have at
# most eight branches and the unit has nine subtopics. Checked against the
# guide (syllabus pp. 28 to 30, layouts pp. 59 to 63, formulae pp. 64 to 66).
title: Finance and accounts
code: unit-3
scope: unit
unit: 3
level: SL/HL with HL-only content
summary: How a business pays for what it does, records what it earns, owns and owes, judges its performance and its cash position, chooses investments and, for HL, plans with budgets.
centre: Finance and accounts
order: 30
branches:
  - label: 3.1 Introduction to finance
    kind: concept
    children:
      - label: Finance raises, plans and records money
        term: finance-function
        core: true
      - label: 'Capital expenditure: assets that last'
        term: capital-expenditure
        core: true
      - label: 'Revenue expenditure: day-to-day running'
        term: revenue-expenditure
        core: true
  - label: 3.2 Sources of finance
    kind: types
    children:
      - label: 'Internal: own funds, retained profit, asset sales'
        term: internal-sources-of-finance
        core: true
      - label: 'External: shares, loans, overdrafts, trade credit'
        term: external-sources-of-finance
        core: true
      - label: Crowdfunding, leasing, microfinance, angels
      - label: Match short- or long-term finance to the need
        core: true
  - label: 3.3 Costs and revenues
    kind: types
    children:
      - label: Fixed, variable, direct, indirect costs
        core: true
      - label: Total revenue and revenue streams
        term: revenue-stream
        core: true
      - label: 'Profit: total revenue − total cost'
        term: profit
  - label: 3.4 Final accounts
    kind: concept
    children:
      - label: 'Statement of profit or loss: performance'
        term: statement-of-profit-or-loss
        core: true
      - label: 'Statement of financial position: on one date'
        term: statement-of-financial-position
        core: true
      - label: Accounts serve different stakeholders
      - label: Intangible assets such as goodwill
        term: intangible-asset
      - label: 'Depreciation: straight line, units of production'
        term: depreciation
        level: HL
  - label: 3.5 and 3.6 Ratio analysis
    kind: calculation
    children:
      - label: 'Profitability: margins, ROCE'
        term: profitability
        core: true
      - label: 'Liquidity: current and acid test ratios'
        term: liquidity
        core: true
      - label: 'Efficiency: stock, debtors, creditors, gearing'
        term: efficiency-ratios
        level: HL
        core: true
      - label: Insolvency versus bankruptcy
        term: insolvency
        level: HL
  - label: 3.7 Cash flow
    kind: concept
    children:
      - label: Profit is not cash
        term: cash-flow
        core: true
      - label: Working capital and liquidity position
        term: working-capital
        core: true
      - label: Cash flow forecasts
        term: cash-flow-forecast
        core: true
      - label: Strategies for cash flow problems
  - label: 3.8 Investment appraisal
    kind: calculation
    children:
      - label: Payback period
        term: payback-period
        core: true
      - label: Average rate of return (ARR)
        term: average-rate-of-return
        core: true
      - label: Net present value (NPV)
        term: net-present-value
        level: HL
        core: true
  - label: 3.9 Budgets
    kind: tool
    level: HL
    children:
      - label: Cost and profit centres
        term: cost-centre
        level: HL
        core: true
      - label: Constructing a budget
        term: budget
        level: HL
      - label: 'Variances: favourable or adverse'
        term: variance
        level: HL
        core: true
connections:
  - code: '1.1'
    label: Finance as one of the four business functions
  - code: '1.5'
    label: Paying for growth
  - code: '4.5'
    label: The product life cycle, investment, profit and cash flow
  - code: '5.5'
    label: Contribution and break-even build on costs and revenues
basis:
  - source: ib-bm-guide-2024

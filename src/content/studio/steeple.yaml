example:
  title: The world around Northvale Cycles
  situation: Before deciding how to restore profit, Northvale scans the next three years in its home market. Some changes help it, such as the van restrictions in city centres; others threaten it, such as the online brands' discounting. Fictional business; every figure is simulated.
  data:
    business: Northvale Cycles
    scope: Bicycles and e-bikes in Northvale's home market, over the next three years
    factors:
      - { id: so1, category: social, text: Families replacing a second car with a cargo bike, evidence: 'One household in twelve in the region''s cities now uses a cargo bike for school runs and shopping, up from one in thirty three years ago.', effect: opportunity, impact: 4, likelihood: 3 }
      - { id: so2, category: social, text: Older riders wanting electric assistance, evidence: 'Riders over 55 bought 38% of the e-bikes sold last year.', effect: opportunity, impact: 3, likelihood: 4 }
      - { id: te1, category: technological, text: Direct-online brands selling with home delivery and video fitting, evidence: 'The two largest online brands deliver a fitted bike to the door within five days.', effect: threat, impact: 4, likelihood: 4 }
      - { id: te2, category: technological, text: 'Lighter, cheaper batteries', evidence: 'Suppliers expect the battery cost of each kilometre of range to fall by about a quarter over three years.', effect: opportunity, impact: 3, likelihood: 3 }
      - { id: ec1, category: economic, text: Higher interest rates reducing spending on large purchases, evidence: 'E-bike sales across the market fell 6% last year as credit became dearer.', effect: threat, impact: 4, likelihood: 4 }
      - { id: ec2, category: economic, text: Rising prices for motors and batteries, evidence: 'Motor and battery prices rose 9% in a year.', effect: threat, impact: 4, likelihood: 3 }
      - { id: en1, category: environmental, text: Low-emission zones restricting vans, evidence: 'Three nearby cities will charge vans to enter their low-emission zones from 2027.', effect: opportunity, impact: 5, likelihood: 4 }
      - { id: po1, category: political, text: Councils building protected cycle lanes, evidence: 'The regional plan funds 60 km of protected lanes by 2028.', effect: opportunity, impact: 3, likelihood: 3 }
      - { id: po2, category: political, text: A possible grant for business cargo bikes, evidence: 'The national government is consulting; no decision is due before next year.', effect: opportunity, impact: 3, likelihood: 2 }
      - { id: le1, category: legal, text: Stricter battery safety and recycling rules, evidence: 'From 2027 every e-bike battery model must pass new tests, and makers must pay towards recycling.', effect: threat, impact: 3, likelihood: 4 }
      - { id: et1, category: ethical, text: Concern about working conditions in battery mineral supply chains, evidence: 'Campaign groups have named two battery makers, and more buyers ask where materials come from.', effect: threat, impact: 3, likelihood: 3 }
inUse: The recommended use is to let the ranking decide what goes forward. Develop the two or three factors at the top in depth, with their evidence and what they mean for this decision, and say briefly why the rest matter less. A STEEPLE that gives every factor the same attention has not yet done its job.

# STEEPLE builder. Checked against the Business management guide: STEEPLE
# analysis is a toolkit tool for SL and HL, suggested for units 1, 2 and 4
# (p. 14), taught at AO2 and AO4 (p. 13). The scoring of impact times
# likelihood and its three bands are the platform's teaching convention.
# The worked example is fictional, with simulated figures.
type: tool
kind: steeple
slug: steeple
title: STEEPLE builder
short: STEEPLE
order: 2
stage: diagnose
summary: Scan the external environment under seven headings, rate each factor for impact and likelihood, and get a prioritized list of the few that matter.
purpose: To scan the environment outside the organization systematically, so that no kind of change is missed, and then to rank what was found so that attention goes to the factors most likely to matter most.
howTo:
  - Name the organization and say which market and which period the scan covers. A factor that matters over three years in one country may not matter over one year in another.
  - Under each of the seven headings, add the external factors that could affect the organization, each with its evidence. A heading with nothing under it is a question to answer, not a gap to fill for its own sake.
  - Say whether each factor is an opportunity, a threat or both for this organization.
  - Rate its impact if it happens and its likelihood of happening, each from 1 to 5. The tool multiplies them and ranks the factors.
  - Read the prioritized list and the grid. Factors scoring 15 or more call for action now, 8 to 14 for a plan, and 7 or less for watching.
  - Carry the top factors into the SWOT as opportunities and threats, and test each option against them.
limitations:
  - Impact and likelihood are judgements. Two analysts can rate the same factor differently, so the ranking is only as good as the evidence and reasoning behind the ratings.
  - The headings overlap. A carbon tax is political, legal, economic and environmental at once; put it where it does most to explain the decision, and do not count it twice.
  - Multiplying two ratings treats a likely small change and an unlikely large one as equal. A low-likelihood, high-impact factor can still deserve a contingency plan.
  - It describes the environment, not the organization's ability to respond. That needs an internal analysis such as a SWOT.
  - It dates quickly, so it needs a stated period and regular review.

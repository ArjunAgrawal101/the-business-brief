# Ansoff planner. Checked against the Business management guide: the Ansoff
# matrix is a toolkit tool for SL and HL, suggested for units 1 and 4 (p. 14),
# taught at AO2 and AO4 (p. 13). The external growth methods offered are the
# five in 1.5 (p. 24). The worked example is fictional.
type: tool
kind: ansoff
slug: ansoff
title: Ansoff planner
short: Ansoff
order: 4
stage: options
summary: Place your own growth options on the Ansoff matrix by product and market, with the method of growth and the risk you see, and read the usual risk of each direction.
purpose: To classify each growth option by how far it takes the business from the products and customers it knows, and to set the usual risk of that direction beside the risks particular to the option.
howTo:
  - Say what the business sells now and to whom. "New" only means something against that starting point.
  - Add each option, with a sentence on what it involves.
  - For each option, decide whether the product is existing or new for this business, and whether the market is. The tool places it in a quadrant as you choose.
  - Choose the method of growth, internal or one of the external methods in 1.5. Direction and method are separate decisions.
  - Write the main risk of each option in your own words, then read the quadrant notes for the risks that usually come with its direction.
  - Take the options that survive into the decision tree and the option appraisal.
limitations:
  - It shows direction, not method. Franchising, a joint venture and an acquisition are ways of growing, and any of them can serve any direction.
  - It says nothing about profit or affordability. A low-risk option can still be a poor one if its market has no room to grow.
  - Existing and new are matters of degree. A modified product, or a neighbouring market, sits between the boxes, and the placement needs a reason.
  - Usual risk is an average. A business with the right skills can diversify more safely than one without them can develop a new product.

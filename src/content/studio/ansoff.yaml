example:
  title: Five ways Northvale could grow
  situation: Northvale has five growth options on the table, from cutting the price of its commuter e-bikes to building electric scooters. The matrix shows how far each takes it from what it knows. Fictional business; every figure is simulated.
  data:
    business: Northvale Cycles
    products: City, commuter, cargo, children's and road bikes
    markets: Riders in its home country, through about 120 dealers and its own website
    options:
      - id: o1
        name: Fleet cargo bikes for delivery firms
        detail: The cargo bike it already makes, adapted with lockable boxes and a service contract, sold direct to delivery firms in low-emission cities. Businesses are a new market for Northvale.
        product: existing
        market: new
        method: internal
        risk: 'Fleet buyers are new to Northvale: they negotiate hard and expect repairs within a day. If the fleet version needs a new frame, this becomes diversification.'
      - id: o2
        name: Win back commuters with lower prices
        detail: Cut the price of the commuter e-bike, online and through dealers, to recover share from the direct-online brands.
        product: existing
        market: existing
        method: internal
        risk: 'A price war with rivals whose costs are lower, about €1,200 a bike against €1,450, could cut margins further.'
      - id: o3
        name: City bikes for dealers abroad
        detail: Sell the existing city bikes through twelve dealers in a neighbouring country, with a local distributor.
        product: existing
        market: new
        method: alliance
        risk: 'Twelve dealers is a small base, the customers and rivals are unknown, and servicing at a distance is costly.'
      - id: o4
        name: A bike subscription for commuters
        detail: A monthly fee covering a bike, servicing and theft cover, offered to the city riders who already buy Northvale bikes.
        product: new
        market: existing
        method: internal
        risk: 'It ties up cash in a fleet of bikes for rent, and the cost of theft and damage is unknown.'
      - id: o5
        name: Electric scooters for sharing schemes
        detail: Build electric scooters for city operators that rent them by the minute, with a scooter maker as partner.
        product: new
        market: new
        method: joint-venture
        risk: 'Northvale knows neither scooters nor sharing operators, several operators have failed, and margins are thin.'
inUse: The recommended use is to argue the placements that are not clear-cut and to let the risk notes, not the quadrant, carry the judgement. Northvale's fleet bike is market development only if the fleet version is the same product; say so, and say what would make it diversification. Then compare options on more than risk.

example:
  title: Which growth investment pays best?
  situation: Northvale weighs three investments against doing nothing new. The fleet cargo bike could meet weak demand, in which case Northvale would face a second decision, so the tree has a decision inside it. Figures are cash over three years in € millions, before each option's cost. Fictional business; every figure is simulated.
  data:
    business: Northvale Cycles
    question: Which growth investment should Northvale make over the next three years?
    currency: €
    unit: m
    nodes:
      - { id: root, parent: '', kind: decision, label: Choose a growth investment }
      - { id: fleet, parent: root, kind: chance, label: Launch a fleet cargo bike, cost: 2 }
      - { id: strong, parent: fleet, kind: end, label: Strong fleet demand, prob: 0.6, payoff: 6 }
      - { id: weak, parent: fleet, kind: decision, label: Weak fleet demand, prob: 0.4 }
      - { id: cut, parent: weak, kind: chance, label: Cut the fleet price, cost: 0.3 }
      - { id: respond, parent: cut, kind: end, label: Fleets respond, prob: 0.5, payoff: 3 }
      - { id: ignore, parent: cut, kind: end, label: Fleets do not respond, prob: 0.5, payoff: 1 }
      - { id: families, parent: weak, kind: end, label: Sell the bikes to families instead, cost: 0, payoff: 1.5 }
      - { id: online, parent: root, kind: chance, label: Relaunch commuter e-bikes online, cost: 1.2 }
      - { id: onstrong, parent: online, kind: end, label: Strong online sales, prob: 0.5, payoff: 3.5 }
      - { id: onweak, parent: online, kind: end, label: Weak online sales, prob: 0.5, payoff: 1 }
      - { id: export, parent: root, kind: chance, label: Export city bikes, cost: 0.8 }
      - { id: signup, parent: export, kind: end, label: Dealers sign up, prob: 0.4, payoff: 2.6 }
      - { id: few, parent: export, kind: end, label: Few dealers sign up, prob: 0.6, payoff: 0.5 }
      - { id: nothing, parent: root, kind: end, label: Do nothing new, cost: 0, payoff: 0 }
inUse: The recommended use is to give the expected values and then go beyond them. The fleet cargo bike has the highest expected value, €2.28m, but a 0.2 chance of losing €1.3m; say whether Northvale can bear that, which probability you trust least, and what a paid trial would do to it.

# Decision tree builder. Checked against the Business management guide:
# decision trees are a toolkit tool for SL and HL, suggested for units 1 and 5
# (p. 14), taught at AO2 and AO4 (p. 13). Expected values are worked by
# evaluateOption in src/lib/decision-tree.ts. The worked example is fictional:
# figures in € millions, simulated, and checked by hand in
# tests/unit/strategy-models.test.ts (the fleet option: 0.6 x 6 + 0.4 x 1.7 = 4.28,
# less its cost of 2 = 2.28).
type: tool
kind: decision-tree
slug: decision-tree
title: Decision tree builder
short: Decision tree
order: 8
stage: decide
summary: Build a decision tree of any shape, with options, costs, chances, probabilities and payoffs, and see expected values rolled back to the first decision, with the best branch marked.
purpose: To compare options whose results are uncertain, by weighting each possible outcome by its probability, and to see how a later decision changes the value of an earlier one.
howTo:
  - Name the decision at the root. Add a branch for each option, with what choosing it costs.
  - Make each option a chance node and give it its outcomes, each with a probability. The probabilities at each chance node must add up to 1, and the tool checks that they do.
  - End each branch with an outcome and its payoff, before the costs on the way to it. Where a later decision follows an outcome, change that outcome's type to a decision and grow the tree from there.
  - Read the rolled-back values. A chance node's value is the sum of probability times value; a decision takes the branch with the highest value net of its cost. The chosen branch is drawn heavier and the rejected ones are crossed.
  - Read the spread of results behind each option, not only its expected value, then test the probabilities you are least sure of.
limitations:
  - The probabilities and payoffs are estimates, and the answer is only as good as they are. Small changes to an uncertain probability can change the choice.
  - An expected value is an average over many imagined repeats. A decision taken once will produce one outcome, which may be the worst.
  - It ignores attitudes to risk. A business that cannot survive the worst outcome may rightly reject the option with the highest expected value.
  - It leaves out what the numbers do not capture, such as control, quality, ethics and the effect on people.
  - Payoffs at different times are treated as equal, unless they have been discounted first.

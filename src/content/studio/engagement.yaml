# The engagement that frames the Strategy Studio: one fictional client whose
# question runs through every tool. Northvale Cycles and every figure about it
# are invented for teaching (simulated data); the figures agree across the
# tools' worked examples, and tests/unit/strategy-content.test.ts checks that
# they do.
type: engagement
client: Northvale Cycles
fictional: true
setting: A family-owned bicycle maker in a mid-sized European city. The business, its people and its market are fictional, and every figure is simulated.
question: How should Northvale Cycles restore its profit over the next three years?
situation: |
  Northvale Cycles assembles bicycles in its own works and sells them through about 120 independent dealers and, since 2023, its own website. For thirty years it grew steadily on well-made city bikes. In the last two years its operating profit has more than halved, from €3.4m to €1.5m. Direct-online brands undercut its e-bikes, the price of motors and batteries has risen, and two of its five product lines lose money.

  Its one bright spot is the cargo e-bike it launched in 2022, which now leads a small but fast-growing segment, and three delivery firms have asked about fleets of them. Ingrid Marsh, the managing director, has asked for a recommendation to the family board. The tools in this room work through her question in order, from the diagnosis to the memo, and each opens on its part of the analysis.
facts:
  - { label: Founded, value: '1987, owned by the Marsh family' }
  - { label: People, value: '140 employees, one assembly works' }
  - { label: Revenue last year, value: '€38.0m from five product lines' }
  - { label: Operating profit, value: '€3.4m two years ago; €1.5m last year' }
  - { label: Channels, value: 'About 120 independent dealers; its own website since 2023' }
  - { label: The bright spot, value: 'Cargo e-bikes: 24% of the segment, which grew 22% last year' }
stages:
  - id: diagnose
    deliverable: A ranked picture of the position, the few internal and external factors that matter for this decision.
    body: Start with what is true now. SWOT sorts the evidence into what the business controls and what it does not; STEEPLE scans the environment so that the opportunities and threats are not guesswork; Five Forces, as enrichment, asks how attractive the market is to compete in.
  - id: options
    deliverable: A short list of distinct options, each with its direction of growth, its risk and the way it would compete.
    body: Turn the diagnosis into choices. The Ansoff matrix shows how far each option takes the business from what it knows; the BCG matrix shows which products should fund which; Porter's generic strategies (HL) ask how the business will compete at all.
  - id: decide
    deliverable: A ranked choice, with its expected value and a test of how far the ranking depends on the weights.
    body: Compare the options on the evidence. A decision tree weighs uncertain outcomes by their probabilities; the option appraisal scores each option against weighted criteria and shows what it would take for the ranking to change.
  - id: plan
    deliverable: A recommendation memo with the situation, options, evaluation, recommendation, risks and implementation.
    body: Make the decision work. The stakeholder map shows whose support it needs and how to treat each group; the force field (HL) weighs what drives the change against what holds it back; the memo brings the engagement together for the people who must act on it.
principles:
  - title: Models are aids to judgement
    body: Every tool here simplifies. A matrix puts a business in a box, a score turns a judgement into a number, and an expected value averages outcomes that will happen only once. Use the output to organize evidence and to see what you might have missed, then decide, and say why.
  - title: Evidence before labels
    body: A factor without evidence is an assertion. Every tool asks for the evidence behind each entry, and the checks point out entries that have none.
  - title: Use the tools the question needs
    body: A strong analysis uses two or three tools well, not all ten. The guide's toolkit tools are taught at AO2 and AO4 alongside the syllabus content (Business management guide, p. 13); the tools marked enrichment are not part of the IB course.
  - title: Your work stays on this device
    body: Each tool keeps your analysis in this browser only and exports it as plain text, a spreadsheet file, a JSON file to load again later, or a printed page. Nothing is sent anywhere.
reading:
  - code: '1.3'
    why: Strategy serves objectives. The notes cover strategic and tactical objectives, SWOT analysis and, at HL, Porter's generic strategies.
  - code: '1.4'
    why: Internal and external stakeholders and the conflicts between them, with stakeholder mapping by power and interest.
  - code: '1.5'
    why: The brief behind the Ansoff planner and the decision tree, on why businesses grow, how, and what growth does to costs.
  - code: '2.5'
    why: Cultural clashes when organizations grow, merge or change leadership, the human side of carrying out a strategy (HL).
  - code: '5.7'
    why: Crisis management and contingency planning, for the risks in a memo that would hurt most if they happened (HL).
decisionRooms:
  - id: marigold-growth
    why: Choose a growth route for a restaurant group under uncertainty, then live with what it does to costs, control and the brand.
  - id: halden-leadership
    why: Lead a change through resistance in a warehouse, the stakeholder and force field logic in action.
  - id: atelier-pricing
    why: Decide a price and a half-price order, where the strategic choice turns on the numbers.

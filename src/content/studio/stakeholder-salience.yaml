# Stakeholder salience. The salience model of Mitchell, Agle and Wood (1997)
# is not in the Business management guide: enrichment. It extends 1.4, whose
# statements are internal and external stakeholders and conflict between
# stakeholders, both AO2 (p. 24). The worked example is fictional: the
# decision and most stakeholders are those of the stakeholder map, judged
# here on power, legitimacy and urgency, with three more groups so that every
# class appears.
type: tool
kind: salience
slug: stakeholder-salience
title: Stakeholder salience
short: Salience
order: 7.5
stage: plan
summary: Judge each stakeholder's power, the legitimacy of its claim and its urgency, place it in one of seven classes, and see what each class asks of managers and how a stakeholder could move between classes.
purpose: To decide whose claims managers must attend to first, and why, by separating power from legitimacy and adding urgency, and to see which groups could quickly become more salient.
howTo:
  - State the decision. Legitimacy and urgency belong to a claim, and a claim is about a particular decision.
  - List the stakeholders and the claim each makes, in a sentence.
  - "For each, judge three things: whether it has power over the business, and of what kind; whether its claim is legitimate by the norms of the society it sits in; and whether the claim is urgent, both time-sensitive and critical to it. Record why."
  - "Read the classes: definitive stakeholders hold all three attributes and come first; each other class shows what that group asks of managers."
  - Read how each could move. A group that gains an ally, a deadline or recognition changes class, sometimes overnight, so plan for the moves that matter.
limitations:
  - The attributes are judgements made by managers, and different managers will judge them differently; the theory is about salience as managers perceive it.
  - Treating each attribute as present or absent simplifies. Power, legitimacy and urgency all come in degrees.
  - Legitimacy is contested. A claim one group sees as proper another may not, and the tool records your judgement, not a fact.
  - Salience describes whose claims managers are likely to notice, not whose claims deserve attention. Used to justify ignoring weak groups, it raises questions of ethics.
status:
  kind: enrichment
  subtopics: ['1.4']
  text: Stakeholder salience is not in the guide and is not one of its toolkit tools, so this tool is enrichment. It extends the analysis of 1.4, whose content statements are internal and external stakeholders and conflict between stakeholders, both at AO2 (Business management guide, p. 24). The three attributes and seven classes come from Ronald Mitchell, Bradley Agle and Donna Wood (1997), explained in the platform's own words.

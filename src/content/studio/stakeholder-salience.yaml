example:
  title: Whose claims come first in the fleet plan
  situation: The stakeholder map showed who has power and interest in the fleet plan. Salience asks a sharper question, whose claims are powerful, legitimate and urgent, and adds three groups the map left out. Fictional business; every figure is simulated.
  data:
    business: Northvale Cycles
    decision: Launch fleet cargo bikes for delivery firms, with a second assembly shift and direct sales
    stakeholders:
      - id: s1
        name: The Marsh family (owners)
        power: utilitarian
        legitimacy: 'yes'
        urgency: 'yes'
        claim: Restoring profit while keeping control of the business.
        evidence: They own the business and approve its budget, and the board expects a decision at its December meeting.
        change: Their urgency would ease if profit recovered without the plan.
        plan: Agree the case, the budget and the review dates at the December board.
      - id: s2
        name: Assembly staff
        power: utilitarian
        legitimacy: 'yes'
        urgency: 'yes'
        claim: A second shift means evening work, and a smaller range could mean fewer jobs.
        evidence: Evening work needs their agreement under their contracts, and the shift would start within six months.
        change: Their power over the shift would fall if enough volunteers came forward.
        plan: Consult the staff council before deciding; ask for volunteers first and pay a shift premium.
      - id: s3
        name: Independent dealers
        power: utilitarian
        legitimacy: 'yes'
        urgency: 'yes'
        claim: Direct fleet sales could bypass them and take their servicing work.
        evidence: They sell most of Northvale's bikes, and their contracts come up for renewal in the spring.
        change: A commission on fleet sales in their area would ease the urgency of their claim.
        plan: Pay dealers a commission on fleet sales in their area and use them for servicing.
      - id: s4
        name: The bank
        power: utilitarian
        legitimacy: 'yes'
        urgency: 'no'
        claim: The loan for tooling and stock being repaid on time.
        evidence: It lends the money for the plan and holds covenants on the loan, but nothing falls due until the first repayment next year.
        change: A missed forecast would make its claim urgent at once.
        plan: Show the cash flow forecast and the review points before the loan is drawn.
      - id: s5
        name: City council
        power: coercive
        legitimacy: 'yes'
        urgency: 'no'
        claim: Cleaner deliveries in the low-emission zone, and safe cycle lanes.
        evidence: It sets the van charges and the rules for cycle lanes, and has no deadline for this decision.
        change: Complaints about heavy cargo bikes in cycle lanes would make its claim urgent.
        plan: Brief the council on the plan and ask about the grant.
      - id: s6
        name: Delivery firms
        power: none
        legitimacy: 'yes'
        urgency: 'yes'
        claim: Reliable bikes, repairs within a day and a fair price, before the van charges start.
        evidence: Three firms have asked about fleets and need vehicles before 2027, but none has ordered, so none can yet impose terms.
        change: A large fleet order would give them power and make them definitive.
        plan: Run a paid trial with one firm and share the results with the others.
      - id: s7
        name: Neighbours of the works
        power: none
        legitimacy: 'yes'
        urgency: 'no'
        claim: Quiet evenings, without noise and traffic from a late shift.
        evidence: Their concern is reasonable, but the shift is not yet decided and they have no say over it.
        change: A start date for the shift would make their claim urgent, and the council could lend them power through planning conditions.
        plan: Explain the shift hours and keep deliveries to the daytime.
      - id: s8
        name: A direct-online e-bike brand
        power: utilitarian
        legitimacy: 'no'
        urgency: 'no'
        claim: None on this decision; it competes for the same customers.
        evidence: Its prices can move the whole market, but it has no relationship with Northvale and no claim on the plan.
        change: A move into fleet sales would make it a rival to watch closely, though still not a claimant to consult.
        plan: Track its prices and any move into fleets.
      - id: s9
        name: A former parts supplier
        power: normative
        legitimacy: 'no'
        urgency: 'yes'
        claim: Renewal of a contract that ended under its own terms, or it will publish claims about battery safety.
        evidence: The contract ended properly last year; it threatens to post the claims this month, and its posts reach many cyclists.
        change: Its power would fade if the battery test results were published first.
        plan: Do not renew under pressure; publish the battery test results and take legal advice on the claims.
      - id: s10
        name: An anonymous online account
        power: none
        legitimacy: 'no'
        urgency: 'yes'
        claim: Daily demands that Northvale drop the fleet plan.
        evidence: It posts every day, but has few followers and no connection with the business.
        change: A much larger following would give it power and make it dangerous.
        plan: Note it and do not engage; answer real questions about the plan in public.
inUse: 'The recommended use is to separate claims that are powerful from claims that are right. For Northvale, the owners, the staff and the dealers are definitive and come first; the delivery firms'' claim is urgent and legitimate but has no power behind it yet, and a large order would change that; the former supplier is dangerous, and the answer to it is evidence, not a renewed contract. A strong answer says whose claims come first and why, and what would move a group from one class to another.'

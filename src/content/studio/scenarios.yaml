# Scenario planner. Scenario planning is not in the Business management guide
# and is not one of its toolkit tools: enrichment. It builds on STEEPLE
# analysis (a toolkit tool, p. 14) and connects to strategic objectives (1.3,
# p. 23) and contingency planning (5.7, HL, p. 35). The method follows Schwartz
# (1991) and van der Heijden (1996). The worked example is fictional: its
# forces agree with the STEEPLE and Five Forces examples, and its options are
# the option appraisal's, with the staged fleet plan the memo recommends.
type: tool
kind: scenarios
slug: scenarios
title: Scenario planner
short: Scenarios
order: 11
stage: options
summary: Sort the forces behind a decision by impact and uncertainty, build four futures on the two critical uncertainties, each with a narrative, implications and early-warning signposts, and test your options in all four.
purpose: To prepare a long-lived decision for a future that cannot be forecast, by finding the few uncertainties that would change the answer, picturing the futures they could produce, and choosing options that hold up in all of them, or knowing which signposts would justify a bet on one.
howTo:
  - State the focal question and the horizon. Scenarios are built for a decision, not for the world in general.
  - List the driving forces, from a STEEPLE scan or your own, and rate each for its impact on the question and for how uncertain its outcome is. Give both ends of each one's range.
  - "Read the classes: forces that are important and fairly predictable are predetermined elements, part of every future; those that are important and genuinely open are the critical uncertainties."
  - Choose two critical uncertainties that can vary independently as the axes. Their ends make the four futures.
  - Name each future, write how the world gets there and what doing business in it is like, what it would mean for the business, and two or more signposts that would show it arriving.
  - Rate each option in every future. Commit to options that hold up in all four; keep contingent ones ready, with the signposts that would trigger them.
limitations:
  - Four futures drawn on two axes leave out every other combination. The forces not chosen still matter, and the real future may mix the scenarios.
  - The ratings are judgements, and an option's verdict depends on how generous they are. The comparison matters more than the numbers.
  - Scenarios are not forecasts and carry no probabilities, so they cannot say which future is likeliest. Where probabilities can honestly be estimated, a decision tree does that job.
  - Good scenarios take research and discussion. A set written alone in an hour mostly shows what its author already believed.

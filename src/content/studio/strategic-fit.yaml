# Strategic fit check. Strategic fit and the McKinsey 7S framework are not in
# the Business management guide: enrichment. The parts draw on IB content:
# SWOT and STEEPLE (toolkit, p. 14), objectives (1.3, p. 23), change (2.1,
# p. 25), structure (2.2, p. 25) and culture (2.5, HL, p. 27). The worked
# example is fictional and agrees with the other tools: the factors are the
# STEEPLE and SWOT ones, the strategy is the option the memo recommends.
# tests/unit/strategy-lab.test.ts works it by hand: external fit 23 of 38
# (+61%), readiness 49 of 86 (57%), 7S support 16 of 30 (2.7 of 5).
type: tool
kind: fit
slug: strategic-fit
title: Strategic fit check
short: Strategic fit
order: 12
stage: plan
summary: Test a chosen strategy at three levels, its fit with the environment, the readiness of the capabilities it needs and a McKinsey 7S consistency check of the organization behind it, judged by the weakest of the three.
purpose: To find out, before committing, whether the organization can deliver the strategy it has chosen, and what must change first, the strategy itself, the capabilities, or the structure, systems, people and culture.
howTo:
  - State the strategy being tested, as specifically as you can.
  - List the factors in the environment that matter most, from your SWOT, STEEPLE or Five Forces. Weight each by importance and rate how well the strategy answers it, from −2 (works against it) to +2 (exploits it or defends against it).
  - "List the capabilities the strategy needs, with the level the business has now and the level it needs, and choose how to close each gap: build, borrow or buy."
  - Describe each of the six other 7S elements as it is and as the strategy needs it, rate how far it supports the strategy now, and record the pairs of elements that pull against each other.
  - Read the verdict from the weakest level, then plan the changes it calls for, starting with the element at the centre of the most conflicts.
limitations:
  - Every rating is a judgement, and the three scores combine judgements; small differences mean little.
  - The weighting by importance and the bands for each level are the platform's teaching convention, not a standard.
  - It tests fit, not whether the strategy is right. A perfectly aligned organization can still pursue a poor strategy.
  - Soft elements such as shared values and style are hard to observe, so their ratings need evidence from behaviour, not from documents.
status:
  kind: enrichment
  subtopics: ['1.3', '2.1', '2.2', '2.5']
  text: The strategic fit check and the McKinsey 7S framework are not in the guide, so this tool is enrichment. Its parts draw on IB content, the opportunities and threats of SWOT and STEEPLE, both toolkit tools for SL and HL (Business management guide, p. 14), strategic objectives in 1.3 (p. 23), strategies for change in 2.1 (p. 25), organizational structure in 2.2 (p. 25) and cultural clashes in 2.5, which is HL only (p. 27). The seven elements come from Robert Waterman, Thomas Peters and Julien Phillips (1980).

example:
  title: Neither the cheapest nor clearly different
  situation: Northvale makes bikes for every kind of rider, at costs above the online brands and with a difference that earns little premium. The chart asks where it competes now, and where it could compete instead. Fictional business; every figure is simulated.
  data:
    business: Northvale Cycles
    market: Bicycles and e-bikes in Northvale's home market
    positions:
      - id: now
        name: Northvale now
        role: now
        scope: broad
        cost: 2
        diff: 3
        evidence: 'Five product lines for every kind of rider. Its costs are about a fifth above the online brands; riders and dealers value its durability, but it cannot charge much more for it.'
      - id: proposed
        name: Northvale proposed
        role: proposed
        scope: narrow
        cost: 2
        diff: 4
        evidence: 'Concentrate on cargo e-bikes for families and businesses, where its 24% share, custom builds and servicing support a clear premium.'
      - id: online
        name: Largest online brand
        role: rival
        scope: broad
        cost: 4
        diff: 2
        evidence: 'Sells direct with no dealer margin, at about €1,200 to make and deliver a commuter e-bike.'
      - id: specialist
        name: Premium cargo specialist
        role: rival
        scope: narrow
        cost: 1
        diff: 5
        evidence: 'Hand-built cargo bikes at about twice Northvale''s price, for buyers who want the best.'
      - id: discount
        name: Discount retailer's own bikes
        role: rival
        scope: broad
        cost: 5
        diff: 1
        evidence: 'The lowest prices in the market, sold in supermarkets with no servicing.'
inUse: The recommended use is to show the risk in the current position and test the move against the evidence. Northvale is at risk of being stuck in the middle; a focus on cargo bikes would give it a clear basis for competing, but the premium cargo specialist is already in that niche, so the answer must say why buyers would choose Northvale there.

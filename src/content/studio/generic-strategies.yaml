# Porter's generic strategies. Checked against the Business management guide:
# an HL-only toolkit tool, suggested for units 1 and 4 (p. 14), taught at AO2
# and AO4 (p. 13). The rating scales and the reading of "stuck in the middle"
# follow the platform's notes for 1.3. The worked example is fictional, with
# simulated figures.
type: tool
kind: porter
slug: generic-strategies
title: Porter's generic strategies
short: Generic strategies
order: 6
stage: options
summary: Position a business and its rivals by source of advantage and competitive scope, see which generic strategy each follows, and check the risk of being stuck in the middle.
purpose: To decide how a business will compete, through lower costs or through a difference customers pay more for, across the whole market or in a niche, and to check that it is not trying to do everything and achieving neither.
howTo:
  - Name the market, then add the business as it competes now.
  - Rate its cost advantage against rivals and the premium customers pay for what makes it different, each from 1 to 5, and choose its scope, the whole market or a niche. Give the evidence for each rating.
  - Add its main rivals the same way, and a proposed position if the strategy would move the business.
  - Read the chart and the grid. Ratings of 4 or 5 count as an advantage; a business with neither is at risk of being stuck in the middle.
  - Check the proposed position against the rivals already there, and against the evidence that the business could achieve it.
limitations:
  - Real businesses often combine low cost with a difference customers value, so the categories can oversimplify. Porter thought the combination unstable; some writers disagree.
  - A label is not a capability. A business that calls itself a cost leader without the scale or methods to back it up is simply cheap.
  - The ratings are judgements relative to rivals, and they change as rivals copy advantages.
  - The four strategies say how to compete, not where; the choice of market comes first.

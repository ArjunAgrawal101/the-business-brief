# Stakeholder map. Stakeholder mapping is not named in the Business management
# guide; it supports 1.4, whose statements are internal and external
# stakeholders and conflict between stakeholders, both AO2 (p. 24). The
# platform's notes for 1.4 present it as a recommended way to structure that
# analysis. Labelled enrichment. The worked example is fictional.
type: tool
kind: stakeholders
slug: stakeholder-map
title: Stakeholder map
short: Stakeholder map
order: 7
stage: plan
summary: Map each stakeholder group by its power over the business and its interest in a decision, with its stance, and get a suggested way of managing each.
purpose: To decide whose views a decision must take into account, how much effort each group deserves, and where the conflict between stakeholders lies, before the decision is made.
howTo:
  - State the decision. Interest means interest in this decision, so the map changes with it.
  - Add the stakeholder groups, internal and external, and say what each wants from the decision.
  - Rate each group's power over the business and its interest in the decision from 1 to 10, and its stance. A rating of 6 or more counts as high.
  - Read the map and the suggested approaches. The quadrant sets the approach; the stance adjusts it.
  - Write your own plan for each group, starting with the key players who oppose the decision.
limitations:
  - Placing a group is a judgement, and different managers will place it differently.
  - Power and interest change, sometimes quickly. Weak groups can join forces, or gain power through the media.
  - It shows who can push back, not whose claim is fair. Using it to ignore groups with little power raises questions of ethics.
  - A group is rarely of one mind. Staff, or customers, may hold several views at once.

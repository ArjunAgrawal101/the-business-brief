example:
  title: Who must be won over for the fleet plan
  situation: The recommended option, fleet cargo bikes for delivery firms, needs a second assembly shift and direct sales to businesses. The owners want it; the staff and the dealers are wary. Fictional business; every figure is simulated.
  data:
    business: Northvale Cycles
    decision: Launch fleet cargo bikes for delivery firms, with a second assembly shift and direct sales
    stakeholders:
      - { id: s1, name: The Marsh family (owners), kind: internal, power: 9, interest: 8, stance: supportive, concern: 'Restoring profit while keeping control of the business.', action: 'Agree the case, the budget and the review dates at the board.' }
      - { id: s2, name: Assembly staff, kind: internal, power: 6, interest: 8, stance: opposed, concern: 'A second shift means evening work, and a smaller range could mean fewer jobs.', action: 'Consult the staff council before deciding; ask for volunteers first and pay a shift premium.' }
      - { id: s3, name: Independent dealers, kind: external, power: 7, interest: 8, stance: opposed, concern: 'Direct fleet sales could bypass them and take their servicing work.', action: 'Pay dealers a commission on fleet sales in their area and use them for servicing.' }
      - { id: s4, name: Motor supplier, kind: external, power: 8, interest: 4, stance: neutral, concern: 'Larger, steadier orders and a reliable forecast.', action: 'Share the fleet forecast early and agree delivery slots.' }
      - { id: s5, name: The bank, kind: external, power: 7, interest: 4, stance: neutral, concern: 'The loan for tooling and stock being repaid on time.', action: 'Show the cash flow forecast and the review points.' }
      - { id: s6, name: Delivery firms, kind: external, power: 5, interest: 7, stance: supportive, concern: 'Reliable bikes, repairs within a day and a fair price.', action: 'Run a paid trial with one firm and share the results.' }
      - { id: s7, name: Neighbours of the works, kind: external, power: 2, interest: 6, stance: opposed, concern: 'Noise and traffic from a late shift.', action: 'Explain the shift hours and keep deliveries to the daytime.' }
      - { id: s8, name: City council, kind: external, power: 6, interest: 3, stance: supportive, concern: 'Cleaner deliveries in the low-emission zone.', action: 'Brief the council on the plan and ask about the grant.' }
      - { id: s9, name: Family customers, kind: external, power: 3, interest: 2, stance: neutral, concern: 'Prices and service for their own cargo bikes.', action: 'Keep them informed through dealers.' }
inUse: The recommended use is to identify the conflict and say how it will be handled. For Northvale, the owners want the plan while the staff and the dealers, both powerful, oppose it; a strong answer proposes how to win them over and admits what that costs, rather than listing every group's interests.

# SWOT builder. Checked against the Business management guide: SWOT analysis
# is a toolkit tool for SL and HL, suggested for units 1 to 5 (p. 14), taught
# at AO2 and AO4 (p. 13). The TOWS matrix is not in the guide: enrichment.
# The worked example is fictional, with simulated figures.
type: tool
kind: swot
slug: swot
title: SWOT builder
short: SWOT
order: 1
stage: diagnose
summary: List and weight the internal strengths and weaknesses and the external opportunities and threats behind a decision, then pair them into strategic options in a TOWS matrix.
purpose: To summarize the position a decision starts from, rank the factors that matter most, and turn the summary into options instead of leaving it as four lists.
howTo:
  - Name the organization and the decision. A SWOT without a decision has no way of judging what matters.
  - Add factors to each box. Strengths and weaknesses are internal, within the organization's control; opportunities and threats are external. The prompt under a factor asks a question when its words suggest the other side of that line.
  - Give each factor its evidence from the case and a weight from 1 (slight) to 5 (decisive) for this decision.
  - Read the ranked SWOT and the checks, which point out empty boxes, factors without evidence and heavy weaknesses or threats that nothing deals with.
  - Pair factors into options in the TOWS matrix, ticking the factors each option uses. Options are ranked by the weight of evidence behind them.
  - Export the analysis, or carry the leading options into the Ansoff planner and the option appraisal.
limitations:
  - A SWOT describes a position; it does not choose an option. The TOWS matrix generates options but cannot judge their cost, risk or feasibility.
  - Weights are judgements. Adding them up gives a prompt for discussion, not a measurement, and a box's total rises with the number of factors listed in it.
  - The same factor can be a strength and a weakness at once, such as a founder's close control, and the four boxes hide that.
  - The checks look for words such as market, government or our. They cannot read the case, so they will sometimes question a factor that is in the right box and miss one that is not.
  - It is a snapshot. The position changes, and the analysis has to change with it.

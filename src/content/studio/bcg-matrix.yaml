example:
  title: Northvale's five product lines
  situation: Northvale earned €38.0m last year from five product lines. The matrix asks which of them should fund the rest, which deserve investment and which should be questioned. Fictional business; every figure is simulated.
  data:
    business: Northvale Cycles
    currency: €
    unit: m
    growthLine: 5
    products:
      - { id: city, name: City and trekking bikes, share: 18, rival: 12, growth: -1, revenue: 15 }
      - { id: commuter, name: Commuter e-bikes, share: 6, rival: 18, growth: 12, revenue: 10.5 }
      - { id: cargo, name: Cargo e-bikes, share: 24, rival: 16, growth: 22, revenue: 6 }
      - { id: kids, name: Children's bikes, share: 5, rival: 20, growth: 2, revenue: 4 }
      - { id: road, name: Road bikes, share: 3, rival: 14, growth: 0, revenue: 2.5 }
inUse: The recommended use is to turn the picture into decisions about money. Say which products fund which, and what happens when the cash cow's market keeps shrinking. For Northvale, city bikes pay for the cargo bike's growth today, but at −1% a year that cash will not last, which is why the cargo bike, the star, sits at the centre of the strategy.

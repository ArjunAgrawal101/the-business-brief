# BCG portfolio matrix. Checked against the Business management guide: the
# Boston Consulting Group (BCG) matrix is a toolkit tool for SL and HL,
# suggested for units 3 and 4 (p. 14), taught at AO2 and AO4 (p. 13). The
# guide does not fix the axes; this tool uses relative market share. Market
# share and market growth are 4.1 (p. 31); the product portfolio is 4.5
# (p. 31). The worked example is fictional, with simulated figures that sum to
# the engagement's revenue of €38.0m.
type: tool
kind: bcg
slug: bcg-matrix
title: BCG portfolio matrix
short: BCG matrix
order: 5
stage: options
summary: Plot a product portfolio by relative market share and market growth, with each product's revenue as the size of its circle, and get guidance on the balance of the portfolio.
purpose: To see a business's products side by side by the strength of their market position and the growth of their markets, so that cash can be moved from the products that generate it to the products that need it, and weak products can be questioned.
howTo:
  - Add each product with its market share, the share of the largest rival in its market (the next largest, if the product leads), the growth of its market and its revenue.
  - Set the growth line, the market growth that counts as high. There is no fixed rule; one approach is to use the average growth of the markets the business is in.
  - Read the chart. Relative share above 1 means the product leads its market; the circles' areas show revenue.
  - "Read the portfolio guidance: what the cash cows can fund, which question marks to back, and which dogs to question."
  - "Use the result in the option appraisal: which products should the strategy invest in, hold or drop?"
limitations:
  - Market share and market growth are only two measures. Profit, cash flow and how products support each other are not on the chart.
  - The labels depend on where the lines are drawn and on how the market is defined. A product can look like a dog in a broad market and a star in a niche.
  - A dog is not always worth dropping. It may cover its costs, complete a range or keep a key customer.
  - It assumes high share brings low costs and high growth needs cash. That holds in many markets, but not in all.
  - It is a snapshot. Positions change as markets grow and mature.

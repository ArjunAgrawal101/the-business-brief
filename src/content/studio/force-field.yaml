# Force field builder. Checked against the Business management guide: force
# field analysis is an HL-only toolkit tool, suggested for units 2 and 5
# (p. 14), taught at AO2 and AO4 (p. 13). Totals and the effect of weakening a
# force come from src/lib/force-field.ts. The worked example is fictional.
type: tool
kind: force-field
slug: force-field
title: Force field builder
short: Force field
order: 9
stage: plan
summary: Set out the forces driving a change and the forces holding it back, score each with evidence and an action, and test what weakening a restraining force would do.
purpose: To judge whether a change is likely to succeed and to plan how to make it succeed, usually by finding the restraining forces that can be weakened.
howTo:
  - State the change in a sentence.
  - Add the driving forces and the restraining forces, each with its evidence.
  - Score each force from 1 (weak) to 5 (very strong). The tool totals each side and says which way the balance falls.
  - "For each force, write the action: how a driving force could be strengthened, or a restraining force weakened, and at what cost."
  - Choose a restraining force to test. The tool shows what weakening it would do to the balance.
  - Carry the actions into the implementation steps of the recommendation memo.
limitations:
  - The scores are judgements, not measurements. Adding them up gives a prompt for discussion, not a forecast.
  - Two forces with the same score may need very different effort and money to change.
  - Forces interact. Weakening one can strengthen another, as when a shift premium wins over staff but adds to the cash needed.
  - It shows the forces at one moment. The balance shifts as the change goes ahead.

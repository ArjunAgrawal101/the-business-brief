example:
  title: Can the fleet plan be made to work?
  situation: To serve delivery firms, Northvale must add a second assembly shift and a fleet sales team. Some forces push for the change; others hold it back. Fictional business; every figure is simulated.
  data:
    business: Northvale Cycles
    change: Add a second assembly shift and a fleet sales team for business cargo bikes
    forces:
      - { id: d1, side: driving, label: Fleet orders waiting from three delivery firms, strength: 4, evidence: 'Three firms have asked for quotes for fleets of 30 to 60 bikes.', action: 'Turn the strongest inquiry into a paid trial with a firm order.' }
      - { id: d2, side: driving, label: Fleet bikes earn a higher margin, evidence: 'A fleet bike with a service contract earns about €400 more contribution than a cargo bike sold through a dealer.', strength: 4, action: 'Show the margin in the board paper, net of the dealer commission.' }
      - { id: d3, side: driving, label: The owners want profit restored, strength: 3, evidence: 'The family board has asked for a plan to return to €3m of operating profit.', action: 'Agree review dates so the board sees progress.' }
      - { id: d4, side: driving, label: Van charges pushing firms towards bikes, strength: 4, evidence: 'Three nearby cities will charge vans to enter their low-emission zones from 2027.', action: 'Time the launch for the year before the charges start.' }
      - { id: r1, side: restraining, label: Dealers fear being bypassed, strength: 4, evidence: 'Dealers sell four in five Northvale bikes, and several have said they will stock rivals if sales go direct.', action: 'Pay dealers a commission on fleet sales in their area and use them for servicing.' }
      - { id: r2, side: restraining, label: Staff reluctant to work a late shift, strength: 3, evidence: 'In an informal poll, half the assembly staff said they would not work evenings.', action: 'Consult the staff council, ask for volunteers first and pay a shift premium.' }
      - { id: r3, side: restraining, label: Cash needed for tooling and stock, strength: 4, evidence: 'The plan needs €2m, and cash is tight after two years of falling profit.', action: 'Phase the investment behind the trial, and use the bank loan only once orders are firm.' }
      - { id: r4, side: restraining, label: Motor lead times of up to 20 weeks, strength: 3, evidence: 'Lead times for cargo-rated motors reached 20 weeks in 2024.', action: 'Qualify a second motor supplier before the second shift starts.' }
    test: r1
    by: 2
inUse: The recommended use is to plan, not to total. The driving forces lead by one point, 15 to 14, which says the change is possible, not that it will happen. Name the restraining force worth weakening first, here the dealers' fear, and say how and at what cost.

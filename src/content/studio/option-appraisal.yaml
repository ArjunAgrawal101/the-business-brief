# Option appraisal and recommendation memo. Weighted scoring is a general
# decision method, not one of the guide's toolkit tools; the memo's structure
# is the platform's own. Paper 3 (HL) asks for a recommended plan of action
# (guide, pp. 42 and 47 to 50; claims register: paper3-structure). The worked
# example is fictional and agrees with the other tools' examples: the decision
# tree's expected values, the BCG figures and the stakeholder map.
type: tool
kind: appraisal
slug: option-appraisal
title: Option appraisal and recommendation memo
short: Option appraisal
order: 10
stage: decide
summary: Score strategic options against weighted criteria, see how far the ranking depends on the weights, and write the recommendation as a structured memo to copy or print.
purpose: To compare options on everything that matters to the decision, not only the figures, to test whether the ranking survives a change of priorities, and to turn the analysis into a recommendation that the people who must act on it can follow.
howTo:
  - State the question, then list the criteria that matter and weight each from 0 to 5. Agree the weights before you look at the totals, and say what a score of 5 means, so that risk and cost are scored the right way round.
  - List two to five distinct options, and score each from 1 to 5 on every criterion.
  - Read the weighted ranking and the sensitivity test, which shows any weight at which a different option would lead, and who would lead if every criterion counted the same.
  - Write the memo. The options and the weighted evaluation are filled in for you; add the situation, the evidence from your other tools (the button gathers the headlines of the tools you have saved), the recommendation, the risks, the implementation steps and what would change your mind.
  - Copy the memo or print it. A recommendation that differs from the ranking is allowed, but the memo must say why.
limitations:
  - The scores and weights are judgements. A weighted total can make a judgement look more exact than it is.
  - Criteria can overlap and count the same thing twice, such as profit and return on investment.
  - A total can hide a fatal weakness. An option that scores 1 on legality or safety may need to be ruled out, whatever its total.
  - It compares the options listed, and cannot show a better one that nobody thought of.
status:
  kind: enrichment
  subtopics: []
  text: "Weighted option appraisal is not in the guide's toolkit. It is a general decision-making method, offered as enrichment, like the weighted scoring of locations on the Operations Floor, and the memo's six parts are the platform's own structure. Reaching a reasoned recommendation is central to the course: Paper 3 (HL) asks for a recommended plan of action (Business management guide, pp. 42 and 47 to 50)."

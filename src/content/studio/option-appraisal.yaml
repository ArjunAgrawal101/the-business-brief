example:
  title: The recommendation to the family board
  situation: Three options survive the analysis. The appraisal weighs them against what matters to Northvale and its owners, and the memo turns the result into a recommendation the board can act on. Fictional business; every figure is simulated.
  data:
    business: Northvale Cycles
    question: How should Northvale Cycles restore its profit over the next three years?
    criteria:
      - { id: profit, label: Expected profit over three years, weight: 5, high: 'Adds the most profit, on the decision tree and the forecasts' }
      - { id: fit, label: "Fit with Northvale's strengths", weight: 4, high: 'Builds on the cargo lead, the works and the dealers' }
      - { id: risk, label: Risk, weight: 3, high: 'The lowest risk' }
      - { id: cash, label: Cash needed, weight: 3, high: 'Needs the least cash' }
      - { id: people, label: Effect on staff and dealers, weight: 2, high: 'Welcomed by staff and dealers' }
    options:
      - id: fleet
        name: Fleet cargo bikes for delivery firms
        summary: A fleet version of the cargo bike with service contracts, sold direct to delivery firms in low-emission cities, with a second assembly shift.
        scores: { profit: 5, fit: 5, risk: 3, cash: 2, people: 2 }
      - id: online
        name: Relaunch commuter e-bikes online
        summary: A cheaper commuter e-bike sold online with home delivery, to win back share from the direct-online brands.
        scores: { profit: 3, fit: 2, risk: 3, cash: 3, people: 3 }
      - id: export
        name: City bikes for dealers abroad
        summary: Sell city bikes through twelve dealers in a neighbouring country, with a local distributor.
        scores: { profit: 2, fit: 3, risk: 4, cash: 4, people: 4 }
    memo:
      to: The family board
      from: Ingrid Marsh, managing director
      date: 3 November 2026
      situation: |
        Northvale's operating profit fell from €3.4m to €1.5m in two years. Direct-online brands undercut its commuter e-bikes, motor and battery prices rose 9%, and road and children's bikes lost €0.4m between them.
        Its cargo e-bikes lead a segment that grew 22% last year, and three delivery firms have asked about fleets.
      evidence: |
        SWOT: the heaviest factors are the lead in cargo bikes, costs above the online rivals, van restrictions in city centres and discounting by the online brands.
        STEEPLE: the low-emission zones restricting vans score 20 of 25, the factor to act on first.
        Five Forces (enrichment): the market for business cargo bikes is moderately attractive; buyer and supplier power are the strongest forces.
        BCG matrix: city bikes are a cash cow in a shrinking market, and the cargo bike is the star that must replace them.
        Decision tree: the fleet cargo bike has the highest expected value, €2.28m net of its cost, with a 0.2 chance of a loss.
      recommend: fleet
      why: |
        It has the highest weighted score and the highest expected value, and it builds on what Northvale does best: its lead in cargo bikes, its own works and its dealers' servicing.
        The ranking holds unless expected profit is given almost no weight. City bikes abroad is safer and cheaper, and is worth keeping as a second step once the fleet business is running.
      risks: |
        Weak fleet demand, a 0.4 chance in the decision tree: start with a paid trial, and cut the fleet price if orders lag.
        Dealers opposing direct sales: pay them a commission on fleet sales in their area and use them for servicing.
        Motor supply: qualify a second supplier before the second shift starts, as a contingency plan.
        Staff resistance to a late shift: consult the staff council, ask for volunteers first and pay a shift premium.
      steps:
        - { id: s1, action: 'Agree the plan, the budget and the review dates with the board', owner: Ingrid Marsh, when: December }
        - { id: s2, action: Run a paid three-month trial with one delivery firm, owner: Head of sales, when: January to March }
        - { id: s3, action: Agree a dealer commission on fleet sales, owner: Head of sales, when: February }
        - { id: s4, action: Qualify a second motor supplier, owner: Operations manager, when: By April }
        - { id: s5, action: 'Consult the staff council on a second shift, and recruit volunteers', owner: Works manager, when: March to May }
        - { id: s6, action: Launch to fleets in the three low-emission cities, owner: Ingrid Marsh, when: June }
      review: Think again if the trial wins fewer than 40 fleet orders, if the van charges are delayed beyond 2027, or if no second motor supplier can be found by April.
inUse: The recommended use is to recommend, not to report the totals. Say which option, why, on what conditions, and what would change your mind, and let the sensitivity test tell you how hard to argue for the weights. Paper 3 (HL) ends with exactly this task, a recommended plan of action supported by the resource materials and by business management tools and theories (Business management guide, pp. 42 and 47 to 50).

  kind: enrichment
  subtopics: []
  text: Porter's five forces are not in the guide. Neither the toolkit (Business management guide, pp. 13 to 15) nor the syllabus (pp. 21 to 36) names them, so this tool is enrichment, offered for readers beyond the IB course and as a way of organizing evidence about a market. The guide's tool from Porter is his generic strategies, an HL-only toolkit tool (p. 14).

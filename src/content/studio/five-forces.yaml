example:
  title: Is the market for business cargo bikes worth entering?
  situation: Northvale's strongest option is to sell a fleet version of its cargo bike to delivery firms. Before it commits, it asks how much profit that market is likely to leave once suppliers, buyers, rivals, newcomers and substitutes have taken their share. Fictional business; every figure is simulated.
  data:
    business: Northvale Cycles
    market: Cargo e-bikes sold to businesses, mainly delivery firms, in Northvale's home market
    forces:
      rivalry:
        rating: 3
        evidence: 'Four brands sell cargo bikes to businesses and none has more than a third of sales. Fleets buy on reliability and service, so price wars are rare.'
        change: 'A large rival cutting its fleet prices to win the first contracts in the low-emission cities.'
      entry:
        rating: 3
        evidence: 'Online brands and van makers could enter, but fleet buyers want proven reliability and a servicing network, which take years to build.'
        change: 'A van maker launching its own cargo bike and servicing it through its existing dealers.'
      suppliers:
        rating: 4
        evidence: 'Two firms make most cargo-rated motors and batteries, and lead times reached 20 weeks in 2024.'
        change: 'Qualifying a second motor supplier, or a new motor maker entering the market.'
      buyers:
        rating: 4
        evidence: 'A few large delivery firms buy fleets of 50 or more and negotiate hard on price and service terms.'
        change: 'Selling to many smaller firms and councils, and tying fleets in with service contracts lasting several years.'
      substitutes:
        rating: 3
        evidence: 'Small electric vans and walking couriers can do the same work; the van charges from 2027 make vans dearer.'
        change: 'A delay to the van charges would strengthen this force; stricter limits on vans would weaken it.'
inUse: The recommended use is to name the one or two forces that decide the answer and say what the business would do about them. For Northvale, buyer and supplier power matter most; a second motor supplier and service contracts with fleets are the responses. Rating all five forces at equal length is description; using the strongest to shape the option is analysis.

# Five Forces assessor. Porter's five forces do not appear in the Business
# management guide: not in the toolkit (pp. 13 to 15) and not in the syllabus
# (pp. 21 to 36). The tool is labelled enrichment throughout. The rating scale
# and attractiveness bands are the platform's teaching convention. The worked
# example is fictional, with simulated figures.
type: tool
kind: five-forces
slug: five-forces
title: Five Forces assessor
short: Five Forces
order: 3
stage: diagnose
summary: Rate the five competitive forces on a market with evidence, see how attractive the market is overall, and find what would change it.
purpose: To judge how much profit a market is likely to leave for the businesses in it, by weighing the forces that push profit down, and to find which of those forces a strategy could act on.
howTo:
  - Define the market narrowly, by who buys what, where. The forces on bicycles in general and on cargo bikes sold to delivery firms are different.
  - For each force, read the prompt questions, then rate the force from 1 (very weak) to 5 (very strong) and write the evidence for the rating. A strong force takes profit away.
  - Say what would change each force, for better or worse. These notes are where strategy can act.
  - Read the overall attractiveness and the strongest forces. The tool shows what a one-point change in each force would do to the average.
  - Use the result to judge whether the market is worth entering or growing in, and which forces an option must deal with.
limitations:
  - It is not part of the IB course. Use it, if at all, to organize evidence about a market that a question asks about, and name the course's own tools where they fit.
  - It describes an industry, not a business. Two businesses in the same market can face it very differently, depending on their strengths.
  - Averaging the five ratings treats every force as equally important, which is rarely true; one overwhelming force can matter more than the rest together.
  - It is a snapshot. Technology, regulation and new entrants can change the forces quickly.
  - It leaves out forces some writers add, such as governments or businesses that sell complementary products.

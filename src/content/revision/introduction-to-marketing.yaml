# Quick revision for 4.1 Introduction to marketing (statements at AO2 and AO4;
# the importance of market share and leadership is HL, at AO3). Written for the
# platform; every business named is fictional.
code: '4.1'
exercises:
  - id: millhaven-share-growth
    business: Millhaven Oat
    stem: "Last year the market for oat drinks was worth $250m and Millhaven Oat sold $40m. This year the market is worth $300m and Millhaven Oat sold $45m."
    command: calculate
    question: "**Calculate** Millhaven Oat's market share in each year, and the growth of the market."
    outline:
      - "Market share last year = ($40m ÷ $250m) × 100 = **16%**; this year = ($45m ÷ $300m) × 100 = **15%**."
      - "Market growth = ($300m − $250m) ÷ $250m × 100 = **20%**."
      - "Notes that Millhaven Oat's own sales grew by 12.5%, yet its share fell by one percentage point, because the market grew faster than it did."
  - id: millhaven-orientation
    business: Millhaven Oat
    stem: "Millhaven Oat's founders insist on the plain recipe they believe tastes best, but customer research shows growing demand for flavoured, sugar-free oat drinks."
    command: distinguish
    question: "**Distinguish** between product orientation and market orientation, using Millhaven Oat."
    outline:
      - "**Product orientation** starts from what the business makes best and then looks for buyers: the founders' plain recipe."
      - "**Market orientation** starts from what customers want, found through research: flavoured, sugar-free drinks."
      - "Shows what is at stake: a product-oriented Millhaven may keep a loyal niche but lose share as tastes move."
  - id: millhaven-leadership
    business: Millhaven Oat
    stem: "Millhaven Oat is the third-largest brand in its market. Its new chief executive wants it to become the market leader within four years."
    command: discuss
    question: "**Discuss** the importance to Millhaven Oat of becoming the market leader."
    level: HL
    outline:
      - "Benefits of leadership: economies of scale, bargaining power with supermarkets, brand recognition, and some influence over prices."
      - "Costs of chasing it: price cuts and heavy promotion that reduce profit, and the risk of a price war with the larger brands."
      - "Considers whether a profitable niche, such as premium or organic drinks, would serve Millhaven Oat better than leadership."
      - "Reaches a judgement that depends on Millhaven Oat's objectives and costs, and on how its rivals would respond."
formulas:
  market-share:
    situation: "A brand sold $6m of a product in a market worth $40m, and wants to know what part of the market it holds."
  market-growth:
    situation: "A business wants to know how much bigger its whole market was this year than last, in percentage terms."
mistakes:
  - mistake: "Dividing by this year's figure when working out market growth."
    fix: "Divide the change by the earlier period's sales: (this period − last period) ÷ last period × 100."
  - mistake: "Calling a fall in market share from 25% to 20% a fall of 5%."
    fix: "It is a fall of 5 percentage points, which is a 20% fall in the share itself (5 ÷ 25 × 100)."
distinctions:
  - id: market-vs-product-orientation
    pair: [Market orientation, Product orientation]
    difference: "A product-oriented business starts from the product it makes best and then looks for customers. A market-oriented business starts from what customers want, found through research, and develops products to meet it."
  - id: percentage-points-vs-percent
    pair: [A change in percentage points, A percentage change]
    difference: "A change in percentage points is the simple difference between two percentages, such as a share moving from 25% to 20%: 5 points. A percentage change compares the change with the starting value: 5 ÷ 25 × 100 = a 20% fall in the share."
scenarios:
  - id: pipwell-share
    business: Pipwell Juice
    stem: "Pipwell Juice's sales rose by 10% this year, and its managers were pleased until they learned that the juice market as a whole grew by 25%."
    answer: "Market share and market growth"
    why: "Pipwell Juice's market share has fallen, because its sales grew more slowly than the market. Measuring share alongside sales shows how it is doing against its rivals, not only against its own past."
evaluations:
  - id: rising-sales-winning
    claim: "Rising sales show that a business is winning in its market."
    counter: "If the market grows faster, its share is falling and rivals are winning more. Sales may also have been bought with price cuts or heavy promotion that reduce profit, so share, margins and profit need checking too."

# Quick revision for 4.2 Marketing planning (statements at AO2, AO4 and AO3).
# Written for the platform; every business named is fictional.
code: '4.2'
exercises:
  - id: saltwick-segmentation
    business: Saltwick Swimwear
    stem: "Saltwick Swimwear sells one range to everyone who swims. Its sales have stalled, while specialist rivals win over open-water swimmers and older swimmers who want more coverage."
    command: explain
    question: "**Explain** how market segmentation could help Saltwick Swimwear."
    outline:
      - "Segmentation divides the market into groups with similar needs: by age (demographic), by how people swim (behavioural), or by lifestyle (psychographic)."
      - "Saltwick Swimwear could then target chosen segments, such as open-water swimmers, with products, prices and promotion that fit them."
      - "It could position each range against the specialists rather than competing with everyone at once."
      - "Notes the cost: more ranges, smaller production runs and more marketing."
  - id: saltwick-usp
    business: Saltwick Swimwear
    stem: "Saltwick Swimwear is considering a line made from recycled fishing nets, which no rival offers."
    command: explain
    question: "**Explain** the importance of a unique selling point for Saltwick Swimwear."
    outline:
      - "A **USP** gives customers a clear reason to choose Saltwick Swimwear rather than a rival."
      - "It can support a higher price and gives promotion a single message."
      - "Explains that it counts only if customers value it, here environmentally minded swimmers, and that it lasts only while rivals cannot copy it."
  - id: saltwick-differentiation
    business: Saltwick Swimwear
    stem: "Several larger brands sell swimwear at prices Saltwick Swimwear cannot match."
    command: evaluate
    question: "**Evaluate** two ways Saltwick Swimwear could differentiate itself from its competitors."
    outline:
      - "Product features, such as suits for cold open water or fabric from recycled nets: valued by chosen segments, but costly to develop and possible to copy."
      - "Service, such as made-to-measure fitting or repairs: harder for large rivals to copy, but expensive to run."
      - "Others: brand image, or a clear ethical position."
      - "Judges which is hardest to copy and most valued by Saltwick Swimwear's target customers."
distinctions:
  - id: niche-vs-mass-market
    pair: [Niche market, Mass market]
    difference: "A niche market is a small, clearly defined segment with particular needs, often served at higher prices by specialists. A mass market is large and broad, served with standardized products in high volumes at lower margins."
  - id: segmentation-vs-targeting
    pair: [Segmentation, Targeting]
    difference: "Segmentation divides a market into groups of customers with similar needs or characteristics. Targeting is choosing which of those segments to serve and focusing the marketing mix on them. Positioning then decides how the product should be seen by the target segments, compared with rivals."
scenarios:
  - id: ollerton-position-map
    business: Ollerton Chocolate
    stem: "Ollerton Chocolate wants to see where its brand sits against its rivals on price and on how ethical shoppers believe each brand is, and to spot a position no rival holds."
    answer: "A position map"
    why: "A position map plots each brand on two attributes customers care about, here price and ethical image, so gaps and crowded areas show at a glance. A gap is an opportunity only if research shows customers want that combination."
evaluations:
  - id: niche-less-risky
    claim: "Targeting a niche market is always less risky than targeting a mass market."
    counter: "A niche brings fewer large rivals, loyal customers and higher prices, but depends on one small segment, so a change in its tastes or a large rival moving in can hit hard. A mass market spreads demand across many customers, at lower margins."

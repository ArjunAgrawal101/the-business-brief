# Quick revision for 5.7 Crisis management and contingency planning, an HL
# subtopic (statements at AO2 and AO3). Written for the platform; every
# business named is fictional.
code: '5.7'
exercises:
  - id: pikeford-four-factors
    business: Pikeford Foods
    stem: "Pikeford Foods discovers that a batch of its baby food may contain fragments of glass. The batch is already on sale in 400 shops."
    command: explain
    question: "**Explain** how transparency, communication, speed and control should shape Pikeford Foods' response."
    level: HL
    outline:
      - "**Transparency**: say openly what has happened and what is not yet known, rather than waiting for certainty."
      - "**Communication**: clear, consistent messages to parents, shops, regulators, staff and the media, through several channels, from one spokesperson."
      - "**Speed**: recall the batch at once, before any child is harmed, while checking facts as the recall proceeds."
      - "**Control**: a crisis team with clear roles, resources and records of every pot recovered; notes that the factors must be balanced, with safety first."
  - id: pikeford-distinguish
    business: Pikeford Foods
    stem: "Pikeford Foods had a written recall procedure, rehearsed twice a year, before the glass was found."
    command: distinguish
    question: "**Distinguish** between contingency planning and crisis management, using Pikeford Foods."
    level: HL
    outline:
      - "**Contingency planning** happens before an event: identifying risks such as contamination, planning the recall and rehearsing it."
      - "**Crisis management** happens during and after the event: running the recall, communicating and restoring normal production."
      - "Shows how they connect: the rehearsed plan let Pikeford Foods act within hours, and the review afterwards will improve the plan."
  - id: pikeford-impact
    business: Pikeford Foods
    stem: "Pikeford Foods is deciding how much to spend on contingency planning next year."
    command: evaluate
    question: "**Evaluate** the impact of contingency planning on cost, time, risks and safety for Pikeford Foods."
    level: HL
    outline:
      - "Cost: a certain cost now, for planning, training and rehearsals, against smaller losses and fines if a crisis comes."
      - "Time: time taken from other work to prepare, against a much faster response when it is needed."
      - "Risks are reduced but never removed, and a plan that is not updated loses its value."
      - "Safety: for a maker of baby food the case for planning is strongest, so the judgement favours thorough planning."
formulas:
  risk-score:
    situation: "A business wants to rank the risks it faces, scoring each from 1 to 5 for how likely it is and how much harm it would do."
    measures: "A rough ranking of a risk, combining how likely it is with how much harm it would do. It ranks risks rather than measuring them, and the guide does not require it."
mistakes:
  - mistake: "Confusing contingency planning with crisis management."
    fix: "Contingency planning happens before an event and is proactive; crisis management happens during and after it and is reactive. Each needs the other."
    level: HL
  - mistake: "Treating speed as the only factor in a crisis response."
    fix: "Balance speed with transparency, communication and control: a fast statement that proves wrong can do more harm than a careful one."
    level: HL
  - mistake: "Assuming a contingency plan removes the risk."
    fix: "It reduces the cost and time of the response; it cannot remove the risk, and a plan that is never rehearsed or updated loses its value."
    level: HL
distinctions:
  - id: crisis-management-vs-contingency-planning
    pair: [Crisis management, Contingency planning]
    level: HL
    difference: "Contingency planning happens before an event: identifying what could go wrong, judging likelihood and impact, and planning and rehearsing the response. Crisis management happens during and after an event: protecting people, containing the damage, informing stakeholders and restoring normal operations."
scenarios:
  - id: merrowsound-contingency
    business: Merrowsound Ferries
    stem: "Merrowsound Ferries lists the events that could stop its sailings, scores each for likelihood and impact, and writes and rehearses a response to the highest-scoring ones."
    answer: "Contingency planning"
    level: HL
    why: "Planning before an event, ranking risks and preparing responses, roles and resources, is contingency planning. It costs time and money now, but shortens the response when a crisis comes."
evaluations:
  - id: plan-handles-any-crisis
    claim: "A business with a contingency plan will handle any crisis well."
    counter: "No plan foresees every event, and a plan that has not been rehearsed or updated may fail when it is needed. Leaders still have to judge and adapt on the day; the plan only gives them a faster, better-prepared start."
    level: HL

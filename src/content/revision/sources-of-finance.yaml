# Quick revision for 3.2 Sources of finance (statements at AO2 and AO3).
# Written for the platform; every business named is fictional.
code: '3.2'
exercises:
  - id: glenmara-short-long
    business: Glenmara Outdoors
    stem: "Glenmara Outdoors, a sole trader selling camping gear, needs $8,000 for six weeks to buy stock before the summer, and $120,000 to buy the warehouse it now rents."
    command: explain
    question: "**Explain** a suitable source of finance for each of Glenmara Outdoors' needs."
    outline:
      - "For the stock: short-term finance such as an **overdraft** or **trade credit**, which can be used for a few weeks and repaid as the summer stock sells."
      - "For the warehouse: long-term finance such as a **loan** secured on the building, repaid over many years, or the owner's personal funds."
      - "Explains why the match matters: using an overdraft for a building would be costly and risky, because it can be withdrawn at short notice."
      - "Notes that a sole trader cannot issue shares."
  - id: glenmara-warehouse
    business: Glenmara Outdoors
    stem: "Glenmara Outdoors' owner has $30,000 of savings. A bank will lend up to $100,000 over 15 years, secured on the warehouse, and a business angel has offered $120,000 for a 30% share of the business once it becomes a company."
    command: recommend
    question: "**Recommend** how Glenmara Outdoors should finance the $120,000 warehouse."
    outline:
      - "Compares the options: savings (no interest, but the owner's own money at risk), a loan (interest and repayments, with the building as collateral), a business angel (no repayments, but a share of ownership, profit and control)."
      - "Considers a mix, such as $30,000 of savings and a $90,000 loan."
      - "Weighs cost, risk and control against the business's cash flow and the owner's objectives."
      - "Gives a justified recommendation and what it depends on, such as stable cash flow to meet the repayments."
  - id: pellmont-crowdfunding
    business: Pellmont Games
    stem: "Pellmont Games, a two-person start-up with no trading record, needs $40,000 to make its first board game. It has a large online following."
    command: discuss
    question: "**Discuss** whether crowdfunding is a suitable source of finance for Pellmont Games."
    outline:
      - "For: no trading record or collateral is needed, the campaign tests demand before production, and backers become the first customers."
      - "Against: the target may not be reached, platforms charge fees, the idea is public and may be copied, and promised rewards must be delivered."
      - "Compares alternatives such as a business angel or a microfinance provider."
      - "Judges suitability, for example that crowdfunding fits because the following already exists and the game can be pre-sold."
formulas:
  interest-for-a-year-on-a-loan:
    situation: "A business owes $50,000 on a loan at 6% a year and wants to know what the loan will cost it in interest this year."
  overdraft-interest-for-a-number-of-days:
    situation: "A shop was overdrawn by $4,000 for 20 days at an annual rate of 12%, and wants a quick estimate of the interest it will pay."
    measures: "An estimate of the interest on an overdraft used for part of a year: the annual rate applied to the amount overdrawn, for the share of the year it was used."
  retained-profit:
    situation: "A company has its profit for the year and has paid dividends to its shareholders. It wants to know how much it is keeping to reinvest."
mistakes:
  - mistake: "Using short-term finance, such as an overdraft, for a long-term investment."
    fix: "Match the source to the need: overdrafts and trade credit for short gaps in cash; loans, share capital or leasing for non-current assets."
  - mistake: "Recommending share capital for a sole trader or partnership."
    fix: "Only companies can issue shares. A sole trader would first have to form a company or take on a partner."
  - mistake: "Calling retained profit free finance."
    fix: "It has an opportunity cost: the dividends shareholders give up, or the return the money could earn elsewhere."
distinctions:
  - id: internal-vs-external-finance
    pair: [Internal sources of finance, External sources of finance]
    difference: "Internal sources come from within the business or its owner: personal funds for a sole trader, retained profit and the sale of assets. External sources come from outside it: share capital, loans, overdrafts, trade credit, crowdfunding, leasing, microfinance and business angels."
  - id: share-capital-vs-loan-capital
    pair: [Share capital, Loan capital]
    difference: "Share capital is raised by selling part-ownership of a company: it need not be repaid, but shareholders expect dividends and gain votes. Loan capital is borrowed: it must be repaid with interest whatever the profit, but the lender gains no ownership."
  - id: overdraft-vs-loan
    pair: [Overdraft, Bank loan]
    difference: "An overdraft lets a business spend more than is in its account, up to a limit, paying interest only on what it uses; it is flexible short-term finance the bank can withdraw. A loan is a fixed sum repaid in instalments over an agreed period, suited to buying non-current assets."
scenarios:
  - id: nkiru-microfinance
    business: Nkiru Tailoring
    stem: "Nkiru runs Nkiru Tailoring on her own in a rural town and needs $600 for an electric sewing machine. Banks have turned her down because she has no collateral and no credit history."
    answer: "A microfinance provider"
    why: "Microfinance providers lend small sums to people and businesses that banks will not serve, often without collateral, sometimes relying on group guarantees. Interest rates can be high, but the loan lets the business grow."
evaluations:
  - id: retained-profit-best
    claim: "Retained profit is always the best source of finance, because it costs nothing."
    counter: "It has an opportunity cost, the dividends shareholders give up, and there may not be enough of it, especially for a new or loss-making business. When an investment is large or urgent, a loan or share capital may be the better choice."

# Quick revision for 4.5 The seven Ps of the marketing mix (statements at AO2
# and AO3; dynamic, competitive and contribution pricing and price elasticity
# of demand are HL). The guide sets no AO4 here, so there is no calculate
# question. Written for the platform; every business named is fictional.
code: '4.5'
exercises:
  - id: thistledown-extension
    business: Thistledown Crisps
    stem: "Thistledown Crisps' best-selling flavour has been on sale for twelve years. Its sales have stopped growing, and rival brands are cutting prices."
    command: evaluate
    question: "**Evaluate** two extension strategies Thistledown Crisps could use for its best-selling flavour."
    outline:
      - "New packaging or pack sizes: cheap and quick, but it may not change demand much."
      - "New markets, such as exports or vending machines: new customers for the same product, at the cost of new distribution."
      - "A new recipe, such as less salt: may revive interest, but costs money and could upset loyal buyers."
      - "Considers letting the flavour decline and putting the money into new products, and judges which strategy suits."
  - id: thistledown-pricing
    business: Thistledown Crisps
    stem: "Thistledown Crisps plans to launch a range of premium hand-cooked crisps into a market where several established brands already compete."
    command: discuss
    question: "**Discuss** whether Thistledown Crisps should use penetration pricing or premium pricing for the new range."
    outline:
      - "**Penetration pricing**: a low price to win share quickly, then raise it; risks a price war, a cheap image and resistance when prices rise."
      - "**Premium pricing**: a high price that signals quality and earns a higher margin, but it needs genuine quality and brand support, and reaches fewer buyers."
      - "Links the choice to the range's positioning as premium and hand-cooked."
      - "Reaches a judgement, for example that premium pricing fits the positioning better."
  - id: thistledown-promotion
    business: Thistledown Crisps
    stem: "Thistledown Crisps has a small promotion budget for the launch of its new range."
    command: explain
    question: "**Explain** the difference between above the line and below the line promotion, with an example of each Thistledown Crisps could use."
    outline:
      - "**Above the line**: paid advertising in mass media to reach a broad audience, such as television, radio or posters."
      - "**Below the line**: promotion aimed at chosen customers, such as in-store tastings, sales promotions, sponsorship of local events or direct marketing."
      - "Applies each to the launch, and notes that a small budget may favour targeted below the line activity."
  - id: thistledown-ped
    business: Thistledown Crisps
    stem: "When Thistledown Crisps raised the price of its family packs by 10%, the quantity sold fell by 5%."
    command: explain
    question: "**Explain**, using price elasticity of demand, what the price rise did to Thistledown Crisps' revenue from family packs."
    level: HL
    outline:
      - "PED = −5% ÷ 10% = −0.5: ignoring the sign, less than 1, so demand is **price inelastic**."
      - "With inelastic demand a price rise increases total revenue: revenue becomes 1.10 × 0.95 = 1.045 times as much, a rise of about 4.5%."
      - "Suggests why demand is inelastic, such as brand loyalty, and notes that a further rise may meet more resistance."
formulas:
  contribution-per-unit:
    situation: "A business wants to know how much each unit it sells adds towards its fixed costs, given its selling price and the materials and labour each unit uses."
  cost-plus-price:
    situation: "A bakery knows what each cake costs it to make and wants to set its price by adding a 40% mark-up."
  price-elasticity-of-demand-ped:
    situation: "After a 10% price rise a firm's sales fell by 15%, and it wants to measure how responsive demand was to the price."
  contribution-pricing:
    situation: "A firm with spare capacity is pricing an order. It wants a price that covers the variable cost of each unit and adds a chosen amount towards its fixed costs."
distinctions:
  - id: penetration-vs-predatory-pricing
    pair: [Penetration pricing, Predatory pricing]
    difference: "Both use low prices. Penetration pricing sets a low price to win customers and market share for a new product, and the price usually rises later. Predatory pricing sets prices low, even below cost, to drive rivals out of the market, and can be illegal."
  - id: above-vs-below-the-line
    pair: [Above the line promotion, Below the line promotion]
    difference: "Above the line promotion is paid advertising in mass media, such as television, radio and posters, reaching a broad audience. Below the line promotion is aimed directly at chosen customers, through sales promotions, direct marketing, sponsorship and personal selling. Through the line combines the two."
  - id: skimming-vs-premium-pricing
    pair: [Price skimming, Premium pricing]
    difference: "Price skimming sets a high price when a new product is launched, to earn high margins from eager early buyers, and lowers it over time. Premium pricing keeps the price high throughout, because it signals quality and exclusivity."
  - id: elastic-vs-inelastic-demand
    pair: [Price elastic demand, Price inelastic demand]
    level: HL
    difference: "Demand is price elastic when the quantity demanded changes by a larger percentage than the price (PED greater than 1, ignoring the sign), so a price rise lowers revenue. It is price inelastic when the quantity changes by a smaller percentage (PED less than 1), so a price rise raises revenue."
scenarios:
  - id: wildcroft-dynamic
    business: Wildcroft Park
    stem: "Wildcroft Park, a theme park, changes its ticket prices every day: more at weekends and in school holidays, less on quiet weekdays, adjusting as bookings come in."
    answer: "Dynamic pricing"
    level: HL
    why: "Dynamic pricing changes prices with demand, often using data in real time, to fill quiet days and earn more on busy ones. Customers may see it as unfair if prices jump without warning."
  - id: brookvale-loss-leader
    business: Brookvale Supermarkets
    stem: "Brookvale Supermarkets sells milk below what it costs, and places it at the back of each store."
    answer: "Loss leader pricing"
    why: "A loss leader is sold at a loss to bring shoppers into the store, where they buy other, more profitable goods on the way. It works only if the extra purchases outweigh the loss on the milk."
evaluations:
  - id: social-media-cheaper-better
    claim: "Social media marketing is always cheaper and more effective than traditional advertising."
    counter: "It can be cheap per contact, precisely targeted and two-way, but it needs constant fresh content, can backfire in public, and its reach depends on platforms' algorithms. Some target markets are better reached by other media."
  - id: withdraw-declining-products
    claim: "A product in decline should always be withdrawn."
    counter: "A declining product may still make a positive contribution at little cost, keep loyal customers or support sales of other products, and an extension strategy may revive it. Withdraw it when its contribution is negative or its resources would earn more elsewhere."

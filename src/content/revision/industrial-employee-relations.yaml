# Quick revision for 2.7 Industrial/employee relations, an HL subtopic
# (statements at AO2 and AO3). Written for the platform; every business named
# is fictional.
code: '2.7'
exercises:
  - id: saltmarsh-action
    business: Saltmarsh Port
    stem: "Dockworkers at Saltmarsh Port, most of them union members, have rejected a 2% pay offer while prices are rising by 6% a year. Their union is considering industrial action."
    command: discuss
    question: "**Discuss** whether the union should choose a work-to-rule rather than strike action."
    level: HL
    outline:
      - "A **work-to-rule** slows the port while members keep their pay, carries less risk to jobs and may keep public sympathy, but puts less pressure on the employer."
      - "**Strike action** puts the most pressure on the port, but members lose pay, the employer may respond with a lockout or threats of redundancy, and shipping lines may move to other ports."
      - "Weighs the union's bargaining power: the dockworkers' skills, the port's need to keep ships moving, and public opinion."
      - "Reaches a judgement, for example to start with a work-to-rule and keep a strike in reserve."
  - id: saltmarsh-third-party
    business: Saltmarsh Port
    stem: "After four weeks of action, Saltmarsh Port's managers and the union agree to bring in an independent third party."
    command: distinguish
    question: "**Distinguish** between conciliation and arbitration as ways to end the dispute at Saltmarsh Port."
    level: HL
    outline:
      - "**Conciliation**: an independent person helps both sides talk and reach their own agreement; nothing is imposed."
      - "**Arbitration**: an independent person hears both sides and decides, usually bindingly; pendulum arbitration chooses one side's final offer in full."
      - "Shows which suits when: conciliation while the sides can still agree, arbitration when they need a decision made for them."
  - id: saltmarsh-employer-response
    business: Saltmarsh Port
    stem: "Saltmarsh Port's managers must respond to the union's work-to-rule, which has cut the number of ships handled by a third."
    command: explain
    question: "**Explain** two approaches the port's managers could take in response to the industrial action."
    level: HL
    outline:
      - "**Collective bargaining**: return to negotiations with an improved offer, perhaps linking pay to productivity."
      - "Pressure such as **threats of redundancies**, **changes of contract** or a **lockout**."
      - "Explains the likely effect of each, including the risk that pressure hardens the dispute and damages relations for years."
mistakes:
  - mistake: "Confusing conciliation with arbitration."
    fix: "A conciliator helps the two sides reach their own agreement; an arbitrator decides for them, usually bindingly."
    level: HL
  - mistake: "Assuming the side with the fairer case will win the dispute."
    fix: "Outcomes depend on bargaining power: how long each side can afford the conflict, how scarce the skills are, demand for the product, and public and political support."
    level: HL
  - mistake: "Recommending industrial action without weighing its cost to the employees themselves."
    fix: "Set lost pay, the risk to jobs and the effect on future relations against the pressure the action puts on the employer."
    level: HL
distinctions:
  - id: conciliation-vs-arbitration
    pair: [Conciliation, Arbitration]
    level: HL
    difference: "In conciliation an independent third party helps the two sides find their own agreement. In arbitration an independent third party hears both sides and decides the outcome, usually bindingly."
  - id: work-to-rule-vs-strike
    pair: [Work-to-rule, Strike action]
    level: HL
    difference: "In a work-to-rule employees do exactly what their contract and the rules require and no more, which slows work while they keep being paid. In strike action they stop work altogether, which puts more pressure on the employer but costs them their pay."
  - id: no-strike-vs-single-union
    pair: [No-strike agreement, Single-union agreement]
    level: HL
    difference: "A no-strike agreement is a union's promise not to strike, usually in return for benefits and for disputes going to arbitration. A single-union agreement is an employer's agreement to recognize and negotiate with only one union. They often go together, but they are different agreements."
scenarios:
  - id: brenwick-no-strike
    business: Brenwick Components
    stem: "Brenwick Components agrees with the one union it recognizes that staff will not strike. In return, disputes go to an independent arbitrator and pay rises at least match inflation."
    answer: "A no-strike agreement, within a single-union agreement"
    level: HL
    why: "The union gives up the right to strike in exchange for guaranteed pay rises and arbitration, and the employer gains a single partner and freedom from disruption. It works while both trust the arbitration and keep their promises."
evaluations:
  - id: strike-always-wins
    claim: "A strike always wins workers a better deal."
    counter: "A strike works when workers have bargaining power: scarce skills, strong demand and public support. Without it, strikes cost wages, may bring lockouts, redundancies or relocation, and can damage relations for years. A settlement through bargaining or arbitration is sometimes worth more."
    level: HL

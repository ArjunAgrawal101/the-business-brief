# Quick revision for 3.1 Introduction to finance. The guide sets its one
# statement at AO2, so the exercises use command terms up to explain. Written
# for the platform; every business named is fictional.
code: '3.1'
exercises:
  - id: quarrendon-capital-revenue
    business: Quarrendon Dental
    stem: "This year Quarrendon Dental bought a new X-ray machine for $38,000 and built an extension with two treatment rooms. It also paid the monthly rent on its premises, its staff salaries and the cost of dental materials."
    command: distinguish
    question: "**Distinguish** between capital expenditure and revenue expenditure, using Quarrendon Dental's spending."
    outline:
      - "**Capital expenditure** buys non-current assets used for more than a year: the X-ray machine and the extension."
      - "**Revenue expenditure** pays for the day-to-day running of the business, used up within the year: rent, salaries and materials."
      - "Shows why the difference matters: capital spending is recorded as an asset, while revenue spending is a cost of the year that reduces its profit."
  - id: quarrendon-finance-role
    business: Quarrendon Dental
    stem: "Quarrendon Dental's owners want to open a second practice within three years."
    command: explain
    question: "**Explain** two roles the finance function would play in Quarrendon Dental's plan."
    outline:
      - "Raising funds that suit the purpose, such as a loan for the new premises and equipment."
      - "Planning and control through budgets and cash flow forecasts, so the practice can afford the move and its running costs."
      - "Appraising the investment: whether the second practice will earn enough to justify its cost."
      - "Applies each role to the plan rather than describing the finance function in general."
  - id: quarrendon-repair-replace
    business: Quarrendon Dental
    stem: "Quarrendon Dental's oldest dental chair breaks down often. Repairs cost about $2,500 a year. A new chair would cost $14,000 and should last ten years."
    command: explain
    question: "**Explain** how the choice between repairing and replacing the chair affects Quarrendon's capital and revenue expenditure."
    outline:
      - "Repairing is **revenue expenditure**: about $2,500 a year, a cost that reduces each year's profit in full."
      - "Replacing is **capital expenditure**: $14,000 now, recorded as an asset rather than as a cost of one year."
      - "Notes the cash effect: replacing needs $14,000 at once, which may need finance."
      - "Adds what the figures leave out, such as cancelled appointments when the old chair breaks down."
formulas:
  whole-life-cost:
    situation: "A dental practice is choosing between two X-ray units with different prices, running costs and lives, and wants to compare what each will really cost over the years it is used."
    measures: "The full cost of owning an asset over its life: what it costs to buy and install, plus what it costs to run in each year of use, less what it can be sold for at the end. A standard technique, not one the guide names."
distinctions:
  - id: capital-vs-revenue-expenditure
    pair: [Capital expenditure, Revenue expenditure]
    difference: "Capital expenditure is spending on non-current assets that the business will use for more than a year, such as buildings, machines and vehicles. Revenue expenditure is spending on the day-to-day running of the business, such as wages, rent, materials and repairs, which is used up within the year."
    example: "A bus company's new coach is capital expenditure; the diesel it burns and the driver's wages are revenue expenditure."
scenarios:
  - id: morvah-coach-classify
    business: Morvah Coaches
    stem: "Morvah Coaches buys a new coach, fits it with a wheelchair lift, fills it with diesel and pays a driver for its first trip."
    answer: "Capital and revenue expenditure"
    why: "The coach and the lift are capital expenditure: assets used for years, recorded in the statement of financial position. The diesel and the driver's pay are revenue expenditure: costs of running the business this year, which reduce its profit."
evaluations:
  - id: capital-better-than-revenue
    claim: "Capital expenditure is better than revenue expenditure, because it creates assets."
    counter: "An asset is worth buying only if it earns enough, and capital spending ties up cash and often needs finance. Revenue spending on training, marketing and maintenance keeps a business running and can create lasting value, so the right balance depends on the business's objectives and its cash."

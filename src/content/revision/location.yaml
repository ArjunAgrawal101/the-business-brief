# Quick revision for 5.4 Location (statements at AO2 and AO3). The guide sets
# no AO4 here, so there is no calculate question. Written for the platform;
# every business named is fictional.
code: '5.4'
exercises:
  - id: haverling-factors
    business: Haverling Brewery
    stem: "Haverling Brewery has outgrown its city-centre site. It is choosing between a site on the edge of the city and one in a small town 60 km away, where land is much cheaper."
    command: explain
    question: "**Explain** two factors Haverling Brewery should consider when choosing its new location."
    outline:
      - "The cost of land and buildings, much lower in the town."
      - "Access to customers: finished beer is heavy and bulky to transport, so being close to the city's pubs and shops matters."
      - "Labour: whether skilled brewers and current staff will work 60 km away."
      - "Others: water supply, road links, planning permission and incentives; explains each for a brewery."
  - id: haverling-weighted
    business: Haverling Brewery
    stem: "Haverling Brewery scores each site out of 10, weighting cost 0.5, access to customers 0.3 and labour 0.2. The city-edge site scores 4, 9 and 8; the town site scores 9, 5 and 5."
    command: comment
    question: "**Comment** on what a weighted score suggests about the two sites."
    outline:
      - "City edge: (4 × 0.5) + (9 × 0.3) + (8 × 0.2) = 2 + 2.7 + 1.6 = **6.3**."
      - "Town: (9 × 0.5) + (5 × 0.3) + (5 × 0.2) = 4.5 + 1.5 + 1.0 = **7.0**, so the town site ranks higher."
      - "Comments that the weights and scores are judgements: giving access to customers more weight could reverse the ranking."
      - "Notes that weighted scoring is a standard technique rather than one the guide names, and that factors left out of it, such as staff willing to move, still matter."
  - id: haverling-offshore
    business: Haverling Brewery
    stem: "A bottling firm abroad offers to bottle Haverling Brewery's beer for 20% less than it costs Haverling Brewery to do it now. The beer would travel there in tankers and come back in bottles."
    command: discuss
    question: "**Discuss** whether Haverling Brewery should offshore its bottling."
    outline:
      - "Makes clear that this is both **outsourcing** (another company) and **offshoring** (another country)."
      - "For: lower bottling costs, a specialist's skills, and capital freed from bottling equipment."
      - "Against: transport both ways may wipe out the saving once the full landed cost is counted, plus slower supply, less control over quality, and a weaker local brand."
      - "Considers a local bottler instead, outsourcing without offshoring, and reaches a judgement."
formulas:
  weighted-score:
    situation: "A business comparing three sites on cost, access and labour wants one figure for each site that reflects how much each factor matters to it."
    measures: "One figure for an option that reflects how well it scores on each factor and how much each factor matters: each factor's weight times the option's score, added up. A standard technique, not one the guide names."
mistakes:
  - mistake: "Confusing outsourcing with offshoring."
    fix: "Outsourcing moves work to another company; offshoring moves it to another country. A business can do either without the other."
  - mistake: "Comparing the cost of producing abroad without the full landed cost."
    fix: "Add transport, duties, insurance and the cost of managing at a distance before comparing with the cost at home."
  - mistake: "Treating a weighted score as the answer."
    fix: "The weights and scores are judgements: test how the ranking changes if they change, and add the factors the scores leave out."
distinctions:
  - id: outsourcing-vs-offshoring
    pair: [Outsourcing, Offshoring]
    difference: "Outsourcing, or subcontracting, moves an activity to another business. Offshoring moves an activity to another country, whether to another business or to the business's own operation there."
    example: "Using a bottler in the next town is outsourcing; opening the business's own bottling plant abroad is offshoring; using a bottler abroad is both."
  - id: reshoring-vs-insourcing
    pair: [Reshoring, Insourcing]
    difference: "Reshoring brings activity that had been moved abroad back to the home country. Insourcing brings activity that had been given to another business back inside the business itself. Bringing work home from a foreign supplier to the business's own factory is both."
scenarios:
  - id: scarlow-bulk-reducing
    business: Scarlow Cement
    stem: "Scarlow Cement builds its works beside the quarry that supplies its limestone, because the cement it makes weighs far less than the rock it uses."
    answer: "A bulk-reducing location decision"
    why: "When raw materials are heavier or bulkier than the finished product, locating near the materials cuts transport costs. A business whose product gains weight or bulk, such as a brewery, locates near its customers instead."
evaluations:
  - id: offshoring-always-cheaper
    claim: "Offshoring production always cuts costs."
    counter: "Lower wages abroad can be outweighed by transport, tariffs, quality failures, longer lead times, management time and exchange rate changes, so the landed cost is what counts. Damage to the brand and the risk of disruption have pushed some businesses to reshore."

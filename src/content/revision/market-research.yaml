# Quick revision for 4.4 Market research (statements at AO3 and AO2). Written
# for the platform; every business named is fictional.
code: '4.4'
exercises:
  - id: larkspire-methods
    business: Larkspire Tea Rooms
    stem: "Larkspire Tea Rooms is thinking of opening a second tea room in a nearby town and wants to know whether there is enough demand there."
    command: explain
    question: "**Explain** one method of primary research and one source of secondary research Larkspire Tea Rooms could use."
    outline:
      - "Primary: a survey of shoppers in the town, or observation of how many people pass the possible site, which answers Larkspire's own question but costs time and money."
      - "Secondary: government figures on the town's population and ages, market analyses of cafés, or online reviews of rival tea rooms, which are quick and cheap but not made for Larkspire's question."
      - "Explains what each would tell the owners about demand."
  - id: larkspire-sampling
    business: Larkspire Tea Rooms
    stem: "Larkspire Tea Rooms plans to survey 200 people. It could stop whoever passes in the high street on a weekday morning, or set quotas by age group to match the town's population."
    command: analyse
    question: "**Analyse** the advantages and disadvantages of convenience sampling and quota sampling for Larkspire Tea Rooms' survey."
    outline:
      - "**Convenience sampling** is quick and cheap, but people in the high street on a weekday morning are not typical of the town, so the results are biased."
      - "**Quota sampling** makes the sample match the town's age groups, so it is more representative, but interviewers still choose whom to ask within each quota."
      - "Notes that random sampling would remove that choice, but is harder and dearer to carry out."
  - id: larkspire-worth-it
    business: Larkspire Tea Rooms
    stem: "A market research agency has quoted Larkspire Tea Rooms $3,000 to study demand in the nearby town. Opening the second tea room would cost about $80,000."
    command: discuss
    question: "**Discuss** whether Larkspire Tea Rooms should pay for the market research before opening the second tea room."
    outline:
      - "For: $3,000 is small beside an $80,000 investment, and research could reveal weak demand, the best site, prices and menu before the money is committed."
      - "Against: it takes time and money, may be out of date or biased, and the owners already know a similar town well."
      - "Considers cheaper alternatives, such as their own survey or secondary data first."
      - "Reaches a judgement, for example that some research is worth it given the size of the decision."
formulas:
  mean:
    situation: "A manager wants a single figure for the typical weekly sales of five branches, sharing their total equally between them, to set each a target."
  median:
    situation: "Answers to a survey of weekly spending include a few very large figures, and a researcher wants a typical value that those few cannot drag upwards."
  quartiles:
    situation: "A researcher wants to show how spread out the middle half of a set of survey answers is, without letting a few extreme answers distort the measure."
  standard-deviation:
    situation: "A manager wants to measure how widely daily sales vary around their average, using every day's figure."
mistakes:
  - mistake: "Recommending primary research without weighing its cost and time against the decision."
    fix: "Match the research to the size of the decision: secondary data first, then primary research where the question needs it."
  - mistake: "Calling a sample biased or unbiased without saying how it was chosen."
    fix: "Explain the sampling method, who it is likely to miss, and what that does to the findings."
distinctions:
  - id: primary-vs-secondary-research
    pair: [Primary research, Secondary research]
    difference: "Primary research collects new data first-hand for the business's own question, through surveys, interviews, focus groups or observation. Secondary research uses data that already exist, collected by others for other purposes, such as government publications, market analyses and media articles."
  - id: qualitative-vs-quantitative-research
    pair: [Qualitative research, Quantitative research]
    difference: "Quantitative research collects numbers that can be counted and compared, such as how many people would buy at a price. Qualitative research collects opinions, feelings and reasons in people's own words, from small groups, to understand why."
  - id: quota-vs-random-sampling
    pair: [Quota sampling, Random sampling]
    difference: "In random sampling every member of the population has an equal chance of being chosen. In quota sampling the researcher must find set numbers of people from chosen groups, such as age groups, but picks who to ask within each group, which can introduce bias."
scenarios:
  - id: quillon-qualitative
    business: Quillon Games
    stem: "Players of Quillon Games' new game stop playing after a week, and its designers want to understand why, in the players' own words, before they write a survey."
    answer: "Qualitative research, such as a focus group or interviews"
    why: "Qualitative research explores reasons and feelings in depth with a small group, so it suits a question of why. What it finds can then be measured across many players with a quantitative survey."
evaluations:
  - id: bigger-sample-better
    claim: "A bigger sample always gives better results."
    counter: "A bigger sample reduces sampling error, but a badly chosen one stays biased however large it is, and it costs more time and money. How representative a sample is matters more than its size."

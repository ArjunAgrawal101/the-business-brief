# Quick revision for 1.5 Growth and evolution (statements at AO2 and AO3).
# Written for the platform; every business named is fictional.
code: '1.5'
exercises:
  - id: pellow-internal-external
    business: Pellowe's Pies
    stem: "Pellowe's Pies has six bakery shops in one region and wants to grow. It can open six more shops itself over three years, or buy a rival chain of eight shops in a neighbouring region now."
    command: discuss
    question: "**Discuss** whether Pellowe's Pies should grow internally or by acquiring the rival."
    outline:
      - "Internal growth is slower but keeps control, the culture and the quality the brand rests on, and can be paid for shop by shop."
      - "The acquisition is fast: eight shops, a market share and purchasing economies at once, and one rival fewer."
      - "Its risks: a large sum to finance, the chance of overpaying, and integration problems such as a clash of cultures and different recipes and systems."
      - "Judges which route suits the owners' objectives, finance and appetite for risk, for example that internal growth is safer unless the rival can be bought cheaply and run separately at first."
  - id: pellow-economies
    business: Pellowe's Pies
    stem: "Pellowe's Pies plans to double its number of shops over the next three years."
    command: explain
    question: "**Explain** two economies of scale Pellowe's Pies might gain as it grows."
    outline:
      - "Purchasing economies: buying flour, meat and packaging in bulk lowers their cost per pie."
      - "Technical economies: a larger central bakery with bigger ovens produces each pie more cheaply than small kitchens in every shop."
      - "Others could be marketing (one campaign spread over more shops) or financial (cheaper loans for a larger business)."
      - "Explains each as a fall in **average cost** as the scale of operations grows, and may note that diseconomies can follow."
  - id: vela-franchising
    business: Velura Noodles
    stem: "Velura Noodles is a noodle bar with a strong brand in its home city. It wants to open in five other cities within two years, but has little capital of its own."
    command: evaluate
    question: "**Evaluate** franchising as a way for Velura Noodles to grow."
    outline:
      - "Benefits: franchisees bring the capital and local knowledge, so growth is fast without large borrowing, and owner-managers are motivated to succeed."
      - "Velura's income from the outlets would be franchise fees and royalties, not the outlets' whole sales."
      - "Drawbacks: less control over quality and service, so one poor franchisee can damage the whole brand; profits are shared; good franchisees are hard to find."
      - "Judges when franchising suits, for example if Velura's recipes and processes can be written down, taught and checked."
formulas:
  expected-value:
    situation: "A board must choose between two projects whose results depend on chance. It can estimate the probability and the payoff of each possible outcome, and the cost of each project."
distinctions:
  - id: internal-vs-external-growth
    pair: [Internal growth, External growth]
    difference: "Internal (organic) growth comes from the business's own activities: more sales, new products, new branches. External (inorganic) growth comes from joining with other businesses, through mergers, acquisitions, takeovers, joint ventures, alliances or franchising."
    example: "Opening a new shop is internal growth; buying a rival's shops is external growth."
  - id: merger-vs-takeover
    pair: [Merger, Takeover]
    difference: "In a merger two businesses agree to combine into one, usually as equals. In an acquisition one business buys a controlling interest in another; when the target's managers resist it, it is called a takeover, often a hostile one."
  - id: joint-venture-vs-strategic-alliance
    pair: [Joint venture, Strategic alliance]
    difference: "Both are forms of cooperation between independent businesses. A joint venture creates a new business that the partners own together and share the profits of. A strategic alliance is an agreement to cooperate that creates no new jointly owned business."
  - id: horizontal-vs-vertical-integration
    pair: [Horizontal integration, Vertical integration]
    difference: "Horizontal integration joins businesses at the same stage of the same industry, such as two bakeries. Vertical integration joins businesses at different stages of the same supply chain: backward towards suppliers, such as a bakery buying a flour mill, or forward towards customers, such as a mill buying bakeries."
  - id: internal-vs-external-economies-of-scale
    pair: [Internal economies of scale, External economies of scale]
    difference: "Internal economies of scale come from the business's own growth, such as bulk buying or larger machines. External economies of scale come from the growth of the industry or the area around it, such as specialist suppliers, skilled workers and better infrastructure, and benefit every firm there."
  - id: ansoff-vs-bcg
    pair: [Ansoff matrix, BCG matrix]
    codes: ['1.5', '4.5', 'toolkit']
    difference: "The Ansoff matrix compares routes to growth, by existing or new products in existing or new markets, and the risk of each. The BCG matrix classifies the products a business already has by market growth and relative market share, to decide where to invest the cash."
    example: "Ask “where should we grow next?” with Ansoff, and “which of our products deserves our money?” with BCG."
  - id: decision-node-vs-chance-node
    pair: [Decision node, Chance node]
    codes: ['1.5', 'toolkit']
    difference: "On a decision tree, a decision node (a square) is a point where the business chooses between options. A chance node (a circle) is a point where outcomes depend on chance, each with a probability, and the probabilities at a node add up to 1."
scenarios:
  - id: pellowe-ansoff
    business: Pellowe's Pies
    stem: "Pellowe's Pies must choose between selling a range of frozen pies in its own shops and opening cafés in a region where nobody knows the brand. The owners want to compare how risky each route is."
    answer: "The Ansoff matrix"
    why: "The frozen range is product development (a new product for existing customers) and the cafés are market development (an existing product in a new market). The matrix shows that each carries more risk than selling more of the same, and that moving in both directions at once would be diversification, the riskiest."
    codes: ['1.5', 'toolkit']
  - id: vinthrop-decision-tree
    business: Vinthrop Cellars
    stem: "Vinthrop Cellars, a wine importer, must choose between two expansion plans. For each, it can estimate the cost, the chance of strong or weak demand, and the profit each outcome would bring."
    answer: "A decision tree"
    why: "A decision tree sets out the options, the chance outcomes and their probabilities, and works out each option's expected value net of its cost. It makes the reasoning visible, though the probabilities are estimates and an average hides the risk of a large loss."
    codes: ['1.5', 'toolkit']
evaluations:
  - id: bigger-is-cheaper
    claim: "Growing bigger always lowers a business's cost per unit."
    counter: "Economies of scale lower average cost only up to a point. Beyond it, diseconomies such as slow communication, weak coordination and low motivation raise it again. Where that point lies depends on how well the business's management and systems cope with size."
  - id: joint-venture-is-safe
    claim: "A joint venture is a low-risk way to grow."
    counter: "It shares the cost and risk of a venture with a partner, but control and profits are shared too, and partners whose objectives drift apart can stall decisions or end the venture. It is low risk only when the partners' aims, contributions and exit terms are clear from the start."

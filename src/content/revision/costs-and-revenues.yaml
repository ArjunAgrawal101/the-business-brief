# Quick revision for 3.3 Costs and revenues. The guide sets both statements at
# AO2, so the exercises use command terms up to explain. Written for the
# platform; every business named is fictional.
code: '3.3'
exercises:
  - id: glazewright-classify
    business: Glazewright Pottery
    stem: "Glazewright Pottery makes mugs. Its costs include clay and glaze, the rent of its studio, the salary of its manager, and the $2 it pays its potters for each mug they make."
    command: distinguish
    question: "**Distinguish** between fixed costs and variable costs, using Glazewright Pottery's costs."
    outline:
      - "**Fixed costs** do not change with output in the short run: the studio's rent and the manager's salary."
      - "**Variable costs** change in proportion to output: clay, glaze and the $2 a mug paid to the potters."
      - "Notes that labour can be either: paid per mug it is variable, paid a salary it is fixed."
      - "May add a **semi-variable** cost, such as electricity with a standing charge."
  - id: glazewright-streams
    business: Glazewright Pottery
    stem: "Glazewright Pottery sells mugs in its own shop and online, runs weekend pottery classes, and charges cafés to design mugs with their logos."
    command: explain
    question: "**Explain** two benefits for Glazewright Pottery of having several revenue streams."
    outline:
      - "Spreads risk: if mug sales fall, the classes and the design work still bring in revenue."
      - "Uses the studio, the kiln and the potters' skills when they would otherwise be idle, such as at weekends."
      - "Reaches different customers, and one stream can lead to another, such as class members buying mugs."
      - "Applies each benefit to Glazewright rather than listing benefits in general."
  - id: glazewright-price-cut
    business: Glazewright Pottery
    stem: "Glazewright Pottery sells 1,000 mugs a month at $12. Each mug's variable cost is $5 and fixed costs are $4,000 a month. It is considering cutting the price to $10, and expects sales to rise to 1,200 mugs a month."
    command: explain
    question: "**Explain**, using the figures, whether the price cut would raise Glazewright Pottery's profit."
    outline:
      - "Now: total revenue = $12 × 1,000 = $12,000; total cost = $4,000 + ($5 × 1,000) = $9,000; profit = $3,000."
      - "After the cut: total revenue = $10 × 1,200 = $12,000; total cost = $4,000 + ($5 × 1,200) = $10,000; profit = $2,000."
      - "Explains that revenue is unchanged but profit falls by $1,000, because the extra mugs add $1,000 of variable costs."
      - "Notes that sales would need to reach 1,400 mugs a month at $10 to keep a profit of $3,000."
formulas:
  total-revenue:
    situation: "A market stall sells 300 jars of honey a week at $6 each, and the owner wants the value of the week's sales."
  total-cost:
    situation: "A workshop knows its rent and salaries for the month and the cost of materials for each chair, and wants to know what making 80 chairs will cost in all."
  profit:
    situation: "At the end of the month a café knows what it took in sales and what all its costs came to, and wants to know what it made."
distinctions:
  - id: fixed-vs-variable-costs
    pair: [Fixed costs, Variable costs]
    difference: "Fixed costs do not change with the level of output in the short run, such as rent and salaries; they are paid even when nothing is made. Variable costs change in direct proportion to output, such as materials and piece-rate pay."
  - id: direct-vs-indirect-costs
    pair: [Direct costs, Indirect costs]
    difference: "Direct costs can be traced to a particular product or cost object, such as the clay in a mug. Indirect costs, or overheads, are shared across the business and cannot be traced to one product, such as the manager's salary or insurance."
    example: "Fixed and indirect are not the same: a machine hired for one product only is a fixed cost but a direct one."
  - id: revenue-vs-profit
    pair: [Revenue, Profit]
    difference: "Revenue is the value of sales, price times quantity, before any cost is paid. Profit is what is left of revenue once all costs are paid. Revenue can rise while profit falls."
scenarios:
  - id: lanterne-semi-variable
    business: Lanterne Cinema
    stem: "Lanterne Cinema's electricity bill has a fixed monthly charge plus a charge for every unit used, so it rises on busy weekends when every screen is running."
    answer: "A semi-variable cost"
    why: "A semi-variable cost has a fixed part, paid whatever the output, and a variable part that rises with output. For break-even and costing it is split into the two parts."
evaluations:
  - id: fixed-costs-never-change
    claim: "Fixed costs never change."
    counter: "They are fixed only within a range of output and a period of time. Rent can rise when a lease is renewed, and growing past capacity adds a new block of fixed costs, such as a second machine. In the long run, every cost can change."

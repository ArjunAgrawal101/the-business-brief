# Quick revision for 2.2 Organizational structure (statements at AO2, AO4 and
# AO3; the Shamrock Organization is HL). Written for the platform; every
# business named is fictional.
code: '2.2'
exercises:
  - id: larchway-delayering
    business: Larchway Insurance
    stem: "Larchway Insurance has seven levels of hierarchy between its chief executive and its call-centre staff. It plans to remove two levels of middle management."
    command: explain
    question: "**Explain** two possible effects of the delayering on Larchway Insurance."
    outline:
      - "Faster communication and decisions, with fewer levels for messages to pass through, and lower salary costs."
      - "Wider **spans of control**: remaining managers supervise more staff, so they may be overloaded and support may suffer."
      - "More delegation and responsibility can motivate staff; fewer levels also mean fewer chances of promotion."
      - "Considers the morale of those who remain after colleagues lose their jobs."
  - id: larchway-regional
    business: Larchway Insurance
    stem: "Larchway Insurance is expanding into three new countries, each with its own laws, regulators and customer expectations."
    command: discuss
    question: "**Discuss** whether Larchway Insurance should organize itself by region."
    outline:
      - "For: regional managers can adapt products, prices and service to local law and customers, and respond quickly."
      - "Against: functions such as marketing and IT are repeated in every region, raising costs, and consistency across regions is harder."
      - "Considers the alternatives, such as a functional, product-based or matrix structure."
      - "Judges which suits, for example a regional structure while the new markets differ most, with some functions kept central."
  - id: sablewood-shamrock
    business: Sablewood Events
    stem: "Sablewood Events keeps 20 permanent staff who plan and sell its events. For each event it hires stage crews by the day, and it contracts catering and security firms that are paid for the job."
    command: explain
    question: "**Explain** how Sablewood Events matches Charles Handy's Shamrock Organization."
    level: HL
    outline:
      - "The **professional core**: the 20 permanent staff, whose skills and knowledge the business depends on."
      - "The **contractual fringe**: the catering and security firms, paid by contract for results."
      - "The **flexible labour force**: the stage crews, hired as each event needs them."
      - "Explains the benefit, lower fixed costs in a business whose work comes and goes, and a risk, such as weaker loyalty or uneven quality."
distinctions:
  - id: delegation-vs-decentralization
    pair: [Delegation, Decentralization]
    difference: "Delegation passes a particular task or decision from a manager to a subordinate, and the manager stays accountable for it. Decentralization is a feature of the whole structure: authority to make decisions is spread away from the centre, for example to regional or branch managers."
  - id: span-of-control-vs-levels-of-hierarchy
    pair: [Span of control, Levels of hierarchy]
    difference: "The span of control is the number of people who report directly to one manager. The levels of hierarchy are the number of layers of authority from the top of the organization to the bottom. For the same workforce, wider spans mean fewer levels."
  - id: flat-vs-tall-structure
    pair: [Flat structure, Tall structure]
    difference: "A flat structure has few levels of hierarchy and wide spans of control, so communication is quick but managers supervise many people. A tall structure has many levels and narrow spans, which allows close supervision and more promotion steps but slows communication."
scenarios:
  - id: quillmere-matrix
    business: Quillmere Design
    stem: "At Quillmere Design each designer, writer and developer reports to the head of their department and also to the manager of each client project they work on."
    answer: "A matrix structure"
    why: "Staff report to two managers at once, the head of their function and the project manager, which combines specialist expertise with a focus on each project. It is flexible, but conflicting instructions and divided loyalty are its main drawbacks."
evaluations:
  - id: flat-always-better
    claim: "A flat structure is always better than a tall one."
    counter: "Flat structures speed up communication and cut management costs, but wide spans of control can overload managers and leave staff without support, and there are fewer steps for promotion. A taller structure can suit work that needs close supervision or many layers of specialist judgement."

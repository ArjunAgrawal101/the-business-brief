# Quick revision for 2.1 Introduction to human resource management
# (statements at AO2 and AO3). Written for the platform; every business named
# is fictional.
code: '2.1'
exercises:
  - id: morrowfield-external-factors
    business: Morrowfield Hotels
    stem: "Morrowfield Hotels, a chain of seaside hotels, finds it harder each summer to recruit staff. Many young people in the area have moved to cities, and some of its former cleaners now find work through a gig-economy app."
    command: explain
    question: "**Explain** two external factors that affect Morrowfield Hotels' human resource planning."
    outline:
      - "**Labour mobility** and demographic change: young people moving to the cities shrink the local pool of workers for seasonal jobs."
      - "The **gig economy**: workers who can choose shifts through an app expect flexibility, so the hotels compete on flexibility as well as pay."
      - "Others could be immigration, employment law or the state of the labour market."
      - "Explains each effect on the plan, for example recruiting earlier, offering accommodation or more flexible contracts."
  - id: morrowfield-resistance
    business: Morrowfield Hotels
    stem: "Morrowfield Hotels plans to replace its reception desks with self-service check-in kiosks and to retrain its receptionists as guest-service staff."
    command: explain
    question: "**Explain** two reasons why Morrowfield's receptionists might resist the change."
    outline:
      - "Fear for their jobs and pay, since kiosks do part of their work."
      - "Uncertainty about the new role, the skills it needs and whether they can learn them."
      - "Loss of status or of a routine they are good at, or distrust if they were not consulted."
      - "Applies each reason to receptionists in a hotel rather than to change in general."
  - id: morrowfield-introduce-change
    business: Morrowfield Hotels
    stem: "Morrowfield Hotels wants the self-service kiosks working in all its hotels within a year, with as little disruption as possible."
    command: recommend
    question: "**Recommend** how Morrowfield's managers should introduce the self-service kiosks."
    outline:
      - "Communicate early and honestly about why the change is happening and what it means for each person."
      - "Consult receptionists and involve them in designing the new guest-service role; train them for it."
      - "Offer redeployment or a promise of no compulsory redundancies, and pilot the kiosks in one hotel first."
      - "Weighs the cost and time of each step against the risk of resistance, and gives a justified recommendation."
distinctions:
  - id: geographic-vs-occupational-mobility
    pair: [Geographic mobility, Occupational mobility]
    difference: "Geographic mobility is how easily workers can move from one place to another for work. Occupational mobility is how easily they can move from one kind of job to another, which depends on their skills and training."
    example: "A cleaner who moves to the city for work shows geographic mobility; a receptionist retrained as a guest-service adviser shows occupational mobility."
  - id: flexi-time-vs-gig-economy
    pair: [Flexi-time, Gig economy]
    difference: "Flexi-time lets employees choose when they start and finish, around core hours, while they remain employees with the usual rights. The gig economy is short-term work paid task by task, often arranged through an app, by independent workers who usually lack employees' rights such as sick pay."
scenarios:
  - id: morrowfield-natural-wastage
    business: Morrowfield Hotels
    stem: "Morrowfield Hotels needs 40 fewer receptionists over the next two years and wants to avoid compulsory redundancies. About 25 receptionists leave or retire each year."
    answer: "Natural wastage, with redeployment"
    why: "Not replacing staff who leave or retire reduces the workforce without making anyone redundant, which is cheaper and causes less conflict. With about 25 leaving a year, the 40 posts can go within two years; redeploying some receptionists to new roles speeds it up."
evaluations:
  - id: resistance-is-stubbornness
    claim: "Resistance to change is just employees being stubborn."
    counter: "Resistance often reflects real losses, of jobs, pay, status or skills, or real flaws in the plan, and it grows when people are not consulted. Listening to it can improve the change; treating it as stubbornness usually makes it worse."

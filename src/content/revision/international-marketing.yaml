# Quick revision for 4.6 International marketing, an HL subtopic whose one
# statement is at AO3. Written for the platform; every business named is
# fictional.
code: '4.6'
exercises:
  - id: kelvara-opportunities-threats
    business: Kelvara Teas
    stem: "Kelvara Teas, a maker of premium herbal teas, plans to sell in a neighbouring country where tea is popular but tastes differ, and where imported tea faces a 15% tariff."
    command: evaluate
    question: "**Evaluate** the opportunities and threats for Kelvara Teas of entering the new market."
    level: HL
    outline:
      - "Opportunities: new customers and growth beyond the home market, economies of scale from higher output, and risk spread across two markets."
      - "Threats: the 15% tariff raises the price or squeezes the margin, different tastes may need new blends, and local brands and exchange rate changes add risk."
      - "Weighs them for Kelvara Teas, including the method of entry and its resources."
      - "Reaches a judgement, for example that the opportunity is real if Kelvara Teas can avoid the tariff and adapt its blends."
  - id: kelvara-entry
    business: Kelvara Teas
    stem: "Kelvara Teas has little experience abroad and limited capital. A local tea packer has offered to produce and sell its blends under licence."
    command: recommend
    question: "**Recommend** a method of entry into the new market for Kelvara Teas."
    level: HL
    outline:
      - "Compares exporting (little risk or capital, but the tariff applies), licensing (the local packer makes the tea, so no tariff, but less control and a royalty only), a joint venture (local knowledge, shared control and profit) and its own operations (full control, high cost and risk)."
      - "Considers the risk to the brand if the licensee's quality slips."
      - "Recommends a method with reasons, such as licensing with strict quality terms, given Kelvara Teas' limited capital and experience."
  - id: kelvara-adapt
    business: Kelvara Teas
    stem: "Kelvara Teas must decide how far to change its blends, packaging, prices and advertising for the new market."
    command: discuss
    question: "**Discuss** whether Kelvara Teas should standardize or adapt its marketing mix for the new market."
    level: HL
    outline:
      - "Standardizing keeps one brand and one product range, with economies of scale and a consistent image."
      - "Adapting fits local tastes, language, incomes and culture, at extra cost; tea is a culture-bound product, so tastes matter."
      - "Considers **glocalization**: one brand, with blends, pack sizes and messages adapted locally."
      - "Reaches a judgement for each part of the mix rather than one answer for all of it."
formulas:
  capacity-utilization-rate:
    situation: "A factory that could make 50,000 units a month made 35,000 last month, and its manager wants to know how fully it is being used."
mistakes:
  - mistake: "Listing opportunities and threats without weighing them for the business in the case."
    fix: "The guide sets 4.6 at AO3: judge which opportunities and threats matter most for this business and this market, and reach a conclusion."
    level: HL
  - mistake: "Ignoring the method of entry when judging a new market."
    fix: "The same market can be a sound move by licensing and a poor one with a new factory, so make the method part of the judgement."
    level: HL
  - mistake: "Assuming a product that sells at home will sell abroad unchanged."
    fix: "Check culture, tastes, incomes, laws and competition; culture-bound products such as food usually need adapting."
    level: HL
distinctions:
  - id: standardized-vs-adapted-marketing
    pair: [Standardized marketing, Adapted marketing]
    level: HL
    difference: "Standardized marketing uses the same marketing mix in every country, for economies of scale and one consistent brand. Adapted marketing changes the product, price, promotion or place to suit each country. Glocalization keeps a global brand while adapting some parts locally."
scenarios:
  - id: grillstone-glocal
    business: Grillstone Burgers
    stem: "Grillstone Burgers keeps the same brand, restaurant design and core menu in every country, but adds local dishes and changes recipes to suit local tastes and religious rules."
    answer: "Glocalization"
    level: HL
    why: "Glocalization combines a standardized global brand with local adaptation. It keeps economies of scale and a recognizable brand while respecting local culture, at the cost of more complex supply chains and menus."
evaluations:
  - id: abroad-spreads-risk
    claim: "Entering foreign markets always spreads a business's risk."
    counter: "Selling in several economies spreads the risk of a fall in demand at home, but it adds exchange rate, political, legal and cultural risks, can stretch management and finances, and may distract from the home market."
    level: HL

# Quick revision for 2.5 Organizational (corporate) culture, an HL subtopic
# (statements at AO1, AO2 and AO3). Written for the platform; every business
# named is fictional.
code: '2.5'
exercises:
  - id: ravensmoor-power-culture
    business: Ravensmoor Studio
    stem: "At Ravensmoor Studio, a design studio of 18 people, the founder makes every important decision. Staff win influence by being close to her, and there are few written rules."
    command: explain
    question: "**Explain** which of Handy's types of culture best describes Ravensmoor Studio, and one risk it carries as the studio grows."
    level: HL
    outline:
      - "Identifies a **power culture** (Zeus, the web): power at the centre, influence through closeness to the founder, few rules."
      - "Notes its strengths in a small studio: quick decisions and strong loyalty."
      - "Explains a risk of growth: the founder becomes a bottleneck, decisions depend on one person, and the studio has no successor."
  - id: ravensmoor-merger-clash
    business: Ravensmoor Studio
    stem: "Ravensmoor Studio is merging with Coldmarsh Print, a printer of 200 people with detailed procedures, job descriptions and a clear hierarchy."
    command: discuss
    question: "**Discuss** the likely culture clash after the merger, and how managers could reduce it."
    level: HL
    outline:
      - "Identifies the clash: Ravensmoor's power culture against Coldmarsh's **role culture** (Apollo, the temple), with different views of rules, decisions and status."
      - "Explains the likely effects: falling morale, conflict, absence, staff leaving and lost merger benefits."
      - "Considers ways to reduce it: assess the cultures early, communicate, involve staff, decide how far to integrate (perhaps keeping the studio separate), and have leaders model the new culture."
      - "Judges how serious the clash is likely to be and which approach fits, given the size difference and what the merger is for."
  - id: aldermoor-new-leader
    business: Aldermoor Hotels
    stem: "A new chief executive at Aldermoor Hotels, a hotel group known for its relaxed, team-based way of working, introduces strict targets and takes most decisions at head office."
    command: explain
    question: "**Explain** two effects the change of leadership style may have on Aldermoor Hotels' culture."
    level: HL
    outline:
      - "A clash between the existing team-based culture and the new controlling style, with resistance from staff used to deciding for themselves."
      - "Lower morale and higher labour turnover, especially among experienced staff."
      - "Possible gains in consistency and efficiency if the old culture was too loose."
      - "Notes that culture changes slowly, so the effects may take time to show."
mistakes:
  - mistake: "Describing Handy's types of culture without saying which fits the organization in the case."
    fix: "Judge the fit: the work, the organization's size, its leader and its environment. Most organizations mix the types."
    level: HL
  - mistake: "Treating culture as something managers can change quickly by announcing new values."
    fix: "Culture lives in shared assumptions and habits. It changes slowly, through who is recruited and rewarded, how leaders behave and time."
    level: HL
distinctions:
  - id: power-vs-role-culture
    pair: [Power culture, Role culture]
    level: HL
    difference: "In Handy's power culture (Zeus, the web) influence spreads from one powerful person at the centre, with few rules. In a role culture (Apollo, the temple) work follows procedures, job descriptions and a clear hierarchy, and authority comes from the position held."
  - id: task-vs-person-culture
    pair: [Task culture, Person culture]
    level: HL
    difference: "A task culture (Athena, the net) forms teams around projects and values expertise and results. In a person culture (Dionysus, the cluster) the organization exists to serve the individuals in it, as in a partnership of experts who each work largely on their own."
scenarios:
  - id: gannetworks-task-culture
    business: Gannetworks
    stem: "Gannetworks, a software firm, puts a small team together for each client project, chooses members for their expertise rather than their seniority, and breaks the team up when the work is done."
    answer: "A task culture"
    level: HL
    why: "In Handy's task culture (Athena, the net) power comes from expertise and teams form around the task. It suits project work and change, but is costly to coordinate and can struggle when resources are tight."
evaluations:
  - id: strong-culture-advantage
    claim: "A strong culture is always an advantage."
    counter: "A strong culture brings commitment and quick, consistent behaviour, but it can resist change, encourage everyone to think alike and clash badly in a merger. It is an advantage only while it fits the organization's environment and strategy."
    level: HL

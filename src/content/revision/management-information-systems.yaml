# Quick revision for 5.9 Management information systems, an HL subtopic
# (statements at AO1, AO2 and AO3). Written for the platform; every business
# named is fictional.
code: '5.9'
exercises:
  - id: hearthside-loyalty
    business: Hearthside Grocers
    stem: "Hearthside Grocers plans a loyalty app that gives members 2% back on everything they spend and records every purchase they make."
    command: evaluate
    question: "**Evaluate** the proposed customer loyalty programme for Hearthside Grocers."
    level: HL
    outline:
      - "Benefits: more repeat visits, and data on buying habits for targeted offers, stock planning and pricing."
      - "Costs: 2% of all members' spending, not just of any extra spending, plus the app and the security of the data."
      - "Ethical questions: privacy, consent and how the purchase data are used or shared."
      - "Judges the programme, considering whether rivals offer the same and whether the extra visits would pay for the 2%."
  - id: hearthside-data-mining
    business: Hearthside Grocers
    stem: "Hearthside Grocers' loyalty app would give it two years of purchase records for 40,000 customers."
    command: explain
    question: "**Explain** how data mining could inform Hearthside Grocers' decisions."
    level: HL
    outline:
      - "Association: products bought together, for shelf layout and bundled offers."
      - "Clustering: groups of similar customers, for targeted marketing."
      - "Prediction: demand by day and season, for ordering and staffing; anomaly detection can flag fraud."
      - "Notes the limits: patterns are correlations, not causes, and depend on the quality of the data and on customers' consent."
  - id: hearthside-monitoring
    business: Hearthside Grocers
    stem: "Hearthside Grocers is considering tracking its warehouse pickers' speed with handheld scanners and ranking them every week."
    command: discuss
    question: "**Discuss** Hearthside Grocers' plan to use data to monitor its warehouse staff."
    level: HL
    outline:
      - "Benefits: higher productivity, evidence for fair rewards, and spotting who needs training or help."
      - "Costs: stress, lost autonomy and lower morale, as motivation theories would predict, plus privacy concerns and speed put ahead of accuracy and safety; this is **digital Taylorism**."
      - "Considers how the data are used: to support staff or to control them, and whether staff are consulted."
      - "Reaches a judgement, for example to use the data for team targets and training rather than weekly rankings."
mistakes:
  - mistake: "Treating technology as making decisions better on its own."
    fix: "The quality of the data, the questions asked and the judgement of the people using the results decide whether an information system improves decisions."
    level: HL
  - mistake: "Discussing loyalty schemes or staff monitoring without their ethical side."
    fix: "Weigh privacy, consent, fairness and the effect on trust and motivation alongside the benefits to the business."
    level: HL
  - mistake: "Confusing cybersecurity with cybercrime."
    fix: "Cybercrime is the attack, such as phishing or ransomware; cybersecurity is the protection against it."
    level: HL
distinctions:
  - id: cybersecurity-vs-cybercrime
    pair: [Cybersecurity, Cybercrime]
    level: HL
    difference: "Cybercrime is illegal activity carried out through computers or the internet, such as hacking, stealing data or money, or spreading malicious software. Cybersecurity is the technology, processes and practices a business uses to protect its systems and data against such attacks."
scenarios:
  - id: velowick-iot
    business: Velowick Bikes
    stem: "Velowick Bikes, a bike-sharing service, fits sensors to its bikes that report each bike's location, use and faults to its systems as they happen."
    answer: "The internet of things"
    level: HL
    why: "The internet of things connects physical objects with sensors that collect and share data without anyone having to act. Here it guides where bikes are moved and which need repair, though it adds costs and risks to data security."
evaluations:
  - id: more-data-better-decisions
    claim: "More data always leads to better decisions."
    counter: "Data help only when they are accurate, relevant and well analysed. Poor or biased data, the wrong questions or mistaking correlation for cause lead to poor decisions, and collecting more data adds costs and risks to privacy."
    level: HL

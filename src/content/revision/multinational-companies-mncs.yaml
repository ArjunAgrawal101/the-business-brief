# Quick revision for 1.6 Multinational companies (MNCs). The guide sets its
# one statement at AO3. Written for the platform; every business and country
# named is fictional.
code: '1.6'
exercises:
  - id: tarrow-impact-on-host
    business: Tarrowby Motors
    stem: "Tarrowby Motors, a car maker, plans to build a factory employing 3,000 people in Velandia, a country with high unemployment. Velandia's government is offering ten years free of corporation tax."
    command: evaluate
    question: "**Evaluate** the likely impact of Tarrowby Motors' factory on Velandia."
    outline:
      - "Benefits: jobs and incomes, new skills and technology, orders for local suppliers, exports and, later, tax revenue."
      - "Costs: ten years with no corporation tax, profits sent home, local firms that may lose workers or customers, and environmental effects."
      - "Risk that the factory is footloose and moves when the tax holiday ends."
      - "Judges what the balance depends on: links with local suppliers, the terms agreed, how long the factory stays and how well Velandia enforces its rules."
  - id: tarrow-why-produce-there
    business: Tarrowby Motors
    stem: "Tarrowby Motors already sells cars in Velandia, shipped from its factories abroad."
    command: explain
    question: "**Explain** two reasons why Tarrowby Motors might produce cars in Velandia rather than export them there."
    outline:
      - "To get round trade barriers such as import tariffs, which make imported cars dearer."
      - "To lower costs: cheaper labour or land, lower transport costs and less exposure to exchange rate changes."
      - "To be close to customers and adapt cars to local tastes and roads, or to take up the government's incentives."
      - "Applies each reason to Tarrowby rather than listing motives for foreign direct investment in general."
  - id: velandia-conditions
    business: Tarrowby Motors
    stem: "Velandia's government wants Tarrowby Motors' factory but also wants local firms and workers to share in the benefits."
    command: suggest
    question: "**Suggest** two conditions the government could attach to its agreement with Tarrowby Motors."
    outline:
      - "A **local content requirement**: a share of parts bought from Velandian suppliers, which builds links with local firms."
      - "Training and promotion commitments, so Velandians learn skills and move into skilled and managerial jobs."
      - "A minimum period of operation, with tax incentives repaid if the factory closes early, or environmental standards."
      - "Explains how each condition spreads the benefits, and that conditions set too high could drive the investment elsewhere."
mistakes:
  - mistake: "Listing the benefits and costs for the host country without weighing them."
    fix: "Judge them for the country in the case: who gains and who loses, how long the investment will stay, and how strong the host's rules are."
distinctions:
  - id: mnc-vs-exporter
    pair: [Multinational company, Exporter]
    difference: "An exporter makes its products in one country and sells them abroad. A multinational company has operations, such as factories, offices or shops, in at least one country other than its home country, through foreign direct investment."
  - id: home-vs-host-country
    pair: [Home country, Host country]
    difference: "The home country is where a multinational has its headquarters and is usually registered. A host country is any other country where it has operations."
scenarios:
  - id: corvane-transfer-pricing
    business: Corvane Chemicals
    stem: "Velandia's tax office notices that the local branch of Corvane Chemicals buys its raw materials from another Corvane branch abroad at prices far above the market price, and reports almost no profit in Velandia."
    answer: "Transfer pricing"
    why: "Transfer prices are the prices one part of a multinational charges another. Set high here, they move profit out of Velandia to a country with lower tax, which cuts the host's tax revenue. It is legal within limits; the tax office's question is whether the prices are fair market prices."
evaluations:
  - id: mncs-always-benefit-hosts
    claim: "Multinationals always benefit host countries, because they create jobs."
    counter: "The jobs may be low paid, local firms may close and cost as many jobs as are created, profits may be sent home and tax avoided through transfer pricing. The benefit depends on the links with local suppliers, the skills passed on, the terms agreed and the host's ability to enforce its rules."

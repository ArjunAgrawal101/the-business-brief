# Quick revision for 3.7 Cash flow (statements at AO2, AO4 and AO3). Written
# for the platform; every business named is fictional.
code: '3.7'
exercises:
  - id: fernlow-forecast
    business: Fernlow Garden Centre
    stem: "Fernlow Garden Centre starts May with $6,000 in the bank. In May it expects cash inflows of $24,000 and outflows of $27,000; in June, inflows of $30,000 and outflows of $25,000."
    command: calculate
    question: "**Calculate** Fernlow Garden Centre's net cash flow and closing balance for May and for June."
    outline:
      - "May: net cash flow = $24,000 − $27,000 = **−$3,000**; closing balance = $6,000 − $3,000 = **$3,000**."
      - "June: opening balance = May's closing balance, $3,000; net cash flow = $30,000 − $25,000 = **$5,000**; closing balance = **$8,000**."
      - "Sets the figures out in the forecast's layout, with negative figures clearly marked."
      - "Notes that the balance stays positive but dips in May, so there is little room for a shock."
  - id: fernlow-profit-not-cash
    business: Fernlow Garden Centre
    stem: "Fernlow Garden Centre made a profit last year, yet in March it could not pay its suppliers on time."
    command: explain
    question: "**Explain** how Fernlow Garden Centre could be profitable and still run short of cash."
    outline:
      - "Profit counts sales when they are made and costs when they are incurred; cash counts money when it actually moves."
      - "Sales on credit to landscapers add to profit before the cash arrives, so debtors tie up cash."
      - "Stock bought in early spring for the busy season takes cash out before it is sold."
      - "Spending on a new greenhouse, or loan repayments, take cash without reducing the year's profit by the same amount."
  - id: fernlow-cash-strategies
    business: Fernlow Garden Centre
    stem: "Every year Fernlow Garden Centre runs short of cash in early spring, when it buys stock for the busy season, and has plenty by the summer."
    command: evaluate
    question: "**Evaluate** two strategies Fernlow Garden Centre could use to deal with its cash flow problem in early spring."
    outline:
      - "An **overdraft**: quick and flexible, with interest paid only on what is used, but the bank can withdraw it."
      - "Longer **trade credit** from suppliers: free finance until the stock sells, but suppliers may refuse or withdraw discounts."
      - "Others: chasing debtors, cutting credit to customers, delaying capital spending, or **sale and leaseback**."
      - "Judges that a seasonal, predictable shortfall suits short-term measures such as an overdraft with better supplier terms, rather than long-term finance."
formulas:
  net-cash-flow:
    situation: "A café wants to know whether more cash came in than went out during March."
  closing-balance:
    situation: "A shop knows the cash it held at the start of the month and the month's net cash flow, and wants the cash it will hold at the end."
  opening-balance:
    situation: "Moving its cash flow forecast on to April, a business needs the figure to start the new month with."
distinctions:
  - id: profit-vs-cash-flow
    pair: [Profit, Cash flow]
    codes: ['3.4', '3.7']
    difference: "Profit is revenue less costs over a period, counted when sales are made and costs incurred. Cash flow is the money actually coming in and going out, counted when it moves. They differ because of credit, stock, capital spending, loans and owners' money, so a profitable business can run out of cash."
    example: "A sale on 60 days' credit adds to this month's profit, but the cash arrives two months later."
  - id: cash-inflow-vs-revenue
    pair: [Cash inflow, Revenue]
    difference: "Revenue is the value of sales. A cash inflow is any money coming into the business: cash from sales, but also loans, new share capital and the sale of assets, none of which is revenue."
  - id: working-capital-vs-cash
    pair: [Working capital, Cash]
    difference: "Working capital is current assets less current liabilities, the resources available for day-to-day running. Cash is only one current asset; a business can have plenty of working capital tied up in stock and debtors and still have too little cash."
scenarios:
  - id: kestrow-overtrading
    business: Kestrow Builders
    stem: "Kestrow Builders wins many new contracts, buys materials and hires staff for them, but its customers pay 90 days after the work is done. Despite a full order book, it cannot pay its suppliers."
    answer: "Overtrading"
    why: "Overtrading is growing faster than the working capital to support it: cash goes out on materials and wages long before customers pay. Arranging finance before taking on work, or asking for stage payments, would ease it."
evaluations:
  - id: positive-balance-healthy
    claim: "A business with a positive closing balance every month must be healthy."
    counter: "The balance may rest on loans, an overdraft or the sale of assets, and the business may still be making losses. A forecast is also only a set of estimates, and a large balance can mean cash lying idle. Look at where the cash comes from and at profitability too."

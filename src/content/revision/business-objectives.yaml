# Quick revision for 1.3 Business objectives (statements at AO2 and AO3).
# Written for the platform; every business named is fictional.
code: '1.3'
exercises:
  - id: wrenfield-vision-mission
    business: Wrenfield Cycles
    stem: "Wrenfield Cycles publishes two statements: “A world where every child can ride safely to school” and “We build durable, affordable bikes for families and repair them for life.”"
    command: distinguish
    question: "**Distinguish** between Wrenfield Cycles' vision statement and its mission statement."
    outline:
      - "Identifies the first as the **vision**: the future the business hopes to help bring about, inspiring and long term."
      - "Identifies the second as the **mission**: what the business does now, for whom and how, which guides everyday decisions."
      - "Notes that neither sets a measurable target; that is the job of objectives."
  - id: wrenfield-tactical-strategic
    business: Wrenfield Cycles
    stem: "Wrenfield Cycles' board aims to become the country's leading maker of children's bikes within five years. This year its sales team has a target of fifteen new partnerships with primary schools."
    command: explain
    question: "**Explain** how Wrenfield's tactical objective could help it reach its strategic objective."
    outline:
      - "Defines the **strategic** objective as long term, set by senior managers for the whole business, and the **tactical** one as shorter term and set for a department."
      - "Explains the link: school partnerships raise awareness among parents and children, the target market, and lead to sales."
      - "Notes that the tactical target is specific and measurable, so progress towards the strategic aim can be checked."
      - "May note a risk, such as winning partnerships with discounts that cut the profit the long-term aim needs."
  - id: quillfold-recycled-card
    business: Quillfold Packaging
    stem: "Quillfold Packaging makes plastic food trays. It is considering a switch to recycled card, which would raise its material costs by 12%. Its largest customer, a supermarket chain, has asked all suppliers to cut plastic."
    command: discuss
    question: "**Discuss** whether Quillfold Packaging should switch to recycled card."
    outline:
      - "For: it keeps the largest customer, whose request carries great power; it fits **corporate social responsibility** and may improve the brand, staff motivation and readiness for future regulation."
      - "Against: costs rise by 12%, squeezing margins unless prices rise, and price-sensitive customers may switch to cheaper suppliers."
      - "Weighs the stakeholders: shareholders' returns against the customer's demand and the environment."
      - "Reaches a judgement, for example that the switch is worth it if the supermarket's orders are a large share of revenue and the cost can be partly passed on."
distinctions:
  - id: vision-vs-mission-statement
    pair: [Vision statement, Mission statement]
    difference: "A vision statement describes the future the organization wants to achieve or help to bring about: long term and aspirational. A mission statement says what the organization does now, for whom and how: its purpose and values."
    example: "“A world without plastic waste” is a vision; “We make compostable packaging for food producers” is a mission."
  - id: strategic-vs-tactical-objectives
    pair: [Strategic objectives, Tactical objectives]
    difference: "Strategic objectives are long-term targets for the whole organization, set by senior managers. Tactical objectives are shorter-term targets, usually for a department or team, that help to achieve the strategic ones."
    example: "“Become the market leader within five years” is strategic; “sign fifteen new retailers this year” is tactical."
scenarios:
  - id: pebblemoss-cafe-smart
    business: Pebblemoss Café
    stem: "The owner of Pebblemoss Café tells her staff that this year the aim is simply to “do better”. Six months later nobody can say whether the café is on track."
    answer: "SMART objectives"
    why: "The aim is not specific, measurable or time-bound, so progress cannot be checked. A SMART objective, such as raising weekday lunch sales by 10% by December, gives staff a clear target and the owner a way to judge results."
evaluations:
  - id: always-maximize-profit
    claim: "A business should always aim to maximize its profit."
    counter: "Chasing profit in the short run can cut investment, training and quality, harm the brand and invite regulation, so long-term value suffers. A new business may put survival first, a growing one market share, and many put ethical objectives beside profit. Profit maximization fits best where owners want short-term returns and competition leaves little room for other aims."

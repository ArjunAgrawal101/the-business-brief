# Quick revision for 3.6 Efficiency ratio analysis, an HL subtopic (statements
# at AO2, AO3 and AO4). Written for the platform; every business named is
# fictional.
code: '3.6'
exercises:
  - id: tidemark-efficiency
    business: Tidemark Electrical
    stem: "Tidemark Electrical's accounts show sales revenue of $730,000, cost of sales of $438,000, opening stock of $50,000, closing stock of $70,000, debtors of $80,000, creditors of $48,000, non-current liabilities of $150,000 and equity of $350,000."
    command: calculate
    question: "**Calculate** Tidemark's stock turnover in times and in days, its debtor days, creditor days and gearing ratio."
    level: HL
    outline:
      - "Average stock = ($50,000 + $70,000) ÷ 2 = $60,000; stock turnover = $438,000 ÷ $60,000 = **7.3 times**, or ($60,000 ÷ $438,000) × 365 = **50 days**."
      - "Debtor days = ($80,000 ÷ $730,000) × 365 = **40 days**; creditor days = ($48,000 ÷ $438,000) × 365 = **40 days**."
      - "Capital employed = $150,000 + $350,000 = $500,000; gearing = ($150,000 ÷ $500,000) × 100 = **30%**."
      - "Uses cost of sales for stock turnover and creditor days, and sales revenue for debtor days."
  - id: tidemark-debtor-days
    business: Tidemark Electrical
    stem: "Tidemark Electrical gives its trade customers 30 days to pay, yet its debtor days are 40."
    command: evaluate
    question: "**Evaluate** two ways Tidemark Electrical could reduce its debtor days."
    level: HL
    outline:
      - "Chasing late payers firmly, or offering a small discount for early payment: cash arrives sooner, but discounts cost money and pressure may lose customers."
      - "Credit checks or shorter terms for new customers: lower risk, but customers may buy from rivals who give longer credit."
      - "**Debt factoring**: cash at once from a factor, for a fee, and customers dealing with a third party."
      - "Judges which suits, given that customers already pay ten days late and rivals' terms matter."
  - id: tidemark-insolvency
    business: Tidemark Electrical
    stem: "A supplier warns that Tidemark Electrical could become insolvent if its largest customer fails to pay."
    command: distinguish
    question: "**Distinguish** between insolvency and bankruptcy."
    level: HL
    outline:
      - "**Insolvency** is a financial state: being unable to pay debts as they fall due, or owing more than the business owns."
      - "**Bankruptcy** is a legal status: a court formally declares a person or business unable to pay, and its assets are usually sold to repay creditors."
      - "Shows that an insolvent business may recover, for example through new finance, before any legal process; for a company the legal route is usually liquidation."
formulas:
  stock-turnover-times:
    situation: "A retailer wants to know how many times in a year it sells and replaces the stock it usually holds."
  stock-turnover-days:
    situation: "A grocer wants to know how many days, on average, goods sit in its storeroom and on its shelves before they are sold."
  debtor-days:
    situation: "A wholesaler wants to know how long, on average, its customers take to pay for what they bought on credit."
  creditor-days:
    situation: "A business wants to know how long, on average, it takes to pay the suppliers it buys from on credit."
  gearing-ratio:
    situation: "As interest rates rise, investors want to know what share of a company's long-term finance is borrowed."
  average-stock:
    situation: "To work out stock turnover, an analyst needs a typical stock level for the year from the stock held at its start and at its end."
    measures: "A typical level of stock for the year, halfway between the stock at its start and at its end."
distinctions:
  - id: insolvency-vs-bankruptcy
    pair: [Insolvency, Bankruptcy]
    level: HL
    difference: "Insolvency is a financial state in which a person or business cannot pay its debts as they fall due, or owes more than it owns. Bankruptcy is a legal status that follows when a court declares a person or business unable to pay; its assets are then usually sold to repay creditors."
  - id: debtor-days-vs-creditor-days
    pair: [Debtor days, Creditor days]
    level: HL
    difference: "Debtor days measure how long customers take to pay the business, using sales revenue. Creditor days measure how long the business takes to pay its suppliers, using cost of sales. A business is better off for cash when it collects sooner than it pays."
scenarios:
  - id: corbridge-gearing
    business: Corbridge Utilities
    stem: "Most of Corbridge Utilities' long-term finance is bank loans at variable interest rates, and rates are rising. Its shareholders want to know how exposed the company is."
    answer: "The gearing ratio"
    level: HL
    why: "Gearing shows the share of capital employed that is borrowed. The higher it is, the more of the company's profit goes on interest as rates rise, and the greater the risk; a company with steady revenue, such as a utility, can usually carry more."
evaluations:
  - id: high-gearing-dangerous
    claim: "High gearing is always dangerous."
    counter: "Borrowing raises the return to owners when the business earns more on the money than the interest costs, and lenders gain no say in running it. High gearing is dangerous when profits and cash flows are unsteady or interest rates rise; a business with steady revenue can carry more of it safely."
    level: HL

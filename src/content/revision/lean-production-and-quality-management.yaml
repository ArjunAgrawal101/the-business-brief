# Quick revision for 5.3 Lean production and quality management, an HL
# subtopic (statements at AO1, AO2 and AO3). Written for the platform; every
# business named is fictional.
code: '5.3'
exercises:
  - id: ravelstone-jit
    business: Ravelstone Furniture
    stem: "Ravelstone Furniture keeps three months' supply of timber, fabric and fittings in a large warehouse. Much of it is damaged or out of date by the time it is used."
    command: explain
    question: "**Explain** how just-in-time production could help Ravelstone Furniture."
    level: HL
    outline:
      - "With **just-in-time**, materials arrive as they are needed, so production is pulled by orders rather than pushed into stock."
      - "Ravelstone Furniture would hold far less stock, cutting the cost of the warehouse, damage and items that go out of date."
      - "Notes what JIT needs: reliable suppliers, quick deliveries and flexible production, or a late delivery stops the line."
  - id: ravelstone-qc-qa
    business: Ravelstone Furniture
    stem: "Ravelstone Furniture inspects every finished sofa before dispatch and rejects about 4% of them."
    command: distinguish
    question: "**Distinguish** between quality control and quality assurance, using Ravelstone Furniture."
    level: HL
    outline:
      - "**Quality control** inspects finished products to find faults, as Ravelstone Furniture does before dispatch: it detects problems after the cost of making them."
      - "**Quality assurance** builds quality into every stage of production, with standards, training and checks by each worker, to prevent faults."
      - "Shows the difference for Ravelstone: quality assurance would aim to cut the 4% of rejects, not just catch them."
  - id: ravelstone-tqm
    business: Ravelstone Furniture
    stem: "Ravelstone Furniture's new operations director wants to introduce total quality management across the business."
    command: evaluate
    question: "**Evaluate** the likely impact of total quality management on Ravelstone Furniture."
    level: HL
    outline:
      - "Benefits: fewer defects and less waste, more satisfied customers, and staff who are involved and motivated."
      - "Costs: training, time and a change of culture that can take years, with a possible dip in output and resistance from staff or managers."
      - "Considers what success depends on: commitment from senior managers and a culture that listens to workers."
      - "Reaches a judgement, for example that TQM suits Ravelstone Furniture if managers are prepared for a long change rather than a quick fix."
formulas:
  defect-rate:
    situation: "A factory made 8,000 bottles last week and 240 failed inspection. Its quality manager wants a figure to compare with other weeks."
distinctions:
  - id: quality-control-vs-quality-assurance
    pair: [Quality control, Quality assurance]
    level: HL
    difference: "Quality control checks finished products, or samples of them, to find and remove faults: it detects. Quality assurance sets standards and builds quality into every stage of production, involving every worker, so that faults are not made: it prevents."
  - id: jit-vs-jic
    pair: [Just-in-time, Just-in-case]
    codes: ['5.3', '5.6']
    level: HL
    difference: "Just-in-time holds minimal stock, with supplies arriving as they are needed, which cuts stock costs but risks stoppages if a delivery is late. Just-in-case holds buffer stocks to cover delays and surges in demand, which is safer but ties up cash and space."
scenarios:
  - id: lanternhill-benchmarking
    business: Lanternhill Hotels
    stem: "Lanternhill Hotels compares its check-in times and complaint rates with those of the best-rated hotels in the world, and adopts the methods that make them faster."
    answer: "Benchmarking"
    level: HL
    why: "Benchmarking measures a business's performance against the best, inside or outside its industry, and learns from their methods. It sets realistic targets, though copying methods that suit a different business or culture can fail."
evaluations:
  - id: lean-always-cuts-costs
    claim: "Lean production always cuts costs."
    counter: "Over time it usually does, but it needs investment in training and close supplier relationships, and a change of culture that can take years. Minimal stock also makes the business vulnerable when supply chains are disrupted, which can cost more than the stock saved."
    level: HL

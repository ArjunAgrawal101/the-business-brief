# Quick revision for 3.9 Budgets, an HL subtopic. The guide sets its statements
# at AO2 and AO4, so the exercises use command terms up to explain, and the AO4
# terms. Written for the platform; every business named is fictional.
code: '3.9'
exercises:
  - id: tellmere-variances
    business: Tellmere Cinema
    stem: "Tellmere Cinema's budget for March was ticket revenue of $40,000, staff costs of $12,000 and film hire of $10,000. The actual figures were ticket revenue of $37,000, staff costs of $12,500 and film hire of $9,200."
    command: calculate
    question: "**Calculate** the variance for each item and for profit, and label each favourable [F] or adverse [A]."
    level: HL
    outline:
      - "Ticket revenue: $37,000 − $40,000 = **$3,000 [A]**, because revenue is below budget."
      - "Staff costs: $12,500 − $12,000 = **$500 [A]**, because the cost is above budget; film hire: $9,200 − $10,000 = **$800 [F]**."
      - "Budgeted profit = $40,000 − $22,000 = $18,000; actual profit = $37,000 − $21,700 = $15,300; profit variance = **$2,700 [A]**."
      - "Labels each variance by its effect on profit, not by whether the figure rose or fell."
  - id: tellmere-profit-centres
    business: Tellmere Cinema
    stem: "Tellmere Cinema has four screens, a café and a bar, and its manager is thinking of treating each as a profit centre."
    command: explain
    question: "**Explain** how treating each part of Tellmere Cinema as a profit centre could help its managers."
    level: HL
    outline:
      - "A **profit centre** has its own revenue and costs, so managers can see which screens, the café or the bar earn the most."
      - "Each centre's manager is accountable for its results, which can motivate and speeds up decisions."
      - "Notes the difficulties: shared costs such as rent must be divided between centres, which is a judgement, and centres may compete rather than cooperate."
  - id: tellmere-use-variances
    business: Tellmere Cinema
    stem: "Tellmere Cinema's March profit was $2,700 below budget, mostly because ticket revenue fell short."
    command: explain
    question: "**Explain** two ways Tellmere's managers could use the March variances in their decisions."
    level: HL
    outline:
      - "Investigate the cause of the revenue shortfall, such as fewer customers, lower prices or weaker films, before acting."
      - "Adjust plans: staff rotas to match audiences, the film programme or promotion in quiet weeks."
      - "Revise future budgets if March showed the budget was unrealistic, and review budget holders' performance fairly."
      - "Notes that a variance shows **where** results differ from the plan, not **why**."
formulas:
  variance:
    situation: "At the end of the month, a budget holder compares what was actually spent on energy with what the budget allowed."
  flexed-budget-for-a-variable-cost:
    situation: "A factory made 20% more units than planned, so its spending on materials looks high. Its manager wants a fair budget to compare the spending with."
    measures: "What a variable cost should have been at the output actually produced: the original budget scaled by actual output over budgeted output."
mistakes:
  - mistake: "Labelling a variance favourable because the figure went up."
    fix: "Label by the effect on profit: revenue above budget or costs below it are favourable; revenue below budget or costs above it are adverse."
    level: HL
  - mistake: "Treating a variance as an explanation."
    fix: "A variance shows where results differ from the budget, not why. Say what the business should investigate, and what it might do once it knows."
    level: HL
distinctions:
  - id: cost-centre-vs-profit-centre
    pair: [Cost centre, Profit centre]
    level: HL
    difference: "A cost centre is a part of a business, such as a department, whose costs are recorded separately. A profit centre is a part whose revenue and costs are both recorded, so its profit can be measured."
    example: "A hospital's laundry is a cost centre; a cinema's café, with its own sales, can be a profit centre."
  - id: favourable-vs-adverse-variance
    pair: [Favourable variance, Adverse variance]
    level: HL
    difference: "A favourable variance is a difference from the budget that raises profit: revenue above budget, or costs below it. An adverse variance lowers profit: revenue below budget, or costs above it."
scenarios:
  - id: wellbank-adverse-variance
    business: Wellbank School
    stem: "Two months into the year, Wellbank School's budget holder for resources finds that spending on paper and printing is 15% above the budget."
    answer: "Variance analysis"
    level: HL
    why: "The difference is an adverse variance. Analysing it means finding the cause, such as higher prices, more students or waste, and deciding whether to act on spending or to revise the budget."
evaluations:
  - id: favourable-always-good
    claim: "A favourable variance is always good news."
    counter: "A favourable cost variance may come from cutting quality, training or maintenance, which costs more later, and a favourable revenue variance may only mean the budget was set too low. Each variance needs investigating before it is praised."
    level: HL

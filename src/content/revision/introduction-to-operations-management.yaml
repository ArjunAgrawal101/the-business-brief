# Quick revision for 5.1 Introduction to operations management. The guide sets
# its one statement at AO2, so the exercises use command terms up to explain.
# Written for the platform; every business named is fictional.
code: '5.1'
exercises:
  - id: quernstone-role
    business: Quernstone Bakery
    stem: "Quernstone Bakery turns flour, butter and fruit into bread and cakes, which it sells in its own café and to local shops."
    command: explain
    question: "**Explain** the role of operations management at Quernstone Bakery."
    outline:
      - "Operations management plans and controls the **transformation process**: inputs such as ingredients, staff and ovens turned into bread and cakes."
      - "It aims to do so efficiently, at low cost and waste, and effectively, with the products, quality and timing customers want."
      - "It works with the other functions: marketing on what to make, finance on costs and investment, human resources on staff and skills."
      - "Applies each point to the bakery, such as baking enough for the shops' morning deliveries."
  - id: quernstone-efficiency
    business: Quernstone Bakery
    stem: "Quernstone Bakery cut its costs and waste by baking in larger batches, but its bread is now often a day old when it reaches the café."
    command: distinguish
    question: "**Distinguish** between efficiency and effectiveness, using Quernstone Bakery."
    outline:
      - "**Efficiency** is producing an output with as few resources as possible: larger batches lowered the cost of each loaf."
      - "**Effectiveness** is producing the right output, one that meets customers' needs: fresh bread for the café."
      - "Shows the trade-off in the case: Quernstone Bakery became more efficient and less effective, and operations must aim for both."
  - id: quernstone-sustainable
    business: Quernstone Bakery
    stem: "Customers have asked Quernstone Bakery to cut its food waste and its use of plastic packaging."
    command: explain
    question: "**Explain** two ways Quernstone Bakery's operations could become more sustainable."
    outline:
      - "Cut waste by baking to forecasts and orders, and selling or donating unsold bread at the end of the day."
      - "Switch to reusable or compostable packaging, or let regular customers bring their own bags."
      - "Others: energy-efficient ovens, or local suppliers to cut transport."
      - "Explains each change's cost and benefit, including whether customers will value it."
formulas:
  unit-cost-average-cost:
    situation: "A bakery knows its total costs for the week and how many loaves it baked, and wants the cost of each loaf."
  on-time-delivery-rate:
    situation: "A furniture maker wants to know how dependable its deliveries were last month, from how many orders arrived on the day it promised."
    measures: "The share of deliveries that arrived when promised: a measure of how dependable an operation is for its customers."
  waste-rate:
    situation: "A bakery wants to compare how much of what it baked had to be thrown away this month with last month."
    measures: "The share of output that was wasted: a measure of efficiency, and of part of the operation's environmental cost."
distinctions:
  - id: efficiency-vs-effectiveness
    pair: [Efficiency, Effectiveness]
    difference: "Efficiency is producing an output with as few resources, and as little waste, as possible. Effectiveness is producing the right output: goods or services that meet customers' needs. An operation can be very efficient at making something customers do not want."
scenarios:
  - id: knotwright-circular
    business: Knotwright Furniture
    stem: "Knotwright Furniture now offers to repair its tables for life, and buys back old ones to refurbish and sell again."
    answer: "A circular business model"
    codes: ['5.1', 'toolkit']
    why: "Repair is a product life extension model and buying back to refurbish is resource recovery: both keep products and materials in use for longer, cutting waste. It can build loyalty and new revenue, but needs repair skills and a way to collect old tables."
evaluations:
  - id: efficiency-main-aim
    claim: "Efficiency is the main aim of operations management."
    counter: "Efficiency matters, but so do effectiveness, quality, flexibility and sustainability. An operation cut to the bone can fail customers, lower quality and leave no spare capacity for a sudden rise in demand or a broken machine."

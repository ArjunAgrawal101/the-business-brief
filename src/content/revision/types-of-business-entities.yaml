# Quick revision for 1.2 Types of business entities (statements at AO2 and AO3).
# Written for the platform; every business and place named is fictional.
code: '1.2'
exercises:
  - id: quennell-incorporate
    business: Quennell Joinery
    stem: "Jess Quennell runs Quennell Joinery as a sole trader, fitting kitchens. Orders have doubled and she needs $250,000 for a workshop. Her brother-in-law offers to invest in return for a share of the business."
    command: discuss
    question: "**Discuss** whether Jess should turn Quennell Joinery into a privately held company."
    outline:
      - "For: **limited liability** would protect Jess's home if the business failed, and selling shares to family is a way to raise the $250,000 without a large loan."
      - "Against: Jess would share ownership, profit and some control, and the company would face more formal rules, reporting and costs."
      - "Considers the alternatives, such as a partnership or a bank loan, and what each means for risk and control."
      - "Reaches a judgement for Jess, for example that incorporation makes sense if the investment is large relative to her own wealth and she trusts the new shareholder."
  - id: velandian-rail-sale
    business: Velandian Rail
    stem: "Velandian Rail, a state-owned railway, is to be sold by the government through a share issue on the stock exchange."
    command: explain
    question: "**Explain** two differences for Velandian Rail between being in the public sector and being a publicly held company."
    outline:
      - "Ownership and control pass from the government to private shareholders, who elect a board to run the company."
      - "Objectives shift from public service, such as keeping little-used lines open, towards profit and shareholder value."
      - "Finance comes from share capital, loans and retained profit rather than from the government."
      - "Makes clear that a publicly held company is in the **private** sector: “public” means that anyone can buy its shares."
  - id: ombara-cooperative
    business: Ombara Valley Growers
    stem: "Ten coffee farmers in a remote valley each sell their beans to the only buyer in the area, at low prices. They are deciding whether to form Ombara Valley Growers, a cooperative that would dry, sort and sell their coffee together."
    command: explain
    question: "**Explain** two benefits for the farmers of forming Ombara Valley Growers as a cooperative."
    outline:
      - "Bargaining power: selling together lets the farmers reach other buyers and get better prices than one buyer offers each of them alone."
      - "Shared costs: a joint drying and sorting plant spreads the cost of equipment and transport, an economy of scale none could reach alone."
      - "Ownership and control stay with the members, one member one vote, and any surplus is shared among them."
      - "Applies each benefit to the valley's farmers rather than listing the features of cooperatives in general."
mistakes:
  - mistake: "Saying that a publicly held company is owned by the government."
    fix: "A publicly held company is in the private sector; “publicly held” means its shares are traded on a stock exchange. Organizations owned by the government are in the public sector."
  - mistake: "Recommending a legal form without weighing what the owners in the case would gain and give up."
    fix: "Set limited liability and access to finance against loss of control, shared profit, cost and disclosure, then judge for these owners and their objectives."
distinctions:
  - id: public-sector-vs-publicly-held-company
    pair: [Public sector, Publicly held company]
    difference: "The public sector is the part of the economy owned and run by the government, such as state schools and state-owned enterprises. A publicly held company is in the private sector: it is owned by shareholders, and its shares can be bought and sold by the public on a stock exchange."
    example: "A railway run by a government ministry is in the public sector; once its shares are sold on the stock exchange, it is a publicly held company in the private sector."
  - id: limited-vs-unlimited-liability
    pair: [Limited liability, Unlimited liability]
    difference: "With unlimited liability, as for a sole trader or an ordinary partnership, the owners' personal possessions can be taken to pay the business's debts. With limited liability, shareholders can lose only the money they put into the company."
  - id: privately-vs-publicly-held-company
    pair: [Privately held company, Publicly held company]
    difference: "A privately held company's shares cannot be offered to the general public and are often held by a family or a few investors, so control stays close. A publicly held company sells shares on a stock exchange, raising more capital at the price of more disclosure, more shareholders and the risk of a takeover."
scenarios:
  - id: wyndhollow-care-cooperative
    business: Wyndhollow Care
    stem: "Twelve care workers plan to set up Wyndhollow Care, a home-care service in which every worker is an owner with an equal vote, and any surplus is shared among them or put back into the service."
    answer: "A cooperative"
    why: "A cooperative is owned and run by its members, who each have one vote and share the surplus. It suits workers who want control over their work and its rewards, though decisions can be slower and raising large sums is harder than for a company."
evaluations:
  - id: company-beats-sole-trader
    claim: "A company is always better than a sole trader, because it can raise more money."
    counter: "More capital comes with shared control and profit, more rules and disclosure, and, for a publicly held company, the risk of a takeover. A sole trader keeps control, privacy and all the profit, which suits a small business whose owner values independence and needs little capital."

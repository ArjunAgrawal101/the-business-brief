# Quick revision for 2.4 Motivation and demotivation (the theories of Taylor,
# Maslow and Herzberg at AO3, rewards and training at AO2; the further theories,
# labour turnover, appraisal and recruitment are HL). Command terms follow the
# statement each exercise is set on. Written for the platform; every business
# named is fictional.
code: '2.4'
exercises:
  - id: quaymill-herzberg
    business: Quaymill Couriers
    stem: "Quaymill Couriers raised its drivers' pay by 8% after many complaints. Six months later the complaints have stopped, but absence and delivery errors are unchanged."
    command: explain
    question: "**Explain**, using Herzberg's theory, why the pay rise did not improve the drivers' performance."
    outline:
      - "Identifies pay as a **hygiene factor**: improving it removed dissatisfaction, which is why the complaints stopped."
      - "Explains that hygiene factors do not motivate; **motivators** such as recognition, responsibility, achievement and the work itself do."
      - "Applies this to routine driving, which offers few motivators, and suggests one, such as recognition for accuracy or more responsibility for a route."
      - "May note a limitation: some drivers may still respond to money, especially if pay was low."
  - id: quaymill-piece-rate
    business: Quaymill Couriers
    stem: "Quaymill Couriers is considering paying its drivers a piece rate for each parcel delivered instead of an hourly wage."
    command: analyse
    question: "**Analyse** the advantages and disadvantages of paying Quaymill's drivers a piece rate."
    outline:
      - "Advantages: pay is linked to output, so drivers have a reason to work quickly, and the cost per parcel is controlled."
      - "Disadvantages: speed may come before care and safety, with more damaged parcels and accidents; pay becomes uncertain, which may raise labour turnover."
      - "Links the idea to Taylor's scientific management and its view that money motivates."
      - "Notes what would make it work, such as checks on quality and a guaranteed minimum."
  - id: quaymill-labour-turnover
    business: Quaymill Couriers
    stem: "Quaymill Couriers employed 150 drivers at the start of the year and 130 at the end. During the year 42 drivers left."
    command: calculate
    question: "**Calculate** the labour turnover for Quaymill's drivers, and comment on what it suggests."
    level: HL
    outline:
      - "Average number of drivers = (150 + 130) ÷ 2 = 140."
      - "Labour turnover = (42 ÷ 140) × 100 = **30%**."
      - "Comments that almost a third of drivers leave each year, which brings recruitment and training costs, lost experience and weaker service."
      - "Notes that the figure needs comparing with earlier years and other courier firms before it is judged high, and may point to problems with pay or conditions."
formulas:
  labour-turnover:
    situation: "An HR manager wants to know what share of the workforce leaves in a year, to compare it with earlier years and with rivals."
  expectancy-theory:
    situation: "A manager cannot see why a generous bonus has not raised effort. Staff value the money, but doubt they can reach the target and doubt the bonus would be paid if they did."
distinctions:
  - id: motivators-vs-hygiene-factors
    pair: [Motivators, Hygiene factors]
    difference: "In Herzberg's theory, hygiene factors, such as pay, conditions and job security, cause dissatisfaction when they are poor, but improving them does not motivate. Motivators, such as achievement, recognition, responsibility and the work itself, are what lead to motivation."
  - id: job-enrichment-vs-job-enlargement
    pair: [Job enrichment, Job enlargement]
    difference: "Job enrichment adds responsibility and more challenging tasks, giving the employee more control over their work. Job enlargement adds more tasks at the same level, so the job is broader but not more demanding."
  - id: commission-vs-profit-related-pay
    pair: [Commission, Profit-related pay]
    difference: "Commission is a percentage of the value of the sales an individual makes. Profit-related pay is a share of the whole organization's profit, paid to employees whatever their own sales."
  - id: on-the-job-vs-off-the-job-training
    pair: [On-the-job training, Off-the-job training]
    difference: "On-the-job training happens while doing the job in the normal workplace, for example beside an experienced colleague. Off-the-job training happens away from the work itself, such as on a course or at a college."
  - id: formative-vs-summative-appraisal
    pair: [Formative appraisal, Summative appraisal]
    level: HL
    difference: "Formative appraisal is continuous feedback during a period, to help the employee improve as they go. Summative appraisal judges performance at the end of a period, often against targets, and may be linked to pay or promotion."
  - id: internal-vs-external-recruitment
    pair: [Internal recruitment, External recruitment]
    level: HL
    difference: "Internal recruitment fills a vacancy with someone already in the organization, which is quicker and cheaper and can motivate others. External recruitment brings someone in from outside, which widens the choice and brings new ideas, at more cost and risk."
scenarios:
  - id: callerton-expectancy
    business: Callerton Contact
    stem: "Staff at Callerton Contact, a call centre, say their new sales targets are out of reach, that bonuses are rarely paid even when targets are met, and that the bonus is too small to matter."
    answer: "Expectancy theory"
    level: HL
    why: "Motivation depends on expectancy (effort will reach the target), instrumentality (the target will bring the reward) and valence (the reward is worth having), multiplied together. All three are low here, so the scheme motivates almost no one."
  - id: thornmere-equity
    business: Thornmere Clinic
    stem: "An experienced nurse at Thornmere Clinic learns that a newly hired colleague doing the same work is paid more."
    answer: "Equity theory"
    level: HL
    why: "Employees compare the ratio of what they get (pay, recognition) to what they give (effort, experience) with that of others. The nurse sees the ratios as unequal, and may reduce effort, ask for more pay or leave."
evaluations:
  - id: money-motivates-everyone
    claim: "Money is the main motivator for every employee."
    counter: "Taylor assumed so, but Herzberg treats pay as a hygiene factor, Maslow places most motivation in higher needs, and self-determination theory stresses autonomy, competence and relatedness. Money matters most when pay is low or basic needs are not met, and people differ."
  - id: maslow-fixed-order
    claim: "Maslow shows that recognition is wasted until every lower need is fully met."
    counter: "Maslow saw needs as overlapping and partly met at once, and research gives little support to a fixed order, which also varies between people and cultures. Recognition can matter even where security is incomplete, though a job that fails basic needs is unlikely to be fixed by praise alone."

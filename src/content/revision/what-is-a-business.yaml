# Quick revision for 1.1 What is a business? The guide sets its statements at
# AO1 and AO2, so the exercises use command terms up to explain. Written for
# the platform; every business named is fictional.
code: '1.1'
exercises:
  - id: tollmere-sectors
    business: Tollmere Wool
    stem: "Tollmere Wool, a family farm, has sold raw wool from its sheep to a spinning mill for forty years. The owners now plan to spin and dye the wool themselves and sell the yarn online, with free knitting patterns."
    command: explain
    question: "**Explain** how the plan would move Tollmere Wool into other sectors of the economy."
    outline:
      - "Places the present business in the **primary sector**, because raising sheep for wool works with a natural resource."
      - "Shows that spinning and dyeing would add **secondary sector** activity, turning a raw material into a finished good."
      - "Shows that selling the yarn online, with patterns as a service, adds **tertiary sector** activity."
      - "Links the move to **added value**: each stage lets Tollmere charge more than the price of raw wool, but needs new skills, equipment and capital."
  - id: spokewright-added-value
    business: Spokewright Bikes
    stem: "Spokewright Bikes builds bicycles to order. For each bike it buys a frame, wheels and parts for $420 and sells the finished bike for $1,050. Its mechanics are paid about $180 for the work on each bike, and the workshop also pays rent and other overheads."
    command: explain
    question: "**Explain** why the value Spokewright Bikes adds to each bike is not the same as the profit it makes on it."
    outline:
      - "Works out the **added value** of a bike: $1,050 − $420 = $630, the selling price less the bought-in parts."
      - "Explains that the added value still has to pay the mechanics, the rent and the other overheads."
      - "Concludes that the **profit** on a bike is what is left after all of those costs, so it is less than $630."
      - "Notes that added value rises if customers will pay more for Spokewright's work or if the bought-in parts cost less."
  - id: linwick-challenges
    business: Linwick Laundry
    stem: "Ama Osei plans to open Linwick Laundry, a laundry and ironing service with collection and delivery for busy professionals in her city. She will use $15,000 of her savings and a bank loan to lease a small unit and buy machines."
    command: explain
    question: "**Explain** two challenges Ama is likely to face in the first year of Linwick Laundry."
    outline:
      - "Chooses two distinct challenges, such as finance and cash flow, winning regular customers, finding reliable staff, or competing with established laundries."
      - "Applies each to the case, for example loan repayments and the lease falling due before enough regular customers have signed up."
      - "Explains the consequence of each, such as running short of cash or machines standing idle."
      - "Avoids a list of general start-up problems with no link to a laundry service."
mistakes:
  - mistake: "Classifying a business by what it sells rather than by what it does."
    fix: "Name the activity: a supermarket sells food but is in the tertiary sector, because it retails; a farm that makes cheese from its own milk works in the primary and secondary sectors."
  - mistake: "Calling added value profit."
    fix: "Added value still has to pay wages, rent and the other costs of the business; profit is what is left after them."
formulas:
  added-value:
    situation: "A furniture maker buys timber and fittings for $300 and sells the finished table for $800. It wants to know how much its own work adds to what it bought in."
distinctions:
  - id: added-value-vs-profit
    pair: [Added value, Profit]
    codes: ['1.1', '3.3']
    difference: "Added value is the selling price less the cost of the materials and services bought in to make the product. Profit is revenue less **all** costs, including wages, rent and other overheads, so it is smaller."
    example: "A bike that sells for $1,050 from $420 of parts adds $630 of value; the profit on it is what is left once the mechanics, the rent and everything else are paid."
  - id: tertiary-vs-quaternary-sector
    pair: [Tertiary sector, Quaternary sector]
    difference: "The tertiary sector provides services, such as retail, transport, banking and hospitality. The quaternary sector is the part of services built on knowledge and information: research, software, data and expert advice."
    example: "A delivery firm is tertiary; the business that writes its route-planning software is quaternary."
  - id: entrepreneurship-vs-intrapreneurship
    pair: [Entrepreneurship, Intrapreneurship]
    difference: "Entrepreneurship is starting and running a new venture, with the founder bearing the risk. Intrapreneurship is acting like an entrepreneur inside an existing organization, developing a new idea with its money and people, so the organization bears most of the risk."
    example: "An employee who builds a new product line for their employer is an intrapreneur; if they leave to launch it themselves, they become an entrepreneur."
scenarios:
  - id: oatmoor-business-plan
    business: Oatmoor Bakery
    stem: "Riya wants a bank loan to open Oatmoor Bakery, a small bakery. The bank asks who her customers will be, what she will charge, how much she needs and when the loan will be repaid."
    answer: "A business plan"
    why: "A business plan sets out the idea, the market, the marketing, the operations and the finances, including a cash flow forecast, so the bank can judge the risk of lending. Writing it also tests Riya's own assumptions before she commits her savings."
    codes: ['1.1', 'toolkit']
evaluations:
  - id: purpose-is-profit
    claim: "Every business exists to make a profit."
    counter: "Many do, but social enterprises, cooperatives and NGOs exist for a social purpose and use any surplus for it, and public sector organizations provide services. Even for-profit businesses often put survival, growth or ethical aims first for a time, so profit is better seen as one objective among several."

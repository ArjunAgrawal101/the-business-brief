# Quick revision for 1.4 Stakeholders. The guide sets both statements at AO2,
# so the exercises use command terms up to analyse. Written for the platform;
# every business named is fictional.
code: '1.4'
exercises:
  - id: brackenholt-quarry-conflict
    business: Brackenholt Stone
    stem: "Brackenholt Stone wants to extend its quarry by 40 hectares. The extension would create 25 jobs, but it would send more lorries through a nearby village and remove woodland that local people walk in."
    command: analyse
    question: "**Analyse** the conflict between two of Brackenholt Stone's stakeholder groups over the extension."
    outline:
      - "Chooses two groups whose objectives clash, such as shareholders and employees, who gain profit and jobs, against villagers and walkers, who lose quiet, safety and woodland."
      - "Uses the case's evidence for what each group wants and why."
      - "Analyses each group's power and interest: the council's planning decision gives it great power, and villagers can gain power by organizing and campaigning."
      - "Notes where interests overlap, such as villagers who would welcome the new jobs."
  - id: brackenholt-reduce-opposition
    business: Brackenholt Stone
    stem: "Brackenholt Stone's managers expect strong opposition from the village to the quarry extension."
    command: suggest
    question: "**Suggest** two ways Brackenholt Stone could reduce the villagers' opposition."
    outline:
      - "Consult early and openly, so villagers' concerns shape the plan rather than meeting a decision already made."
      - "Limit the harm, for example by restricting lorry hours or routing lorries away from the village."
      - "Offer something back, such as a community fund or a promise to restore the land as a nature reserve after quarrying."
      - "Explains why each would lower opposition, and what it would cost the business."
  - id: tallowmere-internal-external
    business: Tallowmere Dairy
    stem: "Tallowmere Dairy, a dairy owned by its farmer members, plans to replace deliveries by its own drivers with an outside courier firm."
    command: distinguish
    question: "**Distinguish** between internal and external stakeholders, using examples from Tallowmere Dairy."
    outline:
      - "Defines internal stakeholders as those within the organization, such as Tallowmere's drivers and its farmer members, who own it."
      - "Defines external stakeholders as those outside it but affected by it, such as the courier firm, the shops it supplies and the drivers' families."
      - "Shows why the difference matters here: the drivers lose their jobs from inside, while the courier gains a contract from outside."
distinctions:
  - id: stakeholder-vs-shareholder
    pair: [Stakeholder, Shareholder]
    difference: "A stakeholder is anyone affected by a business or able to affect it: employees, customers, suppliers, the community, government and more. A shareholder owns part of a company through its shares, so is only one stakeholder group."
    example: "A quarry's neighbours are stakeholders in its expansion; only the people who own its shares are shareholders."
  - id: internal-vs-external-stakeholders
    pair: [Internal stakeholders, External stakeholders]
    difference: "Internal stakeholders are part of the organization: its employees, managers and owners. External stakeholders are outside it but affected by its decisions or able to influence them, such as customers, suppliers, lenders, the local community, pressure groups and government."
scenarios:
  - id: tallowmere-mapping
    business: Tallowmere Dairy
    stem: "Tallowmere Dairy plans a new processing plant beside a village and has limited time to consult. Its managers want to know which groups to involve closely and which simply to keep informed."
    answer: "Stakeholder mapping"
    why: "Mapping places each group by its power over the decision and its interest in it. Groups high on both, such as the council that grants permission, are managed closely; residents with high interest but little power are kept informed. The guide does not name the tool, so treat it as a way to structure the analysis."
evaluations:
  - id: ignore-weak-stakeholders
    claim: "A business can safely ignore stakeholders who have little power."
    counter: "Weak groups can gain power quickly by joining together, winning media attention or persuading the government to act. Power is also not the same as a fair claim: a group with little power may still be badly harmed, which is an ethical question a map of power cannot settle."

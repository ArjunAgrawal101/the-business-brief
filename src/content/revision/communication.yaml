# Quick revision for 2.6 Communication (statements at AO3 and AO2). Written for
# the platform; every business named is fictional.
code: '2.6'
exercises:
  - id: pennick-closure-news
    business: Pennick Foods
    stem: "Pennick Foods must tell its 400 factory workers that a production line will close in three months, with 35 jobs at risk."
    command: recommend
    question: "**Recommend** how Pennick Foods should communicate the news to its workers."
    outline:
      - "Formal and face to face first: meetings for each shift led by senior managers, so everyone hears the same message at the same time and can ask questions."
      - "Followed by a written confirmation with the facts, the timetable and the support available."
      - "Consult employee representatives or the union before the announcement, and keep people informed afterwards."
      - "Justifies the choice against alternatives such as an email to all, which would be quick but impersonal and invite rumour."
  - id: pennick-barriers
    business: Pennick Foods
    stem: "Pennick Foods' managers send long weekly emails full of technical terms. Many factory workers rarely sit at a screen, and several speak a different first language."
    command: explain
    question: "**Explain** two barriers to communication at Pennick Foods."
    outline:
      - "**Jargon** and **information overload**: long emails full of technical terms are skimmed or misunderstood."
      - "The wrong channel: email does not reach workers who rarely sit at a screen."
      - "Language differences: workers with another first language may miss or misread the message."
      - "Explains the effect of each, such as mistakes, rumours or low morale, and how it could be reduced."
  - id: pennick-grapevine
    business: Pennick Foods
    stem: "News at Pennick Foods often reaches the factory floor through conversations in the canteen before managers announce it."
    command: analyse
    question: "**Analyse** the advantages and disadvantages for Pennick Foods of informal communication among its workers."
    outline:
      - "Advantages: it is fast, builds relationships and trust, and shows managers what staff really think."
      - "Disadvantages: rumours spread, messages are distorted, and some staff are left out."
      - "Analyses how managers can use the grapevine, by listening to it, while correcting rumours quickly through formal channels."
formulas:
  percentage-change:
    situation: "A manager surveyed staff before and after changing how team briefings are run, and wants to show how far the share of staff who feel well informed has moved."
    measures: "How much a figure has risen or fallen, as a percentage of its starting value. When the figures are themselves percentages, the change in percentage points says something different, and both should be given."
distinctions:
  - id: formal-vs-informal-communication
    pair: [Formal communication, Informal communication]
    difference: "Formal communication follows the organization's official channels and procedures, such as meetings, reports and official emails. Informal communication happens outside them, through conversations and the grapevine."
  - id: vertical-vs-horizontal-communication
    pair: [Vertical communication, Horizontal communication]
    difference: "Vertical communication passes up and down the hierarchy, between managers and the people who report to them. Horizontal communication passes between people or departments at the same level, such as design and production."
scenarios:
  - id: linhurst-parts-barrier
    business: Linhurst Furniture
    stem: "Linhurst Furniture's designers change the size of a part, but the factory learns of it only when the new parts arrive and do not fit."
    answer: "A barrier to communication: no horizontal channel between departments"
    why: "Design and production at the same level have no regular way to share changes, and nobody checked that the message was received. A short joint meeting before each change, with feedback, would close the gap."
evaluations:
  - id: email-most-efficient
    claim: "Email is the most efficient way to communicate with all staff."
    counter: "It is quick, cheap and leaves a record, but it is a poor channel for bad news, it misses staff who rarely use a screen, adds to overload and gives no immediate feedback. The best method depends on the message, the audience and the urgency."

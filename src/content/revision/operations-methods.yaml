# Quick revision for 5.2 Operations methods. The guide sets its one statement
# at AO3. Written for the platform; every business named is fictional.
code: '5.2'
exercises:
  - id: corbelle-mass-production
    business: Corbelle Toys
    stem: "Corbelle Toys makes wooden toys in batches of 200 of each design. A large retailer now wants 50,000 of one design a year for the next three years."
    command: discuss
    question: "**Discuss** whether Corbelle Toys should switch to mass production for that design."
    outline:
      - "For: specialized machinery and a production line would cut the unit cost at 50,000 a year and meet the retailer's volume."
      - "Against: a large investment, a line that cannot easily switch to other designs, dependence on one customer, and repetitive work that may demotivate staff."
      - "Considers keeping batch production with larger batches, or a separate line for this design only."
      - "Judges the decision, for example to invest only if the three-year contract is secure enough to cover the cost of the line."
  - id: corbelle-job-production
    business: Corbelle Toys
    stem: "Corbelle Toys also builds one-off doll's houses to each customer's own design."
    command: explain
    question: "**Explain** two features of job production at Corbelle Toys."
    outline:
      - "Each doll's house is a single product made to the customer's specification."
      - "It needs skilled, flexible labour and general-purpose tools, so it is labour-intensive."
      - "Unit costs and prices are high, and each order takes time; the varied work can motivate the makers."
  - id: corbelle-mass-customization
    business: Corbelle Toys
    stem: "Corbelle Toys is considering a website on which customers choose the colours of a toy and add a child's name, made on its existing production line."
    command: explain
    question: "**Explain** how mass customization could benefit Corbelle Toys."
    outline:
      - "**Mass customization** combines the low unit costs of large-scale production with products personalized for each customer."
      - "Personalized toys can sell at a higher price and stand out from mass-produced rivals."
      - "The website gives Corbelle Toys data on what customers choose."
      - "Notes what it needs: flexible machinery and systems, and a way to handle orders that cannot be returned and resold."
formulas:
  average-unit-cost:
    situation: "A toy maker knows its fixed costs for the month, how many toys it made and the variable cost of each, and wants the average cost of a toy."
  crossover-volume:
    situation: "A food maker producing curry by hand is considering a production line with higher fixed costs but a lower cost per pot, and wants to know the output at which the line becomes the cheaper method."
    measures: "The output at which two production methods cost the same in total: below it the method with the lower fixed costs is cheaper, above it the method with the lower variable cost per unit. A standard technique, not one the guide names."
distinctions:
  - id: job-vs-batch-production
    pair: [Job production, Batch production]
    difference: "Job production makes a single product, or a small number, to a customer's own specification, usually with skilled labour. Batch production makes a group of identical products, then switches the equipment to another group, which allows some variety at lower unit cost."
  - id: mass-production-vs-mass-customization
    pair: [Mass production, Mass customization]
    difference: "Mass production makes large volumes of a standardized product continuously, at the lowest unit cost. Mass customization uses the same scale and technology to let each customer personalize a standard product, such as choosing colours or adding a name."
scenarios:
  - id: hearthloaf-batch
    business: Hearthloaf Bakery
    stem: "Hearthloaf Bakery bakes 300 white loaves, cleans and resets its ovens, then bakes 200 rye loaves, then 150 sourdough."
    answer: "Batch production"
    why: "Each group of identical loaves is a batch, made before the equipment is switched to the next product. It allows variety at a lower unit cost than baking loaf by loaf, at the price of time lost changing between batches and stock waiting between stages."
evaluations:
  - id: mass-always-cheapest
    claim: "Mass production is always the cheapest way to make a product."
    counter: "It gives the lowest unit cost only at high and steady volumes, because its fixed costs in machinery are large. At low volumes, or when demand changes often, the unit cost can be higher than batch production, and the line is hard to adapt."

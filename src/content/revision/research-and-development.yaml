# Quick revision for 5.8 Research and development, an HL subtopic (statements
# at AO3 and AO2). Written for the platform; every business named is fictional.
code: '5.8'
exercises:
  - id: sorrelfield-importance
    business: Sorrelfield Hearing
    stem: "Sorrelfield Hearing makes hearing aids. Its two larger rivals launch improved models every year, and Sorrelfield Hearing spends 2% of its revenue on research and development, against their 8%."
    command: discuss
    question: "**Discuss** the importance of research and development for Sorrelfield Hearing."
    level: HL
    outline:
      - "R&D matters most in fast-changing, technology-driven markets with short product life cycles, as here, so Sorrelfield Hearing risks falling behind."
      - "Benefits: new and better products, patents, premium prices and more efficient processes."
      - "Costs and risks: R&D is expensive and uncertain, and returns may take years; how well the money is spent matters as much as how much."
      - "Considers options such as focusing on one niche or working with a partner, and reaches a judgement."
  - id: sorrelfield-ip
    business: Sorrelfield Hearing
    stem: "Sorrelfield Hearing has developed a new chip that filters out background noise, and sells its hearing aids under the name ClearHear."
    command: distinguish
    question: "**Distinguish** between a patent and a trademark, using Sorrelfield Hearing."
    level: HL
    outline:
      - "A **patent** protects an invention, such as the new chip, for a limited period, in return for publishing how it works."
      - "A **trademark** protects a brand name or logo, such as ClearHear, and can be renewed indefinitely."
      - "Notes that copyright protects original works, such as Sorrelfield Hearing's software code and manuals."
  - id: sorrelfield-disruption
    business: Sorrelfield Hearing
    stem: "A start-up begins selling basic hearing aids online at a fifth of Sorrelfield Hearing's prices, aimed at people with mild hearing loss who have never bought one."
    command: explain
    question: "**Explain** why the start-up could be a disruptive innovation for Sorrelfield Hearing."
    level: HL
    outline:
      - "**Disruptive innovation** starts with a simpler, cheaper product for customers the leaders overlook, here people with mild hearing loss."
      - "Established firms often ignore it, because those customers are less profitable."
      - "As the product improves, it can win mainstream customers and displace the leaders."
      - "Contrasts it with **incremental innovation**, the yearly improvements Sorrelfield Hearing and its rivals make."
formulas:
  r-and-d-intensity:
    situation: "An analyst wants to compare how heavily two businesses of different sizes invest in research and development."
    measures: "How heavily a business invests in research and development, as a share of its revenue. A standard measure that the guide does not require."
mistakes:
  - mistake: "Assuming that more spending on R&D guarantees successful innovation."
    fix: "Judge how well it is spent: the link to customers' needs, the ability to bring ideas to market, and protection for what is created."
    level: HL
  - mistake: "Mixing up patents, copyright and trademarks."
    fix: "Patents protect inventions, copyright protects original works such as software and text, and trademarks protect brand names and logos."
    level: HL
  - mistake: "Calling every new product a disruptive innovation."
    fix: "Most innovation is incremental: better versions of existing products. Disruptive innovation starts with a simpler, cheaper offer for overlooked customers and later takes over the mainstream."
    level: HL
distinctions:
  - id: incremental-vs-disruptive-innovation
    pair: [Incremental innovation, Disruptive innovation]
    level: HL
    difference: "Incremental innovation makes small improvements to existing products or processes, usually by established firms for their current customers. Disruptive innovation creates a new market or transforms an existing one, often starting with a simpler or cheaper offer that established firms overlook, and in time displaces them."
  - id: patent-vs-copyright
    pair: [Patent, Copyright]
    codes: ['5.8', '3.4']
    level: HL
    difference: "A patent protects an invention, such as a new device or process, for a limited period, and must be applied for. Copyright protects original creative work, such as writing, music or software, from the moment it is made, without registration."
scenarios:
  - id: carrowby-latent-need
    business: Carrowby Luggage
    stem: "Carrowby Luggage watches travellers searching for sockets in airports and designs a suitcase with a built-in battery for charging phones, something no customer had asked for."
    answer: "Meeting a latent need through research and development"
    level: HL
    why: "A latent need is one customers have but cannot put into words until a product meets it. Observation-led R&D can find such needs before rivals, though the first mover carries the cost of teaching customers about the product."
evaluations:
  - id: more-rnd-more-success
    claim: "The more a business spends on research and development, the more successful its products will be."
    counter: "Spending helps only if it is well directed, linked to customers' needs and turned into products the business can make and sell. Returns are uncertain and slow, and in a stable market heavy R&D may earn little."
    level: HL

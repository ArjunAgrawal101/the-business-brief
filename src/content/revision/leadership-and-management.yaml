# Quick revision for 2.3 Leadership and management (SL statements at AO2 and
# AO3; scientific and intuitive thinking is HL, at AO2). Written for the
# platform; every business named is fictional.
code: '2.3'
exercises:
  - id: kilnworth-style
    business: Kilnworth Bakery
    stem: "The new manager of Kilnworth Bakery's night shift finds an experienced, skilled team that dislikes being told how to work. Output and quality are already high."
    command: recommend
    question: "**Recommend** a leadership style for the new night-shift manager at Kilnworth Bakery."
    outline:
      - "Reads the situation: an experienced, motivated team doing work it knows well."
      - "Recommends a democratic or laissez-faire style, with clear targets for output and quality, because the team can be trusted with decisions."
      - "Explains why an autocratic style would probably demotivate the team and add little."
      - "Uses **situational leadership** to say when the style should change, for example a firmer approach on safety or if quality slips."
  - id: kilnworth-manage-lead
    business: Kilnworth Bakery
    stem: "Kilnworth Bakery's night-shift manager plans rotas, orders flour, checks output against targets, and must also persuade the team to accept a new recipe system."
    command: distinguish
    question: "**Distinguish** between management and leadership, using the night-shift manager's role at Kilnworth Bakery."
    outline:
      - "**Management**: planning, organizing, directing, coordinating and controlling, such as rotas, orders and checking output."
      - "**Leadership**: setting a direction and winning people's commitment to it, such as bringing the team behind the new recipe system."
      - "Shows that the manager needs both, and that leadership matters most when things must change."
  - id: kilnworth-intuitive
    business: Kilnworth Bakery
    stem: "Kilnworth Bakery's owner must decide by tonight whether to accept a large rush order from a new customer. She has little data, but twenty years' experience of what her bakery can do."
    command: explain
    question: "**Explain** why she might use intuitive rather than scientific decision-making."
    level: HL
    outline:
      - "Defines **scientific** decision-making as gathering and analysing data before deciding, and **intuitive** as relying on experience and judgement."
      - "The decision is urgent, data are scarce and the situation is familiar to an experienced decision-maker, which favours intuition."
      - "Notes the risk of bias or overconfidence, and that a quick check of capacity and ingredients would combine the two."
hlRecall:
  - recall:2-3-when-is-intuitive-decision-making-most-useful
distinctions:
  - id: management-vs-leadership
    pair: [Management, Leadership]
    difference: "Management is getting work done through planning, organizing, directing, coordinating and controlling resources. Leadership is setting a direction and inspiring people to follow it, which matters most in change. They are different jobs, and most people in charge must do both."
  - id: autocratic-vs-paternalistic
    pair: [Autocratic leadership, Paternalistic leadership]
    difference: "Both leaders decide alone. The autocratic leader expects instructions to be followed and pays little attention to staff views. The paternalistic leader also decides alone, but in what they believe is the staff's interest, looking after their welfare like a parent."
  - id: democratic-vs-laissez-faire
    pair: [Democratic leadership, Laissez-faire leadership]
    difference: "A democratic leader involves staff in decisions but still leads and takes the final decision. A laissez-faire leader leaves most decisions to the team, which can work well with experts and badly with a team that needs direction."
  - id: scientific-vs-intuitive-decisions
    pair: [Scientific decision-making, Intuitive decision-making]
    level: HL
    difference: "Scientific decision-making gathers and analyses data, considers options and tests them before choosing. Intuitive decision-making relies on experience, judgement and gut feeling, which is quicker but more open to bias."
scenarios:
  - id: ellerbeck-evacuation
    business: Ellerbeck Hospital
    stem: "A fire alarm sounds at Ellerbeck Hospital, and the ward manager has seconds to move patients and staff to safety."
    answer: "Autocratic leadership, for now"
    why: "In an emergency, quick, clear instructions from one person save time and lives, so an autocratic style fits. Situational leadership says the same manager may lead democratically once the crisis is over."
evaluations:
  - id: democratic-always-best
    claim: "Democratic leadership is always the best style, because it motivates staff."
    counter: "It can motivate and bring in good ideas, but it is slow, does not suit a crisis or an inexperienced team, and some decisions cannot be shared. Situational leadership holds that the best style depends on the task and on the people being led."
